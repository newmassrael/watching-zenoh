# Cargo configuration for watching-zenoh.
#
# Intentionally empty of build settings: it sets no default target, registry, linker or
# flags, so a build of any workspace here is the one its own manifest and the command line
# describe. A configuration a build needs travels with that build: the pico C library's
# under `crates/.cargo/`, named on its command line; the link of libxml2's `bcrypt` in the one
# program that links libxml2 (`xtask/src/main.rs`).
