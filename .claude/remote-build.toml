# R311y752 — what this repository needs from a build machine, and nothing about
# WHICH machine. Addresses live in `~/.claude/remote-build/hosts.toml`, outside
# this tree, so a public repo never carries them (remote-build SKILL rule 11).

# Tracked files only. This repo's history has already paid for an accidental
# disclosure once, and `all` would send whatever is sitting untracked in the
# working tree to another host.
send = "tracked"

# Belt and braces: `crates/target` is a SYMLINK into ~/.buildcache (SKILL rule
# 1) and would arrive as a broken link. `git ls-files` already omits both, so
# these entries are here to survive a future switch to `send = "all"`.
exclude = ["/crates/target", "/target"]

needs = ["cargo", "python3", "git"]

# MEASURED on the 32-core / 125 GB build machine at R311y752, and the reason
# this list exists rather than a shrug: WITHOUT THESE, `run-ci.sh` does not fail
# -- it SKIPS, and a sweep that skips half its lanes reports the same green as
# one that ran them. Absent there: shellcheck, arm-none-eabi-gcc, qemu-arm,
# zenohd, and every non-x86 rustup target.
#
# The consequence, stated so no one has to rediscover it: that machine is
# STRONGER than a laptop for the x86 lanes (feature matrix, C1*, E*) and WEAKER
# for the cross-compile and interop ones. Layers G / Q / Z belong on a host that
# has the arm toolchain, or on hosted CI.
packages = [
    "shellcheck",
    "gcc-arm-none-eabi",
    "qemu-user",
]

min_ram_gb = 16
min_free_gb = 20

[commands]
# NOT `cargo test --workspace`: this tree refuses a whole-workspace build on
# purpose (`sce-rust-runtime` raises a `compile_error!`), so the workspace form
# fails for a reason that has nothing to do with the change under test.
# `run-ci.sh` is the repo's own full gate and the thing local pushes deliberately
# do not run.
verify = "bash scripts/run-ci.sh"
