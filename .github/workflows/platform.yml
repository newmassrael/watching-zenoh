#
# Platform -- the lean lane for the hosts wz cannot be run on from this
# repository's own machines.
#
# The `platform-macos` and `platform-windows` inventory atoms claim that wz RUNS
# on those hosts, and the only evidence for that is a hosted runner of the
# host's own kind. `ci.yml` carries it in its `portability` job, behind every
# other job's queue: a run in flight is never cancelled there (owner decision,
# 2026-10-01), so one question about a macOS test costs a full CI wait. This
# lane asks only that question.
#
# What it runs is exactly the leg `scripts/lib/platform_surface_matrix.py`
# declares for the host: the integration-test targets that exercise each link
# the pin serves there, built once under their union feature set and run one at
# a time on their own deadline. It is the SAME gate as the `portability` job's
# last step, not a second definition of the leg, so the two cannot disagree
# about what a host owes. `ci.yml` stays the proof lane; this one is where a
# red on a host is read, narrowed (`only`) and, when a target stalls, looked at
# (the gate samples the stalled process before it kills it).
#
# What a red here means, stated because gate 2c reads every workflow: the
# previous-run gate grades EVERY run on the tip commit, whichever workflow it
# belongs to. A red Platform run therefore refuses the next push until it is
# acknowledged in `docs/hosted-red-acks.md`, exactly as a red CI run does. That
# is the intended coupling: a host that does not run wz is a red, not a note.
#
# Triggers. A push to main that touches what the leg builds or the gate that
# declares it, and a manual dispatch for a narrowed or repeated run.

name: Platform

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform.yml"
      - "scripts/lib/platform_surface_matrix.py"
      - "scripts/lib/upstream_link_axis_gate.py"
      - "crates/wz-runtime-tokio/**"
      - "crates/wz-session-core/**"
      - "crates/wz-integration-tests/**"
      - "crates/wz-capi-core/**"
      - "crates/wz-capi-pico/**"
      - "crates/wz-capi-c/**"
      - "crates/zenoh-pico-sys/**"
      - "crates/wz-host-interop-tests/**"
      - "crates/Cargo.toml"
      - "crates/Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      host:
        description: "Which host to run"
        type: choice
        options: [both, macos, windows]
        default: both
      only:
        description: "Comma-separated test targets of the leg (a diagnosis; reported PARTIAL). Empty runs the whole leg."
        type: string
        default: ""

# Latest-only and never cancelling a run in flight, the policy `ci.yml` records
# (owner decision, 2026-10-01): a waiting run is replaced by the newest, a
# running one is left to finish and be read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  leg:
    name: leg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Each host is its own signal: a macOS stall must not hide the Windows result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            host: macos
          - os: windows-latest
            host: windows
    env:
      # Which hosts a dispatch asked for, decided WITHOUT a job of its own. This lane
      # used to open with a Linux `plan` job that picked the matrix; the first runs
      # showed why that was wrong: the Linux pool is the one the full CI saturates
      # (22 jobs a push), so the lane meant to answer in minutes waited behind it
      # for over ten, to choose between two hosts that never needed Linux. A push
      # selects both; a dispatch selects what `host` names. An unselected host's job
      # still takes a runner for the seconds it needs to skip its steps.
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          # This lane is read while it is red; a cache saved only on success
          # would make every diagnostic run pay the cold build again.
          cache-on-failure: true
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: Set up Python (the platform-surface matrix gate is python)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: platform surface matrix selftest, on this host
        # The gate's own verdicts, driven on the host the leg will run on: the
        # process-tree handling and the stall diagnostics are the parts whose
        # behaviour differs per host, and the Linux lanes cannot see them.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: python scripts/lib/platform_surface_matrix.py --selftest

      - name: platform surface matrix, the leg this host is owed
        # `RUNNER_OS` is lower-cased with `tr`: macOS ships bash 3.2, which has
        # no `${var,,}`. The dispatch input travels through the environment, not
        # through the script text.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 20
        shell: bash
        env:
          WZ_ONLY: ${{ inputs.only }}
        run: |
          host="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$WZ_ONLY" ]; then
            python scripts/lib/platform_surface_matrix.py --run "$host" --only "$WZ_ONLY"
          else
            python scripts/lib/platform_surface_matrix.py --run "$host"
          fi

      # ── Multicast: what the leg does NOT gate ───────────────────────────
      #
      # Upstream serves UDP multicast on every host (`zenoh-link-udp`). The host
      # facets of it are GATED now, in the leg above: `multicast_host_roundtrip`
      # is a plane of the matrix gate (`PLANES`), run with `--ignored`, and it
      # passes on both hosts (macOS over `lo0`, Windows over the default
      # interface). What stays here is an OBSERVATION of two things the leg cannot
      # gate:
      #
      #   * the OS itself, before any wz code: a send to the group unpinned, on
      #     127.0.0.1 and on the default-route address, beside the interface and
      #     route tables. This is where the macOS finding came from: the real
      #     interface is denied to a process the runner spawns, loopback is not.
      #   * wz's FULLER multicast suites (scouting, pub/sub). They run one test at a
      #     time, and on Windows the scouting suite is still intermittent (6/6, 4/6,
      #     5/6 on three runs, a different test each time, all of them the OS's choice
      #     among three multicast-capable interfaces). On macOS they fail outright,
      #     because they use the default interface. Neither says wz is wrong, and a
      #     gate that flakes teaches nobody anything, so they do not gate.
      #
      # Two things about reading it. A step with `continue-on-error` reports
      # `conclusion: success` whatever it did (its `outcome` is the truth, and the
      # jobs API does not carry it), so the verdict is printed as a line of its own
      # and written to the job summary. And it runs after a leg that failed
      # (`!cancelled()`).
      - name: multicast on this host, observed (the suites; the leg gates the host witness)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 12
        continue-on-error: true
        shell: bash
        run: |
          # What the OS itself does, before any wz code: the first macOS run failed
          # EVERY multicast send with EHOSTUNREACH, and a send to a group has three
          # candidate causes that read the same (no multicast route on the default
          # path, an egress interface nobody pinned, a privacy denial for local-network
          # traffic). One socket each way tells them apart.
          python - <<'PY'
          import socket, struct
          GROUP, PORT = "224.0.0.224", 7451
          try:
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(("0.0.0.0", 0))
              mreq = struct.pack("4s4s", socket.inet_aton(GROUP), socket.inet_aton("0.0.0.0"))
              s.setsockopt(socket.IPPROTO_IP, socket.IP_ADD_MEMBERSHIP, mreq)
              print(f"IGMP join {GROUP} via INADDR_ANY: OK")
              s.close()
          except OSError as exc:
              print(f"IGMP join {GROUP} via INADDR_ANY: FAILED ({exc})")

          def send(label, iface):
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  if iface is not None:
                      s.setsockopt(socket.IPPROTO_IP, socket.IP_MULTICAST_IF, socket.inet_aton(iface))
                  s.setsockopt(socket.IPPROTO_IP, socket.IP_MULTICAST_LOOP, 1)
                  s.sendto(b"x", (GROUP, PORT))
                  print(f"multicast send, {label}: OK")
              except OSError as exc:
                  print(f"multicast send, {label}: FAILED ({exc})")
              finally:
                  s.close()

          send("no interface pinned", None)
          send("pinned to 127.0.0.1", "127.0.0.1")
          try:
              p = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              p.connect(("192.0.2.1", 9))  # a route lookup, no packet leaves
              addr = p.getsockname()[0]
              p.close()
              send(f"pinned to the default-route address {addr}", addr)
          except OSError as exc:
              print(f"default-route address: none ({exc})")
          PY
          case "$RUNNER_OS" in
            macOS)   ifconfig -a; netstat -rn -f inet; route -n get "224.0.0.224" || true ;;
            Windows) ipconfig; route print -4 ;;
            *)       ip -4 addr; ip -4 route ;;
          esac
          cd crates
          scouting=PASS
          pubsub=PASS
          # One test at a time: the suites share a group port, so in parallel each
          # sees the others' datagrams. That was the first suspicion for Windows
          # flaking, and the serial run still failed a test, so it is a cleaner
          # observation and not the whole explanation.
          cargo test -p wz-runtime-tokio --features scouting-active,transport-link-tls \
            --test scouting_multicast_loopback -- --ignored --nocapture --test-threads=1 || scouting=FAIL
          cargo test -p wz-runtime-tokio --features transport-multicast \
            --test multicast_pubsub_loopback -- --ignored --nocapture --test-threads=1 || pubsub=FAIL
          echo "multicast-probe on ${RUNNER_OS}: scouting ${scouting}, pubsub ${pubsub}"
          echo "multicast-probe on ${RUNNER_OS}: scouting ${scouting}, pubsub ${pubsub}" >> "$GITHUB_STEP_SUMMARY"
          [ "$scouting" = PASS ] && [ "$pubsub" = PASS ]

  # ── Router interop: what a host owes of the interop corpus ────────────
  #
  # Round 3015 settled the scope: a host owes a subset of the zenohd interop corpus
  # derived from the corpus, not a hand-picked few. The corpus crate cannot be built
  # on a host as it stands: its dev-dependencies are the pico C library, the pico C
  # ABI crate and the POSIX shm feature of the runtime, and a dev-dependency is
  # built for every test target of the package. Two hosted probes measured that
  # (the first at the harness library's own Unix-only calls, which are gated now,
  # the second at those dev-dependencies), so the host-owed tests live in
  # `wz-host-interop-tests`, which uses the corpus crate as a library and so gets
  # only its ordinary dependencies.
  #
  # This job asks, per host and in order, whether the demo builds, whether that
  # crate's tests compile, whether the router builds and whether one handshake
  # completes, and prints one verdict line for each. It is an observation: a test
  # becomes a gate after two consecutive green hosted runs on its host.
  #
  # The router is built with `cargo install` and not with `scripts/build-zenohd.sh`,
  # on purpose and for now. That script's source path names the plugin libraries
  # `.so` and the binary without a host suffix, so it cannot finish on either host,
  # and a verdict about the script would hide the verdict about the router. Making
  # the script portable is an item of its own, carried by Round 3016.
  #
  # It is its own job and not steps of `leg` for a reason of time, not of tidiness:
  # a cold router build is the longest thing this lane does, and `leg` answers in
  # minutes under a 30 minute bound that a router build would break, turning a
  # question about a host into a red leg. It is an observation, so every verdict is
  # a printed line and the step never fails the run: a step with
  # `continue-on-error` reports `conclusion: success` whatever it did, and its own
  # `timeout-minutes` is below the job's, so a slow build ends the step and not the
  # job.
  interop:
    name: interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            host: macos
          - os: windows-latest
            host: windows
    env:
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        run: rustup show

      - name: Read the router's pin (version from the builder script, channel from its release)
        # The router version and the channel it is built on were literals here, which is
        # one fact in two places: the builder script declares the version, and the release
        # declares its own channel. Moving the pin would have left the host legs testing
        # against the old router and saying nothing. The version is READ from the script
        # that owns it; the channel is read from that release's `rust-toolchain.toml`, the
        # same file the script reads, over plain HTTPS (no token, no API quota). An empty
        # answer fails the step, so a changed shape cannot become a build with no version.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: |
          version="$(grep -m1 '^ZENOHD_VERSION=' scripts/build-zenohd.sh | sed 's/.*:-\([0-9][0-9.]*\)}.*/\1/')"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::scripts/build-zenohd.sh declares no ZENOHD_VERSION default (read: ${version})"; exit 1; }
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/eclipse-zenoh/zenoh/${version}/rust-toolchain.toml" > zenoh-toolchain.toml
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' zenoh-toolchain.toml | head -1)"
          [ -n "$channel" ] || { echo "::error::zenoh ${version} declares no toolchain channel"; exit 1; }
          echo "ZENOHD_VERSION=${version}" >> "$GITHUB_ENV"
          echo "ZENOHD_CHANNEL=${channel}" >> "$GITHUB_ENV"
          echo "router pin: zenohd ${version} on channel ${channel}"

      - name: Install the router's Rust toolchain
        # The router is built on its own release's channel, as ci.yml does for the
        # Linux build: building it on another is not a reproducibility trade.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: rustup toolchain install "$ZENOHD_CHANNEL" --profile minimal

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: router interop on this host, observed (one verdict line per question)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 75
        continue-on-error: true
        shell: bash
        run: |
          verdict() {
            echo "interop-probe on ${RUNNER_OS}: $1 $2"
            echo "interop-probe on ${RUNNER_OS}: $1 $2" >> "$GITHUB_STEP_SUMMARY"
          }
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          root="$PWD/target/zenohd-host"
          demo=FAIL
          harness=FAIL
          router=FAIL
          handshake=SKIPPED
          # The links the rows of zenohd_link_handshakes.rs dial: tls, quic and
          # quic-datagram carry a certificate, ws and udp-reliable need their locator
          # features, plain udp is in the demo's default. A Unix socket is served on
          # macOS and not on Windows, so only macOS owes it (and the demo's `unixsock`
          # feature is built there alone). A link's name has a hyphen where its test's
          # name has an underscore.
          features=ws,tls,quic,udp-reliable,quic-datagram
          links="ws udp udp-reliable tls quic quic-datagram"
          if [ "$RUNNER_OS" = macOS ]; then
            features="$features,unixsock"
            links="$links unixsock"
          fi
          (cd crates && cargo build -p wz-ap-demo --features "$features") && demo=PASS
          verdict "wz-ap-demo builds:" "$demo"
          (cd crates && cargo test -p wz-host-interop-tests --no-run) && harness=PASS
          verdict "host interop tests compile:" "$harness"
          cargo "+$ZENOHD_CHANNEL" install zenohd --version "$ZENOHD_VERSION" --locked --root "$root" && router=PASS
          verdict "zenohd $ZENOHD_VERSION builds:" "$router"
          all=PASS
          if [ "$demo$harness$router" = PASSPASSPASS ]; then
            handshake=FAIL
            bin="$root/bin/zenohd$exe"
            if command -v cygpath > /dev/null 2>&1; then bin="$(cygpath -m "$bin")"; fi
            (cd crates && WZ_ZENOHD_BIN="$bin" cargo test -p wz-host-interop-tests \
              --test zenohd_handshake \
              -- --ignored --exact wz_client_reaches_established_against_a_stock_zenohd_on_this_host \
              --nocapture) && handshake=PASS
            # One verdict per link, each its own test: a link's two consecutive green
            # runs are counted from its own line, and a red names its link.
            for scheme in $links; do
              link=FAIL
              (cd crates && WZ_ZENOHD_BIN="$bin" cargo test -p wz-host-interop-tests \
                --test zenohd_link_handshakes \
                -- --ignored --exact "wz_client_reaches_established_against_a_stock_zenohd_over_${scheme//-/_}_on_this_host" \
                --nocapture) && link=PASS
              verdict "wz reaches Established against zenohd over ${scheme}:" "$link"
              [ "$link" = PASS ] || all=FAIL
            done
          fi
          verdict "wz reaches Established against zenohd:" "$handshake"
          [ "$handshake" = PASS ] && [ "$all" = PASS ]

      - name: Set up Python (the promoted-test list is read from the matrix gate)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The promoted tests are the GATE half of this job. The step above observes and
      # cannot fail the run; this one has no `continue-on-error`, so a red here fails the
      # job and reaches the previous-run gate like any other. Which tests are promoted is
      # `INTEROP_PROMOTED` in the matrix gate, which holds the two hosted runs that earned
      # each one, and the list is printed by `--promoted HOST` so the workflow carries no
      # second copy of it. It runs after the observation step because it needs what that
      # step built (the demo and the router); a promoted test that cannot run for want of
      # them is a red, not a skip.
      - name: router interop on this host, the promoted tests (gate)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 10
        shell: bash
        run: |
          host="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          bin="$PWD/target/zenohd-host/bin/zenohd$exe"
          if command -v cygpath > /dev/null 2>&1; then bin="$(cygpath -m "$bin")"; fi
          python scripts/lib/platform_surface_matrix.py --promoted "$host" > promoted.tsv
          count=0
          while IFS=$'\t' read -r target test; do
            # Python writes a Windows line ending on a Windows runner; a name with a
            # carriage return selects no test, and `cargo test` calls that a pass.
            target="${target%$'\r'}"
            test="${test%$'\r'}"
            [ -n "$test" ] || continue
            count=$((count + 1))
            if [ ! -f "$bin" ]; then
              echo "::error::the promoted test $test needs the router at $bin and the observation step did not build it"
              exit 1
            fi
            log="$RUNNER_TEMP/promoted-$count.log"
            (cd crates && WZ_ZENOHD_BIN="$bin" cargo test -p wz-host-interop-tests --test "$target" \
              -- --ignored --exact "$test" --nocapture) > "$log" 2>&1 || { cat "$log"; exit 1; }
            cat "$log"
            if ! grep -q '^test result: ok\. 1 passed' "$log"; then
              echo "::error::the promoted test $test did not run exactly one passing test"
              exit 1
            fi
          done < promoted.tsv
          echo "interop-gate on ${RUNNER_OS}: ${count} promoted test(s) passed"

  # ── The C ABI crates on a host: a gate ─────────────────────────────────
  #
  # The platform tags do not claim the wz C ABI crates on a host (the open debt row
  # `debt-capi-hosts` keeps that gap), and until this job nothing built them on one:
  # the measurements that sized the gap were source-only checks from a Linux machine
  # with the C build steps stubbed. This job is what turns them into hosted evidence.
  # It builds the three crates, linking their `cdylib` outputs, which a source check
  # never does, runs each one's unit tests and the integration tests of those that have
  # them, and prints one verdict line for each.
  #
  # It started as an observation, for the reason the interop job's tests did: a red
  # was a measurement of a registered debt and printed a line instead of failing the
  # run. Windows' first run measured the pico crate's 42 compile errors, which is the
  # baseline the host layer then paid off. It is a gate since two consecutive hosted
  # runs read every one of its verdict lines green on BOTH hosts (Platform runs
  # 37127231232 and 37130390017, read from the job logs and not from the conclusion),
  # the owner's rule for promoting an observation. A red here now fails the run, and
  # what it means is that a C ABI crate stopped building or passing on a host it had
  # been shown to, which is a regression and not a measurement. What stays unclaimed
  # is not this job's: no pico C program runs against the cdylib on a host yet.
  capi:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            host: macos
          - os: windows-latest
            host: windows
    env:
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: the C ABI crates on this host, gated (one verdict line per question)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 35
        shell: bash
        run: |
          verdict() {
            echo "capi-probe on ${RUNNER_OS}: $1 $2"
            echo "capi-probe on ${RUNNER_OS}: $1 $2" >> "$GITHUB_STEP_SUMMARY"
          }
          overall=PASS
          for crate in wz-capi-core wz-capi-pico wz-capi-c; do
            built=FAIL
            (cd crates && cargo build -p "$crate") && built=PASS
            verdict "$crate builds:" "$built"
            tested=SKIPPED
            if [ "$built" = PASS ]; then
              tested=FAIL
              (cd crates && cargo test -p "$crate" --lib) && tested=PASS
            fi
            verdict "$crate unit tests:" "$tested"
            [ "$tested" = PASS ] || overall=FAIL
            # The integration tests drive the exported symbols through a real session over
            # the host's loopback, so they are the end-to-end answer where the unit tests
            # are the layout and arithmetic one. The ones that need a router binary are
            # `#[ignore]`d and do not run here. Output is not captured so that a test
            # which measures the host (`refusal-probe:`) prints its number on a pass.
            if [ -d "crates/$crate/tests" ]; then
              integrated=SKIPPED
              if [ "$built" = PASS ]; then
                integrated=FAIL
                (cd crates && cargo test -p "$crate" --test '*' -- --nocapture) && integrated=PASS
              fi
              verdict "$crate integration tests:" "$integrated"
              [ "$integrated" = PASS ] || overall=FAIL
            fi
          done
          [ "$overall" = PASS ]

      # The Windows layouts, measured by a C compiler on this host. A GATE since two
      # consecutive hosted runs read it green (Platform runs 37132181187 and
      # 37147312977, from the job logs): clang found the Windows SDK headers without the
      # Visual Studio environment and its `sizeof` equalled the Rust types' sizes both
      # times. It began as an observation because a compiler on a hosted runner was not
      # guaranteed to find those headers. A red here now fails the run, and it means a
      # Rust type changed size or the runner's compiler stopped finding the SDK.
      #
      # pico's Windows backend types its mutex, condition variable, task handle and
      # attribute as pointer-sized values, its clock as a `LARGE_INTEGER` and its
      # wall time as a `struct timeb` (system/platform/windows.h). The Rust side
      # asserts those sizes at compile time, which is a claim read off that header;
      # this step asks the host's own compiler for `sizeof` over the same Windows
      # types and compares it with what the Rust test prints for its own types, so
      # the comparison is a build-to-build fact and not a pair of literals. The Unix
      # hosts already do this inside a unit test (the host C compiler's pthread sizes).
      - name: the Windows layouts against the host's C compiler (gated)
        if: ${{ env.WZ_HOST_SELECTED == 'true' && runner.os == 'Windows' }}
        timeout-minutes: 15
        shell: bash
        run: |
          probe="$(cygpath -u "$RUNNER_TEMP")/layout_probe"
          cat > "$probe.c" <<'EOF'
          #include <stdio.h>
          #include <windows.h>
          #include <sys/timeb.h>
          int main(void) {
              printf("layout-c: srwlock=%zu condvar=%zu large_integer=%zu timeb=%zu handle=%zu\n",
                     sizeof(SRWLOCK), sizeof(CONDITION_VARIABLE), sizeof(LARGE_INTEGER),
                     sizeof(struct timeb), sizeof(HANDLE));
              return 0;
          }
          EOF
          used=""
          for cc in clang cl gcc; do
            command -v "$cc" > /dev/null 2>&1 || continue
            if [ "$cc" = cl ]; then
              cl /nologo "$(cygpath -w "$probe.c")" "/Fe:$(cygpath -w "$probe.exe")" "/Fo:$(cygpath -w "$probe.obj")" > "$probe.build.log" 2>&1 && used=cl
            else
              "$cc" "$probe.c" -o "$probe.exe" > "$probe.build.log" 2>&1 && used="$cc"
            fi
            [ -n "$used" ] && break
            echo "layout-probe: $cc did not compile the probe:"
            cat "$probe.build.log"
          done
          if [ -z "$used" ]; then
            echo "layout-probe on ${RUNNER_OS}: no C compiler on PATH compiled the probe NOT-MEASURED"
            echo "layout-probe on ${RUNNER_OS}: no C compiler compiled the probe NOT-MEASURED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          c_line="$("$probe.exe")"
          echo "$c_line"
          rust_line="$(cd crates && cargo test -p wz-capi-pico --lib os::windows::tests::the_rust_types_report -- --nocapture 2>&1 | grep '^layout-rust:')"
          echo "$rust_line"
          if [ "${c_line#layout-c: }" = "${rust_line#layout-rust: }" ]; then
            verdict="PASS"
          else
            verdict="FAIL"
          fi
          echo "layout-probe on ${RUNNER_OS} (${used}): the Rust types against the compiler's sizeof: ${verdict}"
          echo "layout-probe on ${RUNNER_OS} (${used}): the Rust types against the compiler's sizeof: ${verdict}" >> "$GITHUB_STEP_SUMMARY"
          [ "$verdict" = PASS ]

      # The vendored zenoh-pico C library through its build script, on this host. An
      # OBSERVATION. It is the build that stood between a Windows host and the corpus
      # crate and every pico-backed test: a hosted run showed the script handing CMake
      # the verbatim `\\?\` form of the vendored directory, and MSBuild failing with
      # "Cannot open source file" on every translation unit. The script now asks
      # `dunce` for the path, which is the ordinary drive-letter form on Windows. This
      # step is where that is read, and until it has been green twice on both hosts it
      # is a measurement and not a gate. It needs CMake, a C compiler and libclang,
      # which the hosted runners carry, and which is what the line says when it is the
      # thing that is missing.
      - name: the vendored pico C library on this host (observation)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 25
        continue-on-error: true
        shell: bash
        run: |
          built=FAIL
          (cd crates && cargo build -p zenoh-pico-sys) && built=PASS
          echo "pico-sys-probe on ${RUNNER_OS}: the vendored zenoh-pico C library builds: ${built}"
          echo "pico-sys-probe on ${RUNNER_OS}: the vendored zenoh-pico C library builds: ${built}" >> "$GITHUB_STEP_SUMMARY"
          [ "$built" = PASS ]

      # A zenoh-pico C program against the wz cdylib, on this host. An OBSERVATION, and
      # the evidence the platform tags do not yet have: a program compiled against
      # pico's OWN headers for this host (the ones the step above installs, with the
      # generated config), linked against the wz library in place of libzenohpico, and
      # run. It covers the part of the C ABI that differs by host (the mutex, condition
      # variable, task, clock, wall time and random exports), places every value pico's
      # header types between guard bytes to catch a wrong layout where it happens, and
      # carries a control that must trip the guard. It opens no session; the sessions
      # are what the Rust integration tests already drive over the host's loopback.
      #
      # On Windows the program is compiled with MSVC's `cl` through the Visual Studio
      # environment, the compiler pico's own build uses: pico's Windows header names an
      # inline function `__asm__`, which a GNU-mode compiler reads as a keyword.
      - name: a zenoh-pico C program against the wz cdylib (observation)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 25
        continue-on-error: true
        shell: bash
        run: |
          src="crates/wz-capi-pico/tests/c/pico_host_layer.c"
          lib_dir="$PWD/crates/target/debug"
          if ! (cd crates && cargo build -p zenoh-pico-sys -p wz-capi-pico); then
            echo "pico-program-probe on ${RUNNER_OS}: the pico headers and the cdylib did not build NOT-MEASURED"
            echo "pico-program-probe on ${RUNNER_OS}: the pico headers and the cdylib did not build NOT-MEASURED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # shellcheck disable=SC2012
          inc="$PWD/$(ls -dt crates/target/debug/build/zenoh-pico-sys-*/out/include | head -n 1)"
          echo "pico headers: $inc"
          compiled=FAIL
          temp="$(cygpath -u "$RUNNER_TEMP" 2> /dev/null || echo "$RUNNER_TEMP")"
          exe="$temp/pico_host_layer"
          case "$RUNNER_OS" in
            macOS)
              compiler=cc
              cc -std=c11 -DZENOH_MACOS -I"$inc" "$src" -o "$exe" -L"$lib_dir" -lwz_capi_pico -Wl,-rpath,"$lib_dir" && compiled=PASS
              ;;
            Windows)
              compiler=cl
              vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              vsroot="$("$vswhere" -latest -products '*' -property installationPath)"
              bat="$temp/build_pico_host_layer.bat"
              {
                printf '@echo off\r\n'
                printf 'call "%s\\VC\\Auxiliary\\Build\\vcvars64.bat" > nul\r\n' "$vsroot"
                printf 'cd /d "%s"\r\n' "$(cygpath -w "$temp")"
                printf 'cl /nologo /std:c11 /DZENOH_WINDOWS /I"%s" "%s" "%s" /Fe:"%s"\r\n' \
                  "$(cygpath -w "$inc")" "$(cygpath -w "$PWD/$src")" \
                  "$(cygpath -w "$lib_dir/wz_capi_pico.dll.lib")" "$(cygpath -w "$exe.exe")"
              } > "$bat"
              cmd.exe //c "$(cygpath -w "$bat")" && compiled=PASS
              exe="$exe.exe"
              ;;
            *)
              compiler=none
              ;;
          esac
          if [ "$compiled" != PASS ]; then
            echo "pico-program-probe on ${RUNNER_OS} (${compiler}): the program did not compile or link NOT-MEASURED"
            echo "pico-program-probe on ${RUNNER_OS} (${compiler}): the program did not compile or link NOT-MEASURED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          result=FAIL
          PATH="$lib_dir:$PATH" "$exe" && result=PASS
          echo "pico-program-probe on ${RUNNER_OS} (${compiler}): a pico C program against the wz cdylib: ${result}"
          echo "pico-program-probe on ${RUNNER_OS} (${compiler}): a pico C program against the wz cdylib: ${result}" >> "$GITHUB_STEP_SUMMARY"
          [ "$result" = PASS ]
