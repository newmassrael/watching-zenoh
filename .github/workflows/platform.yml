#
# Platform -- the lean lane for the hosts wz cannot be run on from this
# repository's own machines.
#
# The `platform-macos` and `platform-windows` inventory atoms claim that wz RUNS
# on those hosts, and the only evidence for that is a hosted runner of the
# host's own kind. `ci.yml` carries it in its `portability` job, behind every
# other job's queue: a run in flight is never cancelled there (owner decision,
# 2026-10-01), so one question about a macOS test costs a full CI wait. This
# lane asks only that question.
#
# What it runs is exactly the leg `scripts/lib/platform_surface_matrix.py`
# declares for the host: the integration-test targets that exercise each link
# the pin serves there, built once under their union feature set and run one at
# a time on their own deadline. It is the SAME gate as the `portability` job's
# last step, not a second definition of the leg, so the two cannot disagree
# about what a host owes. `ci.yml` stays the proof lane; this one is where a
# red on a host is read, narrowed (`only`) and, when a target stalls, looked at
# (the gate samples the stalled process before it kills it).
#
# What a red here means, stated because gate 2c reads every workflow: the
# previous-run gate grades EVERY run on the tip commit, whichever workflow it
# belongs to. A red Platform run therefore refuses the next push until it is
# acknowledged in `docs/hosted-red-acks.md`, exactly as a red CI run does. That
# is the intended coupling: a host that does not run wz is a red, not a note.
#
# Triggers. A push to main that touches what the leg builds or the gate that
# declares it, and a manual dispatch for a narrowed or repeated run.

name: Platform

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform.yml"
      - "scripts/lib/platform_surface_matrix.py"
      - "scripts/lib/upstream_link_axis_gate.py"
      - "crates/wz-runtime-tokio/**"
      - "crates/wz-session-core/**"
      - "crates/wz-integration-tests/**"
      - "crates/wz-host-interop-tests/**"
      - "crates/Cargo.toml"
      - "crates/Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      host:
        description: "Which host to run"
        type: choice
        options: [both, macos, windows]
        default: both
      only:
        description: "Comma-separated test targets of the leg (a diagnosis; reported PARTIAL). Empty runs the whole leg."
        type: string
        default: ""

# Latest-only and never cancelling a run in flight, the policy `ci.yml` records
# (owner decision, 2026-10-01): a waiting run is replaced by the newest, a
# running one is left to finish and be read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  leg:
    name: leg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Each host is its own signal: a macOS stall must not hide the Windows result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            host: macos
          - os: windows-latest
            host: windows
    env:
      # Which hosts a dispatch asked for, decided WITHOUT a job of its own. This lane
      # used to open with a Linux `plan` job that picked the matrix; the first runs
      # showed why that was wrong: the Linux pool is the one the full CI saturates
      # (22 jobs a push), so the lane meant to answer in minutes waited behind it
      # for over ten, to choose between two hosts that never needed Linux. A push
      # selects both; a dispatch selects what `host` names. An unselected host's job
      # still takes a runner for the seconds it needs to skip its steps.
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          # This lane is read while it is red; a cache saved only on success
          # would make every diagnostic run pay the cold build again.
          cache-on-failure: true
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: Set up Python (the platform-surface matrix gate is python)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: platform surface matrix selftest, on this host
        # The gate's own verdicts, driven on the host the leg will run on: the
        # process-tree handling and the stall diagnostics are the parts whose
        # behaviour differs per host, and the Linux lanes cannot see them.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: python scripts/lib/platform_surface_matrix.py --selftest

      - name: platform surface matrix, the leg this host is owed
        # `RUNNER_OS` is lower-cased with `tr`: macOS ships bash 3.2, which has
        # no `${var,,}`. The dispatch input travels through the environment, not
        # through the script text.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 20
        shell: bash
        env:
          WZ_ONLY: ${{ inputs.only }}
        run: |
          host="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$WZ_ONLY" ]; then
            python scripts/lib/platform_surface_matrix.py --run "$host" --only "$WZ_ONLY"
          else
            python scripts/lib/platform_surface_matrix.py --run "$host"
          fi

      # ── Multicast: what the leg does NOT gate ───────────────────────────
      #
      # Upstream serves UDP multicast on every host (`zenoh-link-udp`). The host
      # facets of it are GATED now, in the leg above: `multicast_host_roundtrip`
      # is a plane of the matrix gate (`PLANES`), run with `--ignored`, and it
      # passes on both hosts (macOS over `lo0`, Windows over the default
      # interface). What stays here is an OBSERVATION of two things the leg cannot
      # gate:
      #
      #   * the OS itself, before any wz code: a send to the group unpinned, on
      #     127.0.0.1 and on the default-route address, beside the interface and
      #     route tables. This is where the macOS finding came from: the real
      #     interface is denied to a process the runner spawns, loopback is not.
      #   * wz's FULLER multicast suites (scouting, pub/sub). They run one test at a
      #     time, and on Windows the scouting suite is still intermittent (6/6, 4/6,
      #     5/6 on three runs, a different test each time, all of them the OS's choice
      #     among three multicast-capable interfaces). On macOS they fail outright,
      #     because they use the default interface. Neither says wz is wrong, and a
      #     gate that flakes teaches nobody anything, so they do not gate.
      #
      # Two things about reading it. A step with `continue-on-error` reports
      # `conclusion: success` whatever it did (its `outcome` is the truth, and the
      # jobs API does not carry it), so the verdict is printed as a line of its own
      # and written to the job summary. And it runs after a leg that failed
      # (`!cancelled()`).
      - name: multicast on this host, observed (the suites; the leg gates the host witness)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 12
        continue-on-error: true
        shell: bash
        run: |
          # What the OS itself does, before any wz code: the first macOS run failed
          # EVERY multicast send with EHOSTUNREACH, and a send to a group has three
          # candidate causes that read the same (no multicast route on the default
          # path, an egress interface nobody pinned, a privacy denial for local-network
          # traffic). One socket each way tells them apart.
          python - <<'PY'
          import socket, struct
          GROUP, PORT = "224.0.0.224", 7451
          try:
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(("0.0.0.0", 0))
              mreq = struct.pack("4s4s", socket.inet_aton(GROUP), socket.inet_aton("0.0.0.0"))
              s.setsockopt(socket.IPPROTO_IP, socket.IP_ADD_MEMBERSHIP, mreq)
              print(f"IGMP join {GROUP} via INADDR_ANY: OK")
              s.close()
          except OSError as exc:
              print(f"IGMP join {GROUP} via INADDR_ANY: FAILED ({exc})")

          def send(label, iface):
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  if iface is not None:
                      s.setsockopt(socket.IPPROTO_IP, socket.IP_MULTICAST_IF, socket.inet_aton(iface))
                  s.setsockopt(socket.IPPROTO_IP, socket.IP_MULTICAST_LOOP, 1)
                  s.sendto(b"x", (GROUP, PORT))
                  print(f"multicast send, {label}: OK")
              except OSError as exc:
                  print(f"multicast send, {label}: FAILED ({exc})")
              finally:
                  s.close()

          send("no interface pinned", None)
          send("pinned to 127.0.0.1", "127.0.0.1")
          try:
              p = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              p.connect(("192.0.2.1", 9))  # a route lookup, no packet leaves
              addr = p.getsockname()[0]
              p.close()
              send(f"pinned to the default-route address {addr}", addr)
          except OSError as exc:
              print(f"default-route address: none ({exc})")
          PY
          case "$RUNNER_OS" in
            macOS)   ifconfig -a; netstat -rn -f inet; route -n get "224.0.0.224" || true ;;
            Windows) ipconfig; route print -4 ;;
            *)       ip -4 addr; ip -4 route ;;
          esac
          cd crates
          scouting=PASS
          pubsub=PASS
          # One test at a time: the suites share a group port, so in parallel each
          # sees the others' datagrams. That was the first suspicion for Windows
          # flaking, and the serial run still failed a test, so it is a cleaner
          # observation and not the whole explanation.
          cargo test -p wz-runtime-tokio --features scouting-active,transport-link-tls \
            --test scouting_multicast_loopback -- --ignored --nocapture --test-threads=1 || scouting=FAIL
          cargo test -p wz-runtime-tokio --features transport-multicast \
            --test multicast_pubsub_loopback -- --ignored --nocapture --test-threads=1 || pubsub=FAIL
          echo "multicast-probe on ${RUNNER_OS}: scouting ${scouting}, pubsub ${pubsub}"
          echo "multicast-probe on ${RUNNER_OS}: scouting ${scouting}, pubsub ${pubsub}" >> "$GITHUB_STEP_SUMMARY"
          [ "$scouting" = PASS ] && [ "$pubsub" = PASS ]

  # ── Router interop: what a host owes of the interop corpus ────────────
  #
  # Round 3015 settled the scope: a host owes a subset of the zenohd interop corpus
  # derived from the corpus, not a hand-picked few. The corpus crate cannot be built
  # on a host as it stands: its dev-dependencies are the pico C library, the pico C
  # ABI crate and the POSIX shm feature of the runtime, and a dev-dependency is
  # built for every test target of the package. Two hosted probes measured that
  # (the first at the harness library's own Unix-only calls, which are gated now,
  # the second at those dev-dependencies), so the host-owed tests live in
  # `wz-host-interop-tests`, which uses the corpus crate as a library and so gets
  # only its ordinary dependencies.
  #
  # This job asks, per host and in order, whether the demo builds, whether that
  # crate's tests compile, whether the router builds and whether one handshake
  # completes, and prints one verdict line for each. It is an observation: a test
  # becomes a gate after two consecutive green hosted runs on its host.
  #
  # The router is built with `cargo install` and not with `scripts/build-zenohd.sh`,
  # on purpose and for now. That script's source path names the plugin libraries
  # `.so` and the binary without a host suffix, so it cannot finish on either host,
  # and a verdict about the script would hide the verdict about the router. Making
  # the script portable is an item of its own, carried by Round 3016.
  #
  # It is its own job and not steps of `leg` for a reason of time, not of tidiness:
  # a cold router build is the longest thing this lane does, and `leg` answers in
  # minutes under a 30 minute bound that a router build would break, turning a
  # question about a host into a red leg. It is an observation, so every verdict is
  # a printed line and the step never fails the run: a step with
  # `continue-on-error` reports `conclusion: success` whatever it did, and its own
  # `timeout-minutes` is below the job's, so a slow build ends the step and not the
  # job.
  interop:
    name: interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            host: macos
          - os: windows-latest
            host: windows
    env:
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        run: rustup show

      - name: Install Rust toolchain 1.97.1 (the channel zenoh 1.10.1 pins)
        # The router is built on its own release's channel, as ci.yml does for the
        # Linux build: building it on another is not a reproducibility trade.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: router interop on this host, observed (one verdict line per question)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 75
        continue-on-error: true
        shell: bash
        run: |
          verdict() {
            echo "interop-probe on ${RUNNER_OS}: $1 $2"
            echo "interop-probe on ${RUNNER_OS}: $1 $2" >> "$GITHUB_STEP_SUMMARY"
          }
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          root="$PWD/target/zenohd-host"
          demo=FAIL
          harness=FAIL
          router=FAIL
          handshake=SKIPPED
          # The links the rows of zenohd_link_handshakes.rs dial: tls and quic carry a
          # certificate, ws needs its locator feature, udp is in the demo's default.
          (cd crates && cargo build -p wz-ap-demo --features ws,tls,quic) && demo=PASS
          verdict "wz-ap-demo builds:" "$demo"
          (cd crates && cargo test -p wz-host-interop-tests --no-run) && harness=PASS
          verdict "host interop tests compile:" "$harness"
          cargo +1.97.1 install zenohd --version 1.10.1 --locked --root "$root" && router=PASS
          verdict "zenohd 1.10.1 builds:" "$router"
          all=PASS
          if [ "$demo$harness$router" = PASSPASSPASS ]; then
            handshake=FAIL
            bin="$root/bin/zenohd$exe"
            if command -v cygpath > /dev/null 2>&1; then bin="$(cygpath -m "$bin")"; fi
            (cd crates && WZ_ZENOHD_BIN="$bin" cargo test -p wz-host-interop-tests \
              --test zenohd_handshake \
              -- --ignored --exact wz_client_reaches_established_against_a_stock_zenohd_on_this_host \
              --nocapture) && handshake=PASS
            # One verdict per link, each its own test: a link's two consecutive green
            # runs are counted from its own line, and a red names its link.
            for scheme in ws udp tls quic; do
              link=FAIL
              (cd crates && WZ_ZENOHD_BIN="$bin" cargo test -p wz-host-interop-tests \
                --test zenohd_link_handshakes \
                -- --ignored --exact "wz_client_reaches_established_against_a_stock_zenohd_over_${scheme}_on_this_host" \
                --nocapture) && link=PASS
              verdict "wz reaches Established against zenohd over ${scheme}:" "$link"
              [ "$link" = PASS ] || all=FAIL
            done
          fi
          verdict "wz reaches Established against zenohd:" "$handshake"
          [ "$handshake" = PASS ] && [ "$all" = PASS ]
