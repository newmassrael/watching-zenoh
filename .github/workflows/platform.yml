# SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael
#
# Platform -- the lean lane for the hosts wz cannot be run on from this
# repository's own machines.
#
# The `platform-macos` and `platform-windows` inventory atoms claim that wz RUNS
# on those hosts, and the only evidence for that is a hosted runner of the
# host's own kind. `ci.yml` carries it in its `portability` job, behind every
# other job's queue: a run in flight is never cancelled there (owner decision,
# 2026-10-01), so one question about a macOS test costs a full CI wait. This
# lane asks only that question.
#
# What it runs is exactly the leg `scripts/lib/platform_surface_matrix.py`
# declares for the host: the integration-test targets that exercise each link
# the pin serves there, built once under their union feature set and run one at
# a time on their own deadline. It is the SAME gate as the `portability` job's
# last step, not a second definition of the leg, so the two cannot disagree
# about what a host owes. `ci.yml` stays the proof lane; this one is where a
# red on a host is read, narrowed (`only`) and, when a target stalls, looked at
# (the gate samples the stalled process before it kills it).
#
# What a red here means, stated because gate 2c reads every workflow: the
# previous-run gate grades EVERY run on the tip commit, whichever workflow it
# belongs to. A red Platform run therefore refuses the next push until it is
# acknowledged in `docs/hosted-red-acks.md`, exactly as a red CI run does. That
# is the intended coupling: a host that does not run wz is a red, not a note.
#
# Triggers. A push to main that touches what the leg builds or the gate that
# declares it, and a manual dispatch for a narrowed or repeated run. "What the
# leg builds" is the dependency closure of its crates, not only the crates it is
# about: `scripts/lib/platform_trigger_paths_gate.py` derives that closure and
# fails when a crate in it has no path here.

name: Platform

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform.yml"
      - "scripts/lib/platform_surface_matrix.py"
      - "scripts/lib/upstream_link_axis_gate.py"
      - "scripts/pico-c-program.sh"
      - "scripts/lib/rust-toolchain-pinned.sh"
      # What the Windows package of the pico library is made from beyond the crates below: its
      # packager, the preset and the configuration reader that resolve its features, the header
      # tree and licences it copies, and the schemas it ships.
      - "scripts/lib/pico_windows_package.py"
      - "scripts/lib/wz_config.py"
      - "scripts/lib/upstream_switch_map.py"
      - "scripts/requirements-kconfig.txt"
      - "configs/**"
      - "deploy/Kconfig*"
      - "deploy/wz-config.toml"
      - "deploy/wz-config.schema.json"
      - "deploy/message-catalog.schema.json"
      - "vendor/zenoh-pico"
      - "LICENSE"
      - "LICENSE-COMMERCIAL.md"
      - "crates/wz-runtime-tokio/**"
      - "crates/wz-session-core/**"
      - "crates/wz-auth/**"
      - "crates/wz-storage/**"
      - "crates/wz-admin/**"
      - "crates/wz-integration-tests/**"
      - "crates/wz-capi-core/**"
      - "crates/wz-capi-port/**"
      - "crates/wz-capi-coop/**"
      - "crates/wz-session-mcu/**"
      - "crates/wz-runtime-coop/**"
      - "crates/wz-runtime-posix/**"
      - "crates/wz-capi-pico/**"
      - "crates/wz-capi-c/**"
      - "crates/zenoh-pico-sys/**"
      - "crates/wz-host-interop-tests/**"
      - "crates/wz/**"
      - "crates/wz-access-control/**"
      - "crates/wz-capi-dissect/**"
      - "crates/wz-capi-replay/**"
      - "crates/wz-replay/**"
      - "crates/wz-analyze/**"
      - "crates/wz-packet-socket/**"
      - "crates/wz-host-net/**"
      - "crates/wz-tls-pem/**"
      - "crates/wz-ext-pubsub/**"
      - "crates/wz-node-time/**"
      - "crates/wz-workload/**"
      - "crates/wz-tls-record/**"
      - "crates/wz-capture/**"
      - "crates/wz-app-frame/**"
      - "crates/wz-cdylib-build/**"
      - "crates/wz-abi-stamp/**"
      - "crates/wz-conformance-build/**"
      # The patched copies of four crates.io packages the lane builds (THIRD_PARTY.md): a change to
      # one is a change to what the macOS and Windows legs compile.
      - "third-party/quinn-udp/**"
      - "third-party/ring/**"
      - "third-party/socket2/**"
      - "third-party/tokio/**"
      - "crates/wz-codecs/**"
      - "crates/wz-codecs-test-support/**"
      - "crates/wz-codegen-build/**"
      - "crates/wz-mesh-client/**"
      - "crates/wz-packet-fixtures/**"
      - "crates/wz-rest/**"
      - "crates/wz-routing-graph/**"
      - "crates/wz-runtime-core/**"
      - "crates/wz-runtime-tokio-test-support/**"
      - "crates/wz-session-core-test-support/**"
      - "crates/wz-session-wire-fixtures/**"
      - "crates/wz-statechart-bridge/**"
      - "crates/wz-switchboard-schema/**"
      - "vendor/sce"
      - "crates/Cargo.toml"
      - "crates/Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      host:
        description: "Which host to run"
        type: choice
        options: [both, macos, windows]
        default: both
      only:
        description: "Comma-separated test targets of the leg (a diagnosis; reported PARTIAL). Empty runs the whole leg."
        type: string
        default: ""

# Latest-only and never cancelling a run in flight, the policy `ci.yml` records
# (owner decision, 2026-10-01): a waiting run is replaced by the newest, a
# running one is left to finish and be read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables only, as in ci.yml (whose comment carries the measurement).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  leg:
    name: leg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    outputs:
      cache_spec: ${{ steps.cache-series.outputs.spec }}
    timeout-minutes: 30
    strategy:
      # Each host is its own signal: a macOS stall must not hide the Windows result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            host: macos
          - os: windows-latest
            host: windows
    env:
      # Which hosts a dispatch asked for, decided WITHOUT a job of its own. This lane
      # used to open with a Linux `plan` job that picked the matrix; the first runs
      # showed why that was wrong: the Linux pool is the one the full CI saturates
      # (22 jobs a push), so the lane meant to answer in minutes waited behind it
      # for over ten, to choose between two hosts that never needed Linux. A push
      # selects both; a dispatch selects what `host` names. An unselected host's job
      # still takes a runner for the seconds it needs to skip its steps.
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: bash scripts/lib/rust-toolchain-pinned.sh

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          # The SAVER of class `rust-host-workspace` in .github/cache-classes.json.
          # `portability` (ci.yml) and `capi` (below) build the same workspace on
          # the same hosts and only READ this key; the three used to keep three
          # copies of it.
          shared-key: host-workspace
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # This lane is read while it is red; a cache saved only on success
          # would make every diagnostic run pay the cold build again.
          cache-on-failure: true
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: Set up Python (the platform-surface matrix gate is python)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version-file: .github/python-version

      - name: Name the cache series this job saves
        # Handed to `evict-superseded` as this job's `cache_spec` output; see
        # that job, and the same step in ci.yml.
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        id: cache-series
        shell: bash
        run: python scripts/lib/cache_prune.py --saver-spec "platform.yml:${GITHUB_JOB}" >> "$GITHUB_OUTPUT"

      - name: platform surface matrix selftest, on this host
        # The gate's own verdicts, driven on the host the leg will run on: the
        # process-tree handling and the stall diagnostics are the parts whose
        # behaviour differs per host, and the Linux lanes cannot see them.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: python scripts/lib/platform_surface_matrix.py --selftest

      - name: platform surface matrix, the leg this host is owed
        # `RUNNER_OS` is lower-cased with `tr`: macOS ships bash 3.2, which has
        # no `${var,,}`. The dispatch input travels through the environment, not
        # through the script text.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 20
        shell: bash
        env:
          WZ_ONLY: ${{ inputs.only }}
        run: |
          host="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$WZ_ONLY" ]; then
            python scripts/lib/platform_surface_matrix.py --run "$host" --only "$WZ_ONLY"
          else
            python scripts/lib/platform_surface_matrix.py --run "$host"
          fi

      # ── Multicast: what the leg does NOT gate ───────────────────────────
      #
      # Upstream serves UDP multicast on every host (`zenoh-link-udp`). The host
      # facets of it are GATED now, in the leg above: `multicast_host_roundtrip`
      # is a plane of the matrix gate (`PLANES`), run with `--ignored`, and it
      # passes on both hosts (macOS over `lo0`, Windows over the default
      # interface). What stays here is an OBSERVATION of two things the leg cannot
      # gate:
      #
      #   * the OS itself, before any wz code: a send to the group unpinned, on
      #     127.0.0.1 and on the default-route address, beside the interface and
      #     route tables. This is where the macOS finding came from: the real
      #     interface is denied to a process the runner spawns, loopback is not.
      #   * wz's FULLER multicast suites (scouting, pub/sub). They run one test at a
      #     time, and on Windows the scouting suite is still intermittent (6/6, 4/6,
      #     5/6 on three runs, a different test each time, all of them the OS's choice
      #     among three multicast-capable interfaces). On macOS they fail outright,
      #     because they use the default interface. Neither says wz is wrong, and a
      #     gate that flakes teaches nobody anything, so they do not gate.
      #
      # Two things about reading it. A step with `continue-on-error` reports
      # `conclusion: success` whatever it did (its `outcome` is the truth, and the
      # jobs API does not carry it), so the verdict is printed as a line of its own
      # and written to the job summary. And it runs after a leg that failed
      # (`!cancelled()`).
      - name: multicast on this host, observed (the suites; the leg gates the host witness)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 12
        continue-on-error: true
        shell: bash
        run: |
          # What the OS itself does, before any wz code: the first macOS run failed
          # EVERY multicast send with EHOSTUNREACH, and a send to a group has three
          # candidate causes that read the same (no multicast route on the default
          # path, an egress interface nobody pinned, a privacy denial for local-network
          # traffic). One socket each way tells them apart.
          python - <<'PY'
          import socket, struct
          GROUP, PORT = "224.0.0.224", 7451
          try:
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(("0.0.0.0", 0))
              mreq = struct.pack("4s4s", socket.inet_aton(GROUP), socket.inet_aton("0.0.0.0"))
              s.setsockopt(socket.IPPROTO_IP, socket.IP_ADD_MEMBERSHIP, mreq)
              print(f"IGMP join {GROUP} via INADDR_ANY: OK")
              s.close()
          except OSError as exc:
              print(f"IGMP join {GROUP} via INADDR_ANY: FAILED ({exc})")

          def send(label, iface):
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  if iface is not None:
                      s.setsockopt(socket.IPPROTO_IP, socket.IP_MULTICAST_IF, socket.inet_aton(iface))
                  s.setsockopt(socket.IPPROTO_IP, socket.IP_MULTICAST_LOOP, 1)
                  s.sendto(b"x", (GROUP, PORT))
                  print(f"multicast send, {label}: OK")
              except OSError as exc:
                  print(f"multicast send, {label}: FAILED ({exc})")
              finally:
                  s.close()

          send("no interface pinned", None)
          send("pinned to 127.0.0.1", "127.0.0.1")
          try:
              p = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              p.connect(("192.0.2.1", 9))  # a route lookup, no packet leaves
              addr = p.getsockname()[0]
              p.close()
              send(f"pinned to the default-route address {addr}", addr)
          except OSError as exc:
              print(f"default-route address: none ({exc})")
          PY
          case "$RUNNER_OS" in
            macOS)   ifconfig -a; netstat -rn -f inet; route -n get "224.0.0.224" || true ;;
            Windows) ipconfig; route print -4 ;;
            *)       ip -4 addr; ip -4 route ;;
          esac
          cd crates
          scouting=PASS
          pubsub=PASS
          # One test at a time: the suites share a group port, so in parallel each
          # sees the others' datagrams. That was the first suspicion for Windows
          # flaking, and the serial run still failed a test, so it is a cleaner
          # observation and not the whole explanation.
          cargo test -p wz-runtime-tokio --features scouting-active,transport-link-tls \
            --test scouting_multicast_loopback -- --ignored --nocapture --test-threads=1 || scouting=FAIL
          cargo test -p wz-runtime-tokio --features transport-multicast \
            --test multicast_pubsub_loopback -- --ignored --nocapture --test-threads=1 || pubsub=FAIL
          echo "multicast-probe on ${RUNNER_OS}: scouting ${scouting}, pubsub ${pubsub}"
          echo "multicast-probe on ${RUNNER_OS}: scouting ${scouting}, pubsub ${pubsub}" >> "$GITHUB_STEP_SUMMARY"
          [ "$scouting" = PASS ] && [ "$pubsub" = PASS ]

  # ── Router interop: what a host owes of the interop corpus ────────────
  #
  # Round 3015 settled the scope: a host owes a subset of the zenohd interop corpus
  # derived from the corpus, not a hand-picked few. The corpus crate cannot be built
  # on a host as it stands: its dev-dependencies are the pico C library, the pico C
  # ABI crate and the POSIX shm feature of the runtime, and a dev-dependency is
  # built for every test target of the package. Two hosted probes measured that
  # (the first at the harness library's own Unix-only calls, which are gated now,
  # the second at those dev-dependencies), so the host-owed tests live in
  # `wz-host-interop-tests`, which uses the corpus crate as a library and so gets
  # only its ordinary dependencies.
  #
  # This job asks, per host and in order, whether the demo builds, whether that
  # crate's tests compile, whether the router builds and whether one handshake
  # completes, and prints one verdict line for each. It is an observation: a test
  # becomes a gate after two consecutive green hosted runs on its host.
  #
  # The router is built with `cargo install` and not with `scripts/build-zenohd.sh`,
  # on purpose and for now. That script's source path names the plugin libraries
  # `.so` and the binary without a host suffix, so it cannot finish on either host,
  # and a verdict about the script would hide the verdict about the router. Making
  # the script portable is an item of its own, carried by Round 3016.
  #
  # It is its own job and not steps of `leg` for a reason of time, not of tidiness:
  # a cold router build is the longest thing this lane does, and `leg` answers in
  # minutes under a 30 minute bound that a router build would break, turning a
  # question about a host into a red leg. It is an observation, so every verdict is
  # a printed line and the step never fails the run: a step with
  # `continue-on-error` reports `conclusion: success` whatever it did, and its own
  # `timeout-minutes` is below the job's, so a slow build ends the step and not the
  # job.
  interop:
    name: interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    outputs:
      cache_spec: ${{ steps.cache-series.outputs.spec }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            host: macos
          - os: windows-latest
            host: windows
    env:
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: bash scripts/lib/rust-toolchain-pinned.sh

      - name: Read the router's pin (version from the builder script, channel from its release)
        # The router version and the channel it is built on were literals here, which is
        # one fact in two places: the builder script declares the version, and the release
        # declares its own channel. Moving the pin would have left the host legs testing
        # against the old router and saying nothing. The version is READ from the script
        # that owns it; the channel is read from that release's `rust-toolchain.toml`, the
        # same file the script reads, over plain HTTPS (no token, no API quota). An empty
        # answer fails the step, so a changed shape cannot become a build with no version.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: |
          version="$(grep -m1 '^ZENOHD_VERSION=' scripts/build-zenohd.sh | sed 's/.*:-\([0-9][0-9.]*\)}.*/\1/')"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::scripts/build-zenohd.sh declares no ZENOHD_VERSION default (read: ${version})"; exit 1; }
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/eclipse-zenoh/zenoh/${version}/rust-toolchain.toml" > zenoh-toolchain.toml
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' zenoh-toolchain.toml | head -1)"
          [ -n "$channel" ] || { echo "::error::zenoh ${version} declares no toolchain channel"; exit 1; }
          echo "ZENOHD_VERSION=${version}" >> "$GITHUB_ENV"
          echo "ZENOHD_CHANNEL=${channel}" >> "$GITHUB_ENV"
          echo "router pin: zenohd ${version} on channel ${channel}"

      - name: Install the router's Rust toolchain
        # The router is built on its own release's channel, as ci.yml does for the
        # Linux build: building it on another is not a reproducibility trade.
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: rustup toolchain install "$ZENOHD_CHANNEL" --profile minimal

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          # Class `rust-host-interop`: its own entry on purpose. This job
          # installs the router's toolchain, which changes the rust-cache
          # environment hash on both hosts, so the `host-workspace` entry cannot
          # serve it.
          shared-key: platform-interop
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: router interop on this host, observed (one verdict line per question)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 75
        continue-on-error: true
        shell: bash
        run: |
          verdict() {
            echo "interop-probe on ${RUNNER_OS}: $1 $2"
            echo "interop-probe on ${RUNNER_OS}: $1 $2" >> "$GITHUB_STEP_SUMMARY"
          }
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          root="$PWD/target/zenohd-host"
          demo=FAIL
          harness=FAIL
          router=FAIL
          handshake=SKIPPED
          # The links the rows of zenohd_link_handshakes.rs dial: tls, quic and
          # quic-datagram carry a certificate, ws and udp-reliable need their locator
          # features, plain udp is in the demo's default. A Unix socket is served on
          # macOS and not on Windows, so only macOS owes it (and the demo's `unixsock`
          # feature is built there alone). A link's name has a hyphen where its test's
          # name has an underscore. `routing-peer` is the data tests' subscriber: it
          # declares and receives, which the client-only demo does not.
          features=ws,tls,quic,udp-reliable,quic-datagram,routing-peer
          links="ws udp udp-reliable tls quic quic-datagram"
          if [ "$RUNNER_OS" = macOS ]; then
            features="$features,unixsock"
            links="$links unixsock"
          fi
          (cd crates && cargo build -p wz-ap-demo --features "$features") && demo=PASS
          verdict "wz-ap-demo builds:" "$demo"
          # Windows only: the demo's named stop event, the way a process with no console
          # is asked to stop cleanly. The test creates the event by the name the demo
          # gives its own process, signals it, and expects the demo's wait to resolve
          # and the event to be reset. It is an observation and is not part of this
          # step's verdict: a line of its own, read when a Windows host is asked.
          if [ "$RUNNER_OS" = Windows ]; then
            stop_event=FAIL
            (cd crates && cargo test -p wz-ap-demo --bin wz-ap-demo stop_event) && stop_event=PASS
            verdict "wz-ap-demo stops on a named event:" "$stop_event"
          fi
          (cd crates && cargo test -p wz-host-interop-tests --no-run) && harness=PASS
          verdict "host interop tests compile:" "$harness"
          cargo "+$ZENOHD_CHANNEL" install zenohd --version "$ZENOHD_VERSION" --locked --root "$root" && router=PASS
          verdict "zenohd $ZENOHD_VERSION builds:" "$router"
          all=PASS
          if [ "$demo$harness$router" = PASSPASSPASS ]; then
            handshake=FAIL
            bin="$root/bin/zenohd$exe"
            if command -v cygpath > /dev/null 2>&1; then bin="$(cygpath -m "$bin")"; fi
            (cd crates && WZ_ZENOHD_BIN="$bin" cargo test -p wz-host-interop-tests \
              --test zenohd_handshake \
              -- --ignored --exact wz_client_reaches_established_against_a_stock_zenohd_on_this_host \
              --nocapture) && handshake=PASS
            # One verdict per link, each its own test: a link's two consecutive green
            # runs are counted from its own line, and a red names its link.
            for scheme in $links; do
              link=FAIL
              (cd crates && WZ_ZENOHD_BIN="$bin" cargo test -p wz-host-interop-tests \
                --test zenohd_link_handshakes \
                -- --ignored --exact "wz_client_reaches_established_against_a_stock_zenohd_over_${scheme//-/_}_on_this_host" \
                --nocapture) && link=PASS
              verdict "wz reaches Established against zenohd over ${scheme}:" "$link"
              [ "$link" = PASS ] || all=FAIL
            done
            # The data plane over the same links, TCP included: a link that connects is not
            # yet a link that carries a Put. Each is its own test and its own verdict line,
            # for the same reason as the handshakes above.
            for scheme in tcp $links; do
              carried=FAIL
              (cd crates && WZ_ZENOHD_BIN="$bin" cargo test -p wz-host-interop-tests \
                --test zenohd_link_handshakes \
                -- --ignored --exact "wz_publisher_reaches_a_subscriber_through_a_stock_zenohd_over_${scheme//-/_}_on_this_host" \
                --nocapture) && carried=PASS
              verdict "wz publisher reaches a subscriber through zenohd over ${scheme}:" "$carried"
              [ "$carried" = PASS ] || all=FAIL
            done
          fi
          verdict "wz reaches Established against zenohd:" "$handshake"
          [ "$handshake" = PASS ] && [ "$all" = PASS ]

      - name: Set up Python (the promoted-test list is read from the matrix gate)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version-file: .github/python-version

      - name: Name the cache series this job saves
        # Handed to `evict-superseded` as this job's `cache_spec` output; see
        # that job, and the same step in ci.yml.
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        id: cache-series
        shell: bash
        run: python scripts/lib/cache_prune.py --saver-spec "platform.yml:${GITHUB_JOB}" >> "$GITHUB_OUTPUT"

      # The promoted tests are the GATE half of this job. The step above observes and
      # cannot fail the run; this one has no `continue-on-error`, so a red here fails the
      # job and reaches the previous-run gate like any other. Which tests are promoted is
      # `INTEROP_PROMOTED` in the matrix gate, which holds the two hosted runs that earned
      # each one, and the list is printed by `--promoted HOST` so the workflow carries no
      # second copy of it. It runs after the observation step because it needs what that
      # step built (the demo and the router); a promoted test that cannot run for want of
      # them is a red, not a skip.
      - name: router interop on this host, the promoted tests (gate)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 10
        shell: bash
        run: |
          host="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          bin="$PWD/target/zenohd-host/bin/zenohd$exe"
          if command -v cygpath > /dev/null 2>&1; then bin="$(cygpath -m "$bin")"; fi
          python scripts/lib/platform_surface_matrix.py --promoted "$host" > promoted.tsv
          count=0
          while IFS=$'\t' read -r target test; do
            # Python writes a Windows line ending on a Windows runner; a name with a
            # carriage return selects no test, and `cargo test` calls that a pass.
            target="${target%$'\r'}"
            test="${test%$'\r'}"
            [ -n "$test" ] || continue
            count=$((count + 1))
            if [ ! -f "$bin" ]; then
              echo "::error::the promoted test $test needs the router at $bin and the observation step did not build it"
              exit 1
            fi
            log="$RUNNER_TEMP/promoted-$count.log"
            (cd crates && WZ_ZENOHD_BIN="$bin" cargo test -p wz-host-interop-tests --test "$target" \
              -- --ignored --exact "$test" --nocapture) > "$log" 2>&1 || { cat "$log"; exit 1; }
            cat "$log"
            if ! grep -q '^test result: ok\. 1 passed' "$log"; then
              echo "::error::the promoted test $test did not run exactly one passing test"
              exit 1
            fi
          done < promoted.tsv
          echo "interop-gate on ${RUNNER_OS}: ${count} promoted test(s) passed"

  # ── The C ABI crates on a host: a gate ─────────────────────────────────
  #
  # The platform tags do not claim the wz C ABI crates on a host (the open debt row
  # `debt-capi-hosts` keeps that gap), and until this job nothing built them on one:
  # the measurements that sized the gap were source-only checks from a Linux machine
  # with the C build steps stubbed. This job is what turns them into hosted evidence.
  # It builds the three crates, linking their `cdylib` outputs, which a source check
  # never does, runs each one's unit tests and the integration tests of those that have
  # them, and prints one verdict line for each.
  #
  # It started as an observation, for the reason the interop job's tests did: a red
  # was a measurement of a registered debt and printed a line instead of failing the
  # run. Windows' first run measured the pico crate's 42 compile errors, which is the
  # baseline the host layer then paid off. It is a gate since two consecutive hosted
  # runs read every one of its verdict lines green on BOTH hosts (Platform runs
  # 37127231232 and 37130390017, read from the job logs and not from the conclusion),
  # the owner's rule for promoting an observation. A red here now fails the run, and
  # what it means is that a C ABI crate stopped building or passing on a host it had
  # been shown to, which is a regression and not a measurement. Two zenoh-pico C
  # programs now run against the cdylib on each host, the host layer and a pair of
  # sessions over loopback, and both are gates. What stays unclaimed is not this
  # job's: it is the owner's decision whether the platform tags may claim the C ABI.
  capi:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            host: macos
          - os: windows-latest
            host: windows
    env:
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: bash scripts/lib/rust-toolchain-pinned.sh

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          # A READER of the `leg` job's entry (class `rust-host-workspace`).
          shared-key: host-workspace
          add-job-id-key: "false"
          save-if: "false"
          workspaces: |
            crates -> target
            vendor/sce -> target

      # scripts/pico-c-program.sh reads cargo's build report and renders the header of the
      # library's arm (`wz_config.py --pico-config-h`) in python, the version the repository pins.
      - name: Set up Python (the pico C programs' header is rendered in python)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version-file: .github/python-version

      - name: the C ABI crates on this host, gated (one verdict line per question)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 35
        shell: bash
        run: |
          verdict() {
            echo "capi-probe on ${RUNNER_OS}: $1 $2"
            echo "capi-probe on ${RUNNER_OS}: $1 $2" >> "$GITHUB_STEP_SUMMARY"
          }
          overall=PASS
          # `wz-capi-dissect` is the door an analyzer feeds captured packets through, and
          # no job of this workflow or of the CI workflow built it on either host before:
          # its path was a trigger, its crate was not in this list. It reads packets the
          # caller hands it and opens no socket, so what is asked here is that it builds
          # and its unit tests pass.
          #
          # `wz-capi-replay` is the plan half of the replay tool behind a C ABI: scalars in,
          # scalars out, no socket, no thread, no callback. It has no cfg(unix) arm, and no
          # hosted runner of either kind had built it before this list named it, so the claim
          # that it builds on Windows was a reading of its source. It owes what dissect owes.
          for crate in wz-capi-core wz-capi-pico wz-capi-c wz-capi-dissect wz-capi-replay; do
            built=FAIL
            (cd crates && cargo build -p "$crate") && built=PASS
            verdict "$crate builds:" "$built"
            tested=SKIPPED
            if [ "$built" = PASS ]; then
              tested=FAIL
              (cd crates && cargo test -p "$crate" --lib) && tested=PASS
            fi
            verdict "$crate unit tests:" "$tested"
            [ "$tested" = PASS ] || overall=FAIL
            # The integration tests drive the exported symbols through a real session over
            # the host's loopback, so they are the end-to-end answer where the unit tests
            # are the layout and arithmetic one. The ones that need a router binary are
            # `#[ignore]`d and do not run here. Output is not captured so that a test
            # which measures the host (`refusal-probe:`) prints its number on a pass.
            # A `tests/` directory is not a test target: `wz-capi-dissect`'s holds one C
            # file, which `cargo test --test '*'` matches to nothing and refuses.
            #
            # `--tests` and not `--test '*'`. cargo takes a target named by `--test`, a glob
            # included, as asked for, and refuses it when the features it requires are off:
            # `admin_space_roundtrip` of `wz-capi-pico` requires `admin-space`, which the
            # default build does not carry, and `--test '*'` stopped there with `requires the
            # features`, so the macOS probe printed its FAIL before one test of the crate ran.
            # `--tests` skips such a target, which is the question this probe asks: the
            # default build's integration tests. A target behind a feature has its own lane
            # (`scripts/lib/nondefault-tests-gate.sh` lists them). The cost is that the
            # library's unit tests run again beside the integration ones.
            # A crate whose test files are merged (`scripts/lib/merge_tests.py`) keeps them as
            # modules of `tests/<target>/main.rs`, and a crate may hold both forms.
            if compgen -G "crates/$crate/tests/*.rs" > /dev/null ||
              compgen -G "crates/$crate/tests/*/main.rs" > /dev/null; then
              integrated=SKIPPED
              if [ "$built" = PASS ]; then
                integrated=FAIL
                (cd crates && cargo test -p "$crate" --tests -- --nocapture) && integrated=PASS
              fi
              verdict "$crate integration tests:" "$integrated"
              [ "$integrated" = PASS ] || overall=FAIL
            fi
          done
          # The shared-memory arm of `wz-capi-c`, on Windows only. The zenoh-c archive a
          # Windows consumer pairs with is the `unstable-shm` build, so the arm that
          # matches it is this one, and its segment is a named file mapping where the Unix
          # one is a `/dev/shm` file. macOS is left out on purpose: its segments would
          # be named under `/dev/shm`, which that host does not have, and upstream makes
          # them with `shm_open` there, so a red from it would measure a different gap.
          # The unit tests make a segment through the runtime and attach it through the
          # C client registry, so a pass is the mapping created, opened and read.
          if [ "$RUNNER_OS" = Windows ]; then
            shm_built=FAIL
            (cd crates && cargo build -p wz-capi-c --features zenoh-c-shared-memory) && shm_built=PASS
            verdict "wz-capi-c shared-memory arm builds:" "$shm_built"
            shm_tested=SKIPPED
            if [ "$shm_built" = PASS ]; then
              shm_tested=FAIL
              (cd crates && cargo test -p wz-capi-c --features zenoh-c-shared-memory --lib) && shm_tested=PASS
            fi
            verdict "wz-capi-c shared-memory arm unit tests:" "$shm_tested"
            [ "$shm_tested" = PASS ] || overall=FAIL
          fi
          [ "$overall" = PASS ]

      # The Windows layouts, measured by a C compiler on this host. A GATE since two
      # consecutive hosted runs read it green (Platform runs 37132181187 and
      # 37147312977, from the job logs): clang found the Windows SDK headers without the
      # Visual Studio environment and its `sizeof` equalled the Rust types' sizes both
      # times. It began as an observation because a compiler on a hosted runner was not
      # guaranteed to find those headers. A red here now fails the run, and it means a
      # Rust type changed size or the runner's compiler stopped finding the SDK.
      #
      # pico's Windows backend types its mutex, condition variable, task handle and
      # attribute as pointer-sized values, its clock as a `LARGE_INTEGER` and its
      # wall time as a `struct timeb` (system/platform/windows.h). The Rust side
      # asserts those sizes at compile time, which is a claim read off that header;
      # this step asks the host's own compiler for `sizeof` over the same Windows
      # types and compares it with what the Rust test prints for its own types, so
      # the comparison is a build-to-build fact and not a pair of literals. The Unix
      # hosts already do this inside a unit test (the host C compiler's pthread sizes).
      - name: the Windows layouts against the host's C compiler (gated)
        if: ${{ env.WZ_HOST_SELECTED == 'true' && runner.os == 'Windows' }}
        timeout-minutes: 15
        shell: bash
        run: |
          probe="$(cygpath -u "$RUNNER_TEMP")/layout_probe"
          cat > "$probe.c" <<'EOF'
          #include <stdio.h>
          #include <windows.h>
          #include <sys/timeb.h>
          int main(void) {
              printf("layout-c: srwlock=%zu condvar=%zu large_integer=%zu timeb=%zu handle=%zu\n",
                     sizeof(SRWLOCK), sizeof(CONDITION_VARIABLE), sizeof(LARGE_INTEGER),
                     sizeof(struct timeb), sizeof(HANDLE));
              return 0;
          }
          EOF
          used=""
          for cc in clang cl gcc; do
            command -v "$cc" > /dev/null 2>&1 || continue
            if [ "$cc" = cl ]; then
              cl /nologo "$(cygpath -w "$probe.c")" "/Fe:$(cygpath -w "$probe.exe")" "/Fo:$(cygpath -w "$probe.obj")" > "$probe.build.log" 2>&1 && used=cl
            else
              "$cc" "$probe.c" -o "$probe.exe" > "$probe.build.log" 2>&1 && used="$cc"
            fi
            [ -n "$used" ] && break
            echo "layout-probe: $cc did not compile the probe:"
            cat "$probe.build.log"
          done
          if [ -z "$used" ]; then
            echo "layout-probe on ${RUNNER_OS}: no C compiler on PATH compiled the probe NOT-MEASURED"
            echo "layout-probe on ${RUNNER_OS}: no C compiler compiled the probe NOT-MEASURED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          c_line="$("$probe.exe")"
          echo "$c_line"
          rust_line="$(cd crates && cargo test -p wz-capi-pico --lib os::windows::tests::the_rust_types_report -- --nocapture 2>&1 | grep '^layout-rust:')"
          echo "$rust_line"
          if [ "${c_line#layout-c: }" = "${rust_line#layout-rust: }" ]; then
            verdict="PASS"
          else
            verdict="FAIL"
          fi
          echo "layout-probe on ${RUNNER_OS} (${used}): the Rust types against the compiler's sizeof: ${verdict}"
          echo "layout-probe on ${RUNNER_OS} (${used}): the Rust types against the compiler's sizeof: ${verdict}" >> "$GITHUB_STEP_SUMMARY"
          [ "$verdict" = PASS ]

      # The vendored zenoh-pico C library through its build script, on this host. A GATE
      # since two consecutive hosted runs read it green on both hosts (Platform runs
      # 37147312977 and 37148862140, from the job logs). It is the build that stood
      # between a Windows host and the corpus crate and every pico-backed test, and it
      # took three fixes the runs asked for in turn: a hosted run showed the script
      # handing CMake the verbatim `\\?\` form of the vendored directory, and MSBuild
      # failing with "Cannot open source file" on every translation unit (the script
      # now asks `dunce` for the path); the next run stopped on a target with no
      # platform macro (the mapping gained a Windows arm); and bindgen's clang read
      # pico's inline function named `__asm__` as a keyword (the parse renames it). It
      # needs CMake, a C compiler and libclang, which the hosted runners carry. A red
      # here now fails the run: the vendored library stopped building on a host.
      - name: the vendored pico C library on this host (gated)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 25
        shell: bash
        run: |
          built=FAIL
          (cd crates && cargo build -p zenoh-pico-sys) && built=PASS
          echo "pico-sys-probe on ${RUNNER_OS}: the vendored zenoh-pico C library builds: ${built}"
          echo "pico-sys-probe on ${RUNNER_OS}: the vendored zenoh-pico C library builds: ${built}" >> "$GITHUB_STEP_SUMMARY"
          [ "$built" = PASS ]

      # A zenoh-pico C program against the wz cdylib, on this host. A GATE since two
      # consecutive hosted runs read it green on both hosts, forty checks and none
      # failing (Platform runs 37147312977 and 37148862140, from the job logs). It is
      # the evidence the platform tags did not have: a program compiled against
      # pico's OWN headers for this host (the ones the step above installs, with the
      # generated config), linked against the wz library in place of libzenohpico, and
      # run. A red here now fails the run: a pico-typed value was written past its
      # type, or a host-layer export stopped answering as pico's does. It covers the
      # part of the C ABI that differs by host (the mutex, condition variable, task,
      # clock, wall time and random exports), places every value pico's header types
      # between guard bytes to catch a wrong layout where it happens, and carries a
      # control that must trip the guard. It opens no session; the next step does.
      #
      # The build and run live in scripts/pico-c-program.sh, which both programs share:
      # on Windows the program is compiled with MSVC's `cl` through the Visual Studio
      # environment, the compiler pico's own build uses, because pico's Windows header
      # names an inline function `__asm__`, which a GNU-mode compiler reads as a keyword.
      - name: a zenoh-pico C program against the wz cdylib (gated)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 25
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/tests/c/pico_host_layer.c "a pico C program against the wz cdylib"

      # A zenoh-pico C program that opens SESSIONS, on this host. A GATE since two
      # consecutive hosted runs read it green on both hosts (Platform runs
      # 37151725737 and 37158440974, from the job logs). It is the session half of what
      # a pico program does, and the evidence the session surface of the C ABI needs
      # before a platform tag can claim it: a config, two sessions over the host's loopback (an
      # acceptor on a task of its own and a client dialing it), a subscriber declared
      # with a closure, a publish, and the sample the closure is handed, read as pico's
      # z_sub.c reads it. Every owned type the program declares (the config, the
      # session, the closure, the subscriber, the task) sits between guard bytes, so an
      # export that writes past the size pico's header gives it is caught where it
      # happens. Both sessions are the wz library, which is what one process can hold. A
      # red here now fails the run: a session no longer opens, or a sample no longer
      # reaches its closure, on a host it had been shown to.
      - name: a zenoh-pico C program that opens sessions (gated)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 25
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/tests/c/pico_session_loopback.c "a pico C program that opens two sessions over loopback"

      # A zenoh-pico C program that calls every public platform export of pico's header
      # (random, memory, task, mutex, condition variable, sleep, clock, wall time), on this
      # host. The host-layer program above holds the layouts; this one holds that each
      # export links (on Windows through the DLL's import library, which no ELF census reads)
      # and that the ones the host-layer program does not call answer as pico's backend for
      # the host does. It builds the library with the default features, as the two steps
      # above do, so it costs no second build; it is placed before the step below, which
      # builds another. Observed, not yet gated, as that step is, until two consecutive
      # hosted runs read it green on both hosts.
      - name: a zenoh-pico C program over every platform export (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 25
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/tests/c/pico_platform_surface.c "a pico C program over every platform export"

      # A zenoh-pico C program whose sessions open NO socket, on this host: two sessions
      # joined by an in-memory transport the program supplies through the wz extension
      # doors (wz_ext_transport_*, wz_ext.h), over a stream pair with injected partial
      # sends and would-blocks, a datagram pair and a two-member group, each carrying a
      # put and a query. It is the Windows DLL's evidence that a host program can hand the
      # library its own network stack. The cdylib is built with the app-transport
      # capability for it, which the script takes as its third argument. Observed, not yet
      # gated: `continue-on-error` reports success whatever it did, so the script's own
      # verdict line in the job summary is the reading, until two consecutive hosted runs
      # read it green on both hosts and it is made a gate as the steps above were.
      - name: a zenoh-pico C program over a transport it supplies (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 25
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/tests/c/pico_app_transport.c "a pico C program over a transport it supplies" app-transport

  # The pico C ABI on the cooperative engine, the single-threaded arm: the program drives its
  # session with `zp_read`, `zp_send_keep_alive` and `zp_spin_once` from its own loop, and every
  # callback runs on its one thread. On Windows the engine's host is `wz-runtime-posix`'s Windows
  # module (the performance counter, the system's random number generator, the precise system
  # time, Winsock); on Linux it is the POSIX host the build machines already run it on, which
  # makes the Linux row the control of the program and the script.
  #
  # Steps, in this order because each later build replaces the library of the one before in the
  # same target directory: the Windows host's own unit tests; the library on the cooperative
  # engine alone and beside a transport the program supplies, which opens no socket of the
  # host's; and a single-threaded C program run as two processes on one loopback port, a
  # listening session with a subscriber and a queryable and a client that puts and gets until
  # the answer says its put arrived (`WZ_PICO_PROGRAM_ROLES`, scripts/pico-c-program.sh).
  #
  # A job of its own and not steps of `capi`, for the reason `capi-examples` is: that job's
  # budget is spent by what it gates, and a cooperative build is a second build of the library.
  # Observed, not yet gated, as each new program has started: every step is `continue-on-error`
  # and so is the job; each verdict line in the job summary is the reading, until two
  # consecutive hosted runs read it green on both hosts.
  capi-coop:
    name: C ABI cooperative engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            host: linux
          - os: windows-latest
            host: windows
    env:
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: bash scripts/lib/rust-toolchain-pinned.sh

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          # A READER of the `leg` job's entry (class `rust-host-workspace`). The leg runs
          # on macOS and Windows only, so the Linux row finds no entry and builds cold.
          shared-key: host-workspace
          add-job-id-key: "false"
          save-if: "false"
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: Set up Python (the pico C programs' header is rendered in python)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version-file: .github/python-version

      # The vendored pico library's bindings are generated through libclang, which the Linux
      # image may not carry; installed only when none is found.
      - name: libclang for the pico bindings, where the image has none
        if: ${{ env.WZ_HOST_SELECTED == 'true' && runner.os == 'Linux' }}
        shell: bash
        run: |
          if compgen -G "/usr/lib/llvm-*/lib/libclang*.so*" > /dev/null; then
            echo "libclang: $(compgen -G '/usr/lib/llvm-*/lib/libclang*.so*' | head -n 1)"
          else
            sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libclang-dev
          fi

      - name: the cooperative engine's host and library on this host (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 30
        continue-on-error: true
        shell: bash
        run: |
          verdict() {
            echo "capi-coop on ${RUNNER_OS}: $1 $2"
            echo "capi-coop on ${RUNNER_OS}: $1 $2" >> "$GITHUB_STEP_SUMMARY"
          }
          overall=PASS
          host=FAIL
          (cd crates && cargo test -p wz-runtime-posix --lib) && host=PASS
          verdict "the host's unit tests (wz-runtime-posix):" "$host"
          [ "$host" = PASS ] || overall=FAIL
          for features in engine-coop engine-coop,app-transport; do
            built=FAIL
            (cd crates && cargo build -p wz-capi-pico --no-default-features --features "$features") && built=PASS
            verdict "wz-capi-pico builds with ${features}:" "$built"
            [ "$built" = PASS ] || overall=FAIL
          done
          [ "$overall" = PASS ]

      - name: a single-threaded pico C program on the cooperative engine (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 25
        continue-on-error: true
        shell: bash
        env:
          WZ_PICO_ENGINE: coop
          WZ_PICO_PROGRAM_ROLES: listen dial
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/tests/c/pico_coop_single_thread.c "a single-threaded pico C program on the cooperative engine" peer,query,queryable

  # The C examples of the pico C ABI (crates/wz-capi-pico/examples/c/), on Linux and on
  # Windows: the policy profile the library is built with, the three transport configs over
  # the system's sockets and over a transport the program supplies (the program's own stack,
  # and the test program with injected faults), batching, end-to-end protection, stream
  # supervision, a program's own periodic task, a keyed topic and history for a late
  # subscriber. Each is compiled against zenoh-pico's own headers for the host and linked
  # against the wz library by scripts/pico-c-program.sh, as the programs of the `capi` job
  # are, and exits 0 when it ran its exchange.
  #
  # A job of its own and not steps of `capi`: that job's budget is spent by what it gates,
  # and Linux is not one of its hosts. Every example builds the library with ONE feature list
  # (`WZ_EXAMPLE_FEATURES`, the union of what the examples' doors need), so the library is
  # built once; the profile example's second run builds it again under the other profile's
  # policy default, last, because that build replaces the first.
  #
  # Observed, not yet gated, as each new program has started: every step is
  # `continue-on-error` and so is the job, so a red or a timeout here does not fail the
  # run; each script's verdict line in the job summary is the reading. A step becomes a
  # gate once two consecutive hosted runs read it green on both hosts.
  capi-examples:
    name: C ABI examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            host: linux
          - os: windows-latest
            host: windows
    env:
      WZ_HOST_SELECTED: ${{ (inputs.host == '' || inputs.host == 'both' || inputs.host == matrix.host) && 'true' || 'false' }}
      WZ_EXAMPLE_FEATURES: app-transport,e2e-sender,e2e-receiver,e2e-supervision,instance-key,replay-cache
    steps:
      - name: Checkout (with submodules)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: bash scripts/lib/rust-toolchain-pinned.sh

      - name: Cache Cargo registry + build artifacts
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          # A READER of the `leg` job's entry (class `rust-host-workspace`). The leg runs
          # on macOS and Windows only, so the Linux row finds no entry and builds cold.
          shared-key: host-workspace
          add-job-id-key: "false"
          save-if: "false"
          workspaces: |
            crates -> target
            vendor/sce -> target

      # The vendored pico library's bindings are generated through libclang. The Linux
      # runner image carries one with its clang packages; it is installed only when none
      # is found, so the step costs nothing where it is there.
      - name: Set up Python (the pico C programs' header is rendered in python)
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version-file: .github/python-version

      - name: libclang for the pico bindings, where the image has none
        if: ${{ env.WZ_HOST_SELECTED == 'true' && runner.os == 'Linux' }}
        shell: bash
        run: |
          if compgen -G "/usr/lib/llvm-*/lib/libclang*.so*" > /dev/null; then
            echo "libclang: $(compgen -G '/usr/lib/llvm-*/lib/libclang*.so*' | head -n 1)"
          else
            sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libclang-dev
          fi

      # The group of the transport example needs an interface the host carries multicast
      # on: the loopback on Linux; on Windows, whose loopback adapter carries no group, the
      # adapter of the default route, by the name `#iface=` reads there (its adapter name,
      # the interface GUID).
      - name: name the interface the example's group is joined on
        if: ${{ env.WZ_HOST_SELECTED == 'true' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            iface="$(powershell -NoProfile -Command "(Get-NetAdapter -InterfaceIndex (Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Sort-Object RouteMetric | Select-Object -First 1).ifIndex).InterfaceGuid" | tr -d '\r')"
          else
            iface=lo
          fi
          echo "group interface: ${iface:-none}"
          echo "WZ_EXAMPLE_GROUP_IFACE=${iface}" >> "$GITHUB_ENV"

      - name: example, pub/sub and query under the upstream profile (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 50
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/profiles.c "example of pub/sub and query under the upstream profile" "$WZ_EXAMPLE_FEATURES"

      - name: example, tcp, udp and a group over the system's sockets (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/transports.c "example of tcp, udp and a group over the system's sockets" "$WZ_EXAMPLE_FEATURES"

      - name: example, tcp, udp and a group over a transport the program supplies (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/tests/c/pico_app_transport.c "example of tcp, udp and a group over a transport the program supplies" "$WZ_EXAMPLE_FEATURES"

      - name: example, tcp, udp and a group over a network stack of the program's own (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/own_transport.c "example of tcp, udp and a group over a network stack of the program's own" "$WZ_EXAMPLE_FEATURES"

      - name: example, batching on and off with a flush (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/batching.c "example of batching on and off with a flush" "$WZ_EXAMPLE_FEATURES"

      - name: example, end-to-end protection across a session (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/e2e.c "example of end-to-end protection across a session" "$WZ_EXAMPLE_FEATURES"

      - name: example, supervision of a periodic stream (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/supervision.c "example of supervision of a periodic stream" "$WZ_EXAMPLE_FEATURES"

      - name: example, a program's own periodic task (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/periodic.c "example of a program's own periodic task" "$WZ_EXAMPLE_FEATURES"

      - name: example, a keyed topic with a last value per instance (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/keyed.c "example of a keyed topic with a last value per instance" "$WZ_EXAMPLE_FEATURES"

      - name: example, history for a late subscriber then live samples (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/history.c "example of history for a late subscriber then live samples" "$WZ_EXAMPLE_FEATURES"

      # The platform exports the periodic task stands on (its timer, lock, task and event
      # wait), on the Linux row too, which the `capi` job does not run.
      - name: every platform export (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/tests/c/pico_platform_surface.c "every platform export" "$WZ_EXAMPLE_FEATURES"

      # Last: the policy's build default rebuilds the library, and every later step would
      # run against this profile instead of the upstream one.
      - name: example, pub/sub and query under the entity-timestamp-opt-in profile (observed)
        if: ${{ !cancelled() && env.WZ_HOST_SELECTED == 'true' }}
        timeout-minutes: 40
        continue-on-error: true
        shell: bash
        env:
          WZ_POLICY_ENTITY_TIMESTAMP_OPT_IN: "on"
        run: bash scripts/pico-c-program.sh crates/wz-capi-pico/examples/c/profiles.c "example of pub/sub and query under the entity-timestamp-opt-in profile" "$WZ_EXAMPLE_FEATURES"

  # The Windows release packages of the pico C ABI library (scripts/lib/pico_windows_package.py),
  # one per width of Windows, a row of the matrix each: x64 (`x86_64-pc-windows-msvc`) and x86
  # (`i686-pc-windows-msvc`, a 32-bit program, which the 64-bit runner runs as Windows runs any).
  # Each is the DLL in a debug and a release build with its import library and symbols, zenoh-pico's
  # headers with the config.h of the DLL's build and wz_ext.h, the examples, a configuration sample,
  # the usage and release notes, the licence and the notices derived from the dependency graph, and
  # a manifest of every file's SHA-256, as one deterministic zip. The feature set is the registered
  # profile `host-peer-ext` (configs/profiles/), resolved by the pinned Kconfig interpreter, which
  # is installed here by the hashes scripts/requirements-kconfig.txt pins. The Rust target of each
  # width is installed with the toolchain, from rust-toolchain.toml.
  #
  # The regression test is the zip itself: it is extracted, held to its manifest, the layout pins
  # (crates/wz-capi-pico/csrc/pico_layout_pins.c) are compiled against its headers, and every
  # example and a check program are compiled against the package's own headers and import library
  # with MSVC's cl of the package's width (`vcvarsall.bat x64` or `x86`, chosen by the manifest's
  # target) and run, for both builds. The upload follows only a passing test, so a package this
  # job publishes is one that passed it.
  #
  # Observed, not yet gated, as every new program of this workflow has started: the job is
  # `continue-on-error`, so a red here does not fail the run, and the test's verdict lines in the
  # job summary are the reading. It becomes a gate once two consecutive hosted runs read it green.
  # No Rust cache: the package is built with full debug information in both profiles, which no
  # entry of the cached workspace was built with.
  package-windows:
    name: pico library package ${{ matrix.arch }} (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true
    if: ${{ inputs.host == '' || inputs.host == 'both' || inputs.host == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: bash scripts/lib/rust-toolchain-pinned.sh

      - name: Set up Python (the packager and the configuration reader are python)
        uses: actions/setup-python@v5
        with:
          python-version-file: .github/python-version

      # The packager resolves the profile with the pinned interpreter; `wz_config.py` imports it
      # from the running python, where this puts it, by version and hash.
      - name: The pinned Kconfig interpreter
        shell: bash
        run: python -m pip install --quiet --no-deps --require-hashes -r scripts/requirements-kconfig.txt

      # The transports example joins a group on the adapter of the default route, as the C ABI
      # examples job does: the loopback adapter of Windows carries no group.
      - name: name the interface the example's group is joined on
        shell: bash
        run: |
          iface="$(powershell -NoProfile -Command "(Get-NetAdapter -InterfaceIndex (Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Sort-Object RouteMetric | Select-Object -First 1).ifIndex).InterfaceGuid" | tr -d '\r')"
          echo "group interface: ${iface:-none}"
          echo "WZ_EXAMPLE_GROUP_IFACE=${iface}" >> "$GITHUB_ENV"

      - name: build the package
        timeout-minutes: 90
        shell: bash
        run: python scripts/lib/pico_windows_package.py --build "$RUNNER_TEMP/pico-package-${{ matrix.arch }}" --profile host-peer-ext --arch ${{ matrix.arch }}

      - name: the package's regression test (its zip, extracted, verified, compiled against and run)
        timeout-minutes: 25
        shell: bash
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/pico-package-${{ matrix.arch }}"
          set -- "$out"/*-windows-${{ matrix.arch }}-*.zip
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "pico-package-test on Windows ${{ matrix.arch }}: the build left no single zip in $out: FAIL" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python scripts/lib/pico_windows_package.py --test "$(cygpath -w "$1")"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: pico-windows-package-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/pico-package-${{ matrix.arch }}/*.zip
            ${{ runner.temp }}/pico-package-${{ matrix.arch }}/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # The superseded generations of this workflow's two saved classes, deleted as
  # soon as the savers finish. The why, the least-privilege argument and the
  # rule are written once, on the `evict-superseded` job of ci.yml, and
  # `workflow_cache_budget_gate.py` holds this job's script to that one.
  evict-superseded:
    name: evict superseded cache generations
    needs:
      - leg
      - interop
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete the generations this run's saves superseded
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          # What each saver handed over: its job name and its classes' series.
          SAVERS_JQ: >-
            to_entries[]
            | select((.value.outputs.cache_spec // "") != "")
            | {job: .key, spec: (.value.outputs.cache_spec | fromjson)}
          # The pruner's superseded pass (cache_prune.py `plan`, pass 3) over the
          # series the savers name: group a class's default-branch keys by the key
          # with its generation suffix removed, keep the newest `keep`, and only
          # in a series whose newest entry this run attempt created.
          EVICT_JQ: >-
            def t: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
            [ $savers[] as $s
              | $s.spec[] as $c
              | [ $caches[]
                  | select(.key as $k | any($c.prefixes[]; . as $p | $k | startswith($p)))
                  | select(.key as $k | all($c.stale[]; . as $re | ($k | test($re)) | not)) ]
              | group_by(if $c.suffix then (.key | sub($c.suffix; "")) else $c.cls end)[]
              | sort_by([(.created_at | t), .id]) | reverse
              | select((.[0].created_at | t) >= ($started | t))
              | .[$c.keep:][]
            ] | unique_by(.id)[] | "\(.id)\t\(.size_in_bytes)\t\(.key)"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/evict"
          mkdir -p "$work"
          printf '%s' "$NEEDS" | jq -c "$SAVERS_JQ" >"$work/savers.jsonl"
          if [ ! -s "$work/savers.jsonl" ]; then
            echo "no saving job handed over a series definition; nothing to evict"
            exit 0
          fi
          if ! started="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" --jq .run_started_at)" \
            || ! gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?ref=refs/heads/main&per_page=100" \
              --jq '.actions_caches[]' >"$work/caches.jsonl"; then
            echo "::warning title=evict-superseded::the run or the cache list could not be read; nothing deleted, cache-prune.yml will apply the same rule after the run"
            exit 0
          fi
          jq -rn --arg started "$started" \
            --slurpfile savers "$work/savers.jsonl" --slurpfile caches "$work/caches.jsonl" \
            "$EVICT_JQ" >"$work/evict.tsv"
          deleted=0
          failed=0
          while IFS=$'\t' read -r id size key; do
            if ! [[ "$id" =~ ^[0-9]+$ ]]; then
              echo "::warning title=evict-superseded::refusing a cache id that is not a number: $id"
              failed=$((failed + 1))
              continue
            fi
            echo "superseded: $id ($((size / 1000000)) MB) $key"
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done <"$work/evict.tsv"
          echo "evicted $deleted superseded generation(s) right after the saves"
          if [ "$failed" -gt 0 ]; then
            echo "::warning title=evict-superseded::$failed deletion(s) failed; cache-prune.yml applies the same rule after the run"
          fi
