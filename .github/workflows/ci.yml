      # The measurement this job's own header asks for and has never had: it
      # declares "THIS JOB HAS NO OTHER DISK HEADROOM" while recording that
      # end-of-job free space is UNKNOWN rather than known-tight, and that "a
      # post-lane `df -h` would settle it". R311y424 adds a lane, so it settles
      # it. Never a gate — it reports, and the number informs whether the next
      # lane belongs here or on a new runner.
      - name: Disk headroom after the lanes (measurement, not a gate — R311y424)
        if: always()
        run: df -h /

      - name: Budget margin — this job may not approach its timeout in silence
        # R311y792 — the second job to carry this, and the FIRST that is
        # expected to trip it. See the header above for the measurement (82%
        # median, 86% max of the 2700s budget) and for why the remedy when it
        # fires is a shard split rather than a bigger number.
        #
        # The threshold is the same 90% the `ci` job uses, deliberately: this
        # job's own budget was already RAISED once (30 -> 45 at y425) and the
        # doctrine that raise predates says the next move is a split. A
        # per-job threshold tuned to sit above today's measurement would be
        # the raise again, wearing a gate's clothes.
        #
        # The disk step above is the model for what this is NOT: that one
        # reports and never fails, because free space has no ceiling this
        # workflow can enforce. Time has one, and a cancel at that ceiling
        # grades nothing.
        #
        # R311y795 — the FLOOR is 20, not the 30 y794 first wrote, and the
        # correction comes from a field measurement rather than taste. Run
        # 31751783653 put this job at 1683s where the ten-run band ending at
        # 31750463524 was 2039-2328s: the real spread is 1683-2328s, i.e. 645s
        # wide. Subtract the y793 split's 856s and the post-split band is
        # roughly 827-1472s — 31%-55% of this budget. A floor of 30% sits 17s
        # under the low end of that, so it would have fired on runner variance
        # and taught the reader to ignore it. 20% (540s) clears the band; the
        # 90% alarm (2430s) clears the high end by nearly as much.
        if: always()
        run: bash scripts/lib/job-budget-margin.sh "$RUNNER_TEMP/wz_job_start" 2700 90 20 '${{ job.status }}'

  # ─────────────────────────────────────────────────────────────────
  # R311y793 — the ROUTING + ADMINSPACE job. Eight lanes peeled off
  # `feature-gates`, which R311y792 measured at 86% of its 45-minute budget
  # (2039-2328s over 10 successful runs, median 2208s) — the same band the `ci`
  # job was in when run 31711867852 was CANCELLED rather than graded.
  #
  # WHY THESE EIGHT, and it is not "the heaviest": the feature-gates job has no
  # hot step at all (its largest, C1ay, is 227s of 2216s = 10%), so peeling by
  # size would produce a job with no name. These eight are a THEME, and the
  # theme was already chosen — the R311y426 comment still standing in that job
  # says ROUTING (C1x, C1ax, C1ay) and ADMINSPACE (C1am, C1an, C1ao) "need
  # their own runner, and now for a TIME reason that is measured rather than
  # the disk one R311y424 disproved". They were added there anyway. This is
  # that decision, executed. C1w (routing-accept) and C1y (routing-peer) join
  # them because they are the same subsystem by any reading.
  #
  # THE ARITHMETIC, from per-step timings on run 31732246052: C1w 103 + C1y 189
  # + C1x 38 + C1ax 75 + C1ay 227 + C1am 150 + C1an 38 + C1ao 36 = 856s. That
  # takes feature-gates from 2216s to ~1360s, i.e. 86% -> ~50% of its budget,
  # and it is a SPLIT rather than the raise its budget already took once
  # (30 -> 45 at y425).
  #
  # BUDGET 45, not 30, and the reason is the cache: this job's key is new, so
  # its FIRST run builds every one of these off-default feature sets cold, and
  # each is a distinct set of `crates/target` artifacts. 856s is the warm
  # number. The margin step below is what will report where it actually lands
  # rather than leaving the guess standing — which is the whole point of having
  # built it.
  routing-adminspace:
    name: routing + adminspace lanes (the subsystem feature-gates could not hold)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Budget stamp — start this job's own clock
        run: date +%s > "$RUNNER_TEMP/wz_job_start"

      - name: Checkout (with submodules)
        # `recursive`: these lanes compile wz-session-core, which resolves
        # sce_forge_runtime out of vendor/sce.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: What the runner image already ships (measurement, not a gate)
        # R311y881 — `libclang-dev` is 25.2 MB of this job's download, the
        # single largest item in the whole apt census, and it is needed because
        # `sce-forge-runtime`'s build script build-depends on `sce-build` ->
        # `libxml` -> `bindgen`. What NOBODY here can answer from a laptop is
        # whether bindgen would have found a libclang the image already ships:
        # the `clang` package came down in 3558 bytes on run 32266212482, which
        # is a metapackage, so clang-14 itself is already installed and the
        # runtime `libclang-14.so.1` may be too.
        #
        # Guessing that costs every job if it is wrong, so this measures it
        # instead and gates on nothing. The next round reads this output and
        # decides with data. `|| true` on every line and `always()` on the step
        # so a probe can never be the reason a lane goes red.
        if: always()
        run: |
          ldconfig -p | grep -i libclang || true
          ls -1 /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null || true
          dpkg -l 'libclang*' 'clang*' 2>/dev/null | grep '^ii' || true

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # No `cmake`: this job's lanes reach neither `zenoh-pico-sys` nor
        # `wz-integration-tests`, and those are the only routes to the `cmake`
        # crate in this workspace (R311y881, derived by
        # `scripts/lib/apt_package_census.py`). It is the job whose 32.3 MB was
        # killed at the 900s ceiling on run 32266212482.
        run: |
          bash scripts/lib/apt-install.sh libclang-dev libxml2-dev clang perl pkg-config

      - name: Save apt archives
        # See the `feature-gates` copy for why `always()` and why the dirty gate.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        # Its OWN key: parallel jobs must not race one cache save, the same
        # reason footprint, interop and verdict-legs each carry one.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: routing-adminspace

      - name: Layer C1w — routing-accept multi-peer accept + quic/datagram mesh pins
        run: bash scripts/run-ci.sh --layer C1w
      - name: Layer C1y — routing-peer + access-* + extauth
        run: bash scripts/run-ci.sh --layer C1y
      - name: Layer C1x — routing-routes forward tables
        run: bash scripts/run-ci.sh --layer C1x
      - name: Layer C1ax — routing-namespace
        run: bash scripts/run-ci.sh --layer C1ax
      - name: Layer C1ay — router-hat forward tables
        run: bash scripts/run-ci.sh --layer C1ay
      - name: Layer C1am — adminspace handlers
        run: bash scripts/run-ci.sh --layer C1am
      - name: Layer C1an — adminspace no-default-features
        run: bash scripts/run-ci.sh --layer C1an
      - name: Layer C1ao — config-mutate-runtime + admin json
        run: bash scripts/run-ci.sh --layer C1ao

      - name: Disk headroom after the lanes (measurement, not a gate)
        if: always()
        run: df -h /

      - name: Budget margin — this job may not approach its timeout in silence
        # R311y794 — THE FLOOR MATTERS MOST HERE, and this is the job it was
        # written for. y793 gave this job 45 minutes for its COLD first run
        # against a warm estimate of 856s, and wrote down that nothing would
        # ever make anyone lower it again. The floor is that thing: once the
        # cache is warm, the step fails and says to give the budget back, in
        # the same commit that reads it.
        #
        # R311y795 — 20 rather than 30, for the reason the feature-gates job
        # records: the warm estimate here is ~960s with prep, which is 36% of
        # this budget, and the sibling job's measured spread is 645s wide. A
        # floor of 30% (810s) would be inside that noise before it was inside
        # the signal. 20% is 540s.
        if: always()
        run: bash scripts/lib/job-budget-margin.sh "$RUNNER_TEMP/wz_job_start" 2700 90 20 '${{ job.status }}'

  transport-modes:
    name: transport-MODE lanes (the §5.1 mode axis)
    runs-on: ubuntu-22.04
    # Its OWN runner, for the reason the feature-gates job states above: every
    # lane below is a DISTINCT off-default feature set, hence a distinct set of
    # `crates/target` artifacts, and the `ci` job declares it has no disk
    # headroom left.
    #
    # R311y413 closed the transport-link-KIND axis — all 10 `transport-link-*`
    # kinds now gate hosted. This job closes the ORTHOGONAL axis: transport
    # MODES. The enumeration rule is "off-default transport-TIER atoms", which
    # is the `transport-*` keys in crates/wz/Cargo.toml minus the 10 link kinds
    # (11 modes) PLUS `reassembly`, a transport-tier atom that does not carry
    # the prefix. THREE modes ride wz-runtime-tokio's `default` set and so gate
    # through Layer C1 by construction: transport-unicast, -keepalive,
    # -batching. The remaining eight are off-default: fragmentation,
    # lowlatency, compression, shm, stats, qos, multilink, multicast.
    #
    # What "unhosted" precisely meant before this job, MEASURED per mode rather
    # than assumed (an earlier draft of this comment claimed the eight "gated on
    # NO hosted lane at all", which review falsified):
    #  - lowlatency / compression / shm / stats / multilink: nothing hosted ran
    #    a single one of their cases. Verified by running Layer C1's exact
    #    command with each subject's filter — every summary line reads 0 passed.
    #  - fragmentation, multicast, and the session-core half of qos: PARTIALLY
    #    and ACCIDENTALLY covered inside Layer C1's `cargo test --workspace`.
    #    Not because anything gates them, but because `wz-integration-tests`'
    #    dev-dependency pins (crates/wz-integration-tests/Cargo.toml:87 for
    #    wz-session-core, :118-121 for wz-runtime-tokio) unify onto the shared
    #    builds — the unification the same file's R311wq "honesty fix" records
    #    after the opposite claim proved wrong. Measured under C1's command:
    #    multicast_glue 18, qos_emit_tests 2, udp_frag_e2e 1, udp_chaos_e2e 3,
    #    layer3_reassembly_rx 4. What C1 does NOT reach, in the same builds:
    #    the runtime-side qos units (is_qos exclusivity, multilink::), every
    #    `--no-default-features` multicast-only build, the mode COMPOSITION
    #    matrices, and every clippy gate. And a dev-dep edit removes that
    #    coverage silently, because no gate declares it.
    # So the honest claim is per-SUBJECT: before this job, no hosted lane's
    # SUBJECT was a transport mode. Measured: the last fully-green hosted run
    # (30206063204, R311y413) has ZERO log lines for any of the 16 lanes below,
    # while the identical grep finds the hosted C1al / C1w / C1t lanes.
    #
    # LANE-SELECTION RULE, stated because the boundary is not self-evident: a
    # lane belongs here when its SUBJECT is a transport mode (its header names
    # the mode) or when it is a mode-COMPOSITION matrix. Lanes that merely
    # compose a mode while being about something else stay out — C1m (the lwIP
    # platform port, seven transport-multicast arms), C1n (the MCU acceptor, a
    # reassembly arm) and C3 (the per-package --all-targets matrix, three
    # multicast clippy combos). R311y414 recorded them here as "a real
    # remaining gap, in the isolated-platform-crate genre rather than this
    # one", and R311y419 closed that gap the way the rule implies: they are
    # hosted, on their OWN `isolated-crates` job, not admitted to this one.
    # The selection rule is unchanged; only the "and stay local-only" half of
    # the old sentence is now false and is retracted here.
    #
    # Hosting a lane only helps if the lane can go red, so R311y414 hardened
    # these first, through the `_runci_guarded_test` helper in run-ci.sh: 47
    # guarded steps across the 16 lanes, each asserting `^test result: ok\. N
    # passed` at its MEASURED count. 32 of them were previously BARE, 12 are
    # new subject-scoped runs, and 3 replace an older inline `grep -q` form.
    # The hazard is exact: `cargo test <filter>` exits 0 when the filter matches
    # nothing, and an `--ignored` run selects nothing the moment its
    # `#[ignore]` is dropped. Eight unfiltered whole-crate runs across four
    # lanes stay BARE on purpose (C1l x4, C1p x2, C1r, C1s — 126 summary lines
    # between them, where neither an exact count nor `>=1` asserts anything),
    # but each of those
    # lanes now ALSO runs its own subject target-scoped and guarded, which is
    # what a whole-crate exit code cannot show. Every guard shape was falsified
    # locally: perturb a count, a filter, a feature or an `#[ignore]` and the
    # lane reddens with cargo's output intact.
    #
    # All 16 are pure cargo on ubuntu-22.04 with NO foreign-binary prerequisite
    # — no zenohd, no zenoh-pico CLI, no vsock module — which is what matters
    # here, because a lane with such a prerequisite could SKIP green. Three of
    # them do drive a C toolchain through cargo (C1r cc-builds lwIP from
    # vendor/lwip; E6c/E6d build wz-integration-tests, whose dev-deps cmake-build
    # vendor/zenoh-pico), which is why the recursive checkout and the cmake /
    # clang / perl install below are load-bearing, not boilerplate. No lane
    # touches a real multicast socket: the multicast lanes drive recording links
    # and in-process channels, so none depends on runner multicast behaviour.
    # Layer M (active-scouting multicast loopback) stays out of THIS job, but is
    # no longer unhosted: R311y421 wired it onto the `interop` job, which already
    # builds the zenoh-pico CLI its witnesses need, with WZ_M_REQUIRE=1. It was
    # kept opt-in until then on a flakiness rationale about CI CONTAINERS, which
    # hosted runners are not; the lane now runs a multicast preflight so an
    # environment failure there is legible rather than a mystery red. run-ci.sh
    # still treats it as opt-in for LOCAL sweeps, which is why it is absent from
    # the lane list below.
    #
    # Cost, measured not guessed, and calibrated against a real hosted run
    # rather than a single warm sample. Local medians over this repo's own
    # ~490 archived run-ci logs (n=66-76 per lane) total 184s for the 16;
    # p90 totals 523s. The reference point: the feature-gates job's 15 lanes
    # have the SAME 184s local-median total and took 604s hosted on run
    # 30206063204, i.e. hosted ~= 3.3x local median (rust-cache prunes
    # workspace-member artefacts, so "warm" never applies hosted). That
    # projects ~10 min typical and ~29 min at p90 for this job — hence the
    # 45-minute budget rather than feature-gates' 30. Tail lanes, in order:
    # C1ba (med 39s / p90 178s), C1bb, C1bc, C1l.
    timeout-minutes: 45
    steps:
      # The `ci` job's remedy after R311y296 died with `No space left on
      # device`, applied here for the same reason it was applied there: this
      # job's lanes are the disk-heaviest in the workflow after `ci` itself —
      # C1l runs whole-package `cargo test -p wz-runtime-tokio` under two
      # distinct feature sets, linking all 58 of that crate's test targets each
      # time, and C1p does the same for wz-session-core. The `df -h` bracket is
      # not decoration: the original failure was undiagnosable precisely because
      # nothing ever reported free space.
      - name: Free runner disk space (headroom for the mode-matrix lanes)
        run: |
          echo "=== free space BEFORE prune ==="
          df -h /
          # `|| true` throughout: a path absent on a future runner image must
          # not fail the build — this step is headroom, not a gate.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "=== free space AFTER prune ==="
          df -h /

      - name: Checkout (with submodules)
        # `recursive` is load-bearing three times over here: wz-session-core
        # compiles against sce_forge_runtime from vendor/sce, C1r cc-builds lwIP
        # from vendor/lwip, and E6c/E6d pull wz-integration-tests whose dev-deps
        # cmake-build vendor/zenoh-pico. A narrowed checkout breaks those lanes.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # cmake + clang/libclang are for those two C builds (bindgen included);
        # perl matches the sibling job's set.
        run: |
          bash scripts/lib/apt-install.sh cmake libclang-dev libxml2-dev clang perl pkg-config

      - name: Save apt archives
        # `always()`: the job this exists for is the one a slow mirror REDS, and
        # actions/cache's combined action cannot save "as the workflow failed in
        # between" (its own save/README.md). Without this a cold red run throws
        # its partial download away, the cache never warms, and the fix never
        # engages — the bootstrap would depend on a green run.
        #
        # Gated on WZ_APT_CACHE_DIRTY, which `apt-install.sh` sets only when the
        # archive actually gained bytes, so a warm fleet does not re-upload ~35 MB
        # per job per run into a 10 GB repo-wide cap and evict the Rust caches.
        # The run_id suffix makes each save a NEW entry: saving under a key that
        # already exists is a no-op, which would freeze a partial archive forever.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      # ─── the single-mode lanes ───────────────────────────────────────────
      - name: Layer C1ad — transport-lowlatency ext + lean tx/rx + e2e (R311y414)
        run: bash scripts/run-ci.sh --layer C1ad
      - name: Layer C1ae — transport-compression lz4 wrap + ext 0x6 + e2e (R311y414)
        run: bash scripts/run-ci.sh --layer C1ae
      - name: Layer C1af — transport-shm provider + live swap + e2e (R311y414)
        run: bash scripts/run-ci.sh --layer C1af
      - name: Layer C1ak — transport-stats per-session counters (R311y414)
        run: bash scripts/run-ci.sh --layer C1ak
      - name: Layer C1l — transport-fragmentation / reassembly subsystem (R311y414)
        run: bash scripts/run-ci.sh --layer C1l

      # C1ag is the 3-way COMPOSITION (lowlatency + compression + shm on one
      # session) that no single-mode lane can prove.
      - name: Layer C1ag — transport-advanced 3-way composition (R311y414)
        run: bash scripts/run-ci.sh --layer C1ag

      # ─── multicast: session FSM, runtime glue, and the multicast-ONLY
      # Session surface (a crate that exists because `transport-unicast` must
      # stay out of the feature unification) ───────────────────────────────
      - name: Layer C1p — multicast session FSM + dispatcher (R311y414)
        run: bash scripts/run-ci.sh --layer C1p
      - name: Layer C1q — multicast transport drive loop (R311y414)
        run: bash scripts/run-ci.sh --layer C1q
      - name: Layer C1s — multicast-only Session surface, isolated crate (R311y414)
        run: bash scripts/run-ci.sh --layer C1s
      - name: Layer C1r — MCU multicast e2e, isolated crate (R311y414)
        run: bash scripts/run-ci.sh --layer C1r
      - name: Layer C4e — transport-axis (multicast WITHOUT unicast) build+clippy (R311y414)
        run: bash scripts/run-ci.sh --layer C4e

      # ─── qos + multilink, including their cross-mode compositions ────────
      - name: Layer C1bb — transport-qos ext_qos wire + per-priority SN conduits (R311y414)
        run: bash scripts/run-ci.sh --layer C1bb
      - name: Layer C1bc — multicast per-priority QoS conduit activation (R311y414)
        run: bash scripts/run-ci.sh --layer C1bc
      - name: Layer C1ba — transport-multilink N-link aggregation (R311y414)
        run: bash scripts/run-ci.sh --layer C1ba

      # The two DEMO-BINARY mode lanes: everything above drives libraries, these
      # two drive a real `wz-ap-demo --peer` process pair over loopback. wz<->wz
      # only (no pico/zenohd prereq, so no SKIP path can quietly green them).
      - name: Layer E6c — multilink aggregation from the demo binary (R311y414)
        run: bash scripts/run-ci.sh --layer E6c
      - name: Layer E6d — prioritized publish over aggregated multilink (R311y414)
        run: bash scripts/run-ci.sh --layer E6d

  isolated-crates:
    name: isolated-crate lanes (what --workspace unification cannot express)
    runs-on: ubuntu-22.04
    # Its OWN runner, for the reason the two sibling genre jobs state: every
    # lane here is a DISTINCT feature set and so a distinct set of
    # `crates/target` artifacts, and the `ci` job declares it has no disk
    # headroom left. Measured for these three specifically: a fresh
    # CARGO_TARGET_DIR carrying exactly C3 + C1m + C1n reaches 1.7G.
    #
    # THE GENRE, which is what makes this a third job rather than a step bolted
    # onto an existing one. The transport-modes job states its lane-selection
    # rule and then names these three as OUT of it — "a real remaining gap, in
    # the isolated-platform-crate genre rather than this one". That is the gap
    # this job closes, and the rule here is the complement: a lane belongs when
    # its subject is a crate that CANNOT participate in the `--workspace`
    # feature unification, or a matrix that exists because that unification
    # MASKS what isolation would surface.
    #  - C1m (wz-session-lwip) and C1n (wz-mcu-session-acceptor) are the first
    #    kind, and the exclusion is structural, not a preference: both force
    #    `wz-session-core/no_std` through non-optional deps, which is mutually
    #    exclusive with the std sce-rust-runtime (`http-send`) wz-runtime-tokio
    #    pulls. sce-rust-runtime's own `compile_error!` fires if both land in
    #    one unified graph, so Layers C1 and C2 EXCLUDE these crates by
    #    construction — `-p` here is the only way they are ever built.
    #  - C3 is the second kind: `cargo clippy --workspace` (Layer C2) resolves
    #    features unified, which re-enables sibling features and hides
    #    preset-isolated lint failures. C3 lints the same crates at their own
    #    boundary.
    #
    # R311y419 hosted C3 + C1m + C1n and recorded that C4c / C4d (the
    # wz-runtime-tokio arbitrary-subset BUILD and CLIPPY matrices, the
    # R311y332 gap) and C1bf were the same genre and still local-only.
    # R311y420 hosts those three as well, so the genre this job names is now
    # covered and hosted lanes go 73 -> 76 -> 79 of 107. That is a claim about
    # THIS genre only — 28 lanes remain local-only in others (§5.25 ext-pubsub,
    # adminspace, storage, routing, and the singletons), and R311y413 recorded
    # "class closed" being overclaimed twice, so enumerate before extending it.
    #
    # Hosting only helps if the lane can go red, so R311y419 hardened C1m and
    # C1n first — 15 `_runci_guarded_test` steps at measured counts. The hazard
    # is not hypothetical here: `cargo test -p wz-mcu-session-acceptor --test
    # host_acceptor_reassembly_e2e` WITHOUT `--features reassembly` exits 0
    # reporting `0 passed`, so the three reassembly binaries were one cfg slip
    # away from silently testing nothing. Every guard shape was falsified
    # locally by perturbing a count, a feature or a target name (9/9 red).
    # C3 carries no guard and needs none — it is `clippy -- -D warnings` end to
    # end, which has no "selected nothing" state to hide in.
    #
    # Cost, by the method the transport-modes job established: local MEDIANS
    # over this repo's ~560 archived run-ci logs (n=64-66 per lane) total 39s
    # for the three (C3 15s, C1m 19s, C1n 5s), p90 62s. At that job's measured
    # hosted/local-median ratio of ~3.3x that projects ~2.1 min typical and
    # ~3.4 min at p90 — and an independent cold measurement (fresh target dir,
    # the three run sequentially) totals 129s, which lands on the same number
    # from the other side. 30 minutes is therefore generous, and deliberately
    # so: the budget is sized for the genre's growth, not for these three.
    timeout-minutes: 30
    steps:
      - name: Free runner disk space (headroom for the isolated feature sets)
        run: |
          echo "=== free space BEFORE prune ==="
          df -h /
          # `|| true` throughout: a path absent on a future runner image must
          # not fail the build — this step is headroom, not a gate.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "=== free space AFTER prune ==="
          df -h /

      - name: Checkout (with submodules)
        # `recursive` is load-bearing twice: wz-session-core compiles against
        # sce_forge_runtime from vendor/sce, and C1m/C1n cc-build lwIP from
        # vendor/lwip. A narrowed checkout breaks every lane below.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # The sibling genre jobs' set, carried over verbatim rather than
        # minimised. Only the clang half is KNOWN to be load-bearing here —
        # lwip-sys runs bindgen (crates/lwip-sys/Cargo.toml:58) — and this job
        # cmake-builds nothing. It is kept whole anyway: trimming it trades a
        # few seconds of apt for a first-run red on a dependency this job has
        # never been observed to need or not need.
        run: |
          bash scripts/lib/apt-install.sh cmake libclang-dev libxml2-dev clang perl pkg-config

      - name: Save apt archives
        # `always()`: the job this exists for is the one a slow mirror REDS, and
        # actions/cache's combined action cannot save "as the workflow failed in
        # between" (its own save/README.md). Without this a cold red run throws
        # its partial download away, the cache never warms, and the fix never
        # engages — the bootstrap would depend on a green run.
        #
        # Gated on WZ_APT_CACHE_DIRTY, which `apt-install.sh` sets only when the
        # archive actually gained bytes, so a warm fleet does not re-upload ~35 MB
        # per job per run into a 10 GB repo-wide cap and evict the Rust caches.
        # The run_id suffix makes each save a NEW entry: saving under a key that
        # already exists is a no-op, which would freeze a partial archive forever.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: Layer C3 — per-package isolated --all-targets clippy (R311y419)
        run: bash scripts/run-ci.sh --layer C3

      - name: Layer C1m — wz-session-lwip isolated test + clippy (R311y419)
        run: bash scripts/run-ci.sh --layer C1m

      - name: Layer C1n — wz-mcu-session-acceptor isolated e2e + clippy (R311y419)
        run: bash scripts/run-ci.sh --layer C1n

      # R311y420 — the MATRIX half of this job's genre, and the close of the
      # R311y332 gap R311y419 explicitly left open rather than papering over.
      # C4c / C4d build and clippy wz-runtime-tokio under each of the 10
      # coherent consumer-plane subsets, which `--workspace` unification can
      # only ever evaluate as their union; C1bf clippies that crate at
      # --all-features, the combination Layer C2's default-feature run never
      # composes. Hardened first, same rule as y419: all three matrices read
      # their subset list through a process substitution whose exit status the
      # reading loop cannot see, so an empty SSOT would have passed as a green
      # matrix over zero rows. A discovery floor now reds that, verified by
      # neutering the producer (0 subsets -> both lanes red). The floor was
      # applied to C1j too, which has been hosted since R311y318 carrying the
      # identical hole.
      - name: Layer C4c — wz-runtime-tokio subset BUILD matrix (R311y420)
        run: bash scripts/run-ci.sh --layer C4c

      - name: Layer C4d — wz-runtime-tokio subset CLIPPY matrix (R311y420)
        run: bash scripts/run-ci.sh --layer C4d

      - name: Layer C1bf — wz-runtime-tokio --all-features clippy (R311y420)
        run: bash scripts/run-ci.sh --layer C1bf

      # R311y612 (§5.11) — the same genre as C3 above and hosted for the same
      # reason: `--workspace` unification re-enables `wz-capture/reassembly`
      # from wz-runtime-tokio, so the crate's feature-poor build is a state NO
      # other job in this file can reach. R311y609 found that build broken and
      # fixed it with nothing left behind to notice a regression; this is that
      # gate. ~3s locally, and it pins the SET of framing tests present rather
      # than a count, so a `#[cfg]` that quietly drops one reds it (falsified
      # by gating a test behind `reassembly`: red, named).
      - name: Layer C1bt — wz-capture --no-default-features (R311y612)
        run: bash scripts/run-ci.sh --layer C1bt

      # R311y665 (§1.2a) — the analyzer's COMMAND LINE, which had no lane at
      # all: `cargo test --workspace` builds and runs `wz-analyze`, and that is
      # exactly the coverage this project has repeatedly found invisible when it
      # stops. This one links the BINARY (`--bins`, which `cargo test` does not)
      # and pins the SET of binary-level test names, so a test that quietly
      # stops being compiled reds instead of leaving. Falsified by renaming one:
      # red, named.
      - name: Layer C1bw — the wz-analyze command line (R311y665)
        run: bash scripts/run-ci.sh --layer C1bw

      # R311y668 — and the decryptor's own lane. MEASURED when the reason set
      # grew: `wz-tls-record` was in run-ci.sh ZERO times, so the only place in
      # this workspace where wz's AEAD path is checked against an implementation
      # that is not wz's own was reached solely through `cargo test --workspace`.
      # An integration target that stops being compiled contributes zero to a
      # summary line, and the differential silently becomes wz agreeing with
      # itself. Builds the crate isolated and pins the SET of oracle test names.
      - name: Layer C1bx — the TLS decryptor vs rustls (R311y668)
        run: bash scripts/run-ci.sh --layer C1bx
      - name: Layer C1bz — the analyzer crates' docs resolve (R311y710)
        run: bash scripts/run-ci.sh --layer C1bz

      # R311y701 — the REPLAY engine's lane, which R311y700 wrote into
      # run-ci.sh and never wired here. Found by C0's own unwired-lane gate on
      # the very next round, which is the third time that gate has caught a lane
      # that ran only in a local full sweep. `wz-replay` is the one crate in
      # this workspace that can put packets on a network, so an ungated one is
      # the worst candidate for coverage nobody runs.
      - name: Layer C1by — the replay engine (R311y700)
        run: bash scripts/run-ci.sh --layer C1by

  capi-c-arms:
    name: §5.27 api-compat-c — the ABI arms and the SHM oracle (C1ce + arms gate)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── why this is its OWN job ─────────────────────────────────────────
      #
      # R311y542. Both checks below need zenoh-c built from SOURCE, which pulls
      # the whole zenoh dependency graph: the SHM oracle is one such build and
      # the four-arm size gate is four more. On a COLD cache that is tens of
      # minutes, and putting it in the `ci` job would add all of it to the lane
      # every other gate waits behind. Warm it is free — both artifacts are pure
      # functions of (zenoh-c version, script content, pinned toolchain), which
      # is the same argument the existing zenoh-c oracle cache makes.
      #
      # It needs no zenohd. R311y543 added the pico CLIs to what it DOES need:
      # Layer C1ce grew five RUN legs, and two of them put a real zenoh-pico
      # binary on the far side as the foreign counterparty — which is what makes
      # their agreement an agreement on the wire rather than on a library. The
      # earlier form of this note said "NO pico CLIs"; that is why the build step
      # below now exists.

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # cmake + pkg-config are what `build-zenoh-pico-cli.sh` and the pinned
        # Mbed TLS it provisions need. Deliberately NOT `libmbedtls-dev` —
        # pico's `Z_FEATURE_LINK_TLS` arm resolves Mbed TLS through pkg-config
        # and Ubuntu's package ships no `.pc` at all, so the distro package
        # would satisfy the compiler and still fail pico's configure step.
        #
        # R311y865 WIDENED the list to the `ci` job's, and the reason is Layer
        # C1cc moving here: it builds `wz-capi-c` through cargo, whose graph
        # reaches zenoh-pico-sys (cmake crate + bindgen). A narrow list was right
        # while this job only ran C1ce and the arms gate; it stopped being right
        # the moment a cargo lane arrived.
        run: |
          bash scripts/lib/apt-install.sh cmake libclang-dev libxml2-dev clang perl pkg-config

      - name: Save apt archives
        # See the `feature-gates` copy for why `always()` and why the dirty gate.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Build zenoh-pico CLI binaries (Layer C1ce foreign-counterparty dep)
        # The FOREIGN half of two C1ce legs: `z_pub` drives upstream's
        # `z_sub_shm.c` and `z_advanced_pub` drives its `z_advanced_sub.c`, so
        # the party on the wire opposite wz shares no code with either arm.
        # Built BEFORE the C1ce step for the ordinary reason — `zenoh_pico_cli_binary`
        # asserts the binary exists, and C1ce runs under WZ_C1CE_REQUIRE=1, so an
        # absent CLI is a red rather than a skip.
        run: bash scripts/build-zenoh-pico-cli.sh

      - name: Cache the zenoh-c oracle (pinned 1.10.0)
        # SAME key as the `ci` job's, deliberately: `install-zenoh-c.sh` clones
        # the whole zenoh-c REPOSITORY into ~/zenoh-c-ref (not just its
        # examples), which is exactly the source checkout both checks below
        # need. Sharing the key means whichever job runs first populates it for
        # the other rather than each paying for its own clone.
        id: zenoh-c-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/include
            ~/.local/lib/libzenohc.so
            ~/zenoh-c-ref
          key: zenoh-c-1.10.0-ubuntu-22.04-${{ hashFiles('scripts/install-zenoh-c.sh') }}

      - name: Provision the zenoh-c oracle (cache miss only)
        if: steps.zenoh-c-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-zenoh-c.sh

      - name: Install zenoh-c's OWN pinned toolchain
        # Read out of the checkout rather than hardcoded, so an upstream pin bump
        # moves this with it. It is NOT wz's pin: the two projects pin different
        # channels, and R311y540 measured why it matters — `z_owned_task_t` was
        # 32 bytes under zenoh-c's then-1.85.0 and 24 under 1.97.0, so a size
        # table built with the wrong compiler describes an ABI upstream does not
        # ship. (R2229 moved the zenoh-c pin to 1.10.0; the reason survives the
        # example, which is why the channel is read out of the checkout.)
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^ *channel *= *"\([^"]*\)".*/\1/p' \
            "$HOME/zenoh-c-ref/rust-toolchain.toml" | head -1)"
          test -n "$channel" || { echo "no pinned channel in zenoh-c's rust-toolchain.toml" >&2; exit 1; }
          echo "zenoh-c pins $channel"
          rustup toolchain install "$channel" --profile minimal

      - name: Cache the shared-memory zenoh-c oracle
        id: zenoh-c-shm-cache
        uses: actions/cache@v4
        with:
          path: target/zenoh-c-shm
          key: zenoh-c-shm-1.10.0-ubuntu-22.04-${{ hashFiles('scripts/install-zenoh-c-shm.sh') }}

      - name: Provision the shared-memory zenoh-c oracle (cache miss only)
        if: steps.zenoh-c-shm-cache.outputs.cache-hit != 'true'
        # The colour-vs-parser trap that reded this job from R311y542 to
        # R311y559 is fixed inside the SCRIPT, not here — see
        # `scripts/install-zenoh-c-shm.sh`. Left as a pointer so a future
        # reader of the workflow-wide `CARGO_TERM_COLOR: always` (line 56)
        # finds the interaction instead of rediscovering it.
        run: bash scripts/install-zenoh-c-shm.sh

      - name: Cache the opaque-type size tables
        # Only the generator's STDERR is cached, not its target dirs. The stderr
        # IS the artifact — `check-capi-c-opaque-arms.sh` reuses any arm whose
        # file already carries size records — and it is a few tens of kilobytes
        # against gigabytes of build output.
        id: capi-c-arms-cache
        uses: actions/cache@v4
        with:
          path: target/zenoh-c-opaque/*.stderr
          key: capi-c-opaque-1.10.0-ubuntu-22.04-${{ hashFiles('scripts/check-capi-c-opaque-arms.sh') }}

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target

      - name: api-compat-c — all four ABI arms against upstream's own size table
        # WZ_CAPI_C_ARMS_REQUIRE=1 because THIS job provisions what the script
        # needs: without it an absent checkout is a SKIP, and a skip is green —
        # the masked-skip burn this tree has taken twice.
        #
        # Run directly rather than through `run-ci.sh --layer C1cc`, which is now
        # a step of its own below. The WZ_C1CC_OPAQUE_ARMS flag inside that lane
        # stays for local runs.
        #
        # R311y865 CORRECTED this note rather than deleting it. It used to end
        # "C1cc's other legs need the pico CLIs, which this job deliberately does
        # not build" — false since R311y543 added the pico CLI build four steps
        # above, and false in the direction that matters: it is the sentence that
        # says C1cc cannot live here, sitting in the job C1cc belongs in. The
        # same class as the two comments R311y864 fixed in `link.rs`, and the
        # reason this move looked impossible until the step list was read.
        env:
          WZ_CAPI_C_ARMS_REQUIRE: "1"
        run: bash scripts/check-capi-c-opaque-arms.sh

      - name: api-compat-c — WHY each footprint is that number (R2239, item 586)
        # The step above answers "is the number right". This answers "is it
        # right for the reason the crate states", which is a different question
        # and the one that went unasked: `REPLY_ERR_SIZE` was
        # `BYTES_SIZE + ENCODING_SIZE`, justified by a COMMENT naming upstream's
        # two-field `ReplyError`. zenoh 1.10.0 gave that struct a third field
        # under `unstable`, the comment stayed, and nothing reads a comment —
        # the size error surfaced two rounds later as this job going red.
        #
        # It runs HERE because it is the only job carrying both inputs: zenoh-c's
        # source checkout (upstream's own `get_opaque_type_data!` declarations)
        # and the four generator tables the step above leaves on disk. Absent
        # either it FAILS rather than skipping, and it refuses a read of three
        # tables out of four, because the moving-type population is derived from
        # all of them and a partial derivation under-reports it.
        run: python3 scripts/lib/capi_c_abi_provenance.py

      - name: Layer C1cc — §5.27 api-compat-c, the zenoh-c drop-in
        # R311y498, and R311y865 MOVED IT HERE from the `ci` job. It cost 202s of
        # a job that was running at 91% of its 1800s ceiling, and every
        # provisioning step it needs — the pico CLIs, the zenoh-c oracle on the
        # SAME cache key — was already being paid for in this job. So the move
        # is 202s off the job that could not afford it and ~0s onto the one that
        # can, which is the cheapest form the y791 split ever takes: not a new
        # job, but a lane going to the job it was always named after.
        #
        # IT ALSO DISSOLVES AN ORDERING HAZARD rather than carrying it along.
        # `run-ci.sh`'s Layer E sweep excludes the `capi_c` family because C1cc
        # picks the `libwz_capi_c.so` ABI arm and Layer C4 later rebuilt that
        # same path with DEFAULT features, with C4 sitting between them in the
        # `ci` job. C1cc and Layer E are now in different jobs and C4 is in
        # neither's way, so the artifact cannot be clobbered between producer and
        # consumer at all. The `--skip capi_c` token STAYS — Layer C0's naming
        # gate lists it, and C1cc still owns those four legs, so running them
        # twice would be the R311y838 double-run.
        #
        # WZ_C1CC_REQUIRE=1 because this job PROVISIONS the oracle above: without
        # it an absent oracle is a SKIP, and a skip is green — the R311y265
        # masked-skip burn that R311y495 caught C1bp committing for two rounds. If
        # the provisioning step ever silently yields nothing, this lane reds
        # instead of passing.
        #
        # Three bound properties, each shown by its own damage: the LAYOUT gate
        # compares wz's type footprints against what a C compiler measures from
        # the INSTALLED header (the crate's own const assertions cannot see the
        # header move — they only check that file against itself); the DROP-IN leg
        # compiles upstream's own z_put.c against upstream's own header and links
        # it BOTH ways, requiring one wz subscriber to observe both arms; and the
        # COVERAGE report prints how many upstream examples link, so a slice stays
        # a measured fraction rather than a declared milestone.
        env:
          WZ_C1CC_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer C1cc

      - name: Layer C1ce — api-compat-c against the SHARED-MEMORY oracle
        # WZ_C1CE_REQUIRE=1 for the same reason, and the number this prints is
        # the honest one: against this oracle the denominator is the WHOLE
        # corpus (21 of 29 at R311y541), where the default oracle can only ever
        # report 22 of 22 with seven examples excluded for not compiling.
        env:
          WZ_C1CE_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer C1ce

  # ─────────────────────────────────────────────────────────────────
  # R311y865 (unregistered debt 249) — the lanes that SPAWN A BINARY.
  #
  # WHY SPLIT AT ALL. `job-budget-margin.sh` fired on the `ci` job at 91% of its
  # 1800s budget on two consecutive runs with every lane above it green, and its
  # own message names the remedy and forbids the easy one: split a lane out, do
  # not raise `timeout-minutes`, because the cost grows monotonically in atom
  # count and a bigger number re-arms the same failure one atom later. This is
  # the third such peel — Layer C0mut left in y791 and the routing/adminspace
  # lanes in y793 — and the shape is by now the workflow's normal answer.
  #
  # WHY THESE EIGHT AND NOT THE EIGHT SLOWEST. The cut is by what a lane NEEDS,
  # not by what it costs. Every lane here spawns `wz-ap-demo` (Layer E also
  # spawns a zenoh-pico CLI) and waits on a real process, so each needs a demo
  # BUILD that no cargo-test lane in the `ci` job needs, and each pays a
  # process-lifecycle cost that no cargo-test lane pays. Splitting on the
  # dependency means the remaining `ci` job is one thing — `cargo test` and its
  # feature matrices — and this job is the other. A split by wall-clock alone
  # would have taken Layer C1 and left the demo build behind for one lane.
  #
  # WHY NOT THE INTEROP JOB, which also spawns binaries: these lanes are
  # self-contained wz<->wz (bar Layer E), and `interop`'s whole subject is a
  # FOREIGN counterparty. Its 120-minute budget exists for provisioning zenohd
  # and pico that these lanes do not need, and folding them in would put lanes
  # that finish in seconds behind a job that legitimately runs for twenty
  # minutes.
  #
  # BUDGET. The moved lanes measured 231s in run 32155180723 (E 122, E3 26,
  # E4 4, E4i 3, E5 9, E5u 7, E7u 30, E6u 9, plus the demo build). Setup here is
  # the same ~420s the `ci` job pays, so ~11 minutes cold. 20 minutes with a
  # floor of 30% — the floor is the y794 rule and it is a claim: if this job
  # ever drops under 6 minutes its budget should come back down, and if it grows
  # past 18 it should split again rather than be topped up.
  #
  # R311y892 — IT DROPPED, and the claim above is being honoured rather than
  # topped up. The floor fired on runs 32323298824 and 32321994673 at 29% of
  # 1200s, which is the gate working: a budget a job never approaches is not a
  # gate. MEASURED over the six runs ending at 77753278 — 349, 364, 375, 378,
  # 395, 418s — so this job costs 5.8 to 7.0 minutes and was straddling its own
  # floor, greening or redding on runner noise alone. 15 minutes puts the
  # fastest of those at 39% and the slowest at 46%, clear of both edges, and
  # re-states the claim at a number this job could actually reach: under 4.5
  # minutes, give the budget back again.
  e2e-demo:
    name: demo-spawning e2e lanes (Layers E + E3..E6u)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Budget stamp — start this job's own clock
        # Same reason the `ci` job stamps: `timeout-minutes` measures from when
        # the job starts, and the margin gate has to measure the same interval
        # or it is grading something else.
        run: date +%s > "$RUNNER_TEMP/wz_job_start"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        run: |
          bash scripts/lib/apt-install.sh cmake libclang-dev libxml2-dev clang perl pkg-config

      - name: Save apt archives
        # See the `feature-gates` copy for why `always()` and why the dirty gate.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        # Its OWN key, on the same reasoning validate-codegen and interop carry
        # theirs: this job's build set is the demo binary under four different
        # feature combinations, which is not the `ci` job's set, and a shared key
        # across differing sets thrashes.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
          key: e2e-demo

      - name: Build zenoh-pico CLI binaries (Layer E dep)
        # Layer E spawns target/zenoh-pico-cli/z_put against the wz-ap-demo
        # binary's TCP --listen endpoint. Built from the vendored submodule;
        # the Swatinem cache covers `crates -> target` only, so this is every run.
        run: bash scripts/build-zenoh-pico-cli.sh

      - name: Build wz-ap-demo binary (Layer E dep)
        run: (cd crates && cargo build -p wz-ap-demo)

      - name: Layer E — wz-ap-demo round-trip vs zenoh-pico z_put
        run: bash scripts/run-ci.sh --layer E

      - name: Layer E3 — multi-peer router e2e (routing-router foundation)
        # R311qa — builds wz-ap-demo with --features routing-router (additive)
        # and runs the self-contained wz<->wz router e2e (one router + two
        # initiators); host-only, no external binary.
        run: bash scripts/run-ci.sh --layer E3

      - name: Layer E4 — routing-router reject gate (default build rejects --router)
        # R311qa — the negative catalog-truthfulness gate: builds the DEFAULT
        # wz-ap-demo and asserts it rejects --router with exit 2. Rebuilds the
        # default binary after E3's --features routing-router build, so the
        # binary at the shared path matches the variant each lane asserts. THE
        # ORDER E3 -> E4 IS LOAD-BEARING and moved with them.
        run: bash scripts/run-ci.sh --layer E4

      - name: Layer E4i — INERT-reporting gate (default build reports advanced/group flags inert)
        # R311y448 — E4's opposite contract on the same DEFAULT binary: the
        # advanced/group CLI is feature-uniform, so instead of rejecting these
        # flags the demo drops the capability and reports it naming the missing
        # feature. Until this lane the `#[cfg(not(feature = ...))]` arms compiled
        # everywhere and ran nowhere. Self-contained wz<->wz, no external runner.
        run: bash scripts/run-ci.sh --layer E4i

      - name: Layer E5 — router data-plane forwarding e2e (routing-routes)
        # R311qc — the data-plane counterpart to E3: builds wz-ap-demo with
        # --features routing-routes and asserts the router forwards a Put across
        # faces (producer -> router -> matching subscriber). Self-contained
        # wz<->wz, no external runner like E3/E4.
        run: bash scripts/run-ci.sh --layer E5

      - name: Layer E5u — router forwarding e2e OVER UNIXPIPE (routing-routes)
        # R311y395 — the acceptor-concurrency counterpart of the Layer Z
        # dialer-concurrency leg: builds wz-ap-demo with --features
        # routing-routes,transport-link-unixpipe and asserts a wz --router
        # unixpipe/<base> forwards a Put between TWO concurrent --connect
        # unixpipe clients (wz is the multi-client routing listener over IPC).
        # Self-contained wz<->wz, no external oracle; unixpipe is Linux-only and
        # this runner is ubuntu, so the lane's Linux guard never SKIPs here.
        run: bash scripts/run-ci.sh --layer E5u

      - name: Layer E7u — router-hat (true Router) forwarding OVER UNIXPIPE
        # R311y396 — the product-code counterpart of E5u. run_router_hat's
        # addressing seam is made non-IP safe (a non-IP listen requires an
        # explicit --zid), so a wz --router-hat (a true WhatAmI::Router) binds a
        # unixpipe listener and forwards a Put between two distinct-zid
        # --connect unixpipe clients. unixpipe is Linux-only and this runner is
        # ubuntu, so the lane's Linux guard never SKIPs here.
        run: bash scripts/run-ci.sh --layer E7u

      - name: Layer E6u — peer (WhatAmI::Peer) forwarding OVER UNIXPIPE
        # R311y397 — the peer run-mode counterpart of E5u/E7u. run_peer gains a
        # --zid override and a non-IP-safe addressing seam, so a wz --peer binds
        # a unixpipe listener and forwards a Put between two distinct-zid
        # --connect unixpipe clients. unixpipe is Linux-only and this runner is
        # ubuntu, so the lane's Linux guard never SKIPs here.
        run: bash scripts/run-ci.sh --layer E6u

      - name: Budget margin — this job may not approach its timeout in silence
        # Instrumented from birth rather than after its first cancel, which is
        # the whole lesson of the two rounds that produced this job. 900s to
        # match `timeout-minutes: 15`; the two numbers are one fact, so move that
        # and move this. The floor is 30%: a job that peels down below its own
        # budget should be told to give the budget back (R311y794) — which is
        # exactly what it did at R311y892, and the number above records what it
        # was measured to cost.
        if: always()
        run: bash scripts/lib/job-budget-margin.sh "$RUNNER_TEMP/wz_job_start" 900 90 30 '${{ job.status }}'

  portability:
    name: portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Independent legs: a macOS failure must not mask the Windows result (or
      # vice versa) — each platform is its own signal.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        # Windows + macOS. clippy comes from the pin's `components`. Pinning the
        # compiler here also removes a lint-drift class this job was exposed to:
        # a floating `stable` can newly fail `-D warnings` on a lint the new
        # rustc introduced, on a commit that changed nothing. See the `ci` job.
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      # R311y22f — libxml2 IS still required on the native windows-msvc gate.
      # R311y22 committed the SCE codegen under out/** and removed wz's
      # build-time codegen + the sce-codegen BINARY requirement (real wins: the
      # AP clippy below runs NO codegen and needs no sce-codegen binary). But it
      # does NOT remove libxml2: `sce-forge-runtime` — the RUNTIME support crate
      # every generated codec links — has its OWN build.rs build-dependency on
      # `sce-build` (-> the `libxml` crate -> native libxml2). So compiling
      # wz-runtime-tokio compiles sce-forge-runtime's build script, which links
      # libxml2. macOS finds it via system pkg-config; windows-msvc resolves it
      # through vcpkg and HARD-PANICS ("Could not find libxml2") without this
      # install. (R311y22d wrongly dropped this step, assuming committed codegen
      # removed ALL libxml2 need; the Linux-cached build hid the
      # sce-forge-runtime build-dep, the fresh windows CI caught it — R311y22f
      # re-adds it. The deeper fix — sce-forge-runtime not build-depping
      # sce-build — is SCE-upstream.) The `build sce-codegen` step stays removed:
      # the AP build runs no codegen, so it needs the libxml2 LIBRARY but not the
      # sce-codegen binary (macOS passes without either).
      - name: Install libxml2 (Windows; sce-forge-runtime build-deps sce-build -> libxml)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install libxml2:x64-windows-static-md
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> "$GITHUB_ENV"

      - name: cargo clippy — wz-runtime-tokio (default AP surface)
        # The portable AP stack (tcp/udp transport, pub/sub, query, declare,
        # liveliness). No unix-only backend in the default set, so it compiles
        # natively on macOS + Windows. R311y13: clippy -D warnings (not bare
        # `check`) so the mac/win gate matches the project's universal lint bar
        # and runs codegen, not just type-check.
        shell: bash
        run: (cd crates && cargo clippy -p wz-runtime-tokio -- -D warnings)

      - name: cargo clippy — quic-datagram (portable quinn datagram path)
        # The off-default datagram backend. quinn is cross-platform; wz reads the
        # per-datagram MTU at RUNTIME (connection.max_datagram_size), so there is
        # no per-OS const — this leg proves the quinn/rustls datagram stack
        # compiles + lints clean natively on macOS + Windows, the arms the Linux
        # `ci` job cannot reach. R311y13: clippy -D warnings, not bare `check`.
        shell: bash
        run: (cd crates && cargo clippy -p wz-runtime-tokio --features transport-link-quic-datagram -- -D warnings)

      # ── R311y581 — the lane now RUNS, not only compiles ──────────────
      #
      # Every step above this line is `clippy`. That makes this job a
      # COMPILATION witness, and until now it was the whole of wz's evidence for
      # macOS and Windows — while the `platform-macos` / `platform-windows`
      # inventory atoms sat UNVERIFIED for the recorded reason "NO wz CI lane".
      # That reason was FALSE from R311y13 onward: this lane has existed and
      # passed on both hosts since. What was actually missing is the thing the
      # atoms claim — that wz RUNS there — and no amount of clippy says it. An
      # endianness assumption, a path separator, a socket option macOS rejects, a
      # Windows loopback that needs a bind before connect: every one compiles.
      #
      # Each step guards on "at least one test passed" rather than an exact
      # count. R311y569 recorded that a bare `N passed` guard goes stale the
      # moment a test is added or renamed; the property needed here is only that
      # the filter matched something, so a zero-test run cannot read green (which
      # it otherwise would — libtest exits 0 on an empty selection).
      - name: cargo test — wz-session-core (the host-independent core)
        # The no_std + alloc core: codecs, key expressions, the session FSM's
        # pure logic, the R311y579 dissector. It touches no socket and no
        # filesystem, so a failure here is a genuine host-portability defect in
        # wz's own logic (a byte-order assumption, a `usize` width, a
        # `char`-vs-byte slip) rather than a platform integration gap.
        shell: bash
        run: |
          set -o pipefail
          out="$( (cd crates && cargo test -p wz-session-core) 2>&1 )" || { echo "$out"; exit 1; }
          echo "$out" | grep -E '^test result' || true
          grep -qE '^test result: ok\. [1-9][0-9]* passed' <<< "$out" || {
            echo "portability FAIL: wz-session-core selected NO tests on ${{ runner.os }}" >&2
            echo "$out" >&2
            exit 1
          }

      - name: cargo test — wz-runtime-tokio AP surface (unit)
        # The default AP feature set, which is deliberately the portable one (tcp
        # + udp; unixsock / unixpipe / vsock / raweth are all off by default and
        # are the Linux- or unix-only backends). These are the tokio-side unit
        # tests, so this is where a runtime assumption that only holds on Linux
        # surfaces.
        shell: bash
        run: |
          set -o pipefail
          out="$( (cd crates && cargo test -p wz-runtime-tokio --lib) 2>&1 )" || { echo "$out"; exit 1; }
          echo "$out" | grep -E '^test result' || true
          grep -qE '^test result: ok\. [1-9][0-9]* passed' <<< "$out" || {
            echo "portability FAIL: wz-runtime-tokio --lib selected NO tests on ${{ runner.os }}" >&2
            echo "$out" >&2
            exit 1
          }

      - name: cargo test — a REAL wz<->wz session over loopback TCP
        # THE LOAD-BEARING STEP, and the reason the two above are not enough: it
        # drives an actual four-way handshake between a wz acceptor and a wz
        # initiator over a real loopback TCP socket, to Established, on this
        # host's own network stack. That is the property `platform-macos` /
        # `platform-windows` assert, and it is the first time either has been
        # asserted rather than inferred from a clean compile.
        #
        # Both fixtures are in-process and socket-only: no spawned binary, no
        # foreign implementation, no tmpfs path — so they are portable by
        # construction, unlike the pico / zenohd interop corpus, which needs
        # provisioned foreign binaries this job has none of.
        shell: bash
        run: |
          set -o pipefail
          out="$( (cd crates && cargo test -p wz-runtime-tokio --test accept_and_open_session --test connect_and_open_session) 2>&1 )" || { echo "$out"; exit 1; }
          echo "$out" | grep -E '^test result' || true
          # BOTH fixtures must report a passing count: one guard would be
          # satisfied by one file while the other silently selected nothing.
          count="$(grep -cE '^test result: ok\. [1-9][0-9]* passed' <<< "$out")"
          [ "$count" -ge 2 ] || {
            echo "portability FAIL: expected a passing result from BOTH session fixtures on ${{ runner.os }}, got $count" >&2
            echo "$out" >&2
            exit 1
          }
