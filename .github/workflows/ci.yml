#
# watching-zenoh CI — automated production gate.
#
# Mirrors the local git-hook + verify-codegen.sh + cargo test
# discipline so PRs and main-branch pushes get the same gates that
# every commit on a developer machine already passes (via .githooks/
# pre-commit + commit-msg + pre-push). Three layers run sequentially;
# any one failing fails the workflow.
#
# Layer A — Mnemosyne workspace integrity:
#   mnemosyne-cli validate-workspace must report no NEW T1 orphan
#   (ledgered carry allowed). R408 (2026-06-04) made the scan
#   store-direct; the round-trip + GENERATED.md=sync dimensions were
#   retired upstream (mnemosyne R395-R400).
#   Drift here means a typed-mutate primitive was bypassed (raw Edit
#   on a registered doc, direct sidecar JSON edit, or a frozen-ledger
#   violation). Pre-commit + pre-push hooks already enforce; CI is
#   the cross-developer safety net.
#
# Layer A2 — Envelope mid value= audit (R111 / R117 CI yml sync):
#   scripts/audit-mid-values.sh rejects any sources/codecs/*.scxml
#   whose envelope-level <sce:flag name="mid"> declaration lacks
#   `value=`. R108a precedent: request.scxml had no mid value=
#   from R90 onward, emitting first wire byte 0x40 instead of 0x5C;
#   wz-side round-trip stayed green because the bake was internally
#   consistent, only the Layer 3 wire-compare against zenoh-pico's
#   `_z_request_encode` surfaced the defect at R108b. The audit
#   script is a build-time preventer for that whole class.
#
# Layer B — codegen + Layer 3 wire-interop per codec:
#   For each `sources/codecs/*.scxml` paired with the matching SCE
#   fixture (when one exists), scripts/verify-codegen.sh runs:
#     L1: 6-backend emit-success
#     L2: stem-normalized body-golden vs SCE fixture
#     L3: cargo test wz-integration-tests layer3_<stem> (when present)
#   Each layer's failure exits non-zero.
#
# Layer C — Rust workspace tests + lints:
#   cargo test --workspace + cargo clippy --workspace --all-targets
#   --deny warnings. The clippy gate runs on the entire crate tree
#   including generated code; deny-warnings is the production policy
#   ratified in workspace Cargo.toml `[workspace.lints.rust]`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The vendored SCE submodule + zenoh-pico submodule both need fetch.
  # checkout v4's submodule support honors .gitmodules per the
  # `submodules: recursive` flag below.
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: validate + verify + test
    # Ubuntu 22.04 ships gcc 11 + libclang-14 + cmake 3.22 (sufficient
    # for zenoh-pico CMakeLists.txt) + bash 5. Pinning the runner OS
    # version keeps Layer 2 byte-golden output deterministic across
    # SCE codegen invocations.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # R311y297 — reclaim the runner's preinstalled software before anything
      # else. THIS JOB HAS NO OTHER DISK HEADROOM: it builds the whole
      # workspace, then ~20 more feature-subset lanes (C1b..C1i, C4, C4b),
      # each of which is a DISTINCT feature set and so a DISTINCT set of
      # artifacts in `crates/target` — plus zenoh-pico's CLI binaries and
      # wz-ap-demo for the Layer E interop lanes. Debug artifacts dominate,
      # and the total grows monotonically as atoms land.
      #
      # R311y296 is what tipped it over: the run passed EVERY layer through
      # E5 and then died with `System.IO.IOException: No space left on
      # device` while the Actions runner was writing its OWN diagnostic log.
      # No wz gate failed. The prior green run (y291) had already taken 25m31s
      # against `timeout-minutes: 30`, so both ceilings were being approached
      # at once and nothing reported either.
      #
      # ubuntu-22.04 ships ~25-30 GB of software this job never uses. Pruning
      # it is the standard remedy and costs ~15s. Safe for THIS job
      # specifically: it uses only `actions/checkout` + `Swatinem/rust-cache`,
      # its Rust comes from rustup and its python3 from apt (`/usr/bin`), so
      # nothing here lives in the hosted tool cache. (The Zephyr job DOES use
      # `actions/setup-python`, which is why this step is not hoisted to a
      # shared spot — it is scoped to the job whose disk actually overflowed.)
      #
      # The `df -h` bracket is not decoration. The failure above was
      # undiagnosable from the log precisely because nothing ever reported
      # free space; a future squeeze should be visible BEFORE it is fatal.
      - name: Free runner disk space (headroom for the feature-matrix lanes)
        run: |
          echo "=== free space BEFORE prune ==="
          df -h /
          # `|| true` throughout: a path absent on a future runner image must
          # not fail the build — this step is headroom, not a gate.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "=== free space AFTER prune ==="
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # full history for git-log-based commit↔ledger drift check

      - name: Install system dependencies
        # cmake + libclang-dev are needed by zenoh-pico-sys (cmake
        # crate + bindgen). perl is GA on Ubuntu but listed for
        # documentation completeness — used by verify-codegen.sh
        # Layer 2 include-block sort step.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libclang-dev \
            clang \
            perl

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        # `rustup show` materialises the toolchain the repo pins — channel +
        # components + targets, all declared in rust-toolchain.toml — and every
        # cargo invocation inside the checkout then resolves to it.
        #
        # NOT dtolnay/rust-toolchain@stable (what this was until R311y267):
        # `stable` FLOATS. On 2026-07-09 it floated 1.96 -> 1.97 mid-stream, and
        # since rustc codegen size drifts across releases while Layer Q gates the
        # MCU .text on an absolute byte count, hosted CI went red for ~20 pushes
        # on a compiler bump that no commit asked for. The workspace
        # `rust-version` field is an MSRV LOWER BOUND for consumers — it never
        # pinned the build compiler, which is what a byte-exact footprint gate
        # needs.
        #
        # The action's `components:` / `targets:` inputs are gone for a second,
        # sharper reason: they attach to whatever toolchain the action installs,
        # while cargo resolves the PINNED one from the toolchain file. Embedded
        # targets would land on `stable` and be missing on the toolchain that
        # actually builds — and run-ci.sh SKIPs a target it cannot find, so the
        # footprint gate would go quietly GREEN instead of failing. A SKIP is
        # green; the pin owns components + targets so it cannot happen.
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: Install protoc (mnemosyne-server build-script dep)
        # R64.3 hotfix: cargo install of mnemosyne-cli pulls in the
        # mnemosyne-server workspace member transitively; that crate's
        # build script invokes prost-build which requires the
        # `protoc` binary on PATH. The R64.2 install attempt passed
        # cargo's argument parser but failed at build-script time
        # with `Could not find protoc. ... apt-get install protobuf-compiler`.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install mnemosyne-cli (pinned)
        # Delegated to scripts/install-mnemosyne-cli.sh (the single source
        # of truth shared with release.yml) so the two workflows cannot
        # drift. The script pins a known-good rev (deterministic — a future
        # upstream `main` change cannot silently break this CI) and
        # `--force`-rebuilds it, overriding any stale ~/.cargo/bin the
        # rust-cache restored (the R408 `missing field docs` failure mode).
        # The `|| { skip }` fallback keeps Layer A optional if the external
        # install fails (network / upstream outage), GitHub-Actions-specific
        # so it stays in the step, not the CI-agnostic script.
        run: |
          bash scripts/install-mnemosyne-cli.sh || {
            echo "::warning::mnemosyne-cli install failed; Layer A skipped"
            echo "MNEMOSYNE_SKIP=1" >> "$GITHUB_ENV"
          }

      - name: Build sce-codegen (vendor/sce)
        run: bash scripts/build-sce.sh

      # R408 (2026-06-04) retired the GENERATED.md render and the
      # `generate-docs` cascade upstream (mnemosyne R395-R400): the
      # atomic store is now the single directly-validated artifact, so
      # there is no GENERATED.md to regenerate before Layer A. The former
      # "Regenerate docs/GENERATED.md" step invoked `mnemosyne-cli
      # generate-docs`, which now hard-errors (`mnemosyne.toml` no longer
      # carries `[workspace].docs`) and broke every push; it is removed.
      # validate-workspace (Layer A) runs store-direct and needs no
      # pre-cascade.

      # R65b dedupe: every Layer lane below delegates to
      # scripts/run-ci.sh --layer X. The lane bodies (codec map,
      # divergence allowlist, cargo invocations, deploy schema
      # check) live in a single source of truth that both CI and
      # the local pre-push hook (.githooks/pre-push) invoke, so
      # the two paths cannot drift. Previously the CI yaml
      # duplicated ~50 lines of lane logic that pre-push did not
      # mirror; R64.1-R64.4 retrospect made that drift the
      # process-level problem worth solving.

      - name: Layer A — Mnemosyne workspace validate
        if: env.MNEMOSYNE_SKIP != '1'
        run: bash scripts/run-ci.sh --layer A

      - name: Layer A2 — Envelope mid value= audit
        # R117 yml sync — Layer A2 was added to scripts/run-ci.sh in
        # R111 but never paired into the CI yml; this step closes
        # that drift. Layer B's freshness gate (R114) lives INSIDE
        # `--layer B` so CI gets it automatically; only A2 needed a
        # separate yml step because it is a top-level layer.
        run: bash scripts/run-ci.sh --layer A2

      - name: Layer A3 — catalog status truthfulness
        # Joins the Mnemosyne inventory catalog SSOT to the cargo-feature
        # gate reality; rejects a reserved-but-gated / active-but-ungated
        # status drift that neither the cargo-feature CI lanes nor
        # validate-workspace can see. Top-level layer, so it needs its
        # own yml step (same reason as A2).
        #
        # R311y299 — WZ_A3_REQUIRE=1, for the same reason A4 got it in
        # R311y266 (and A3 should have got it then): a missing mnemosyne-cli
        # disarmed this gate ENTIRELY and exited 0, while the install step
        # above is deliberately fault-tolerant. The tool IS provisioned here,
        # so its absence is a provisioning regression, not an honest skip.
        env:
          WZ_A3_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer A3

      - name: Layer A4 — cross-impl proof axis
        # R311y259. A3 answers "is there a knob?" and "is it built?"; A4
        # answers "is it PROVEN against a real foreign implementation?" —
        # the question the north star ("zenoh + zenoh-pico FULL") actually
        # turns on. Joins the catalog to the interop corpus (derived from
        # the harness call graph) and to cargo's feature closure (which
        # mechanically refutes a claim for code that is not compiled in).
        # Top-level layer, so it needs its own yml step (same reason as A2).
        #
        # R311y266 — WZ_A4_REQUIRE=1: a missing mnemosyne-cli would otherwise
        # disarm this gate ENTIRELY and exit 0, and the install step above is
        # deliberately fault-tolerant (`|| warning; skip`), so one network blip
        # would leave every invariant unchecked on a green build. Here the tool
        # is provisioned, so its absence is a provisioning regression, not an
        # honest skip — fail loudly instead.
        env:
          WZ_A4_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer A4

      - name: Layer B — verify-codegen.sh per codec
        run: bash scripts/run-ci.sh --layer B

      - name: Layer B2 — regen-diff (committed out/** == regenerated)
        # R311y22e — server-enforce the committed-codegen freshness gate. It
        # regenerates out/** via the `xtask` codegen SSOT and FAILs on any diff,
        # so a hand-edited or stale committed artifact cannot land. R311y22a-d
        # left this gate in the pre-push hook ONLY (bypassable via --no-verify /
        # an uninstalled hook); R311y22e promotes it to a real CI step. The
        # Linux `ci` job already has libxml2 + builds sce-codegen above (the Build
        # sce-codegen step + Layer B), so the xtask's codegen toolchain is present.
        run: bash scripts/run-ci.sh --layer B2

      - name: Layer C0 — binary-dep test #[ignore] discipline
        # R235-hotfix — pre-flight scan: any wz-integration-tests
        # `tests/*.rs` that calls wz_ap_demo_binary() or
        # zenoh_pico_cli_binary( MUST mark every #[test] with an
        # adjacent #[ignore = "..."] so Layer C1 (cargo test
        # --workspace) skips it on fresh CI checkouts where the
        # required binaries are not yet built. Catches the bug
        # class at PR time rather than after Layer C1 panics with
        # "binary not found" downstream.
        run: bash scripts/run-ci.sh --layer C0

      - name: Layer C1 — cargo test --workspace
        run: bash scripts/run-ci.sh --layer C1

      - name: Layer C1b — cargo test -p wz-runtime-core --features alloc
        # R269 — workspace test uses default features so the alloc-
        # gated panic_payload / Error-trait tests in wz-runtime-core
        # would otherwise never run in CI. This lane runs them
        # explicitly; the crate's MCU-target no-default-features
        # build is still validated by Layer C2 (-D warnings).
        run: bash scripts/run-ci.sh --layer C1b

      - name: Layer C1c — cargo test -p wz-session-core --features codec-declare
        # R311ds — same shape as C1b. The workspace test runs the
        # codec-declare-gated wz-session-core declare tests only because
        # wz-runtime-tokio's defaults transitively enable
        # wz-session-core/codec-declare. This lane runs the 58 gated
        # tests (54 R311ds behavioural + 4 R311dm thin) explicitly so
        # coverage cannot silently drop if that transitive enable changes.
        run: bash scripts/run-ci.sh --layer C1c

      - name: Layer C1d — cargo test -p wz-session-core (pub/sub data plane)
        # R311du — same shape as C1c. The migrated pubsub
        # SubscriberRegistry test module gates on the full pub/sub
        # data-plane feature union; the workspace lane runs them only via
        # wz-runtime-tokio's transitive defaults. This lane enumerates
        # the union explicitly so coverage cannot silently drop if those
        # defaults change.
        run: bash scripts/run-ci.sh --layer C1d

      - name: Layer C1e — cargo test -p wz-session-core (query dispatch plane)
        # R311dx — same shape as C1d. The migrated QueryableRegistry test
        # module gates on the query dispatch feature union (query-queryable
        # implies codec-request + codec-response, plus query-attachment /
        # query-selector-parameters / query-reply-err / codec-response-final);
        # the workspace lane runs them only via wz-runtime-tokio's transitive
        # defaults. This lane enumerates the union explicitly so coverage
        # cannot silently drop if those defaults change.
        run: bash scripts/run-ci.sh --layer C1e

      - name: Layer C1f — cargo test -p wz-session-core (reply dispatch plane)
        # R311dy — same shape as C1e. The migrated ReplyRegistry test
        # module gates on the reply dispatch union (codec-response +
        # codec-response-final + pubsub-put + pubsub-delete +
        # query-queryable, plus codec-push for the pubsub dispatch path);
        # the workspace lane runs them only via wz-runtime-tokio's
        # transitive defaults. This lane enumerates the union explicitly
        # so coverage cannot silently drop if those defaults change.
        run: bash scripts/run-ci.sh --layer C1f

      - name: Layer C1g — cargo test -p wz-session-core (observer dispatch plane)
        # R311dz — same shape as C1f. The migrated ApplicationLayerObserver
        # test module gates on the full fan-out union (codec-push +
        # codec-declare + query-queryable + liveliness-token +
        # liveliness-subscriber + declare-subscriber + declare-queryable +
        # codec-response-final + pubsub-put/delete). The lane also adds a
        # composability build of the codec-declare-on / query-queryable-off
        # subset, which composes the observer with the queryable slot
        # elided — the arbitrary-subset class the maximal-preset C1c-f
        # tests never exercise.
        run: bash scripts/run-ci.sh --layer C1g

      - name: Layer C1h — wz-session-core arbitrary-subset composability matrix
        # R311ea — the C1c-g lanes each build wz-session-core under ONE
        # maximal feature union, so a gating regression that only shows in
        # a deliberately-incomplete coherent subset passes CI invisibly.
        # This lane builds the crate under several representative consumer
        # profiles (minimal / pubsub-only / queryable-only / zget-reply /
        # declare-observer / codec-declare-bare); deny-warnings turns every
        # subset-specific unused-import / dead-code into a hard error.
        run: bash scripts/run-ci.sh --layer C1h

      - name: Layer C1i — scouting-active glue unit tests
        # R311ep — scouting-active is off by default, so Layer C1's
        # `cargo test --workspace` never builds the scouting glue. This
        # lane builds + runs the deterministic scouting unit tests
        # (Scout framing / Hello-locator extraction / scout-timeout)
        # under --features scouting-active + deny-warnings. The
        # socket-bound multicast e2e is the opt-in Layer M (multicast
        # routing is environment-dependent; not a default gate).
        run: bash scripts/run-ci.sh --layer C1i

      - name: Layer C2 — cargo clippy --deny warnings
        run: bash scripts/run-ci.sh --layer C2

      - name: Layer C4 — wz facade preset composability matrix
        # R311eb — cargo-builds the wz facade under all 7 named presets
        # (mcu-minimal/-extended, ap-client/-router/-full, zenoh-cpp,
        # cortex-m4-default) so a preset feature-list drift or incoherent
        # combo cannot pass CI invisibly. Facade-level analog of C1h;
        # enforced here (unlike the local-only C3 lint-isolation lane)
        # because it is a composability guard, not a redundant lint pass.
        # no_std footing of the MCU presets stays Layer G's cross-compile.
        run: bash scripts/run-ci.sh --layer C4

      - name: Layer C4b — wz facade arbitrary-incomplete-subset matrix
        # R311ek — cargo-builds the wz facade under deliberately-incomplete
        # coherent consumer subsets (pubsub-only / queryable-only /
        # zget-reply-only / declare-observer). The named-preset C4 lane
        # only covers COMPLETE profiles, and C1h only covers the
        # wz-session-core layer; this lane is the facade-level analog of
        # C1h that locks the runtime-tokio glue's over-broad-gating
        # regression class (observer / liveliness_subscriber / source_info
        # ext encoder) the default-feature CI never exercises.
        run: bash scripts/run-ci.sh --layer C4b

      - name: Install python3-yaml (Layer D dep)
        # Layer D's run-ci.sh path no-ops gracefully when python3-yaml
        # is missing; on CI we install it explicitly so the lane
        # runs the real check rather than the local-developer skip.
        run: sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Layer D — deploy/*.yaml schema validate
        run: bash scripts/run-ci.sh --layer D

      - name: Build zenoh-pico CLI binaries (Layer E dep)
        # R121c yml sync — Layer E spawns target/zenoh-pico-cli/z_put
        # against the wz-ap-demo binary's TCP --listen endpoint. The
        # CLI binaries are built from the vendored zenoh-pico
        # submodule via scripts/build-zenoh-pico-cli.sh; local
        # developers run this on demand, CI builds them every run
        # since the Swatinem cache covers `crates -> target` +
        # `vendor/sce -> target` only.
        run: bash scripts/build-zenoh-pico-cli.sh

      - name: Build wz-ap-demo binary (Layer E dep)
        run: (cd crates && cargo build -p wz-ap-demo)

      - name: Layer E — wz-ap-demo round-trip vs zenoh-pico z_put
        run: bash scripts/run-ci.sh --layer E

      - name: Layer E3 — multi-peer router e2e (routing-router foundation)
        # R311qa — builds wz-ap-demo with --features routing-router (additive)
        # and runs the self-contained wz<->wz router e2e (one router + two
        # initiators); host-only, no external binary, so it gates on the primary
        # runner like Layer E / F.
        run: bash scripts/run-ci.sh --layer E3

      - name: Layer E4 — routing-router reject gate (default build rejects --router)
        # R311qa — the negative catalog-truthfulness gate: builds the DEFAULT
        # wz-ap-demo and asserts it rejects --router with exit 2. Rebuilds the
        # default binary after E3's --features routing-router build, so the
        # binary at the shared path matches the variant each lane asserts.
        run: bash scripts/run-ci.sh --layer E4

      - name: Layer E5 — router data-plane forwarding e2e (routing-routes)
        # R311qc — the data-plane counterpart to E3: builds wz-ap-demo with
        # --features routing-routes and asserts the router forwards a Put across
        # faces (producer -> router -> matching subscriber). Self-contained
        # wz<->wz, no external runner like E3/E4.
        run: bash scripts/run-ci.sh --layer E5

      - name: Layer F — codec-footprint catalog truthfulness gate
        # R311pt — F is host-only (python3 + cargo; no cross-toolchain),
        # so it runs on the primary runner. Default-on in run-ci.sh now,
        # but CI invokes it by name to keep this job's lane list explicit.
        run: bash scripts/run-ci.sh --layer F

  # ─────────────────────────────────────────────────────────────────
  # R311y264 — the CROSS-IMPL INTEROP job. Every lane here executes a
  # cross-impl PROOF that hosted CI previously never ran.
  #
  # WHY THIS JOB EXISTS. Layer A4 (R311y259) reports the proof axis as TWO
  # populations, because a proof that never runs is not a proof: 64 of the
  # corpus's tests are #[ignore]d, and the lanes that execute them — E2 / E6 /
  # E8 / Z — were not in this workflow. So the zenohd tier in particular ran
  # ONLY on a developer's machine, at pre-push. A derived number resting on
  # evidence hosted CI never executes carries MORE false authority than the
  # hand estimate the axis replaced, which is precisely why A4 refuses to fuse
  # the two counts. This job closes the gap by making the evidence execute.
  #
  # It is a SEPARATE job, not more steps on `ci`, for one reason: zenohd is a
  # from-source build of an external release, and it must not eat the primary
  # job's 30-minute budget. Its output is a pinned-version binary, so it caches
  # to a near-zero steady-state cost and only a cold cache pays.
  #
  # NOT wired here, deliberately: Layer M (multicast). run-ci.sh marks it an
  # "opt-in environment-flaky lane" — UDP multicast behaviour on a hosted
  # runner is not something to bet a green build on, and a flaky gate is worse
  # than an honest local-only one (no-flaky-ever). The multicast pico proofs
  # therefore stay local-only until that flakiness is root-caused, and A4's
  # EXECUTION line keeps saying so.
  interop:
    name: cross-impl proof lanes (E2 + E6 + E6b + E6e + E6f + E6g + E6h + E7 + E8 + Z)
    runs-on: ubuntu-22.04
    # A cold cache must build: the zenoh-pico CMake tree, the whole zenoh workspace in
    # release (zenohd AND the storage-manager plugin), four differently-featured
    # wz-ap-demo builds, the six wz-e2e-* subset binaries, and then Layer Z's serial
    # zenohd sweep. 60 was optimistic; the steady state is cached and fast.
    timeout-minutes: 120
    env:
      # A hosted lane that SKIPs green on a binary THIS JOB PROVISIONS is a provisioning
      # regression wearing a green badge — and it lies twice, because Layer A4 reads
      # "this lane is in ci.yml" as evidence its proofs executed.
      WZ_PICO_REQUIRE: "1"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        # cmake + libclang-dev: zenoh-pico-sys (cmake crate + bindgen), which the
        # wz-integration-tests dev-dep pulls in even for the spawn-class lanes.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libclang-dev \
            clang

      - name: Install Rust toolchain (pinned by rust-toolchain.toml, for wz)
        # See the `ci` job's step of the same name — the pin is the SSOT for
        # channel + components + targets. zenohd's own 1.85.0 channel is
        # installed separately below and selected explicitly with `cargo
        # +1.85.0`, which overrides the toolchain file and is unaffected by it.
        run: rustup show

      - name: Install Rust toolchain 1.85.0 (zenoh 1.5.0's pinned channel)
        # scripts/build-zenohd.sh REQUIRES this exact channel and hard-errors
        # without it — zenoh 1.5.0 pins it, and building zenohd on a different
        # channel is not a reproducibility trade this project makes.
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: interop

      - name: Cache the zenohd binary (pinned version)
        # zenohd 1.5.0 is a FIXED external release, so the built binary is a pure
        # function of the version — cache the artifact itself rather than paying
        # a from-source build every run. Only a cold cache builds.
        id: zenohd-cache
        uses: actions/cache@v4
        with:
          path: target/zenohd
          # Keyed on the BUILD SCRIPT's content too, not just the version: a cache once
          # populated without the storage-manager plugin (a run that fell back to the
          # crates.io path) would otherwise strand that proof behind a green SKIP for as
          # long as the key lives. Change the script, get a fresh cache.
          key: zenohd-1.5.0-ubuntu-22.04-${{ hashFiles('scripts/build-zenohd.sh') }}

      - name: Build zenohd 1.5.0 + the storage-manager plugin (cache miss only)
        if: steps.zenohd-cache.outputs.cache-hit != 'true'
        # ZENOHD_ALLOW_CLONE=1 makes build-zenohd.sh take the SOURCE path (a shallow
        # clone of the pinned tag) instead of falling to crates.io. That matters:
        # `cargo install` yields the router BINARY but not the storage-manager
        # cdylib, and without the plugin Layer Z's storage-replication leg SKIPs —
        # green, and never executed. The lane would "run in CI" while one of its
        # proofs quietly did not, which is the exact false-authority this whole axis
        # exists to stop. Only a source tree produces the plugin, so CI builds from
        # source. Cold cost is one build; the cache makes it ~zero thereafter.
        env:
          ZENOHD_ALLOW_CLONE: "1"
        run: bash scripts/build-zenohd.sh

      - name: Assert zenohd + the storage plugin are actually present
        # Trusting the cache is how a "restored" build quietly becomes a missing one. Layer
        # Z's guards would SKIP green on either absence, and Layer A4 would keep counting
        # its proofs as executed, so check before the lanes run rather than after.
        run: |
          test -x target/zenohd/zenohd \
            || { echo "::error::zenohd missing after build/restore"; exit 1; }
          test -f target/zenohd/libzenoh_plugin_storage_manager.so \
            || { echo "::error::storage-manager plugin missing — the storage-replication proof would SKIP green"; exit 1; }

      - name: Build zenoh-pico CLI binaries
        run: bash scripts/build-zenoh-pico-cli.sh

      - name: Layer E2 — facade-subset e2e vs zenoh-pico CLIs
        # The six wz-e2e-* SUBSET binaries: each pins an explicit atom list and
        # interoperates with a real pico CLI, which is what makes their proofs
        # TIGHTLY bounded (a full wz-ap-demo carries ~130 atoms and can prove far
        # less per test).
        run: bash scripts/run-ci.sh --layer E2

      - name: Layer E6 — peer mesh (incl. 3 zenoh-pico interop legs)
        run: bash scripts/run-ci.sh --layer E6

      - name: Layer E6b — adminspace introspection over the peer mesh
        # wz<->wz today. Wired here because it is the PREREQUISITE for the
        # adminspace cross-impl cluster: zenoh-pico HAS Z_FEATURE_ADMIN_SPACE, so
        # a pico z_get can witness wz's adminspace — but only from a demo built
        # with `routing-peer,adminspace-*`, which is what this lane builds. With
        # the lane in hosted CI, that future proof executes here rather than
        # landing local-only.
        run: bash scripts/run-ci.sh --layer E6b

      - name: Layer E6e — adminspace plugins registry (wz<->wz + vs zenoh-pico)
        # R311y271 wired this lane here for the reason E6b's note above predicted:
        # its pico z_get proof of `adminspace-plugins-handlers` would otherwise be
        # LOCAL-ONLY. Layer A4 reports "proven by tests hosted CI actually runs" as a
        # separate population precisely so a proof that never executes cannot pad the
        # number that gates merges — and before this step, adding the proof moved the
        # all-lanes count while leaving the executed count flat. That gap is the
        # signal; this closes it.
        run: bash scripts/run-ci.sh --layer E6e

      - name: Layer E6f — adminspace metrics leg vs zenoh-pico
        # R311y275 wired this lane here for the reason E6b/E6e's notes give: its pico
        # z_get proof of `adminspace-metrics` would otherwise be LOCAL-ONLY, moving
        # A4's all-lanes count but not the executed count that gates merges. Its own
        # demo binary (built WITH adminspace-metrics) is distinct from E6b's (which
        # asserts the metrics leg absent), so it cannot share that lane.
        run: bash scripts/run-ci.sh --layer E6f

      - name: Layer E6g — adminspace read-gate deny vs zenoh-pico
        # R311y276 — same rationale as E6e/E6f: the pico witness of the
        # `adminspace-read` GET-deny gate would otherwise be LOCAL-ONLY. Its own demo
        # binary (built WITH adminspace-read, run --no-admin-read) is distinct from
        # E6b's (which needs the record SERVED), so it cannot share that lane.
        run: bash scripts/run-ci.sh --layer E6g

      - name: Layer E6h — adminspace config-hotreload storage lifecycle vs zenoh-pico
        # R311y277 — the config-diff-driven storage lifecycle (adminspace-config-hotreload)
        # ACTIVATED as a wire E2E: pico z_put storage-add -> wz RuntimeStorageManager
        # add_storage -> pico z_get sees storage_manager Started (Loaded before), z_put
        # storage-del reverses it. Its own demo binary (the ONLY build with the
        # --storage-host run-mode, --features adminspace-config-hotreload) is distinct
        # from every other E6* binary, so it needs its own lane. Wired here for the same
        # reason as E6e/E6f/E6g: a proof local-only to pre-push moves A4's all-lanes
        # count but not the executed count that gates merges.
        run: bash scripts/run-ci.sh --layer E6h

      - name: Layer E7 — router-hat mesh (wz<->wz) + router adminspace vs zenoh-pico
        # R311y273 added the pico router-adminspace witness to this lane and wired the
        # lane here so it EXECUTES in hosted CI — same reason as E6e above: a proof only
        # local-to-pre-push moves A4's all-lanes count but not the executed count that
        # gates merges. E7 was previously local-only by omission (its one historical
        # flake, an in-run convergence tick-race, was fixed to a deterministic
        # shutdown-peak assertion in R311y124); verified stable across repeated runs
        # before wiring.
        run: bash scripts/run-ci.sh --layer E7

      - name: Layer E8 — router-hat data plane vs a zenoh-pico subscriber
        run: bash scripts/run-ci.sh --layer E8

      - name: Layer Z — zenohd (zenoh-full) interop
        # The ONLY proofs against the canonical Rust implementation. Until this
        # step existed they ran on exactly one machine.
        #
        # WZ_Z_REQUIRE=1 turns every prereq SKIP in this lane into a FAIL. On a
        # developer's box a SKIP is honest (zenohd is an external binary they may
        # not have built). Here the steps above GUARANTEE it — and the storage
        # plugin with it — so a SKIP would be a provisioning regression wearing a
        # green badge, and it would lie twice: Layer A4 reads "this lane is in
        # ci.yml" as evidence its proofs EXECUTED. Same rule as WZ_QZ_REQUIRE.
        env:
          WZ_Z_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer Z

  # ─────────────────────────────────────────────────────────────────
  # R311iw — embedded cross-compile + QEMU job. Layer G (per-triple
  # no_std cross-compile of the wz crates) and Layer Q (QEMU mps2 /
  # microbit boot e2e + the ROM-footprint regression gate) need an ARM
  # cross-toolchain + qemu-system-arm the primary `ci` job's runner does
  # not carry, so they run in a dedicated job here.
  #
  # WHY THIS JOB EXISTS: this runner carries the ARM cross-toolchain +
  # qemu-system-arm the primary `ci` runner does not. R311iw originally
  # hosted G + Q here to gate footprint "without slowing the local
  # pre-push path" — but R311pt found that trade-off leaves a hole: CI
  # only fires on push, so a long unpushed arc (R311p*, ~20 rounds) let
  # footprint drift accumulate undetected on BOTH the CI path (never
  # triggered) AND the pre-push path (opt-in, never set). R311pt retired
  # the cost-based opt-in axis: F/G/Q/Z are now default-on in
  # scripts/run-ci.sh, so the pre-push hook gates footprint locally before
  # every push (graceful SKIP where the toolchain is absent). This CI job
  # is now the toolchain-provisioning MIRROR of that gate, not its only
  # home. Lane logic stays in scripts/run-ci.sh (the R65b single source of
  # truth shared with pre-push); this job only installs the toolchain and
  # invokes the lanes, so the two paths cannot drift.
  cross-mcu:
    name: cross-compile + QEMU (Layer G + Q)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        # cmake + libclang for the sce-codegen / *-sys build scripts;
        # gcc-arm-none-eabi supplies arm-none-eabi-{gcc,size} (the lwIP C
        # cross-compile + the Layer Q.3 footprint `size` measurement);
        # libnewlib-arm-none-eabi supplies the bare-metal newlib C headers
        # (string.h etc.) that gcc-arm-none-eabi alone OMITS on Ubuntu's
        # split packaging — without it the lwIP `def.c` cross-compile fails
        # `fatal error: string.h: No such file or directory` (Layer G.6 /
        # G.11). qemu-system-arm boots the mps2 / microbit ELFs (Q.2 / Q.4).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libclang-dev \
            clang \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            qemu-system-arm

      - name: Install Rust toolchain + embedded targets (pinned by rust-toolchain.toml)
        # THE job this pin exists for: Layer Q's footprint gate lives here. The
        # embedded target list moved into rust-toolchain.toml so it follows the
        # PINNED toolchain — listed here (on a floating `stable`) it would be
        # installed on a toolchain cargo does not use, leaving the real one
        # without the targets, and run-ci.sh SKIPs a missing target: the gate
        # would report green having measured nothing. See the `ci` job's step.
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: Build sce-codegen (vendor/sce)
        run: bash scripts/build-sce.sh

      - name: Layer G — per-triple no_std cross-compile
        run: bash scripts/run-ci.sh --layer G

      - name: Layer Q — QEMU mps2/microbit e2e + footprint gate
        # R311y274 — WZ_Q_REQUIRE=1: this runner PROVISIONS the ARM cross-toolchain
        # + embedded targets, so any footprint SKIP here (target absent, binary not
        # built, size/strings tool missing) is a provisioning regression, not a
        # legitimate host-lacks-the-tool skip. Without it the footprint gate — the
        # whole subject of R311y267 — was the ONE provisioned lane whose SKIPs went
        # green (its only defense was `rustup show` auto-installing the targets;
        # rustup regressed exactly that in 1.28.0). Same rule as WZ_Z/QZ/PICO/A4.
        env:
          WZ_Q_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer Q

  # R311y31 — REAL Zephyr cooperative-profile boot e2e (Layer Qz). UNLIKE the
  # pure-cargo G/Q lanes (cargo IS the build), the Zephyr port is
  # west/cmake/kconfig-driven, so this dedicated job provisions the Zephyr
  # toolchain the dev host carries — Python 3.12 + west + a PINNED Zephyr source
  # tree + the Zephyr SDK 1.0.1 arm toolchain — then runs `--layer Qz`, which
  # `west build`s deploy/zephyr-app for qemu_cortex_m3 (linking the wz cargo
  # staticlib via the CMakeLists.txt --undefined kernel-symbol contract) and
  # boots it on QEMU, asserting the `ZEPHYR-WZ PASS` console sentinel. This ends
  # the G.16/G.17 pure-cargo lib-check staging with an EXECUTED boot on CI (the
  # R311y25 "a new artifact must get a CI lane in the same round — local-only is
  # the burn" rule applied to the Zephyr deploy). Lane logic stays in
  # scripts/run-ci.sh (R65b SSOT); this job only provisions + invokes --layer Qz.
  # The Zephyr ref + SDK version are pinned to the dev host's verified pair
  # (4.4.0-6201-gdaad7c59 / SDK 1.0.1) and the workspace + SDK are cached so the
  # ~GB west-update + SDK download is a one-time cost.
  zephyr-mcu:
    name: Zephyr cooperative profile boot (Layer Qz)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # Pinned to the exact pair the dev host booted (boot banner
      # v4.4.0-6201-gdaad7c59b8e); the zephyr tree's SDK_VERSION = 1.0.1.
      ZEPHYR_REF: daad7c59b8ebd8db8d08c2749802ac74f971eb2a
      ZEPHYR_SDK_VERSION: "1.0.1"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        # arm-none-eabi-gcc = the lwip-sys cross cc (CC_thumbv7m_none_eabi) +
        # libnewlib its bare-metal C headers; qemu-system-arm boots the image;
        # cmake/ninja/dtc are the Zephyr build system; libclang/clang for the
        # wz *-sys build scripts; xz-utils extracts the SDK tarballs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build device-tree-compiler \
            libclang-dev clang \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            qemu-system-arm xz-utils

      - name: Install Rust toolchain + thumbv7m (pinned by rust-toolchain.toml)
        # thumbv7m comes from the pin's `targets` list. See the `ci` job's step.
        run: rustup show

      - name: Set up Python 3.12 (Zephyr main requires >= 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # R311y33 — restore/save SPLIT (not the combined actions/cache@v4 whose
      # post-step saves unconditionally): the save below is gated on success() so
      # a partial / failed provision can never poison the cache key (a poisoned
      # cache would cache-hit on the next run, skip provision, and build against a
      # half-tree). The Verify step catches a partial RESTORE the same way.
      - name: Restore Zephyr workspace + SDK cache
        id: zephyr-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/zephyrproject
            ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
            ~/.cmake/packages/Zephyr-sdk
          key: zephyr-${{ env.ZEPHYR_REF }}-sdk-${{ env.ZEPHYR_SDK_VERSION }}-v2

      - name: Provision Zephyr (west + pinned source + SDK)
        if: steps.zephyr-cache.outputs.cache-hit != 'true'
        # Mirrors the dev-host setup 1:1 so the Qz lane's default paths
        # (~/zephyrproject/.venv + ~/zephyrproject/zephyr) resolve with no env
        # override. `west init --mr` only accepts a branch/tag (it runs
        # `git clone --branch`, which rejects a raw commit SHA → exit 128), so we
        # clone the manifest repo ourselves (blobless = fast, full history so the
        # pinned commit is reachable), fetch+checkout the pinned SHA, then
        # `west init -l` adopts the local repo. --narrow -o=--depth=1 keeps the
        # module update shallow; the zephyr tree's SDK_VERSION (1.0.1)
        # auto-selects the SDK, installed to ~/zephyr-sdk-1.0.1 (HOME default).
        run: |
          python3.12 -m venv ~/zephyrproject/.venv
          . ~/zephyrproject/.venv/bin/activate
          python -m pip install --upgrade pip
          pip install west tqdm
          git clone --filter=blob:none https://github.com/zephyrproject-rtos/zephyr ~/zephyrproject/zephyr
          git -C ~/zephyrproject/zephyr fetch --filter=blob:none origin "$ZEPHYR_REF"
          git -C ~/zephyrproject/zephyr checkout "$ZEPHYR_REF"
          cd ~/zephyrproject
          west init -l zephyr
          west update --narrow -o=--depth=1
          west zephyr-export
          pip install -r zephyr/scripts/requirements-base.txt
          west sdk install -t arm-zephyr-eabi
          # Forensics: the manifest @ ZEPHYR_REF pins every module to an immutable
          # SHA (verified: west.yml has 0 branch-name revisions), so this snapshot
          # is reproducible; logging the resolved set makes it auditable post-hoc.
          west list

      - name: Verify Zephyr provisioning (catch a partial cache / failed provision)
        # Assert the toolchain is WHOLE before caching or building — a partial
        # cache-restore or an incomplete provision is caught loudly here instead
        # of silently SKIPping Layer Qz or building a half-tree. Runs on both the
        # cache-hit and freshly-provisioned paths.
        run: |
          set -e
          test -x ~/zephyrproject/.venv/bin/west
          test -d ~/zephyrproject/zephyr/boards
          test -d ~/.cmake/packages/Zephyr-sdk
          find ~/zephyr-sdk-${ZEPHYR_SDK_VERSION} -name arm-zephyr-eabi-gcc -type f \
            | grep -q . || { echo "arm-zephyr-eabi toolchain missing in SDK"; exit 1; }
          echo "Zephyr provisioning verified (venv + zephyr tree + SDK arm toolchain)."

      - name: Save Zephyr workspace + SDK cache
        # Save ONLY on a cache miss AND only after provision+verify succeeded
        # (success()) — a failed/partial provision never writes the cache key.
        if: success() && steps.zephyr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/zephyrproject
            ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
            ~/.cmake/packages/Zephyr-sdk
          key: zephyr-${{ env.ZEPHYR_REF }}-sdk-${{ env.ZEPHYR_SDK_VERSION }}-v2

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            deploy/zephyr-app/rust -> target

      - name: Layer Qz — Zephyr west build + QEMU boot e2e
        # The lane sources ~/zephyrproject/.venv itself for the west build; the
        # explicit activate here also puts west on PATH for the pre-build gate.
        # WZ_QZ_REQUIRE=1 makes a prerequisite SKIP FATAL on THIS dedicated job
        # (the provisioning steps guarantee every prerequisite, so a SKIP here is
        # a provisioning regression that must fail red, not pass green).
        env:
          WZ_QZ_REQUIRE: "1"
        run: |
          . ~/zephyrproject/.venv/bin/activate
          bash scripts/run-ci.sh --layer Qz

  # R311y11 — macOS + Windows NATIVE portability check of the wz AP stack.
  # The Linux `ci` job above cannot catch target_os-routed regressions: the
  # default AP stack must compile clean off-Linux, the quinn/rustls datagram
  # backend must compile natively on macOS + Windows, and the unixpipe + vsock
  # backends (Linux-only by design) must compile OUT cleanly off-Linux. GitHub
  # provides real macOS + Windows runners, so this compiles NATIVELY (not cross).
  # R311y13: a `cargo clippy -D warnings` portability GATE (upgraded from bare
  # `check` — matches the project's universal lint bar + runs codegen, not just
  # type-check); it skips the Linux-only Layer A-F deps (mnemosyne-cli / protoc /
  # zenoh-pico) the AP-stack compile does not need. The wz AP crates are
  # built from the committed out/** codegen (R311y22), so this native gate needs
  # NO build-time codegen — no libxml2 / sce-codegen on the runner. Scope = the
  # PORTABLE feature surface:
  # the default set (tcp/udp, no unix-only backend) + transport-link-quic-datagram
  # (quinn is cross-platform). It deliberately does NOT enable
  # transport-link-{unixpipe,vsock} off-Linux: those features pull `dep:libc` /
  # `dep:tokio-vsock` from the `[target.linux]` table, so enabling them on a
  # non-Linux target is an invalid `dep:` reference by construction (they are
  # Linux-only backends). R311y305: the prior clause here claimed these are
  # "verified by the ci job's Linux lanes C1al / vsock" — that is STALE. C1al
  # (unixpipe) and C1ab (vsock) are defined in scripts/run-ci.sh but are NOT in
  # this workflow's enumerated --layer set, so they run only in a local full
  # sweep, not on the hosted ci job. The Linux-only-ness is enforced at the
  # Cargo `[target.'cfg(...)']` layer, not by a hosted lane.
  feature-gates:
    name: feature-gate NEG lanes (subsets no other job composes)
    runs-on: ubuntu-22.04
    # Its OWN runner, deliberately NOT the `ci` job. That job is at BOTH of
    # its ceilings: 26m22s against `timeout-minutes: 30`, and its own comment
    # above declares "THIS JOB HAS NO OTHER DISK HEADROOM" — every extra
    # feature-subset lane is a DISTINCT feature set and so a DISTINCT set of
    # `crates/target` artifacts. The lanes below add roughly a dozen such
    # subsets between them. (R311y318: the job name used to enumerate its
    # lanes as "C1bi + C1bj"; it went stale the moment C1bk landed, so it now
    # names the genre. The step list below is the enumeration.)
    # Hanging them off `ci` would trade a real gate for a flaky timeout; a
    # parallel job costs runner minutes but zero critical-path wall clock.
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        # `recursive`: wz-session-core compiles against sce_forge_runtime from
        # vendor/sce, so the lanes below do not build without it.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev clang perl

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        # Same reasoning as the ci job: `rustup show` materialises the PINNED
        # toolchain. Never a floating `stable` — see that job's note.
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      # R311y309 — these two lanes existed from R311y307/y308 but ran ONLY in a
      # local sweep, which is the repo's #1 hazard class: a gate that never runs
      # hosted reports success by silence. Both were proven by FALSIFICATION
      # locally (neuter the gate -> the lane goes red), so hosting them converts
      # a real proof into a continuously enforced one.
      - name: Layer C1bi — pubsub-qos merged gate (R311y307)
        run: bash scripts/run-ci.sh --layer C1bi

      - name: Layer C1bj — Push loopback metadata gates (R311y308)
        run: bash scripts/run-ci.sh --layer C1bj

      # Hosted R311y318 — the QUERY twin of C1bj, for the reason stated above
      # and one degree worse: y308's push leak was loopback-only, but
      # query-target / -consolidation / -timeout reached THE WIRE in builds
      # without the atom. The lane was proven by falsification (cut the gate ->
      # red) and its `--list` set-comparison is itself falsified both ways
      # (rename a guard -> red; cfg-elide one -> red). Its subset composes
      # query-get WITHOUT the three atoms, which no other hosted lane does:
      # Layer C1's `--workspace` unifies them ON and cfg's all three NEGs out.
      - name: Layer C1bk — Query pub-field gates (R311y317)
        run: bash scripts/run-ci.sh --layer C1bk

      # Hosted R311y332, and it is this job's own doctrine finally applied to
      # the lane that needed it most. C1j is the BEHAVIOURAL half of the
      # runtime-crate subset guard (`cargo test -p wz-runtime-tokio` over the
      # `_wz_consumer_plane_subsets` SSOT rows); it is the ONLY lane anywhere
      # that RUNS wz-runtime-tokio's tests with a consumer plane compiled OUT.
      #
      # Why now: R311y330 and R311y331 each wrote feature-OFF NEG proofs that
      # land ONLY here — declare_queryable{,_aliased} and
      # query{,_aliased,_aliased_auto} rejecting typed and emitting nothing —
      # and both rounds shipped them into a lane no hosted job ran. Two rounds
      # of "proven by falsification locally" is exactly the silence this job
      # exists to break; leaving them unhosted would make the proofs decorative.
      #
      # Cost, measured not guessed: C1j's worst recorded local wall time is
      # 193s (typical 54-87s) across 214 run-ci logs. This job's three existing
      # lanes total ~24s warm, so the 30-minute budget absorbs it with room. It
      # shares the `_wz_consumer_plane_subsets` feature sets with C4c/C4d, so
      # its distinct-artifact cost is the rows themselves, once.
      #
      # NOT hosted here, deliberately, and still carried: C4c (the BUILD half),
      # C4d (the clippy half) and C4e (transport axis). They are real gaps —
      # they guard `deny(warnings)` dead-code regressions per subset — but they
      # are a separate cost decision, not a side-effect of unblocking two
      # rounds' NEG proofs.
      - name: Layer C1j — runtime-tokio subset BEHAVIOUR (R311y330/y331 NEGs)
        run: bash scripts/run-ci.sh --layer C1j

  portability:
    name: portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Independent legs: a macOS failure must not mask the Windows result (or
      # vice versa) — each platform is its own signal.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        # Windows + macOS. clippy comes from the pin's `components`. Pinning the
        # compiler here also removes a lint-drift class this job was exposed to:
        # a floating `stable` can newly fail `-D warnings` on a lint the new
        # rustc introduced, on a commit that changed nothing. See the `ci` job.
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      # R311y22f — libxml2 IS still required on the native windows-msvc gate.
      # R311y22 committed the SCE codegen under out/** and removed wz's
      # build-time codegen + the sce-codegen BINARY requirement (real wins: the
      # AP clippy below runs NO codegen and needs no sce-codegen binary). But it
      # does NOT remove libxml2: `sce-forge-runtime` — the RUNTIME support crate
      # every generated codec links — has its OWN build.rs build-dependency on
      # `sce-build` (-> the `libxml` crate -> native libxml2). So compiling
      # wz-runtime-tokio compiles sce-forge-runtime's build script, which links
      # libxml2. macOS finds it via system pkg-config; windows-msvc resolves it
      # through vcpkg and HARD-PANICS ("Could not find libxml2") without this
      # install. (R311y22d wrongly dropped this step, assuming committed codegen
      # removed ALL libxml2 need; the Linux-cached build hid the
      # sce-forge-runtime build-dep, the fresh windows CI caught it — R311y22f
      # re-adds it. The deeper fix — sce-forge-runtime not build-depping
      # sce-build — is SCE-upstream.) The `build sce-codegen` step stays removed:
      # the AP build runs no codegen, so it needs the libxml2 LIBRARY but not the
      # sce-codegen binary (macOS passes without either).
      - name: Install libxml2 (Windows; sce-forge-runtime build-deps sce-build -> libxml)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install libxml2:x64-windows-static-md
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> "$GITHUB_ENV"

      - name: cargo clippy — wz-runtime-tokio (default AP surface)
        # The portable AP stack (tcp/udp transport, pub/sub, query, declare,
        # liveliness). No unix-only backend in the default set, so it compiles
        # natively on macOS + Windows. R311y13: clippy -D warnings (not bare
        # `check`) so the mac/win gate matches the project's universal lint bar
        # and runs codegen, not just type-check.
        shell: bash
        run: (cd crates && cargo clippy -p wz-runtime-tokio -- -D warnings)

      - name: cargo clippy — quic-datagram (portable quinn datagram path)
        # The off-default datagram backend. quinn is cross-platform; wz reads the
        # per-datagram MTU at RUNTIME (connection.max_datagram_size), so there is
        # no per-OS const — this leg proves the quinn/rustls datagram stack
        # compiles + lints clean natively on macOS + Windows, the arms the Linux
        # `ci` job cannot reach. R311y13: clippy -D warnings, not bare `check`.
        shell: bash
        run: (cd crates && cargo clippy -p wz-runtime-tokio --features transport-link-quic-datagram -- -D warnings)
