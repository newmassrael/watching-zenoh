#
# watching-zenoh CI — automated production gate.
#
# Mirrors the local git-hook + verify-codegen.sh + cargo test
# discipline so PRs and main-branch pushes get the same gates that
# every commit on a developer machine already passes (via .githooks/
# pre-commit + commit-msg + pre-push). Three layers run sequentially;
# any one failing fails the workflow.
#
# Layer A — Mnemosyne workspace integrity:
#   mnemosyne-cli validate-workspace must report no NEW T1 orphan
#   (ledgered carry allowed). R408 (2026-06-04) made the scan
#   store-direct; the round-trip + GENERATED.md=sync dimensions were
#   retired upstream (mnemosyne R395-R400).
#   Drift here means a typed-mutate primitive was bypassed (raw Edit
#   on a registered doc, direct sidecar JSON edit, or a frozen-ledger
#   violation). Pre-commit + pre-push hooks already enforce; CI is
#   the cross-developer safety net.
#
# Layer A2 — Envelope mid value= audit (R111 / R117 CI yml sync):
#   scripts/audit-mid-values.sh rejects any sources/codecs/*.scxml
#   whose envelope-level <sce:flag name="mid"> declaration lacks
#   `value=`. R108a precedent: request.scxml had no mid value=
#   from R90 onward, emitting first wire byte 0x40 instead of 0x5C;
#   wz-side round-trip stayed green because the bake was internally
#   consistent, only the Layer 3 wire-compare against zenoh-pico's
#   `_z_request_encode` surfaced the defect at R108b. The audit
#   script is a build-time preventer for that whole class.
#
# Layer B — codegen + Layer 3 wire-interop per codec:
#   For each `sources/codecs/*.scxml` paired with the matching SCE
#   fixture (when one exists), scripts/verify-codegen.sh runs:
#     L1: 6-backend emit-success
#     L2: stem-normalized body-golden vs SCE fixture
#     L3: cargo test wz-integration-tests layer3_<stem> (when present)
#   Each layer's failure exits non-zero.
#
# Layer C — Rust workspace tests + lints:
#   cargo test --workspace + cargo clippy --workspace --all-targets
#   --deny warnings. The clippy gate runs on the entire crate tree
#   including generated code; deny-warnings is the production policy
#   ratified in workspace Cargo.toml `[workspace.lints.rust]`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# R311y619 — only the newest run per ref survives.
#
# Three full runs were live at once on 2026-08-09 (heads 500a52e4, 6eb2b15b,
# 43dc4e16) because three pushes landed inside twenty minutes and each started
# its own 15-job matrix. Two of them were already validating a tree the third
# contained, and one was re-proving a defect the second had fixed: 45 job-runs
# where 15 was the whole question.
#
# That was a one-off human mistake then, and it becomes the STANDING condition
# once the headless round runner (scripts/round-runner.sh) pushes once per
# round. A round waits for its own hosted verdict before continuing, so the
# usual case never queues a second run — but any burst does, and a superseded
# run is compute spent on a tree nobody will ship.
#
# Grouped by ref rather than globally: `push` to main and a `pull_request` carry
# different `github.ref`, so a PR's run is never cancelled by a push to main.
# The trade is explicit: an intermediate commit can end WITHOUT a completed run
# of its own. That is the right trade here because main is the only pushed
# branch and the question this gate answers is "is the tip shippable", never
# "was each intermediate commit green".
# R311y704 — cancellation is right on a BRANCH and wrong on `main`, and the
# difference was measured rather than argued.
#
# On a branch only the tip matters, so a superseded run is wasted runner time.
# On `main` every commit is a state someone can bisect to, and the run IS its
# verdict. With cancellation on, a sequence of pushes leaves NO commit with one:
# R311y701 through R311y703 were pushed in succession and all three runs came
# back `cancelled` -- five in a row counting the two before them. Two Layer C0
# reds fixed in R311y701 have therefore never been confirmed on hosted CI, and
# `cancelled` is neither red nor green, so nothing even reported the gap.
#
# The cost of this is runner time: pushes to main now QUEUE rather than
# superseding each other. That is what the runner time is for.
# R311y706 — and `cancel-in-progress: false` was only HALF of it. MEASURED on
# the very next pair of pushes: the run for `345ee1cb` survived two of them
# (which is the flag working, and would not have happened before), while the run
# for `3210c80a` -- the commit carrying the fix -- was CANCELLED at 05:08 while
# still QUEUED. GitHub's flag protects the run that is already executing; a
# pending run is superseded regardless, because a group keeps at most one.
#
# R311y704's carry predicted "two in succession should now yield two runs that
# both reach a conclusion". That was wrong, and this is the correction: on main
# the group is per-COMMIT, so nothing supersedes anything and every commit gets
# its own verdict. Branches keep the collapsing group, where only the tip
# matters.
#
# The cost is queue time rather than money -- Actions is free for public repos
# on standard runners -- and it is the cost R311y704's own argument already
# accepted: every commit on main is a state someone can bisect to, and the run
# IS its verdict.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # CI runners are EPHEMERAL (fresh checkout per run, no target-dir reuse),
  # so incremental compilation builds per-crate incremental state that is
  # never reused -- pure overhead across the ~200-combo feature matrix.
  # Disable it on CI only (the workflow env, NOT run-ci.sh, so local dev keeps
  # incremental's edit-rebuild benefit). A/B: compare the next run's
  # `validate + verify + test` job wall-clock against the ~14m49s baseline.
  CARGO_INCREMENTAL: "0"
  # The vendored SCE submodule + zenoh-pico submodule both need fetch.
  # checkout v4's submodule support honors .gitmodules per the
  # `submodules: recursive` flag below.
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: validate + verify + test
    # Ubuntu 22.04 ships gcc 11 + libclang-14 + cmake 3.22 (sufficient
    # for zenoh-pico CMakeLists.txt) + bash 5. Pinning the runner OS
    # version keeps Layer 2 byte-golden output deterministic across
    # SCE codegen invocations.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # R311y297 — reclaim the runner's preinstalled software before anything
      # else. THIS JOB HAS NO OTHER DISK HEADROOM: it builds the whole
      # workspace, then ~20 more feature-subset lanes (C1b..C1i, C4, C4b),
      # each of which is a DISTINCT feature set and so a DISTINCT set of
      # artifacts in `crates/target` — plus zenoh-pico's CLI binaries and
      # wz-ap-demo for the Layer E interop lanes. Debug artifacts dominate,
      # and the total grows monotonically as atoms land.
      #
      # R311y296 is what tipped it over: the run passed EVERY layer through
      # E5 and then died with `System.IO.IOException: No space left on
      # device` while the Actions runner was writing its OWN diagnostic log.
      # No wz gate failed. The prior green run (y291) had already taken 25m31s
      # against `timeout-minutes: 30`, so both ceilings were being approached
      # at once and nothing reported either.
      #
      # ubuntu-22.04 ships ~25-30 GB of software this job never uses. Pruning
      # it is the standard remedy and costs ~15s. Safe for THIS job
      # specifically: it uses only `actions/checkout` + `Swatinem/rust-cache`,
      # its Rust comes from rustup and its python3 from apt (`/usr/bin`), so
      # nothing here lives in the hosted tool cache. (The Zephyr job DOES use
      # `actions/setup-python`, which is why this step is not hoisted to a
      # shared spot — it is scoped to the job whose disk actually overflowed.)
      #
      # The `df -h` bracket is not decoration. The failure above was
      # undiagnosable from the log precisely because nothing ever reported
      # free space; a future squeeze should be visible BEFORE it is fatal.
      - name: Budget stamp — start this job's own clock
        # R311y791 — the read end is the "Budget margin" step at the bottom of
        # this job. FIRST step on purpose: the margin that matters is the one
        # `timeout-minutes` measures, which starts when the job does, so a
        # stamp taken after the prune or the checkout would under-report
        # exactly the provisioning cost that has been growing.
        run: date +%s > "$RUNNER_TEMP/wz_job_start"

      - name: Free runner disk space (headroom for the feature-matrix lanes)
        run: |
          echo "=== free space BEFORE prune ==="
          df -h /
          # `|| true` throughout: a path absent on a future runner image must
          # not fail the build — this step is headroom, not a gate.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "=== free space AFTER prune ==="
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # full history for git-log-based commit↔ledger drift check

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # cmake + libclang-dev are needed by zenoh-pico-sys (cmake
        # crate + bindgen). perl is GA on Ubuntu but listed for
        # documentation completeness — used by verify-codegen.sh
        # Layer 2 include-block sort step.
        # R311y420 — `shellcheck` is NO LONGER in this list. It moved to its
        # own pinned + checksummed step below, closing the asymmetry R311y416
        # introduced and R311y417 disclosed: actionlint was pinned while
        # shellcheck floated on apt, so its version rode the `runs-on:`
        # image and a runner-OS bump was a silent linter bump.
        #
        # R311y534 — `pkg-config` joins the list, and Mbed TLS deliberately does
        # NOT. zenoh-pico's `Z_FEATURE_LINK_TLS` arm resolves Mbed TLS through
        # `pkg_search_module(MBEDTLS REQUIRED ...)`, and Ubuntu's own
        # `libmbedtls-dev` ships headers and a `.so` with NO pkg-config metadata
        # at all — so installing the distro package would satisfy the compiler
        # and still fail pico's CONFIGURE step. `scripts/install-mbedtls.sh`
        # provisions a pinned, checksum-verified upstream Mbed TLS into a
        # repo-local prefix instead (build-zenoh-pico-cli.sh calls it), which is
        # the same treatment zenoh-c and shellcheck already get here. What apt
        # owes is only the TOOL that reads the `.pc` it installs.
        #
        # R311y865 — `pkg-config` is KEPT although the pico build that wanted it
        # moved to `e2e-demo`. Dropping it would be a guess about which of the
        # ~20 remaining lanes' build scripts read a `.pc`, and nothing here has
        # measured that; the package costs about a second. Recorded so the next
        # reader knows the reason above is now historical rather than current.
        #
        # R2104 (open-debt item 522) — that measurement now EXISTS, and it says
        # keeping it was right for a reason nobody had: the `libxml` crate's
        # build script probes `libxml-2.0`, so every job compiling it needs both
        # the tool and `libxml2-dev`. Ten jobs had neither and were getting them
        # from the runner image. `apt_package_census.py`'s shortfall arm derives
        # the requirement from the resolved build graph and reds on a job that
        # reaches the crate without installing them.
        run: |
          bash scripts/lib/apt-install.sh cmake libclang-dev libxml2-dev clang perl pkg-config

      - name: Install shellcheck (pinned + checksum-verified)
        # Same contract as the actionlint step below, and for the same reason:
        # an unpinned linter turns an upstream release — or here, a runner
        # IMAGE bump — into a spontaneous red on an unrelated push.
        #
        # WHY IT MATTERS MORE NOW than when R311y417 disclosed it as "latent,
        # not live". That assessment measured 0.8.0 / 0.9.0 / 0.10.0 agreeing
        # on this tree, but Layer 0 then linted only the `run:` blocks inside
        # .github/workflows/ via actionlint. R311y419 put scripts/*.sh,
        # scripts/lib/*.sh and .githooks/* in scope, and on THAT surface the
        # versions do not agree at all: 0.11.0 finds 5 SC2086 that 0.8.0 misses
        # (unquoted `return $fail`, all fixed in the same commit) plus SC2329,
        # a check 0.8.0 does not have. The exposure went live the moment the
        # lint surface grew, which is why the pin lands with it.
        #
        # 0.11.0 rather than the 0.8.0-2 the ubuntu-22.04 image ships: pinning
        # forward gets the newer checks, and pinning to the floating value
        # would have frozen a 2021 release to avoid triaging its successors'
        # findings. Bumping this pin is a deliberate commit — expect new
        # findings, and expect them in BOTH the Layer 0.2 script lane and
        # actionlint's SC* integration, which shares this binary.
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
        run: |
          set -euo pipefail
          tgz="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          trap 'rm -rf "$tgz" "shellcheck-v${SHELLCHECK_VERSION}"' EXIT
          curl -sSLf --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 120 -o "$tgz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tgz}"
          echo "${SHELLCHECK_SHA256}  ${tgz}" | sha256sum -c -
          tar xzf "$tgz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        # `rustup show` materialises the toolchain the repo pins — channel +
        # components + targets, all declared in rust-toolchain.toml — and every
        # cargo invocation inside the checkout then resolves to it.
        #
        # NOT dtolnay/rust-toolchain@stable (what this was until R311y267):
        # `stable` FLOATS. On 2026-07-09 it floated 1.96 -> 1.97 mid-stream, and
        # since rustc codegen size drifts across releases while Layer Q gates the
        # MCU .text on an absolute byte count, hosted CI went red for ~20 pushes
        # on a compiler bump that no commit asked for. The workspace
        # `rust-version` field is an MSRV LOWER BOUND for consumers — it never
        # pinned the build compiler, which is what a byte-exact footprint gate
        # needs.
        #
        # The action's `components:` / `targets:` inputs are gone for a second,
        # sharper reason: they attach to whatever toolchain the action installs,
        # while cargo resolves the PINNED one from the toolchain file. Embedded
        # targets would land on `stable` and be missing on the toolchain that
        # actually builds — and run-ci.sh SKIPs a target it cannot find, so the
        # footprint gate would go quietly GREEN instead of failing. A SKIP is
        # green; the pin owns components + targets so it cannot happen.
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      # Layers A/A2/A3/A4 + B/B2 and their two heavy tool installs
      # (mnemosyne-cli ~88s, sce-codegen build ~121s) were SPLIT into the
      # parallel `validate-codegen` job (R311y385) — none of them compiles
      # crates/target, so the C/E test lanes below lose no warm-target reuse
      # and this job's critical path sheds ~349s plus both installs. Same
      # rationale as this file's interop and footprint splits.
      #
      # Every Layer lane below delegates to scripts/run-ci.sh --layer X, so
      # lane logic lives in exactly one file (R65b). R311y415 — this used to
      # add "the single source of truth the local pre-push hook also
      # invokes, so the two paths cannot drift". R311y386 removed that
      # delegation: .githooks/pre-push runs validate-workspace plus a
      # changed-crate `cargo test -p` and never calls run-ci.sh. Hosted CI
      # is now the only place the full lane set runs.

      - name: Install actionlint (pinned + checksum-verified)
        # R311y416 — Layer 0's actionlint half had never once executed:
        # nothing installed the binary, and the ONE hosted run the lane ever
        # had before this (30233462393) logged `actionlint SKIP`. R311y414
        # and R311y415 both DISCLOSED that rather than closing it; this is
        # the close. (R311y417 narrowed "SKIPping on every runner", which
        # implied a history of runners; there was exactly one.)
        #
        # A pinned release tarball, not `go install ...@latest`: an unpinned
        # linter turns an upstream release into a spontaneous red on an
        # unrelated push, which is the same reproducibility trade
        # rust-toolchain.toml and scripts/install-mnemosyne-cli.sh's
        # MNEMOSYNE_REV already make in this repo. The sha256 is the one
        # published in the release's own checksums.txt.
        # Bumping the pin is a deliberate commit — expect new findings.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # R311y417 — `trap` so a checksum mismatch or a truncated fetch does
          # not leave a partial tarball in $GITHUB_WORKSPACE for later steps.
          trap 'rm -f "$tgz" actionlint' EXIT
          # R311y417 — retries. A single transient network blip on an
          # unrelated push would otherwise red the build, which the repo's
          # no-flaky-ever rule does not accept for a provisioning step.
          # Still LOUD on a real failure: -f keeps HTTP errors non-zero and
          # the sha256 check below is unconditional.
          curl -sSLf --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 120 -o "$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tgz}"
          echo "${ACTIONLINT_SHA256}  ${tgz}" | sha256sum -c -
          tar xzf "$tgz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Layer 0 — preflight lints (cargo fmt --check + actionlint)
        # R311y415 — Layer 0 existed in run-ci.sh but appeared in NO hosted
        # `--layer` set, and .githooks/pre-push stopped running it at
        # R311y386 (the fast-gate reversal, whose own header lists fmt among
        # what it deliberately no longer covers).
        #
        # A first cut of this comment concluded "so fmt was gated nowhere".
        # Review falsified that: `.githooks/pre-commit` Check 2 already runs
        # `(cd crates && cargo fmt --all -- --check)` whenever a
        # `crates/**.rs` is staged. The gap this step closes is narrower and
        # still real — pre-commit filters on `^crates/.+\.rs$` and runs only
        # in `crates`, so the SIX auto-discovered `deploy/*` workspaces were
        # gated by nothing, and the whole hook path is skipped by
        # `--no-verify` or an uninstalled core.hooksPath.
        #
        # First of the Layer lanes (6 setup steps precede it — R311y417:
        # y416 added the actionlint install and left the count at 5), so a
        # fmt-dirty push is rejected before the expensive lanes, not after.
        # `cargo fmt --check` compiles nothing and rustfmt is already
        # materialised by rust-toolchain.toml's `components`, so the step
        # needs no extra install — but it is not free. MEASURED HOSTED:
        # 23s on run 30233462393 (fmt only — actionlint was still SKIPping
        # there), and 29s on run 30235292100 once R311y416 armed the
        # actionlint half; the install step adds 0.8s and actionlint itself
        # 0.9s. Job totals 599s then 625s, both inside the 584-928s band
        # the feature-gates comment records from before this step existed.
        # R311y415 projected ~45-75s and was WRONG BY 2-3x, high.
        # DO NOT DERIVE A MULTIPLIER FROM THIS. y415 wrote "the real ratio
        # is ~0.8x" off a single sample (23s hosted / 26-30s local); the
        # very next run gives 29s against 18-21s local, i.e. 1.4-1.6x the
        # other way, and both sides swing ~40% run to run. What the
        # measurements settle is the ORDER — tens of seconds — not a ratio.
        # The narrower lesson that survives: y414's 3.29x is a parallel
        # cargo-test number and this lane is 99% CPU single-threaded, so
        # borrowing it was wrong; borrowing from same-CPU-profile lanes was
        # also wrong. Measure the lane.
        #
        # It DOES need the recursive checkout above: `cargo fmt --all`
        # resolves the whole workspace manifest, so a tree without
        # vendor/sce fails in `cargo metadata` before rustfmt ever runs.
        # R311y416 — Layer 0's actionlint half is REAL here now. The step
        # above installs a pinned, checksum-verified binary, and
        # WZ_LINT_REQUIRE=1 makes an absent actionlint OR an absent
        # shellcheck FATAL instead of a SKIP, so a broken download reds the
        # lane rather than quietly restoring the state y414/y415 disclosed.
        # The 3 pre-existing findings (SC1090 x2, SC2086, all in the
        # zephyr-mcu job) were fixed in the same commit that turned this on,
        # so it lands green rather than red-then-fix.
        # R311y419 — WZ_LINT_REQUIRE now arms a THIRD lane, 0.2: shellcheck
        # over the repo's own scripts/*.sh + .githooks/*, a surface disjoint
        # from the workflow `run:` blocks actionlint covers and previously
        # linted by nothing. Its pre-existing findings were likewise fixed in
        # the same commit, so this too lands green — but the count is worth
        # recording because it is not the one a first look gives: 11 were
        # visible, and 2 of those were malformed-directive parse errors
        # (SC1073/SC1072) that had suppressed analysis of ALL of run-ci.sh;
        # clearing them exposed 4 more, for 13 ordinary findings resolved.
        # Local cost +1s over 18 files; the fmt half still dominates the lane.
        env:
          WZ_LINT_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer 0

      - name: Layer C0 — binary-dep test #[ignore] discipline
        # R235-hotfix — pre-flight scan: any wz-integration-tests
        # `tests/*.rs` that calls wz_ap_demo_binary() or
        # zenoh_pico_cli_binary( MUST mark every #[test] with an
        # adjacent #[ignore = "..."] so Layer C1 (cargo test
        # --workspace) skips it on fresh CI checkouts where the
        # required binaries are not yet built. Catches the bug
        # class at PR time rather than after Layer C1 panics with
        # "binary not found" downstream.
        run: bash scripts/run-ci.sh --layer C0

      - name: Layer C1 — cargo test --workspace
        run: bash scripts/run-ci.sh --layer C1

      - name: Layer C1so — every cdylib carries its SONAME
        # R2103 (open-debt item 521). In THIS job because Layer C1 above has
        # just compiled the whole workspace at the dev profile, so the five
        # cdylibs the gate reads are already linked and it costs a `readelf`
        # each. A job of its own would rebuild them to learn the same thing.
        #
        # WZ_SONAME_REQUIRE turns the gate's non-ELF SKIP into a FAIL. This
        # runner is Linux, so the SKIP path here could only mean the gate
        # stopped recognising the platform it is for -- and a lane that SKIPs
        # where the job provisions its input is a provisioning regression
        # wearing a green badge (the A3/A4/A5/Qz rule).
        env:
          WZ_SONAME_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer C1so

      # ─── R311y865: Layer C1cc, the zenoh-c oracle and the pico CLI build all
      # LEFT this job for `capi-c-arms`, and Layers E / E3 / E4 / E4i / E5 /
      # E5u / E7u / E6u left for the new `e2e-demo` job. See the budget note at
      # the `Budget margin` step below for the measurement that forced it.
      - name: Layer C1bv — §5.24 dynamic storage-volume loading (unit + ABI + wire)
        # R311y497. Wired in the SAME commit that adds the lane.
        #
        # In THIS job rather than the cross-impl one, and that placement is the
        # R311y495 lesson APPLIED instead of re-learned: C1bp bundles its unit legs
        # with a pico e2e, was wired into this job, and SKIP-passed its first hosted
        # run after 86s of real work because this job provisions no pico CLI. So
        # R311y497 split the atom's proof in two — C1bv touches no foreign binary at
        # all and therefore cannot skip anywhere, while every leg that needs pico is
        # Layer E14, in the job that provisions it.
        #
        # It covers the two halves a dlopen boundary has: the ABI gate (a pure
        # function, so exhaustively unit-testable — and it checks TWO layout
        # fingerprints, since unlike the plugin ABI this one passes a struct by
        # pointer), and the host driving a REAL cdylib across it, with the volume's
        # own out-of-band counters confirming the calls landed. Plus the wire half:
        # the storage-add payload's volume selection, without which a loaded volume
        # is unreachable from any client.
        run: bash scripts/run-ci.sh --layer C1bv

      - name: Layer C1b — cargo test -p wz-runtime-core --features alloc
        # R269 — workspace test uses default features so the alloc-
        # gated panic_payload / Error-trait tests in wz-runtime-core
        # would otherwise never run in CI. This lane runs them
        # explicitly; the crate's MCU-target no-default-features
        # build is still validated by Layer C2 (-D warnings).
        run: bash scripts/run-ci.sh --layer C1b

      - name: Layer C1c — cargo test -p wz-session-core --features codec-declare
        # R311ds — same shape as C1b. The workspace test runs the
        # codec-declare-gated wz-session-core declare tests only because
        # wz-runtime-tokio's defaults transitively enable
        # wz-session-core/codec-declare. This lane runs the 58 gated
        # tests (54 R311ds behavioural + 4 R311dm thin) explicitly so
        # coverage cannot silently drop if that transitive enable changes.
        run: bash scripts/run-ci.sh --layer C1c

      - name: Layer C1d — cargo test -p wz-session-core (pub/sub data plane)
        # R311du — same shape as C1c. The migrated pubsub
        # SubscriberRegistry test module gates on the full pub/sub
        # data-plane feature union; the workspace lane runs them only via
        # wz-runtime-tokio's transitive defaults. This lane enumerates
        # the union explicitly so coverage cannot silently drop if those
        # defaults change.
        run: bash scripts/run-ci.sh --layer C1d

      - name: Layer C1e — cargo test -p wz-session-core (query dispatch plane)
        # R311dx — same shape as C1d. The migrated QueryableRegistry test
        # module gates on the query dispatch feature union (query-queryable
        # implies codec-request + codec-response, plus query-attachment /
        # query-selector-parameters / query-reply-err / codec-response-final);
        # the workspace lane runs them only via wz-runtime-tokio's transitive
        # defaults. This lane enumerates the union explicitly so coverage
        # cannot silently drop if those defaults change.
        run: bash scripts/run-ci.sh --layer C1e

      - name: Layer C1f — cargo test -p wz-session-core (reply dispatch plane)
        # R311dy — same shape as C1e. The migrated ReplyRegistry test
        # module gates on the reply dispatch union (codec-response +
        # codec-response-final + pubsub-put + pubsub-delete +
        # query-queryable, plus codec-push for the pubsub dispatch path);
        # the workspace lane runs them only via wz-runtime-tokio's
        # transitive defaults. This lane enumerates the union explicitly
        # so coverage cannot silently drop if those defaults change.
        run: bash scripts/run-ci.sh --layer C1f

      - name: Layer C1g — cargo test -p wz-session-core (observer dispatch plane)
        # R311dz — same shape as C1f. The migrated ApplicationLayerObserver
        # test module gates on the full fan-out union (codec-push +
        # codec-declare + query-queryable + liveliness-token +
        # liveliness-subscriber + declare-subscriber + declare-queryable +
        # codec-response-final + pubsub-put/delete). The lane also adds a
        # composability build of the codec-declare-on / query-queryable-off
        # subset, which composes the observer with the queryable slot
        # elided — the arbitrary-subset class the maximal-preset C1c-f
        # tests never exercise.
        run: bash scripts/run-ci.sh --layer C1g

      - name: Layer C1own — the own-space (M=0) witness lane (R311y740)
        # R311y744 — wired here, one round LATE. R311y740 registered the lane
        # in run-ci.sh and did not add it to this file, so it ran only in a
        # local full sweep; Layer C0's unwired-lane gate (R311y581) caught it
        # on the hosted run, which is exactly the job it exists for. The lane
        # needs no provisioning beyond the toolchain this job already has.
        run: bash scripts/run-ci.sh --layer C1own

      - name: Layer C1h — wz-session-core arbitrary-subset composability matrix
        # R311ea — the C1c-g lanes each build wz-session-core under ONE
        # maximal feature union, so a gating regression that only shows in
        # a deliberately-incomplete coherent subset passes CI invisibly.
        # This lane builds the crate under several representative consumer
        # profiles (minimal / pubsub-only / queryable-only / zget-reply /
        # declare-observer / codec-declare-bare); deny-warnings turns every
        # subset-specific unused-import / dead-code into a hard error.
        run: bash scripts/run-ci.sh --layer C1h

      - name: Layer C1ca — the derived Open-body initial_sn
        # R311y816 — zenoh derives an OpenSyn / OpenAck `initial_sn` from the
        # (own zid, peer zid) pair (`compute_sn`); wz announced a literal 0.
        # Count-guarded on both halves: the wz-session-core derivation is
        # `codec-open-body`-gated and no other test lane names that feature,
        # and the wz-runtime-tokio encode-seam tests otherwise ride only
        # Layer C1's unfiltered workspace run, where a cfg that stopped
        # matching would just make a summary number smaller.
        run: bash scripts/run-ci.sh --layer C1ca

      - name: Layer C1cb — the initiator's InitAck admission rules
        # R311y817 — both references refuse an InitAck that over-claims
        # against the InitSyn actually sent, on FOUR parameters: the body's
        # three sizes (enforced since R311kc) and the `0x7` PATCH level on
        # the ext chain, which wz silently min()ed down instead. The whole
        # `session_fsm_driver_loop` target is count-guarded because no other
        # lane in run-ci.sh selects it — it otherwise rides only Layer C1's
        # unfiltered workspace run, where a target that stopped compiling
        # would just make a summary number smaller.
        run: bash scripts/run-ci.sh --layer C1cb

      - name: Layer C1cg — subsystem runtime partitioning
        # R311y825 — zenoh isolates five runtimes (app/acc/tx/rx/net) with
        # independently tunable worker and blocking-thread counts; wz spawned
        # onto whichever runtime was ambient, so a saturated RX path starved
        # TX. The whole `runtime_partition` target is count-guarded because no
        # other lane selects it. Two of the fourteen are the PRE-fix
        # measurement, kept green as the discriminator against a "partition"
        # that hands every subsystem the same runtime.
        run: bash scripts/run-ci.sh --layer C1cg

      - name: Layer C1ch — the linked library says which config keys it honours
        # R2172 (open-debt item 548) — `wz_dissect_readable_surfaces` set the
        # precedent that a build reports what it can READ out of its own
        # dispatch; configuration had no counterpart, so a consumer asking
        # which keys THIS build honours was left parsing
        # `wz-runtime-tokio/src/zenoh_config.rs` — and a parser aimed at a
        # module that MOVED does not go red, it reports an empty set.
        #
        # In THIS job and not the C1cc..C1ce cluster: every lane there needs
        # the machine-local zenoh-c oracle and SKIPs without it, which would
        # have made the one check of a wz-own door conditional on somebody
        # else's installation. This one opens wz's own cdylib through ctypes.
        run: bash scripts/run-ci.sh --layer C1ch

      - name: Layer C1cf — every crate builds with default features off
        # R311y821 — nothing local built a SHRUNKEN feature combination of a
        # changed crate, so a cfg-gated import behind an ungated signature was
        # invisible to `--all-features` clippy BY CONSTRUCTION. The class fired
        # twice (R311y809, R311y811) and the second reached origin. Measured
        # cost: 49 of 53 members are already clean bare; the 4 that are not fail
        # only in their TEST targets, and three of those are checked lib-only.
        run: bash scripts/run-ci.sh --layer C1cf

      # R2163 — Layer C1cn MOVED OUT of this job, to `nondefault` below. It was
      # 562s of the 1790s that tripped `job-budget-margin.sh` at 99%, every lane
      # green; see that job's header for the measurement and for why a split
      # rather than a bigger `timeout-minutes`.

      - name: Layer C1i — scouting-active glue unit tests
        # R311ep — scouting-active is off by default, so Layer C1's
        # `cargo test --workspace` never builds the scouting glue. This
        # lane builds + runs the deterministic scouting unit tests
        # (Scout framing / Hello-locator extraction / scout-timeout)
        # under --features scouting-active + deny-warnings. The
        # socket-bound multicast e2e is the opt-in Layer M (multicast
        # routing is environment-dependent; not a default gate).
        run: bash scripts/run-ci.sh --layer C1i

      - name: Layer C2 — cargo clippy --deny warnings
        run: bash scripts/run-ci.sh --layer C2

      - name: Layer C4 — wz facade preset composability matrix
        # R311eb — cargo-builds the wz facade under all 7 named presets
        # (mcu-minimal/-extended, ap-client/-router/-full, zenoh-cpp,
        # cortex-m4-default) so a preset feature-list drift or incoherent
        # combo cannot pass CI invisibly. Facade-level analog of C1h;
        # enforced here (unlike the local-only C3 lint-isolation lane)
        # because it is a composability guard, not a redundant lint pass.
        # no_std footing of the MCU presets stays Layer G's cross-compile.
        run: bash scripts/run-ci.sh --layer C4

      - name: Layer C4b — wz facade arbitrary-incomplete-subset matrix
        # R311ek — cargo-builds the wz facade under deliberately-incomplete
        # coherent consumer subsets (pubsub-only / queryable-only /
        # zget-reply-only / declare-observer). The named-preset C4 lane
        # only covers COMPLETE profiles, and C1h only covers the
        # wz-session-core layer; this lane is the facade-level analog of
        # C1h that locks the runtime-tokio glue's over-broad-gating
        # regression class (observer / liveliness_subscriber / source_info
        # ext encoder) the default-feature CI never exercises.
        run: bash scripts/run-ci.sh --layer C4b

      - name: Install python3-yaml (Layer D dep)
        # Layer D's run-ci.sh path no-ops gracefully when python3-yaml
        # is missing; on CI we install it explicitly so the lane
        # runs the real check rather than the local-developer skip.
        run: bash scripts/lib/apt-install.sh python3-yaml

      - name: Save apt archives
        # AFTER the second apt step, not the first: this job installs twice and
        # a save placed between them would carry only half the archive, then sit
        # on a key nothing updates. See the `feature-gates` copy for the rest.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Layer D — deploy/*.yaml schema validate
        run: bash scripts/run-ci.sh --layer D

      - name: Layer L — every committed Cargo.lock resolves
        # R311y490. Wired in the SAME commit that adds the lane. Eight independent
        # cargo workspaces live here (crates/, xtask/, six under deploy/) and NONE
        # of their locks was checked, so deploy/mcu-multicast-e2e/Cargo.lock rotted
        # unnoticed: wz-runtime-tokio gained an optional libc and that workspace's
        # lock was never refreshed, leaving any build in that directory to rewrite
        # a committed file and dirty an otherwise untouched tree.
        #
        # `cargo metadata --locked --offline` per workspace. Only the
        # lock-would-change error fails; a dependency missing from the local cache
        # (this tree has a macOS-only io-kit-sys) is reported and skipped, because
        # a lane that conflates the two is one that gets disabled.
        run: bash scripts/run-ci.sh --layer L

      # ─── R311y865: everything from `Build wz-ap-demo` through Layer E6u moved
      # to the `e2e-demo` job below. What they share is not a subsystem — it is
      # that each one SPAWNS A BINARY and waits on it, so each needs a demo build
      # (and, for Layer E, a zenoh-pico CLI) that no cargo-test lane in this job
      # needs. They were 231s of a job at 91% of its ceiling.
      - name: Budget margin — this job may not approach its timeout in silence
        # R311y791 — THE GATE THIS FILE HAS TWICE WISHED FOR AND TWICE NOT
        # BUILT. y296 recorded that "both ceilings were being approached at
        # once and nothing reported either" and fixed only the disk one; y351
        # wrote "Nothing reported the margin — exactly what ci.yml:84-86
        # predicted in y297 and left standing". y791 is when the time ceiling
        # actually fired: run 31711867852 was CANCELLED at 30m20s, which grades
        # nothing, so a ledger commit reached origin with no hosted verdict.
        #
        # WHY IT FAILS RATHER THAN WARNS. A warning is what the last two rounds
        # already had, in prose, and neither was read until the ceiling hit. By
        # the time this fires every lane above it has RUN and reported, so the
        # red says "everything passed and the budget needs attention" — which
        # is strictly more information than a cancel, and it arrives while
        # there is still room to act. An annotation nobody is obliged to read
        # is the failure mode, not the remedy.
        #
        # THE THRESHOLD is 90% of the budget, chosen from measurement rather
        # than taste: across the 12 completed `ci` jobs ending at run
        # 31732246052 the successful ones spanned 23m39s-28m50s against 30m —
        # 79% to 96% — so 90% sits inside the band that was already producing
        # cancels and above where the job lands after the y791 C0mut split
        # (~62%). Both numbers live here, next to `timeout-minutes`, because
        # they are one fact: move that and move these.
        #
        # `always()` so a run that goes red elsewhere still reports its margin.
        # A run killed BY the timeout cannot reach this step at all — that is
        # the case this exists to prevent, not to diagnose.
        # R311y794 — the 4th argument is the FLOOR. The number that would make
        # it fire is a FUTURE split; a job peeled down to nothing should be
        # told to give its budget back.
        #
        # R311y795 MEASURED THE SPLIT: run 31751783653 put this job at 1066s,
        # 59% of budget, against 1730s (96%) before the C0mut peel. The y791
        # prediction was ~62%. 30 stays here rather than dropping to the 20 its
        # siblings took, because this job's own spread is narrow (1639s median
        # / 1730s max pre-split) and 59% sits twice as far above 30 as the
        # variance.
        #
        # R311y865 — AND THE SPREAD IS NOT NARROW, WHICH IS WHY THAT SPLIT DID
        # NOT HOLD. This gate then fired on two consecutive runs at 91%
        # (32155180723, 32160845314), every lane above it green. Per-step times
        # off run 32155180723's job log say where 1650s went, and the largest
        # single entry is not a lane:
        #
        #     actions/checkout@v4      258s   (77s on an earlier run; 461s on y861's)
        #     Layer C1cc               202s   -> capi-c-arms
        #     Layer C1                 176s
        #     Layer C1cf               166s
        #     Layer E + E3..E6u        210s   -> e2e-demo
        #     apt-get update            88s   (now bounded; see apt-install.sh)
        #     Layer C4                  88s
        #     ...every other lane      <70s each
        #
        # Setup alone — prune, checkout, apt, rustup, cache — is 418s, 25% of the
        # budget before a lane runs, and CHECKOUT'S OWN VARIANCE IS 384s. That is
        # the number the y795 note missed: a margin smaller than the variance of
        # one step is not a margin. So this round peels 433s (C1cc + its two
        # oracle steps + the pico CLI build to capi-c-arms; the eight demo lanes
        # and their build to e2e-demo), which lands this job near 68% and leaves
        # room the checkout can move inside.
        if: always()
        run: bash scripts/lib/job-budget-margin.sh "$RUNNER_TEMP/wz_job_start" 1800 90 30 '${{ job.status }}'

  # ─────────────────────────────────────────────────────────────────
  # R311y385 — the VALIDATE + CODEGEN job. Layers A/A2/A3/A4 (Mnemosyne
  # workspace validate + catalog/cross-impl truthfulness) and B/B2
  # (per-codec verify-codegen + committed out/** regen-diff) ran as the
  # first ~349s of the `ci` job, GATED behind its two heaviest provisioning
  # steps: Install mnemosyne-cli (~88s, used ONLY by Layer A/A3/A4) and
  # Build sce-codegen (~121s, used ONLY by Layer B/B2). Neither tool, and
  # none of these layers, compiles crates/target — A3/A4 text-parse
  # Cargo.toml + cfg sites, Layer B runs the vendor/sce binary, B2 builds
  # xtask into its own target — so peeling them here costs the reduced `ci`
  # job ZERO warm-target reuse across its C/E test lanes while removing both
  # tool installs from the critical path. Baseline: the `ci` job was 14m49s
  # with this block inline; the block is ~473s (cold) here in parallel, so
  # the workflow critical path drops to the reduced `ci` (~9m). Same split
  # rationale as this file's interop and footprint (Layer F) jobs — "must
  # not eat the primary job's budget".
  validate-codegen:
    name: validate + codegen (Layers A + B)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        # fetch-depth: 0 mirrors the `ci` job (Layer A ran there historically
        # with full history); submodules: recursive is load-bearing — Build
        # sce-codegen resolves through vendor/sce.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # cmake + libclang-dev for the sce-codegen / xtask (Layer B/B2)
        # toolchain; perl for verify-codegen.sh Layer 2 include sort.
        #
        # This job's `Save apt archives` step is NOT here: it installs twice
        # (protoc below), and a save between the two would carry half the
        # archive and then sit on a key nothing updates.
        run: |
          bash scripts/lib/apt-install.sh cmake libclang-dev libxml2-dev clang perl pkg-config

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        # Distinct key from `ci` — this job's build set (sce-codegen +
        # xtask) differs, and a shared key across differing sets thrashes
        # (same reason footprint / interop carry their own keys).
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target
          key: validate-codegen

      - name: Install protoc (mnemosyne-server build-script dep)
        run: bash scripts/lib/apt-install.sh protobuf-compiler

      - name: Save apt archives
        # AFTER the second apt step, for the reason the first one records.
        # See the `feature-gates` copy for why `always()` and why the dirty gate.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install mnemosyne-cli (pinned)
        # R311y417 — the `|| { ::warning; MNEMOSYNE_SKIP=1 }` fallback that used
        # to wrap this is GONE, and with it the `if: env.MNEMOSYNE_SKIP != '1'`
        # guard on Layer A below. That pair demoted this repo's CENTRAL SSOT
        # gate to a warning: an install failure SKIPped Layer A and the job went
        # GREEN. It is the identical hollow-gate shape R311y416 closed for
        # actionlint one job over, generalised in that round's own carry ("an
        # exit 0 from a tool that skipped its real work is indistinguishable
        # from a pass") and then not applied here. An install failure is a
        # provisioning regression; it now reds this step.
        run: bash scripts/install-mnemosyne-cli.sh

      - name: Build sce-codegen (vendor/sce)
        run: bash scripts/build-sce.sh

      - name: Layer A — Mnemosyne workspace validate
        run: bash scripts/run-ci.sh --layer A

      - name: Layer A2 — Envelope mid value= audit
        run: bash scripts/run-ci.sh --layer A2

      - name: Layer A3 — catalog status truthfulness
        env:
          WZ_A3_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer A3

      - name: Layer A4 — cross-impl proof axis
        env:
          WZ_A4_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer A4

      - name: Layer A5 — preset-ap-full membership
        # R311y496. Wired in the SAME commit that adds the lane.
        #
        # preset-ap-full's membership was hand-maintained and dropped a WHOLE
        # FAMILY in four consecutive rounds (y461 routing-token-tables, y488
        # ext-pubsub-*, y489 adminspace-*, y491 the router-hat tier), each found
        # by accident and none recorded as a decision anywhere. y496 found the
        # fifth — the storage manager and every backend — and that one left the
        # AP-full node reporting a live storage it could not serve one read from.
        # Four rounds of one shape is a missing gate, not five mistakes.
        #
        # This job provisions mnemosyne-cli, so WZ_A5_REQUIRE turns the
        # tool-absent SKIP into a FAIL here: a lane that skips where its input is
        # provisioned is a provisioning regression wearing a green badge.
        env:
          WZ_A5_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer A5

      - name: Layer C0 (armed) — gate provenance citations resolve
        # R311y747. Layer C0 also runs on the "validate + verify + test" job,
        # where it is the SHAPE half only: that job deliberately does not
        # install mnemosyne-cli (~88s, split out here in R311y428), and
        # R311y743 gave `gate_provenance_lint` a store read without noticing.
        # It then FAILED every hosted run from that commit on while every local
        # run stayed green, because a dev box has the tool on PATH -- Layer C0
        # is the failing step in runs 31581576586 and 31582103148.
        #
        # So the citation half is armed HERE, where its input exists, by the
        # same rule as WZ_A3_REQUIRE / WZ_A5_REQUIRE above: a lane that SKIPs
        # where the job provisions its input is a provisioning regression
        # wearing a green badge. Running the whole lane twice rather than
        # lifting one gate out of it keeps `unwired_lane_lint`'s subject a
        # LANE, and the second run costs ~5s.
        env:
          WZ_C0_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer C0

      - name: Layer C0i (armed) — the impact-ref gate discriminates both ways
        # R311y783. `scripts/append-round.sh` refuses a round whose `--impact`
        # ids name no section, BEFORE `append-changelog-entry` freezes the
        # entry -- the only cheap moment there is, since a frozen entry costs
        # an orphan_ledger row plus a whole re-citing round to correct.
        #
        # R311y782 shipped that check with nothing that could fail if it broke,
        # and Layer C0's store-reader gate rejected it on exactly that ground:
        # "a gate nothing runs cannot fail". This lane is the answer. It runs
        # HERE because it reads the section space, and this is the job that
        # installs mnemosyne-cli; armed for the same reason as WZ_C0_REQUIRE
        # above. --check-only throughout, so it never mutates the store.
        env:
          WZ_C0I_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer C0i

      - name: Layer U — how many releases behind each pinned upstream is
        # R2228 (open-debt item 578). Two rounds judged "what a genuine zenoh
        # does" from a checkout pinned five minors back, and the only thing
        # that surfaced it was a person asking. This lane asks instead.
        #
        # ⛔ THE ONLY STEP IN THIS WORKFLOW THAT NEEDS THE NETWORK, and it is
        # given a token deliberately: unauthenticated the releases API is 60
        # requests an hour per IP, which a shared runner exhausts, and item
        # 578's condition ③ makes "could not measure" a FAILURE rather than a
        # skip. So an outage reds this lane. That is the stated cost of not
        # having a green that means nothing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/run-ci.sh --layer U

      - name: Layer C0b — the job budget-margin gate discriminates both ways
        # R311y791. The `ci` job's last step runs
        # scripts/lib/job-budget-margin.sh, whose whole value is a refusal near
        # the ceiling. This lane drives BOTH arms with a placed clock, for the
        # reason C0i above exists: logic only the workflow can execute cannot be
        # told apart from logic that always passes.
        #
        # It runs HERE rather than on `ci` for the obvious reason: a lane that
        # exists because that job is at its time ceiling must not be charged to
        # that job. It needs only bash, and costs ~0s.
        run: bash scripts/run-ci.sh --layer C0b

      - name: Layer C0g — the apt ceiling discriminates both ways
        # R311y865. `scripts/lib/apt-install.sh` is what every apt step in this
        # file routes through, and its whole value is a REFUSAL that fires only
        # when a package mirror is down — i.e. almost never, so on almost every
        # run a ceiling that did nothing and a ceiling that is broken look
        # identical. Same reason C0b and C0i are lanes.
        #
        # It runs HERE rather than on `ci` for C0b's reason: a lane that exists
        # because of another job's budget must not be charged to that job. It
        # installs nothing, needs only bash + grep, and costs ~2s (the deadline
        # it drives).
        run: bash scripts/run-ci.sh --layer C0g

      - name: Layer C0d — the doc-link dependent expansion discriminates both ways
        # R311y793. pre-push gate 4 widens its crate set through
        # scripts/lib/doclink-dependents.sh; an expander that returned its input
        # unchanged would be invisible from the hook's side. Same reason C0i and
        # C0b are lanes. Needs only bash + grep.
        run: bash scripts/run-ci.sh --layer C0d

      - name: Layer C0e — the inventory tag reader tells a tag from a word
        # R311y800. Layer A5 above rests on five predicates that nothing drove,
        # and one of them was a substring search: R311y799 wrote the word
        # "unbuilt" into a RETRACTION inside session-matching's inventory reason
        # and A5 declared a built member inert, redding run 31762809988 on this
        # very job. Same reason C0i / C0b / C0d are lanes — a predicate over an
        # empty table cannot be told from one that always answers True. Needs
        # only python3, and costs ~0s.
        run: bash scripts/run-ci.sh --layer C0e

      - name: Layer C0f — layer Z restores the demo feature set it opened with
        # R311y845. R311y843 registered this lane in run-ci.sh only, so it ran
        # in a local full sweep and nowhere else — and Layer C0's own
        # lane-parity gate reddened hosted CI for exactly that, one push later.
        # Same reason C0i / C0b / C0d / C0e are lanes here: it reads run-ci.sh
        # as text, needs only bash + awk, and costs ~0s.
        run: bash scripts/run-ci.sh --layer C0f

      # WZ_SCE_ORACLE_REQUIRE=1 on both lanes: each opens by grading the
      # provenance of vendor/sce/target/release/sce-codegen, and an oracle that
      # cannot be established at all degrades to a SKIP so a developer without
      # the submodule is not blocked. This job checks the submodule out and
      # builds the binary above, so here that SKIP could only mean the
      # provisioning broke — the same rule WZ_A3_REQUIRE / WZ_C0_REQUIRE apply,
      # and the reason both of those exist: a lane that skips still prints green.
      - name: Layer B — verify-codegen.sh per codec
        env:
          WZ_SCE_ORACLE_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer B

      - name: Layer B2 — regen-diff (committed out/** == regenerated)
        env:
          WZ_SCE_ORACLE_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer B2

  # ─────────────────────────────────────────────────────────────────
  # R311y791 — the VERDICT-LEG MUTATION job. Layer C0mut ran as step 11 of the
  # `ci` job and was its single largest step: 509s of a 1634s job on run
  # 31732246052, i.e. 31% of a job sitting at 91% of its 30-minute budget.
  #
  # WHAT FORCED THE SPLIT. Run 31711867852 (Round 1819, a LEDGER-ONLY commit)
  # did not fail — the `ci` job hit `timeout-minutes: 30` at 30m20s and was
  # CANCELLED, on step 34, with every other job in the run green. A cancel
  # grades nothing, so that commit has no hosted verdict at all, and the local
  # push gate cannot produce one: the whole point of the R311y386 fast-push
  # policy is that the hosted run is the full gate.
  #
  # It was not a flake. Measured across the 12 completed `ci` jobs ending at
  # that run, the successful ones span 23m39s-28m50s with a ~27m20s median —
  # 91% of budget at the median, 96% at the observed max. At that margin runner
  # variance alone decides the run, which is the same sentence the footprint
  # job's rationale had to write in y351 and the same one ci.yml:145-147 wrote
  # in y296 about this job's DISK ceiling. Only the disk half was ever acted on.
  #
  # WHY SPLIT RATHER THAN RAISE, and this is this file's own settled doctrine
  # (footprint, ~line 900): a bigger number buys one atom's worth of time and
  # re-arms the same failure, because the cost grows monotonically in atom
  # count. Splitting changes the SLOPE. The y385 `validate-codegen` split
  # recorded the `ci` job at 14m49s; it is 27m12s now, so the slope is measured,
  # not predicted. Moving this lane returns the job to ~18m45s, ~62% of budget.
  #
  # WHAT IT NEEDS, and it is much less than `ci`: python3 (in the runner image),
  # cargo, and a tree that builds. `verdict_leg_mutation.py` rewrites
  # `crates/wz-capture/src/report.rs` in place and runs `cargo test -p <pkg>`
  # for the packages that bind a leg — DERIVED from the bindings, not a fixed
  # list. So no mnemosyne-cli, no sce-codegen, no zenoh-pico CLI, no zenohd.
  # The prep below is otherwise kept identical to `ci`'s rather than trimmed
  # further, on the footprint job's stated reason: an over-provisioned job costs
  # ~2min in parallel, an under-provisioned one costs the fix-and-repush series.
  #
  # WHAT THE SPLIT COSTS, stated rather than hidden: the lane sat BEFORE the
  # workspace test run deliberately, as the cheaper of the two ways to learn the
  # suite is broken. In its own job that ordering is gone — a tree with a red
  # baseline now pays for both jobs instead of failing early in one. That is
  # runner minutes on an already-broken tree, not a lost gate, and the lane
  # still fails by design on such a tree rather than measuring nothing.
  verdict-legs:
    name: verdict-leg mutation gate (Layer C0mut)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        # `submodules: recursive` is load-bearing: the packages this lane
        # compiles resolve through vendor/sce path deps. No `fetch-depth: 0` —
        # that is the `ci` job's, for its git-log-based ledger drift check;
        # this lane reads no history.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # NOT `ci`'s list: R311y881 measured the difference. The resolved tree
        # does pull bindgen (libclang) and the vendor/sce crates, which is why
        # a direct-dependency read is wrong here — but `cmake` is pulled by
        # exactly one crate in this workspace (`zenoh-pico-sys`, reachable
        # directly or through `wz-integration-tests`' dev-dependency) and this
        # job's lanes reach neither. `scripts/lib/apt_package_census.py` is
        # what keeps that answer honest; it derives the cmake rows rather than
        # reading this comment.
        run: |
          bash scripts/lib/apt-install.sh libclang-dev libxml2-dev clang perl pkg-config

      - name: Save apt archives
        # See the `feature-gates` copy for why `always()` and why the dirty gate.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        # Its OWN key, for the reason footprint and interop carry one: parallel
        # jobs must not race a single cache save. This lane's tree is the
        # ordinary `crates/target`, so the build half is a real saving here
        # (unlike footprint's, which builds into per-lane target dirs).
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: verdict-legs

      - name: Layer C0mut — every verdict leg is load-bearing
        # R311y726 (N14) — severs each `VerdictReason` leg in turn and requires
        # a test to redden, plus the y727 `widen` operator for the opposite
        # defect. The sufficient condition Layer C0's static
        # `verdict_reason_lint` cannot express: that gate proves a leg is NAMED
        # by a test, this proves one DEPENDS on it.
        #
        # It mutates `report.rs` in place and restores it byte for byte on
        # every exit path; a hosted runner's checkout is discarded either way.
        run: bash scripts/run-ci.sh --layer C0mut

  # ─────────────────────────────────────────────────────────────────
  # R2163 — the NON-DEFAULT job. Layer C1cn peeled off `ci`.
  #
  # WHAT FIRED. Runs 33059064203 and 33059199683 both ended
  # `job-budget-margin: elapsed 1790s of 1800s budget (99%)` on `validate +
  # verify + test`, with EVERY lane above it green. The margin was the failure,
  # which is exactly what that guard exists to say while there is still room to
  # act on it.
  #
  # WHERE THE TIME WENT, measured off run 33059064203's own job log rather than
  # estimated — the per-layer durations, largest first:
  #
  #     Layer C1cn    562s      <- this job
  #     Layer C1cf    254s
  #     Layer C1      229s
  #     Layer C1bv    105s
  #     Layer C4       80s
  #     Layer C1h      79s
  #     ...every other lane <60s each
  #
  # C1cn is the largest single entry and by a factor of two. It is also the
  # NEWEST: R2135 added it to this workflow (it had been in `run-ci.sh` and in
  # no job, so hosted had never run it), and R2156 then put a second half on it
  # — `nondefault-tests-gate.sh --census`, which builds every crate twice to
  # list its tests. So the lane roughly doubled in the two rounds before the
  # ceiling was hit, which is the shape the y865 note predicts: cost grows
  # monotonically in atom count, and the growth lands on whichever job holds the
  # lane.
  #
  # WHY SPLIT RATHER THAN RAISE `timeout-minutes`. The guard's own prescription,
  # and this file's precedent three times over (`interop`, `footprint`,
  # `verdict-legs`): a bigger number buys one atom's worth of time and re-arms
  # the same failure, because the growth is monotonic. Splitting changes the
  # SLOPE — C1cn's growth is now charged to its own budget instead of to the
  # gate every other layer shares. Predicted landing for `ci`: ~1228s, 68% of
  # 1800s, back inside the band the y865 note measured.
  #
  # WHAT THIS JOB NEEDS. `cmake` is NOT in its list, and that is derived rather
  # than trimmed by taste: `apt_package_census.py` decides cmake from
  # `cargo tree -i cmake`, whose one consumer is `zenoh-pico-sys` — a crate
  # reached only by a `--workspace` command or by being named, and this lane's
  # two gates iterate members individually. No `fetch-depth: 0` either: this
  # lane reads no history.
  nondefault:
    name: non-default feature compile + census (Layer C1cn)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Budget stamp — start this job's own clock
        # Same reason the `ci` job stamps: `timeout-minutes` measures from when
        # the job is CREATED, and the margin gate needs elapsed RUN time.
        run: date +%s > "$RUNNER_TEMP/wz_job_start"

      - name: Checkout (with submodules)
        # `submodules: recursive` is load-bearing: the members this lane
        # compiles resolve through vendor/sce path deps.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # See the `verdict-legs` copy for the measurement and for why RESTORE
        # and SAVE are split.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        run: |
          bash scripts/lib/apt-install.sh libclang-dev libxml2-dev clang perl pkg-config

      - name: Save apt archives
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        # Its OWN key, for the reason footprint, interop and verdict-legs carry
        # one: parallel jobs must not race a single cache save.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: nondefault

      - name: Layer C1cn — every crate compiles its non-default code
        # R2133 — C1cf's mirror. That lane asks whether a crate survives its
        # defaults being OFF; nothing asked whether the code behind a feature
        # that is off BY DEFAULT reaches rustc at all. It does not: pre-push
        # builds default features, so non-default modules are never compiled.
        # Its first sweep found a live break R2112 had left in wz-ap-demo.
        # Measured cost: 19 of 20 crates with a non-default feature, ~126s;
        # `wz` is tier 3 because a vendored dep refuses an all-features build.
        #
        # R2156 added its second half — `nondefault-tests-gate.sh --census`,
        # which asks whether anything RUNS the code the half above compiles.
        run: bash scripts/run-ci.sh --layer C1cn

      - name: Budget margin — this job's own clock
        # The floor is 20, not `ci`'s 30: a job holding ONE lane is exactly the
        # case the floor exists to catch, and if C1cn ever shrinks back under a
        # fifth of the budget it should hand the budget back rather than sit on
        # it. The alarm stays 90 for the reason the `ci` copy gives.
        if: always()
        run: bash scripts/lib/job-budget-margin.sh "$RUNNER_TEMP/wz_job_start" 1800 90 20 '${{ job.status }}'

  # ─────────────────────────────────────────────────────────────────
  # R2165 — the PASSIVE-DISSECTION job, peeled off `feature-gates` when that
  # job's margin step fired at 97% of 2700s on run 33087340444.
  #
  # WHY THIS LANE AND NOT ANOTHER, in the numbers the red job's own log gives.
  # Its 37 lanes (derived from that job's `--layer` steps, not from what the
  # log printed -- both sets are 37 and neither has a member the other lacks)
  # cost 2547s of a 2634s job. C1bn is 688s of that: 26.1% of the job, and
  # 3.28x the next lane, C1j at 210s. Peeling it lands `feature-gates` at
  # 1946s = 72.1% of its 2700s budget. The next four together (C1j 210 + C1z
  # 194 + C1bl 188 + C1bi 153 = 745s) would land it at 70.0% -- 2.1 points
  # better for four times the lanes moved.
  #
  # AND C1bn IS THE ONE THAT CARRIES PROVISIONING. The other 36 lanes there
  # are plain cargo. C1bn arms three adjudicators on the presence of external
  # data -- WZ_TCPDUMP_REQUIRE, WZ_DLT_HEADER_REQUIRE, WZ_PROTO_REGISTRY_
  # REQUIRE -- and each of the three test binaries behind them is invoked
  # exactly once in scripts/run-ci.sh, all three inside C1bn. So moving this
  # lane lets its three packages move WITH it, which is what their rows in
  # apt_package_census.py already asked for in words: "ONE job only, and the
  # smallest one that owns wz-capture's default-feature tests". Peeling any
  # other lane would have left them behind on a job that no longer runs the
  # gate that justifies them.
  #
  # NOT `timeout-minutes`, for the reason job-budget-margin.sh states about
  # itself: a bigger number buys one atom's worth of time and re-arms the same
  # failure, because the cost grows monotonically in atom count. The precedent
  # is this file's `verdict-legs` (y791), `footprint` (y351) and `nondefault`
  # (R2163); this job is shaped after the last of those.
  #
  # PREDICTED LANDING, recorded so the next run can judge it: 84s of setup
  # (this job's prep is `nondefault`'s, and that is what `feature-gates`
  # measured from its budget stamp to its first lane) + 688s = 772s, or 42.9%
  # of the 1800s budget below. Above the 20% floor, so the job is not sitting
  # on a budget it does not use. The FIRST run will exceed that: its
  # rust-cache key is new and therefore cold.
  dissect:
    name: passive-dissection feature set (Layer C1bn)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Budget stamp — start this job's own clock
        # Same reason the `ci` and `nondefault` jobs stamp: `timeout-minutes`
        # measures from when the job is CREATED, and the margin gate needs
        # elapsed RUN time.
        run: date +%s > "$RUNNER_TEMP/wz_job_start"

      - name: Checkout (with submodules)
        # `recursive` for the reason `feature-gates` gave when it held this
        # lane: wz-integration-tests reaches sce_forge_runtime from vendor/sce
        # through wz-session-core, and does not build without it.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # See the `verdict-legs` copy for the measurement and for why RESTORE
        # and SAVE are split. Keyed per job, and this job's package list is
        # deliberately not `feature-gates`' any more.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        run: |
          # The three below arrived here WITH Layer C1bn in R2165; the reasons
          # are the ones the rounds that added them wrote, carried over intact
          # rather than re-summarised.
          #
          # R2054 (open-debt item 384) — `tcpdump` is the ADJUDICATOR for
          # `wz_capture::link`'s BSD address-family table, which was decided once
          # by hand in a session with no reproducer. Layer C1bn runs that
          # adjudicator with `WZ_TCPDUMP_REQUIRE=1`, so the tool has to be here:
          # the test SKIPS where it is absent, and a skip prints `ok`. Installed
          # explicitly rather than relied on from the runner image, because
          # "the image happens to carry it" is not a thing this file states.
          # R2055 (open-debt item 391) — `libpcap-dev` puts `pcap/dlt.h` on the
          # runner, and that header is the ADJUDICATOR for
          # `LINK_TYPE_SWEEP_CEILING`: it is where libpcap states
          # `DLT_MATCHING_MAX`, the highest link type a capture file can name.
          # Layer C1bn runs that adjudicator with `WZ_DLT_HEADER_REQUIRE=1`, so
          # the header has to be here for the same reason `tcpdump` does.
          # R2058 (open-debt item 250) — `netbase` ships `/etc/protocols`, one of
          # the two sources the IP-protocol furniture split reads. It is
          # Priority: important and so already on the image; named anyway,
          # because "the image happens to carry it" is not a thing this file
          # states and the leg arms on its absence.
          bash scripts/lib/apt-install.sh cmake libclang-dev libxml2-dev clang perl pkg-config tcpdump \
            libpcap-dev netbase

      - name: Save apt archives
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        # Its OWN key, for the reason footprint, interop, verdict-legs and
        # nondefault carry one: parallel jobs must not race a single cache save.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: dissect

      - name: Layer C1bn — passive-dissection feature set, RUN (R311y579)
        # Created by R311y579, the round that closed the "no lane at all" debt
        # for this feature set; wired into CI by R311y581; moved here by R2165
        # for the budget reason above. The lane itself is unchanged.
        run: bash scripts/run-ci.sh --layer C1bn

      - name: Budget margin — this job's own clock
        # Floor 20, alarm 90 — the `nondefault` settings, and for its stated
        # reason: a job holding ONE lane is exactly the case the floor exists
        # to catch, so if C1bn ever shrinks under a fifth of this budget it
        # should hand the budget back rather than sit on it.
        if: always()
        run: bash scripts/lib/job-budget-margin.sh "$RUNNER_TEMP/wz_job_start" 1800 90 20 '${{ job.status }}'

  # ─────────────────────────────────────────────────────────────────
  # R311y351 — the CODEC-FOOTPRINT job. Layer F ran as the `ci` job's last
  # step from R311pt until run 29571213015 killed that job at 30m03s INSIDE
  # Layer F. Every gate through E5 passed; no wz gate failed. Same shape as
  # the y296 disk overflow, on the other ceiling.
  #
  # THE MEASUREMENT THAT MOVED IT, not the timeout itself: Layer F is 12.9min
  # of a 28.5min job — 45% — and it is STABLE at that (12.87 / 12.88 / 13.00
  # across the three prior green runs). The `ci` job was therefore carrying
  # 28.5min against a 30min cap: ~5% headroom.
  #
  # AND THE OVERRUN IS NOT CODE GROWTH — the first diagnosis, and it was
  # wrong. Against the last green run the +2.18min is spread evenly over
  # EVERY step, including steps whose input is pinned and did not change
  # (`Build sce-codegen` +17% on a pinned vendor/sce; cache restore 16s->44s).
  # That is runner variance, and at 5% headroom variance alone decides the
  # run. The job did not break on y350; it had been a coin flip for some
  # rounds and y350 is when the coin landed. Nothing reported the margin —
  # exactly what ci.yml:84-86 predicted in y297 and left standing.
  #
  # WHY SPLIT RATHER THAN RAISE `timeout-minutes`. A bigger number buys one
  # atom's worth of time and re-arms the same failure: the cost grows
  # monotonically in atom count (each new atom is another exclusion lane
  # here, and another subset lane there). Splitting changes the SLOPE — F's
  # growth is now charged to its own budget, not to the gate every other
  # layer shares. The precedent is this file's own `interop` job, split off
  # for the identical stated reason: it "must not eat the primary job's
  # 30-minute budget".
  #
  # WHAT THIS JOB NEEDS, and it is much less than `ci`: measure-codec-
  # footprint.sh is git + cargo + python3, and wz-ap-demo's only dependency
  # is the wz facade. So no protoc, no mnemosyne-cli, no sce-codegen build,
  # no python3-yaml, no zenoh-pico CLI. The prep is kept otherwise identical
  # to `ci`'s rather than trimmed further: an over-provisioned job costs
  # ~2min in parallel, an under-provisioned one costs the fix-and-repush
  # series that ci-yaml-local-verify names as the anti-pattern.
  #
  # A SECOND CEILING MOVES WITH IT, unasked: each lane builds a full
  # wz-ap-demo into its own `target/measure-codec-footprint/<lane>` — a path
  # rust-cache's `crates -> target` does not cover, so none of it is cached
  # and all of it is disk. That load now leaves the job that overflowed on
  # y296.
  footprint:
    name: codec-footprint Layer F (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-22.04
    # R311y388 — SHARDED. F was ~13min as ONE job (13 codec lanes + baseline +
    # minus-all-codecs + handshake-only, each a release+LTO build in its own
    # --target-dir). It is now a matrix: each shard builds baseline + its
    # round-robin codec subset (idx % SHARDS == shard) and thresholds those;
    # shard 0 additionally runs the two whole-catalog lanes (minus-all-codecs,
    # handshake-only). Wall-clock drops to ~the slowest shard (shard 0 ≈ 7
    # lanes vs 16 serial). The per-lane build is byte-identical to before —
    # only the SET of lanes per runner shrank — so the byte gate is unchanged.
    #
    # DROP-PROOF INVARIANT (co-located on purpose): `shard` MUST list exactly
    # [0 .. WZ_FOOTPRINT_SHARDS-1]. The modulo partition covers every codec iff
    # ALL N shards run; measure-codec-footprint.sh asserts SHARD < SHARDS and
    # logs its codec subset, but it CANNOT see a missing shard. Change the
    # matrix list and WZ_FOOTPRINT_SHARDS together, or a codec silently stops
    # being byte-gated ("a skip is green").
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      WZ_FOOTPRINT_SHARDS: "4"
      WZ_FOOTPRINT_SHARD: ${{ matrix.shard }}
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        # `submodules: recursive` is LOAD-BEARING, not copied boilerplate:
        # wz-ap-demo resolves through sce-build / sce-forge-runtime /
        # sce-rust-runtime, which are path deps in vendor/sce. Without the
        # submodule the build does not resolve. (Verified by `cargo tree -p
        # wz-ap-demo --features wz/preset-ap-client`, not by reading manifests.)
        #
        # No `fetch-depth: 0` though: that is the `ci` job's, for its
        # git-log-based commit<->ledger drift check. Layer F reads no history —
        # only `git rev-parse --show-toplevel`, which a shallow clone answers.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # perl included, and libclang for the reason the old comment here gave
        # and R311y881 confirmed: `wz-ap-demo`'s manifest lists only the `wz`
        # facade, but its resolved tree pulls bindgen (libclang), libxml, and
        # the vendor/sce crates — a direct-dependency read says "needs nothing"
        # and is wrong.
        #
        # `cmake` is the one that read WAS right about, and "mirrors `ci`'s list
        # EXACTLY" is how it survived unexamined. Only `zenoh-pico-sys` pulls
        # the cmake crate (directly, or via `wz-integration-tests`' dev-dep),
        # and Layer F reaches neither. Measured, not guessed down:
        # `scripts/lib/apt_package_census.py` derives it and reds if this job's
        # lanes ever do reach it.
        run: |
          bash scripts/lib/apt-install.sh libclang-dev libxml2-dev clang perl pkg-config

      - name: Save apt archives
        # See the `feature-gates` copy for why `always()` and why the dirty gate.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        # The pin is the SSOT for channel + components + targets — see the
        # `ci` job's step of the same name. It matters MORE here than there:
        # a floating compiler moves codegen size, and this job is the one
        # that gates on bytes (y267's ~20-push red streak).
        run: rustup show

      - name: Cache Cargo registry (NOT this job's build tree — see below)
        # The REGISTRY half is what this buys: Layer F's lanes resolve the same
        # dependency graph every run. The build half it does not, and the name
        # says so deliberately — `workspaces: crates -> target` covers
        # `crates/target`, while every Layer F lane builds into
        # `target/measure-codec-footprint/<lane>`. So each shard's wall-clock is
        # a COLD number and stays one; the R311y388 shard split, not a cache, is
        # what bought the headroom. Caching that tree is a separate question with
        # its own risk (this is the gate that measures bytes) and is not bundled
        # in here. Per-shard `key` so the parallel matrix jobs don't race one
        # cache save (same reason `interop` carries a distinct key).
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: footprint-shard-${{ matrix.shard }}

      - name: Layer F — codec-footprint catalog truthfulness gate
        # R311pt — F is host-only (python3 + cargo; no cross-toolchain).
        # Default-on in run-ci.sh; CI invokes it by name to keep the lane
        # list explicit.
        run: bash scripts/run-ci.sh --layer F

  # ─────────────────────────────────────────────────────────────────
  # R311y264 — the CROSS-IMPL INTEROP job. Every lane here executes a
  # cross-impl PROOF that hosted CI previously never ran.
  #
  # WHY THIS JOB EXISTS. Layer A4 (R311y259) reports the proof axis as TWO
  # populations, because a proof that never runs is not a proof: 64 of the
  # corpus's tests are #[ignore]d, and the lanes that execute them — E2 / E6 /
  # E8 / Z — were not in this workflow. So the zenohd tier in particular ran
  # ONLY on a developer's machine, at pre-push. A derived number resting on
  # evidence hosted CI never executes carries MORE false authority than the
  # hand estimate the axis replaced, which is precisely why A4 refuses to fuse
  # the two counts. This job closes the gap by making the evidence execute.
  #
  # It is a SEPARATE job, not more steps on `ci`, for one reason: zenohd is a
  # from-source build of an external release, and it must not eat the primary
  # job's 30-minute budget. Its output is a pinned-version binary, so it caches
  # to a near-zero steady-state cost and only a cold cache pays.
  #
  # NOT wired here, deliberately: Layer M (multicast). run-ci.sh marks it an
  # "opt-in environment-flaky lane" — UDP multicast behaviour on a hosted
  # runner is not something to bet a green build on, and a flaky gate is worse
  # than an honest local-only one (no-flaky-ever). The multicast pico proofs
  # therefore stay local-only until that flakiness is root-caused, and A4's
  # EXECUTION line keeps saying so.
  interop:
    name: cross-impl proof lanes (E2 + E5z + E6 + E6b + E6e + E6f + E6g + E6h + E6i + E7 + E8 + E8t + E9 + E10 + E11 + E12 + E13 + E14 + E15 + C1bp + Z)
    runs-on: ubuntu-22.04
    # A cold cache must build: the zenoh-pico CMake tree, the whole zenoh workspace in
    # release (zenohd AND the storage-manager plugin), four differently-featured
    # wz-ap-demo builds, the six wz-e2e-* subset binaries, and then Layer Z's serial
    # zenohd sweep. 60 was optimistic; the steady state is cached and fast.
    timeout-minutes: 120
    env:
      # A hosted lane that SKIPs green on a binary THIS JOB PROVISIONS is a provisioning
      # regression wearing a green badge — and it lies twice, because Layer A4 reads
      # "this lane is in ci.yml" as evidence its proofs executed.
      WZ_PICO_REQUIRE: "1"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # cmake + libclang-dev: zenoh-pico-sys (cmake crate + bindgen), which the
        # wz-integration-tests dev-dep pulls in even for the spawn-class lanes.
        # libxml2-dev + pkg-config: the libxml probe (item 522).
        run: |
          bash scripts/lib/apt-install.sh cmake libclang-dev libxml2-dev clang pkg-config

      - name: Save apt archives
        # See the `feature-gates` copy for why `always()` and why the dirty gate.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml, for wz)
        # See the `ci` job's step of the same name — the pin is the SSOT for
        # channel + components + targets. zenohd's own channel (1.97.1 at the
        # pinned 1.10.0) is installed separately below and selected explicitly
        # with `cargo +<that channel>`, which overrides the toolchain file and
        # is unaffected by it.
        run: rustup show

      - name: Install Rust toolchain 1.97.1 (zenoh 1.10.0's pinned channel)
        # scripts/build-zenohd.sh REQUIRES this exact channel and hard-errors
        # without it — zenoh 1.10.0 pins it, and building zenohd on a different
        # channel is not a reproducibility trade this project makes.
        #
        # R2229 (open-debt item 579) — 1.5.0 pinned 1.85.0 and 1.10.0 pins
        # 1.97.1, so this channel MOVES WITH THE RELEASE. The script derives it
        # from the release's own `rust-toolchain.toml`; this step cannot call a
        # shell before `rustup`, so the channel is written here and Layer U
        # checks the two against each other rather than trusting them to agree.
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: interop

      - name: Cache the zenohd binary (pinned version)
        # zenohd 1.10.0 is a FIXED external release, so the built binary is a pure
        # function of the version — cache the artifact itself rather than paying
        # a from-source build every run. Only a cold cache builds.
        id: zenohd-cache
        uses: actions/cache@v4
        with:
          # R2242 — THE SOURCE TRAVELS WITH THE BINARY. `zenoh-src` is the shallow
          # clone the build below makes; it is what `upstream_anchors()` calls
          # source A2, and Layer Z's upstream-citation RESOLUTION arm reads cited
          # files out of it. Until now only `target/zenohd` was cached, so on a
          # cache HIT the build step is skipped and the source never exists —
          # which is R2164's story verbatim, one artifact over: that round found
          # the capability census exiting 2 on four consecutive pushes for
          # exactly this reason. R2164 could answer it with a 196 KB derivative
          # (`cargo metadata`) installed beside the binary. This gate cannot: a
          # citation added by a LATER commit has to resolve against the pin
          # without re-provisioning, so nothing short of the tree serves, and a
          # partial copy would make "gone upstream" and "not installed" the same
          # observation. 29 MB, measured by R2164 when it declined to pay it for
          # a denominator it could derive.
          #
          # Caching them TOGETHER rather than under a second key is the point:
          # the tree that resolves the citations is then the same tree that built
          # the oracle the interop runs against. Two entries could drift, which
          # is the two-identities trap R2109 named here first.
          path: |
            target/zenohd
            target/zenohd-build/zenoh-src
          # Keyed on the BUILD SCRIPT's content too, not just the version: a cache once
          # populated without the storage-manager plugin (a run that fell back to the
          # crates.io path) would otherwise strand that proof behind a green SKIP for as
          # long as the key lives. Change the script, get a fresh cache.
          #
          # The `-src` token is load-bearing and NOT decoration: `actions/cache`
          # re-saves only on a miss, so widening `path` under the OLD key would
          # restore binary-only entries forever and red the assert below on every
          # run. Widening a cached path and moving its key are one edit.
          key: zenohd-1.10.0-src-ubuntu-22.04-${{ hashFiles('scripts/build-zenohd.sh') }}

      - name: Build zenohd 1.10.0 + the storage-manager plugin (cache miss only)
        if: steps.zenohd-cache.outputs.cache-hit != 'true'
        # ZENOHD_ALLOW_CLONE=1 makes build-zenohd.sh take the SOURCE path (a shallow
        # clone of the pinned tag) instead of falling to crates.io. That matters:
        # `cargo install` yields the router BINARY but not the storage-manager
        # cdylib, and without the plugin Layer Z's storage-replication leg SKIPs —
        # green, and never executed. The lane would "run in CI" while one of its
        # proofs quietly did not, which is the exact false-authority this whole axis
        # exists to stop. Only a source tree produces the plugin, so CI builds from
        # source. Cold cost is one build; the cache makes it ~zero thereafter.
        env:
          ZENOHD_ALLOW_CLONE: "1"
        run: bash scripts/build-zenohd.sh

      - name: Assert zenohd + the storage plugin + the zenoh-ext oracles are present
        # Trusting the cache is how a "restored" build quietly becomes a missing one. Layer
        # Z's guards would SKIP green on either absence, and Layer A4 would keep counting
        # its proofs as executed, so check before the lanes run rather than after.
        run: |
          test -x target/zenohd/zenohd \
            || { echo "::error::zenohd missing after build/restore"; exit 1; }
          test -f target/zenohd/libzenoh_plugin_storage_manager.so \
            || { echo "::error::storage-manager plugin missing — the storage-replication proof would SKIP green"; exit 1; }
          # R311y442 — the advanced-pubsub oracles. They are the ONLY foreign
          # counterparty that plane can have (zenohd is a router with no
          # AdvancedCache; zenoh-pico has no advanced-pubsub at all), so their
          # absence takes the whole `@adv` cross-impl family with it.
          # R311y445 — z_view_size joins them, as the ONLY usable foreign group
          # peer: its sibling z_member builds Config::default() with no
          # CommonArgs, so it cannot be pointed at this zenohd at all.
          for ex in z_advanced_pub z_advanced_sub z_view_size; do
            test -x "target/zenohd/$ex" \
              || { echo "::error::$ex missing — the wz<->zenoh-ext proofs cannot run"; exit 1; }
          done
          # R311y841 — the CORE zenoh example oracles, for Layer E5z. They are
          # the only foreign binaries that can express a queryable's
          # COMPLETENESS: zenohd declares no queryable, and zenoh-pico's
          # z_queryable hardcodes complete=false. Without them the QueryTarget
          # proof SKIPs green and A4 keeps counting it as executed.
          for ex in zenoh_z_queryable zenoh_z_get; do
            test -x "target/zenohd/$ex" \
              || { echo "::error::$ex missing — the wz QueryTarget proof cannot run"; exit 1; }
          done
          # R2109 (open-debt item 514) — the reference DOCUMENT, not a binary.
          # Layer Z's LEG 12 derives upstream's default `mode` from it rather
          # than transcribing `peer` into a wz source, so its absence turns a
          # graded expectation into an ungraded constant. Only a SOURCE build
          # installs it (it lives at the zenoh repo root, in no published crate),
          # which is the same split the plugin cdylib and the examples have.
          test -f target/zenohd/DEFAULT_CONFIG.json5 \
            || { echo "::error::DEFAULT_CONFIG.json5 missing — LEG 12 has no upstream oracle to derive the library default mode from"; exit 1; }
          # R2164 — the capability census's DENOMINATOR, provisioned the same way
          # and asserted here for the reason this step's own header gives: a
          # restored cache quietly becoming a missing one. This artifact is
          # exactly that story already lived through. R2162 put the census's
          # `--upstream` arm on Layer Z assuming the lane that builds zenohd has
          # the zenoh source; on a cache HIT the build step is skipped entirely,
          # so the source never existed and the arm exited 2 on four consecutive
          # pushes. The cache key hashes scripts/build-zenohd.sh, so entries made
          # before that script learned to install this cannot be restored -- but
          # asserting it is what makes that reasoning checkable instead of
          # merely believed.
          test -f target/zenohd/zenoh-cargo-metadata.json \
            || { echo "::error::zenoh-cargo-metadata.json missing — Layer Z's capability census has no denominator and cannot grade the feature table"; exit 1; }
          # R2242 (open-debt item 581) — the upstream-citation gate's RESOLUTION
          # arm reads cited files out of this tree. Asserted for the reason every
          # line above it is: the cache step now names this path, and an assert is
          # what makes "it will be restored" checkable rather than believed. The
          # two probes are deliberately different questions — the directory can
          # exist as an empty restore, so the second one reads the protocol
          # crate's own lib root, which `upstream_root()` requires of any
          # candidate before it will accept the tree.
          #
          # That path is spelled out in the `test` below and NOT repeated in this
          # comment, because a backticked upstream path in prose is a citation:
          # writing it here once took the bare-form count 60 -> 61 and the gate
          # this step exists to serve refused the commit. Repaid rather than
          # exempted, which is the rule the budget is a ratchet for.
          test -f target/zenohd-build/zenoh-src/zenoh/Cargo.toml \
            || { echo "::error::zenoh-src missing — Layer Z's upstream-citation resolution arm has no checkout and will FAIL rather than skip"; exit 1; }
          test -f target/zenohd-build/zenoh-src/commons/zenoh-protocol/src/lib.rs \
            || { echo "::error::zenoh-src is present but not a zenoh workspace — upstream_root() would reject it and the resolution arm would FAIL"; exit 1; }

      - name: Build zenoh-pico CLI binaries
        run: bash scripts/build-zenoh-pico-cli.sh

      - name: Cache the zenoh-c oracle (pinned 1.10.0)
        # A SECOND copy of the `ci` job's cache step, on purpose: this job is where
        # zenohd lives, and Layer C1cd needs the zenoh-c headers + examples AND
        # zenohd AND the pico CLIs at once. The key is identical to the other
        # job's, so the two share one cache entry rather than populating two.
        id: zenoh-c-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/include
            ~/.local/lib/libzenohc.so
            ~/zenoh-c-ref
          key: zenoh-c-1.10.0-ubuntu-22.04-${{ hashFiles('scripts/install-zenoh-c.sh') }}

      - name: Provision the zenoh-c oracle (cache miss only)
        if: steps.zenoh-c-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-zenoh-c.sh

      - name: Layer C1cd — §5.27 api-compat-c attachment, pico + zenohd
        # R311y500. HERE and not beside C1cc, and the placement is the whole
        # reason the lane is separate: the leg needs a real zenohd, which ci.yml
        # builds on THIS job only. In the `ci` job it would skip forever, and a
        # skip is green.
        #
        # WZ_C1CD_REQUIRE=1 because this job provisions all three oracles above.
        # The leg is the only cross-impl witness `z_sample_attachment`'s PRESENT
        # arm has: pico's attachment publisher goes through a declared publisher,
        # which needs a router in the path, so the C1cc legs structurally cannot
        # carry it.
        env:
          WZ_C1CD_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer C1cd

      - name: Layer Epico — the pico LIBRARY oracles (differential decode + parity)
        # R311y628 (§1.1g) — the legs whose counterparty is `libzenohpico.so`
        # itself rather than a pico process on a socket, and the first place in
        # this tree where the INPUT is generated rather than imagined: the whole
        # 8-bit transport header space against a body ladder, adjudicated by
        # upstream's own compiled decoder. Wired HERE because this job is what
        # builds the pico artifacts the oracles open.
        #
        # It also brings `pico_pure_function_oracle` and `pico_abi_symbol_census`
        # into a lane for the first time. Both have existed since R311y568 and
        # ran only when someone remembered to type `--ignored` — the register
        # carried that as §11.9 and nothing changed it until now.
        run: bash scripts/run-ci.sh --layer Epico

      - name: Layer Ewire — the analyzer, on bytes a real zenoh-pico wrote
        # R311y759 — until this lane, every one of the analyzer's 649 witnesses
        # graded the dissector against bytes wz itself synthesised: no .pcap
        # existed in the tree, no capture was `include_bytes!`d, and no lane fed
        # a foreign process's output to wz-capture. A misreading shared by wz's
        # encoder and decoder was therefore invisible to the whole suite.
        #
        # A real `z_put` is relayed through an in-test TCP proxy and the recorded
        # stream is dissected, so the decoder faces an encoder it never saw.
        # Wired HERE because this job builds the zenoh-pico CLI it drives.
        run: bash scripts/run-ci.sh --layer Ewire

      - name: Layer E2 — facade-subset e2e vs zenoh-pico CLIs
        # The six wz-e2e-* SUBSET binaries: each pins an explicit atom list and
        # interoperates with a real pico CLI, which is what makes their proofs
        # TIGHTLY bounded (a full wz-ap-demo carries ~130 atoms and can prove far
        # less per test).
        run: bash scripts/run-ci.sh --layer E2

      # R311y451 corrected this count: the label read "3" while the lane already
      # guarded FIVE pico legs (adminspace-write / acl / future-push / qabl /
      # transit-push). The low-pass leg added this round makes six. A count in a
      # label has no gate, so it is a citation to re-read, not to increment.
      - name: Layer E6 — peer mesh (incl. 8 zenoh-pico interop legs)
        run: bash scripts/run-ci.sh --layer E6

      - name: Layer E6b — adminspace introspection over the peer mesh
        # wz<->wz today. Wired here because it is the PREREQUISITE for the
        # adminspace cross-impl cluster: zenoh-pico HAS Z_FEATURE_ADMIN_SPACE, so
        # a pico z_get can witness wz's adminspace — but only from a demo built
        # with `routing-peer,adminspace-*`, which is what this lane builds. With
        # the lane in hosted CI, that future proof executes here rather than
        # landing local-only.
        run: bash scripts/run-ci.sh --layer E6b

      - name: Layer E6e — adminspace plugins registry (wz<->wz + vs zenoh-pico)
        # R311y271 wired this lane here for the reason E6b's note above predicted:
        # its pico z_get proof of `adminspace-plugins-handlers` would otherwise be
        # LOCAL-ONLY. Layer A4 reports "proven by tests hosted CI actually runs" as a
        # separate population precisely so a proof that never executes cannot pad the
        # number that gates merges — and before this step, adding the proof moved the
        # all-lanes count while leaving the executed count flat. That gap is the
        # signal; this closes it.
        run: bash scripts/run-ci.sh --layer E6e

      - name: Layer E6f — adminspace metrics leg vs zenoh-pico
        # R311y275 wired this lane here for the reason E6b/E6e's notes give: its pico
        # z_get proof of `adminspace-metrics` would otherwise be LOCAL-ONLY, moving
        # A4's all-lanes count but not the executed count that gates merges. Its own
        # demo binary (built WITH adminspace-metrics) is distinct from E6b's (which
        # asserts the metrics leg absent), so it cannot share that lane.
        run: bash scripts/run-ci.sh --layer E6f

      - name: Layer E6g — adminspace read-gate deny vs zenoh-pico
        # R311y276 — same rationale as E6e/E6f: the pico witness of the
        # `adminspace-read` GET-deny gate would otherwise be LOCAL-ONLY. Its own demo
        # binary (built WITH adminspace-read, run --no-admin-read) is distinct from
        # E6b's (which needs the record SERVED), so it cannot share that lane.
        run: bash scripts/run-ci.sh --layer E6g

      - name: Layer E6h — adminspace config-hotreload storage lifecycle vs zenoh-pico
        # R311y277 — the config-diff-driven storage lifecycle (adminspace-config-hotreload)
        # ACTIVATED as a wire E2E: pico z_put storage-add -> wz RuntimeStorageManager
        # add_storage -> pico z_get sees storage_manager Started (Loaded before), z_put
        # storage-del reverses it. Its own demo binary (the ONLY build with the
        # --storage-host run-mode, --features adminspace-config-hotreload) is distinct
        # from every other E6* binary, so it needs its own lane. Wired here for the same
        # reason as E6e/E6f/E6g: a proof local-only to pre-push moves A4's all-lanes
        # count but not the executed count that gates merges.
        run: bash scripts/run-ci.sh --layer E6h

      - name: Layer E6i — storage-host adminspace read-gate deny vs zenoh-pico
        # R311y812 — the third sibling of E6g (peer) and E7g (router-hat), closing the
        # `adminspace-read` residual that named --storage-host as the last shipping
        # run-mode hardcoding read:true. It needs its OWN binary and cannot share
        # E6h's: adminspace-config-hotreload compiles the run-mode but does NOT imply
        # adminspace-read, so on E6h's build the permit resolves through the elided
        # constant-true site and the test would pass proving nothing. Wired here for
        # the same reason as E6e/E6f/E6g/E6h.
        run: bash scripts/run-ci.sh --layer E6i

      - name: Layer E7 — router-hat mesh (wz<->wz) + router adminspace vs zenoh-pico
        # R311y273 added the pico router-adminspace witness to this lane and wired the
        # lane here so it EXECUTES in hosted CI — same reason as E6e above: a proof only
        # local-to-pre-push moves A4's all-lanes count but not the executed count that
        # gates merges. E7 was previously local-only by omission (its one historical
        # flake, an in-run convergence tick-race, was fixed to a deterministic
        # shutdown-peak assertion in R311y124); verified stable across repeated runs
        # before wiring.
        run: bash scripts/run-ci.sh --layer E7

      # R311y581 — E7b / E7c were in scripts/run-ci.sh and never wired here, so
      # both ran only in a local full sweep. Neither needs a foreign binary:
      # they build wz-ap-demo and drive wz<->wz e2e fixtures, so this job's
      # zenohd/pico provisioning is incidental and a plain runner would serve.
      # They sit beside E7 because they are the same router-hat family. Both
      # measured green locally before wiring.
      - name: Layer E7b — router-connect-reconcile (feature ON + OFF arms)
        run: bash scripts/run-ci.sh --layer E7b

      - name: Layer E7c — adminspace-router-linkstate cross-node e2e
        run: bash scripts/run-ci.sh --layer E7c

      # R311y781. Wired here in the SAME commit that adds the lane, for the reason
      # E6e/E7/E8t above record: a proof that runs only in the local pre-push full
      # sweep is a proof nothing gates. This one DOES need the foreign binary (a
      # pico z_get), which is why it sits in this job rather than the plain one;
      # the lane itself skips when z_get is absent, and WZ_PICO_REQUIRE escalates
      # that skip to a failure here.
      - name: Layer E7g — adminspace-read GET gate on the router tier (pico z_get)
        run: bash scripts/run-ci.sh --layer E7g

      - name: Layer E8 — router-hat data plane vs a zenoh-pico subscriber
        run: bash scripts/run-ci.sh --layer E8

      - name: Layer E8t — router-hat time-hlc forward stamp vs a zenoh-pico subscriber
        # R311y450. Wired here in the SAME commit that adds the lane, for the reason
        # E6e/E7 above record: a proof that runs only in the local pre-push full sweep
        # moves A4's all-lanes count but NOT the executed count that gates merges, and
        # the executed count is the honest one. Leaving it local-only would have left
        # `time-hlc` reading unproven on the hosted number while the repo claimed a
        # cross-impl proof existed. Two demo builds (with and without time-hlc — the
        # positive leg plus its attribution twin), then the pico z_sub_attachment
        # witness; SKIPs if the pico CLI is absent, like E8.
        run: bash scripts/run-ci.sh --layer E8t

      - name: Layer E9 — the preset-ap-full COMPOSITION + QUERY PLANE vs real zenoh-pico
        # R311y480. Wired here in the SAME commit that adds the lane, for the reason
        # E6e/E7/E8t above record: a proof that runs only in the local sweep moves
        # A4's all-lanes count but NOT the executed count that gates merges.
        #
        # R311y481 grew the lane from 2 legs to 5, on the SAME preset build: the query
        # plane (`query-selector-parameters` / `query-attachment` / `query-reply-err`).
        # All three atoms are `preset-ap-full`-ONLY and each had a `codec-parity` claim
        # and nothing else, so none had ever faced a live foreign process — the bytes
        # were pinned against pico's own encoder in-process while nothing checked that
        # they reached a socket. No new step is needed here: the legs ride this same
        # `--layer E9` invocation, which is why the lane NAME is what changed.
        #
        # This lane is the first execution of `preset-ap-full` ever. Layer C4 only
        # `cargo build`s the wz LIBRARY under it, and `wz-ap-demo` had no
        # `preset-ap-full` key until this round, so the kitchen-sink preset had never
        # produced a binary, let alone spoken to a foreign peer. Every other pico lane
        # here drives a NARROW single-feature build, so composition is the axis none of
        # them covers. SKIPs if the pico CLI is absent, like E8/E8t.
        run: bash scripts/run-ci.sh --layer E9

      - name: Layer E10 — who sends a session Close at teardown (measurement)
        # R311y487. Wired in the SAME commit that adds the lane, for the reason every
        # sibling above records: a proof that runs only in the local sweep moves A4's
        # all-lanes count but NOT the executed count that gates merges. A MEASUREMENT
        # lane needs it more than most — an unrun measurement decays into a number
        # quoted from a ledger, which is the failure this project keeps hitting.
        #
        # It counts Close-opening batches from three closers against one acceptor:
        # wz-ap-demo on SIGTERM (the positive control), a real zenoh-pico z_put, and
        # the C ABI's z_close. It retracted the R311y486 carry: a bare FIN at z_close
        # is INSIDE pico's own envelope (pico emitted a Close in 3 of 20 runs), so the
        # capi's silence is fidelity, not a gap. The pico count is printed and NOT
        # asserted; gating it would be a 15%-red lane. SKIPs if the pico CLI is absent.
        run: bash scripts/run-ci.sh --layer E10

      - name: Layer E11 — AP-full advanced pub/sub against a real zenoh-pico
        # R311y488. Wired in the SAME commit that adds the lane, same reason as E10.
        #
        # The FIRST zenoh-pico witness the `ext-pubsub-*` plane has ever had, in both
        # directions: wz's cache answers a real z_advanced_sub's `@adv` history GET,
        # and wz's AdvancedSubscriber recovers a real z_advanced_pub's cache. It exists
        # because of two findings this round, both of which were build facts read as
        # implementation facts: zenoh-pico's advanced pub/sub knobs default to 0 (so
        # every advanced example here was a stub `main`, and "pico has no such plane"
        # entered two comments as if it were about pico), and `wz/preset-ap-full`
        # omitted the whole family (so the AP-full binary logged INERT for
        # `--advanced-publish`).
        #
        # SKIPs if the pico CLI is absent, like E9/E10 — but its guard names
        # z_advanced_sub / z_advanced_pub, NOT z_put: a machine with a pre-y488
        # zenoh-pico-cli directory has every other binary, so a z_put guard would
        # SKIP-green while reporting a fully provisioned pico.
        run: bash scripts/run-ci.sh --layer E11

      - name: Layer E12 — AP-full adminspace plane against a real zenoh-pico
        # R311y489. Wired in the SAME commit that adds the lane, same reason as E10/E11.
        #
        # The adminspace plane COMPOSED. Every §5.23 atom already had a pico witness
        # (y270 core+introspection, y237 plugins, y275 metrics, y276 read gate, y51
        # write gate) — what none of them had is the atoms TOGETHER, because each
        # builds its own narrow feature set into the one shared `--bin` path and
        # asserts the others are OFF (E6b's test requires `.../metrics` ABSENT, which
        # is what makes its own cfg-gate argument work). Six proofs of six parts and
        # none of the whole.
        #
        # This lane runs the whole plane on the AP-full binary: one z_get reads the
        # node record + introspection + metrics + plugins at once, --no-admin-read
        # suppresses every one of them from the SAME build, and a real z_put
        # reconfigures the node and reads its own write back through a second z_get.
        #
        # SKIPs if the pico CLI is absent, like E9/E10/E11 — its guard names z_get AND
        # z_put, since the write legs need the writer and a reader-only guard would
        # SKIP-green on a machine that has it.
        run: bash scripts/run-ci.sh --layer E12

      - name: Layer E13 — AP-full storage plane against a real zenoh-pico
        # R311y496. Wired in the SAME commit that adds the lane, and into THIS job
        # because this is the one that provisions the pico CLI — the R311y495 rule,
        # learned from C1bp SKIP-passing for two rounds in a job that does not.
        #
        # The §5.24 storage plane COMPOSED and driven entirely by foreign
        # processes: pico configures a storage over the admin write plane, pico
        # writes a sample into it, a LATER pico reads that sample back. Before
        # y496 the last step returned nothing at all — the storage's subscriber
        # and queryable were bound to the transient client session that had
        # created it, so the admin plane reported a live storage the storage plane
        # could not serve.
        #
        # Legs 2 and 3 are a pair: restart on the same --storage-host-dir and the
        # value must come back; run the same script without the flag and it must
        # not. Leg 2 alone passes just as well if the value never left memory.
        run: bash scripts/run-ci.sh --layer E13

      - name: Layer E14 — §5.24 dynamic storage volume against a real zenoh-pico
        # R311y497. Wired in the SAME commit that adds the lane, and into THIS job
        # because this is the one that provisions the pico CLI — the R311y495 rule.
        # The atom's unit + ABI + wire legs are Layer C1bv, in a job that needs no
        # foreign binary, so neither half can SKIP-green.
        #
        # A storage rides a volume this binary never compiled in: it arrived as a
        # `.so` the operator named, and a real zenoh-pico asked for it BY ITS
        # DECLARED ID over the admin write plane (`storage-add <name>@<vol>:<ke>`),
        # which is the payload widening that lands with this atom — without it no
        # client could reach any volume but the host's own.
        #
        # Leg 2 is the load-bearing one and legs 1/3 are why it means anything. The
        # host keeps an in-memory read mirror over EVERY backend (the in-tree
        # `StorageBackend::get` hands back a borrowed value), so inside one process a
        # read cannot separate "the volume served it" from "the host served itself".
        # Only a value the PREVIOUS process wrote can, and it reaches a fresh host
        # solely through the volume's `store_entries`. Leg 3 then forbids the
        # remaining reading: with --storage-volume absent the identical payload must
        # mount NOTHING, because the pre-R311y497 host would have silently
        # substituted its own volume. Leg 4 is the refusal path — a real
        # wz-plugin-example `.so`, which exports `wz_plugin_entry` and no
        # `wz_volume_entry` — with the node still serving afterwards.
        run: bash scripts/run-ci.sh --layer E14

      - name: Layer E15 — §5.21 router-connect-reconcile federation to a real zenoh-pico
        # R311y499. Wired in the SAME commit that adds the lane, and into THIS job
        # because this is the one that provisions the pico CLI — the R311y495 rule.
        #
        # `router-connect-reconcile` had four proofs and no foreign witness. All four
        # live in wz_router_hat_connect_reconcile.rs, all are wz<->wz, and all assert a
        # LINK-STATE COUNT — a federation face that establishes, floods link-state and
        # then forwards nothing passes every one of them. That file also records why it
        # stopped there ("Cross-impl is NOT needed for this atom: the reconcile
        # introduces no new wire format"), which is right about the wire FORMAT and
        # silent about the DATA PATH: what the reconcile creates is a face the router
        # tier must then choose as a next-hop, a routing decision rather than a codec
        # one.
        #
        # Leg 1 puts a real pico z_pub on R1 and a real pico z_sub on R2 with R1
        # holding NO static --connect, so the sample can only arrive across the face
        # --connect-after dialed at runtime. Leg 2 is why leg 1 means anything: the
        # AP-full preset compiles router-multicast-faces, and a first run of this
        # topology showed both routers logging mcast-ingress activity, so "the sample
        # crossed" would not by itself name the reconcile. Removing ONLY
        # --connect-after leaves the same binary forwarding `0 data push(es)`.
        run: bash scripts/run-ci.sh --layer E15

      - name: Layer C1bp — §5.22 dynamic plugin loading, end to end
        # R311y495 — MOVED here from `validate + verify + test`, where R311y492
        # first wired it and where it SKIP-passed on its very first hosted run:
        # that job does not provision the zenoh-pico CLI, so the lane built the
        # cdylib, ran the ABI + host unit tests and clippy (86s of real work) and
        # then skipped the one leg that makes it a cross-impl proof. A SKIP is
        # green, which is the R311y265 masked-skip burn, and it took a hosted log
        # read to see it — the run's own conclusion said pass.
        #
        # This job provisions the pico CLI, so the guard cannot fire here.
        run: bash scripts/run-ci.sh --layer C1bp

      - name: Cache the unixpipe-enabled zenohd binary (R311y392)
        # A SEPARATE oracle from target/zenohd: zenoh's `default` omits
        # transport_unixpipe (and crates.io cannot add a dependency feature), so the
        # wz<->zenohd unixpipe interop needs a SOURCE build with
        # `--features zenoh/transport_unixpipe`. Cached like the default oracle (a
        # pure function of the version + build script); keyed on the script content
        # so a changed recipe gets a fresh cache.
        id: zenohd-unixpipe-cache
        uses: actions/cache@v4
        with:
          path: target/zenohd-unixpipe
          key: zenohd-unixpipe-1.10.0-ubuntu-22.04-${{ hashFiles('scripts/build-zenohd.sh') }}

      - name: Build the unixpipe-enabled zenohd (cache miss only)
        if: steps.zenohd-unixpipe-cache.outputs.cache-hit != 'true'
        # ZENOHD_UNIXPIPE=1 selects the separate target + adds
        # `--features zenoh/transport_unixpipe`; ZENOHD_ALLOW_CLONE=1 forces the
        # source path (crates.io cannot add the feature). Cold cost is one extra
        # zenohd build; the cache makes it ~zero thereafter.
        env:
          ZENOHD_UNIXPIPE: "1"
          ZENOHD_ALLOW_CLONE: "1"
        run: bash scripts/build-zenohd.sh

      - name: Assert the unixpipe zenohd is present
        # A restored-but-missing cache would make Layer Z's unixpipe legs FAIL under
        # WZ_Z_REQUIRE (correct — the proof must run), but assert here for a clearer
        # error than a mid-lane cargo-test failure.
        run: |
          test -x target/zenohd-unixpipe/zenohd \
            || { echo "::error::unixpipe zenohd missing after build/restore — the wz<->zenohd unixpipe interop would FAIL under WZ_Z_REQUIRE"; exit 1; }

      - name: Enable AF_VSOCK loopback (R311y422)
        # MEASURED, not assumed. R311y421 shipped this as a probe because whether the
        # runner image could do AF_VSOCK was an unknown no local test could settle, and
        # run 30251723895 answered it: kernel 6.8.0-1062-azure, `modprobe vsock_loopback`
        # succeeds, /dev/vsock appears, and a bind+listen on VMADDR_CID_LOCAL returns
        # (1, 3517351901). So the inherited claim that "the hosted runner has neither"
        # was wrong about the kernel half — it needed one modprobe.
        #
        # A HARD step now, not a probe: the vsock leg below is required, so a runner
        # that cannot load the module must red here with a clear cause rather than
        # produce a confusing mid-lane bind failure.
        run: |
          set -euo pipefail
          sudo modprobe vsock_loopback
          lsmod | grep -q '^vsock_loopback' \
            || { echo "::error::vsock_loopback did not load — the wz vsock acceptor interop cannot run"; exit 1; }
          python3 - <<'PY'
          import socket, sys
          VMADDR_CID_LOCAL, VMADDR_PORT_ANY = 1, 0xFFFFFFFF
          try:
              s = socket.socket(socket.AF_VSOCK, socket.SOCK_STREAM)
              s.bind((VMADDR_CID_LOCAL, VMADDR_PORT_ANY)); s.listen(1)
              print("AF_VSOCK bind+listen on VMADDR_CID_LOCAL:", s.getsockname(), "OK")
              s.close()
          except OSError as exc:
              sys.exit(f"::error::AF_VSOCK unusable after modprobe ({exc})")
          PY

      - name: Cache the vsock-enabled zenohd binary (R311y422)
        # A THIRD oracle, same rationale as the unixpipe one above: zenoh's `default`
        # omits transport_vsock, so the wz vsock ACCEPTOR interop needs a source build
        # with `--features zenoh/transport_vsock`. zenoh-pico has no vsock client, so
        # zenohd is the only foreign vsock dialer that can witness this atom.
        id: zenohd-vsock-cache
        uses: actions/cache@v4
        with:
          path: target/zenohd-vsock
          key: zenohd-vsock-1.10.0-ubuntu-22.04-${{ hashFiles('scripts/build-zenohd.sh') }}

      - name: Build the vsock-enabled zenohd (cache miss only)
        if: steps.zenohd-vsock-cache.outputs.cache-hit != 'true'
        env:
          ZENOHD_VSOCK: "1"
          ZENOHD_ALLOW_CLONE: "1"
        run: bash scripts/build-zenohd.sh

      - name: Assert the vsock zenohd is present
        run: |
          test -x target/zenohd-vsock/zenohd \
            || { echo "::error::vsock zenohd missing after build/restore — the wz vsock acceptor interop would FAIL under WZ_Z_REQUIRE"; exit 1; }

      - name: Layer Z — zenohd (zenoh-full) interop
        # The ONLY proofs against the canonical Rust implementation. Until this
        # step existed they ran on exactly one machine.
        #
        # WZ_Z_REQUIRE=1 turns every prereq SKIP in this lane into a FAIL. On a
        # developer's box a SKIP is honest (zenohd is an external binary they may
        # not have built). Here the steps above GUARANTEE it — and the storage
        # plugin with it — so a SKIP would be a provisioning regression wearing a
        # green badge, and it would lie twice: Layer A4 reads "this lane is in
        # ci.yml" as evidence its proofs EXECUTED. Same rule as WZ_QZ_REQUIRE.
        env:
          WZ_Z_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer Z

      - name: Layer E5z — router QueryTarget e2e vs real zenoh queryables
        # R311y841 — the wz `--router` must HONOUR a query's QueryTarget, not
        # relay it: `BestMatching` (the wire default a plain z_get sends) asks
        # the single nearest COMPLETE queryable, `AllComplete` filters, `All`
        # fans out. Wired HERE rather than beside Layer E5 because the oracle is
        # `zenoh_z_queryable --complete` / `zenoh_z_get --target`, which this job
        # is what provisions — zenoh-pico's queryable cannot declare itself
        # complete at all, so a pico-job placement would SKIP green forever.
        # WZ_Z_REQUIRE=1 for the same reason as Layer Z above.
        env:
          WZ_Z_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer E5z

      - name: Layer Ewirez — the analyzer, on bytes a real zenohd wrote
        # R311y760 (carry N65) — the sibling of Layer Ewire against the OTHER
        # reference implementation. Ewire closed the self-authored-fixture hole
        # for zenoh-pico and explicitly not for stock zenoh: the roles swap, so
        # the foreign half here is what a ROUTER writes. R311y761 corrected the
        # first run's report: the direction labels were swapped, zenohd sent
        # [Init, Open], and the three Frames were wz's own.
        #
        # R311y762 added the leg where the router HAS something to route, and
        # R311y764 (carry N68) opens the Frames it sends there: the lane now
        # grades the record layer against a real router, not just the transport
        # envelope. Idle leg `[]`, routing leg `["Push", "Push"]`.
        #
        # R311y902 (open-debt item 396) adds a third leg on the same oracles:
        # the AUTH chain, captured between a stock `z_get` carrying
        # `transport/auth/usrpwd/{user,password}` and a zenohd holding the
        # matching dictionary. It is a SEPARATE capture from the leg below
        # because a zenohd with a dictionary refuses any client without the
        # extension, so folding them would make the ext-body witness depend on
        # auth succeeding.
        #
        # R311y900 (open-debt item 406) adds the FIELD leg one level in, and it
        # needs the core zenoh examples on top of zenohd — which this job
        # already provisions for Layer E5z directly above. Both halves of its
        # capture are foreign: a stock `z_queryable --complete` dials through
        # the tap and a stock `zenohd` forwards a stock `z_get --target`
        # query back through it, so no wz process is on that wire at all.
        #
        # Wired HERE because this job is what builds and guarantees zenohd; the
        # same `WZ_Z_REQUIRE` reasoning applies, and the lane's own prereq check
        # turns an absent binary into a FAIL under it.
        env:
          WZ_Z_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer Ewirez

      - name: Layer M — multicast loopback + wz<->pico multicast interop (R311y421)
        # WHY THIS LANE MOVED FROM OPT-IN TO HOSTED. Layer A4 reports three atoms
        # sitting in the headline `proven` with NO hosted witness of any kind; for
        # router-multicast-faces and transport-multicast (and codec-join's `full`
        # claims) the reason is that EVERY witness they have is in this lane, which
        # was opt-in and so ran on no default path at all — not hosted, not even the
        # pre-push sweep. A proof that runs nowhere is not a proof, and that is the
        # exact false authority the A4 axis exists to end.
        #
        # ON THIS JOB rather than a new one: these witnesses are wz<->pico multicast
        # interop tests, and this job already builds the zenoh-pico CLI. A separate
        # runner would pay that build again to gain nothing.
        #
        # THE FLAKINESS RATIONALE WAS RE-READ, NOT INHERITED. run-ci.sh kept this
        # lane opt-in because "a CI CONTAINER without a multicast route on the
        # default interface drops the IGMP join". GitHub's hosted runners are full
        # VMs with a default route, not containers; the tests use 224.0.0.224 (the
        # link-local control block) joined with INADDR_ANY and multicast_loop(true),
        # so both ends are the same host and the datagram never leaves it. Measured
        # locally: 5/5 green, 0 skips, 15-26s. None of that proves the RUNNER can
        # join — only a run here can — so the lane now prints a multicast preflight
        # (routes, links, a real IGMP join attempt) before its first test, and a
        # failure is therefore readable as environment-versus-code in ONE run.
        #
        # WZ_M_REQUIRE=1 makes every SKIP path in the lane fatal, including the
        # opt-in gate and the pico-CLI prereq. Same rule as WZ_Z_REQUIRE above: this
        # job guarantees the CLI, so a SKIP here would be a provisioning regression
        # wearing a green badge — and it would restore, silently, precisely the
        # no-hosted-witness state this step exists to end.
        env:
          WZ_M_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer M

  # ─────────────────────────────────────────────────────────────────
  # R311iw — embedded cross-compile + QEMU job. Layer G (per-triple
  # no_std cross-compile of the wz crates) and Layer Q (QEMU mps2 /
  # microbit boot e2e + the ROM-footprint regression gate) need an ARM
  # cross-toolchain + qemu-system-arm the primary `ci` job's runner does
  # not carry, so they run in a dedicated job here.
  #
  # WHY THIS JOB EXISTS: this runner carries the ARM cross-toolchain +
  # qemu-system-arm the primary `ci` runner does not. R311iw originally
  # hosted G + Q here to gate footprint "without slowing the local
  # pre-push path" — but R311pt found that trade-off leaves a hole: CI
  # only fires on push, so a long unpushed arc (R311p*, ~20 rounds) let
  # footprint drift accumulate undetected on BOTH the CI path (never
  # triggered) AND the pre-push path (opt-in, never set). R311pt retired
  # the cost-based opt-in axis: F/G/Q/Z are now default-on in
  # scripts/run-ci.sh. R311y415 — this block then said "so the pre-push hook
  # gates footprint locally before every push" and that lane logic is
  # "shared with pre-push", both of which R311y386 killed: that round cut
  # the hook to validate-workspace + a changed-crate `cargo test -p`, and
  # its own header names footprint among what it no longer covers. So this
  # job is not a MIRROR of a local gate — it is the ONLY place F/G/Q/Z run.
  # Lane logic still lives in scripts/run-ci.sh (the R65b single source of
  # truth); this job installs the toolchain and invokes the lanes.
  cross-mcu:
    name: cross-compile + QEMU (Layer G + Q)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # libclang for the sce-codegen / *-sys build scripts. `cmake` used to
        # be on this line under the same clause, and R311y881 measured the
        # clause false for it: `scripts/build-sce.sh` names cmake zero times,
        # the only `cmake` crate consumer in the workspace is `zenoh-pico-sys`,
        # and Layers G and Q build neither it nor `wz-integration-tests`. A
        # comment asserting a need nobody had measured is what kept 6.9 MB on
        # this job's critical path over a mirror running at 27 kB/s.
        # gcc-arm-none-eabi supplies arm-none-eabi-{gcc,size} (the lwIP C
        # cross-compile + the Layer Q.3 footprint `size` measurement);
        # libnewlib-arm-none-eabi supplies the bare-metal newlib C headers
        # (string.h etc.) that gcc-arm-none-eabi alone OMITS on Ubuntu's
        # split packaging — without it the lwIP `def.c` cross-compile fails
        # `fatal error: string.h: No such file or directory` (Layer G.6 /
        # G.11). qemu-system-arm boots the mps2 / microbit ELFs (Q.2 / Q.4).
        run: |
          bash scripts/lib/apt-install.sh libclang-dev libxml2-dev clang \
            pkg-config gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Save apt archives
        # See the `feature-gates` copy. This is the job the gate matters MOST
        # for: ~135 MB, which at the measured 27 kB/s is past its own
        # `timeout-minutes`, so it can only ever arrive across several runs.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain + embedded targets (pinned by rust-toolchain.toml)
        # THE job this pin exists for: Layer Q's footprint gate lives here. The
        # embedded target list moved into rust-toolchain.toml so it follows the
        # PINNED toolchain — listed here (on a floating `stable`) it would be
        # installed on a toolchain cargo does not use, leaving the real one
        # without the targets, and run-ci.sh SKIPs a missing target: the gate
        # would report green having measured nothing. See the `ci` job's step.
        run: rustup show

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: Build sce-codegen (vendor/sce)
        run: bash scripts/build-sce.sh

      - name: Layer G — per-triple no_std cross-compile
        run: bash scripts/run-ci.sh --layer G

      - name: Layer Q — QEMU mps2/microbit e2e + footprint gate
        # R311y274 — WZ_Q_REQUIRE=1: this runner PROVISIONS the ARM cross-toolchain
        # + embedded targets, so any footprint SKIP here (target absent, binary not
        # built, size/strings tool missing) is a provisioning regression, not a
        # legitimate host-lacks-the-tool skip. Without it the footprint gate — the
        # whole subject of R311y267 — was the ONE provisioned lane whose SKIPs went
        # green (its only defense was `rustup show` auto-installing the targets;
        # rustup regressed exactly that in 1.28.0). Same rule as WZ_Z/QZ/PICO/A4.
        env:
          WZ_Q_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer Q

  # R311y31 — REAL Zephyr cooperative-profile boot e2e (Layer Qz). UNLIKE the
  # pure-cargo G/Q lanes (cargo IS the build), the Zephyr port is
  # west/cmake/kconfig-driven, so this dedicated job provisions the Zephyr
  # toolchain the dev host carries — Python 3.12 + west + a PINNED Zephyr source
  # tree + the Zephyr SDK 1.0.1 arm toolchain — then runs `--layer Qz`, which
  # `west build`s deploy/zephyr-app for qemu_cortex_m3 (linking the wz cargo
  # staticlib via the CMakeLists.txt --undefined kernel-symbol contract) and
  # boots it on QEMU, asserting the `ZEPHYR-WZ PASS` console sentinel. This ends
  # the G.16/G.17 pure-cargo lib-check staging with an EXECUTED boot on CI (the
  # R311y25 "a new artifact must get a CI lane in the same round — local-only is
  # the burn" rule applied to the Zephyr deploy). Lane logic stays in
  # scripts/run-ci.sh (R65b SSOT); this job only provisions + invokes --layer Qz.
  # The Zephyr ref + SDK version are pinned to the dev host's verified pair
  # (4.4.0-6201-gdaad7c59 / SDK 1.0.1) and the workspace + SDK are cached so the
  # ~GB west-update + SDK download is a one-time cost.
  zephyr-mcu:
    name: Zephyr cooperative profile boot (Layer Qz)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # Pinned to the exact pair the dev host booted (boot banner
      # v4.4.0-6201-gdaad7c59b8e); the zephyr tree's SDK_VERSION = 1.0.1.
      ZEPHYR_REF: daad7c59b8ebd8db8d08c2749802ac74f971eb2a
      ZEPHYR_SDK_VERSION: "1.0.1"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # arm-none-eabi-gcc = the lwip-sys cross cc (CC_thumbv7m_none_eabi) +
        # libnewlib its bare-metal C headers; qemu-system-arm boots the image;
        # cmake/ninja/dtc are the Zephyr build system; libclang/clang for the
        # wz *-sys build scripts; xz-utils extracts the SDK tarballs.
        run: |
          bash scripts/lib/apt-install.sh \
            cmake ninja-build device-tree-compiler \
            libclang-dev libxml2-dev clang pkg-config \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            qemu-system-arm xz-utils

      - name: Save apt archives
        # See the `feature-gates` copy for why `always()` and why the dirty gate.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain + thumbv7m (pinned by rust-toolchain.toml)
        # thumbv7m comes from the pin's `targets` list. See the `ci` job's step.
        run: rustup show

      - name: Set up Python 3.12 (Zephyr main requires >= 3.12)
        # R311y892 — `id` so the RESOLVED patch version can be named in the
        # Zephyr cache key below. "3.12" is a range, and which patch this step
        # hands back is the runner image's choice, not ours.
        id: setuppy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # R311y33 — restore/save SPLIT (not the combined actions/cache@v4 whose
      # post-step saves unconditionally): the save below is gated on success() so
      # a partial / failed provision can never poison the cache key (a poisoned
      # cache would cache-hit on the next run, skip provision, and build against a
      # half-tree). The Verify step catches a partial RESTORE the same way.
      # R311y892 — THE KEY NAMES THE INTERPRETER, and that is the whole fix for
      # hosted runs 32321994673 and 32324338415. `~/zephyrproject/.venv` is
      # built by `python3.12 -m venv`, so its `bin/python` is a SYMLINK into the
      # hosted tool cache and its `bin/west` is a script whose shebang names
      # that symlink. Cache the venv under a key that does not name the
      # interpreter and the restore is only valid while the runner image still
      # carries the same patch release: when 3.12.x moved, the symlink dangled,
      # `west` died with `bad interpreter: No such file or directory`, and Layer
      # Qz failed in 0 seconds. It came back on its own when the patch lined up
      # again, which is why this read as flake for two runs.
      #
      # The general rule, and the reason this is a key change rather than a
      # repair: a cache key must name every input the cached artifact depends
      # on. This one depended on the resolved Python and did not say so.
      - name: Restore Zephyr workspace + SDK cache
        id: zephyr-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/zephyrproject
            ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
            ~/.cmake/packages/Zephyr-sdk
          key: zephyr-${{ env.ZEPHYR_REF }}-sdk-${{ env.ZEPHYR_SDK_VERSION }}-py${{ steps.setuppy.outputs.python-version }}-v3

      - name: Provision Zephyr (west + pinned source + SDK)
        if: steps.zephyr-cache.outputs.cache-hit != 'true'
        # Mirrors the dev-host setup 1:1 so the Qz lane's default paths
        # (~/zephyrproject/.venv + ~/zephyrproject/zephyr) resolve with no env
        # override. `west init --mr` only accepts a branch/tag (it runs
        # `git clone --branch`, which rejects a raw commit SHA → exit 128), so we
        # clone the manifest repo ourselves (blobless = fast, full history so the
        # pinned commit is reachable), fetch+checkout the pinned SHA, then
        # `west init -l` adopts the local repo. --narrow -o=--depth=1 keeps the
        # module update shallow; the zephyr tree's SDK_VERSION (1.0.1)
        # auto-selects the SDK, installed to ~/zephyr-sdk-1.0.1 (HOME default).
        run: |
          python3.12 -m venv ~/zephyrproject/.venv
          # shellcheck source=/dev/null  # created by the venv line above
          . ~/zephyrproject/.venv/bin/activate
          python -m pip install --upgrade pip
          pip install west tqdm
          git clone --filter=blob:none https://github.com/zephyrproject-rtos/zephyr ~/zephyrproject/zephyr
          git -C ~/zephyrproject/zephyr fetch --filter=blob:none origin "$ZEPHYR_REF"
          git -C ~/zephyrproject/zephyr checkout "$ZEPHYR_REF"
          cd ~/zephyrproject
          west init -l zephyr
          west update --narrow -o=--depth=1
          west zephyr-export
          pip install -r zephyr/scripts/requirements-base.txt
          west sdk install -t arm-zephyr-eabi
          # Forensics: the manifest @ ZEPHYR_REF pins every module to an immutable
          # SHA (verified: west.yml has 0 branch-name revisions), so this snapshot
          # is reproducible; logging the resolved set makes it auditable post-hoc.
          west list

      - name: Verify Zephyr provisioning (catch a partial cache / failed provision)
        # Assert the toolchain is WHOLE before caching or building — a partial
        # cache-restore or an incomplete provision is caught loudly here instead
        # of silently SKIPping Layer Qz or building a half-tree. Runs on both the
        # cache-hit and freshly-provisioned paths.
        # R311y892 — RUN the venv's tools; do not stat them. This step's first
        # check was `test -x ~/zephyrproject/.venv/bin/west`, and the failure it
        # exists to catch left that true: the file was present and executable
        # and its INTERPRETER was gone, so the step reported "provisioning
        # verified" and Layer Qz then died on `bad interpreter`. A check that
        # cannot fail on the defect it names is not a check — the same shape
        # R311y887 found twice in one round, where a rule was satisfied by a
        # comment and then by a function's name.
        #
        # `--version` is the cheapest thing that resolves a shebang, imports the
        # stdlib and returns non-zero when either is missing, and it prints what
        # it found, so a future mismatch is diagnosable from this step rather
        # than from the build twelve steps later.
        run: |
          set -e
          ~/zephyrproject/.venv/bin/python --version
          ~/zephyrproject/.venv/bin/west --version
          test -d ~/zephyrproject/zephyr/boards
          test -d ~/.cmake/packages/Zephyr-sdk
          find ~/zephyr-sdk-"${ZEPHYR_SDK_VERSION}" -name arm-zephyr-eabi-gcc -type f \
            | grep -q . || { echo "arm-zephyr-eabi toolchain missing in SDK"; exit 1; }
          echo "Zephyr provisioning verified (venv RUNS + zephyr tree + SDK arm toolchain)."

      - name: Save Zephyr workspace + SDK cache
        # Save ONLY on a cache miss AND only after provision+verify succeeded
        # (success()) — a failed/partial provision never writes the cache key.
        if: success() && steps.zephyr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/zephyrproject
            ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
            ~/.cmake/packages/Zephyr-sdk
          key: zephyr-${{ env.ZEPHYR_REF }}-sdk-${{ env.ZEPHYR_SDK_VERSION }}-py${{ steps.setuppy.outputs.python-version }}-v3

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            deploy/zephyr-app/rust -> target

      - name: Layer Qz — Zephyr west build + QEMU boot e2e
        # The lane sources ~/zephyrproject/.venv itself for the west build; the
        # explicit activate here also puts west on PATH for the pre-build gate.
        # WZ_QZ_REQUIRE=1 makes a prerequisite SKIP FATAL on THIS dedicated job
        # (the provisioning steps guarantee every prerequisite, so a SKIP here is
        # a provisioning regression that must fail red, not pass green).
        env:
          WZ_QZ_REQUIRE: "1"
        run: |
          # shellcheck source=/dev/null  # provisioned by the venv step above
          . ~/zephyrproject/.venv/bin/activate
          bash scripts/run-ci.sh --layer Qz

  # R311y11 — macOS + Windows NATIVE portability check of the wz AP stack.
  # The Linux `ci` job above cannot catch target_os-routed regressions: the
  # default AP stack must compile clean off-Linux, the quinn/rustls datagram
  # backend must compile natively on macOS + Windows, and the unixpipe + vsock
  # backends (Linux-only by design) must compile OUT cleanly off-Linux. GitHub
  # provides real macOS + Windows runners, so this compiles NATIVELY (not cross).
  # R311y13: a `cargo clippy -D warnings` portability GATE (upgraded from bare
  # `check` — matches the project's universal lint bar + runs codegen, not just
  # type-check); it skips the Linux-only Layer A-F deps (mnemosyne-cli / protoc /
  # zenoh-pico) the AP-stack compile does not need. The wz AP crates are
  # built from the committed out/** codegen (R311y22), so this native gate needs
  # NO build-time codegen — no libxml2 / sce-codegen on the runner. Scope = the
  # PORTABLE feature surface:
  # the default set (tcp/udp, no unix-only backend) + transport-link-quic-datagram
  # (quinn is cross-platform). It deliberately does NOT enable
  # transport-link-{unixpipe,vsock} off-Linux: those features pull `dep:libc` /
  # `dep:tokio-vsock` from the `[target.linux]` table, so enabling them on a
  # non-Linux target is an invalid `dep:` reference by construction (they are
  # Linux-only backends). R311y305: the prior clause here claimed these are
  # "verified by the ci job's Linux lanes C1al / vsock" — that is STALE. C1al
  # (unixpipe) and C1ab (vsock) were both defined in scripts/run-ci.sh but NOT
  # in this workflow's enumerated --layer set, running only in a local full
  # sweep. R311y410/y413 UPDATE: C1al (unixpipe) AND C1ab (vsock) are now BOTH
  # hosted on the feature-gates job below (Linux lanes), so both backends are
  # verified by a hosted Linux lane (vsock as a COMPILE + clippy gate; its e2e is
  # #[ignore] for lack of the vsock_loopback module). Either way the Linux-only-ness
  # is enforced at the Cargo `[target.'cfg(...)']` layer, not by a hosted lane.
  feature-gates:
    name: feature-gate NEG lanes (subsets no other job composes)
    runs-on: ubuntu-22.04
    # Its OWN runner, deliberately NOT the `ci` job. R311y415 — the COST half
    # of this rationale had gone stale and is corrected here. It used to read
    # "that job is at BOTH of its ceilings: 26m22s against
    # `timeout-minutes: 30`". Measured over the 12 `ci`-job runs ENDING at
    # 30210387310 (2026-07-26): 584-928s, median 630s — ~35% of its
    # 30-minute budget, so it is not at its TIME ceiling and has not been
    # for some time. The window is pinned to those run ids on purpose: "the
    # last 12 runs" is how 26m22s rotted. The band predates the Layer 0 step
    # R311y415 added to that job; that step measured 23s hosted on run
    # 30233462393, where the job totalled 599s — inside the band, so it does
    # not move this rationale.
    # What survives is the DISK half: that job's own comment above declares
    # "THIS JOB HAS NO OTHER DISK HEADROOM", and every extra feature-subset
    # lane is a DISTINCT feature set and so a DISTINCT set of `crates/target`
    # artifacts — the 15 lanes below add 15 such subsets between them (count
    # them in the step list; R311y415 replaced "roughly a dozen", which was
    # an approximation of something exactly countable). That half is NOT
    # re-measured here and should not be read as
    # confirmed: the `ci` job brackets only its PRE-build prune with `df -h`
    # (87G avail before, 104G after, on run 30210387310) and nothing reports
    # free space once the lanes have run, so end-of-job headroom is UNKNOWN
    # rather than known-tight. A post-lane `df -h` would settle it.
    # (R311y318: the job name used to enumerate its
    # lanes as "C1bi + C1bj"; it went stale the moment C1bk landed, so it now
    # names the genre. The step list below is the enumeration.)
    # Hanging them off `ci` would still trade a real gate for an ENOSPC risk
    # on an unmeasured disk budget — the failure mode is a build dying on a
    # full disk, not a timeout (R311y415: the old wording said "flaky
    # timeout", correct when the rationale was time, wrong once the surviving
    # rationale is disk). A parallel job costs runner minutes but zero
    # critical-path wall clock.
    #
    # R311y425 — 30 -> 45. The job measured 14m37s with C1y (R311y424), and the
    # eleven lanes added below carry a 64s local median / 232s p90, i.e. roughly
    # +4.6 min typical and +16.6 min at p90 against this repo's measured 4.3x
    # hosted ratio. 30 would have survived the median and not p90. The BUDGET
    # moves rather than the runner because the post-lane `df -h` R311y424 added
    # reports 68G free, which removes the disk argument that put every previous
    # overflow on its own machine.
    # R311y792 — THIS JOB IS THE SECOND ONE AT ITS TIME CEILING, and nothing
    # knew. Measured over the completed CI runs ending at 31750463524: 10
    # successful runs spanning 2039-2328s against the 2700s budget, median
    # 2208s — 82% at the median and 86% at the max, which is the band the `ci`
    # job was in when run 31711867852 was cancelled. The margin step at the
    # bottom of this job is therefore not decoration; it is expected to fire.
    #
    # IT FIRED on run 33087340444: 2634s of 2700s, 97%. Every lane passed;
    # what failed is the MARGIN.
    #
    # R2165 — THE SHAPE THE y792 TEXT PREDICTED IS NOT THE SHAPE IT HAS, and
    # the paragraph that stood here said so wrongly in three ways at once. It
    # read: "this job has NO hot step (the largest, C1ay, is 227s of 2216s =
    # 10%), so it is a long tail of 54 lanes rather than one lane to peel",
    # and prescribed the footprint job's `shard` matrix. Re-derived from the
    # red job's own log, the lane set taken from THIS job's `--layer` steps
    # rather than from what the log happened to print (37 declared, 37 timed,
    # neither set carrying a lane the other lacks):
    #
    #   * there ARE 37 lanes here, not 54;
    #   * C1ay, C1y and C1am are not among them at all -- R311y793 moved them
    #     to `routing-adminspace` one round after y792 measured them, so the
    #     five it named as the interim peel are four-fifths gone;
    #   * there IS a hot step: C1bn at 688s is 26.1% of the job and 3.28x the
    #     next lane (C1j, 210s). A shard matrix is what you reach for when no
    #     single lane dominates, and one does.
    #
    # So the remedy taken is the one `job-budget-margin.sh` itself prescribes
    # -- peel the lane into its own job -- and NOT `timeout-minutes`, for the
    # reason that script states: a bigger number buys one atom's worth of time
    # and re-arms the same failure. Peeling C1bn alone lands this job at 1946s
    # = 72.1% of 2700. Peeling instead the next four (C1j + C1z + C1bl + C1bi
    # = 745s) would land it at 70.0% -- 2.1 points better for four times the
    # lanes moved, and it would strand the three packages, because C1bn is the
    # only lane here with provisioning of its own.
    #
    # NOTE the cost is newly VISIBLE, not newly INCURRED: before R2163 this
    # job died early on C1bn's two uring tests (ENOMEM), so every percentage
    # measured before that ran is of a job that stopped partway.
    timeout-minutes: 45
    steps:
      - name: Budget stamp — start this job's own clock
        # R311y792 — read by the margin step at the bottom. See the `ci` job's
        # step of the same name for why it is FIRST.
        run: date +%s > "$RUNNER_TEMP/wz_job_start"

      - name: Checkout (with submodules)
        # `recursive`: wz-session-core compiles against sce_forge_runtime from
        # vendor/sce, so the lanes below do not build without it.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt archives (R311y882 — keep the mirror off the path)
        # R311y881 MEASURED azure.archive.ubuntu.com at ~27 kB/s sustained on
        # run 32266212482, at which this repo's 25-142 MB per job cannot be made
        # to fit by any ceiling — the 142 MB job needs ~88 minutes, past its own
        # `timeout-minutes`. The throughput is not ours to fix. Paying it once
        # instead of every run is.
        #
        # `apt-install.sh` points apt's `Dir::Cache::archives` here, so a cold
        # run downloads the .debs and every run after it finds them already
        # present. The path is decided in ONE place (that script) and named here;
        # Layer C0g asserts the two agree, because a disagreement would save an
        # empty directory every run and nothing would say so.
        #
        # Keyed per JOB because the package lists differ per job, and on ci.yml's
        # hash so a changed list gets a new key rather than a stale hit. The
        # restore-keys prefix means a changed list still starts from the last
        # good archive instead of from nothing.
        # RESTORE and SAVE are split on purpose. The combined `actions/cache`
        # saves in a post step, and R311y882 shipped it while admitting nobody
        # knew whether that runs after a FAILED job. That unknown is load-bearing
        # here: the job this fixes is the one a slow mirror reds, so if a red job
        # cannot save its partial archive, the cache never warms and the fix
        # never engages. The save below is `if: always()` precisely so a cold red
        # run still leaves the next one better off.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # R2165 — `tcpdump`, `libpcap-dev` and `netbase` are NO LONGER here.
        # Each was justified by an adjudicator Layer C1bn arms on, and C1bn
        # moved to the `dissect` job; the packages moved with it rather than
        # being left behind for a lane that no longer runs here. Their reasons
        # travelled too, and are stated in full on that job's own install step.
        run: |
          bash scripts/lib/apt-install.sh cmake libclang-dev libxml2-dev clang perl pkg-config

      - name: Save apt archives
        # `always()`: the job this exists for is the one a slow mirror REDS, and
        # actions/cache's combined action cannot save "as the workflow failed in
        # between" (its own save/README.md). Without this a cold red run throws
        # its partial download away, the cache never warms, and the fix never
        # engages — the bootstrap would depend on a green run.
        #
        # Gated on WZ_APT_CACHE_DIRTY, which `apt-install.sh` sets only when the
        # archive actually gained bytes, so a warm fleet does not re-upload ~35 MB
        # per job per run into a 10 GB repo-wide cap and evict the Rust caches.
        # The run_id suffix makes each save a NEW entry: saving under a key that
        # already exists is a no-op, which would freeze a partial archive forever.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

