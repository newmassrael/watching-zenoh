#
# watching-zenoh release — tag-driven release rehearsal.
#
# Trigger: pushing a `v*` tag (e.g. `v0.1.0-mvp`).
#
# This workflow runs the same 8-lane CI mirror that ci.yml runs
# (delegated to scripts/run-ci.sh so the two paths cannot drift)
# and then creates a GitHub release with auto-generated notes
# anchored to the tag. Actual `cargo publish` to crates.io is a
# separate manual step — this workflow exercises the dry-run
# packaging gate per publishable crate so packaging errors
# surface before the manual publish.
#
# Why dry-run only:
#   - wz-codecs build.rs invokes SCE codegen from vendor/sce; the
#     full source tree exceeds the 10 MiB crates.io tarball cap.
#     A `[package.exclude]` pass that prunes vendor/sce + generated
#     intermediates is the prerequisite for the real publish step,
#     and the dry-run output identifies exactly which paths need
#     excluding (cargo lists the packaging contents).
#   - The first external release (v0.1.0-mvp) ships the source +
#     GitHub release archive only; crates.io publication is gated
#     on the manual `cargo publish` invocation after the package
#     metadata (repository URL, README, exclude list) lands.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release from (e.g. v0.1.0-mvp)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: ci-mirror + dry-run + github-release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write  # for softprops/action-gh-release@v2

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Restore apt archives
        # R2189 (open-debt item 529) — the THIRD thing the raw `apt-get` block
        # was not getting. `apt-install.sh` points apt's `Dir::Cache::archives`
        # at `~/.cache/wz-apt`, so a cold run downloads the .debs and every run
        # after it finds them present; without a cache step that directory is
        # thrown away with the runner and the download is paid every release.
        #
        # Keyed on THIS file's hash, not `ci.yml`'s: the key must change when
        # the package list changes, and the list that matters here is the one
        # below. The `ci.yml` jobs key on `ci.yml` for the same reason.
        #
        # RESTORE and SAVE split, and the save `if: always()`, on the reasoning
        # `ci.yml`'s first copy records: the run this helps is the one a slow
        # mirror reds, so a red run has to leave its partial archive behind or
        # the cache never warms.
        id: apt-archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wz-apt
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-

      - name: Install system dependencies
        # R2104 (open-debt item 522) — `libxml2-dev` and `pkg-config` are here
        # because this job runs `cargo test --workspace`, which compiles
        # `sce-forge-runtime`'s build script -> `sce-build` -> the `libxml`
        # crate, whose own build script probes pkg-config for `libxml-2.0` and
        # PANICS when it is absent. This step had neither for as long as it has
        # existed and passed anyway, because the ubuntu runner image carries
        # libxml2. `scripts/lib/apt_package_census.py`'s shortfall arm reads
        # this file too and reds if either goes missing again.
        #
        # R2189 (open-debt item 529) — THROUGH THE CEILING, like every step in
        # `ci.yml`. This step called `apt-get` raw for as long as it has
        # existed, so nothing R311y865..y882 built reached the release path: no
        # wall-clock ceiling (a mirror outage spends the whole job's budget and
        # reports it as the job being slow), no bounded `update`, and no
        # cacheable archive directory. Layer C0g asserted "0 calling apt-get
        # directly" and was telling the truth about `ci.yml`, which was the only
        # file its scan named; that scan is derived over every workflow now, so
        # this line cannot come back unremarked.
        #
        # No `sudo` here on purpose: the script composes
        # `sudo timeout ... apt-get` itself, because `timeout` must be the CHILD
        # of `sudo` rather than its parent for the signal to land on apt.
        run: |
          bash scripts/lib/apt-install.sh \
            cmake libclang-dev libxml2-dev pkg-config clang perl \
            python3-yaml protobuf-compiler

      - name: Save apt archives
        # `WZ_APT_CACHE_DIRTY` is set by `apt-install.sh` when it actually
        # downloaded something, so a warm run does not re-save an unchanged
        # directory under a new key.
        if: always() && env.WZ_APT_CACHE_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wz-apt
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            vendor/sce -> target

      - name: Install mnemosyne-cli (pinned)
        # Delegated to the shared scripts/install-mnemosyne-cli.sh (pinned
        # rev + --force), the single source of truth with ci.yml.
        # R311y417 — the `|| { ::warning; MNEMOSYNE_SKIP=1 }` fallback is GONE,
        # and so is the guard it fed on Layer A below. The argument is already
        # written in this file, at the Layer A3 step: "this job PROVISIONS
        # mnemosyne-cli, so its absence is a provisioning regression, not an
        # honest skip". R311y300 applied that to A3 and left Layer A — the
        # SSOT gate itself — still able to skip into a green release. Same
        # hollow-gate class R311y416 closed for actionlint in ci.yml.
        run: bash scripts/install-mnemosyne-cli.sh

      - name: Build sce-codegen (vendor/sce)
        run: bash scripts/build-sce.sh

      # R408 (2026-06-04) retired the GENERATED.md render + `generate-docs`
      # cascade upstream (mnemosyne R395-R400); the former regenerate step
      # now hard-errors and is removed. validate-workspace (Layer A) is
      # store-direct and needs no pre-cascade. Mirrors ci.yml.

      # CI mirror — every Layer must pass before the release artefacts
      # land. Delegating to scripts/run-ci.sh keeps the two workflows
      # in lockstep.
      - name: Layer A — Mnemosyne workspace validate
        run: bash scripts/run-ci.sh --layer A

      - name: Layer A2 — Envelope mid value= audit
        run: bash scripts/run-ci.sh --layer A2

      - name: Layer A3 — catalog status truthfulness
        # R311y299 — A3 ran here UNGUARDED and un-required: on a failed
        # mnemosyne-cli install it printed "SKIP ... OK" and exited 0, which
        # reads as a PASS. This workflow has no Layer A4 step at all, so
        # nothing else here reads the inventory and the forfeit was total.
        #
        # R311y300 — deliberately NO `if: env.MNEMOSYNE_SKIP != '1'` guard,
        # unlike Layer A above. R311y299 first added one, which was the same
        # forfeit relabelled: MNEMOSYNE_SKIP is set ONLY by the install
        # fallback (:88-90), so the guard and WZ_A3_REQUIRE are DISJOINT --
        # install fails => step skipped => the require-mode never evaluates =>
        # green release with A3 never run. This job PROVISIONS mnemosyne-cli,
        # so its absence is a provisioning regression, not an honest skip, and
        # a release must not ship with the only inventory<->source gate
        # disarmed. Matches ci.yml, which had it right.
        env:
          WZ_A3_REQUIRE: "1"
        run: bash scripts/run-ci.sh --layer A3

      - name: Layer B — verify-codegen.sh per codec
        run: bash scripts/run-ci.sh --layer B

      - name: Layer C1 — cargo test --workspace
        run: bash scripts/run-ci.sh --layer C1

      - name: Layer C2 — cargo clippy --deny warnings
        run: bash scripts/run-ci.sh --layer C2

      - name: Layer D — deploy/*.yaml schema validate
        run: bash scripts/run-ci.sh --layer D

      - name: Build zenoh-pico CLI binaries (Layer E dep)
        run: bash scripts/build-zenoh-pico-cli.sh

      - name: Build wz-ap-demo binary (Layer E dep)
        run: (cd crates && cargo build -p wz-ap-demo)

      - name: Build wz-e2e-pubsub binary (Layer E2 dep)
        run: (cd crates && cargo build -p wz-e2e-pubsub)

      - name: Build wz-e2e-queryable binary (Layer E2 dep)
        run: (cd crates && cargo build -p wz-e2e-queryable)

      - name: Build wz-e2e-liveliness binary (Layer E2 dep)
        run: (cd crates && cargo build -p wz-e2e-liveliness)

      - name: Build wz-e2e-liveliness-token binary (Layer E2 dep)
        run: (cd crates && cargo build -p wz-e2e-liveliness-token)

      - name: Layer E — wz-ap-demo round-trip vs zenoh-pico z_put
        run: bash scripts/run-ci.sh --layer E

      - name: Layer E2 — facade-subset e2e vs zenoh-pico
        run: bash scripts/run-ci.sh --layer E2

      # Cargo packaging dry-run — surfaces .crate tarball errors
      # (size > 10 MiB, missing required metadata, files outside
      # allowed set) for each publishable crate. The build.rs of
      # wz-codecs invokes SCE codegen which may fail in the
      # packaging sandbox; a non-zero exit here is informational
      # for the operator (logged + continued via `|| true`) so the
      # release artefacts still land. A future round closes the
      # gap by either pre-generating wz-codecs out/ or shipping the
      # SCE binary path through [package.exclude] tuning.
      - name: cargo publish --dry-run (zenoh-pico-sys)
        run: (cd crates && cargo publish --dry-run -p zenoh-pico-sys) || echo "::warning::zenoh-pico-sys dry-run non-zero — investigate before manual publish"

      - name: cargo publish --dry-run (wz-codecs)
        run: (cd crates && cargo publish --dry-run -p wz-codecs) || echo "::warning::wz-codecs dry-run non-zero — likely SCE binary path or size limit; investigate before manual publish"

      - name: cargo publish --dry-run (wz-runtime-tokio)
        run: (cd crates && cargo publish --dry-run -p wz-runtime-tokio) || echo "::warning::wz-runtime-tokio dry-run non-zero — investigate before manual publish"

      # wz-runtime-coop is not yet a workspace member (Phase W). The
      # crates/wz-runtime-coop directory ships only include/ + tests/
      # ahead of the runtime crate landing; no Cargo.toml exists, so
      # there is no dry-run target here. Reintroduce once Phase W
      # crate scaffolding lands.

      - name: cargo publish --dry-run (wz-ap-demo)
        run: (cd crates && cargo publish --dry-run -p wz-ap-demo) || echo "::warning::wz-ap-demo dry-run non-zero — investigate before manual publish"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-mvp') || contains(github.event.inputs.tag || github.ref_name, '-rc') || contains(github.event.inputs.tag || github.ref_name, '-beta') || contains(github.event.inputs.tag || github.ref_name, '-alpha') }}
