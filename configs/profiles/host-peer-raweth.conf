# wz-preset: 1
# catalog: 2
# base: zenoh-pico
#
# host-peer-raweth -- a peer of zenoh-pico's defaults that can also join a group over raw Ethernet
# (`reth/<mac>#iface=<name>`), zenoh-pico's raweth transport. It is the build the facility oracle
# (scripts/lib/facility_trace.py, docs/target-build-contract.md T9) runs a raw Ethernet group in:
# no other registered build has the transport, so without it the requirement a raw link states
# (`raw-ethernet` and `interface-list`, both in `requires`) would be held by reading alone.
#
# The role is the peer, which a group member is. Two capabilities differ from zenoh-pico's defaults:
# the transport itself, which selects the multicast transport it runs on, and `device-requires`,
# whose `zext_config_device_requires` is the door the oracle holds the run to (it implies the
# unstable API).
#
# The raw Ethernet transport runs on the tokio engine alone until the cooperative engine has a link
# driver for it (docs/c-abi-engine-and-memory.md, P3), so the build names that engine.
CONFIG_WZ_ROLE_PEER=y
CONFIG_WZ_ENGINE_TOKIO=y
CONFIG_WZ_CAP_RAWETH_TRANSPORT=y
CONFIG_WZ_CAP_UNSTABLE_API=y
CONFIG_WZ_CAP_DEVICE_REQUIRES=y
#
# The send's behaviours and the query plane's held replies the zenoh-pico defconfig turns off, kept
# as this build had them: the tokio engine's sessions hold them whatever is named, and the profile
# says so.
CONFIG_WZ_CAP_TX_PROBE=y
CONFIG_WZ_CAP_TX_EXPIRY_RUN=y
CONFIG_WZ_CAP_TX_FRAGMENT_CREDIT=y
CONFIG_WZ_CAP_TX_HELD_WAIT=y
CONFIG_WZ_CAP_TX_STREAM_OWED=y
#
# The numbered key a config states its session's limits by, kept as this build had it.
CONFIG_WZ_CAP_CONFIG_LIMITS=y
# The group endpoint's keys the zenoh-pico defconfig turns off, kept as this build had them.
CONFIG_WZ_CAP_MULTICAST_LOCATOR_KEYS=y
CONFIG_WZ_CAP_QUERY_REPLIES_WITH_FINAL=y
# The peer's behaviours the zenoh-pico defconfig turns off, which the tokio engine's sessions hold
# whatever is named, as they hold the send's.
CONFIG_WZ_CAP_UDP_LISTEN=y
CONFIG_WZ_CAP_INTEREST_ANSWER=y
