# wz-preset: 1
# catalog: 2
# base: zenoh-pico
#
# host-peer-raweth -- a peer of zenoh-pico's defaults that can also join a group over raw Ethernet
# (`reth/<mac>#iface=<name>`), zenoh-pico's raweth transport. It is the build the facility oracle
# (scripts/lib/facility_trace.py, docs/target-build-contract.md T9) runs a raw Ethernet group in:
# no other registered build has the transport, so without it the requirement a raw link states
# (`raw-ethernet` and `interface-list`, both in `requires`) would be held by reading alone.
#
# The role is the peer, which a group member is. Two capabilities differ from zenoh-pico's defaults:
# the transport itself, which selects the multicast transport it runs on, and the unstable API,
# whose `wz_ext_config_device_requires` is the door the oracle holds the run to.
CONFIG_WZ_ROLE_PEER=y
CONFIG_WZ_CAP_RAWETH_TRANSPORT=y
CONFIG_WZ_CAP_UNSTABLE_API=y
