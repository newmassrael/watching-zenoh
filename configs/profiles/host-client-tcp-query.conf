# wz-preset: 1
# catalog: 1
# base: zenoh-c
#
# host-client-tcp-query -- a client that opens a session to a router over TCP and issues
# queries (GET), and does nothing else. It is the one feature set the host comparison of
# 2026-10-22 builds in all four implementations (wz's C ABI, zenoh-pico, zenoh-c, zenoh Rust),
# so that a size, resident-memory or latency figure is a figure for the same job.
#
# The lines below are the wz capabilities that differ from the defaults (every capability is
# on by default except admin space, local subscriber and local queryable). They name symbols of
# deploy/Kconfig.capabilities, catalogue 1 of deploy/wz-config.toml.
CONFIG_WZ_CAP_LINK_UDP=n
CONFIG_WZ_CAP_TIMESTAMPING=n
CONFIG_WZ_CAP_SCOUT=n
CONFIG_WZ_CAP_PEER=n
CONFIG_WZ_CAP_QUERYABLE=n
CONFIG_WZ_CAP_LIVELINESS=n
CONFIG_WZ_CAP_LIVELINESS_GET=n
CONFIG_WZ_CAP_ADVANCED=n
CONFIG_WZ_CAP_GROUP=n
CONFIG_WZ_CAP_GOSSIP=n
CONFIG_WZ_CAP_UNSTABLE_API=n
CONFIG_WZ_CAP_CONNECTIVITY=n
CONFIG_WZ_CAP_TRANSPORT_TLS=n
CONFIG_WZ_CAP_TRANSPORT_QUIC=n
CONFIG_WZ_CAP_TRANSPORT_QUIC_DATAGRAM=n
CONFIG_WZ_CAP_TRANSPORT_WS=n
CONFIG_WZ_CAP_TRANSPORT_UNIXSOCK_STREAM=n
CONFIG_WZ_CAP_TRANSPORT_MULTILINK=n
CONFIG_WZ_CAP_AUTH_PUBKEY=n
CONFIG_WZ_CAP_MULTICAST_TRANSPORT=n
CONFIG_WZ_CAP_E2E_SENDER=n
CONFIG_WZ_CAP_TRANSPORT_COMPRESSION=n
CONFIG_WZ_CAP_AUTH_USRPWD=n
CONFIG_WZ_CAP_INTERCEPTORS=n
#
# Not symbols yet. These are the same selection in the other implementations' own terms, and
# what the comparison was built with; they are comments because nothing reads them.
#
#   wz-capi-c        cargo build --release -p wz-capi-c --no-default-features
#                      --features query,zenoh-c-no-unstable-api
#                    (zenoh-c-no-unstable-api and, absent here, zenoh-c-shared-memory choose the
#                    struct layout of the header the client is compiled against; this one matches a
#                    stock zenoh-c cmake build.) Two things stay on and cannot be switched off yet:
#                    transport_compression and auth_usrpwd (upstream_switch_map.py: `always`).
#                    wz-capture is linked through e2e_sender.rs whatever is selected.
#   zenoh-c          cmake -DCMAKE_BUILD_TYPE=Release
#                      "-DZENOHC_CARGO_FLAGS=--no-default-features;--features=transport_tcp"
#   zenoh (Rust)     cargo build --release -p zenoh-examples --example <client>
#                      --no-default-features --features zenoh/transport_tcp
#   zenoh-pico       cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF
#                      -DZ_FEATURE_PUBLICATION=0 -DZ_FEATURE_SUBSCRIPTION=0 -DZ_FEATURE_QUERYABLE=0
#                      -DZ_FEATURE_LIVELINESS=0 -DZ_FEATURE_INTEREST=0 -DZ_FEATURE_MATCHING=0
#                      -DZ_FEATURE_SCOUTING=0 -DZ_FEATURE_LINK_UDP_MULTICAST=0
#                      -DZ_FEATURE_LINK_UDP_UNICAST=0 -DZ_FEATURE_MULTICAST_TRANSPORT=0
#                      -DZ_FEATURE_UNICAST_PEER=0
#   compiler         every Rust build: lto=fat, codegen-units=1, opt-level=3, panic=abort
#                    (zenoh-c's own release profile, set through CARGO_PROFILE_RELEASE_*)
#
# Measured with it (pc3, loopback TCP, one zenohd 1.10.1, 2000 sequential GETs of a 1 KiB reply,
# five runs): pico 79.6 us / 2.2 MB resident / 434 KB stripped; wz 86.7 us / 5.0 MB / 2.80 MB;
# zenoh Rust 94.2 us / 8.1 MB / 4.99 MB; zenoh-c 95.7 us / 10.0 MB / 8.61 MB. The figures belong
# to the run, not to this file.
