# wz-preset: 1
# catalog: 2
# base: zenoh-pico
#
# host-peer-ext -- the pico C ABI library a host program links when it needs wz's extension doors
# as well as zenoh-pico's API: the build the Windows release package carries
# (scripts/lib/pico_windows_package.py), and the same build on any other host.
#
# Its sessions run on the cooperative engine (docs/c-abi-engine-and-memory.md, P1): the one engine
# of the C ABI presets, stepped by the program's own calls in zenoh-pico's single-threaded arm and
# by the read task it starts in the multi-threaded arm, as zenoh-pico's sessions are. The two
# switches of the tokio engine's drive in the pico base (its drive thread and its busy read) are
# that engine's and leave the build with it.
CONFIG_WZ_ENGINE_COOP=y
#
# Over zenoh-pico's defconfig, the peer role and three switches it turns off (the advanced plane,
# the unstable API and connectivity events) are turned on, as wz-capi-pico's default build has
# them, so the part of this library that is zenoh-pico's API is the part the C ABI gates hold and
# the header a program compiles against differs from theirs only by the capabilities below.
# Gossip is not: the pico ABI never starts it (its sessions are opened without a gossip plane), and
# it is a capability of the tokio engine alone until the cooperative engine carries it as one a
# program asks for.
CONFIG_WZ_ROLE_PEER=y
CONFIG_WZ_CAP_ADVANCED=y
CONFIG_WZ_CAP_UNSTABLE_API=y
CONFIG_WZ_CAP_CONNECTIVITY=y
#
# wz's own doors (wz_ext_*, crates/wz-capi-core/include/wz_ext.h), each off in the zenoh-pico
# defconfig this preset is merged onto:
#   app-transport     a network stack the program supplies in place of the system's sockets
#   config-policy     the policies and the profile of a config's sessions stated from code
#                     (wz_ext_config_policy, wz_ext_config_profile), off in the zenoh-pico base
#   conformance-digest
#                     the digest of the build's configuration (wz_ext_conformance_digest), which
#                     the package's build statement states, off in the zenoh-pico base
#   config-document   the zenoh JSON5 document handed to a config, whose wz member chooses the
#                     session's profile, policies and limits when it opens: one library, the
#                     policies picked at run time
#   e2e-sender        end-to-end protection of a message on the sending side
#   e2e-receiver      the receiving judge of protected frames
#   e2e-sender-demux  that judge kept one per sender, keyed by the frame's sender identity
#   e2e-supervision   supervision of periodic streams on reception (a deadline per stream)
#   instance-key      the instance of a message read from fields of its payload
#   message-catalog   a deployment's messages declared once as data and read at run time
#   message-payload   a catalog message's payload set and read by field path, its .proto read
#                     at run time
#   replay-cache      what each publisher last sent, replayed to a subscriber that arrives later
#   shared-key-ids    key ids every node of a deployment shares, used with no declaration first
#
# Not here: `supervision`, the checkpoint supervisor a node feeds a hardware watchdog from, which a
# host program has no use for; `segment-sender`, the sending side of a segmented message, which a
# host that only receives segmented answers does not need (the replay cache joins them itself).
CONFIG_WZ_CAP_APP_TRANSPORT=y
CONFIG_WZ_CAP_CONFIG_POLICY=y
CONFIG_WZ_CAP_CONFORMANCE_DIGEST=y
CONFIG_WZ_CAP_CONFIG_DOCUMENT=y
CONFIG_WZ_CAP_E2E_SENDER=y
CONFIG_WZ_CAP_E2E_RECEIVER=y
CONFIG_WZ_CAP_E2E_SENDER_DEMUX=y
CONFIG_WZ_CAP_E2E_SUPERVISION=y
CONFIG_WZ_CAP_INSTANCE_KEY=y
CONFIG_WZ_CAP_MESSAGE_CATALOG=y
CONFIG_WZ_CAP_MESSAGE_PAYLOAD=y
CONFIG_WZ_CAP_REPLAY_CACHE=y
CONFIG_WZ_CAP_SHARED_KEY_IDS=y
