# wz-preset: 1
# catalog: 2
# base: zenoh-pico
#
# host-peer-ext -- the pico C ABI library a host program links when it needs wz's extension doors
# as well as zenoh-pico's API: the build the Windows release package carries
# (scripts/lib/pico_windows_package.py), and the same build on any other host.
#
# Its sessions run on the cooperative engine (docs/c-abi-engine-and-memory.md, P1): the one engine
# of the C ABI presets, stepped by the program's own calls in zenoh-pico's single-threaded arm and
# by the read task it starts in the multi-threaded arm, as zenoh-pico's sessions are. The two
# switches of the tokio engine's drive in the pico base (its drive thread and its busy read) are
# that engine's and leave the build with it.
CONFIG_WZ_ENGINE_COOP=y
#
# Over zenoh-pico's defconfig, the peer role and three switches it turns off (the advanced plane,
# the unstable API and connectivity events) are turned on, as wz-capi-pico's default build has
# them, so the part of this library that is zenoh-pico's API is the part the C ABI gates hold and
# the header a program compiles against differs from theirs only by the capabilities below.
# Gossip is not: the pico ABI never starts it (its sessions are opened without a gossip plane), and
# it is a capability of the tokio engine alone until the cooperative engine carries it as one a
# program asks for.
CONFIG_WZ_ROLE_PEER=y
CONFIG_WZ_CAP_ADVANCED=y
CONFIG_WZ_CAP_UNSTABLE_API=y
CONFIG_WZ_CAP_CONNECTIVITY=y
#
# The advanced plane's behaviours zenoh-pico's plane does not have are left off, as the zenoh-pico
# defconfig leaves them: the subscriber's sweep of its sources (advanced-source-retention), so a
# source stays until its subscriber goes, and the node clock the publisher stamps from
# (advanced-node-clock), so a sample takes the system clock's time, as zenoh-pico's do.
#
# The sequence-number widths a session may select after the build leave out `bits-64`: zenoh
# refuses a width above 32 bits in its configuration and zenoh-pico has no setting for another,
# and a unicast peer that advertises 64 bits is answered with the smaller of the two widths. Without
# it the widest ring the library can negotiate fits 32 bits, so the library holds every sequence
# number in a 32-bit word, which a 32-bit target steps without 64-bit arithmetic.
CONFIG_WZ_POLICY_SN_RESOLUTION_ALLOWS_BITS_64=n
#
# The send's behaviours zenoh-pico's transport does not have, which the zenoh-pico defconfig turns
# off and this library keeps as it had them: the send that may not wait (tx-probe), the run of
# expiries that closes a kept session (tx-expiry-run), the fragment credit and the stop fragment of
# a cut chain (tx-fragment-credit), the wait for room of a droppable message behind another send
# (tx-held-wait), and the stream link's send that keeps what its stream did not take
# (tx-stream-owed). They are no doors, so host-peer turns them on too.
# a cut chain (tx-fragment-credit), and the wait for room of a droppable message behind another
# send (tx-held-wait); and the query plane's replies held to leave with their Final
# (query-replies-with-final). They are no doors, so host-peer turns them on too.
CONFIG_WZ_CAP_TX_PROBE=y
CONFIG_WZ_CAP_TX_EXPIRY_RUN=y
CONFIG_WZ_CAP_TX_FRAGMENT_CREDIT=y
CONFIG_WZ_CAP_TX_HELD_WAIT=y
CONFIG_WZ_CAP_TX_STREAM_OWED=y
#
# The numbered key a config states its session's limits by (config-limits), which the zenoh-pico
# defconfig turns off and this library keeps: a host program that holds more than zenoh-pico's
# examples declare states its counts and opens each session at them. A key, not a door, so
# host-peer turns it on too.
CONFIG_WZ_CAP_CONFIG_LIMITS=y
# The group endpoint's keys zenoh-pico's multicast link does not read (`#ttl=`, `#bind=`,
# `#dscp=`, multicast-locator-keys), which the zenoh-pico defconfig turns off and this library keeps
# as it had them. A behaviour of a group's sockets and no door, so host-peer turns it on too.
CONFIG_WZ_CAP_MULTICAST_LOCATOR_KEYS=y
CONFIG_WZ_CAP_QUERY_REPLIES_WITH_FINAL=y
CONFIG_WZ_CAP_ADVANCED_SOURCE_RETENTION=y
CONFIG_WZ_CAP_ADVANCED_NODE_CLOCK=y
# The peer's behaviours zenoh-pico's peer does not have, which the zenoh-pico defconfig turns off
# and this library keeps as it had them: the unicast `udp/` listener (udp-listen), the answer to a
# peer's Interest on a unicast face (interest-answer), one link to a node that dials and is dialled
# (link-admission) and the stateless acceptor's sealed InitAck cookie (accept-cookie). They are no
# doors, so host-peer turns them on too.
CONFIG_WZ_CAP_UDP_LISTEN=y
CONFIG_WZ_CAP_INTEREST_ANSWER=y
CONFIG_WZ_CAP_LINK_ADMISSION=y
CONFIG_WZ_CAP_ACCEPT_COOKIE=y
#
# wz's own doors (zext_*, crates/wz-capi-core/include/zext.h), each off in the zenoh-pico
# defconfig this preset is merged onto:
#   app-transport     a network stack the program supplies in place of the system's sockets
#   config-policy     the policies and the profile of a config's sessions stated from code
#                     (zext_config_policy, zext_config_profile), off in the zenoh-pico base
#   conformance-digest
#                     the digest of the build's configuration (zext_conformance_digest), which
#                     the package's build statement states, off in the zenoh-pico base
#   config-document   the zenoh JSON5 document handed to a config, whose zext member chooses the
#                     session's profile, policies and limits when it opens: one library, the
#                     policies picked at run time
#   device-requires   what an open of a config would ask of the operating system
#                     (zext_config_device_requires), off in the zenoh-pico base
#   e2e-sender        end-to-end protection of a message on the sending side
#   e2e-receiver      the receiving judge of protected frames
#   e2e-sender-demux  that judge kept one per sender, keyed by the frame's sender identity
#   e2e-supervision   supervision of periodic streams on reception (a deadline per stream)
#   instance-key      the instance of a message read from fields of its payload
#   message-catalog   a deployment's messages declared once as data and read at run time
#   message-payload   a catalog message's payload set and read by field path, its .proto read
#                     at run time
#   replay-cache      what each publisher last sent, replayed to a subscriber that arrives later
#   shared-key-ids    key ids every node of a deployment shares, used with no declaration first
#   time-base         a time the program supplies in place of the system's clock, which the timers
#                     of a session opened from a config naming it run on (zext_time_base_*,
#                     zext_config_time_base): a program that runs its sessions in a simulation
#
# Not here: `supervision`, the checkpoint supervisor a node feeds a hardware watchdog from, which a
# host program has no use for; `segment-sender`, the sending side of a segmented message, which a
# host that only receives segmented answers does not need (the replay cache joins them itself).
CONFIG_WZ_CAP_APP_TRANSPORT=y
CONFIG_WZ_CAP_CONFIG_POLICY=y
CONFIG_WZ_CAP_CONFORMANCE_DIGEST=y
CONFIG_WZ_CAP_CONFIG_DOCUMENT=y
CONFIG_WZ_CAP_DEVICE_REQUIRES=y
CONFIG_WZ_CAP_E2E_SENDER=y
CONFIG_WZ_CAP_E2E_RECEIVER=y
CONFIG_WZ_CAP_E2E_SENDER_DEMUX=y
CONFIG_WZ_CAP_E2E_SUPERVISION=y
CONFIG_WZ_CAP_INSTANCE_KEY=y
CONFIG_WZ_CAP_MESSAGE_CATALOG=y
CONFIG_WZ_CAP_MESSAGE_PAYLOAD=y
CONFIG_WZ_CAP_REPLAY_CACHE=y
CONFIG_WZ_CAP_SHARED_KEY_IDS=y
CONFIG_WZ_CAP_TIME_BASE=y
