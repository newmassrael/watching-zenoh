# wz-preset: 1
# catalog: 2
# base: zenoh-pico
#
# host-peer -- host-peer-ext without wz's own doors: the zenoh-pico features of the library the
# Windows release package carries, and nothing zenoh-pico has no switch of. It is what that library
# is held to zenoh-pico by, like for like (docs/upstream-parity.md D9,
# scripts/lib/pico_windows_package.py --size-features): the reference derived from its features is
# the release library's own, so its text and zenoh-pico's carry the same planes, and each door of
# host-peer-ext is held apart, over this library, by a row of its own. Every line here is
# host-peer-ext's: --size-features fails when host-peer-ext's features are not this profile's and
# exactly the doors that have rows.
#
# The cooperative engine, as host-peer-ext runs its sessions (docs/c-abi-engine-and-memory.md, P1).
CONFIG_WZ_ENGINE_COOP=y
#
# The peer role and the three switches zenoh-pico's defconfig turns off (the advanced plane, the
# unstable API and connectivity events), as host-peer-ext turns them on: each is a switch of
# zenoh-pico's, which the reference turns on with it.
CONFIG_WZ_ROLE_PEER=y
CONFIG_WZ_CAP_ADVANCED=y
CONFIG_WZ_CAP_UNSTABLE_API=y
CONFIG_WZ_CAP_CONNECTIVITY=y
