# wz-preset: 1
# catalog: 2
# base: zenoh-pico
#
# host-peer -- host-peer-ext without wz's own doors: the zenoh-pico features of the library the
# Windows release package carries, and no door zenoh-pico has no switch of. It is what that library
# is held to zenoh-pico by, like for like (docs/upstream-parity.md D9,
# scripts/lib/pico_windows_package.py --size-features): the reference derived from its features is
# the release library's own, so its text and zenoh-pico's carry the same planes, and each door of
# host-peer-ext is held apart, over this library, by a row of its own. Every line here is
# host-peer-ext's: --size-features fails when host-peer-ext's features are not this profile's and
# exactly the doors that have rows.
#
# The cooperative engine, as host-peer-ext runs its sessions (docs/c-abi-engine-and-memory.md, P1).
CONFIG_WZ_ENGINE_COOP=y
#
# The peer role and the three switches zenoh-pico's defconfig turns off (the advanced plane, the
# unstable API and connectivity events), as host-peer-ext turns them on: each is a switch of
# zenoh-pico's, which the reference turns on with it.
CONFIG_WZ_ROLE_PEER=y
CONFIG_WZ_CAP_ADVANCED=y
CONFIG_WZ_CAP_UNSTABLE_API=y
CONFIG_WZ_CAP_CONNECTIVITY=y
#
# The send's behaviours, and the query plane's held replies, that host-peer-ext keeps over the
# zenoh-pico defconfig, which no door carries: each is a behaviour of every session, not a plane a
# row holds apart, so the two profiles hold the same ones.
# The advanced plane's behaviours zenoh-pico's plane does not have are left off, as the zenoh-pico
# defconfig leaves them: the subscriber's sweep of its sources (advanced-source-retention) and the
# node clock the publisher stamps from (advanced-node-clock). Each is a part of the plane this
# library is held to zenoh-pico's by, and host-peer-ext leaves them off too.
#
# The send's behaviours host-peer-ext keeps over the zenoh-pico defconfig, which no door carries:
# each is a behaviour of every session, not a plane a row holds apart, so the two profiles hold the
# same ones.
CONFIG_WZ_CAP_TX_PROBE=y
CONFIG_WZ_CAP_TX_EXPIRY_RUN=y
CONFIG_WZ_CAP_TX_FRAGMENT_CREDIT=y
CONFIG_WZ_CAP_TX_HELD_WAIT=y
CONFIG_WZ_CAP_TX_STREAM_OWED=y
# The dial that does not hold the session (dial-in-flight), kept as host-peer-ext keeps it: a
# behaviour of every dial, not a door.
CONFIG_WZ_CAP_DIAL_IN_FLIGHT=y
# The reader of the address a dial's endpoint writes (dial-address-reader), kept as host-peer-ext
# keeps it: a behaviour of every dial, not a door.
CONFIG_WZ_CAP_DIAL_ADDRESS_READER=y
#
# The numbered key a config states its session's limits by, which host-peer-ext keeps over the
# zenoh-pico defconfig: a key every session's open reads, not a door a row holds apart.
CONFIG_WZ_CAP_CONFIG_LIMITS=y
# The group endpoint's keys zenoh-pico's multicast link does not read, kept as host-peer-ext keeps
# them: a behaviour of a group's sockets, not a door.
CONFIG_WZ_CAP_MULTICAST_LOCATOR_KEYS=y
CONFIG_WZ_CAP_QUERY_REPLIES_WITH_FINAL=y
CONFIG_WZ_CAP_ADVANCED_SOURCE_RETENTION=y
CONFIG_WZ_CAP_ADVANCED_NODE_CLOCK=y
# The peer's behaviours host-peer-ext keeps over the zenoh-pico defconfig, as it keeps the send's.
CONFIG_WZ_CAP_UDP_LISTEN=y
CONFIG_WZ_CAP_INTEREST_ANSWER=y
CONFIG_WZ_CAP_LINK_ADMISSION=y
CONFIG_WZ_CAP_ACCEPT_COOKIE=y
CONFIG_WZ_CAP_FACE_SEND_PLACES=y
