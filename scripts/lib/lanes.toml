# The lane declaration of RFC 0001 (docs/rfc/0001-a-lane-lands-alone-and-a-verdict-is-keyed-by-what-it-read.md):
# one entry per dispatch line `run_layer <id> <fn>` of scripts/run-ci.sh, in its order. The schema and
# its reader are scripts/lib/lane_decl.py; scripts/lib/lanes_gate.py holds this file to the dispatch
# table (UNDECLARED, ORPHAN, DUPLICATE, FIELD); scripts/lib/lane_digest.py puts each entry into its
# lane's key D(L, t).
#
# class: D, the verdict is a function of the key; E, also of a machine environment the key does not
# hold yet (an oracle, a tool, an SDK the machine provides; `reason` says which); S, a statistic
# (`nondet` says of what), never reused and not gating a landing (RFC 0001 section 5.5). A lane whose
# hosted job provisions anything, or that asks the machine for a program or a package, is E: the gate
# refuses D for it. An E lane becomes D when the image that carries its environment is in the key.
#
# decl: tracked files the lane reads that neither the packages its cargo calls build nor the scripts
# it runs name; lane_input_closure.py is the traced audit that finds one missing. packages and legs:
# what the lane builds when its commands do not say (a lane with neither is opaque when they do not).

schema = "wz-lanes/1"

