schema = 1

# R311y752 — what this repository needs from a build machine, and nothing about
# WHICH machine. Addresses live in bx's registry (`bx-paths.sh registry`),
# outside this tree, so a public repo never carries them (remote-build SKILL
# rule 11).

# Tracked files only, never untracked ones. This repo's history has already paid
# for an accidental disclosure once, and anything wider would send whatever is
# sitting untracked in the working tree to another host.
#
# AND THE SUBMODULES, at the commits this tree records: the workspace depends on
# `vendor/sce` through path dependencies (`sce-forge-runtime`, `sce-rust-runtime`,
# `sce-portable-bytes`), so a far side without it cannot build. This said
# `tracked` until 2026-10-17, which bx then ignored and sent every submodule
# anyway; bx now does what the value says, so the value has to say this.
send = "tracked+submodules"

# `crates/target` is a SYMLINK into ~/.buildcache (SKILL rule 1) and would
# arrive as a broken link; `git ls-files` omits it and `/target`, and that is
# what keeps both home. An `exclude` line sat here until 2026-10-17 "to survive
# a future switch to `send = "all"`": bx never read it, and bx.toml has no
# `all` to switch to and refuses a key bx does not define.

needs = ["cargo", "python3", "git"]

# WHERE THIS TREE'S CARGO WORKSPACE IS, because it is not the repository root and
# cannot be derived. Read by bx when a cargo command is issued from a directory
# with no `Cargo.toml` at or above it: without this the command reaches cargo,
# which exits 101 saying it could not find a manifest — the same 101 a panicking
# test binary returns, so "the command never started" and "the code is red" are
# one number. Measured: five calls in one session were issued from the root by
# accident and one was nearly recorded as a probe's own verdict.
#
# It has to be DECLARED rather than found, because deriving it lands on a tie:
# eight tracked manifests here declare `[workspace]`, and `crates/` and `xtask/`
# both sit one level down. Which one a bare `cargo test` meant is this tree's
# knowledge, not a build wrapper's.
workspace_dir = "crates"

# MEASURED by RUNNING the full sweep there once (R311y752/y753, sentinel
# `REMOTE_BUILD_EXIT=1`), which corrected two guesses this file made before the
# run:
#
#   * Layer G does NOT skip -- it FAILS. G.1-G.5 are pure Rust and pass; G.6
#     dies in `lwip-sys`'s build script with no cross C compiler
#     (`CC_thumbv7em_none_eabihf = None`). "Absent tool" and "absent tool that
#     stops a lane" are different states and this file said the wrong one.
#   * The whole E* interop family SKIPS -- E, E2, E5..E15, Epico, C1bp -- for
#     one reason: the zenoh-pico CLI is not BUILT there. That is the pico/AP
#     evidence, so a sweep on this host says nothing about it.
#
# Also skipped there: Layers A / A3 / A4 / A5 and C0's resolution half
# (mnemosyne-cli), 0.2 shellcheck + actionlint, C1bs (CAP_NET_RAW), C1cd / C1ce
# (zenoh-c oracles), C2 deploy, Q / Qz (arm gcc + qemu), Z (zenohd), and the
# footprint feature-subset deltas.
#
# So: STRONGER for the x86 crate lanes and the lints, and NOT a substitute for
# the cross-compile or interop ones. A green here is not a green.
#
# Two of these are BUILD steps rather than apt packages, which is why they are
# named in the comment as well: `bash scripts/build-zenoh-pico-cli.sh` and
# `bash scripts/build-zenohd.sh`. `sce-codegen` additionally fails there with
# `workspace root not detected`, which takes Layers B, B2 and C1 with it -- the
# two tests C1 names pass locally, so it is provisioning, not the tree.
#
# `strace` and `bubblewrap` are Layer C1st's facility oracle
# (scripts/lib/facility_trace.py): it reads each run through strace, and runs a
# raw Ethernet group in a user and network namespace of its own with CAP_NET_RAW
# over it. The package is not the whole requirement: on Ubuntu 24.04
# (`kernel.apparmor_restrict_unprivileged_userns=1`) bwrap holds no capability in
# its namespace unless an AppArmor profile allows it userns, which no package
# installs there. That half is machine state this file cannot name; the oracle's
# selftest refuses by name on a machine without it (`own_network_refusal`).
#
# `python3-venv` is the virtual environment the pinned Kconfig interpreter is installed into
# (`scripts/provision-kconfiglib.sh`, target/kconfig-venv), which Layers E, C1st and Qz provision
# for themselves. Ubuntu's python3 ships without `ensurepip`, so on a machine without the package
# the venv cannot be made and those lanes failed before they built anything (measured on a build
# machine on 2026-10-30: `ensurepip is not available`).
#
# NO TOP-LEVEL `packages` (2026-11-07). The lists above are what particular LANES refuse to run
# without, and a top-level `packages` is asked of EVERY run of the repository: from bx b2c5f8e on,
# that includes a run placed on the machine a session types on, so a python probe there was held
# to qemu and refused. One of the eight packages listed here before, `qemu-user`, is used by no
# file of the tree. Each requirement is now declared on the lane that has it, as a unit of
# `[checks.ci]` carries it (`scripts/lib/runci_plan.py`, `LANE_COMMANDS` and `LANE_PACKAGES`,
# each with the lane's own failure sentence): Layer 0 asks shellcheck and actionlint; C2m and G
# the ARM cross C compiler; Q and Qa that and qemu-system-arm; Qz and Qza qemu-system-arm; C1st
# strace, bwrap and python3-venv; E and Qz python3-venv. A lane run by itself outside the set
# (`bx -- bash scripts/run-ci.sh --layer Q`) asks nothing and refuses by name where the machine
# lacks its program; run it as `bx --checks ci -- python3 scripts/lib/runci_plan.py --only Q` to
# have it placed on a machine that has it.

min_ram_gb = 16
min_free_gb = 20

# THE ZEPHYR TOOLCHAIN the Qz and Qzk lanes build the kit's images with, asked of a machine only for a
# run whose command line names one of those lanes (`needed_by`): a run of any other layer goes to a
# machine that has no Zephyr. A lane that finds no workspace fails after the checkout is sent and
# the build has begun ("No such file"), and a machine lost its workspace once (2026-10-23) with
# nothing saying so; a candidate is now judged before anything is sent.
#
# Two tools, because a tool is one tree: the SDK, whose compiler prints the pinned SDK version, and
# the workspace's venv, whose `west` has to RUN (a venv whose interpreter is gone still has an
# executable `west`, so a file test would pass it). The SDK version is CI's pin
# (`ZEPHYR_SDK_VERSION`), read from the workflow that states it; the workflow states it in two
# jobs, and bx takes the value when every matching line gives the same one and refuses when they
# differ. The workspace's REVISION (`ZEPHYR_REF`) is not printed by any program, so it
# stays `scripts/provision-zephyr.sh --check`'s to verify; this declaration says "a toolchain of
# the pinned SDK is here and its venv runs", not "the workspace is at the pin".
#
# BX KEEPS BOTH (2026-11-07). `bx-provision <alias> --apply` builds each into the machine's tool
# store with the repository's own script, one part per tool (`--sdk`, `--workspace`), and links the
# whole entry at the directory the lanes look in (`prefix_link`). The script reads the pins from
# ci.yml, so both files are `install_inputs`: a moved pin or a changed step is a new store entry.
# The workspace's version is the zephyr revision `ZEPHYR_REF`, so a new pin is a new entry too. The
# SDK is fetched by zephyr's own `west sdk install`, which needs a west and a zephyr tree; its
# install makes those under `{scratch}`, not in the workspace's entry. `packages` is what the
# script runs: git and a venv for both, cmake for zephyr's SDK lookup and wget for the SDK's
# setup.sh, which fetches the toolchain (the SDK's own host tools carry dtc). A machine that gives
# each run a copy-on-write home keeps nothing a run installs, so a by-hand install made through a
# run is lost; the store is what lasts. Where `~/zephyrproject` is already a directory (the installs made by hand on
# 2026-11-03), provisioning does not replace it and those keep working as they are.
#
# A full `bash scripts/run-ci.sh` with no `--layer` runs Qz too and its command line names no lane,
# so bx cannot tell it from a run of another layer: place such a run with `--host` on a machine
# that has the toolchain.
[tools.zephyr-sdk]
version_file = ".github/workflows/ci.yml"
version_pattern = 'ZEPHYR_SDK_VERSION: *"?([0-9.]+)"?'
path = "~/zephyr-sdk-{version}/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc"
check = "Zephyr SDK {version}"
install = "ZEPHYR_SDK_DIR={prefix} ZEPHYR_HOME={scratch}/zephyrproject bash scripts/provision-zephyr.sh --sdk"
install_inputs = ["scripts/provision-zephyr.sh", ".github/workflows/ci.yml"]
prefix_link = "~/zephyr-sdk-{version}"
packages = ["cmake", "git", "python3-venv", "wget"]
needed_by = ["Qz"]

[tools.zephyr-venv]
version_file = ".github/workflows/ci.yml"
version_pattern = 'ZEPHYR_REF: *"?([0-9a-f]+)"?'
path = "~/zephyrproject/.venv/bin/west"
check = "West version"
install = "ZEPHYR_HOME={prefix} bash scripts/provision-zephyr.sh --workspace"
install_inputs = ["scripts/provision-zephyr.sh", ".github/workflows/ci.yml"]
prefix_link = "~/zephyrproject"
packages = ["git", "python3-venv"]
needed_by = ["Qz"]

# THE SHELLCHECK Layer 0 lints with, at the revision CI installs. `packages` above asks only whether
# some shellcheck runs, and a machine whose system copy is older answered yes: on 2026-11-06 a fleet
# run of Layer 0 landed on a machine whose fleet account found the apt 0.9.0 first, and redded on
# 5,557 SC2317 false positives the pinned 0.11.0 does not report (the same tree passes Layer 0 under
# 0.11.0). The version is CI's pin (`SHELLCHECK_VERSION`), read from the workflow that installs it,
# so there is one source; the install is the repository's own script, which reads that same pin and
# checks its digest, so the steps are not written twice. bx puts `~/.local/bin` first on a run's
# PATH, so the `shellcheck` Layer 0 calls by name is this one. A machine whose tool store lacks it is
# not a candidate for a run whose command line names Layer 0; `bx-provision <host> --apply` builds it
# there (in the run account, an owner's step). `needed_by` is the lane's own argument; a whole
# `run-ci.sh` with no `--layer` runs Layer 0 too and is not matched, the caveat the Zephyr tools
# above state.
#
# A `bx --checks ci` unit is steered by it too: since bx's fix of 2026-11-06 the fan-out matches
# `needed_by` against the unit's own argv (`python3 scripts/lib/runci_plan.py --layer 0`), and a
# machine whose store lacks the tool does not receive the unit (`bx --explain-candidates -- true`
# prints each machine's `lacks_tools=`). `needed_by` is a substring: a lane id that begins another
# (`E` of `E6i`) asks the same tool of both.
[tools.shellcheck]
version_file = ".github/workflows/ci.yml"
version_pattern = 'SHELLCHECK_VERSION: *"?([0-9.]+)"?'
path = "~/.local/bin/shellcheck"
install = "PREFIX={prefix} bash scripts/install-shellcheck.sh --force"
install_inputs = ["scripts/install-shellcheck.sh", ".github/workflows/ci.yml"]
prefix_file = "shellcheck"
needed_by = ["--layer 0"]

# THE PINNED LEDGER CLI the `file-round` action runs on a build machine. `mnemosyne.toml` pins one
# revision (`pin`) and a build that is not it hands over to `~/.local/mn/<pin>/bin/mnemosyne-cli`
# or refuses; a fleet machine has no such directory until the pin is installed there, and the
# integrator's derive step ran on one that had none (a rehearsal of the landing queue, 2026-11-08:
# `file-round` exited 1 on `pins Mnemosyne ee93427..., and this build is 183a17a5`). Declared here
# the pin is read from `mnemosyne.toml`, the one place it is written, a machine that lacks it
# does not receive a run that needs it, and `bx-provision <alias> --apply` builds it.
#
# `needed_by` is the action's own name, so no other run is steered by it; `check` is the first
# eight characters the CLI prints for its revision (`mnemosyne-cli 0.1.0 (ee934276)`).
[tools.mnemosyne-cli]
version_file    = "mnemosyne.toml"
version_pattern = 'pin = "([0-9a-f]{40})"'
path            = "~/.local/mn/{version}/bin/mnemosyne-cli"
check           = "{version:8}"
install         = "CARGO_HOME={scratch}/cargo cargo install --git https://github.com/newmassrael/mnemosyne --rev {version} --bin mnemosyne-cli --locked --root {prefix} mnemosyne-cli"
prefix_file     = "bin/mnemosyne-cli"
needed_by       = ["file-round"]

[commands]
# NOT `cargo test --workspace`: this tree refuses a whole-workspace build on
# purpose (`sce-rust-runtime` raises a `compile_error!`), so the workspace form
# fails for a reason that has nothing to do with the change under test.
# `run-ci.sh` is the repo's own full gate and the thing local pushes deliberately
# do not run.
verify = "bash scripts/run-ci.sh"

# Regenerating the committed `out/**` from the SCXML sources (`scripts/regen-codegen.sh`): it builds
# the pinned `sce-codegen` and then the xtask, which compiles `wz-session-core`, so it is a heavy
# build that used to be refused a build machine because it writes the tree. Declared as an action,
# it runs on a copy on the build machine and only the files it changed come back, judged here
# against `outputs` before any is written: `bx --action regen-codegen --host <alias>`.
#
# The inputs are not listed one by one: the run reads the sources, the generator crates and the
# crates they compile, the pinned SCE checkout and the submodules it needs, and a list written by
# hand is how an input is missed. It is run without `--isolate`, so the whole tracked copy is
# visible and the declaration is judged only by what the run writes.
#
# The action runs both stages of the script. Stage 2 (the switchboards) compiles `wz-session-core`,
# so in the middle of a pin move, before the callers follow the new codec tree, the action fails and
# applies nothing. Run stage 1 alone there, in the tree: `bash scripts/regen-codegen.sh --stage1`.
# It is one action and not two because a second one would read what the first writes, an order
# between actions bx cannot declare.
[actions.regen-codegen]
run = "bash scripts/regen-codegen.sh"
inputs = ["**"]
outputs = ["out/**"]

# THE LEDGER ROUND A COMMIT CARRIES (`scripts/file-round.sh`): a descriptor under
# `docs/rounds/pending/` is the round's prose and impact ids without its number; the action takes the
# number the store gives it on the candidate (last round + 1), files the round and deletes the
# descriptor. A candidate with no descriptor changes nothing. This is what a queue integrator runs
# after it cherry-picks an item onto the remote tip (`bx --land`, bx RFC 0024), because the number
# is a fact of the tree it lands on and not of the commit. `scripts/land.sh` files the same
# descriptors through the same script, so there is one way to file a round.
#
# The inputs are listed here, unlike `regen-codegen`'s, because what a filing reads is small and
# known: the descriptors, the store, the workspace declaration and the scripts. A missed input is
# not silent: the run is judged by what it writes, and a read outside this list is what
# `bx --action file-round --trace` names.
[actions.file-round]
run = "bash scripts/file-round.sh"
inputs = [
    "docs/rounds/pending/**",
    "docs/.atomic/**",
    "mnemosyne.toml",
    "scripts/file-round.sh",
    "scripts/append-round.sh",
    "scripts/lib/**",
]
outputs = ["docs/.atomic/**", "docs/rounds/pending/**"]

# THE WHOLE GATE AS A SET OF CHECKS the fleet judges unit by unit (bx RFC 0004): `bx --checks ci`.
# A unit is one lane of `scripts/run-ci.sh`, run the way a hosted job runs it; the planner reads the
# lanes from the script's dispatch table and its header says why each field of a unit is what it is
# (`scripts/lib/runci_plan.py`). This is the first step of judging every commit before it enters
# `main`, in the fleet, instead of in the hosted runner pool this account shares with its other
# repositories (measured 2026-11-05: 20 of 20 slots taken for five hours, one run per seven pushes).
#
# NOT `cache = true` yet. A kept pass is only right when the verdict is a function of its key, and
# the key holds the tree and the command but not the machine: a lane's oracles (zenohd, zenoh-c,
# pico, the Zephyr SDK) are provisioned per machine today, so the same tree can pass on one machine
# and decline on another. The verdicts are kept once the units run in an image the tree declares
# (bx RFC 0034), which puts that environment in the key.
#
# `local = "never"`: the whole gate is not run on the machine a session types on.
[checks.ci]
plan = ["python3", "scripts/lib/runci_plan.py"]
local = "never"

# THE LANDING QUEUE (bx RFC 0024): `bx --land` submits a commit and one integrator per remote branch
# rebases it onto `main`, files its ledger round, judges it with this repository's own pre-push hook
# and pushes. It replaces `scripts/land.sh`'s clone-local lock for the pushes of a session; the
# script stays until the integrator has landed a week of rounds.
#
# `checks` is left out: the pre-push hook judges, run for the landing push's own line, so what the
# queue accepts is exactly what a push would have been given. The hook grades each ref of that
# push by what it holds (`scripts/lib/push-refs.sh`), and a clone marked `git config
# wz.land-integrator true` is the integrator's, which is what lets gate 0p admit its push to main.
# Mark only the integrator's own clone: the marker lifts the lock requirement for every push it
# makes.
#
# `derive = ["file-round"]`: the ledger round is filed on the candidate, with the number the store
# gives it there, and the derived commit carries the fixed message below. The message states no
# number because the store is the one place that knows it; nothing here reads a round number from a
# commit subject. `regen-codegen` is not derived: `scripts/land.sh` never regenerated either, and
# each candidate would pay a whole regeneration.
#
# `window_floor` and `window_max` are 1, so the integrator does not speculate: the hook is heavy
# and the workstation's cores are shared, and a window above 1 runs several hook runs at once. Raise
# them when the queue has measured a wait that speculation would remove (`bx --land-queue --stats`).
[land]
remote         = "origin"
ref            = "main"
derive         = ["file-round"]
derived        = "commit"
derive_message = "docs: File the ledger round of the landed item"
strategy       = "rebase"
window_floor   = 1
window_max     = 1
