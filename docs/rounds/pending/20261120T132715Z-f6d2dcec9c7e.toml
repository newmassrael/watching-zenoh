impact = ["feature-inventory--composable-framework-atomic--preset-catalog/4-conflict-policy", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "watching-zenoh/local-ci-gates"]
decision = '''
Step 4b, round 2b: the six other bounds a program's own calls fill move to the snapshot together, MAX_QUERYABLES, MAX_PENDING_QUERIES, MAX_DECL_OBSERVERS, MAX_LIVELINESS_SUBSCRIPTIONS, MAX_LOCAL_TOKENS and MAX_PENDING_LIVELINESS_GETS, by the rule round 2a set: each table holds the quota its creator states and refuses past it on every backing, its closure wrappers return the refusal, and the observer and the requesters built with_limits state them. A registration is admitted before anything is announced, so a refusal leaves no trace on the wire: the held-token registry now admits a token before its Declare(DeclToken) leaves (a TokenPlace guard releases it if the announce fails), where zenoh-pico announces first and retracts on a failed insert; a declaration listener installs both observers or neither. A refusal reaches the caller as the path's own error (Refused on the query, queryable, liveliness subscriber, liveliness get, token and listener errors); a group's mirror that refuses leaves the entity off that group, as round 2a's subscriber does, and a session's routing spans, a view and not part of it, are skipped with a warning. With every registration fallible, wz-runtime-tokio keeps its build-time refusal of bounded-heapless for the reason that remains: a fixed backing would hold every AP table to an MCU image's capacities. A fixed build states its capacity as every table's quota, a table on the heap policy included, so the bound is the session's and the storage only how a table holds it; two tests that expected a heap-policy table to grow in a fixed build now expect that.
'''
changes = '''
- `crates/wz-session-core`: `QueryableRegistry`, `ReplyRegistry`, `DeclObserverPair`, `LivelinessSubscriberTable`, `LocalTokenRegistry` and `LivelinessGetRegistry` hold their bound's `<Name>Held` (`limit_to`, `limit_observers_to` on the three registries that hold a pair) and refuse past it with `RegisterError::TableFull` before an id is taken; the nine closure wrappers (`register`, `register_with_locality`, `on_*_declared`, `on_*_undeclared`) return `Result<_, RegisterError>` on every backing, the queryable ones taking `&str`.
- `crates/wz-session-core/src/observer.rs` and `slot_observer.rs`: `with_limits` states all seven bounds; `Requesters::with_limits` states the two requester bounds.
- `crates/wz-runtime-tokio/src/session`: `Refused(RegisterError)` on `QueryAliasError`, `QueryableError`, `QueryableAliasError`, `LivelinessGetError`, `LivelinessSubscriberAliasError`, `LivelinessAliasError` and `DeclListenerError`; the multicast `declare_queryable`, `declare_group_liveliness_subscriber` and `hold_token` return the refusal; `TokenPlace` admits a token before it is announced; a listener rolls its first observer back when the second is refused; `open_routing_spans` warns instead of panicking.
- `crates/wz-capi-core`: the local face ends a query its registry refuses (its final is told, `WZ_CAPI_LOG` says why); a group that refuses a queryable, a liveliness subscription or a token leaves it off that group. `wz-ap-demo` and `wz-e2e-declare-observer` end their run with the refusal.
- `crates/wz-session-core/src/limits.rs`: two `enforcement` tests per bound, twelve in all; `query.rs` and `pubsub.rs`: two tests read a fixed build's quota on a heap-policy table.
- 242 test and doc call sites in 14 files state why their table admits the registration.
- `scripts/lib/limit_read_gate.py`: the six bounds leave `PENDING` (51 remain); `scripts/lib/capability_cost_gate.py`: the 17 cases at their line move by the round's pc2 growth, with the symbol diff noted at pico-client; `docs/reason-review-pins.md`: `session-close-ingress` re-read against `observer.rs`.
'''
verification = '''
- `cargo check --workspace --all-targets` passes on the round rebased onto main `581714684`, with no warning of a workspace crate; clippy `-D warnings --all-targets` of wz-session-core (the C1g feature union), wz-runtime-tokio, wz-capi-core and wz-capi-coop passes, one crate per command, and `cargo fmt --check` passes.
- Tests on the rebased tree: wz-session-core lib 1593 passed on the C1g heap union and 1603 passed with `bounded-heapless`, the twelve `enforcement` tests named in both runs; wz-runtime-tokio lib 755 and wz-capi-core lib 228 passed. Before the rebase, on pc2: wz-capi-coop 32 and the shared unit dispatch 13 passed; clippy of wz-ap-demo and wz-e2e-declare-observer passed.
- `limit_read_gate.py --selftest` passes, and `--check` passes: 86 reads of the build outside storage, 8 limits read from the snapshot, 51 pending, 2 allowed.
- MCU images on pc2 against `022e6268b`, built with `no_allocator_link_gate.build_command` and remapped paths: 23 of 27 byte-identical, and the other four (`mcu-noheap-probe` mps2 and microbit, `mcu-admin-node-fixed` and its tcp build) keep their size. Both trees dumped on one machine: every named symbol keeps its size, and text and read-only data sum to the same bytes; what differs is wz-session-core's crate hash in mangled names and anonymous constants, and the layout that follows from it (`mcu-noheap-probe`: no function's code differs, 3 lines of read-only data do). The host slot images grow by 0 to 48 bytes, the quota words of the tables they hold. `session_slot_bytes.py --check` equals its record.
- Cost cases on pc2 against `022e6268b`: the 17 cases at their line move by their growth, to the hundred (pico-default +1,948, capic-default +3,272, capic-router-node +2,900, -lean +1,796, the others +32 to +136); the selftest passes 25/25. The symbol diff of both trees built on one machine attributes it (pico-default +665 of text symbols): the group's queryable declared before it is announced (`multicast::answer_on` +662), the token admitted before its declare (`TokenPlace::take` +321 and its drop +412, `LivelinessToken::new_held` -307), and in the C ABI's router node the local face's end of a refused get (`State::handle` +530) and the group's join (+317).
- `reason_review_pin_gate.py` passes after `session-close-ingress` is re-read against `wz-session-core/src/observer.rs` (no access-control identifier, as it states); `upstream_citation_anchor_gate.py`, `reason_citation_gate.py`, `store_reason_citation_gate.py`, `gate_provenance_lint.py`, `round_fed_gate_reach.py`, `runci_leg_ledger_gate.py --check`, `logic_census_coverage_gate.py --check` and `wz_config.py --check` / `--selftest` pass.
'''
carry = '''
- The bounds a peer drives move next, each with its two tests and off `PENDING`: MAX_REMOTE_DECLS, MAX_PEER_KEYEXPR_ALIASES, MAX_PENDING_DECLARES, MAX_INBOUND_SUB_INTERESTS, MAX_PENDING_REPLIES and MAX_PENDING_FINALS refuse and count on the fixed backing and enforce nothing on a growable one until the table asks the snapshot.
- `SessionLimits` rides in `SessionInitParams` with its first session-machine reader (127 literals in 16 crates); the MCU node creators (`admin_node`, `client_node`) take it from there. `RuntimeLimits` goes into each runtime creator that reads one. The router node's local face holds the build's limits until then.
- The counting semaphore `quota::Quota` takes the value `limit_binding::Quota` when `QUERIER_MAX_PENDING_QUERIES` moves.
- The C ABI collapses a `Refused` of the query, queryable, token and liveliness errors into the failure it returns for any error of those calls (`wz-capi-core/src/faces.rs` takes them `.ok()`); a refusal code a C caller can tell apart comes with round 3's named refusals.
- Round 3 states limits in the document (`wz/limits`, `[[limit]] upstream` from the pinned source, named refusals, `LimitsNotRead` removed); round 4 opens the three ABI doors, each with a test that the same document gives the same snapshot.
