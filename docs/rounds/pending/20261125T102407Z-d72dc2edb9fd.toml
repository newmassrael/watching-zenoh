impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport"]
decision = '''
Three structural repairs of the session core, each closing a state that could be read two ways.

An unsettled send limit is a type now: negotiated_tx_limits answers None until establishment settles the limits (and again from a reopen until the next establishment), where it answered (0, 127) and read ring code 0, the 8-bit ring, as "not settled". The settled flag shares the limits' atomic word, so one load reads a coherent answer; the send path takes its limits from the same read that judges the gate and answers TransportUnavailable for None. The data-send gate opens only where limits settle: SendGate::open is crate-private, so enter_established and open_without_handshake are the only doors, and the test rigs that opened the gate by hand (reconnect replays, multilink joins, the shm segment) now establish their links.

A received extension that repeats is read by its last entry, as upstream 1.10.2's establishment decoders do (zenoh-codec transport/init.rs @ `ext_patch = p;`, open.rs @ `ext_remote_bound = Some(q);`), where wz read the first. The slot profile keeps one place per extension identity (patch level and remote bound are one identity, 0x27), its bound is derived from the identity table and tied to it by a compile-time assertion as the send-side bound is, and ExtChainOverflow is gone, as the assertion makes it unreachable and upstream refuses no such chain.

Tests are compiled with the items they exercise: the fragment, join and record-walk tests, the kind-name vector and the Vec JOIN encoder's tests take alloc, and the JOIN fixture writes into an array so the slot multicast build without the heap runs it.
'''
changes = '''
crates/wz-session-core: session_actions.rs (TxLimits settled flag, Option limits, unsettle at reopen, dispatch), send_gate.rs (open crate-private), ext_chain.rs (identity table, derived bound, last-entry keeping), inbound.rs, extpatch.rs, extbound.rs, extregion.rs, ext_view.rs (last_by_eid), extauth.rs, extmultilink.rs, extshm.rs, multicast_join.rs, parse_error.rs, transport_message_parity.rs, frame_encode.rs, network_message.rs, sn.rs, tests/join_into_alloc.rs, session_actions/bundle_tests.rs. crates/wz-runtime-tokio: session/mod.rs, session_glue.rs, multilink.rs, shm_auth_segment.rs, tests/it session_fsm_accepting_path.rs and compression_e2e.rs.
'''
