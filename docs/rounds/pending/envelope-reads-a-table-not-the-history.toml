impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The capability-cost layer read the default C image of the library 11,516 bytes over its budget and the lean one 11,604. The previous head had not, and the commits between added the key tables of two documents' rows to the capture crate. Rebuilding the image with only that crate put back showed the same symbols at the same sizes, and the growth in two sections of pointers (the dynamic relocations, 17,232 bytes, and the read-only relocated data, 12,000): the pointers of the key tables. The image reaches them because the envelope every document opens with asked, at run time, which revision it writes and which planes it declares, by walking the whole document history, so the history of every document at every revision was a run-time structure of each build that writes a document, though only the audit and the tests read it. A budget move would have made that a chosen cost. The envelope now reads a table of the newest row of each document, built when the library is compiled from the same history, and the history is no longer reachable from the image. The default image reads 10,843,648 bytes and the lean one 9,266,124, each 335,056 bytes under the reading before the growth; no other case of the layer moved. The two budgets are re-set to the new readings, not left 330 KB loose, for a ceiling that far above its subject guards nothing.
'''

changes = '''
crates/wz-capture/src/doc_revision.rs: the table of what an envelope needs, its constant functions and the static built from the history, the lookup, the two uses in the envelope writer, and a test that holds the table to the history's newest row of every document, once each, with nothing else in it. scripts/lib/capability_cost_gate.py: the budgets of the default and the lean image of the C library with a dated note each.
'''

verification = '''
Run on the build machine: the new test and the other doc-revision tests, 15 passed; clippy of the capture crate over all targets with warnings denied; the capture crate's library tests with every feature, 1,740 passed and 7 ignored of 1,747; the dissection crate's library tests, 232 passed and 2 ignored of 234; the capability-cost layer's selftest, 24 of 24 arms; its check on the two cases, both inside the new budgets at 99 percent; its measurement of every case, where only the two images moved.
'''

carry = '''
Other readers of the history at run time exist in the capture crate (the value families a document lists and the planes check); no build of the C library reaches them today and they were not changed. The next reading of the hosted layer corrects the offset the two budgets assume if it is off. The storage-host plugins-section test over a pico client that read empty once at the previous head is still unreproduced.
'''
