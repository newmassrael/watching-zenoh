impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The four default-off statements the session model and the tokio registry already read (the links an entity may use, a query addressed to one node, a retry for a publish no link had room for, an all-or-none publish) are statable from the zenoh-c C ABI, behind a new non-default feature of crates/wz-capi-c, switch-doors, which is a capability like lifecycle-doors: declared in deploy/wz-config.toml, off by default, implying query and queryable, and forwarded to the core by name.

Nothing is a field of a z_ option struct and nothing is a new z_, zc_ or ze_ export: those layouts are upstream's, held to the installed header by the footprint gate, and those symbols are held to the reference library's by the symbol census. The surface is wz_capi_c_ symbols declared in the wz header: three transparent structs (an entity statement of a link mask; a publish statement of a link mask, attempts, delay and an all-or-none flag; a query statement of a link mask and a target identity), a default function for each that writes the statement of nothing, and seven doors, wz_capi_c_put_ext, wz_capi_c_delete_ext, wz_capi_c_declare_publisher_ext, wz_capi_c_get_ext, wz_capi_c_declare_querier_ext, wz_capi_c_declare_subscriber_ext and wz_capi_c_declare_queryable_ext. Each door takes what its z_ twin takes and one more argument, a pointer to a statement, null for none.

The z_ functions are thin wrappers over the same bodies, which now take the statement as an argument: the z_ function passes the statement that states nothing, applying it changes no option, and so a call that states nothing is the call it was, in every build and whatever the policy. The carriers of a statement (crates/wz-capi-c/src/statement.rs) are not behind the feature, so the shared bodies compile without it; the doors and the structs are.

A stated value is passed through the matching admit_in_build (LinkRestriction, admission_retry, atomic_tx, peer_target) before anything is sent or declared. With the policy off the door answers a new result code, WZ_CAPI_C_E_POLICY_OFF (-102), outside zenoh-c's range as the two wz codes before it are; a declaration leaves its out-parameter in the gravestone state; a closure, a payload and the owned fields of the options are consumed on a refusal as on a success, which is what the z_ twins do on every path. Not Z_EINVAL, because the same call is right in a build whose policy is on. What no engine can hold is Z_EINVAL whatever the policy: a retry of no pass or no delay, more than 255 passes or 65535 milliseconds, a target that is the zero identity. The policy answers before the numbers for a retry that is built as stated (zero attempts beside a delay), as the model's own admit does.

A session that is a node reads none of the four: its data plane writes to its faces by its own tables. A call that states one there answers Z_EUNAVAILABLE, the code every operation a node does not carry already answers, and sends or declares nothing; a call that states nothing is carried as before. A subscriber and a queryable declared with links go through declare_subscriber_on_links and declare_queryable_on_links; the plain declarations were already those calls with no restriction and the literal wire key, so the shared bodies call the links form for both.

A target is the 16 bytes of the z_id_t with its trailing zero bytes cut, which is how the engine names a node and how a face records it, as the Rust API's peer_bytes does. A publisher folds its statement into the options every put and delete on it starts from, at the declaration; the plain-put lane already answers none for a stated retry, all-or-none or restricted links, so no put reaches it past the statement.

The ABI revision of the wz door set moves from 11 to 12 (ten new symbols and the code), and the symbol pin lists them as the build the lane runs, which has the feature on, as it has the others.
'''

changes = '''
crates/wz-capi-c: Cargo.toml gets switch-doors; src/switch_doors.rs (new, gated) holds the three structs, the three default functions, the pure mapping from a statement to a restriction, a retry, a target and the carriers, the admission through admit_in_build with the code each refusal answers, and the seven doors; src/statement.rs (new, not gated) holds the two carriers and their apply; put, publisher, sub, query, get and querier each split the body of the z_ function into a shared body that takes the statement (put_stated, delete_stated, declare_publisher_stated, declare_subscriber_on, declare_queryable_on, get_with_selector, declare_querier_stated), the node arms answer Z_EUNAVAILABLE for a stated statement; result.rs gets WZ_CAPI_C_E_POLICY_OFF; abi.rs moves the revision to 12; include/wz_capi_c.h declares the code, the three structs and the ten symbols and moves the revision macro; tests/c_switch_doors_consumer.c (new) is the C consumer; tests/it/files/switch_doors.rs (new) and its line in tests/it/files/mod.rs are the integration tests; the unit tests are in switch_doors.rs and statement.rs.
crates/wz-capi-core/Cargo.toml: the feature that carries the capability's name. deploy/wz-config.toml, deploy/Kconfig.capabilities and crates/wz-conformance-build/src/items_generated.rs: the capability. scripts/lib/capi_c_abi_pin.py: revision 12 and the ten symbols. scripts/lib/feature_public_surface_census.py, scripts/lib/zenoh_c_archive_arm.py, scripts/lib/nondefault-tests-gate.sh: the feature in each table that names the others. scripts/run-ci.sh: the feature in the two builds that name the others and the C consumer after the identity one. docs/build-configuration.md: the four bullets say the zenoh-c ABI states them through switch-doors, and a bullet states the doors, the code and what stays open.
'''

verification = '''
Run on the build machine pc2 from the crates workspace, counting what the logs say ran: the wz-capi-c lib tests 207 passed with the feature switch-doors (193 in the default build), the integration legs of the switch doors 5 passed with switch-doors and peer, none failed; clippy with warnings denied on all targets in the default build and with switch-doors and peer, and on the fuzz shape without default features; the exported-symbol pin passed on the debug and release libraries built with the lane's features (revision 12 covering 111 wz_capi_c doors, the two sets identical) and the exported config surface gate passed; the door header gate and its selftest passed; the C consumer compiled with warnings as errors against the installed zenoh-c header and printed its verdict line; the non-default tests gate passed (the wz-capi-c leg ran 360 tests, the zenoh leg 179). The generated statement vectors were regenerated with the declaration's writer and its check passed, and the public-surface census passed with its selftest. The policy-on halves are not built here.

The tests are: in crates/wz-capi-c/src/switch_doors.rs, the default functions write the statement of nothing, the layout the header declares, a mask without a bit is no restriction and each bit names its slot, a retry is built as stated and one that does not fit is not built, a target is the identity without its trailing zero bytes, each refusal of the model has its code, nothing stated is admitted whatever the policy, and a mask, a retry, all-or-none and a target are each admitted only when the build's policy is on (each branches on the build's own policy value, so it holds in a policy-on build too, which was not built), and the doors refuse before the handles and answer the twin for none; with router-node, a node carries a call that states nothing and refuses one that states something, through the shared bodies; in crates/wz-capi-c/src/statement.rs, applying the statement that states nothing changes no option and each part reaches the options; in crates/wz-capi-c/tests/it/files/switch_doors.rs, five legs on a session with no peer: a put that states nothing is the z_put (null and default), a stated put follows the policy and sends nothing when it is off, a publisher declared with nothing stated puts and one stating a retry follows the policy, a refused subscriber, queryable and get drops its closure once and leaves the gravestone, and a queryable and a get that state nothing answer as the z_ functions do; and the C consumer prints its verdict line. The policy cannot be flipped at test time (it is fixed when the library is built), so the policy-on halves of the integration legs run only in a build that states the policy.
'''

carry = '''
Open: the router, cooperative and lwIP engines do not read the four statements; a node session answers Z_EUNAVAILABLE for one; the liveliness token, subscriber and get, the advanced publisher and subscriber, the querying subscriber and the publisher's matching listener have no statement door; the doors read the build's policy at the library's build, not per session; the builds with switch-doors and no peer, with it on the no-unstable arm, and with the shared-memory arm were not compiled when this round was written; the footprint of the library with the feature on was not measured, and it is off by default for that reason.
'''
