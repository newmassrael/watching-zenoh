impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-6-keyexpr", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "watching-zenoh/local-ci-gates"]
decision = '''
A fourth integration of the pico C ABI release toward docs/c-abi-architecture.md.

Policy domains: a build links every value of a runtime policy only when something in it can select one. The pico release (os-posix, link-udp) has no door that selects a policy (config-policy and config-document are off), yet all 33 of its policies kept their whole domain, because the rule narrowed a domain to its default only on targets with no OS. The rule is now: an unstated allowance keeps the default where the target has no OS or where no stage selects a policy, and a stage selects one through the widen-only feature policy-selection, which wz-session-core's default build, wz-capi-pico's config-policy and wz-runtime-tokio carry. An explicit allowance or WZ_POLICY_DOMAINS still wins. The crates whose tests select a non-default value carry the feature as a dev-dependency so those tests keep running, and wz_config.py states the rule in its selftest.

Size: an undeclared entity hands its callback back from the table rather than its whole row; an arena names its rows and its limits by a byte; a key's view and canonize doors end in one checked body; a writer, an appended segment and a heapless text are written through one copy; a task store writes its cells once; a datagram's read and a dial's refusal take one body each.

The size ledger reads 1.6430 times zenoh-pico in total (from 1.6717): sessions 2.9954, doors 2.3238, transport 2.9198, driver 1.6850, and its rows are tightened to that reading.
'''
changes = '''
crates/wz-session-core: policy.rs, policy_binding.rs, policy_generated.rs (policy-selection), Cargo.toml; bounded.rs (push_text); session_tables.rs and its tests (Undeclared.taken); deploy/Kconfig.policies; scripts/lib/wz_config.py (selects, selftest).
Cargo.toml of wz-capi-pico, wz-capi-coop, wz-session-mcu, wz-runtime-coop, wz-node-time, wz-mcu-session-acceptor, wz-runtime-tokio (the feature forwarded or carried as a dev-dependency).
crates/wz-capi-coop: engine.rs (undeclare ranks by its walk), engine/replay.rs, arena.rs (ArenaPart, ArenaLimit).
crates/wz-capi-pico: endpoint.rs, bytes.rs, serde.rs, keyexpr.rs.
crates/wz-runtime-coop: executor.rs (TaskStore cells written once).
deploy/size_ledger.json rows tightened.
'''
