decision = '''
The second wave of the remaining-debt axes lands as one merge (owner 2026-11-16, session 6e): test quality, runtime, tooling, interop, C ABI ids and QUIC. Decisions: a QUIC link serves upstream's mixed reliability (zenoh-mr, zenoh-ms-mr): best-effort frames ride the connection's datagrams with their own frame budget, their own room and their own keepalive clock, as upstream's companion link has its own pipeline and lease (`io/zenoh-transport/src/unicast/universal/transport.rs` @ `associated_link.start_tx(transport, al_consumer, keep_alive);`); a session-scope Close deletes the whole transport, a link-scope one only its link (`io/zenoh-transport/src/unicast/universal/rx.rs` @ `if session {`); an express message drains only up to its own band (`io/zenoh-transport/src/common/pipeline.rs` @ `if !self.batching || $msg.is_express()`); C ABI entity ids are u32 end to end and a spent space refuses; the demo refuses an unknown flag and a flag whose feature it was built without. A reply-acceptance defect was found and fixed: for parameters that are not UTF-8 the pico ABI and the core responders read `_anyke` differently, so the ABI accepted replies the responder then refused. A coop-engine defect was found and fixed: retracting a matching listener removed the callback of the subscriber with the same number. The pre-push static block now records its refusals and settles them together; a filtered cargo test in run-ci must count what it ran; pico citations and foreign basenames are ratchets.
'''
changes = '''
QUIC (816 step 4): per-class frame budget, room and keepalive on the session's link driver; QuicWriteDriver sends best-effort on datagrams of a mixed link; ConnectionReader reads streams, priority streams and datagrams; the mixed_rel refusal lifted; a zenohd leg holds a mixed link past the lease. Runtime: session-scope Close deletes the transport with every link's loop woken (174); flags.rs refuses unknown and unbuilt flags (195, 679). C ABI ids (818): SubId, QblId and TokenId are EntityId u32; router node queryables and tokens take their id before hosting; coop callbacks keyed by kind and id; NodeGroup join retracts on refusal; HostError::EntityIdOutOfRange removed. Test quality: digest publisher aligned by one wall-clock read (134), express drain through its own band (159), raw query parameters read through one function (155), node dial forget witnessed (25), mTLS dial witnessed (728), intersection witnesses guarded (766). Interop: pico built without fragmentation answered at NO_PATCH (173), group session re-join over a re-attached device (902), volume lifecycle from a stock pico (781). Tooling: pre-push records and settles static refusals (742), unguarded_test_filter_lint (76, 386), filtered count guards modelled (400), pico and basename citation axes (697, 708, 724) with seven citation repairs, catalog invariant 8 report-only (673), previous-run gate --which (772), pinned-checkout resolver shared (718 half). Integration: A4 1095, citation budgets lowered, count_guard_lint skip-only model, round_fed_gate_reach follows run libraries, allfeat_clippy_plan --check in pre-push, sce_autoroll deferred. Store: session-close-ingress names the link's out-of-band wait; four pins moved.
'''
