impact = ["wire-spec-subset--watching-zenoh-mvp/6-zenoh-payload-layer"]

decision = '''
A consumer that injects faults into captured frames builds every case from the structural report of a transport message (`transport_layout`): it names a row, and the operation follows from the row's kind. One case could not be built. A zenoh transport has no checksum, so a wrong-checksum case has to make a protected frame's CRC wrong, and that CRC lies inside the Frame's `payload` row, at a place that moves with each message's key, extensions and encoding. A fixed bit position cannot name it, and computing the place is a second reader of the network message and of the profile. The report now reaches into the protected frame when the caller names its profile: `transport_layout::layout_under` and `e2e_frame_rows`, the document `layout_document_under`, and a new door `wz_dissect_transport_layout_e2e` (dissect ABI 56). For each message a Frame carries whose payload is inline bytes at least as long as the profile's header, it adds `carried[i].e2e` (the frame, within `payload`), one row per header field (within the frame, big-endian, the integer as written with no `xor` undone, the CRC a `checksum`, the length a `length` that measures the frame, the counter a `sequence_number`) and `carried[i].e2e.@payload`, named by the profile's own cover word. Every row the CRC is computed over carries the CRC row's name in `covered_by`. The rows say where the fields are if the payload is a frame under the profile and do not say that it is one, because which keys a profile covers is a fact the declarations hold and one unit does not. Two cases follow from the report alone: any other value in the checksum row is a frame whose CRC fails and nothing else moves; a counter that skips with the CRC still right is the frame read and built again by the existing open and wrap functions, written over the frame row. Every layout row gains `within` and `covered_by` (`null` on transport rows), so both `transport_build` and `transport_layout` move to revision 2; the layout document's `kind` gains `checksum` and its `encoding` `big_endian`, which the build door never writes, and its refusal gains the place of a profile that does not read.
'''

changes = '''
crates/wz-capture/src/transport_layout.rs: `Kind::Checksum`, `Encoding::BigEndian`, the transport-only word sets, the `within` and `covered_by` cells, `layout_under` and `e2e_frame_rows`.
crates/wz-capture/src/transport_layout_json.rs: the two cells rendered on every row, and `layout_document_under` with a profile refused at its place; e2e_json.rs: `profile_refusal_in`.
crates/wz-capture/src/doc_revision.rs: revision 2 of both documents, their key sets and the layout document's families; transport_build_json.rs and fields_json.rs: the example and the families gate follow.
crates/wz-capture/src/transport_layout_json_tests.rs and transport_build_tests.rs: rows typed by hand from a profile, a checksum made wrong from its row, a counter rebuilt over the frame row, the units with no frame rows, two messages in one Frame, the document and its refusals, every cut and bit flip under a profile.
crates/wz-capi-dissect: the door, ABI 56, the header (the two cells, the two words, the door), its tests across the boundary, and the C consumer (a checksum found by its row and made wrong, revision pins 2).
scripts/lib/capi_abi_pin.py and analysis_surface_parity.py: the new symbol.
'''

verification = '''
On a build machine: wz-capture library tests with `dissect,fixtures` (1799 passed, the seven new frame-row tests among them, and the transport, field-document and revision tests again after the last edits, 155 passed) and with `dissect` alone (58 transport tests); wz-capi-dissect tests (234 library, 4 memory gate, the profile door across the boundary among them); Layer C1bo, which compiles and runs the C consumer (a checksum found by its row and made wrong, the open door saying the CRC fails) and the ABI pin at 56 with the new symbol; the transport fuzz target with the new door, `fuzz.sh regress transport` (512 inputs); clippy of wz-capture with `dissect,fixtures` and with no features, and of wz-capi-dissect, over all targets with warnings denied, clean; rustdoc of wz-capture with and without `dissect` and of wz-capi-dissect with warnings denied, clean. The consumer revision pin gate (22 pins over 28 documents), the integer cell gate, the analysis surface parity gate and the ABI pin selftest pass. rustfmt applied.
'''

carry = '''
None from this round.
