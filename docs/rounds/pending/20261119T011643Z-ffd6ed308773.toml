impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-15-routing", "watching-zenoh/local-ci-gates"]
decision = '''
A face loop holds each listing of a configured connect endpoint as a peer of its own, so an endpoint the list names twice is dialled twice and a `transport-multilink` session to it aggregates two links again. Round 4506 gave every `routing-peer` loop's configured list to the peer planner (a9bf75ef4), which keyed an endpoint by its address alone, so the second listing was the first one again and dialled nothing; E6c and E6d, which list one address twice to reach a two-link session, failed on it behind the C1p guard. Upstream starts a connector for every listed endpoint, a repeated one included (`zenoh/src/net/runtime/orchestrator.rs` @ `async fn connect_peers_multiply_links(`), so a member is now its address and which listing of it it is: each has its own machine, dial and wait, a replace that lists an endpoint fewer times forgets its later listings, and an add of an address already listed changes nothing, as before.
'''
changes = '''
`crates/wz-runtime-tokio/src/loop_peers.rs`: `EndpointKey { at, listing }` names a member of the connect list and `PeerKey::Endpoint` carries it; `set_endpoints` numbers each target's listing among the targets before it that name the same endpoint; the test `an_endpoint_listed_twice_is_dialled_twice`.
`crates/wz-runtime-tokio/src/accept_loop.rs`: the retry schedule's doc says an endpoint's outage is its listing's; `docs/reason-review-pins.md` re-pins session-close-ingress on that file.
'''
verification = '''
On the build host: `run-ci.sh` layers E6c and E6d pass (each 1 of 1, the two-link session aggregated), C1y passes; `wz-runtime-tokio --lib` with routing-peer and transport-multilink 982 passed; `loop_peers` with routing-peer, transport-multilink, session-close-ingress and transport-link-tls 18 passed, the new test among them; clippy -D warnings of wz-runtime-tokio with those features, with routing-peer and transport-multilink, and with router-connect-reconcile.
Locally: `cargo fmt` of the crate; reason review pins, reason citations, upstream citation anchors and the prose name gate.
'''
carry = '''
Capability cost (C1cs) and the Zephyr kit lane (Qzk), red since Round 4506, are read on the hosted run of Round 4522 (f7ab3a770, the first CI run of this tree's sizes that is not cancelled) and paid by symbol diff against 4050dd889.
'''
