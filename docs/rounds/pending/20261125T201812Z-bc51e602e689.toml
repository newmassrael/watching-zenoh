decision = '''
An integration of the pico C ABI release toward the win budget of docs/c-abi-architecture.md section 9: the ABI door rows with the panic policy, the cooperative engine's message count, and session timers that never fire before their bound.

ABI doors (T-ABI D2): the closure families and the hand-written owned families (session, slice, string, hello, reply error, key expression, liveliness token, cancellation token, string array, matching listener) run their null, check, take and drop over one TypeFacts body each.

Panic policy (owner decision of section 9.4): a panic aborts at every C boundary. The doors' catch is the plain call in every build, so no door carries a landing pad.

Cooperative engine: a session's snapshot counts the messages its links and group joins received, and a link or join let go of is retired into a ledger, so the count never falls. A group frame ends its records once, in the walk that read it; before, a group's lent Push waited for a record of another kind.

Timers: a handshake bound, a unicast lease and a group peer's lease are counted from the end of the millisecond they were read in, so none fires before its bound; read from a floored millisecond, each could fire up to one millisecond early (an accept was dropped 0.08 ms before its one second).

The census and the configuration selftest follow: the host's once cell joins slice S9, the mirrored-key reply test gets a leg, and no pico capability turns std on.
'''
changes = '''
crates/wz-capi-pico: abi.rs TypeFacts bodies for every owned family, ffi/boundary.rs catch as a plain call, crates/Cargo.toml profile comments.
crates/wz-capi-coop, wz-runtime-coop, wz-session-mcu: the message reading of links and group joins, retired into a ledger.
crates/wz-session-core: group frames end their records once (multicast_rx, multicast_dispatch); session_timeouts, drive.rs lease_deadlines and multicast_dispatch sweep count from the end of the read millisecond.
crates/wz-host-sync: once.rs, crates/wz-capi-port and wz-node-time off std.
scripts/lib/wz_config.py selftest, scripts/lib/nondefault-tests-gate.sh legs, docs/zenoh-logic-as-sce-kinds S9 and files.md.
'''
