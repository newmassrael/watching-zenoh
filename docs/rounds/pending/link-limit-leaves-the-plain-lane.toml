impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
A publish that states a set of links, under the entity-link-restriction policy, now leaves the plain-put lane, as a publish that states a retry or an all-or-none form already did. The lane writes a declared publisher's puts to every face without reading which link a face is, so a limit it took would have been ignored and the put would have reached the links the publisher was limited away from. The check is the one place every caller of the lane asks, PublishOptions::plain_put_params, so no caller carries its own copy of the condition. Any, the default, keeps the lane; a set is a statement whatever it contains, including a set of every slot.
'''

changes = '''
crates/wz-session-core publish_options module: plain_put_params answers None when the options' link set is restricted, and its documentation lists a limit to some links among the reasons; a test states that a limited publish, and a publish limited to every slot, leave the lane while an unlimited publish keeps the lane the build gives it.
'''

verification = '''
Run on the build machine pc2 from the crates workspace, counting what the log says ran: the publish_options plain-lane tests, 4 run and 4 passed, among them the new one; clippy with warnings denied on wz-session-core with all targets. The path was found by reading, not by a failing run: nothing in a Rust API build reaches the plain lane today, and the C ABI states no link set yet, so no test observed a put that ignored a limit before the change.
'''

carry = '''
Open: the registry's plain lane itself still ignores slots, which is correct only while no options that reach it carry a limit; a caller that built its own plain parameters without plain_put_params would bypass the check. The C ABI does not state a link set, so this guards the door that is to be added.
'''
