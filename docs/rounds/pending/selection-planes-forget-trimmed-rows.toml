impact = ["wire-spec-subset--watching-zenoh-mvp/6-zenoh-payload-layer"]

decision = '''
The consumer remeasured the selection since door after round 4457: one call fell from 50 to 3 ms at the median and from 492 to 16 ms at the 99th percentile, but under a ceiling that trims the front the 99th percentile stayed out of its budget. The kept planes went on across front trims and kept the verdicts of every row the ceiling took, and past four entries per held message they were begun again over what was held: about once in 30,000 rows on the live tap's ceilings, that call costing the whole walk, and the restarted planes read a final whose request the ceiling had taken as an orphan. The planes key every per-row entry by the row's list and produced-index, and nothing asks for a row its list no longer holds (a document writes only held rows, and a row is asked again only while held), so the entries of rows below each list's first held row are now given up instead: in one pass, when the entries have doubled since the last pass or passed the four-per-held-message bound. The planes are begun again only when what they keep that is not a row's (the exchanges still open) alone passes that bound. The same run found round 4460's red: the dissector now emits `whatami_name` on the Init and Join cbyte, a word read from the `whatami` bits, and the transport layout's closed table refused it as unclassified in 22 tests. A reading is not a field a caller can write, so the table gains a closed list of readings, each naming the bit-field it reads, skipped only beside a row of that field; the round's author agreed.
'''

changes = '''
crates/wz-session-core/src/sorted_chunks.rs: retain, in one pass, giving back emptied chunks.
crates/wz-capture/src/overlay_map.rs, verdict_column.rs: retain over both layers, sparing a copy that is alive.
crates/wz-capture/src/payload.rs, exchange.rs, row_plane.rs: each plane gives up the entries of rows a predicate rejects; open exchanges stay.
crates/wz-capture/src/selection_json.rs: the memory gives up the rows no list holds when the planes' entries doubled or passed the bound, counts it in the work, and begins the planes again only when what is left passes the bound; the cost section says so.
crates/wz-capture/src/selection_since_tests.rs: 900 rounds of exchanges, some left open, through a six-message ceiling under four selectors; every document equals the one a memory that keeps every row writes, each message folded once, the planes never begun again.
crates/wz-capture/src/transport_layout.rs, transport_build_tests.rs: the closed list of readings (`whatami_name` reads `whatami`), and the test that nothing else is skipped and every reading is met in the corpus.
crates/wz-capi-dissect/include/wz_dissect.h: the condition list and the measurement.
'''

verification = '''
Run on the build machines. Capture crate with `dissect`: library tests 1,747 passed and 6 ignored, including the 22 transport layout tests that round 4460 had failed; clippy over the library and tests clean, and with `--no-default-features` and `--no-default-features --features dissect` clean; rustdoc with warnings denied clean. Session core: the sorted chunk tests 5 passed, clippy clean. Dissection C library: tests 233 passed and 3 ignored, the handle memory gate 4 passed, clippy and rustdoc clean. The new ceiling test first failed on its own subject: a pass that waited for the entries to double let the four-per-held-message bound begin the planes again first, and that restart revised a held final from yes to undecided; the bound now gives the rows up before it begins anything. Measured in a debug build under the live tap's ceilings over 200,000 pushes, a call every 100 pushes under `kind == put`: 2.3 to 2.6 ms a call on average and 10 ms at most, the whole walk 0.31 to 0.33 s on the same machine; the work counter read one restart (the first call), 2,000 resumes and 20 passes that gave rows up, where round 4457 measured 7 restarts of 380 to 530 ms each.
'''

carry = '''
The kept planes still hold the verdicts of the rows the handle holds, 13 bytes a row in the handle memory gate, though a settled row's word is also in the memory's words; dropping them needs the whole reads (a cursor below the last one, a row with no number) to read the remembered words instead, not done here. A Scout's `what_router`, `what_peer` and `what_client` flags are readings of the same kind; the transport layout does not cover scouting messages, so they need no entry until it does.
'''
