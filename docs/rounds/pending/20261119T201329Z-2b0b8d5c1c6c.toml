impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-15-routing"]
decision = '''
Pay the Z8 routing red Round 4545 carried (`three_node_combination`, 7 of 8 since Round 4506), at the cause Round 4545 named. A node's liveliness get read the node's own tables alone, and since Round 4506 a router tells a peer below it no token it was not asked for, so a peer node under a router got none of the tokens beyond it. The get now does what upstream's peer hat does with its session's `Current` interest: it is told the keys the node already knows, then sent to one gateway through the node's interest broker (`zenoh/src/net/routing/hat/peer/interests.rs` @ `if msg.mode == InterestMode::Current {`), whose answers reach the get under its id, each key once, and whose end (or the broker's deadline) ends it. The answers are the get's alone: they are not counted as tokens of the node's face, whose ids are the gateway's numbers and not the node's. A node that asks no router, or is built without the broker, ends the get at once with what it knows, as before.
'''
changes = '''
`crates/wz-runtime-tokio/src/router_forward.rs`: `LocalFaceEvent::InterestFinal { interest }`, what a `DeclareFinal` with an interest id is to the `Local` face; `RouterForwarder::ask_routers_current_tokens(id, key)`, the node's own `Current` token interest to one gateway (0 without `routing-interest-pending-gc`).
`crates/wz-runtime-tokio/src/router_forward/brokered_interest.rs`: `propagate_current_kinds` takes an interest's kinds rather than a received body (`BrokeredKinds`), and `ask_gateways_current_tokens` brokers the node's own interest with the `Local` face as its source.
`crates/wz-capi-core/src/drive/router_node/local_face.rs`: `LocalLiveliness::{tokens_get_id, get_tokens, end_tokens_get}` and the face's held `TokensGet` (the keys told, the key handler, the end); a router's answer under a get's id goes to that get and not to the face's tokens; two tests.
`crates/wz-capi-core/src/drive/router_node/engine.rs`: `liveliness_get_on_wire` holds its leg's callback until the get ends, records the get's cancel under an id taken before it is asked, and asks through `get_tokens`.
'''
