impact = ["wire-spec-subset--watching-zenoh-mvp/5-network-routing-layer"]
decision = '''
An Interest's restricted key is read in the table bit 6 of its options byte names, as a Push's key is read in the table its header's M bit names: the interest body codec now dispatches its wireexpr arm on that bit, which upstream names InterestOptions::MAPPING, where it passed the Local arm whatever the bit held. The field tree's mapping on that key is the bit, and the ABI header's stated exception for it goes. The field document moves to revision 72, row_facts to 12 and the census to 26; values move under stationary keys.
'''
changes = '''
sources/codecs/interest_body.scxml declares the M dispatch on its wireexpr import, and the regenerated out/wz-codecs/interest_body.rs reads the arm from bit 6 on decode and writes bit 6 from the arm on encode; every builder in the tree writes the Local arm and so the same byte as before.
The dissection walker's Interest body records mapping from bit 6, and its mapping test reads an Interest at both settings of the bit beside Push, Request, Response and the three declarations.
The interest plane's census resolves an Interest whose bit is clear in the receiver's table; a new test holds that, with the same bytes and the bit set as its control.
The field document's revision 72, row_facts revision 12 and census revision 26 rows, the ABI header's mapping paragraph and its examples, and the C consumer's revision pins.
The upstream citation gate's basename budget moves from 1187 to 1186 with the wrong codec note it counted.
'''
verification = '''
The session core's library tests, 1042 passed by default and 1667 with dissect; the capture crate's library tests with dissect and fixtures, 1826 passed and 6 ignored; the dissection crate's tests, 259 and 4 passed; the tokio runtime's library tests, 742 passed.
Red-first: with the regenerated decoder's two dispatch arguments put back to the Local arm, the capture test and the walker's mapping test each fail at the clear bit, and pass with them restored.
fmt; clippy with warnings denied of wz-session-core with dissect, wz-capture and wz-codecs, one crate per run; the rustdoc lane over the four touched crates; the upstream citation anchor gate.
'''
carry = '''
The tokio runtime's integration tests were not run for this change; the routers that relay an Interest now see the Nonlocal arm when the bit is clear, and their library tests pass.
The consumer's request continues with recognising zenoh of another protocol version, the facts of shared-memory payloads and pairing across a session's links.
'''
