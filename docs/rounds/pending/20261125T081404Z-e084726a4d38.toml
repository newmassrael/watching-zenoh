Through bx from the integration worktree ci-int. Passed: Layers E7s (6/6, 2048 sessions) and F shard 2/4; on x86_64 and on i686 (pc2) the lent-table and face size tests; wz-session-core lib (1618), wz-capi-core send_deferral (2), wz-runtime-tokio link_congestion_tests and multicast_pipeline tests (with transport-multicast), wz-runtime-coop lib under alloc,listen / alloc,session-unicast and in the workspace-unified set, the tx_lend_only_encode and handshake_encode legs at fixed storage, lend-only heap and the slot set, zenoh router_session tests (10), link_admission (21), wz-runtime-tokio --no-default-features --features transport-multicast check; clippy -D warnings of wz-session-core (default and peer-row-pools set), wz-runtime-tokio, wz-capi-core, wz-capi-coop, wz-runtime-coop. The workspace-unified lib run and the i686 linked-crates leg leave four session_actions bundle_tests red, which the int-fix lane repays (7fa627553, ad702c4b9). mnemosyne-cli validate-workspace: no new T1 orphan.
'''
