impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
The second integration of the CI red repayment, on main 20ee0c0a1, each red fixed at the structure that made it possible rather than at its symptom.

Liveness: the registry no longer sends while it holds its lock. A declaration (subscriber, queryable, token, keyexpr, interest, undeclare, final, the face_up replay, gossip, and the multicast group sends) is recorded under the lock into an ordered per-face deferral and leaves after the guard drops (send_deferral in wz-session-core, wz-capi-core and the tokio multicast pipeline), as upstream's dispatcher sends after drop(ctrl_lock). A congested link can no longer stop every other face's receive and timeout sweep. The deferral's order lock is held across waits, as the conduit's is.

No-heap tables: a lent table's head holds no pointer. It names its rows by index (first, len) in the span its owner holds once per session, and each kind carries exactly the counters its inline twin has, so a lent table and a face's lent tables take no more than their inline twins on every ABI wz builds for, i386 System V included; the size claims are restored as originally stated. PeerSlot and lent_space are the row layer's; peer-row-pools takes storage-profile.

Router admission: the link table follows the node's declared limits and is unbounded where they are open (1101 was MAX_FACES + MAX_ACCEPT_PENDING + 1 read as a hidden bound), and a link refused for want of a row closes as INVALID rather than MAX_LINKS, which a peer read as held and redialled forever.

Bounds derived from the build: the handshake chain bound is the staging type's own slot count (a compile-time assertion ties them; patch and remote bound share id 0x7), and the encoders' tests derive their inputs from it. A coop read's wait buffer is emptied by its owner when handed back. A ring maximum is answered in u64 at upstream's widths. The response-final footprint floor is re-pinned after a per-symbol bisection (10760 -> 7584 B: the lent Final writer, the consolidating get's tables, an inline boundary) with response_final_len as its witness. Tests that measured a thread race (the admin GET beside a declaration flood) or a router's lifetime wrongly now measure the property they state. The Windows pico-api size rows are filled from the hosted reading.
'''
changes = '''
wz-session-core: send_deferral (new), session_actions deferral, row_pool/id_map/peer_tables pointer-free heads and their registry callers, link_admission rows as a Quota and has_row, driver_loop LinkNoRoom, handshake_encode/ext_chain STAGED_CHAIN_MAX, transport_compose sn_ring_max, tests.
wz-capi-core: faces send deferral under the registry (unicast and groups). wz-runtime-tokio: multicast pipeline deferral, lib.rs SocketAddr path, link registry tests. wz-runtime-coop: faces wait buffer, reassembly_rx and table tests. wz-capi-coop: engine rows quota. wz-zenoh: the admin GET test asks its local plane.
scripts/measure-codec-footprint.sh (floor and witness), deploy/pico_host_ceiling.json (Windows pico-api rows), docs/c-abi-no-heap-pools.md.
'''
