impact = ["feature-inventory--composable-framework-atomic--preset-catalog/4-conflict-policy", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
Step 3b of the staged policy binding: outside the session core, a machine no longer reads a policy from the build. Each top-level creator (a C ABI open, the tokio router and demo, an MCU image's `main`, the MCU tools that open, the process event log, the test fixture) resolves one `SessionPolicy` in a single `resolve_policy` that a later step extends to read a run-time document, and hands it down; the sessions, routers, link writers, reassembly, pumps, node clocks, the cooperative engine and the C ABI doors read the snapshot they were given. A const that folds a code path out for size (the publish's wire legs, pico's targeted get) now folds on the build's domain, so a build that allows both values links the path and a one-value build still drops it. One visible change: a C ABI door that states a link, retry, all-or-none or target on a session that is not there now answers `Z_ENULL`, as its `z_*` twin does, where it answered the build's policy refusal, since a session that is not there has no snapshot to admit by.
'''
changes = '''
`wz-capi-core`, `wz-capi-coop`, `wz-capi-pico`, `wz-capi-c`, `wz-capi-port`: `OpenPlan` resolves one snapshot; stance, links, registry, replay pace, second-link order and door admission (`admit_by`) read it; `open_with_policy`; `WIRE_LEGS_IN_BUILD` and pico's targeted get fold on the domain.
`wz-runtime-tokio`, `wz-runtime-tokio-test-support`, `wz-ap-demo`: sessions, routers, link writers and socket configs take the creator's snapshot (`resolve_policy`, `fixture_policy`); the multicast loop, writer and session keep build-default wrappers until `MulticastParams` carries a snapshot.
`wz-node-time`, `wz-runtime-coop`, `wz-session-mcu`, `wz-session-lwip`, `wz-mcu-session-acceptor`, `wz-mesh-client`, `wz-replay`, `wz-mcu-multicast-e2e`, `deploy/*` images: `EventLog::of_policy`, `NodeHlc::for_node_by`, MCU reassembly, pumps, group sessions, `ClientNode` and `PlaneContext` carry the image's one snapshot; `scripts/lib/policy_read_gate.py` lists creators and wrappers only; `docs/reason-review-pins.md` re-pins three `session-close-ingress` rows.
'''
verification = '''
On pc2: `cargo check --workspace --all-targets`; lib tests of wz-runtime-tokio (739 by default, 936 with `routing-peer`, 1292 with `routing-router-hat`, the router's two snapshot tests among them), wz-capi-core (215, and with transport-qos and router-node), wz-capi-c (205), wz-capi-pico (162), wz-capi-coop (19), wz-capi-port (18), wz-session-mcu (22), wz-node-time with time-hlc, wz-replay with live, wz-mesh-client, the MCU acceptor, wz-session-lwip, the tokio test support and wz-ap-demo, with the touched tokio test targets; clippy of the 17 touched crates one by one, wz-runtime-tokio also with each routing feature; `cargo fmt --all --check`; `session_slot_bytes.py --check` (36728 and 36720, equal to the record); Layer Q, whose only failure is the multicast-e2e footprint at 78888 / 78944, the bytes main reads on the same host, so the host's offset and not this round; the capability cost against main at `458774b1f` on the same host, the growth read by symbol in four cases and the budgets moved by it. Locally: `wz_config.py --selftest` and `--check`, `policy_read_gate.py --check` (33 reads at 32 allowed sites), `capability_cost_gate.py --selftest`, reason review pins, store reason citations, reason citations, upstream citation anchors and the prose name gate. A correction to Round 4520's verification: its `wz-runtime-tokio --lib` count ran without `routing-peer`, so the five unit tests of the router's declaration store did not run there; they run here, 34 of the store's tests passing on the merged tree.
'''
carry = '''
Step 3c: `MulticastParams` carries a snapshot and the multicast wrappers go (`Pacing::of_build_defaults`, `reassembly_config_of_build`, `Session::new_multicast`, `wire_dialed_link`, the multicast socket configs' `Default`); `NodeHlc` wrapper callers move to `for_node_by`; the C ABI router node opens through `RouterForwarder::for_node`; entity option and loopback `Default` sites and `TxQueueConf::default()` in the zenoh config crate move; the gate widens to catch them, and the session-core build-default wrappers go once no caller is left. Then step 4, the open-stage document under the `wz/` namespace.
'''
