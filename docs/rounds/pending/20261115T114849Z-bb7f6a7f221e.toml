impact = ["watching-zenoh/local-ci-gates"]
decision = '''
The landing queue merges a landed item onto main instead of replaying its commits (bx.toml [land] strategy = "merge", owner decision 2026-11-15). An integration branch that merged several sessions' branches cannot be replayed commit by commit without passing mixed intermediate trees through the pre-commit hook, and the hook is never turned off; a merge keeps every commit with its reason, and the pre-push hook judges the merged tree, which is the tree that lands. The integrator reads [land] from main's current value, so this lands alone and takes effect for the items after it.
'''
changes = '''
- bx.toml [land]: strategy rebase -> merge, with the owner decision and the reason as a comment
- scripts/land.sh: the after-landing comment says the item was merged onto the tip and that origin/main reaches the landed commits
'''
verification = '''
Local at bb7f6a7f22 over origin/main eb14784d20: bash -n and shellcheck -S warning over scripts/land.sh rc 0; reason_review_pin_gate.py --check OK (55 rows). The integrator's hook run judges this item. The first merge-strategy landing is the c2 integration that follows.
'''
carry = '''
Land the c2 integration as a merge item: 294 commits of axes, debts and claims, verified at its target tree (C1bf 100/100, workspace tests, E18 contract, C1v/C1y/C1bo).
'''
