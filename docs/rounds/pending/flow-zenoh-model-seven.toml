Model 7 part: wz-session-core: BatchParse::fails_the_frames_batch; walk_unit counts a unit whose Frame's records fail the batch as not read whole; unit_reads_whole asks the same rule through frame_reach; tests of each case. wz-capture zenoh_evidence: MODEL 7; freeze module (the registry of freezes with model 6's digest and corpus, the seal, the digest over the model and the development corpus's counts) with tests of the seal and the registry. zenoh_validation_tests reads a corpus only under its frozen digest. zenoh_calibration_generated regenerated; the renderer names the model number. doc_revision: fields 68, session table 14 (after main's 13). The session table examples (session_table_tests, wz-capi-dissect's test, wz_dissect.h, the C consumer) state model 7, the regenerated sums and the new revisions. docs/flow-zenoh-verdict.md section 6.14.
'''

