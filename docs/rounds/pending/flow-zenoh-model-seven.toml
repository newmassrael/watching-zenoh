impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-27-api-compat", "wire-spec-subset--watching-zenoh-mvp/8-transport-link-matrix"]

decision = '''
Model 7 of the flow zenoh test ships, unfrozen (doc 6.14). The reader now ends a Frame's records at a transport id and reads the rest of the batch as the next message, as upstream's Frame reader rewinds and its batch loop reads on. Under that reading the development corpus gives two other priors: three null members move units from whole to residual (lan-dns 26,32,116 to 16,42,116; busylan-dhcp 16,98,133 to 6,108,133; busylan-wsd 5,12,97 to 3,14,97), which moves the null side of the no sum, and zenoh links whose second Frame was absorbed no longer read a break, which moves the SN prior from Beta(89/10000, 19911/10000) to Beta(74/10000, 19926/10000). Both are priors of the hypothesis a sum does not reject, so by D1 the error guarantee's numbers are unchanged; the operating characteristics and the observations move. D16: a model whose measurement was wrong is superseded, not amended. Model 6's freeze and its validation report stand as a reading of model 6 with the reader of its entry; its corpus is spent and is not read for model 7; the calibration is not held at the old reading. D17: a validation corpus is read only under the model number and digest a freeze registered it for; a model numbered after every freeze reads none. D18: the digest of a freeze covers the development corpus's counts as well as the parameters, and the freezing entry names the reader's commit. Fields 67 and session table 13 carry the values.
'''

changes = '''
wz-capture zenoh_evidence: MODEL 7; freeze module (the registry of freezes with model 6's digest and corpus, the seal of a model against them, the digest over the model and the development corpus's counts); the freeze test reads the registry, and two tests hold the seal and the registry's order. zenoh_validation_tests reads a corpus only under its frozen digest and holds it to the corpus's own report.txt. zenoh_calibration_generated regenerated from the corrected reader; the renderer names the model number. doc_revision: fields 67, session table 13. session_table_tests and wz-capi-dissect's session table test, wz_dissect.h and the C consumer state model 7, the units' no part at 3.2972 bits a unit and the new revisions. docs/flow-zenoh-verdict.md section 6.14.
'''

verification = '''
INTEGRATOR: replace this paragraph with what the merged tree ran. The author built and ran nothing. Expected: wz-capture with lz4 (dissect, reassembly, compression) passes, including the_generated_calibration_is_current, the_model_is_the_one_frozen_before_the_validation_corpus (printing model 7's digest), a_frozen_number_reads_its_corpus_only_with_its_own_digest, the_freezes_are_in_model_order_each_with_a_corpus_of_its_own, the corpus tests, and the validation test without reading captures/validation; wz-capture without lz4 and with no default features passes the freeze tests; wz-capi-dissect passes its session table test; the C consumer (C1bo) passes at fields 67 and session table 13; clippy clean for wz-capture and wz-capi-dissect. Observed before this round on the integration run that carried the corrected reader with this calibration: the corpus tests and the leave-one-group-out test passed, and the only failures were the three pins this round moves.
'''

carry = '''
Model 7 is not frozen. The same seam is open: a unit whose Frame's record walk halts on an unknown network id or a record that fails to decode still reads whole, where upstream fails the batch (passive.rs walk_unit); the model that closes it takes the next number and is the one to freeze. Then the freezing entry (digest, reader commit, corpus path in zenoh_evidence::freeze) and a validation corpus of new groups collected after it, at least 29 a side, as doc 6.14 lists. Whether the 58 spent validation captures join the development corpus is the owner's decision. The consumer is told model 7, fields 67 and session table 13.
'''
