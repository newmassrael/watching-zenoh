decision = '''
This round is the landing of the c2 integration branch as one merge (owner 2026-11-14: run every remaining axis in parallel under one commanding session; session 6e took command on 2026-11-16 and lands it). The branch carries the workers' branches as merges, which the queue's merge strategy (landed just before) admits; each worker's commit keeps its own reason. Two consumer claims close here: a router answers adminspace queries while a client transport opens (admission and declaration-throughput fixes), and a client-mode session declares its own adminspace at @/<zid>/client as upstream 1.10.x does in every mode. The SCE pin moves to 9ae6a6b682. The merge with main keeps both the control-frame flag on the batch conduits and the across-waits mutex the lock-order fix introduced; the session-close-ingress reason was re-read against session_actions.rs and still holds. The model 7 decision below is one part of this branch.

Model 7 of the flow zenoh test ships, unfrozen (doc 6.14). The reader reads a Frame's records as upstream reads a batch, in both halves of its rule: the records end at a transport id and the rest is read as the next message, and a record that does not decode, or whose id is in neither space (0x08 to 0x18), fails the batch and leaves its unit residual. A network id this build has no decoder for is a limit of the build and is not counted. The walk and the batch header probe ask one rule. The development corpus gives other parameters under that reading; the first half alone moved only priors of the hypothesis a sum does not reject (the units' no mean, the SN prior), so by D1 model 6's error guarantee did not rest on it. D16: a model whose measurement was wrong is superseded, not amended; model 6's freeze and report stand as a reading of model 6 with the reader of its entry, its corpus is spent and is not read for model 7, and the calibration is not held at the old reading. D17: a validation corpus is read only under the model number and digest a freeze registered it for. D18: a freeze's digest covers the development corpus's counts as well as the parameters, and the freezing entry names the reader's commit. The next validation corpus is 59 new groups a side, collected by a session that took no part in the model; the 58 spent captures do not join the development corpus in this step (owner). Fields 68 and session table 14 carry the values; the session table's 13 is main's, which added the decryption cells first.
'''

