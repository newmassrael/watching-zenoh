impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-27-api-compat", "wire-spec-subset--watching-zenoh-mvp/8-transport-link-matrix"]

decision = '''
Model 7 of the flow zenoh test ships, unfrozen (doc 6.14). The reader reads a Frame's records as upstream reads a batch, in both halves of its rule: the records end at a transport id and the rest is read as the next message, and a record that does not decode, or whose id is in neither space (0x08 to 0x18), fails the batch and leaves its unit residual. A network id this build has no decoder for is a limit of the build and is not counted. The walk and the batch header probe ask one rule. The development corpus gives other parameters under that reading; the first half alone moved only priors of the hypothesis a sum does not reject (the units' no mean, the SN prior), so by D1 model 6's error guarantee did not rest on it. D16: a model whose measurement was wrong is superseded, not amended; model 6's freeze and report stand as a reading of model 6 with the reader of its entry, its corpus is spent and is not read for model 7, and the calibration is not held at the old reading. D17: a validation corpus is read only under the model number and digest a freeze registered it for. D18: a freeze's digest covers the development corpus's counts as well as the parameters, and the freezing entry names the reader's commit. The next validation corpus is 59 new groups a side, collected by a session that took no part in the model; the 58 spent captures do not join the development corpus in this step (owner). Fields 68 and session table 13 carry the values.
'''

changes = '''
wz-session-core: BatchParse::fails_the_frames_batch; walk_unit counts a unit whose Frame's records fail the batch as not read whole; unit_reads_whole asks the same rule through frame_reach; tests of each case. wz-capture zenoh_evidence: MODEL 7; freeze module (the registry of freezes with model 6's digest and corpus, the seal, the digest over the model and the development corpus's counts) with tests of the seal and the registry. zenoh_validation_tests reads a corpus only under its frozen digest. zenoh_calibration_generated regenerated; the renderer names the model number. doc_revision: fields 68, session table 13. The session table examples (session_table_tests, wz-capi-dissect's test, wz_dissect.h, the C consumer) state model 7, the regenerated sums and the new revisions. docs/flow-zenoh-verdict.md section 6.14.
'''

verification = '''
On pc2, on the integration branch that merged this work with the codec and dissect work before it: scripts/regen-calibration.sh wrote the calibration both halves of the rule give (no zenoh unit of the corpus moved, 49505 read whole; four more null members moved from whole to residual; the null bounds, regions and priors other than the units' no mean and the SN prior are model 6's). The freeze test printed model 7 as unfrozen with digest 0x4c22e97f942204dc; wz-capture's zenoh_evidence tests passed without default features (13). In that run wz-capture with lz4 failed five tests and wz-capi-dissect one (1837 and 246 passed), and the C consumer stopped at the session table's opening, each on a pinned value; the pins were then set to that run's output: the units' no part is 4.0516 bits a unit (row 96414 and 32413, flow 121519 and 40516, the C ABI row 17927 and 16207, the C consumer 13696 and 12155). Generated mDNS flows read 4151 units whole of 54600 where they read 8847, and none of ten reaches half. The raweth sample's Frame carried 0xDE 0xAD, which upstream drops; it now carries an OAM record. INTEGRATOR: add the run of the tip that carries these settings, with the refreshed raweth capture.
'''

carry = '''
Model 7 is not frozen. Next: the freezing entry (digest, reader commit, corpus path in zenoh_evidence::freeze), then 59 new groups a side collected after it by a session that took no part in the model, read once (doc 6.14). A lowlatency unit is still read as one network message where upstream reads a run of them until the unit ends; that is its own step. The consumer is told model 7, fields 68 and session table 13.
'''
