impact = ["watching-zenoh/local-ci-gates"]

decision = '''
The pre-push hook now reads what each ref of a push IS before it grades it, and gate 0p lets a clone marked as the queue integrator's push to main. This is the third step of moving the push queue to the bx landing queue. Until now the hook read one kind of push, a branch, with the last ref of the push as its range. An integrator's push is one atomic transaction that carries several kinds at once (the branch, the queue's log, the deletion of the item refs it has finished), and reading the last ref there grades the log's chain as though it were the branch. A submitted item and the log are also published to the public origin before anything lands, so what makes a publication irreversible has to apply to them.

Each ref is classified (scripts/lib/push-refs.sh): main, a queue item, the queue's log or lease, or another ref. A queue ref gets the three public gates and nothing else, over exactly what it adds: the confidential vocabulary, a line naming a home directory, an identity that must not be public. The repository's own gates (schema pin, SSOT, tests) are not run on it, because an item is judged by the integrator on the tip it will land on and the log is no repository content. A ref whose range cannot be bounded is refused, since an ungraded public push is what these gates exist to stop. An unknown name in the queue's namespace is graded as a record, the strictest reading. A push of only queue refs ends after those gates; a push that also carries the branch continues with the branch's range, which no longer includes the queue refs.

A chain that is new, or whose old value this clone does not hold, has no base to subtract, and a bare tip is no range: git diff of a bare tip compares with the working tree, which graded a log chain against the checkout and blocked it for text it did not contain. Such a chain is graded from an empty base commit (fixed identity and dates, so the same object everywhere, reachable from no ref), which makes "everything the chain holds" an ordinary base..tip range for all three gates.

Gate 0p accepts a push to main when the clone's configuration says it is the integrator's (wz.land-integrator, a boolean the owner sets where the service runs); otherwise the lock and token logic is unchanged. The marker is a clone fact and not part of any item, so it does not make a verdict depend on the item's author; it is spoofable, and the real wall is the server's ruleset, to be enabled after a week of the queue without it.
'''

changes = '''
scripts/lib/push-refs.sh (new): wz_push_ref_kind (main, queue-items, queue-log, other; both refs/bx-land and refs/heads/bx-land forms), wz_queue_push_range (items: the branch's tip to the item; log and lease: the remote's value to the pushed one, or the empty base for a new chain or an old value this clone lacks) and wz_empty_base. .githooks/pre-push: sources it, classifies each non-delete ref, collects queue refs apart from the branch's push list, runs the three public gates over each queue ref's range, ends when only queue refs were pushed, and gate 0p accepts the integrator marker. scripts/run-ci.sh: Layer C0i arms for the nine ref names, the item and log ranges, the empty base of a new chain (parentless, empty tree) and the refusal of an item with no branch to bound it. CLAUDE.md and docs/agent-reference.md: one sentence on the marker and the queue refs.
'''

verification = '''
The real hook was driven with synthetic push lines (nothing was pushed). An item ref with an empty range: exit 0. A new log chain whose first commit names the home directory: exit 1 at the queue-refs gate, naming the commit and the home-path rule, with the vocabulary gate clean over exactly that commit. The same case before the empty-base fix exited 1 for the wrong reason (it graded the chain against the checkout and listed existing ledger text), which is what led to the fix. A push to main with no lock and no marker: the unchanged gate 0p refusal. The marker set, with a main line, a log line holding a clean orphan commit and a deletion line in one input: the three public gates passed on the log, gate 0p reported the integrator, the main line was graded over its own range, the deletion was skipped, exit 0. A log commit by an identity the repository does not accept was refused by the identity gate on a queue ref. wz_queue_push_range output checked by hand for a new chain (an empty-tree parentless base). shellcheck reports nothing for push-refs.sh or the hook; run-ci.sh reports only the existing source-following notes. Not done: the Layer C0i arms were not run through run-ci.sh (that layer does not go green on this machine), and no real push of a queue ref was made.
'''

carry = '''
Open: bx records the submitting worktree's absolute path in the public log, so gate 0b2 will refuse the log push of a submit from this machine until bx records something that is not a path or the owner accepts publishing it; there is no [land] section and no integrator service yet, and writing to refs/bx-land waits for the owner to widen the push permission in the private instruction file; the integrator clone needs wz.land-integrator set at install; which tools read the round number from a commit subject has to be checked before the integrator is turned on, since the derived commit's subject is fixed and carries no number; the bx action validator accepts an action whose outputs another action reads as inputs, which the RFC text says it refuses.
'''
