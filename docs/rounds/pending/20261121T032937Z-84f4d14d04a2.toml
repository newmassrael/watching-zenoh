impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport"]
decision = '''
A group session of the demo's sessions file now binds its link in upstream's shape: the group is read on a joined socket and the session sends from a socket of its own on an ephemeral port. It bound the scouting shape, one joined socket that also sends, so every member on a host sent from the group's port. The group keys a member by the address its datagrams come from, so two members on one address were one row: the subject admitted the first Join it heard and took the other's as that row's refresh, and the second member never arrived. That is Layer M's re-join red: after the re-join the member started late and the member re-joining shared one address, and the leg passed only when the late one was heard first. Measured in a namespace: the subject heard both members' Joins from one address, 387 taken as refreshes. A second leg now starts two members on one address together and requires both.
'''
changes = '''
- `crates/wz-ap-demo/src/sessions_run.rs`: `run_group` binds `UdpDriver::bind_multicast_link` in place of `bind_multicast`, as the router's group face does.
- `wz_ap_demo_group_rejoin_netns.rs`: `in_a_netns_two_group_members_on_one_address_are_both_admitted`; `run-ci.sh` Layer M guards the file at 2.
- `docs/reason-review-pins.md`: the three `session-close-ingress` rows name Round 4577, the round that read them.
'''
verification = '''
- The re-join leg failed 5 of 6 runs before the fix in a local namespace and passed 8 of 8 after; the file's two legs passed 5 of 5 together.
- With the old bind the new leg failed 3 of 3 (the later member never arrived), so it is not green from the start.
- Layer M passes locally with the pinned zenohd (the pico CLI leg skips, no CLI built); wz-ap-demo `sessions_run` 8 tests and clippy of wz-ap-demo and wz-integration-tests pass.
- Static bundle (one red is another round's, already repaid), upstream citation, reason pins, count guard 17 of 17 and leg ledger pass.
'''
carry = '''
- A Join from a known address with another zid: wz replaces the member in place and announces neither departure nor arrival; upstream zenoh ignores that Join as inconsistent, zenoh-pico keeps the member and its zid. A parity item of the group admission, not this round's seam.
- C1cc shm threshold flake and Layer Z TLS close-on-expiry, as before.
'''
