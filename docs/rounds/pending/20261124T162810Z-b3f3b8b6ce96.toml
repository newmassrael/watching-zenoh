impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-6-keyexpr", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "watching-zenoh/local-ci-gates"]
decision = '''
The pico C ABI release (coop engine, nostd, profile host-peer-ext) moves toward the target architecture of docs/c-abi-architecture.md in one integration: session state that two layers held is held once, in session-core; what a session needs after open is reserved at open; and the bodies the release links are read off its own disassembly rather than assumed.

Session layer (6d-2): the round of deliveries, the get plane and the query plane move into wz-session-core behind associated-type seams (RoundCalls, GetCalls, PlaneCalls, Presence), with no cfg in session-core; the DeliveryRound seam is gone; a declaration watch's events are round records, so the coop delivery lane's ring, turn and settle are removed and MAX_DECL_WATCH_EVENTS with them. Duplicated facts are folded: a matching verdict is owed in its listener's row, the replay pace is one session value, a subscriber's and a queryable's key declaration and entity id are held only by the session-core row, and what a retraction names is the row's. Kept queries are reached by id on every engine (HeldSlab for the heap engines; the pico copy owns its texts in the process pools and holds a Weak session), and the HeldQuery trait is removed.

Transport and driver: TransportState moved to wz-runtime-coop; start_wire splits into the transport's make_wire and the session's LinkCalls; a link's ends are lent as facts and written as text only by a reader; the session's facts sit under one lock with the handshake facts in one row, and a handshake step takes them in one hold; a lent handshake message is written once; a client that does not listen keys its reassembly chains by channel alone.

Heap after open: a link's halves are placed in an arena cell (written in place), the admission flag, read waits, slot waits, the read task's start, link admission rows, face watcher rows (bounded, with a loss told and a pico listener re-synchronised) and a thread delivering beside the owner (an intrusive list in its own frame) take no heap. Layer C1nh reads 63 families with none failing; its 14 unfilled rows are filled from the gate's output.

Size: hashbrown and the IPv6 text leave the release, keyexpr matching is one generated relation (keyexpr_relation.scxml), the canon walk is one walk, and the doors and the coop open stop re-making and copying engine facts. The size ledger reads 1.76 times zenoh-pico in total (from 1.89), keyexpr 0.94, and every ratchet row moves down. Totality debt falls from 23 to 4 lint cells; TD-023's policy generator emits total code.
'''
changes = '''
crates/wz-session-core: round.rs, get_plane.rs, query_plane.rs, plane_lock.rs, face_plane.rs, pending_get.rs and their tests; session_actions.rs (SessionFacts, HandshakeFacts, HalvesMaking, build_held); link.rs (link_ends); link_admission.rs (rows reserved at open); keyexpr_canon.rs, keyexpr_match.rs; slot_map.rs; session_tables.rs (Retraction, owed matching); signing_key.rs (KeyBlock); policy.rs and policy_binding.rs.
crates/wz-runtime-coop: transport/state.rs (TransportState, make_wire, walk_dials, LinkCalls), link_cells.rs (one non-generic cell body, halves in place), stream_link.rs (one send body), faces.rs, locator_text.rs.
crates/wz-capi-coop: engine.rs and engine/* (deliveries intrusive list, registry, replay, decl_watch, query, get, told), arena.rs (vacant + count in place).
crates/wz-capi-port: HeldSlab, face_rows.rs, WireKey holds, KeyHold ids, lodge.
crates/wz-capi-pico: query.rs, connectivity.rs (told rows, catch-up), bytes.rs (ByteBuf as start, len, block), pubsub.rs, get.rs, write_filter.rs, object_slot.rs, process_pool.rs, encoding.rs, session.rs; tests/no_heap_after_open.rs (sites over the counted windows).
crates/wz-capi-core, wz-zenoh, wz-runtime-tokio, wz-capture, wz-ext-pubsub, wz-session-mcu: follow the port and link contracts.
sources/algorithms/keyexpr_relation.scxml and out/wz-session-core/keyexpr_relation.rs replace the two keyexpr documents; xtask stage1 lists it.
deploy/wz-config.toml: MAX_FACE_WATCH_ROWS, MAX_CONNECTIVITY_TOLD_ROWS added, MAX_DECL_WATCH_EVENTS and HELD_QUERY_PARAMS_BYTES removed, generated files regenerated; deploy/size_ledger.json and deploy/no_heap_ratchet.json rows from their gates; docs/c-abi-architecture.md register; docs/reason-review-pins.md; docs/zenoh-logic-as-sce-kinds census rows; scripts/lib/wz_config.py, totality_debt_gate.py, upstream_citation_anchor_gate.py.
Store: inventory keyexpr-includes and keyexpr-intersect re-filed with source sources/algorithms/keyexpr_relation.scxml.
'''
