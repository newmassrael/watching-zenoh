impact = ["rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.a-new-kind-algorithm", "session-fsm--prose-level-sketch/3-1-multicast-session-level-states", "rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.j-codegen-backend-coverage"]
decision = '''
Three of the eight wz-side divergences the logic-to-SCE census recorded (docs/zenoh-logic-as-sce-kinds.md section 7) are repaid. W2: the keyexpr matcher's facts scan, which docs/query-answer-path.md L0 named as an SCE algorithm that never existed, is now sources/algorithms/key_facts.scxml returning the record of key_facts_schema.scxml, and KeyFacts::of calls the generated function. W6: three places said SCE has no <parallel>; the pinned SCE has it, and the multicast Running leaf is a choice of the document. W8: the stale generator the census ran was a hand run, and reading the provenance gate found that the shell gate and verify-codegen named the binary at the checkout path while build-sce.sh and the Rust door place it by the artifact-root rule; the oracle library now states the place once. W1, W3 and W7 stay open with the next step named; W4 and W5 are recorded as gaps of SCE kinds.
'''
changes = '''
`sources/algorithms/key_facts.scxml`, `key_facts_schema.scxml` (new); `out/wz-session-core/key_facts.rs`, `key_facts_schema.rs` (generated); `crates/wz-session-core/src/keyexpr_match.rs`: `KeyFacts::of` calls the generated scan, the oracle test gains two multi-byte keys; `crates/wz-codegen-build/src/lib.rs`: `Codegen::emit_event_schema`; `xtask/src/main.rs`: the two emits.
`crates/wz-runtime-tokio/src/multicast_glue.rs`, `crates/wz-session-core/src/multicast_dispatch.rs`, `sources/session/session_fsm_multicast.scxml`: the `<parallel>` sentences; `out/wz-session-core/*_sm.rs`, `tick_elapsed.rs`, `tick_until_due.rs`: source hash and line maps regenerated.
`scripts/lib/sce-codegen-oracle.sh`: `WZ_SCE_CODEGEN_BIN` and `WZ_SCE_CODEGEN_STAMP` by `wz_artifact_dir`, absolute; `scripts/build-sce.sh`, `scripts/verify-codegen.sh` read them.
`docs/query-answer-path.md` L0 as built; `docs/zenoh-logic-as-sce-kinds.md` section 7.1.
'''
verification = '''
The generator was built at the pin and reports it (`sce-codegen --version`); `verify-codegen.sh` emits both new documents on all six backends. `scripts/regen-codegen.sh` regenerated `out/`, and Layer B2 reads the committed `out/` equal to a fresh regeneration. wz-session-core `keyexpr_match` tests: 25 with the default features and 14 without (the fixed backing, where the depth bound is judged), the facts oracle test among them. clippy -D warnings of wz-session-core (all targets), wz-codegen-build, wz-runtime-tokio and xtask. Layer 0 (shellcheck 75 files, actionlint), Layer B (key_facts and key_facts_schema OK), the hook's 150 round-fed static gates, the upstream citation anchors and the guarded-count gate over the range (5 of 5). The oracle library resolves the binary to the checkout path with no artifact root and under the root with one.
'''
carry = '''
W7: one `_time` grammar in wz-session-core `selector_params` (no_std, instant as seconds and nanoseconds, resolved against a given now), read by wz-ext-pubsub and the upstream-shaped wz-zenoh-util type; the two disagree today on a fixed start with a negative `;` duration. W1: the keyexpr matcher as an algorithm over chunk offsets, landed with the stack gate and the kit's query-path reading. W3: the hand copy of the upstream codec, not yet scoped. W4 and W5: a pool's run-time lend contract and a link that lends its transmit slot, for the SCE session to judge as catalogue entries. The text of the fixed images with the generated scan is read by hosted Layer C1cs.
'''
