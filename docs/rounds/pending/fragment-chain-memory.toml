impact = ["wire-spec-subset--watching-zenoh-mvp/6-zenoh-payload-layer"]

decision = '''
The memory matrix's two fragment-chain cases went red with round 4452 and further with 4454, for two defects. First, the report left a structure out: the chains that ended without closing (4454) were a deque of 120-byte entries beside the list's chain facts, and `ListMemory::chains` did not count it, so the dissection held 122,880 bytes per doubling of that deque that it did not report. Second, a fragment row's chain fact (4452) grew from a 32-byte map slot (outcome and identity) to a 104-byte one: the fragment's sequence number and length, which its frame carries; its place in the chain twice over (index and offset, and the same two again as what the chain held before it, with the previous sequence number); and, on an abort, what the chain had staged, which is a fact of the chain and was also kept in its ended entry. Both are now kept as the repository keeps rare and per-row facts elsewhere, as packed columns (`column_log`, as the index entries are since round D10). A row keeps its produced-index, its outcome with its reason, its chain's identity (as the count of identities minted and the distance back from the newest, since two conduits' chains interleave and an identity alone does not rise), and its index and offset; its sequence number and length are read off the row's frame by `MessageList::chain_of`, which now takes it, and what an aborted chain had staged is read off the chain's ended entry, found by the produced-index its rows end below. An ended chain is one row of eight columns (rows end, identity, a word that packs the key, the ending, its reason and the head's flags and MID, staged fragments and bytes, first and last sequence number, the head's key id), and the suffix of the key its head names, when it has one, sits beside them by entry number. The report counts every structure: the two column logs, the suffixes with their slots, and both folds (open chains with the suffix each head owns, each key's boundary, ended chains not yet handed on). `ChainFact::before` is gone: on a staged row its index and offset already say what the chain held before it, and only an abort reads it, as `held_at_abort`. Every fact the field document writes (revisions 62 and 63) is read from the same values as before, so no document byte moves. No ceiling moved.
'''

changes = '''
crates/wz-session-core/src/passive_messages.rs: `ChainRows` and `EndedChains` (packed columns, suffixes beside), the outcome and reason codes, `ChainFold::allocated_bytes`, `ChainFact::held_at_abort` in place of `before`, `chain_of` takes the row's frame, `ended_chains` yields chains read out of the columns, the report counts all of it; tests for the codes, a chain row read back and an ended chain read back.
crates/wz-capture/src/fields_json.rs: the chain half of a row passes its frame and reads `held_at_abort`.
'''

verification = '''
Not measured when this round was written: the build and the tests were not run by the session that made the change, and the figures below are to be filled from the build machine before landing. Expected by the arithmetic of the structures, not measured: a fragment row's chain fact from 104 bytes (32 before round 4452) to about 7 in a chunk of dense fragments, and an ended chain from 120 bytes to about 16, so the four fragment-chain cases fall below their pre-4452 figures (udp 95.2 handed, 75.3 lent; tcp 110.6, 90.8) and the bytes held and not counted to 0. Measured before this change on main: udp handed 208.44 B/row, lent 188.56, tcp handed 223.98, lent 204.10, 122,880 bytes held and not counted.
'''

carry = '''
The chain-sequence fixtures write a fragment's sequence number as one raw byte, which is not a VLE for 128 and above, so a capture of more than 64 chains garbles half its fragments' numbers and ends those chains without closing; the memory matrix's fragment-chain cases measure that mixture and not the completed chains their table names. The table of measured values in `memory_matrix.rs` is to be read again with this change.
'''
