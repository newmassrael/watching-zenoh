impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The all-or-none publish of multi-route-atomic-tx, which was reachable only from the registry, is reachable from the Rust API behind a non-default crate feature, atomic-publish, as the link set and the retry are behind theirs. A publisher and the put and delete a session makes take .all_links_or_none(). The method takes no argument: the form is only ever stated, never stated as false, so an unstated publish keeps exactly the path it had. The value is a bool stored in the builder, carried by the declared publisher, threaded through the session's publish path into the engine-facing request, and set on the options struct the registry already reads (PublishOptions::with_atomic_tx). The registry side needed nothing: the two-phase reservation already reads the field, so only the front half was missing.

A statement is refused at the point the builder resolves when the build's policy is off, with the policy's own sentence, by calling atomic_tx::admit_in_build. The refusal comes at the declaration of a publisher and again at each put or delete made through it, so a handle cannot outlive the refusal. The router engine reads no reservation and refuses a stated publish with its own sentence, at declaration and at use, rather than sending it to each face on its own terms without saying so. A publish that states both a retry and all-or-none hands both to the engine, which reserves again after the delay.

The decision that was not obvious is the value type. The retry is an empty type in a build without an engine because it carries numbers that only an engine reads; all-or-none carries none, so a plain bool is the same value in every build and needs no second definition, and the admit function of a build without an engine accepts it because the feature that states it implies the engine.
'''

changes = '''
crates/wz-zenoh: the manifest gets the feature atomic-publish; the sample module gets the stored type, its unstated value and admit_atomic, which calls the policy's admit_in_build; the publisher builder gets an atomic field and all_links_or_none (on it and on the put and delete builders over it), the publisher handle keeps the value and every put, delete and sink send passes it; the session module adds the value to the publication and to the publisher declaration, checks it after the closed-session test in the declaration and in the publish, refuses it in the router engine arms with refuse_atomic, sets it on the engine's options, and adds eleven tests beside the retry ones; the admin module passes the unstated value. docs/build-configuration.md: the bullet of the switch says it is reachable from the Rust API behind atomic-publish and keeps the statement that no C API states it.
'''

verification = '''
Not built and not run when this round was written: the author of the change could edit and commit but not build, so the merge session owns every result. The tests added in the session module of crates/wz-zenoh (counted by the run, not by this list) are: a publication asks the engine for all-or-none when it states it, for a put and a delete; a publication stating both a retry and all-or-none passes both, and each alone passes only itself; a builder states no all-or-none until told; nothing stated is admitted whatever the policy; all-or-none stated is admitted only when the policy is on; a put, a delete and a publisher stating it, and the declared publisher's own operations, are made only when the policy is on; a put stating both names whichever policy is off; the router engine refuses it from the helper and from the declaration; and, with the feature atomic-publish, all_links_or_none states the value on each builder and is refused by a build without the policy, with a further test when admission-retry is also on that both statements stand on one builder. Those tests branch on the build's own policy value, so they hold in a policy-on build as well, which was not built.
'''

carry = '''
Open: the C ABI does not state the form; the cooperative engine and lwIP do not read it; the declared publisher's matching status is unchanged; the handle has no setter after declaration; the builds with the new feature, with it and admission-retry together, and with no engine, were not compiled when this round was written; the upstream arm of the public-surface gate was not run and should not move because the feature is off by default. The door waits for the namespace for wz extensions to leave the feature gate.
'''
