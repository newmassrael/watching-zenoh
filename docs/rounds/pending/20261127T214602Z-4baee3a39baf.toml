decision = '''
Land integration i: the lanes of the C ABI's layer walk that verified green on their own, merged once, with the size rows they read under made tighter.

The structure is the layer walk's: one table set the engine and the core both read (L3), one writer for every declaration a multicast group sends, a publish's statements and a reply's staging as features of the session core, the on-use preset's engine and rooms held apart from its arena with one owner that frees them, and the handshake's region extensions, a dial's address reader and a later-answered dial as pico capabilities rather than fixed parts of the build. Each lane's design note records the steps it carried and why the rest wait.

Main's red on a history subscriber's token answer (a held token's Interest the core cannot answer) is repaid here at its cause: the coop engine answers it where the core has no row. The per-feature gate read the connectivity forward of wz-capi-coop off a line that moved, and now reads the forward itself. The area rows of the size ledger and the pico host ceilings move down to what this build measures, so a later growth is refused rather than absorbed.
'''
changes = '''
crates/wz-session-core: one writer for a group's declarations, a publish's statements and every reply of a responder staged in one body, link admission only where named, a token reply written as a declaration of its kind, a dropped frame's chain abort kept a call. crates/wz-capi-coop: the on-use session's engine and rooms held apart from the arena with one owner, a plain put planned and sent from its facts at one site, subscribers numbered by their row id, a held token's Interest answered by the engine. crates/wz-capi-pico: the engine's config built where the input holds it, an open's keys read once. crates/wz-runtime-coop: a held value's memory claimed before it is made, the Router key form held 'static. crates/wz-runtime-posix: a scout window's lost members dropped in one pass.
Kconfig and generated outputs: region extensions, dial address reader and later-answered dial as pico capabilities (wz_config and sce_feature_model regenerated). scripts/lib/nondefault_feature_legs_gate.py reads the coop connectivity forward. deploy/size_ledger.json and deploy/pico_host_ceiling.json tightened. docs/c-abi design notes (L3 fold, R1 premises, on-use plan, closed link set, group walk), docs/codec and docs/win-budget per-feature readings, docs/reason-review-pins.md re-reads session-close-ingress against drive.rs and session_actions.rs.
crates/wz-capi-coop: links = "wz_capi_coop", its build script states whether the table of engines is built; crates/wz-capi-pico/build.rs reads it as cfg(wz_engine_rows), and the declared key's test reaches its session's handle only there.
'''
