impact = ["wire-spec-subset--watching-zenoh-mvp/6-zenoh-payload-layer"]

decision = '''
The selector language gains four fixed fields that read the end-to-end judge's verdict on a record: `e2e`, `e2e.crc`, `e2e.counter` and `e2e.timeout`, each with a closed set of words. Before this round the verdict was written only into the field document's `e2e` block, so a reader who wanted the frames whose CRC failed had to open every row; `e2e` as a selector word was refused as an unknown field. (1) The words are made in one place, `e2e_words::E2eWords::of`, from the judge's outcome, and each restates a fact of the block: `e2e.crc` is `crc_error` (`ok`, `error`), `e2e.counter` is `counter_reason` (`none`, `repeat`, `out_of_range`) or `unjudged`, `e2e.timeout` is `timeout_error` (`ok`, `error`) or `unjudged`, and `e2e` is all three (`ok`, `error`, `unjudged`, `none`). Not judged is not failed: the counter of a slot's first frame and of a frame whose CRC did not match, every part but the CRC for a sender the capture never named, and the timeout of a frame whose packet carried no time read `unjudged`, never `error`, so `e2e == error` is the selector for failures and the first frame of every stream is not among them. A payload shorter than the profile's header is `error` (damage); one that is not a run of bytes this reader holds is `unjudged`. (2) A record that carries no frame (a key no profile rule covers, a del, a query, a reply, a request) reads `e2e == none`, decided on every plane with no declarations needed, and carries no part: `e2e.crc == ok` is `no` over it, `!=` is `yes`, as a path the walked tree lacks answers. Whether a published sample is a frame is undecidable only where the judge could not be asked: a door handed no declarations, and a sample whose key did not resolve. (3) A frame's verdict depends on the frames of its slot before it, so the payload plane judges: handed declarations and a selector that names an `e2e` term, it judges every published sample as it walks the capture, in capture order, with the same profile, slot and counter judge the block is written from (`e2e_plane`). The rules are copied into the fold (`JudgingRules`), because a fold is kept between calls and the declarations are text of one call; the rule a key falls to is found by the function the declarations themselves now use (`formats::first_covering`, `first_segment_covering`), so the copy cannot give a key to another rule. A segment rule's piece is read first, as the field document reads it: a piece that completes its message hands the joined message to the judge, and one that completes none carries no frame. (4) A payload plane handed declarations now reads a reference the wire does not answer under the key they fix for its id, as the field document's rows and the values door already do; before, a field document handed `#%id=key` lines printed the fixed key on a row whose `key` term the selector could not decide. (5) The field documents, which take declarations, decide the `e2e` terms. The selection doors, the selected-packets door and the census doors take none, so over them every `e2e` term on a published sample is undecided and never `no`; a selection door that takes declarations is the next round. The selector field list (revision 6) and the selector verdict (revision 10) carry the four fields, and the C header's language table states them.
'''

changes = '''
crates/wz-capture/src/e2e_words.rs: new. The four fields' closed words and their reduction from the judge's outcome.
crates/wz-capture/src/e2e_plane.rs: new. The payload plane's judge: the owned rules, the slot and piece ledgers, a sample judged piece first, then frame.
crates/wz-capture/src/filter.rs: the four fields, the term, its evaluation and its answer over a row with no record, `reads_e2e`, `RecordView::e2e`, the module's table and section.
crates/wz-capture/src/payload.rs: the fold keeps the judge and is read by declarations (`read_by`, `payloads_read_by`); a published sample is judged before the selector is asked; one matcher for format and segment rules; `FormatMap::judging_rules`.
crates/wz-capture/src/fields_json.rs: `judged_by` takes the declarations the document was handed; selection_json.rs, selected_packets.rs: they hand none.
crates/wz-capture/src/agg.rs, exchange.rs, row_plane.rs, selector_term/soundness.rs: each view says what it knows of a frame.
crates/wz-capture/src/e2e_slots.rs: the ledger is `Clone`, as a kept fold is.
crates/wz-capture/src/payload_decode.rs: `Declarations::map`.
crates/wz-capture/src/doc_revision.rs: selector field list 6, selector verdict 10.
crates/wz-capture/src/e2e_selector_tests.rs: new; e2e_row_tests.rs: its builders widened to the crate.
crates/wz-capi-dissect/include/wz_dissect.h: the language table and the field list's revision.
crates/wz-capi-dissect/src/lib.rs: the selector verdict's revision; the header-language gate reads the parser's field name grammar and probes the four fields' words.
crates/wz-capi-dissect/tests/c_abi_consumer.c: the selector verdict's and the field list's revisions.
'''

verification = '''
cargo check -p wz-capture --tests with dissect,fixtures, default, and --no-default-features (remote): the first refused one record view the field had not reached (`selector_term/soundness.rs`, the path oracle's view, which reads no frame: `e2e: None`); the other two compiled.
cargo test -p wz-capture --lib (remote): dissect,fixtures 1773 passed, 0 failed, 6 ignored; default 1340 passed, 0 failed, 6 ignored. The five `e2e_selector_tests` ran and passed in the first.
cargo test -p wz-capi-dissect (remote): the header's selector-language gate first refused the table, reading 27 of the parser's 31 fields: its row reader took a name of lower-case letters and `_` only, and `e2e.crc` has a digit and a dot. The reader now takes the parser's name grammar, every row is probed with a value well formed for its field, and the four fields' closed words are probed both ways as `dir`, `kind` and `closed` are. Rerun: lib 233 passed, 0 failed, 3 ignored; the C consumer and the other integration tests 4 passed.
cargo clippy -D warnings per crate (remote): wz-capture default --tests, --no-default-features and wz-capi-dissect --tests clean; wz-capture dissect,fixtures --tests refused one complex type in the new tests, given a name. Rerun of that leg and of wz-capi-dissect --tests: clean.
Static gates run locally: doc-revision-consumer-pin first refused the C consumer's field list pin at 5 (now 6); accessor-reach-census first refused `cargo doc` over four public doc links to private modules (now named as code, as the crate names `crate::e2e_row` elsewhere), then passed; reason-citation, store-reason-citation, reason-review-pin, discard-site, discarded-evidence, dissect feature and name censuses, analysis-surface parity, bound names, door header, replay vocabulary, unknown-value policy and JSON integer cell gates pass. The ABI pin and header subsumption gates read a built release library and were not run; no symbol moves. cargo fmt --check clean.
'''

carry = '''
(1) A selection door that takes declarations, so a narrowed packet list can use the `e2e` fields: an ABI addition, with the selection memory keyed by the selector and the declarations' judging text. (2) The field document's block still walks one flow at a time while the payload plane judges in capture order, so for a slot whose frames are spread over two flows the block and the words can part over the second flow's frames; the block is to be read from the plane, which retires the field walker's own judging and its cross-list re-walk.
'''
