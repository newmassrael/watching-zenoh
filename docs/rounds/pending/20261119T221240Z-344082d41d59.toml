impact = ["rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.a-new-kind-algorithm", "rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.j-codegen-backend-coverage"]
decision = '''
The logic census's crate table held every crate to a slice, and that check passed while about 45,000 lines of production Rust were cited by no slice's row: S7 named `wz-capi-pico` and its rows never reached the end-to-end, replay, key-id, catalogue and stream-supervision doors; the application transport of the session core and both runtimes had no row anywhere; S6 counted whole upstream-shaped crates in rows that cited a few of their files; and the application frame layer watching-zenoh-79's proof of concept moved into `wz-app-frame` (the `.proto` reader, instance keys, the message catalogue, end-to-end receive and send, segment joining, replay) had arrived after S10 was read. A crate row says a slice read the crate, not that it read each file. So the census now holds files too: `files.md` has one row per tracked `.rs` file under `src/` of every crate a slice reads, naming the slices one of whose rows cites it or an exclusion with its reason, and the coverage gate fails on a file no row cites. Two slices classify what was missing, S11 (the application frame layer, its replay and the eight SCE documents written for it, all generated and called) and S12 (the application transport, stream supervision, key ids and the zenoh-pico doors); a file-level pass cited each upstream-shaped file in the S6 row that already counted it and added three rows where none did.
'''
changes = '''
New `docs/zenoh-logic-as-sce-kinds/S11.md` (38 rows) and `S12.md` (43 rows), and `files.md` (1,155 files: 1,091 cited by a slice's rows, 64 excluded as test-only with a reason). `scripts/lib/logic_census_coverage_gate.py` checks the file table beside the crate table, with 17 new selftest cases. S6 cites each file its rows count and gains rows 94 and 95 (the SHM client, SHM ids and glue); S5 row 66, S7 rows 63 and 105 and S10 row 56 cite the files they already counted; S10 gains row 85 (`wz-session-mcu` `latest.rs`, which S5 had wrongly skipped as test-only, corrected there) and row 2 notes that the counter step is generated since. `crates.md` names S11 and S12 for the five crates they read. The main document's totals become 565k lines (K 85k, G 202k, S 79k, X 155k), the gap catalogue counts the new rows, section 7.3 records four findings on the wz side (two hand-written counter rollover rules, the message catalogue stated three times, a stale count in `xtask regen`, two doors that call the program under their own lock), and section 8 two open points.
'''
verification = '''
The coverage gate passes on this tree: 99 crates (62 read by a slice, 37 excluded) and 1,155 files of the read crates (1,091 cited by a slice's rows, 64 excluded with a reason); its selftest passes all cases, the 17 file-level ones among them. On the real tables, renaming one cited path in S12 and adding an untracked file to the population each turn it red with the file named, and the census before this round has 152 files no row cites. The per-slice table of the main document adds up to its totals, and the gap catalogue's counts for S7 to S12 match a count of the slices' rows. Every `crates/...rs:N` citation S11 and S12 make was checked to name an existing line by the agents that wrote them. All 152 round-fed static gates pass on this tree, and the upstream citation gate passes. No code changed.
'''
carry = '''
Every new `.rs` file under `src/` of a crate a slice reads is now a red of the coverage gate until a slice's row cites it and `files.md` names that slice; the sessions that add such files are told. Short-form citations of S1 to S6 (`lib.rs:120`) are accepted as the slice's word and cannot tell two crates' files of the same name apart; rewriting them as full paths would close that. Rows cite lines as they stood when read; line drift is not checked. U15's owner decision (a deployment's layout as a codec document, or a run-time layout kind) now also covers S11's `.proto` schemas.
'''
