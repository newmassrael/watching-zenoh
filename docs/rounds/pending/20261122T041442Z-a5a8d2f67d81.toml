impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-27-api-compat", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-13-runtime"]
decision = '''
The cooperative engine panicked when the system gave its read task no thread (census W11), and `zp_start_read_task` caught no panic, so the process aborted where zenoh-pico answers the error its task creation reported (`vendor/zenoh-pico/src/system/unix/system.c` @ `_Z_CHECK_SYS_ERR(pthread_create(task, attr, fun, arg));`); `z_open` also ignored what its start of the read task answered, where pico's open fails with it and drops the session (`vendor/zenoh-pico/src/api/api.c` @ `_Z_CLEAN_RETURN_IF_ERR(_z_runtime_start(`). The port's start now answers `ReadTaskStartRefused`, with `NoThread` beside the old refusal from the task's own thread; the engine leaves the task not running so a later start tries again, the pico ABI returns `_Z_ERR_SYSTEM_GENERIC` for it, and `z_open` fails and drops the session. The thread is made by a function the start is handed, so a test hands one that gives none, with no test hook in the library. A sweep of the four C ABI crates' exports found eight bodies with a panic source of their own and no guard, each bounded by a check or a fixed literal; a panic in a callee, as this one was, is visible only to a link-time check, which is watching-zenoh-1e's no-panic gate.
'''
changes = '''
- crates/wz-capi-port/src/drive.rs: `ReadTaskStartRefused` (`CalledFromReadTask`, `NoThread`); `SessionDrive::start_read_task` answers it.
- crates/wz-capi-coop/src/engine.rs: `start_reader` takes the thread maker and answers `NoThread` instead of panicking; crates/wz-capi-core/src/engine_port.rs follows the type.
- crates/wz-capi-pico/src/session.rs: `zp_start_read_task` is guarded and returns `_Z_ERR_SYSTEM_GENERIC` for `NoThread`; `z_open` fails and drops the session when the start fails.
- docs/zenoh-logic-as-sce-kinds.md and S7.md: W11 recorded as fixed; W9 compared with upstream's order (listener first, then history).
'''
verification = '''
- On build hosts: the new coop test (a start given no thread is refused, the session stays open, a later start runs the task) 1 passed; the pico code test 1 passed; the pico lane on the cooperative engine (engine-coop, peer, multi-thread, link-udp, query, queryable, liveliness) 153 and 21 passed.
- clippy -D warnings with all targets for wz-capi-pico (default and the cooperative set), wz-capi-coop, wz-capi-core and wz-capi-port; rustfmt --check of the changed files; the pre-push hook's round-fed gates 169 of 170, the one red being main's own (`feature_gate_diagnostic.py`, wz-app-frame `sce-generated-codec`, owned by watching-zenoh-43 [0cf154]).
'''
carry = '''
- W9 (zenoh-c event listener reports history before installing its watch) is to be fixed: watch and snapshot under one lock, history delivered before any live event.
- W10 (`register_bindings` restates the switchboard sidecar's rows) is to be generated from the sidecar.
'''
