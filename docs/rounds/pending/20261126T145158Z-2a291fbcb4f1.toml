impact = ["watching-zenoh/local-ci-gates", "watching-zenoh/build-and-verify", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-3-coherence"]
decision = '''
Repay the reds of the first uncancelled hosted run (72ce26dae), each attributed from its own job log and reproduced on build hosts before a fix was written, and land them small, as the paid layers go green, rather than waiting for every red of that run.

Vasan had not compiled its session-core and capi-coop units since 2026-11-24, so the failures behind the compile were never seen. The compile errors are cfg drift: test-only items gated on fewer features than their tests, and group member keyexpr tests that never compiled. Behind them, every build that lends its control records (rx-lent-control) saw no Declare in ten observer tests: the test-support crate wrote each Declare envelope with header 0 on the belief that no registry reads it, and the lent stand-in that tests ship in encodes each message and walks the bytes, so a record of no message kind reached no table. The fixtures now write the header a peer writes, the stand-in fails when a written message is not walked, and the one test that stated an owned-frame contract states the lent form too. Three kit-client tests read wildcards a build without them matches as text; they are gated on the wildcard features, as the file's other wildcard tests are.

The MCU images had drifted from the session API they link (171c7515f made every zid a SessionZid; SessionInitParams gained the region; the observer's tables hold the subscriber and queryable tables): Layer Qz stopped at the first image, and four more images were broken behind it. The pico host ceiling rows that read WIN are locked at WIN and the ratchets the gate found loose are tightened, each to the row the gate printed.

Not paid here, each named in the acknowledgement row: the C1 empty-handle floor, attributed to PassiveSession doubling in C1's workspace resolution and taken next; the three capic budgets, to be attributed by symbol next; C1bnl, whose shape check refuses the --test-target form its parser accepts; C1d, which did not reproduce; C1co, another session's.
'''
changes = '''
crates/wz-session-core-test-support: every Declare envelope through one builder that writes N_MID_DECLARE (and I with an interest id). crates/wz-session-core: driver_loop's lent stand-in asserts every written message is walked; slot_observer's taken-declares test states the lent form; session_tables tests gate the pinned walks on the wildcard features; pubsub, multicast_member_scope, handshake_encode, ext_chain and network_message gate test-only items on their tests' features.
crates/wz-capi-coop engine.rs, engine/query.rs, engine/group.rs: test accessors under std with their test module. crates/wz-app-frame proto_descriptor_tests.rs and proto_decode.rs: the text fixtures and the path read under proto-text.
deploy/zephyr-app (CellRc::try_boxed), deploy/zephyr-admin-loopback, deploy/zephyr-admin-node, deploy/mcu-admin-node, deploy/mcu-freertos-demo: the current session API. scripts/pico-c-program.sh, scripts/pico-compare.sh, scripts/run-ci.sh: shellcheck findings. deploy/pico_host_ceiling.json: seven rows locked at WIN, six ratchets tightened. docs/hosted-red-acks.md.
'''
verification = '''
On build hosts: wz-session-core lib tests with Vasan's three unit sets, library 3509, kit-pico 3068 and kit-client 1232 passed; wz-capi-coop library unit 91 passed; wz-session-core default lib and C1d's codec-push,pubsub-put arm 1857 passed; wz-app-frame with message-payload 94 and all features 171 passed. Layer Qz passed (zephyr-app, zephyr-tls-loopback, zephyr-admin-loopback and zephyr-admin-node built and booted on mps2/an385); mcu-admin-node fixed-memory, fixed-memory-tcp and default and the FreeRTOS demo and two-session images built for thumbv7m-none-eabi. Clippy with -D warnings of wz-session-core, wz-session-core-test-support, wz-capi-coop and wz-app-frame (also with message-payload), one crate per command, clean. shellcheck 0.11 reports no warning in the three scripts. rustfmt clean on the touched crates and deploy images.
'''
carry = '''
The C1 empty-handle floor: PassiveSession is 7,480 B in C1's workspace resolution against 3,704 B in wz-capi-dissect's own; find the field that grows with the unified sce-rust-runtime std and make it not, or move the gate to the shipped resolution with its reason. The capic-router-node, capic-default and capic-default-lean budgets: symbol diff against the commit that set them. C1bnl: the shape check of nondefault-tests-gate.sh does not admit the --test-target form its parser accepts (owner's decision on the check). C1d: watch the next hosted run of the arm. Then the handoff's measurement of reduced docs for session-core and S6 steps 3 to 5.
'''
