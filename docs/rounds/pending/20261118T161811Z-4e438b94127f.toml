impact = ["feature-inventory--composable-framework-atomic--preset-catalog/4-conflict-policy", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
A machine no longer reads a policy from the build: `SessionPolicy` is the snapshot of a session's policy values, its fields private and each read through a const accessor, and `SessionInitParams` carries it, so the session's queue, its link table's tie order, its sequence-number gate and the admission, atomic, targeted and link-restriction checks read the snapshot their creator handed them. A policy whose build domain holds one value is stored in no byte and read as a constant; a build for a target with no operating system defaults each domain to its default value unless an allowance widens it (`WZ_POLICY_DOMAINS` forces either rule), so a fixed-memory slot is the size it was. A gate refuses a read of the build defaults outside the policy module and a listed set of creators; the creators outside the session core are listed until the next step moves them.
'''
changes = '''
`wz-session-core`: `SessionPolicy` fields `Bound<P, HELD>` (zero-sized for a one-value domain) with const accessors and `select_*`; `SessionInitParams.policy`; `TxQueueConf::of_policy`; `LinkBook`/`LinkRegistry::with_order`; `admit_by`, `exposed_by`, `ReplayPacing::of_policy`, `BuildSupervisor::for_policy`, each old name kept as a build-default wrapper; domains from `Domain::from_stated` with the no-OS rule.
`scripts/lib/wz_config.py`: the generated snapshot, aliases and domain rule, mirrored in `policy_domain` and `--resolve-env`; `deploy/Kconfig.policies` help.
`scripts/lib/policy_read_gate.py` (new) with its allowlist, wired into pre-push and run-ci; every `SessionInitParams` literal outside the core fills `policy`; `docs/reason-review-pins.md` re-pins `session-close-ingress` on three files whose changes do not touch its claims.
'''
verification = '''
On pc2: `cargo test -p wz-session-core --lib` 1013 passed; `cargo clippy --workspace --all-targets -D warnings`; `cargo fmt --all --check`; `cargo check` of the zenoh API crate and of the mcu-admin-node firmware for thumbv7m-none-eabi; `session_slot_bytes.py --check`: mcu-admin-node 36728 and zephyr-admin-node 36720 bytes, equal to the record (the first version grew both by 24 bytes and was redesigned). Capability cost against main on the same host: every case within -532 to +600 bytes.
Locally: `wz_config.py --selftest` 336 of 336 and `--check`; `policy_read_gate.py --selftest` and `--check` (44 reads, each at an allowed site); reason review pins, store reason citations, the prose name gate, the public surface census, the upstream feature census, the layer direction gate and the cross-implementation proof audit.
'''
carry = '''
The creators outside the session core still read the build defaults (the gate lists them: the tokio runtime and router, the C ABI engines, the cooperative runtime, the node clock and event log, the MCU nodes, the demo and test fixtures) and the const folds outside the core still fold on the build default rather than on the domain; both move in the next step. No run-time document selects a value yet.
'''
