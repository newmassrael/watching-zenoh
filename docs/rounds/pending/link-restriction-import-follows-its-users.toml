impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The hosted CI run of 4e5800426e (round 4467) was red in four jobs, and every one is the same compile error, which round 4466 made and this round pays: `wz-capi-core/src/engine_port.rs` [374:64] `error[E0433]: cannot find type LinkRestriction`. Round 4466 named `LinkRestriction::Any` in the port's liveliness get operation, under `liveliness-get`, while the module's import of the type stayed under `queryable`, the one feature that used it before. A build with the liveliness get and no queryable therefore could not compile `wz-capi-core`: the pico client-only build that C1co runs (`engine-tokio,link-udp,query,liveliness-get,...`) and one reduced documentation configuration each of `wz-capi-pico` and `wz-capi-c` (C1bzr shards 2 and 5, and the settle that joins them). Round 4466's own CI run was cancelled while queued and graded nothing, so the red first showed on the next head. The import is now gated on the union of the features that name the type (`queryable` or `liveliness-get`): the gate of an import is the gate of its users, so neither a build without the type nor a build with it is left with an unused or a missing name. `faces.rs` imports the type unconditionally and needed nothing. The round's acknowledgement row is `red-4e58-link-restriction-import` in `docs/hosted-red-acks.md`.
'''

changes = '''
crates/wz-capi-core/src/engine_port.rs: the `LinkRestriction` import is gated on `queryable` or `liveliness-get`.
docs/hosted-red-acks.md: the row for run 42850723720.
'''

verification = '''
