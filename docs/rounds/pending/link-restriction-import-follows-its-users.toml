After the fix (remote): `cargo check -p wz-capi-core --no-default-features --features liveliness-get` passes, the configuration with the liveliness get and no queryable. `cargo doc -p wz-capi-pico --no-deps` over C1co's feature set no longer reports `LinkRestriction`; it reports the five unresolved links (`crate::sync`, `crate::query`, `crate::advanced::ze_advanced_publisher_options_t`, `crate::scout` twice) that `scripts/lib/reduced_docs_ledger.txt` already carries for `wz-capi-pico`, and nothing else. `scripts/run-ci.sh --layer C1co` passes (304 s), the failed arm `client_only_dials_a_listener` among it with its listener tests run and passed. The full C1bzr sweep was not rerun here: its new line was this error, which the two configurations above reproduce and no longer show.
'''

