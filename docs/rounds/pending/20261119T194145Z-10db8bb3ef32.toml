Z8 routing 7 of 8, red since Round 4506 for the same cause: `three_node_combination`'s recipe of a router, a client holding a token and a peer that gets the tokens alive times out (`zenoh/tests/routing.rs` @ `async fn three_node_combination(`). A node's liveliness get reads the node's own tables alone (`crates/wz-capi-core/src/drive/router_node/engine.rs` @ `fn liveliness_get_on_wire(`), and a router no longer tells a peer below it a token unasked; upstream's peer hat sends its session's `Current` interest to one gateway (`zenoh/src/net/routing/hat/peer/interests.rs` @ `if msg.mode == InterestMode::Current {`). Paid in the next round: the get asks a router, its answers reach the get, and the router's Final ends it.
