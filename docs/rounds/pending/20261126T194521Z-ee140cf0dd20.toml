impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
The cooperative engine ends a peer face's declaration replay with the
DeclareFinal of the initial interest, as zenoh-pico and wz's tokio engine do,
so a zenoh peer that dials a pico listener built on it is no longer left to
wait out scouting/delay. One constant in the pico ABI decides the switch for
both engines, and the peer rule (both ends peers) is read from the link once.
'''
changes = '''
- capi-coop: CoopConfig::initial_interest; a peer face owes the initial Final until its replay's last turn sends it.
- session-core: meets_remote_as_peer_hat reads the peer rule once for both engines.
- tests: dialled and accepted faces get the Final once after their replay; clients and peer-router pairs get none.
- C1cc leg shows the dialler's log when the Final is late.
'''
verification = '''
- Layer C1cc passes in full (it failed on main at the leg a pico listener ends what it replays).
- wz-capi-coop replay tests 20 in four feature sets, the accepted-face test, wz-runtime-tokio initial tests; nondefault-features clean.
'''
carry = '''
- the zenoh-c shared-memory leg of C1cc timed out once under a loaded host and passed 5 of 5 alone.
'''
