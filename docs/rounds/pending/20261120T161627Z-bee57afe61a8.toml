impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
A link over a TCP connection sizes its MTU by the rule of the ABI it serves, and the MTU bounds the batch the session advertises, the batch it sends and the divisor of its receive pool, as upstream's link does with one MTU. Upstream zenoh takes the MTU off the connection: the widest batch less the IP header of its local address, and on unix down to the largest multiple of half the socket's MSS below that (`io/zenoh-links/zenoh-link-tcp/src/unicast.rs` @ `let mss = socket.mss().unwrap_or(mtu as u32) / 2;`). Its TLS link does the same off its TCP socket. zenoh-pico states the widest batch whatever the connection. wz stated the widest batch on every ABI, so a zenoh-c session advertised and pooled differently from libzenohc wherever the host's MSS is not a divisor of the widest batch. That is Layer C1cc's receive-buffer red: on a Linux loopback the accepting socket reads an MSS of 32,768, upstream's link is 49,152 bytes wide, and libzenohc keeps one buffer more per three batches than wz did. The rule is not a key of the document; the ABI states it. `LinkRxConf` carries it (`tcp_mtu`, zenoh's by default for the zenoh-c ABI, the Rust API and the demo, `Widest` in the pico ABI's link section) because that section is what reaches the TCP and TLS wiring and the reconnect re-dial alike. The write half reports the MTU it was built with as both its send bound and its receive capacity, and the session's existing minima carry it into the advertisement, the send budget and the pool. One divergence is stated: an MSS that halves to nothing leaves the MTU at the header rule, where zenoh's search for the multiple never ends. The two MCU slots grow by 8 bytes for the field, which their stream links do not read; `LinkRxConf` already holds the host's pool size beside it.
'''
changes = '''
- `crates/wz-session-core/src/session_init_params.rs`: `TcpLinkMtu` (`HalfMssMultiple`, `Widest`) with `mtu(v6, TcpMss)`, `TcpMss` (`Read`, `Failed`, `Unread`), and `LinkRxConf::tcp_mtu`, zenoh's by default; three tests of the arithmetic.
- `crates/wz-runtime-tokio`: `StreamWriteDriver::with_link_mtu` and its `link_mtu` / `link_rx_capacity`; `link_pipeline::tcp_link_mtu` reads the socket's MSS through `socket2` (now part of `transport-link-tcp`); the TCP and TLS wiring take the session's `LinkRxConf` and size the link before the split; a loopback test reads both ends and pico's rule.
- `crates/wz-capi-pico/src/session.rs`: the pico ABI's link section states `TcpLinkMtu::Widest`.
- `deploy/session_slot_bytes.json`: both MCU slots +8 bytes; two standalone lockfiles take `socket2`; `docs/reason-review-pins.md`: `session-close-ingress` re-read against `session_open.rs`.
'''
verification = '''
- Layer C1cc on pc2 passes with every leg, the receive-buffer leg among them (at `4df161c9e` it read 4 buffers against libzenohc's 5 at the default batch).
- wz-session-core `tcp_mtu_tests` 3 passed; wz-runtime-tokio lib 756 passed (the new loopback test among them), `tls_e2e` 10 passed with `transport-link-tls`; wz-capi-core lib 228 and wz-capi-pico lib 176 passed; `cargo check --workspace --all-targets` passes; clippy `-D warnings --all-targets` of wz-session-core, wz-runtime-tokio (with `transport-link-tls`), wz-capi-pico and wz-capi-core and `cargo fmt --check` pass.
- `session_slot_bytes.py --check` equals the moved record (36,736 and 36,728).
- Cost cases measured on one build host against `4df161c9e`: -904 to +1,184 bytes of text, every case under its budget with the margin the hosted baseline left; no budget moves.
- `upstream_citation_anchor_gate.py`, `reason_review_pin_gate.py` (after the re-read), `reason_citation_gate.py`, `store_reason_citation_gate.py`, `limit_read_gate.py --check`, `wz_config.py --check`, `gate_provenance_lint.py`, `round_fed_gate_reach.py` and `runci_leg_ledger_gate.py --check` pass.
'''
