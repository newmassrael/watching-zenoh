impact = ["watching-zenoh/local-ci-gates"]

decision = '''
The gate headers the artifact-root round added cite the round that introduced them, and they cited R4400 because two other rounds landed while that round was being verified; it was filed as round 4401. gate_provenance_lint checks only the citation's shape, so the wrong number passed, and it sends a reader to an unrelated round. The headers now cite R4401. A descriptor cannot know its own number before it is filed, so a citation written beside one is a prediction; the residue is stated in carry rather than worked around here.
'''

changes = '''
scripts/lib/artifact-root.sh, artifact_root.py, artifact_root_lint.py, read-only-tree.sh, armed_oracle_census.py (the nested-lane arming comment) and the artifact_root_lint.py entry of .githooks/pre-push cite R4401 instead of R4400.
'''

verification = '''
gate_provenance_lint: every gate script declares what it answers for (0 findings). hook_gate_boundary_gate --check passes. The ledger entry for round 4401 is the artifact-root round (scripts/land.sh output: filing docs/rounds/pending/artifact-root.toml as ledger round 4401).
'''

carry = '''
A round citation written in a commit that travels with a round descriptor predicts the number file-round.sh will give it; when other rounds land first it is wrong and no gate resolves it against the ledger. Either the descriptor carries a token that file-round.sh substitutes, or gate_provenance_lint resolves a round citation against the store.
'''
