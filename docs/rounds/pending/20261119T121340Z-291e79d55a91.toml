impact = ["wire-spec-subset--watching-zenoh-mvp/4-4-transport-extensions"]
decision = '''
A flow's context says what its handshake said about shared memory, message by message: whether each Init carried a Shm extension, how each Open's was encoded, and whether the exchange went all the way, because zenoh sets shared memory up inside the four handshake messages and a capture shows where it stopped. The Open's encoding is kept as the wire wrote it because it is what tells two releases of one protocol version apart, release 1.9.0 declaring it an integer and the pinned release a buffer, while the Init's is a buffer in both; two Opens of different encodings are two releases that cannot set shared memory up together. Whether one message's payload is a descriptor was already said by its carried entry; a descriptor sent without the body's mark is not told from data, and the documents say so. The field document moves to revision 74 and row_facts to 14; six keys and two families arrive, nothing retires.
'''
changes = '''
The session core's passive context gains ShmHandshake, folded from the first InitSyn, InitAck, OpenSyn and OpenAck it reads, with each Open's extension encoding and whether the exchange was established.
The field document's context writes shm after version, with the closed set of the Opens' words; revision 74 and row_facts revision 14 rows and tables, the vocabulary gate's two families, the ABI header's paragraph and tags, and the C consumer's revision pin.
The flat-context goldens of the capture and dissection crates end their slice at shm, which the new tests hold.
'''
verification = '''
The capture crate's library tests with dissect and fixtures, 1839 passed and 6 ignored, among them five handshakes read message by message (the pinned release's buffer on both Opens, release 1.9.0's integer on both, a buffer answered by none, a buffer answered by an integer, an InitAck without the extension) and the document's object for a session that set shared memory up and for one with none; the session core's library tests with dissect, 1668 passed; the dissection crate's tests, 259 and 4 passed.
Red-first: with the Open's extension chain withheld from the fold, both new tests fail.
fmt; clippy with warnings denied of wz-session-core with dissect, wz-capture and wz-capi-dissect, one crate per run; wz-capture with no default features builds; the rustdoc lane over the three touched crates; the upstream citation anchor gate; the integer-cell gate.
'''
carry = '''
No capture of a real shared-memory session was read; the fixtures put Shm extensions of the two encodings on this reader's own handshake messages, and the encodings each release writes were read from the zenoh-protocol crates of 1.9.0 and 1.10.2.
Which release first wrote the buffer, and whether releases before 1.9.0 wrote the integer, was not read.
'''
