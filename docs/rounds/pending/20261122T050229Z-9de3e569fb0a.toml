impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-27-api-compat"]
decision = '''
zenoh-c's event listeners declared with `history` reported the faces connected at the declaration and only then installed their watch (census W9), so a face that came up between the two was reported by neither and one that went down there was reported up and never down. Upstream installs the listener and then reports the history (`zenoh/src/api/session.rs` @ `for transport in self.runtime().get_transports() {`), so a face in that window can be reported twice and none is lost. The zenoh-c ABI now installs the watch first, as upstream does, and holds what the watch is told while the history is reported, reporting it after the history in the order it was told, which is how the zenoh-pico ABI's listeners already deliver (`crates/wz-capi-pico/src/connectivity.rs` @ `Registered BEFORE the peers are read, so a peer that arrives in`). A face that comes up in the window is reported by the history and again by the held transition, upstream's duplicate, never a loss; a going told in the window follows the report of the coming it ends.
'''
changes = '''
- crates/wz-capi-c/src/events.rs: `EventClosure` holds the watch's transitions while a listener's history is reported (`deliver_or_hold`, `finish_history`); the transport and link listeners install their watch before reading the faces.
- docs/zenoh-logic-as-sce-kinds.md and S8.md: W9 recorded as fixed; S8 row 44 states the new order.
'''
verification = '''
- On build hosts: the new unit test (a transition told during the history is held and reported after it, in order; a listener without history holds nothing) 1 passed; the listener integration tests `transport_events_roundtrip` 4 passed and `node_connectivity` 1 passed.
- clippy -D warnings with all targets for wz-capi-c; rustfmt --check of the changed file; the pre-push hook's round-fed gates 169 of 170, the one red being main's own (`feature_gate_diagnostic.py`, wz-app-frame `sce-generated-codec`, owned by watching-zenoh-43 [0cf154]).
'''
carry = '''
- W10 (`register_bindings` restates the switchboard sidecar's rows) is to be generated from the sidecar.
'''
