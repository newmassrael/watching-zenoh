impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "watching-zenoh/local-ci-gates"]
decision = '''
A twelfth integration of the pico C ABI release toward docs/c-abi-architecture.md: the sessions, transport and driver structure lanes, the one-thread forms, the SN width, the panic-free and heap-refusing allocation paths, and the cooperative links.

Sessions and transport: a session's round, rooms, registry and Router lends lie in the session's arena behind handles that count nothing; the runtime's state and task table are placed there by count; a table's slot and a filter's undeclaration are each one body. A dial-only session runs its one task in one cell, and reserves timers only where a task sleeps on them.

One-thread forms: a build without threads counts its calls without atomics, calls back each record before the next, keeps a round's records in itself and lends one longest key.

SN width: a session holds the offered width as its policy value, refuses a width outside the domain at the open, and walks fragment chains and judges known rings in the Sn word; an observer judges a ring at the wire's width.

Heap and panics: the object doors answer a full heap with pico's out-of-memory code, a handler channel holds its elements in a fixed ring, a link cell the heap refuses is refused, and the no-heap gate measures the no_std put and subscriber legs, which read no allocation after open.

Links on the cooperative engine: WebSocket (heap and session-slot profiles, POSIX and Windows openers), unixpipe, raweth and group endpoints read once into sized fields; a connect locator that names a group joins it, as pico does.

Keys: a key hold gives its declaration back by its row, and a copy past a declaration's count is refused with pico's overflow code.

The size ledger reads 1.4166 times zenoh-pico in total (from 1.5581): sessions 2.5710, doors 2.0852, transport 2.3719, driver 1.3641; keyexpr, codec and language win.
'''
changes = '''
crates/wz-session-core, wz-runtime-coop, wz-capi-coop, wz-capi-pico, wz-capi-port, wz-capi-core, wz-session-mcu, wz-session-lwip, wz-runtime-posix, wz-runtime-zephyr, wz-runtime-tokio and their tests: the lanes merged into the integration branch (sessions S2-S8, transport, driver, one-thread forms, SN width, panic-free and heap-refusing paths, WebSocket, unixpipe, raweth and group locators, key holds, coop group statistics).
scripts/lib/wz_config.py: a policy's wire codes; deploy/wz-config.toml and the generated limits, policies and Kconfig.
scripts/lib/no_heap_ratchet_gate.py and deploy/no_heap_ratchet.json: the no_std legs measured and locked.
scripts/host-bench, docs/zenoh-logic-as-sce-kinds, docs/upstream-parity.md rows.
deploy/size_ledger.json rows tightened.
'''
