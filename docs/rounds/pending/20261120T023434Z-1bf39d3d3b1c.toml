impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "watching-zenoh/local-ci-gates"]
decision = '''
Repay the defects the classification of Round 4557 found where the limits are read, each at its cause. A stated value the code cannot honour is now refused by name, at the build or at the open, never cut, wrapped or defaulted: the match cache no longer delivers a wrapped u16 position, a key is refused rather than cut, a locator end that does not fit is unnamed rather than truncated, out-of-range build values of the pico interface, the supervisor and the event ring do not compile, and an unparsable UHLC_MAX_DELTA_MS fails the open with its reason where zenoh panics. A limit read by no code or borrowed from another fact gets its own reader (MAX_MULTICAST_REPLIES, now both the fixed queue's size and the heap queue's bound) or its own name (LINK_NOTED_REQUESTS). A refused replay turn is answered as the declared pace says on every host, and a send that cannot succeed reopens the link as upstream pico does.
'''
changes = '''
- Declaration: new limit `LINK_NOTED_REQUESTS`; `MAX_MULTICAST_REPLIES` both (fixed size, heap quota); pico batch ranges start at 1; a bound may state `most` (`TX_EXPIRY_CLOSE_AFTER` 65535); helps that misstated their readers corrected; statement vectors draw a parameter inside its range.
- wz-session-core: the match cache does not remember a key whose positions pass u16; scratch lists typed by the table's storage; `MAX_PENDING_DECLARES` held above the subscriptions and tokens on fixed builds; `TX_EXPIRY_CLOSE_AFTER` refused past u16; the handshake answer held whole off the slot profile; supervisor and event ring shapes refused at compile time.
- `TxQueueConf::validate` judges the queue the ap-demo command line and the tokio configuration document state.
- wz-session-mcu and wz-session-lwip: a latest cell refuses and counts a key past the limit; both multicast reply queues are bounded by `MAX_MULTICAST_REPLIES`; the lwIP driver names a link's ends by the cooperative engine's rule; `wz_codecs` names its locator decode bound `MAX_DECODED_LOCATOR_LEN`, and the directory warns of a refused locator.
- wz-capi-pico and wz-capi-coop: batch sizes and the read wait are const items; the tokio open is held to `PICO_CONNECT_TIMEOUT_MS`; the cooperative engine, the slot client and the tokio host answer a refused replay turn by `after_refusal`, and end and reopen the link on a send that cannot succeed.
- wz-node-time, wz-capi-core and wz-ap-demo: a refused clock bound is `OpenError::ClockRefused`, which every open returns with its reason (zenoh-c `Z_EINVAL`, pico `Z_ERR_CONFIG_INVALID_VALUE`, the Rust API's error), and ap-demo exits with it; wz-app-frame's catalog refuses an instance key past the build's limits.
- `docs/reason-review-pins.md`: five `session-close-ingress` rows re-read and moved; the C1m slot replay guard counts 13.
'''
verification = '''
- On a build host: the tests of the fifteen changed crates pass, wz-session-core on the heap profile and with `bounded-heapless`, the pico ABI on both engines, wz-node-time with `time-hlc`, `pubsub-ts-stack` and none, and the clock refusal's child-process tests of wz-capi-core, wz-capi-pico (both engines), the Rust API and ap-demo; clippy -D warnings passes per crate and per feature set named.
- Red first: builds stating `WZ_LIMIT_TX_EXPIRY_CLOSE_AFTER=65536`, and `WZ_LIMIT_MAX_SUBSCRIPTIONS=32` on the fixed profile, do not compile; a build stating `WZ_LIMIT_PICO_CONNECT_TIMEOUT_MS=500` runs its tokio open test against 500.
- `wz_config.py --check` and `--selftest` (420/420), `message_catalog.py --selftest` with the regenerated tables, `logic_census_coverage_gate.py --check`, `reason_review_pin_gate.py --check` after the five rows were re-read, and `upstream_citation_anchor_gate.py --resolve-if-pinned` pass.
- `guarded_count_gate.py --range` judges 75 of 75 reached guards after 21 of them were moved to what the oracle printed; the hook's 152 deferred static gates pass.
'''
carry = '''
- `open_plan` (the C ABIs and the Rust API) does not apply a configuration document's `congestion_control` waits; a parity gap found here, not repaid.
- A slot build whose policy domain allows ignore-and-replay reserves the held handshake answer it never fills on that profile.
- A peer that accepts and then refuses every replay is redialled without back-off, as upstream does; the back-off belongs with the round that closes a remote bound's session on overflow.
- A single declaration larger than a batch ends a cooperative link.
- No behaviour-level test makes a live link refuse a replay send; the new tests drive the decision functions.
'''
