impact = ["watching-zenoh/build-and-verify"]
decision = '''
Write the level-1 promise of the zenoh-pico preset's API as one TLA+ module, the top of the owner's goal that the whole DLL refines a TLA+ API specification.
'''
changes = '''
- docs/formal/PicoApiService.tla: sessions, nothing after an undeclare or a close returns, samples by reliability class (at most once, in order per publisher and channel, no gap on a held reliable stream link), queries (QueryFinalService included), liveliness alternating PUT and DELETE.
- Four assumptions as parts: callbacks waited for, one route per publisher, stream links lost whole, timely delivery on a held link; each has a configuration that breaks the promise it carries.
- README maps each mechanism promise already written to the clause of the API promise it refines.
'''
verification = '''
- TLC 1.7.4 by hand: the whole module (822k distinct states), samples (492k), liveliness (10k) and queries with progress (21k) hold; without waits NothingAfterGone, without one route InOrder and AtMostOnce, without stream links ReliableNoGap, without timely links NoFalseDeath break; without fairness GetsEnd breaks.
- Upstream citations are one-line path @ needle into vendor/zenoh-pico; the citation form gate passes.
'''
carry = '''
- zenoh-pico's reliable is the link's reliability only (no retransmission over UDP or serial); whether wz's preset promises more is the owner's decision.
- The module is not abstract in models.json yet: the judge refuses an abstract module nothing refines; it becomes abstract when SCE's generated system model (ADR 0115 D7) refines it.
'''
