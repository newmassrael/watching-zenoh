impact = ["rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.l-new-kind-bounded-collection", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-27-api-compat"]
decision = '''
W16, first table: the cooperative engine's held ResponseFinals (census S7 row 13) are held to the session's MAX_PENDING_FINALS. caps.rs stated the bound and wz-capi-coop never read it, so FinalHolds grew with every request a callback or a kept query held. Before choosing what a full table does, zenoh-pico was read at its pin: _z_trigger_queryables (vendor/zenoh-pico/src/session/queryable.c) returns _Z_ERR_SYSTEM_OUT_OF_MEMORY before any callback when it cannot build the query, and sends neither a reply nor a Final. The session core's FinalStage refuses the same way (a request it cannot owe a Final for is refused before its queryables run). The cooperative engine now does the same: a request with no row left is not copied out, its callback never runs, and the Final the dispatch owes for it is not sent. The refusal is kept for the rest of its dispatch, so a second queryable the request matches does not answer what the first could not. The bound is the session's limit (SessionLimits::max_pending_finals_held), so a heap build with nothing stated stays unbounded as before and a fixed build reads the caps value.
'''
changes = '''
crates/wz-capi-coop/src/engine/query.rs: FinalHolds holds rows, the requests refused in the running dispatch and the session's quota; take returns whether a hold was taken; owe consumes a refusal and returns false so no Final is sent; QueryPlane::held_to builds the plane with the session's limits; arrive queues nothing for a refused request; hold_query holds nothing when take refuses. crates/wz-capi-coop/src/engine.rs: the open resolves the limits once and hands them to the registry, the dial face's replay pacing and the query plane. crates/wz-capi-coop/src/tests/queryable.rs: a_query_past_the_finals_held_is_refused_without_a_final (limit 2, two kept queries, the third refused with no callback and no Final, a freed row holds the next). docs/zenoh-logic-as-sce-kinds.md section 7.4: S7 13 moves from "Has no stated bound" (10 to 9) to "Fits now" (24 to 25); the W16 paragraph says so. docs/zenoh-logic-as-sce-kinds/S7.md row 13: the bound, the refusal and today's lines.
'''
