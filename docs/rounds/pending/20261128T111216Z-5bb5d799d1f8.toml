decision = '''
Build rulings D19 and D20 of docs/session-lifecycle-intent.md 5c: a sealed command's replay state is one slot per granted commander, made with the policy, and a node recovers freshness across a start with the echo alone, persisting no window.
'''
changes = '''
wz-command-seal: ReplayWindow<S> holds a Slot per granted commander (Slot::granted) in the storage S, an array on the fixed profile and a boxed slice on the heap; SealError::WindowFull becomes NoContext, a key no grant names (RFC 8613 8.2 step 2).
wz-command-seal: Freshness<S>::started(window, echo) is the one start; Restart, Freshness::persisted and the window's iter go; fresh.rs cites appendix B.1.1 as the sender's counter, no longer a persisted window.
Freshness::check leaves a commander with no slot to the monitor; take refuses it as NoContext, so a key no grant names is never asked for the echo and never takes a counter.
wz-runtime-tokio lifecycle_seal: the window is made from the distinct commanders of the grants; HEAP_SEALED_COMMANDERS and TooManyCommanders go.
wz-session-mcu FixedSeal::new takes the build's distinct commanders; start_persisted and window() go, last() reads a commander's counter; declared_node builds the list at compile time (distinct_commander_list).
docs/command-seal.md and session-lifecycle-intent.md 5c record D19 and D20 as built.
'''
