impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-8-pubsub", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-9-query", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-25-ext-pubsub", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "watching-zenoh/local-ci-gates"]
decision = '''
The second set of generic, default-off application-plane switches lands, with the debts Round 4541 left. A replay cache (`replay-cache`): a publisher keeps per instance the frames it sent, as sent, and answers them on a key suffix the caller states, one reply per sample in (time, instance, sequence) order from a snapshot then the final, segmented when the policy says so; a subscriber asks each publisher as it appears (a declaration watch now tells a new watch what each peer already holds), joins segmented answers, admits replies through the receiving judge (an SCE algorithm) and, under `replay-live-before-answer = hold-back`, holds live samples until the replay that precedes them. A message catalog (`message-catalog`): one JSON5 declaration of a deployment's messages, one validating reader whose rules the fixed-memory generator shares through a schema and a refusal corpus. Instance keys (`instance-key`): an instance index from up to two payload fields read through the `.proto` schema reader, which moves from `wz-capture` to `wz-app-frame` with its tokenizer and parser, and the joiner of segmented messages with it. C examples of profiles, transports, batching, protection, supervision and a program's own periodic task, and a stated call order of the periodic run API. Every pico C program now compiles against the `config.h` of its library's own arm (`wz_config.py --pico-config-h`), which ends the stack smashing a program with option structs met against the vendored default header. Three pure deadline and report computations become SCE algorithms. Paid from Round 4541: the capability cost lane (the zid derivation linked the session core's whole locator parser into every cooperative build; it now reads listeners with the engine's own reader, and the zenoh-c budgets move by the growth taken apart by symbol), four static gates the hook did not run, and a Cortex-M0 build that had no native `fetch_or`.
'''
changes = '''
`deploy/wz-config.toml`: capabilities `replay-cache`, `message-catalog`, `instance-key`; policies `replay-reply-shape`, `replay-serve-holds-sends`, `replay-live-before-answer` (in the `upstream` profile at their defaults); limits `REPLAY_DEPTH_MAX`, `MESSAGE_CATALOG_ENTRIES`, `INSTANCE_KEY_FIELDS`, `INSTANCES_PER_MESSAGE`.
`sources/session/replay_round.scxml`, `replay_serving.scxml`; `sources/algorithms/replay_reply_admission.scxml`, `stream_deadline.scxml`, `declaration_stall_deadline.scxml`, `drop_report_due.scxml`; their `out/` emits.
`wz-app-frame`: `proto_lex`, `proto_parse`, `proto_schema`, `proto_decode` and `segment_chain` (moved from `wz-capture`, which re-exports them), `instance_key`, `message_catalog`, `replay_admission`, `replay_pieces`. `wz-session-core`: `replay_publisher`, `replay_subscriber`, `Quota::tighter`. `wz-runtime-tokio`: the declaration watch's held declarations. `wz-capi-pico`: `wz_ext_replay_publisher_*`, `wz_ext_replay_subscriber_*`, `wz_ext_message_catalog_*`, `wz_ext_instance_keyer_*`, declared in `wz_ext.h`; `z_mutex_take` and `z_condvar_take` return nothing, as pico declares them.
`scripts/lib/wz_config.py --pico-config-h`; `scripts/pico-c-program.sh` reads cargo's build report and renders the arm's header; `scripts/lib/message_catalog.py`; `crates/wz-capi-pico/examples/c/`; `docs/periodic-run-api.md`; the Platform workflow's `capi-examples` job (observed).
`crates/wz-capi-coop/src/engine.rs` (the zid's listeners), `crates/wz-session-core/src/session_actions.rs` (portable-atomic sync bits), `crates/wz-runtime-coop/src/app_link.rs` (one wait module per build), `crates/wz-session-core/src/caps.rs` (no upper crate named), `scripts/lib/capability_cost_gate.py` (`capic-default` 11,323,300, `capic-default-lean` 9,569,600, `pico-default` 806 exports), `scripts/lib/discard_site_lint.py`, `scripts/lib/policy_read_gate.py`, census rows, `docs/reason-review-pins.md`.
'''
verification = '''
On the build hosts at the integration tip, every run read from its own log: `wz-session-core` with the replay cache 1,082 and its wide feature set 1,280; `wz-capi-pico` with every new capability 282 (replay_cache_doors 4, instance_key_doors, message_catalog_doors, app_transport_doors 7), with the replay cache alone 249, its default build 229; `wz-app-frame` with `instance-key,replay` and its default build; `wz-capture` default and with `dissect`; `wz-runtime-tokio` default and `from_held`; `wz-runtime-coop` app_link; `wz-capi-coop`; `wz-capi-core`; `wz-capi-c`. Clippy `--all-targets -D warnings` per crate on each of those feature sets. Every pico C program on Linux through the script, each against its arm's rendered header: the host layer, the session loopback, the platform surface, the program transport (a stream pair, a datagram pair and a two-member group), and the six examples, `profiles` again under `WZ_POLICY_ENTITY_TIMESTAMP_OPT_IN=on`.
Layer G (every per-triple build, the thumbv6m and thumbv7m legs included) and Layer C2m. The guarded count oracle over the range on pc2: 34 guards reached, 34 agree. All 152 round-fed static gates of the pre-push hook run locally, whatever the range feeds, each passing.
The capability cost lane measured on pc2 at `8593d2f86` and at the tip for every case; the zenoh-c default build's growth taken apart by symbol (`nm -C -S`) as `capic-default`'s note records; `capability_cost_gate.py --selftest` 25 of 25; `wz_config.py --selftest` 380 of 380.
