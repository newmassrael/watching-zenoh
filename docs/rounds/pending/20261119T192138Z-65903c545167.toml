impact = ["rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.a-new-kind-algorithm", "rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.j-codegen-backend-coverage"]
decision = '''
The logic census (`docs/zenoh-logic-as-sce-kinds.md`) left out whole crates with nothing saying so, among them the C ABI the zenoh-pico preset's C build reaches first. The owner has since ruled that all protocol logic is to be in SCE documents and that the C build is the zenoh-pico preset for now. Four new slices classify what was left out: S7 the zenoh-pico preset's C ABI (`wz-capi-pico`, `wz-capi-port`, `wz-capi-coop`, `wz-capi-core`), S8 the zenoh-c preset's (`wz-capi-c`), S9 the MCU and hosted runtimes, links, network stacks, TLS and time (22 crates), and S10 the application framing, bridges, the demo and the files the first six slices did not cite. A table names a slice or an exclusion with its reason for every crate, and a new gate holds it to the tracked crates, so the question "was anything missed" has an answer a run gives. Section 5 now states the target structure the owner accepted and the SCE session agreed (a sans-I/O core generated for Rust and C11, parsing at the boundary, concurrency only at SCE's doors, lifecycles as explicit events, N-version testing), and the order of the SCE work the SCE session set and the owner confirmed, with the boundary binding before ADR 0100. Section 9 measures what of the SCE sources reaches C11 today.
'''
changes = '''
`docs/zenoh-logic-as-sce-kinds/S7.md` to `S10.md`: 106, 73, 87 and 84 rows. Totals move from 369k to 544k lines (A 7.2k, K 82k, G 192k, S 77k, D 36k, X 149k); S10's rows for files S5 and S6 already counted are left out of the sum. On the cooperative pico path about 11.8k lines are protocol logic, 8.7k blocked, and its completion, cancel, undeclare and close rest on an `Arc` count or a `Drop` order at each place the S7 and S8 Summaries list.
`docs/zenoh-logic-as-sce-kinds.md`: section 1 (answer), 2 (the new slices, the coverage table), 3 (totals), 4 (row counts of S7 to S10; U15 a layout known only at run time, U16 a queue's run-time capacity, U17 a full queue that drops or evicts with several producers, U18 a post applied before the posting call returns; U8 withdrawn as a request; U3 narrower, since SCE accepts a bounded `bytes` field), 5 (target structure and SCE order), 7.2 (W5 in detail, W9 a race to check in zenoh-c's event listener with history, W10 a hand copy of the demo's binding rows, W11 a panic where pico returns an error), 8 (open points), 9 (C11 reach: of 123 sources the 65 codecs and 32 algorithms are emitted and none compiled; statecharts, pools, links and schemas are not emitted).
`docs/zenoh-logic-as-sce-kinds/crates.md` and `scripts/lib/logic_census_coverage_gate.py` (selftest and check), registered in `scripts/run-ci.sh` and the pre-push hook's round-fed gates.
'''
verification = '''
`logic_census_coverage_gate.py --selftest` passes 15 cases, and `--check` reads 99 tracked crates: 62 read by a slice, 37 excluded with a reason. With the `wz-capi-coop` row deleted from the real table it fails naming that crate, and it passes again with the row restored. The pre-push hook's 151 round-fed static gates pass, among them the new one, the provenance lint and the prose dependency gate, and the upstream citation gate passes with resolution against the pinned checkout (53 bare, budget 53). Each slice's agent checked every `crates/...rs:N` citation of its slice against the tree (468 in S7, 348 in S8, all of S9 and S10). `validate-workspace` shows T1 orphans unchanged. Nothing was built: the round changes documents and a text-reading gate.
'''
carry = '''
U15 is a decision for the owner: a deployment writes its frame profile as a codec document in its own repository, or SCE gains a kind that reads a layout at run time. U16 to U18 go to the SCE session's catalogue. W9 (zenoh-c event listener with history: a face that changes between the listing and the watch) is to be compared with upstream's order and fixed or closed. U3's rows in S1 and S4 are to be re-read now that a bounded `bytes` field is accepted. A peer session's unlanded move of protocol code into `wz-app-frame` is classified when it lands.
'''
