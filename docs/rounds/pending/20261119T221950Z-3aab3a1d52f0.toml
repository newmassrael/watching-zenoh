impact = ["feature-inventory--composable-framework-atomic--preset-catalog/4-conflict-policy", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "watching-zenoh/local-ci-gates"]
decision = '''
Step 5 of the staged policy binding: the config doors of the three ABIs, so one build chooses its policies when a session opens through whichever ABI a program uses. One composition holds for all three, lowest first: the build defaults, a profile, the document's `wz/policies`, then the statements the program makes from code (`Origin::Api`); `policy_document::resolve_document_under` composes it with a profile standing in for the document's, and `resolve_under` composes it with no document read. The zenoh-c ABI keeps a config's `wz` member whole: an insert at a `wz/...` path edits the member, the config's export writes it back with its profile, the key disposition door answers the paths the open reads as honoured, and an open whose member is refused answers `Z_EINVAL`. The Rust API's `Config` keeps the member beside zenoh's own config through `from_json5`, serde and `insert_json5`; with the `open-policies` door (wz's own, off by default, turned on by `api-compat-rust`) `Config::state_policy` and `Config::state_profile` state the open's layer and `Session::resolved_policies` answers the snapshot with each value's provenance, re-exported as `wz::ext::policies`. The pico ABI states policies through `wz_ext_config_policy` and `wz_ext_config_profile` in every build, each statement checked at once against the build and a refused one leaving the config as it was (`_Z_ERR_CONFIG_INVALID_VALUE`); `wz_ext_config_document`, which hands a pico config the zenoh JSON5 document the zenoh-c ABI reads, is behind the new capability `config-document`, off by default as zenoh-pico reads no document and the JSON5 reader it links was most of the step's pico growth by symbol. `z_open`, `z_scout` and the device requirement door of the pico ABI refuse what the build refuses. Limits under `wz/limits` stay refused by name until step 4b.
'''
changes = '''
`crates/wz-session-core/src/policy_document.rs`: `resolve_document_under` (a profile override and an API layer over a document) and `resolve_under` (the same with no document); an unknown profile is refused in the layer that named it.
`crates/wz-capi-c/src/config.rs`, `config_verdict.rs`, `session.rs`: the `wz` member held whole, inserts by its path, the export and key disposition that keep it, the open under it.
`crates/wz-zenoh/src/api/config.rs` and `crates/wz-zenoh/src/api/session.rs` (feature `open-policies`) and `crates/wz` (`ext::policies`, `api-compat-rust` turns the door on); `crates/wz-runtime-tokio/src/zenoh_config.rs`: `to_json5` writes the policies as a `wz` member naming its profile.
`crates/wz-capi-pico/src/config_policy.rs` (new), `config.rs`, `scout.rs`, `session.rs`, `device_requires.rs`; `wz_ext.h` declares the three doors.
`deploy/wz-config.toml` capability `config-document` with its generated Kconfig, conformance items and statement vectors; census row; `nondefault-tests-gate.sh` runs the zenoh crate with `open-policies`; `policy_read_gate.py` allows the Rust API config's two creators.
`scripts/lib/capability_cost_gate.py`: seventeen budgets and the two pico export pins, by the step's growth and by Rounds 4545 to 4549's (the token interests a node sends north, a node's liveliness get through its routers, the queue sizes a document states), which had landed without moving a budget.
'''
verification = '''
On a build host after the merge of main at Round 4550: `policy_document` 29 tests, the `no_document_resolves_as_a_document_with_no_wz_member` case among them; wz-capi-pico lib 174 without `config-document` and its `config_policy` tests with it (11); wz-capi-c lib 216; the zenoh API crate with `link-restriction`, `targeted-query`, `admission-retry`, `atomic-publish` and `open-policies` 204 (one ignored); wz-runtime-tokio `wz_member_tests` 10; wz-conformance-build 12; clippy -D warnings of wz-session-core, wz-capi-pico by default and with all features, wz-capi-c and the zenoh API crate. `guarded_count_gate.py --range` reaches none of the 698 guards: every guard on a package the step changed filters by a name its files do not hold.
Capability cost on `pc2`, main `4481c5ac8` and the step's tree on one host: the growth per case and its symbols are in `capability_cost_gate.py`'s note of this day; seventeen budgets and two export pins moved; the gate's selftest 25 arms.
Locally: `wz_config.py --check`, `policy_read_gate.py --check`, the public surface census, `cargo fmt --all --check`, reason and store reason citations, reason review pins, upstream citation anchors, the prose name and prose feature gates, count guard lint, discard site lint, the domain census, the extension identity gate, the feature gate diagnostic and bounded output parity.
'''
carry = '''
Step 4b: limits as quotas under `wz/limits`, still refused by name. The `wz/key-ids` document reader builds on `statements_from_json5` and `resolve_document_under`. The policy and profile tables cost a pico library more in relocations than in code (`.rela.dyn` +5,712 and `.data.rel.ro` +3,536 against `.text` +6,864): names held as offsets into one string would remove most of it, to be measured. Open-debt item 952, its lazy half (one spare pool for every lane of `OutboundTx`), stays open.
'''
