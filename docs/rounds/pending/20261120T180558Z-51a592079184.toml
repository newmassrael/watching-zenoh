impact = ["watching-zenoh/local-ci-gates"]
decision = '''
Repay the `waker` red of the Zephyr kit images (the rule claimed 7 calls through a register and pinned 8 on five images) at its root, which is in the stack bound gate and not in the code. Inlining moved `SlotSession::abort` out of `hang_up`, and it now ends in a tail call through a register (`bx r2`) into the waker; the gate read a call through a register only as `blx` to `r0`-`r12` or `ip`, so the call went unseen, and with it the edge from `abort` to the waker's functions. Moving the pin to 7 would have recorded the blind spot as a fact. The reader now takes a `blx` or a `bx` to any register but `lr`, in any condition, and names the registers objdump spells `sl` and `fp` (r10, r11): two calls of the admin and codec paths were `blx sl` and `blx fp`, unseen the same way.

Reading every call it reveals in the six images found no deeper stack, but it found the model wrong for a tail call: counting the caller's frame under its tail callee put 32 bytes on the TLS images (`mbedtls_pk_verify_restartable` pops 32 bytes before it branches to the verify wrapper), which took the admin TLS image to 12,028 bytes over its 12,000-byte cap with a depth no run reaches. A tail call through a register is now counted from where its caller was entered, and a callee the caller also calls normally keeps the frame under it; a direct branch to another function is still counted as a call, which overstates and never understates. With that the bounds are what the rows commit in all six images, and every call through a register in them is claimed by a rule that was read against its source.
'''
changes = '''
`scripts/lib/stack_frame_gate.py`: `REGISTER_CALL`, the one pattern of a call through a register (`blx`, or `bx` to a register but `lr`, any condition, `r0`-`r12`, `sl`, `fp`, `ip`), which its count of register calls on a chain uses. `scripts/lib/stack_bound_gate.py`: `SITE` is that pattern; `TAIL` marks the `bx` sites, a function's `tails`; `analyse` keeps a callee reached only by a tail call apart and counts it from the caller's entry, and the chain names such a caller with no frame; the module's statement of what the bound rests on says so; the self-test reads eight instruction forms and the two tail cases. `deploy/stack_call_contracts.json`: the capped buffer's forwarding rules (`txbuf-len`, `txbuf-append-byte`, and new `txbuf-inner-append`, `-reserve`, `-as-slice`, `-truncate`) leave the capped buffer itself out of their callees, since none wraps another, which ended two cycles the tail calls had closed; new rules for the last byte of a VLE in the forge codec (`sink-vle-last-byte`), a proven query's accessors (`proven-query`), four formatter positions (`fmt-write-1633`, `-1851`, `-1859`, `-1960`), the printk hook (`printk-hook`), the TLS library's allocator and its exit (`mbedtls-calloc`, `mbedtls-free`, `mbedtls-arena-exit`, `stdio-fwrite`), the PSA error fallback (`psa-status-fallback`) and the admin configuration's array opening (`admin-config-array`); `tcp-send-hook`, `ssl-checksum`, `ssl-timers`, `psa-entropy-init`, `pk-verify` and `pk-sign` name the functions that make the same call as a tail call; `exit` joins `cold`; the site pins follow (waker 9 in all six, engine-turn 40, engine-behaviour 15, zsock-socket 2, and the TLS and admin rules).
'''
verification = '''
On main 138400197 with this round's commits, `bash scripts/kit-lane.sh build <image>` passes for all six Zephyr kit images (client-fixed, -batching, -get, -tls, -heap, admin-fixed-tls): the stack gate, the stack bound with every call through a register claimed (188, 199, 236, 278, 188 and 349 calls) at the committed bounds (3,520, 3,520, 3,616, 5,868, 3,520 and 11,996 bytes), and the text gate. Read on the same ELFs before the contract followed, the new reader added 30 to 60 sites an image and moved no bound but the two TLS images', by the 32 bytes of a tail caller's frame, which the tail model takes back. `stack_bound_gate.py --selftest` (57 controls, eight instruction forms and two tail cases among them), `--contract` (120 rules), `stack_frame_gate.py --selftest` and `--population` (10 images) pass; `text_owner_gate.py --selftest` passes and the get image reads 174,544 against its moved row. The get text was attributed on the same host by building the image at 03df8515e (173,488, the row's own figure), 25fab7958 (174,120), e27782dc2 (174,296), the pin over 4df161c9e (174,464) and 138400197 (174,544), with a symbol diff of each step. The reason-review pin gate reads OK.
'''
carry = '''
A direct branch to another function (`b`/`b.w` to a function's start) is still counted by the stack bound as a call with the caller's frame kept, which overstates; reading it as the tail call it is would lower bounds and move rows across the images, a change of its own. The stack frame gate's chain of direct calls reads the same way. Next on this track: the SCE pin that takes the sorted vector of host-run starts (a `capic-default` reading with it), the TakeGeneration algorithm, then the census rows whose only gap is U1.
'''
