impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The policy targeted-query (bool, off by default, which is upstream's behaviour of sending a query to every link whose peers declared a matching queryable) is added with its mechanism in the tokio registry. A query can be addressed to one node by the identity its link's handshake gave it, and then goes out on that node's link only. This is the second question about where a query goes, beside the link set of entity-link-restriction, and it shares its place: the registry already fans a query out per face and each face already carries the identity of its node, so the check is one comparison in the loop that exists.

The target names a node and not a link or a queryable, because a node is what a caller knows and the link that reaches it is the engine's business. A node with no link leaves no leg and the query is not widened to the others: widening would answer a question the caller did not ask, from nodes it meant to leave out, so a query for an absent node ends with no replies and says so by having none. The session-local leg and a multicast group are left out of an addressed query, since neither is that node's link. A session keeps one face per node, so the match is at most one leg. When a link set is stated as well, the node's link has to be in the set.

The fan-out took a locality and then a link set and now would take a third argument, so the reach of a get is one value (QueryReach: the set and the target) and the options struct states it. The value's rules and the refusal a build without the policy gives live in the session core (peer_target), the registry reads no policy, and the entry point refuses a target when the policy is off, as the link set does.
'''

changes = '''
deploy/wz-config.toml: one policy row; generated Kconfig.policies, policy_generated.rs, the conformance items and statement vectors follow. crates/wz-session-core/src/peer_target.rs (new): the shape rules, admit and admit_in_build, three tests; query_options.rs: target_peer and with_target_peer. crates/wz-capi-core/src/faces.rs: QueryReach, QueryFace (replacing a four-element tuple clippy refused), fan_query takes the reach and issues the face leg only on the addressed node's face, skipping the local leg and the groups when addressed; engine_port.rs and wz-capi-c get.rs pass the reach of the options. docs/build-configuration.md: a bullet.
'''

verification = '''
On pc2, counted by the tests that ran: wz-session-core --lib peer_target and link_restriction ran 9 and passed (no target admitted whatever the policy, a target needs the policy on, the shape of an identity, the order policy then shape); wz-capi-core --lib ran 5 and passed in the first run and 3 after the clippy repair (link slot numbering; a get limited to one link; a get addressed to a node, over two real faces with two handshaken identities: no target gives two face legs and one local leg, the first node gives one face leg and no local leg, the second node likewise, an unknown identity gives none, and a target together with a link set that excludes the node's link gives none). clippy with -D warnings is clean for wz-session-core, wz-capi-core and wz-capi-c, each crate on its own, all targets; the first run found two errors (a needless borrow, a four-element tuple), both repaired, and the rerun was clean. wz_config.py --check passes (18 policies, 16 generated files current).
'''

carry = '''
Open: the mechanism is not reachable from the Rust API builders or the C ABI yet, so peer_target::admit_in_build has no caller; only the tokio peer and client registry reads the target (the router, cooperative and lwIP engines do not); a get addressed to a node whose face is up but whose declaration sync has not finished is asked anyway, where a stricter reading would wait; the replies of an addressed query keep the consolidation the options state, not none. No end-to-end test over real sockets, and the policy-on arm was not built as a whole image.
'''
