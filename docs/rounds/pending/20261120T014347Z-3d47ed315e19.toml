impact = ["feature-inventory--composable-framework-atomic--preset-catalog/4-conflict-policy", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "watching-zenoh/local-ci-gates"]
decision = '''
Step 4b of the staged binding, its first round: declare what each limit is to the code and generate its value types and snapshots, moving no reader. Each of the 68 limits states its kind (a bound is refused past; a parameter is never unbounded), a bound who makes it grow (local or remote), a parameter the range its code assumes, and a limit that is both what the heap profile does with it (advisory, capacity or quota), since a build default must stay what the build runs with today. A quota is held as setrlimit holds a limit, one word whose every bit set is no bound. The 57 limits a later stage may decide are fields of SessionLimits or RuntimeLimits, held in no byte where the domain is one value (a target with no operating system, or WZ_LIMIT_DOMAINS=defaults); the 11 capacities stay constants. A build value outside its domain no longer compiles.
'''
changes = '''
- `deploy/wz-config.toml`: `kind` on every limit, `driven` on each of 41 bounds (22 local, 19 remote), `range` on each of 27 parameters, `on_heap` on the 29 limits that are both, `zero_unbounded` on the four that read 0 as no bound.
- `scripts/lib/wz_config.py`: validation of the new keys (`limit_kind_problems`), the reader takes an integer array, Kconfig `range` for a parameter, binding rows carry kind, driver and range, the schema states a bound as a count of at least 1 or `unbounded` and a parameter as an integer in its range, and a new emit `rust-limit-snapshots`.
- `crates/wz-session-core/src/limit_binding.rs` (new): `Quota`, `LimitValue`, `LimitDomain` with its refusals (`Outside`, `OutsideLimitDomain`), `LimitSpec`, `Limited`, `LimitField`, `LimitEntry` and `limit_defaults_only`.
- `crates/wz-session-core/src/limits.rs` and the generated `limits_generated.rs` (new): one type per limit a later stage decides, `SessionLimits` (47) and `RuntimeLimits` (10), the tables `SESSION_LIMITS` and `RUNTIME_LIMITS`, and a constant per limit that evaluates its domain in every build.
- `crates/wz-session-core/src/policy_binding.rs`: the words `LimitKind` and `Driven`, and `LimitBinding` gains `kind`, `driven` and `range`; `caps_binding_generated.rs`, `deploy/Kconfig.limits` and `deploy/wz-config.schema.json` regenerated.
- Logic census: slice S10 rows 86 (K) and 87 (X), rows 59 and 61 recounted, and three rows in `files.md`.
'''
verification = '''
- `wz_config.py --selftest` 439/439 with kconfiglib armed, `--check`, `--check-presets` and `--check-equivalence` pass; `logic_census_coverage_gate.py --check` passes with the three new files placed in slice S10.
- wz-session-core tests of `limit_binding`, `limits` and `policy_binding`: 30 run and pass on the heap profile and 30 with `bounded-heapless`; clippy -D warnings of the crate with all targets and with no default features.
- A build that states `WZ_LIMIT_PICO_TX_QUEUE_SIZE=17` does not compile (the domain's refusal is named), and one that states 16 does.
- On the build host used for sizes: the 17 MCU images of the no-allocator gate's lane, each built with its own features and the path remap, are byte-identical before and after this round (sha256 of the loaded bytes); `session_slot_bytes.py --check` and `capability_cost_gate.py --check` (C1cs) pass on both trees, so no budget moved.
- The hook's 152 deferred static gates pass, the one red among them (`silent_skip_gate`) a peer's, repaid on main before this round; `guarded_count_gate.py --range` judges 3 of 3 reached guards.
'''
carry = '''
- Round 2 of step 4b: each reader moves to its snapshot with `limit_read_gate.py`. `SessionLimits` rides in `SessionInitParams` together with its first reader (127 literals in 16 crates), and `RuntimeLimits` with each runtime creator that reads one.
- The counting semaphore `quota::Quota` (0 is no bound) takes the value `limit_binding::Quota` when `QUERIER_MAX_PENDING_QUERIES` moves; until then two types share the name.
- A limit's build default follows the rule its policies follow (owner, 2026-11-20): upstream's behaviour, else wz's before the limit; so the eleven bounds the heap refuses past today keep their build value. Round 3 gives each limit a declared `upstream` value cited from the pinned source, which the upstream profile states, in place of one blanket `unbounded`.
- The defects the classification found (the match cache's `u16` positions, `MAX_MULTICAST_REPLIES` read by no production code, a cut key, the runtime range panics and others) are repaid by the round that follows this one.
'''
