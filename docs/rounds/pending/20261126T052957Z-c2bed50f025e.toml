crates/wz-session-lwip/src/multicast_drive.rs: member_on under the tests that send to the group. crates/wz-runtime-coop/src/ip_stack.rs: the udp listener test counted for one task.
crates/wz-capi-core/src/drive/router_node.rs and router_node/local_face.rs: a get's consolidation resolved and held by its ConsolidatingSink; router_node/engine/port_tests.rs: the kept-query helper names its mode, two Latest tests.
crates/wz-runtime-coop/src/serial_link/links.rs: SerialListener opens its line at the listen (wait_on_line), the test line clears on open, a dial at the listen is answered; the waiting link's type named.
scripts/run-ci.sh: 42 count guards and nine labels moved. docs/.atomic: debt-c1ay-router-forward-count-drift closed, debt-coop-serial-sample-not-handed registered. docs/hosted-red-acks.md: run 45744512160. docs/reason-review-pins.md: the session drive's pin.
'''
