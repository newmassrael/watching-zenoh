impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-3-coherence", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
Repay, in order of what blocks most, the debts that keep main red: build and test failures first, then a defect each failing test found, then the count guards the hosted lanes never reached.

Fourteen guard commands failed. Nine were one unused import in the bundle tests (census-fix's c0e39ae24, carried here so main's session-core lanes compile) and one of this session's own (4654 left holds_in for the codec-open-body tests alone); the others were 50442a992's narrowing of the refused event to builds with a handshake body, which the auth and multilink stages also name, a lwip test helper no test of some builds calls, and a udp listener under test that names its count kind since the cold dial module. The capi-coop host group (census-fix's) stays watching-zenoh-1c's.

A router node's own get handed every reply over as it came, whatever its consolidation: its local face registered the query passthrough. A session's get resolves its mode once (resolved_consolidation: Latest unless named or time-ranged) and holds each key's newest reply to the end, as zenoh's session does; the node now does the same. The kept-query port test, red since 6ee2aa0a3 added it, asked with the default mode and waited for a reply before the end, which Latest never gives: it now names the mode it means, none, and two tests hold Latest to its end on both engines.

A serial listener of the cooperative runtime opened its line at its first accept, and the open clears the line; a peer that dialled as the listen returned had its INIT cleared and its open refused after ten seconds. zenoh-pico opens a listened device at the listen; the listener now does too, and accepts after a link ends still reopen. The sample then crosses the link and reaches the listener's session but not its subscriber's callback, which is registered as its own debt.

Forty-two count guards moved to what their commands print, measured by guarded_count_gate.py over 913bfef90..HEAD; the hosted lanes had stopped at earlier reds and never read them. C1p session-multicast's 67 was never what it ran: 63 at the commit that wrote it.
'''
