impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-6-keyexpr", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "watching-zenoh/local-ci-gates"]
decision = '''
A fifth integration of the pico C ABI release toward docs/c-abi-architecture.md.

The size ledger places what it measures by the module that wrote it. Three session-core modules had no rule and fell to the crate's area: transport_timers (the handshake deadline, the lease and the keep-alive a session owes) and unicast_rx (the receive half: reassembly, the in-place record) are the transport's, and ext_view (what a reader asks of an extension entry) is the codec's. They are placed there now; 1,958 bytes move from sessions to transport, and the rows are set from that reading, so transport's row rises by what it took and not by any change of code.

Size: a row's rank in slot order is read off the slot map's own walk (SlotMap::rank_of and nth_live, one non-generic body) where the coop engine's replay walked each kind's table to count it; the zid a handshake read judged is carried in its facts rather than judged again; a key lets its engine go inside its own drop; a string array is copied in one sized loop; a task store, a datagram's copied receive, a dial's refusal and a link's derived send entries take one body each; a stream link's owed places are left unwritten until used.

The size ledger reads 1.6330 times zenoh-pico in total (from 1.6430): sessions 2.9103, doors 2.3256, transport 3.0440 (with the reclassified 1,958 bytes), driver 1.6202.
'''
changes = '''
deploy/size_ledger.json: owners rules for wz_session_core::transport_timers and unicast_rx (transport) and ext_view (codec), rows set from the reclassified reading.
crates/wz-session-core: slot_map.rs (rank_of, nth_live), inbound.rs and drive.rs and session_actions.rs (InitFacts.zid as a judged SessionZid).
crates/wz-capi-coop: engine.rs and engine/replay.rs (ranks off the slots); tests.rs.
crates/wz-capi-pico: keyexpr.rs (ManuallyDrop engine and session), string_array.rs.
crates/wz-runtime-coop: executor.rs, udp_link.rs, stream_link.rs (owed places in MaybeUninit), transport/state.rs.
docs/reason-review-pins.md two session-close-ingress rows re-read.
'''
verification = '''
Run through bx from the integration worktree on a2601b9d1: the integration verify sweep passed every lane (24: clippy of each changed crate with -D warnings, the changed crates' tests, the coop, pico and lwIP feature combinations, Layer C1nh). The size ledger --measure on a2601b9d1: sessions 92,252 / doors 48,868 / transport 44,875 / driver 30,399 / keyexpr 11,776 / codec 32,379 / language 17,877 bytes against zenoh-pico, total 1.6330, unclassified 0. A per-module read of 58846791a and a2601b9d1 showed transport's rise is unicast_rx 1,030 and transport_timers 928, the modules the new rules place. Locally: mnemosyne-cli validate-workspace (T1 orphan new +0), reason_review_pin_gate, reason_citation_gate, store_reason_citation_gate, upstream_citation_anchor_gate, prose_named_identifier_gate, logic_census_coverage_gate, totality_debt_gate, wz_config.py --check.
'''
carry = '''
Open: the size areas above zenoh-pico are transport 3.04, sessions 2.91, doors 2.33 and driver 1.62. Structural reads per area found the causes: in sessions a face's existence held by three tables and a declaration's life written per kind in two layers; in doors three ways to place an owned object; in driver two seam forms for one send. Lanes are on each. The codec generator's shared extension walk and parts writer, the parent-tag flag of a gated body and an event context for actions wait with the runtime size branch, TD-063, TD-109 and TD-003 for one SCE pin move. The pico ABI performance matrix was started and not yet read.
'''
