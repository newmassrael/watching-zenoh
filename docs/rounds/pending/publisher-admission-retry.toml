impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The policy publisher-admission-retry (bool, off by default, which is upstream's behaviour of waiting for room and, when a droppable message meets a congested lane, counting a drop and returning success) lets one publish state a bounded retry: some attempts with a delay between them, used only when no face accepted the frame. Upstream's call cannot tell a queued frame from a congestion drop, and a caller that must know has nothing to react to; the retry makes the no-room outcome a thing the fan-out can see and act on.

The probe is the decision. The send path already had a no-wait question (it returns the message back when the lane has no room, counts nothing and closes nothing), used by the router egress; the publish now has a probing form built on it, and the fan-out classifies each face as queued, no room, skipped or refused. If any face took the frame nothing is retried, and the faces with no room are skipped as a congestion drop skips them today, so a frame is never offered twice to a face that took it. If none did and some had no room, the fan-out waits the delay and offers the frame again to those faces only, up to the attempts, then ends with nothing delivered; it does not close the session and it does not count a drop. A payload that must be fragmented can never be sent without waiting, so a probe of it is sent the waiting way and is never retried, which keeps what a publish did before.

The pure pass loop is separate from the faces, so its rules (a taker ends it, only no-room faces are re-offered, the waits total attempts times the delay) are tested without a full lane, which no registry test can build. The wait is a blocking sleep on the caller's thread, as a blocking send already is, because the registry's clock sleeps only as a future. The policy is read by the entry point (admit_in_build refuses a stated retry when it is off) and not by the fan-out, as the other per-entity policies are. Shared-memory publishes and the plain-put lane keep their old paths, the lane because it waits and knows no retry, so a publish that states a retry is taken off it.
'''

changes = '''
deploy/wz-config.toml: one policy row; generated files follow. crates/wz-session-core/src/admission_retry.rs (new): the attempts and delay value, its refusals (zero attempts, zero delay, policy off), admit and admit_in_build, tests; publish_options.rs: the field, its setter, and the plain-put lane declining a stated retry. crates/wz-runtime-tokio/src/session/mod.rs: the probing publishes (literal, aliased, aliased by declaration) with the wire outcome queued or no room, and three factorings of code the waiting publish also uses (the push build, the egress stage, the namespace decoration in transport.rs) meant to behave identically; a probe test module. crates/wz-capi-core/src/faces.rs: the no-room leg, the probe closures of the three byte publishes, the pure pass loop, and a type alias clippy asked for; the fan-out runs the loop only when a retry is stated. docs/build-configuration.md: a bullet.
'''

verification = '''
On pc2, counted by the tests that ran: wz-session-core --lib with the admission_retry and plain_put filters ran 8 and passed; wz-runtime-tokio --lib probe_tests ran 5 and passed (the probe frame's bytes equal the waiting publish's for a literal and an aliased key; a full link gives no room and writes nothing, then queued once there is room; a non-remote locality offers nothing; an unknown mapping writes no frame); wz-capi-core --lib with the whole faces module ran 45 and passed, which includes the existing fan-out tests as a regression of the loop that was changed and the new ones (a publish that states a retry is written once to each face with room, with a delay no retry pass could meet; the classification of a probe; a taker in the first pass ends it; only no-room faces are re-offered; a refusal every face would meet ends it at once). clippy with -D warnings is clean for wz-session-core, wz-runtime-tokio, wz-capi-core and wz-capi-c, each on its own, all targets; the first run found one error (a complex type), repaired by an alias and rerun clean. cargo check of wz-runtime-tokio passes for codec-push alone and with access-acl, pubsub-qos and transport-multicast, the combinations the three factorings touch.
'''

carry = '''
Open: no API states a retry (the Rust builders and the C ABI do not), so admit_in_build has no caller; a face whose lane is full cannot be built in a registry test, so the retry-with-no-room path is covered by the pure loop and by the tokio probe test and not through real faces; a payload that must be fragmented is sent the waiting way and can still end in the session close a blocking message has today; multicast groups and the local leg run once after the face passes and are delayed by the waits; the wait blocks the caller's thread for at most attempts times the delay plus the passes. Multi-route atomic transmission, which needs a reservation primitive on the link driver, is not started.
'''
