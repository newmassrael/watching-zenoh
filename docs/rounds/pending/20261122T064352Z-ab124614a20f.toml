impact = ["rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.j-codegen-backend-coverage"]
decision = '''
`wz-ap-demo-app`'s `register_bindings` restated the two rows of its `wz-switchboard.yaml` by hand (census W10), so the dynamic registry and the generated static dispatch agreed only by inspection. The schema crate gives an AP host the deserialize of the sidecar and keeps the row-kind mapping in `SwitchboardRegistry::apply_spec` (`crates/wz-switchboard-schema/src/lib.rs` @ `parsed model to \`SwitchboardRegistry::apply_spec\``). For a host whose document is fixed at build time, the switchboard generator is where the document is already parsed, so it now also writes that parse as a Rust value beside the dispatch, and `register_bindings` hands the value to `apply_spec`. The demo carries no YAML backend and has no start-up parse that can fail, and the rows it registers come from the same parse the dispatch was generated and validated from. The emitter destructures the spec whole, so a field added to the schema stops it compiling until it writes that field.
'''
changes = '''
- crates/wz-switchboard-codegen/src/lib.rs: `generate_spec_value` writes `pub fn switchboard_spec() -> SwitchboardSpec` from a parsed sidecar; two golden tests.
- xtask/src/main.rs: a switchboard target with `spec_value` also gets `switchboard_spec.rs`; only wz-ap-demo-app sets it.
- out/wz-ap-demo-app/switchboard_spec.rs: the generated value; crates/wz-ap-demo-app: `register_bindings` applies it (new dependency on wz-switchboard-schema); crates/wz-ap-demo/src/runner.rs logs the registered row count instead of restating the rows.
- docs/zenoh-logic-as-sce-kinds.md and S10.md: W10 recorded as fixed; S10 row 29 restated.
'''
verification = '''
- On build hosts: wz-switchboard-codegen tests 31 passed (2 new); wz-ap-demo-app tests 4 unit and 4 fan-out integration passed, the integration tests registering through the generated value.
- The regen-codegen action (both stages, all three switchboards) changed 0 files, so the committed `switchboard_spec.rs` is byte-identical to the generator's output.
- clippy -D warnings for wz-switchboard-codegen and wz-ap-demo-app (all targets), wz-ap-demo with `switchboard`, and xtask; rustfmt --check of the changed sources; the pre-push hook's round-fed gates 170 of 170.
'''
carry = '''
- Census findings W12 onward (§7.3) stay recorded and not changed; W9, W10 and W11 are fixed.
'''
