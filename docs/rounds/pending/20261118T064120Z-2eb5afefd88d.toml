impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-15-routing", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-21-router", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-23-adminspace", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-3-scouting", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-10-liveliness", "watching-zenoh/local-ci-gates"]
decision = '''
This round lands one integration of seven parallel axes and three consumer cost claims, chosen by the owner as "categories 1 to 4 and the customer-fork switches". Upstream parity: subscription, queryable, token and interest ids are refusing 32-bit EntityId spaces to the wire; an InitAck to a patch-0 or patch-less InitSyn carries no patch entry; re-dialling a configured connect list is base routing-peer behaviour; the zenoh-c and Rust API Scout names no asker. Session identity is a type: SessionZid holds 1 to 16 bytes, not all zero, refused once where it enters (open, wire parse, scout config), and the dissector reads such a frame and flags its row. The router's client leg holds its faces (a literal-only carrier type, a closed mark set by deregister), memos drop wholesale on a wide change and bound the index walk at one route in eight, all from pc2 readings; three south-peer token rules and the aggregate rules now follow pin 1.10.2, and a CURRENT-only subscriber interest is still answered on purpose because the pico preset sends it. The all-or-none publish reserves the whole chain per writer queue; every engine honours or refuses a stated link set, retry, all-or-none or target by name. The live dissect handle reads one end-to-end judgement from the payload plane, bounds a values call by max_rows, counts what it holds without walking, and its census goes on across front trims with history meaning. The customer-fork catalog gains the rx-callback-offload door and the split-tasks design.
'''
changes = '''
Parity: interest ids and send_declare/prepare/recorded widths are u32 EntityId refusing past u32::MAX; Session::on returns ZResult; capi-c node advanced publishers take the node's own entity ids; stage_negotiated_patch writes no entry at NO_PATCH; loop_peers and the peers machine move from router-connect-reconcile to routing-peer; a relayed Put carries one stamp across tier nets (witness).
Identity: SessionZid (wz-session-core session_zid.rs) replaces Vec zids in SessionInitParams, peer zid slots, accept cookie, MulticastParams, ScoutParams, ScoutedHello and the storage services; SessionEngine::session_zid; parse_init, the JOIN decode and Hello/Scout parse refuse an invalid zid while parse_inbound_observed reads it and rows carry names_no_zid; heap_pool and zeroed_table check all-free in every build; session_slot_bytes.json 36728/36720.
Router: held client routes (held_route.rs, LiteralPush, SendFace, FaceRuntime::close); RouteCache drops whole past half and bounds the index walk at held/8; admin sessions report the region each face was placed in; south-peer tokens told only when asked, FUTURE token interests stored, aggregate cleared for token interests and peer interests; ACL tests build configs with with_acl.
C ABI: wz_capi_c_liveliness_get_ext (capi-c ABI 18) and z_liveliness_get answers the session's own tokens; the offload doors and capability rx-callback-offload (ABI 17); StatementNotHonoured in wz-capi-port, refused by the router and cooperative engines; whole-chain reservation (try_reserve_rooms_for, send_network_message_reserved_chain); scout refuses a stated bad zid (pico) and sends no asker (zenoh-c, Rust API).
Dissect: values window door (dissect ABI 59), memory document values and e2e members (memory revision 3), field document reads the payload plane's judgement (fields 71, row_facts 11), wz-analyze --growing with its extent in the report, retention from maintained earliest instants, census over history with an observed block (census 25).
Admin: the surface document declares read_denied, config_write and aggregated_links.
Tests and CI: a stock-vs-wz gateway placement leg (Layer Z); preset-ap-full reaches transport-stats; the shm witness set names shm_body; count guards moved; docs exec-split-tasks.md, router-table-snapshots.md 6.9 readings, rx-delivery-lane.md, session-lifecycle-intent.md section 7.
'''
verification = '''
pc2 (32 cores, 125 GB), one integration tree, batches 3 to 7 and two focused runs: cargo test --workspace and cargo clippy --workspace --all-targets -D warnings green but for the two router ACL tests a typed zid made unbuildable (rewritten, then green) and four census tests (fixed, then wz-capture 1855 and 1872 with dissect, wz-capi-dissect whole, clippy of both green); wz-session-core --all-features lib and it green; Layer G green; session_slot_bytes --check green after --write (36728/36720); C1bo green; A5 green.
Feature arms read: wz-runtime-tokio router_forward 338 and 399 (token tables), route cache 24/28, keyexpr_index 9, held_route 2, clippy over routing-router-hat alone and with access-qos-overwrite, hotreload with acl, pubsub-ts-stack, routing-routes, routing-peer with and without router-connect-reconcile, session-close-ingress with tls, multilink, routing-accept; wz-capi-c with router-node, advanced, rx-callback-offload, switch-doors, liveliness-get and scout; capi-core, capi-port, capi-coop, zenoh, wz-admin and wz-analyze tests and clippy.
Readings (release, pc2, load recorded in router-table-snapshots 6.9): the live census past the holding limit 1.4 to 2.0 ms with no restart (75 to 190 ms and a restart each beat before); retention 3 to 5 us (30 ms walking); held face lookups 7 to 14 times cheaper than by id at fan-out 512; for a key reaching no route or one route the index brings in 0.9 and 6 us where a scan takes 2.6 ms at 65,536 keys.
C1cc fails only on open-debt 952's witness, as acknowledged. Not run here: Layer Z and the Ewirez stock legs (pc2's oracle store holds no zenohd; Ewirez passed only its non-stock legs), Qz and Qzk, the gateway placement leg; the hosted run judges them.
'''
carry = '''
Open-debt 952 (C1cc) stays open and acknowledged. New debt-atomic-tx-multicast-group-unreserved: a multicast group takes no reservation in the all-or-none publish.
Row facts: the JSON-to-CBOR conversion is about 26% of a row-facts call on pc2 (2.5 of 9.5 ms for 2,000 rows); writing CBOR straight needs the field writers over one JSON/CBOR sink, a round of its own.
The bounded index walk (held/8) was not read on a quiet machine: under load it was still above the scan for a key reaching every route (65,536 keys: 129 ms against 56 ms); read it on an idle host before moving the bound again.
On a live handle with trims, alternating census selectors restart each other's planes (one scope per document); the consumer asks one selector a beat.
The node autoconnect Scout still names the node's zid (the pin sends none); wz's responder uses it to recognise its own echo, an intended difference to record in the scouting atom's reason.
Not run here: Layer Z and the Ewirez stock legs (no zenohd on pc2's oracle store), Qz/Qzk images, and the new gateway placement leg; the next hosted run judges them. Store reasons of liveliness-token, routing-peer and routing-token-tables (register 951) are written in the round's working notes and land as their own store round.
The consumer's three cost claims: tell zenoh-analyzer-25 this landing's main hash, its round, census revision 25, memory revision 3, fields 71 and row_facts 11.
'''
