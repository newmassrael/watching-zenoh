impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-9-query", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint", "watching-zenoh/local-ci-gates"]
decision = '''
Land integration k: five lanes, each verified green alone, merged once and verified once more as a whole; two reds main carried after integration j are repaid at their cause.

The session's gets now live as rows of the session tables in every form (L3's switch): the get plane is gone, a snapshot's leg ends by its face's Final through the same row arithmetic a query's does, and a get ended by a lost face is handed out where the link is lost. The on-use preset takes its memory where each table first needs it and bounds a listener's links by the transmit slots they share, read from the same count the lent form reads (heap-native), which repays main's red tx_pool test: on use, a droppable publish found a slot while a slow link held the session's only one. The peer's face rows hold each face's set in one table, a dial-only build keeps its one place with no mark, and the registry is tested in the form each build ships (peer-rows-held), which repays main's red registry tests: they owed a Final where only queryable lends the Final rows. The W-only udp build and the Windows tail's null result arrive from the Windows lanes.

The size ledger reads one module by its area: the transmit module integration j carved from session_actions is a transport owner like every other tx module, so its bytes are no longer counted as sessions. The D12 client's driver area stays over its ratchet by what integration j added there; the lane that takes it back is verified and lands next.
'''
changes = '''
crates/wz-session-core: get legs as rows read through the description walk (GetLegs::places by RowCount::Queries and LivelinessGets), session tables count pending gets, on-use column bodies taken by one take_column, own chain buffers written within their room, a snapshot row test. crates/wz-capi-coop: the get plane removed, note_ended_gets where a link is lost, a listener's links bounded by shared slots on use (plan, OwnState.tx_slots), face rows in one table with the dial role at row 0 and OnceRows on use, the registry's many-faces form only where listen or group builds it, tests in the sim harness and gated to the form they test, the stand-in answering tokens Interests in builds without interest-answer. crates/wz-runtime-coop: PoolClaim shared by PooledTx and HeapLinkTx::Bounded, a dial-only place with no mark, link cells read through the kind's source. deploy/size_ledger.json: transport_tx owned by transport, the on-use client's rows. scripts/lib/capability_cost_gate.py: the D12 and on-use clients' budgets set from their readings, the removed bodies forbidden in the on-use case. Windows: the W-only udp build plan, the tail profile's null result. docs/c-abi-migration (arch-l3-rows, heap-native, peer-rows, int-j-merges).
'''
verification = '''
In pool trees at the committed SHAs, on bx: each lane verified green alone before the merge (L3 with its snapshot tests in the direct and on-use forms, heap-native with the tx_pool test under listen and tables-on-use, peer-rows-held in the lent listen and group builds, the Windows lanes). The two reds on main were reproduced on main first (tx_pool 2/2 under listen,tables-on-use with listen alone green; the registry tests in the listen and group builds) and pass on integration k. On integration k: wz-session-core (default, liveliness-get), wz-capi-coop (default, listen, group, threads, tables-on-use with listen, group and threads, runtime-plan, query with liveliness-get and local-queryable, the round form) and wz-runtime-coop suites passed; clippy -D warnings on wz-capi-coop (default, listen, group, tables-on-use, runtime-plan, connectivity), wz-runtime-coop and wz-session-core passed; the nondefault-features gate, wz_config --check, capability_cost_gate and size_ledger_gate selftests passed. size_ledger_gate --check reads every area under its row but the D12 client's driver area, which main already reads over it.
'''
