Lanes continuing past k: driver-diet (the D12 client's driver area back under its ratchet, with the receive path's instructions held at the control's), group-link-writer merged onto k (T3d's one constructor, the shared cells, a tokio group's counters in one home) with statement_vectors regenerated, the group send off the session lock re-done over the switch. Debt to file: the MCU group loops take their transport by value; the heap link's second copy of a frame awaits an owned-send door. Owner rulings pending: landing the SCE codec field tables, conn-scout CN4's carrier.
