impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The policy entity-link-restriction (bool, off by default, which is upstream's behaviour of letting every entity use every link of the session) is added, with its mechanism in the tokio registry. An entity can be limited to a set of links: a publish and a query go out only on the named links, and a subscriber and a queryable are declared, and replayed to a link that comes up later, only to the named links, so they hear and answer nothing that arrives over the others. This generalises locality, which says whether an entity takes part in this session's traffic, other nodes', or both, to the second question a node with several links has, which ones.

The value is a type of the session core and not a field of one engine: LinkRestriction is Any or a non-empty set of slots below 64, held in one machine word, so it costs an entity eight bytes and no allocation and an engine with one link per node can read it where it reads locality. A link is named by a slot the engine derives from how the link came to be. In the tokio registry the dialling role is slot 0 and the listener bound nth is slot n + 1, so the faces a listener accepts share its slot and a set that names it names all of them, the later ones included; a face the numbering cannot place has no slot and a limited entity does not use it, because an unnamed link cannot have been named. An empty set is refused where it is built, since an entity that may use no link is unreachable and not restricted.

Three placements are the decision. The check is made where the registry already fans out (the one fan-out every publish shares, the one query fan, the declaration walk, and the replay onto a new face), so no site decides it for itself and a face that joins later means the same as one that was there. Declaring to the named links only is also what limits what an entity hears, because each face holds its own copy of every entity, so the receive side needed no second check. The local plane is not a link and is always reached, and a multicast group has no slot, so a limited entity is not put on one. The policy's whole effect is a refusal at the entry point (LinkRestriction::admit_in_build): with it off, a call that states a set is refused and says why instead of being ignored, so a build without the policy has upstream's entities only. The registry itself does not read the policy, as the multicast refusal's plan does not, so a test names either arm without a second binary.
'''

changes = '''
crates/wz-session-core/src/link_restriction.rs (new): LinkSlot, LinkRestriction (Any or Only(mask)), the refusal type, allows, only, admit and admit_in_build, six tests. publish_options.rs and query_options.rs: a links field and with_links. deploy/wz-config.toml: one policy row; generated Kconfig.policies, policy_generated.rs, the conformance items and statement vectors follow. crates/wz-capi-core/src/faces.rs: link_slot_of_face; the face set carries each face's slot beside it; fan_out_with skips a face the publish's set does not name and skips multicast groups for a limited publish; fan_query takes the set and does the same; declare_subscriber_on_links and declare_queryable_on_links (the existing declare_*_on_wire delegate with Any); the subscription and queryable entries keep their set and the replay onto a new face honours it; faces/multicast.rs: a group that comes up does not receive a limited entity. engine_port.rs, wz-capi-c get.rs, drive.rs: fan_query callers pass the set. docs/build-configuration.md: a bullet.
'''

verification = '''
On pc2, counted by the tests that ran: wz-capi-core --lib, the four new tests (a link's slot is the listener or the dialling role, with the 64th listener unplaced; a publish limited to one link is written to that link only and an unrestricted one to both, counted as Push messages each link was sent; a subscription limited to one link is declared there only and is replayed only there to faces that come up later, counted as Declare messages; a query limited to one link is issued on that link only, with the unrestricted, two-slot and absent-slot cases) ran 4 and passed; wz-session-core --lib link_restriction ran 6 and passed (the defaults, exact slot membership, no-slot refusal, duplicate slots, empty and out-of-range refusal, and the policy arms with the build's own answer). clippy with -D warnings is clean for wz-session-core, wz-capi-core and wz-capi-c, each crate on its own, all targets; the only warnings printed are the ring dependency's. wz_config.py --check passes (17 policies, 16 generated files current). rustfmt was applied to the three files it changed.
'''

carry = '''
Open: the mechanism is not reachable from any API yet. The Rust API builders (publisher, put, subscriber, queryable, get, querier) and the C ABI do not state a set, so LinkRestriction::admit_in_build has no caller; the next step plumbs a set through them and refuses it when the policy is off. Only the tokio peer and client registry reads the set: the router engine, the cooperative engine and the lwIP session do not, and an entity in them is unrestricted. Liveliness tokens and liveliness subscribers have no locality or link set at all and are not covered. The policy-on arm was not built as a whole image: the registry honours a set whatever the policy, and the policy's own effect is the refusal, tested with an explicit flag. A physical link under one multilink face has no slot, so a set cannot name one of several links of a face. The numbering gives the dialling role one slot, so a session that dials several endpoints does not distinguish them. Not run: the Layer C0i census gates for a new policy row, and no end-to-end test over real sockets.
'''
