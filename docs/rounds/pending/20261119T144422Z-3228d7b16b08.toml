impact = ["wire-spec-subset--watching-zenoh-mvp/8-transport-link-matrix"]
decision = '''
Why an encrypted or upgraded zenoh link did not come up is read from its handshake and written on the flow as `handshake`, after `tcp`, `null` for a flow that carried none. TLS, from every whole record the record walk already hands over: the ClientHello's server name, the version the ServerHello chose (its supported_versions selection, its legacy version otherwise), the direction of the ClientHello, each alert with its direction, level and number, the server's first certificate's subject, issuer and validity, and whether the handshake completed (yes when application data flowed both ways after it, no on a fatal alert, undecided otherwise). What TLS 1.2 sends in the clear is read in the clear; TLS 1.3's certificate and its alerts after the ServerHello are read out of the records a key log opened, so without one a TLS 1.3 refusal is undecided with no alert, and the document says so. WebSocket, from the deframer that already steps over the HTTP opening: per direction whether the opening was in the capture, the response's status, the Sec-WebSocket-Protocol values, and each Ping and Pong with the packet and instant of its first byte, placed while those bytes are still held. QUIC, from the census: the direction of the first Initial, whether the other direction answered, and the Initials resent before the answer. Why a QUIC connection closed is in its protected packets and is not read; the name lookups of zenoh endpoints are a claim of their own. The field document moves to revision 79 and row_facts to 19; twenty-three keys and three families arrive, nothing retires.
'''
changes = '''
A capture module, tls_handshake, reads a flow's records into its handshake facts with a bounded DER reader for the certificate; the TLS flow state feeds it from the record walk and from each record the decryption pass opens.
The WebSocket deframer keeps what its HTTP opening said and its Ping and Pong frames, which the stream path places at their packet and instant; the QUIC census counts Initials per direction and the answer.
The field document writes each flow's handshake; revision 79 and row_facts revision 19 rows and tables, the vocabulary gate's three families with fixtures that write every word, the ABI header's section, tags and integer paragraph, the integer-cell gate's cell, the discard-site lint's entry for the handshake reader, and the C consumer's revision pin.
'''
verification = '''
The capture crate's library tests with dissect and fixtures, 1873 passed and 6 ignored, among them a capture of a client refusing a server's certificate whose field document names alert 48, the server name, version 771 and the certificate, a capture of a WebSocket upgrade whose request and response named different subprotocols with the Ping's and the Pong's packets, a TLS 1.3 alert and certificate read out of opened records, a completed TLS 1.3 handshake, a hello split over two records, an alert after a change of cipher spec left unread, alerts past the bound, every cut of a certificate refused without a panic, and resent QUIC Initials ended by an answer. The dissection crate's tests, 259 and 4 passed.
Red-first: with the record walk feeding the handshake nothing and the control frames placed at no packet, the two capture tests fail and the rest pass.
fmt; clippy with warnings denied of wz-capture; wz-capture with no default features builds; the rustdoc lane over the two touched crates; the upstream citation anchor gate; the integer-cell gate; the discard-site lint over this change.
'''
carry = '''
No real capture of a refused certificate or of a subprotocol mismatch was read; the records and frames are built from their layouts. The name lookups of zenoh endpoints (DNS queries and answers) are not read and are left to a claim of their own. Why a QUIC connection closed is in its protected packets; reading it needs the QUIC decryption pass to keep its CONNECTION_CLOSE frames.
A TLS 1.3 handshake refused without a key log reads undecided with no alert, which is what the wire shows; the completion rule for TLS 1.3 counts protected records and does not open them.
'''
