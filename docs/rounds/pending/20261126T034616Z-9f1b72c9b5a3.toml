decision = '''
Repay the build and test reds the last two finished hosted runs (45654176488 on 65283e430, and the jobs of 45728104381 on f72c35889 that had ended) left, each read from its job log and attributed before a fix was written.

Most of them are one shape: two branches each kept green and their merge broke a rule one of them added. 728e86ba8 made the inbound SN gates words judged under no lock while an older test still counted one hold of the facts; e4170f2fa wrote a put from its head on a link 880c0c240 no longer sends data over before it is established; 3a5c8470b counted a lease read by a hold while f9b07386d made the lease a word; f7b1d7b58 added three tests to a module whose count guard stayed at 4. The tests are held to the merged design and not weakened: the walk still asserts no hold, the best-effort baseline check moved into rx_sn_gate, and the held step's control now cuts the lease short through its door and shows a fresh timer judging it.

The rest are builds a feature set reaches and no lane on the author's path built. The direct read (no threads, listen or group) called pinned's private publish_to_subscribers and named the threaded build's Wire alias in told.rs, its declaration watches took the two-argument constructor and walked Link::Up and Link::Opening, which the faces' Link no longer has. 058afaed5 made wz-capi-pico no_std outside its tests and the tokio engine, so session_ext.rs's admin-space String needed the crate prelude. Module docs whose declarations carry docs of their own resolve the inner links from the parent, so each short link there names its item by a full path, and a link to an item another feature gates is a code span naming the feature. The raweth_group leg routes by a ** entry its build could not read as a wildcard.
'''
