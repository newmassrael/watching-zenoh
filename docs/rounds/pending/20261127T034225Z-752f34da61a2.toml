decision = '''
Pay the reader's segments of gone providers by the structure the owner chose on 2026-11-27, ownership rather than liveness: a mapped segment is owned by the buffers that point into it, the reader's table finds it by a Weak, and the table keeps by itself only a bounded set of the last ones used. Whether another process's provider lives cannot be observed without a liveness protocol the wire does not carry; whether a buffer of a segment is held can, and a gone provider sends no new descriptor. The metadata subscription had the same table and the same leak, paid in the same table. The register's closing test holds on a storage that keeps none, and the default storage keeps sixteen so that a subscriber dropping each sample does not map its provider again per message.

Measure the shared-memory arm's growth by symbol before acting on the guess the last round wrote: the guess (five policies over two backends) was mostly wrong, and the new table's search trees were the larger cost. The C ABI's providers now share one boxed backend, compiled once, and the table is a short list; the arm is 14,016 bytes under main.

With S6 landed whole and its one residue paid, the api-compat-rust atom's last REMAINING clause is empty, so the atom is COMPLETE and its review pins go. Four pins of session-close-ingress, red on main because other lanes changed the files they cite, are moved after reading each clause against the file as it is: every one still holds.
'''
changes = '''
crates/wz-zenoh-shm/src/segment_cache.rs (new): the table of mapped segments by Weak with a bounded recent set; crates/wz-zenoh-shm/src/reader.rs, crates/wz-zenoh-shm/src/api/client_storage/mod.rs (ShmClientStorage::mapped_segments, ShmClientStorageBuilder::build_retaining, hidden) and crates/wz-zenoh-shm/src/metadata/subscription.rs use it; crates/wz-zenoh-shm/src/api/provider/shm_provider_backend.rs and crates/wz-zenoh-shm/src/api/common/with_id.rs forward both traits through a Box. crates/wz-capi-c/src/shm.rs: Backing is one ShmProvider<DynBackend>. crates/wz-runtime-tokio/src/shm_reader.rs: two witnesses of the reader's mappings.
docs/.atomic: debt-shm-reader-keeps-segments-of-gone-providers closed; api-compat-rust COMPLETE with its correction. docs/reason-review-pins.md: the api-compat-rust rows dropped, four session-close-ingress rows moved. docs/shm-transport.md, docs/zenoh-logic-as-sce-kinds/S6.md and docs/zenoh-logic-as-sce-kinds/files.md.
