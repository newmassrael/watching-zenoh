impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
- The coop engine delivers through one round table: the delivery lane is removed, and a lent datagram's tokens and replies are held pending in their rows.
- Every refusal of the port's doors is typed by its cause (declarations, write filters, gets, matching listeners, face watches, JOIN on a closed session) and answered with the code zenoh-pico's own door answers.
- A callback is handed over as one Fn and owned by its row; a subscriber's callback is entered at depth 1 on a put.
- zenoh-pico's own programs judge the release form: the control is built as pico is right about RX_CACHE (pico PR 1243), each program gets its own network.
'''
changes = '''
- capi-coop: one round table, lane removed; held replies and tokens off the lane; a lost face's token retractions owed, never dropped; door operations out of line.
- capi-port and capi-pico: typed refusals with pico's codes; one Fn per callback; a unicast endpoint read over its own text with no heap; a put's moved payload read where it lies.
- session-core and runtime-coop: unicast receive state in UnicastRx; one observer type; task table in one block; liveliness get room answered.
- gates and tests: unicast receive path counts as a leg of their own; pico upstream control corrected for RX_CACHE; oversize put held at twice the ceiling.
'''
