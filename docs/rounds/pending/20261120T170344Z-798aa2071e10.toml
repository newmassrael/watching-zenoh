impact = ["watching-zenoh/local-ci-gates"]
decision = '''
Repay the reds of hosted CI run 44740160167 at `581714684`, the last run on main that reached a verdict (the CI runs of `e924c1792`, `4df161c9e` and `5d996a158` were cancelled, and `28aa40068`'s was still queued). Each red was read to the end of its job log and attributed by the gate's own sentence. Several are already repaid on main: A4, C1/C1bnl `port_tests` and C1cs by Round 4567, the 16-bit match-cache test in C1g and C1bnl by `c2a3b9b10` (Round 4566), and C1cc's receive buffer by Round 4569. C1cs read pico-default at 4,709,820, under the 4,715,400 that Round 4567 set. Four reds are repaid here. C1bzr and C1bz: the links to `SessionLimits`, `RuntimeLimits` and `ProgressStamp` in the inner docs of `limits` and `replay_pacing` did not resolve in any configuration. Both modules also carry an outer `///` doc at their `pub mod` in `lib.rs`, rustdoc joins the two, and the joined text resolves from the crate root; the other modules of `lib.rs` are documented from inside with a `//` note, and these two now are too. C1bf, C1cn, C2 and C1af: `packed_writer_e2e.rs` derefs a key that coerces anyway (`clippy::explicit_auto_deref`), from the 2a callers. C1y, C1v and C1cb: the fixed-cookie init-flood test (`fc58d7c76`) and two session-driver tests (`8f3812304`, `7bbf9c0ea`) landed without moving their count guards, which now read what the hosted run printed; watching-zenoh-1e, which owns that work, was told and handed the three to this round. Qzb: zephyr-fixed's chain is 13,512 bytes against a committed 13,376. Since `3dd108842` (Round 4558) a lwIP link names its ends with the engine's locator rule, which is direct calls, and no longer with `write!`, whose `core::fmt` calls go through a register the reader does not follow. The chain now reaches the end's text through the slot claim. The gate asks for the new figure with its reason, against a 65,536-byte stack. The kit's reading is 13,736.
'''
changes = '''
- `crates/wz-session-core/src/lib.rs`: `limits` and `replay_pacing` are documented from inside; the outer `///` at their `pub mod` becomes a `//` note that says why.
- `crates/wz-runtime-tokio/tests/it/files/packed_writer_e2e.rs`: `.register(keyexpr, ..)`, without the explicit deref.
- `scripts/run-ci.sh`: C1v 19 -> 20, C1y `accept_loop` 35 -> 36, C1cb 39 -> 41, each with the tests that moved it and the run that printed it.
- `scripts/lib/stack_frame_gate.py`: zephyr-fixed's peak is 13,512 bytes, with the frames that moved and why the reader now sees them; `deploy/resource_budget.json` matches, and its `chain_misses` and `measured` texts are updated.
'''
verification = '''
- Every red was read from its own job log of run 44740160167, and checked against `origin/main` (`28aa40068`) before it was repaid.
- `cargo doc -p wz-session-core --no-deps` at `28aa40068` and with this change: 120 unresolved links before and 117 after, and the three gone are exactly `SessionLimits`, `RuntimeLimits` and `ProgressStamp` (the rest are on C1bzr's ledger).
- `cargo clippy -p wz-runtime-tokio --test it --features transport-qos,transport-unicast,transport-link-tcp -- -D warnings` passes (bx, hkl002).
- The three counts are what run 44740160167 printed (C1y 36, C1v 20, C1cb 41). No commit after `581714684` touches `accept_loop` or `session_fsm_driver_loop.rs`.
- `stack_frame_gate.py --selftest` and `resource_budget_gate.py --check` pass, the latter with zephyr-fixed at a static chain of 13,512 under a measured peak of 13,736.
- `reason_review_pin_gate.py --check`, `runci_leg_ledger_gate.py --check`, `guarded_count_lattice_gate.py --check` and `upstream_citation_anchor_gate.py --check` pass.
'''
carry = '''
- Layer Z `a_tls_dialer_closes_on_the_listeners_expiry_only_when_told_to_as_zenohd_does` failed in run 44740160167 at the adjudicator. Told `close_link_on_expiration: true`, stock zenohd as the dialer logged that it closed the TLS link, yet its link was still listed after the expiry. One occurrence so far. Read it in the next hosted runs before attributing it.
- C1cn shard 0/2 failed on its time alarm (95% of its 1,800 s budget) in run 44740160167, with no gate failure. Watch the next runs; it may need peeling.
- Layer M `in_a_netns_a_group_session_rejoins_a_reattached_interface_and_admits_a_new_member` (2 of 3 on pc2), and the kit lane's `waker` pin (watching-zenoh-99's), as carried by Round 4567.
- C1bf, C1cn and the NEG lanes stopped at the first clippy error; the hosted CI of this landing is their first full pass since the 2a callers.
'''
