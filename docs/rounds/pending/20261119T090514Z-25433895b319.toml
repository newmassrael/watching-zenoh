impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-25-ext-pubsub", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-18-time"]
decision = '''
W7 of the logic-to-SCE census is repaid: the `_time` selector grammar was written twice, in wz-zenoh-util (upstream's TimeRange, humantime) and in wz-ext-pubsub (a hand copy), and the two disagreed on a fixed start with a negative `;` duration. The grammar, humantime's RFC3339 reader with its three refusals, the resolution and the membership test are now wz_session_core::time_range, no_std and generic over the caller's instant type through a Clock, so every sum is that type's own checked arithmetic. wz-ext-pubsub reads it on SystemTime; wz-zenoh-util keeps upstream's types and rebuilds upstream's error texts from the grammar's refusal. The negative step moves the start back, as upstream moves a now() start, so the range holds nothing. Also repaid: C1bz red from Round 4525, an outer doc on `pub mod doc_out` that made rustdoc resolve the module's inner links in the parent scope; its author agreed.
'''
changes = '''
`crates/wz-session-core/src/time_range.rs` (new): `Clock`, `add_secs`, `Edge`, `TimeExpr`, `TimeRange` (`resolve_at`, `contains`), `parse_range`, `parse_time`, `parse_duration`, `parse_rfc3339_weak`, and the refusals `RangeError`, `TimeError`, `TimeCause`, `DurationError`, `Rfc3339Error`.
`crates/wz-ext-pubsub/src/time_range.rs`: the `Wall` clock, `parse`, `resolve`, `contains_ntp64`, `of_parameters`, `ntp64_to_system_time` over the core types; `advanced_cache.rs` and its tests, `crates/wz-capi-c/src/zenoh_ext.rs` call them.
`crates/wz-zenoh-util/src/time_range.rs`: `FromStr` of `TimeRange` and `TimeExpr` parse through the core and map its refusal to upstream's `zerror!` texts; `checked_add`, `checked_sub`, `checked_resolve_at` use `add_secs`; the depends-on line in `Cargo.toml`; three lockfiles.
`crates/wz-session-core/src/lib.rs`: the `doc_out` declaration's doc is a comment. `docs/zenoh-logic-as-sce-kinds.md` 7.1: W7 fixed.
'''
verification = '''
Layer E18's zenoh-util time range differential test against upstream: 8 of 8, the grid and the seeded draws parsed alike to the same range or the same error text but for the two classes where upstream panics. wz-session-core `time_range` tests: 8 with the default features and 8 without. wz-ext-pubsub lib tests, the cache filter and the wall-clock adapter among them. zenoh-util `time_range` tests (upstream's own). clippy -D warnings of wz-session-core (all targets, and the lib without default features), wz-ext-pubsub, zenoh-util and wz-capi-c. Layer C1bz on wz-session-core, wz-ext-pubsub, zenoh-util and wz-runtime-tokio (the session core read 10 broken links before the doc_out repair, none after). Layer L (lockfiles), the hook's 150 round-fed static gates, the upstream citation anchors and the guarded-count gate over the range.
'''
carry = '''
W1: the keyexpr matcher as an algorithm over chunk offsets, landed with the stack gate and the kit's query-path reading. W3: the hand copy of the upstream codec, not yet scoped. W4 and W5: a pool's run-time lend contract and a link that lends its transmit slot, sent to the SCE session to judge as catalogue entries. The full Layer C1bz (the stale-budget-line half) is read by the hosted run.
'''
