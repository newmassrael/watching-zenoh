impact = ["rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.a-new-kind-algorithm", "rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.j-codegen-backend-coverage"]
decision = '''
U15, a frame layout the product receives at run time, was the logic census's open owner decision; the owner asked for the structure that is right in the long run with cost ignored and left the choice to this track. Decided: a layout is a type, with one language and two bindings. The shape of a header (fields, widths, byte order, masks, bit splits, marks, the CRC model and its cover order) is written in SCE's codec language; a deployment whose shape is confidential keeps that document in its own repository and generates from it there, so the shape still never enters this public repository, which is why `wz-app-frame` takes a profile at run time today. That compiled binding is the only one an MCU image or the zenoh-pico preset carries. What does not change the shape (a data id, a gap bound, a timeout) is run-time data under a build bound. Where a shape is known only at run time, as in an analyzer reading another deployment's capture, the description is a message of one fixed descriptor schema and SCE generates a bounded interpreter of the codec language for it, defined to agree with the compiled binding on every document and input, which is a differential test between the two. A `.proto` schema is imported into a codec document at build time by a schema compiler, and a deployment's message catalogue has one source, a document SCE reads. A run-time layout kind of its own was rejected: a second codec language with its own semantics, an interpreter of untrusted layout text on the device, and a frame's protection configured at run time where end-to-end protection practice fixes it at integration. The same round counts S7 row 107, the pico config doors watching-zenoh-79 classified after Round 4552.
'''
changes = '''
`docs/zenoh-logic-as-sce-kinds.md` gains section 5.1 (U15 decided: the five points, what was rejected and why, what it changes for the C doors that take profile text and which SCE work it asks for), the U15 catalogue row and section 1 point to it, section 5's not-yet-scheduled list no longer names U15, and section 8's `.proto` point reads it. S7 row 107 (233 lines, G, U12) is counted: S7's G 22,506, total G 202,588 of 565,486, U12 27 rows, and the cooperative path's protocol logic 12.0k lines with 8.9k blocked.
'''
