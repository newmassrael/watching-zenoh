impact = ["wire-spec-subset--watching-zenoh-mvp/8-transport-link-matrix"]
decision = '''
The field document now says how each TCP direction's congestion window grew round trip by round trip, which the consumer asked for to judge a window that restarts after an idle and grows again (flights of 10, then 20 segments). Each direction of a flow's tcp gains send_bursts: a burst begins at the direction's first data after the handshake and at each new data segment sent after an idle of 200 ms or more while the peer had acknowledged everything (RFC 5681 section 4.1 restarts the window after an idle longer than the retransmission timeout, and 200 ms is the smallest timeout a common stack uses, Linux's TCP_RTO_MIN). The burst names the idle it followed, so a reader that holds the sender to a longer timeout skips the shorter ones. A flight is one round trip as a sender's slow start counts it (the HyStart round of RFC 9406): it begins with a new data segment and ends when the peer acknowledges that segment. Each flight carries its new data segments and their bytes, the bytes because a capture taken before segmentation offload shows one segment where the wire carried several. Retransmissions and keep-alives are in no flight. A burst that ends within one flight shows no growth, so it is counted (one_flight) and not listed; the list holds the first sixteen bursts of two flights or more, sixteen flights each, and counts the rest. Field document 87 and row_facts 27; nothing retires.
'''
changes = '''
crates/wz-capture/src/tcp_facts.rs: Flight, Burst and the open-burst state per direction; new data segments go to the burst, the peer's acknowledgement of a flight's first segment ends the flight; IDLE_RESTART_NS, BURSTS_HELD and FLIGHTS_HELD; three tests (a restart after a 300 ms idle reads 10 then 20 segments, a capture without the SYNs begins at its first idle, the bounds count what they leave out).
crates/wz-capture/src/fields_json.rs: write_tcp writes send_bursts last in each half, its instant through the integer door with the other tcp instants.
crates/wz-capture/src/doc_revision.rs: fields 87 and row_facts 27 with seven keys (send_bursts, bursts, idle_ns, flights, flights_more, segments, one_flight), and the revision pins.
crates/wz-capi-dissect/include/wz_dissect.h, crates/wz-capi-dissect/tests/c_abi_consumer.c: the tcp section documents send_bursts; the value_families examples and the C consumer's fields pin read 87.
'''
verification = '''
Run through bx on this host from the item's worktree: Layer C1cap passed with 1965 wz-capture tests at Layer C1's features and none filtered out, the three new tcp_facts tests and the vocabulary gate over every_word among them (the fixture's answered connection now writes a listed burst of two flights); Layer C1bo passed its 13 legs, the C consumer linked the cdylib and read the tree with the fields pin at 87; cargo test -p wz-capi-dissect passed (280 and 4); clippy of wz-capture with all targets at the dissect features passed with warnings denied. doc_revision_consumer_pin, json_integer_cell_gate, reason_review_pin_gate, reason_citation_gate, store_reason_citation_gate and gate_test_pin_lint passed. Each verdict is the exit code written to a file by the command itself.
'''
carry = '''
The consumer adds its judgement of a window regrowing after an idle once it pins this commit. A capture of a real restart after an idle has not been read through the new key here; the unit tests drive the state with synthetic segments. If the consumer finds the 200 ms floor too low for its judgement it reads idle_ns, which every burst carries.
'''
