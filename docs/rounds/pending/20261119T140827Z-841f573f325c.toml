impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-6-keyexpr"]
decision = '''
W1 of the logic-to-SCE census is repaid: the keyexpr relations (intersects, includes, matches) were a hand-written descent in wz_session_core::keyexpr_match beside two SCXML placeholders that compared uint32 ids. They are now generated from sources/algorithms/keyexpr_*.scxml as SCE algorithms over key text: one pass reads a key's shape, a greedy walk with one backtrack frame answers whenever at most one key holds **, and a prefix table of uint64 rows answers when both do. The build's wildcard features reach the generated code as its wild_* arguments, so a build without them still reads a wildcard as a literal chunk. Every caller (session core, runtime, access control, storage, admin, C ABI, capture, the zenoh-keyexpr preset) calls the three functions over text. The kit rows of origin were stale before this tree and are moved to the readings; the matcher adds 96 bytes of text to the admin image.
'''
changes = '''
`sources/algorithms/`: keyexpr_intersects, keyexpr_includes, keyexpr_matches, keyexpr_walk, keyexpr_intersects_dp, keyexpr_includes_dp, keyexpr_shape and its schema, the chunk relations and keyexpr_dsl_matches, keyexpr_range_equal, keyexpr_has_dsl, keyexpr_chunk_end, keyexpr_chunk_kind; the id-equality keyexpr_intersect.scxml is removed. xtask emits them and out/ is regenerated.
`crates/wz-session-core/src/keyexpr_match.rs`: `keyexpr_intersects`, `keyexpr_includes`, `keyexpr_matches` call the generated code; the hand-written descent stays as the test oracle. Callers in wz-runtime-tokio, wz-access-control, wz-storage, wz-admin, the C ABI crates, wz-capture, wz-replay, wz-ext-pubsub, the switchboard codegen and the zenoh-keyexpr preset match over text.
`deploy/resource_budget.json`, `deploy/text_budget.json`, `scripts/lib/stack_frame_gate.py`: the six kit images' readings. Inventory: keyexpr-intersect's source, four keyexpr reasons and session-close-ingress's; two reason pins.
'''
verification = '''
wz-session-core keyexpr tests: the generated relations answer what the hand-written descent answered over 819 by 819 key pairs of nine chunk kinds, and Layer C1o's three arms (11, 23, 22) run the OFF arms that read a wildcard as a literal. In-process A/B on pc2: 1.10 times the plain descent on the shapes a router meets. The tests of the eleven caller crates in one run before the walk was narrowed (three wz-capture lz4 failures were feature unification of the joint run and pass alone; the narrowing is held by the 819 by 819 comparison), zenoh-keyexpr's own tests and Layer E18's key expression differential, the session-lwip allocation test (a Put in place costs no allocation), clippy -D warnings of the 16 touched crates. Kit lane on pc2: six images built, stack bound, chain and text read on this tree and on origin 07a955b26. The hook's 150 round-fed static gates, the upstream citation anchors, the reason gates and the guarded-count gate over the range (51 of 51).
'''
carry = '''
The SCE generator types a literal left operand of a shift as i32; the SCE session is fixing it on its branch litshift, and the uint64 local `one` in the two prefix-table documents goes in the same pin move. W3 waits on SCE ADR 0100 and the two items sent with it; W4 and W5 wait on the SCE session's judgment. The kit run of the GET turnaround on the generated matcher was not made. The full Layer C1bz is read by the hosted run.
'''
