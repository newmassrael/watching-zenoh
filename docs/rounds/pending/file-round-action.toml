impact = ["feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-3-coherence"]

decision = '''
A ledger round can now travel in a commit as a descriptor, and one script files it however it arrives. This is the first step of moving the push queue from land.sh's clone-local lock to the bx landing queue, whose integrator cherry-picks a commit onto the remote tip and runs the repository's declared actions: it has no lock, no file outside the commit and no way to say a round number, so the round has to be data in the commit and its number has to be taken on the tree it lands on.

The descriptor (docs/rounds/pending/<slug>.toml, form stated in scripts/lib/round_descriptor.py) holds the impact ids and the four prose fields and no number, because the number is the one fact a commit cannot know: it is the store's last round plus one at the moment of landing. scripts/file-round.sh reads the store's last round, files each pending descriptor as the next round through append-round.sh, and deletes it; a tree with no descriptor is left unchanged. The number is a function of the tree it runs on, which is what lets an integrator run it again on a rebased candidate and get the number right for the new base. Nothing outside the tree enters the filing.

Two choices are the decision. First, the filing is a bx action (file-round) declared in bx.toml and not a hook or a step of the integrator, so it is the repository's own, runs on a copy on a build machine, and is judged against its declared outputs before anything is written. Second, land.sh files descriptors through the same script, so there is one way to file a round and the old path (ledger arguments after the double dash) is the same append underneath; land.sh refuses a batch that has both, since that would file two rounds. The read of the last round is written once (scripts/lib/ledger-round.sh) and both callers source it, so the two cannot number differently. The decisions this follows are recorded outside the repository: acknowledgement as a committed row, a numberless derived subject, the push gate replaced by an integrator check, the confidential-vocabulary gate run on queue refs, and the permission wording, which is the owner's to change.
'''

changes = '''
scripts/file-round.sh (new): files every pending descriptor, or with --check dry-runs the append over a descriptor's prose without filing. scripts/lib/round_descriptor.py (new): reads and validates a descriptor, writes the four prose files outside the tree, with a selftest of 10 arms. scripts/lib/ledger-round.sh (new): wz_last_round. scripts/land.sh: sources ledger-round.sh, files pending descriptors through file-round.sh and names the commit by the rounds filed, refuses ledger arguments together with a descriptor, and its header says so. bx.toml: [actions.file-round] with inputs listed by hand (descriptors, the store, mnemosyne.toml, the three script paths) and outputs the store and the descriptors. scripts/run-ci.sh: Layer C0i gains two arms, the descriptor reader's selftest and file-round refusing a descriptor that is not a file.
'''

verification = '''
round_descriptor.py --selftest passes 10/10 (a complete round is read; a missing key, an unknown key, an empty impact, a non-string impact id, a comma in an id, an empty prose field and a non-TOML file are each refused with their own sentence; the four prose files are written with one closing newline). file-round.sh --check over a trial descriptor reports the home-path scan, the citation gate and the impact resolution all passing and appends nothing; over a path that is not a file it exits 1. bx-fleet decl validate accepts bx.toml with the new action. The action itself, on pc2 with bx --action file-round --dry-run over a trial descriptor in a copy of the tracked files: the run took the number 4392 (the store's last round, 4391, plus one), the store was rewritten, the descriptor was removed, 2 files changed and were judged against the declared outputs and not applied (109 seconds, peak 1.0 GB); the trial descriptor was then deleted from the tree and never committed. shellcheck 0.11.0 passes for land.sh, file-round.sh and ledger-round.sh; run-ci.sh shows the same four info findings as at HEAD. Found by the way: bx RFC 0003 says an action whose outputs another action reads as inputs is refused, and the implementation accepted file-round's outputs alongside regen-codegen's inputs of everything, so the rule in the text is not what the validator checks. Not done: land.sh's descriptor path had not been run before this round, and this round is its first use; no integrator exists yet, so nothing has run file-round as a derive step, and the action's trace (a read outside its inputs) was not run.
'''

carry = '''
Open: the rest of the queue migration. The acknowledgement still travels as WZ_ACK_RED on the pushing process and has to become a row in the pushed range that names a run and no round number. Gate 0p (lock and token) still refuses any push to main that is not land.sh's, so an integrator's push would be refused until the gate recognises it. Gate 0 (confidential vocabulary) does not yet run on pushes of queue refs, which must be in place before the first item is pushed to the public remote. There is no [land] section and no integrator service for this repository, and the push permission in the owner's private instruction file still names land.sh only: the owner widens it, and writing to the queue refs waits for that. The derived commit's subject cannot carry the round number under the fixed derive_message, so the subject on main would lose the number for rounds filed that way; which tools read the number from a subject has not been checked and has to be before the integrator is turned on. The RFC-versus-validator difference on overlapping action inputs and outputs is reported to nobody yet and means file-round's inputs may need narrowing if the validator ever enforces the text. file-round has no cache = true and is not run in an image.
'''
