impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "wire-spec-subset--watching-zenoh-mvp/4-transport-session-layer"]
decision = '''
A multicast group's datagrams are numbered where its producers push them, on the cooperative engine as on the tokio engine: the session core's multicast push gives each fragment its sequence number when it is admitted to the group's send stage, a chain the lane has no room for is cut with the drop marker, and the JOIN advertises the numbers on the wire. A group's read wakes on its socket and on its next due time. The reply limit of the group's queue (MAX_MULTICAST_REPLIES) holds on the stage as it held on the queue, counted apart from the lanes' congestion drops. A stale lane mark no longer drops a droppable message once the socket takes again: the pump has a pass before the mark is read.
'''
changes = '''
- `wz-session-mcu` `group_drive/stage.rs` (new): the group's send stage, its lanes, its reply slots, sequence numbers from session-core's `multicast_tx_push`; `MulticastReplyQueue` back to a bounded FIFO.
- `wz-capi-coop`: the group's read waits on its socket and its due time; the stage replaces S8's bounded queue API.
- `wz-runtime-coop`, `wz-host-net`: a group's wait for input over the program's transport and the host's sockets.
- Census: `group_drive/stage.rs` under S5 (M1's Where).
'''
verification = '''
- On the build hosts: wz-session-mcu `group_drive::` 13 of 13 (codec-push, transport-multicast) and its lib, wz-capi-coop `tests::group::` 15 of 15 (app-transport, group) and the full group feature set, wz-host-net `multicast::`, wz-runtime-coop lib; clippy of the four crates.
- The first run found the cut test red (a put after the cut never arrived): a droppable message read a lane mark the pump had not had a pass to lower; fixed in the stage, with a test that holds the pass.
- Every round-fed gate of the pre-push hook, run locally, passes; the logic census gate passes with the new row.
'''
carry = '''
- The stage's reply-limit drops are not yet in the coop transport counters (E1 adds them).
- A stack whose group gives no writable wait runs one pass for each droppable push while a mark stands: a cost, not a defect.
'''
