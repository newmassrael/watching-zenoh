impact = ["feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-3-coherence"]

decision = '''
Acknowledging a red hosted run is now a row of docs/hosted-red-acks.md that the range being pushed adds, and the environment variable that used to carry it (WZ_ACK_RED, with land.sh --ack-red) is gone. This is the second step of moving the push queue to the bx landing queue, and the reason is a principle and not a convenience: a verdict has to be a function of the commit and the tree it lands on. A queue integrator cherry-picks a commit onto the remote tip, runs the repository's pre-push hook on the result with the push's own stdin line, and pushes for the author; the author's environment is not there, so a gate that reads it gives the integrator a different verdict than it gave the author. The row is in the commit, so whatever runs the hook over the commit reaches the same verdict.

The row keeps the three properties the variable had, because they are what made the acknowledgement an act of reading and not a formality. It is per push: only a row ADDED in the pushed range counts, so a row of an earlier push cannot cover a later red silently (the file's own history repeats rows for one run because the variable was per invocation, and the rule stays). It is per run: the id is matched whole between backticks in the run cell, so one run's digits never acknowledge another. It is by the author: the first column is the author's own label and the gate does not read it, which removes the round number from the acknowledgement, and with it the --round precondition of land.sh (the text of a row named the round, so the round had to be known before filing; a commit holds no such number, since the descriptor round's number is taken on the tree it lands on).

Where the check lives is the decision. The reading of a range for rows is one small tool with a selftest (scripts/lib/hosted_red_ack.py), the previous-run gate takes the range as a third argument and calls it, and the pre-push hook passes the range it already computed for its other gates. Keeping the variable as a second accepted form was refused: two ways to acknowledge is the same unreproducible verdict with a door left open for it.
'''

changes = '''
scripts/lib/hosted_red_ack.py (new): reads the rows a range adds to docs/hosted-red-acks.md and says whether one names a run in its run cell; a selftest of 14 arms in a throwaway repository. scripts/lib/previous-run-gate.sh: wz_previous_run_gate takes the pushed range as its third argument, acknowledges a red run only by a row of that range, no longer reads WZ_ACK_RED, and its refusal says to add a row. .githooks/pre-push: passes the range to gate 2c. scripts/land.sh: --ack-red and --round are refused with the reason, WZ_ACK_RED is no longer passed to the push, the round-precondition exit (5) is gone, and the header says so. scripts/run-ci.sh: Layer C0i runs the selftest. docs/hosted-red-acks.md: the first column is a label and not a round, and the text says the row is the acknowledgement; CLAUDE.md and docs/agent-reference.md say the same.
'''

verification = '''
hosted_red_ack.py --selftest passes 14/14: a row added in the range acknowledges its run; a row naming two runs acknowledges each; a run no row names, a row of an earlier push, an id inside a longer id, an id outside backticks, a run named in the note cell, a line that is not a table row, a removed row and a row added and removed inside the range acknowledge nothing; a run acknowledged again by a later push counts there; the command-line form agrees with the function in both directions. The gate itself, driven in a throwaway repository with a stand-in for gh that reports run 777 failed, six arms each with its expected exit: no row in the range refuses; a row for another run refuses; a row naming 777 added in the range proceeds and prints that it was acknowledged by a row; the same row with the range starting after it refuses; no range given refuses; WZ_ACK_RED=777 in the environment no longer acknowledges. shellcheck 0.11.0 passes for land.sh, file-round.sh, ledger-round.sh, previous-run-gate.sh and .githooks/pre-push; land.sh with --ack-red exits 2 with the reason. Not done: the gate was not run against a real red hosted run (the stand-in replaces gh), no integrator exists to run the hook on a cherry-picked commit, and the repository's earlier rows are not rewritten (their first column keeps the round numbers they were written with).
'''

carry = '''
Open: gate 0p still refuses a push to main that holds no push lock and token, so an integrator's push is refused until it is replaced by a check that the push is the integrator's (step three); the confidential-vocabulary gate does not yet run on pushes of queue refs; there is no [land] section and no integrator service, and writing to the queue refs waits for the owner to widen the push permission in the private instruction file. The moving anchor the old variable's comma list answered is still real: the gate grades the newest finished run and a hook run takes long enough for a newer red to appear, so a push can be refused naming a run the row does not carry; the answer is the same as before, the row names every run the author read, and a refused queue item returns with the run in its message so the author adds it and lands again, at the cost of one more round trip than the variable cost. The first column of the old rows still holds round numbers; nothing reads it, so they are left as history.
'''
