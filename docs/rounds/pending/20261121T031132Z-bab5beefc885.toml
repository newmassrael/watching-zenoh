impact = ["rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.a-new-kind-algorithm", "rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.l-new-kind-bounded-collection", "watching-zenoh/local-ci-gates"]
decision = '''
The lifecycle reset's duplicate suppression (decision D6) was written twice by hand: a `BTreeMap` in the heap profile's `lifecycle_query` and a `FixedVec` in the fixed-memory connect manager. It is now one SCE algorithm, `sources/algorithms/take_generation.scxml`, which takes the table `inout` as a `map<record, uint64>` (SCE ADR 0108, step 7, which the pin 8525a3e265b lowers in Rust and C11), keyed by the zid read as the 128-bit number zenoh compares (its low and high halves), and answers taken, duplicate with the last generation, or no room, never evicting. `wz-session-core::reset_generations::ResetGenerations<N>` holds the map, and the heap profile answers through it. A heap node must never answer no room (the contract of `Generation::NoRoom`), so its bound is half the numbers a slot holds: a map grows as it fills, and twice that bound is the largest index a 32-bit target counts. The table's seed is the host's: `LifecycleQueries::new` takes it, and `wz-runtime-tokio` draws it from `getrandom`, so a peer cannot crowd one chain of the index with chosen zids; a host without entropy hosts no lifecycle query.

The fixed-memory half waits for SCE. Its table is in a `static` built by a `const fn` whose bytes are all zero, so it is in `.bss`, and the map at the pin is neither `const`-built nor zero when empty. The SCE session (scxml-core-engine-dd) agreed to store slot numbers plus one (zero is no slot), make `with_seed` a `const fn` and add `reseed`, and will send the commit. The same landing repays my own static red from Round 4576: `census_shard_plan.py` lacked its provenance line.
'''
changes = '''
New: `sources/algorithms/take_generation.scxml`, `reset_peer_schema.scxml`, `take_generation_kind.scxml`, `take_generation_duplicate.scxml`, `take_generation_result.scxml`; their emits and SCE's standard `put_outcome` in `out/wz-session-core/`; `crates/wz-session-core/src/reset_generations.rs` (under `storage-profile`, with six unit tests). `wz-codegen-build` gains `emit_enum` and `emit_union` over one private `emit_unit`; the xtask emits the new units and `put_outcome` from `vendor/sce/stdlib/collection`. `LifecycleQueries::new` takes a `MapSeed` (re-exported from `lifecycle_query`); `wz_runtime_tokio::lifecycle_reset_seed_from_os_entropy`; `wz-ap-demo` draws the seed and hosts no lifecycle query without one; three tokio call sites pass a seed. The census docs record the pilot (section 7.1, S2 row 30, S5 row M5, `files.md`); the `session-close-ingress` reason pin of `session_lifecycle_open.rs` is re-read and moved. `census_shard_plan.py` opens with `R4576 (no register item)`.
'''
verification = '''
`bash scripts/regen-codegen.sh --stage1` with the pinned `sce-codegen` (built by `scripts/build-sce.sh`) writes only the six new files. `cargo test -p wz-session-core --features storage-profile,session-unicast,session-close-ingress,secure-channel,alloc --lib -- reset_generations lifecycle_query`: 22 run, 22 passed (six of them the new table's). `wz-runtime-tokio`: `files::session_close_query` 5 passed, `files::passive_hold_over_mtls_e2e` 3 passed, lib `session_lifecycle_open` 9 passed. Clippy `-D warnings` is clean for `wz-session-core` (heap features), `wz-session-mcu` (`lifecycle-reset`), `wz-runtime-tokio`, `wz-ap-demo`, `wz-codegen-build` and the xtask. `capability_cost_gate.py --measure` on hkl001 reads the four C ABI builds byte for byte as Round 4575 did (`capic-default` 11,461,825, `capic-default-lean` 9,664,217, `pico-default` 4,718,980, `pico-client-small` 1,628,654). The hook's 156 round-fed gates pass after the census and pin rows, as do the upstream citation gate (`--check --resolve`), `relicense_spdx.py --check` and `gate_provenance_lint.py`.
'''
