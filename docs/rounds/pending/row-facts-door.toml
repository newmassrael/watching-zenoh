impact = ["wire-spec-subset--watching-zenoh-mvp/6-zenoh-payload-layer"]

decision = '''
A consumer that lists a live capture's rows asked for the field document's rows after its cursor at every step and could not keep up at 20,000 small messages a second: a row was about 3.7 KB and about 17 us to write, and its own parse cost as much again. Its list reads what each row says about the message (carried, payload_decode, above_transport, sn, chain, first_byte, l2, the coordinates) and none of the row's field tree, which it asks for one picked message at a time. It asked for those facts in binary, the shape to be chosen here.

Measured first, on a capture of 64-byte pushes (benches/row_facts_cost.rs, 20,004 rows): with the trees a row was 3,756 bytes and 14.8 us; without them 970 bytes and 4.4 us. The trees are 74% of a row's bytes and 70% of the call. So the cost is the trees, and the facts are already computed by one writer from one walk.

The rows without their trees are written by that same writer: fields_json::Trees::Left leaves out a row's fields tree and a completed chain's above_transport.fields trees and nothing else, from the same walk. A second writer of the same facts in a binary layout was refused: every fact would have two derivations, held to each other by hope. The document is its own, row_facts revision 1, as this library already names a shape by a document (the selection documents were split off the field document for the same reason); its key set is the field document's at revision 60 less the two keys only a tree writes (a node's kind and selector_path), its families the same less kind, and its carries the same with the fields a row's offset_space and a chain's carried_state brought taken out. A test holds the set to the field document's newest, so a key added to a row cannot reach row_facts under a stale revision.

The binary form is RFC 8949's mapping of that JSON onto CBOR (cbor_of_json), key for key, definite lengths and preferred serialization, so the binary rows are the one writer's rows and a reader that knows the field document knows this one. The conversion costs 1.9 us a row over the treeless text (707 bytes a row against 970); a native CBOR writer would save that, and it is a carry, not done here, because it is a second writer of every key the document has.

The door is wz_dissect_live_row_facts_since and wz_dissect_live_row_facts_take, ABI 55. Bytes are not a string and this ABI does not allocate what it hands back, so they go into a buffer the caller owns: when it holds them the call is over, and when it does not the handle keeps the document until the take copies it out, because asking again would move the handle's memory a second time. The memory rule does not move. The handle keeps a FieldsMemory per shape, so a consumer that steps with this door and asks the field door for one picked row leaves each walk where it was; the memory document's fields group counts both.

The field document moves to revision 60: a datagram flow's disagreements group (count, named, and each named frame's at) has been written since the field layer's first round and no key set listed it. Found when row_facts was held to its key set; the pin population gains a document that names a disagreement.
'''

changes = '''
crates/wz-capture: fields_json gets Trees (Written, Left), a FieldsMemory fixed to one shape (with_trees), and the shape threaded through RowAttachments, RowTags and RowWalk to the two tree writers and the envelope; cbor_of_json (new) writes a JSON document as CBOR and reads it back (json_of_cbor); doc_revision gets ROW_FACTS revision 1 with its keys, families and carries, FIELDS revision 60, ROW_FACTS_TREE_ONLY_KEYS and ROW_FACTS_TREE_ONLY_FAMILIES; row_facts_tests (new) holds the row-facts document to the field document cut of its trees over stream, datagram, frame and chain rows, with and without declarations; the payload-plane pin, the value-family gate and the carries gate take a row-facts population; benches/row_facts_cost.rs (new) measures the three.
crates/wz-capi-dissect: the live handle keeps a facts memory and the held document, row_facts_since and take_row_facts, and one since_window body for both shapes; the two doors, ABI 55; the header declares them with the row_facts @values and @carries markers; the C consumer and a Rust test step the door against a handle that asks only it; the document gates read the door's bytes back as JSON. scripts/lib/capi_abi_pin.py (55 and the two symbols) and scripts/lib/analysis_surface_parity.py (two rows).
Two reds already on main, found by running every Layer C0 python gate before the push, repaid here: scripts/lib/discard_site_lint.py reads `ended.push(` as accounting (the segment chain hands an ended transfer to the verdict that reports it, at both of its removals) and registers the chain's forgetting of the verdicts of rows a ceiling took, which owes nothing; docs/reason-review-pins.md moves the two session-close-ingress rows whose files changed since round 4428 (session_glue.rs, session_actions.rs) after reading the reason against them: the OutOfBand slot and its Waker, the loop-head check_out_of_band and the signalled arm in both selects all still stand as the reason says.
'''

verification = '''
On build machines: wz-capture with fixtures and dissect, every library test passes (1,724 before the door, and the row-facts, CBOR and revision tests after it); wz-capi-dissect, every test passes (232 library tests, the handle memory gate's 4, the C consumer); clippy -D warnings on each crate with all targets.
benches/row_facts_cost.rs on hkl001, 20,004 rows of 64-byte pushes: with trees 14.82 us and 3,755.7 B a row, without 4.44 us and 969.6 B, the CBOR of the treeless text 1.90 us and 706.9 B; read in ten steps as the capture grew, 13.36 us against 4.21 us a row.
'''

carry = '''
The consumer is told ABI 55, row_facts 1, fields 60 and the commit. Open: the CBOR is a conversion of the writer's text, 1.9 us a row; a writer that wrote CBOR natively would remove it and is a second writer of every key, so it waits for a measurement that says the consumer's step needs it. The consumer's own costs (its row join, its step's census and health reads) are its own. The held document is not in the memory document, as a returned string is not; it lives from one call to its take or the next call. Found and not touched: wz-capture with dissect and without network-codecs does not build (RowJudgement is gated on network-codecs and named ungated in fields_json), before this round as after it.
'''
