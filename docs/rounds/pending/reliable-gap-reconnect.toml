impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The policy reliable-gap-reconnect (a choice: off, until-declarations-synced, always; off by default, which is upstream's behaviour of accepting a forward jump of the reliable sequence number and dropping one that does not advance) lets a build end the link when a reliable frame shows that frames were lost. With a reacting mode the frame that shows the gap is dropped and the link is reported lost, so the existing supervisor reopens the session and redoes the declaration sync, which is the only way to get back frames the reliable channel promised and did not deliver. Best-effort channels are untouched, since loss there is not a fault.

The judge is widened and not replaced: the sequence-number admit returned a bool, so a gap was invisible, and it now has a judged form (accept, a gap with the count missing, stale) with the bool form as a thin wrapper, so every existing caller and test is unchanged. The reaction sits where the driver loop already ends a link for a protocol fault, beside the unknown-priority precedent, as a new lost cause, so nothing about reconnection is new: a lost link already rides the supervisor. With the policy off the code takes the old bool path unchanged.

until-declarations-synced reacts only while the peer's initial declarations have not all arrived, because a gap during the replay of declarations is repaired by the reconnect that replays them again, and after that a gap would be a loss the reconnect cannot make good. The peer's final was readable only in the tokio session, after the sequence gate, so it is mirrored into an atomic on the session core, set when a final of the initial interest arrives and cleared when the session is reopened; a final that answers an interest the node itself sent is not the peer's. The pure decision (mode and that flag) is one const function with its truth table tested.
'''

changes = '''
deploy/wz-config.toml: one choice policy row; generated Kconfig.policies, policy_generated.rs (the enum with three variants and the field), the conformance items and statement vectors follow. crates/wz-session-core/src/sn.rs: the judged admit, its wrapper, the conduit form and the decision function, with tests. crates/wz-session-core/src/link.rs: the lost cause. crates/wz-session-core/src/session_actions.rs: the peer-final atomic, the judged admit method, the note and the reset on reopen. crates/wz-session-core/src/drive.rs: the reaction in the frame refusal and the fragment arm. Two tests in the tokio glue for the peer-final flag and three driver-loop tests. docs/build-configuration.md: a bullet.
'''

verification = '''
On pc2, counted by the tests that ran: wz-session-core --lib with the sn and decision filters ran 19 and passed (the judged admit: a forward gap with its count, the ring seam read as a distance of one, the first frame of an unseeded channel as no gap, independent channels, the wrapper as the folded verdict, the conduit baselines, and all six cells of the mode and peer-final truth table); wz-runtime-tokio --lib with the reconnect features ran 24 and passed (the peer's initial final is noted and a reopen forgets it; a final that answers the node's own interest is not the peer's); the driver-loop target filtered to the gap tests ran 37 and passed in the default build and again with the policy built as always and as until-declarations-synced, three gap tests each time (a reliable gap ends the link with the lost cause and state closed only when the mode says so; best-effort never ends it; after the peer's declarations are final the mode decides). clippy with -D warnings is clean for wz-session-core and wz-runtime-tokio. wz_config.py --check passes.
'''

carry = '''
Open: only the tokio session feeds the peer-final flag, so on another engine until-declarations-synced acts as always; multicast has its own gate and is not covered; a reacting mode can fire on a hole the sender itself leaves in its reliable ring (a lost stop marker of a fragment chain under the lend-only policy, a chain abandoned after its sequence numbers were reserved), which was read from the code and not measured; a peer whose first reliable frame is not at the initial sequence number of its open shows a gap at once; the policy is not stated by any API and no end-to-end test over real sockets was run.
'''
