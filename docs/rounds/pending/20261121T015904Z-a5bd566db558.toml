impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
An opening session that receives an InitAck naming a larger batch than its InitSyn advertised now follows the rule of the ABI it serves. Upstream zenoh keeps the session and uses the smaller batch; zenoh-pico refuses it as it refuses an enlarged resolution. wz refused on every ABI. Round 4569 lowered the zenoh ABI's advertisement to the MSS rule, so Layer Z's InitAck, which states the widest batch, was refused with Close(INVALID) and two config legs failed. `LinkRxConf` states the rule beside `tcp_mtu`: zenoh's by default, pico's in the pico ABI. The resolutions are refused under both.
'''
changes = '''
- `crates/wz-session-core`: `WiderInitAckBatch` (`Adopt`, `Refuse`) in `peer_init_caps`, read by `init_ack_exceeds_advertisement` and carried by `LinkRxConf::wider_init_ack_batch`; the drive comment no longer says zenoh refuses the batch.
- `crates/wz-capi-pico/src/session.rs`: the pico ABI states `Refuse`. Tests: the predicate under both rules, the tokio FSM refusal under pico's rule and adoption under zenoh's.
- `link_pipeline.rs`: the Windows test build reads its stream; the doc links `TcpLinkMtu`. `docs/reason-review-pins.md`: `session-close-ingress` re-read against three files.
'''
verification = '''
- Layer Z `wz_reads_a_stock_zenohd_config` 15 passed against zenohd 1.10.2 (both config legs failed before, Close reason 2).
- wz-session-core `init_ack` 5, wz-runtime-tokio `session_fsm_driver_loop` 42 and `link_pipeline` 18 and the capped-batch glue test pass; clippy -D warnings of the three crates; C1bz on them passes.
- Static bundle 156 gates, upstream citation, reason pins, count guard and leg ledger pass.
'''
carry = '''
- C1cc `zenoh_c_shm_session_keys` threshold failed once on hosted between two libzenohc programs, no wz code in the pair; it passed 3 of 3 locally. Read it again on the next hosted run.
- Layer Z TLS close-on-expiry and Layer M group re-join stay as before.
'''
