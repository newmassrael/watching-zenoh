decision = '''
A twelfth integration of the pico C ABI toward docs/c-abi-architecture.md: the session's rounds, locks and lent places are made where they stay, and two reds main carried are paid.

Rounds: the delivery round is kept only where a threads, listen or group build queues records in it. The one-link (direct) read hands its samples, replies, declaration watches and peer tokens row by row, and asks its own get with no round. The session's planes and locks are made in the place they stay, rather than built on the stack and copied. Values a session lends out are lodged in places of its arena, laid out when the ABI is built.

Main's red, C1nh: a pico C ABI session over the pipe failed to open with -78 (_Z_ERR_SYSTEM_OUT_OF_MEMORY). The peer pools now lend a directory of where the peers' rows lie from the same arena as the three pools, but the coop arena plan counted only the three pools. The plan now carries the directory as its own row, and a test holds the plan's pool rows to what lending the pools takes.

Main's red, logic census: the three send deferral files had no row. The session's deferred send queue is placed in slice S1, beside the send gate. The registry's per-thread hold, which flushes once the registry lock is let go, is placed in S7 beside the face registry.

Size: sessions 81,211 bytes against zenoh-pico's 31,698, under its ratchet.
'''
changes = '''
- crates/wz-capi-coop: the round kept only where threads, listen or group queue records; the direct read hands rows singly; locks, planes and the lodging table laid in place; arena.rs carries the peer row directory.
- crates/wz-session-core: planes and locks made in place; a leg's sink keeps no round; a delivery takes samples only where it hands them.
- crates/wz-capi-port, crates/wz-runtime-coop, crates/wz-host-sync, crates/wz-capi-c, crates/wz-session-mcu: the places and counts those moves need.
- docs/zenoh-logic-as-sce-kinds: S1 row 84, S7 row 151 and three files.md rows for the send deferral files; docs/c-abi-no-heap-pools.md names the directory row.
'''
