impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-27-api-compat", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
Run 44965297393 at eac841595 (and 44945434085 at 9602b8617) went red in 16 jobs with several causes, repaid here together. (1) C1f/C1t: `a_heap_table_remembers_as_many_keys_as_its_creator_states` subscribed `a/*`, which a build without `keyexpr-wildcard-single` (the C1f no-default arm) matches only as text, so the delivery read 0; the test is of the match cache, not of wildcards, and now subscribes a literal key. (2) Count guards: C1cb 41 to 44 and C1ah 41 to 42, moved to what the runs printed. (3) C1cn/C1bnl: the six `limits::enforcement` tests of `shared-key-ids` and `app-link` and wz-capture's `proto_encode_tests` (`message-payload`) were claimed by no leg; the wz-capi-coop leg filtered on the name prefix `decl_watch`, now two module paths. (4) C1bzr/C1bz: glue.rs's `[`log`]` is ambiguous with the `log` crate (now `fn@log`); timestamp_source.rs linked `std::time::SystemTime` in a build without std (now a code span); the reduced set that keeps both `os-posix` and `os-zephyr` is refused by wz-capi-pico's guard by name, which is the crate's design, so the ledger records the refusal; six rows of wz-capi-core and wz-capi-port measured 0 and are dropped. (5) C1bn: wz-app-frame's `sce-generated-codec` gates one test arm and no public item, stated in NO_PUBLIC_PATH. (6) C1cc: the shared-memory session-keys differential waited 2 s for the sender's provider; upstream builds the `transport_optimization` pool in the background and sends a message above the threshold as its bytes until the pool is ready (`io/zenoh-transport/src/common/shm/interop.rs` @ `if let ProviderInitState::Ready(provider) = self.try_get_provider() {`), and the hosted runner mapped the pool later than that. Upstream's blocking ask is not usable for the wait: it receives the build's one word off the channel the lazy provider polls (`zenoh-c/src/session.rs` @ `waiter.recv_async().await.ok().flatten()`), after which the transport's provider stays initializing; that is upstream's defect, and wz does not take it on (its provider state is a monitor every ask reads; a new unit test holds that a blocking ask leaves the provider ready for the transport). The programs now wait on signals only: the sender asks the provider without blocking until it has left its build, the receiver is known by the matching status of a publisher on the key and the sender closes once it has left, a reply's receiver asks once the querier's matching status names the sender's queryable, which is declared only after the provider is ready; the only times left are deadlines that end a broken run.
'''
changes = '''
- crates/wz-session-core/src/pubsub.rs: the match-cache test subscribes a literal key.
- scripts/run-ci.sh: C1cb 44, C1ah 42, with the commits that moved them.
- scripts/lib/nondefault-tests-gate.sh: legs for `limits::enforcement::` (shared-key-ids, app-link) and `proto_encode_tests::` (message-payload); the wz-capi-coop decl_watch leg split into `engine::decl_watch::` and `tests::decl_watch::`.
- crates/wz-runtime-posix/src/glue.rs, crates/wz-node-time/src/timestamp_source.rs: doc links that resolve in every set.
- scripts/lib/reduced_docs_ledger.txt: the os-posix/os-zephyr refusal row; six stale rows dropped.
- scripts/lib/feature_gate_diagnostic.py: wz-app-frame `sce-generated-codec` in NO_PUBLIC_PATH.
- crates/wz-integration-tests/tests/it/files/zenoh_c_shm_session_keys_twice_and_diff.rs: sender and receiver wait on the provider's state and on matching status, not on the clock; RECEIVER_SECONDS is a 60 s deadline.
- crates/wz-capi-c/src/shm.rs: `a_blocking_ask_leaves_the_provider_ready_for_the_transport`.
'''
