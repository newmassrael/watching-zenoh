debt-shm-reader-keeps-segments-of-gone-providers: a weak reference to the mapped segment plus a bounded set of recent strong ones in ShmReader would unmap a segment once no buffer of it is held; it closes the debt by another criterion than the register states, so it waits for the owner. C1d own-space alias test: read the next hosted run that reaches it. The shared-memory arm's +34,704 bytes: the C ABI instantiates five policy compositions over two backends; a provider that erases the backend behind one type would take most of it back. Then the register's CRITICAL item 15.
