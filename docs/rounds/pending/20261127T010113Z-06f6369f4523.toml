impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-27-api-compat"]
decision = '''
Finish the reds of the first uncancelled hosted run that the last round left, and land stage S6 of the shared-memory transport, steps 3 to 5, which the agent session wrote and this round verified.

S6 makes one shared-memory system per process. The C ABI's provider is zenoh-shm's ShmProvider over the POSIX backend or a C program's callbacks, as zenoh-c's is; the engine's provider, backends, POSIX segments and segment watchdog are gone, and the transport keeps what upstream's transport keeps (the auth segment, the handoff counters, the relay pass) on one reactor. The top crate's adapter folds into the engine's ShmBuffer, so ShmSendBuffer and ShmResolver have one implementation each. A race the verification found in the new code is repaired: a sweep of the providers kept for receivers returned while another sweep still held what it took out, so a test that dropped its last holder could read the slot before it was reclaimed; one sweep runs at a time and the kept count covers a provider until it is dropped. The cost is measured and recorded: the shared-memory arm of the C library grows 34,704 bytes (the provider is generic over its backend and policies), and the build without shared memory is unchanged and links no zenoh-shm.

C1's handle memory gate failed only in the workspace resolution, where other members turn on sce-rust-runtime's std and each passive chain router grows. The root cause is not the resolution but that every flow held two routers before any fragment came; they are now made with the first fragment, which is what the gate's bound exists to enforce. The capic default budgets move to their reading after a symbol diff against the commit that set them, the growth being chosen features. The C1bnl shape check was repaired by another session's round.

Not paid: the reader keeps the segments of a gone provider (registered); its proposed repair (a weak reference and a bounded recent set) changes the debt's closing criterion and needs the owner's word. C1d's own-space alias test, which no hosted run has reached again. The Windows pico ratchet.
'''
changes = '''
crates/wz-runtime-tokio: shm_provider.rs, shm_backend.rs, shm_posix_backend.rs, posix_shm and shm_watchdog.rs removed; shm_buffer.rs (new) holds IssuedBuffer, ShmBuffer, transport_copy and the reactor; shm_auth_segment over zenoh-shm's StructInSHM; Cargo.toml drops posix-shm-segment, memmap2 and talc. crates/wz-capi-c shm.rs: the provider over ShmProvider with zenoh-c's policies and ForeignBackend. crates/wz-capi-core and crates/wz-zenoh/src/api/shm.rs: through the engine's buffer. crates/wz-zenoh-shm: hidden accessors, a backend's accepts check, BlockOn refusing with nothing outstanding. crates/Cargo.lock, conformance/differential-shm/Cargo.lock, scripts/run-ci.sh C1af guards.
crates/wz-session-core/src/passive.rs: PassiveRouters, the two routers made with the first fragment. scripts/lib/capability_cost_gate.py: capic-default and capic-default-lean budgets with their attribution. docs/shm-transport.md: S6 steps 3 to 5 and their measurement. docs/hosted-red-acks.md.
'''
