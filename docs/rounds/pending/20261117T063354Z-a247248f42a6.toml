impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-27-api-compat", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
This round pays the hosted red of run 43914611055 on the landed 65ec9acd16 as a round of its own, each failing job read from its own log and attributed before a fix was written. One defect is in the product: a wz-capi-c publisher on a client session never asked the router for its subscribers, so a consumer polling z_publisher_get_matching_status without a matching listener read false forever. Upstream asks at declaration (`zenoh/src/api/session.rs` @ `fn declare_publisher_inner`), once per key or per aggregated_publishers aggregate, and skips a SessionLocal publisher; wz-capi-c now does the same through the shared write-filter registry, which the Rust API already used, and the ask moves to the aggregate there too. The remaining reds are figures the 8e landing moved without moving its gates: count guards set to what their commands print, the pico-default text budget at its hosted reading after a symbol diff showed chosen growth, and four Zephyr stack chains read on the board images. The zenoh-c link-resources witness asserted an exact batch lead that libzenohc itself does not hold (14 or 15 across runs); it now asserts the quantity upstream fixes exactly, the batches a larger data queue adds at open, and that exposes a wz gap filed as open-debt 952. C1bnl's allocation witness is red since 2026-11-15 from a cause outside this push (open-debt 953); both are acknowledged unpaid.
'''
changes = '''
C ABI: a publisher that may reach the network declares a subscriber-plane write filter at its declaration (FilterAsk keyed by publisher_aggregate), held for its life and released at undeclare; the advanced publisher holds one too; a router-node test polls matching status with no listener.
Gates: count guards C1cb 39, C1q 42/46/48, C1ax multicast_glue 45, C1af shm_provider 45 and posix_shm 17, C1bg filesystem_datainfo 10; the pico-default budget 4,595,600 with its symbol attribution; stack-chain peaks frt2 2512, zephyr-fixed 13376, zephyr-fixed-tcp 13416, zephyr-client-fixed 2680 and resource_budget.json to match; a failing chain is printed whole.
Tests: the zenoh-c link-resources witness compares the init queue step (data queue 2 against 6) instead of an exact lazy lead.
'''
verification = '''
On build hosts, the branch of this push. pc5: clippy -D warnings on wz-capi-core and wz-capi-c, and the wz-capi-c tests including the router-node test that polls matching status with no listener; Layers C1cb, C1ax, C1bg and C1q green with the guards moved, each figure printed by its command. pc2: Layer C1cd green against zenohd and libzenohc, which includes the aggregation/publishers leg that compares the publisher's interest under its aggregate with libzenohc's; Layer C1af green to its end after posix_shm and shm_relay were set; the zenoh crate's lib tests 181 passed with 1 ignored, and its clippy -D warnings clean, since the shared filter_ask moved the Rust API's ask to the aggregate too; Qzb and Q green with the four chains, the stack-frame and resource-budget selftests and resource_budget_gate --check rc 0; the C1cs symbol diff of 4ef678910d against 65ec9acd16 (4,583,800 against 4,588,276) and the capability-cost selftest 25/25; the C1cc witness 12 of 12 runs with libzenohc's queue step at 4 (wz 0, filed). The guarded-count lattice reads 598 guarded calls monotone. The debt census rc 0 with the register swept through 953 and the hosted-red ack gate reads this push's row for run 43914611055. Not run here: the C1bnl control (default against WZ_LOCK_ORDER=off on the 90-feature leg) and the hosted run of this push.
'''
carry = '''
Open-debt 952: the pooled stream link's batch count ignores transport/link/tx/queue/size/*; the C1cc witness stays red until the stream pool's capacity is derived from the queue shape. Open-debt 953: run the C1bnl control (default against WZ_LOCK_ORDER=off) before choosing how the lock-order checker's ledger leaves the measured thread; C1bnl shard 2 stays red until then. The consumer waiting on listener-less matching status is told this push's sha once it lands. Re-grading the three atoms graded against 1.5.0 (open-debt 951) is still owed.
'''
