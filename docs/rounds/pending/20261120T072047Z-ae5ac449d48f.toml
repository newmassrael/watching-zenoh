impact = ["feature-inventory--composable-framework-atomic--preset-catalog/4-conflict-policy", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "watching-zenoh/local-ci-gates"]
decision = '''
Step 4b, round 2a: the first bound read from the snapshot, MAX_SUBSCRIPTIONS, with the gate that holds every limit to its snapshot. Admission to a bounded table is a partial operation on every backing (a fixed table fills, a growable one is held to the quota its creator states at run time, which no type sees), so the owner chose to remove the infallible register wrappers rather than keep them for the build-default table: every registration returns the table's RegisterError and a caller that knows its table admits says so where it calls. The quota is held once, where the program declares (the node's plane, the coop engine's registry, an observer built with_limits); a face's or a group's observer mirrors what the plane admitted and is not held again, so no mirror refuses what the node admitted. The open resolves SessionLimits beside SessionPolicy and carries it through OpenPlan, OpenStance and SessionResources to the node; the document and the ABI doors state nothing yet (rounds 3 and 4), so every open holds the build's limits and nothing changes. A limit has moved when production code reads its snapshot field; a bound whose constant only sizes storage is pending, since on a growable table it enforces nothing until the table asks the snapshot.
'''
changes = '''
- `crates/wz-session-core/src/limit_binding.rs`: `Limited::admits(count)` for a bound; where the domain is one value and that value is the storage's capacity it is `true` at compile time, so a fixed image keeps no comparison.
- `scripts/lib/wz_config.py` and the generated `limits_generated.rs`: `pub type <Name>Held` per limit and `<field>_held()` per bound on the snapshot.
- `crates/wz-session-core/src/pubsub.rs`: the subscriber table holds a `MaxSubscriptionsHeld` (`limit_to`) and refuses past it with `RegisterError::TableFull` before the key gate numbers an entity or an id is taken; the four closure wrappers (`register`, `register_with_locality` of the table and the registry) return `Result<SubscriptionId, RegisterError>`, take `&str`, and exist on every backing.
- `crates/wz-session-core/src/observer.rs` and `slot_observer.rs`: `ApplicationLayerObserver::with_limits` and `SlotObserverOf::with_limits`; `registry_error.rs`: `TableFull` names the stated quota beside the capacity.
- `crates/wz-capi-core` (`open_plan.rs`, `drive.rs`, `faces.rs`, `faces/multicast.rs`), `crates/wz-capi-pico/src/session.rs`: `session_limits` on `OpenPlan`, `OpenStance`, `SessionResources` and `SharedSession` (`session_limits()`); the plane's observer is built with it; a group that refuses a mirrored subscription leaves it off that group instead of panicking.
- `crates/wz-capi-coop/src/engine.rs` and `engine/registry.rs`: `resolve_limits(&config)` beside `resolve_policy`, and the registry's observer is built with it.
- `crates/wz-runtime-tokio/src/session/mod.rs` and `subscriber.rs`: `register_subscriber_local` returns the table's refusal in place of `.expect`; `SubscribeError::Refused` and `SubscribeAliasError::Refused` carry it; the multicast `declare_subscriber` returns `Result<Subscriber, RegisterError>`.
- `crates/wz-session-core/src/limits.rs`: the `enforcement` tests of MAX_SUBSCRIPTIONS, nothing stated and two stated.
- 187 test and doc call sites in 33 files state why their table admits the registration.
- `scripts/lib/limit_read_gate.py` (new) with its selftest, run by pre-push and `run-ci.sh`: 57 pending limits and 2 allowed sites, both held to the code.
'''
verification = '''
- `cargo check --workspace --all-targets` passes with no warning of a workspace crate; clippy `-D warnings --all-targets` of wz-session-core, wz-runtime-tokio, wz-capi-core, wz-capi-coop and wz-capi-pico passes, one crate per command.
- Tests on pc2: wz-session-core lib 1084 passed (heap) and its `limits` tests 11 passed with `bounded-heapless`, the two MAX_SUBSCRIPTIONS tests named in both runs; wz-capi-core lib 227, wz-capi-coop 27, wz-runtime-tokio `session` 498, all passed.
- `limit_read_gate.py --selftest` passes, and `--check` passes: 86 reads of the build outside storage, all of pending limits or allowed sites; 2 limits read from the snapshot. Its selftest drives the storage forms (const-generic argument, array length, repeat expression), a comparison operator beside a block, comments, literals, test items, and each stale-list rule both ways.
- MCU images on pc2 against `cd240d4b4`, built with `no_allocator_link_gate.build_command` and remapped paths: 14 of 17 byte-identical. `mcu-admin-node` mps2 differs only in the names of anonymous constants (net 0 bytes), and the fixed and fixed-tcp builds are 32 and 40 bytes smaller. The bisect puts the difference on the round's first commit, and the disassembly of the one function that moved (`SlotObserverOf::drain_declare_replies`) has the same offsets, the same stride and the same calls; register allocation and where the stride multiply is hoisted differ. The ten host slot images hold the quota word (the domain is not one value off a bare-metal target); nine are 64 to 96 bytes smaller and one keeps its size with other bytes. `session_slot_bytes.py --check` equals its record.
- Cost cases on pc2 against `cd240d4b4`: the symbol diff of pico-default (+421 of symbols, +1,372 of text) is noted at pico-client in `capability_cost_gate.py`; the first build of the round carried three 402-byte copies of `SessionLimits::defaults`, which `SessionLimits::BUILD` removed (pico-default +2,292 to +1,372). The 17 cases at their line move by their pc2 growth, to the hundred; the selftest passes 25/25.
- `wz_config.py --selftest` 420/420 and `--check` pass; `reason_review_pin_gate.py` passes after `session-close-ingress` is re-read against `wz-session-core/src/observer.rs` (no access-control identifier, as it states); `gate_provenance_lint.py`, `round_fed_gate_reach.py`, `runci_leg_ledger_gate.py`, `logic_census_coverage_gate.py`, `upstream_citation_anchor_gate.py`, `reason_citation_gate.py` and `store_reason_citation_gate.py` pass.
'''
carry = '''
- The next bounds move one by one, each with its two tests and off `PENDING`: the twelve bounds whose constant only sizes storage (MAX_QUERYABLES, MAX_PENDING_QUERIES, MAX_REMOTE_DECLS and nine more) enforce nothing on a growable table until the table asks the snapshot.
- The tokio queryable declare still `.expect`s its registration (`session/mod.rs`, `register_sink` of the queryable registry); it becomes a refusal when MAX_QUERYABLES moves.
- `SessionLimits` rides in `SessionInitParams` with its first session-machine reader (127 literals in 16 crates); the MCU node creators (`admin_node`, `client_node`) take it from there. `RuntimeLimits` goes into each runtime creator that reads one.
- The counting semaphore `quota::Quota` takes the value `limit_binding::Quota` when `QUERIER_MAX_PENDING_QUERIES` moves.
- Round 3 states limits in the document (`wz/limits`, `[[limit]] upstream` from the pinned source, named refusals, `LimitsNotRead` removed); round 4 opens the three ABI doors, each with a test that the same document gives the same snapshot.
- `wz-runtime-tokio`'s build-time refusal of `bounded-heapless` stays while the queryable declare and the other registries' closure wrappers still treat a registration as infallible; it goes with the last of them.
'''
