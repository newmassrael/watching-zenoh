impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-7-declare-flow", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-9-query", "watching-zenoh/local-ci-gates"]
decision = '''
The limits a stage after the build may decide now reach the machines that run under them: round 2 of the limits plane ends, the document layer reads them (round 3) and the three C ABI doors open sessions under them (round 4), landed together so that no door accepts a stated limit it does not apply. Six peer-filled bounds leave the build: MAX_REMOTE_DECLS and MAX_PEER_KEYEXPR_ALIASES (each peer table holds its quota and asks it before a new id, refusing past it the way a full fixed table already refuses, into the same counter; the heap backing counts its own refusals now), MAX_INBOUND_SUB_INTERESTS and MAX_PENDING_DECLARES (the subscriber registry and the token registry hold them; a chain past the quota is refused whole and counted, never cut), MAX_PENDING_REPLIES and MAX_PENDING_FINALS (the reply and final stages hold them; taking the owed finals keeps the quota and the refusal count with the table). The counting semaphore holds its bound as the limit's value Quota, so no bound has one spelling, and QUERIER_MAX_PENDING_QUERIES is read from the session's observer. A session's parameters carry its limits (SessionInitParams.limits, filled from the open's snapshot where one is in reach), and an MCU admin or client node holds its observer to them. The document's wz/limits member is read into the snapshots with named refusals (unknown limit, a capacity alone, a runtime limit at a door that holds only a session's, a value outside the domain, not a limit value, stated twice) and a statement of a limit whose machines still read the build is refused by name (LimitNotRead): which limits are read from the snapshot is declared once per [[limit]] (read = "snapshot" | "build"), generated into the tables, and held against the code both ways by limit_read_gate, which no longer keeps its own list. An entry of an unread limit links no selector, so a C ABI library carries the selection of read limits alone. Each [[limit]] declares its upstream zenoh counterpart (a config key with anchored citations, or none with a reason); the pico side is derived from the switch rows. The tokio node, zenoh-c and pico doors and the Rust API resolve the document and open with its session snapshot, asserted against one shared corpus of documents.
'''
changes = '''
- `crates/wz-session-core`: `id_map.rs` `bind_within` and the heap backing's own refusal count; the alias, remote declaration, interest, staged answer, reply and final tables hold `<Name>Held` quotas set by `limit_to`; `ApplicationLayerObserver::with_limits` and `PeerTables::limit_to` hand them; `quota.rs` holds its bound as `limit_binding::Quota`; `session_init_params.rs` gains `limits`.
- Document layer: `policy_document.rs` reads `wz/limits` (`compose_limits`, `ResolvedLimits`, `Base`, `Overrides.limits`, seven named refusals, `LimitsNotRead` removed); `limit_binding.rs` entries carry `read_from_snapshot` and no selector for an unread limit; `limit_corpus.rs` is the one corpus every door asserts.
- Doors: tokio `zenoh_config.rs` (node snapshot, honoured paths, export), `wz-capi-core` `open_plan.rs` and `drive.rs` (`LinkConf.limits`), zenoh-c and the Rust API through them, pico `config_policy.rs`/`session.rs`/`session_ext.rs` and the coop engine; MCU `admin_node.rs`/`client_node.rs` observers read `params.limits`.
- Declaration and gates: `deploy/wz-config.toml` `[[limit]]` gains `read` and `[limit.upstream]`; `wz_config.py`, `upstream_switch_map.py`, `limit_read_gate.py` (declared pending set), the schema without unread limits; `capability_cost_gate.py` budgets, `feature_gate_diagnostic.py`, `files.md`, four MCU count guards, three reason pins, two census rows of S10 and S12.
'''
verification = '''
- One machine, final merged tree: workspace check of all targets; wz-session-core tests default 1,151, alloc 1,151, bounded-heapless 1,149, declare planes 1,429, query planes 1,329, all features 3,301; wz-session-mcu, capi-core 230, capi-coop 35, tokio querier 49 and wz/limits member 14, capi-pico replay-cache 221 and config-document 13, capi-c 220, the Rust API 195, session-lwip; every step 0 failed. Clippy -D warnings of each touched crate (session-core three feature sets, pico two).
- The new tests ran: 28 enforcement tests (14 new), corpus 6, policy document 46, an MCU client node held to its parameters' limits, the capi-core link conf, the tokio querier's stated bound.
- C1cs on one machine against `b58b71c19`: +12,802 to +21,732 per case (symbol diff in the note); the unread selectors' removal is in it; the gate passes with the moved budgets on the merged tree.
- Static bundle 156 of 156, upstream citation, reason pins, limit-read, policy-read, wz-config 440 arms and check, switch map, census and coverage gates, count guard 16 of 16, leg ledger.
'''
carry = '''
- Runtime-scope limits: no machine reads a node's RuntimeLimits; all ten are declared read from the build and refused by name. The node clock still builds its own from the environment.
- Slot builds: the MCU slot session's peer tables and the slot node's observer keep the build's values (no snapshot reaches them before the slot opens); a builder field and the deploy images move them.
- Per-task reply stages in tokio, coop, router forward and the held query keep the build's quota.
- 45 limits remain read from the build; each moves by its round, its `read` turning to snapshot.
'''
