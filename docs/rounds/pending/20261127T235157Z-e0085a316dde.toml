impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-9-query", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint", "watching-zenoh/local-ci-gates"]
decision = '''
Land integration j: nine lanes of the C ABI's layer walk and the Windows performance lane, each verified green alone, merged once and verified once more as a whole.

The lanes carry the structure forward rather than patch it. The session's gets became rows of the session tables (L3), a reply's key gate and shared-memory read moved apart from the get table, and a get mints one callback whatever its legs. A group's send moved onto the one transmit walk the unicast session uses (group-link-writer, GroupTx with its transmit half LinkTx), with a group's receive half split from its send on every stack the engine opens, so a reply admitted inside a read leaves on the socket at once. The closed link set sends through its stack's own type (base-td). The on-use preset takes its link cells, buffers, ports and group buffers from the heap through its link kind, under the same bounds the lent form keeps (heap-native). The peer's description walk lends the observer's and the plan's registry (peer-prop), the scout and connectivity bound reads the pair's own bound (conn-scout), the advanced subscriber's time range writes its decimal text with no overflow (feat-adv), and the reduced builds' test premises read keys every dialect matches (debt-repay).

On Windows, the spin the session-free blocking put caused is repaid at its cause: a link answers what is owed for a reporter apart from a wait, so a read beside a send on another thread no longer counts a write the send already made. The Windows ceiling rows were re-read from a quiet-host run under a 0.2% foreign-share limit; a udp cell is planned only where arm W's build listens on udp.
'''
changes = '''
crates/wz-session-core: session_tables hold each get as a row (kind bounds, ended count, earliest deadline), get_legs, ReplyReceive, transport_tx (LinkTx, GroupTx, TxRoute::write), the group's limits and framing, OwnStaging and HeapByteCells for chains, test premises over keys every dialect reads. crates/wz-capi-coop: the get plane removed, the engine reads Finals and hands ended gets out under its hold, the group's send and receive halves, the closed link set's typed sink, the on-use link cells, buffers and ports through the link kind, the observer's lists and the registry described by the peer walk. crates/wz-runtime-coop: SharedPump::Sink, LinkStorage sources (cells, buffers, ports, groups), owes_write_if_free, GroupTransport halves. crates/wz-session-mcu: GroupTxStage over GroupTx and its driver. crates/wz-runtime-tokio: the group pipeline over GroupTx. crates/wz-ext-pubsub and wz-capi-pico: the advanced subscriber's callbacks as one value, time_range totality.
deploy/pico_perf_ceiling_windows.json re-read; scripts/host-bench/perf_matrix.py reads foreign and interrupt shares and plans W/udp by W's features; docs/c-abi-migration (arch-l3-rows, mcast-tx1, base-transport, heap-native, peer-rows, feat-adv, feat-conn-scout, debt-repay, win-p99, int-j-merges), docs/win-budget/size.md, docs/deterministic-tests/system-layer.tsv.
'''
