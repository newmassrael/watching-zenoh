In pool trees at the committed SHAs, on bx: each lane verified green alone before the merge (debt-repay, feat-adv, conn-scout, peer-prop, L3 at the merged tip, group-link-writer, win-p99 with its two Linux regression tests, base-td including the round form under WZ_COOP_VALUE_LOCKS=off, heap-native at the merged tip). On integration j after the merge fixes: wz-session-core, wz-capi-coop (default, tables-on-use, group and multicast declarations on use, query with liveliness-get and runtime-plan, the round form), wz-capi-pico (default and app-transport), wz-runtime-coop, wz-session-lwip, wz-session-mcu, wz-ext-pubsub all features and wz-runtime-tokio suites passed; clippy -D warnings on wz-session-core (default, all features), wz-capi-coop (default, all features, tables-on-use, runtime-plan, the round form), wz-capi-pico, wz-capi-c, wz-runtime-coop, wz-runtime-tokio, wz-session-lwip, wz-ext-pubsub all features and wz-runtime-posix for x86_64-pc-windows-gnu passed; the coop engine fuzz target builds; the nondefault-features gate, reason-review-pins, wz_config --check and the deterministic-test layer gate passed. The round-form listener test's timeout was bisected across the lane tips to L3 and repaid by its two test commits. The host_group multicast tests passed on a fleet host with multicast; the local host's firewall drops looped multicast. Windows: the spin fix measured p99.9 81.8 to 90.6 us against base 82.7 to 90.5 with no round trip over 0.5 ms on pc3-win.
'''
