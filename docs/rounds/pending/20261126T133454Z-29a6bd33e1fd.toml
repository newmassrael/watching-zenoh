impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-3-coherence"]
decision = '''
Take the next two items in order: the debt of the runtime binding the reduced builds left short, with the structure that makes its class impossible, and the first steps of stage S6 of the shared-memory transport, one shared-memory system per process.

The session core declares SessionRuntime's unicast items under its own features, and the runtimes bound them under theirs; Cargo unifies the core's features across the graph, so any crate could turn the items on while a runtime's feature stayed off. Making more features imply the runtime's own only moved the gap. The core now states each fact once in its build script, as a cfg its own declarations read and as links metadata, and wz-runtime-tokio and wz-runtime-coop read the metadata in their build scripts and bind the items on the same cfgs.

S6's first step measured what the two systems hold in a process (the C library with and without the shared-memory arm, the lines of each half, the threads and segments each makes), so the later steps can be compared. The second makes the reader one: the engine, the C ABI and the top crate read every descriptor through one resolver over zenoh-shm's ShmReader and a ShmClientStorage, the C ABI's client storage is zenoh-c's shape, and the engine's client set is gone. The global storage keeps the segments it mapped for its life, as upstream's does, where the engine's reader let go of a gone provider's segment; that residue is registered.

Two pre-existing reds the verification met were repaid: an aliased shared-memory publish test that expected an undeclared id on the wire, which a session now sends as its literal, and a storage test that wrote a timestamp id the timestamp's type now refuses at construction. The first uncancelled hosted run's reds are acknowledged, each attributed from its own log, for the next round.
'''
changes = '''
crates/wz-session-core: links = "wz_session_core"; build.rs states the runtime items' facts as cfgs and metadata; link.rs declares the items on them. crates/wz-runtime-tokio/build.rs and crates/wz-runtime-coop/build.rs (new) bind them; runtime_impl.rs holds OsEntropy, re-exported from session_glue; scripts/lib/reduced_docs_ledger.txt loses the E0046 line.
crates/wz-runtime-tokio/src/shm_reader.rs (new) is the one ShmResolver; shm_clients.rs and PosixShmResolver are gone; shm_provider.rs, session/mod.rs, wz-capi-c shm.rs, wz-capi-core faces.rs and drive.rs, crates/wz-zenoh/src/api/shm.rs and crates/wz-zenoh/Cargo.toml move to it; zenoh-shm's reader takes the engine's repairs; the shm tests and three zenohd interop tests move.
crates/wz-runtime-tokio/src/session/tests.rs and filesystem_datainfo.rs: two tests to the current contracts. scripts/run-ci.sh: the shm_provider guard. docs/shm-transport.md: S6 steps 1 and 2. docs/.atomic: debt-runtime-binding-under-the-wrong-feature closed, debt-shm-reader-keeps-segments-of-gone-providers registered, api-compat-rust corrected. docs/reason-review-pins.md, docs/zenoh-logic-as-sce-kinds files.md and S5.md, docs/hosted-red-acks.md.
'''
