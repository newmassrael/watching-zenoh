decision = '''
The 8e integration lands every axis of the remaining-debt programme (owner 2026-11-16, session 8e: "split it by axis and resolve every remaining problem") as one merge, and with it pays every red of hosted run 43825703285 on main. Three owner rulings shape it (2026-11-16, "the long-term correct, textbook structure"). A config key whose effect is not on the wire is proven by widening what is observed, never excused: the effect-witness table gains an observation column (wire, delivery, resource, statistical), host resources are read with the host's own instruments, and a timing key is decided by a sequential probability ratio test at a stated alpha and beta; the unproven budget stays 61 and no exemption class exists. `wz-ap-demo --config` takes zenohd's whole daemon reading of a file (`zenohd/src/main.rs` @ `config.set_mode(Some(WhatAmI::Router)).unwrap();`), while the library entrypoints keep the library reading, so a modeless file now starts a router. And an initiator's handshake has one bound, the node's open_timeout, armed once on entry to Opening, because zenoh holds the whole open to it (`io/zenoh-transport/src/unicast/manager.rs` @ `tokio::time::timeout(self.config.unicast.open_timeout, async {`) and no upstream has a shorter step window; wz gave an open up at two seconds without an InitAck, which was a parity defect. This entry also corrects the carry of Round 1868, frozen as written: its bullet that the multicast ttl and join keys were not reachable from a run-mode flag was already stale when filed, since `--multicast-locator` builds McastGroupOptions with ttl and every join group of the locator. And it repays five store reasons whose upstream citations named 1.5.0 paths the pin no longer has; the atoms they belong to are still graded against 1.5.0, and that re-grading stays owed. In §2.5 the two new caveats on the Opening bound supersede the R311fa bullet that calls the per-phase timeouts child-scoped, which no typed primitive can remove.
'''
changes = '''
Config proof: 18 honoured keys gain effect witnesses (differential against zenohd, zenoh-c or a stats-built zenohd), the table gains an observation column, resource witnesses read allocation mode and rx buffer size off the host, an SPRT decides batching time_limit; a ZENOHD_STATS oracle variant with its resolver and lane; the rx pool is sized by the negotiated batch.
Session: one opening bound (opening_ms, 10 s default, with_open_timeout, OpenTimeout); HANDSHAKE_INIT_MS and HANDSHAKE_OPEN_MS retired from the limits and the generated tables; the scxml deadline prose and §2.5 inputs follow; handshake ext chains staged in upstream's ascending id order.
Daemon reading: DAEMON_OVERRIDES (mode and scouting multicast when unset, adminspace and plugins_loading over the file) and ConfigReading::{Library,Daemon}; --config and --check-topology take the daemon reading; each override answers for the value it writes, so no build that reads a document links a whole-configuration compare (35 KB of C ABI text).
C ABI: a large query value and reply are copied into shared memory by the put's promotion decision; capi-c and capi-core reds of main repaid; token ids compared at wire width.
Runtime: the face drive loop is one dyn core (C ABI text down 74 KB on pico-peer, 181 KB on capic-default); the io_uring dial read moved onto the reactor worker with a copy-break, an ask list and a mailbox; the worker's reap buffer is sized for a whole drain; the MCU peer table is fixed (TableGrowth), dropping the hash index.
Gates: C0 legs hosted never graded are paid (ext identity, binary freshness 218 -> 213, prose features, prose names, reason claims seed from a conditional expression, footprint selftest, basename literals); count guards set to what their commands print (C1ca 10, C1bp 6, C1ah 35, C1ak 8/12/4/4/4 and 59); 17 C ABI budgets, then capic-router-node and capic-default once more, and the multicast baseline 78276/78260 moved with symbol attribution; store reason citation findings 5 -> 0.
Tests: the differential zenoh_sync waiter no longer locks under its own guard; the TLS expiry leg takes its port from its reservation; demo freshness checked in four legs.
'''
