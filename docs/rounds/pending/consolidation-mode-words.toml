impact = ["wire-spec-subset--watching-zenoh-mvp/6-zenoh-payload-layer"]

decision = '''
A consumer asked for the consolidation mode of a Query and a Reply as a word. The dissection gave only the byte, so a reader that wanted to show the mode had to carry the byte-to-mode table itself, and that table is a fact of the protocol, so the decoder's. Both walkers now add a `consolidation_name` label beside the `consolidation` byte, which stays. The words are zenoh's `ConsolidationMode` variants on zenoh's numbering (0 Auto, 1 None, 2 Monotonic, 3 Latest), spelled once in `ConsolidationMode::wire_word` in `query_mode.rs`, next to the `wire_byte` numbering an earlier round measured against a real zenohd. A byte zenoh's decoder does not number gets no word; that decoder falls back to Auto for it, but that is its handling of an unreadable byte, not a mode the sender wrote. The byte is read on one numbering and not per sender, because nothing in the message says which implementation wrote it. A stock zenoh-pico 1.10.2 sender writes its API enum raw, one slot low (None 0, Monotonic 1, Latest 2), so its bytes read here as the mode a zenoh receiver applies to them. The label aliases the byte, so the tiling is unchanged, and no document revision moves: the tree gains a name, and the published-path ledger holds it.
'''

changes = '''
crates/wz-session-core/src/query_mode.rs: `ConsolidationMode::wire_word`, the mode word a byte names; a test that walks it through `wire_byte` and names the words for 0 and for unknown bytes.
crates/wz-session-core/src/dissect.rs: `consolidation_name` beside the byte in the Query and Reply walkers; the request and response agreement tests check the word; a test over bytes 0 to 4 and 0xFF on both walkers.
crates/wz-session-core/src/dissect_schema.rs: the declared shape gains the label in both, its words walked from `wire_word` over every byte value.
crates/wz-session-core/src/published_selector_paths.txt: the 10 facts the shape now declares, appended.
scripts/lib/dissect_name_census.py and dissect_label_census.py: the name declared as own vocabulary; the words held to pico's `Z_CONSOLIDATION_MODE_*` both ways, Auto declared because pico's is the unwritten sentinel -1.
'''

verification = '''
Upstream encodings read at the pinned 1.10.2: zenoh's codec writes and reads the mode as a z64 numbered Auto 0, None 1, Monotonic 2, Latest 3 and reads any other value as Auto; zenoh-pico writes `_consolidation` as one byte from its enum, NONE 0, MONOTONIC 1, LATEST 2, and never writes AUTO. Dissect name and label censuses clean. On a build machine: session core with `dissect`, the dissect, dissect schema and query mode library tests (129 passed, including the published-fact test after the append); wz-capture with `dissect,fixtures` library tests (1773 passed); wz-capi-dissect library tests (233 passed); clippy with `--no-default-features --features dissect` and with `dissect-serde` over all targets, clean; rustfmt clean.
'''

carry = '''
The walker and the generated codec read the byte as a u8, where zenoh's codec reads a z64. The two agree for every value below 0x80, which is every value either upstream writes; a byte at or above 0x80 would be read as one byte here and as the start of a longer value by zenoh.
'''
