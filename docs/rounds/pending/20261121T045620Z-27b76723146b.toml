impact = ["feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
The no_std kit images beat zenoh-pico again, and a landing can no longer turn that WIN into a LOSS by moving an image's own budget. Since the parity run of 2026-10-31 the fixed client had grown from 142,528 to 155,796 bytes of text through rounds that moved only deploy/text_budget.json, and a compare build read +9,792 bytes against the single-threaded zenoh-pico reference. Layer Qzk now builds that reference in the same run and holds each client image to it on the cells a build decides (text, flash, static RAM, stack objects, the heap client's storage block): only a WIN passes, and no budget move clears a LOSS (docs/upstream-parity.md D8). The bytes were taken back in four rounds without changing behaviour: an endpoint is read only in the address families the stack opens and a UDP link writes its ends' text only when asked; a handshake entry is kept in one copy; a plain reply is counted by its direct layout and a declaration is written as its own kind; the connect retry schedule is a build constant and the reply stage holds side-bands only where they are sent; a closed queryable sink is called by its own types and a build that holds no peer node names none. Measured on one host before the last merge of main: text 144,820 against 147,912 (-3,092), flash -3,188, RAM -9,333, stack objects -3,456, for the fixed and the heap client alike.
'''
changes = '''
- `scripts/lib/pico_ceiling_gate.py` (new) and Layer Qzk: the reference built in the same run, the pairs read from deploy/upstream_parity.json, WIN only; `fixed_client.rs` states the storage block as an absolute symbol.
- Layer Qzk runs one ceiling group at a time (`WZ_QZK_PART`, `kit-lane.sh parts`, `pico_ceiling_gate.py --parts`), and `runci_plan.py` plans one fleet unit per part, so the lane no longer asks one build host for the whole; the parts are checked to cover the images exactly once.
- `scripts/kit-size-delta.sh` and `scripts/lib/kit_size_delta.py` (new): a kit image's cells and symbols at a base revision and at the tree, both built in one run, so a size change is attributed on one machine by construction.
- `wz-session-mcu` `dial.rs`: an endpoint read in the families the stack opens (`IPV6` constants on the links, a v4 reader held to core's by a differential test); node keys folded where a build holds no node.
- `wz-runtime-coop` `udp_link.rs`: a link's ends written when first asked.
- `wz-session-core`: `keep_handshake_entry` one copy; `ResponseWriter::encoded_len`; `DeclarationOf` writes one declaration kind; `FixedRetryPeriod` and `ZenohDefaultRetry`; reply-stage side-bands gated by their features; `QuerySinkOf` typed calls.
- `stack_frame_gate.py` commits the six kit chains the recovery left; `stack_call_contracts.json` claims the key expression's tail append on the admin node (rule `wireexpr-suffix-tail-append`, pinned to one site); text_budget, resource_budget read again; docs/upstream-parity.md D8, docs/text-ownership.md, docs/agent-reference.md.
'''
verification = '''
- Layer Qzk at the landed tree, run as its five fleet units on two build hosts: every image built under its gates, and both client images HELD under the single-threaded zenoh-pico reference built in the same run. Before the merge of main the same gate read every cell WIN (text -3,092, flash -3,188, RAM -9,333 and -6,341, stack objects -3,456, storage block 7,712 against 9,280), and it read LOSS on the trees before each recovery round (+9,792, +1,764, +284).
- The new size tool, run for real: the fixed client against origin/main reads text -12,972 bytes, attributed by symbol and owner; its refusals end 2; its selftest passes.
- The planner's selftest (20 cases), the ceiling gate's selftest, shellcheck of run-ci.sh and kit-lane.sh, a part name the lane does not have refused with the list.
- Crate tests of wz-session-core, -mcu, -lwip, wz-runtime-tokio, -coop, wz-capi-core, -coop, -pico; clippy of four crates; Layers G and C2m; the non-default census; every round-fed gate of the pre-push hook and gate 2f, run locally after the last change.
- The admin node's new register call was read off the disassembly (`ldr.w r3, [r8, #28]`, the vtable slot of TxBuf::append) before the rule naming it was written; the stack-bound contract and selftest pass.
'''
carry = '''
- The parity matrix's board cells (stack used, heap peak, turnaround) were not run again on the kit.
- A build-constant key is still canonized at run time (about 1.4 KB): a key type proven at compile time needs a decision on refusing a non-canonical key.
- Which frame took 384 bytes off the client chains was not attributed; the size tool can now say it.
- Whether the parts lower the lane's peak was measured on the fleet (0.8 to 1.5 GB per part) but the fleet's learned figure for the whole lane is a prior, not a reading, until the fleet's own fix lands.
'''
