impact = ["feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
The capability cost and size ledger gates read a case's cargo configuration
as TOML through the repository's floor-interpreter reader, take each target
table's rustflags and linker, and pass a linker as cargo's own variable for
the triple it names. Any other key is still refused by name, so a setting the
gate would not pass on cannot sit in the file unseen. The Windows linker key
had made both gates fail on main.
'''
changes = '''
- capability_cost_gate: read_config_tables reads rustflags and linker; CARGO_TARGET_<TRIPLE>_LINKER carries the linker.
- wz_config: read_decl_toml reads quoted header keys and makes implicit parent tables, refusing table and value overlaps.
'''
verification = '''
- selftests: capability-cost 133/133, size-ledger 107/107, wz-config 528/528; python floor lint 0 findings at 3.10.
- size_ledger_gate --check and capability_cost_gate --check pico-client-coop-nostd pass on this branch.
'''
carry = '''
- none for this lane.
'''
