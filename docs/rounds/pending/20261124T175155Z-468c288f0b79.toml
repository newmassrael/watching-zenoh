impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-6-keyexpr", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "watching-zenoh/local-ci-gates"]
decision = '''
A third integration of the pico C ABI release toward docs/c-abi-architecture.md. It closes the last measured allocation after open, folds the duplicated bodies the release's own disassembly showed, and repairs a no_std build the last landing left failing.

Heap after open: a key a peer sends as a declared id and a suffix (or as a literal of the session's own mapping space) was assembled in a heap string on every Push in the release. The lent engine now composes it in one row lent at open from the session's arena (KeyexprRow, MAX_KEYEXPR_BYTES, no new limit); a key past that row is counted as keyexpr_past_bound and dropped as every other fixed bound is, and the count is read off the session's faces. Layer C1nh measured nothing of this, because every receive family sent literal keys; the new family subscriber-receive-composed reads 2 allocations (2,400 bytes) a round on the tree before the fix and none after.

Size: the C ABI doors render a zid in one early-stopping loop, let the session's lock go in its hold's one drop, lend an entity's place through one body, take the callback table and a key's declared remainder through one body each, lay a put's options in place and make a publisher where its slot lies; the coop engine puts a dial's link in its face where it is made, gives a key's holds back in one body, hands a face walk its sends through a one-method trait instead of a dyn Fn (one body, not call and call_once), names an arena's rows and limits by a byte; the driver reads a stream's front once, opens every datagram link through one body, writes a session task and a link where their cells lie, and builds a write's iovecs once; transport drives a fragment's chunk at one place and judges an in-place data head in one body.

Repair: the session event import in decide_admitted lost its last ungated reader when the OpenAck admission moved into one hold; a no_std build with neither handshake body nor the accept role failed on it (wz-runtime-posix), and it is now named under its readers' cfg.

The size ledger reads 1.6717 times zenoh-pico in total (from 1.7196): sessions 3.0695, doors 2.3750, transport 2.9972, driver 1.6931, and its rows are tightened to that reading.
'''
changes = '''
crates/wz-session-core: bounded.rs (Storage::Compose), pubsub.rs and pubsub/in_place (ComposeRow, keyexpr_past_bound, InPlaceFallbacks::plus), wireexpr_resolve.rs and declared_keyexprs.rs (dyn KeyexprOut), named_key.rs, session_tables.rs, publish_options.rs (set_*), round.rs (one refusal exit), reassembly_dispatch.rs, drive.rs (admit_head_in_place, event import cfg).
crates/wz-capi-coop: engine.rs (dial links put where made, let_go_of_key, LiveCore drop, in_place_fallbacks), engine/replay.rs (SendTo, TellTo, end_interest), engine/registry.rs, arena.rs (ArenaPart, ArenaLimit), tests.
crates/wz-capi-pico: zid.rs, object_slot.rs, ffi.rs, keyexpr.rs, pubsub.rs, advanced_plane.rs; tests/no_heap_after_open.rs (subscriber-receive-composed).
crates/wz-runtime-coop: stream_link.rs, ip_stack.rs (LinkPlace::datagram), executor.rs and local.rs (claimed places), session_drive.rs, link_cells.rs (made_in), app_link.rs, udp_link.rs; crates/wz-runtime-posix: stream.rs, net.rs.
deploy/no_heap_ratchet.json row subscriber-receive-composed; deploy/size_ledger.json rows tightened; docs/reason-review-pins.md three session-close-ingress rows re-read.
'''
