Build zenoh-pico's preset as a Windows package, so the Windows performance
table, whose rows are the preset's, can be filled from a run on it.
'''
changes = '''
- pico_windows_package --build --preset; manifest names its preset.
- perf_matrix windows-plan reads the preset from the manifest.
- platform.yml package-windows-preset job uploads the zip.
'''
