impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
An integration of the pico C ABI release toward docs/c-abi-architecture.md section 9 (the win budget): the receive and walk lanes (perf-rx, perf-walk, perf-cs, perf-ka), the configuration red repair, and the size ledger measured by DWARF line tables, every area re-baselined on that ruler (owner ruling of 2026-11-25).

Receive path: a lent body's extensions, a frame head's chain and a query's and reply's extensions are read in one walk; the inbound SN gates, a link's stamps and the peer's Open lease are kept in words of their own; link deadlines are read when one falls due; each get table keeps its earliest deadline exact and a read's wait is bounded by the ledger.

Size ledger: one build with line tables is measured and shipped stripped; inlined core code counts in its caller's area; line-0 code goes to its frame or, frameless, to its body's symbol; heapless counts as language, as pico's collections do. Unattributed bytes are held at zero and every ratio is re-baselined on this ruler.

The machine regeneration at the b88d18ebdc SCE pin is reverted from this integration: it costs the codec area its win (the generated decoders inline their arms) and waits for the generator change requested of SCE.

The configuration resolver resolves every build through one path, and the selftest arms that fail on origin/main (the cooperative list and the tokio-only capabilities) pass here: gossip is named as the tokio-only pico capability.
'''
changes = '''
crates/wz-session-core, wz-runtime-coop, wz-runtime-posix, wz-capi-coop, wz-capi-port, wz-capi-pico, wz-capi-core and their tests: the receive, walk and key-hold lanes merged into the integration branch.
scripts/lib/size_ledger and deploy/size_ledger.json: attribution by DWARF line tables, inlined code to its caller, line-0 code to its frame or body, heapless as language; unattributed held at 0, every area re-baselined.
scripts/lib/wz_config.py, deploy/wz-config.toml: one resolver for every build, gossip named tokio-only, the parity arm built under its defconfig's limits.
scripts/pico-compare and the parity harness: the parity image built as the release ships it; a silent throughput pair named.
docs/zenoh-logic-as-sce-kinds census: the delivery mark files placed in slice S7.
'''
