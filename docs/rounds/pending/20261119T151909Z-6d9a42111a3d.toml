impact = ["wire-spec-subset--watching-zenoh-mvp/8-transport-link-matrix"]
decision = '''
A zenoh endpoint named by host is looked up before any session, and when the name does not resolve no SYN follows: the cause is only in the lookup. Every UDP datagram on port 53 (DNS) or 5353 (multicast DNS) is read for its A, AAAA and SRV questions beside the path every UDP datagram takes, as the ICMP messages are, and each question is paired with its response: a DNS response answers the query of its id sent from the endpoint it is addressed to, about the same question, and a multicast DNS response, addressed to the group, answers the oldest unanswered multicast query one of its records names. A resend of the same query counts on it. The document gains `dns`: per query its name, type, asker and server, its first packet and instant, how many times it was sent, whether it was answered, and the answer's packet, instant, rcode word and number, and records about the name and its SRV targets, each address joined to the first TCP SYN the capture holds to it after the answer. Queries past 256 and records past 16 per query are counted, and so are responses that answered no query held. The field document moves to revision 80 and row_facts to 20; eighteen keys and two families arrive, nothing retires.
'''
changes = '''
A capture module, dns, reads a DNS message's header, first question and records, names with compression pointers bounded against loops, and pairs queries with responses; the datagram path feeds it every UDP datagram on the two ports.
The field document writes the document's `dns` after `capture_interfaces`, joining each answered address to the capture's TCP attempts; revision 80 and row_facts revision 20 rows and tables, the vocabulary gate's two families with a fixture that writes every word, the ABI header's section, tags and integer paragraph, the integer-cell gate's cell, and the C consumer's revision pin.
'''
verification = '''
The capture crate's library tests with dissect and fixtures, 1880 passed and 6 ignored, among them a capture whose lookup of an unknown name reads nxdomain with that name and whose lookup of a known one names the address and the SYN to it that followed, a resent query counted on its query, an answer from another server or of another id left unmatched, an SRV answer with its target, port and the target's address, a multicast answer paired by the name it names, queries past the bound and questions of other types, and every cut of a message and a looping name refused. The dissection crate's tests, 259 and 4 passed.
Red-first: with the datagram path feeding the lookups nothing, the capture test fails and the rest pass.
fmt; clippy with warnings denied of wz-capture; wz-capture with no default features builds; the rustdoc lane over the two touched crates; the upstream citation anchor gate; the integer-cell gate; the discard-site lint over this change.
'''
carry = '''
No real capture of a failed lookup was read; the datagrams are built from the message layout. DNS over TCP, and lookups over DoT or DoH, are not read. A lookup answered from a cache on the host sends nothing and so is not in the capture. A UDP zenoh endpoint's address is not joined to the flow after it, only a TCP SYN is. The datagrams on the two ports still take the path every UDP datagram takes and are decoded as zenoh there, as before this round.
'''
