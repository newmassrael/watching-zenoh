impact = ["wire-spec-subset--watching-zenoh-mvp/8-transport-link-matrix", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-16-access-control"]
decision = '''
Ten consumer requests answered. Packet, section and interface comments of a pcapng are carried on rows, in the summary and on the interface list. A selector selects a row by its place in the documents (row), reads ISO-8601 dates and clock times with an offset the caller may bind, unit-suffixed intervals, and the two-ended node terms zids and session. An encoding rule reads a sample by its declared encoding where no key rule covers it, with a text format, typed json and cbor leaves and the encoding's schema; a cdr rule reads CDR by declared ROS message and service definitions. A live handle opens under a sized options struct that declares serial link types and sets the byte ceiling, the reassembly window and the bytes one fragment chain may join, and goes on into a capture's next container. A live census keeps scouting folds and open-exchange verdicts across calls. The C library answers what a config's access control decides per message, from the router's own engine.
'''
changes = '''
wz-capture: the pcapng option reader gives comments; rows carry packet_comments, the summary a comments object, interfaces their comments. The selector gains row, clock and date literals (filter/clock.rs), unit intervals, zids and session, and RecordView a receiver ZID. payload_builtin gains text and the encoding rule kind; json and cbor leaves are typed; ros_msg.rs and payload_cdr.rs read .msg/.srv and CDR. The serial reader is fed by declared link types, session_table flows say direction_basis, a follow moves into a next container with sections and packets numbered on, the field documents re-read that container, scouting folds and open verdicts are kept.
wz-capi-dissect: wz_dissect_selector_bind_in_zone, wz_dissect_live_open_with and its options struct (serial types, stream bytes, window, chain bytes), wz_dissect_live_follow_next; ABI 59 to 64; fields 83, row_facts 23, summary 10, census 28, session_table 16, selection 8, retention 5, health 6, selection_since 6, selector_diagnose 12, selector_fields 8.
wz-access-control: decide names the rule or default that decided; judge takes a partial subject and names the attributes the answer needs. wz-runtime-tokio keeps each compiled rule's document origin. wz-capi-c: wz_capi_c_config_acl_verdicts, refusals in the validation door's shape; its ABI 19 to 20.
'''
verification = '''
wz-capture library tests with dissect and network codecs 1896 passed and 6 ignored, and with default features 1386 passed and 6 ignored, among them comments on the rows a packet starts and in the summary, the row place across a front trim, clock, date and unit literals, zids and session over rows, a JSON publisher read by its encoding with no key rule, a CDR String read by a declared definition, a serial capture read when declared and skipped when not, a capture read as two containers equal to it read as one, a raised chain cap reassembling what the default gives up, and a scouting fold and an open verdict each read once. wz-capi-dissect 275 passed and 4 ignored; wz-capi-c 228, among them allow, deny, the default decision and a needed attribute; wz-access-control 27; wz-runtime-tokio's acl tests 14; wz-analyze 72. Clippy with warnings denied per touched crate. Layers C1bo, C1ch, C1bn, C1bt and C1bz pass. The upstream citation gate, the discard-site lint and the count guard pass.
'''
carry = '''
RIHS01 type hashes are not computed (no reference vector here); wstring, .action and representations other than plain CDR are refused. A handle that moved into a next container is lent no container; an INIT or JOIN still restarts a live census's planes; there is no ceiling on the bytes of all flows together. Census and values doors leave row undecided. A time literal takes a fixed offset, not a named zone. Nine static gates fail on the base tree before this round and still fail: limit_read_gate (selftest and check), gate_provenance_lint, logic_census_coverage_gate, reason_review_pin_gate, root_relative_exclusion_lint, self_report_lint, script_exercise_census and completeness_gate; they name files this round does not touch.
'''
