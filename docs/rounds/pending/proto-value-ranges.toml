impact = ["wire-spec-subset--watching-zenoh-mvp/6-zenoh-payload-layer"]

decision = '''
A consumer's send form could not say what an integer field takes, and the value door wrote a value nanopb then refuses: a `uint32` with `(nanopb).int_size = IS_8` took 300, which the protobuf type allows and the nanopb receiver, holding the field in a `uint8_t`, refuses at decode. The range of an integer field is now judged once, in `proto_range`, from the field's protobuf type and the nanopb `int_size` in force (file, then message, then field, merged by the one merger in `proto_nanopb`; a map entry by the file's options alone), as nanopb's generator maps it: a signed varint type to `intN_t`, an unsigned one to `uintN_t`, the fixed widths untouched. The description document (`proto_message` revision 5) gives every field row `value_range` (`low`, `high`, `source`: `type`, or `nanopb_int_size` only when the option narrowed it) or `value_range_refusal` (`not_an_integer`, `enum`, `map`, `unmodelled_option`), and the value door and the end-to-end wrap door refuse a value outside the same range, naming the option. No range is claimed where it would be a guess: an `int_size` the reader cannot read, and a `type_override`, under which nanopb encodes the field as a type the `.proto` does not declare. The consumer's comment conventions for value lists and scales are not read: they are not the `.proto` language, and a reader of them would make wz a second owner of a convention it does not define. A caller's choice to send an out-of-range value on purpose was not built; the consumer said it needs none yet.
'''

changes = '''
crates/wz-capture/src/proto_range.rs, proto_range_tests.rs (new): the range judgement, its words, the type range moved from the encoder.
crates/wz-capture/src/proto_nanopb.rs: the int_size in force for a field and for a map entry, an unreadable int_size and a type_override kept apart from the size's unmodelled flag; the sizer reads its options through the same functions.
crates/wz-capture/src/proto_encode.rs, proto_encode_tests.rs: a field's place carries its range, the integer check and the expected sentence use it, a map's key and value take the file's options.
crates/wz-capture/src/proto_describe.rs, proto_describe_json.rs, proto_describe_tests.rs: revision 5, `value_range` and `value_range_refusal` on every field row.
crates/wz-capture/src/doc_revision.rs: revision 5 of proto_message with its keys, families (`source`, `value_range_refusal`) and carries; the pinned revision moves to 5.
crates/wz-capture/src/fields_json.rs: the two new families in the vocabulary walk.
crates/wz-capi-dissect/include/wz_dissect.h, src/lib.rs, tests/c_abi_consumer.c: the document's revision 5 described, the encoder's refusal, the C consumer's expected rows.
'''

verification = '''
nanopb's own int_size table read in nanopb 0.4.x `nanopb_generator.py` (`datatypes`): signed varint types to `intN_t`, unsigned to `uintN_t`, enum to `uintN_t`, no entry for the fixed widths. On a build machine (8 cores, 30 GB), capture crate with `dissect,fixtures`: library tests 1,742 passed, 23 failed, 6 ignored; every `proto_` test passed, the eleven range tests and six encoder tests new among them. The 23 are not this change's: 22 are round 4460's (the transport layout's closed table does not know `whatami_name`; repaid by round 4461, which this round lands on), and `memory_matrix` fails identically on main before this change and passes at round 4451, so it came with round 4452 (fragment chains over their per-row ceiling) and grew with 4454 (122,880 bytes held and not reported); repaid in its own round. Dissection C library tests 231 passed, 2 failed (the same 4460 transport pair), the handle memory gate 4 passed. Clippy over all targets of the capture crate with `dissect,fixtures`, of the capture crate with `--no-default-features`, and of the dissection C library: clean.
'''

carry = '''
A value list or a scale for a field comes only through a structured declaration, when the consumer's generator message database names its format. Out-of-range sends on purpose are a caller's choice not yet built (needs an argument on the encode door, an ABI revision).
'''
