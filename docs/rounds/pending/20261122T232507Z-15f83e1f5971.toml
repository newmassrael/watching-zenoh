decision = '''
Run 45051019628 (graded f4d3943298, Round 4609) was read job by job before any fix was written. Four of its eight red jobs, C1ao, C1y, C1z and C1ba, stop on one compile error: `drive_session_dyn` and `drive_session_dyn_send` in `crates/wz-runtime-tokio/src/session_glue.rs` take `crate::session_open::InboundLink`, and `session_open` is compiled only with `transport-link-tcp` and `transport-unicast`, while `session_glue` is compiled with `transport-unicast` alone; a build of `transport-unicast` without the TCP link (the C1ao clippy leg `--no-default-features --features transport-unicast`, and the feature sets of C1y, C1z and C1ba) fails with E0433. The two functions are gated on `transport-link-tcp` now, the gate their parameter's module already has; every caller (`accept_loop`, gated on `routing-accept`, which implies `transport-link-tcp`, and `wz-capi-core`'s drive) is compiled only where the link is. C1co's Layer S cooperative leg ended `gets_between_open_sessions_are_counted_for_their_allocations` past its 60 s run bound: pinned to one core on a build host the run took 1034 s, each `z_get` 0.75 to 36 s, and a gdb stack dump showed both sessions' read tasks in `StreamDriver::service` waiting for an app link's input with the session held, the caller waiting for the session; the same cause was repaid by `932d721a6` and `c3844faff` in the integration that landed before this round (the run takes 0.80 s there with them), so this round adds nothing to it. C1cs (`capic-router-node` 672 over) was repaid by `c23fb8d7b` in that integration. The C1cc oracle-side failure and the budget margins of C1bnl shard 1/4 and C1cs are acknowledged unpaid in `docs/hosted-red-acks.md`.
'''
changes = '''
- crates/wz-runtime-tokio/src/session_glue.rs: `drive_session_dyn` and `drive_session_dyn_send` are `#[cfg(feature = "transport-link-tcp")]`, with a doc line naming the module their link lives in.
- docs/reason-review-pins.md: session-close-ingress / session_glue.rs to the new blob; the reason's two claims about that file (`check_out_of_band` at the head of every iteration, the park on `out_of_band_signalled` in both arms) re-read and hold.
- docs/hosted-red-acks.md: row red-f4d3-session-open-gate for run 45051019628, each of its eight red jobs attributed.
'''
