On the build host at this round's tip: the FreeRTOS two-session image builds for thumbv7m-none-eabi; Layer E7b 4 of 4 legs; Layer C1bz on wz-session-core; `wz-capi-c --lib switch_doors` and clippy `--all-targets --all-features -D warnings` of wz-capi-c; Layer C1cc passes every leg up to the init-queue leg (25 of 76 reached), the switch doors C consumer included; the guarded count gate over the range.
