impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-15-routing", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
Pay the hosted reds of runs 44434030103 (f7ab3a770, Round 4521) and 44458681692 (64d1da2e4, Round 4526), each job read from its own log and attributed before a fix was written. Five are faults of the policy rounds and are paid at their cause: the FreeRTOS two-session image is a crate of its own and kept the `MulticastParams` shape Round 4524 widened with the session's snapshot (Layer G/Q); `--connect-after` sent the startup dials followed by the added endpoints as one Replace, and since Round 4523 counts each listing of an endpoint as a link of its own an endpoint named by both lists was dialled twice (E7b), so it now sends the Add that `connect-add` sends; the switch doors read the session before the statement's shape, so a statement that is no statement answered `Z_ENULL` on a null session where the header promises `Z_EINVAL` whatever the build (C1cc, C1bnl), and half a retry and a target of no byte are now refused in the shape too; the snapshot reader of the cooperative engine is compiled where its tests are (C1cf); and Round 4521's snapshot tests are counted in C1m, C1u and C1v. Three gates read a subject that moved: the scouting socket census judges the link interface axis Round 4524 derived, `bounded_output_parity` reads the field document in the generic body Round 4525 moved it to and the writer's `key(..)` form, and the lock-order tables sit under a lock that does not allocate when contended (open-debt item 953, C1bnl). The capability cost lane, red since the c7 landing (Round 4506), moves to its readings with the growth taken apart by symbol; the Zephyr kit lane's rows were moved on main by `25fab7958` while this round was open, to the bounds this round read on its own tree. Two reds are not paid here and are named with what bisection and the register say: Z8 liveliness, 13 of 46, which bisection on the build host places in Round 4506's token commits, and the C1cc init-queue leg, open-debt item 952, red since it was written.
'''
changes = '''
`deploy/mcu-freertos-demo/src/two_session/scenarios.rs`: the group session's `MulticastParams` carries `policy: *policy`, the snapshot the scenario resolves for its sessions.
`crates/wz-ap-demo/src/runner.rs`: the `--connect-after` fire sends `ConnectReconcile::Add` of the endpoints it lists, and its schedule no longer clones the startup dials.
`crates/wz-capi-c/src/switch_doors.rs`: a `Stated` trait reads a statement's shape, then the session (`Z_ENULL`), then admits the shape under the session's snapshot; `retry_value` builds through `AdmissionRetry::new` and the query shape runs `peer_target::check`, so half a retry and a target of no byte are `Z_EINVAL` whatever the session; the test reader `admitted_by` is compiled for the tests only, and the no-session test states all three refusals.
`crates/wz-capi-coop/src/engine.rs`: `policy_in_force` is compiled where its tests are (`all(test, feature = "std")`).
`crates/wz-runtime-tokio/src/sync/lock_order.rs`: the process tables are held by a `ProcessLock` over `std::sync::Mutex`, which recovers a poisoned guard and does not grow parking_lot's global table when contended.
`scripts/lib/scouting_socket_axis_census.py` judges `link_requires_iface`; `scripts/lib/bounded_output_parity.py` reads `document_selected::<W: DocOut>` and the writer's `key("dropped_by_limits")`, and finds a generic fn's body.
`scripts/run-ci.sh`: C1m 32, C1u 12, C1v 12 (Round 4521's two snapshot tests); `.github/workflows/ci.yml`: the C1bf shards get 16 minutes and a budget of 960 s.
`scripts/lib/capability_cost_gate.py`: seventeen budgets (fourteen pico, `capic-router-node`, `capic-default`, `capic-default-lean`) at the hosted reading of 64d1da2e4, plus the growth pc2 read from that tree to this one, plus 3,500, to the hundred, with the symbol attribution of the c7 landing and of Rounds 4521 to 4526 in the note above them.
'''
