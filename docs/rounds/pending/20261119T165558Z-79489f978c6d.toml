carry = '''
Z8 liveliness, 13 of 46 red since Round 4506: on the build host 4be33f702 and 1067c2d0e pass 46 of 46, 48b4c61dc ("Tell a new south peer face no token unasked") fails 3 (`subget_peer_history_before`, `subscriber_double_peer_before`, `subscriber_double_peer_history_before`: a router no longer pushes its tokens to a new south peer face, as upstream's peer hat does not (`zenoh/src/net/routing/hat/peer/token.rs` @ `New south-bound peer remote; not propagating tokens`), and the answer to that peer's token interest does not yet carry them), and cba059eed ("Tell a south peer face the tokens it asks for") fails all 13, as 6aa8151ff and the c7 landing do. The 13 are the `subscriber_double_{peer,clientviapeer}_*` and `subget_peer_*` tests, a router with a peer that holds a token interest: each times out waiting for a token declared after the interest (`zenoh/tests/liveliness.rs` @ `async fn test_liveliness_subget_peer_middle(`) or for the Delete of one undeclared after it (`zenoh/tests/liveliness.rs` @ `async fn test_liveliness_subscriber_double_peer_before(`), so the future half of a south peer's token interest no longer reaches its face; paid in the next round.
C1cc `an_init_queue_allocates_its_batches_at_the_open_and_a_lazy_one_on_traffic_on_wz_and_libzenohc` (open-debt item 952): red since `f3fb20ae3`, hosted 44201914197 included; the C ABI's stated queue (`StatedTxQueue`) lays allocation and batching over the model but not `queue/size/*`, and a lazy queue makes no batch-sized block on traffic; the 51 C1cc legs after it are unreached until it is paid, which is the round after Z8.
'''
