impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
Every network-layer extension that repeats in one message is read by its last entry, as upstream 1.10.2's decoders do: each assigns per entry (`commons/zenoh-codec/src/network/push.rs` @ `ext_nodeid = nid;`, `commons/zenoh-codec/src/network/request.rs` @ `ext_target = rt;`, `commons/zenoh-codec/src/network/response.rs` @ `ext_respid = Some(t);`, `commons/zenoh-codec/src/network/declare.rs` @ `ext_wire_expr = we;`, `commons/zenoh-codec/src/zenoh/put.rs` @ `*ext_attachment = Some(a);`, `commons/zenoh-codec/src/zenoh/query.rs` @ `ext_body = Some(s);`), so the last wins and none refuses a repeat. wz read the first, through ext_view::find_by_eid and a dozen hand-written loops (QoS, node id, timestamp, declare wire expr, query value, frame QoS). The rule now lives once in ext_view (last_by_eid, last_index_by_eid, last_by_eid_in, last_of_each_in), the first-entry readers are gone, and the heap, lent and slot readers all take it; a chain editor edits the entry the reader reads.

The ext-identity gate was red on main since the staged-chain refactor (5ef299290) and the identity readers of the previous round: three reads of this side's own staged chain were unclassified and four classified functions no longer read an id. The reads are classified as outbound and the stale rows removed.
'''
changes = '''
crates/wz-session-core: ext_view.rs, sample.rs, reply.rs, reply/in_place.rs, attachment.rs, query.rs, query/in_place.rs, query_value_ext.rs, request_build.rs, network_message.rs (repeated_extension_tests), pubsub/in_place.rs, ts_stack.rs, ext_nodeid.rs, declare_ext_keyexpr.rs, inbound.rs, passive.rs, multicast_join.rs. crates/wz-capture/src/agg.rs. scripts/lib/ext_identity_gate.py.
'''
verification = '''
Through bx: wz-session-core lib all-features (3933) including the repeated-extension tests (one per message family, heap and walked reads), default (1619) and the slot set (1942); the workspace-unified lib set (session-core 3321, 0 failed); wz-runtime-tokio it (317); wz-capture lib (1429); clippy -D warnings of wz-session-core all-features and slot set, wz-capture, wz-runtime-tokio; zenoh and wz-capi-pico all targets check; upstream_citation_anchor_gate --check; ext_identity_gate --check and --selftest.
'''
carry = '''
On the same seam: the passive observer's ShmHandshake::extension and the auth method chain still pick a repeated id's first entry; a malformed last entry is read as absent where upstream refuses the message; a router forwards a chain with a duplicate where upstream re-encodes one entry. The SCE with_policy fix (SCE b9140288) waits for the pin chain the int-fix lane carries.
'''
