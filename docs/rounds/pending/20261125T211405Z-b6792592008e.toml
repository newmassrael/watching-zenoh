impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
An integration toward the doors budget of docs/c-abi-architecture.md section 9: the export guards lose the fallback no guard can answer since a panic aborts at the C boundary, the host's sleep and interval arithmetic run in one body each, and two gate pins catch up with the code they hold.

The pico ABI revision moved to 6 when payload bytes went into fixed block pools, and the ABI stamp gate kept 5; it read a stale library until the stamp is now read from the pico library's own nostd build. The layer direction gate refused the extension doors' use of the sized-struct writer, which each library compiles as its own copy like the boundary helpers; it is now held as one of them.
'''
changes = '''
crates/wz-capi-pico: guard_val and guarded run the body (107 sites, the fallback argument removed), os/ sleep through wz-host-sync's sleep_us, one interval body for the monotonic and wall clocks.
crates/wz-host-sync: sleep_us, sleep_ms through it.
scripts/lib/abi_stamp_gate.py: capi-pico pinned at revision 6. scripts/lib/layer_direction_gate.py: sized as a boundary helper, guard removed from the list.
'''
verification = '''
Run through bx from the integration worktree on b67925920: each changed crate checked alone, the changed crates' tests and clippy with -D warnings, the coop, pico, threads and direct combinations, Layer C1nh, wz_config.py --check and --selftest, size_ledger_gate --check and the capability cost check (doors 251 bytes under main), layer_direction_gate --check, every step exit 0. Layer C1st now passes its stamp step and stops at the facility driver link (a door the default package does not build), repaid by its own lane. Locally: mnemosyne-cli validate-workspace (T1 orphan new +0), upstream_citation_anchor_gate.
'''
carry = '''
Open: Layer C1st's facility drivers call a requirement door the defconfig packages leave out (fixed on its lane, with the deny scenarios to be judged on a package that builds the door). The Windows build of the shared sleep body is judged by the hosted Platform job. The doors area still owes the session counts the first open states about 300 bytes before that lane lands.
'''
