impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The two policies that were reachable only from the registry are reachable from the Rust API, each behind a non-default crate feature, as the link set of entity-link-restriction is. A get and a querier take .target_peer(zid) with the node's ZenohId behind targeted-query, and a publisher and the put and delete a session makes take .admission_retry(retry) with an AdmissionRetry behind admission-retry. The value is stored in the builder, carried by the declared publisher or querier, threaded through the session's publish and query path into the engine-facing request, and set on the options struct the registry already reads (QueryOptions::with_target_peer, PublishOptions::with_admission_retry). The registry side needed nothing: the query reach and the publish fan-out already read both fields, so only the front half was missing.

A value that is stated is refused at the point the builder resolves when the build's policy is off, with the policy's own sentence, by calling the policy's admit_in_build; a value that is not stated takes exactly the path it took before. The refusal comes at the declaration of a publisher or a querier and again at each put or get made through it, so a handle cannot outlive the refusal. The router engine reads neither value and refuses a stated one with its own sentence rather than widening a query or dropping a retry without saying so.

The decision that was not obvious is the shape of the stored values. The node is held as the ZenohId the crate already spells identities with and becomes the identity bytes only where the tokio engine converts it, so the field exists in every build; the retry is the policy value itself in a build with an engine and an empty type in one without, as the link set is. Both features are kept out of the default surface for the reason link-restriction is: the public-surface gate refuses an item upstream lacks.
'''

changes = '''
crates/wz-zenoh: the manifest gets the features targeted-query and admission-retry; the sample module gets the stored types (the retry, the node), their absent values, the two admit functions that call the policies' admit_in_build, and the conversion of a node to its identity bytes; the get builder and the querier builder get a peer field and target_peer; the querier handle keeps the peer; the publisher builder gets a retry field and admission_retry (on it and on the put and delete builders over it); the publisher handle keeps the retry; the session module adds the retry to the publication and the publisher declaration and the peer to the query request and the querier declaration, checks each after the closed-session test, refuses each in the router engine arms, sets them on the engine's options (a new helper for the query side), and adds fifteen tests beside the link-restriction ones; the admin module passes the absent retry; the crate root re-exports AdmissionRetry and AdmissionRetryError with admission-retry. docs/build-configuration.md: the bullets of the two switches say they are reachable from the Rust API behind the named crate features.
'''

verification = '''
Run on the build machine pc2 from the crates workspace, counting what the logs say ran: the zenoh crate lib tests 162 passed in the default build (151 before this change) and 166 passed with the features targeted-query and admission-retry, none failed; clippy with warnings denied on all targets in both feature sets and on a build without default features. The tests added in the session module of crates/wz-zenoh (counted by the run, not by this list) are: a publication asks the engine for the retry it states, for a put and a delete; a query asks the engine for the node it names and for none when it names none; builders state no peer and no retry until told; nothing stated is admitted whatever the policy; a node named is admitted only when the policy is on; a retry stated is admitted only when the policy is on and its numbers are a retry, with the policy said first by a build without it; a get and a querier naming a node, a put, a delete and a publisher stating a retry, and the declared handles, are made only when the policy is on; the router engine refuses a retry and a node it does not read, from the helpers and from the declarations; and, with the matching feature, target_peer and admission_retry state the value on each builder and are refused by a build without the policy. Those tests branch on the build's own policy value, so they hold in a policy-on build as well, which was not built here.
'''

carry = '''
Open: the C ABI states neither value; the cooperative engine and lwIP do not read them; the declared publisher of a retry and the declared querier of a node send the same interest as before, so their matching status is unchanged; the put and delete made through a declared publisher carry its retry but the handle has no setter after declaration; the builds with each new feature, with both, and with no engine, were not compiled when this round was written; the upstream arm of the public-surface gate (nightly toolchain and pinned source) was not run and should not move because the features are off by default. The doors wait for the namespace for wz extensions to leave the feature gate.
'''
