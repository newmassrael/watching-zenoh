impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-6-keyexpr", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "watching-zenoh/local-ci-gates"]
decision = '''
A ninth integration of the pico C ABI release toward docs/c-abi-architecture.md, with a liveness defect and two long-standing hosted reds repaired.

Liveness: the cooperative session pump ran the session's timers (the keep-alive this end owes, the lease it holds the peer to) only on a step that took no input. A peer that sends faster than this end reads leaves a unit waiting at every step, so this end never sent its keep-alive and the peer closed the link when its lease ran out; the pico ABI performance matrix showed it as a publisher losing its subscriber about ten seconds into every TCP throughput cell. The step now takes at most one unit and then hands the timers the time either way, after the unit's stamp, as upstream's keep-alive runs in its own write loop and never starves:
`io/zenoh-transport/src/unicast/universal/link.rs` @ `async fn write_loop(`.

macOS: std's Mutex and Condvar are pthread there and box on their first lock or notify, so a lock made after open took memory on macOS alone. wz-capi-port's host lock is an in-place lock on macOS, and wz-capi-port's tests now run in the macOS and Windows C ABI jobs.

Windows: the pico library package's ceiling step named the Visual Studio 2022 generator for the zenoh-pico reference, and the runner carries Visual Studio 2026, so the reference never built. Both Windows scripts now read the generator off the Visual Studio vswhere finds, and a failed reference build prints its log into the job.

Size: a stream link writes through one primitive (write, WRITES_NOW, wait_writable) in place of four; a lent chain's body is counted with the send's count; a due lease and keep-alive are judged by the deadlines their wake read; a build with no scout opens on a scouted list of no room; four doors siblings end in, and the payload copy, are kept out of line; a configured zid's trailing zeros and a zero id are read as one number. The shared registry's one-body drop measured no gain and is reverted.

The size ledger reads 1.5772 times zenoh-pico in total (from 1.6004): sessions 2.8830, doors 2.1626, transport 2.8022, driver 1.5154.
'''
changes = '''
crates/wz-runtime-coop: session_drive.rs (timers after each unit, take_input), stream_link.rs, app_link.rs, ip_stack.rs; crates/wz-runtime-posix: stream.rs and windows/stream.rs (write); wz-runtime-zephyr, wz-session-lwip, wz-tls-mbedtls stream.rs and tests.
crates/wz-capi-port: os.rs (std_lock, in_place), sync.rs, Cargo.toml (std carries wz-host-sync); twelve workspace Cargo.lock entries for wz-host-sync.
crates/wz-session-core: tx_buf.rs (try_encoded_len), frame_encode.rs, multicast_tx.rs, drive.rs and transport_timers.rs (LeaseDeadlines, judge_lease, judge_keepalive), session_actions.rs.
crates/wz-capi-pico: session.rs (ScoutedLocators), string_array.rs, serde.rs, keyexpr.rs, bytes.rs, zid.rs (id_len, id_is_zero), pubsub.rs, connectivity.rs.
scripts/host-bench/windows/size_ceiling.ps1 and perf_matrix.ps1 (generator from vswhere, reference log printed); .github/workflows/platform.yml (wz-capi-port in the macOS and Windows C ABI jobs).
deploy/size_ledger.json rows tightened; docs/reason-review-pins.md three session-close-ingress rows re-read.
'''
verification = '''
Run through bx from the integration worktree on 830a1a29f: the integration verify sweep passed every lane (34: clippy of each changed crate with -D warnings, the changed crates' tests, the coop, pico and lwIP feature combinations, Layer C1nh). Beside it on the same commit: clippy --all-targets -D warnings of wz-capi-pico with engine-tokio,peer,query,queryable and engine-coop,peer,advanced; wz-runtime-coop's wake_budget_tests with alloc,session-unicast,session-unicast-open,transport-keepalive,codec-keep-alive (the flooded session sends its keep-alives); cargo test and clippy of wz-capi-port; wz-runtime-posix tests and a check of it for x86_64-pc-windows-gnu; wz-tls-mbedtls tests built; Layer L. The size ledger --measure on 830a1a29f: sessions 91,385 / doors 45,442 / transport 41,310 / driver 28,432 / keyexpr 11,776 / codec 33,009 / language 17,561 bytes against zenoh-pico, total 1.5772. Locally: mnemosyne-cli validate-workspace (T1 orphan new +0), reason_review_pin_gate, reason_citation_gate, store_reason_citation_gate, upstream_citation_anchor_gate, prose_named_identifier_gate, logic_census_coverage_gate, totality_debt_gate, wz_config.py --check.
'''
carry = '''
Open: sessions 2.88, transport 2.80, doors 2.16 and driver 1.52 times zenoh-pico. Locks made after open elsewhere (the coop runtime's host mutex, the advanced cache, e2e and supervision, node-time, observation) are std locks that box on macOS; a lane is moving them to the in-place lock with a gate. The Windows package's ceiling rows are unfilled and wait on the first hosted reading. The ABI performance matrix lost its TCP throughput cells to the keep-alive defect repaired here and is to be run again. The SCE items (shared extension walk, parent-tag flag, event context) wait behind the runtime size branch. An inventory reason still describes the slot machine's more bit as a typed payload.
'''
