impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-5-link", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-6-keyexpr", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-7-declare-flow", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-25-ext-pubsub"]
decision = '''
Five generic, default-off switch families land together, each a capability, policy or limit of `deploy/wz-config.toml` that a build or an open-time profile selects and that an unselected build does not carry. A transport the program supplies (`app-transport`): a session's links go over the program's own network stack through a send call and a receive call, with would-block, partial send, close and accept mapped onto the session's own link outcomes, for stream, datagram and group links, on the tokio and the cooperative engine. Session-layer behaviours chosen at open (`handshake-stray-message`, `query-unanswerable-final`, `zid-derivation`, a fourth `reliable-gap-reconnect` value, the declaration-sync no-progress, retry and expiry limits, and a re-declare door); the default of `handshake-stray-message` is upstream's, which ends an attempt that receives a message out of its step with Close(INVALID), where wz had dropped such a message. A key-id dictionary every node of a deployment shares (`shared-key-ids`, policy `key-wire-form` per session and per link), with replies that mirror the request's form. End-to-end protection on the pico ABI (`e2e-sender` reaches the pico ABI, off there by a per-ABI default the declaration now states; `e2e-receiver`, `e2e-sender-demux`), with the counter step and verdict as SCE algorithms. Reception supervision per stream (`e2e-supervision`), whose activation is an SCE statechart. New lifecycles are SCE statecharts (`app_link`, `stream_activation`); per-handle and per-stream tables stay sans-I/O Rust until SCE carries keyed tables.
'''
changes = '''
`deploy/wz-config.toml`: capabilities `app-transport`, `shared-key-ids`, `e2e-receiver`, `e2e-sender-demux`, `e2e-supervision`; `e2e-sender` widened to the pico ABI with `default_off_abis = ["pico"]`; policies `handshake-stray-message`, `query-unanswerable-final`, `zid-derivation`, `key-wire-form`, `e2e-supervision-notify`, and `reliable-gap-reconnect` gains `until-declarations-synced-when-begun`; limits `APP_LINK_QUEUE_BYTES`, `MAX_SHARED_KEY_IDS`, `E2E_SENDER_SLOTS`, `E2E_SUPERVISED_STREAMS`, `DECLARATION_SYNC_RX_NO_PROGRESS_MS`, `DECLARATION_SYNC_RETRY_INTERVAL_MS`, `DECLARATION_SYNC_TX_NO_PROGRESS_MS`; each new policy in the `upstream` profile at its default.
`scripts/lib/wz_config.py`: `default_off_abis` (a per-ABI default; Kconfig and the defconfigs read the pico ABI's), and a policy's choice arrays laid out as rustfmt lays them when they are wide, with a selftest arm.
`sources/session/app_link.scxml`, `sources/session/stream_activation.scxml`, `sources/algorithms/e2e_counter_step.scxml`, `sources/algorithms/e2e_counter_verdict.scxml` and their `out/` emits.
`wz-session-core`: `app_link_table`, `app_transport`, `stream_supervisor`, `shared_key_ids`, `handshake_stray`, `zid_derivation`; the declaration-sync watch, the held handshake answer, the unanswerable-query final and the shared-id resolution in the session's existing paths.
`wz-runtime-tokio` (`app_link`, the link registry, the multicast driver, reconnect pacing), `wz-runtime-coop` (`app_link`), `wz-capi-core`, `wz-capi-coop`, `wz-capi-port` (`redeclare`), `wz-app-frame` (profile rules, `e2e_receiver`, `e2e_stream_sender`, CRC resume), `wz` (`ext::redeclare`).
`wz-capi-pico`: `wz_ext_transport_*`, `wz_ext_config_transport`, `wz_ext_config_key_ids`, `wz_ext_config_key_wire_form_for`, `wz_ext_e2e_sender_*`, `wz_ext_e2e_receiver_*`, `wz_ext_stream_supervisor_*`, `wz_ext_redeclare`, declared in `wz_ext.h`; a C program over the program transport and its step in the Platform workflow (observed until two green runs).
Gates: `policy_read_gate.py` lists the stream supervisor's creator; `feature_public_surface_census.py` and `feature_gate_diagnostic.py` classify the new features; `nondefault-tests-gate.sh` legs for the new doors.
'''
verification = '''
On the build hosts at the integration tip, every run read from its own log and its count of tests that ran: `wz-app-frame` 54; `wz-session-core` with `e2e-supervision,app-link,shared-key-ids,pubsub-put,codec-response` 1,280 (app_link_table 33, shared_key_ids 31, stream_supervisor 19, wireexpr_resolve 16, zid_derivation 6, handshake_stray 4, replay_pacing 4, app_transport 2) and its default build 1,075; `wz-runtime-tokio` app_link 13, its `it` files handshake_stray_message 7, init_ack_patch_level 5, session_fsm_driver_loop 41, and its default build 1,054; `wz-runtime-coop` app_link 8; `wz-capi-coop` 51 and its default build 22; `wz-capi-core` 223; `wz-capi-c` 341; `wz-session-mcu` 22; `wz-capi-pico` with every new capability 257 (app_transport_doors 7, e2e_doors 3, stream_supervision_doors 4, key_ids_tokio 3), without sender slots e2e_doors 3, on the cooperative engine with the program transport and the dictionary 167 (app_transport_doors 5), and its default build 229; `wz` 1. Clippy `--all-targets -D warnings` per crate on each of those feature sets.
Locally: `wz_config.py --check` and `--selftest` (365 arms), `sce_feature_model.py --check`, `policy_read_gate.py --check`, `feature_public_surface_census.py --check`, `drop_in_header_gate.py`, `prose_feature_gate.py --check`, `prose_named_identifier_gate.py --check`, `upstream_feature_census.py`, `rustfmt --check` of every generated Rust file.
The guarded count oracle over the range on pc2: 66 guards reached and measured, 65 agree; the one that moved (C1m mcu slot node, 31 declared, 32 printed) is a count main had already moved to 32 in `f720581b7` after this branch's base, and the branch now holds that commit.
Upstream reading for the default of `handshake-stray-message`: `io/zenoh-transport/src/unicast/establishment/open.rs` @ `Received an invalid message in response to an InitSyn` and `accept.rs` @ `Received invalid message instead of an InitSyn` return `close::reason::INVALID`, at the pinned 1.10.2.
'''
carry = '''
The C program over the program transport is not yet a Linux lane (there is no Linux C-program job in the Platform workflow) and runs observed on macOS and Windows until two green runs. The cooperative engine's pico open has no group join and no datagram listen, so its program transport carries streams and dialled datagrams only. The pico preset ends a handshake that receives a message out of its step without a Close and, at the opener's OpenAck step, does not end it at all; wz's `fail` follows zenoh's Close(INVALID). The `wz/key-ids` member of a config document and the per-link form in the document wait for the runtime-configuration document reader. The per-handle, per-stream and dictionary tables are sans-I/O Rust until SCE's keyed table (ADR 0108) reaches the pin.
'''
