impact = ["rfc--sce-forge-extensions-for-wire-protocol-synthesis/5.j-codegen-backend-coverage", "watching-zenoh/local-ci-gates"]
decision = '''
Move the SCE pin from 9ae6a6b682 to ffde4e10f15, in one landing as agreed with the SCE session. The move brings SCE ADR 0108 step 7 (an algorithm takes a map or set slot read-only or inout, a statechart calls it with `<sce:call ... location=...>`, map entries are held in their schema unit's own type) and the literal-shift typing of f70d8627597, with which the two keyexpr prefix-table algorithms write `1 << m` directly and drop the uint64 local that worked around an i32 shift. The 1,058 SCE commits between the two pins add no guide section that changes a Rust call site wz makes; the build met one failure, which ADR 0108 D1 explains (a key-shaped schema unit implements `sce_portable_bytes::MapKey`, so `wz-session-core` declares `sce-portable-bytes` itself).

The pin was held at 8f64285f8af because SCE 5a04f5b1b1b made every microstep call `Behaviour::take_transition`, which a statechart answers with nothing yet the call stayed in the MCU images (16 bytes of stack bound on the get and admin TLS images, the admin TLS image past its 12,000-byte cap, and 160 bytes of text on the get image past its tolerance). The SCE session put that step behind the `test-component` feature of `sce-rust-runtime`, which only a crate that builds a test component enables, and landed it at ffde4e10f15; wz builds no test component, so a statechart's microstep is again exit, content, enter, and the `engine-behaviour` contract stays at eleven calls in all six images.
'''
changes = '''
`vendor/sce` moves to ffde4e10f15 (1,058 commits past 9ae6a6b682). `out/**` is regenerated in both stages: 62 files, most of them only the header (source hash, the SCE SPDX expression now spelling `AdditionRef-SCE-Linking-Exception`, a `// source:` line); four codecs (interest, linkstate, msg_put, query_value_zbuf) gain a type alias for each gate group a view or parts value holds; `key_facts_schema` and `keyexpr_shape_schema` implement `sce_portable_bytes::MapKey`. `wz-session-core` declares `sce-portable-bytes` directly (no feature; it was already in the graph through wz-codecs), and the 18 lock files that hold the SCE runtime or session-core follow, `crates/Cargo.lock` also gaining `sce-rust-session-store` under the SCE runtime and `sce-rust-metrics` under `sce-rust-mesh`. `sources/algorithms/keyexpr_intersects_dp.scxml` and `keyexpr_includes_dp.scxml` drop the `one` local and write `1 << m` and `1 << jb`; the emitted Rust is `1u64 << m` and the `as u64` casts on the shift counts are gone. No wz crate enables `sce-rust-runtime/test-component`.
'''
verification = '''
On build hosts, by `bash scripts/run-ci.sh --layer <L>` at the pin: Layers C1ax, C1m, C1cf and B2 pass on hkl001 over main `4df161c9e`, Layer C1h passes on pc2 (hkl001 cannot hold its memory), and Layers C1g and C1cs pass on hkl001 over main `589a8884c`. `bx --action regen-codegen` regenerates `out/**` in both stages and changes no file. The six Zephyr kit images built at the pin over `4df161c9e` by `bash scripts/kit-lane.sh build <image>`: the `engine-behaviour` rule claims 11 calls in each, the stack bounds equal main's (fixed, batching and heap 3,520 bytes, get 3,616, TLS 5,868, admin TLS 11,996 against its 12,000-byte cap), the get image's text is 174,464 bytes (174,544 at the held pin) and every text gate holds; the only refusal is the `waker` reading (7 against 8) on five images, which main shows too and the carry reads. `capability_cost_gate.py --measure` on hkl001: `pico-client-small` reads 1,628,776 bytes against 1,627,108 on main `4df161c9e` (2,116 bytes over main at the held pin, so the take step was about 448 bytes of it), and `capic-default` 11,463,557 against 11,456,965 on main `589a8884c`, both within their budgets.
'''
carry = '''
Five Zephyr kit images fail the stack bound on the `waker` rule (7 claimed, 8 pinned), on main as at the pin. The reading is a defect of the stack bound gate, not a dropped call: inlining moved `SlotSession::abort` out of `hang_up`, and it ends in a tail call through a register (`bx r2`) into the waker, which the gate's reader of register calls (`blx` only) does not see. The next round on this track makes the gate read a `bx` to any register but `lr` as a call through a register, and reads the sites that reveals in all six images against their rules (the waker, the engine's turn and behaviour, formatting, `CappedTxBuf`, the TLS library). `capic-default` sits at 99 percent of its budget after this pin (6,592 bytes of it). The SCE session's split by symbol puts about two thirds of it on one new instantiation, the `BTreeMap<String, u64>` of host-run start numbers in `HostProcessorRegistry` (SCE 529c0b1d50f), none on the map slots or the literal-shift typing; it changes that map to a sorted vector of pairs, which the next pin takes with a `capic-default` reading. After the gate: the TakeGeneration algorithm, then the census rows whose only gap is U1.
'''
