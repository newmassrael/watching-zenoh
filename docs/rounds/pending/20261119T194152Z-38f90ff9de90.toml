impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-6-keyexpr"]
decision = '''
Hosted run 44572424670 found `zenoh-keyexpr`'s documentation failing to build: the module texts Round 4536 (W1) gave `include` and `intersect` link `LTRIncluder` and `ClassicIntersector`, and rustdoc reports no such item in scope. That reds Layer C1bzr (`all-without-std`) and the API-surface leg of the E lanes, and it fails the same way in the default build. The two items are defined in those very modules; the links fail because each module's documentation comes in two parts, the outer doc `mod.rs` keeps on `pub mod include` / `pub mod intersect` in upstream's form and the module file's own text, and rustdoc resolves the joined text from `key_expr`, where only `keyexpr::includes` and `keyexpr::intersects` of the four links are in scope. The links now name crate paths, which resolve from either module, and a comment beside them says why, so `mod.rs` keeps upstream's form. watching-zenoh-63 reported the red; the other two reds it reported in that run (an unused DNS helper and `wz-capture` without default features) come from Round 4538 and were passed to its session.
'''
changes = '''
`crates/wz-zenoh-keyexpr/src/key_expr/include.rs`: the module text links `LTRIncluder` as `crate::key_expr::include::LTRIncluder`. `crates/wz-zenoh-keyexpr/src/key_expr/intersect.rs`: it links `ClassicIntersector` as `crate::key_expr::intersect::ClassicIntersector`. Each has a comment on why the path is a crate path. No code changed.
'''
verification = '''
On the build machine, before the fix, `cargo doc -p zenoh-keyexpr --no-deps` with warnings denied fails with both unresolved links in the default build and without default features, as the hosted run did. After it, the default build, the build without default features, and the build with `unstable` and `internal` all document cleanly, and `cargo fmt --check` passes. Of the 151 round-fed static gates, 147 pass on this tree. The four that fail read files this round did not touch: the duplicate-module lint (`wz-runtime-coop` `app_link.rs`), the self-report lint (`wz-app-frame` `e2e_stream_sender.rs`), the layer-direction gate (`wz-session-core` `caps.rs`), and the reason-review pins of `session-close-ingress` (four files changed by the PoC integration rounds). They are on main as it stands and were reported to watching-zenoh-79, whose rounds they come from. The upstream citation gate passes.
'''
carry = '''
The next hosted run settles C1bzr and the E lanes. The two other reds of run 44572424670 are Round 4538's (the DNS helper `every_word` unused, and `wz-capture` built without default features), passed to watching-zenoh-16, with watching-zenoh-63 standing in if it does not answer.
'''
