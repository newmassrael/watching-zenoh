impact = ["feature-inventory--composable-framework-atomic--preset-catalog/6-presets/6-5-preset-ap-full"]
decision = '''
- A router leaves every face write to the face's own writer; the routing thread stages and wakes, so a burst to N faces is written in batches.
- A frame's Puts are routed under one table read; the key and an unchanged literal Put are lent, and a route is kept per face alias.
'''
changes = '''
- OutboundTx::set_writer_only and BoxedLinkDriver::tx_writer_only, asked by a router node when it holds a face; peers keep the inline write.
- forward_frame shares one read for up to 64 reading messages; lent_keyexpr; LiteralPush holds a Cow; AliasRoutes per face.
- Budgets: hot-path rows fall (block_k1 7/233 to 3/139); capic-router-node +7,784 and capic-default +7,740 by symbol.
'''
verification = '''
- fanout_io_tests 2, writer_queue writer-only 3, swap seams 1, router_forward lib 356, wz-runtime-tokio lib 779, hot-path plain and time-hlc pass; clippy of both crates clean.
- Fleet lanes 0, C0, C1cs pass on the landing branch.
'''
carry = '''
- Re-measure the D13 router cells on a machine no other run shares; the first try was refused by the pinned CPU interference check.
- An aliased Put still copies its carrier; re-encode only its key (row 6).
'''
