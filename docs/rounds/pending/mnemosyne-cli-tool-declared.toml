impact = ["watching-zenoh/local-ci-gates"]

decision = '''
bx.toml declares the pinned ledger CLI as a tool the file-round action needs, so a queue integrator's derive step is placed on a machine that has it. A rehearsal of the landing queue against a local remote ran the whole path (submit, log push, cherry-pick) and then the derive step on a fleet machine that held no build of the revision mnemosyne.toml pins; the action exited 1 with the pin gate's own sentence. The pin is a repository fact and a machine either has the build or does not, so it is declared where bx reads such facts, not worked around in the script.

The version is read from mnemosyne.toml, the one place it is written, so it is not stated twice. needed_by is the action's name: bx matches it against the run's command line, which for an action is "action file-round", so only runs of that action are steered and no other run loses a machine for lacking the tool. A machine that lacks it is not given the action, and a build machine gets the build through bx-provision; installing it on more machines only widens the choice and is not done here, because provisioning a shared machine also installs other packages and is the owner's call.
'''

changes = '''
bx.toml: a [tools.mnemosyne-cli] section (version from mnemosyne.toml, path under ~/.local/mn/<pin>/bin, check on the first eight characters of the revision, a cargo install of the pinned revision into the tool store, needed_by = file-round) and its comment.
'''

verification = '''
bx-fleet decl validate bx.toml says the declaration is valid. bx --explain-candidates reads the tool for every machine: hkl002 has it and pc2 and hkl001 report lacks=tool:mnemosyne-cli, which bx states is per-unit information and keeps no machine off for other runs. Placement of the action on a machine that has it was not yet run through the integrator after this declaration; that is the next rehearsal. Not done: no build host was provisioned.
'''

carry = '''
Open: only hkl002 holds the pinned build today, so file-round runs there alone until the owner has more machines provisioned; a pin bump in mnemosyne.toml moves the required version at once and leaves every machine without the new build until it is installed there. The same tool is a requirement of nothing else, so the other actions and checks place as before.
'''
