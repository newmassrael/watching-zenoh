Selftests and checks: artifact_root.py --selftest, artifact_root_lint.py --selftest and its run (2166 files, 0 findings, 6 exemptions in use), oracle_store, oracle_pin_gate (--roots), ensure_zenohd_at_pin --check (4 oracles), oracle_provenance_gate --check (11 roots, 0 read from the checkout), zenoh_c_oracle_arms and census_arm_reach, runci_plan, unwired_lane_lint (181 lanes, 0 absent), gate_provenance_lint (249 of 249).
shellcheck 0.11 clean on every edited script including run-ci.sh. Locally, read-only-tree.sh refuses writes to the checkout and to a target link out of it while the root stays writable.
