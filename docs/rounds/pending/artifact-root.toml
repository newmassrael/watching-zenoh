Layers Ewirez and Z and the remaining lanes were not run under a root; only Ewire is measured read-only. run-ci.sh --resume checkpoints in worktrees are unmeasured under a root.
The B2 regeneration writes out/ (generated source in the tree) by design; it is not a product and stays outside the rule.
The hosted Ero step's cost is unmeasured until the first hosted run.
The readers of zenoh_pico_include_dirs carry no freshness assertion (existed before this round).
