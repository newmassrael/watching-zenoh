impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
Two residuals of the network-extension seam closed to upstream 1.10.2's behaviour.

A declared extension whose body its reader cannot read refuses the message, as upstream's decoders do: each declared extension is read with its typed reader as the walk meets it and a refusal propagates (`commons/zenoh-codec/src/network/push.rs` @ `let (t, ext): (ext::TimestampType, bool) = eodec.read(&mut *reader)?;`, `commons/zenoh-codec/src/network/request.rs` @ `_ => return Err(DidntRead),`). wz judged headers only and read a bad body as an absent extension. ext_admit now judges each entry's header and then the body of a declared extension (timestamp, timestamp stack, target, responder, undeclaration key, source info, query value), the first offence reported as MalformedExt and refused through the same seams as an unknown mandatory extension, on the held, lent and walked reads alike. Extensions upstream cannot refuse (QoS, node id, budget, timeout, attachment, markers) are not judged.

A router forwards a message whose declared extension repeats with that extension once, its last entry, as upstream decodes one value and writes each field once; the message is cleaned once at ingress, before ACL and routing, and nothing is cloned when no extension repeats. The mandatory-extension tests now give a declared identity a body its readers read, so their verdict turns on the header they judge.
'''
changes = '''
crates/wz-session-core: ext_admit.rs (body rules, MalformedExt), parse_error.rs, put_payload.rs (chain_entries), network_message.rs (judge_entries, without_superseded_exts, tests). crates/wz-runtime-tokio/src/router_forward.rs (ingress cleaning, test). crates/wz-integration-tests pico_transport_decode_differential.rs (MalformedExt arms).
'''
verification = '''
Through bx: wz-session-core lib all-features (3940) with ext_admit, repeated-extension and mandatory-extension tests (30), slot set (1947); the workspace-unified lib set (session-core 3328); wz-runtime-tokio with routing-router-hat router_forward (360) and it (317); wz-capture lib (1429); wz-integration-tests tests build; clippy -D warnings of wz-session-core (default, all-features, slot) and wz-runtime-tokio (default, routing-router-hat); zenoh and wz-capi-pico all targets; upstream_citation_anchor_gate and ext_identity_gate --check.
'''
carry = '''
Upstream skips undeclared extensions on network envelopes and declarations and so forwards none; wz still forwards them (a policy question of which extensions a wz node carries). Where upstream reads timestamp, responder, source info and tsstack fields from the message reader, wz reads them from the length-bounded body; they differ only for a sender whose length disagrees with its fields. The SCE with_policy fix (SCE b9140288) waits for the pin chain the int-fix lane carries.
'''
