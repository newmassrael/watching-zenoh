impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The newest hosted run (the last head, run 42755847834) lost its main job at the system-package step: the index refresh succeeded, and the install it led to failed with a not-found for one version of perl that the index named and the mirrors did not hold, every alternate mirror answering ignore. Nothing in the tree was involved, and apt's own last line says what to do. The wrapper every package step of the workflows goes through now tries an install that apt refused once more, after a fresh index refresh and a short pause, up to two attempts in all; a second refusal fails the step by name as the first would have, so no package is quietly absent. An install killed by its deadline is never tried again, because a retry of a silence doubles the silence the deadline exists to bound. The attempts and the pause are environment settings of the wrapper, and the test layer of the wrapper drives three more arms: refused once then taken (the step passes, and the calls are an update, an install, an update, an install), refused every time (the step fails after exactly the two attempts), and hung (the step fails after one install).
'''

changes = '''
scripts/lib/apt-install.sh: the install loop, the code of the last bounded command kept for the caller, the two new settings and their note. scripts/run-ci.sh: the layer of the wrapper pauses for zero seconds in the arm that expected one refused install to fail, and gains the three arms above.
'''

verification = '''
The wrapper's test layer, cut out of the CI script and run as one function with its helper on this machine (it installs nothing, it drives stand-ins): it passed with the three new arms in place. As a control, the script before the change was given the same stand-in that refuses the first install and takes the second, and it failed (exit 1) where the changed script passed (exit 0). shellcheck of the wrapper printed nothing. Whether the real mirror race clears within one retry is not measured here.
'''

carry = '''
The same run's isolated-crate job was cancelled and graded nothing, so it is not read. The macOS checkout failure of the head before it (a network error fetching a submodule) has no counterpart in this change; the checkout action offers no retry, and a failure there is still acknowledged by a row.
'''
