impact = ["watching-zenoh/local-ci-gates"]
decision = '''
Repay four reds of the last hosted CI run that reached a verdict on main, run 44669791897 at `cd240d4b4`; every CI run after it was cancelled before a verdict. The run's other reds are already repaid or held: C1m and C1cf by Round 4565, Qzb's arena by Round 4564, C1cn's unclaimed tests and C1bzr/C1bz's broken links (`Origin::Api` among them) by Round 4562. Two reds stay open, each as its own round. C1cc's receive-buffer test is a wz parity gap and no test defect: upstream zenoh takes a TCP link's MTU from the socket's MSS (49,152 on this machine's loopback), zenoh-pico states 65,535, and wz states 65,535 for both ABIs, so the batch a zenoh-c session advertises and the receive pool it keeps differ from libzenohc's. Layer M's group re-join fails 2 of 3 runs on pc2 at main: the subject never admits the member started after the re-join, and the receive path logs nothing that tells why. The four reds repaid here are A4, C1/C1bnl, Q and C1cs. A4: the two header-arm tests of Round 4559 name what they prove, which is none. C1 and C1bnl: a router node's liveliness get ends its leg on the face's thread since `2b0b8d5c1`, after the get returns, as upstream tells a get's end by its callback, so the test waits for the end instead of reading it at the return. Q: the frt image's handshake chain is 7,652 bytes, because `admit_open_syn` is a frame of its own since that day's cookie and held-answer commits; the gate asks for the new figure with its reason, against a 16 KiB stack. C1cs: hosted read `cd240d4b4` about 38K over pico-default's budget. Rounds 4557 and 4558 grew it by 37,633 bytes, measured on one build host, and moved no budget. The eight budgets over their line move to that hosted reading, plus the growth since measured on one host, plus 3,500.
'''
changes = '''
- `crates/wz-integration-tests/tests/it/files/pico_header_arm_layout.rs`: both tests carry `wz-proves: none` with why (a layout probe of wz's own builds, a link closure whose upstream library is the control).
- `crates/wz-capi-core/src/drive/router_node/engine/port_tests.rs`: `a_liveliness_get_through_the_port_finds_the_tokens_alive` reads the keys once every leg has ended, within the test's wait, and says the leg ends on the face's thread after the get returns.
- `scripts/lib/stack_frame_gate.py`: frt's committed chain is 7,652 bytes, with the frames that moved.
- `scripts/lib/capability_cost_gate.py`: pico-client, -small, -udp, pico-peer, pico-default, capic-router-node, capic-default and -lean move to the hosted reading of `cd240d4b4`, plus the growth to `e924c1792` measured on one build host, plus 3,500; the symbol diff of Rounds 4557 and 4558 is noted at pico-client.
'''
verification = '''
- Each red was read from its own job log of run 44669791897 and reproduced at `e924c1792` before it was repaid: A4 names the two tests; frt's chain reads 7,652 bytes over the same nine frames on a build host; the port test's failure is the leg read at the get's return; C1cs's eight cases are the ones over.
- `scripts/audit-crossimpl-proof.sh` passes (A4).
- `a_liveliness_get_through_the_port_finds_the_tokens_alive` passes 8 of 8 on pc2 with `router-node,transport-qos,liveliness-get`, one test each run; clippy `-D warnings --all-targets` of wz-capi-core with those features and `cargo fmt --check` pass.
- `stack_frame_gate.py --selftest` passes and `--check frt` reads 7,652 bytes, the committed figure, at `e924c1792`.
- C1cs on one build host (hkl001): `cd240d4b4` and `e924c1792` measured alike (pico-default +26,144 between them); `7e14fb72d` and `cd240d4b4` put +37,633 of text on pico-default (+31,791 of text symbols, the parts noted at pico-client); hosted read `7e14fb72d` 559 over and `cd240d4b4` 38,192 over. The eight budgets are that hosted reading, the growth since, and 3,500, to the hundred; the other thirteen cases sit under theirs with room; the selftest passes 25/25.
- Layer C1cc's run at `e924c1792` on pc2 fails only the receive-buffer leg (4 against libzenohc's 5 at the default batch, the stated batch agreeing at 13); on this machine's loopback the accepting socket's MSS is 32,768, which upstream's rule makes a 49,152-byte link MTU. Layer M's re-join leg fails 2 of 3 on pc2. Both are carried.
- `runci_leg_ledger_gate.py --check`, `logic_census_coverage_gate.py --check`, `reason_review_pin_gate.py`, `upstream_citation_anchor_gate.py`, `gate_provenance_lint.py` and `round_fed_gate_reach.py` pass.
'''
carry = '''
- C1cc `a_larger_rx_buffer_size_keeps_more_receive_buffers_on_wz_and_libzenohc`: a TCP link's MTU follows its ABI, upstream zenoh's MSS rule (`io/zenoh-links/zenoh-link-tcp/src/unicast.rs` @ `let mss = socket.mss().unwrap_or(mtu as u32) / 2;`) for the zenoh-c ABI and zenoh-pico's 65,535 for the pico ABI, in the batch a session advertises and in the receive pool it keeps; its own round.
- Layer M `in_a_netns_a_group_session_rejoins_a_reattached_interface_and_admits_a_new_member` fails 2 of 3 runs on pc2 at `e924c1792`: after the re-join the subject never admits the member started then, which hears the subject; the group receive path logs no Join it turns away or refuses, so the first step is to make it say so.
- The kit lane's `waker` rule pin (8 against a claim of 7 on zephyr-client-fixed and -get), from Round 4558.
- The hosted CI of this landing is the first C1cs verdict since `cd240d4b4`; read it, and the C1cc and M legs, before the next round.
'''
