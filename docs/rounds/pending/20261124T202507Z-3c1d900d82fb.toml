decision = '''
A tenth integration of the pico C ABI release toward docs/c-abi-architecture.md.

One host lock: every crate the cooperative C ABI links names one lock type, wz-host-sync's Mutex, Condvar and RwLock (re-exported by wz-capi-port's os module). Which implementation a host gets is chosen there alone: std's wrapper where std's lock lies in its own bytes (linux, android, the BSDs, windows), an in-place lock over RawLock where std's would box on its first take (macOS, QNX) and in every build without std. So a lock made after open takes no memory on any host. The guard is Sync only where its value is. The ext-pubsub advanced subscriber's state lock is that one type on every engine: the tokio subscriber takes ext-pubsub's StateLock and lock_state rather than std's Mutex. host_lock_gate.py refuses std's lock in the non-test code of the cooperative C ABI's crates, with two counted exceptions.

Fan-out: a sample handed to several subscribers is read once by its first row; each later row joins its record with one call and is counted the same way as the first when refused. The state of a key's id spaces is a type parameter (Storage, now 'static as the policy tags are), so a build reads one policy's arm and not three.

Size: a slot of a lent chain is lent from where its lease was written; a lease is handed the zid its read already judged; a chain an ingest judged is ended at one site; a control read is judged where it was read; a send's push writer is out of its closure; the zint encoder and decoder end their loops on one data condition; an endpoint's kept pairs are written in one loop; a link's batch window is asked in one loop; a joined key is canonized into room left unfilled; a due timer of a batch is taken by one call; the room poll and the host clock are out of line; an address's octets and an IPv6 tail are read without unrolled copies.

Repairs: a node-time test's binding hid its helper, a capi-coop test's nested type is named, and the host lock's two new files are placed in the logic census.

The size ledger reads 1.5600 times zenoh-pico in total (from 1.5772): sessions 2.8788, doors 2.1069, transport 2.7702, driver 1.4630.
'''
