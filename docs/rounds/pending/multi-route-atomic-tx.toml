impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The policy multi-route-atomic-tx (bool, off by default, which is upstream's behaviour of sending a put to each link on its own terms) lets one publish ask to reach all of the links it uses or none. Upstream sends the frame to every link and each link whose queue is full drops it or waits for room by itself, so one put can reach some links and not others, and a caller that treats the links as one route cannot use that.

Asking each link whether it has room and then sending is not atomic, since another sender can fill a lane between the question and the send. So the decision is a two-phase reservation on the link's outbound queue. The queue already had a promise primitive (a permit that counts as occupied room until it is used or dropped, which a waiting sender and a sender that already has room never share); the link seam now exposes it as BoxedLinkDriver::try_reserve_room, a provided method whose default grants a trivial permit for a driver with no queue, with a RoomPermit that is owned, Send and gives its room back when dropped. Every driver over the queue and both swap seams forward it; a wrapper that did not would promise room that nothing holds. The session asks it for the lane a message would leave on and sends under it through a dispatch stage that skips the ask for room, because the ask would count the sender's own promise against the lane.

The permit is held across the send and dropped after it, and is not converted into the frame inside the enqueue. The queue's enqueue never consults the bound (only the ask does), so holding the permit through the send can only make the lane read fuller than it is for that interval and never emptier, which is the conservative side of the atomicity; converting inside the enqueue would have meant threading the permit through every enqueue path (heap, pooled, lent, inline, batch). A reserved send waits for its conduit's lock where a probe gives up, because a promise that failed on a lock would break the atomicity; the lock is held across a wait for room only by a sender whose own wait ends at its deadline and who cannot be given the promised room.

The registry runs phase one over the faces the publish may use, in order, and stops at the first face with no room: every reservation taken is dropped, nothing is sent to any face, group or subscriber of the session, no sequence number is spent, and the publish ends with a delivery count of zero without closing the session. Otherwise phase two sends to each face that promised room under its own reservation, and the multicast groups and the session's own subscribers are delivered to after it. A face that is down, or was never told an alias, answers absent before it is asked for room and takes no part. A publish that also states an admission retry reserves again after the delay, once the aborted pass gave its room back. The pure two-phase loop is separate from the faces, as the retry's pass loop is, so its rules are tested without a full lane.
'''

changes = '''
deploy/wz-config.toml: one policy row; generated files follow. crates/wz-session-core/src/atomic_tx.rs (new): the leg outcomes, the commit or abort decision, the refusal of a build without the policy, admit and admit_in_build, tests. crates/wz-session-core/src/publish_options.rs: the atomic_tx field, its setter, and the plain-put lane declining it. crates/wz-session-core/src/link.rs: RoomPermit and the provided try_reserve_room method with its tests. crates/wz-session-core/src/reconnect.rs: both swap seams forward it. crates/wz-runtime-tokio/src/writer_queue.rs: try_reserve_room over the existing permit, and its tests; the stream, serial, websocket, QUIC datagram and UDP write drivers forward it, each with a test, and the session glue tests the swap seams. crates/wz-session-core/src/session_actions.rs: a Reserved dispatch stage that skips the ask for room, try_reserve_wire_room and send_network_message_reserved. crates/wz-runtime-tokio/src/session/mod.rs: reserve_wire, the reserved publishes (literal, aliased, aliased by declaration), and the staging of a wire push shared with the probing publish; a reserve test module. crates/wz-capi-core/src/faces.rs: the three wire legs bundled as one value, the reserve outcome, the pure two-phase loop, the fan-out arm that runs it, and its tests. docs/build-configuration.md: a bullet.
'''

verification = '''
Run on the build machine pc2 from the crates workspace, counting the tests each log says it ran: wz-session-core --lib 919 passed (1 ignored, 0 failed, 920 run), wz-runtime-tokio --lib 670 passed, wz-capi-core --lib with feature gossip 183 passed; clippy with warnings denied on all three crates and on all targets; a compile check of wz-session-core without default features. Tests added, by crate. wz-session-core --lib: the atomic_tx module (the decision for a no-room link, for all granted, for absent links and for no links; admission with the policy off and on; the refusal text), the publish_options test for the field and the plain lane, and two link tests (the trivial permit of a driver with no queue, a held permit giving its room back once on drop). wz-runtime-tokio --lib: writer_queue (a lane of two batches gives two permits and refuses a third without marking congestion, a closed queue gives none, a frame sent under a permit counts beside the promise and alone after it, a waiting sender is woken by a permit that drops), one test per write driver for its own queue, the swap-seam forward in session_glue, and the reserve test module of the session (granted until the lane is at its bound and given back on drop, a send under a reservation asks the link for no room and writes the frame, the frame equals the waiting publish's, an abandoned reservation leaves the sequence untouched, a publish that may not go remote takes no room, an unknown alias gives the reservation back). wz-capi-core --lib with the faces module: the two phases over a lane model (all faces reserved before any is sent to, one full face sends to none and releases everything, a concurrent sender is refused promised room, an absent face does not stop the others, a retry reserves again and waits only between passes, an aborted pass releases before it waits, a refusal in the second phase releases what is left), and a real-face test that an atomic put is written once to each face, limited by links, on a declared key and on an unknown alias.
'''

carry = '''
Open. No Rust builder or C ABI call states atomic_tx, so admit_in_build has no caller and the statement is reachable from the registry's publish functions only. The router, cooperative and lwIP engines ignore it. Liveliness tokens and queries are not covered, and neither is a shared-memory publish, which sends as it did. A face whose lane is full cannot be built in a registry test, so the abort is covered by the pure loop and by the session-level test over a link double, and not through real faces. The permit covers the lane's bound and not a slot of a pooled queue, which a lend may still wait for, and a payload that must be fragmented is atomic for its first frame only. A staged batch frame leaves the lane later without a promise behind it, as any batched send does. An egress policy that rewrites a message's QoS can send it on another lane than the one promised. A session that aggregates links may pick another link at send time than at reserve time. The permit is held across the send, so the lane reads fuller than it is for that interval and a concurrent atomic publish can spuriously find no room and abort. The multicast groups are not part of the reservation: they are delivered to after a commit, and skipped on an abort. A publish that finds no room ends as Ok(0), the same count as a publish no subscriber matched.
'''
