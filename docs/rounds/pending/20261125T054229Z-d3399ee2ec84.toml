Still red locally and carried: C1g (lent_control 16 against 12, and legs after it), C1m legs listed in the carry, C1cs (log:: symbols in pico-client-coop-nostd, which the session that added them repays), C1co (re-run after the preset change not finished), C1cf (timed out at 52 min on a shared host after its compile error was fixed), C1bn (re-run after the ring-maximum fix not finished), C1p32 (no 32-bit host free; three i686 size and buffer claims known red). mnemosyne-cli validate-workspace before the landing: no new T1 orphan.
