impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
Hosted CI on main had failed on every run since 2026-11-21 (run 45486715960 on df3586fd0: about 49 failed jobs). This round pays the compile-level part of that red, merged with main after the int-fix landing (51c73e89d), so the lanes it blocked can report again.

Most reds were one compile failure in a feature combination no local gate builds, each turning several lanes red: test-only items gated by more than their callers (encode_ext_chain_into, ChainAnswers, ReadEntries' filter, LentByteCells, the arena's place counts, the runtime-tokio writer queue's hearing), test modules that use heap-only items in the slot profile (cfg alloc), tests and doc links that named items a refactor renamed (StreamSocket send_parts/local/peer in two Zephyr loopback deploys, acceptor_sink in zephyr-app, router_session_task_bytes' lock kind, the queryable door's engine trait), and a ring maximum that read the build's sequence-number word, a u32 where bits-64 is out, when a composed frame may carry any ring.

Count guards that hosted runs never reached were read again on what their commands print: C1am zid_hex 10, C1g slot_observer_heap 7 and the lent_tests leg 41 (its substring filter takes declare, peer_tables and slot_observer), C1m mcu default 23 and the app layer 25 (the in-memory link's lent-slot test, 7ec73acff).

The pico preset holds a matching listener per preset querier (2), because a session listening on both of its queriers was refused with Z_ERR_SYSTEM_OUT_OF_MEMORY on the client-only lane.

Gates: nondefault_feature_legs_gate reads a leg's dep/feature through the dependency's manifest; negotiated_axis_witness_gate reads the fact_doors! form; lane_feature_membership_gate reads only arrays filled from --resolve-features as cargo options; capability_cost_gate's coop listen and advanced patterns follow the symbols the current builds link.

Not paid here (carried): three size claims on i686 (id_map and peer_tables lent tables, reassembly_rx kept buffer), the remaining C1m counts, C1cs text budgets and the log:: symbols of pico-client-coop-nostd, Layer F codec-response-final floor, E7s/E7m stalls, the wz-zenoh admin get flake, Vmiri's Stacked Borrows report in the SCE runtime, and the gate-provenance leg list.
'''
changes = '''
crates/wz-session-core: cfg of test-only items and test modules (ext_chain, inbound, keyexpr_match, slot_observer, publish_options, 23 test modules), module doc link references, transport_compose::sn_ring_max in u64, tests/it tx_lend_only_encode.
crates/wz-capi-coop, wz-capi-port, wz-runtime-coop, wz-runtime-tokio, wz-capi-pico, wz-app-frame, wz-ext-pubsub: cfg, clippy and doc fixes; capi-coop group refusal before rows and a finished group's link let go; capi-pico admin_space engine type, query door by path, session_memory door test read against the preset.
deploy/zephyr-app, zephyr-tls-loopback, zephyr-admin-loopback: the stream and acceptor traits as they are now.
deploy/wz-config.toml (MAX_MATCHING_LISTENERS pico preset 2) and its generated limits.
scripts/run-ci.sh count guards; scripts/lib nondefault-tests-gate.sh rows, nondefault_feature_legs_gate.py, negotiated_axis_witness_gate.py, lane_feature_membership_gate.py, capability_cost_gate.py, reduced_docs_ledger.txt; deploy/stack_call_contracts.json anchors.
'''
