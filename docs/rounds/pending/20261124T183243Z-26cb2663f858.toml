impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-6-keyexpr", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "watching-zenoh/local-ci-gates"]
decision = '''
A sixth integration of the pico C ABI release toward docs/c-abi-architecture.md. Structural reads of each size area against zenoh-pico named the causes; this round takes the first steps on three of them.

Sessions: a face's existence was held by three tables (the transport's links, the registry's held sets, the link rooms) and each was walked by FaceId on every frame. The registry now keeps one row per set, indexed by its place, and a dispatched face is found at its place with its id checked; a lost link's replay is dropped at that place. A declaration's life was written per kind in two layers: one table of kinds and one tell body now serve the replay's sequence, place and announce, and a plane's count of write filters is judged by the session tables beside their own bound, so the engine keeps no copy of the entity rows for it.

Transport: a read chain's readers (refusal, admission, an Init's patch and region, an Open's bound) are answered in one walk; a handshake cookie is kept with one copy and judged by one rule; a reassembly slot's machine is driven through one door.

Doors: an encoding's schema is a start and a length whoever holds it, so reading it has no branch. A placing of every heap value through one body was measured to grow the doors by 790 bytes and is reverted.

Repairs: a set's holders are bound only where the others read them (a build of one face failed on the unused binding), and an encoding's block is named as held for its drop alone.

The size ledger reads 1.6286 times zenoh-pico in total (from 1.6330): sessions 2.8985, doors 2.3071, transport 3.0134, driver 1.6179.
'''
changes = '''
crates/wz-capi-coop: engine/registry.rs and registry/adding.rs (holders per set, HeldFace), engine.rs, engine/group.rs, engine/replay.rs (DeclaredTable, tell), arena.rs.
crates/wz-session-core: slot_map.rs (Slots), session_tables.rs (DeclaredTable, DeclaredKind, PlaneBounds), inbound.rs and ext_chain.rs (read_handshake_chain), bounded.rs (push_bytes, append_end), session_init_params.rs (keeps_cookie), reassembly_dispatch.rs (turn_slot_engine).
crates/wz-capi-pico: encoding.rs (schema start and length, _block); bytes.rs (Block::kept_copy).
crates/wz-runtime-tokio: session_glue.rs (a comment).
deploy/size_ledger.json rows tightened; docs/reason-review-pins.md three session-close-ingress rows re-read.
'''
