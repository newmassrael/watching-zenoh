Open: transport 3.01, sessions 2.90, doors 2.31 and driver 1.62 times zenoh-pico. A face's slot made stable for its life and its room held at its place are on a branch and not yet measured; one send form over the link's slots is held back because, as written, a heap session with batching and QoS can refuse another conduit's reliable frame after its sequence number is issued, and a link with no send storage took a slot the length of its receive buffer. The codec generator's shared extension walk, the parent-tag flag of a gated body and an event context for actions are in the SCE queue behind the runtime size branch, TD-063, TD-109 and TD-003. The pico ABI performance matrix was started and not yet read.
