impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-27-api-compat"]
decision = '''
Pay the C1cc red Round 4613 exposed (zenoh_c_tx_batching_twice_and_diff, failing on a shared-memory-arm oracle at every commit since the test was added in 9258deb5e): with batching on, wz's C ABI wrote a 4,000-put burst one put a batch where libzenohc wrote about 105. Measured cause: the same sources built with opt-level 3 batched (22 batches), the debug build did not (4,003); the writer queue's inline flush let a sender write its own message whenever 8 us had passed since the last flush, and an unoptimised build's put always takes longer, so every put of a one-way burst was flushed and written by its own sender and the writer never coalesced. The rule a sender's own write keeps now has a second clause on a queue that knows what its link hears: past the 8 us floor, the link must have heard a frame since the last flush (a turn of a conversation, which keeps the round-trip gain the inline write was made for) or have been quiet for the batching time limit (200 us by default, the longest a batch would wait anyway). The TCP reader counts each frame it takes off the wire into a LinkHearing its outbound queue reads; the stream flush and the datagram path share one rule (Lanes::a_sender_may_write), and a queue without a count (the multicast groups) keeps the floor alone. The rule only removes inline writes the floor allowed, so no lone message that went to the writer before now writes itself.
'''
changes = '''
- crates/wz-runtime-tokio/src/writer_queue.rs: LinkHearing; OutboundTx::set_hearing; Lanes::a_sender_may_write (the floor, then heard-since-flush or quiet for the batching time limit) and Lanes::mark_flushed, used by flush_inline, write_landed_datagram and note_flush; the test a_one_way_stream_slower_than_the_floor_is_left_to_the_writer.
- crates/wz-runtime-tokio/src/stream_link.rs: StreamReadDriver::hearing, counting each LinkEvent::Rx.
- crates/wz-runtime-tokio/src/link_pipeline.rs: wire_tcp_stream_with_lowlatency shares one LinkHearing between the reader and the queue.
'''
verification = '''
- The batching differential on this machine's shared-memory-arm zenoh-c oracle, wz-capi-c built as Layer C1cc builds it: zenoh_c_tx_batching_twice_and_diff passes (batching true: wz 310 batches, libzenohc 44; false: one put a batch on both), and zenoh_c_tx_batching_time_limit_twice_and_diff passes. Before the change the debug build wrote 4,003 batches and an opt-level 3 build 22.
- wz-runtime-tokio: clippy -D warnings all targets default and --all-features, and --no-default-features with transport-link-tcp,transport-unicast; --lib 782 passed; --all-features --lib writer_queue 84 passed, the fence order tests among them.
- reason_review_pin_gate and upstream_citation_anchor_gate --check: OK.
'''
carry = '''
- SwappableLink and LocalSwappableLink do not forward set_idle_flush or tx_staged, so a session opened with reconnect never batches. Forwarding needs a decision first: a link a swap installs that refuses the hook would leave a session batching with no writer that pulls its frames. link_subject and link_endpoints return references a lock cannot lend, so they stay unforwarded by shape.
- The multicast groups' datagram inline write keeps the 8 us floor alone: their queues have no LinkHearing.
- From Round 4609: the debug frames of FaceLoopIo::new (84,168), dial_locator_on (80,824) and the accept_loop test a_node_dial_that_opens_restarts_the_nodes_wait_for_its_next_outage (151,944); whether drive_multicast_session_running joins a shared drive.
'''
