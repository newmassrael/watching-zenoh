impact = ["watching-zenoh/local-ci-gates"]

decision = '''
A client of the C library commanding a declared node is now a witness of the Zcmd lane, and the configuration it opens its session from is a tracked canonical file. The witness is a C program linked against the library built with its two doors: on the first start it makes its identity with wz_capi_c_identity_make, and the zid the declaration grants status is the zid that call wrote, so every leg that presents that key presents one the library made (the stock z_get legs included). It opens its session from deploy/clients/commander.json5 with the words filled, makes each verb's key with wz_capi_c_lifecycle_key and reads each reply with wz_capi_c_lifecycle_read: its status is answered, its close refused by name, and a client whose key is on no list is refused status. Its key is held to the node's, its zid to wz_node.py --zid-of's. The lane builds the library with lifecycle-doors and identity-make in a target directory of its own, so the default build other lanes link is not replaced.
'''

changes = '''
- crates/wz-capi-c/tests/c_lifecycle_witness.c: make (identity) and ask (canonical config, key, z_get, read) as a consumer's program
- deploy/clients/commander.json5: the canonical configuration of a commanding client, its words in angle brackets
- wz_declared_commander_zenohd_interop: the granted party is made by the library; canonical_config, witness_answer and the leg zenohd_lane_a_wz_capi_c_client_with_the_key_it_made_reads_its_grant_and_is_refused_the_rest
- run-ci Zcmd builds wz-capi-c with lifecycle-doors,identity-make into crates/target/wz-capi-c-lifecycle, names it in WZ_CAPI_C_LIFECYCLE_LIB and counts 6
'''

verification = '''
- pc2: wz-capi-c built with lifecycle-doors,identity-make; clippy wz-integration-tests all targets clean; Zcmd 6 passed (the witness and the five legs, which now present the key the library made)
- the pre-push static bundle: green for this change; two reds on main that are not this round's (reason pins of session-close-ingress, the link-restriction feature row) were measured and are named in the carry
'''

carry = '''
- Round 4422's carry said the mnemosyne UNDECIDABLE was fixed in its Round 1345; the cause of what was seen is a linked worktree's hook exporting GIT_DIR, fixed in mnemosyne Round 1346 (the pin moves when it lands)
- main is red on two static gates since 2026-11-08 afternoon: reason_review_pin_gate (session-close-ingress cites three files 75459679c1 changed) and feature_public_surface_census (zenoh link-restriction, wz-only, has no row and no lane that turns it on)
'''
