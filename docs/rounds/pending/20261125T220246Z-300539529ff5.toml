decision = '''
An integration toward the receive Ir budget of docs/win-budget/ir-receive.md and the measurement the remaining LOSS rows need. An in-place receipt is stamped at its turn's time instead of reading the clock per datagram, and a declared peer key keeps its subscriber set so a repeated push skips the subscriber scan; ship W per received message went 5,133.7 to 5,090.5 and 5,092.7 on the two lanes. The shipped wz arm gains a per-operation Ir count (opprofile) and throughput is graded by each arm's no-drop rate, so get and declare stages can be measured on the form that ships.

The staged handshake extension chains are held by one build cfg the build script derives, instead of features repeated at each item. Layer C1st calls the requirement door only in libraries that build it and judges the denied runs on a second package that turns the doors on.
'''
changes = '''
crates/wz-session-core: unicast receipt stamped at the turn's time (rx-in-place); match_set.rs, a remembered subscriber set per declared peer key, invalidated by subscriber epoch, alias and class; ext_chains_cfg.rs, the one cfg wz_ext_chains for the staged chains.
scripts/pico-compare.sh, scripts/host-bench: opprofile per operation on the shipped arm, parity throughput by no-drop rate. scripts/lib/abi_stamp_gate.py at revision 6.
scripts/lib/facility_trace.py, facility_drivers, wz_package.py --capability, wz_config.py with_capabilities, run-ci.sh C1st: a door-held package and --judge-doors.
docs/zenoh-logic-as-sce-kinds: S1, S2 and files.md place ext_chains_cfg.rs and match_set.rs.
'''
