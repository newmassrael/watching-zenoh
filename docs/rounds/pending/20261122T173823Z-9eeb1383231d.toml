impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
The face loop split, decided by structure rather than by trade (owner, 2026-11-22: "the longest-run correct structure"). Round 4601 held the split back because it added 50 to 100 KB of release text; a symbol diff showed the pieces were not the growth: the session drive loop (`drive_session_until_terminal_with_extra_deadline`, seven type parameters) was compiled again for every caller's closures (three `wz_capi_core::drive::drive_face` instances of about 15 KB, the accept loop's held, spawned and joined drives), and the dial (`dial_locator`) and the initiator's open were inlined into each role that awaited them, so any change around them moved which copies the inliner made. An `#[inline(never)]` on an async fn does not reach its poll body (measured on `dial_locator`), so the copies could not be pinned by attribute. The structure that bounds them: (1) the drive's decisions are `SessionDrive`'s, non-generic methods lent the caller's hooks per call (sans-I/O); the waiting is `drive_core`, over a hook set `K: LoopHooks`; `drive_session_dyn` / `drive_session_dyn_send` erase the hooks and box the loop, so a library compiles the loop once per Send-ness and no caller inlines it; the accept loop and the C ABI drive every face through them, and the closure form boxes the loop it awaits (a future that awaits a drive holds a pointer). (2) `dial_locator` and `initiator_open` return their futures boxed and erased: one dial and one handshake body for every role. (3) With those in place the face loop is a state (`FaceLoop`, `step` leaves effects: dial, settle an open, wait a peer's retry, drive, report; the time a step arrived is its input) and a shell (`FaceLoopIo`: the race, the opens, the drives held or spawned, the observer). Release text on one machine, main 634d1b7ba against this branch, every case: pico-peer -28,336, pico-default -12,768, capic-peer -23,996, capic-router-node -49,636, capic-default -262,136, capic-default-lean -244,452; a client, which drives one session from one place, pays the boundaries (+619 of symbols, the rest unwind tables and vtables): pico-client +3,904, pico-client-small +2,364, pico-client-udp +1,360, capic-client +3,448, capic-client-small +2,828, capic-scout +13,988; the coop cases 0. Each budget moves by its own change; capic-default, which main's hosted run read 2,889 over its budget, takes that reading less this change and 3,500. Debug frames: the face loop's poll 172,032 to about 20 KB, the largest accept_loop test 347,288 to 151,944. Two reds of main under pubsub-ts-stack, settled with their owner (Round 4600's session) as this round's: the aliased sixteen-client fan-out asserted no copy in every build, but a timestamp-stack fan-out is not shared and re-keys the aliased Put once; it is held to the shared builds and a twin holds the timestamp-stack build (one copy, no shared encode, each face its own message with the literal and the payload); and the router hot path budget had no row for pubsub-ts-stack (Block k1 12 allocations / 622 bytes, k16 102 / 7,552).
'''
changes = '''
- crates/wz-runtime-tokio/src/session_glue.rs: `SessionDrive` (the drive's decisions), `drive_core`, `LoopHooks` / `DriveClosures` / `DriveHooks`, `drive_session_dyn` and `drive_session_dyn_send`; the closure form boxes the loop; `park_on_drain`'s checks are `park_wake_ends`.
- crates/wz-runtime-tokio/src/session_open.rs: `dial_locator` and `initiator_open` return boxed, erased futures over `dial_locator_on` / `initiator_open_on`.
- crates/wz-runtime-tokio/src/accept_loop.rs: `FaceLoop` (state, `step`, `Effect`) and `FaceLoopIo` (shell); `drive_face`, `drive_face_shared` and `drive_joined_face` drive through `drive_session_dyn`(`_send`) with `face_hooks`; the credit gate is `read_gate_wait`, boxed only while the gate is closed.
- crates/wz-capi-core/src/drive.rs: `drive_face` drives through `drive_session_dyn_send`.
- crates/wz-runtime-tokio/src/router_forward.rs: the aliased no-copy fan-out test is `not(pubsub-ts-stack)`; `an_aliased_fan_out_with_a_timestamp_stack_is_sent_to_each_face_re_keyed` added.
- crates/wz-runtime-tokio/tests/router_hot_path_cost.rs: a BUDGET row for pubsub-ts-stack.
- scripts/lib/capability_cost_gate.py: twelve budgets move by their measured change (capic-default to 11,252,900).
- docs/reason-review-pins.md: session-close-ingress / accept_loop.rs, session_glue.rs, session_open.rs to their new blobs; the four cited anchors (`fn plan_endpoint`, `pub enum ConnectReconcile`, `AddNodePassive {`, the loop head's `check_out_of_band` and both arms' `out_of_band_signalled`) re-read and hold.
'''
