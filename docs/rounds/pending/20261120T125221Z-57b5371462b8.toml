impact = ["watching-zenoh/local-ci-gates"]
decision = '''
Repay three local CI reds of main that the verification of the next SCE pin move met, as their own landing, ahead of the pin. Two are this track's: since the keyexpr matcher reads the key as text (W1, 90fb40494), a Put costs the heap nothing on the heap profile too, and the heap controls of `session_slot_allocations` and `session_pump_allocations` still required the Put windows to allocate, which made Layer C1m red. The right reading is that a Put is now a window that costs nothing on every profile, as an idle turn is; the control keeps the windows that do allocate on the heap profile (creation, handshake, KeepAlive, Close, and the pump's tasks). The third C1m red is a guard count: cd6f74c9a added a fifth `slot_group` test and left the guard at four. Layer C1cf was red because the empty transport slot `NO_APP` was built in every test build while only the router node and the scouting tests read it (4a4aed68b); the constant is now built where a reader is.

The SCE pin move itself is held: at 8f64285f8af every microstep calls `Behaviour::take_transition`, which costs each Zephyr image 16 bytes of stack bound (the admin TLS image would read 12,012 bytes against a 12,000-byte cap) and the get image 160 bytes of text past its tolerance. The SCE session decided to compile that step out of a statechart's build (a runtime feature only a test-component document enables), and the pin moves to that commit instead.
'''
changes = '''
`crates/wz-capi-core/src/drive.rs`: `NO_APP` is built under `any(feature = "router-node", all(test, feature = "scout"))`, in both transport arms. `crates/wz-session-lwip/tests/session_slot_allocations.rs` and `session_pump_allocations.rs`: a Put window is judged by `check_free` on every profile, and the module and helper docs say why and since when. `crates/wz-session-lwip/tests/rx_frame_allocations.rs` renames the query test to `a_query_read_in_place_reaches_its_queryable_and_costs_the_heap_nothing`, and its fragment doc and a comment of `crates/wz-session-core/src/pubsub.rs` no longer name the matcher's scratch. `scripts/run-ci.sh`: the C1m heap control comment names the windows that must allocate, and the `slot_group` guard is 5.
'''
verification = '''
On the landed tree (main f33d02e17 and the four commits), on build hosts: Layer C1cf pass (360 s) and Layer C1m pass (630 s, every guarded leg reached), each by `bash scripts/run-ci.sh --layer <L>`. Before the fix, on main's tree, C1m failed in two legs, both read to their own sentence: the heap control of `session_slot_allocations` ("a Put of 1 bytes each way: 0 allocations; the heap profile allocates here") and of `session_pump_allocations` (the same four Put windows), and after them the `slot_group` guard ("expected exactly 4 passed", five run). Attribution of the heap control: `session_slot_allocations` on the heap profile reads a Put each way as 2 allocations at f98b7d23e and 0 at 15b7eec1e and a55db92ea, every other window unchanged (creation 19, handshake 16, KeepAlive 2, Close 1); the only change to the Put path between them is the matcher reading the key as text. After the fix the same test reads 5 passed on `session-slot` (every window 0) and 1 passed on the heap profile; clippy -D warnings --all-targets of wz-session-lwip on the heap control's features is clean; rustfmt --check is clean on the four edited Rust files. `slot_group` holds five tests since cd6f74c9a (four at its parent). The reason-review-pin gate reads OK after the comment of `pubsub.rs`.
'''
carry = '''
The SCE pin move to 8f64285f8af (algorithm maps, the literal-shift typing, `sce-portable-bytes` declared by wz-session-core) waits on the SCE commit that compiles the take step out of a statechart's build, and then moves there in one landing, with the two keyexpr prefix-table algorithms writing `1 << m`. The Zephyr kit images keep one red that is not this track's: the `waker` rule claims 7 calls and pins 8 on the fixed and get images, owned by the runtime configuration session's repay of Round 4558. Measured on hkl001, `pico-client-small` reads 1,627,060 bytes on main against its 1,620,800 budget (the budget was set on another host). Next on this track: the TakeGeneration algorithm, then the census rows whose only gap is U1.
'''
