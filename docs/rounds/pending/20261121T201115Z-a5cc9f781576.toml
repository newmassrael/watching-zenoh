impact = ["watching-zenoh/local-ci-gates", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session"]
decision = '''
The runtime-config step 4b carry lands with the repayment of hosted run 44895098050 (main c72460b30). The carry moves 45 limits that a run could not set to be read from the snapshot their session, node or runtime is handed: read = "snapshot" goes from 14 to 50 limits and read = "build" from 45 to 9. The nine stay build values for a stated reason each: an array length or a const generic (SNAPSHOT_HISTOGRAM_BUCKETS, EVENT_RING_SLOTS, CLOCK_SOURCES), a runtime-scope limit whose machine the pico and C doors build with no RuntimeLimits in hand (MESSAGE_CATALOG_ENTRIES, SUPERVISION_CHECKPOINTS, E2E_SUPERVISED_STREAMS), or a judge or keyer that is made before any session and takes none (E2E_SENDER_SLOTS, INSTANCE_KEY_FIELDS, INSTANCES_PER_MESSAGE). MAX_KEYEXPR_BYTES is a capacity, so every heap key table refuses a key over the snapshot's quota (a behaviour change on the heap profile, 256 bytes by default); MAX_STATIC_CONNECT is advisory on the heap and the tokio node refuses a connect list past it (ConnectPastLimit). A group session carries its limits (MulticastParams.limits) and its queue is made of both snapshots (TxQueueConf::of_snapshot, which replaces of_policy). The open's runtime limits reach the node clocks of the registry and the router. The facts interface of wz_ext moves MINOR 0 to 1 for replay_depth_max. Two stack overflows of the tokio tests with all features were removed at their cause: an async fn that takes a future holds it twice (argument and select), so timeout_on and open_within are named futures (the static open's future 52,032 to 12,176 bytes), and an eviction test boxed the four futures it joins. The repayment, read from each job's log: the module doc links written as paths where a module also has an outer doc (rustdoc resolves the combined docs in the parent's scope); wz-capture turns wz-app-frame message-payload on through a feature of its own, because a dev-dependency feature changed Layer C1's resolution (C1cap); the libclang install of platform.yml goes through apt-install.sh (C0g); 23 count guards move to what their command printed, found by guarded_count_gate.py over the range, since each layer stops at its first wrong count; the C1cs budgets are the hosted reading, the carry's growth on one machine and 3,500; the Zephyr stack records follow what the images read. The deploy images still called TxQueueConf::of_policy, which the carry removed and the workspace build does not compile, and Layer Qzb's build found it; they now make their queue of their snapshots. The host-net carrier cross-check compared sysfs from another network namespace on a build host; it now skips a device this namespace's kernel does not know by name.
'''
changes = '''
- crates (step 4b carry, merged from ten branches): the limit readers read the session, node or runtime snapshot; limit_read_gate reads read = "snapshot" for 50 limits; MulticastParams.limits; TxQueueConf::of_snapshot and pico_of_snapshot; DialConfig and OpenStance carry runtime_limits; ConnectPastLimit; timeout_on and open_within as named futures (TimeoutOn, OpenWithin); silent skips made closed helpers.
- deploy/*: the MCU and Zephyr images make their tx queue of their policy and limits snapshots; the FreeRTOS demo's group gets its limits.
- crates/wz-session-core retry_period, reply_stage, peer_tables and crates/wz-capi-core drive: inner-doc links written as paths.
- crates/wz-capture: feature message-payload for the one-writer test; scripts/run-ci.sh: a C1cap leg runs it; scripts/lib/feature_gate_diagnostic.py records it as gating no public path.
- .github/workflows/platform.yml: libclang through scripts/lib/apt-install.sh.
- scripts/run-ci.sh: 23 count guards moved to the printed counts, each with its reason.
- scripts/lib/capability_cost_gate.py: 16 budgets moved, with the symbol diff of the growth.
- deploy/resource_budget.json, deploy/stack_call_contracts.json, scripts/lib/stack_frame_gate.py: the zephyr-fixed and fixed-tcp chains, four client stack bounds and two call pins.
- crates/wz-host-net link_interfaces tests: the carrier cross-check skips a device another namespace's sysfs shows.
- docs/reason-review-pins.md: seven session-close-ingress rows re-read and moved; docs/hosted-red-acks.md: a row for run 44895098050.
'''
