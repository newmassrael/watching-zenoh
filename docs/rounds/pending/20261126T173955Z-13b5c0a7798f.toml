impact = ["feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
Land link-enum: a link that dials holds a zero-sized marker, and the dial lives
in its face table's place (one face or a row of many), so the link enum no
longer carries the largest variant inline and the large-variant allowance is
gone. It also reads a quiet face alone until its deadline. Measured -46 B on
the pico client build.
'''
changes = '''
- runtime-coop: Link::Dialing holds DialRow; a dial lives in OneFace or ManyFaces rows.
- capi-coop: a quiet face is read alone until its look's deadline (read_quiet).
- capi-coop: the test-only accessors carry the std gate their tests module has.
'''
verification = '''
