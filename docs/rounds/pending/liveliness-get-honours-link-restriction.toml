impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The liveliness token and the liveliness subscriber can state a set of links, from the registry, the Rust API and the C library. The liveliness get could not: it fanned over every connected face. The registry now has the walk as a door that takes a set, and the port's door for a get that states nothing calls it with every link, so the faces, their order and the legs are what they were. A get limited to some links is asked on the faces whose slot the set names and on no other; the tokens of the session itself answer whatever the set says, because the session is behind no link, and a multicast group is not asked, as the liveliness get has never asked one. The Rust API gets the same wz-only door as the other entities on the builder of a liveliness get, behind the same crate feature: a build whose policy is off refuses a stated set when the query is asked, in the policy's own words, and the router engine refuses one always because it reads none. The tokio arm of the session now issues the legs through the registry's door, which is the only one that takes a set; the router arm keeps the port's. A get that states nothing is asked as before.
'''

changes = '''
crates/wz-capi-core/src/faces.rs: the registry's liveliness get with a set of links, and its test. crates/wz-capi-core/src/engine_port.rs: the port's liveliness get is that door with every link. crates/wz-zenoh/src/api/builders/liveliness.rs, crates/wz-zenoh/src/api/liveliness.rs: the set on the get builder, carried through the handler conversion, and the door behind the feature. crates/wz-zenoh/src/api/session.rs: the set on the liveliness request, the policy admission in the inner query, the router's refusal, the issuing of the legs taken as an argument so each engine arm uses its own door, and the extended tests.
'''

verification = '''
Run on the build machine: the library tests of the registry crate, 186 passed (the new one among them: a get limited to one of two links is issued on one face, limited to both on two, limited to a slot no link has on none, with the session's own token answering in each, and a get that states nothing issued on both); the library tests of the public API crate with its link-restriction feature, 172 passed, the builder, the default, the policy-off refusal and the node's refusal extended with the liveliness get; clippy of the registry crate over all targets and of the public API crate over all targets and all features, warnings denied, both read from a verbose log that shows the compiler driver run on the crate itself and its test target. A first run of the registry tests failed to compile (two imports missing in the new test) and a second read the session's own token as absent, which is the default of a session whose liveliness is the pico rule; the test now builds the session with the upstream rule, as the earlier token test does.
'''

carry = '''
The C library has no door for the liveliness get with a set, and a door there moves the C ABI revision. The router, cooperative and lwIP engines still read no set, and a node session answers unavailable for a stated one. The on arm of the policy is tested on the registry; the API tests run in the default build, where the policy is off, and hold both arms by what the build says.
'''
