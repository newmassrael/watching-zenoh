impact = ["feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
Adopt the SCE pin a4df06d15ae with codec bodies decoded out of line
(InlineDecode::None). The pin progression since 65288b0696a moved the codec to
one ZInt decoder read in registers and reads a generated state, history or
event back from its number by a match. Against main the pico client build is
1,125 B smaller and the unicast receive costs 4,277 Ir per message against
4,295.
'''
changes = '''
- vendor/sce: pin a4df06d15ae; out/: state machines and the codec tree regenerated at it.
- xtask: the codec tree is generated with no hot read sites inlined.
- size-ledger: the explain names the bodies that hold each owner's bytes.
'''
