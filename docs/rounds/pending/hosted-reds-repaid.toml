impact = ["wire-spec-subset--watching-zenoh-mvp/6-zenoh-payload-layer"]

decision = '''
The hosted runs of the last three heads (rounds 4458, 4462 and 4463) were red on six lanes, and this round pays all of them. Each was attributed by its own gate's sentence and, where a commit was in question, by measuring the commits on one build machine. (1) C1, the C library's handle memory gate, and the macOS C library lane: an empty stream handle held 68,958 bytes on the hosted lane against its 65,536 bound. Bisected: the gate passes through round 4456's last commit and fails from round 4457's (the selection door that goes on from its last cursor). That round keeps one selector's folds between calls, about 10.6 KB on an empty capture, a chosen cost of a call that went from 3.1 s to 2.4 ms. Beneath it, the two row columns allocated a whole chunk for the handshake's few rows: 8 KiB of digests in the field walk and 2 KiB of words in the selection door. A chunk now holds the cells up to the last row written in it and grows by powers of two to the whole chunk, so a large capture's chunks are the size they were and an empty handle no longer pays for 8,192 rows. The empty handle reads 54,507, 54,155, 55,458 and 54,722 bytes on the build machine (udp owned and lent, tcp owned and lent); it read 65,502 for tcp owned before. The bound did not move. (2) C1bw, the accessor reach census: round 4457 also took the last shipped call of `FlowDissection::capture_order`, leaving a public accessor no shipped surface asks. The rule's text moves to `capture_order_from`, which every reader calls, and the whole-list order is built for the tests, both under `dissect`, the feature of their callers. (3) C1bzr, the docs of the reduced configurations: nine links in the capture crate named items that exist only with `network-codecs` or `reassembly` (the exchange plane, the interest plane, the fragment chain dispatch). Each now links where its target is built and names it as text elsewhere. A ledger row that counted a compile error the gate now measures 0 times is dropped, and a redundant explicit link the new doc attributes exposed is shortened. (4) C1cs, the cost of the C library builds: `capic-default` and `capic-default-lean` were 11.5 KB over. Split on the build machine: round 4462 alone, +8,556 bytes, every byte of it in the proto encoder. The frame writer of `e2e-sender` now refuses a value its field's nanopb `int_size` cannot hold, which is the point of that round. This is chosen growth, so the two budgets move to the hosted reading and 3,500 bytes. (5) C0, the gate provenance layer: the discard-site lint found 23 removals from rounds 4452, 4457 and 4463 that neither accounted for nor registered what they removed. Each was read and registered with what it removes and why nothing is lost; two entries named the spellings round 4463's packed columns replaced. Behind it in the same layer, the label census found the role label of round 4460 decided nowhere. `WhatAmI::to_str` is now held in both directions against pico's `Z_WHATAMI_*`, which needed the census to read a member numbered in hex and to compare a method that spells its words in lowercase. (6) C0mut was red because its unmutated tree was red; it follows from the five above. Round 4463 had already paid the memory matrix red of C1bnl.
'''

changes = '''
crates/wz-capture/src/digest_column.rs: `grow_to`, a chunk is a vector grown to the last row written, the report counts each chunk's capacity.
crates/wz-capture/src/word_column.rs: the same chunks, through `grow_to`.
crates/wz-capi-dissect/tests/handle_memory_gate.rs: the empty handle's bound notes what it caught and the readings after.
crates/wz-capture/src/lib.rs: `capture_order` built for the tests and `capture_order_from` with `dissect`, the rule's doc moved onto it; the filter module's doc links `exchange` only where it is built.
crates/wz-capture/src/selection_json.rs, fields_json.rs: references to the order name `capture_order_from`.
crates/wz-capture/src/agg.rs, census_json.rs, filter.rs, report.rs: the nine doc links that exist only with `network-codecs` or `reassembly`, and one redundant explicit link.
scripts/lib/reduced_docs_ledger.txt: the stale capture row dropped.
scripts/lib/capability_cost_gate.py: the two C image budgets and their split.
scripts/lib/discard_site_lint.py: 21 sites registered, two entries respelled.
scripts/lib/dissect_label_census.py: the role words held against pico, hex members, lowercase methods.
'''

verification = '''
On one build machine (pc2). Bisection of the handle memory gate: passes at round 4457's parents (the fixed key ids, the fragment placing and the chain head commits), fails from round 4457's commit. The empty handle's allocator figures by step (tcp owned, before the change): 32,795 after the replay, 49,103 after the field windows, 59,684 after the selection door, 69,213 after the census, 65,502 once the strings are given back; after the change 55,458. Capability cost split: `capic-default` 10,846,072 at round 4458's head, 10,846,076 at round 4461's, 10,854,632 at round 4462's (`nm -S` diff +7,808 in eleven proto encoder names). Capture crate library tests: default features 1,340 passed, `dissect` 1,764, `dissect,fixtures` 1,768 (the memory matrix's three included), 0 failed. Dissection C library: 233 passed, the handle memory gate 4 passed. `cargo check` of the capture crate without default features: clean. Clippy over all targets, warnings denied: capture with default features and with `dissect`, the C library: clean. Layers on pc2: C1bw pass, C0 pass, C1bz pass (every workspace crate). The capture crate's eight reduced configurations measured directly (`reduced_docs_gate.py measure --only wz-capture`): no finding (before the change, nine, in two of them).
'''

