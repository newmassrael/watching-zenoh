wz-zenoh a_put_the_node_refuses_is_the_puts_error passed; wz-capi-c --lib limits 2 passed, --test it fragmentation_roundtrip 3 passed (4 MB arrives whole, reliable SNs consecutive across the chain).
clippy -D warnings, all targets: wz-runtime-tokio (router-hat+fragmentation; runtime-zero-copy), wz-capi-c, wz-zenoh; cargo check wz-ap-demo.
