impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-1-transport", "watching-zenoh/local-ci-gates"]
decision = '''
Open-debt item 952, its lazy half: a link's heap transmit queue kept one pool of spare frame buffers for every lane, so a lazy queue's data lane was lent the buffers the handshake had built on the control lane and made none of its own when traffic wanted them, where upstream's stage of each priority refills from its own ring and makes a batch while fewer than that priority's size exist (`io/zenoh-transport/src/common/pipeline.rs` @ `None if self.batch_allocs < self.batch_config.0 => {`). Each lane now keeps its own spare buffers: a buffer goes back to the lane it was lent for (a taken frame and the writer's handle on it carry that lane; an abandoned lend names the priority it was lent for), after the session's shape a lane keeps no more than its queue's size in batches, and a lane no frame can take any more (every lane but the one of a session without QoS) keeps none, so the handshake's buffers coming back to it are freed. An `init` shape fills each reachable lane to its size up front, as before in total. A vector the queue never lent has no lane and is freed when it comes back.
'''
changes = '''
`crates/wz-runtime-tokio/src/writer_queue.rs`: `LaneState::spare` and `spare_max` per lane, `take_spare`/`give_spare` by lane, `reaches`; `reshape` bounds each reachable lane by its size and empties the others; `allocate_batches` fills each reachable lane; `Out::Heap` and `Wire::Heap` carry the lane; `OutboundTx::take_buffer` and `return_buffer` and `OutboundRx::recycle` take the priority; a new test of the lazy half and the per-lane bound, the init test taking each lane's own.
`crates/wz-runtime-tokio/src/stream_link.rs`: a heap lend records the priority it was taken for and gives the buffer back to that lane when the lend is abandoned or the byte door copies it.
`docs/zenoh-logic-as-sce-kinds/S7.md` row 107 and `files.md`: Round 4551's pico config doors placed in the logic census, whose file gate (Round 4552) had come after them.
'''
verification = '''
On `pc2`: wz-runtime-tokio `writer_queue` 67 tests, 70 with `runtime-zero-copy`, `stream_link` 11 and 16, `datagram_tx_pool_allocations` 28, clippy -D warnings of the crate by default and with all features. `guarded_count_gate.py --range` reaches 2 guards and both print what they hold (42, 13).
The C1cc leg `an_init_queue_allocates_its_batches_at_the_open_and_a_lazy_one_on_traffic_on_wz_and_libzenohc` against libzenohc, one host, read run by run: this tree passed 10 of 11 runs of the test (20 wz readings: the lazy queue made 1 or 2 batches on traffic in every one, 2 in 6; libzenohc 2 in every one), main (`034b96fc5`) 5 of 9 (18 wz readings: 0 or 1, never 2). The one failure on this tree read no batch at the open of the init document and 19 after the declaration: the link was not up when the program read it, a reading this change does not touch, and main gave none in 18; it is carried.
Locally: `cargo fmt --all --check`, reason and store reason citations, reason review pins, upstream citation anchors, count guard lint, discard site lint, the feature gate diagnostic, bounded output parity, the prose name and prose feature gates, the extension identity gate, and the logic census coverage gate with its selftest.
'''
carry = '''
Item 952 closes when the C1cc leg is green on a hosted run as well; the 51 C1cc legs that stood behind it are reached from that run on and are read there. One run in twenty of that leg on this tree read no batch at the open of an `init` document (19 after the declaration), the peer's open having returned before its link was up; main gave none in eighteen, so whether it is older than this change is not decided, and the next reading of it starts with the dial's log.
'''
