impact = ["feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
A bounded peer space's reads no longer carry the heap arms a bounded policy
can never make: the storage policy names its heap form, uninhabited for the
bounded policies, so those arms compile out. Measured about -400 B on the
pico client build. The win budget now reads each area of the pico preset
against the zenoh-pico functions that do the same work.
'''
changes = '''
- session-core: Storage::HeapForm; the Map and Ours arms of a peer space exist only under the heap policy.
- docs/win-budget/size.md: per-area table against zenoh-pico and the next designs (doors, sessions, transport).
'''
verification = '''
- size ledger check passes; area sum 660 B below main3f90 (size-5's 257 included).
- wz-session-core heap form and wireexpr_resolve tests; nondefault-features clean; citation anchors pass.
'''
carry = '''
