impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-4-session", "feature-inventory--composable-framework-atomic--preset-catalog/3-three-test-definitions/3-1-footprint"]
decision = '''
An integration toward the five win budgets of docs/win-budget (receive, send and query, heap, text, std heap), read on the window harness. The pico C ABI ships from its own C-level library crate, wz-capi-pico-lib (cdylib and staticlib), over the wz-capi-pico rlib, so fat LTO internalizes every Rust-level symbol and drops what no C caller can reach; the library crate is no_std where panics abort and links std in the unwinding dev and test profiles.

With it land: the limits table of the pico config judged in one place (perf-heap3); every endpoint dialled through one cold dial module and a host name walked once (coop-resolver); a Push's extension entries judged in one body (t-ext); a declared row and a query's key judged once for its replies (decl-row, q-serve); a host session's arena reserved as the system's fresh zero pages, so an open writes no empty row (rss-zero); and the receivers' counts taken in a window around a shared instant, with the paced loop's idle work subtracted (op-harness), which corrects the receive ratio from 1.70 to 1.20 against zenoh-pico.

A package profile records the features its library is built with, read from the same resolution the build uses, and the package check compares a library with that record.
'''
changes = '''
crates/wz-capi-pico-lib: the shipped cdylib and staticlib; crates/wz-capi-pico: an rlib, os-host names the host, the host's fresh pages under it.
crates/wz-host-sync: wait and wake out of line; a block of the system's fresh pages (mmap, VirtualAlloc).
crates/wz-capi-coop, crates/wz-runtime-coop: one cold dial module; an arena laid on zeroed pages writes no empty row; a subscriber undeclared in one hold.
crates/wz-session-core: a Push's entries and a literal key judged in one body; the reply gate handed a key judged canon once.
scripts/pico-compare.sh, scripts/host-bench: the window harness; scripts/lib/wz_package.py: a profile records its library's features.
docs/win-budget: the five budgets; docs/c-abi-architecture.md: their summary.
'''
verification = '''
On the integration tip, run on the build fleet: size_ledger_gate --check and capability_cost_gate --check pico-client-coop-nostd green (sessions 65,952, doors 43,181, driver 30,152, transport 31,748, codec 28,662, keyexpr 8,493, language 12,893); receive window harness W 4,332.3 Ir per message against zenoh-pico 4,049.1 (1.07; main 4,856); wz-capi-pico, wz-capi-coop, wz-session-core, wz-runtime-coop, wz-host-sync, wz-node-time tests and per-crate clippy green; Layers C1nh and C1st green; wz_package --selftest with kconfiglib green; upstream citation anchor, logic census and wz_config --check green.
'''
