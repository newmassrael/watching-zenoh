impact = ["wire-spec-subset--watching-zenoh-mvp/8-transport-link-matrix"]
decision = '''
The hosted run of the DNS round (run 44572424670) failed every lane that builds the capture crate's tests without `dissect`: C0mut, C1bn, the analyzer-crate lanes, C1cn shard 0 and C1cf, on `function every_word is never used` in dns.rs. The cause is the round's own and the two before it: the `every_word` fixtures of the TCP, TLS-handshake and DNS readers exist for the field document's vocabulary gate, which only a `dissect` build compiles, and the capture helpers the handshake and lookup capture tests use exist for tests that only a `dissect` build compiles, yet each was compiled in every test build. Each now carries the condition its only caller carries. Nothing a build emits moves.
'''
changes = '''
tcp_facts, tls_handshake and dns: `every_word` is compiled with `dissect` only.
fixtures: `tcp_connection_capture`, `pcap_of` and `udp_datagram` are compiled in tests with `dissect` only.
'''
verification = '''
clippy of wz-capture over every target with warnings denied, in six feature arms: no default features, the defaults, fixtures, dissect, dissect and fixtures, all features; all six pass. Before the change the fixtures arm failed on the three capture helpers and the hosted lanes on the fixtures, which is the red this round pays. fmt.
'''
carry = '''
The rounds that added these fixtures ran clippy with all features only; a test fixture used by a feature-gated caller needs the arm without that feature as well.
'''
