impact = ["wire-spec-subset--watching-zenoh-mvp/6-zenoh-payload-layer", "feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-5-link"]
decision = '''
A consumer of the dissect library asked why a TLS or QUIC flow of the session document was not read, and where a read flow's keys came from. Until now the document said only `encrypted_unreadable`, with the reason `no_matching_key` or `encrypted`. The second reason held every other case: no key material at all, a capture joined after the ClientHello, a record that did not open under the matching keys, a key log of one peer, a QUIC flow. The decryption pass already told these apart (the TLS opener's refusals, the QUIC flow's census), but only the command line printed them. The QUIC per-flow outcomes were computed and then dropped before any document was written, and nothing recorded which route a secret arrived by. Session table revision 13 gives every flow two cells. `decryption` says what the pass made of a TLS or QUIC flow, in eight words, each naming its remedy: `opened`, `no_keys`, `no_matching_key`, `keys_refused`, `key_for_one_direction`, `handshake_not_seen`, `not_supported` (a suite or version this pass has no schedule for, decided before any key) and `record_not_held`. `key_source` says, for a flow the pass opened, whether its secrets came from the capture's own Decryption Secrets Blocks, from a key log handed in, or from both. An outcome the library cannot know yet is never folded into a word. A flow whose keys were accepted and that has opened nothing, a flow a pass has not judged although keys reached one, and a live QUIC flow that has not settled are null with the new reason `not_yet_known`. Clear flows are null with `not_encrypted`, and a source is null with `not_opened` where nothing opened. To make that answerable, each secret of a key log remembers its route; the TLS opener answers an accepted flow with the route of the connection's secrets; the QUIC opener records the route of the keys it installed, the version it refused, and the packets refused under held keys apart from those refused for the capture's own shape; and the dissection records whether any key material ever reached a pass, so that a flow no pass has judged is `no_keys` only when none did. The file doors and the live handle write the cells from the same facts, so an ended handle and a door write the same bytes. The `encrypted` cell and the row's role cells keep their meaning: `decrypted_tls` still says the keys were accepted, and `decryption` says whether anything has opened yet.
'''
changes = '''
- session_table revision 13: each flow object gains `decryption` (value family `decryption`, eight words) and `key_source` (`capture`, `key_log`, `both`), and the reason family gains `not_encrypted`, `not_yet_known` and `not_opened`; the header documents every word with its remedy and the TLS and QUIC rules in order.
- wz-tls-record: a key log's secrets carry their route; `CaptureOpener::begin_flow` answers the connection's key source; the QUIC opener records the installed keys' source, a refused version and the refusals under held keys; `QuicFlowOutcome` carries them; the live decryptor sets each QUIC flow's finding and settles it at the handle's end.
- wz-capture: `KeySource`, the openable suite set, `TlsFlowState::key_source`, the per-flow `QuicKeyFinding` and the dissection's record that key material reached a pass; `RecordOpener::begin_flow` returns the key source.
- The C consumer, the document pins and the vocabulary tests move to revision 13; the ABI symbol set does not move (57).
'''
verification = '''
- On a build host: the tests of wz-tls-record, wz-capture and wz-capi-dissect, 1708 passing (the handle memory gate among them, unchanged ceilings), with new tests for each decryption word and each key source on keyed doors, on a handle before and after a key log arrives, on a capture joined mid-session, on a TLS 1.2 suite, on a half key log, and on QUIC at the door and on a handle.
- Layer C1bo: the C consumer compiled against the header, linked the release cdylib and read the tree, including the new cells of an unread TLS flow without keys and with another connection's key log; the header compiles as C++; the ABI pin holds at 57.
- The document-revision consumer pin, the reason pin and the prose-name gates pass; clippy -D warnings clean for the three crates; their docs build; the whole workspace checks with all targets.
'''
carry = '''
- Open: a live handle fixes a flow's key source when the pass takes the connection's secrets, so a label that arrives by both routes in another order than a document door reads them (capture blocks, then the key log) can read differently on the handle; the header says so.
- Open: the row's role cells of an unread QUIC flow keep the coarse reason; the flow's `decryption` holds the finer one.
- Open: the consumer's router stall (no lock-order cycle found on its path; the std locks of the router path and the waits that are not locks remain), and the owner's next steps for the node's locks.
'''
