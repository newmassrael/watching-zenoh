impact = ["feature-inventory--composable-framework-atomic--preset-catalog/8-sce-feature-gate-mechanism"]

decision = '''
The link set of entity-link-restriction is reachable from the Rust API: the builders of a publisher (and the put and delete it makes), a subscriber, a queryable, a get and a querier take .allowed_links(..), beside allowed_origin and allowed_destination. The set is stored in the builder, threaded into the engine-facing declaration of each entity and passed to the registry doors that already honour it, and a set that is stated is refused at the point the builder resolves when the build's policy is off, with the policy's own sentence. A set that is not stated takes exactly the path it took before.

The door is behind a new non-default crate feature, link-restriction, and the re-export of the types with it. This is the decision that was not obvious: the repository's public-surface gate refuses any public item the crate has and upstream does not, a wz-only door belongs in the namespace for wz extensions, and until that namespace exists the door is kept out of the default surface by a feature, so a user who wants it asks for it and nobody else sees a changed surface. The plumbing, the policy check and the tests of the default build are not behind the feature.

Two placements are worth stating. A declared publisher or querier carries its set and each put or get made through it is checked again, with the same result, so a handle cannot outlive the policy's refusal. The router engine, which holds the declarations of every face it serves and has no per-entity link of its own, refuses a set with its own sentence rather than ignoring it.
'''

changes = '''
crates/wz-zenoh: the crate manifest gets the feature link-restriction; the module that holds the locality type gets the Links value, its default and admit_links; the five builders (publisher, subscriber, queryable, get, querier) get a links field carried through with, background and Clone, and allowed_links; the publisher and querier handles keep the set; the session module threads the set into Publication, Subscription, the declarations and the query request, checks it after the closed-session test, passes it in the tokio calls and refuses it in the router arms, with nine tests; the admin module passes one argument; the crate root has the gated re-export. crates/wz-capi-core/src/engine_port.rs: SharedSession::declare_port_queryable_on_links holds the wrapping the trait impl had and takes the set; the trait method calls it with no set. docs/build-configuration.md: the sentence on reachability is brought up to date.
'''

verification = '''
On pc2, counted by the tests that ran: cargo test -p zenoh --lib ran 151 and passed (eight new: the publication asks the engine for the links it states; builders state no links until told; an entity that states none is not touched by the policy, for every entity kind; an entity limited to some links is declared only when the policy is on; a put, a delete and a get limited to some links are made only when the policy is on; a declared publisher and querier make every operation with the links they were declared with; a refused set declares nothing; the router engine refuses a set it does not read), and with --features link-restriction ran 153 and passed (two more: allowed_links states the set on each builder; a set stated with it is refused by a build without the policy). clippy with -D warnings is clean for zenoh with default features, with no default features and with link-restriction, and for wz-capi-core, each on its own, all targets. The public-surface gate (rust_api_surface.py, committed-file arm) passes with the surface unchanged. The tests branch on the build's own policy value, so they also hold in a policy-on build, which was not built.
'''

carry = '''
Open: the C ABI does not state a set; the cooperative engine and lwIP do not read it; the declaration interest of a limited publisher or querier is not link-limited on the tokio engine, so its matching status still counts every link; the upstream arm of the surface gate (Layer Z, nightly toolchain and pinned source) was not run, and the feature stays out of the default surface so that arm should not move; a policy-on build was not run through these tests. The door waits for the namespace for wz extensions to leave the feature gate.
'''
