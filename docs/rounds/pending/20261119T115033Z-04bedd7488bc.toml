impact = ["wire-spec-subset--watching-zenoh-mvp/4-transport-session-layer"]
decision = '''
A flow of a protocol version this reader does not read, a zenoh 0.x deployment of version 0x08 being the case, is recognised as zenoh of that version and said so on its own key, foreign_zenoh, beside the zenoh verdict, which is the frozen sequential test of version 0x09 and is left exactly as it reads. The Init, Join, Scout and Hello of 0x08 have 0x09's layout and differ in their extensions, so a message refused for its version is read to its end and keeps one fact: whether it took its whole framing unit alone. One such message is never enough: the flow is recognised by the first of four exchanges, latched, an InitSyn answered by an InitAck of its version, an InitSyn answered by a Close, a Hello addressed to an endpoint that scouted, or a Join or a named Scout repeated by its zid. The field document moves to revision 73 and row_facts to 13; four keys and two families arrive, nothing retires.
'''
changes = '''
The session core's foreign_version module names the version-bearing messages and the facts kept of one refused for its version; the passive walk keeps them on the refused record, and the scouting reader returns them beside its refusal.
The capture's foreign_zenoh plane holds the first sightings, bounded at eight, and latches the first exchange met; the flow ingest feeds it refused messages, Closes read whole, and scouting messages with whether their datagram answered a Scout.
The field document's flow writers write foreign_zenoh after zenoh_evidence, null or the version, the exchange and its witnesses; revision 73 and row_facts revision 13 rows and tables, the vocabulary gate's two families, the ABI header's section and tags, and the C consumer's revision pin.
'''
verification = '''
The capture crate's library tests with dissect and fixtures, 1837 passed and 6 ignored, among them a 0x08 handshake recognised as answered from either end, a refused offer recognised, a lone offer and an offer closed from its own side not recognised, a session of this version reading null in the document, the document's object for a recognised flow, and three hundred random datagrams of which none is recognised; the session core's library tests with dissect, 1668 passed; the dissection crate's tests, 259 and 4 passed; the analyzer crate's library tests, 72 passed.
Red-first: with the walk keeping no facts of a refused message, the three end-to-end tests that expect a recognition fail and the control passes.
fmt; clippy with warnings denied of wz-session-core with dissect, wz-capture and wz-analyze, one crate per run; wz-capture with no default features builds; the rustdoc lane over the four touched crates; the upstream citation anchor gate; the integer-cell gate.
'''
carry = '''
No capture of a real zenoh 0.x deployment was read; the fixtures write 0x08 messages by changing the version byte of this reader's own, which the layout comparison with the zenoh-codec crate of release 0.11.0 says is what 0.x writes, and the consumer's capture is the measurement still to come.
The scouting and Join exchanges are held by the plane's unit tests and not by a capture end to end.
'''
