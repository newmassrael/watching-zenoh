impact = ["watching-zenoh/local-ci-gates"]
decision = '''
The hosted census of Layer C1cn failed its time budget on run 44790303307 (0c7aa853b): shard 1 read 1,756 s of its 1,800 s budget (97%) and shard 0 was cancelled at 1,811 s with `wz-runtime-tokio` and the zenoh crates still to list. The census took the members whose position in the member list is congruent to the shard number, and position says nothing about cost: on run 44778189472 (589a8884c9), where both shards finished, the 44 members cost 2,389 s together and five of them 1,483 s (`wz-runtime-tokio` 569, `wz-capi-pico` 348, `wz-capi-core` 230, `wz-session-core` 174, `wz-capi-c` 162), so the shards held 1,047 s and 1,342 s, and a slower runner took both past the budget. A split by position over three shards would be worse (one shard would hold tokio, capi-pico, session-core, zenoh and capi-c). Even two balanced shards would hold about 1,195 s each, which a runner a third slower than that run's takes past the budget once each job's own setup (about 220 s) is added.

The census is now split by measured cost. `scripts/lib/census_shard_plan.py` deals the members heaviest first to the least loaded shard (longest processing time first), with ties broken by name, so every shard computes the same plan from the same tree and the plan is a partition. Each member's weight in seconds is in `scripts/lib/c1cn_census_weights.tsv`, and the job runs as three shards. The weights decide balance only, never coverage: a member with no row is planned at the median and a row for a crate that is no member is ignored, both named on stderr, and neither refuses, because neither leaves a member unexamined. A drifted table shows up as unbalanced census jobs, which the job's budget margin step already reports. The census now prints each member's own seconds, including members with no feature-only test, so the table can be refreshed from a run log.
'''
changes = '''
`scripts/lib/census_shard_plan.py` (new; `--shards N --shard K` reads `nondefault-features-gate.sh --list-members` on stdin and prints shard K's members; `--selftest` holds the partition property, order independence, the notices and the committed table's format) and `scripts/lib/c1cn_census_weights.tsv` (new; 44 rows from run 44778189472, a member that printed no line then sharing the interval it was folded into evenly, those rows marked `split`). `scripts/lib/nondefault-tests-gate.sh --census` takes its shard's members from the plan instead of `member_idx % shards`, and prints `(Ns)` after every member and a line for a member with no feature-only test. `.github/workflows/ci.yml` job `nondefault`: `shard: [0, 1, 2]`, `WZ_CENSUS_SHARDS: "3"`, the name says `/3`, and the comment states why. `scripts/run-ci.sh` Layer C0 runs `census_shard_plan.selftest`; the Layer C1cn comment no longer says shard 0 holds tokio.
'''
verification = '''
`python3 scripts/lib/census_shard_plan.py --selftest` passes. With the member list of this tree, the plan's three shards weigh 796, 797 and 796 s on the committed table. `bx --host pc2 -- env WZ_CENSUS_SHARDS=3 WZ_CENSUS_SHARD=2 bash scripts/lib/nondefault-tests-gate.sh --census` exits 0 in 981 s: it examines the 15 members the plan gives shard 2, prints each member's seconds (wz-session-core 196, zenoh 194, wz-capi-core 191), and counts 12 crates carrying 2,821 feature-only tests, all claimed. `shard_matrix_binding.py`, `c1cn_part_binding.py`, `job_budget_binding.py`, `unwired_lane_lint.py` and `round_fed_gate_reach.py` read OK, and `bash -n` passes on both edited shell scripts. Shards 0 and 1 and the hosted timing are read on this landing's hosted run.
'''
carry = '''
Read the three census shards' times on this landing's hosted run, and refresh `c1cn_census_weights.tsv` from their `(Ns)` lines if they come out unbalanced. The other reds of run 44790303307 are being repaid by watching-zenoh-1e (A4, C0 `router_interest_qos_gate`, three doc links, C1bnl, C1m, C1ak, Q session-slot-bytes) and watching-zenoh-5d (`tcp_link_mtu` doc link, `wz_reads_a_stock_zenohd_config`, Windows portability, C1cc shm threshold), as the two sessions agreed. The upstream-citation, lane-reach, sce-codegen-spawn-lint, home-path-range and armed-skip FAIL lines in the C0 job, and the root-less 171/169 lines in the E job, are selftest output (`want=fail`), not failures.
'''
