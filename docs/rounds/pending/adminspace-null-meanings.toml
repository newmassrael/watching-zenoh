impact = ["feature-inventory--composable-framework-atomic--preset-catalog/5-atomic-feature-catalog/5-23-adminspace"]

decision = '''
A consumer that reads the node record (`local_data`) sorts each key into unread, null, empty and a value, and read every `null` as one thing: the build does not say this. It asked whether a `null` means the same at every key, because a `null` the node could fill if asked again and a `null` it never fills call for different actions, and because a key added later could not be read by any rule. The surface document (`wz/surface`) already named the silences in `unspoken`, but a `null` it did not name was an answer only by inference, and which answer was in this crate's source. The surface document now writes `nulls`: every path of the record at which this build can write `null`, each with `null_is` (`silence` or `answer`) and `reason` (`feature_off` for `plugins` on a build without the plugin handlers; `config_unset` for `metadata`; `no_weighted_link` for `sessions[].weight`; `not_advertised` for the two directional weights inside it). A path the list does not name is never `null` in that build. The kind is written beside the word so that a reader meeting a word it does not know still knows which kind of `null` it is. The table is one constant per build (`admin_nullable_fields`), and a test builds the record with every optional value present and absent and requires the paths it saw `null` to be exactly the declared ones, so a key that starts to be written `null` cannot land without a meaning; another holds `unspoken` to the silences of the table. The record itself is unchanged, since it is upstream's shape. The surface revision stays 3: a reader of the shape without `nulls` reads every key it knew the same way. The consumer's premise that `metadata` is always `null` predates the round that made it the node config's value; it is now an answer.
'''

changes = '''
crates/wz-admin/src/adminspace.rs: `AdminNullMeaning` with its words and kinds, `AdminNullable`, `admin_nullable_fields` per build, and the surface document's `nulls` written from it; three tests (every possible `null` declared, `unspoken` is the silences, the words are distinct and only `feature_off` is a silence).
'''

verification = '''
On a build machine: wz-admin library tests with all features (121 passed) and the five null tests on a build with only `adminspace-core` and on one with the plugin handlers, which write `nulls` with and without `plugins` (5 and 5 passed); wz-session-mcu `admin_reply_fits` on the slot profile (4 passed: the whole admin surface, the longer surface document among it, still fits the 1024-byte reply buffer and allocates nothing); wz-runtime-tokio `adminspace` tests with `query-get,adminspace-core` (5 passed, the surface document over the real query path among them); clippy of wz-admin over all targets with all features and with `alloc,adminspace-core`, warnings denied, clean.
'''

carry = '''
None from this round.
'''
