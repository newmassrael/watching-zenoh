decision = '''
An eighth integration of the pico C ABI release toward docs/c-abi-architecture.md.

Sessions: a face's existence is one table's fact. The transport's link table is a fixed row of places, one per set the registry holds (the dial face at place 0); a face is placed at the place its set was given and taken out of it, never moved, so its place is stable for its life, and the link rooms are indexed by the same place. The frame path no longer walks faces by id (four to six walks a frame before); a departed face's tombstone keeps its place until it is let go of. This costs the sessions area 302 bytes of option checks and place conversions, and its row is set from that reading.

Driver and transport: a link lends every send as a slot it reserved at open. A link given no send storage holds the slots its session needs (one per conduit and one more), each the length of the batch its shell states, and a lent frame or window that finds no slot first sends the open lent batches of the link's other conduits and asks again, so a reliable frame is never refused after its sequence number is issued. This also repairs a refusal of a lent frame for want of a slot on a lend-only build, which spent a sequence number it never sent. A send buffer holds its own budget (hold_to), so the capped buffer and its six stack contracts are removed. The reassembly slot machine takes a fragment as fragment.more or fragment.last, a payloadless event, and out/ is regenerated.

Doors: a sample's payload view is its pico field, a lent sample is let go of without its drop, a kept one is copied whole and then its own parts, an endpoint's text is cut without a second boundary question, and the open reads its connect and listen texts by key.

Repairs: an endpoint's cut takes no sum the lints refuse, and a departed place is found before it is freed (a build with listen failed on the walk's borrow).

The size ledger reads 1.6004 times zenoh-pico in total (from 1.6174): sessions 2.8982, doors 2.2267, transport 2.8911, driver 1.5526.
'''
