\* A reliable channel over a link that loses or reorders frames (UDP, serial). TLC finds a
\* reliable BLOCK sample lost while the link held.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Pubs = {p1}
    Keys = {k1, k2}
    Subs = {k1, w}
    Wild = w
    MaxPuts = 3
    Queries = {}
    Queryables = {}
    MaxReplies = 0
    Tokens = {}
    LSubs = {}
    WaitsForCallbacks = TRUE
    OneRoute = TRUE
    StreamLink = FALSE
    TimelyLink = TRUE
INVARIANTS
    ReliableNoGap
