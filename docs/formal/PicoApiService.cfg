\* One of each: a publisher, a subscriber, a get reaching a queryable, a token and a
\* liveliness subscriber, all through one close and the same link. TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Pubs = {p1}
    Keys = {k1}
    Subs = {k1}
    Wild = w
    MaxPuts = 2
    Queries = {r1}
    Queryables = {q1}
    MaxReplies = 1
    Tokens = {t1}
    LSubs = {l1}
    WaitsForCallbacks = TRUE
    OneRoute = TRUE
    StreamLink = TRUE
    TimelyLink = TRUE
INVARIANTS
    NothingAfterGone
    InOrder
    AtMostOnce
    ReliableNoGap
    NoFalseDeath
