\* A query refused at one queryable is admitted at the next when a row came free meanwhile.
\* TLC finds a refused query whose callback ran.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Queries = {r1, r2}
    Queryables = {q1, q2}
    Rows = 1
    MaxReplies = 1
    MaxOwn = 1
    Hold = TRUE
    RefuseFull = TRUE
    Sticky = FALSE
    OweRefused = TRUE
    GiveBack = TRUE
    ReplyKeeps = TRUE
INVARIANTS
    RefusedSilent
