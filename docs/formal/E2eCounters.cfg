\* A two-bit counter made with 1 that wraps, nine messages (twice round the ring), a gap of two:
\* every frame the stream hands the receiver, refusals between them, is judged by what it is.
\* TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Max = 3
    MaxGap = 2
    Horizon = 3
    Sends = 9
    First = 1
    Wraps = TRUE
    RefusalKeeps = TRUE
    WrapToZero = TRUE
    RepeatAtZero = TRUE
    GapBound = TRUE
    NoValue = NoValue
INVARIANTS
    Exact
PROPERTIES
    Refines
