\* A reply to a kept query holds no keep of its own, and the program lets go of the query from
\* another thread while it answers. TLC finds a reply sent after the Final.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Queries = {r1, r2}
    Queryables = {q1, q2}
    Rows = 1
    MaxReplies = 1
    MaxOwn = 1
    Hold = TRUE
    RefuseFull = TRUE
    Sticky = TRUE
    OweRefused = TRUE
    GiveBack = TRUE
    ReplyKeeps = FALSE
INVARIANTS
    NothingAfterFinal
