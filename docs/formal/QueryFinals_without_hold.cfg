\* The dispatch sends the Final at once, though a callback still holds it. TLC finds a reply
\* sent after the Final.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Queries = {r1, r2}
    Queryables = {q1, q2}
    Rows = 1
    MaxReplies = 1
    MaxOwn = 1
    Hold = FALSE
    RefuseFull = TRUE
    Sticky = TRUE
    OweRefused = TRUE
    GiveBack = TRUE
    ReplyKeeps = TRUE
INVARIANTS
    NothingAfterFinal
