\* Every query that arrived ends, answered or refused, when a dispatch goes on, a callback ends
\* and a program lets go of what it keeps. One query, refused while the own get holds the one row.
\* TLC finds no violation.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Queries = {r1}
    Queryables = {q1, q2}
    Rows = 1
    MaxReplies = 1
    MaxOwn = 1
    Hold = TRUE
    RefuseFull = TRUE
    Sticky = TRUE
    OweRefused = TRUE
    GiveBack = TRUE
    ReplyKeeps = TRUE
INVARIANTS
    NothingAfterFinal
    RefusedSilent
    Bounded
PROPERTIES
    Refines
    Ends
