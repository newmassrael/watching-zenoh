\* A full table evicts a peer it holds to take a new one. TLC finds the evicted peer's
\* retransmission taken again.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT Short
CONSTANTS
    Peers = {p1, p2}
    Generations = {0, 1, 2}
    Room = 1
    Remember = TRUE
    Latest = TRUE
    NeverEvict = FALSE
    NoGen = NoGen
    RefuseFull = TRUE
INVARIANTS
    AtMostOnce
