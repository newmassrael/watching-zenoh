\* A full table takes a new peer past its room. TLC finds the table past its room; no peer is
\* told anything false.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT Short
CONSTANTS
    Peers = {p1, p2}
    Generations = {0, 1, 2}
    Room = 1
    Remember = TRUE
    Latest = TRUE
    NeverEvict = TRUE
    NoGen = NoGen
    RefuseFull = FALSE
INVARIANTS
    Bounded
