CONSTANTS
    Pubs = {p1}
    Keys = {k1, k2}
    Subs = {k1, w}
    Wild = w
    MaxPuts = 3
    Queries = {}
    Queryables = {}
    MaxReplies = 0
    Tokens = {}
    LSubs = {}
    WaitsForCallbacks = TRUE
    OneRoute = FALSE
    StreamLink = TRUE
    TimelyLink = TRUE
INVARIANTS
    InOrder
