\* A duplicate is only the generation held, not an older one. TLC finds an older reset arriving
\* late ending the session after a later one did.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT Short
CONSTANTS
    Peers = {p1, p2}
    Generations = {0, 1, 2}
    Room = 1
    Remember = TRUE
    Latest = FALSE
    NeverEvict = TRUE
    NoGen = NoGen
    RefuseFull = TRUE
INVARIANTS
    AtMostOnce
