\* The answer of two queries reaching two queryables, whole: one row, so a query is refused
\* while the other or the own get holds it. TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Queries = {r1, r2}
    Queryables = {q1, q2}
    Rows = 1
    MaxReplies = 1
    MaxOwn = 1
    Hold = TRUE
    RefuseFull = TRUE
    Sticky = TRUE
    OweRefused = TRUE
    GiveBack = TRUE
    ReplyKeeps = TRUE
INVARIANTS
    NothingAfterFinal
    RefusedSilent
    Bounded
PROPERTIES
    Refines
