\* Two peers' resets against a table of one: the second peer is refused while the first is held.
\* TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT Short
CONSTANTS
    Peers = {p1, p2}
    Generations = {0, 1, 2}
    Room = 1
    Remember = TRUE
    Latest = TRUE
    NeverEvict = TRUE
    NoGen = NoGen
    RefuseFull = TRUE
INVARIANTS
    AtMostOnce
    Bounded
PROPERTIES
    Refines
