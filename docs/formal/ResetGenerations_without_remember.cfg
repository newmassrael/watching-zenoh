\* The table keeps the first generation of a peer and never a later one. TLC finds a later
\* generation taken twice, its retransmission compared with the first.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT Short
CONSTANTS
    Peers = {p1, p2}
    Generations = {0, 1, 2}
    Room = 1
    Remember = FALSE
    Latest = TRUE
    NeverEvict = TRUE
    NoGen = NoGen
    RefuseFull = TRUE
INVARIANTS
    AtMostOnce
