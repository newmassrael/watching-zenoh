#
# xtask — the codegen SSOT (R311y22). The ONE place that turns the SCXML
# sources into the committed Rust under out/**. Run via
# `scripts/regen-codegen.sh` (or `cargo run --manifest-path xtask/Cargo.toml`);
# the CI regen-diff lane runs it + `git diff --exit-code` so the committed
# generated code is a VERIFIED CACHE of the SCXML SSOT, never a 2nd source.
#
# Standalone `[workspace]` (like the deploy/mcu-* bins) so the main
# `crates/` workspace build NEVER pulls this crate — that is the whole point:
# its `sce-build` dep links libxml2, and confining that dep here is what lets
# a plain `cargo build` of the wz stack need no libxml2/SCE toolchain.

[workspace]

[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
authors = ["newmassrael"]
description = "watching-zenoh codegen SSOT: regenerate the committed out/** Rust from the SCXML sources (R311y22)."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The in-process SCE codegen entry point — the SAME `compile_forge_with_imports`
# symbol wz-codecs/build.rs used, so the regenerated bytes are identical to the
# pre-R311y22 build-time emit. This is the crate that pulls `libxml` (libxml2);
# the standalone workspace keeps it out of every consumer build.
sce-build = { path = "../vendor/sce/sce-build" }
# R311y22b — the SAME shared codegen helper the binary-path build.rs scripts
# (wz-session-core / wz-runtime-tokio / wz-runtime-coop / wz-link-lwip) used:
# locate the vendored sce-codegen binary + the emit_statechart / emit_buffer_pool
# post-processing (strip_inner_attrs / cut_generated_tests). Reusing it here
# makes the regenerated statechart/pool bytes byte-identical to the old
# build-time emit (same binary, same strip). It is libxml-free (it only shells
# the binary + does string transforms).
wz-codegen-build = { path = "../crates/wz-codegen-build" }
# R311y22c — the switchboard 2-stage SSOT (the same crates the switchboard
# build.rs scripts used): the wz-switchboard.yaml model + the pure dispatch
# generator + the forge-AST fact parsers. serde_yaml_ng parses the sidecar at
# this I/O boundary (the schema crate pins no backend). Reproduces the
# sce-codegen --emit-ast + generate() pipeline byte-faithfully.
wz-switchboard-schema = { path = "../crates/wz-switchboard-schema" }
wz-switchboard-codegen = { path = "../crates/wz-switchboard-codegen" }
serde_yaml_ng = "0.9"
