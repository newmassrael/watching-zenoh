#
# xtask — the codegen SSOT (R311y22). The ONE place that turns the SCXML
# sources into the committed Rust under out/**. Run via
# `scripts/regen-codegen.sh` (or `cargo run --manifest-path xtask/Cargo.toml`);
# the CI regen-diff lane runs it + `git diff --exit-code` so the committed
# generated code is a VERIFIED CACHE of the SCXML SSOT, never a 2nd source.
#
# Standalone `[workspace]` (like the deploy/mcu-* bins) so the main
# `crates/` workspace build NEVER pulls this crate — that is the whole point:
# its `sce-build` dep links libxml2, and confining that dep here is what lets
# a plain `cargo build` of the wz stack need no libxml2/SCE toolchain.

[workspace]

[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
authors = ["newmassrael"]
description = "watching-zenoh codegen SSOT: regenerate the committed out/** Rust from the SCXML sources (R311y22)."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The in-process SCE codegen entry point — the SAME `compile_forge_with_imports`
# symbol wz-codecs/build.rs used, so the regenerated bytes are identical to the
# pre-R311y22 build-time emit. This is the crate that pulls `libxml` (libxml2);
# the standalone workspace keeps it out of every consumer build.
sce-build = { path = "../vendor/sce/sce-build" }
