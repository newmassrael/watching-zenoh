#
# The twin of `../probe-up`: the same source (`../body.rs`) against wz's `zenoh-macros`.
[package]
name = "probe-wz"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["unstable", "internal"]
unstable = []
internal = []

[dependencies]
zenoh = { package = "probe-stub-wz", path = "../stub-wz" }
zenoh-macros = { path = "../../../../crates/wz-zenoh-macros" }
lazy_static = "1.5.0"
ron = "0.12.0"
serde = { version = "1.0.225", default-features = false, features = ["derive"] }
