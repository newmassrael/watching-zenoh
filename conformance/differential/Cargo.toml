#
# Differential tests of the family: the same input to upstream's crate and to wz's, and the outputs
# held equal (inventory atom `api-compat-rust`, docs/build-configuration.md C13). The surface gate
# (`scripts/lib/rust_api_surface.py`) says the two crates have the same names and signatures; this
# says they do the same thing.
#
# The two crates have one package name, so each is taken under a local name: `up` is upstream's, from
# the registry at the pinned version, and `wz` is this tree's, by path. There is no `[patch]` here, on
# purpose: both must be in the graph at once, and the swap is `../patch-scenario`'s subject.
#
# NOT a member of wz's workspace, like every package that links upstream.
[workspace]

[package]
name = "wz-family-differential"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
up = { package = "zenoh-result", version = "=1.10.1" }
wz = { package = "zenoh-result", path = "../../crates/wz-zenoh-result" }
anyhow = { version = "1", default-features = false, features = ["std"] }
# `zenoh-runtime`: the same pair, and a tokio of the 1.x line both are built against, whose
# multi-threaded scheduler the tests run on (`ZRuntime::block_in_place` refuses a current-thread one).
up_runtime = { package = "zenoh-runtime", version = "=1.10.1" }
wz_runtime = { package = "zenoh-runtime", path = "../../crates/wz-zenoh-runtime" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
# `zenoh-core`: the pair again. Each crate's own `zenoh-runtime` is the same pair's (upstream's from
# the registry, wz's by path), so the two pools stay apart and neither crate is measured on the
# other's. `tracing` is what `zparse!` expands to in the caller.
up_core = { package = "zenoh-core", version = "=1.10.1" }
wz_core = { package = "zenoh-core", path = "../../crates/wz-zenoh-core" }
tracing = "0.1"
# `zenoh-keyexpr`: the pair, each built with its `unstable` feature so `relation_to` is in both. Each
# crate's `zenoh-result` is the one named `up` / `wz` above, which is what its errors are made of.
# `rand` seeds the generators.
up_keyexpr = { package = "zenoh-keyexpr", version = "=1.10.1", features = ["unstable", "internal"] }
wz_keyexpr = { package = "zenoh-keyexpr", path = "../../crates/wz-zenoh-keyexpr", features = ["unstable", "internal"] }
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng"] }
serde_json = "1"
# `zenoh-protocol`: the pair again, each over its own family crates (upstream's from the registry,
# wz's by path) and each built with `unstable` and `internal`, which carry `CongestionControl::BlockFirst`
# and the empty `Locator` and `EndPoint`, and with `test`, whose `rand()` constructors the shape test
# runs on both.
up_protocol = { package = "zenoh-protocol", version = "=1.10.1", features = ["unstable", "internal", "test"] }
wz_protocol = { package = "zenoh-protocol", path = "../../crates/wz-zenoh-protocol", features = ["unstable", "internal", "test"] }
# The timestamp of a put or a delete is `uhlc`'s, one package for both crates, so the tests name it.
uhlc = { version = "0.8.0", default-features = false, features = ["std"] }
# `zenoh-buffers`: the pair again, each over its own `zenoh-collections` (upstream's from the registry,
# wz's by path, as for every family crate), built with `std`.
up_buffers = { package = "zenoh-buffers", version = "=1.10.1" }
wz_buffers = { package = "zenoh-buffers", path = "../../crates/wz-zenoh-buffers" }
# `zenoh-codec`: the pair again, each over its own `zenoh-buffers` and `zenoh-protocol` (the ones named
# above), built with `std`.
up_codec = { package = "zenoh-codec", version = "=1.10.1" }
wz_codec = { package = "zenoh-codec", path = "../../crates/wz-zenoh-codec" }
# `zenoh-shm`: the pair again, each over its own `zenoh-core`, `zenoh-macros` and `zenoh-result`. They
# share the machine's segments, so the tests also open the one crate's segments with the other.
up_shm = { package = "zenoh-shm", version = "=1.10.1" }
wz_shm = { package = "zenoh-shm", path = "../../crates/wz-zenoh-shm" }
num-traits = { version = "0.2", default-features = false }
# `zenoh-collections`: the pair again. Both are built with the default `std`, which carries every
# container but `SingleOrVec`.
up_collections = { package = "zenoh-collections", version = "=1.10.1" }
wz_collections = { package = "zenoh-collections", path = "../../crates/wz-zenoh-collections" }
# `zenoh-macros`: a macro cannot be called with the same input to two crates, so each crate's macros
# are compiled into a probe program (`probes/`) and the programs' transcripts are compared. Each probe
# has its own stub of the `zenoh` that the expanded code names.
probe-up = { path = "probes/probe-up" }
probe-wz = { path = "probes/probe-wz" }
# The trees whose nodes are shared are read through `token-cell`'s trait, which both crates take from
# the one registry package, so the tests name it too.
token-cell = { version = "2", default-features = false }

# The exhaustive comparisons run every string of a small alphabet to a length, which is millions of
# calls of two dynamic programs; optimised, they take seconds.
[profile.test]
opt-level = 3
