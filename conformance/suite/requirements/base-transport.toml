[[requirement]]
id = "B-INIT-5"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "sender"
applies = "T-UNICAST and T-INITIATOR"
text = '''
The node that opens a link sends an InitSyn (A = 0) as its first message on it.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/init.rs` @ `The initiator MUST send an INIT message with the A flag set to 0.`',
