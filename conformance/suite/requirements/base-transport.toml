    '`commons/zenoh-protocol/src/transport/open.rs` @ `pub type MultiLinkAck = zextunit!(0x4, false);`',
    '`commons/zenoh-protocol/src/transport/open.rs` @ `pub type RemoteBound = zextz64!(0x7, false);`',
