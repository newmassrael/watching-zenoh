]

[[requirement]]
id = "B-JOIN-3"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-MCAST"
text = '''
The Join extensions: QoS id 0x1 byte sequence with M = 1, whose bytes are eight pairs of
variable-length integers, the next reliable and best-effort sequence numbers of priorities 0 to
7 in order; shared memory id 0x2 byte sequence with M = 1; patch id 0x7 64-bit integer with
M = 0.
'''
