[[requirement]]
id = "B-OPEN-5"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "receiver"
applies = "T-UNICAST and T-ACCEPTOR"
text = '''
A node that receives an OpenSyn whose cookie is not the one it sent in its InitAck does not
