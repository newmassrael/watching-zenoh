#
# The conformance requirements of the zenoh conformance test suite: the base layer, transport
# part.
# crates/wz-conformance-suite defines every field and holds the list to it.
#
# Each requirement is a statement about what an implementation sends or accepts on the wire,
# written so that a codec and a test purpose can be written from it alone, without reading any
# implementation. Its sources are the pinned upstream's protocol definition and codec, cited by
# anchor (the path holds at the pin and the needle occurs in it, graded by the upstream citation
# gate). A requirement whose only source is an implementation's behaviour, or whose sources
# disagree, carries an `issue`; a test of it is inconclusive until the issue is settled.

format = "wz-conformance-requirements"
format_version = 1
layer = "base"
part = "transport"
base = "zenoh 1.10.2"

# ---------------------------------------------------------------------------------------------
# Common encodings

[[requirement]]
id = "B-ENC-1"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
A variable-length integer (written %name% in the message layouts) is little-endian base 128:
each byte carries seven bits of the value, the least significant group first, and bit 7 is set
on every byte but the last. A 64-bit value takes at most nine bytes; when a ninth byte is
present, all eight of its bits are value bits and none is a continuation bit.
'''
sources = [
    '`commons/zenoh-codec/src/core/zint.rs` @ `const VLE_LEN_MAX: usize = vle_len(u64::MAX);`',
    '`commons/zenoh-codec/src/core/zint.rs` @ `while (b & 0x80_u8) != 0 && i != 7 * (VLE_LEN_MAX - 1) {`',
]

[[requirement]]
id = "B-ENC-2"
strength = "SHOULD"
kind = "dynamic"
aspect = "encoding"
binds = "sender"
text = '''
A sender writes a variable-length integer in the fewest bytes that hold its value.
'''
sources = [
    '`commons/zenoh-codec/src/core/zint.rs` @ `while (x & !0x7f_u64) != 0 {`',
]
issue = '''
The base codec writes only the shortest form and reads a longer one (a byte 0x80 followed by
0x00 reads as zero). Whether a longer form is conformant is not stated anywhere in the base.
'''

[[requirement]]
id = "B-ENC-3"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
A byte sequence written <u8;zN> is a variable-length integer length followed by that many
bytes, and the length fits in N bits. A receiver refuses the message that holds a length that
does not fit.
'''
sources = [
    '`commons/zenoh-codec/src/core/zint.rs` @ `if (x & !(<$bound>::MAX as u64)) != 0 {`',
    '`commons/zenoh-codec/src/core/zslice.rs` @ `let zslice = reader.read_zslice(len)?;`',
]

[[requirement]]
id = "B-ENC-4"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
A zenoh id is a non-zero unsigned 128-bit integer. It is written as its significant bytes in
little-endian order, from one to sixteen bytes. Where a message carries its length in a 4-bit
field, the field holds the length minus one.
'''
sources = [
    '`commons/zenoh-protocol/src/core/mod.rs` @ `pub const MAX_SIZE: usize = 16;`',
    '`commons/zenoh-codec/src/core/zenohid.rs` @ `writer.write_exact(&x.to_le_bytes()[..x.size()])`',
    '`commons/zenoh-protocol/src/transport/init.rs` @ `real_zid_len := 1 + zid_len`',
]

[[requirement]]
id = "B-ENC-5"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
The role field of an Init or a Join is two bits: 0b00 router, 0b01 peer, 0b10 client. 0b11 is
reserved, and a receiver refuses the message that holds it.
'''
sources = [
    '`commons/zenoh-codec/src/transport/init.rs` @ `WhatAmI::Client => 0b10,`',
    '`commons/zenoh-codec/src/transport/init.rs` @ `0b10 => WhatAmI::Client,`',
]

[[requirement]]
id = "B-ENC-6"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
A transport message starts with one header byte: its low five bits are the message id and its
high three bits are the message's flags. On every transport message bit 7 is the flag Z: when it
is set, an extension chain follows the message's fixed fields.
'''
sources = [
    '`commons/zenoh-protocol/src/common/mod.rs` @ `pub const HEADER_BITS: u8 = 5;`',
    '`commons/zenoh-protocol/src/transport/init.rs` @ `pub const Z: u8 = 1 << 7;`',
]

[[requirement]]
id = "B-ENC-7"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
The transport message ids are: OAM 0x00, Init 0x01, Open 0x02, Close 0x03, KeepAlive 0x04,
Frame 0x05, Fragment 0x06, Join 0x07. No network message id is one of them.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/mod.rs` @ `pub const KEEP_ALIVE: u8 = 0x04;`',
    '`commons/zenoh-protocol/src/transport/mod.rs` @ `crucial that these IDs do NOT collide with the IDs`',
]

# ---------------------------------------------------------------------------------------------
# Extension chain

[[requirement]]
id = "B-EXT-1"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
An extension starts with one header byte: bit 7 is Z (another extension follows this one), bits
6 and 5 are the body's encoding (0b00 unit, 0b01 64-bit integer, 0b10 byte sequence, 0b11
reserved), bit 4 is M (the extension is mandatory) and bits 3 to 0 are the extension id.
'''
sources = [
    '`commons/zenoh-protocol/src/common/extension.rs` @ `pub const FLAG_M: u8 = 1 << 4;`',
    '`commons/zenoh-protocol/src/common/extension.rs` @ `pub const ENC_ZBUF: u8 = 0b10 << 5;`',
]

[[requirement]]
id = "B-EXT-2"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
A unit extension has no body. A 64-bit integer extension's body is one variable-length integer.
A byte-sequence extension's body is a variable-length integer length that fits in 32 bits
followed by that many bytes.
'''
sources = [
    '`commons/zenoh-codec/src/common/extension.rs` @ `let bodec = Zenoh080Bounded::<u32>::new();`',
    '`commons/zenoh-protocol/src/common/extension.rs` @ `If ENC == Z64 || ENC == ZBuf (z32)`',
]

[[requirement]]
id = "B-EXT-3"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "receiver"
text = '''
An extension is known by its header without the Z bit: the id, the M bit and the encoding
together. A receiver that does not know an extension whose M bit is 0 reads its body by its
encoding, discards it, and goes on with the rest of the message.
'''
sources = [
    '`commons/zenoh-protocol/src/common/extension.rs` @ `pub const fn eid(header: u8) -> u8 {`',
    '`commons/zenoh-codec/src/common/extension.rs` @ `tracing::debug!("Unknown {_s} ext: {u:?}");`',
]

[[requirement]]
id = "B-EXT-4"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "receiver"
text = '''
A receiver that does not know an extension whose M bit is 1 refuses the message that carries
it.
'''
sources = [
    '`commons/zenoh-codec/src/common/extension.rs` @ `if u.is_mandatory() {`',
]

[[requirement]]
id = "B-EXT-5"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "receiver"
text = '''
A receiver refuses a message that carries an extension of the reserved encoding 0b11, known or
not: its body cannot be delimited.
'''
sources = [
    '`commons/zenoh-protocol/src/common/extension.rs` @ `/// - 0b11: Reserved`',
    '`commons/zenoh-codec/src/common/extension.rs` @ `let body = match self.header & iext::ENC_MASK {`',
]

# ---------------------------------------------------------------------------------------------
# Batches

[[requirement]]
id = "B-BATCH-1"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-STREAM-LINK"
text = '''
On a link that does not keep message boundaries (a byte stream), every batch is preceded by its
length in two bytes, little-endian. A batch is at most 65535 bytes.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/mod.rs` @ `pub type BatchSize = u16;`',
    '`commons/zenoh-protocol/src/transport/mod.rs` @ `The length is encoded as little-endian.`',
]

[[requirement]]
id = "B-BATCH-2"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-DGRAM-LINK"
text = '''
On a link that keeps message boundaries (a datagram link), a batch is one datagram, with no
length before it.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/mod.rs` @ `This is necessary in those stream-oriented transports (e.g., TCP) that do not preserve`',
    '`io/zenoh-transport/src/common/batch.rs` @ `2 bytes are reserved to encode the total amount of serialized bytes as 16-bits little endian.`',
]
issue = '''
The definition says the two length bytes may be prepended and are needed on stream links; it
does not say that a datagram carries none. The pinned implementation writes them only on stream
links.
'''

[[requirement]]
id = "B-BATCH-3"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
A batch holds one or more transport messages back to back. A Frame's network messages run from
the end of its header to the end of the batch, or to the first byte that does not begin a
network message, where the next transport message begins.
'''
sources = [
    '`commons/zenoh-codec/src/transport/frame.rs` @ `reader.rewind(mark);`',
    '`commons/zenoh-protocol/src/transport/mod.rs` @ `crucial that these IDs do NOT collide with the IDs`',
]

[[requirement]]
id = "B-BATCH-4"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-COMPRESSION"
text = '''
On a session that agreed on compression, every batch begins with one header byte whose bit 0 is
set when the rest of the batch is compressed.
'''
sources = [
    '`io/zenoh-transport/src/common/batch.rs` @ `const COMPRESSION: u8 = 1; // 1 << 0`',
]
issue = '''
Only the pinned implementation defines the batch header and the compressed form; the protocol
definition has no text for either, so the compression algorithm is not part of the base yet.
'''

[[requirement]]
id = "B-BATCH-5"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "sender"
text = '''
A sender sends no batch larger than the batch size its peer stated: in the peer's Init, or in
the peer's Join on a multicast group. A peer that stated none stated the default of its
transport (B-INIT-2, B-JOIN-2).
'''
sources = [
    '`commons/zenoh-protocol/src/transport/init.rs` @ `It indicates the maximum size of a batch the sender of the INIT message is willing`',
    '`commons/zenoh-protocol/src/transport/join.rs` @ `It indicates the maximum size of a batch the sender of the JOIN message is willing`',
]

# ---------------------------------------------------------------------------------------------
# Init (unicast)

[[requirement]]
id = "B-INIT-1"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-UNICAST"
text = '''
Init: header flags A (bit 5, set on InitAck), S (bit 6, size parameters follow) and Z. Then the
version byte; one byte holding the zenoh id length minus one in bits 7 to 4 and the role in bits
1 and 0 (bits 3 and 2 reserved); the zenoh id. When S is set: one byte of resolutions (bits 1
and 0 the frame sequence number resolution, bits 3 and 2 the request id resolution, bits 7 to 4
reserved) and the batch size as two bytes, little-endian. On InitAck only, the cookie as
<u8;z16>. Then the extensions when Z is set.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/init.rs` @ `pub const S: u8 = 1 << 6;`',
    '`commons/zenoh-codec/src/transport/init.rs` @ `self.write(&mut *writer, batch_size.to_le_bytes())?;`',
    '`commons/zenoh-codec/src/transport/init.rs` @ `let cookie: ZSlice = zodec.read(&mut *reader)?;`',
]

[[requirement]]
id = "B-INIT-2"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-UNICAST"
text = '''
A resolution is two bits: 0b00 8 bits, 0b01 16 bits, 0b10 32 bits, 0b11 64 bits. An Init
without S states the defaults: 32-bit frame sequence numbers, 32-bit request ids and a batch
size of 65535 bytes.
'''
sources = [
    '`commons/zenoh-protocol/src/core/resolution.rs` @ `let frame_sn = Bits::from(TransportSn::MAX) as u8;`',
    '`commons/zenoh-protocol/src/transport/mod.rs` @ `pub const UNICAST: BatchSize = BatchSize::MAX;`',
    '`commons/zenoh-codec/src/transport/init.rs` @ `let mut batch_size = batch_size::UNICAST.to_le_bytes();`',
]

[[requirement]]
id = "B-INIT-3"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "sender"
text = '''
The version byte of an Init or a Join is 0x09.
'''
sources = [
    '`commons/zenoh-protocol/src/lib.rs` @ `pub const VERSION: u8 = 0x09;`',
]

[[requirement]]
id = "B-INIT-4"
strength = "MUST"
