[[requirement]]
id = "B-INIT-6"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "sender"
applies = "T-UNICAST and T-ACCEPTOR"
text = '''
A node that accepts an InitSyn answers with an InitAck (A = 1). It may answer with a Close
instead.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/init.rs` @ `peer MUST reply with an INIT message with the A flag set to 1. Alternatively, it MAY reply with`',
