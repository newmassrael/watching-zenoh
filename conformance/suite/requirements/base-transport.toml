[[requirement]]
id = "B-OPEN-4"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "sender"
applies = "T-UNICAST and T-INITIATOR"
text = '''
The cookie of an OpenSyn is the cookie of the InitAck it follows, byte for byte.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/open.rs` @ `The cookie MUST be the same received in the`',
