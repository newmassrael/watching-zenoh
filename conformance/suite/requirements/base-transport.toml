[[requirement]]
id = "B-JOIN-5"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "receiver"
applies = "T-MCAST"
text = '''
A member of a group ignores a Join whose version, resolutions or batch size differ from its own:
it does not take the sender as a member.
'''
sources = [
    '`io/zenoh-transport/src/multicast/rx.rs` @ `if join.resolution != self.manager.config.resolution {`',
    '`io/zenoh-transport/src/multicast/rx.rs` @ `if join.batch_size != batch_size {`',
]
issue = '''
The definition states no rule for a Join of other parameters; the rule here is the pinned
implementation's, and the implementations measured against it apply the same one.
'''
