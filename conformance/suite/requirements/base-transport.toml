# Open (unicast)

[[requirement]]
id = "B-OPEN-1"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-UNICAST"
text = '''
Open: header flags A (bit 5, set on OpenAck), T (bit 6, the lease is in seconds) and Z. Then the
lease as a variable-length integer, in seconds when T is set and in milliseconds otherwise; the
initial sequence number as a variable-length integer; on OpenSyn only, the cookie as a byte
sequence; then the extensions when Z is set.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/open.rs` @ `pub const T: u8 = 1 << 6;`',
    '`commons/zenoh-codec/src/transport/open.rs` @ `Duration::from_secs(lease)`',
    '`commons/zenoh-codec/src/transport/open.rs` @ `let cookie: ZSlice = self.codec.read(&mut *reader)?;`',
]

[[requirement]]
id = "B-OPEN-2"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-UNICAST"
text = '''
The cookie of an OpenSyn is no longer than 65535 bytes (<u8;z16>).
'''
sources = [
    '`commons/zenoh-protocol/src/transport/open.rs` @ `~    <u8;z16>   ~ if Flag(A)==0 (**) -- Cookie`',
]
issue = '''
The definition bounds the OpenSyn cookie to a 16-bit length; the base codec reads the OpenSyn
cookie with a length of any width. The two sources disagree on whether a longer cookie is
refused.
'''

[[requirement]]
