[[requirement]]
id = "B-INIT-7"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "receiver"
applies = "T-UNICAST and T-ACCEPTOR"
text = '''
A node that receives an InitSyn of another version than its own does not answer it with an
InitAck; it closes the link with a Close of reason invalid (0x02).
'''
sources = [
    '`io/zenoh-transport/src/unicast/establishment/accept.rs` @ `if init_syn.version != input.mine_version {`',
]
issue = '''
The definition carries the version and states no rule for a version other than the receiver's;
the rule here is the pinned implementation's.
'''

[[requirement]]
id = "B-INIT-8"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "both"
applies = "T-UNICAST"
text = '''
For each of the two resolutions, the InitAck states no more than the InitSyn did, and the
session runs at the value the InitAck states. The node that opened the link refuses an InitAck
that states more, with a Close of reason invalid (0x02).
'''
sources = [
    '`io/zenoh-transport/src/unicast/establishment/accept.rs` @ `res.set(Field::FrameSN, i_fsn_res.min(m_fsn_res));`',
    '`io/zenoh-transport/src/unicast/establishment/open.rs` @ `if i_fsn_res > m_fsn_res {`',
]
issue = '''
The definition says only that an InitAck without S accepts the InitSyn's parameters; the
smaller-of-the-two rule and the refusal are the pinned implementation's.
'''

