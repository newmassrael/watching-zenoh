[[requirement]]
id = "B-SN-1"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "sender"
text = '''
A channel is one reliability and one priority. On each channel the sequence number of a Frame or
a Fragment is one more than that of the one before it on the same channel, modulo two to the
power of the agreed resolution.
'''
sources = [
    '`io/zenoh-transport/src/common/seq_num.rs` @ `/// Sequence Number Generator`',
]
issue = '''
The definition gives the field and its resolution, not the increment; the rule here is the
pinned implementation's sequence number generator.
'''

[[requirement]]
id = "B-SN-2"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "receiver"
text = '''
A receiver discards a Frame whose sequence number does not come after the last one it accepted
on the same channel, where b comes after a when (b - a) modulo the resolution is not zero and is
less than half the resolution.
'''
sources = [
    '`io/zenoh-transport/src/common/seq_num.rs` @ `let gap = value.wrapping_sub(self.value) & self.mask;`',
    '`io/zenoh-transport/src/unicast/universal/rx.rs` @ `let precedes = guard.sn.roll(sn)?;`',
]
issue = '''
The definition states no receiver rule for sequence numbers; the half-window rule is the pinned
implementation's.
'''

[[requirement]]
id = "B-FRAG-1"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
Fragment: header flags R (bit 5, the reliable channel), M (bit 6, more fragments follow) and Z.
Then the sequence number as a variable-length integer, the extensions when Z is set, and the
fragment's bytes, which run to the end of the batch.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/fragment.rs` @ `pub const M: u8 = 1 << 6;`',
    '`commons/zenoh-codec/src/transport/fragment.rs` @ `let payload = reader.read_zslice(reader.remaining())?;`',
]

[[requirement]]
id = "B-FRAG-2"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
text = '''
The Fragment extensions: QoS id 0x1 64-bit integer with M = 1 (B-FRAME-2), first id 0x2 unit
with M = 0, drop id 0x3 unit with M = 0.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/fragment.rs` @ `pub type First = zextunit!(0x2, false);`',
    '`commons/zenoh-protocol/src/transport/fragment.rs` @ `pub type Drop = zextunit!(0x3, false);`',
]

[[requirement]]
id = "B-FRAG-3"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "both"
applies = "T-PATCH"
text = '''
The first and drop markers of a Fragment are used only on a session whose two sides both stated
a patch of 1 or more in their Init or Join.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/init.rs` @ `/// if >= 1, then fragmentation first/drop markers`',
]

[[requirement]]
id = "B-FRAG-4"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "receiver"
text = '''
A message sent in fragments is the bytes of consecutive Fragments of one channel, in sequence
number order, up to and including the first whose M is clear, and is read as one network
message.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/fragment.rs` @ `/// - M: More           If M==1 then other fragments will follow`',
]

# ---------------------------------------------------------------------------------------------
# Join (multicast)

[[requirement]]
id = "B-JOIN-1"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-MCAST"
text = '''
Join: header flags T (bit 5, the lease is in seconds), S (bit 6, size parameters follow) and Z.
Then the version byte; the byte of the zenoh id length and the role, as in Init; the zenoh id;
when S is set, the byte of resolutions and the batch size, as in Init; the lease as a
variable-length integer; the next sequence numbers as two variable-length integers, the reliable
channel's then the best-effort channel's; then the extensions when Z is set.
'''
sources = [
    '`commons/zenoh-protocol/src/transport/join.rs` @ `pub const T: u8 = 1 << 5;`',
    '`commons/zenoh-codec/src/transport/join.rs` @ `let next_sn: PrioritySn = self.codec.read(&mut *reader)?;`',
    '`commons/zenoh-codec/src/transport/join.rs` @ `let best_effort: TransportSn = self.read(&mut *reader)?;`',
]

[[requirement]]
id = "B-JOIN-2"
strength = "MUST"
kind = "dynamic"
aspect = "encoding"
binds = "both"
applies = "T-MCAST"
text = '''
A Join without S states the defaults: 32-bit frame sequence numbers, 32-bit request ids and a
