    '`commons/zenoh-protocol/src/transport/join.rs` @ `pub type QoS = zextzbuf!(0x1, true);`',
    '`commons/zenoh-protocol/src/transport/join.rs` @ `pub type QoSType = Box<[PrioritySn; Priority::NUM]>;`',
    '`commons/zenoh-protocol/src/transport/join.rs` @ `pub type Patch = zextz64!(0x7, false); // use the same id as Init`',
]

[[requirement]]
id = "B-JOIN-4"
strength = "MUST"
kind = "dynamic"
aspect = "procedure"
binds = "sender"
applies = "T-MCAST"
text = '''
The next sequence numbers a Join states fit the frame sequence number resolution it states.
'''
