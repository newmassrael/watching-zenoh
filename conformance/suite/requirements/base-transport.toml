The Open extensions, every one with M = 0: QoS id 0x1 unit, shared memory id 0x2 byte sequence,
authentication id 0x3 byte sequence, multilink id 0x4 (a byte sequence on OpenSyn, a unit on
OpenAck), low latency id 0x5 unit, compression id 0x6 unit, remote bound id 0x7 64-bit integer.
'''
