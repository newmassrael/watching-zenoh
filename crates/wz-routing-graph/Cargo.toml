#
# wz-routing-graph — the linkstate-peer routing topology graph (P4 routing,
# the wz mirror of zenoh `net/protocol/network.rs`). Pure host logic (no
# async, no tokio): the in-memory `Node`/`Link`/edge graph + the
# Bellman-Ford spanning-tree computation a peer uses for loop-free
# forwarding. Kept in its own crate (NOT wz-runtime-tokio) so the
# runtime-agnostic topology kernel mirrors the data-plane kernel split —
# `RouteTable` lives in wz-session-core, its `RoutingForwarder` driver in
# wz-runtime-tokio. This kernel cannot live in the `#![no_std]`
# wz-session-core because `petgraph` is std-only; a std-allowed dedicated
# crate satisfies both constraints. The tokio driver (`linkstate_forward`,
# the `FaceForwarder`) stays in wz-runtime-tokio and depends on this.

[package]
name = "wz-routing-graph"
version.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Linkstate-peer routing topology graph + spanning-tree computation (zenoh net/protocol/network.rs mirror)."

[lib]
name = "wz_routing_graph"
path = "src/lib.rs"

[dependencies]
# The undirected, stable-index topology graph + Bellman-Ford / reachability
# algorithms. Pinned to 0.6 to match zenoh's own petgraph 0.6.5.
petgraph = "0.6"
# The `LinkstateListOwned` the graph ingests (c2b) AND builds for TX (c3b).
# `default-features = false` + the explicit `codec-linkstate` / `alloc`
# forwards keep the codec surface this crate pulls minimal and
# footprint-honest.
wz-codecs = { path = "../wz-codecs", default-features = false, features = [
    "alloc",
    "codec-linkstate",
] }
# Supplies `SceBytes` — the codec byte type the built LinkState's `zid`
# field is (c3b `build_linkstate_list`). The same crate wz-codecs's
# generated owned types are built from. `alloc` for the Vec-backed bytes.
sce-forge-runtime = { path = "../../vendor/sce/backends/rust/forge-runtime", default-features = false, features = [
    "alloc",
] }
# Drop observability (E2): the `log` facade so an unresolvable psid / link /
# zid that gets silently dropped during ingest is surfaced to an operator's
# logger (zenoh `tracing::error!`s the same sites). A no-op without a backend;
# this crate is AP-only (routing-peer), so the facade never reaches the MCU.
log = "0.4"

[lints]
workspace = true
