#
# The cargo configuration of the pico C ABI's host library without `std` (`wz-capi-pico-lib`
# over `wz-capi-pico`'s `os-host`, profile `capi-nostd`), named on the command line and used
# with the host's own target, from `crates/`:
#
#   cargo build -p wz-capi-pico-lib --no-default-features --features abi/os-host,abi/link-udp \
#       --profile capi-nostd --config .cargo/capi-nostd.toml --target x86_64-unknown-linux-gnu
#   cargo build -p wz-capi-pico-lib --no-default-features --features abi/os-host,abi/link-udp \
#       --profile capi-nostd --config .cargo/capi-nostd.toml --target x86_64-pc-windows-msvc
#
# A library that never unwinds needs no unwind tables, and a cargo profile cannot carry a code
# generation flag on a stable toolchain, so the flag is here. With `--target` it reaches the
# library's crates and not the build scripts and procedural macros, which run on the host with
# `std` and unwind; without `--target` cargo hands it to them as well, and the compiler refuses
# `panic=unwind` without unwind tables, so the mistake is loud. A `RUSTFLAGS` in the environment
# replaces this table, as it replaces every configured one.
#
# On Linux the prebuilt `core` and `alloc` keep their tables, which this flag does not reach; the
# configuration named after this one, `.cargo/capi-discard-unwind-tables.toml`, discards them at
# the link (docs/c-abi-size-diet.md T7).
#
# The flag is given to POSIX hosts only: a Windows build keeps its tables, which the system's own
# exception handling reads. `panic = "abort"` is the profile's.
[target.'cfg(unix)']
rustflags = ["-C", "force-unwind-tables=no"]

# An x86 or x64 library, on any host, aligns no innermost loop: LLVM puts the head of each at a
# 16-byte boundary and fills the gap before it with no-ops, which the library carries and runs only
# when a loop is entered by falling into it, so its instructions per message can only fall. The x64
# release DLL of 2026-11-27 held 18,867 bytes of no-ops of two bytes or more
# (docs/c-abi-migration/arch-win-ext.md, step W1). Innermost loops alone, as the x86 back end takes
# that alignment as an option of its own; the table names the architectures whose back end reads it.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))']
rustflags = ["-C", "llvm-args=-x86-experimental-pref-innermost-loop-alignment=0"]

# A Windows build is linked by the toolchain's own linker (`rust-lld` as `lld-link`, which the
# compiler finds in its own sysroot), with no library of Visual Studio or the Windows SDK: the
# library defines the C runtime the compiler's code calls (`wz-msvc-runtime`), imports the C
# runtime's heap and every system call by DLL name, and its build script writes the import
# libraries of the system libraries its graph names and keeps every other default library off the
# link (`wz-capi-pico-lib/build.rs`, `/NODEFAULTLIB`). So the DLL builds where no Visual Studio is
# installed and imports no C runtime DLL of Visual Studio's. The linker is a configuration key, which
# a `RUSTFLAGS` in the environment does not replace; the flavor beside it is the one the
# compiler reads from that name. A crate with `std` built with this configuration (the split
# form's additional library) still links the C runtime, which this linker finds where Visual
# Studio is installed.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=lld-link"]

[target.i686-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=lld-link"]
