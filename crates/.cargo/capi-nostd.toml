#
# The cargo configuration of the pico C ABI's host library without `std` (`wz-capi-pico-lib`
# over `wz-capi-pico`'s `os-host`, profile `capi-nostd`), named on the command line and used
# with the host's own target, from `crates/`:
#
#   cargo build -p wz-capi-pico-lib --no-default-features --features abi/os-host,abi/link-udp \
#       --profile capi-nostd --config .cargo/capi-nostd.toml --target x86_64-unknown-linux-gnu
#   cargo build -p wz-capi-pico-lib --no-default-features --features abi/os-host,abi/link-udp \
#       --profile capi-nostd --config .cargo/capi-nostd.toml --target x86_64-pc-windows-msvc
#
# A library that never unwinds needs no unwind tables, and a cargo profile cannot carry a code
# generation flag on a stable toolchain, so the flag is here. With `--target` it reaches the
# library's crates and not the build scripts and procedural macros, which run on the host with
# `std` and unwind; without `--target` cargo hands it to them as well, and the compiler refuses
# `panic=unwind` without unwind tables, so the mistake is loud. A `RUSTFLAGS` in the environment
# replaces this table, as it replaces every configured one.
#
# On Linux the prebuilt `core` and `alloc` keep their tables, which this flag does not reach; the
# configuration named after this one, `.cargo/capi-discard-unwind-tables.toml`, discards them at
# the link (docs/c-abi-size-diet.md T7).
#
# A `match` of fewer than eight arms is lowered to compares and not to a jump table
# (`-min-jump-table-entries=8`; LLVM's own floor is four). A table of four entries is 16 bytes of
# `.rodata` and its dispatch about as much text as the compares that take its place, and this
# library's `.rodata` is resident whole in every process that maps it, so its 140 tables of fewer
# than eight entries (2,608 bytes of 4,840) are a page a process holds (docs/win-budget/rss.md,
# section 5.3, R2.1). The library is linked with fat LTO, which compiles the prebuilt `core` and
# `alloc` again in its own session, so the flag reaches their matches too. What it moves is read
# where every build of this form reads this file: the size ledger's text and `.rodata` and the
# capability cost gate's ceiling (`scripts/lib/capability_cost_gate.py`, `case_config_flags`),
# the perf matrix's arm W (`scripts/host-bench/perf_matrix.py`, `bench_case`), whose instruction
# counts and per-mapping figures (`PERF_SMAPS=1`, docs/win-budget/rss.md section 6, R0) are the
# cells that judge it, and the packages, which name this file with `--config`.
#
# The flags are given to POSIX hosts only: a Windows build keeps its unwind tables, which the
# system's own exception handling reads, and its jump tables until a Windows cell reads them; it
# needs no other flag: `panic = "abort"` is the profile's, and the
# library names the C runtime it links itself (`src/os/no_std_host.rs` of `wz-capi-pico`).
[target.'cfg(unix)']
rustflags = ["-C", "force-unwind-tables=no", "-C", "llvm-args=-min-jump-table-entries=8"]
