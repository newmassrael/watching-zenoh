#
# R311y586 (A7) — the C ABI over the DISSECTION surface.
#
# Separate from `wz-capi-c` on purpose. That crate's whole contract is
# "a zenoh-c drop-in": its symbol names, types and semantics are dictated by
# an upstream header, and every symbol in it is answerable to that header.
# The dissection surface is wz's own and answers to nobody, so putting it
# there would mean a consumer could no longer tell which half of the library
# it was linking against, and a zenoh-c ABI census would start reporting
# symbols zenoh-c never had.
[package]
name = "wz-capi-dissect"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
publish = false

[lints]
workspace = true

[lib]
name = "wz_capi_dissect"
crate-type = ["cdylib", "rlib"]

[dependencies]
# R311y855 — `dissect` selected HERE, because this crate is the second
# consumption root for the field walker (`wz-analyze` is the first). The feature
# is default-off on `wz-capture` so an MCU build is not charged for it; naming
# it on this line is what makes `wz_capture::fields_json` exist for the ABI
# without either consumer owning a second copy of the emit.
wz-capture = { path = "../wz-capture", features = ["dissect"] }
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "alloc",
    "dissect",
    "codec-frame",
    "codec-init-body",
    "codec-open-body",
    "codec-close",
    "codec-keep-alive",
    # R311y869 — `declare_build`, which the census fixture uses to put a real
    # `DeclareSubscriber` on the wire for the INTEREST plane to read. Named
    # explicitly rather than left to unification, on the rule `wz-capture`'s
    # manifest states at length: a subset build that happened not to unify
    # `codec-declare` on would otherwise fail for a reason that looks like the
    # test's.
    "codec-declare",
] }

# R311y851 — the CENSUS fixture's records, built by the codecs that own their
# wire form rather than hand-laid.
#
# A dev-dependency and never a real one: this library's contract is a decode
# out of a capture, and nothing in its shipped path constructs a zenoh message.
# The fixture, though, has to CARRY one — a census over a capture of KeepAlives
# answers zero on every plane, HONESTLY, and a boundary test pinned to those
# zeros would pass just as well against four planes that were never handed a
# frame. That is this workspace's measured confident-zero shape.
#
# The feature set is the one `wz-capture` already names for its own dependency
# on this crate, so it widens nothing: features unify across the graph
# (R311y614), and asking for a set that is already on cannot turn a subset build
# into a different build.
[dev-dependencies.wz-codecs]
path = "../wz-codecs"
default-features = false
features = [
    "alloc",
    "codec-push",
    "codec-request",
    "codec-response",
    "codec-response-final",
]

# R311y886 (open-debt item 357) — the RFC 1071 arithmetic this crate's hand-laid
# packet fixtures need. Measured before it was added: every packet `tcp_packet`
# built carried a ZERO in both checksum fields, which over IPv4 is
# present-and-wrong rather than absent, so a 1 025-packet capture reported
# `ip_checksum_invalid: 1025` and `transport_checksum_invalid: 1025` and the
# whole corpus sat in the corruption bucket. Only the arithmetic is shared; the
# layouts stay hand-laid, for the reason their own doc gives.
[dev-dependencies.wz-packet-fixtures]
path = "../wz-packet-fixtures"
