#
# wz-integration-tests — Layer 3 wire-interop test harness.
#
# Phase 2 walking-skeleton deliverable (R42+). Each `tests/layer3_*.rs`
# file pairs a wz-emitted encoder (`wz_codecs::<codec>::<Struct>::
# encode`) with the corresponding zenoh-pico C encoder (`_z_*_encode`
# via `zenoh_pico_sys`), constructs an equivalent logical message on
# both sides, encodes via both paths, and BYTE-COMPARES the output.
#
# This is the only layer in the verification stack that produces an
# OBJECTIVE evidence that the watching-zenoh codec SCXML spec
# correctly models the zenoh-pico 1.9.0 wire format. Layer 1 (cargo
# emit success) and Layer 2 (sce-codegen-vs-sce-codegen body-golden)
# are both internal-consistency gates that cannot catch a
# spec-vs-reality mismatch.
#
# Crate type: integration-tests-only (no library). Beyond the
# `tests/layer3_*.rs` byte-compare lane, this crate also hosts the
# binary-dep e2e family (ap_demo_round_trip, wz_*_to_z*, the wz_e2e_*
# subset binaries) and an in-library-node socket e2e
# (wz_reassembles_pico_fragment_tx — R311nk/nl frag interop), all
# `#[ignore]`d and collected by Layer E via `--ignored`.

[package]
name = "wz-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Layer 3 wire-interop tests: wz codec encoders vs zenoh-pico C encoders, byte-compare."
publish = false

# No library; the crate is purely a host for `tests/*.rs` integration
# tests. Cargo's default `src/lib.rs` discovery is disabled by setting
# an explicit (and absent) lib path.
[lib]
path = "src/lib.rs"

# R311y490 — the LIB target's only dependency, and it exists for one call:
# `flock` in `common::CrossProcessPortLock`, which widens the port reservation
# from process-global (a `static` mutex, which cargo's 17 concurrent test
# BINARIES each get their own of) to cross-process. `flock` over a lock file with
# a sentinel because the kernel releases it on fd close INCLUDING `SIGKILL`, so a
# killed test can never strand it. Test-only crate (`publish = false`, no reverse
# dependency in the workspace), so this reaches no footprint, MCU or `no_std`
# lane; `libc` was already in `crates/Cargo.lock` via wz-runtime-tokio.
[dependencies]
libc = "0.2"

[dev-dependencies]
# R311y498 — the §5.27 api-compat-c layout gate dlopens wz's OWN cdylib to read
# its `wz_capi_c_layout` export, rather than re-transcribing the numbers into a
# test. wz-capi-c is deliberately NOT a normal dependency here: its `#[no_mangle]`
# `z_*` exports would collide with the real zenoh-pico symbols this crate links
# for the layer3 codec-parity tests.
libloading = "0.8"
# R311nx — `codec-serial` pinned so tests/layer3_serial_framing.rs can
# build the wz serial framing primitives (`wz_codecs::{cobs_encode,
# cobs_decode, crc32, serial_envelope}`) for the byte-parity compare
# against the real pico C serial codec. Same dev-dep feature-pin model
# as the wz-runtime-tokio frag/multicast pins below; resolver=2 keeps it
# from unifying into wz-codecs's OWN default build under Layer C1.
wz-codecs = { path = "../wz-codecs", features = ["codec-serial"] }
# R311y487 - the close-frame teardown measurement drives the exported C ABI as
# one of its three clients, so the measurement lives in ONE file beside the
# pico + demo legs it is compared against (rlib crate-type makes this linkable).
wz-capi-pico = { path = "../wz-capi-pico" }
# W3 no-alloc bounded mirror migration — tests build owned-mirror
# heapless fields via the `codec_bound::bounded_{bytes,string}` helpers
# (the same idiom production code uses at decode boundaries).
# R311nx — `transport-link-serial` pinned so layer3_serial_framing.rs can
# reach `wz_session_core::serial_link::{encode_frame, decode_frame,
# SerialFrameReader}` (the wz serial framing logic under test).
wz-session-core = { path = "../wz-session-core", features = [
    "transport-link-serial",
    # R311y248 — the layer3 query VALUE byte-parity test
    # (layer3_request.rs::layer3_request_query_value_byte_equivalent) builds a
    # wz Query carrying the value ext via the production
    # `RequestQueryBuilder::query_value` (codec-request) and byte-compares it
    # against a pico `_z_request_encode` with `_ext_value.payload` set, so the
    # dev-dep build needs the querier-side value encode path. `query-value`
    # gates the ext helper + builder setter; `codec-request` gates the builder
    # itself. Not an inventory atom flip here (the atom is added in R311y248's
    # inventory entry); this only composes the send-side stamp for the test.
    "codec-request",
    "query-value",
    # R311y245 — reply-source-info gates the queryable REPLY-side emission
    # of the inner Put-body source_info ext (id 0x01 ENC_ZBUF). The
    # wz_reply_source_info_to_pico_zget e2e drives an in-process wz
    # queryable that replies WITH source_info (via ReplyOut
    # reply_keyed_sourced) for a pico z_get to decode, so it needs the
    # send-side stamp compiled in. Not an inventory atom (A3-neutral);
    # only forwarded elsewhere by ext-pubsub-advanced-recovery.
    "reply-source-info", "keyexpr-includes",
    # R311y371 — the QoS-mode JOIN codec-parity test
    # (layer3_join_qos.rs::layer3_join_qos_sn_ext_byte_equals_pico) builds a wz
    # multicast qos JOIN via the production `multicast_join::encode_join` with a
    # per-priority `MulticastTxConduits` and byte-compares it against pico's
    # `_z_join_encode` with `_is_qos = true`. `transport-qos` gates the
    # per-priority SN conduits + the `write_join_qos_ext` QoS-SN wire + the
    # `{0,0}` decoy base in encode_join; `session-multicast` + `codec-join` gate
    # the `multicast_join` module itself. This pin puts `transport-qos` in the
    # in-process test binary's feature closure (audit A4-5 containment) and is
    # what compiles the qos ext path in reach at all (it is opt-in, in no preset).
    "transport-qos", "session-multicast", "codec-join"] }
# R311y501 — the §5.26 REST bridge, driven IN-PROCESS by the wz<->zenohd REST
# interop leg (tests/wz_rest_zenohd_interop.rs). The leg runs wz's bridge and
# the real `libzenoh_plugin_rest.so` against ONE zenohd and differentials their
# renderings, so it must link the bridge rather than shell to a binary — there
# is no wz REST binary to shell to.
#
# Reached through the UMBRELLA crate (`wz::rest`), NOT as a direct `wz-rest`
# path dep, and the difference is load-bearing rather than stylistic:
# `rest-http-bridge`'s ONLY cfg site is the re-export gate at `wz/src/lib.rs:90`
# — the atom's A3 composition toggle — so a direct dep compiles the bridge
# while leaving that feature name out of this package's closure entirely. The
# A4-5 containment invariant then (correctly) refuses the `rest-http-bridge`
# claim as "not compiled into the binary under test". Depending on `wz` with the
# feature ON is what makes the leg actually traverse the atom's own gate.
# `rest-sse-subscribe` is the second atom under test and pulls `rest-http-bridge`
# transitively; both are named so neither can be dropped silently.
#
# CLOSURE IMPACT, MEASURED (`scripts/lib/feature_closure.py wz-integration-tests`,
# with and without this line): distinct wz features 92 -> 95, and the three added
# are exactly `rest-http-bridge`, `rest-sse-subscribe`, `runtime-tokio`. NOTHING
# is removed and nothing else is added — the umbrella enables no default of its
# own here, and every wz-runtime-tokio feature wz-rest pins was already pinned
# below. So the `cargo test --workspace` unification this table warns about
# elsewhere is bounded to those three names, all of which are the subject of the
# leg rather than incidental.
wz = { path = "../wz", features = ["rest-http-bridge", "rest-sse-subscribe"] }
zenoh-pico-sys = { path = "../zenoh-pico-sys" }
sce-forge-runtime = { path = "../../vendor/sce/sce-forge-runtime/rust" }
# R116b — `hal_timer_routing.rs` declares an in-test TimerProbePolicy
# that uses sce_rust_runtime::{Engine, Hal, StatePolicy} directly to
# exercise the Hal-routed scheduler clock post-SCE fa3a2fda. The
# production wz crates reach SCE only via sce_forge_runtime + the
# generated Policy code; this dep is test-surface only.
sce-rust-runtime = { path = "../../vendor/sce/sce-rust-runtime" }
# R68a — Layer 3 inbound parser test reaches into wz-runtime-tokio's
# session_glue (`parse_inbound`, `InboundFrame`, `SessionLinkActions::
# handle_inbound`) to verify the reverse direction: zenoh-pico encode
# → wz parse → SessionInitParams.cookie populate.
# R311nk/nl — `transport-fragmentation` pinned so the frag-interop e2e
# (tests/wz_reassembles_pico_fragment_tx.rs) compiles the AP reassembly
# RX path. R311nm — `transport-multicast` pinned so the multicast JOIN
# interop e2e (tests/wz_publisher_to_pico_multicast_zsub.rs) compiles the
# in-library multicast publisher (`drive_multicast_session` +
# `multicast_put_literal`). R311y415 — honesty fix, the same one R311wq
# already applied to the `storage-aligner` pin below. The earlier claim
# here — that resolver=2 keeps these two pins from unifying into
# wz-runtime-tokio's OWN lib/test build under Layer C1 (`cargo test
# --workspace`), "verified: no frag- or multicast-gated test runs in the
# C1 region" — was WRONG, and R311y414 spent a review BLOCKER on it.
# Under `--workspace` a dev-dep feature DOES unify onto the shared build.
# Measured for THESE TWO PINS specifically — `cargo test -p
# wz-runtime-tokio --features transport-fragmentation,transport-multicast
# --lib -- --list` is 331 against 306 for the bare `-p` form, so the pins
# add 25 lib tests (18 of them `multicast_glue`, countable with
# `--list | grep -c '^multicast_glue'`). The frag-gated integration
# targets go from 0-test targets under the isolated `-p` build to
# udp_frag_e2e 1 / udp_chaos_e2e 3 / layer3_reassembly_tx 1 /
# layer3_reassembly_rx 4 under C1 (reassembly_rx rides along because
# `transport-fragmentation = [.., "reassembly"]`).
# Do NOT cite C1's own 413-test lib binary as this pin's evidence: 82 of
# the 413-vs-306 delta come from the OTHER pins in this same dep table
# (storage-aligner, access-extauth-usrpwd and friends), so 413 measures
# the table, not these two entries.
# The coverage is ADDITIVE in the strict sense — the 306 isolated test
# names are a subset of C1's 413, verified by diffing `--list` output, so
# nothing goes dark — but C1 is not a feature-OFF composition proof FOR
# wz-runtime-tokio OR wz-session-core (the two crates this table pins;
# other members do run at their own defaults), and the SUBJECT-scoped
# proof still belongs to the C1l (frag) / Layer M (multicast) lanes.
# These counts are a snapshot: the R311wq note below still records 279
# for the same isolated measurement that now reads 306. Re-run the
# commands rather than trusting either number.
# R311ny — the R311nx `transport-link-serial` pin here is GONE. It was a
# workaround for a now-eliminated skew: `AnyLocator::Serial` used to be
# gated on wz-session-core's feature while wz-runtime-tokio's dial match
# arm was gated on its OWN, so enabling only session-core's (the pin above)
# made the match non-exhaustive. R311ny relocated the serial locator leaf
# to the ungated `wz_session_core::locator`, so the variant is ALWAYS
# present and the runtime's `dial_locator` handles it (dial-or-typed-error)
# regardless of its serial backend — no coupling pin needed here anymore.
wz-runtime-tokio = { path = "../wz-runtime-tokio", features = [
    "transport-fragmentation",
    "transport-multicast",
    # The serial pin is BACK, for a different reason than R311nx's. That one
    # was a cross-crate gate-skew workaround and is correctly gone. This one
    # is a BACKEND requirement: tests/pico_serial_link_to_wz_acceptor.rs
    # drives a real zenoh-pico client over a serial link, so it needs
    # `wz_runtime_tokio::serial_pipeline::{accept_serial,
    # drive_serial_handshake}` — the tty open and the link handshake — which
    # exist only under this feature. Same unification caveat as the
    # `storage-aligner` pin below: under `--workspace` this DOES reach the
    # shared wz-runtime-tokio build (additive coverage), while the isolated
    # `cargo test -p wz-runtime-tokio` build stays at its defaults.
    "transport-link-serial",
    # R311wo (A10) — the storage replication interop e2e
    # (tests/wz_zenohd_storage_replication.rs) drives an IN-PROCESS wz storage
    # replica (StorageState + spawn_digest_aligner) against a foreign zenohd
    # storage-manager, so this dev-dep build of wz-runtime-tokio needs its
    # storage driver surface. R311wq — honesty fix: the ISOLATED
    # `cargo test -p wz-runtime-tokio` build stays at its default feature set
    # (279 lib tests, verified). The earlier claim here — that resolver=2 keeps
    # this feature off the `cargo test --workspace` build of wz-runtime-tokio —
    # was WRONG: under `--workspace` a dev-dep feature DOES unify onto the
    # shared wz-runtime-tokio build, so its storage lib tests additionally run
    # there. That is purely additive coverage (the default isolated build is
    # untouched), but the unification claim is not made anymore.
    "storage-aligner",
    # R3b — the wz<->zenohd usrpwd interop e2e
    # (tests/usrpwd_zenohd_interop.rs) dials a usrpwd-guarded zenohd IN-PROCESS
    # with connect_and_open_session_with_auth + a UsrPwdMethod::initiator
    # dispatch, so this dev-dep build needs the auth method + the auth-on open
    # seam. Like the storage-aligner pin above, this unifies onto the shared
    # wz-runtime-tokio build under `cargo test --workspace` (additive coverage:
    # the auth lib tests also run there); the isolated `cargo test -p
    # wz-runtime-tokio` build stays at its default (auth-off) feature set.
    "access-extauth-usrpwd",
    # R4c — the wz<->zenohd PUBKEY interop e2e (tests/pubkey_zenohd_interop.rs)
    # dials a pubkey-guarded zenohd IN-PROCESS with a PubKeyMethod::initiator
    # dispatch, so this dev-dep build needs the pubkey method (rsa) + the auth-on
    # open seam. Same additive-unification note as access-extauth-usrpwd above.
    "access-extauth-pubkey",
    # R311wt (pico cross-impl leg) — the storage wildcard-update LIVE-path
    # interop e2e (tests/wz_storage_wildcard_update_pico_interop.rs) drives a
    # foreign zenoh-pico `z_put -k demo/**` wildcard PUT into an IN-PROCESS wz
    # StorageService and inspects its wildcard registry + materialized override.
    # It needs the write-path override engine (apply_sample_wildcard_aware +
    # wildcard_puts/deletes) AND the `wildcard_registry_lens` read seam, the
    # latter gated on `storage-mgr-garbage-collection` (storage_state.rs:896) —
    # which transitively enables `storage-mgr-wildcard-updates` +
    # `storage-backend`, and exposes `StorageService::shared_state` for the
    # concrete-key pre-seed. Adding `storage-mgr-wildcard-updates` alone is
    # insufficient (the lens would not exist). Same additive-unification note as
    # the storage-aligner pin above: under `cargo test --workspace` this feature
    # unifies onto the shared wz-runtime-tokio build, so its GC/wildcard lib
    # tests additionally run there (purely additive; the concrete-key paths the
    # existing storage tests exercise stay equivalent).
    "storage-mgr-garbage-collection",
    # R311y352 (pico cross-impl leg) — the static-scout open interop e2e
    # (tests/wz_static_scout_open_to_pico_zsub.rs) calls `open_session_static`
    # IN-PROCESS against a foreign zenoh-pico `z_sub -m peer -l` listener, and
    # that entrypoint is gated on `scouting-static` (session_open.rs:2246). The
    # SIBLING `open_session_at` is UNGATED — "active scouting feeds it too" — so
    # a test dialing one locator would bind to the wrong atom; only the
    # dead-first LIST fallthrough is scouting-static's own observable.
    # MEASURED, not inherited from the sibling pins above: `scouting-static` is
    # NOT in wz-runtime-tokio's default set, and `cargo test -p wz-runtime-tokio
    # --test static_scout_open -- --list` collects only the 3 ungated
    # `open_session_at_*` tests — so this pin is what puts `open_session_static`
    # in reach at all, and the isolated build is unchanged by it.
    # The `--workspace` additive-unification note the pins above carry is NOT
    # repeated here, because it could not be checked: `cargo test --workspace`
    # does not build in this workspace at all (sce-rust-runtime raises its
    # `no_std` + `http-send` mutually-exclusive compile_error). Copying an
    # unverifiable claim forward is how R311wq's wrong resolver=2 note survived.
    "scouting-static",
    # R311y358 (pico cross-impl leg) — the storage strip-prefix capture interop
    # e2e (tests/wz_storage_strip_prefix_pico_interop.rs) drives a foreign
    # zenoh-pico `z_put home/kitchen/temp` into an IN-PROCESS wz StorageService
    # configured with strip_prefix = Some("home/kitchen"), and asserts the sample
    # stores under the STRIPPED key `temp` (not verbatim). The strip is applied in
    # `declare_with_backend` -> `StorageState::with_strip_prefix` ONLY under this
    # cfg gate (storage_service.rs:178); it is NOT in wz-runtime-tokio's default
    # set, so this pin is what compiles the strip path in reach at all. Existing
    # storage tests use strip_prefix = None (a passthrough), so enabling it does
    # not change their behavior; under `cargo test --workspace` it is additive
    # coverage (the strip lib tests also run there), the same note the pins above
    # carry.
    "storage-mgr-strip-prefix",
    # R311y361 (pico cross-impl leg) — the storage filesystem-backend serve
    # interop e2e (tests/wz_storage_filesystem_serves_pico_zget.rs) declares an
    # in-process wz StorageService over a FilesystemVolume rooted at a tempdir
    # (volume_id `fs`), seeds a value (write-through to disk), and a foreign
    # zenoh-pico z_get reads it back. FilesystemVolume/FilesystemStorage live in
    # the `filesystem_storage` module, which is `#[cfg(feature =
    # "storage-backend-filesystem")]` (lib.rs) and OPT-IN (never in default), so
    # this pin is what compiles it in reach. Same additive-unification note as
    # the storage-mgr-* pins above; the fs backend adds no third-party dep.
    "storage-backend-filesystem",
    # R311y362 (pico cross-impl leg) — the multi-storage-host serve interop e2e
    # (tests/wz_storage_multi_host_serves_pico_zget.rs) hosts TWO named storages
    # (a/** and b/**) on one session via RuntimeStorageManager::add_storage, and a
    # foreign zenoh-pico z_get -k '**' gets a value back from BOTH. RuntimeStorage-
    # Manager lives in the `storage_manager_service` module, gated
    # `storage-mgr-multi-storage-host` (lib.rs:1128), opt-in. Same additive-
    # unification note as the storage-* pins above.
    "storage-mgr-multi-storage-host",
    # R311y475 (pico cross-impl leg) — the storage HISTORY serve interop e2e
    # (tests/wz_storage_history_serves_pico_zget.rs) seeds THREE timestamped
    # versions of ONE key into a `History::All` backend and a foreign zenoh-pico
    # `z_get` must receive ALL THREE; its twin leg seeds the identical three into
    # the `History::Latest` `MemoryStorage` and the SAME pico binary must receive
    # exactly ONE. `HistoryStorage` lives in the `storage_history` module, gated
    # `storage-history` (wz-session-core lib.rs:999) and OPT-IN — never in any
    # default set — so without this pin the module is absent and the proof does
    # not compile. The wz-runtime-tokio feature forwards
    # `wz-session-core/storage-history`, so this one pin reaches both crates. Same
    # additive-unification note as the storage-* pins above; it adds no
    # third-party dep (a `BTreeMap<key, Vec<StoredData>>`).
    "storage-history",
    # R311y370 (pico cross-impl leg) — the storage complete-flag wz->pico
    # witness (tests/wz_storage_complete_flag_pico_codec.rs) drives an
    # IN-PROCESS wz StorageService with StorageConfig.complete = true / false
    # and decodes the emitted DeclareQueryable with pico's real C
    # `_z_declaration_decode`, asserting the config-driven complete bit
    # reached the wire. The `storage_queryable_complete` gate honors
    # `config.complete` ONLY under this cfg (storage_service.rs:108-116; with
    # it OFF the queryable is always complete = the pre-y59 behavior), so this
    # pin is what makes the config->wire distinction observable at all — and
    # it is what puts `storage-mgr-complete-flag` in this in-process test
    # binary's feature closure (audit A4-5 containment). Enabling the gate DOES
    # change the wire bit for default-config storages — from always-complete
    # (gate off) to config-driven (StorageConfig defaults complete = false) —
    # but the existing storage serve / replication interop tests still pass
    # (RE-RUN this round): a lone incomplete queryable still receives queries
    # (BestMatching falls back to all-matching, and the aligner queries with
    # target All), so their serve / converge assertions are unaffected. Same
    # additive-unification note as the storage-* pins above.
    "storage-mgr-complete-flag",
] }
# R71 — `fixture_session_init_params` / `install_session_actions_for_test`
# / `dispatch_script` live in this sibling crate. Replaces the
# `_test_support` Cargo feature used through R70.
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support", features = [
    "tls-fixtures",
] }
# tempfile is used by R63 link_emitter_b6 to stage sce-codegen emit
# output in a clean directory per test run (no pollution of $OUT_DIR
# or vendor/sce/target).
tempfile = "3"
# R311y352 — the static-scout interop e2e needs a loopback address that is
# DETERMINISTICALLY connection-refused, to stand as the dead first entry of the
# static list. `std::net::TcpListener::bind` always calls `listen()`, so a bound
# std listener would ACCEPT and then hang the open loop; the bind-then-drop
# pattern instead leaks the port back to the OS, which under a full CI run can
# recycle it to an unrelated live listener (a TOCTOU race that made the wz-only
# sibling flaky before R311if replaced it with this). socket2 binds WITHOUT
# listening, so a connect gets RST -> ECONNREFUSED for as long as the guard
# lives. Same version as wz-runtime-tokio's own dev-dep, where the identical
# `refused_locator` helper lives (static_scout_open.rs).
socket2 = "0.6"
# R297b — property-based fuzz layer on top of R297's handcrafted
# Layer 3 keyexpr-intersect fixture. The generator constructs
# canonical zenoh keyexprs over a bounded alphabet [a,b,c] with
# 1..=4 chunks, each chunk one of literal / `*` / `**` / `$*`-DSL
# (1..=2 `$*` runs); the property asserts wz/zenoh-pico byte-equal
# on forward + reverse + symmetry for every shrunken case.
proptest = "1"
# R311nk — the wz<-pico fragmentation interop e2e is a `#[tokio::test]`:
# it binds an in-test TcpListener acceptor and drives the wz session loop
# async while an external zenoh-pico z_put client fragments a Put.
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time"] }
# The pico SERIAL interop e2e builds its own wire: two `openpty` pairs whose
# masters are pumped into each other, so each stack gets a real device PATH
# to open (the point of a locator-grammar witness). `default-features =
# false` matches the wz-runtime-tokio pin — the only default is serialport's
# libudev port-enumeration backend, which nothing here calls.
tokio-serial = { version = "5.4", default-features = false }

[lints]
workspace = true
