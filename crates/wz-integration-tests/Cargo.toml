#
# wz-integration-tests — Layer 3 wire-interop test harness.
#
# Phase 2 walking-skeleton deliverable (R42+). Each `tests/layer3_*.rs`
# file pairs a wz-emitted encoder (`wz_codecs::<codec>::<Struct>::
# encode`) with the corresponding zenoh-pico C encoder (`_z_*_encode`
# via `zenoh_pico_sys`), constructs an equivalent logical message on
# both sides, encodes via both paths, and BYTE-COMPARES the output.
#
# This is the only layer in the verification stack that produces an
# OBJECTIVE evidence that the watching-zenoh codec SCXML spec
# correctly models the zenoh-pico 1.9.0 wire format. Layer 1 (cargo
# emit success) and Layer 2 (sce-codegen-vs-sce-codegen body-golden)
# are both internal-consistency gates that cannot catch a
# spec-vs-reality mismatch.
#
# Crate type: integration-tests-only (no library). Beyond the
# `tests/layer3_*.rs` byte-compare lane, this crate also hosts the
# binary-dep e2e family (ap_demo_round_trip, wz_*_to_z*, the wz_e2e_*
# subset binaries) and an in-library-node socket e2e
# (wz_reassembles_pico_fragment_tx — R311nk/nl frag interop), all
# `#[ignore]`d and collected by Layer E via `--ignored`.

[package]
name = "wz-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Layer 3 wire-interop tests: wz codec encoders vs zenoh-pico C encoders, byte-compare."
publish = false

# No library; the crate is purely a host for `tests/*.rs` integration
# tests. Cargo's default `src/lib.rs` discovery is disabled by setting
# an explicit (and absent) lib path.
[lib]
path = "src/lib.rs"

[dev-dependencies]
wz-codecs = { path = "../wz-codecs" }
# W3 no-alloc bounded mirror migration — tests build owned-mirror
# heapless fields via the `codec_bound::bounded_{bytes,string}` helpers
# (the same idiom production code uses at decode boundaries).
wz-session-core = { path = "../wz-session-core" }
zenoh-pico-sys = { path = "../zenoh-pico-sys" }
sce-forge-runtime = { path = "../../vendor/sce/sce-forge-runtime/rust" }
# R116b — `hal_timer_routing.rs` declares an in-test TimerProbePolicy
# that uses sce_rust_runtime::{Engine, Hal, StatePolicy} directly to
# exercise the Hal-routed scheduler clock post-SCE fa3a2fda. The
# production wz crates reach SCE only via sce_forge_runtime + the
# generated Policy code; this dep is test-surface only.
sce-rust-runtime = { path = "../../vendor/sce/sce-rust-runtime" }
# R68a — Layer 3 inbound parser test reaches into wz-runtime-tokio's
# session_glue (`parse_inbound`, `InboundFrame`, `SessionLinkActions::
# handle_inbound`) to verify the reverse direction: zenoh-pico encode
# → wz parse → SessionInitParams.cookie populate.
# R311nk/nl — `transport-fragmentation` pinned so the frag-interop e2e
# (tests/wz_reassembles_pico_fragment_tx.rs) compiles the AP reassembly
# RX path. R311nm — `transport-multicast` pinned so the multicast JOIN
# interop e2e (tests/wz_publisher_to_pico_multicast_zsub.rs) compiles the
# in-library multicast publisher (`drive_multicast_session` +
# `multicast_put_literal`). resolver=2 keeps these dev-dep features from
# unifying into wz-runtime-tokio's OWN lib/test build under Layer C1
# (`cargo test --workspace`) — verified: no frag- or multicast-gated test
# runs in the C1 region — so the feature-OFF default composition stays
# owned by C1 and the feature-ON wz-runtime-tokio build stays owned by the
# C1l (frag) / Layer M (multicast) lanes.
wz-runtime-tokio = { path = "../wz-runtime-tokio", features = [
    "transport-fragmentation",
    "transport-multicast",
] }
# R71 — `fixture_session_init_params` / `install_session_actions_for_test`
# / `dispatch_script` live in this sibling crate. Replaces the
# `_test_support` Cargo feature used through R70.
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support" }
# tempfile is used by R63 link_emitter_b6 to stage sce-codegen emit
# output in a clean directory per test run (no pollution of $OUT_DIR
# or vendor/sce/target).
tempfile = "3"
# R297b — property-based fuzz layer on top of R297's handcrafted
# Layer 3 keyexpr-intersect fixture. The generator constructs
# canonical zenoh keyexprs over a bounded alphabet [a,b,c] with
# 1..=4 chunks, each chunk one of literal / `*` / `**` / `$*`-DSL
# (1..=2 `$*` runs); the property asserts wz/zenoh-pico byte-equal
# on forward + reverse + symmetry for every shrunken case.
proptest = "1"
# R311nk — the wz<-pico fragmentation interop e2e is a `#[tokio::test]`:
# it binds an in-test TcpListener acceptor and drives the wz session loop
# async while an external zenoh-pico z_put client fragments a Put.
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
