#
# wz-ap-demo — AP (Application Processor; Linux + tokio runtime) MVP
# demo binary. The first non-library deploy artifact in the workspace
# (wz-codecs / wz-runtime-tokio / wz-runtime-tokio-test-support /
# wz-integration-tests / zenoh-pico-sys are all libraries).
#
# Phase D.1 entry (R121+ rollout). Drives wz-runtime-tokio +
# wz-codecs end-to-end via an external zenoh-pico CLI peer (z_put,
# z_get) so each round-trip round verifies the wz codec catalog +
# session FSM + DECLARE registry against a production-realistic
# foreign implementation — not against another wz process.
#
# Naming rationale:
#   - "ap" = deploy class (matches deploy/ap_*.yaml; mcu-demo + other
#     deploy-class siblings follow the same crate naming convention).
#   - "demo" = MVP-stage marker. When the production AP deploy
#     artifact (driven by deploy/ap_standalone.yaml) lands as a
#     promotion path, the crate moves to crates/wz-deploy-ap/ (or
#     similar) and this demo binary either co-exists for regression
#     coverage or retires.
#
# Round rollout:
#   - R121a (this round): crate skeleton — CLI argv shape locked,
#     no runtime behavior (deps = none). Establishes the binary
#     entry point without faking session/codec functionality.
#   - R121b: session FSM start + DECLARE subscriber + msg_put
#     inbound dispatch wiring (real wz-runtime-tokio + wz-codecs
#     dependencies added here).
#   - R121c: integration test harness driving external zenoh-pico
#     z_put against this binary + CI Layer E lane.

[package]
name = "wz-ap-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "AP MVP demo binary — exercises wz-runtime-tokio + wz-codecs against an external zenoh-pico CLI peer for round-trip wire interop."

[[bin]]
name = "wz-ap-demo"
path = "src/main.rs"

# R311a4 — wz-ap-demo collapses 6 direct sub-crate deps to a single
# `wz` facade dep with `preset-ap-client` features. This makes the
# facade the first user-visible composable-framework boundary backed
# by a real Linux + tokio binary: when `cargo build -p wz-ap-demo`
# succeeds, the wz facade's preset-ap-client contract is mechanically
# proven to cover every symbol path this binary requires.
#
# `preset-ap-client` (defined in wz facade Cargo.toml line 581+) pulls
# in: platform-linux + runtime-tokio + transport-link-{tcp,udp} +
# unicast session machinery + 12 codec features (init-body, open-body,
# frame, fragment, keep-alive, scout, hello, close, push, declare,
# request, response, response-final) + 7 declare features +
# 6 query features + liveliness-{token,subscriber} + 8 keyexpr + ...
#
# The `runtime-tokio` umbrella feature in turn pulls 4 facade-level
# optional deps (wz-runtime-tokio + wz-runtime-core + sce-rust-runtime
# + sce-rust-lua) so wz-ap-demo's source code reaches every needed
# symbol via stable `wz::runtime_tokio::*`, `wz::runtime_core::*`, and
# `wz::script::*` paths — no direct wz-runtime-tokio / wz-codecs /
# vendor/sce dep mentions remain in this manifest.
#
# `tokio` + `log` + `env_logger` stay as direct deps because the demo
# binary's main entry (#[tokio::main]) and stderr logger pipeline are
# binary-shaped concerns, not part of the wz framework re-export
# surface. The wz facade does not re-export tokio's runtime macros or
# env_logger by design.
[dependencies]
# `default-features = false` here gives the R311a4 binary-size delta
# measurement script (scripts/measure-codec-footprint.sh) a clean
# `--no-default-features --features wz/foo,wz/bar,...` invocation that
# can elide any individual atomic feature without the wz facade's
# preset-ap-client default forcibly turning it back on. Production
# `cargo run -p wz-ap-demo` still gets the full preset because this
# crate's own `default = ["preset-ap-client"]` below re-enables it.
wz = { path = "../wz", default-features = false }
# gc-3 carry #2 — the LIVE application machine (sensor_monitor statechart +
# temp/reset switchboard + generated value injector). Optional + pulled only by
# the `switchboard` feature so the footprint measurement
# (`--no-default-features --features wz/<subset>`) elides it together with the
# wz facade's switchboard feature — keeping wz-session-core's `switchboard`
# (and its sce deps) out of a switchboard-less measurement build.
wz-ap-demo-app = { path = "../wz-ap-demo-app", optional = true }
# Tokio multi-thread runtime — required by TokioLinkDriverAdapter's
# block_on contract per session_glue.rs:445; the #[tokio::main] entry
# attribute and `tokio::signal::ctrl_c` are binary-shaped uses outside
# the wz framework boundary so this dep stays explicit.
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "signal"] }
# Logging plumbing — env_logger reads RUST_LOG / WZ_DEMO_LOG to
# surface session FSM transitions + subscriber dispatch events.
log = "0.4"
env_logger = "0.11"

# R311a4 — production default forwards wz facade's preset-ap-client
# contract (Linux + tokio + 12 codec features + 7 declare + 6 query +
# liveliness + 8 keyexpr + ...). Measurement runs use
# `--no-default-features --features wz/<explicit-atomic-list>` so each
# preset-ap-client atomic feature can be individually elided to verify
# the catalog truthfulness claim — `scripts/measure-codec-footprint.sh`
# auto-derives the atomic list from `crates/wz/Cargo.toml`'s preset
# definition so the measurement bench stays in sync with future preset
# evolution without duplication in this manifest.
#
# R311g — the consumer-side `codec-close` feature mirror retired with
# the signature-stability retrofit of `send_close_with_reason` in
# wz-runtime-tokio. teardown.rs now calls `send_close_with_reason`
# unconditionally; the wz-runtime-tokio body-cfg silently no-ops when
# the wz facade is built without `codec-close`. This collapses
# ap-demo's feature surface to a single `preset-ap-client` forward and
# removes the measurement-script special case (codec-close minus build
# no longer needs an ap-demo-local feature toggle to keep the call
# site valid). Future R311h..R311l cascades follow the same pattern:
# each `send_*` method on `SessionLinkActions` stays signature-stable,
# its body branches on the matching `codec-*` feature, and consumers
# never need their own mirror.

# R311y405 — the sibling fixture crate (the sanctioned test-fixture home),
# DEV-only: the `--router quic/` cert-threading discriminator
# (`run_router_admits_a_quic_listen_with_cert_at_bind`) needs a self-signed
# `localhost` cert. A dev-dependency never enters a `cargo build` (footprint /
# release stay untouched — only `cargo test` unifies it); no cycle
# (test-support -> wz-runtime-tokio, not -> wz-ap-demo).
[dev-dependencies]
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support", features = [
    "tls-fixtures",
] }

[features]
default = ["preset-ap-client"]
# Production preset forwards the wz facade's preset-ap-client contract + the
# live application switchboard wiring (gc-3 carry #2). switchboard stays a
# demo-local opt-in on top of the framework preset (preset-ap-client in the wz
# facade does NOT enable switchboard), so the framework footprint for other
# preset-ap-client consumers is unchanged.
preset-ap-client = ["wz/preset-ap-client", "switchboard"]
# gc-3 carry #2 — the live application machine + observer switchboard fan-out.
# Pulls the wz-ap-demo-app crate (the app statechart + generated injector) and
# the wz facade's switchboard feature (ApplicationLayerObserver.switchboard +
# dispatch_switchboard). Elidable for the footprint measurement.
switchboard = ["dep:wz-ap-demo-app", "wz/switchboard"]
# R311pk/R311pp — opt-in WebSocket transport. Forwards the wz facade's
# `locator-ws` scheme, which ALREADY pulls the `transport-link-ws`
# backend (naming both was a redundant closure), so wz-ap-demo can dial
# `--connect ws/HOST:PORT` through the library dial seam (Layer Z leg-8:
# wz WS <-> zenohd WS). NOT in `default` (preset-ap-client is TCP-only),
# so the footprint baseline and every other lane's build are unchanged;
# only run-ci Layer Z builds wz-ap-demo with it. Named `ws`, not
# `connect-ws`: the WS transport is not Initiator-only (the library also
# has `accept_ws`), so a connect-baked name would misdescribe it.
ws = ["wz/locator-ws"]
# R311y364 — opt-in `unixsock-stream/` (Unix domain socket) DIAL transport,
# forwarding the wz facade's `locator-unixsock` (which pulls
# `transport-link-unixsock`). The mirror of `ws`: NOT in `default`
# (preset-ap-client is TCP-only), so the footprint baseline and every other
# lane's build are unchanged; only run-ci Layer Z builds wz-ap-demo with it so
# the unixsock cross-impl legs can dial `--connect unixsock-stream/<path>`
# against zenohd's `unixsock-stream/` listener (zenoh-pico has no unixsock link,
# so pico dials TCP and zenohd routes between the two).
unixsock = ["wz/locator-unixsock"]
# R311y400 — opt-in `vsock/` (AF_VSOCK) transport, forwarding the wz facade's
# `locator-vsock` (which pulls `transport-link-vsock`; the facade closure
# `locator-vsock = ["transport-link-vsock"]` means eliding vsock needs BOTH dropped).
# The mirror of `unixsock`, but exercised ACCEPTOR-shaped: its purpose in the demo is
# a `--listen vsock/<cid>:<port>` acceptor that a foreign zenohd dials in the
# host-only vsock cross-impl leg (wz_vsock_acceptor_zenohd_interop). NOT in `default`
# (preset-ap-client carries tcp+udp, not vsock), so the footprint baseline and every
# other lane build are unchanged; only run-ci Layer Z builds wz-ap-demo with it.
# AF_VSOCK loopback is Linux + kernel-module-gated (vsock_loopback), so the leg
# runs only on a vsock-capable host — unlike the ws/tls/unixsock/udp acceptor legs it
# does NOT run on hosted CI (the runner has no vsock_loopback).
vsock = ["wz/locator-vsock"]
# R311y390 (CALLER fail-fast slice) — opt-in `unixpipe/` (Unix named-pipe)
# ACCEPT transport, forwarding the wz facade's `transport-link-unixpipe`. Unlike
# the dial-side `ws`/`unixsock`/`tls`/`quic` passthroughs above, its ONLY purpose
# in the demo is to make the mesh router's CALLER fail-fast REACHABLE: with it,
# `--router unixpipe/<path>` BINDS a single-connection unixpipe listener, which
# `run_router` then rejects at bind (a mesh router holds N faces; a unixpipe
# acceptor is 1:1 today). WITHOUT it, the `unixpipe/` scheme still PARSES (the
# locator leaf is ungated in wz-session-core), but `bind_locator` returns a
# feature-gated `Unsupported` at bind because the accept backend is not compiled,
# so `bind_endpoint("unixpipe/..").await?` errors BEFORE the mesh-capability guard
# (dead code). NOT in `default` (preset-ap-client is TCP-only), so the footprint
# baseline and every other lane build are unchanged; only the run-ci C1w-style
# lane builds wz-ap-demo with it to run the fail-fast discriminator. Named to
# mirror `wz/transport-link-unixpipe` (the accept-transport atom is not
# dial-shaped, so no `locator-` rename).
transport-link-unixpipe = ["wz/transport-link-unixpipe"]
# R311y365 — opt-in `tls/` (TLS-over-TCP) DIAL transport, forwarding the wz
# facade's `locator-tls` (which pulls `transport-link-tls`). The mirror of `ws`
# / `unixsock`: NOT in `default` (preset-ap-client is TCP-only), so the
# footprint baseline and every other lane build are unchanged; only run-ci
# Layer Z builds wz-ap-demo with it. A `tls/` --connect needs cert material the
# locator alone cannot carry, so it also enables the `--tls-ca <path>` CLI that
# builds a `TlsDialConfig` (root-CA + server-name `localhost`) via
# `DialConfig::with_tls` — the cert-plumbing the tls cross-impl legs 12/13 dial
# against zenohd's `tls/` listener with (zenoh-pico dials TCP; zenohd routes).
tls = ["wz/locator-tls"]
# R311y366 — opt-in `quic/` (QUIC, TLS-1.3 + ALPN hq-29) DIAL transport,
# forwarding the wz facade's `locator-quic` (which pulls `transport-link-quic`).
# The mirror of `tls`: NOT in `default` (preset-ap-client is TCP-only), so the
# footprint baseline and every other lane build are unchanged; only run-ci Layer
# Z builds wz-ap-demo with it. A `quic/` --connect needs cert material the
# locator alone cannot carry, so it also enables the `--quic-ca <path>` CLI that
# builds a `QuicDialConfig` (root-CA + server-name `localhost`) via
# `DialConfig::with_quic` — the cert-plumbing the quic cross-impl legs 14/15 dial
# against zenohd's `quic/` listener with (zenoh-pico dials TCP; zenohd routes).
quic = ["wz/locator-quic"]
# R311y369 — opt-in namespace prefixing (`--namespace <prefix>`), forwarding the
# wz facade's `routing-namespace`. The mirror of `ws`/`tls`/`quic`: NOT in
# `default` (preset-ap-client omits it), so the footprint baseline and every
# other lane build are unchanged; only run-ci Layer Z builds wz-ap-demo with it.
# It enables the `--namespace <prefix>` CLI that installs `set_namespace` on the
# opened client session, so outbound keyexprs are prefixed `<prefix>/<key>` on
# the wire — the plumbing the routing-namespace cross-impl leg 18 exercises
# against a zenohd router + a zenoh-pico `<prefix>/**` subscriber.
namespace = ["wz/routing-namespace"]
# R311qa — opt-in multi-peer ROUTER mode (`--router <addr>`): the catalog
# `routing-router` atom's foundation (bind once, hold N concurrent peer faces,
# no forwarding yet). Forwards the wz facade's `routing-router` marker feature,
# which gates the demo's `run_router` path — the cfg site that makes the catalog
# claim truthful (a binary now exercises router topology). NOT in `default`
# (preset-ap-client is single-session client scope), so the footprint baseline
# and every other lane build unchanged; only `--features routing-router`
# compiles the multi-peer mode.
routing-router = ["wz/routing-router"]
# R311qc — opt-in data-plane FORWARDING for `--router`: the catalog
# `routing-routes` atom. On top of the `routing-router` accept-and-hold mode,
# the router's `run_router` wires the `RoutingForwarder` so a Put received on
# one peer face is forwarded to every other face that declared a matching
# subscriber (vs `routing-router` alone, which holds faces but routes nothing).
# Forwards the facade `routing-routes`. NOT in `default`; only
# `--features routing-routes` compiles the forwarding router.
routing-routes = ["routing-router", "wz/routing-routes"]
# R311qg — opt-in peer-MESH mode (`--peer <listen> --connect <a,b>`): the catalog
# `routing-peer` atom's foundation (dial a configured peer set AND accept
# inbound, holding both — `peer_loop`, hold-only). Forwards the facade
# `routing-peer`, which gates the demo's `run_peer` path — the cfg site that
# makes the catalog claim truthful (a binary now exercises mesh topology). NOT in
# `default`; only `--features routing-peer` compiles the peer mode. Also pulls
# the three §5.16 access knobs so `run_peer` can fill all of InterceptorConfig
# (--acl-deny / --downsample / --max-payload); each implies routing-peer.
routing-peer = [
    "wz/routing-peer",
    "wz/access-acl",
    "wz/access-downsampling",
    "wz/access-quota",
    # R311y45 (§5.23 Phase 2b) — a routing peer can host its OWN adminspace
    # (the `--config-queryable` opt-in registers a forwarder-local admin
    # queryable reading the node's live shared WzConfig); pull the admin SSOT.
    "wz/adminspace-core",
    # R311y48 (§5.23 Phase 3b) — the LIVE leg of the config write: a
    # `--config-writable` peer reconfigures its forwarder from a remote PUT, so
    # the typed WzConfig mutation must actually re-drive the interceptor chain
    # (config-mutate-runtime ON). Without it the reconfigure stores but never
    # applies (the inert mirror), and the wire-observable ACL flip cannot happen.
    "wz/config-mutate-runtime",
]
# R311y213 (transport-multilink S2 slice-3) — opt-in N-link aggregation for the
# `--peer` mesh mode: the demo binary now reaches the §5.1 multilink path
# (`--peer <listen> --connect <a>,<a> --max-links 2` aggregates N physical links
# into ONE logical unicast session per peer zid, with per-link auto-re-add on
# loss). Pulls `routing-peer` (the run-mode that hosts the wiring — a bare
# `["wz/transport-multilink"]` passthrough would let the feature enable with
# `run_peer` compiled out = silent NOP, the routing-token-tables / router-multicast-
# faces convention) + the facade forward. Named `transport-multilink` to match
# `wz/transport-multilink` (every atom-forward feature mirrors its `wz/<atom>` name;
# the sole rename `ws` carries its own justification). NOT in `default`
# (preset-ap-client is single-link client scope), so the footprint baseline and every
# other lane build unchanged; only `--features transport-multilink` compiles the
# aggregation wiring. The atom is active <=> its cfg sites in run_peer + main.rs.
transport-multilink = ["routing-peer", "wz/transport-multilink"]
# R311y372 (transport-lowlatency) — opt-in lowlatency transport MODE, forwarding
# the wz facade's `transport-lowlatency` (the runtime-negotiated lean transport
# that offers the Z_EXT_LOWLATENCY unit ext on InitSyn and drops the Frame(sn)
# wrapper once negotiated). The mirror of `transport-multilink`: NOT in `default`
# (preset-ap-client does not carry lowlatency), so every other lane build is
# unchanged; only run-ci Layer Z builds wz-ap-demo with it so the lowlatency
# cross-impl leg can dial `--connect ... --lowlatency` against a zenohd whose
# `transport/unicast/lowlatency` is enabled. The atom is active <=> its cfg site
# in runner.rs (the `--lowlatency` open branch).
transport-lowlatency = ["wz/transport-lowlatency"]
# R311y218 (transport-qos) — opt-in QoS transport on the `--peer` mesh mode: `--qos`
# offers it, routed through `WzConfig.qos` into `FaceSources.qos` and staged by the
# `_with_multilink` entrypoints. Pulls `routing-peer` (the run-mode that hosts the
# `run_peer` wiring, per the transport-multilink convention above — a bare
# `["wz/transport-qos"]` passthrough would let the feature enable with `run_peer`
# compiled out = silent NOP) + the facade forward. The qos value only reaches the
# wire when composed with `transport-multilink` (`FaceSources.qos` is a
# multilink-path field); alone it wires `--qos -> WzConfig.qos` but the single-link
# demo arms do not offer it (the y218 scope boundary; priority segregation is y219).
# NOT in `default`; active <=> its cfg sites in run_peer + main.rs.
transport-qos = ["routing-peer", "wz/transport-qos"]
# R311y51 (§5.23 adminspace-write) — the permissions.write GATE on the config-write
# host. SEPARATE from routing-peer (a distinct toggle) so both gate arms stay
# compiled: `--features routing-peer,adminspace-write` = gate ON (run_peer consults
# --config-write-permit, default-deny), `--features routing-peer` = gate OFF (every
# write applies, the pre-y51 path). The run_peer config-write handler holds the
# cfg(feature="adminspace-write") site. Layer E6 builds the gate-ON binary.
adminspace-write = ["wz/adminspace-write"]
# R311y275 (§5.23 adminspace-metrics) — compiles the metrics leg into the demo
# host: the `@/<zid>/<whatami>/metrics` OpenMetrics build-info branch lives in
# wz-session-core `answer_admin_query` (the SSOT the --config-queryable host
# calls), gated cfg(feature="adminspace-metrics"), so merely compiling this
# feature answers the metrics GET — no run_peer flag needed. NOT in E6b's binary
# (its wz_peer_adminspace_to_pico_zget asserts the metrics leg is ABSENT), so the
# metrics witness rides its own lane (Layer E6f) with its own demo build.
adminspace-metrics = ["wz/adminspace-metrics"]
# R311y276 (§5.23 adminspace-read) — the permissions.read GET gate on the
# --config-queryable host. `--features routing-peer,adminspace-read` compiles the
# gate; `--no-admin-read` at runtime then makes the admin queryable answer NOTHING
# (the querier gets only the terminating Final). The gate resolves through the
# library admin_read_permit (a real cfg(feature="adminspace-read") site), the
# read-side mirror of adminspace-write. Layer E6g builds+drives the gate-ON binary.
adminspace-read = ["wz/adminspace-read"]
# R311y203 (§5.23 adminspace-introspection-handlers) — compiles the demo host's
# per-app-tick introspection re-snapshot (forwarder.subscriptions/queryables
# -> the shared AdminDeclaration buffer the --config-queryable handler replies from).
# The atom is active <=> its cfg sites in wz-session-core answer_admin_query + this
# crate's run_peer.
adminspace-introspection-handlers = ["wz/adminspace-introspection-handlers"]
# R311y237 (§5.23 adminspace-plugins-handlers) — compiles the demo host's plugins
# admin legs (`plugins/**` + `status/plugins/**` + the local_data `plugins` field).
# The plugin list is the compiled-in subsystem registry (`compiled_plugins`), so
# the atom is active <=> its cfg sites in wz-session-core answer_admin_query + this
# crate's run_peer/run_router_hat host wiring. Forwards the facade surface only; a
# subsystem to REPORT (e.g. storage-backend below) is a separate opt-in.
adminspace-plugins-handlers = ["wz/adminspace-plugins-handlers"]
# R311y239 (§5.23 adminspace-config-hotreload) — the config-diff storage lifecycle
# forward. The demo-binary storage-hosting run-mode (config-write → live storage) is
# a documented follow-up (net-new demo mode; run_peer is forwarder-based, no single
# Session for RuntimeStorageManager); the mechanism is proven by the wz-runtime-tokio
# composed integration test. This forward keeps the facade->demo chain complete.
adminspace-config-hotreload = ["wz/adminspace-config-hotreload"]
# R311y237 — opt-in: compile the storage_manager subsystem into the demo binary so
# `compiled_plugins` reports it (state=Loaded) over the plugins admin legs. The wz
# mirror of zenoh's canonical `zenoh-plugin-storage-manager`; forwards the facade
# `storage-backend` (which reaches wz-runtime-tokio's cfg site `compiled_plugins`
# checks). NOT in `default`; Layer E6e builds the demo with it for the plugins E2E.
storage-backend = ["wz/storage-backend"]
# R311y282 — the storage-host's DURABLE backing: forwards the facade
# `storage-backend-filesystem` so `--storage-host-dir <dir>` registers a
# FilesystemVolume and maps hosted storages onto it (durable across a host
# restart). Composes the storage-host run-mode (`adminspace-config-hotreload`);
# NOT in `default`. Layer C1bh builds + tests the demo with it.
storage-backend-filesystem = ["wz/storage-backend-filesystem", "adminspace-config-hotreload"]
# P4 §5.21 — the FOUNDATION feature (routing-accept precedent): forwards the facade
# `routing-router-hat`, which pulls `routing-peer` transitively + compiles the
# library `RouterForwarder`. It no longer gates a demo run-mode directly (the
# `--router-hat` mode is the `router-hat-router` atom below); it survives as the
# foundation the atom layers on.
routing-router-hat = ["routing-peer", "wz/routing-router-hat"]
# R311y132 — the router-hat run-mode ACTIVE-FLIP atom (`--router-hat <listen>`):
# drives the dual-mesh RouterForwarder over real transport, presenting wire
# WhatAmI::Router through accept_loop. The atom toggle layered on the
# `routing-router-hat` foundation (routing-routes-on-routing-accept pattern); the
# demo `--router-hat` run-mode gates on `cfg(feature="router-hat-router")` (the A3
# active site). ONE binary built with `--features router-hat-router` serves BOTH
# the router-hat node (`--router-hat`) AND the peer nodes (`--peer`, pulled via the
# foundation's routing-peer) of the E2E harness. Not in `default`; Layer E7 builds
# this binary.
router-hat-router = ["routing-router-hat"]
# §5.21 routing-token-tables (R311y170-175) — compiles the router-tier
# liveliness-TOKEN propagation plane into the demo binary so `run_router_hat`
# can surface its `pushed a future token` witness (the token twin of
# `pushed a future subscriber`). Pulls `router-hat-router` (the token witnesses
# live INSIDE the `#[cfg(feature="router-hat-router")]` run_router_hat fn — a
# minimal `["wz/routing-token-tables"]` passthrough would let the feature be
# enabled standalone with the run-mode compiled out, a silent NOP) plus the wz
# facade forward. The Layer Z zenohd-interop build opts into it so the token
# cross-impl leg exercises the plane; it stays independently toggleable (A3
# active <=> its own cfg sites, distinct from router-hat-router's).
routing-token-tables = ["router-hat-router", "wz/routing-token-tables"]
# §5.21 router-multicast-faces (R311y188, slice-3 EGRESS run-mode) — compiles the
# router's multicast egress host (spawn_router_mcast_egress + attach_mcast_group)
# INSIDE the #[cfg(feature="router-hat-router")] run_router_hat fn. Pulls
# router-hat-router (the run-mode) + the facade passthrough; the atom is
# active <=> its own cfg site in run_router_hat (mirrors routing-token-tables).
router-multicast-faces = ["router-hat-router", "wz/router-multicast-faces"]
# §5.21 router-connect-reconcile (R311y202) — compiles the `--connect-after`
# runtime connect-list reconcile affordance INSIDE run_router_hat (the reconcile
# channel wiring + the app-tick fire). Pulls router-hat-router (the run-mode) + the
# facade passthrough; the atom is active <=> its own cfg sites in run_router_hat +
# main.rs arg parse (mirrors router-multicast-faces / routing-token-tables).
router-connect-reconcile = ["router-hat-router", "wz/router-connect-reconcile"]
# §5.23 adminspace-router-linkstate (R311y204) — compiles the demo router-hat's
# admin-queryable registration + the per-GET LinkstateNetView render INSIDE
# run_router_hat. Pulls router-hat-router (the run-mode — a bare `["wz/adminspace-
# router-linkstate"]` passthrough would let the feature enable with run_router_hat
# compiled out = silent NOP) + the facade forward; the atom is active <=> its own
# cfg site in run_router_hat (mirrors router-connect-reconcile / router-multicast-faces).
adminspace-router-linkstate = ["router-hat-router", "wz/adminspace-router-linkstate"]

