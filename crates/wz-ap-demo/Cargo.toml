# run-mode is a peer or a client and stays gated OFF, so the demo's default wire
# is unchanged. Layer E8t builds the router with it for the cross-impl proof.
time-hlc = ["wz/time-hlc"]
# R311y282 — the storage-host's DURABLE backing: forwards the facade
# `storage-backend-filesystem` so `--storage-host-dir <dir>` registers a
