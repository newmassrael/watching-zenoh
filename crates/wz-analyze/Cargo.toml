#
# wz-analyze — R311y664 (§1.2a), the analyzer's COMMAND LINE.
#
# Measured before it was written: nothing in this workspace called
# `Dissection::from_pcapng` outside a test and the C ABI. The dissector, the
# report, the TLS recogniser and the decryptor were all reachable only by
# writing Rust, so "the analyzer" was a library that no one could run.
#
# This crate is the COMPOSITION ROOT and that is why it is a crate of its own:
# it is the only place `wz-capture` (zero third-party dependencies, builds for
# the MCU profiles) and `wz-tls-record` (ring) meet in a shipped artifact.
# Putting a `main` in either would have given that crate the other's dependency
# graph, which is the constraint R311y661 inverted the seam to avoid.
[package]
name = "wz-analyze"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
publish = false

[[bin]]
name = "wz-analyze"
path = "src/main.rs"

[dependencies]
wz-capture = { path = "../wz-capture" }
wz-tls-record = { path = "../wz-tls-record" }
# R311y667 — for `PassiveFrame`, which is the type `wz-capture` hands the
# decoded messages back in. Naming one in a listing means naming its type.
wz-session-core = { path = "../wz-session-core" }

[dev-dependencies]
# R311y673 — the three census planes report on Request / Response records, and
# a fixture of KeepAlives makes all three answer zero HONESTLY. A test that
# pinned those zeroes would pass just as well against planes that were never
# handed a frame at all -- the confident-zero shape this workspace has measured
# more than once -- so the fixture builds real zenoh messages, which means
# encoding them with the codec that owns their wire form.
wz-codecs = { path = "../wz-codecs" }
# THE ORACLE, and never a dependency -- the same role it plays for
# `wz-tls-record`. The binary's own test needs a capture that genuinely
# decrypts, which means records genuinely sealed by an implementation that is
# not this workspace's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
