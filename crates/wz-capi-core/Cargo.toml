#
# wz-capi-core — the ABI-NEUTRAL session model every wz C ABI sits on (R311y498).
#
# wz exports more than one C ABI: §5.27 `api-compat-pico` (zenoh-pico's) and
# `api-compat-c` (zenoh-c's). They are genuinely different ABIs — different
# entry symbols, different type footprints (pico's owned session is 16 bytes,
# zenoh-c's is 8), different ownership macros — but they are ONE session model:
# a registry of per-face wz sessions, the declaration SSOT replayed onto each
# face as it comes up, and one OS thread per session running a tokio runtime
# that drives the whole lifecycle.
#
# That model used to live inside `wz-capi-pico`, which made the second ABI a
# choice between duplicating it and generalising it. Duplicating would have
# copied the part that is hardest to get right and easiest to let drift: the
# race-free close (a stop latch set BEFORE the notify, because a `Notify` permit
# is single-use) and the drop-outside-the-lock discipline that keeps a C
# `drop(context)` from re-entering the registry it is being released from. A
# second copy would have been wrong in ways no test in the second crate could
# see.
#
# So the model moved here whole, and the ONE thing that was ABI-specific about
# it — the C closure types it stored and converted — was inverted into callback
# FACTORIES the ABI shim supplies. Nothing in this crate knows what a `z_*` type
# is.
#
# `rlib` only: this is a Rust-internal seam, not an artifact anyone links from C.
# The cdylibs are the ABI crates.

[package]
name = "wz-capi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "The ABI-neutral session model (face registry, declaration SSOT, drive thread) shared by watching-zenoh's C ABI crates."

[lib]
name = "wz_capi_core"
path = "src/lib.rs"

[features]
# The two link kinds the LISTEN role's accept-config arms are cfg'd on. They
# forward to wz-runtime-tokio exactly as wz-capi-pico's twins do; the drive half
# moved here carries the `#[cfg]`s, so the feature names must exist here or the
# arms silently become unknown-cfg (which `-D warnings` rejects, and did).
transport-link-quic = ["wz-runtime-tokio/transport-link-quic"]
transport-link-unixpipe = ["wz-runtime-tokio/transport-link-unixpipe"]
# R311y534 — the TLS-over-TCP link, on BOTH sides. It is the third arm of the
# same accept-config cfg the quic feature above already carries, plus the first
# consumer of the new DIAL-side config: `dial_config` builds a `TlsDialConfig`
# under it. Off by default like its siblings — a C ABI that never dials `tls/`
# should not pull rustls.
transport-link-tls = ["wz-runtime-tokio/transport-link-tls"]

[dependencies]
# OS entropy for the per-session zid, as zenoh-pico does at `z_open`
# (`~/zenoh-pico/src/api/api.c:846-855`). Moved here with `fresh_zid`.
getrandom = "0.2"
# Same reasoning as wz-capi-pico's: depend on wz-runtime-tokio DIRECTLY, never
# the `wz` facade, which re-exports the ABI crates and would form a cycle.
# `routing-accept` is not in the default bundle and gates `accept_loop`, which
# the listen role needs.
# `ext-pubsub-advanced-history` / `-sample-miss-detection` are selected here, not
# in the C-ABI crates, because THIS crate owns the per-face declaration SSOT the
# advanced planes replay through. Both are pico-native rather than superset:
# `Z_FEATURE_ADVANCED_PUBLICATION` / `_SUBSCRIPTION` are 1 in the pinned pico
# CMake config, so upstream's `z_advanced_pub.c` / `z_advanced_sub.c` compile
# their advanced half unconditionally and a drop-in must export it. Unlike the
# silent-no-op features wz-capi-pico documents, their absence is a COMPILE error
# here — this file names `AdvancedPublisher` / `AdvancedSubscriber` directly.
# `-history` is the widest of the subscriber chain (it implies `-recovery`, which
# implies `-subscriber`), so selecting it composes the whole plane the C option
# structs can ask for.
# R311y533 — `liveliness-get` is selected HERE, not only by the C-ABI crates,
# because this crate's drive loop is now the plane's SWEEPER: `dispatch` calls
# `sweep_expired_liveliness_gets` and the wake arm folds in
# `next_liveliness_get_deadline_ms`. It is NOT in wz-runtime-tokio's default set
# (the defaults carry `liveliness-token` / `-subscriber` / `-history`, not
# `-get`), and `wz-capi-pico` selecting it made this crate compile only under
# feature UNIFICATION — `cargo test -p wz-capi-core` alone did not. The pre-push
# changed-crate gate is what caught that; every earlier check in the round built
# this crate as a dependency of one that already supplied the feature.
#
# Gating the two call sites on a forwarding feature was the alternative and is
# worse: a build without it would silently lose the sweep, which is precisely the
# defect R311y533 exists to close (an armed liveliness deadline nobody enforces
# blocks the C caller in `z_recv` forever). The sweeper must be unconditional.
wz-runtime-tokio = { path = "../wz-runtime-tokio", features = [
    "routing-accept",
    "liveliness-get",
    "ext-pubsub-advanced-publisher",
    "ext-pubsub-advanced-history",
    "ext-pubsub-sample-miss-detection",
] }
# R311y529 — the `TimeSource` trait, so this crate can read the clock it already
# holds (`SharedSession::now_monotonic_ms`, which `z_timestamp_new` stamps
# from). Already in the graph via wz-runtime-tokio; named here because a trait
# method needs the trait in scope, and depending on it implicitly through
# another crate's re-export would break the moment that re-export moved.
wz-runtime-core = { path = "../wz-runtime-core", features = ["alloc"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
