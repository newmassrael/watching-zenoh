#
# wz-capi-core — the ABI-NEUTRAL session model every wz C ABI sits on (R311y498).
#
# wz exports more than one C ABI: §5.27 `api-compat-pico` (zenoh-pico's) and
# `api-compat-c` (zenoh-c's). They are genuinely different ABIs — different
# entry symbols, different type footprints (pico's owned session is 16 bytes,
# zenoh-c's is 8), different ownership macros — but they are ONE session model:
# a registry of per-face wz sessions, the declaration SSOT replayed onto each
# face as it comes up, and one OS thread per session running a tokio runtime
# that drives the whole lifecycle.
#
# That model used to live inside `wz-capi-pico`, which made the second ABI a
# choice between duplicating it and generalising it. Duplicating would have
# copied the part that is hardest to get right and easiest to let drift: the
# race-free close (a stop latch set BEFORE the notify, because a `Notify` permit
# is single-use) and the drop-outside-the-lock discipline that keeps a C
# `drop(context)` from re-entering the registry it is being released from. A
# second copy would have been wrong in ways no test in the second crate could
# see.
#
# So the model moved here whole, and the ONE thing that was ABI-specific about
# it — the C closure types it stored and converted — was inverted into callback
# FACTORIES the ABI shim supplies. Nothing in this crate knows what a `z_*` type
# is.
#
# `rlib` only: this is a Rust-internal seam, not an artifact anyone links from C.
# The cdylibs are the ABI crates.

[package]
name = "wz-capi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "The ABI-neutral session model (face registry, declaration SSOT, drive thread) shared by watching-zenoh's C ABI crates."

[lib]
name = "wz_capi_core"
path = "src/lib.rs"

[features]
# The receive busy-poll is on in a default build: it measured faster than zenoh-pico and
# zenoh-c on a loopback round trip and costs a node that only listens nothing (see the feature).
#
# The capabilities (`liveliness-get`, `advanced`, `group`, `gossip`, and the link kinds and
# handshake methods zenoh-c turns on by default, under zenoh-c's own feature names) are on in a
# default build so this crate builds and tests on its own; an ABI crate takes this crate with
# `default-features = false` and names the ones it exports, so a capability its ABI leaves out
# is compiled into neither the ABI nor this model.
default = [
    "rx-busy-poll",
    "link-udp",
    "timestamping",
    "peer",
    "multicast-transport",
    "scout",
    "query",
    "queryable",
    "liveliness",
    "liveliness-get",
    "advanced",
    "group",
    "gossip",
    "multi-thread",
    "unstable-api",
    "connectivity",
    "transport_tls",
    "transport_quic",
    "transport_quic_datagram",
    "transport_ws",
    "transport_unixsock-stream",
    "transport_multilink",
    "auth_pubkey",
    "e2e-sender",
    "transport_compression",
    "auth_usrpwd",
    "interceptors",
]
# The roles beyond the CLIENT: a session that listens, that accepts the sessions of others, that
# is a peer or a router, and what those roles bring with them: the accept loop, the listener's
# bind (with its late retry), the faces it serves, the peer's walk over several endpoints, the
# answering of a Scout and the gossip that introduces the nodes of a mesh. A build without it
# opens a session in client mode to the endpoints it dials (or finds, with `scout`), and refuses
# a config that states a listener or a role it does not have.
peer = [
    "scout",
    "wz-runtime-tokio/session-unicast-accept",
    "wz-runtime-tokio/scouting-responder",
]
# Scouting: the one-shot survey of the group that `z_scout` makes, and a session's own looking
# for the nodes it should connect to (a client with nothing to dial scouts for its router): the
# scout, its fan-out over the interfaces, the reading of the answers, the plan the config
# resolves to, and the dial a finding turns into (`routing-accept` is for `DialIntent`, the type
# that dial is, and `zenoh-config` for the types the plan reads).
scout = [
    "link-udp",
    "dep:wz-routing-graph",
    "wz-runtime-tokio/routing-accept",
    "wz-runtime-tokio/codec-scout",
    "wz-runtime-tokio/codec-hello",
    "wz-runtime-tokio/scouting-active",
    "wz-runtime-tokio/link-interfaces",
    "wz-runtime-tokio/locator-iface",
    "wz-runtime-tokio/zenoh-config",
]
# The UDP unicast link: dialled by a `udp/` endpoint, and the transport the scouting group
# rides, which is why `scout` implies it. A build without it dials TCP (and what its own link
# features add) alone.
link-udp = ["wz-runtime-tokio/transport-link-udp"]
# The node's clock, the HLC a role that stamps its messages holds (zenoh's router does by
# default; a peer or client does not unless its config says). It is the runtime's `time-hlc`,
# which brings zenoh's `uhlc` and the storage module, and with that module the whole query
# plane: a build that stamps nothing and answers no query carries none of it. The advanced
# publisher's cache sequences by timestamp, so `advanced` implies it.
timestamping = ["wz-runtime-tokio/time-hlc"]
# The two link kinds the LISTEN role's accept-config arms are cfg'd on. They
# forward to wz-runtime-tokio exactly as wz-capi-pico's twins do; the drive half
# moved here carries the `#[cfg]`s, so the feature names must exist here or the
# arms silently become unknown-cfg (which `-D warnings` rejects, and did).
transport-link-quic = ["wz-runtime-tokio/transport-link-quic"]
transport-link-unixpipe = ["wz-runtime-tokio/transport-link-unixpipe"]
# R311y534 — the TLS-over-TCP link, on BOTH sides. It is the third arm of the
# same accept-config cfg the quic feature above already carries, plus the first
# consumer of the new DIAL-side config: `dial_config` builds a `TlsDialConfig`
# under it. Not a capability itself, like its siblings: the pico ABI forwards it as
# a feature of its own that is off by default, and the zenoh-c ABI reaches it
# through the `transport_tls` capability below.
transport-link-tls = ["wz-runtime-tokio/transport-link-tls"]
# The WebSocket and serial links, dial and accept. Neither needs material a locator cannot
# carry, so no config of this crate reads them: the runtime's dial and bind seams take a `ws/`
# or `serial/` endpoint as they take a `tcp/` one once its backend is compiled in, and answer
# a typed `Unsupported` when it is not. Named here so an ABI forwards a link to the session
# model it is built on rather than reaching past it. Off by default, as zenoh-pico's
# `Z_FEATURE_LINK_WS` and `Z_FEATURE_LINK_SERIAL` are.
transport-link-ws = ["wz-runtime-tokio/transport-link-ws"]
transport-link-serial = ["wz-runtime-tokio/transport-link-serial"]
# Open-debt item 913 — a multicast group the session joins, as ONE face beside its unicast ones:
# a publish and a get reach every member with one send, and a member's put and query reach the
# session's subscribers and queryables. pico's `Z_FEATURE_MULTICAST_TRANSPORT` and the multicast
# endpoints zenoh-c listens on, over the UDP group link (`transport-link-udp`, the `link-udp`
# feature) and the runtime's group session and drive (`transport-multicast`). A group is joined
# by a peer, so it takes the peer's roles.
multicast-transport = ["peer", "link-udp", "wz-runtime-tokio/transport-multicast"]
# Open-debt item 913 — zenoh-pico's multicast declarations switch: on a group, the interests
# (the open-time pull of the members' keyexprs, a write filter's), the keyexpr declarations,
# and a write filter that holds a write back. Off by default, as pico's switch is.
multicast-declarations = ["multicast-transport", "wz-runtime-tokio/multicast-declarations"]
# Open-debt item 911 — a group over raw Ethernet: a `reth/` endpoint joins one as the UDP group
# is joined, through the runtime's raweth group link (`transport-link-raweth`). Linux only, as
# pico's raweth transport is; elsewhere the endpoint names no group.
raweth-transport = ["multicast-transport", "wz-runtime-tokio/transport-link-raweth"]
# The link kinds the zenoh-c ABI forwards beside the ones above. No arm of this
# crate is cfg'd on them: a session dials through `dial_endpoint` and binds through
# `bind_endpoint_with_config`, and both decide by scheme in the runtime, so a scheme
# is dialled and bound as soon as the runtime has its backend. `unixsock` and
# `unixpipe` have one on a Unix target only and `vsock` on Linux only; elsewhere
# the runtime answers the scheme with `Unsupported`, which fails the open.
transport-link-quic-datagram = [
    "transport-link-quic",
    "wz-runtime-tokio/transport-link-quic-datagram",
]
transport-link-unixsock = ["wz-runtime-tokio/transport-link-unixsock"]
transport-link-vsock = ["wz-runtime-tokio/transport-link-vsock"]
# The multilink establishment extension. A session of this crate opens one link per
# peer through the single-link open seams, which is what upstream does at its default
# `transport/unicast/max_links` of 1; the aggregation above it is the runtime's
# `peer_loop` and is not wired here.
transport-multilink = ["wz-runtime-tokio/transport-multilink"]
# The per-link transport counters (bytes and messages, each way), held on every
# session's `SessionLinkActions` (`stats_report`). No door of this crate reads them.
transport-stats = ["wz-runtime-tokio/transport-stats"]
# The public-key authentication a node's config asks for: the RSA identity of the four
# `transport/auth/pubkey` keys, presented to the peers it dials and asked of the peers it
# accepts (`NodeAuth`). The pico ABI has no such key.
access-extauth-pubkey = [
    "wz-runtime-tokio/routing-accept",
    "wz-runtime-tokio/access-extauth-pubkey",
    "wz-session-core/session-extauth",
]
# The zenoh-c switches that are capabilities (`deploy/wz-config.toml`), under zenoh-c's own
# names, each the link kind or the handshake method above.
transport_tls = ["transport-link-tls"]
transport_quic = ["transport-link-quic"]
transport_quic_datagram = ["transport_quic", "transport-link-quic-datagram"]
transport_ws = ["transport-link-ws"]
transport_unixsock-stream = ["transport-link-unixsock"]
transport_multilink = ["transport-multilink"]
auth_pubkey = ["access-extauth-pubkey"]
# The sending side of an end-to-end protected message. The model has nothing behind it: the doors
# and the frame writer they use are the zenoh-c ABI's own (`wz-capi-c/e2e-sender`), so this
# feature only carries the capability's name, as the declaration requires of every capability.
e2e-sender = []
# The batch compression a session offers and accepts, and the capability that names it in the
# declaration (zenoh-c's own feature name). The runtime's feature is the mechanism.
transport_compression = ["wz-runtime-tokio/session-extcompression"]
# The user/password authentication, under zenoh-c's own feature name. `access-extauth-usrpwd`
# below is the mechanism; this is the capability that names it in the declaration.
auth_usrpwd = ["access-extauth-usrpwd"]
# The usrpwd authentication a node's config asks for: a listener that names a
# `transport/auth/usrpwd/dictionary_file` admits only the peers that hold a user of it
# (`NodeAuth`). Off by default for the reason the TLS feature is: the pico ABI has no such
# key and carries none of the credential machinery. The zenoh-c ABI turns it on.
access-extauth-usrpwd = [
    "wz-runtime-tokio/routing-accept",
    "wz-runtime-tokio/access-extauth-usrpwd",
    "wz-session-core/access-extauth-usrpwd",
]
# The policy a node's config states for the traffic of its sessions: `access_control`,
# `low_pass_filter` and `downsampling`, compiled from the document (`NodePolicy`) and enforced on
# every face, in both directions. The three are one feature because they are one chain: the
# session installs the chain through the ACL's seam, so a node with a size cap and no ACL still
# needs it. Off by default for the reason the credential feature is; the zenoh-c ABI turns it on.
interceptors = [
    "wz-runtime-tokio/zenoh-config",
    "wz-runtime-tokio/access-acl",
    "wz-runtime-tokio/access-downsampling",
    "wz-runtime-tokio/access-quota",
]
# A serial drive (the pico ABI: one thread runs every face and callback) also
# runs the session's tokio runtime on that thread alone, so a round trip does
# not cross a worker-thread hop. Off here: the ABI crate decides (wz-capi-pico
# turns it on by default). Setting WZ_CAPI_WORKER_THREADS at run time still
# selects the multi-thread runtime, so a node with long blocking callbacks keeps
# a way to run its timers and spawned tasks beside them.
serial-drive-own-thread = []
# A TCP read that would wait first keeps reading its socket for a few microseconds, so a reply
# that comes back inside that window is taken by a core that never went idle. On by default since
# the two costs it had were removed: the spin yields to other threads of the process (a plain spin
# held its core and gave a 35-85 us 99th percentile), and a spin that finds nothing makes the next
# reads skip theirs, so a node that only listens pays no CPU for it (measured: 335 vs 337 ms over
# 5 s at about 6k messages a second). Measured on a pinned loopback round trip of 8 bytes: against
# zenoh-pico 14-15 us (99th 18 us) wz is 13-14 us (99th 17 us); against zenoh-c 31-32 us wz is
# 17-18 us. A build that wants no spinning leaves the feature out, and WZ_CAPI_RX_BUSY_POLL_US
# overrides the budget at run time in either direction (zero is off).
rx-busy-poll = []
# R2259 (open-debt item 593) — the QoS ext, named here for the same reason the
# three link kinds above are: `FaceSnapshot::of` reads `SessionLinkActions::is_qos`,
# which is `transport-qos`-gated upstream, so the name must EXIST here or the
# arm that reads it becomes an unknown cfg. Off by default, matching
# wz-runtime-tokio's own default set — a session that never negotiated the ext
# reports `is_qos == false`, which is the measured answer and not a stand-in.
transport-qos = ["wz-runtime-tokio/transport-qos"]
# R2259 (open-debt item 593) — the SHM ext, named for the same reason as
# `transport-qos` above: `FaceSnapshot::of` reads `SessionLinkActions::is_shm`,
# which is `transport-shm`-gated upstream. It feeds the SHM arm's twentieth
# transport byte, which upstream adds only when `Z_FEATURE_SHARED_MEMORY` is set.
transport-shm = ["wz-runtime-tokio/transport-shm"]
# R3065 -- the SHM establishment, for a host that gives its sessions a reader of its own: the
# session's offer lists the protocols that reader resolves in the segment it publishes
# (`OpenStance::with_shm_clients`). The zenoh-c arm that has client storages turns it on.
session-extshm = ["transport-shm", "wz-runtime-tokio/session-extshm"]
# The snapshot `get` of liveliness and the sweep that enforces its deadline (R311y533): this
# crate's drive loop is the plane's SWEEPER, so `dispatch` calls
# `sweep_expired_liveliness_gets` and the wake arm folds in `next_liveliness_get_deadline_ms`.
# The two are one switch with the ABI's `z_liveliness_get`, so a build never arms a deadline
# no loop enforces (which blocks the C caller in `z_recv` forever).
liveliness-get = ["liveliness", "query", "wz-runtime-tokio/liveliness-get"]
# The liveliness token and subscriber of the runtime: the declarations a token and a presence
# subscription are made of, and the history replay a subscriber can ask for.
liveliness = [
    "wz-runtime-tokio/liveliness-token",
    "wz-runtime-tokio/liveliness-subscriber",
    "wz-runtime-tokio/liveliness-history",
    "wz-runtime-tokio/declare-token",
]
# The requesting end of a query: the get and everything a reply carries back to it.
query = [
    "wz-runtime-tokio/query-get",
    "wz-runtime-tokio/query-reply",
    "wz-runtime-tokio/query-target",
    "wz-runtime-tokio/query-timeout",
    "wz-runtime-tokio/query-consolidation",
    "wz-runtime-tokio/query-attachment",
    "wz-runtime-tokio/query-selector-parameters",
    "wz-runtime-tokio/query-reply-err",
    "wz-runtime-tokio/query-source-info",
    "wz-runtime-tokio/query-value",
    "wz-runtime-tokio/codec-request",
    "wz-runtime-tokio/codec-response",
    "wz-runtime-tokio/codec-response-final",
]
# The answering end of a query: the queryable and its replies.
queryable = [
    "wz-runtime-tokio/query-queryable",
    "wz-runtime-tokio/declare-queryable",
    # The reply-side source-info EMIT gate: `z_query_reply_options_t` declares a
    # `source_info` in the reference build, and without this the field is read, staged and
    # silently dropped at the codec.
    "wz-runtime-tokio/reply-source-info",
    "wz-runtime-tokio/query-reply-err",
    "wz-runtime-tokio/query-source-info",
    "wz-runtime-tokio/query-attachment",
    "wz-runtime-tokio/query-selector-parameters",
    "wz-runtime-tokio/query-value",
    "wz-runtime-tokio/codec-request",
    "wz-runtime-tokio/codec-response",
    "wz-runtime-tokio/codec-response-final",
]
# The advanced publisher and subscriber planes the face registry replays through.
# `-history` is the widest of the subscriber chain (it implies `-recovery`, which implies
# `-subscriber`), so it composes the whole plane the C option structs can ask for. Pico-native
# rather than superset: `Z_FEATURE_ADVANCED_PUBLICATION` / `_SUBSCRIPTION` are 1 in the pinned
# pico CMake config, and a build that turns them off links neither the ABI nor the plane.
advanced = [
    "timestamping",
    "wz-runtime-tokio/ext-pubsub-advanced-publisher",
    "wz-runtime-tokio/ext-pubsub-advanced-history",
    "wz-runtime-tokio/ext-pubsub-sample-miss-detection",
]
# The group membership plane (R2932): the face registry's `groups` slot and `group.rs`.
group = ["wz-runtime-tokio/ext-pubsub-group-membership"]
# R3074 -- the gossip plane: a session that is told of a node by one it holds a link to dials
# it, which is how two peers that each reached a third come to meet when multicast scouting
# reaches nobody.
gossip = ["peer", "wz-runtime-tokio/routing-gossip"]
# pico's header arm for its tasks (`deploy/wz-config.toml`). The model has no thread choice of
# its own, since a session drives itself on its runtime either way, so nothing here reads it; it
# is a feature because every capability is one of the core's.
multi-thread = []
# pico's unstable API and its connectivity plane (`deploy/wz-config.toml`): ABI surface the
# pico crate exports or not, over a model that has both either way. Features here because every
# capability is one of the core's.
unstable-api = []
connectivity = ["unstable-api"]
# pico's admin space and its session-local delivery (`deploy/wz-config.toml`, off by default
# as upstream's are). The model behind them is here either way: the local plane, and a write
# filter or matching listener told whether to count the session's own entities. Features here
# because every capability is one of the core's.
admin-space = []
local-subscriber = []
local-queryable = []

[dependencies]
# OS entropy for the per-session zid, as zenoh-pico does at `z_open`
# (`~/zenoh-pico/src/api/api.c:846-855`). Moved here with `fresh_zid`.
getrandom = "0.2"
# Same reasoning as wz-capi-pico's: depend on wz-runtime-tokio DIRECTLY, never
# the `wz` facade, which re-exports the ABI crates and would form a cycle.
# `routing-accept` is not in the default bundle and gates `accept_loop`, which
# the listen role needs and which also carries `DialIntent`, the dial a scouted node becomes:
# it is the `scout` feature's, with the scouting runtime features (`scouting-active`,
# `link-interfaces`, `locator-iface`, `zenoh-config`). The accepting half (`session-unicast-accept`,
# `scouting-responder`) is the `peer` feature's. The comments below keep the reasons the
# features were chosen.
# The capabilities a deployer can leave out (`liveliness-get`, the advanced pub/sub trio,
# the group membership, the gossip) are this crate's features of the names above, not an
# unconditional list here: a dependency that names a capability unconditionally makes it every
# ABI's, however slim the ABI asks to be.
# R311y539 — `scouting-active` is selected HERE, not only by the C-ABI crates,
# because the scouting DRIVE moved into this crate (`scouting::run_scout`): both
# ABIs' `z_scout` is a shim over one implementation, and the module names
# `wz_runtime_tokio::scouting_glue` directly, so its absence is a COMPILE error
# rather than a silent no-op. Selecting it here also means `cargo test -p
# wz-capi-core` alone builds, which feature UNIFICATION would otherwise hide —
# the R311y533 lesson, one crate later.
# R2611 — `link-interfaces` and `locator-iface` are the two halves of a scouting
# fan-out: the first ENUMERATES the multicast interfaces (it owns `getifaddrs`),
# the second PINS a socket's egress to one. Both are named here rather than
# folded into `scouting-active`, which an embedded profile also selects and
# which must not grow a libc dependency for a capability that profile cannot
# use. This crate is the C-ABI drop-in for zenoh-pico, whose own `z_scout` opens
# a link per interface, so it is exactly the build that owes the fan-out.
# With either absent `scout_interface_addresses` reports "cannot ask" and the
# window scouts on the group socket alone, which is what it did before.
# R3064 -- `time-hlc`, selected unconditionally here (the node clock is the session's, not
# a plane's), and the reason is MEASURED: without it `NodeHlc` is a zero-sized type that answers `is_stamping() == false`
# whatever the config says, so an advanced publisher with a cache and no miss detection (which
# sequences by timestamp, and which upstream's declaration refuses on a node that holds no
# clock) was refused on EVERY C session and the refusal was swallowed. A zenoh-c node has a
# clock whenever its `timestamping` config enables one for its role, so the build that stands
# for zenoh-c must be able to hold one; whether a given session does is the config's. The
# feature brings zenoh's own `uhlc` and the storage module, and a role that does not stamp
# (a peer or client by default, as upstream ships) holds no clock and pays nothing per message.
wz-runtime-tokio = { path = "../wz-runtime-tokio", default-features = false, features = [
    # What every session is made of, however slim: the handshake and frame codecs, the
    # declarations a subscriber needs, the TCP and UDP unicast links with their keep-alive and
    # batching, the publication path, the session's open, accept and reconnect, and the key
    # expression algebra. The capabilities a deployer can leave out are the features above.
    "codec-init-body",
    "codec-open-body",
    "codec-keep-alive",
    "codec-close",
    "codec-fragment",
    "codec-frame",
    "codec-push",
    "codec-declare",
    "declare-final",
    "declare-interest",
    "declare-keyexpr",
    "declare-subscriber",
    "declare-undeclare",
    "transport-link-tcp",
    "transport-unicast",
    "transport-keepalive",
    "transport-batching",
    "pubsub-put",
    "pubsub-delete",
    "pubsub-allow-loop",
    "pubsub-attachment",
    "pubsub-timestamp",
    "pubsub-encoding",
    "pubsub-source-info",
    "pubsub-priority",
    "pubsub-congestion-control",
    "pubsub-express",
    "session-unicast-open",
    "session-reconnect",
    "session-matching",
    "keyexpr-canon",
    "keyexpr-wildcard-single",
    "keyexpr-wildcard-double",
    "keyexpr-dollar-star",
    "keyexpr-includes",
    # `z_timestamp_new` of both ABIs reads the wall clock, whatever the node's clock is.
    "timestamp-wall-clock",
] }
# R3070 -- the autoconnect POLICY (`AutoConnect`, its per-target strategies) a session that
# scouts is built with, named here because the plan a host hands this crate carries it. A pure
# host crate, already in the graph through `zenoh-config` (the `scout` feature's).
wz-routing-graph = { path = "../wz-routing-graph", optional = true }
# R311y529 — the `TimeSource` trait, so this crate can read the clock it already
# holds (`SharedSession::now_monotonic_ms`, which `z_timestamp_new` stamps
# from). Already in the graph via wz-runtime-tokio; named here because a trait
# method needs the trait in scope, and depending on it implicitly through
# another crate's re-export would break the moment that re-export moved.
wz-runtime-core = { path = "../wz-runtime-core", features = ["alloc"] }
# R311y617 -- the ENCODING id table moved to `wz-codecs` so a no_std consumer
# can reach it, and this crate re-exports it rather than holding a copy. NO
# features named: the table and its lookup are ungated, and naming a feature
# here would make it every dependent's (R311y614).
wz-codecs = { path = "../wz-codecs", default-features = false }
# The `AuthDispatch` and `UsrPwdMethod` a node's authentication is built from
# (`node_auth`), which the runtime does not re-export, and the encoding conversions
# (`encoding_ids` re-exports `wz_session_core::encoding_hint`, which moved down so the pico ABI
# over the cooperative engine reaches it without this crate). No longer optional: the
# conversions are every build's. `alloc` is the one feature named, because the conversions
# build `String`s; it adds nothing to any dependent, since `wz-runtime-tokio`, which every build
# of this crate links, already turns it on.
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["alloc"] }
# The vocabulary a C ABI and its engine both name (the subscriber and matching factories, the ids,
# a key's wire form, the write filter's plane and answer), which `faces` re-exports: this crate is
# one engine of that port, and a C ABI over another engine names the same types without it.
wz-capi-port = { path = "../wz-capi-port" }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
# For `free_port()`, the workspace's one source of a loopback port no other caller in the
# process has been given. The drive tests' own bind-read-drop probe let two of their threads be
# handed one number; on Windows both listeners then bind it, because a wz listener sets
# SO_REUSEADDR as upstream's does and that option lets a second socket bind a port a live
# listener holds there. A dial can then be accepted by the other thread's listener, whose
# teardown takes the face down before the test reads it: the reading of the 1 of 1200 empty
# registries hosted Platform run 38013268899 counted. Already in the graph of both C ABI crates'
# tests; it adds no new crate to `cargo test -p wz-capi-core`.
#
# `multicast` is the in-memory group the multicast face's tests run over (open-debt item 913).
# It forwards the runtime's `transport-multicast`, the one runtime feature this dev-dependency
# adds, and the feature this crate's own `multicast-transport` forwards too.
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support", features = [
    "multicast",
] }
# `node_auth`'s tests write the dictionary files a config names. Already in `crates/Cargo.lock`
# through the C ABI crate's tests.
tempfile = "3"
# Paused time (`test-util`) for the multicast face's tests, whose beacons and lease then run
# on their own schedule at no cost; the demo's group tests take it the same way.
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
