# SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael
#
# This package reproduces the public API and the documentation of the crate of the same name of
# eclipse-zenoh/zenoh, which is EPL-2.0 OR Apache-2.0, so the whole package is under that expression.
# The notices of the upstream files it derives from are kept in its sources (see LICENSES/ and
# THIRD_PARTY.md at the root of this repository).
#
# zenoh-util -- the utilities of the zenoh family: the time range language of a query selector, the
# logging setup, the home directory of zenoh, the dynamic library loader and its search path, the
# network interface enumeration and the timer, over watching-zenoh (inventory atom
# `api-compat-rust`, open-debt item 910, docs/build-configuration.md C13).
#
# Named `zenoh-util` and versioned as the pinned zenoh, like every crate of the family (see
# `../wz-zenoh-result/Cargo.toml` for why the name is the mechanism). `zenoh-config` and the plugins
# name this crate's types (`TimeRange`, `LibLoader`, `Timer`), so an ecosystem crate that does must
# meet the one of this graph.
#
# It is built in slices, each landing whole with the ratchet of `scripts/lib/rust_api_surface.py`
# lowered in its own round. Until a slice lands its items are missing lines of the surface gate, not
# stubs here.

[package]
name = "zenoh-util"
version = "1.10.2"
edition.workspace = true
rust-version.workspace = true
license = "EPL-2.0 OR Apache-2.0"
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Utilities of the zenoh family (1.10.2), as a drop-in over watching-zenoh."

[lib]
name = "zenoh_util"
path = "src/lib.rs"

# Upstream's one feature by its name: `test` adds the logging setup the valgrind lane uses.
[features]
test = []

# `const_format` is re-exported (`__concatcp`) for `concat_enabled_features!`, and `lazy_static` is
# what `zenoh_home` keeps its path in, so the requirements are upstream's.
[dependencies]
async-trait = "0.1.89"
const_format = "0.2.34"
flume = "0.11.1"
home = "0.5.9"
humantime = "2.3.0"
lazy_static = "1.5.0"
libloading = "0.8.9"
schemars = { version = "1.1.0", features = ["either1"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
shellexpand = "3.1.1"
tokio = { version = "1.47.1", default-features = false, features = ["net", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zenoh-core = { path = "../wz-zenoh-core" }
zenoh-result = { path = "../wz-zenoh-result", features = ["default"] }

# The interface list of a Unix system is read through `pnet_datalink`.
[target.'cfg(unix)'.dependencies]
pnet_datalink = "0.35.0"

# `winapi` is what the Windows socket address conversion of `ffi::win` reads its structures from.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["iphlpapi", "memoryapi", "winerror"] }

[lints]
workspace = true
