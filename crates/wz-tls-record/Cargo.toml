#
# wz-tls-record — R311y657 (§1.2a), the TLS 1.3 RECORD layer, on the far side
# of the seam `wz-capture` draws.
#
# `wz-capture` has zero third-party dependencies by design and recognises an
# encrypted flow without opening one byte of it. This crate is where the cipher
# is allowed to live, and the split between the two is not a preference: it was
# read off the pinned versions. rustls 0.23.40 keeps `hkdf_expand_label`
# `pub(crate)` (src/tls13/key_schedule.rs:889) while ring 0.17.14 makes
# `hkdf::Prk::new_less_safe` public (src/hkdf.rs:117) -- so the PRIMITIVES are
# available to a caller that already holds a traffic secret, and the TLS 1.3
# PROTOCOL layer above them is not. That protocol layer is exactly what a wire
# analyzer must own, and it is what this crate is.
#
# `ring` and nothing else. rustls appears as a DEV-dependency only, where it is
# the oracle: it seals a record that this crate must open, and it derives the
# same key schedule this crate must reproduce byte for byte.
[package]
name = "wz-tls-record"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
publish = false

[dependencies]
# The AEAD and HKDF-Expand primitives. Pinned by the workspace lock at 0.17.14,
# already present because `transport-link-tls` pulls it through tokio-rustls --
# this crate adds no new third-party name to the tree.
ring = "0.17"
# R311y661 (§1.2a) — the capture side, PROMOTED from a dev-dependency.
#
# R311y660 made it a dev-dependency because the whole chain existed only in a
# test, and the constraint that decided the edge's DIRECTION still holds:
# `wz-capture` may not gain a third-party dependency (its decode path builds for
# the MCU profiles), so the edge cannot point the other way.
#
# What changed is that the join is now a shipped type rather than a test.
# `capture::CaptureOpener` implements `wz_capture::tls::RecordOpener`, a trait
# declared over there so the dependency INVERTS: the dissector defines what it
# needs from a decryptor and never learns what an AEAD is, and this crate --
# which already has ring -- supplies it. A production caller can therefore
# decrypt a capture without writing the record loop itself, which is the thing
# R311y660 left undone.
wz-capture = { path = "../wz-capture" }

[dev-dependencies]
# THE ORACLE, and never a dependency: rustls seals what this crate opens, and
# derives what this crate derives. Two independent implementations agreeing is
# the claim; one implementation agreeing with itself is not.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# R311y886 (open-debt item 357) — the RFC 1071 arithmetic this crate's hand-laid
# packet fixtures need. They wrote a ZERO into both checksum fields, which over
# IPv4 is present-and-wrong rather than absent, so every capture the end-to-end
# test built read as corrupt on both axes.
wz-packet-fixtures = { path = "../wz-packet-fixtures" }

[features]
# R311y698 (§1.2a) — the QUIC packet BUILDERS, for a consumer that must make a
# capture to prove it reads one.
#
# Off by default and never on for the analyzer itself: nothing in the read path
# builds a QUIC packet. `wz-analyze` turns it on as a DEV-dependency so its
# end-to-end test can synthesise a connection, and the alternative -- a second
# copy of the packet layout in that crate -- would be a second opinion about
# where a header ends, which is the shape this workspace closes rather than
# writes.
fixtures = []
