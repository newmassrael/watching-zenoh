#
# wz-capi-c — §5.27 api-compat-c, slice 1.
#
# A zenoh-c-compatible C ABI (`z_*` / `zc_*` `#[no_mangle] extern "C"` symbols)
# over the wz AP session, so a program written for zenoh-c links wz's cdylib as a
# binary drop-in. The sibling of `wz-capi-pico`, over the SAME session model
# (`wz-capi-core`) — two ABIs, one model.
#
# ## It ships NO header, deliberately
#
# `wz-capi-pico` R1 shipped its own header, so a program compiled against THAT
# header was self-consistent and the exact layout match could be deferred. This
# crate cannot take that route and should not want to: zenoh-c's real header is
# cbindgen OUTPUT, so it IS the ABI, and the whole claim here is that a program
# compiled against UPSTREAM's unmodified header links this library. A wz-authored
# header would make that claim untestable by construction.
#
# ## Slice 1 is defined by an upstream PROGRAM, not by a symbol list
#
# The scope is "upstream's `examples/z_put.c` links and runs against this
# cdylib": 12 symbols, measured with `nm -u` rather than chosen. That distinction
# is not pedantry — a hand-picked list drafted before the measurement had 4
# symbols zenoh-c does not use and was missing 3 it does (`z_bytes_from_static_str`
# rather than `z_bytes_copy_from_str`, `zc_config_from_file` +
# `zc_config_insert_json5` rather than `zc_config_from_str`, and
# `zc_init_log_from_env_or`, which nothing would have suggested).
#
# The remaining upstream examples are the backlog, and the lane REPORTS the ratio
# every run so partial coverage stays visible instead of implied.
#
# crate-type = ["cdylib", "staticlib", "rlib"]:
#   - cdylib:    the artifact a zenoh-c program links.
#   - staticlib: the same library for a program linked statically, which zenoh-c
#                builds beside its shared one. A Rust static library carries no
#                record of the system libraries the standard library needs, so a
#                C link names them after it (on Linux: `-lgcc_s -lutil -lrt
#                -lpthread -lm -ldl -lc`, what `rustc --print native-static-libs`
#                lists).
#   - rlib:      so the facade can re-export it and so gate tests can drive the
#                exported symbols in-process.
#
# AP/std-only.

[package]
name = "wz-capi-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "zenoh-c-compatible C ABI (cdylib) over the wz AP session — a binary drop-in for zenoh-c programs (§5.27 api-compat-c slice 1)."

[lib]
name = "wz_capi_c"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

# The node that `client_only_dials_a_listener` dials: a build that cannot listen needs one of the
# full build to talk to.
[[example]]
name = "hold_a_listener"
required-features = ["peer"]

# The tests of a capability exist only where the capability does: a build that leaves the plane
# out has no symbol for them to call, so they are not compiled there (and not run). Nearly every
# one meets its session through a listener of this same library, so each needs `peer` beside what
# it exercises; a build without `peer` is covered by `client_only_dials_a_listener`.
[[test]]
name = "config_verdict_zenohd_interop"
required-features = ["peer"]

[[test]]
name = "connect_retry_open"
required-features = ["peer"]

[[test]]
name = "fragmentation_roundtrip"
required-features = ["peer"]

[[test]]
name = "gossip_introduces"
required-features = ["gossip"]

[[test]]
name = "group_roundtrip"
required-features = ["group", "peer"]

[[test]]
name = "interceptors"
required-features = ["interceptors", "peer"]

[[test]]
name = "interceptors_declare"
required-features = ["interceptors", "liveliness", "peer"]

[[test]]
name = "interceptors_query"
required-features = ["interceptors", "peer", "query", "queryable"]

[[test]]
name = "interceptors_subject"
required-features = ["interceptors", "peer"]

[[test]]
name = "link_kinds_roundtrip"
required-features = ["peer", "transport_tls", "transport_ws", "transport_unixsock-stream"]

[[test]]
name = "listen_set"
required-features = ["peer"]

[[test]]
name = "listener_auth"
required-features = ["peer"]

[[test]]
name = "listener_auth_zenohd_interop"
required-features = ["peer"]

[[test]]
name = "local_delivery_thread"
required-features = ["peer"]

[[test]]
name = "locality_roundtrip"
required-features = ["peer", "query", "queryable"]

[[test]]
name = "parallel_faces_roundtrip"
required-features = ["peer"]

[[test]]
name = "peer_put_routing"
required-features = ["peer"]

[[test]]
name = "put_cost"
required-features = ["peer"]

[[test]]
name = "redial_zenohd_interop"
required-features = ["peer"]

[[test]]
name = "scouting_autoconnect"
required-features = ["peer", "scout"]

[[test]]
name = "scouting_open"
required-features = ["peer", "scout"]

[[test]]
name = "scouting_ttl"
required-features = ["scout"]

[[test]]
name = "session_roles"
required-features = ["peer"]

[[test]]
name = "source_info_roundtrip"
required-features = ["peer"]

[[test]]
name = "timestamp_roundtrip"
required-features = ["peer", "timestamping"]

[[test]]
name = "transport_events_roundtrip"
required-features = ["peer"]

# R2103 (open-debt item 521) — build.rs gives the cdylib its SONAME. Without
# one, a consumer that links this artifact by path records that absolute
# build-time path in DT_NEEDED and cannot redistribute what it built, which for
# a crate whose whole claim is "binary drop-in for zenoh-c" is the claim itself.
[build-dependencies]
wz-cdylib-build = { path = "../wz-cdylib-build" }

[features]
# The capabilities, each one feature of this crate and of the model under it: on in a default
# build, so the drop-in exports what zenoh-c does, and off for a deployer who wants the textbook
# minimum. A capability that is off is not linked: neither the ABI doors nor the plane behind
# them are compiled in (`wz-capi-core` is taken without its default features, so a capability
# reaches it only through the feature below). The names are `wz-capi-pico`'s, for the same
# reason: one vocabulary across the C ABIs. The link kinds, the handshake methods and the
# counters are the exception, and carry zenoh-c's own feature names (`transport_tls`,
# `auth_pubkey`, `stats`, ...): they are switches a zenoh-c build is asked for by name, and the
# pico ABI forwards its links under names of its own. Each is on by default exactly when it is
# in zenoh-c's own default set.
default = [
    "link-udp",
    "timestamping",
    "peer",
    "scout",
    "query",
    "queryable",
    "liveliness",
    "liveliness-get",
    "advanced",
    "group",
    "gossip",
    "transport_tls",
    "transport_quic",
    "transport_quic_datagram",
    "transport_ws",
    "transport_unixsock-stream",
    "transport_multilink",
    "auth_pubkey",
    "e2e-sender",
    "transport_compression",
    "auth_usrpwd",
    "interceptors",
    "multicast-transport",
]
# The roles beyond the client: a listener, a router or a peer, and the gossip that introduces
# the nodes of a mesh. A build without them opens a client session to the endpoints it dials.
peer = ["scout", "wz-capi-core/peer"]
# A `udp/` endpoint to dial; `scout` implies it, the scouting group being a UDP one.
link-udp = ["wz-capi-core/link-udp"]
# The node's clock, which a role that stamps its messages holds (a zenoh router does by default,
# a peer or client when its `timestamping` config enables it). Off, a node holds no clock and
# the config key that asks for one is refused where upstream's would be honoured.
timestamping = ["wz-capi-core/timestamping"]
# `z_scout`, the hello family, and a client finding its router by scouting.
scout = ["link-udp", "wz-capi-core/scout"]
# `z_get` and the querier, the requesting end of a query.
query = ["wz-capi-core/query"]
# `z_declare_queryable` and the replies, the answering end of a query.
queryable = ["wz-capi-core/queryable"]
# The liveliness token and subscriber.
liveliness = ["wz-capi-core/liveliness"]
# The snapshot get of the liveliness plane; it is a query.
liveliness-get = ["liveliness", "query", "wz-capi-core/liveliness-get"]
# The advanced publisher and subscriber, with the plane they replay through.
advanced = ["liveliness", "queryable", "timestamping", "wz-capi-core/advanced"]
# The group membership of zenoh-ext.
group = ["wz-capi-core/group"]
# A session told of a node by one it holds a link to dials it.
gossip = ["peer", "wz-capi-core/gossip"]
# Open-debt item 913 — a UDP multicast group in `listen/endpoints`, joined as one transport to
# every member of the group, as zenoh's runtime joins one (its listener of a multicast locator).
multicast-transport = ["link-udp", "peer", "wz-capi-core/multicast-transport"]
# The `tls/` link, dial and accept. A session reads the certificate material of
# `transport/link/tls` (`root_ca_certificate`, `listen_certificate`, `listen_private_key`, each a
# path) when it opens, and a path it cannot read fails the open; a `tls/` dial verifies the name
# it dials against the peer's certificate, as upstream does when `verify_name_on_connect` is
# left unstated.
transport_tls = ["wz-runtime-tokio/transport-link-tls", "wz-capi-core/transport_tls"]
# The `quic/` link, over the same certificate material as `tls/`.
transport_quic = ["wz-runtime-tokio/transport-link-quic", "wz-capi-core/transport_quic"]
# The `quic-datagram/` link, on the `quic/` link's connection.
transport_quic_datagram = ["transport_quic", "wz-capi-core/transport_quic_datagram"]
# The `ws/` link, dial and accept.
transport_ws = ["wz-capi-core/transport_ws"]
# The `unixsock-stream/` link, dial and accept, on a Unix target.
transport_unixsock-stream = ["wz-capi-core/transport_unixsock-stream"]
# The multilink establishment extension. A session holds one link per peer, which is what
# upstream does at its default `transport/unicast/max_links` of 1.
transport_multilink = ["wz-capi-core/transport_multilink"]
# The public-key handshake: a config stating the RSA identity of `transport/auth/pubkey`
# presents it to the peers the node dials and asks it of the peers the node accepts. As
# upstream's, the set of peer keys a node built from its config admits is empty, so such a node
# reaches the peers it dials and admits no peer that dials it. A build without the feature
# refuses a config that states any of the four keys.
auth_pubkey = ["wz-runtime-tokio/access-extauth-pubkey", "wz-capi-core/auth_pubkey"]
# The links zenoh-c leaves out of its default set, and so does this crate: `serial/`, the
# `unixpipe/` named pipe (Unix), and `vsock/` (Linux).
transport_serial = ["wz-capi-core/transport-link-serial"]
transport_unixpipe = ["wz-capi-core/transport-link-unixpipe"]
transport_vsock = ["wz-capi-core/transport-link-vsock"]
# The per-link transport counters, off by default as zenoh-c's are. The counts are kept on each
# session's link state (`SessionLinkActions::stats_report` in the runtime) and no door of this
# ABI reads them: zenoh-c has no C surface for them either, and reports them through its admin
# space, which this ABI does not serve.
stats = ["wz-capi-core/transport-stats"]
# zenoh-c's own build flags change its ABI, so wz's must be able to follow.
# `Z_FEATURE_UNSTABLE_API` and `Z_FEATURE_SHARED_MEMORY` are INDEPENDENT axes,
# so "zenoh-c" names one of FOUR builds; the id for each is the argument
# `scripts/install-zenoh-c-arm.sh` takes.
#
# ⚠ WHICH ONE UPSTREAM SHIPS IS NOT RESTATED HERE, and open-debt item 612 is
# why: this table asserted it, the assertion was wrong, and a consumer opening
# this file to choose a feature read the wrong one. It has ONE home now —
# `scripts/lib/zenoh_c_archive_arm.py`, which derives it from upstream's own
# release workflow and from the installed header, and which adjudicates every
# sentence in this tree that states it, this paragraph included.
#
# ⚠⚠ R2278 MEASURED the pairing, and it does not match. The default feature
# set models the `unstable` arm; the published archive is the `unstable-shm`
# build (both axes on, at 1.5.0 and at 1.10.0 alike — the two packages were
# fetched and their `zenoh_configure.h` read). A default-featured build linked
# against that package's headers therefore pairs one arm's declarations with
# another arm's footprints. Add `zenoh-c-shared-memory` to match it.
#
# ⚠⚠⚠ R2286 (open-debt item 616) — the DEFAULT does NOT move, and the reason
# is structural rather than a preference. Cargo features are ADDITIVE, so this
# set has to sit at the ORIGIN of both axes: with it empty every one of the
# four builds is `default + <features>`; with `zenoh-c-shared-memory` in it,
# the two builds without that axis would be reachable only through
# `--no-default-features`, which any dependent enabling the default hands
# straight back — so the library would be the wrong SIZE in exactly the
# configuration a consumer assembles by accident.
# The divergence that leaves is therefore INTENT, and it is PRICED rather
# than merely declared: `scripts/lib/zenoh_c_archive_arm.py` refuses a default
# that puts a build out of additive reach, refuses a feature in this table it
# cannot classify, refuses a selector that subtracts instead of adding, and
# refuses all of it unless a named lane leg RUNS the set that reaches what
# upstream ships.
#
# This feature selects the no-unstable axis.
zenoh-c-no-unstable-api = []
# R311y540 — the OTHER axis. `Z_FEATURE_SHARED_MEMORY` moves EIGHT of the types
# this crate declares (`z_owned_bytes_t` 32 -> 40, `z_owned_sample_t` +16, ...),
# independently of `Z_FEATURE_UNSTABLE_API` and additively with it. It was found
# while measuring the unstable arm: the 40-byte `z_owned_bytes_t` this crate had
# attributed to unstable since R311y498 is the SHM number.
#
# LAYOUT ONLY. This feature makes wz's structs the right SIZE for a program
# compiled against an SHM-built zenoh-c header; it does NOT export the SHM API
# surface, so a program that actually calls `z_shm_*` still will not link. The
# configuration it serves is the common one — a program built against an SHM
# header that uses none of the SHM entry points.
#
# R2259 (open-debt item 593) — "layout only" now has a MEASURED edge, and the
# two symbols on it are here because they ARE layout. `Z_FEATURE_SHARED_MEMORY`
# widens `z_owned_transport_t` from 19 bytes to 20, and the twentieth byte comes
# with the two doors that write and read it: `zc_internal_create_transport_shm`
# (which REPLACES the five-argument constructor upstream compiles out on this
# arm) and `z_transport_is_shm`. Both are transport accessors rather than
# allocator entry points, and both are `#if`-gated on this same flag in
# `zenoh_commons.h`. The 85 SHM symbols that remain missing on this arm are the
# provider/allocator plane, which is still not exported and is still item 593's.
#
# OFF by default, and R2278 measured that this is a DIVERGENCE rather than a
# match: the published standalone archive is the `unstable-shm` build, which
# carries this axis. See the ⚠⚠ paragraph at the head of this table.
#
# R2299 (open-debt item 607) — the SHM CLIENT registry's POSIX member ATTACHES to a
# segment another process published. It first did so with `mmap` through `libc` of its
# own; it now attaches through the runtime's `posix_shm`, the one implementation of
# upstream's segment, which is a `/dev/shm` mapping on Unix and a named file mapping on
# Windows. This arm therefore names no platform dependency, and builds on
# `x86_64-pc-windows-msvc`, where the published zenoh-c archive carries this axis too.
# R2954 — and the runtime's POSIX segment PROTOCOL: `zc_cleanup_orphaned_shm_segments`
# is that protocol's own orphan cleanup. R2954 and R2970 took it WITHOUT the SHM
# transport, because a zenoh peer that agreed on SHM would have sent Puts laid out
# as slices, which the generated Put codec could not read (item 823). That has not
# been true since the layout was adopted, so R3052 takes the transport too:
# `session-extshm` is the negotiation and the data path, and `session::session_offer`
# stages the offer from the node's `shared_memory` key.
# R3059 -- and the model's own SHM feature, for the reason `transport-qos` is named on the
# dependency below: the transport snapshot reads `is_shm` from the session's actions only
# when it is built, so `z_transport_is_shm` read `false` for every session whatever it had
# negotiated; and the model's SHM publish (`publish_shm_all`) exists only when it is.
zenoh-c-shared-memory = ["wz-runtime-tokio/session-extshm", "wz-capi-core/session-extshm"]
# The sending side of an end-to-end protected message (`wz_capi_c_e2e_sender_*`, eight wz-own
# doors with no upstream counterpart). On by default so the library exports what it did; a build
# that only queries leaves it out, and with it the frame writer of `wz-capture` (212 KB of that
# build's 1.9 MB of symbols).
e2e-sender = ["dep:wz-capture", "wz-capi-core/e2e-sender"]
# The batch compression session extension. Off, a session neither offers nor accepts it, as a
# zenoh-c built without `transport_compression` does.
transport_compression = ["wz-capi-core/transport_compression"]
# The user/password handshake method and the credential check of a listener that names a
# dictionary file. Off, neither is built, as in a zenoh-c built without `auth_usrpwd`.
auth_usrpwd = ["wz-capi-core/auth_usrpwd"]
# The traffic policy a node's config states (`access_control`, `low_pass_filter`, `downsampling`),
# compiled and enforced on every face. Off, a config that states one fails the open.
interceptors = ["wz-capi-core/interceptors"]

[dependencies]
# The ABI stamp this artifact carries as an ELF note (beside `WZ_CAPI_C_ABI_REVISION` in `abi.rs`).
wz-abi-stamp = { path = "../wz-abi-stamp" }
# The ABI-neutral session model, shared with wz-capi-pico.
#
# R2970 — `transport-qos` so its transport snapshot reports what a zenoh-c
# session now negotiates: QoS is on by default upstream, and `z_transport_is_qos`
# read `false` for every session because the ext was not built here at all.
#
# `access-extauth-usrpwd` and `interceptors`: the credentials and the traffic policy (`access_control`,
# `low_pass_filter`, `downsampling`) a zenoh-c node's config states are enforced, not accepted and
# dropped.
wz-capi-core = { path = "../wz-capi-core", default-features = false, features = ["rx-busy-poll", "transport-qos"] }
# `query-reply-err` is DECLARED rather than inherited from the default set, and
# R311y568 is why: `z_query_reply_err` routes through
# `ReplyOut::reply_err`, whose body is `#[cfg(feature = "query-reply-err")]` and
# whose OFF arm discards its arguments SILENTLY. A build that turned the default
# set off would link the symbol and answer nothing — the vacuous-proof shape this
# tree names. Naming the gate here makes the dependency explicit at the one place
# that could otherwise drop it.
# `transport-fragmentation` is selected EXPLICITLY, and the reason is MEASURED on this
# ABI: a consumer's `z_put` of 3027 bytes to a device whose InitAck advertised a
# 1450-byte batch left as ONE batch of 3056 bytes, the process answered `Z_OK` and
# `sent`, and the device saw nothing; genuine zenoh-c splits the same value into
# fragments of 1448, 1448 and 152. The feature is NOT in `wz-runtime-tokio`'s default
# bundle and its absence is SILENT at the C ABI: without it the frame writer has no
# fragment path, and a frame past the negotiated budget "leaves whole"
# (`wz-session-core`, `emit_frame_or_fragments`). `wz-capi-pico` had been measured
# with the same symptom (R311y484) and selects it; this crate had not carried the
# lesson over. It brings `reassembly` with it, which this crate also needs: it is
# BOTH peers in a drop-in topology, so a TX-only build would fragment into a peer
# that cannot rejoin. Gated by `tests/fragmentation_roundtrip.rs`, which reads the
# WIRE through a recording relay and asserts no transport frame exceeds the
# negotiated batch.
# A value larger than the reassembly slot (1 MiB) is REFUSED before it is sent
# rather than fragmented into a chain no peer of this build could stage.
#
# `default-features = false`, as `wz-capi-pico` takes it and for the same reason: the runtime's
# default bundle is the whole of query, liveliness and accepting, and a dependency that names
# them makes them every build's, however slim the ABI asks to be. Each capability reaches the
# runtime through the feature of this crate that stands for it (`query`, `queryable`,
# `peer`, ...), which forwards to the core's, and `query-reply-err` with them: the core's
# `queryable` and `query` features name it, so the R311y568 hazard (a reply that links and
# answers nothing) is closed where the capability is chosen and not here.
wz-runtime-tokio = { path = "../wz-runtime-tokio", default-features = false, features = [
    "routing-accept",
    "transport-fragmentation",
    # R2172 (open-debt item 548) — `zenoh_config`, which is where
    # `HONOURED_CONFIG_KEYS` lives. Named UNCONDITIONALLY on purpose: the door
    # this feeds (`wz_capi_c_config_honoured`) reports which config keys wz's
    # JSON5 reader honours, and a door that existed only in some builds would
    # leave a consumer back where item 548 found it -- parsing the module and
    # getting an empty set when it moves. A symbol a caller cannot rely on
    # finding is not an answer.
    "zenoh-config",
    # R2970 — the unicast capabilities a zenoh-c session offers from its config
    # (`session::session_offer`). Upstream compiles QoS and lowlatency into every
    # build and compression into zenoh-c's default one, and reads each from
    # `transport/unicast/*`; the session only offers what is built, and an offer
    # for a capability that is not is refused at the open rather than dropped.
    # `session-extqos` carries the endpoint's own QoS band, which upstream's
    # opener reads off every endpoint it dials.
    "session-extqos",
    "transport-lowlatency",
    # Compression and the user/password method are not named here: each is a capability of this
    # crate (`transport_compression`, `auth_usrpwd`), on by default as upstream compiles them
    # into its default build, and reaches the runtime through the core's feature of that name.
] }
# The frame writer behind `e2e_sender`, the sending side of an end-to-end
# protected message. `default-features = false` and nothing named, for the rule
# `wz-runtime-tokio`'s own `wz-capture` line states: Cargo unifies features across
# the whole graph, so this crate's defaults would become `wz-session-core`'s
# defaults here, and a build that never asked for a codec would get it. The
# writer needs none (`e2e_json` has no feature gate), and a build with the
# defaults off compiles it.
#
# `reassembly` is named for the reverse reason: `transport-fragmentation` above turns
# on `wz-session-core/reassembly`, which adds the `Carried::Fragment`,
# `Reassembled` and `FragmentWithoutResolution` variants, and `wz-capture` matches
# `Carried` exhaustively under ITS OWN `reassembly` feature. With the two out of
# step this crate stops compiling (E0004 in `wz-capture/src/agg.rs`), so the feature
# that adds the variants and the feature that handles them are selected together,
# as `wz-runtime-tokio`'s `wz-capture` line does.
#
# Optional, behind `e2e-sender`: a client that only queries never sends an end-to-end protected
# message, and this crate was 212 KB of the 1.9 MB of symbols of its minimal library.
wz-capture = { path = "../wz-capture", default-features = false, features = ["reassembly"], optional = true }

[dev-dependencies]
# R311y867 — for `free_port()`, which three test files here used to carry a
# private copy of. The copies were a bind-read-DROP probe whose port was handed
# to `z_open` afterwards, and the gap between the two is what took Layer C1cc
# red on run 32198505957. This crate already depends on wz-runtime-tokio, so the
# dev-dep adds no graph the tests were not already building.
# `tls-fixtures` for the self-signed `localhost` certificate `link_kinds_roundtrip` hands a
# `tls/` listener by path, the fixture wz-capi-pico's TLS tests use.
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support", features = [
    "tls-fixtures",
] }
# R3070 -- `scouting_open` answers a session's Scout with the runtime's own responder, on a
# runtime of its own, so the finding half is pinned alone. (R3071 made a session answer for
# itself, and two rows there use one; the stand-in stays for the rows that need a node whose zid
# and locator are the test's to choose.) Dev-only; both are already in the graph.
wz-runtime-tokio = { path = "../wz-runtime-tokio", features = ["scouting-responder"] }
# `listener_auth` dials a listener with a usrpwd initiator (`UsrPwdMethod`, `AuthDispatch`),
# which the runtime does not re-export. Dev-only; the crate is already in the graph.
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["access-extauth-usrpwd"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
# R2300 (open-debt item 631) — for `config_verdict_zenohd_interop`, which has to
# hand a real zenohd a config FILE: zenoh dispatches its parser on the file
# extension, so the document cannot go over a pipe. Dev-only, and already in
# `crates/Cargo.lock` via wz-integration-tests, which stages its configs the
# same way for the same reason.
tempfile = "3"

# `scouting_ttl` reads the IP TTL of a Scout off a receiver joined to the group, which is
# `IP_RECVTTL` and `recvmsg`: no std spelling, and the test is Linux only. The optional `libc`
# above is for the SHM arm; this is the dev-only half and is already in `crates/Cargo.lock`.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
