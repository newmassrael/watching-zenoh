# SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael
#
# wz-rest — the §5.26 REST -> zenoh bridge (rest-http-bridge): a light,
# HAND-ROLLED HTTP/1.1 server (ZERO external HTTP dependency) that translates
# HTTP requests into wz Session operations:
#   GET/POST  -> Session::query   (JSON reply array, or raw with `?_raw`)
#   PUT/PATCH -> Session::publish  (Put; Content-Type -> encoding)
#   DELETE    -> Session::publish  (Del)
# The compile-time-composed superset of zenoh's `zenoh-plugin-rest` (which is a
# dlopen `.so` plugin over `tide`): no plugin host-trait / ABI gate / lifecycle
# FSM — the whole bridge is gated behind the `rest-http-bridge` cargo feature
# and, being std/AP-only, lives in its own crate so no_std/MCU builds never pull
# it (MCU-safe by construction). Trusted-localhost scope: bind 127.0.0.1 is a
# network-exposure boundary, NOT authentication (see the crate-level docs).
[package]
name = "wz-rest"
version.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "REST -> zenoh HTTP/1.1 bridge (zenoh-plugin-rest superset; hand-rolled, zero HTTP dep, AP-only)."

[lib]
name = "wz_rest"
path = "src/lib.rs"

[dependencies]
# The wz session runtime that owns query/publish + the TokioSession type. The
# feature list is the EXACT set the bridge calls through (verified by the design
# panel's direct read): query-get (Session::query), codec-push (PUT/DELETE emit
# the Put/Del wire frame — WITHOUT it publish silently returns Ok(0)),
# codec-response-final (the wire ResponseFinal decode so a GET's on_final fires
# and the response completes), query-timeout (bound a GET so a silent queryable
# does not hang the connection), transport-unicast (query/publish are Unicast-
# only), pubsub-encoding (Content-Type -> encoding on PUT), query-consolidation
# + query-selector-parameters (mirror the ?-selector + Latest consolidation).
# Defaults are left ON (this crate is AP-only, so the heavier default set is
# free here); the list only ADDS the non-default gates the bridge needs.
#
# `rest-http-bridge` is NOT one of those call-through gates — it is the marker
# that tells wz-runtime-tokio's plugin registry the bridge is compiled into this
# binary, and it is declared HERE because that is where the fact is structural:
# a build in which this crate is linked IS a build carrying the bridge, so the
# registry cannot report `rest` absent while the bridge is present. Naming it
# only in the `wz` facade would leave any build that reaches this crate by
# another route with a registry that silently omits the bridge it carries.
wz-runtime-tokio = { path = "../wz-runtime-tokio", features = [
    "rest-http-bridge",
    "transport-unicast",
    "query-get",
    "codec-response-final",
    "codec-push",
    "query-timeout",
    "pubsub-encoding",
    "query-consolidation",
    "query-selector-parameters",
] }
# R311y501 NOTE — the two features the round's new renderings need,
# `pubsub-timestamp` (the JSON `timestamp` field) and `query-value` (the
# request BODY forwarded as the query VALUE), are DELIBERATELY ABSENT from the
# list above. Both are already in wz-runtime-tokio's `default` set
# (Cargo.toml's `default = [...]`, verified by removing them here and re-reading
# `cargo tree -p wz-rest -e features` — they still resolve), and this crate
# leaves defaults ON, so pinning them would be a no-op that reads as
# load-bearing. Recorded rather than silently omitted because BOTH are
# silent-no-op shapes if they ever leave the default set: the accessors
# (`ReplyView`/`SampleView::timestamp`) and the setter
# (`QueryOptions::with_payload`, ungated for signature stability) all still
# compile with the feature off and simply carry nothing.
# The keyexpr canonicaliser (path -> validated keyexpr, the 400-on-invalid gate)
# + the encoding <-> MIME tables (Content-Type mapping + the JSON `encoding`
# field). Not re-exported through wz-runtime-tokio's encoding path, so depended
# on directly.
wz-session-core = { path = "../wz-session-core" }
# The async runtime. Mirrors wz-runtime-tokio's own tokio feature choice; net +
# io-util for the TcpListener/stream, time for the per-connection read timeout,
# sync for the reply-collection oneshot.
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time"] }

[features]
# The SSE half (Accept: text/event-stream GET -> declare_subscriber, streaming
# each sample as an SSE event). Gated so a build can carry the request/response
# bridge WITHOUT the streaming subscriber; pulls the subscriber + Put/Del
# receive features the SSE path calls through.
rest-sse-subscribe = [
    "wz-runtime-tokio/declare-subscriber",
    "wz-runtime-tokio/pubsub-put",
    "wz-runtime-tokio/pubsub-delete",
]
# The bridge's OWN entry on the adminspace (`src/admin.rs`): the `rest` plugin
# record + its `status/plugins/rest/{version,port}` sub-tree, the wz analogue of
# `zenoh-plugin-rest`'s `adminspace_getter`. Gated because a build can want the
# bridge without an adminspace to advertise it on, and because `AdminPlugin`
# lives in `wz_session_core::adminspace`, a module that is itself
# `#[cfg(feature = "adminspace-core")]` — so the record cannot be built without
# it. ONE forward: wz-runtime-tokio's own feature composes `adminspace-core`
# down to wz-session-core, and it is also what brings `compiled_plugins` (the
# registry this record folds over) and `declare_adminspace_with_live_inputs`,
# which the crate's `rest_admin_plugin_e2e` names.
#
# ⚠ The second forward this line used to carry was justified by a claim that
# did not survive measurement — that the `AdminPlugin` / `AdminPluginStatusLeaf`
# TYPES needed it. They are ungated, but they are ungated INSIDE a gated
# module, so reaching them still takes the feature. Removing the gate on that
# reading failed to compile, which is the only reader that settles a path.
adminspace-plugins-handlers = ["wz-runtime-tokio/adminspace-plugins-handlers"]

[dev-dependencies]
# The integration test drives the bridge over a real TCP socket against a live
# wz node; it needs the multi-thread runtime + macros to spawn the drive loop
# and the bridge concurrently, and a peer to answer the WIRE path (not loopback).
tokio = { version = "1", features = ["full"] }
# The session-open fixture params for the two in-process test sessions (same
# helper query_reply_e2e uses). The answerer-side session ops (declare_queryable
# / declare_subscriber / receive Put+Del over the wire) are already covered by
# wz-runtime-tokio's default feature set that this crate depends on.
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support" }
