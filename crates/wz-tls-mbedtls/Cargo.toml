#
# wz-tls-mbedtls -- the fixed-memory profile's secure channel (decision D9 of
# docs/session-lifecycle-intent.md): TLS 1.3 with mutual authentication over Mbed TLS's PSA
# Crypto line, each end pinned by the zid of its key, every allocation from one static arena.
#
# The backend behind the cooperative runtime's stream port: `TlsStream` is a `StreamSocket` over
# another one and `TlsDial` a `StreamDial`, so the stream link runs over the channel unchanged.
#
# Mbed TLS is the revision the Zephyr workspace pins (4.1.0 with TF-PSA-Crypto 1.1.0), as the
# git submodules `vendor/mbedtls` and `vendor/tf-psa-crypto`. With `vendored` (the default)
# build.rs builds it through its own CMake with this crate's configuration (`config/`), the
# pattern of `zenoh-pico-sys`, and compiles the channel's C side (`csrc/wz_tls.c`) beside it. An
# image whose platform carries Mbed TLS (Zephyr) turns `vendored` off and compiles
# `csrc/wz_tls.c` in its own build, against that library.

[package]
name = "wz-tls-mbedtls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "The fixed-memory profile's secure channel: TLS 1.3 mutual authentication over Mbed TLS, pinned by key-derived zid."
build = "build.rs"
links = "wz_tls_mbedtls"

[dependencies]
# The stream port the channel implements (`stream_link::StreamSocket`, `StreamDial`) and the
# dial's error (`session_drive::LinkOpenError`).
wz-runtime-coop = { path = "../wz-runtime-coop", default-features = false, features = ["session-unicast"] }
# This crate IS a secure channel, so it states one: `secure-channel` is the marker the lifecycle
# verbs need before they compile (decision D2), and a cooperative build gets it from here and
# from nowhere else.
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["no_std", "secure-channel"] }

[build-dependencies]
# The pinned Mbed TLS through its own CMake, as zenoh-pico-sys builds zenoh-pico.
cmake = "0.1"
# The channel's C side, compiled against the library just built.
cc = "1"
# The source paths handed to CMake: not the verbatim `\\?\` form on Windows.
dunce = "1"

[dev-dependencies]
# The host's TCP, for the dial against a peer in another thread.
wz-runtime-posix = { path = "../wz-runtime-posix" }
# The peer zenohd 1.10.1 is: rustls 0.23 with webpki's client verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The peer's self-signed certificate, as a zenoh router's operator makes one.
rcgen = "0.13"

[features]
# `wz-runtime-coop`'s session tier needs a form of its task pool, and the two forms are mutually
# exclusive selectors; the default is the heap form, as `wz-runtime-posix`'s is, so a
# workspace-wide build finds this crate buildable. This crate has no heap code of its own.
default = ["alloc"]
alloc = ["wz-runtime-coop/alloc"]
# The slot profile, for a program built with the defaults off.
session-slot = ["wz-runtime-coop/session-slot"]
# Build the pinned Mbed TLS and the channel's C side here, from the submodules `vendor/mbedtls`
# and `vendor/tf-psa-crypto`. A choice of the final program, not a default, as `vendored` is
# across the ecosystem: the host image and this crate's own tests (whose test leg names it) turn
# it on, an image whose platform carries Mbed TLS (Zephyr) compiles `csrc/wz_tls.c` itself, and a
# workspace-wide build that only checks the Rust needs neither the C toolchain nor the
# submodules.
vendored = []
# The session lifecycle verbs on the cooperative runtime. Offered here, by the channel, because
# they compile only beside one (decision D2): this crate always states `secure-channel`, so every
# build that has the verbs through it has the channel too. The runtime offers no such feature.
session-close-ingress = ["wz-session-core/session-close-ingress"]

[lints]
workspace = true
