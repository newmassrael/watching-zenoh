#
# gc-3c example switchboard sidecar: maps zenoh keyexprs to sensor_monitor
# SCXML domain events. The temp row is a VALUE binding (it names a codec),
# so an inbound sample's payload is decoded into the typed _event.data; the
# door row is a SIGNAL binding (no codec), injected with an empty _event.data.
machine: sensor_monitor
bindings:
  - keyexpr: home/*/temp
    event: temp_update
    codec: temp_payload
  - keyexpr: home/*/reset
    event: reset
