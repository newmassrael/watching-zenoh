# SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael
#
# wz-capi-coop — the cooperative engine behind a wz C ABI.
#
# A C session is one session-core session, stepped by the program: no OS thread
# and no async runtime of its own. The program's own calls drive it, as zenoh-pico's
# single-threaded arm does (`zp_read`, `zp_spin_once`), and a read task, when the
# program starts one, is a thread that makes the same calls
# (docs/capi-pico-on-coop-engine.md, decisions D2 and D8). It implements the
# port's `SessionEngine` and `SessionDrive` (`wz-capi-port`), so the ABI over it
# names neither this crate's types nor the tokio engine's.
#
# Built over the session shell's heap profile (`wz-session-mcu`, `wz-runtime-coop`)
# and generic over the network stack (`SessionLinks`): a host gives it its sockets
# (`wz_runtime_posix::links::PosixLinks`), a test the in-memory network.
#
# `rlib` only: a Rust-internal seam, like `wz-capi-core` and `wz-capi-port`.

[package]
name = "wz-capi-coop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The cooperative engine behind a wz C ABI: one session the program steps, implementing the C ABI's engine port."
publish = false

[lib]
name = "wz_capi_coop"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# The port, without its host half: `std` below asks for it (src/lib.rs, "Where it builds").
wz-capi-port = { path = "../wz-capi-port", default-features = false }
# What a zenoh-pico client does on a session: publish (Put and Delete, with every
# metadata field of pico's stable API), declare key expressions and subscribers and retract them, ask a
# router who subscribes or answers (the write filter and the matching status),
# batch, keep the lease, fragment what does not fit a batch and put back together
# what arrives fragmented, and match key expressions with their wildcards. The
# set is the tokio engine's session base (`wz-capi-core`'s `wz-runtime-tokio`
# features) less the local loop, which this engine does not have: zenoh-pico's
# default build delivers nothing locally (`Z_FEATURE_LOCAL_SUBSCRIBER` 0).
# The KeepAlive and Close codecs are named here because nothing below brings them, and without
# them the session's keep-alive and close are sent as nothing and a router's Close is not read.
# `transport-tx-lend` is the seam by which a frame is encoded into a slot its link lends: the
# engine lends every link its slots from the session's arena (`arena`), so a send builds no frame
# on the heap while a slot is free. A link that lends none still sends: the session builds its
# frame itself and counts why, unless the build selects `tx-lend-only` below.
# `rx-lent-control`: every record of a frame the engine reads in place is lent to the session's
# tables, the declarations, interests and response finals too, so the build links no owned decode
# of a frame's records (the receive is in place, below; `transport-stats` keeps its counters').
# The queryables a peer declares (`declare-queryable`) are not here: a querier's write filter and
# matching status read them and a queryable declares its own, so `query` and `queryable` name them,
# and a client with neither links no table of them, no dispatch to it and no listener on it.
# Nor is a Push's source info (`pubsub-source-info`): pico's API sets and reads it only with its
# unstable API, so the C ABI's `unstable-api` names it, and a build without it neither writes the
# extension nor decodes it from what it receives.
# A group the host did not join says why through the session core's diagnostics (`diag`), which
# a build turns into records with `wz-session-core/log` and leaves out otherwise.
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "alloc",
    "transport-tx-lend",
    "rx-lent-control",
    "codec-keep-alive",
    "codec-close",
    "codec-push",
    "codec-declare",
    "transport-fragmentation",
    "pubsub-put",
    "pubsub-delete",
    "pubsub-encoding",
    "pubsub-timestamp",
    "pubsub-attachment",
    "pubsub-qos",
    "pubsub-priority",
    "pubsub-congestion-control",
    "pubsub-express",
    "declare-final",
    "declare-keyexpr",
    "declare-subscriber",
    "declare-undeclare",
    "declare-interest",
    "session-matching",
    "transport-batching",
    "keyexpr-wildcard-single",
    "keyexpr-wildcard-double",
    "keyexpr-dollar-star",
    "keyexpr-includes",
] }
# `host-lock` comes with `std` below: on a host the runtime's critical sections are a lock of the
# process and no `critical-section` implementation is linked (wz-runtime-coop's src/cs.rs); an MCU
# image links its own.
# The receive is in place (`rx-in-place`): each inbound datagram is read where the link's buffer
# holds it, its records handed to the session's tables lent and one at a time, so a link keeps a
# datagram its session stopped in and none is copied to wait (the delivery lane's gate). The one
# receive of the C ABI's engine.
wz-runtime-coop = { path = "../wz-runtime-coop", default-features = false, features = [
    "alloc",
    "rx-in-place",
    "transport-batching",
] }
# The engine's 64-bit counters (entity ids, link generations): native where the target has a
# 64-bit atomic, a critical section where it has not (a Cortex-M7 has 32-bit atomics only). The
# same features as wz-runtime-coop's, so the two resolve to one build of it.
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"] }
# The queues of the delivery lane (`lane::SharedLane`), generated from their SCE document into
# `out/wz-capi-coop/`, name the runtime's queue and codec types.
sce-forge-runtime = { path = "../../vendor/sce/backends/rust/forge-runtime", default-features = false }
# The session shell's action bundle, its group session and the application layer's dispatch.
wz-session-mcu = { path = "../wz-session-mcu", default-features = false, features = [
    "alloc",
    "dial",
    "transport-keepalive",
    "reassembly",
] }

# The host's own multicast sockets, without `std`: the interface table, a scouting window's sockets
# and a group's two sockets made by its locator's keys (`host-multicast`), over the POSIX kernels'
# calls or Winsock (`scout` and `group-host` below). Optional, so a build that neither scouts on a
# host nor joins a host's group links none of it.
wz-runtime-posix = { path = "../wz-runtime-posix", optional = true, features = ["host-multicast"] }
# The secure channel (`tls-mbedtls` below): Mbed TLS, built from the pinned submodules.
wz-tls-mbedtls = { path = "../wz-tls-mbedtls", optional = true }

[features]
# The host: `std`'s mutex, threads and sleep behind the port's `os`, and the process's lock behind
# the runtime's critical sections. Without it the engine is `no_std` with `alloc` and the image
# supplies both (docs/upstream-parity.md section 5a).
default = [
    "std",
    "key-matching-listener",
    "threads",
    "tx-probe",
    "tx-expiry-run",
    "tx-fragment-credit",
    "tx-held-wait",
    "tx-stream-owed",
    "multicast-locator-keys",
    "query-replies-with-final",
    "accept-cookie",
    "face-send-places",
]
std = ["wz-capi-port/std", "wz-runtime-coop/host-lock"]
# A read task beside the program's calls (pico's multi-threaded arm): the session is stepped by a
# thread of its own, so a callback's call may end on one thread while another undeclares its row,
# and the rows count their calls on an atomic latch (`row_callback::Threads`). Off, which is
# pico's single-threaded arm, every call runs on the thread that steps the session: the latches
# count with no read-modify-write, an undeclaration waits for nothing, no read task starts, and a
# program that calls one session from two threads at once orders those calls itself, as it does
# on zenoh-pico's single-threaded arm.
threads = []
# The host without `std` (the pico C ABI's `os-host`, a POSIX host or Windows): the port's `os` and the
# runtime's critical sections made of the host's own calls (`os-sys`, `host-lock-sys`), so a host
# library built without `std` runs the read task and holds the locks as one with `std` does, and
# links no `critical-section` implementation, which it would export beside its C ABI.
host-sys = ["wz-capi-port/os-sys", "wz-runtime-coop/host-lock-sys"]
# Periodic jobs on the session (`SessionEngine::start_ticker`): a job run from the call that steps
# the session once its time has come, which the advanced publisher's heartbeat is. A build that
# starts none leaves it out, so the job table, the cut to a read's wait and the run after a step
# are not in its text (the capability-cost gate measures it).
ticker = []
# The ring the advanced publishers' caches keep their samples in (`ADVANCED_CACHE_BYTES`): one
# span of the session's arena, reserved and zeroed at its open, lent under a lock of its own
# (`wz_capi_port::CacheBytes`), so a cache's put copies its sample into the session's memory. A
# build with no advanced publisher leaves it out, and its plan has no row for it.
advanced-cache = []
# The advanced publishers and subscribers an ABI holds (`MAX_ADVANCED_PUBLISHERS`,
# `MAX_ADVANCED_SUBSCRIBERS`): a place of the session's arena for each, laid out at its open, and
# the ring their caches keep their samples in. A build with no advanced plane has no row for them.
advanced = ["advanced-cache"]
# Active multicast scouting (`Z_FEATURE_SCOUTING`): one Scout asked of the group, the Hellos that
# answer collected for a budget, on the host's sockets and the session's own window rules
# (`wz_session_core::scouting_host`). A window needs no session, so this is a plane beside the
# engine and not a method of its port. The window pins one ask socket to each interface that can
# carry multicast (`wz_runtime_posix::scouting`), which needs no `std`, so a host library without
# it scouts as one with it does.
scout = ["scout-datagram", "dep:wz-runtime-posix"]
# Active scouting over ONE datagram socket of the stack the engine runs on (`scout_datagram`),
# without `std`: zenoh-pico's window on a platform with no interface iterator (Zephyr), a socket the
# Scout leaves by and the Hellos come back to. The session's window rules and the two codecs, and
# the runtime's datagram socket trait the window is written over.
scout-datagram = [
    "wz-runtime-coop/session-unicast",
    "wz-session-core/scouting-active",
    "wz-session-core/codec-scout",
    "wz-session-core/codec-hello",
]
# The answering end of a query: a queryable, its replies (with their source info, encoding and
# attachment, and the error reply) and a query a C program keeps past its callback. What
# `wz-capi-core`'s `queryable` names on its runtime, named on session-core. A group's stage writes
# a reply and the final of a query's replies from their parts where they wait only under
# `wz-session-mcu`'s own names for the codecs, so the feature names them there too.
queryable = [
    "wz-runtime-coop/queryable",
    "wz-session-core/declare-queryable",
    "wz-session-core/query-queryable",
    "wz-session-core/reply-source-info",
    "wz-session-core/query-reply-err",
    "wz-session-core/query-source-info",
    "wz-session-core/query-attachment",
    "wz-session-core/query-selector-parameters",
    "wz-session-core/query-value",
    "wz-session-core/codec-request",
    "wz-session-core/request-put-del",
    "wz-session-core/codec-response",
    "wz-session-core/codec-response-final",
    "wz-session-mcu/codec-response",
    "wz-session-mcu/codec-response-final",
]
# Delivery to the session's own subscribers (zenoh-pico's `Z_FEATURE_LOCAL_SUBSCRIBER`): a put
# reaches the subscribers of the session that made it, after it has gone out on the link, and a
# write filter or a matching listener that counts the session's own entities counts them. Off,
# which is pico's default build, the session delivers nothing locally. It needs nothing of
# session-core that the engine does not already have.
local-subscriber = []
# A matching listener declared on a key rather than on an entity's write filter
# (`SessionEngine::declare_matching_listener`): it judges through a write filter of its own, so
# the session's filter table and its Interests take one row more for each matching listener. The
# pico C ABI declares every listener on its entity's filter and leaves it out, so its tables keep
# no such rows; without it the engine refuses the listener as not built.
key-matching-listener = []
# The listening role: a session that takes inbound links off the ports it listens on, each as a
# face of its own beside the dial role's (`CoopConfig::listen`). The link layer's listener is the
# stack's (`SessionLinks::open_listener`); a stack that gives none answers the endpoint as
# unsupported. Off, which is pico's client build, the engine is the dial role alone and its text
# has no acceptor, no table of ports and no wait on one (the capability-cost gate measures it).
# The session machine compiles its accepting role only under `session-unicast-accept`, so the
# feature asks the runtime for it: without that an acceptor would start on no event. A face
# dialled beside the dial role's (`attach_face`) is this build's too: every build of more faces
# than one shares the faces' rows in the session's pools (`peer-row-pools`), so a face that goes
# gives its set back at once. The links listen on `tcp/`; a `udp/` endpoint is `udp-listen`'s
# below, and without it the links refuse one as a scheme they do not carry. A peer's Interest on a
# unicast face is answered only with `interest-answer` beside it; the replay a new face is told ends
# with the `DeclareFinal` of the initial interest either way, as zenoh-pico's push to a new peer
# does.
listen = [
    "runtime-plan",
    "wz-runtime-coop/listen",
    "wz-session-core/peer-row-pools",
]
# `udp-listen`: the listening role on `udp/` too, the runtime's `udp-listen`, which gives the
# host's links a `udp/` listener, one socket whose peers are told apart by the address each
# datagram came from, each a face of its own. The open lends every udp port the rows of its peers
# and the slots of its datagrams (`CoopEngine::assemble`), so the runtime's ports are compiled in
# that form alone (`udp-port-lent-only`), and the session's plan lays those rows out for each
# `udp/` endpoint it listens on. A behaviour zenoh-pico's peer does not have: its POSIX link
# listens on no unicast `udp/` endpoint (`vendor/zenoh-pico/src/link/transport/udp/udp_posix.c` @
# `static z_result_t _z_udp_posix_listen(`). The pico ABI's capability of the same name
# (deploy/wz-config.toml) turns it on, which the zenoh-pico preset leaves off.
udp-listen = [
    "listen",
    "wz-runtime-coop/udp-listen",
    "wz-runtime-coop/udp-port-lent-only",
]
# `link-admission`: one link to a remote node when both dial, or one dials twice. Each link is
# given its place in the session's admission (the session core's `LinkRegistry`, laid out in the
# session's arena) before its handshake runs, and a second link to a node the session holds is
# refused there with `MaxLinks`, the link the node with the lower zid dialled being the one both
# ends keep. A behaviour zenoh-pico's peer does not have: each link it accepts or dials is a peer
# of its own (`vendor/zenoh-pico/src/transport/peer.c` @
# `z_result_t _z_transport_peer_unicast_add(`). The pico ABI's capability of the same name
# (deploy/wz-config.toml) turns it on, which the zenoh-pico preset leaves off: without it no link
# is asked about in its handshake, every link that ends its handshake is a face, and the build
# holds no admission, no book of its links' nodes and no row of the arena for them. Nothing the
# receive does for a message changes, only which links become faces.
link-admission = ["listen", "wz-runtime-coop/link-admission"]
# The answering end of a peer's Interest (`wz-session-core`'s `interest-answer`): what the
# application registers after a peer asked is staged for that peer's face before each drain. A peer
# asks a node that listens or joins a group: `group` turns it on, as zenoh-pico answers an
# Interest on a multicast transport, and `listen` does not, as zenoh-pico's unicast session answers
# none (`vendor/zenoh-pico/src/session/interest.c` @ `// Nothing to do on unicast`); the pico ABI's
# capability of the same name (deploy/wz-config.toml) names it beside `listen`, and the zenoh-pico
# preset leaves it off. A client that only dials answers no Interest and has none of it. The
# `DeclareFinal` of the initial interest that ends what a peer face is told when its link comes up
# (`CoopConfig::initial_interest`) is sent by a build that listens or answers, as zenoh-pico's peer
# ends its push to a new peer with it; a client build links none of that either. The feature is the
# request; the engine's code reads the core's own statement of what it built (`wz_interest_answer`,
# build.rs), since another crate of the graph can turn the core's on while this one is off.
interest-answer = ["wz-session-core/interest-answer"]
# The send's behaviours that zenoh-pico's transport does not have, each the session core's feature
# of the same name: on in this crate's own build, and named by the pico ABI's capabilities of the
# same names (deploy/wz-config.toml), which the zenoh-pico preset leaves off, so the engine of that
# preset links none of them.
#
# `tx-probe`: a publish that may not be dropped, on a listening session whose links share fewer
# outbound slots than they are, sends each face without waiting for a slot and waits for one with
# nothing of the session held. Without it each face is sent by the caller's own send, which waits
# with the session held, as zenoh-pico's peer writes each of its sockets under one transmit lock.
tx-probe = ["wz-session-core/tx-probe"]
# `tx-expiry-run`: the run of expiries that closes a session the expiry policy keeps.
tx-expiry-run = ["wz-session-core/tx-expiry-run"]
# `tx-fragment-credit`: the session's fragment budget and the stop fragment of a chain cut short.
tx-fragment-credit = ["wz-session-core/tx-fragment-credit"]
# `tx-held-wait`: a droppable publish that finds the session held by another send asks the faces
# for room out of its own `wait_before_drop` under zenoh's queue profile. Without it every profile
# answers as pico's: dropped at once behind a send, and no face asked.
tx-held-wait = ["wz-session-core/tx-held-wait"]
# `tx-stream-owed`: a stream link's send that never waits for its stream, the rest of a frame it
# did not take owed and written by a later step, and a question of room that waits for the stream
# within the message's wait. The runtime's feature of the same name. Without it each frame is
# written whole by a send that waits for its stream, as zenoh-pico's link write does.
tx-stream-owed = ["wz-runtime-coop/tx-stream-owed"]
# `multicast-locator-keys`: a host group's `#ttl=`, `#bind=` and `#dscp=`, read by the session
# core's feature of the same name and given to the group's sockets (`host_group`). Without it the
# three are refused when the group's endpoint is read, and no send socket is marked.
multicast-locator-keys = ["wz-session-core/multicast-locator-keys"]
# `query-replies-with-final`: the replies a queryable's callbacks make wait in the face's open frame
# and leave with the query's Final in one send, a behaviour of the query plane that zenoh-pico does
# not have, named as the send's are. Without it each reply leaves as it is made, and the Final
# after them, as zenoh-pico's `_z_send_reply` sends each.
query-replies-with-final = ["wz-session-core/query-replies-with-final"]
# `accept-cookie`: the stateless acceptor, the session core's feature of the same name and the
# runtime's draw it asks of the session's source for each accepted link: the InitAck carries what
# the handshake negotiated, sealed under a key drawn for each attempt, and only an OpenSyn that
# echoes it is admitted, as zenoh's acceptor does. A behaviour zenoh-pico's acceptor does not
# have: it answers with an empty cookie
# (`vendor/zenoh-pico/src/transport/unicast/transport.c` @
# `_z_t_msg_make_init_ack(mode, *local_zid, cookie)`). On in this crate's own build and named by
# the pico ABI's capability of the same name, which the zenoh-pico preset leaves off: without it
# each accept is held by its link's session until the OpenSyn, the InitAck carries the session's
# configured cookie (empty), nothing is drawn for a cookie or its key, and the library links no
# cookie codec. It changes nothing in a build that does not listen.
accept-cookie = ["wz-session-core/accept-cookie", "wz-runtime-coop/accept-cookie"]
# `face-send-places`: each face its own send place, in a build whose read takes faces past the
# dial role's (`listen`, `group`): an operation holds the place of every face before the session's
# lock and sends to each through the wire its hold holds (`CoopEngine::live_on_link`), and a
# publish sends each face a leg of its own under that face's place alone, so a publish to one face
# does not wait behind a send on another, and a droppable one passes a face another send holds
# over (`LinkRooms::for_held_place`). A behaviour zenoh-pico's peer does not have: it sends to
# every peer under one transmit lock of its transport
# (`vendor/zenoh-pico/src/transport/common/tx.c` @ `_z_transport_tx_mutex_lock(`). On in this
# crate's own build and named by the pico ABI's capability of the same name, which the zenoh-pico
# preset leaves off: without it a build of one thread (no `threads`) has one send place for every
# face, the session's lock, under which an operation runs in its caller and a publish's one leg
# reaches every face, each send lending its face's link by a try of the face's place; the held
# operations, the walk that holds every face and each face's leg are not compiled (`build.rs`,
# `wz_one_send_place`). A build with `threads` keeps each face's place whatever is named: its
# form of one place, a send lock of the session's own that the read's waits on a place go under
# too, is argued in docs/c-abi-migration/feat-peer.md (W6) and not built. Nothing the receive does
# for a message changes.
face-send-places = []
# A transport the program supplies: the session shell's links over the program's own network
# stack (`wz_runtime_coop::app_link`), re-exported for the ABI that opens the engine over them.
app-transport = ["wz-runtime-coop/app-link"]
# The multicast groups a session joins (`CoopConfig::groups`), each a face of the session beside
# its links: the session shell's group session (`wz-session-mcu`'s `group_drive`, the one an MCU
# image runs) hosted as a task of the session's local set, over the group the stack joins
# (`SessionLinks::open_group`). Its JOIN, its members and the framing of what it sends are the
# session core's; the Push items the session puts on the group share the queue its replies take
# (`codec-push`). Off, a config that names a group is refused by name and the text has none of it.
group = [
    "interest-answer",
    "runtime-plan",
    "wz-runtime-coop/group",
    "wz-session-mcu/transport-multicast",
    "wz-session-mcu/codec-push",
    "wz-session-core/peer-row-pools",
]
# The groups of `group` joined on the host's own sockets (`host_group::HostGroups`, which the
# host's links are given with `IpLinks::with_groups`). The sockets are those of
# `wz_runtime_posix::multicast`, made by the rules the tokio runtime's group link is made by, so
# `#iface=`, `#join=`, `#ttl=`, `#bind=`, `#dscp=`, the loopback and the refusal of an unpinned
# link are one decision for both engines. It needs no `std`: a host library without it joins a
# group as one with it does.
group-host = ["group", "dep:wz-runtime-posix"]
# The `reth/` groups of `group` joined on the host's raw packet sockets: the runtime's joiner of
# them (`raweth_group`), re-exported for the ABI that wraps the host's groups in it beside
# `wz_runtime_posix::raweth`'s sockets. Linux only, where zenoh-pico has its raweth transport.
raweth = ["group-host", "wz-runtime-coop/raweth", "wz-runtime-posix/raweth"]
# The keyexprs the members of a group declare, each member's kept apart (zenoh-pico's
# `Z_FEATURE_MULTICAST_DECLARATIONS`, the pico ABI's `multicast-declarations`): every key a member
# names by one of its own ids, in a put, a declaration, a query, a reply or an interest, reaches the
# session as the literal that member declared. Two zenoh-pico members number their keyexprs from
# the same counter, so the group's face reads each record under the tag of the member that sent it
# (the session core's lent group walk, `MemberRecords`) and keys its aliases by tag and id; the walk
# stays where the datagram lies. The face holds `MAX_MEMBER_KEYEXPRS` aliases for each of its
# `MAX_GROUP_MEMBERS` members, reserved in the session's pool at the open. Off, which is pico's
# default build, whose members declare no keyexpr on a group, the face holds one peer's aliases.
multicast-declarations = ["group"]
# The `tls/` link on a host (`tls::HostTls`): the secure channel `wz-tls-mbedtls` runs, made from
# the PEM material a C ABI resolved, for both roles. The library is built from the pinned
# submodules (`vendored`), and every call into it is under one lock (`host-lock`), because the
# engine's read tasks are threads and the library keeps process-wide state with no lock of its
# own. Off, a `tls/` endpoint is the stack's `Unsupported`, and the text has none of it.
tls-mbedtls = ["std", "dep:wz-tls-mbedtls", "wz-tls-mbedtls/vendored", "wz-tls-mbedtls/host-lock", "wz-tls-mbedtls/rsa"]
# The node's event log (`wz-capi-port`'s `event-ring`), so that a `tls/` listener tells it when it
# ended a connection without a stream (`tls::HostTls`): a handshake the arena or the key store had
# no room for is otherwise a closed connection to the peer and nothing to the program. Without
# `tls-mbedtls` there is no listener to tell it, and the feature adds only the log.
event-ring = ["wz-capi-port/event-ring"]
# Delivery of the session's own get to the session's own queryables (`Z_FEATURE_LOCAL_QUERYABLE`):
# a get reaches the queryables of the session that made it, after it has gone out on the link,
# and a querier's write filter or matching listener that counts the session's own entities counts
# them. A queryable is the answering end and a get the requesting end, so it needs both planes.
local-queryable = ["query", "queryable"]
# The faces the session stands on, as a connectivity plane reads them: a snapshot of each
# transport and its links, and the events a watcher is told when one comes up or goes down. What
# `wz-capi-core`'s `connectivity` names on its runtime. It needs nothing of session-core that the
# engine does not already have.
connectivity = ["wz-runtime-coop/connectivity"]
# The liveliness token and subscriber: the token's declaration and its retraction, the tokens the
# session holds to answer a peer that asks for them, and the subscriber that hears the peer's.
# What `wz-capi-core`'s `liveliness` names on its runtime, named on session-core.
#
# A group's stage writes a token reply where it waits only under `wz-session-mcu`'s own name for
# the registry, so the feature names it there too.
liveliness = [
    "wz-session-core/declare-token",
    "wz-session-core/liveliness-token",
    "wz-session-core/liveliness-subscriber",
    "wz-session-mcu/liveliness-token",
]
# The liveliness get: a snapshot of the tokens alive on a key, asked as an Interest and answered
# with token declarations and a DeclFinal, ended by its deadline as a query is. It is a get of
# the requesting end (the one plane that delivers and ends a get's legs), so it brings `query`.
liveliness-get = ["liveliness", "query", "wz-session-core/liveliness-get"]
# The requesting end of a query: a get, the slots of its request (target, timeout,
# consolidation, attachment, parameters, source info, value) and everything a reply carries back
# to it. What `wz-capi-core`'s `query` names on its runtime, named on session-core.
query = [
    "wz-runtime-coop/query",
    "wz-session-core/declare-queryable",
    "wz-session-core/query-get",
    "wz-session-core/query-reply",
    "wz-session-core/query-target",
    "wz-session-core/query-timeout",
    "wz-session-core/query-consolidation",
    "wz-session-core/query-attachment",
    "wz-session-core/query-selector-parameters",
    "wz-session-core/query-reply-err",
    "wz-session-core/query-source-info",
    "wz-session-core/query-value",
    "wz-session-core/codec-request",
    "wz-session-core/request-put-del",
    "wz-session-core/codec-response",
    "wz-session-core/codec-response-final",
]
# The key ids every node of a deployment shares (`CoopEngine::open_with_key_ids`): the session holds
# the dictionary it is opened with, every link of it reads an id only the dictionary names, and a
# key goes on the wire as the session's key-wire form says. Without it a session opened with a
# form other than `declared` is refused.
shared-key-ids = [
    "wz-runtime-coop/shared-key-ids",
    "wz-session-core/shared-key-ids",
    "wz-capi-port/shared-key-ids",
]
# The session's transport counters (`CoopEngine::transport_stats`): each link's session counts
# what it sends, receives and drops, as the tokio engine's sessions do under the same session-core
# feature, and the engine counts the publishes it drops before they reach a link. Off, which is
# pico's build (pico has no transport counters), no counter is kept and the text has none of them.
# A group's session counts what it sends and receives into counters of its own (`wz-session-mcu`'s
# `transport-stats`), which the engine sums with its links'.
# A Rust surface only: neither zenoh-c nor zenoh-pico reports transport counters through C.
transport-stats = ["wz-session-core/transport-stats", "wz-session-mcu/transport-stats"]
# The node's resource snapshot (`SessionEngine::message_reading`): what the receive paths of the
# session's links and the sessions of its groups counted, those up and those let go of, as one
# reading that only grows. Off, which
# is pico's build (pico has no snapshot), no link counts and the engine answers `None`, as the
# port's provided answer does.
resource-snapshot = [
    "wz-session-core/resource-snapshot",
    "wz-runtime-coop/resource-snapshot",
    "wz-session-mcu/resource-snapshot",
]
# The declaration watch (`SessionEngine::declare_decl_watch`): what the peers of the session's links
# declare and retract, told to a watch with the session's other deliveries, outside its lock. The
# two features are the pico ABI's of the same names, which this engine honours as the tokio engine
# does: with `remote-declaration-watch` each event names the peer its link's handshake gave, and
# with `declarations-synced-event` a watch is also told when a link's peer ended its initial
# declarations. The watch is in a build with either; without both a watch is refused by name, and
# the observers, the queue and the settling after each frame are not in the text.
remote-declaration-watch = []
declarations-synced-event = []
# The lend-only send (`wz-session-core`'s `tx-lend-only`): every frame is encoded into a slot the
# link lends from the session's arena, and a send that finds every slot out is refused and counted
# (`SessionLinkActions::tx_refusals`), never built on the heap. A SELECTOR, off by default, named by
# the C library's final build (`--features wz-capi-coop/tx-lend-only` beside `os-host`) and by
# no dependency line: unified into a build that holds the tokio engine it would make that engine's
# sessions refuse where they fall back, which `wz-runtime-tokio` refuses to build.
tx-lend-only = ["wz-session-core/tx-lend-only"]
# The plan of a session's arena laid out at the open from the config it is handed
# (`arena::PlanFrom::Config`, `CoopEngine::open` and the opens beside it), and kept row by row
# (`ArenaPlan::rows`). Off, every open is by a region the build laid out when it was compiled
# (`arena::ArenaRegion`): the image carries neither the walk of the rows nor a table of them, a
# plan keeping the bytes its rows take and the rows each layer lends from; the session's registry
# and its key arena are fields of a region the build lays out (`region::StateRegion`), reserved
# zeroed beside the arena. A C ABI whose config may state a policy turns it on, and `listen` and
# `group` do, whose faces come and go from pools the arena lends. The crate's own tests open by
# config whatever this says; without it their registry is the region's.
runtime-plan = []
# The session's tables take their memory from the allocator at each table's first row, and a key at
# its making, rather than at the open (`wz_session_core::bounded::OnUse`,
# docs/c-abi-migration/heap-native.md section 11): the registry is made by value, each table counted
# from the limits the open resolved and holding no row, and the session's keys are counted against a
# budget of its `KEY_ARENA_BYTES`. The budget and the places of the state's own values (its round,
# its planes, the cells it lends for a step, the rows of its plain tables) lie in a state of the
# session's own, one allocation the open takes from the allocator apart from its arena, and no
# region is laid out; the arena is still the open's. Beside `runtime-plan` (which `listen` and `group`
# turn on, and `--all-features` names) it yields, as features add: a session laid out at the open
# from its config takes its tables' memory there, so a build of both is the `runtime-plan` form
# (`src/lib.rs`, where `RowPolicy` is named). Off, every table takes its memory at the open and
# none after (docs/upstream-parity.md, D12).
tables-on-use = []
# A clock the program moves (a time base it supplies, `wz-capi-pico`'s `time-base`): the word that
# tells a read the clock moved on (`CoopConfig::clock_moves`), which ends the read's wait beside
# its links. Off, which is pico's build, no program moves the clock, the config's field holds no
# value and the text has none of the wait it would end (the capability-cost gate measures it).
time-base = []

[dev-dependencies]
# The stand-in names the subscriber of each declaration it is told, in both forms its session reads
# one in (owned and where its frame lies), so a test of the replay reads what was told in order.
wz-codecs = { path = "../wz-codecs", default-features = false }
# The `tls/` provider's tests (`tests/tls_provider.rs`) make a certificate authority and its end
# certificates, as `wz-tls-mbedtls`'s own tests do, and share that crate's helper for it.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The tests run the engine against a router stand-in over the host's UDP sockets: a session that
# accepts, which the engine itself never is, and holds a queryable a get asks.
wz-runtime-posix = { path = "../wz-runtime-posix" }
# The in-memory network, for a test of what one link gives the session that no socket's timing
# decides (`admission_gate`).
wz-session-mcu = { path = "../wz-session-mcu", default-features = false, features = ["test-support"] }
# The advanced subscriber's host, which the tests run on this engine, and the publisher's cache
# the stand-in answers the host's gets from.
wz-ext-pubsub = { path = "../wz-ext-pubsub", features = ["engine-host"] }
# The stand-in accepts the engine's session, answers its gets and declares the queryables a test
# tells it to (`declare-queryable`), in every test build: an engine built without `query` and
# `queryable` is then shown a peer's queryable it keeps no table of. The stand-in's sequenced
# publisher stamps a source info the advanced subscriber orders by (`pubsub-source-info`), which
# the C ABI's `advanced` brings through its unstable API. The registry's tests read the pools its
# faces share (`peer-row-pools`), in every test build. The tests select every value of a policy,
# which `policy-selection` keeps in its domain for the test build alone.
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "policy-selection",
    "pubsub-source-info",
    "peer-row-pools",
    "session-unicast-accept",
    "query-queryable",
    "request-put-del",
    "declare-queryable",
] }
# The tests hand the engine their own closures as callbacks (`shared-sinks`), which the C library
# over this engine never does.
wz-capi-port = { path = "../wz-capi-port", default-features = false, features = ["shared-sinks"] }

[lints]
workspace = true