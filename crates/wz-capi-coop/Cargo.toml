#
# wz-capi-coop — the cooperative engine behind a wz C ABI.
#
# A C session is one session-core session, stepped by the program: no OS thread
# and no async runtime of its own. The program's own calls drive it, as zenoh-pico's
# single-threaded arm does (`zp_read`, `zp_spin_once`), and a read task, when the
# program starts one, is a thread that makes the same calls
# (docs/capi-pico-on-coop-engine.md, decisions D2 and D8). It implements the
# port's `SessionEngine` and `SessionDrive` (`wz-capi-port`), so the ABI over it
# names neither this crate's types nor the tokio engine's.
#
# Built over the session shell's heap profile (`wz-session-mcu`, `wz-runtime-coop`)
# and generic over the network stack (`SessionLinks`): a host gives it its sockets
# (`wz_runtime_posix::links::PosixLinks`), a test the in-memory network.
#
# `rlib` only: a Rust-internal seam, like `wz-capi-core` and `wz-capi-port`.

[package]
name = "wz-capi-coop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The cooperative engine behind a wz C ABI: one session the program steps, implementing the C ABI's engine port."
publish = false

[lib]
name = "wz_capi_coop"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
wz-capi-port = { path = "../wz-capi-port" }
# What a zenoh-pico client does on a session: publish (Put and Delete, with every
# metadata field), declare key expressions and subscribers and retract them, ask a
# router who subscribes or answers (the write filter and the matching status),
# batch, keep the lease, fragment what does not fit a batch and put back together
# what arrives fragmented, and match key expressions with their wildcards. The
# set is the tokio engine's session base (`wz-capi-core`'s `wz-runtime-tokio`
# features) less the local loop, which this engine does not have: zenoh-pico's
# default build delivers nothing locally (`Z_FEATURE_LOCAL_SUBSCRIBER` 0).
# The KeepAlive and Close codecs are named here because nothing below brings them, and without
# them the session's keep-alive and close are sent as nothing and a router's Close is not read.
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "alloc",
    "codec-keep-alive",
    "codec-close",
    "codec-push",
    "codec-declare",
    "transport-fragmentation",
    "pubsub-put",
    "pubsub-delete",
    "pubsub-encoding",
    "pubsub-timestamp",
    "pubsub-attachment",
    "pubsub-source-info",
    "pubsub-qos",
    "pubsub-priority",
    "pubsub-congestion-control",
    "pubsub-express",
    "declare-final",
    "declare-keyexpr",
    "declare-subscriber",
    "declare-queryable",
    "declare-undeclare",
    "declare-interest",
    "session-matching",
    "transport-batching",
    "keyexpr-wildcard-single",
    "keyexpr-wildcard-double",
    "keyexpr-dollar-star",
    "keyexpr-includes",
] }
# `host-lock`: this engine runs on a host, so the runtime's critical sections are a lock of the
# process and no `critical-section` implementation is linked (wz-runtime-coop's src/cs.rs).
wz-runtime-coop = { path = "../wz-runtime-coop", default-features = false, features = [
    "alloc",
    "transport-batching",
    "host-lock",
] }
# The dialler's endpoint reader and the application layer's dispatch.
wz-session-mcu = { path = "../wz-session-mcu", default-features = false, features = [
    "alloc",
    "dial",
    "transport-keepalive",
    "reassembly",
] }

[features]
# The answering end of a query: a queryable, its replies (with their source info, encoding and
# attachment, and the error reply) and a query a C program keeps past its callback. What
# `wz-capi-core`'s `queryable` names on its runtime, named on session-core.
queryable = [
    "wz-session-core/query-queryable",
    "wz-session-core/reply-source-info",
    "wz-session-core/query-reply-err",
    "wz-session-core/query-source-info",
    "wz-session-core/query-attachment",
    "wz-session-core/query-selector-parameters",
    "wz-session-core/query-value",
    "wz-session-core/codec-request",
    "wz-session-core/codec-response",
    "wz-session-core/codec-response-final",
]
# Delivery to the session's own subscribers (zenoh-pico's `Z_FEATURE_LOCAL_SUBSCRIBER`): a put
# reaches the subscribers of the session that made it, after it has gone out on the link, and a
# write filter or a matching listener that counts the session's own entities counts them. Off,
# which is pico's default build, the session delivers nothing locally. It needs nothing of
# session-core that the engine does not already have.
local-subscriber = []
# The liveliness token and subscriber: the token's declaration and its retraction, the tokens the
# session holds to answer a peer that asks for them, and the subscriber that hears the peer's.
# What `wz-capi-core`'s `liveliness` names on its runtime, named on session-core.
liveliness = [
    "wz-session-core/declare-token",
    "wz-session-core/liveliness-token",
    "wz-session-core/liveliness-subscriber",
]
# The liveliness get: a snapshot of the tokens alive on a key, asked as an Interest and answered
# with token declarations and a DeclFinal, ended by its deadline as a query is. It is a get of
# the requesting end (the one plane that delivers and ends a get's legs), so it brings `query`.
liveliness-get = ["liveliness", "query", "wz-session-core/liveliness-get"]
# The requesting end of a query: a get, the slots of its request (target, timeout,
# consolidation, attachment, parameters, source info, value) and everything a reply carries back
# to it. What `wz-capi-core`'s `query` names on its runtime, named on session-core.
query = [
    "wz-session-core/query-get",
    "wz-session-core/query-reply",
    "wz-session-core/query-target",
    "wz-session-core/query-timeout",
    "wz-session-core/query-consolidation",
    "wz-session-core/query-attachment",
    "wz-session-core/query-selector-parameters",
    "wz-session-core/query-reply-err",
    "wz-session-core/query-source-info",
    "wz-session-core/query-value",
    "wz-session-core/codec-request",
    "wz-session-core/codec-response",
    "wz-session-core/codec-response-final",
]

[dev-dependencies]
# The tests run the engine against a router stand-in over the host's UDP sockets: a session that
# accepts, which the engine itself never is, and holds a queryable a get asks.
wz-runtime-posix = { path = "../wz-runtime-posix" }
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "session-unicast-accept",
    "query-queryable",
] }

[lints]
workspace = true
