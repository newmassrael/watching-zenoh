#
# wz-capi-coop — the cooperative engine behind a wz C ABI.
#
# A C session is one session-core session, stepped by the program: no OS thread
# and no async runtime of its own. The program's own calls drive it, as zenoh-pico's
# single-threaded arm does (`zp_read`, `zp_spin_once`), and a read task, when the
# program starts one, is a thread that makes the same calls
# (docs/capi-pico-on-coop-engine.md, decisions D2 and D8). It implements the
# port's `SessionEngine` and `SessionDrive` (`wz-capi-port`), so the ABI over it
# names neither this crate's types nor the tokio engine's.
#
# Built over the session shell's heap profile (`wz-session-mcu`, `wz-runtime-coop`)
# and generic over the network stack (`SessionLinks`): a host gives it its sockets
# (`wz_runtime_posix::links::PosixLinks`), a test the in-memory network.
#
# `rlib` only: a Rust-internal seam, like `wz-capi-core` and `wz-capi-port`.

[package]
name = "wz-capi-coop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The cooperative engine behind a wz C ABI: one session the program steps, implementing the C ABI's engine port."
publish = false

[lib]
name = "wz_capi_coop"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# The port, without its host half: `std` below asks for it (src/lib.rs, "Where it builds").
wz-capi-port = { path = "../wz-capi-port", default-features = false }
# What a zenoh-pico client does on a session: publish (Put and Delete, with every
# metadata field), declare key expressions and subscribers and retract them, ask a
# router who subscribes or answers (the write filter and the matching status),
# batch, keep the lease, fragment what does not fit a batch and put back together
# what arrives fragmented, and match key expressions with their wildcards. The
# set is the tokio engine's session base (`wz-capi-core`'s `wz-runtime-tokio`
# features) less the local loop, which this engine does not have: zenoh-pico's
# default build delivers nothing locally (`Z_FEATURE_LOCAL_SUBSCRIBER` 0).
# The KeepAlive and Close codecs are named here because nothing below brings them, and without
# them the session's keep-alive and close are sent as nothing and a router's Close is not read.
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "alloc",
    "codec-keep-alive",
    "codec-close",
    "codec-push",
    "codec-declare",
    "transport-fragmentation",
    "pubsub-put",
    "pubsub-delete",
    "pubsub-encoding",
    "pubsub-timestamp",
    "pubsub-attachment",
    "pubsub-source-info",
    "pubsub-qos",
    "pubsub-priority",
    "pubsub-congestion-control",
    "pubsub-express",
    "declare-final",
    "declare-keyexpr",
    "declare-subscriber",
    "declare-queryable",
    "declare-undeclare",
    "declare-interest",
    "session-matching",
    "transport-batching",
    "keyexpr-wildcard-single",
    "keyexpr-wildcard-double",
    "keyexpr-dollar-star",
    "keyexpr-includes",
] }
# `host-lock` comes with `std` below: on a host the runtime's critical sections are a lock of the
# process and no `critical-section` implementation is linked (wz-runtime-coop's src/cs.rs); an MCU
# image links its own.
wz-runtime-coop = { path = "../wz-runtime-coop", default-features = false, features = [
    "alloc",
    "transport-batching",
] }
# The engine's 64-bit counters (entity ids, link generations): native where the target has a
# 64-bit atomic, a critical section where it has not (a Cortex-M7 has 32-bit atomics only). The
# same features as wz-runtime-coop's, so the two resolve to one build of it.
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"] }
# The dialler's endpoint reader and the application layer's dispatch.
wz-session-mcu = { path = "../wz-session-mcu", default-features = false, features = [
    "alloc",
    "dial",
    "transport-keepalive",
    "reassembly",
] }

# The host's own multicast sockets, without `std`: the interface table, a scouting window's sockets
# and a group's two sockets made by its locator's keys (`host-multicast`), over the POSIX kernels'
# calls or Winsock (`scout` and `group-host` below). Optional, so a build that neither scouts on a
# host nor joins a host's group links none of it.
wz-runtime-posix = { path = "../wz-runtime-posix", optional = true, features = ["host-multicast"] }
# A group the host did not join says why, as the tokio engine's group link does.
log = { version = "0.4", optional = true }
# The secure channel (`tls-mbedtls` below): Mbed TLS, built from the pinned submodules.
wz-tls-mbedtls = { path = "../wz-tls-mbedtls", optional = true }

[features]
# The host: `std`'s mutex, threads and sleep behind the port's `os`, and the process's lock behind
# the runtime's critical sections. Without it the engine is `no_std` with `alloc` and the image
# supplies both (docs/upstream-parity.md section 5a).
default = ["std"]
std = ["wz-capi-port/std", "wz-runtime-coop/host-lock"]
# The host without `std` (the pico C ABI's `os-posix`): the port's `os` and the runtime's
# critical sections made of the host's own calls (`os-sys`, `host-lock-sys`), so a host library
# built without `std` runs the read task and holds the locks as one with `std` does, and links no
# `critical-section` implementation, which it would export beside its C ABI.
host-sys = ["wz-capi-port/os-sys", "wz-runtime-coop/host-lock-sys"]
# Periodic jobs on the session (`SessionEngine::start_ticker`): a job run from the call that steps
# the session once its time has come, which the advanced publisher's heartbeat is. A build that
# starts none leaves it out, so the job table, the cut to a read's wait and the run after a step
# are not in its text (the capability-cost gate measures it).
ticker = []
# Active multicast scouting (`Z_FEATURE_SCOUTING`): one Scout asked of the group, the Hellos that
# answer collected for a budget, on the host's sockets and the session's own window rules
# (`wz_session_core::scouting_host`). A window needs no session, so this is a plane beside the
# engine and not a method of its port. The window pins one ask socket to each interface that can
# carry multicast (`wz_runtime_posix::scouting`), which needs no `std`, so a host library without
# it scouts as one with it does.
scout = ["scout-datagram", "dep:wz-runtime-posix"]
# Active scouting over ONE datagram socket of the stack the engine runs on (`scout_datagram`),
# without `std`: zenoh-pico's window on a platform with no interface iterator (Zephyr), a socket the
# Scout leaves by and the Hellos come back to. The session's window rules and the two codecs, and
# the runtime's datagram socket trait the window is written over.
scout-datagram = [
    "wz-runtime-coop/session-unicast",
    "wz-session-core/scouting-active",
    "wz-session-core/codec-scout",
    "wz-session-core/codec-hello",
]
# The answering end of a query: a queryable, its replies (with their source info, encoding and
# attachment, and the error reply) and a query a C program keeps past its callback. What
# `wz-capi-core`'s `queryable` names on its runtime, named on session-core.
queryable = [
    "wz-session-core/query-queryable",
    "wz-session-core/reply-source-info",
    "wz-session-core/query-reply-err",
    "wz-session-core/query-source-info",
    "wz-session-core/query-attachment",
    "wz-session-core/query-selector-parameters",
    "wz-session-core/query-value",
    "wz-session-core/codec-request",
    "wz-session-core/request-put-del",
    "wz-session-core/codec-response",
    "wz-session-core/codec-response-final",
]
# Delivery to the session's own subscribers (zenoh-pico's `Z_FEATURE_LOCAL_SUBSCRIBER`): a put
# reaches the subscribers of the session that made it, after it has gone out on the link, and a
# write filter or a matching listener that counts the session's own entities counts them. Off,
# which is pico's default build, the session delivers nothing locally. It needs nothing of
# session-core that the engine does not already have.
local-subscriber = []
# The listening role: a session that takes inbound links off the ports it listens on, each as a
# face of its own beside the dial role's (`CoopConfig::listen`). The link layer's listener is the
# stack's (`SessionLinks::open_listener`); a stack that gives none answers the endpoint as
# unsupported. Off, which is pico's client build, the engine is the dial role alone and its text
# has no acceptor, no table of ports and no wait on one (the capability-cost gate measures it).
# The session machine compiles its accepting role only under `session-unicast-accept`, so the
# feature asks the runtime for it: without that an acceptor would start on no event. It asks the
# runtime's `udp-listen` too, which gives the host's links a `udp/` listener, one socket whose
# peers each take a face of their own.
listen = ["wz-runtime-coop/session-unicast-accept", "wz-runtime-coop/udp-listen"]
# A transport the program supplies: the session shell's links over the program's own network
# stack (`wz_runtime_coop::app_link`), re-exported for the ABI that opens the engine over them.
app-transport = ["wz-runtime-coop/app-link"]
# The multicast groups a session joins (`CoopConfig::groups`), each a face of the session beside
# its links: the session shell's group session (`wz-session-mcu`'s `group_drive`, the one an MCU
# image runs) hosted as a task of the session's local set, over the group the stack joins
# (`SessionLinks::open_group`). Its JOIN, its members and the framing of what it sends are the
# session core's; the Push items the session puts on the group share the queue its replies take
# (`codec-push`). Off, a config that names a group is refused by name and the text has none of it.
group = [
    "wz-session-mcu/transport-multicast",
    "wz-session-mcu/codec-push",
]
# The groups of `group` joined on the host's own sockets (`host_group::HostGroups`, which the
# host's links are given with `IpLinks::with_groups`). The sockets are those of
# `wz_runtime_posix::multicast`, made by the rules the tokio runtime's group link is made by, so
# `#iface=`, `#join=`, `#ttl=`, `#bind=`, `#dscp=`, the loopback and the refusal of an unpinned
# link are one decision for both engines. It needs no `std`: a host library without it joins a
# group as one with it does.
group-host = ["group", "dep:wz-runtime-posix", "dep:log"]
# The `tls/` link on a host (`tls::HostTls`): the secure channel `wz-tls-mbedtls` runs, made from
# the PEM material a C ABI resolved, for both roles. The library is built from the pinned
# submodules (`vendored`), and every call into it is under one lock (`host-lock`), because the
# engine's read tasks are threads and the library keeps process-wide state with no lock of its
# own. Off, a `tls/` endpoint is the stack's `Unsupported`, and the text has none of it.
tls-mbedtls = ["std", "dep:wz-tls-mbedtls", "wz-tls-mbedtls/vendored", "wz-tls-mbedtls/host-lock", "wz-tls-mbedtls/rsa"]
# The node's event log (`wz-capi-port`'s `event-ring`), so that a `tls/` listener tells it when it
# ended a connection without a stream (`tls::HostTls`): a handshake the arena or the key store had
# no room for is otherwise a closed connection to the peer and nothing to the program. Without
# `tls-mbedtls` there is no listener to tell it, and the feature adds only the log.
event-ring = ["wz-capi-port/event-ring"]
# Delivery of the session's own get to the session's own queryables (`Z_FEATURE_LOCAL_QUERYABLE`):
# a get reaches the queryables of the session that made it, after it has gone out on the link,
# and a querier's write filter or matching listener that counts the session's own entities counts
# them. A queryable is the answering end and a get the requesting end, so it needs both planes.
local-queryable = ["query", "queryable"]
# The faces the session stands on, as a connectivity plane reads them: a snapshot of each
# transport and its links, and the events a watcher is told when one comes up or goes down. What
# `wz-capi-core`'s `connectivity` names on its runtime. It needs nothing of session-core that the
# engine does not already have.
connectivity = []
# The liveliness token and subscriber: the token's declaration and its retraction, the tokens the
# session holds to answer a peer that asks for them, and the subscriber that hears the peer's.
# What `wz-capi-core`'s `liveliness` names on its runtime, named on session-core.
liveliness = [
    "wz-session-core/declare-token",
    "wz-session-core/liveliness-token",
    "wz-session-core/liveliness-subscriber",
]
# The liveliness get: a snapshot of the tokens alive on a key, asked as an Interest and answered
# with token declarations and a DeclFinal, ended by its deadline as a query is. It is a get of
# the requesting end (the one plane that delivers and ends a get's legs), so it brings `query`.
liveliness-get = ["liveliness", "query", "wz-session-core/liveliness-get"]
# The requesting end of a query: a get, the slots of its request (target, timeout,
# consolidation, attachment, parameters, source info, value) and everything a reply carries back
# to it. What `wz-capi-core`'s `query` names on its runtime, named on session-core.
query = [
    "wz-session-core/query-get",
    "wz-session-core/query-reply",
    "wz-session-core/query-target",
    "wz-session-core/query-timeout",
    "wz-session-core/query-consolidation",
    "wz-session-core/query-attachment",
    "wz-session-core/query-selector-parameters",
    "wz-session-core/query-reply-err",
    "wz-session-core/query-source-info",
    "wz-session-core/query-value",
    "wz-session-core/codec-request",
    "wz-session-core/request-put-del",
    "wz-session-core/codec-response",
    "wz-session-core/codec-response-final",
]
# The key ids every node of a deployment shares (`CoopEngine::open_with_key_ids`): the session holds
# the dictionary it is opened with, every link of it reads an id only the dictionary names, and a
# key goes on the wire as the session's key-wire form says. Without it a session opened with a
# form other than `declared` is refused.
shared-key-ids = ["wz-session-core/shared-key-ids", "wz-capi-port/shared-key-ids"]
# The session's transport counters (`CoopEngine::transport_stats`): each link's session counts
# what it sends, receives and drops, as the tokio engine's sessions do under the same session-core
# feature, and the engine counts the publishes it drops before they reach a link. Off, which is
# pico's build (pico has no transport counters), no counter is kept and the text has none of them.
# A Rust surface only: neither zenoh-c nor zenoh-pico reports transport counters through C.
transport-stats = ["wz-session-core/transport-stats"]
# The declaration watch (`SessionEngine::declare_decl_watch`): what the peers of the session's links
# declare and retract, told to a watch with the session's other deliveries, outside its lock. The
# two features are the pico ABI's of the same names, which this engine honours as the tokio engine
# does: with `remote-declaration-watch` each event names the peer its link's handshake gave, and
# with `declarations-synced-event` a watch is also told when a link's peer ended its initial
# declarations. The watch is in a build with either; without both a watch is refused by name, and
# the observers, the queue and the settling after each frame are not in the text.
remote-declaration-watch = []
declarations-synced-event = []
# A clock the program moves (a time base it supplies, `wz-capi-pico`'s `time-base`): the word that
# tells a read the clock moved on (`CoopConfig::clock_moves`), which ends the read's wait beside
# its links. Off, which is pico's build, no program moves the clock, the config's field holds no
# value and the text has none of the wait it would end (the capability-cost gate measures it).
time-base = []

[dev-dependencies]
# The `tls/` provider's tests (`tests/tls_provider.rs`) make a certificate authority and its end
# certificates, as `wz-tls-mbedtls`'s own tests do, and share that crate's helper for it.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The tests run the engine against a router stand-in over the host's UDP sockets: a session that
# accepts, which the engine itself never is, and holds a queryable a get asks.
wz-runtime-posix = { path = "../wz-runtime-posix" }
# The in-memory network, for a test of what one link gives the session that no socket's timing
# decides (`admission_gate`).
wz-session-mcu = { path = "../wz-session-mcu", default-features = false, features = ["test-support"] }
# The advanced subscriber's host, which the tests run on this engine, and the publisher's cache
# the stand-in answers the host's gets from.
wz-ext-pubsub = { path = "../wz-ext-pubsub", features = ["engine-host"] }
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "session-unicast-accept",
    "query-queryable",
    "request-put-del",
] }

[lints]
workspace = true
