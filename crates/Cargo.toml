#
# watching-zenoh — Rust runtime workspace (Phase 2 walking skeleton).
#
# Houses the host-side Rust crates that consume sce-codegen output and
# expose the wire-codec / link-runtime / intrinsics surface to AP
# (Linux+tokio) and MCU (Cortex-M + lwIP via FFI) deploy targets. This
# workspace is intentionally separate from `vendor/sce/Cargo.toml` so
# the watching-zenoh build does not perturb SCE's own self-test
# workspace; path dependencies into `vendor/sce/*` cross the workspace
# boundary explicitly.
#
# Initial member set (R40 walking skeleton):
#   - wz-codecs : hosts sce-codegen Rust output for codec-kind SCXMLs
#                 in sources/codecs/. build.rs runs the codegen
#                 in-process via sce-build (same pattern SCE's own
#                 sce-forge-runtime/rust/build.rs uses for the
#                 numerical conformance harness).
#
# Subsequent rounds will add:
#   - wz-runtime-tokio       (R42+, sce_link_runtime_tokio impl)
#   - wz-runtime-coop        (R42+, sce_link_runtime_lwip C11 sibling)
#   - zenoh-pico-sys         (R41, FFI bindings to vendored zenoh-pico)
#   - wz-integration-tests   (R41+, Layer 3 wire-interop test harness)
#   - wz                     (R302a, top-level facade crate hosting the
#                              169-feature catalog from R301; no source
#                              gates wired yet, pure feature labels).

[workspace]
resolver = "2"
members = [
    "wz",
    # §5.27 api-compat-pico — zenoh-pico-compatible C ABI (cdylib+rlib)
    # wrapping the wz AP tokio Session. Reverse of the *-sys crates
    # (which BIND to C); this crate EXPORTS a C ABI. AP/std-only.
    "wz-capi-pico",
    "wz-codecs",
    "wz-codecs-test-support",
    # R311y492 (§5.22 plugin-dynamic-loading) — the host<->plugin C ABI contract,
    # linked INDEPENDENTLY by the loader and by every plugin cdylib. Its own crate
    # rather than a wz-session-core module precisely so a third-party plugin author
    # can depend on the ABI without a session implementation behind it. no_std,
    # zero deps, all repr(C).
    "wz-plugin-abi",
    # R311y492 — a REAL loadable plugin, cdylib-only so nothing can link it
    # directly and skip the dlopen boundary the proof is about. Depends on
    # wz-plugin-abi and nothing else, which is itself the demonstration that the
    # ABI crate suffices to author a plugin.
    "wz-plugin-example",
    # R311y497 (§5.24 storage-mgr-dynamic-volume-loading) — the host<->volume C
    # ABI contract, the storage-side twin of wz-plugin-abi. Its own crate for the
    # same reason, and NOT merged into wz-plugin-abi: a plugin is started and
    # stopped while a volume creates stores that are put to and enumerated, so one
    # crate would make every plugin author link a storage vtable they never fill
    # and would tie the two ABI version numbers together.
    "wz-volume-abi",
    # R311y497 — a REAL loadable volume, cdylib-only so nothing can link it
    # directly and skip the dlopen boundary. DURABLE (one file per key) because
    # the host keeps a read mirror over every backend, so only survival across a
    # PROCESS restart distinguishes the loaded `.so` from the host answering
    # itself.
    "wz-volume-example",
    "wz-codegen-build",
    "wz-runtime-core",
    "wz-session-core",
    "wz-session-core-test-support",
    "wz-statechart-bridge",
    "wz-switchboard-schema",
    "wz-switchboard-codegen",
    "wz-switchboard-example",
    "wz-ap-demo-app",
    "zenoh-pico-sys",
    "wz-integration-tests",
    # R311qw — the linkstate-peer routing topology graph, lifted out of
    # wz-runtime-tokio so the runtime-agnostic kernel mirrors the
    # RouteTable(wz-session-core)/RoutingForwarder(wz-runtime-tokio) split.
    # std-allowed (petgraph is std-only), pulled only by routing-peer.
    "wz-routing-graph",
    # R311tt — the §5.16 access-control ACL policy KERNEL (pure decision engine,
    # zenoh interceptor/authorization.rs mirror). Lifted out of wz-runtime-tokio
    # for the same reason as wz-routing-graph: a runtime-agnostic policy kernel,
    # AP-only, depending on wz-routing-graph (Zid) + wz-session-core (the
    # keyexpr-inclusion matcher). The interceptor seam + enforcer adapter that
    # touch NetworkMessage stay in wz-runtime-tokio.
    "wz-access-control",
    # §5.26 REST -> zenoh HTTP/1.1 bridge (rest-http-bridge). AP-only,
    # hand-rolled HTTP (zero external HTTP dep); depends on wz-runtime-tokio
    # (Session) + wz-session-core (keyexpr canon + encoding). No MCU build
    # pulls it.
    "wz-rest",
    "wz-runtime-tokio",
    "wz-runtime-tokio-test-support",
    # R311mo (Level B) — isolated multicast-only test crate for the tokio
    # Session API. Like the wz-mcu-* crates it CANNOT join the `--workspace`
    # unification (the workspace pulls transport-unicast in from siblings,
    # gating out the multicast-only Session it tests), so C1/C2 `--exclude`
    # it and a dedicated isolated lane (C1s) runs it via `-p`.
    "wz-runtime-tokio-multicast-tests",
    "wz-ap-demo",
    "wz-e2e-harness",
    "wz-e2e-pubsub",
    "wz-e2e-queryable",
    "wz-e2e-zget",
    "wz-e2e-liveliness",
    "wz-e2e-liveliness-token",
    "wz-e2e-declare-observer",
    "wz-e2e-silent-peer",
    "wz-runtime-coop",
    "lwip-sys",
    "freertos-sys",
    "wz-runtime-freertos",
    "zephyr-sys",
    "wz-runtime-zephyr",
    "wz-link-lwip",
    "wz-session-lwip",
    # Stage 5 — the MCU acceptor session e2e scenario SSOT (no_std lib;
    # run_acceptor_e2e<C> shared verbatim by the host integration test
    # and the deploy/mcu-session-acceptor QEMU bin). Like wz-session-lwip
    # it forces wz-session-core/no_std, so the workspace `cargo test`
    # lanes (C1/C2) `--exclude` it and a dedicated isolated host lane
    # (C1n) exercises its handshake e2e. Mirrors the wz-ap-demo-app
    # lib-owns-the-scenario / bin-stays-thin split on the MCU profile.
    "wz-mcu-session-acceptor",
    # R311mi — the MCU multicast transport e2e scenario SSOT (no_std lib;
    # run_multicast_e2e<C> shared verbatim by the host integration test
    # (C1r) and the deploy/mcu-multicast-e2e footprint bin). Like
    # wz-mcu-session-acceptor it forces wz-session-core/no_std through the
    # facade session-lwip funnel, so the workspace `cargo test` lanes
    # (C1/C2) `--exclude` it and a dedicated isolated host lane (C1r)
    # exercises its multicast round trip. Unlike the acceptor there is no
    # QEMU boot (multicast self-loopback is a host-only lwIP affordance —
    # the bin is build + footprint-size only).
    "wz-mcu-multicast-e2e",
    # R311y21 — the Cortex-M SysTick monotonic clock SSOT (no_std lib;
    # SystickClock<CYCLES_PER_US> shared by all three deploy/mcu-* bins).
    # Unlike the wz-mcu-* e2e crates it has NO wz dep (the ClockSource
    # impl stays in each bin), so it does NOT force wz-session-core/no_std
    # onto the workspace and needs no C1/C2 --exclude — it builds + host-
    # tests (the monotonic-floor regression) in the default workspace lanes.
    "wz-mcu-clock",
    # Stage 5 (R311it) — the no_std SSOT for synthetic session handshake
    # wire bytes (craft_initsyn/opensyn/initack/frame). De-duplicates the
    # copies that were in the three wz-runtime-tokio session-FSM test files
    # + a fourth in wz-mcu-session-acceptor. Pure alloc, no codec deps, so it
    # composes in the std workspace test AND on the no_std MCU cross target.
    "wz-session-wire-fixtures",
    # lwip-sys — R311az-1 (Phase W §5.C link tier dependency). FFI
    # bindings to vendored lwIP 2.2.1 (vendor/lwip submodule pin
    # STABLE-2_2_1_RELEASE / 77dcd25a). Host build via cc::Build
    # statically compiling the NO_SYS=1 + UDP-minimal source set;
    # bindgen emits the R311az-2 surface allowlist (6 udp_* + pbuf +
    # netif lifecycle). Cross-compile to MCU targets is the deploy
    # crate's responsibility (R311az-pre D7); lwip-sys ships only the
    # host build at R311az-1.
    #
    # wz-runtime-coop — R311au scope C reintroduction (Phase W).
    # R53 NOP-stub skeleton was removed at R63 as a
    # document-around-the-hack pattern (NOP spawn + multi-paragraph
    # "intentionally NOP" justification). R311au lands a deliberately
    # narrower scope: sync primitive aliases ONLY
    # (`critical_section::Mutex<RefCell<T>>` per-runtime alias for the
    # MCU profile half of the R311w decision). CoopRuntime + the
    # `impl Runtime` half + the lwIP-sys FFI bridge stay deferred to
    # subsequent rounds; this reintroduction is production-honest
    # because every item shipped is a real working primitive (no NOP
    # spawn, no stubbed Runtime impl). See
    # crates/wz-runtime-coop/{Cargo.toml,src/lib.rs} for the full
    # scope statement.
    #
    # The SCE B6 link C11 emitter end-to-end validation that the
    # earlier deleted crate proved remains preserved as a Layer-3-
    # style test in wz-integration-tests/tests/link_emitter_b6.rs;
    # R311au does not relitigate that validation.
    #
    # wz-ap-demo added at R121a — first non-library deploy artifact
    # (AP MVP demo binary; Phase D.1). The rest of the workspace
    # remains library crates. See crates/wz-ap-demo/Cargo.toml for
    # the round rollout (R121a skeleton → R121b functional → R121c
    # integration test + CI Layer E).
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "LGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
authors = ["newmassrael <newmassrael@gmail.com>"]
repository = "https://github.com/newmassrael/watching-zenoh"
readme = "../README.md"

# Production lint policy: any warning fails the build. Per-crate opt-in
# via `[lints] workspace = true`. Generated-code crates may add local
# `#[allow(...)]` annotations but the workspace gate stays strict.
[workspace.lints.rust]
warnings = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
