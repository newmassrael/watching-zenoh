session-matching = ["wz-session-core/session-matching"]
# R311cc — pubsub domain wire-up. 9 atomic features (Cargo.toml
# authoring intent: "11 atomic, 9 active / 2 reserved"). After the
# R311du SubscriberRegistry move + R311fv attachment SSOT, only TWO
# have cfg sites in THIS crate; the other seven are pure forwards to
# wz-session-core, where the dispatch + Sample receive-side projection
# now live (their per-feature receive semantics are documented at the
# wz-session-core Cargo.toml):
#   pubsub-allow-loop  — local-only (no session-core gate). Gates the
#                        self-publish loopback registry call in
#                        session.rs (Session::publish / publish-aliased
#                        self-path). Feature-off short-circuits the
#                        loopback so only remote inbound triggers
#                        subscribers.
#   pubsub-attachment  — BOTH sides. Forwards to wz-session-core for the
#                        inbound decode (R311fv attachment-bytes SSOT)
#                        AND gates the local SEND vertical:
#                        `PublishOptions::with_attachment` setter
#                        (session.rs) + the Push attachment-ext encode
#                        in session_glue.rs (build_body_extensions ->
#                        encode_attachment_ext). Feature-off: nothing is
#                        set on PublishOptions nor written to the wire.
#   pubsub-timestamp   — BOTH sides (R311fx). Forwards to wz-session-core
#                        for the inbound Sample.timestamp projection AND
#                        gates the local SEND vertical: `PublishOptions::
#                        with_timestamp` setter (session.rs) + the inline
#                        timestamp field + `_Z_FLAG_Z_*_T` header bit in
