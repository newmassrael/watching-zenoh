#
# wz-runtime-tokio — sce_link_runtime_tokio (Rust + tokio + mio epoll
# baseline) per docs/runtime-crate-tokio.md.
#
# Phase Z entry (R51). Initial surface: `LinkDriver` trait + tokio
# TCP impl + 2-task `tests/echo_demo.rs` proving wire interop end-
# to-end. This is the FIRST round in the project where two
# concurrent processes (here: tokio tasks on a single process via
# loopback) exchange real wire bytes encoded by wz-codecs and decoded
# back on the other side.
#
# Scope reduction vs the full docs/runtime-crate-tokio.md spec:
#   - 1 process, 2 tasks (publisher + subscriber on loopback TCP)
#   - LinkDriver trait shape matches §2.1 but only the 4 core methods;
#     trust-class gating (§2.4) + io_uring opt-in (§4.1) + pool-slot
#     Rx borrows (§2.3) all deferred to later rounds.
#   - Codec wiring is fixed to msg_put for the demo; full SCXML-driven
#     binding lands when session_fsm wiring closes (R54+).
#
# The R52 echo demo is the OBSERVABLE COMMUNICATION MILESTONE the
# project has been working toward since R28 ("when will we see
# communication?"). It does not yet exercise session FSM handshake
# or framing; the publisher sends a raw msg_put body, the subscriber
# decodes the raw msg_put body. This is the smallest end-to-end
# proof that wz-codecs Layer 3-validated bytes survive a real
# network round-trip.

[package]
name = "wz-runtime-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Tokio + mio epoll runtime for watching-zenoh AP linux target (Phase D.1)."

[lib]
name = "wz_runtime_tokio"
path = "src/lib.rs"

# R302b — first source-level Cargo features. `default = [...]` keeps
# existing in-workspace consumers (wz-ap-demo, integration tests,
# session_fsm tests) building unchanged; opt-out via
# `cargo check --no-default-features` exercises the feature-off path.
# Downstream of the `wz` facade these features are forwarded via
# `wz-runtime-tokio?/liveliness-token` etc. so a wz consumer enabling
# `preset-mcu-minimal` (no liveliness) gets the slim build.
#
# R307 — query domain joins the source-gated set (6 new entries).
# `query-get` gates `Session::get` / `Session::get_aliased`;
# `query-queryable` gates `Session::declare_queryable` /
# `declare_queryable_aliased` + the entire `crate::query` module;
# `query-reply` gates the entire `crate::reply` module (the get-side
# ReplyRegistry). Per-option setters on `QueryOptions` gate behind
# `query-target` / `query-timeout` / `query-consolidation` — each
# implies `query-get` since they only refine the get call path.
# `query-get` implies `query-reply` because `Session::get` registers a
# pending entry against `crate::reply::ReplyRegistry`. The defaults
# below mirror R302b: every existing in-workspace consumer compiles
# unchanged because the default features turn every R307 gate ON.
#
# R309 — declare domain joins the source-gated set (7 new entries).
# Each `send_declare_*` / `send_undeclare_*` / `send_interest_*` method
# in `session_glue.rs` carries the matching gate; the
# Application-layer `Session::declare_*` call sites remain on their
# existing semantic gate (`liveliness-token`, `query-queryable`,
# etc.) and pull the wire-emit transitively via the implication chain
# below. `liveliness-token` now implies `declare-token` +
# `declare-undeclare` so the existing R277 `LivelinessToken::Drop`
# emit continues to compile; `liveliness-subscriber` implies
# `declare-interest` + `declare-final` (R280 send_interest_*).
[features]
# R311a1 — codec-init-body / codec-open-body forwards to the matching
# wz-codecs feature. Forward-only (no force-ON): the wz-codecs dep
# below switches to `default-features = false` so the codec emit/
# include is governed purely by these forwards, which makes a future
# facade-level `--no-default-features` (R311a4) actually able to elide
# the init_body / open_body codec pair. R311a2 cfg-gates the
# `use wz_codecs::init_body::InitBody` import sites in session_glue.rs;
# R311a3 cfg-gates the `InboundFrame::Init { body, .. }` enum variant
# and parse/match arms. Until R311a3 lands, `--no-default-features` at
# wz-runtime-tokio level breaks compile (intended cascade chain).
default = [
    "liveliness-token",
    "liveliness-subscriber",
    "query-get",
    "query-queryable",
    "query-reply",
    "query-target",
    "query-timeout",
    "query-consolidation",
    "declare-final",
    "declare-interest",
    "declare-keyexpr",
    "declare-queryable",
    "declare-subscriber",
    "declare-token",
    "declare-undeclare",
    "codec-init-body",
    "codec-open-body",
    "codec-keep-alive",
    "codec-close",
    "codec-scout",
    "codec-hello",
    "codec-join",
    "codec-response-final",
    "codec-fragment",
    "codec-frame",
    "codec-push",
    "codec-declare",
    "codec-request",
    "codec-response",
    "transport-link-tcp",
    "transport-link-udp",
    "transport-unicast",
    "transport-keepalive",
    "transport-batching",
    "pubsub-put",
    "pubsub-delete",
    "pubsub-allow-loop",
    "pubsub-attachment",
    "pubsub-timestamp",
    "pubsub-encoding",
    "pubsub-source-info",
    "pubsub-priority",
    "pubsub-congestion-control",
    "pubsub-express",
    "session-unicast-open",
    "session-unicast-accept",
    "session-reconnect",
    "session-matching",
    "keyexpr-canon",
    "keyexpr-wildcard-single",
    "keyexpr-wildcard-double",
    "keyexpr-dollar-star",
    "keyexpr-includes",
    "query-attachment",
    "query-selector-parameters",
    "query-reply-err",
    "query-source-info",
]
# R311dz — liveliness-* / declare-{subscriber,queryable} additionally
# forward to the wz-session-core same-named gate-only feature so the
# migrated `ApplicationLayerObserver` field for that domain is composed
# consistently with this crate's selection. The richer declare-* wire
# implications below are unchanged.
liveliness-token = ["declare-token", "declare-undeclare", "wz-session-core/liveliness-token"]
liveliness-subscriber = ["declare-interest", "declare-final", "wz-session-core/liveliness-subscriber"]
# liveliness-get — requester-side snapshot get. Wire = the declaration
# plane: emit a CURRENT liveliness Interest (`declare-interest`), collect
# the interest_id-tagged `Declare(DeclToken)` replies (`declare-token`)
# terminated by a `Declare(DeclFinal)` (`declare-final`). NOT the
# query / Request plane — so it does NOT imply `query-get` /
# `codec-request`. Mirror of `liveliness-subscriber`'s declare-* set.
liveliness-get = ["declare-interest", "declare-final", "declare-token", "wz-session-core/liveliness-get"]
# R311i — every declare-* feature implies codec-declare so the wire
# emit path (`send_declare_*` body-cfg branch) is mechanically
# available whenever the high-level declare surface is on.
declare-final = ["codec-declare", "wz-session-core/declare-final"]
declare-interest = ["codec-declare", "wz-session-core/declare-interest"]
declare-keyexpr = ["codec-declare", "wz-session-core/declare-keyexpr"]
declare-queryable = ["codec-declare", "wz-session-core/declare-queryable"]
declare-subscriber = ["codec-declare", "wz-session-core/declare-subscriber"]
declare-token = ["codec-declare", "wz-session-core/declare-token"]
declare-undeclare = ["codec-declare", "wz-session-core/declare-undeclare"]
# `query-get` implies `query-reply` (the get-side ReplyRegistry tracks
# pending entries) + `codec-request` (R311j — the wire-emit path
# `send_request_query` builds on Request/Query types gated by
# codec-request; `query-reply` itself pulls in `codec-response`).
#
# R311fq — `query-get` no longer implies `query-queryable`. The R307
# baseline welded the two so the in-process loopback fan inside
# `Session::query` (`observer.queryables.local_query` → `QueryReply` →
# `InboundReply`) always compiled, but that fused two ORTHOGONAL
# consumer planes — "I issue gets" (requester/client) vs "I answer
# queries" (queryable/responder) — into one forced edge, and made the
# SSOT `zget-reply-only` composability subset a misnomer (it silently
# pulled the queryable responder in). The loopback is now an EMERGENT
# capability of a process that selects BOTH planes: the fan is
# `#[cfg(feature = "query-queryable")]`-gated inside `Session::query`
# (the `observer.queryables` field is already query-queryable-gated),
# while the synthetic loopback Final stays under `query-get` so a pure
# wire-only getter (query-queryable OFF) finalises a SessionLocal/Any
# get immediately with zero local replies — the semantically correct
# shape (no queryable capability ⇒ no local queryable to answer).
# ap-demo + the AP MVP tests select both planes so they exercise the
# loopback exactly as before.
query-get = ["query-reply", "codec-request"]
# R311k — query-queryable (queryable-side reply emit) + query-reply
# (z_get-side reply consume) both imply codec-response so the wire
# Response surface compiles whenever the high-level query reply
# capability is on.
query-queryable = ["codec-request", "codec-response", "wz-session-core/query-queryable"]
query-reply = ["codec-request", "codec-response", "wz-session-core/query-reply"]
query-target = ["query-get"]
query-timeout = ["query-get"]
query-consolidation = ["query-get"]
# R311uy — storage-backend (§5.11 storage, atom 3/4): the StorageService
# DRIVER (`storage_service` module). Forwards the runtime-agnostic kernel
# (wz-session-core/storage-backend = the StorageBackend seam + the
# StorageState newer-wins gate) AND `query-queryable` — the driver's
# answering leg declares a COMPLETE queryable, so without it
# `declare_queryable` returns FeatureDisabled and the storage cannot serve
# gets. The capture subscriber + wire-RX (codec-push / pubsub-*) are the
# data-plane the storage composes with (on by default); a storage facing
# only loopback publishes works without them.
storage-backend = [
    "wz-session-core/storage-backend",
    "query-queryable",
    # The queryable's reply lifecycle ends in a terminating ResponseFinal
    # (the dispatch path stages `send_response_final` after the storage's
    # replies), so a storage genuinely needs the ResponseFinal wire frame.
    # query-queryable alone (codec-request + codec-response) does not pull
    # it; without it the `ResponseSink::send_response_final` use in the
    # dispatch loop is dead. A storage MUST terminate its query answers.
    "codec-response-final",
    # The driver declares its subscriber + queryable on a Unicast session
    # (the `session` / `session_glue` modules are transport-unicast-gated).
    "transport-unicast",
    # The storage versions by timestamp: the capture leg reads each Put's
    # MsgPut timestamp (newer-wins / version ordering) and the answer leg
    # emits each reply's value timestamp (the MsgPut T-flag). Both the wire
    # decode and the reply T-flag emit are pubsub-timestamp-gated, so a
    # storage genuinely needs it (without it every sample is fallback-stamped
    # and replies carry no version timestamp).
    "pubsub-timestamp",
    # Symmetric to pubsub-timestamp for the value ENCODING: the capture leg
    # reads each Put's MsgPut encoding (stored in StoredData) and the answer
    # leg serves it back on the reply (the MsgPut E-flag) so a querier renders
    # the value as published. Both legs are pubsub-encoding-gated.
    "pubsub-encoding",
]
# R311uz — storage-history (§5.11 storage, atom 2/4): forwards the
# History::All backend (wz-session-core/storage-history = HistoryStorage).
# The driver itself is generic over the backend (storage-backend gates the
# `storage_service` module); this feature makes the version-keeping backend
# available so a `StorageService::declare_with_backend(.., HistoryStorage)`
# is usable end-to-end. Implies storage-backend.
storage-history = ["storage-backend", "wz-session-core/storage-history"]
# Round 311vm — storage-replication (§5.11 storage, replication driver). The
# digest publisher/subscriber DRIVER (`storage_replication_service`). Forwards
# the no_std kernel digest stack (wz-session-core/storage-replication =
# Fingerprint / Digest / diff / wire codec) and storage-backend (the digest
# reflects the SAME live StorageState the StorageService captures into). Adds
# `codec-push` because the digest is PUBLISHED to remote replicas on
# `@-digest/<zid>/<config-fp>` (the publish remote leg is codec-push-gated) and
# `declare-subscriber` for the peer-digest subscriber. Implies storage-backend.
storage-replication = [
    "wz-session-core/storage-replication",
    "storage-backend",
    "codec-push",
    "declare-subscriber",
]
# Round 311 A8c-2a — storage-aligner (§5.11 storage, aligner driver). The
# aligner ANSWER queryable DRIVER (`storage_aligner_service`). Forwards the
# no_std aligner kernel (wz-session-core/storage-aligner = the AlignmentQuery /
# AlignmentReply protocol + the answer / pull engines + the wire codec; implies
# wz-session-core/storage-replication) and the driver's `storage-replication`
# (for `StorageService::shared_state` — the answer reflects the SAME live
# StorageState the StorageService captures into — plus the digest service the
# on_diff ask-loop seam wires to in a later atom). Adds `query-attachment`: the
# inbound AlignmentQuery rides the query attachment, read via
# `QueryView::attachment` (without it the answer always sees `None` and replies
# to nothing). Adds `pubsub-attachment`: the AlignmentReply rides the reply
# attachment (the inner MsgPut body ext), emitted via
# `ReplyOut::reply_keyed_attached` (without it the reply carries no
# AlignmentReply and the asker cannot align). Implies storage-replication.
storage-aligner = [
    "wz-session-core/storage-aligner",
    "storage-replication",
    "query-attachment",
    "pubsub-attachment",
    # A8c-2b ASK side: the pull loop GETs the peer's aligner queryable.
    # query-consolidation implies query-get (the Session::query seam) which
    # implies query-reply (the reply RX path + ReplyView::attachment /
    # put_encoding, A8b). query-timeout bounds each query so the followup loop
    # never hangs on an unreachable replica (the session emits Err+Final on
    # timeout, firing on_final).
    "query-consolidation",
    "query-timeout",
]
codec-init-body = ["wz-codecs/codec-init-body", "wz-session-core/codec-init-body"]
codec-open-body = ["wz-codecs/codec-open-body", "wz-session-core/codec-open-body"]
# R311b — codec-keep-alive forwards the wz-codecs gate. Session lease
# refresh path (last_inbound_keepalive_at stamp inside handle_inbound)
# is gated together with the wire-level KeepAlive parse/handle/FSM
# arms in session_glue.rs. Feature-off means a long-lived session
# eventually trips the lease.expired path because no peer KeepAlive
# can be decoded into a stamp update; the existing established_at
# baseline remains so short sessions still complete normally.
codec-keep-alive = ["wz-codecs/codec-keep-alive", "wz-session-core/codec-keep-alive"]
# R311c — codec-close forwards wz-codecs. Wire encode (encode_close +
# send_close_with_reason + bind_unit "send_close_frame_with_reason")
# + decode (parse_inbound T_MID_CLOSE) elide together; FSM-level
# CloseReason enum + set_close_reason_* bindings stay unconditional.
codec-close = ["wz-codecs/codec-close", "wz-session-core/codec-close"]
# R311d batch — scouting + multicast codecs. This crate forwards the
# features to wz-codecs for SCXML emit/include elision. session_glue.rs
# does NOT use Scout/Hello/Join types, so no source-side cfg gates
# exist here; the forwards stay catalog-uniform with the rest of the
# codec features for a future scouting-active runtime to reuse.
codec-scout = ["wz-codecs/codec-scout"]
codec-hello = ["wz-codecs/codec-hello"]
# R311kt — codec-join now ALSO forwards wz-session-core (the hoisted
# `multicast_join` JOIN wire SSOT this crate's drive loop consumes),
# catalog-uniform with the other body codecs' 3-stage chain.
codec-join = ["wz-codecs/codec-join", "wz-session-core/codec-join"]
# R311e — codec-response-final forwards wz-codecs + gates the
# session_glue.rs send/build/encode_frame_with/NetworkMessage variant/
# parse arm cluster. Feature-off: queryable can't emit the terminator;
# requesting peer's z_get hangs until per-call timeout fires.
codec-response-final = ["wz-codecs/codec-response-final", "wz-session-core/codec-response-final", "wz-codecs-test-support/codec-response-final"]
# R311f — codec-fragment forwards wz-codecs. session_glue.rs doesn't
# import Fragment types; gate stays at wz-codecs level only.
codec-fragment = ["wz-codecs/codec-fragment"]
# R311g — codec-frame gates the Frame envelope INBOUND decode path:
# wz-codecs `pub mod frame` + session_glue.rs `InboundFrame::Frame`
# variant + `parse_inbound` `T_MID_FRAME` arm + `parse_frame_payload` +
# the `inbound_to_fsm_event` / `poll_and_dispatch_one` Frame match
# arms. R311g leaves the outbound `encode_frame_with_<body>` helpers
# unguarded by codec-frame because they are logically owned by their
# body codecs — R311h..R311k will gate them under codec-push /
# codec-declare / codec-request / codec-response respectively AND add
# `codec-<body> = ["codec-frame"]` implications so codec-frame OFF
# becomes meaningful only when every body codec is also off
# (handshake-only deploy: Init / Open / Close + KeepAlive). In the
# R311g interim state codec-frame OFF removes inbound Frame decode
# while outbound emit still produces Frame envelopes; the inbound
# fall-through is `InboundFrame::Unknown { mid: 0x05 }` which the FSM
# treats as FramingError. Honest semantics: a codec-frame-OFF
# wz-runtime-tokio cannot terminate a peer's data exchange and is
# only sensible as a future handshake-only build.
codec-frame = ["wz-codecs/codec-frame", "wz-session-core/codec-frame"]
# R311im — transport reassembly (Tier B). Forwards to the
# wz-session-core `reassembly` feature (the ReassemblyDispatcher + the
# engine-free slot FSM) and implies `codec-frame`: a reassembled
# fragment chain re-enters the `T_MID_FRAME` payload decode path
# (`parse_frame_payload`), so the Frame body codec must be present. Off by
# default; the AP host wires the dispatcher into `drive_session_until_terminal`
# and the `InboundFrame::Fragment` parse arm only under this feature.
reassembly = ["wz-session-core/reassembly", "codec-frame"]

# transport-fragmentation (R311jm) — forwards the session-core TX
# fragmentation gate + the runtime `reassembly` RX wiring so the AP
# profile fragments + reassembles full-duplex.
transport-fragmentation = ["wz-session-core/transport-fragmentation", "reassembly"]

# transport-lowlatency — forwards the session-core lowlatency gate (the
# `extlowlatency` ext codec + the per-session `is_lowlatency` slot + the lean
# tx / rx data path). AP/unicast lean transport (the wz mirror of zenoh's
# lowlatency unicast transport); no MCU forward (lwip has no lowlatency, as
# session-extauth is AP-only). No new dependency.
transport-lowlatency = ["wz-session-core/transport-lowlatency"]

# transport-compression / session-extcompression — forward the session-core
# lz4 batch wrap + the Z_EXT_COMPRESSION (0x6) handshake. AP/unicast (no MCU
# forward, as session-extauth / transport-lowlatency are AP-only). NO new dep
# at the runtime layer (lz4_flex rides session-core).
transport-compression = ["wz-session-core/transport-compression"]
session-extcompression = ["wz-session-core/session-extcompression"]

# transport-shm — the scoped same-host SHM data path: forwards the session-core
# no_std machinery (descriptor + 0x2 marker + is_shm + ShmResolver trait) and
# pulls memmap2 for the AP POSIX segment (shm_provider). AP-only (no MCU forward
# -- pico has no SHM). R3a is the inert provider + codec; R3b adds the live swap +
# the Z_EXT_SHM challenge handshake (session-extshm).
transport-shm = ["wz-session-core/transport-shm", "dep:memmap2"]

# session-extshm — the scoped Z_EXT_SHM establishment handshake (a UNIT capability
# offer/`&=`, NOT zenoh's full challenge-response); forwards the session-core
# negotiation + transport-shm (the data path it enables). AP-only.
session-extshm = ["wz-session-core/session-extshm", "transport-shm"]
# R311h — codec-push forwards wz-codecs and pulls codec-frame as a
# hard imply (Frame envelope is the wire carrier for every Push). When
# the feature is off the wz-runtime-tokio Push import + N_MID_PUSH +
# 8 build_push_* + encode_frame_with_push + send_push_* + NetworkMessage::Push +
# parse_frame_payload N_MID_PUSH arm all elide; the pubsub.rs module
# also disappears (gated at lib.rs because dispatch_push references
# Push directly). Honest semantics: feature-off = no pub/sub data
# carrier on the wire. The codec-push = ["codec-frame", ...] imply
# closes the first body-codec handshake-only-deploy contract slot
# (codec-frame OFF now requires codec-push OFF; R311i/j/k will extend
# the same imply to declare/request/response).
codec-push = ["wz-codecs/codec-push", "codec-frame", "wz-session-core/codec-push", "wz-codecs-test-support/codec-push"]
# R311i — codec-declare gates wz-runtime-tokio's Declare wire surface
# in session_glue.rs: Declare/DeclareVariant/Decl*/Undecl* imports,
# N_MID_DECLARE const, 8 build_declare_* + 4 build_undeclare_* +
# encode_frame_with_declare + NetworkMessage::Declare variant + the
# parse_frame_payload N_MID_DECLARE arm. codec-declare = ["codec-frame"]
# closes the second body-codec-implies-envelope edge (handshake-only
# deploy: codec-frame OFF requires every body codec OFF; codec-push +
# codec-declare are the first two edges). The consumer-side declare/
# subscriber/queryable/liveliness/liveliness_subscriber modules
# + pubsub.rs absorb_declare stay always-on at this round per the
# R311m architectural deferral.
codec-declare = ["wz-codecs/codec-declare", "codec-frame", "wz-session-core/codec-declare", "wz-codecs-test-support/codec-declare"]
# R311j — codec-request gates the wz-runtime-tokio Request wire surface
# in session_glue.rs: Request/RequestVariant/Query imports, N_MID_REQUEST
# const, build_request_query + build_request_query_with_meta +
# encode_frame_with_request + NetworkMessage::Request variant + parse arm.
# codec-request = ["codec-frame"] closes the third
# body-codec-implies-envelope edge. query-get / query-queryable imply
# codec-request so the wire path is mechanically available whenever
# the high-level query surface is on.
codec-request = ["wz-codecs/codec-request", "codec-frame", "wz-session-core/codec-request", "wz-codecs-test-support/codec-request"]
# R311k — codec-response gates the wz-runtime-tokio Response wire
# surface in session_glue.rs: Response/ResponseVariant/Reply/Err
# imports, N_MID_RESPONSE const, 4 build_response_* builders,
# encode_frame_with_response, NetworkMessage::Response variant + parse
# arm. codec-response = ["codec-frame"] closes the FOURTH and final
# body-codec-implies-envelope edge: after R311k, codec-frame OFF
# requires every body codec OFF, materialising the handshake-only
# deploy contract (Init / Open / Close + KeepAlive only). query-reply
# and query-queryable imply codec-response (the reply emit path on
# the queryable side).
codec-response = ["wz-codecs/codec-response", "codec-frame", "wz-session-core/codec-response", "wz-codecs-test-support/codec-response"]
# R311cb — transport domain wire-up. 5 atomic features that have real
# source behavior in this crate (Cargo.toml authoring intent: "16
# atomic, 5 active / 11 reserved"). Each gates a concrete cfg site:
#   transport-link-tcp     — TcpDriver struct + LinkDriver impl + the
#                            tokio::net::TcpStream import (lib.rs ~315).
#   transport-link-udp     — UdpDriver struct + LinkDriver impl + the
#                            tokio::net::UdpSocket import (lib.rs ~517).
#   transport-unicast      — FOUNDATIONAL, not an excludable atomic
#                            (R311fe, same class as keyexpr-canon). It
#                            gates `pub mod session_fsm_unicast` (lib.rs
#                            ~203) and the entire session_glue.rs depends
#                            on the SessionFsmUnicast{Event,Policy} types,
#                            so feature-off does not type-check — and
#                            there is no alternate FSM to fall back to
#                            (transport-multicast stays reserved with no
#                            consumer; introducing a stub FSM purely to
#                            make the OFF subset build would be a
#                            speculative YAGNI fork). Genuine exclusion is
#                            blocked until a second FSM genuinely lands;
#                            until then this is a default-on toggle that
#                            the arbitrary-subset CI lanes (C4c build +
#                            C1j behaviour, scripts/run-ci.sh) pin ON.
#                            The other
#                            transport atomics below ARE independently
#                            composable on top of it.
#   transport-keepalive    — start_keepalive_worker / stop_keepalive_worker
#                            action bindings + the worker spawn body in
#                            session_glue.rs. R311g1 silent no-op when
#                            disabled (the bind_unit registers a no-op
#                            so the SCXML script-action surface stays
#                            available; the spawn body short-circuits).
#                            Wire-level KeepAlive parse stays governed
#                            by codec-keep-alive — transport-keepalive
#                            disables only the active sender side.
#   transport-batching     — TX coalescing window (BatchTx accumulation
#                            + batch_start/flush/stop), zenoh-pico
#                            Z_FEATURE_BATCHING parity. The INIT
#                            batch_size negotiation is CORE (ungated)
#                            since R311kl — pico negotiates outside its
#                            batching gate (unicast/transport.c:135-140).
# reserved (link-tls/quic/ws/unixsock/vsock, compression, shm,
# lowlatency) stay declaration-only at the wz facade Cargo.toml level;
# this crate does not own them.
transport-link-tcp = []
transport-link-udp = []
# R311nv — host tty backend for the SERIAL link. Forwards the
# wz-session-core `transport-link-serial` gate (the R311nt
# transport-agnostic `serial_link` framing/handshake/locator logic +
# the R311ns `codec-serial` framing codecs) and pulls the optional
# `tokio-serial` dep that `serial_pipeline` opens the tty / drives the
# async byte I/O over. Like `transport-link-udp`, the session-open
# integration (DialedLink::Serial / dial_locator serial arm) lives in
# the `transport-link-tcp`-gated `session_open` module as an additive
# `#[cfg(transport-link-serial)]` arm, so a serial session-open build
# also carries tcp (the "session_open is available" gate) exactly as a
# udp session-open build does. The `serial_pipeline` drivers themselves
# compile standalone under this feature alone. NOT in the default set —
# zenoh-pico ships serial default-OFF (optional Z_FEATURE_LINK_SERIAL).
transport-link-serial = ["wz-session-core/transport-link-serial", "dep:tokio-serial"]
# R311oa — host TLS-over-TCP backend for the TLS link. Forwards
# `transport-link-tcp` (TLS reuses the ENTIRE TCP stream pipeline — the
# StreamEnvelope length-prefix framing, the shared `poll_framed` reader, the
# writer task — over a rustls-wrapped byte stream, so no new codec) and pulls
# the optional `tokio-rustls` dep that `tls_pipeline` runs the rustls
# client/server handshake over. The locator PARSE (`Proto::Tls`) is
# unconditional in wz-session-core (no feature forward); only the
# dial/accept BACKEND is gated here. Cert material the locator cannot carry
# is supplied at the explicit `dial_tls`/`accept_tls` call site, so the
# generic `dial_locator` returns Unsupported for `tls/...`. NOT in the
# default set — zenoh-pico ships TLS as an optional link (Z_FEATURE_LINK_TLS).
transport-link-tls = ["transport-link-tcp", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:base64"]
# R311ob — host WebSocket link backend. UNLIKE TLS (which forwards
# transport-link-tcp because it reuses the TCP StreamEnvelope framing), WS is
# a DATAGRAM-flow link (zenoh-pico `_z_new_link_ws` sets
# `Z_LINK_CAP_FLOW_DATAGRAM`): the transport adds NO length prefix
# (`__unsafe_z_prepare_wbuf` reserves the 2-byte prefix only for
# `FLOW_STREAM`, src/transport/common/tx.c:347), so each zenoh batch rides one
# WebSocket BINARY message whose frame boundary delimits it — exactly the UDP
# model, NOT a custom byte codec. So `ws_pipeline` reuses neither `stream_link`
# nor a codec; it wraps a `tokio_tungstenite::WebSocketStream` (the RFC6455
# protocol layer) split via `futures_util`. No tcp forward (the session-open
# Ws arm rides the tcp+unicast-gated `session_open` like the udp arm). NOT
# default — pico ships WS as an optional link (Z_FEATURE_LINK_WS).
transport-link-ws = ["dep:tokio-tungstenite", "dep:futures-util"]
# R311xi — host Unix-domain-stream link backend. Like TLS (and UNLIKE WS), it
# forwards `transport-link-tcp` because a unix socket is a reliable byte STREAM
# (zenoh's `unixsock_stream` link: `is_streamed() = true`, MTU 65535) that
# reuses the ENTIRE TCP `stream_link` pipeline — the StreamEnvelope
# length-prefix framing, the shared `poll_framed` reader, the writer task —
# over a `tokio::net::UnixStream` instead of a `TcpStream`, so no new codec.
# Pulls NO new dep: tokio's `net` feature already carries `UnixStream` /
# `UnixListener` on Unix (vs TLS's `tokio-rustls` / WS's `tokio-tungstenite`).
# The locator PARSE (`AnyLocator::Unixsock`) is unconditional in
# wz-session-core (no feature forward, like serial); only the dial/accept
# BACKEND is gated here, and the `session_open` DialedLink::Unixsock arm rides
# the `transport-link-tcp`-gated session-open module additively, like the tls
# arm. NOT default — pico has no unixsock transport at all (host-only link).
transport-link-unixsock = ["transport-link-tcp"]
# R311xj — host AF_VSOCK link backend (VM<->host / VM<->VM). Like tls/unixsock
# (and UNLIKE ws), forwards `transport-link-tcp`: vsock is a reliable byte
# STREAM (zenoh's vsock link: is_streamed/is_reliable=true, MTU=BatchSize::MAX)
# that reuses the ENTIRE TCP `stream_link` pipeline over a `tokio_vsock::VsockStream`
# (split via `tokio::io::split`, the TLS pattern, since VsockStream has no
# owned-half split), so no new codec. Pulls the optional, Linux-only
# `tokio-vsock` dep (see [target.'cfg(target_os="linux")'] below). The locator
# PARSE (`AnyLocator::Vsock`) is unconditional + platform-independent in
# wz-session-core (no feature forward, like serial/unixsock); only the
# dial/accept BACKEND is gated here, and the `session_open` DialedLink::Vsock
# arm is `#[cfg(all(transport-link-vsock, target_os="linux"))]`. NOT default —
# pico has no vsock transport (host VM-IPC link).
transport-link-vsock = ["transport-link-tcp", "dep:tokio-vsock"]
# R311xk — host QUIC link backend. Like tls (and UNLIKE ws), forwards
# `transport-link-tcp`: QUIC frames a zenoh batch over ONE bidirectional stream
# with the SAME StreamEnvelope length-prefix as TCP, reusing the entire
# `stream_link` pipeline over a `quinn::{SendStream,RecvStream}` pair (already
# split — no `into_split`/`tokio::io::split`). Pulls `quinn` + the SAME rustls
# cert stack as tls (`tokio-rustls`/`rustls-pemfile`/`base64`) because QUIC's
# cert config IS a rustls ClientConfig/ServerConfig (TLS 1.3-only + ALPN
# `hq-29`), built by `quic_config` reusing the `tls_config` PEM loaders. The
# locator PARSE (`Proto::Quic`) is unconditional in wz-session-core (IP-family
# numeric host:port, like tls/ws — NOT a new AnyLocator variant); only the
# dial/accept BACKEND is gated here. Cert material the locator cannot carry is
# threaded via `DialConfig.quic` (the tls pattern), so the generic
# `dial_locator` returns Unsupported for `quic/...` without it. NOT default.
transport-link-quic = ["transport-link-tcp", "dep:quinn", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:base64"]
# R311qa — multi-peer accept-and-hold capability (the `routing-router` /
# future `routing-peer` foundation). Gates `pub mod accept_loop` (lib.rs) and
# pulls its prerequisites: the TCP listen path (`transport-link-tcp`), the
# unicast session machinery it opens each face through (`transport-unicast`),
# and `dep:futures-util` for the single-task `FuturesUnordered` hold. A SHARED
# atom both role features compose (router now, peer later) rather than gating it
# under `routing-router` directly — that keeps a future `routing-peer` from
# depending on `routing-router`. Off by default (like `transport-link-ws`); the
# `routing-accept` test lane (run-ci Layer C1w) and the facade `routing-router`
# preset select it.
routing-accept = ["transport-link-tcp", "transport-unicast", "dep:futures-util"]
# R311qc — the data-plane forwarding atom: gates `pub mod routing_forward`
# (lib.rs) — the `RoutingForwarder` that backs the `accept_loop`'s
# `FaceForwarder` seam with the `wz-session-core` `routing::RouteTable`. Pulls
# the accept-and-hold foundation it forwards on top of (`routing-accept`), the
# kernel (`wz-session-core/routing-routes`), and the Push / DeclareSubscriber
# codecs the forward + route-build read (`codec-push` / `declare-subscriber`).
# Off by default; the facade `routing-routes` preset and the run-ci forwarding
# lanes select it.
routing-routes = [
    "routing-accept",
    "wz-session-core/routing-routes",
    "codec-push",
    "declare-subscriber",
]
# R311qg — routing-peer atom 1: the dial+accept mesh-node foundation. Gates the
# `peer_loop` entry in `accept_loop` — a node that DIALS a configured peer set
# AND accepts inbound, holding both in one face set. Reuses the ENTIRE
# `routing-accept` machinery (the shared `face_drive_loop` core); the only
# net-new surface is the dial-out face source (`dial_face`), so it just pulls
# `routing-accept`. Hold-only (NoOpForwarder); mesh forwarding + zid-keyed loop
# dedup is a later atom. Off by default; the facade `routing-peer` selects it.
# R311qw — pulls `wz-routing-graph`, the linkstate-peer topology graph
# crate (lifted out of this crate so the runtime-agnostic kernel does not
# live in the tokio runtime crate); `dep:wz-routing-graph` keeps the graph
# (+ its petgraph dep) off every non-peer build.
# R311qr — pulls `wz-codecs/codec-linkstate` so the driver's `forward`
# (c3) can name the decoded `LinkstateListOwned` the graph ingests.
# R311qu — pulls `wz-session-core/codec-linkstate` for the OAM-LINKSTATE
# carrier (`try_parse_linkstate_oam`) the `linkstate_forward` driver (c3)
# decodes inbound topology with.
routing-peer = [
    "routing-accept",
    "dep:wz-routing-graph",
    "wz-codecs/codec-linkstate",
    "wz-session-core/codec-linkstate",
    # R311rd — a routing peer is a full mesh node: it carries the data plane
    # (`codec-push`), so the OAM-LINKSTATE TX seam co-gated on `codec-push`
    # is always present (a routing-peer build can never be the degenerate
    # "topology relay with no send path" that silently no-ops the flood).
    "codec-push",
    # R311rq — c3c-3 subscription-filtered routing carries DeclareSubscriber
    # across the mesh (the interest-propagation control plane that bounds the
    # data flood to interested subtrees), so the Declare wire surface +
    # declare_routing_context node_id seam are part of a routing peer's
    # contract.
    "codec-declare",
    # R311ub — query routing (atom 2) relays a Request (Query) across the mesh
    # toward the matching queryables (forward_request), so the Request wire
    # surface + the request_routing_context node_id seam are part of a routing
    # peer's contract — the query-plane twin of the codec-declare interest plane.
    "codec-request",
    # R311uc — query routing (atom 3) routes a Query's Response + ResponseFinal
    # BACK to the querier across the mesh (forward_response / _final, keyed by the
    # pending-query table), so the Response + ResponseFinal wire surfaces are part
    # of a routing peer's contract (the reply twin of the codec-request forward).
    "codec-response",
    "codec-response-final",
    # R311rd — and it must FRAGMENT an oversize link-state flood: a large
    # mesh's full-topology OAM exceeds the link MTU (and the u16 frame cap),
    # so without this the flood is silently dropped at the stream guard.
    "transport-fragmentation",
]
# ── §5.16 access-control composition knobs ───────────────────────────
# Each independently elides ONE interceptor on the routing-peer admission
# chain (interceptor/{access_control,downsampling,low_pass}.rs). The chain
# SEAM (InterceptorChain / InterceptorContext / InterceptorFlow / the
# per-face admit in linkstate_forward) stays under `routing-peer`, so all
# three imply it; an empty config — or a routing-peer build that selects
# none of these — is access control disabled (every message admitted).
# `access-acl` additionally pulls the pure policy ENGINE crate
# (wz-access-control); the enforcer adapter consumes it. Promoted from
# always-on-under-routing-peer to real cfg knobs so a routing peer composes
# exactly the admission filters it needs (Layer F footprint).
access-acl = ["routing-peer", "dep:wz-access-control"]
access-downsampling = ["routing-peer"]
access-quota = ["routing-peer"]
# R311il — FOUNDATIONAL session gate. Forwards to wz-session-core's
# `session-unicast`, which codegens the engine-free unicast session FSM
# (sources/session/session_fsm_unicast.scxml, `--no-std`) into the
# runtime-agnostic core — the codegen moved out of this crate's build.rs
# (now deleted), mirroring the reassembly + scouting FSMs. This crate's
# `session_glue` then impls the generated `SessionFsmUnicastActions` trait
# on `SessionActionsBinding` and drives `SessionFsmUnicastPolicy<_>`; the
# `crate::session_fsm_unicast` path is a `pub use` re-export of
# `wz_session_core::session_fsm_unicast` (lib.rs). No Lua / IScriptEngine
# is involved — this completes the runtime-schism resolution (the scouting
# half landed in R311ik), so `sce-rust-lua` leaves the whole graph.
transport-unicast = ["wz-session-core/session-unicast"]
# Round C — multicast transport gate. Forwards to wz-session-core's
# `session-multicast` (which codegens the engine-free §3.1 session-level +
# §3.2 per-peer FSMs into the core) and gates this crate's `multicast_glue`
# drive loop. Pulls `codec-join` (the JOIN beacon body codec the loop
# encodes/decodes). The handshake-free multicast sibling of
# `transport-unicast`; the wz facade `transport-multicast` forwards here.
# A1b — `codec-frame` rides along for the data plane: the drive loop
# decodes inbound `T_MID_FRAME` envelopes (`parse_inbound`) and fans their
# NetworkMessage payloads into the application registries
# (`parse_frame_payload`). A multicast transport that cannot deliver data
# would be an inert beacon, so the dep is a kconfig select, not an
# optional compose (which consumer arms then act on the fanned messages
# stays per-consumer-feature, exactly as on the unicast path).
# R311mk — `codec-close` joins the select set: the shared multicast RX SSOT
# `wz_session_core::multicast_rx` is gated on codec-close (it decodes
# `T_MID_CLOSE` and aborts the leaving peer's reassembly chains via
# `close_by_src` — multicast_rx.rs:147,209), and `multicast_glue` consumes
# that SSOT. Without this the previously-default-masked `multicast_rx`
# import did not resolve in a `transport-multicast`-without-default build
# (the facade composability gap). A multicast transport that cannot process
# a peer's Close is incomplete, so codec-close is a select, not optional.
transport-multicast = ["wz-session-core/session-multicast", "codec-join", "codec-frame", "codec-close", "dep:socket2"]
# chunk-5 — forward to the wz-session-core same-named gate so the migrated
# start/stop_keepalive_worker action bodies compile under the keepalive axis.
transport-keepalive = ["wz-session-core/transport-keepalive"]
# R311kl — forward to the wz-session-core same-named gate, which now
# covers ONLY the TX coalescing machinery (BatchTx accumulation arm +
# batch_start/flush/stop window). The INIT batch_size negotiation
# (PeerInitCaps honoring + the min reduction) is core transport there,
# ungated — pico parity (Z_FEATURE_BATCHING never gated negotiation).
transport-batching = ["wz-session-core/transport-batching"]
# A4 — forward to the wz-session-core same-named gate (declaration cache
# storage + reset_for_reopen / replay_declarations bodies). zenoh-pico
# Z_FEATURE_AUTO_RECONNECT parity; pico defaults it ON (CMakeLists
# Z_FEATURE_AUTO_RECONNECT=1), so this crate's batteries-included default
# set carries it like transport-batching/-keepalive. The re-dial +
# re-handshake supervisor loop is this crate's side (A4b).
session-reconnect = ["wz-session-core/session-reconnect"]

# R311kh — matching-listener surface (zenoh-pico Z_FEATURE_MATCHING,
# default-on in pico's CMake cache): forwards the wz-session-core watch
# machinery; the Publisher/Querier declare_matching_listener methods are
