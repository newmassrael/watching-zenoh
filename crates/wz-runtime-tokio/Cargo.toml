attachment-bytes = ["wz-session-core/attachment-bytes"]
pubsub-put = ["wz-session-core/pubsub-put"]
pubsub-delete = ["wz-session-core/pubsub-delete"]
pubsub-allow-loop = []
pubsub-attachment = ["wz-session-core/pubsub-attachment"]
pubsub-timestamp = ["wz-session-core/pubsub-timestamp"]
pubsub-encoding = ["wz-session-core/pubsub-encoding"]
pubsub-source-info = ["wz-session-core/pubsub-source-info"]
pubsub-priority = ["wz-session-core/pubsub-priority"]
pubsub-congestion-control = ["wz-session-core/pubsub-congestion-control"]
pubsub-express = ["wz-session-core/pubsub-express"]
