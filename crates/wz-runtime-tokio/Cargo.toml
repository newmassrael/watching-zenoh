session-extauth = ["wz-session-core/session-extauth"]
# R3 usrpwd — forward the §5.16 usrpwd auth method (UsrPwdMethod + HMAC-SHA3-256)
# into the AP runtime; implies session-extauth (the dispatch kernel). R3b — the
# LOCAL session-extauth must be on too, so the AP-layer wiring gated on it
