#                        sides. Any one composes the single packed QoS
#                        byte. Forwards to wz-session-core for the inbound
#                        Sample.qos projection (any-of decode) AND gates
#                        the local SEND vertical: `PublishOptions::with_qos`
#                        setter (session.rs) + build_push_outer_extensions
