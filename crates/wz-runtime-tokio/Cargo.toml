#
# wz-runtime-tokio — sce_link_runtime_tokio (Rust + tokio + mio epoll
# baseline) per docs/runtime-crate-tokio.md.
#
# Phase Z entry (R51). Initial surface: `LinkDriver` trait + tokio
# TCP impl + 2-task `tests/echo_demo.rs` proving wire interop end-
# to-end. This is the FIRST round in the project where two
# concurrent processes (here: tokio tasks on a single process via
# loopback) exchange real wire bytes encoded by wz-codecs and decoded
# back on the other side.
#
# Scope reduction vs the full docs/runtime-crate-tokio.md spec:
#   - 1 process, 2 tasks (publisher + subscriber on loopback TCP)
#   - LinkDriver trait shape matches §2.1 but only the 4 core methods;
#     trust-class gating (§2.4) + io_uring opt-in (§4.1) + pool-slot
#     Rx borrows (§2.3) all deferred to later rounds.
#   - Codec wiring is fixed to msg_put for the demo; full SCXML-driven
#     binding lands when session_fsm wiring closes (R54+).
#
# The R52 echo demo is the OBSERVABLE COMMUNICATION MILESTONE the
# project has been working toward since R28 ("when will we see
# communication?"). It does not yet exercise session FSM handshake
# or framing; the publisher sends a raw msg_put body, the subscriber
# decodes the raw msg_put body. This is the smallest end-to-end
# proof that wz-codecs Layer 3-validated bytes survive a real
# network round-trip.

[package]
name = "wz-runtime-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Tokio + mio epoll runtime for watching-zenoh AP linux target (Phase D.1)."

[lib]
name = "wz_runtime_tokio"
path = "src/lib.rs"

# R302b — first source-level Cargo features. `default = [...]` keeps
# existing in-workspace consumers (wz-ap-demo, integration tests,
# session_fsm tests) building unchanged; opt-out via
# `cargo check --no-default-features` exercises the feature-off path.
# Downstream of the `wz` facade these features are forwarded via
# `wz-runtime-tokio?/liveliness-token` etc. so a wz consumer enabling
# `preset-mcu-minimal` (no liveliness) gets the slim build.
#
# R307 — query domain joins the source-gated set (6 new entries).
# `query-get` gates `Session::get` / `Session::get_aliased`;
# `query-queryable` gates `Session::declare_queryable` /
# `declare_queryable_aliased` + the entire `crate::query` module;
# `query-reply` gates the entire `crate::reply` module (the get-side
# ReplyRegistry). Per-option setters on `QueryOptions` gate behind
# `query-target` / `query-timeout` / `query-consolidation` — each
# implies `query-get` since they only refine the get call path.
# `query-get` implies `query-reply` because `Session::get` registers a
# pending entry against `crate::reply::ReplyRegistry`. The defaults
# below mirror R302b: every existing in-workspace consumer compiles
# unchanged because the default features turn every R307 gate ON.
#
# R309 — declare domain joins the source-gated set (7 new entries).
# Each `send_declare_*` / `send_undeclare_*` / `send_interest_*` method
# in `session_glue.rs` carries the matching gate; the
# Application-layer `Session::declare_*` call sites remain on their
# existing semantic gate (`liveliness-token`, `query-queryable`,
# etc.) and pull the wire-emit transitively via the implication chain
# below. `liveliness-token` now implies `declare-token` +
# `declare-undeclare` so the existing R277 `LivelinessToken::Drop`
# emit continues to compile; `liveliness-subscriber` implies
# `declare-interest` + `declare-final` (R280 send_interest_*).
[features]
# R311a1 — codec-init-body / codec-open-body forwards to the matching
# wz-codecs feature. Forward-only (no force-ON): the wz-codecs dep
# below switches to `default-features = false` so the codec emit/
# include is governed purely by these forwards, which makes a future
# facade-level `--no-default-features` (R311a4) actually able to elide
# the init_body / open_body codec pair. R311a2 cfg-gates the
# `use wz_codecs::init_body::InitBody` import sites in session_glue.rs;
# R311a3 cfg-gates the `InboundFrame::Init { body, .. }` enum variant
# and parse/match arms. Until R311a3 lands, `--no-default-features` at
# wz-runtime-tokio level breaks compile (intended cascade chain).
default = [
    "liveliness-token",
    "liveliness-subscriber",
    "liveliness-history",
    "query-get",
    "query-queryable",
    "query-reply",
    "query-target",
    "query-timeout",
    "query-consolidation",
    "declare-final",
    "declare-interest",
    "declare-keyexpr",
    "declare-queryable",
    "declare-subscriber",
    "declare-token",
    "declare-undeclare",
    "codec-init-body",
    "codec-open-body",
    "codec-keep-alive",
    "codec-close",
    "codec-scout",
    "codec-hello",
    "codec-join",
    "codec-response-final",
    "codec-fragment",
    "codec-frame",
    "codec-push",
    "codec-declare",
    "codec-request",
    "codec-response",
    "transport-link-tcp",
    "transport-link-udp",
    "transport-unicast",
    "transport-keepalive",
    "transport-batching",
    "pubsub-put",
    "pubsub-delete",
    "pubsub-allow-loop",
    "pubsub-attachment",
    "pubsub-timestamp",
    "pubsub-encoding",
    "pubsub-source-info",
    "pubsub-priority",
    "pubsub-congestion-control",
    "pubsub-express",
    "session-unicast-open",
    "session-unicast-accept",
    "session-reconnect",
    "session-matching",
    "keyexpr-canon",
    "keyexpr-wildcard-single",
    "keyexpr-wildcard-double",
    "keyexpr-dollar-star",
    "keyexpr-includes",
    "query-attachment",
    "query-selector-parameters",
    "query-reply-err",
    "query-source-info",
    "query-value",
]
# R311dz — liveliness-* / declare-{subscriber,queryable} additionally
# forward to the wz-session-core same-named gate-only feature so the
# migrated `ApplicationLayerObserver` field for that domain is composed
# consistently with this crate's selection. The richer declare-* wire
# implications below are unchanged.
liveliness-token = ["declare-token", "declare-undeclare", "wz-session-core/liveliness-token"]
liveliness-subscriber = ["declare-interest", "declare-final", "wz-session-core/liveliness-subscriber"]
# R311xy — liveliness-history: the CURRENT-state-replay REQUEST on a
# liveliness subscriber (the `history = true` option -> CURRENT bit on the
# outbound Interest + the history_complete snapshot signal). A real per-call
# cfg gate (R311cl's "per-call gate, not field gate"): with this OFF a
# liveliness-subscriber build is future-only (the history option is a
# documented no-op, signature-stable). Implies liveliness-subscriber (the
# gate lives inside the subscriber declare path). zenoh/zenoh-pico expose
# history as a runtime option only; this compile-time elision is a wz
# superset for slim/MCU presence-only builds.
liveliness-history = ["liveliness-subscriber"]
# liveliness-get — requester-side snapshot get. Wire = the declaration
# plane: emit a CURRENT liveliness Interest (`declare-interest`), collect
# the interest_id-tagged `Declare(DeclToken)` replies (`declare-token`)
# terminated by a `Declare(DeclFinal)` (`declare-final`). NOT the
# query / Request plane — so it does NOT imply `query-get` /
# `codec-request`. Mirror of `liveliness-subscriber`'s declare-* set.
liveliness-get = ["declare-interest", "declare-final", "declare-token", "wz-session-core/liveliness-get"]
# R311i — every declare-* feature implies codec-declare so the wire
# emit path (`send_declare_*` body-cfg branch) is mechanically
# available whenever the high-level declare surface is on.
declare-final = ["codec-declare", "wz-session-core/declare-final"]
declare-interest = ["codec-declare", "wz-session-core/declare-interest"]
declare-keyexpr = ["codec-declare", "wz-session-core/declare-keyexpr"]
declare-queryable = ["codec-declare", "wz-session-core/declare-queryable"]
declare-subscriber = ["codec-declare", "wz-session-core/declare-subscriber"]
declare-token = ["codec-declare", "wz-session-core/declare-token"]
declare-undeclare = ["codec-declare", "wz-session-core/declare-undeclare"]
# `query-get` implies `query-reply` (the get-side ReplyRegistry tracks
# pending entries) + `codec-request` (R311j — the wire-emit path
# `send_request_query` builds on Request/Query types gated by
# codec-request; `query-reply` itself pulls in `codec-response`).
#
# R311fq — `query-get` no longer implies `query-queryable`. The R307
# baseline welded the two so the in-process loopback fan inside
# `Session::query` (`observer.queryables.local_query` → `QueryReply` →
# `InboundReply`) always compiled, but that fused two ORTHOGONAL
# consumer planes — "I issue gets" (requester/client) vs "I answer
# queries" (queryable/responder) — into one forced edge, and made the
# SSOT `zget-reply-only` composability subset a misnomer (it silently
# pulled the queryable responder in). The loopback is now an EMERGENT
# capability of a process that selects BOTH planes: the fan is
# `#[cfg(feature = "query-queryable")]`-gated inside `Session::query`
# (the `observer.queryables` field is already query-queryable-gated),
# while the synthetic loopback Final stays under `query-get` so a pure
# wire-only getter (query-queryable OFF) finalises a SessionLocal/Any
# get immediately with zero local replies — the semantically correct
# shape (no queryable capability ⇒ no local queryable to answer).
# ap-demo + the AP MVP tests select both planes so they exercise the
# loopback exactly as before.
query-get = ["query-reply", "codec-request"]
# R311k — query-queryable (queryable-side reply emit) + query-reply
# (z_get-side reply consume) both imply codec-response so the wire
# Response surface compiles whenever the high-level query reply
# capability is on.
query-queryable = ["codec-request", "codec-response", "wz-session-core/query-queryable"]
# adminspace-core (§5.23) — the built-in `@/<zid>/<whatami>/**` admin queryable:
# `Session::declare_adminspace(version, locators)` registers it through the
# existing `query-queryable` declare path and answers a GET under the node
# prefix with the `local_data` JSON. Composes `query-queryable` (the declare /
# reply machinery) with `wz-session-core/adminspace-core` (the `AdminLocalData`
# view + JSON emitter). The wz mirror of zenoh `net/runtime/adminspace.rs`.
adminspace-core = ["query-queryable", "wz-session-core/adminspace-core"]
# adminspace-metrics (§5.23) — the @/<zid>/<whatami>/metrics admin GET: a second
# dispatch branch in declare_adminspace's handler replying the OpenMetrics
# build-info body (text/plain). Composes adminspace-core (the dispatch + the
# metrics_text builder).
adminspace-metrics = ["adminspace-core", "wz-session-core/adminspace-metrics"]
# adminspace-introspection-handlers (§5.23) — the per-entity subscriber/queryable
# admin introspection. Composes adminspace-core (the reply machinery) + the
# wz-session-core reply legs, and the caller-side live materialization: the
# LinkstateForwarder `subscriptions()`/`queryables()` whole-table accessors (this
# crate) that the demo host snapshots per app-tick.
adminspace-introspection-handlers = [
    "adminspace-core",
    "wz-session-core/adminspace-introspection-handlers",
]
# adminspace-plugins-handlers (§5.23, R311y237) — the wz-native plugins admin legs
# (`plugins/**` + `status/plugins/**`) inside declare_adminspace's answerer + the
# `plugins` field of local_data. Composes adminspace-core (the dispatch + reply
# machinery) + the wz-session-core reply legs. The Session host reports the
# compiled-in subsystems it can see via `cfg!(feature = ..)` (storage_manager under
# `storage-backend`); wz has NO dlopen plugin-manager (the §5.22 plugin family is
# reserved) — the registry is the cargo-feature/subsystem set.
adminspace-plugins-handlers = [
    "adminspace-core",
    "wz-session-core/adminspace-plugins-handlers",
]
# adminspace-config-hotreload (§5.23, R311y239) — the config-diff-driven storage
# lifecycle: the storage-add/del config-write intents (parse in wz-session-core) +
# the DYNAMIC plugin registry (compiled_plugins_dyn reflects storage_manager Started
# when a storage is live) + the apply via RuntimeStorageManager::add_storage /
# remove_storage. Composes adminspace-plugins-handlers (the surface it reflects into)
# + storage-backend (the RuntimeStorageManager + StorageConfig) + the wz-session-core
# decoder. The wz-native superset of zenoh's config-hotreload (dlopen plugin start/stop).
adminspace-config-hotreload = [
    "adminspace-plugins-handlers",
    "storage-mgr-multi-storage-host",
    "declare-subscriber",
    "wz-session-core/adminspace-config-hotreload",
]
# adminspace-router-linkstate (§5.23) — the ROUTER-tier admin introspection legs
# (`@/<zid>/router/linkstate/{routers,peers}` petgraph-DOT + `.../route/successor/**`),
# hosted on the RouterForwarder's NEW self-dispatch admin queryable (register_local_
# queryable + the route_request empty-route self-dispatch + the LinkstateNetView DOT/
# successor render seam over its two nets). Requires routing-router-hat (the
# RouterForwarder + its two LinkstateNetworks live there); composes adminspace-core
# (the reply machinery) + the wz-session-core answerer (answer_router_admin_query).
adminspace-router-linkstate = [
    "adminspace-core",
    "routing-router-hat",
    "wz-session-core/adminspace-router-linkstate",
]

# ext-pubsub-serde-codec (§5.25) — pure forward of the Zenoh
# Serialization Format codec from wz-session-core (no runtime wiring;
# the codec is standalone). Re-exported at `crate::serde_codec`.
ext-pubsub-serde-codec = ["wz-session-core/ext-pubsub-serde-codec"]

# ext-pubsub-advanced-cache (§5.25) — the publisher-side sample ring +
# the @adv queryable answering _sn / _max recovery selectors. Needs the
# queryable (query-queryable) + reply timestamps (pubsub-timestamp) +
# codec-response-final (R311y71 review fix: the cache declares a COMPLETE
# queryable, which MUST terminate its recovery/history answers with a
# ResponseFinal; query-queryable pulls only codec-request/-response, so
# without this the Final is a silent no-op and a remote querier hangs to
# timeout — the storage-backend feature pulls it for the same reason).
ext-pubsub-advanced-cache = ["query-queryable", "codec-response-final", "pubsub-timestamp"]

# ext-pubsub-advanced-publisher (§5.25) — the SourceInfo-sequencing
# publisher composing the cache. Stamps source_info (pubsub-source-info)
# + timestamp (pubsub-timestamp) on each put (pubsub-put), declares the
# @adv liveliness token (liveliness-token), and owns the cache
# (ext-pubsub-advanced-cache).
ext-pubsub-advanced-publisher = [
    "ext-pubsub-advanced-cache",
    "pubsub-put",
    "pubsub-source-info",
    "pubsub-timestamp",
    "liveliness-token",
]

# ext-pubsub-advanced-subscriber (§5.25) — the per-source ordering/dedup
# subscriber that consumes the publisher's SourceInfo seqnums. Needs the
# subscriber (declare-subscriber) + the inbound source_info decode
# (pubsub-source-info). The timestamped-dedup path is deferred (see the
# module docs), so no pubsub-timestamp dependency yet.
ext-pubsub-advanced-subscriber = ["declare-subscriber", "pubsub-source-info"]
# R311y82 — ext-pubsub-advanced-subscriber + the gap-recovery query plane:
# turns the advanced subscriber's forward-gap handling from "miss + deliver"
# into "BUFFER + sample-driven `_sn`-range recovery GET + in-order drain"
# (zenoh advanced_subscriber.rs:517-540 retransmission path + the sub_callback
# recovery get :704-748). Composes the subscriber (the reorder buffer lives
# there) + the requester query plane (query-get for `Session::query`,
# query-selector-parameters for the `_sn=START..` selector) + the cache's
# reply-side source identity (wz-session-core/reply-source-info — the recovery
# reply must carry the original `(zid, eid, sn)` so the subscriber re-keys the
# retransmitted sample). A composed deployment additionally enables
# ext-pubsub-advanced-publisher/-cache (the answerer); recovery itself is the
# CONSUMER half. Three triggers under this gate: sample-driven (R311y82, the
# core), periodic re-ask (R311y83, a background tokio task), and heartbeat
# (R311y84 — a 2nd subscriber on `<ke>/@adv/pub/**` decoding the publisher's
# last-sn beacon via `z_deserialize::<u32>`, hence ext-pubsub-serde-codec; zenoh
# :585-643 / :1045-1149). The heartbeat PRODUCER beacon is the separate
# ext-pubsub-sample-miss-detection atom.
ext-pubsub-advanced-recovery = [
    "ext-pubsub-advanced-subscriber",
    "ext-pubsub-serde-codec",
    "query-get",
    "query-selector-parameters",
    # R311y89 (review C3) — the recovery / history GETs carry a query timeout so the
    # reply registry's deadline sweep can release a no-answerer query. R311y326 —
    # a `0`/unset timeout no longer wedges (it now resolves to the platform default,
    # not never-expire); the explicit timeout still pins the recovery GET's own
    # bound. `with_timeout_ms` no-ops without this feature.
    "query-timeout",
    "wz-session-core/reply-source-info",
]
# R311y86 — ext-pubsub-advanced-history (§5.25): the startup history query. A
# history-enabled AdvancedSubscriber issues a GET over `<ke>/@adv/**` (with a
# `_max=N` cap) on declare, recovering the publishers' cached samples so a LATE
# JOINER gets the history (zenoh advanced_subscriber.rs:763-811, HistoryConfig).
# A `global_pending_queries` gate buffers live samples until the history query
# completes so the (older) history delivers first (zenoh :504-516). Composes
# ext-pubsub-advanced-recovery — it reuses the reorder buffer + the recovered-
# reply ordering + the query plane. R311y98 added the `_time` age filter
# (HistoryConfig::max_age). R311y100 added late-publisher detection
# (HistoryConfig::detect_late_publishers): a liveliness subscriber on
# `<ke>/@adv/pub/**` issues a per-publisher history GET when a publisher's token
# appears after the subscriber joined. R311y101 (review MED) — the liveliness
# sub declares `history=true` (matching zenoh advanced_subscriber.rs:1034) so a
# publisher already present at declare (incl. one visible only in the window
# after the startup-history snapshot) also re-triggers its GET; that needs
# `liveliness-history` (which implies `liveliness-subscriber`).
ext-pubsub-advanced-history = ["ext-pubsub-advanced-recovery", "liveliness-history"]
# R311y85 — ext-pubsub-sample-miss-detection (§5.25): the heartbeat PRODUCER
# beacon. An AdvancedPublisher with sample_miss_detection spawns a background
# task that periodically publishes its last published sequence number
# (`z_serialize::<u32>(seqnum-1)`) on the publisher's `<ke>/@adv/pub/<zid>/<eid>/_`
# KE (zenoh advanced_publisher.rs:373-425, MissDetectionConfig::heartbeat /
# sporadic_heartbeat). The CONSUMER half (a subscriber's heartbeat trigger that
# decodes the beacon) is ext-pubsub-advanced-recovery. Composes the publisher
# (the seqnum source + the @adv KE) + serde-codec (the u32 beacon encode).
ext-pubsub-sample-miss-detection = [
    "ext-pubsub-advanced-publisher",
    "ext-pubsub-serde-codec",
]
# ext-pubsub-group-membership (§5.25) — the live Group + its membership tasks.
# The AP-only tokio half over the no_std data + bincode wire codec in
# wz-session-core/ext-pubsub-group-membership. Needs the event subscriber
# (declare-subscriber) + the per-member queryable (query-queryable) which
# replies COMPLETE answers and so must terminate them with a ResponseFinal
# (codec-response-final, same rationale as ext-pubsub-advanced-cache) + the
# unknown-member recovery GET (query-get) bounded by a deadline so a no-answerer
# query cannot wedge the reply registry (query-timeout, the advanced-recovery C3
# lesson) + the join/keepalive event publish (pubsub-put). INDEPENDENT of the
# advanced-pubsub @adv family (its own wire + KE namespace).
ext-pubsub-group-membership = [
    "wz-session-core/ext-pubsub-group-membership",
    "declare-subscriber",
    "query-queryable",
    "codec-response-final",
    "query-get",
    "query-timeout",
    "pubsub-put",
]
# adminspace-read (§5.23) — the permissions.read GET gate: declare_adminspace's
# handler answers nothing when AdminSpacePermissions.read=false (the querier gets
# only the terminating Final), the wz mirror of zenoh's read-permission check
# (adminspace.rs:457). The AdminSpacePermissions struct is adminspace-core (always
# present for signature stability); this feature is the GATE that consults it, so
# it composes only adminspace-core (no wz-session-core forward needed).
adminspace-read = ["adminspace-core"]
# adminspace-write (§5.23) — the permissions.write gate on the admin config-WRITE
# PUT path: `admin_write_permit` (this crate, R311y52) consults
# AdminSpacePermissions.write (default false, the zenoh PermissionsConf asymmetry)
# before a `@/<zid>/<whatami>/config/**` write is applied, the wz mirror of zenoh's
# `if !permissions().write { error; return }` (adminspace.rs:396) and the write-side
# twin of the adminspace-read GET gate. The AdminSpacePermissions.write field + the
# parse_admin_config_write gate/decoder SSOT are adminspace-core (always present for
# signature stability); THIS feature is the cfg that flips admin_write_permit between
# `permissions.write` (gated) and `true` (elided), so it composes only adminspace-core.
adminspace-write = ["adminspace-core"]
query-reply = ["codec-request", "codec-response", "wz-session-core/query-reply"]
query-target = ["query-get"]
query-timeout = ["query-get"]
query-consolidation = ["query-get"]
# R311uy — storage-backend (§5.11 storage, atom 3/4): the StorageService
# DRIVER (`storage_service` module). Forwards the runtime-agnostic kernel
# (wz-session-core/storage-backend = the StorageBackend seam + the
# StorageState newer-wins gate) AND `query-queryable` — the driver's
# answering leg declares a COMPLETE queryable, so without it
# `declare_queryable` returns FeatureDisabled and the storage cannot serve
# gets. The capture subscriber + wire-RX (codec-push / pubsub-*) are the
# data-plane the storage composes with (on by default); a storage facing
# only loopback publishes works without them.
storage-backend = [
    "wz-session-core/storage-backend",
    "query-queryable",
    # The queryable's reply lifecycle ends in a terminating ResponseFinal
    # (the dispatch path stages `send_response_final` after the storage's
    # replies), so a storage genuinely needs the ResponseFinal wire frame.
    # query-queryable alone (codec-request + codec-response) does not pull
    # it; without it the `ResponseSink::send_response_final` use in the
    # dispatch loop is dead. A storage MUST terminate its query answers.
    "codec-response-final",
    # The driver declares its subscriber + queryable on a Unicast session
    # (the `session` / `session_glue` modules are transport-unicast-gated).
    "transport-unicast",
    # The storage versions by timestamp: the capture leg reads each Put's
    # MsgPut timestamp (newer-wins / version ordering) and the answer leg
    # emits each reply's value timestamp (the MsgPut T-flag). Both the wire
    # decode and the reply T-flag emit are pubsub-timestamp-gated, so a
    # storage genuinely needs it (without it every sample is fallback-stamped
    # and replies carry no version timestamp).
    "pubsub-timestamp",
    # Symmetric to pubsub-timestamp for the value ENCODING: the capture leg
    # reads each Put's MsgPut encoding (stored in StoredData) and the answer
    # leg serves it back on the reply (the MsgPut E-flag) so a querier renders
    # the value as published. Both legs are pubsub-encoding-gated.
    "pubsub-encoding",
]
# R311uz — storage-history (§5.11 storage, atom 2/4): forwards the
# History::All backend (wz-session-core/storage-history = HistoryStorage).
# The driver itself is generic over the backend (storage-backend gates the
# `storage_service` module); this feature makes the version-keeping backend
# available so a `StorageService::declare_with_backend(.., HistoryStorage)`
# is usable end-to-end. Implies storage-backend.
storage-history = ["storage-backend", "wz-session-core/storage-history"]
# R311y279 — storage-backend-filesystem (§5.24): a durable, filesystem-backed
# Volume/StorageBackend (the `filesystem_storage` module). It only IMPLEMENTS the
# storage seam, so it forwards ONLY the wz-session-core kernel seam
# (`StorageBackend`/`Volume`/`StorageConfig`/`StoredData`), NOT the runtime
# `storage-backend` driver (the StorageService + its query/pubsub/transport deps
# a bare backend never touches). std-only; no new third-party dep (uses `log` +
# the dev-only `tempfile` already in the tree).
storage-backend-filesystem = ["wz-session-core/storage-backend"]
# Round 311vm — storage-replication (§5.11 storage, replication driver). The
# digest publisher/subscriber DRIVER (`storage_replication_service`). Forwards
# the no_std kernel digest stack (wz-session-core/storage-replication =
# Fingerprint / Digest / diff / wire codec) and storage-backend (the digest
# reflects the SAME live StorageState the StorageService captures into). Adds
# `codec-push` because the digest is PUBLISHED to remote replicas on
# `@-digest/<zid>/<config-fp>` (the publish remote leg is codec-push-gated) and
# `declare-subscriber` for the peer-digest subscriber. Implies storage-backend.
storage-replication = [
    "wz-session-core/storage-replication",
    "storage-backend",
    "codec-push",
    "declare-subscriber",
]
