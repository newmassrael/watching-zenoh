# R311cb — transport domain wire-up. 5 atomic features that have real
# source behavior in this crate (Cargo.toml authoring intent: "16
# atomic, 5 active / 11 reserved"). Each gates a concrete cfg site:
#   transport-link-tcp     — TcpDriver struct + LinkDriver impl + the
#                            tokio::net::TcpStream import (lib.rs ~315).
#   transport-link-udp     — UdpDriver struct + LinkDriver impl + the
#                            tokio::net::UdpSocket import (lib.rs ~517).
#   transport-unicast      — FOUNDATIONAL, not an excludable atomic
#                            (R311fe, same class as keyexpr-canon). It
#                            gates `pub mod session_fsm_unicast` (lib.rs
#                            ~203) and the entire session_glue.rs depends
#                            on the SessionFsmUnicast{Event,Policy} types,
#                            so feature-off does not type-check — and
#                            there is no alternate FSM to fall back to
#                            (transport-multicast stays reserved with no
#                            consumer; introducing a stub FSM purely to
#                            make the OFF subset build would be a
#                            speculative YAGNI fork). Genuine exclusion is
#                            blocked until a second FSM genuinely lands;
#                            until then this is a default-on toggle that
#                            the arbitrary-subset CI lanes (C4c build +
#                            C1j behaviour, scripts/run-ci.sh) pin ON.
#                            The other
#                            transport atomics below ARE independently
#                            composable on top of it.
#   transport-keepalive    — start_keepalive_worker / stop_keepalive_worker
#                            action bindings + the worker spawn body in
#                            session_glue.rs. R311g1 silent no-op when
#                            disabled (the bind_unit registers a no-op
#                            so the SCXML script-action surface stays
#                            available; the spawn body short-circuits).
#                            Wire-level KeepAlive parse stays governed
#                            by codec-keep-alive — transport-keepalive
#                            disables only the active sender side.
#   transport-batching     — TX coalescing window (BatchTx accumulation
#                            + batch_start/flush/stop), zenoh-pico
#                            Z_FEATURE_BATCHING parity. The INIT
#                            batch_size negotiation is CORE (ungated)
#                            since R311kl — pico negotiates outside its
#                            batching gate (unicast/transport.c:135-140).
# reserved (link-tls/quic/ws/unixsock/vsock, compression, shm,
# lowlatency) stay declaration-only at the wz facade Cargo.toml level;
# this crate does not own them.
# R311y453 — every link pipeline resolves its own §5.16 subject at open, so
# the `link_interfaces` resolver is a LINK-tier dependency. Hanging it off the
# access-* knobs instead broke a bare `routing-peer` build, which has the TCP
# pipeline but no access knob: the pipeline imported a module the feature
# graph had not compiled.
transport-link-tcp = ["link-interfaces"]
transport-link-udp = ["link-interfaces"]
# R311y236 — locator-iface: honour the `#iface=<name>` locator config tail by
# binding the dialing socket to the named NIC (SO_BINDTODEVICE, Linux/Android;
# a warn-noop off-platform). Pulls `socket2` for the syscall. The PARSE of
# `#iface=` is always-on (foundational, in wz-session-core::locator); only the
# BIND honor is this gated atom (reserved-INERT -> active).
locator-iface = ["dep:socket2"]
# R311nv — host tty backend for the SERIAL link. Forwards the
# wz-session-core `transport-link-serial` gate (the R311nt
# transport-agnostic `serial_link` framing/handshake/locator logic +
# the R311ns `codec-serial` framing codecs) and pulls the optional
# `tokio-serial` dep that `serial_pipeline` opens the tty / drives the
# async byte I/O over. Like `transport-link-udp`, the session-open
# integration (DialedLink::Serial / dial_locator serial arm) lives in
# the `transport-link-tcp`-gated `session_open` module as an additive
# `#[cfg(transport-link-serial)]` arm, so a serial session-open build
# also carries tcp (the "session_open is available" gate) exactly as a
# udp session-open build does. The `serial_pipeline` drivers themselves
# compile standalone under this feature alone. NOT in the default set —
# zenoh-pico ships serial default-OFF (optional Z_FEATURE_LINK_SERIAL).
transport-link-serial = [
    "link-interfaces",
    "wz-session-core/transport-link-serial",
    "dep:tokio-serial",
]
# R311oa — host TLS-over-TCP backend for the TLS link. Forwards
# `transport-link-tcp` (TLS reuses the ENTIRE TCP stream pipeline — the
# StreamEnvelope length-prefix framing, the shared `poll_framed` reader, the
# writer task — over a rustls-wrapped byte stream, so no new codec) and pulls
# the optional `tokio-rustls` dep that `tls_pipeline` runs the rustls
# client/server handshake over. The locator PARSE (`Proto::Tls`) is
# unconditional in wz-session-core (no feature forward); only the
# dial/accept BACKEND is gated here. Cert material the locator cannot carry
# is supplied at the explicit `dial_tls`/`accept_tls` call site, so the
# generic `dial_locator` returns Unsupported for `tls/...`. NOT in the
# default set — zenoh-pico ships TLS as an optional link (Z_FEATURE_LINK_TLS).
transport-link-tls = ["transport-link-tcp", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:base64"]
# R311ob — host WebSocket link backend. UNLIKE TLS (which forwards
# transport-link-tcp because it reuses the TCP StreamEnvelope framing), WS is
# a DATAGRAM-flow link (zenoh-pico `_z_new_link_ws` sets
# `Z_LINK_CAP_FLOW_DATAGRAM`): the transport adds NO length prefix
# (`__unsafe_z_prepare_wbuf` reserves the 2-byte prefix only for
# `FLOW_STREAM`, src/transport/common/tx.c:347), so each zenoh batch rides one
# WebSocket BINARY message whose frame boundary delimits it — exactly the UDP
# model, NOT a custom byte codec. So `ws_pipeline` reuses neither `stream_link`
# nor a codec; it wraps a `tokio_tungstenite::WebSocketStream` (the RFC6455
# protocol layer) split via `futures_util`. No tcp forward (the session-open
# Ws arm rides the tcp+unicast-gated `session_open` like the udp arm). NOT
# default — pico ships WS as an optional link (Z_FEATURE_LINK_WS).
transport-link-ws = ["link-interfaces", "dep:tokio-tungstenite", "dep:futures-util"]
# R311xi — host Unix-domain-stream link backend. Like TLS (and UNLIKE WS), it
# forwards `transport-link-tcp` because a unix socket is a reliable byte STREAM
# (zenoh's `unixsock_stream` link: `is_streamed() = true`, MTU 65535) that
# reuses the ENTIRE TCP `stream_link` pipeline — the StreamEnvelope
# length-prefix framing, the shared `poll_framed` reader, the writer task —
# over a `tokio::net::UnixStream` instead of a `TcpStream`, so no new codec.
# Pulls NO new dep: tokio's `net` feature already carries `UnixStream` /
# `UnixListener` on Unix (vs TLS's `tokio-rustls` / WS's `tokio-tungstenite`).
# The locator PARSE (`AnyLocator::Unixsock`) is unconditional in
# wz-session-core (no feature forward, like serial); only the dial/accept
# BACKEND is gated here, and the `session_open` DialedLink::Unixsock arm rides
# the `transport-link-tcp`-gated session-open module additively, like the tls
# arm. NOT default — pico has no unixsock transport at all (host-only link).
transport-link-unixsock = ["transport-link-tcp"]
# R311xj — host AF_VSOCK link backend (VM<->host / VM<->VM). Like tls/unixsock
# (and UNLIKE ws), forwards `transport-link-tcp`: vsock is a reliable byte
# STREAM (zenoh's vsock link: is_streamed/is_reliable=true, MTU=BatchSize::MAX)
# that reuses the ENTIRE TCP `stream_link` pipeline over a `tokio_vsock::VsockStream`
# (split via `tokio::io::split`, the TLS pattern, since VsockStream has no
# owned-half split), so no new codec. Pulls the optional, Linux-only
# `tokio-vsock` dep (see [target.'cfg(target_os="linux")'] below). The locator
# PARSE (`AnyLocator::Vsock`) is unconditional + platform-independent in
# wz-session-core (no feature forward, like serial/unixsock); only the
# dial/accept BACKEND is gated here, and the `session_open` DialedLink::Vsock
# arm is `#[cfg(all(transport-link-vsock, target_os="linux"))]`. NOT default —
# pico has no vsock transport (host VM-IPC link).
transport-link-vsock = ["transport-link-tcp", "dep:tokio-vsock"]
# R311y10 — host Unix named-pipe (FIFO) link backend. Forwards
# `transport-link-tcp` (the FIFO is a byte stream, so it reuses the shared
# `stream_link` StreamEnvelope SSOT, like unixsock) and pulls `dep:libc` for the
# one `mkfifo` call (tokio's `net` feature carries the FIFO Sender/Receiver). The
# `unixpipe/...` locator PARSE is platform-independent + ungated in
# wz-session-core; only the dial/accept BACKEND is gated here, and the
# `session_open` DialedLink::Unixpipe arm is `#[cfg(all(transport-link-unixpipe,
# target_os="linux"))]` (the FIFO `read_write` open-rendezvous is Linux-only in
# tokio). NOT default — pico has no unixpipe transport (same-host IPC link).
transport-link-unixpipe = ["transport-link-tcp", "dep:libc", "dep:rand"]
# R311xk — host QUIC link backend. Like tls (and UNLIKE ws), forwards
# `transport-link-tcp`: QUIC frames a zenoh batch over ONE bidirectional stream
# with the SAME StreamEnvelope length-prefix as TCP, reusing the entire
# `stream_link` pipeline over a `quinn::{SendStream,RecvStream}` pair (already
# split — no `into_split`/`tokio::io::split`). Pulls `quinn` + the SAME rustls
# cert stack as tls (`tokio-rustls`/`rustls-pemfile`/`base64`) because QUIC's
# cert config IS a rustls ClientConfig/ServerConfig (TLS 1.3-only + ALPN
# `hq-29`), built by `quic_config` reusing the `tls_config` PEM loaders. The
# locator PARSE (`Proto::Quic`) is unconditional in wz-session-core (IP-family
# numeric host:port, like tls/ws — NOT a new AnyLocator variant); only the
# dial/accept BACKEND is gated here. Cert material the locator cannot carry is
# threaded via `DialConfig.quic` (the tls pattern), so the generic
# `dial_locator` returns Unsupported for `quic/...` without it. NOT default.
transport-link-quic = ["transport-link-tcp", "dep:quinn", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:base64"]
# R311y8 — host QUIC unreliable-DATAGRAM link backend (RFC9221). IMPLIES
# `transport-link-quic`: it reuses that backend's `quic_config` TLS-1.3 + ALPN
# builders + the quinn/rustls stack, swapping the bidi stream for the
# connection's datagram path (`send_datagram`/`read_datagram`, `rel=0`) and the
# StreamEnvelope drivers for the UDP datagram driver shape (one datagram = one
# frame). Pulls `bytes` for the `quinn::Connection::send_datagram(Bytes)`
# signature. The locator PARSE (`Proto::QuicDatagram`, scheme `quic-datagram`)
# is unconditional in wz-session-core; only the dial/accept BACKEND is gated
# here. Cert threaded via `DialConfig.quic` (same cert as `quic`). NOT default —
# zenoh-default upstream, but an opt-in unreliable transport in wz.
transport-link-quic-datagram = ["transport-link-quic", "dep:bytes"]
# R311qa — multi-peer accept-and-hold capability (the `routing-router` /
# future `routing-peer` foundation). Gates `pub mod accept_loop` (lib.rs) and
# pulls its prerequisites: the TCP listen path (`transport-link-tcp`), the
# unicast session machinery it opens each face through (`transport-unicast`),
# and `dep:futures-util` for the single-task `FuturesUnordered` hold. A SHARED
# atom both role features compose (router now, peer later) rather than gating it
# under `routing-router` directly — that keeps a future `routing-peer` from
# depending on `routing-router`. Off by default (like `transport-link-ws`); the
# `routing-accept` test lane (run-ci Layer C1w) and the facade `routing-router`
# preset select it.
routing-accept = ["transport-link-tcp", "transport-unicast", "dep:futures-util"]
# R311qc — the data-plane forwarding atom: gates `pub mod routing_forward`
# (lib.rs) — the `RoutingForwarder` that backs the `accept_loop`'s
# `FaceForwarder` seam with the `wz-session-core` `routing::RouteTable`. Pulls
# the accept-and-hold foundation it forwards on top of (`routing-accept`), the
# kernel (`wz-session-core/routing-routes`), and the Push / DeclareSubscriber
# codecs the forward + route-build read (`codec-push` / `declare-subscriber`).
# Off by default; the facade `routing-routes` preset and the run-ci forwarding
# lanes select it.
routing-routes = [
    "routing-accept",
    "wz-session-core/routing-routes",
    "codec-push",
    "declare-subscriber",
]
# R311qg — routing-peer atom 1: the dial+accept mesh-node foundation. Gates the
# `peer_loop` entry in `accept_loop` — a node that DIALS a configured peer set
# AND accepts inbound, holding both in one face set. Reuses the ENTIRE
# `routing-accept` machinery (the shared `face_drive_loop` core); the only
# net-new surface is the dial-out face source (`dial_face`), so it just pulls
# `routing-accept`. Hold-only (NoOpForwarder); mesh forwarding + zid-keyed loop
# dedup is a later atom. Off by default; the facade `routing-peer` selects it.
# R311qw — pulls `wz-routing-graph`, the linkstate-peer topology graph
# crate (lifted out of this crate so the runtime-agnostic kernel does not
# live in the tokio runtime crate); `dep:wz-routing-graph` keeps the graph
# (+ its petgraph dep) off every non-peer build.
# R311qr — pulls `wz-codecs/codec-linkstate` so the driver's `forward`
# (c3) can name the decoded `LinkstateListOwned` the graph ingests.
# R311qu — pulls `wz-session-core/codec-linkstate` for the OAM-LINKSTATE
# carrier (`try_parse_linkstate_oam`) the `linkstate_forward` driver (c3)
# decodes inbound topology with.
routing-peer = [
    "routing-accept",
    "dep:wz-routing-graph",
    "wz-codecs/codec-linkstate",
    "wz-session-core/codec-linkstate",
    # R311rd — a routing peer is a full mesh node: it carries the data plane
    # (`codec-push`), so the OAM-LINKSTATE TX seam co-gated on `codec-push`
    # is always present (a routing-peer build can never be the degenerate
    # "topology relay with no send path" that silently no-ops the flood).
    "codec-push",
    # R311rq — c3c-3 subscription-filtered routing carries DeclareSubscriber
    # across the mesh (the interest-propagation control plane that bounds the
    # data flood to interested subtrees), so the Declare wire surface +
    # declare_routing_context node_id seam are part of a routing peer's
    # contract.
    "codec-declare",
    # R311ub — query routing (atom 2) relays a Request (Query) across the mesh
    # toward the matching queryables (forward_request), so the Request wire
    # surface + the request_routing_context node_id seam are part of a routing
    # peer's contract — the query-plane twin of the codec-declare interest plane.
    "codec-request",
    # R311uc — query routing (atom 3) routes a Query's Response + ResponseFinal
    # BACK to the querier across the mesh (forward_response / _final, keyed by the
    # pending-query table), so the Response + ResponseFinal wire surfaces are part
    # of a routing peer's contract (the reply twin of the codec-request forward).
    "codec-response",
    "codec-response-final",
    # R311rd — and it must FRAGMENT an oversize link-state flood: a large
    # mesh's full-topology OAM exceeds the link MTU (and the u16 frame cap),
    # so without this the flood is silently dropped at the stream guard.
    "transport-fragmentation",
]
# R311y108 — §5.21 router-hat slice 1a: the DUAL-mesh router forwarder
# (the 4th `impl FaceForwarder`, `router_forward` module). Ports zenoh
# `hat/router`'s two link-state graphs (routers_net + linkstatepeers_net)
# DISTINCT from the single-net `routing-peer` `LinkstateForwarder`. Slice 1a
# is the TOPOLOGY STATE half: dual-net register/deregister/OAM-ingest with a
# TIER-SCOPED flood (a routers_net change reaches only router faces, a
# linkstatepeers_net change only peer faces — the two graphs never cross-inject).
# Reuses the whole `routing-peer` machinery (the graph crate, the interest
# tables, the whatami/zid decode), so it forwards `routing-peer`; the dual-tier
# Declare INGEST + cross-tier bubble + route-compute + master-election are
# later slices. Off by default; the run-ci Layer C1ay lane selects it.
# This is the FOUNDATION feature (the `routing-accept` analogue): it compiles the
# library RouterForwarder module (topology STATE + INGEST + COMPUTE) and gates the
# C1ay lane, WITHOUT being an inventory atom. The `router-hat-router` inventory atom
# is the run-mode toggle LAYERED on this foundation (routing-routes-on-routing-accept
# pattern): the wz-ap-demo `--router-hat` run-mode gates on `cfg(feature="router-hat-router")`
# (the A3 active site) and pulls this foundation. R311y132 flipped `router-hat-router`
# reserved -> ACTIVE once the ACTIVATION E2E harness landed.
routing-router-hat = ["routing-peer"]
# §5.21 routing-token-tables — the router-tier liveliness-TOKEN propagation
# plane (zenoh hat/router/token.rs), the TOKEN TWIN of the router_subs /
# router_qabls declaration tables. Slice-1 = dual-tier NATIVE DeclareToken
# ingest + within-tier re-flood (register-only; the sourced-UndeclareToken
# withdraw awaits an UndeclToken ext_wire_expr codec, the qabl-plane pattern).
# Composes only the RouterForwarder foundation: the DeclToken codec rides
# routing-peer -> codec-declare already (like build_declare_subscriber under
# routing-router-hat), so no declare-token app-surface dep is needed.
routing-token-tables = ["routing-router-hat"]
# §5.21 router-connect-reconcile — the runtime dynamic connect-list reconcile
# (zenoh `net/runtime/orchestrator.rs:413` `update_peers`) + peer auto-reconnect
# (the `closed_session` 1194 Peer/Router re-dial). The shared `face_drive_loop`
# gains (1) a reconcile channel that dials each newly-listed connect endpoint not
# already being dialed (ADD-ONLY, address dedup — a config endpoint has no zid
# until the handshake; the Client close-removed branch is NOT ported, it would
# blackhole a router mesh) and (2) `schedule_redial`/`dial_face_after`, which
# re-dial a dropped/failed still-desired outbound peer with a fixed backoff
# (retry-until-success). Composes only the RouterForwarder foundation (both live on
# the shared accept/peer loop under the router-hat run mode).
router-connect-reconcile = ["routing-router-hat"]
# §5.21 router-multicast-faces (slice-3 EGRESS run-mode) — the router forwards a
# routed Push over a multicast group (zenoh mcast_groups / McastMux egress,
# router.rs:181). Composes routing-router-hat (the RouterForwarder + the
# route_push tail broadcast) with transport-multicast (the McastGroup egress
# plane) + transport-link-udp (the concrete UdpDriver the run-mode host
# `spawn_router_mcast_egress` binds — the McastGroup/attach/broadcast plane is
# driver-generic, but the run-mode host needs a real UDP socket). Egress-first:
# the mcast_faces INGRESS plane is the deferred milestone.
#
# R311y196 (I3a) — also pulls `wz-session-core/multicast-declarations`, the
# per-peer keyexpr-alias ingress plane (each `MulticastDispatcher` peer slot
# absorbs its `DeclKexpr`s + resolves its aliased `Push`es to literal before the
# fan). It rides the SAME `codec-push`-gated ingress host, so a narrow build
# without `codec-push` elides the host and the aliasing is dormant (session-core
# compiles it but nothing drives it) — the I1 narrow-build contract is unchanged.
# R311y197 (I3b) — the runtime mirror of `wz-session-core/multicast-declarations`
# (the per-peer keyexpr-alias + on-group-router-membership dispatch state). A
# runtime-level feature so the `multicast_glue` membership relay + the
# `drive_multicast_session_with_membership` snapshot gate on the crate's OWN
# feature rather than a bare dependency feature.
multicast-declarations = ["wz-session-core/multicast-declarations"]
router-multicast-faces = [
    "routing-router-hat",
    "transport-multicast",
    "transport-link-udp",
    "multicast-declarations",
]
# ── §5.16 access-control composition knobs ───────────────────────────
# Each independently elides ONE interceptor on the routing-peer admission
# chain (interceptor/{access_control,downsampling,low_pass}.rs). The chain
# SEAM (InterceptorChain / InterceptorContext / InterceptorFlow / the
# per-face admit in linkstate_forward) stays under `routing-peer`, so all
# three imply it; an empty config — or a routing-peer build that selects
# none of these — is access control disabled (every message admitted).
# `access-acl` additionally pulls the pure policy ENGINE crate
# (wz-access-control); the enforcer adapter consumes it. Promoted from
# always-on-under-routing-peer to real cfg knobs so a routing peer composes
# exactly the admission filters it needs (Layer F footprint).
# R311y453 — the §5.16 SUBJECT axis data source: live `getifaddrs` resolution of
# the NIC names a link's local address sits on (`link_interfaces` module). Named
# by its own gate rather than inherited, exactly as R311y451 named the low-pass's
# two session-core reads: it is the ONE place wz makes a libc syscall for §5.16,
# and all three access knobs pull it because all three carry the `interfaces`
# rule field. `libc` is already in the tree (unixpipe's `mkfifo`), so this adds
# no third-party surface — unlike zenoh, which reaches the same data through
# `pnet_datalink`.
link-interfaces = ["dep:libc"]
access-acl = ["routing-peer", "link-interfaces", "dep:wz-access-control"]
access-downsampling = ["routing-peer", "link-interfaces"]
# R311y451 — the two session-core reads the low-pass SIZE budget needs, named
# by the gate rather than inherited by luck. zenoh budgets payload PLUS
# attachment (`net/routing/interceptor/low_pass.rs:358-361`), and wz carries the
# attachment on the generic ext chain, so the count comes from the
# `attachment-bytes` decode SSOT (Push id 0x03 / Query id 0x05). Sizing a Query
# additionally needs the `query-value` ext read, since zenoh budgets
# `query.ext_body.payload.len()` (`:265-269`) and wz carries that value as the
# 0x03 ENC_ZBUF `encoding || payload` ext. Neither rides `routing-peer`.
access-quota = [
    "routing-peer",
    "link-interfaces",
    "wz-session-core/attachment-bytes",
    "wz-session-core/query-value",
]
# R311y39 — §5.23 config-mutate-runtime: the LIVE leg of the typed WzConfig.
# Gates the re-apply in `WzConfig::reconfigure_interceptors` so a config
# mutation RE-DRIVES the live forwarder (config-driven), vs OFF where the
# mutation is stored but inert (read-at-open mirror). Composes `routing-peer`
# because the first realized live target is the router interceptor chain (the
# only runtime-mutable surface so far); revisit the implication when a
# non-router live setting lands. The json-pointer tree + change-notifier +
# list-key-id merge (the full engine) and the admin PUT wire (adminspace-write)
# are deferred §5.23 layers.
config-mutate-runtime = ["routing-peer"]
# R311il — FOUNDATIONAL session gate. Forwards to wz-session-core's
# `session-unicast`, which codegens the engine-free unicast session FSM
# (sources/session/session_fsm_unicast.scxml, `--no-std`) into the
# runtime-agnostic core — the codegen moved out of this crate's build.rs
# (now deleted), mirroring the reassembly + scouting FSMs. This crate's
# `session_glue` then impls the generated `SessionFsmUnicastActions` trait
# on `SessionActionsBinding` and drives `SessionFsmUnicastPolicy<_>`; the
# `crate::session_fsm_unicast` path is a `pub use` re-export of
# `wz_session_core::session_fsm_unicast` (lib.rs). No Lua / IScriptEngine
# is involved — this completes the runtime-schism resolution (the scouting
# half landed in R311ik), so `sce-rust-lua` leaves the whole graph.
transport-unicast = ["wz-session-core/session-unicast"]
# Round C — multicast transport gate. Forwards to wz-session-core's
# `session-multicast` (which codegens the engine-free §3.1 session-level +
# §3.2 per-peer FSMs into the core) and gates this crate's `multicast_glue`
# drive loop. Pulls `codec-join` (the JOIN beacon body codec the loop
# encodes/decodes). The handshake-free multicast sibling of
# `transport-unicast`; the wz facade `transport-multicast` forwards here.
# A1b — `codec-frame` rides along for the data plane: the drive loop
# decodes inbound `T_MID_FRAME` envelopes (`parse_inbound`) and fans their
# NetworkMessage payloads into the application registries
# (`parse_frame_payload`). A multicast transport that cannot deliver data
# would be an inert beacon, so the dep is a kconfig select, not an
# optional compose (which consumer arms then act on the fanned messages
# stays per-consumer-feature, exactly as on the unicast path).
# R311mk — `codec-close` joins the select set: the shared multicast RX SSOT
# `wz_session_core::multicast_rx` is gated on codec-close (it decodes
# `T_MID_CLOSE` and aborts the leaving peer's reassembly chains via
# `close_by_src` — multicast_rx.rs:147,209), and `multicast_glue` consumes
# that SSOT. Without this the previously-default-masked `multicast_rx`
# import did not resolve in a `transport-multicast`-without-default build
# (the facade composability gap). A multicast transport that cannot process
# a peer's Close is incomplete, so codec-close is a select, not optional.
# R311y454 — `link-interfaces` (the getifaddrs SSOT) joins the select list: the
# multicast `#iface=` honor resolves a NIC NAME to a local ADDRESS, because
# IP_MULTICAST_IF and IP_ADD_MEMBERSHIP both take one (unlike the unicast honor,
# which needs only a device name for SO_BINDTODEVICE). `scouting-active` reaches
# it already via `transport-link-udp`; `transport-multicast` was the sole
# multicast entry point that did not, so the resolver was unreachable from a
# multicast-only build. Same shape as `transport-link-tcp`/`-udp`/`-ws`, which
# each carry `link-interfaces` for the same reason.
transport-multicast = ["wz-session-core/session-multicast", "codec-join", "codec-frame", "codec-close", "dep:socket2", "link-interfaces"]
# chunk-5 — forward to the wz-session-core same-named gate so the migrated
# start/stop_keepalive_worker action bodies compile under the keepalive axis.
transport-keepalive = ["wz-session-core/transport-keepalive"]
# R311kl — forward to the wz-session-core same-named gate, which now
# covers ONLY the TX coalescing machinery (BatchTx accumulation arm +
# batch_start/flush/stop window). The INIT batch_size negotiation
# (PeerInitCaps honoring + the min reduction) is core transport there,
# ungated — pico parity (Z_FEATURE_BATCHING never gated negotiation).
transport-batching = ["wz-session-core/transport-batching"]
# A4 — forward to the wz-session-core same-named gate (declaration cache
# storage + reset_for_reopen / replay_declarations bodies). zenoh-pico
# Z_FEATURE_AUTO_RECONNECT parity; pico defaults it ON (CMakeLists
# Z_FEATURE_AUTO_RECONNECT=1), so this crate's batteries-included default
# set carries it like transport-batching/-keepalive. The re-dial +
# re-handshake supervisor loop is this crate's side (A4b).
session-reconnect = ["wz-session-core/session-reconnect"]

# R311kh — matching-listener surface (zenoh-pico Z_FEATURE_MATCHING,
# default-on in pico's CMake cache): forwards the wz-session-core watch
# machinery; the Publisher/Querier declare_matching_listener methods are
# signature-stable and reject typed with this off (R311g1).
session-matching = ["wz-session-core/session-matching"]
# R311cc — pubsub domain wire-up. 9 atomic features (Cargo.toml
# authoring intent: "11 atomic, 9 active / 2 reserved"). After the
# R311du SubscriberRegistry move + R311fv attachment SSOT, only TWO
# have cfg sites in THIS crate; the other seven are pure forwards to
# wz-session-core, where the dispatch + Sample receive-side projection
# now live (their per-feature receive semantics are documented at the
# wz-session-core Cargo.toml):
#   pubsub-allow-loop  — local-only (no session-core gate). Gates the
#                        self-publish loopback registry call in
#                        session.rs (Session::publish / publish-aliased
#                        self-path). Feature-off short-circuits the
#                        loopback so only remote inbound triggers
#                        subscribers.
#   pubsub-attachment  — BOTH sides. Forwards to wz-session-core for the
#                        inbound decode (R311fv attachment-bytes SSOT)
#                        AND gates the local SEND vertical:
#                        `PublishOptions::with_attachment` setter
#                        (session.rs) + the Push attachment-ext encode
#                        in session_glue.rs (build_body_extensions ->
#                        encode_attachment_ext). Feature-off: nothing is
#                        set on PublishOptions nor written to the wire.
#   pubsub-timestamp   — BOTH sides (R311fx). Forwards to wz-session-core
#                        for the inbound Sample.timestamp projection AND
#                        gates the local SEND vertical: `PublishOptions::
#                        with_timestamp` setter (session.rs) + the inline
#                        timestamp field + `_Z_FLAG_Z_*_T` header bit in
#                        build_msg_put/del_with_meta (session_glue).
#   pubsub-source-info — BOTH sides. Forwards to wz-session-core for the
#                        inbound Sample.source_info projection AND gates
#                        the local SEND vertical: `PublishOptions::
#                        with_source_info` setter (session.rs) + the Push
#                        source_info-ext encode in build_body_extensions
#                        (session_glue). Feature-off: nothing is set on
#                        PublishOptions nor written to the wire.
#   pubsub-qos         — BOTH sides. The ONE compile unit for the Push QoS
#                        ext (network ext id 0x01): forwards to
#                        wz-session-core for the inbound Sample.qos
#                        projection AND gates the local SEND vertical
#                        (`PublishOptions::with_qos` + the three per-field
#                        setters + build_push_outer_extensions).
#                        Feature-off: no qos is set, none is written, and
#                        an inbound qos ext projects to `Sample.qos = None`.
#   pubsub-priority / pubsub-congestion-control / pubsub-express — R311y307:
#                        aliases that compose `pubsub-qos`; NO own cfg site
#                        (reserved + FOUNDATIONAL in the catalog). The three
#                        sub-fields share ONE packed byte, so they are not
#                        separately gateable — their RUNTIME knobs are the
#                        `pubsub-qos`-gated `with_priority` /
#                        `with_congestion_control` / `with_express` setters.
#                        Before y307 they were separate features whose gates
#                        covered only the setters while encode/decode gated
#                        on their UNION, so composing any one put all three
#                        on the wire.
#   pubsub-encoding    — BOTH sides. Forwards to wz-session-core for the
#                        inbound Sample.encoding projection (Put only;
#                        zenoh-pico `_z_msg_del_t` has no encoding slot)
#                        AND gates the local SEND vertical: `PublishOptions::
#                        with_encoding` setter (session.rs) + the inline
#                        `MsgPut.encoding` field + `_Z_FLAG_Z_P_E` header
#                        bit via `gated_encoding_field` (session_glue).
#                        Feature-off: nothing is set nor written.
#   pubsub-put / pubsub-delete — pure forwards to the matching
#   wz-session-core gate (receive-side Sample projection + dispatch arm).
# 1 reserved (sample) stays declaration-only at the wz facade level.
# R311du — forward to wz-session-core: the pub/sub dispatch arms moved
# there with SubscriberRegistry, so the AP-side feature must enable the
# session-core gate (3-stage shape mirrors the codec-* forwarders).
# pubsub-allow-loop stays AP-only (no session-core dispatch arm gates on
# it — it governs the wz-runtime-tokio self-publish loopback path).
# attachment domain primitive forward: gates the wz-session-core
# `attachment` SSOT module. Declared here as a standalone feature so the wz
# facade can forward `?/attachment-bytes` and so the primitive can be
# enabled independently.
#
# R311y481 CORRECTS this row's own comment, which said the feature is
# "selected transitively by pubsub-attachment / query-attachment (via their
# wz-session-core forwards)". It is NOT, and cargo cannot make it so:
# `pubsub-attachment = ["wz-session-core/pubsub-attachment"]` enables
# wz-session-core's `attachment-bytes`, never wz-runtime-tokio's own. The
# comment described the CHILD's gate while naming the PARENT's feature, and
# the two had drifted apart silently because nothing in wz-runtime-tokio had
# ever written `#[cfg(feature = "attachment-bytes")]` — measured:
# `cargo metadata` reports only `access-quota` + itself reaching this key.
# The `attachment` module forward in lib.rs is the first such cfg site.
#
# The asymmetry is REAL and was measured directly: with the forward
# temporarily UNGATED and ONLY `query-attachment` enabled,
# `wz_session_core::attachment` resolves — i.e. the child had compiled the
# module while this crate's own key was OFF, so a gated forward would be
# elided and a consumer enabling `query-attachment` alone could not reach
# `wz::runtime_tokio::attachment` at all. The two edges below fix that by
# restoring the mirror the `wz` facade already keeps (`wz/Cargo.toml`
# spells both rows `["attachment-bytes", …]`).
#
# STATED HONESTLY, because the first draft of this comment overclaimed:
# these edges are NOT what unblocked R311y481's own `--query-attachment`
# demo path. `preset-ap-full` carries `access-quota`, which already reaches
# this key, so that build compiled with or without them — verified by
# reverting the edges and rebuilding green. They are a feature-graph
# correctness fix for the NARROW subsets, not a dependency of this round.
# No atom containment moves either: `wz`'s rows already coupled the keys,
# so every closure the A3/A4 audits compute is unchanged.
attachment-bytes = ["wz-session-core/attachment-bytes"]
pubsub-put = ["wz-session-core/pubsub-put"]
pubsub-delete = ["wz-session-core/pubsub-delete"]
pubsub-allow-loop = []
pubsub-attachment = ["attachment-bytes", "wz-session-core/pubsub-attachment"]
pubsub-timestamp = ["wz-session-core/pubsub-timestamp"]
pubsub-encoding = ["wz-session-core/pubsub-encoding"]
pubsub-source-info = ["wz-session-core/pubsub-source-info"]
pubsub-qos = ["wz-session-core/pubsub-qos"]
pubsub-priority = ["pubsub-qos", "wz-session-core/pubsub-priority"]
pubsub-congestion-control = ["pubsub-qos", "wz-session-core/pubsub-congestion-control"]
pubsub-express = ["pubsub-qos", "wz-session-core/pubsub-express"]
# R311xt — §5.18 time-hlc: the Hybrid Logical Clock timestamp source, the
# wz mirror of zenoh's `Option<Arc<uhlc::HLC>>` on the Runtime
# (zenoh/src/net/runtime/mod.rs:147 — an HLC is created when `timestamping`
# is enabled). Gates the `uhlc` dep (zenoh's own crate, same 0.8 pin) and
# the HLC branch of the storage fallback stamper (`timestamp_source`): with
# the feature ON an un-timestamped stored sample is stamped by an HLC (a
# logical counter + monotonicity + drift bound layered OVER the wall-clock
# NTP64 source — the HLC wraps the physical clock, it is not an alternative
# to it), with it OFF the bare `wall_clock_ntp64` SSOT is used
# (byte-identical to the prior behavior). NOT default — an opt-in
# alternative timestamp source, like the other advanced composition knobs.
time-hlc = ["storage-backend", "dep:uhlc"]
# R311gi gc-2c — statechart switchboard (the AP dynamic keyexpr -> SCXML
# domain-event inbound adapter). Forwards to wz-session-core/switchboard
# (the `ApplicationLayerObserver::switchboard` field + `dispatch_switchboard`
# fan-out) and pulls this crate's `codec-push` so the inbound Push wire
# surface is present (switchboard reacts to received Push samples). The
# `EngineInjector` adapter (wz-statechart-bridge) is the application's to
# construct over its own statechart engine (R311gj); this crate only
# composes the observer-side fan-out, so the bridge is a dev-dependency
# (the integration test) rather than a normal one.
switchboard = ["codec-push", "wz-session-core/switchboard"]
# R311cd — session domain wire-up. 2 atomic features that have real
# source behavior (Cargo.toml authoring intent: "9 atomic, 2 active /
# 7 reserved"):
