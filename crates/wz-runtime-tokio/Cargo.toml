session-unicast-open = ["wz-session-core/session-unicast-open"]
session-unicast-accept = ["wz-session-core/session-unicast-accept"]
# R1 extauth — forward the §5.4 Z_EXT_AUTH establishment ext codec into the
# AP runtime (the codec lives in wz-session-core; only the AP profile carries
# auth — the MCU/lwip path never forwards it). The dispatch + methods are
