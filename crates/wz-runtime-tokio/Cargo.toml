#                                 dispatch. cfg-off: parameters_view = None.
#   query-reply-err             — Err-form reply emit via ReplyEmitter
#                                 (combined with query-queryable gate).
# query-source-info (10th feature) stays cluster-deferred: no source
# implementation of build_request_query_with_source_info yet (doc-only
# reference); wire-up cascade lands when the impl arrives.
query-attachment = ["wz-session-core/query-attachment"]
query-selector-parameters = ["wz-session-core/query-selector-parameters"]
query-source-info = ["wz-session-core/query-source-info"]
query-reply-err = ["wz-session-core/query-reply-err"]
# R311en — scouting domain wire-up (active mode). First of the
# scouting 0/6 -> active transition (north-star missing-subsystem
# track). `scouting-active` gates:
#   - the engine-free `scouting` FSM module, codegen'd in
#     wz-session-core (R311ik moved the codegen there; forwarded via
#     `wz-session-core/scouting-active`). The pre-session Scout/Hello
#     discovery FSM, docs/scouting-fsm.md §10.
#   - the `scouting_glue` module: the host `ScoutingActions` trait impl
#     that binds the engine-free FSM actions to the UDP-multicast
#     scouting link, plus the drive loop that owns the scout deadline.
# Off by default: scouting is opt-in per deploy.scouting.mode. The
# static mode (docs/scouting-fsm.md §2.4.3) never instantiates this
# FSM, so it is not gated by this feature. passive is Phase D+
# (OQ-W23). Forwarded from the wz facade `scouting-active`.
#
# Forwards to wz-session-core/scouting-active: R311ik moved the
# SCE-generated FSM (the `ScoutingActions` trait + `ScoutingPolicy<A>`
# + the `ScoutingState`/`ScoutingEvent` enums) from this crate's
# build.rs into the runtime-agnostic core, mirroring the reassembly
# slot FSM. The former Lua binding (sce-rust-lua) is gone from the
# scouting path; this is one half of the runtime-schism resolution
# (the session FSM is the other half, still Lua-bound for now).
#
# Implies transport-link-udp: the scouting link is UDP multicast
# (docs/scouting-fsm.md §1.2 — 224.0.0.224:7446), so the UdpDriver +
# its multicast constructor (UdpDriver::bind_multicast_v4, gated on
# scouting-active inside the transport-link-udp UdpDriver impl) must be
# compiled in. Without the imply, `--no-default-features --features
# scouting-active` would gate the multicast constructor out and the
# scout link would have no transport.
#
# R311ep — also implies codec-scout + codec-hello: scout_emit encodes a
# Scout frame and record_hello_and_emit decodes a Hello frame, so the
# scouting glue cannot compose without both body codecs. The S_MID_SCOUT
# / S_MID_HELLO wire_const header bytes are gated on the same two codec
# features in wz-codecs.
scouting-active = [
    "wz-session-core/scouting-active",
    "transport-link-udp",
    "codec-scout",
    "codec-hello",
    "dep:socket2",
]

# R311if — static scouting mode wire-up. Forwards to
# wz-session-core/scouting-static (the `scout_static` synth module) and
# gates the `session_open::open_session_static` consumer + its
# `synth_static_locators` import. Static mode is scouting-absent (no FSM,
# no scout codec, no scout link — docs/scouting-fsm.md §2.4.3), so unlike
# `scouting-active` it implies no UDP/codec deps; the open path it gates
# already lives inside the `cfg(all(transport-link-tcp, transport-unicast))`
# session_open module, so enabling scouting-static without a transport
# simply yields the no_std synth alone (no open path, no build error).
scouting-static = ["wz-session-core/scouting-static"]

[build-dependencies]
# R311in — shared sce-codegen invocation + emit post-processing (one
# source across the three codegen build scripts).
wz-codegen-build = { path = "../wz-codegen-build" }

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
# R311nv — host tty backend for the SERIAL link, behind the optional
# `transport-link-serial` feature (`dep:tokio-serial`). `SerialStream`
# is `AsyncRead + AsyncWrite` (a `tokio::io::unix::AsyncFd` over the tty
# fd), so `serial_pipeline` splits + frames it exactly as the TCP
# pipeline does a `TcpStream`, and `SerialStream::pair()` (openpty) gives
# the wz<->wz PTY-loopback e2e its two connected ends. `default-features
# = false`: tokio-serial's only default is the `libudev` port-enumeration
# backend (mio-serial -> serialport), which we never call (we open a path
# / pair, not enumerate) and which would add a libudev system-lib build
# dep. With it off, serialport is pulled `default-features = false` (no
# libudev) all the way down — no system dependency.
tokio-serial = { version = "5.4", default-features = false, optional = true }
# R311oa — host TLS link backend, behind the optional `transport-link-tls`
# feature (`dep:tokio-rustls`). tokio-rustls wraps a `TcpStream` in a rustls
# session that is `AsyncRead + AsyncWrite`, so `tls_pipeline` splits
# (`tokio::io::split`) + frames it exactly as the TCP pipeline frames a
# `TcpStream` (the shared StreamEnvelope codec + `poll_framed`).
# `default-features = false` + explicit `ring`: rustls 0.23's default crypto
# provider is `aws-lc-rs` (a C/cmake build); `ring` is the provider with no
# extra system toolchain, matching the no-system-dep stance the serial
# `tokio-serial` dep took. `tls12` + `logging` keep the usual handshake
# surface; the e2e's self-signed cert comes from the `rcgen` dev-dep.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
# R311og — PEM cert/key loader for the `tls_config` module, behind
# `transport-link-tls` (`dep:rustls-pemfile`). An application supplies TLS
# material as on-disk PEM (the universal cert format); `tls_config` parses it
# into the rustls `CertificateDer` / `PrivateKeyDer` the `dial_tls`/`accept_tls`
# primitives consume. rustls-pemfile is the canonical PEM->DER decoder rustls
# itself recommends (it returns `rustls-pki-types` values, unified with the
# tokio-rustls dep above). zenoh-rust uses the identical crate in
# `zenoh-link-tls/src/utils.rs`. Like tokio-rustls, optional + tls-gated so a
# cert-free (tcp/udp/serial) build never compiles it.
rustls-pemfile = { version = "2", optional = true }
# R311oh — base64 source for the `tls_config` PEM decoder, behind
# `transport-link-tls` (`dep:base64`). pico exposes a `*_BASE64` variant of each
# TLS cert/key config key (`config.h.in` 0x4C/0x4E/0x50/0x53/0x55) so a
# multi-line PEM can ride a transport that cannot carry raw newlines (env var,
# JSON field) base64-wrapped into one token. `decode_base64_pem` decodes it back
# to PEM bytes. Standard (RFC 4648) alphabet, matching zenoh-rust's
# `base64_decode` in `zenoh-link-tls/src/utils.rs`. Optional + tls-gated like
# the other TLS deps.
base64 = { version = "0.22", optional = true }
# transport-shm — the AP POSIX shared-memory provider (behind the optional
# `transport-shm` feature). A /dev/shm tmpfs file mmap'd MAP_SHARED is exactly
# POSIX shared memory for the same-host scoped proof; memmap2 is the stable,
# version-steady mmap wrapper (vs nix's shifting mman API). The wire carries the
# descriptor, not the local mmap mechanism, so this is faithful for same-host.
memmap2 = { version = "0.9", optional = true }
# R311xt — uhlc is zenoh's own Hybrid Logical Clock crate (zenoh pins the
# same 0.8 at its workspace root, `default-features = false` for no_std
# usage). wz reuses it rather than re-deriving the subtle
# logical-counter-in-low-CSIZE-bits + drift + Timestamp `Ord` algorithm (the
# SSOT for the HLC is upstream, not a wz copy — the same reuse stance as the
# lz4_flex / memmap2 deps). `default-features = false` drops uhlc's `std`
# system clock + env-var delta; wz injects its OWN physical clock
# (`NTP64(wall_clock_ntp64())`, byte-identical to uhlc's `system_time_clock`)
# via `HLCBuilder::with_clock`, so no std feature is needed. Behind the
# `time-hlc` feature (`dep:uhlc`).
uhlc = { version = "0.8", default-features = false, optional = true }
# R311xk — host QUIC link backend, behind the optional `transport-link-quic`
# feature. quinn is the async QUIC implementation zenoh-link-vsock... no:
# zenoh-link-quic uses quinn 0.11.5 (workspace pin). wz pins the same 0.11.
# QUIC frames a zenoh batch over ONE bidirectional stream (uni rejected,
# bidi=1) with the SAME StreamEnvelope length-prefix as TCP/TLS, so the
# `quinn::SendStream` (AsyncWrite) + `quinn::RecvStream` (AsyncRead) reuse the
# shared `stream_link` read/write drivers UNCHANGED — they are already a split
# pair (no `into_split` / `tokio::io::split` needed). quinn rides the SAME
# rustls 0.23 + `ring` stack as the TLS link (via `quinn::crypto::rustls::
# {QuicClientConfig,QuicServerConfig}`), so `transport-link-quic` reuses the
# `tokio-rustls` / `rustls-pemfile` / `base64` cert deps + the `tls_config` PEM
# loaders. `default-features = false` + `ring` + `rustls`: avoid quinn's default
# `aws-lc-rs` provider so it shares wz's single `ring` provider (the tls_config
# reasoning). `runtime-tokio` binds quinn's reactor to tokio. NOT default.
quinn = { version = "0.11", default-features = false, features = ["ring", "rustls", "runtime-tokio"], optional = true }
# R311ob — host WebSocket link backend, behind the optional `transport-link-ws`
# feature. tokio-tungstenite is the async RFC6455 protocol layer: `client_async`
# / `accept_async` run the HTTP-Upgrade handshake over a `TcpStream`, then the
# `WebSocketStream` carries each zenoh batch as one `Message::Binary` (the WS
# message boundary IS the frame boundary — datagram flow, no StreamEnvelope).
# `default-features = false`: the defaults pull a TLS connector (native-tls /
# rustls) for `wss://`, which plain `ws://` does not need; `handshake` keeps
# `client_async`/`accept_async`. `futures-util` (sink) provides
# `StreamExt::split` to separate the `WebSocketStream` Sink+Stream into the
# read-driver / writer-task halves (a WebSocketStream needs `&mut` for both
# directions, so unlike the UDP socket it cannot be shared by `Arc` — it is
# split instead) plus `SinkExt::send` for the writer task.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"], optional = true }
# R311qa — `futures-util` is OPTIONAL, activated by exactly its two consumers so a
# profile selecting neither never pays for it (kconfig footprint invariant; the
# R311qa review caught an unconditional base dep leaking into the multicast-only
# profile that uses none of it):
#   - `routing-accept` — the multi-peer `accept_loop` holds N peer faces via
#     `FuturesUnordered`. The session drive future is `!Send` (the SCE `Engine`'s
#     `Box<dyn FnMut>` callback fields), so `tokio::spawn` / `JoinSet` per face is
#     impossible; `FuturesUnordered` is the textbook single-task poll-many for a
#     dynamic non-`Send` set. `std` unlocks `FuturesUnordered` (it needs `alloc`).
#   - `transport-link-ws` — `StreamExt::split` + `SinkExt::send` for the WS sink.
# wz-runtime-tokio is AP/std-only (the MCU profile is wz-runtime-lwip), so the
# `std` feature adds no no_std exposure.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"], optional = true }
# R311qw — the linkstate-peer topology graph kernel (the wz mirror of
# zenoh net/protocol/network.rs), lifted into its own std-allowed crate so
# the runtime-agnostic graph does not live in this tokio runtime crate (it
# owns the petgraph dependency now). Optional — pulled only by
# `routing-peer` (AP/full-node mesh routing; the MCU profile never sees it).
wz-routing-graph = { path = "../wz-routing-graph", optional = true }
# R311tt — the §5.16 access-control ACL policy KERNEL (pure decision engine,
# zenoh interceptor/authorization.rs mirror). Optional — pulled only by
# `routing-peer`: the interceptor seam + enforcer adapter that match on
# NetworkMessage live here in the runtime crate and consume this engine, the
# same access_control.rs/authorization.rs split zenoh keeps.
wz-access-control = { path = "../wz-access-control", optional = true }
# R311a1 — `default-features = false` + explicit `alloc` so the codec
# emit/include of every codec-* is governed strictly by the matching
# `codec-*` forward above. Without disabling defaults the codec
# features would always activate via wz-codecs's own default list,
# making the forwards a no-op and preventing facade-level
# `--no-default-features` from eliding any codec.
#
# R311dk — codec-push / codec-declare / codec-request / codec-response
# are NOT hard-pinned here anymore; they reach wz-codecs through the
# matching `wz-codecs/codec-*` line in the feature-forward block above
# (R311h..R311k). This is the textbook 3-tier composability chain:
# wz facade -> wz-runtime-tokio codec-* -> wz-codecs/codec-*.
wz-codecs = { path = "../wz-codecs", default-features = false, features = ["alloc"] }
# R252 — Runtime / TimeSource / Allocator trait surface. The AP profile
# (this crate) bridges tokio + std into the trait contract authored in
# R251; the MCU profile (future wz-runtime-lwip) will provide the same
# trait implementations against lwIP + an embedded async executor. The
# `alloc` feature is on because tokio + this crate are AP-only by design
# and need the R266 `RuntimeError::JoinFailed { payload: Box<...> }`
# panic-capture variant; the trait crate itself stays unconditionally
# no_std (std is available at the binary linker level for AP).
wz-runtime-core = { path = "../wz-runtime-core", features = ["alloc"] }
wz-session-core = { path = "../wz-session-core", features = ["alloc", "deferred-fire"] }
sce-forge-runtime = { path = "../../vendor/sce/sce-forge-runtime/rust" }
sce-rust-runtime = { path = "../../vendor/sce/sce-rust-runtime" }
# R311il — sce-rust-lua dropped: the session FSM (the last Lua-bound
# statechart) is now engine-free (`<sce:action>` native host-trait
# dispatch, codegen'd in wz-session-core), so no `IScriptEngine` /
# `LuaEngine` remains in the graph. This completes the runtime-schism
# resolution begun for scouting in R311ik.
log = "0.4"
# R311ei — the HMAC-SHA256 cookie primitive (hmac + sha2) moved to
# wz-session-core::signing_key (runtime-agnostic, MCU-cross-compiled).
# This crate keeps only the OS-entropy constructor (a free fn), so it
# retains `zeroize` (the Zeroizing key wrapper) + `getrandom`.
# Zeroize cookie signing keys on drop. RustCrypto ecosystem standard;
# the `Zeroizing<Vec<u8>>` wrapper clears the heap allocation when
# the SigningKey owning it is dropped, preventing cryptographic
# secret residue in core dumps / heap leaks / panic backtraces
# (3rd review #4 from R63's strict audit retrospect).
zeroize = { version = "1", features = ["zeroize_derive"] }
# R69 — AP-side entropy source for signing_key_from_os_entropy. RustCrypto
# ecosystem chooses `getrandom` for OS-syscall-backed (Linux: getrandom(2)
# fallback to /dev/urandom; macOS: getentropy) cryptographic random bytes.
# MCU sibling (wz-runtime-lwip Phase W) does NOT pull this dep — it
# routes through `sce_intrinsics_runtime::rng` per §5.I architectural-
# tier registry (intrinsics §2.5). Keeping the dep AP-only preserves
# the no_std contract on the MCU build.
getrandom = "0.2"
# R4b — RSA for the §5.16 pubkey auth method (PubKeyMethod, the wz mirror of
# zenoh pubkey.rs). zenoh uses the RustCrypto `rsa` crate (Cargo.toml `rsa =
# "0.9"`) with PKCS#1 v1.5 encryption + `decrypt_blinded` (the Marvin
# RUSTSEC-2023-0071 mitigation; accepted per the RSA-dep decision -- AP-only,
# usrpwd-grade encrypted-transport threat model). `rsa` REQUIRES std, so this
# method is AP-only (wz-runtime-tokio) and CANNOT live in the no_std session
# kernel where usrpwd does -- the AuthMethod trait stays in the kernel, the impl
# lives where its crypto dep mandates (the clean trait/impl split). Optional:
# pulled only by `access-extauth-pubkey`. `rand` supplies the `OsRng` CryptoRng
# the RSA padding/blinding + the challenge draw need (rand_core 0.6, matching
# rsa 0.9).
rsa = { version = "0.9", optional = true }
rand = { version = "0.8", optional = true }
# R311di-pre-a — no_std-compatible HashMap. `hashbrown` is the upstream
# implementation of std::collections::HashMap (std re-exports it via
# alloc + hashbrown). Pulling the crate directly here makes the
# session_glue.rs / session.rs / declare/* HashMap import surface
# move-ready: when these modules extract to wz-session-core (no_std +
# alloc) at R311di, the `use hashbrown::HashMap` line works unchanged.
# Default features include `default-hasher` (foldhash) + `inline-more`
# + `allocator-api2` — match the std::collections::HashMap behaviour
# the existing call sites already assume.
hashbrown = "0.15"
# R311di-pre-a — no_std-compatible atomic ints. `portable-atomic`
# provides AtomicU64 with the same API as std::sync::atomic::AtomicU64;
# on AP (this crate, has native u64 atomics) it forwards directly to
# core::sync::atomic, on MCU (wz-runtime-lwip pulls the same crate with
# the critical-section feature per R311bb) it falls back via interrupt-
# disable. Migration target: every wz-runtime-tokio AtomicU64 call site
# routes through this crate so the eventual extraction to wz-session-core
# (no_std) sees a single dep surface across both runtime profiles.
portable-atomic = "1"
# R311no — wz's multicast bind joins a group port that every other zenoh
# peer on the same host also binds (a multicast group port is inherently
# multi-listener). zenoh-pico sets SO_REUSEADDR + SO_REUSEPORT
# unconditionally on its multicast listener before binding `0.0.0.0:port`
# (vendor/zenoh-pico/src/link/transport/udp/udp_multicast_posix.c
# :180 / :185 / :196), so a wz multicast receiver co-located with a pico
# peer (`pico -> wz` dial-in) must do the same or fail `EADDRINUSE`.
# tokio's `UdpSocket` exposes no pre-bind setsockopt hook, so the
# REUSE-then-bind sequence drops to socket2 (Socket -> std UdpSocket ->
# tokio `from_std`). Gated on the two features that activate
# `bind_multicast_v4` (scouting-active / transport-multicast) so a
# unicast-only build never compiles it. `features = ["all"]` unlocks
# `set_reuse_port` (SO_REUSEADDR is base API; SO_REUSEPORT sits behind
# socket2's `all`). Distinct from the dev-dependencies socket2 below,
# which serves a bind-without-listen test shim; Cargo unifies the two.
socket2 = { version = "0.6", features = ["all"], optional = true }

# R311xj — AF_VSOCK link backend dep. Linux-only (the same platform gate
# zenoh-link-vsock uses, `[target.'cfg(target_os="linux")']`): `tokio-vsock`
# wraps the Linux-only AF_VSOCK socket family, so it is target-gated AND
# optional, pulled only by `transport-link-vsock`. `vsock_pipeline` (and its
# session_open wiring) is `#[cfg(all(feature="transport-link-vsock",
# target_os="linux"))]`, so a non-Linux build never references this dep. Pinned
# to 0.5 to match zenoh-link-vsock 1.5.0.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# R311gg — tests/static_scout_open.rs holds a bound-but-not-listening
# loopback socket to synthesize a deterministically connection-refused
# locator. std's TcpListener always `listen()`s; socket2 is the portable
# way to bind without listening (already in the tree transitively via
# tokio). Dev-only: never compiled into the lib or the no_std targets.
socket2 = "0.6"
# R311oa — generate a self-signed cert + key pair for the TLS loopback e2e
# (tests/tls_e2e.rs): the acceptor's rustls ServerConfig needs a cert chain +
# private key, and the dialer's ClientConfig must trust that cert (added to a
# fresh root store, server name "localhost"). Dev-only — never compiled into
# the lib or the no_std targets; production cert material comes from the app.
rcgen = "0.13"
# R311oh — the `tls_pem_mtls_e2e` file-source test writes fixture PEM to a temp
# dir and reads it back through `tls_config::read_pem_file`, proving the
# file-path cert source composes with the byte loaders. tempfile gives the
# RAII-cleaned temp dir so the test leaves no stray files. Dev-only.
tempfile = "3"
# R71 — test fixtures + rebind shims moved to a separate sibling crate
# so the production compile units of this crate carry zero test-only
# code paths. Previously these helpers lived behind a `_test_support`
# Cargo feature; the sibling-crate model is a stronger encapsulation
# contract because a downstream consumer cannot enable the feature
# transitively to import the fixtures.
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support", features = [
    "tls-fixtures",
] }
# R311gi gc-2c — the EngineInjector bridge, used by the switchboard
# integration test (tests/switchboard_inject.rs) to wrap a real
# Engine<SessionFsmUnicastPolicy> as the EventInjector port. Dev-only: the
# production app (wz-ap-demo) constructs the injector over its own app
# statechart engine (R311gj), so the bridge is not a normal dep here.
wz-statechart-bridge = { path = "../wz-statechart-bridge" }
# R311ds — the wz-session-core-test-support dev-dep moved to
# wz-session-core: the declare/* shells no longer host the behavioural
# tests (they migrated to wz-session-core next to the registry code),
# so this crate stopped consuming the four-registry fixture builders.
# R311qc — re-added: the `routing_forward` kernel tests are a new consumer
# of the DeclareSubscriber / UndeclareSubscriber envelope builders (the
# router records subscriptions from inbound Declares), and these construct
# `wz-session-core` codec types shared across both `wz-runtime-tokio` copies
# in the dev-dep-cycle graph (like `fixture_session_init_params`), so
# importing them across the boundary is sound.
wz-session-core-test-support = { path = "../wz-session-core-test-support" }
# R311fu — the owned->wire `TestWire` projection SSOT (used by the
# session_glue byte-compare tests for all five emitted message
# mirrors). Distinct from the removed session-core dev-dep above: this
# is the wz-codecs-tier sibling, dev-dep'd symmetrically by both
# consumers, and its `codec-*` features forward from this crate's own
# (see [features]) so an isolated subset pulls neither the wz-codecs
# codec nor the corresponding impl.
wz-codecs-test-support = { path = "../wz-codecs-test-support" }
# Stage 5 (R311it) — the no_std SSOT for the synthetic session handshake
# wire bytes the session-FSM drive tests feed through parse_inbound. These
# craft_*_wire helpers + transport constants used to be copy-pasted across
# the three session_fsm_* test files (and re-rolled in wz-mcu-session-
# acceptor); they now live once in this shared fixture crate.
wz-session-wire-fixtures = { path = "../wz-session-wire-fixtures" }

[lints]
workspace = true
