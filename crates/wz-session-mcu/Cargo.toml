#
# wz-session-mcu — the MCU session shell that is written ONCE for every network
# stack: the application layer a session is driven with, the admin node a host
# reconfigures at runtime (its write subscriber, its status queryable, its dial
# manager), and the dialer that opens a written endpoint as a session.
#
# It was `wz-session-lwip`'s, and named for lwIP, because lwIP was the only stack
# the MCU profile had. What it needs of a stack is two things — a link that
# accepts on a port and a link that dials an address — and both are the
# `SessionLinks` seam in `wz-runtime-coop`, next to the `SessionDatagramLink`
# seam the shared drive loop already takes (R2915). So the shell is generic over
# the stack, and lwIP and Zephyr's sockets each supply their links; a board is
# not asked to carry the lwIP crate to run an admin node over some other stack.
#
# Deliberately depends on NO link crate. The runtime tier is link-agnostic and so
# is this one; the lwIP-specific half (`LwipUdpDriver`, `LwipLinks`, the
# multicast drive loop) stays in `wz-session-lwip`, which depends on this crate
# and re-exports it under its old paths.

[package]
name = "wz-session-mcu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
publish = false
description = "MCU session shell over any network stack: application layer, admin node, connection manager and dialer, generic over the SessionLinks seam."

[lib]
name = "wz_session_mcu"
path = "src/lib.rs"

[features]
default = ["alloc"]

# S9e — the heap: every dependency feature that links the `alloc` crate (the
# runtime's, the session core's), so a build without it, which is the per-session
# slot profile's, names no allocator-bearing crate. On by default because every
# heap consumer of this crate has always had it.
alloc = [
    "wz-runtime-coop/alloc",
    "wz-session-core/alloc",
]

# Exposes the in-memory network the shell's own tests run on, for a sibling
# crate that wants a stack-neutral peer. Never in a production build.
test-support = ["wz-session-core/lifecycle-contract"]

# The fixed-memory node serves close, reset and status beside open (decision D7 of
# docs/session-lifecycle-intent.md, step 8). Off, which every image is until it binds a verb, none of
# it is compiled and the manager is what it was: the unbound image keeps its flash and the stack of
# its tick (measured: +352 bytes of chain and +1,988 of flash on the Zephyr client when this code was
# not gated). A verb is a capability of the build (docs/build-configuration.md C2): an image takes the
# ones it needs and pays for those.
#
# lifecycle-verbs -- the machinery the verbs share, which each verb below turns on and which binds no
# verb by itself: the store's entries for requests made outside the loop, the mirror of each node's
# links, `NodeDesk`, `StoreNode` and `LifecyclePermits`. A build names the verbs and not this.
lifecycle-verbs = ["wz-session-core/storage-profile"]
# lifecycle-close -- `close`: the node leaves the intent, its session is hung up, and it is dialled
# no more; an open after it is taken again once it has run.
lifecycle-close = ["lifecycle-verbs"]
# lifecycle-reset -- `reset <generation>`: the session is ended once per generation and the intent is
# kept, so the machine dials again; the record of generations (the size of the room, never evicting)
# and `ConnectManager::reset_node`.
lifecycle-reset = ["lifecycle-verbs"]
# lifecycle-status -- `status`: the links of the node and the state of its machine, mirrored at each
# tick and read without the loop.
lifecycle-status = ["lifecycle-verbs"]

# Fixed-memory step S5 — the shell on the per-session slot profile
# (`wz-runtime-coop`'s `session-slot`). The application layer is generic over the
# session handle and takes the slot's. The dialer, the connection manager and the
# admin node open sessions through `SessionLinks` with `Rc` handles and a
# `Box<dyn FnMut>` per dial, none of which has a slot form yet (steps S8 and S9),
# so under this feature those modules and the in-memory test network are not
# compiled: a build that selects it alongside `adminspace-*` gets the application
# layer and no admin node, which is what every image on this profile is until then.
session-slot = ["wz-runtime-coop/session-slot", "wz-session-core/session-slot"]

transport-keepalive = [
    "wz-session-core/transport-keepalive",
    "wz-runtime-coop/transport-keepalive",
]
# The multicast group session, written once for every network stack
# (`group_drive`): the drive loop, its pump and the table the slot profile keeps it
# in. Forwards what `wz-session-lwip`'s `transport-multicast` always named: the
# multicast dispatcher and FSM, the JOIN wire, and the Frame and Close codecs.
transport-multicast = [
    "wz-session-core/session-multicast",
    "wz-session-core/codec-join",
    "wz-session-core/codec-frame",
    "wz-session-core/codec-close",
]
# Transport reassembly on the group loop: the router that stages a fragment chain
# per member (`wz-runtime-coop`'s), and the shared ingest that feeds it.
reassembly = [
    "wz-runtime-coop/reassembly",
    "wz-session-core/reassembly",
]
codec-push = ["wz-session-core/codec-push"]
codec-response = ["wz-session-core/codec-response"]
codec-response-final = ["wz-session-core/codec-response-final"]
liveliness-token = ["wz-session-core/liveliness-token"]
# A node that DECLARES a liveliness token to its router and nothing more: the `Declare(DeclToken)`
# the session sends as it establishes, which the router drops with the session. Not
# `liveliness-token`, which is the registry that answers a peer's interest in tokens.
declare-token = ["wz-session-core/declare-token"]
query-queryable = ["wz-session-core/query-queryable"]
# A node that ASKS: the request it writes, the replies and the final it is answered with, and the
# selector parameters it can state. `SlotDispatch::get` on the slot profile.
query-get = [
    "wz-session-core/codec-request",
    "wz-session-core/codec-response",
    "wz-session-core/codec-response-final",
    "wz-session-core/query-selector-parameters",
    # A node that asks is answered: the Responses and the ResponseFinal come back on the wire.
    "wz-session-core/rx-response",
]
pubsub-put = ["wz-session-core/pubsub-put"]
# The dialer and the connection manager: a node that holds an initiator session with each endpoint
# of an `EndpointSource` and re-dials the ones that drop. Nothing in it is the admin space's, so a
# firmware that dials a router it was built to know takes this and not `adminspace-write`.
dial = [
    "wz-session-core/connect-endpoints",
    "wz-session-core/session-unicast-open",
    "wz-session-core/codec-init-body",
    "wz-session-core/codec-open-body",
]
# What a CLIENT of a router that answers queries is, whichever memory profile it runs on: the
# dialer, and the wire half of a queryable (its declaration, the reply and the final that answers
# a query). The pico side of the same function is `Z_FEATURE_QUERYABLE` over a UDP client
# session; no listener, no admin space, no config write. It does NOT declare a subscriber
# (`client-subscriber`): zenoh-pico's `Z_FEATURE_SUBSCRIPTION` is its own switch.
client-core = [
    "dial",
    "pubsub-put",
    "query-queryable",
    "codec-response",
    "codec-response-final",
    "wz-session-core/pubsub-delete",
    "wz-session-core/pubsub-encoding",
    "wz-session-core/query-reply-err",
    "wz-session-core/declare-queryable",
]
# The subscribing half of a client: the declaration of a subscriber, which the router answers by
# forwarding a PUT on the key to the node (`Z_FEATURE_SUBSCRIPTION`). Without it
# `send_declare_subscriber` refuses with `FeatureDisabled` and the registry of subscriptions is not
# compiled: 2.4 KB of text and 1 KB of RAM on the Zephyr fixed client (docs/text-ownership.md).
client-subscriber = ["wz-session-core/declare-subscriber"]
# The client on the heap profile: an observer to register queryables and subscribers on, and their
# declarations sent on every session as it establishes (`client_node`).
client-node = ["alloc", "client-core", "client-subscriber"]
# The client on the slot profile that answers queries and subscribes to nothing: the pico-shaped
# client, over the tables its image declared, with no allocator (`slot_client`). Beside
# `session-slot`, which the image names itself.
client-slot-queryable = ["client-core", "session-slot"]
# The client on the slot profile: the same node with the subscriptions it keeps the latest sample
# of, over the tables its image declared, with no allocator (`slot_client`). Beside
# `session-slot`, which the image names itself.
client-slot = ["client-slot-queryable", "client-subscriber"]
# The client on the slot profile that also TAKES the sessions a peer opens to it (`Listening`): the
# accept side of the handshake, which a client does not carry. Without it a node cannot be given an
# acceptor, because one it was given would read an InitSyn and never answer it.
listen = ["client-slot", "wz-session-core/session-unicast-accept"]
# The client on the slot profile that is also a MEMBER of a multicast group (`slot_group`): the group's
# JOIN beacons and datagrams, the node's subscriptions fed from what the members put and its publishers
# putting on the group. The literal Put is the whole of the group's outbound vocabulary with no
# allocator, so a node with a group carries publishers and subscriptions and no more. A member's put
# longer than the batch arrives as a Fragment chain (zenoh-pico fragments at its batch), so the group
# reassembles: the router that stages a chain per member, and the fragment codec it reads them with.
group = [
    "client-slot",
    "transport-multicast",
    "codec-push",
    "reassembly",
    "wz-session-core/transport-fragmentation",
]
adminspace-write = [
    "dial",
    "wz-session-core/adminspace-write",
    "pubsub-put",
    "wz-session-core/pubsub-delete",
    "wz-session-core/session-unicast-accept",
    # R2838 — a router forwards a PUT only to a face that DECLARED a matching
    # subscriber, so the node declares `<root>/config/**` on every session,
    # as upstream's admin space does. Measured against a stock zenohd: the
    # write never arrived until it did.
    "wz-session-core/declare-subscriber",
]
adminspace-core = [
    "adminspace-fixed",
    "wz-session-core/adminspace-core",
]
# S9e — the admin node's pieces that need no allocator (the fixed status and identity
# rows, the arena the replies are built in, the host the writes go through): what the
# per-session slot profile answers an admin GET with. `adminspace-core` is this plus
# the growable node and the owned rows, so it implies this and the heap.
adminspace-fixed = [
    "wz-session-core/adminspace-fixed",
    "query-queryable",
    "codec-response",
    "codec-response-final",
    # S9b — a leg the node refuses (a reply past its buffer) reaches the querier as
    # a typed Err reply, which is the Err-reply feature; without it the refusal is
    # counted and the querier sees only the terminating Final.
    "wz-session-core/query-reply-err",
    # R2838 — and the same for the GET: the node declares `<root>/**` as a
    # queryable on every session, or a router has nowhere to route it.
    "wz-session-core/declare-queryable",
]

[dependencies]
# The cooperative runtime: CoopRuntime<C> + CoopTime<C>, the local task set the
# sessions are spawned on, and the `SessionLinks` / `SessionDatagramLink` seams.
wz-runtime-coop = { path = "../wz-runtime-coop", default-features = false, features = ["session-unicast"] }
# Runtime-agnostic session SSOT: the action bundle, the engine-free FSM, the
# admin answerers. no_std selects the heapless engine; alloc the bundle.
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["session-unicast", "no_std"] }
# R2828 — `admin_host::ConnectControl` locks with the same IRQ-disabling Mutex
# the cooperative runtime uses. No impl feature here: the firmware (or the std
# impl in dev-dependencies, for host tests) supplies it at link time.
critical-section = "1"
# The group loop reads its clock through `TimeSource`, as the unicast loop does.
wz-runtime-core = { path = "../wz-runtime-core", default-features = false }
# The slot profile's reply queue: a fixed-capacity deque in a `static`, the same
# crate and version `wz-session-core`'s bounded backing is made of.
heapless = { version = "0.8", default-features = false }
# What a publisher of the slot client plays (docs/target-build-contract.md 5c): its arrival process
# and the fill of a made body, the same definitions the heap interpreters play, without `alloc`.
wz-workload = { path = "../wz-workload", default-features = false }

[dev-dependencies]
# critical-section's std impl backs CoopRuntime's critical_section::Mutex and the
# portable-atomic polyfill on the host test path.
critical-section = { version = "1", features = ["std"] }
# Builds the Push / Request records the shell's tests feed the observer.
# Dev-only: the library names no wz_codecs type.
wz-codecs = { path = "../wz-codecs", default-features = false }
# The far end of the client node's tests is an ACCEPTOR session, which the client build itself
# does not carry: a client never accepts. Dev-only, so a test build has the accept path and the
# build that ships does not.
#
# The conformance table of decision D7 (`contract` re-exports it), which this crate's own tests
# run its transports through.
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "session-unicast-accept",
    "lifecycle-contract",
] }

[lints]
workspace = true
