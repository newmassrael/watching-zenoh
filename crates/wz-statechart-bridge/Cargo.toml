#
# wz-statechart-bridge — R311gh gc-2b.
#
# The engine-bridge adapter that wires the wz statechart-injection port
# (`wz_session_core::switchboard::EventInjector`) onto a concrete SCE
# `Engine::raise_external_by_name`. It exists because the orphan rule
# forbids `impl EventInjector for Engine<P>` in any crate that owns
# neither type: the trait is wz-session-core's, the `Engine` is
# sce-rust-runtime's. This crate owns a local newtype (`EngineInjector`)
# and impls the trait over it, so wz-session-core stays sce-free and both
# the AP (wz-runtime-tokio) and MCU (generated preset) profiles consume
# one shared adapter SSOT.
#
# `#![no_std]`: the crate uses only `Engine` + `StatePolicy` + `&str`, so
# it carries no std / alloc dependency of its own. The `no_std` feature
# forwards the bare-metal selection to sce-rust-runtime; AP builds leave
# it off and sce-rust-runtime resolves to its std default via the
# wz-runtime-tokio edge's feature unification.

[package]
name = "wz-statechart-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "R311gh gc-2b — EngineInjector: SCE Engine -> wz EventInjector port adapter (statechart-injection bridge)."

[features]
default = []

[dependencies]
# Only the EventInjector port is used (unconditional, alloc-free), so the
# alloc default is dropped on this edge; AP builds re-enable it via other
# workspace edges through feature unification.
wz-session-core = { path = "../wz-session-core", default-features = false }
# default-features = false is the bare-metal engine, which is what this crate's body is written
# against (the runtime's features only add, SCE ADR 0053); the AP wz-runtime-tokio edge keeps the
# defaults and unification turns std back on for AP builds.
sce-rust-runtime = { path = "../../vendor/sce/backends/rust/runtime", default-features = false }

[lints]
workspace = true
