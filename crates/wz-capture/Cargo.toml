#
# R311y578 (G1) — the CAPTURE-side input path: pcap ingest, link/IP/TCP
# decapsulation, and TCP flow reassembly into the per-direction byte streams
# `wz_session_core::passive` consumes.
#
# Its own crate, and deliberately not a module of wz-session-core: this layer
# knows nothing about zenoh and wz-session-core knows nothing about capture
# files. The seam between them is a byte stream plus a direction, which is
# exactly what a live tap would also produce — so an AF_PACKET or a
# ring-buffer source lands here later without touching the decode side.
#
# ZERO third-party dependencies. Every format below is a fixed-layout header
# read out of a byte slice; pulling a parsing crate in would trade an
# afternoon of struct reading for a supply-chain surface on a dogfood tool.
[package]
name = "wz-capture"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
publish = false

[lints]
workspace = true

# R311y594 — `reassembly` is DEFAULT-ON, and its absence was a real hole rather
# than a choice: a capture front end whose Fragments stay opaque cannot do the
# per-channel reassembly the analyzer requirement asks for, and nothing in the
# workspace made that visible because a build that ALSO contains
# `wz-runtime-tokio` unifies the feature back on. Building `-p wz-capture`
# alone is what shows it. Kept switchable for a consumer that genuinely wants
# transport frames and nothing above them.
[features]
default = ["reassembly"]
reassembly = ["wz-session-core/reassembly"]

[dependencies]
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "alloc",
    "codec-frame",
    "codec-init-body",
    "codec-open-body",
    "codec-close",
    "codec-keep-alive",
    # R311y597 — the raweth (L2) FRAMING, and deliberately NOT behind a
    # `wz-capture` feature of its own. A capture front end reads what is on the
    # wire; making the one non-IP link zenoh speaks optional would mean a
    # default build that silently drops it, which is the state this closes.
    # `raweth_link` is pure header parsing with no dependencies of its own, so
    # the cost is a struct and two functions.
    "transport-link-raweth",
] }
