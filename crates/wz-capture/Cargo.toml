# SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael
#
# R311y578 (G1) — the CAPTURE-side input path: pcap ingest, link/IP/TCP
# decapsulation, and TCP flow reassembly into the per-direction byte streams
# `wz_session_core::passive` consumes.
#
# Its own crate, and deliberately not a module of wz-session-core: this layer
# knows nothing about zenoh and wz-session-core knows nothing about capture
# files. The seam between them is a byte stream plus a direction, which is
# exactly what a live tap would also produce — so an AF_PACKET or a
# ring-buffer source lands here later without touching the decode side.
#
# ZERO third-party dependencies. Every format below is a fixed-layout header
# read out of a byte slice; pulling a parsing crate in would trade an
# afternoon of struct reading for a supply-chain surface on a dogfood tool.
[package]
name = "wz-capture"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
publish = false

[lints]
workspace = true

# R311y594 — `reassembly` is DEFAULT-ON, and its absence was a real hole rather
# than a choice: a capture front end whose Fragments stay opaque cannot do the
# per-channel reassembly the analyzer requirement asks for, and nothing in the
# workspace made that visible because a build that ALSO contains
# `wz-runtime-tokio` unifies the feature back on. Building `-p wz-capture`
# alone is what shows it. Kept switchable for a consumer that genuinely wants
# transport frames and nothing above them.
[features]
default = ["reassembly", "network-codecs", "filter-wildcards"]
reassembly = ["wz-session-core/reassembly"]

# R311y855 — the FIELD walker, and DEFAULT-OFF, which is the one place this
# crate's default set says no.
#
# R311y675 made this call and its reason still holds: `wz-session-core/dissect`
# pulls `alloc` and twelve `codec-*` arms, and this crate has to keep building
# for the MCU profiles with no third-party dependency. Widening the default
# would charge every embedded consumer for a walker only a desktop reader runs.
# That round put the selection in `wz-analyze`, the composition root; R311y855
# needs the same layer from a SECOND consumer (`wz-capi-dissect`), and a feature
# here is what lets both select it without either owning the emit.
#
# The cost of default-off is that no `-p wz-capture` build compiles
# `fields_json`, which is the "a lane nobody runs" hazard this workspace has
# paid for. Two lanes close it: C1bn runs `--features dissect` by name, and
# C1bo builds `wz-capi-dissect`, whose dependency line turns it on.
dissect = ["wz-session-core/dissect"]

# R311y616 (§1.1f) — the keyexpr WILDCARD arms the filter language's `key` term
# needs, and a feature rather than three names on the dependency line for the
# reason R311y614 measured: a feature named there is unified into every crate
# that carries wz-capture anywhere in its graph, including as a dev-dependency,
# so wz-capture's choice would silently become wz-session-core's everywhere.
#
# DEFAULT-ON, because a filter language whose `demo/**` does not wildcard is not
# the language a reader expects. Switchable, so a dependent that composes its
# own keyexpr capability set keeps it.
#
# The three toggles DEGRADE SILENTLY when off — `**` stops being a wildcard and
# becomes a literal chunk to compare — which is right for an MCU client and
# catastrophic for a selector a person typed. `filter::compile_pattern` turns
# that degradation into a PARSE REFUSAL, so this feature being off is a
# question the tool declines rather than a question it answers wrongly.
filter-wildcards = [
    "wz-session-core/keyexpr-wildcard-single",
    "wz-session-core/keyexpr-wildcard-double",
    "wz-session-core/keyexpr-dollar-star",
]

# R311y614 — the network codec selection, and it is a FEATURE rather than an
# unconditional dependency line for a reason that was measured the hard way.
#
# R311y613 added these five to the `wz-session-core` dependency directly. That
# is correct for `-p wz-capture`, and it silently WIDENED every other crate's
# build: `wz-runtime-tokio` carries `wz-capture` as a dev-dependency, cargo
# unifies features across the graph, and so `wz-session-core/codec-request`
# became ON in a subset build whose whole point was that it is OFF. Layer C1bi's
# negative arm — `send_request_query` must answer `FeatureDisabled` — then got
# `Ok(())`, because the reject lives on `wz-session-core`'s gate while the
# test's own `#[cfg]` reads `wz-runtime-tokio`'s. Hosted red, local green: no
# local lane builds that subset.
#
# DEFAULT-ON, so `wz-capture` alone still names the data plane and R311y613's
# hole stays closed. Switchable, so a dependent that must not have these
# features in its graph can say `default-features = false` — which is exactly
# what `wz-runtime-tokio` now does.
network-codecs = [
    "wz-session-core/codec-push",
    "wz-session-core/codec-request",
    "wz-session-core/codec-response",
    "wz-session-core/codec-response-final",
    "wz-session-core/codec-declare",
]

# R2107 (open-debt item 527) — the FIRST bench target in this workspace, and it
# exists because there were none: measured 2026-08-25, zero `[[bench]]` targets
# and zero `benches/` directories anywhere in `crates/`, so a downstream claim
# about this decoder's per-byte cost could be neither reproduced nor refuted
# here. `harness = false` because the deliverable is a FIT (fixed ns/packet
# separated from ns/byte, against a memcpy baseline measured in the same
# process), which libtest's bench harness has no shape for -- and because that
# harness is nightly-only, while this toolchain is pinned stable.
[[bench]]
name = "decode_cost"
harness = false

[dependencies]
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "alloc",
    "codec-frame",
    "codec-init-body",
    "codec-open-body",
    "codec-close",
    "codec-keep-alive",
    # R311y597 — the raweth (L2) FRAMING, and deliberately NOT behind a
    # `wz-capture` feature of its own. A capture front end reads what is on the
    # wire; making the one non-IP link zenoh speaks optional would mean a
    # default build that silently drops it, which is the state this closes.
    # `raweth_link` is pure header parsing with no dependencies of its own, so
    # the cost is a struct and two functions.
    "transport-link-raweth",
    # R311y720 (§D M3) — the SERIAL link's framing, on exactly the argument the
    # raweth line above makes and for a sharper reason. A `--serial` flag that
    # silently read nothing because a feature was off is the "silent
    # degradation" this workspace turns into a refusal everywhere else; making
    # it non-optional means the flag either works or the build does not exist.
    # It is COBS + CRC32 + a 7-byte envelope, all of it already in the codec
    # crate this depends on.
    "transport-link-serial",
    # R311y605 — the multicast JOIN, and for the same reason as raweth above:
    # not behind a `wz-capture` feature, because a capture front end reads what
    # is on the wire. Its absence was silent in the worst available way — the
    # datagram flow was created, the packet was not skipped, and the frame
    # parsed SUCCESSFULLY as `Unknown { mid: 7 }`, so every coarse assertion
    # held while the announcement traffic on zenoh's multicast session group
    # (a peer's zid, lease and initial per-channel SNs) arrived unnamed.
    "codec-join",
    # R311y607 — the SCOUTING namespace, and for a reason the two above do not
    # have: without these the observer did not go quiet, it went WRONG. A
    # SCOUT's MID is 0x01 and so is an Init's, so every scout on the pre-session
    # multicast group decoded as a confident `InboundFrame::Init` — a misread,
    # which is worse than the JOIN's `Unknown { mid: 7 }` because every coarse
    # assertion downstream not only held but held on a NAMED message.
    "codec-scout",
    "codec-hello",
    # R311y613 — the NETWORK namespace: the pub/sub and query plane the capture
    # front end exists to observe, and which it could not name AT ALL until this
    # list said so. `codec-frame` gave it the envelope, and the envelope is what
    # every census so far checked; the records INSIDE it are dispatched by a
    # second, independent set of `#[cfg]` arms
    # (`network_message::decode_one_record`) that had none of these.
    #
    # The failure was worse than silence, in the shape R311y607 named: an
    # unfeatured MID does not merely go unnamed, it ABSORBS THE REST OF THE
    # BATCH verbatim and halts the walk — so a single Push made every record
    # behind it in the same frame invisible, while the transport census stayed
    # green because the Frame around them was named perfectly.
    #
    # Measured, not argued: `every_network_mid_inside_a_frame_is_named_rather_
    # than_unknown` red on `UnknownMid { mid: 29 }` (0x1D, PUSH) before this
    # list existed.
    #
    # R311y614 moved the five OUT of this list and behind the default-on
    # `network-codecs` feature above — see its comment: naming them here made
    # them unconditional for every crate that carries wz-capture anywhere in its
    # graph, including as a dev-dependency.
] }

# R311y886 (open-debt item 357) — the RFC 1071 fills this crate's own packet
# fixtures use, moved out of `datagram_tests` so the five other crates that lay
# packets by hand stop each keeping their own answer. A DEV-dependency and never
# a real one: nothing in the shipped path builds a packet, and this crate's
# zero-third-party rule is load-bearing for the MCU profiles. The dependency has
# no dependencies of its own, so it adds nothing to any graph it enters.
[dev-dependencies.wz-packet-fixtures]
path = "../wz-packet-fixtures"

# R2107 (open-debt item 527) — `wire_const::T_MID_KEEP_ALIVE`, so the decode
# bench's payload is REAL zenoh session traffic rather than filler. Its first
# version pushed `0x5a` bytes, the message layer never ran, and the sweep timed
# reassembly while reporting decode. A dev-dependency on a crate this one
# already depends on for real: it costs no production graph and names where the
# constant comes from instead of copying the byte.
[dev-dependencies.wz-session-core]
path = "../wz-session-core"
default-features = false

# R311y605 — the JOIN test fixture is built by the CODEC's own encode rather
# than by a hand-laid byte string, so a walker or a decode that disagrees with
# the codec fails instead of agreeing with the fixture author's reading of the
# layout.
#
# R311y613 moved this from `[dev-dependencies]` to a real one. The note it used
# to carry — "nothing in the crate's own code reaches wz-codecs" — stopped being
# true with `agg`: the aggregation plane reads the keyexpr out of a decoded
# `PushOwned` / `RequestOwned` / `ResponseOwned`, and those ARE `wz-codecs`
# types in `NetworkMessage`'s public API. Reaching them through
# `wz_session_core` was never available — it re-exports `wire_const` and
# `WhatAmI`, not the codec modules — so the alternative to this line is not a
# tidier import, it is a second copy of the wire layout.
#
# Features named explicitly rather than left to unification — a subset build
# that happened not to unify `codec-join` on would otherwise fail for a reason
# that looks like the test's.
[dependencies.wz-codecs]
path = "../wz-codecs"
default-features = false
features = [
    "alloc",
    "codec-join",
    # R311y607 — the MID-census test builds one message per MID through that
    # MID's own codec, so the census is anchored to the codecs rather than to
    # nine hand-laid byte strings that would all have to be right.
    "codec-init-body",
    "codec-open-body",
    "codec-close",
    # R311y607 — same rule for the scouting fixtures: a SCOUT under test is
    # built by the SCOUT codec's own encode, so a walker that disagrees with the
    # codec fails rather than agreeing with a hand-laid byte string.
    "codec-scout",
    "codec-hello",
    # R311y613 — the NETWORK namespace, for `agg` and for the census that found
    # it missing.
    "codec-push",
    "codec-request",
    "codec-response",
    "codec-response-final",
    "codec-declare",
]
