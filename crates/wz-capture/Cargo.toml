# SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael
#
# R311y578 (G1) — the CAPTURE-side input path: pcap ingest, link/IP/TCP
# decapsulation, and TCP flow reassembly into the per-direction byte streams
# `wz_session_core::passive` consumes.
#
# Its own crate, and deliberately not a module of wz-session-core: this layer
# knows nothing about zenoh and wz-session-core knows nothing about capture
# files. The seam between them is a byte stream plus a direction, which is
# exactly what a live tap would also produce — so an AF_PACKET or a
# ring-buffer source lands here later without touching the decode side.
#
# ZERO third-party dependencies. Every format below is a fixed-layout header
# read out of a byte slice; pulling a parsing crate in would trade an
# afternoon of struct reading for a supply-chain surface on a dogfood tool.
[package]
name = "wz-capture"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
publish = false

[lints]
workspace = true

# R311y594 — `reassembly` is DEFAULT-ON, and its absence was a real hole rather
# than a choice: a capture front end whose Fragments stay opaque cannot do the
# per-channel reassembly the analyzer requirement asks for, and nothing in the
# workspace made that visible because a build that ALSO contains
# `wz-runtime-tokio` unifies the feature back on. Building `-p wz-capture`
# alone is what shows it. Kept switchable for a consumer that genuinely wants
# transport frames and nothing above them.
[features]
default = ["reassembly"]
reassembly = ["wz-session-core/reassembly"]

[dependencies]
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "alloc",
    "codec-frame",
    "codec-init-body",
    "codec-open-body",
    "codec-close",
    "codec-keep-alive",
    # R311y597 — the raweth (L2) FRAMING, and deliberately NOT behind a
    # `wz-capture` feature of its own. A capture front end reads what is on the
    # wire; making the one non-IP link zenoh speaks optional would mean a
    # default build that silently drops it, which is the state this closes.
    # `raweth_link` is pure header parsing with no dependencies of its own, so
    # the cost is a struct and two functions.
    "transport-link-raweth",
    # R311y605 — the multicast JOIN, and for the same reason as raweth above:
    # not behind a `wz-capture` feature, because a capture front end reads what
    # is on the wire. Its absence was silent in the worst available way — the
    # datagram flow was created, the packet was not skipped, and the frame
    # parsed SUCCESSFULLY as `Unknown { mid: 7 }`, so every coarse assertion
    # held while the announcement traffic on zenoh's multicast session group
    # (a peer's zid, lease and initial per-channel SNs) arrived unnamed.
    "codec-join",
    # R311y607 — the SCOUTING namespace, and for a reason the two above do not
    # have: without these the observer did not go quiet, it went WRONG. A
    # SCOUT's MID is 0x01 and so is an Init's, so every scout on the pre-session
    # multicast group decoded as a confident `InboundFrame::Init` — a misread,
    # which is worse than the JOIN's `Unknown { mid: 7 }` because every coarse
    # assertion downstream not only held but held on a NAMED message.
    "codec-scout",
    "codec-hello",
    # R311y613 — the NETWORK namespace: the pub/sub and query plane the capture
    # front end exists to observe, and which it could not name AT ALL until this
    # list said so. `codec-frame` gave it the envelope, and the envelope is what
    # every census so far checked; the records INSIDE it are dispatched by a
    # second, independent set of `#[cfg]` arms
    # (`network_message::decode_one_record`) that had none of these.
    #
    # The failure was worse than silence, in the shape R311y607 named: an
    # unfeatured MID does not merely go unnamed, it ABSORBS THE REST OF THE
    # BATCH verbatim and halts the walk — so a single Push made every record
    # behind it in the same frame invisible, while the transport census stayed
    # green because the Frame around them was named perfectly.
    #
    # Measured, not argued: `every_network_mid_inside_a_frame_is_named_rather_
    # than_unknown` red on `UnknownMid { mid: 29 }` (0x1D, PUSH) before this
    # line existed.
    "codec-push",
    "codec-request",
    "codec-response",
    "codec-response-final",
    "codec-declare",
] }

# R311y605 — the JOIN test fixture is built by the CODEC's own encode rather
# than by a hand-laid byte string, so a walker or a decode that disagrees with
# the codec fails instead of agreeing with the fixture author's reading of the
# layout.
#
# R311y613 moved this from `[dev-dependencies]` to a real one. The note it used
# to carry — "nothing in the crate's own code reaches wz-codecs" — stopped being
# true with `agg`: the aggregation plane reads the keyexpr out of a decoded
# `PushOwned` / `RequestOwned` / `ResponseOwned`, and those ARE `wz-codecs`
# types in `NetworkMessage`'s public API. Reaching them through
# `wz_session_core` was never available — it re-exports `wire_const` and
# `WhatAmI`, not the codec modules — so the alternative to this line is not a
# tidier import, it is a second copy of the wire layout.
#
# Features named explicitly rather than left to unification — a subset build
# that happened not to unify `codec-join` on would otherwise fail for a reason
# that looks like the test's.
[dependencies.wz-codecs]
path = "../wz-codecs"
default-features = false
features = [
    "alloc",
    "codec-join",
    # R311y607 — the MID-census test builds one message per MID through that
    # MID's own codec, so the census is anchored to the codecs rather than to
    # nine hand-laid byte strings that would all have to be right.
    "codec-init-body",
    "codec-open-body",
    "codec-close",
    # R311y607 — same rule for the scouting fixtures: a SCOUT under test is
    # built by the SCOUT codec's own encode, so a walker that disagrees with the
    # codec fails rather than agreeing with a hand-laid byte string.
    "codec-scout",
    "codec-hello",
    # R311y613 — the NETWORK namespace, for `agg` and for the census that found
    # it missing.
    "codec-push",
    "codec-request",
    "codec-response",
    "codec-response-final",
    "codec-declare",
]
