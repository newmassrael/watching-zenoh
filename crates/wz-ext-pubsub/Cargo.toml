#
# wz-ext-pubsub — the rules of the advanced publisher and subscriber (atom 5.25), with no runtime
# in them.
#
# zenoh-ext is an extension protocol over zenoh's own pub/sub, query and liveliness. Its mechanism
# lived in `wz-runtime-tokio`, so an engine that is not the tokio one (the cooperative engine behind
# the pico C ABI) could not host it without linking that crate. What is not a runtime's is here: the
# `@adv` key grammar, the time-range grammar of a `_time` selector, the sample ring and the answer a
# cache gives out of it, and (as they move) the sequencing and miss rules, the recovery plan and the
# history merge. Nothing here reads a clock, spawns a task or holds a socket: time is an argument,
# and each engine is a host that drives the rules (docs/advanced-pubsub-on-a-neutral-core.md).
#
# `std`, not `no_std`: the advanced plane is a host-profile capability (it is not in the MCU
# profile), and the time-range grammar and the ring use `std::time` and `std::sync`.
#
# `rlib` only: a Rust-internal seam, like `wz-capi-port` and `wz-host-net`.

[package]
name = "wz-ext-pubsub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The rules of the advanced publisher and subscriber (the @adv key grammar, the _time selector, the sample cache), independent of any runtime."
publish = false

[lib]
name = "wz_ext_pubsub"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
# The advanced publisher's composite (`advanced_publisher`): the four declarations, what a put
# stamps and retains, the beacon. It stamps a source identity and a timestamp on every put, so it
# turns on the session-core setters for them and the node's HLC; a build without it pulls in
# neither, which is what keeps these features from reaching a runtime build that left them off
# (the runtime's own `pubsub-timestamp` and `pubsub-source-info` are the ones that decide there).
# The tokio runtime's `ext-pubsub-advanced-publisher` forwards here.
advanced-publisher = [
    "dep:wz-node-time",
    "wz-node-time/pubsub-timestamp",
    "wz-session-core/pubsub-put",
    "wz-session-core/pubsub-source-info",
    "wz-session-core/pubsub-timestamp",
]
# The advanced subscriber's rules (`advanced_subscriber`): its options and, as they move here, the
# per-source ordering machine. `advanced-recovery` adds the gap-recovery half (the reorder buffer, the
# `_sn` gets, the heartbeat and periodic triggers, the retention sweep) and `advanced-history` the
# startup and late-publisher history. The tokio runtime's `ext-pubsub-advanced-subscriber`,
# `-recovery` and `-history` forward here, and a build that leaves them off carries none of it.
advanced-subscriber = []
advanced-recovery = ["advanced-subscriber"]
advanced-history = ["advanced-recovery"]
# A cached sample may hold a buffer of shared memory and a recovery reply sends its descriptor
# again (`CachedSample::shared`). The tokio runtime's feature of the same name forwards here.
transport-shm = ["wz-session-core/transport-shm"]
# The publisher's QoS knobs (priority, congestion control, express) reach the publish options only
# where the setters exist; off, they are a documented no-op. The tokio runtime's feature forwards.
pubsub-qos = ["wz-session-core/pubsub-qos"]
# A put's encoding and attachment ride the wire publish only where their setters exist; the cache
# keeps them either way.
pubsub-encoding = ["wz-session-core/pubsub-encoding"]
pubsub-attachment = ["wz-session-core/pubsub-attachment"]
# The Zenoh serialization format, which a heartbeat beacon's sequence number is written in.
ext-pubsub-serde-codec = ["wz-session-core/ext-pubsub-serde-codec"]
# The heartbeat beacon: the publisher announces its last sequence number every period, so a
# subscriber can recover a lost last sample. Off, `MissDetectionConfig` is a documented no-op.
ext-pubsub-sample-miss-detection = ["ext-pubsub-serde-codec"]

[dependencies]
# The selector-parameter dialect, the outbound key-expression gate, the vocabulary of a reply
# (`ReplyOut`, `SourceInfo`, `QosLevel`) and the publish options the composite folds its knobs
# into. `alloc` is the heap profile, which is the only profile the advanced plane runs on. What the
# composite stamps with is the `advanced-publisher` feature's, above.
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["alloc"] }
# The node's time: the HLC an advanced publisher stamps from and the stamper it borrows it through.
wz-node-time = { path = "../wz-node-time", optional = true }
# A reply the cache could not stage is warned about and the answer goes on, as upstream's does.
log = "0.4"

[dev-dependencies]
# The responder a test drives the cache's answer through (`QueryResponder`, which stages replies
# the way a queryable's does) is the request codec's. `rx-shared-bytes` is what makes a range of a
# lent frame a second reference to it and not a copy, which the recovered-sample test measures.
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "alloc",
    "codec-request",
    "rx-shared-bytes",
] }

[lints]
workspace = true
