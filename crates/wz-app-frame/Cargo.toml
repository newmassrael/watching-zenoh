#
# wz-app-frame — the APPLICATION FRAME: the header an application writes in front of its payload,
# or in front of each piece of a message it splits over several samples, described as data by a
# profile. The CRC engine, the receiver's judgment of a stream of frames, the frame profile, the
# frames built and opened under it, the segment profile, and the writer of the pieces it describes.
#
# Its own crate so a session runtime and the C ABIs can build and judge such frames without
# linking the capture crate, which keeps the analysis planes above these modules and re-exports
# them at the paths it has always had (`wz_capture::e2e_crc` and the rest). Built on the core and
# never named by it (`scripts/lib/layer_direction_gate.py`).
#
# No third-party dependency, and `no_std`. The CRC engine and the judge need no allocator; the
# profiles read a JSON document and are behind `alloc`.
[package]
name = "wz-app-frame"
version.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Application frames of a wz node: CRC, judgment and the profiles that describe a header."

[lib]
name = "wz_app_frame"
path = "src/lib.rs"

[features]
default = ["alloc"]

# The profile, frame, segment-profile, segment-chain and segment-sender modules. Each reads a
# profile from the workspace's JSON reader (`wz_session_core::json5`, behind the core's own
# `alloc`) and holds its fields in a `Vec`; the reader of such documents and the message catalog's
# reader are `wz-app-schema`'s, behind its own `alloc`. Off, the crate is `e2e_crc`, `e2e_judge` and
# the catalog's static tables, which link no allocator.
#
# The receiver's table of senders (`e2e_receiver`) is the map the SCE algorithms
# `e2e_sender_slot` and `e2e_bind_sender` write in place (SCE ADR 0108), held on the heap as the
# receiver's streams are, so `alloc` turns on the map's `Heap` storage.
alloc = [
    "dep:wz-session-core",
    "wz-session-core/alloc",
    "wz-app-schema/alloc",
    "dep:sce-portable-bytes",
    "sce-portable-bytes/alloc",
]

# The type tables of a payload's schema and their two readers' common part (`proto_types`), the
# reader of the `FileDescriptorSet` `protoc` compiles a schema into (`proto_descriptor`), the typed
# reader of a payload (`proto_decode`), the one writer of the wire format (`proto_write`), and the
# nanopb options and integer ranges a writer may narrow by (`proto_nanopb`, `proto_range`): what a
# node that reads or writes a payload by its fields needs, and what the capture crate's schema
# documents, payload formats and value writer read, re-exported there at the paths they had. Off, a
# node that only frames its payloads links none of it. The tables are `wz-app-schema`'s,
# re-exported here; the readers and the writer of every sample are this crate's. The `.proto` text
# reader is `proto-text`'s.
proto = ["alloc"]

# The `.proto` text reader (`proto_lex`, `proto_parse`, `proto_schema`), and what reads a schema
# from text through it (`SchemaSet::read`, `LinkedSchema`, `decode_message`, `Keyer::new`). Off, a
# schema is read only from the `FileDescriptorSet` `protoc` compiled it into
# (`SchemaSet::from_descriptor_set`), and a node links no tokenizer, parser or linker. The analysis
# and capture builds read the text a person hands over and turn it on.
proto-text = ["proto", "wz-app-schema/proto-text"]

# `instance_key`: which instance of a message a sample is, read from fields of its payload through
# the schema reader, and the receiver's and the sender's streams and the last values kept per
# instance. Off, a node whose messages have one instance each links none of it.
instance-key = ["proto"]

# `message_payload`: one message of a `.proto` schema read at run time, its fields set and read by
# path and its protobuf bytes encoded and decoded: what a host program that knows its messages by name
# and its fields by path needs when no code is generated for them. The schema and the bytes are read
# by `proto`'s reader and typed reader, which this implies. Off, a node links none of it.
message-payload = ["proto"]

# `segment_profile::synthetic`: a synthetic segment profile and a builder of its pieces, for the
# tests of crates above this one. A `#[cfg(test)]` module cannot cross a crate boundary, so the
# capture crate turns this on for its own tests and forwards it from its `fixtures` feature.
fixtures = ["alloc"]

# `replay_admission`: whether a reply of a replay reaches the receiving judge (judged, a duplicate
# of its baseline, or a frame it has passed), and the CRC of each stream's baseline frame the
# receiver keeps for it; and `replay_pieces`, the pieces of a segmented message joined into the
# frames they cut. The replay cache's subscriber turns it on; off, a receiver keeps no CRC.
replay = ["alloc"]

[dependencies]
# Every build links it: the message catalog's static tables, which an image with no allocator links,
# are its, and its readers come in with `alloc`.
wz-app-schema = { path = "../wz-app-schema", default-features = false }
wz-session-core = { path = "../wz-session-core", default-features = false, optional = true }
# The map the generated slot algorithms of `e2e_receiver` take, which they name by its crate
# (`::sce_portable_bytes::BoundedMap`), so it is declared direct. Already in the graph through
# the core under `alloc`; SCE's own runtime, vendored with the generator.
sce-portable-bytes = { path = "../../vendor/sce/backends/rust/portable-bytes", default-features = false, optional = true }

[lints]
workspace = true
