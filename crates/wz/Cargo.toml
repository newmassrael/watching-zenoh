#
# wz — top-level facade crate for the watching-zenoh composable
# framework. Single user-facing anchor that exposes the full feature
# catalog defined in docs/feature_inventory.md (R301 catalog ratify).
#
# Layout per R302 design fork:
#   - 144 atomic features (19 domains, kebab-case <domain>-<capability>)
#   - 19 domain-aggregate features (union of each domain's atomic set)
#   - 6 preset features (v0.1.0 semver-named contracts, each = explicit
#     atomic list; no preset-extends-preset so a frozen v0.1.0 contract
#     stays stable under future catalog growth)
#
# Implication edges encode only "requires X" / "builds on X" pulled
# from the inventory reason field. Cargo features are monotone-
# additive — "mutually exclusive" relationships (platform-bare-metal vs
# platform-linux, runtime-no-std vs runtime-tokio) are policy checks
# deferred to a future `cargo wz-config inspect` tool, not encoded as
# rejects in Cargo.toml.
#
# default = [] (no-default). Composable-framework contract: the user
# explicitly opts into a preset (or hand-rolls atomic features). This
# differs from batteries-included crates like `tokio` that ship a
# default feature set, and matches kconfig / NixOS USE / Buildroot
# semantics where the user authors the config.
#
# R302a scope: facade Cargo.toml + empty lib.rs. No #[cfg(feature)]
# gates inserted anywhere yet — all features compile to no-ops. R302b+
# will start wiring real `#[cfg]` gates inside wz-runtime-tokio
# sources and exposing forwarded modules from wz/src/lib.rs.

[package]
name = "wz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "watching-zenoh top-level facade — composable Zenoh feature catalog with v0.1.0 preset contracts."

[lib]
name = "wz"
path = "src/lib.rs"

[lints]
workspace = true

# R302b — wz-runtime-tokio enters the facade as an OPTIONAL dependency
# with default-features = false. The forwarding rules below decide
# which wz-runtime-tokio features get enabled based on which wz
# features the consumer selects. Consumers who enable `runtime-tokio`
# pull the crate at all; consumers who additionally enable
# `liveliness-token` / `liveliness-subscriber` get the gated symbols
# inside wz-runtime-tokio. Other facade features stay no-op labels
# until their owning sub-crate enters the workspace in future R302c+
# rounds.
#
# R311a4 — facade gains wz-runtime-core + sce-rust-runtime + sce-rust-lua
# as optional deps so the `runtime-tokio` feature pulls every sub-crate
# wz-ap-demo previously named directly. The companion wz-ap-demo
# refactor collapses 6 direct deps to a single `wz = { features = …
# preset-ap-client … }`, making the facade the first user-visible
# composable-framework boundary backed by a real Linux + tokio binary.

[dependencies]
wz-runtime-tokio = { path = "../wz-runtime-tokio", optional = true, default-features = false }
# §5.26 REST -> zenoh HTTP/1.1 bridge (rest-http-bridge). AP-only; pulled only
# by the rest-http-bridge feature. It carries its own wz-runtime-tokio feature
# set; the facade also forwards them below so wz::runtime_tokio composes.
wz-rest = { path = "../wz-rest", optional = true }
# §5.27 api-compat-pico — the zenoh-pico-compatible C ABI (cdylib+rlib). It
# depends on wz-runtime-tokio directly (NOT the facade) to avoid a package
# cycle; the facade only re-exports it as `wz::capi_pico`.
wz-capi-pico = { path = "../wz-capi-pico", optional = true, default-features = false }
# R311y498 (§5.27 api-compat-c) — the zenoh-c-compatible C ABI, the sibling of
# wz-capi-pico over the same session model. Optional + gated exactly as its twin.
wz-capi-c = { path = "../wz-capi-c", optional = true, default-features = false }
wz-runtime-core = { path = "../wz-runtime-core", optional = true, default-features = false, features = ["alloc"] }
# R311ax — wz-runtime-coop enters the facade as an optional dep.
# The `runtime-coop` feature pulls this crate with its `alloc`
# feature on; lwIP's runtime-services-tier (CoopRuntime + CoopTime
# + sync::Mutex aliases) becomes available at `wz::runtime_coop::*`
# when the consumer opts in. Mutual exclusion with `runtime-tokio`
# is enforced via a compile_error! gate in `src/lib.rs`.
wz-runtime-coop = { path = "../wz-runtime-coop", optional = true, default-features = false }
# R311y28 — wz-runtime-freertos enters the facade as an optional dep,
# pulled in by the `platform-freertos` feature (the FreeRTOS cooperative
# single-task profile seams: FreertosClock over xTaskGetTickCount +
# FreertosAllocator over heap_4 + FreertosRuntime = CoopRuntime<FreertosClock>).
# Unlike wz-runtime-coop the runtime axis is orthogonal: this crate brings
# only the FreeRTOS-specific seams, the deploy composes it with `runtime-coop`.
# It is a cross-only no_std crate (freertos-sys + wz-runtime-coop); on host
# or cross-without-WZ_FREERTOS_CONFIG freertos-sys stubs, so a host build with
# the feature off never touches it.
wz-runtime-freertos = { path = "../wz-runtime-freertos", optional = true, default-features = false }
# R311y32 — wz-runtime-zephyr enters the facade as an optional dep, pulled in by
# the `platform-zephyr` feature (the Zephyr cooperative single-task profile
# seams: ZephyrClock over sys_clock_tick_get + ZephyrAllocator over k_malloc +
# ZephyrRuntime = CoopRuntime<ZephyrClock>). Identical shape to
# wz-runtime-freertos: the runtime axis stays orthogonal (the deploy composes it
# with `runtime-coop`), and it is a cross-only no_std crate (zephyr-sys is pure
# extern decls resolved at the Zephyr image link, so a host build with the
# feature off never needs the kernel symbols).
wz-runtime-zephyr = { path = "../wz-runtime-zephyr", optional = true, default-features = false }
# R311az-3a — wz-link-lwip enters the facade as an optional dep
# pulled in by the `runtime-coop` feature. The link tier (§5.C) is
# coupled to the runtime profile in the wz architecture: `runtime-coop`
# on means "MCU profile = CoopRuntime + lwIP-based link". wz-link-lwip
# has a `#![cfg(not(target_os = "none"))]` crate-level gate so cross-
# compile to bare-metal targets sees an empty crate (the lwip-sys C
# build is host-only at R311az-1; R311az-3b extends it to accept
# deploy-supplied lwipopts.h for cross-compile).
wz-link-lwip = { path = "../wz-link-lwip", optional = true, default-features = false }
# Stage 4b — the MCU session shell (tier-clean integration of
# wz-runtime-coop + wz-link-lwip + wz-session-core). Optional, pulled by
# the `session-lwip` feature. Like wz-link-lwip it carries a crate-level
# `#![cfg(lwip_real_build)]` gate, so the `wz::session_lwip` re-export is
# populated on exactly the same condition (host / WZ_LWIP_PORT-cross).
wz-session-lwip = { path = "../wz-session-lwip", optional = true, default-features = false }
# R311az-3b-ii — direct optional dep on lwip-sys so the facade's
# build.rs receives `DEP_LWIP_LWIP_REAL_BUILD` (re-exposed via lwIP-sys's
# `links = "lwip"` metadata). This lets the facade emit a
# `lwip_real_build` cfg in lockstep with wz-link-lwip, keeping the
# `wz::link_lwip` namespace re-export gated on the same condition as
# the underlying crate body. Without this direct edge the metadata
# would propagate to wz-link-lwip only (siblings don't share the env
# var), and the facade would have to re-derive the WZ_LWIP_PORT +
# TARGET logic — a second source of truth, anti-pattern.
lwip-sys = { path = "../lwip-sys", optional = true }
sce-rust-runtime = { path = "../../vendor/sce/backends/rust/runtime", optional = true }
# R311il — sce-rust-lua removed: no wz statechart is Lua-bound any more
# (the session FSM went engine-free), so the facade pulls no Lua engine.

# ============================================================
# [features] — 169 entries per R301 catalog
# ============================================================

[features]
default = []

# ----- domain: access (6 atomic) -----
# acl / downsampling / quota forward to the wz-runtime-tokio interceptor knobs.
# extauth-usrpwd forwards the §5.16 usrpwd auth method (HMAC-SHA3-256). The `?`
# forward is a no-op until a runtime is selected, like every other facade
# forward. extauth-jwt = a zenoh PHANTOM (no transport JWT method exists) and
# extauth-pubkey (RSA) stay reserved until built.
access-acl = ["wz-runtime-tokio?/access-acl"]
access-downsampling = ["wz-runtime-tokio?/access-downsampling"]
access-extauth-jwt = ["session-extauth"]
access-extauth-pubkey = ["session-extauth", "wz-runtime-tokio?/access-extauth-pubkey"]
access-extauth-usrpwd = ["session-extauth", "wz-runtime-tokio?/access-extauth-usrpwd"]
access-quota = ["wz-runtime-tokio?/access-quota"]

# ----- domain: attachment (2 atomic) -----
# attachment-bytes: the attachment-ext codec primitive (wz-session-core
# `attachment` SSOT module). Selected by pubsub-attachment /
# query-attachment; forwards to wz-runtime-tokio when that runtime is in
# the build. attachment-encoding-aware (tag-typed attachment view) stays
# reserved — genuinely unimplemented, builds on attachment-bytes.
attachment-bytes = ["wz-runtime-tokio?/attachment-bytes"]
attachment-encoding-aware = ["attachment-bytes"]

# ----- domain: codec (14 atomic, all active) -----
# R311a-recanon collapsed codec-{init,open}-{syn,ack} 4 entries into 2
# codec-{init,open}-body entries (single SCXML emit unit per body,
# Footprint test honour). R311a4 propagated the reshape from
# docs/feature_inventory.md to this Cargo.toml + the 6 preset
# definitions + domain-codec aggregate below.
#
# R311a4 — codec-init-body / codec-open-body forward into wz-runtime-
# tokio via cargo `?` syntax (forward only when runtime-tokio is also
# active). Same pattern as R307/R309 query + declare domain forwards.
# Each gate elides the matching SCXML codegen + InboundFrame variant +
# session_glue parse/handle path; quantitative footprint delta is
# measured against the wz-ap-demo binary in the R311a4 audit entry.
codec-close = ["wz-runtime-tokio?/codec-close", "wz-runtime-coop?/codec-close"]
# R311i — codec-declare forwards wz-runtime-tokio (pulls
# wz-codecs/codec-declare + codec-frame imply). Feature-off elides
# the wz-runtime-tokio Declare wire surface + the 9 declare-family
# wz-codecs modules. Consumer module (declare/, pubsub.rs
# absorb_declare) stays compiled — R311m cascade for the consumer
# side.
codec-declare = ["wz-runtime-tokio?/codec-declare"]
codec-fragment = ["transport-fragmentation", "wz-runtime-tokio?/codec-fragment"]
# R311g — codec-frame forwards into wz-runtime-tokio gating the Frame
# envelope inbound decode path (`InboundFrame::Frame` variant +
# `parse_inbound` `T_MID_FRAME` arm + `parse_frame_payload` +
# downstream Frame match arms). Outbound `encode_frame_with_<body>`
# helpers stay always-on at R311g; R311h..R311k body-codec cascades
# (codec-push / codec-declare / codec-request / codec-response) will
# gate the outbound side AND add `codec-<body> = ["codec-frame"]`
# implications so codec-frame OFF becomes a coherent handshake-only
# deploy (Init / Open / Close + KeepAlive) once those land. Honest
# semantics for the R311g interim state and the eventual closure are
# spelled out in the wz-runtime-tokio + wz-codecs codec-frame comment
# blocks and the §5.12 codec atomic caveat.
codec-frame = ["wz-runtime-tokio?/codec-frame", "wz-runtime-coop?/codec-frame"]
codec-hello = ["wz-runtime-tokio?/codec-hello"]
codec-init-body = ["wz-runtime-tokio?/codec-init-body", "wz-runtime-coop?/codec-init-body"]
codec-join = ["session-multicast", "wz-runtime-tokio?/codec-join"]
# R311b — codec-keep-alive forwards to wz-runtime-tokio (and through
# it to wz-codecs); elision drops the peer-driven lease refresh path
# along with the wire-mid 0x04 decoder. See §5.12 codec atomic caveat.
codec-keep-alive = ["wz-runtime-tokio?/codec-keep-alive", "wz-runtime-coop?/codec-keep-alive"]
codec-open-body = ["wz-runtime-tokio?/codec-open-body", "wz-runtime-coop?/codec-open-body"]
# R311h — codec-push forwards wz-runtime-tokio (which pulls
# wz-codecs/codec-push + codec-frame imply). Feature-off elides the
# Push wire emit + parse + 6 send_push_* methods + 8 build_push_*
# helpers + Push enum variant + pubsub.rs module entirely (pub mod
# pubsub at lib.rs is codec-push-gated because dispatch_push references
# the Push type directly). Honest semantics: feature-off = no pub/sub
# data carrier on the wire AND no in-process pubsub registry.
# R311mc — codec-push / codec-response / codec-response-final additionally
# weak-forward to wz-session-lwip: the MCU multicast TX seam frames these body
# codecs through multicast_tx_emit, so a session-lwip publishing node needs them
# cfg-in on the MCU crate too (the AP wz-runtime-tokio?/ forward alone left the
# MCU loop's TX arms cfg-out).
codec-push = ["wz-runtime-tokio?/codec-push", "wz-session-lwip?/codec-push"]
# R311j — codec-request forwards wz-runtime-tokio.
codec-request = ["wz-runtime-tokio?/codec-request"]
# R311k — codec-response forwards wz-runtime-tokio. After R311k all 4
# body codecs imply codec-frame so codec-frame OFF requires every body
# codec OFF (handshake-only deploy: Init / Open / Close + KeepAlive).
codec-response = ["wz-runtime-tokio?/codec-response", "wz-session-lwip?/codec-response"]
codec-response-final = ["wz-runtime-tokio?/codec-response-final", "wz-session-lwip?/codec-response-final"]
codec-scout = ["wz-runtime-tokio?/codec-scout"]

# ----- domain: declare (7 atomic, all active) -----
# R309 — 7 declare-domain features forwarded into wz-runtime-tokio via
# cargo `?` syntax (forward only when runtime-tokio is active). Each
# gates the matching `SessionLinkActions::send_*` wire-emit method in
# session_glue.rs. `declare-keyexpr = ["keyexpr-mapping", …]` keeps
# the pre-R309 facade-internal implication so the keyexpr aliasing
# subsystem stays coherent (mapping_id -> suffix table membership).
declare-final = ["wz-runtime-tokio?/declare-final"]
declare-interest = ["wz-runtime-tokio?/declare-interest"]
declare-keyexpr = ["keyexpr-mapping", "wz-runtime-tokio?/declare-keyexpr"]
declare-queryable = ["wz-runtime-tokio?/declare-queryable"]
declare-subscriber = ["wz-runtime-tokio?/declare-subscriber"]
declare-token = ["wz-runtime-tokio?/declare-token"]
declare-undeclare = ["wz-runtime-tokio?/declare-undeclare"]

# ----- domain: encoding (7 atomic, 0 active / 7 reserved) -----
# R311cg — audit-only ratify. Encoding in wz is the wire-level
# `Encoding { packed_id, schema_len, schema }` triplet (zenoh-pico
# `_z_encoding_t` mirror), where schema is a free-form application
# MIME-like string. There is no per-encoding source dispatch: a
# subscriber receiving "application/json" or "text/utf-8" handles the
# bytes itself. Cfg-gating each encoding name would create dead-code
# stubs, not elision. All 7 features stay declaration-only. The prior
# comment "3 active / 4 reserved" was a forward-looking estimate.
encoding-bytes = []
encoding-cbor = []
encoding-empty = []
encoding-json = []
encoding-mime = []
encoding-protobuf = []
encoding-utf8 = []

# ----- domain: keyexpr (8 atomic; 4 active toggles / 4 foundational) -----
# R311jf — the matching capabilities now carry real per-site cfg gates
# in wz-session-core::keyexpr_match (replacing the R311cf/fd "cluster-
# wide, no anchor" carry). Four are user-excludable composition toggles
# that forward through the active runtime to the matcher gate; omitting
# one (e.g. a literal-only MCU preset) strips the corresponding branch.
keyexpr-wildcard-single = [
    "wz-runtime-tokio?/keyexpr-wildcard-single",
    "wz-runtime-coop?/keyexpr-wildcard-single",
]
keyexpr-wildcard-double = [
    "wz-runtime-tokio?/keyexpr-wildcard-double",
    "wz-runtime-coop?/keyexpr-wildcard-double",
]
keyexpr-dollar-star = [
    "wz-runtime-tokio?/keyexpr-dollar-star",
    "wz-runtime-coop?/keyexpr-dollar-star",
]
keyexpr-includes = [
    "wz-runtime-tokio?/keyexpr-includes",
    "wz-runtime-coop?/keyexpr-includes",
]
# FOUNDATIONAL (always-on, not user-flippable): every consumer needs
# them, so they ship ungated and are retained here only as no-op
# compatibility markers so presets / domain-keyexpr / forwards keep
# resolving.
#   keyexpr-canon    — structural canonicalize; R311fd phantom-gate fix.
#   keyexpr-literal  — exact byte chunk compare, the irreducible base.
#   keyexpr-mapping  — wire keyexpr-id resolution (wireexpr_resolve);
#                      every inbound declare/query/reply path needs it.
#   keyexpr-intersect — pattern∩pattern; the always-compiled subscriber
#                      / queryable `has_matching` calls it unconditionally
#                      (its wildcard sub-branches are gated by the four
#                      toggles above, so intersect-with-wildcards-off
#                      degrades to literal-set intersection).
keyexpr-canon = ["wz-runtime-tokio?/keyexpr-canon"]
keyexpr-intersect = []
keyexpr-literal = []
keyexpr-mapping = []

# ----- domain: link (5 atomic, 0 active / 3 FOUNDATIONAL-reserved / 2 deprecated; R311y0) -----
# R311ci — audit-only ratify. link-* features overlap conceptually
# with transport-* (transport-batching, transport-fragmentation
# already gate the actual behavior in wz-runtime-tokio). R311y0 A3 audit:
# frame/fragment/batching are FOUNDATIONAL (delivered by the always-on Frame
# core / the active transport-fragmentation / the active transport-batching);
# flow-control + tx-cache are zenoh phantoms (no link flow-control, no tx
# retransmit) -> deprecated. No genuine link-opt-in build remained.
# Cargo-dep asymmetry is intentional: link-fragment / link-batching FORWARD
# to their active transport-* sibling features, but link-frame stays `[]`
# because the Frame envelope is unconditional transport CORE -- there is no
# `transport-frame` feature to compose (nothing to gate or forward to).
link-batching = ["transport-batching"]
link-flow-control = []
link-fragment = ["transport-fragmentation"]
link-frame = []
link-tx-cache = []

# ----- domain: liveliness (5 atomic, 4 active / 1 FOUNDATIONAL-reserved; R311xy) -----
# liveliness-get — requester-side snapshot get. Source-gated (forwards
# into wz-runtime-tokio iff runtime-tokio is active, cargo's `?` syntax),
# mirror of liveliness-subscriber / liveliness-token. NOT `query-get`:
# the prior `= ["query-get"]` mis-modeled the wire as the Request/Query
# plane, but zenoh implements `liveliness().get()` on the declaration
# plane (a CURRENT liveliness Interest -> interest_id-tagged
# Declare(DeclToken) replies -> Declare(DeclFinal)), so pulling
# query-get / codec-request was both dead weight and interop-wrong. The
# reply-delivery surface reuses the un-gated reply_sink::ReplySink seam.
liveliness-get = ["wz-runtime-tokio?/liveliness-get"]
liveliness-historical-samples = ["liveliness-history"]
# R311xy — liveliness-history is now a real cfg gate (the subscriber-side
# CURRENT-state-replay request), forwarded into the runtime crate; was a
# no-op `= []` facade. liveliness-historical-samples stays FOUNDATIONAL
# (the responder current-token replay is shared with the active
# liveliness-get path) and just composes the request prerequisite here.
liveliness-history = ["wz-runtime-tokio?/liveliness-history"]
# R302b — first source-gated atomic features. Forward into
# wz-runtime-tokio iff the runtime-tokio feature is also enabled
# (cargo's `?` syntax: forward only if the optional crate is active).
liveliness-subscriber = ["wz-runtime-tokio?/liveliness-subscriber"]
# R311mc — liveliness-token additionally weak-forwards to wz-session-lwip: the
# MCU multicast loop's DeclareReplySink (MulticastReplyQueue) auto-replies to an
# inbound liveliness Interest over the group, gated on this same-named feature.
liveliness-token = ["wz-runtime-tokio?/liveliness-token", "wz-session-lwip?/liveliness-token"]

# ----- domain: locator (9 atomic, 0 active / 9 reserved) -----
# R311ce — audit-only ratify. Locator URI parser (scheme://host:port)
# is not yet implemented in wz-runtime-tokio; all 9 features stay
# declaration-only at the wz facade level. Imply edges to
# transport-link-* preserved for the future cascade (when the URI
# parser lands, locator-tcp will auto-enable transport-link-tcp etc).
# The prior comment "3 active / 6 reserved" was a forward-looking
# estimate; corrected to "0 active / 9 reserved" per R311ce audit.
locator-iface = ["wz-runtime-tokio?/locator-iface"]
locator-quic = ["transport-link-quic"]
locator-serial = ["transport-link-serial"]
locator-tcp = ["transport-link-tcp"]
locator-tls = ["transport-link-tls"]
locator-udp = ["transport-link-udp"]
locator-unixsock = ["transport-link-unixsock"]
locator-vsock = ["transport-link-vsock"]
locator-ws = ["transport-link-ws"]

# ----- domain: platform (7 atomic, 1 active / 6 reserved) -----
# R311ch — audit-only ratify. Platform identity flows through Rust's
# `target_os` cfg axis (a Cargo `[target.'cfg(target_os = "linux")']`
# dep is the standard mechanism), not through Cargo `[features]`.
# Most `platform-*` features are presentation-layer labels for preset
# compositions (e.g. preset-cortex-m4-default pulls platform-bare-metal);
# cfg-gating those would duplicate what `target_os` already handles.
#
# R311y28 EXCEPTION — `platform-freertos` is the ONE platform-* that gates
# real code, because `target_os` CANNOT distinguish it: a bare-metal deploy
# and a FreeRTOS deploy are BOTH `target_os = "none"` on thumbv7m-none-eabi.
# The RTOS is an opt-in selected by the runtime+link adapter, not the target
# triple, so it is a genuine cfg(feature) knob (the cooperative single-task
# profile re-export `wz::runtime_freertos` in src/lib.rs). The other six stay
# 0-cfg-site labels (linux/macos/windows = target_os-routed; bare-metal =
# target-triple+no_std-selected, FOUNDATIONAL; zephyr/qnx = deferred).
platform-bare-metal = []
platform-freertos = ["dep:wz-runtime-freertos"]
platform-linux = []
platform-macos = []
platform-qnx = []
platform-windows = []
platform-zephyr = ["dep:wz-runtime-zephyr"]

# ----- domain: pubsub (12 atomic, 8 active / 4 FOUNDATIONAL-reserved) -----
# R311y314 — was "11 atomic, 10 active / 1 reserved", the pre-R311y307 count.
# y307 merged priority/congestion-control/express into pubsub-qos and demoted the
# three to FOUNDATIONAL-reserved aliases, so 12 = 8 active + 4 reserved (the 3
# aliases + the pubsub-sample anchor). The body below already described the merge;
# only this header still stated the count it dissolved.
# R311cc — active features forward to wz-runtime-tokio (-put/-delete
# msg body variants, -allow-loop loopback, -attachment / -timestamp /
# -encoding / -source-info Sample optional field populators, -qos the
# packed QoS-byte ext). R311y307 — -priority / -congestion-control /
# -express are now ALIASES composing `pubsub-qos` (the three sub-fields
# share one packed byte and one ext, so they carry no own cfg site);
# they stay declared as catalog atoms (reserved + FOUNDATIONAL) and their
# runtime knobs survive as the `pubsub-qos`-gated per-field setters.
# 1 reserved (-sample) stays declaration-only.
pubsub-allow-loop = ["wz-runtime-tokio?/pubsub-allow-loop"]
pubsub-attachment = ["attachment-bytes", "wz-runtime-tokio?/pubsub-attachment"]
pubsub-congestion-control = ["pubsub-qos", "wz-runtime-tokio?/pubsub-congestion-control"]
pubsub-delete = ["wz-runtime-tokio?/pubsub-delete"]
pubsub-encoding = ["wz-runtime-tokio?/pubsub-encoding"]
pubsub-express = ["pubsub-qos", "wz-runtime-tokio?/pubsub-express"]
# R311y506 — `session-extqos` DROPPED from this alias. It rode here as what the
# prior comment itself called "a pre-y307 asymmetry among the three siblings,
# unrelated to the merge", tolerable only while `session-extqos` was a no-op
# `= []` facade. Now that it is a real forward it would pull `transport-qos` ->
# `alloc` into every `pubsub-priority` consumer, and `preset-cortex-m4-default`
# is one — a no-alloc MCU preset would silently acquire the heap-sized
# per-priority conduit arrays. The two are different layers anyway:
# `pubsub-priority` is the PUBSUB-message priority field, `session-extqos` is the
# TRANSPORT establishment band. A deploy that wants both names them both.
pubsub-priority = ["pubsub-qos", "wz-runtime-tokio?/pubsub-priority"]
pubsub-put = ["wz-runtime-tokio?/pubsub-put"]
pubsub-qos = ["wz-runtime-tokio?/pubsub-qos"]
pubsub-sample = []
pubsub-source-info = ["wz-runtime-tokio?/pubsub-source-info"]
pubsub-timestamp = ["wz-runtime-tokio?/pubsub-timestamp"]

# R311gi gc-2c — statechart switchboard facade forward (the AP dynamic
# keyexpr -> SCXML domain-event inbound adapter; ⇒ codec-push).
switchboard = ["wz-runtime-tokio?/switchboard"]

# ----- domain: query (10 atomic, 10 active / 0 reserved) -----
# R311cj — query-attachment + -selector-parameters + -reply-err wire-up.
# query-source-info is a full send+receive vertical (R311ia receive: the
# queryable-side QueryView::source_info projection of the inbound Query
# body source-info ext, id 0x01 ENC_ZBUF, shared codec with the Push
# path; R311ib send: QueryOptions::with_source_info stamps it on the
# outbound Query body ext-chain).
# R307 — the query-domain atomic features forward into
# `wz-runtime-tokio` (cargo `?` syntax: only when runtime-tokio is
# also active). Internal implication edges live in
# `wz-runtime-tokio/Cargo.toml::[features]` (e.g. `query-get =
# ["query-reply"]`); the facade does not re-declare them so a future
# alternative runtime can implement its own dependency shape without
# the facade pre-committing to tokio-side semantics. The R307
# comment that listed query-reply-err / query-selector-parameters /
# query-attachment as "reserved" was superseded by R311cj (which wired
# all three); the attachment composability round additionally selects
# attachment-bytes so query-attachment gates a real attachment-ext
# encode/decode vertical, not a bare label.
query-attachment = ["attachment-bytes", "wz-runtime-tokio?/query-attachment"]
query-consolidation = ["wz-runtime-tokio?/query-consolidation"]
query-get = ["wz-runtime-tokio?/query-get"]
# R311mc — query-queryable additionally weak-forwards to wz-session-lwip: the
# MCU multicast loop's ResponseSink (MulticastReplyQueue) auto-replies to an
# inbound Query over the group, gated on this same-named registry feature.
query-queryable = ["wz-runtime-tokio?/query-queryable", "wz-session-lwip?/query-queryable"]
query-reply = ["wz-runtime-tokio?/query-reply"]
query-reply-err = ["wz-runtime-tokio?/query-reply-err"]
query-selector-parameters = ["wz-runtime-tokio?/query-selector-parameters"]
query-source-info = ["wz-runtime-tokio?/query-source-info"]
query-target = ["wz-runtime-tokio?/query-target"]
query-timeout = ["wz-runtime-tokio?/query-timeout"]
# R311y315 — the facade forward R311y248 never added. query-value existed in
# wz-session-core and wz-runtime-tokio (and in the latter's default) but was
# unreachable from the `wz` facade, so the atom was not composable from the
# top-level crate and domain-query could not name it. The missing forward is
# the ROOT CAUSE of the stale "10 query atoms" census, not a symptom of it.
query-value = ["wz-runtime-tokio?/query-value"]

# ----- domain: routing (6 atomic, 0 active / 6 reserved) -----
# R311ci — audit-only ratify. wz-runtime-tokio is unicast client-only;
# routing/peer/router mode dispatch + routes table + failover are
# future cascades. "1 active / 5 reserved" estimate corrected to 0/6.
routing-client = []
routing-failover = ["routing-router"]
# R311qg — routing-peer atom 1 now composes REAL library code (the dial+accept
# mesh-node foundation, `peer_loop`), no longer a hollow marker: it forwards the
# wz-runtime-tokio `routing-peer` atom on top of the `routing-router`
# accept-and-hold foundation it reuses. `?/` activates only on the AP path
# (runtime-tokio profile pulls wz-runtime-tokio). Hold-only; mesh forwarding +
# zid dedup is a later atom (so this does NOT pull `routing-routes`).
routing-peer = ["routing-router", "wz-runtime-tokio?/routing-peer"]
# R311qa — routing-router now composes REAL library code: it forwards the
# wz-runtime-tokio `routing-accept` atom (the multi-peer `accept_loop` foundation)
# and pulls its transport prerequisites, so selecting `routing-router` cannot leave
# the code it names un-gated (the marker is no longer a no-op). `?/` activates only
# when the runtime-tokio profile already pulls wz-runtime-tokio (the AP path).
routing-router = ["transport-link-tcp", "transport-unicast", "wz-runtime-tokio?/routing-accept"]
# R311qc — routing-routes now composes REAL library code (the data-plane
# forwarding kernel + the tokio RoutingForwarder), no longer a hollow marker:
# it forwards the wz-runtime-tokio `routing-routes` atom on top of the
# `routing-router` accept-and-hold foundation. `?/` activates only on the AP
# path (runtime-tokio profile pulls wz-runtime-tokio).
routing-routes = ["routing-router", "wz-runtime-tokio?/routing-routes"]
routing-static-routes = ["routing-router"]
# P4 §5.21 — routing-router-hat forwards the wz-runtime-tokio `routing-router-hat`
# atom (the dual-mesh RouterForwarder, the zenoh hat/router port) on top of the
# `routing-peer` mesh-node foundation it reuses (peer_loop, the shared
# link-state graph, per-port zid derivation). `?/` activates only on the AP path
# (runtime-tokio profile pulls wz-runtime-tokio). This is the FOUNDATION build
# feature (the routing-accept precedent) — it compiles the RouterForwarder library
# module; the `router-hat-router` atom (below) is the run-mode toggle layered on it.
routing-router-hat = ["routing-peer", "wz-runtime-tokio?/routing-router-hat"]

# ----- domain: runtime (6 atomic, 2 active / 4 reserved) -----
runtime-async-std = []
# R311ax — runtime-coop activates: pulls wz-runtime-coop + wz-runtime-
# core (alloc-on) so a consumer enabling `runtime-coop` gets the
# §5.P MCU profile end-to-end (CoopRuntime + CoopTime + sync::Mutex
# aliases). Mutual exclusion with `runtime-tokio` is enforced in
# `src/lib.rs` via `compile_error!` — the catalog cannot express
# mutex relations directly, but cfg(all(...)) attribute fires at
# build time if both runtimes are co-enabled. The check fails the
# build with a clear "pick one runtime per deploy" message rather
# than silently building a bin that links both runtimes.
runtime-coop = [
    "dep:wz-runtime-coop",
    "dep:wz-runtime-core",
    "wz-runtime-coop/alloc",
    # R311az-3a / R311az-3b-ii — runtime-coop pulls the §5.C link tier
    # sibling. The MCU profile bundles runtime + link as a pair:
    # `CoopRuntime` (task pool + cooperative poll) + `LwipUdpSocket`
    # (lwIP raw UDP + heapless mpsc bridge). cross-compile sees an
    # empty wz-link-lwip via its crate-level `#![cfg(lwip_real_build)]`
    # gate until WZ_LWIP_PORT is set (R311az-3b deploy-supplied
    # lwipopts.h) — at which point both wz-link-lwip and the
    # `wz::link_lwip` re-export light up together.
    "dep:wz-link-lwip",
    # R311az-3b-ii — direct lwip-sys edge so the facade build.rs
    # receives `DEP_LWIP_LWIP_REAL_BUILD` and emits `lwip_real_build`
    # in lockstep with wz-link-lwip.
    "dep:lwip-sys",
]
# Stage 4b — the MCU session shell. Pulls `runtime-coop` (the §5.P
# runtime + §5.C link pair + the lwip-sys edge that drives lwip_real_build)
# and the wz-session-lwip integration crate binding them to the session
# SSOT. `wz::session_lwip::{run_session, SessionRole, LwipUdpDriver}` light
# up together with the lwip_real_build cfg, exactly like the link_lwip
# re-export. The MCU live-session consumer the R311ir carry awaited.
session-lwip = [
    "runtime-coop",
    "dep:wz-session-lwip",
]
# Transport reassembly (Tier B) — the composable-framework atomic feature
# that threads the `ReassemblyDispatcher` ingest + sweep into whichever
# runtime drive loop is active. Weak-forwards (`?/`) so it only lights up
# for the runtime the build already selected: the MCU session loop
# (wz-session-lwip -> wz-runtime-coop -> wz-session-core) or the AP tokio
# loop (wz-runtime-tokio). Off by default: a deploy that never receives a
# `T_MID_FRAGMENT` compiles the reassembly slot pool out entirely.
reassembly = [
    "wz-session-lwip?/reassembly",
    "wz-runtime-coop?/reassembly",
    "wz-runtime-tokio?/reassembly",
]

# Slim session-rx buffer-pool profile — the composable-framework atomic
# feature that selects the constrained nrf51-class session-rx pool dims
# (session_rx_pool_mcu_minimal.scxml, 4 x 256 ~= 1 KB) over the default
# full-rate 16 x 1536 (~24.6 KB). Weak-forwards (`?/`) to the §5.C link
# tier (and the session shell that re-exports its SessionRxSocket alias) so
# it only lights up for an lwIP-profile build. Bundled by
# `preset-cortex-m0-minimal`; the derivation + the deliberate sub-MTU trade
# live in the scxml header. NOTE: 2-profile additive toggle (default vs
# slim); a 3rd size profile would need mutual exclusion (documented carry).
buffer-pool-session-rx-slim = [
    "wz-link-lwip?/buffer-pool-session-rx-slim",
    "wz-session-lwip?/buffer-pool-session-rx-slim",
]
# R311y190 — loopback multicast egress routing (the §5.C link seam
# `route_multicast_over_loopback`). Weak-forwards (`?/`) to the link tier + the
# session shell so it only lights up for an lwIP-profile build. Pair with a
# testmode lwIP port (`port/cross-test-mcast`) so an MCU multicast node runs a
# real on-target IGMP-join + multicast-loopback roundtrip via config.
loopif-multicast = [
    "wz-link-lwip?/loopif-multicast",
    "wz-session-lwip?/loopif-multicast",
]
runtime-no-std = []
# R302b — runtime-tokio pulls the wz-runtime-tokio crate into the
# build via `dep:` syntax. Bare `runtime-tokio` with no sub-feature
# forwards (no liveliness-* etc.) leaves wz-runtime-tokio compiled
# with --no-default-features.
#
# R311a4 — runtime-tokio also pulls wz-runtime-core (TimeSource +
# Allocator + RuntimeError trait surface, alloc-on by default since tokio
# implies std at the linker level) and sce-rust-runtime (the statechart
# `Engine` / `StatePolicy` host that drives the engine-free FSMs). This
# collapses wz-ap-demo's direct sub-crate deps to a single
# `wz = { features = preset-ap-client }`, making the facade the first
# user-visible composable-framework boundary backed by a real Linux +
# tokio binary.
#
# R311il — `sce-rust-lua` dropped from this set: with the session FSM
# engine-free (the last Lua-bound statechart), no wz statechart needs a
# script engine, so the facade no longer forces a Lua VM into AP builds.
runtime-tokio = [
    "dep:wz-runtime-tokio",
    "dep:wz-runtime-core",
    "dep:sce-rust-runtime",
]
runtime-tokio-uring = ["runtime-tokio"]
# R311y589 — no longer `[]`. Weak-forwards to the tokio host's pooled
# reassembly arena, which is the first consumer any `sce:kind="buffer-pool"`
# emit has had. Weak (`?/`) like its `reassembly` neighbour so selecting it in a
# preset does not drag the tokio runtime into a build that did not ask for one.
runtime-zero-copy = ["wz-runtime-tokio?/runtime-zero-copy"]

# ----- domain: scouting (6 atomic) -----
# R311ci — audit-only ratify. R311if — scouting-static wired (forwards
# the wz-session-core `scout_static` synth via the optional tokio
# runtime). The remaining three stay declaration-only (no runtime
# counterpart yet).
#
# R311y428 — scouting-active is now FORWARDED; this is the "future
# cascade" the R311en note in wz-runtime-tokio anticipated, and until it
# landed the facade key was declaration-only: a consumer that enabled
# `wz/scouting-active` got the marker and NONE of the scouting code, so
# the multicast FSM was unreachable through the facade (the only way in
# was a direct wz-runtime-tokio dep, which no facade consumer has).
# AP-only, so a single optional-dep forward mirrors `session-extauth`:
# wz-runtime-coop's scouting surface is `scouting-static` alone (it has
# no `scouting-active` key to forward to, and adding one would claim an
# MCU active-scouting path that does not exist). The runtime key implies
# transport-link-udp + codec-scout + codec-hello, so enabling this pulls
# the multicast scouting link and both body codecs with it — which is
# why `scouting-multicast` (FOUNDATIONAL, "always-on under
# scouting-active") needs no separate edge here.
scouting-active = ["wz-runtime-tokio?/scouting-active"]
# R311y846 — the ANSWERING half (`scouting_responder`), forwarded the same way
# and kept SEPARATE from `scouting-active` for the reason its module comment
# gives: discovering and being discoverable are opposite directions, and a deploy
# routinely wants one alone.
scouting-responder = ["wz-runtime-tokio?/scouting-responder"]
scouting-autoconnect = []
scouting-gossip = ["routing-router"]
scouting-multicast = ["transport-link-udp"]
scouting-passive = []
# R311ih — scouting-static wired on BOTH profiles via the uniform
# facade -> runtime -> core funnel: the AP runtime (wz-runtime-tokio) and
# the MCU runtime (wz-runtime-coop) each forward to
# wz-session-core/scouting-static (the runtime-agnostic `scout_static`
# synth). The synth is no-alloc-capable (bounded seam), so the MCU forward
# needs no alloc; whichever runtime the preset selects pulls the synth.
scouting-static = [
    "wz-runtime-tokio?/scouting-static",
    "wz-runtime-coop?/scouting-static",
]

# ----- domain: session (10 atomic) -----
# session-extauth forwards the §5.4 Z_EXT_AUTH establishment-ext codec into
# the AP runtime (R1 = codec layer; dispatch + usrpwd/pubkey methods follow).
# AP-only: no wz-runtime-coop forward (zenoh-pico has no auth).
session-extauth = ["wz-runtime-tokio?/session-extauth"]
session-extcompression = ["transport-compression", "wz-runtime-tokio?/session-extcompression"]
# session-extqos (R311y506) — the z64 `init::ext::QoSLink` half of zenoh's dual
# QoS establishment ext: the link's priority-range + reliability metadata and
# the directional containment that negotiates it. Was a no-op `= []` facade
# (reserved / 0 cfg sites); now a real forward. Pulls `transport-qos`, the QoS
# transport the band refines (zenoh emits `QoSLink` only from its `State::QoS`
# arm).
session-extqos = ["transport-qos", "wz-runtime-tokio?/session-extqos"]
session-extshm = ["transport-shm", "wz-runtime-tokio?/session-extshm"]
session-multicast = []
# A4 (R311jr/js) — session-reconnect: declaration cache + reset/replay
# (wz-session-core, via the runtime forward) + the AP re-dial +
# re-handshake supervisor (wz-runtime-tokio::reconnect). zenoh-pico
# Z_FEATURE_AUTO_RECONNECT parity; pico defaults it ON, so the AP presets
# carry it. AP-only for now — the lwIP Rc link sink is !Send, so the MCU
# swap seam is a follow-up (same staging as MCU TX fragmentation); no
# `wz-runtime-coop?/` forward until it lands.
session-reconnect = ["wz-runtime-tokio?/session-reconnect"]
# R311kh — session-matching: matching-listener watch machinery
# (wz-session-core declare::matching, via the runtime forward) + the
# Publisher/Querier declare_matching_listener surface. zenoh-pico
# Z_FEATURE_MATCHING parity; pico defaults it ON, so the AP presets
# carry it. AP-only (alloc-gated watch keyexprs); an MCU no-heap watch
# backing is a follow-up, same staging as the session-reconnect MCU seam.
session-matching = ["wz-runtime-tokio?/session-matching"]
session-resumable = []
session-stateless-accept = []
# R311cd — session-unicast-* features forward to wz-runtime-tokio
# bind sites for accept-side / open-side SCXML script-actions.
session-unicast-accept = [
    "wz-runtime-tokio?/session-unicast-accept",
    "wz-runtime-coop?/session-unicast-accept",
]
session-unicast-open = [
    "wz-runtime-tokio?/session-unicast-open",
    "wz-runtime-coop?/session-unicast-open",
]

# ----- domain: storage (4 active: storage-backend + storage-history +
# storage-replication + storage-aligner) -----
# R311wl — storage-aligner forwards the AP aligner driver
# (wz-runtime-tokio?/storage-aligner = the `storage_aligner_service` module:
# the answer queryable + the ASK pull loop + the digest->aligner on_diff
# wiring). AP-only (the MCU runtime has no storage driver); implies
# storage-replication (the aligner consumes a DigestDiff and reuses the digest
# keyexpr / zid rendering).
storage-aligner = ["storage-replication", "wz-runtime-tokio?/storage-aligner"]
# R311uy — storage-backend now forwards the AP StorageService driver
# (wz-runtime-tokio?/storage-backend = the `storage_service` module + the
# kernel: StorageBackend seam + StorageState newer-wins gate). AP-only:
# the MCU runtime (wz-runtime-coop) has no storage driver — a storage is a
# server-side role beyond the MCU client profile. A `--no-default-features`
# build without wz-runtime-tokio gates zero code (the `?` forward is inert).
storage-backend = ["wz-runtime-tokio?/storage-backend"]
# R311uz — storage-history forwards the AP History::All backend
# (wz-runtime-tokio?/storage-history = HistoryStorage + the kernel). AP-only
# (the MCU runtime has no storage driver); implies storage-backend.
storage-history = ["storage-backend", "wz-runtime-tokio?/storage-history"]
# Round 311vo — storage-replication forwards the AP digest publisher/subscriber
# driver (wz-runtime-tokio?/storage-replication = the
# `storage_replication_service` module + the kernel digest stack: Fingerprint /
# Digest / diff / wire codec). AP-only (the MCU runtime has no storage driver);
# implies storage-backend. Replication runs on a History::Latest storage
# (zenoh's digest assumes Latest), so it does NOT imply storage-history.
storage-replication = ["storage-backend", "wz-runtime-tokio?/storage-replication"]

# ----- domain: time (4 atomic, 1 active / 3 foundational-reserved) -----
# R311ci — audit-only ratify. Sample.timestamp (NTP64 wire word) is
# already gated by pubsub-timestamp (R311cc). R311xt — time-hlc is now a
# real source: it forwards to wz-runtime-tokio's HLC timestamp source
# (the storage fallback stamper). The other three are FOUNDATIONAL (done +
# always-on, no toggle): time-ntp64 (the NTP64 word + codec, folded into
# pubsub-timestamp), time-system-clock (the wall_clock_ntp64 physical
# source the HLC wraps), time-timestamp-source (the FallbackStamp seam) —
# they stay no-op markers (A3: active <=> a real cfg toggle).
time-hlc = ["wz-runtime-tokio?/time-hlc"]
# R311y842 — the stock-zenoh CONFIG SURFACE, both directions: emit the JSON5 a
# `zenohd -c` reads, and READ the one an operator already has. Deliberately not
# an inventory atom: it toggles no wire behaviour and no protocol capability,
# it decides whether wz can be handed a deployment's own configuration. The
# feature is a SURFACE rather than a direction, so it is spelled after the
# document it carries. R2161 (open-debt item 198) finished that: this clause
# used to state the surface reading and then keep `zenoh-config-emit`, a name
# for one of the module's four verbs, on the grounds that the module doc said
# so. A doc saying the name is wrong is not a substitute for the right name.
zenoh-config = ["wz-runtime-tokio?/zenoh-config"]
time-ntp64 = []
time-system-clock = []
time-timestamp-source = []

# ----- domain: transport (16 atomic, 6 active / 10 reserved) -----
# R311cb — active features forward to wz-runtime-tokio (TCP/UDP
# driver, unicast FSM, keepalive worker, TX batching window — the INIT
# batch_size negotiation is core transport since R311kl, ungated).
# The reserved features (link-tls/quic/ws/unixsock/vsock/serial,
# compression, shm, lowlatency) stay declaration-only —
# no wz-runtime-tokio counterpart exists yet, and adding a forward to a
# missing feature would surface as a Cargo resolver error. They land as
# wire-up cascades as their behavior arrives. `transport-multicast`
# (Round C) and `transport-fragmentation` (R311jm — AP TX-side
# fragmentation + full-duplex `reassembly`; R311mf wired the MCU TX path
# too, so R311mg adds the `wz-session-lwip?/` forward below — the lwIP
# multicast loop now splits oversize TX via the shared multicast_tx_emit
# SSOT once the feature is on) are wired such cascades.
transport-batching = ["wz-runtime-tokio?/transport-batching", "wz-runtime-coop?/transport-batching"]
# transport-compression — lz4 per-batch wrap (zenoh batch.rs); weak-forwards
# the runtime-tokio gate. AP-only. session-extcompression adds the 0x6 handshake.
transport-compression = ["wz-runtime-tokio?/transport-compression"]
# R311mg — transport-fragmentation additionally weak-forwards to
# wz-session-lwip: R311mf landed the MCU multicast Fragment RX/TX in the
# wz-session-lwip crate's OWN transport-fragmentation feature, so without
# this forward a session-lwip + transport-fragmentation build through the
# facade would leave the MCU TX splitter + reassembly RX dormant (the gap
# the prior `wz-runtime-tokio?/`-only forward left). Mirrors the R311mc
# transport-multicast / codec-* / liveliness-token / query-queryable
# forwards.
transport-fragmentation = ["wz-runtime-tokio?/transport-fragmentation", "wz-session-lwip?/transport-fragmentation"]
# R311kx — transport-keepalive additionally weak-forwards to
# wz-session-lwip: the MCU keepalive TX emitter (run_session's
# check_keepalive_deadline busy-poll arm) is gated on wz-session-lwip's
# OWN same-named feature, so without this forward a session-lwip +
# transport-keepalive build lit the core capability but silently never
# emitted from the MCU loop (the reassembly atom's forwarding shape).
transport-keepalive = ["wz-runtime-tokio?/transport-keepalive", "wz-runtime-coop?/transport-keepalive", "wz-session-lwip?/transport-keepalive"]
# R311xk — now forwards the host QUIC backend to wz-runtime-tokio (was a
# declaration-only placeholder while no QUIC backend existed). Keeps
# transport-link-tcp (QUIC is a byte STREAM reusing the TCP `stream_link`
# pipeline over one bidi quinn stream, like tls/unixsock/vsock) and adds the
# runtime forward so the facade catalog feature turns on `quic_pipeline` (pulls
# quinn + the tls rustls cert stack). `locator-quic` (above) selects this.
transport-link-quic = ["transport-link-tcp", "wz-runtime-tokio?/transport-link-quic"]
# R311nv — now forwards the host tty backend to wz-runtime-tokio (was a
# declaration-only placeholder while only the wz-session-core logic layer
# existed). `locator-serial` (above) selects this.
transport-link-serial = ["wz-runtime-tokio?/transport-link-serial"]
transport-link-tcp = ["wz-runtime-tokio?/transport-link-tcp"]
# R311oa — now forwards the host TLS backend to wz-runtime-tokio (was a
# tcp-only placeholder while no TLS backend existed). Keeps transport-link-tcp
# (TLS is TLS-over-TCP) and adds the runtime forward so the facade catalog
# feature actually turns on `tls_pipeline` (dial_tls/accept_tls + TlsReadDriver).
# `locator-tls` (above) selects this.
transport-link-tls = ["transport-link-tcp", "wz-runtime-tokio?/transport-link-tls"]
transport-link-udp = ["wz-runtime-tokio?/transport-link-udp"]
# R311xi — now forwards the host Unix-domain-stream backend to wz-runtime-tokio
# (was a declaration-only placeholder while no unixsock backend existed). Keeps
# transport-link-tcp (a unix socket is a byte STREAM reusing the TCP
# `stream_link` pipeline, like tls) and adds the runtime forward so the facade
# catalog feature actually turns on `unixsock_pipeline`
# (dial_unixsock/bind_unixsock/accept_unixsock_on + UnixsockReadDriver).
# `locator-unixsock` (above) selects this.
transport-link-unixsock = ["transport-link-tcp", "wz-runtime-tokio?/transport-link-unixsock"]
# R311xj — now forwards the host AF_VSOCK backend to wz-runtime-tokio (was a
# declaration-only placeholder while no vsock backend existed). Keeps
# transport-link-tcp (vsock is a byte STREAM reusing the TCP `stream_link`
# pipeline, like tls/unixsock) and adds the runtime forward so the facade
# catalog feature turns on `vsock_pipeline`. The backend is Linux-only (the
# wz-runtime-tokio module is `#[cfg(all(.., target_os="linux"))]` over the
# Linux-only `tokio-vsock` dep); on a non-Linux target this forward is inert
# (the module + dep compile out). `locator-vsock` (above) selects this.
transport-link-vsock = ["transport-link-tcp", "wz-runtime-tokio?/transport-link-vsock"]
# R311ob — forwards the host WebSocket backend to wz-runtime-tokio (was a
# declaration-only placeholder while no WS backend existed). No transport-link-tcp
# forward: WS is a DATAGRAM-flow link (own WebSocket message framing, not the
# TCP StreamEnvelope), so it composes like udp, not tls. `locator-ws` selects this.
transport-link-ws = ["wz-runtime-tokio?/transport-link-ws"]
# transport-lowlatency — runtime-negotiated lean transport (zenoh
# zextunit!(0x5,false)); weak-forwards the runtime-tokio lowlatency gate. AP-only
# (no lwip forward). The functional alternative to transport-fragmentation.
transport-lowlatency = ["wz-runtime-tokio?/transport-lowlatency"]

# transport-qos (R311y215, extqos) — per-priority SN conduits + is_qos Init
# negotiation + Frame ext_qos wire. Opt-in (not in any preset yet); the
# priority-select follow-on (R311y216) + a wz<->zenohd priority-range interop
# (S4) light it up. Forwards to whichever runtime facade is active.
transport-qos = [
    "wz-runtime-tokio?/transport-qos",
    "wz-runtime-coop?/transport-qos",
]
# R311mc — transport-multicast additionally weak-forwards to wz-session-lwip:
# the MCU multicast drive loop (run_multicast_session) + its observer-staging
# sinks (MulticastReplyQueue) live in wz-session-lwip's OWN transport-multicast
# feature, so without this forward a session-lwip + transport-multicast build lit
# the AP capability but the MCU multicast loop stayed cfg-out (the
# transport-keepalive forwarding shape, R311kx). The TX body codecs + the
# observer-staging registries (codec-push / codec-response / codec-response-final
# / liveliness-token / query-queryable) carry their own wz-session-lwip?/ forward.
# R311mk note — codec-close is NOT listed here: it is pulled by each runtime
# profile's OWN transport-multicast (wz-runtime-tokio/transport-multicast +=
# codec-close; wz-session-lwip/transport-multicast already pulls
# wz-session-core/codec-close) because the shared multicast RX SSOT
# (wz-session-core::multicast_rx, gated on codec-close: it decodes T_MID_CLOSE
# + aborts the leaving peer's reassembly chains) is consumed by those crates'
# drive loops. Mirrors codec-join / codec-frame, which the facade likewise
# does NOT re-list — the crate forward self-selects them. Adding a facade-level
# codec-close forward would be redundant AND would perturb wz-runtime-coop's
# feature set for the MCU multicast footprint bin (Q.5).
transport-multicast = ["wz-runtime-tokio?/transport-multicast", "wz-session-lwip?/transport-multicast"]
# transport-shm — scoped same-host shared-memory data path (memmap2 over
# /dev/shm); weak-forwards the runtime-tokio gate. AP-only (no lwip forward --
# pico has no SHM). session-extshm (R3b) adds the Z_EXT_SHM 0x2 handshake.
transport-shm = ["wz-runtime-tokio?/transport-shm"]
transport-unicast = ["wz-runtime-tokio?/transport-unicast"]

