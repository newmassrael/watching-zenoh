    # the same job, and A3's own red aborted the job before A5 was reached, so
    # the omission was masked by an unrelated failure for two rounds. The
    # capability is the one this preset most obviously implies -- a node built
    # from "everything" that cannot be discovered is not everything.
    "scouting-responder",
    "storage-backend",
    "storage-aligner",
    "storage-history",
    "storage-replication",
    "access-acl",
    "access-downsampling",
    "access-quota",
    "access-extauth-jwt",
    "access-extauth-pubkey",
    "access-extauth-usrpwd",
    # R311y488 — the ADVANCED PUB/SUB family, the last whole PLANE this
    # "kitchen-sink" preset omitted, and the omission was not recorded as a
    # decision anywhere: not in this comment, not in the ledger, not in any
    # member atom's inventory reason. It left the same incoherent artifact
    # R311y461 fixed for `routing-token-tables`, one plane wider. `wz-ap-demo`
    # deliberately mirrors this list rather than extending it (see its
    # Cargo.toml R311y480 note, which names `advanced` / `group` among the demo
    # keys held back BECAUSE the preset omits their atoms), so an AP-full
    # BINARY answered `--advanced-publish` with an INERT warning and declared no
    # cache. Measured before the change: the AP-full demo's own
    # `BUILD FEATURES = [...]` line carries no `advanced`.
    #
    # The whole family, not a subset. A partial membership is what produced the
    # y461 defect — the publisher without its cache is a publisher whose history
    # GET has nothing to answer from, and the subscriber without recovery /
    # miss-detection is one that cannot notice the gap it exists to close.
    "ext-pubsub-advanced-publisher",
    "ext-pubsub-advanced-subscriber",
    "ext-pubsub-advanced-cache",
    "ext-pubsub-advanced-history",
    "ext-pubsub-advanced-recovery",
    "ext-pubsub-sample-miss-detection",
    "ext-pubsub-fetching-subscriber",
    "ext-pubsub-querying-subscriber",
    "ext-pubsub-group-membership",
    "ext-pubsub-serde-codec",
    # R311y489 — the ADMINSPACE plane, the next whole family this preset omitted,
    # and the third instance of the same shape (R311y461 routing-token-tables,
    # R311y488 ext-pubsub-*): a kitchen-sink preset that drops a plane without
    # recording the drop anywhere.
    #
    # The omission was NOT total, and that is what made it incoherent rather than
    # merely partial: `routing-peer` — a member since this preset existed —
    # hard-pulls `adminspace-core` (crates/wz-ap-demo/Cargo.toml routing-peer, and
    # the facade closure), so an AP-full node ALREADY served the `@/<zid>/peer`
    # node record. What it omitted were every leg that makes that record worth
    # querying: the per-entity introspection view, metrics, plugins, the read and
    # write permission gates, config hot-reload, and the router linkstate view. A
    # node that answers its own identity and nothing else is not an admin space.
    #
    # The whole family for the reason the y488 note gives one plane down: the read
    # gate with nothing to read, or the write gate with no hot-reload behind it,
    # are each the half of a pair whose other half is what makes it observable.
    "adminspace-core",
    "adminspace-read",
    "adminspace-write",
    "adminspace-metrics",
    "adminspace-introspection-handlers",
    "adminspace-plugins-handlers",
    "adminspace-config-hotreload",
    "adminspace-router-linkstate",
    # R311y491 — the ROUTER-HAT TIER, and this one was HALF PRESENT in the sharpest
    # way yet: the preset already carried the FOUNDATION (`routing-router-hat`, via
    # `routing-token-tables` since R311y461) plus two things that exist only to
    # serve that run-mode — the token tables themselves and, since R311y489,
    # `adminspace-router-linkstate`, whose render lives inside `run_router_hat`.
    # What it omitted was the run-mode's OWN atom. So the library contract carried
    # the plumbing for a mode it did not claim, while `wz-ap-demo` reached the mode
    # anyway (its `routing-token-tables` pulls the demo-side `router-hat-router`),
    # making the demo a superset of the contract it is named after — precisely what
    # that manifest's own held-back rule forbids.
    #
    # The whole tier rather than just the run-mode atom, by the rule R311y488 states
    # one plane down: a partial membership is what produced the y461 defect. All
    # seven build clean on top of this preset (measured).
    "router-hat-router",
    "router-hat-multihat",
    "router-multicast-faces",
    "router-connect-reconcile",
    "router-face-management",
    "router-master-election",
    "router-orchestration",
    # R311y492 — the DYNAMIC PLUGIN HOST. This preset's stated scope is "every
    # active + reserved feature reasonable for an AP host", and a runtime plugin
    # loader is AP/unix/std-only by construction, which is exactly this profile.
    # It carries the four atoms R311y256 deprecated conditionally; see the §5.22
    # inventory reasons. The loader module is `cfg(all(unix, ..))`, so a non-unix
    # build of this preset compiles the feature and simply has no loader.
    "plugin-dynamic-loading",
    # R311y496 — the four families and seven singletons below are EVERY remaining
    # atom this preset can carry, established by building them
    # (`cargo build -p wz --no-default-features --features preset-ap-full,<all 36>`
    # clean under `[workspace.lints] warnings = "deny"`) rather than by judging
    # them one at a time. `scripts/lib/apfull_membership.py` now derives the
    # membership from the inventory and rejects any atom that is neither a member
    # nor on its reasoned exclusion table, so the drift this list has taken four
    # rounds running (y461, y488, y489, y491) cannot recur silently.
    #
    # STORAGE. The preset's own header above has claimed "all storage" since it
    # was written, and carried four of seventeen atoms: `storage-backend`,
    # `-aligner`, `-history`, `-replication`. The whole storage MANAGER and every
    # backend implementation were compiled out, which is the y489 shape again —
    # half present, so an AP-full node had the storage seam and nothing to mount
    # on it. It is also the sharpest instance yet of why membership is not
    # bookkeeping: `--storage-host` was reachable, so the node reported a live
    # storage in its admin plane while its storage plane could answer no foreign
    # read at all (R311y496 measured that against a real zenoh-pico, and Layer E13
    # is the guard).
    "storage-backend-volume-trait",
    "storage-backend-capability",
    "storage-backend-memory-volume",
    "storage-backend-filesystem",
    "storage-mgr-config",
    "storage-mgr-multi-storage-host",
    "storage-mgr-complete-flag",
    "storage-mgr-strip-prefix",
    "storage-mgr-wildcard-updates",
    "storage-mgr-garbage-collection",
    # CONFIG. The runtime configuration surface the adminspace write plane exists
    # to drive: this preset has carried `adminspace-write` and
    # `-config-hotreload` since y489 while omitting the config subsystem they
    # mutate.
    "config-mutate-runtime",
    "config-change-notifier",
    "config-json-pointer-access",
    "config-plugin-validator",
    # REST. `wz-rest` is a hand-rolled HTTP/1.1 bridge and its oracle ships inside
    # the stock zenohd binary; an AP host serving one is exactly this preset's
    # stated scope ("every active + reserved feature reasonable for an AP host").
    "rest-http-bridge",
    "rest-sse-subscribe",
    # ROUTING, the rest of it. Seven are FOUNDATIONAL (always-on, no cfg gate of
    # their own), so they add no code here — but a preset that names 8 of 15
    # routing atoms is making a claim about the other 7 by omission, and that
    # claim is false. `routing-namespace` is the one with a real gate, and the
    # demo key it unblocks is one of the four this round empties from the demo's
    # held-back list.
    "routing-namespace",
    "routing-route-cache",
    "routing-data-route-compute",
    "routing-query-route-compute",
    "routing-interest-broker",
    "routing-interest-pending-gc",
    "routing-interceptor-framework",
    "routing-interceptor-hotreload",
    # PLUGIN, the rest of it. R311y492 built `plugin-dynamic-loading` and these
    # four returned from their CONDITIONAL deprecation with it ("if that atom is
    # ever built, this one returns with it"); `plugin-static-registration` is
    # FOUNDATIONAL — cargo features + cfg ARE wz's static registration. Naming
    # them makes the ABI boundary a claim of this preset rather than a side
    # effect of the loader's closure.
    "plugin-abi-compat",
    "plugin-host-trait",
    "plugin-lifecycle",
    "plugin-manager",
    "plugin-static-registration",
    # R311y497 — the STORAGE-side twin of the four above, and the last atom Layer
    # A5 printed as OPEN. R311y256 deprecated it on the same explicit condition
    # ("if plugin-dynamic-loading is ever built, this returns with it"), R311y492
    # fired that condition, and R311y496 moved it back to `reserved` with the
    # build named: a volume ABI plus a dlopen host for volumes. It is built, so it
    # joins — and with it `--storage-volume` on the storage host and a client's
    # ability to NAME a volume on the storage-add wire.
    "storage-mgr-dynamic-volume-loading",
    # The singletons, each omitted with no rationale recorded anywhere.
    # `query-value` is the one §5.7 atom missing from an otherwise complete query
    # family; `transport-multilink` and `transport-qos` are the last two demo keys
    # held back; the serial pair is a link kind an automotive AP host plausibly
    # has and every other link kind is already here; `api-compat-pico` is the
    # zenoh-pico C ABI drop-in, a surface a kitchen-sink AP deploy offers;
    # `switchboard` mirrors `preset-ap-client`, which has carried it all along.
    "query-value",
    "transport-multilink",
    "transport-qos",
    "transport-link-serial",
    "locator-serial",
    # R311y498 — `api-compat-c` is NOT here, and that is a decision rather than an
    # omission: the two C ABIs share the `z_*` symbol namespace, so a binary can
    # offer one or the other. The facade turns enabling both into a compile_error.
    "api-compat-pico",
    "switchboard",
    "time-system-clock",
