# preset-cortex-m0-minimal — preset-mcu-minimal specialized for the ultra-
# constrained Cortex-M0 / nrf51 class (16 KB SRAM total). Identical atomic
# set to preset-mcu-minimal PLUS `buffer-pool-session-rx-slim`, which selects
# the 4 x 256 session-rx pool (session_rx_pool_mcu_minimal.scxml) instead of
# the default 16 x 1536. That drops the MCU acceptor session e2e peak heap
# from ~32 KB to a measured ~3.15 KB which — with a trimmed lwIP port — lets
