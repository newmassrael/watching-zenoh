#
# wz-runtime-posix -- the HOST cooperative single-thread profile with no allocator.
#
# The shape of `wz-runtime-zephyr`, with a POSIX libc under it instead of a Zephyr kernel: the
# audited `wz_runtime_coop::CoopRuntime` is the executor, and this crate supplies only the seams
# (a clock, the entropy and the wall clock the session core asks for, a UDP socket, the glue of a
# `#![no_std]` `#![no_main]` program). A process built from it links no allocator, which the
# toolchain's refusal to link a program that allocates anywhere proves, as for the kit's image.
#
# Not the host profile of the C ABI (`wz-capi-c`, tokio, threads, a heap): that one is the drop-in
# for zenoh-c. This one is the same session code the MCU images run, at a Linux socket.
#
# On Windows the same seams are the system's own calls (`src/windows/`): the clock, entropy, wall
# clock and Winsock sockets the pico C ABI's cooperative engine is opened over there.

[package]
name = "wz-runtime-posix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Host cooperative single-thread runtime profile with no allocator: a monotonic clock, entropy, wall clock and UDP socket over libc for the shared MCU session code, and over the system's own calls on Windows."

[lib]
name = "wz_runtime_posix"
path = "src/lib.rs"

[dependencies]
# The cooperative executor SSOT (CoopRuntime + ClockSource) and the datagram link every stack with
# BSD sockets shares (`udp_link`): this profile reuses both, parameterised by the clock and the
# socket.
wz-runtime-coop = { path = "../wz-runtime-coop", default-features = false, features = ["session-unicast"] }
# The traits the seams implement (`EntropySource`, `EpochSource`).
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["no_std"] }
# What a host's multicast sockets report that is not an error of a call (an `#iface=` the host
# cannot resolve, a scouting membership the kernel refused), as the host crate of the tokio runtime
# reports it (`host-multicast`). No `std` feature: the crate's own macros, and nothing allocates.
log = { version = "0.4", optional = true }

# The POSIX hosts' system calls (`clock_gettime`, `getrandom`, `socket`, `poll`, `recvfrom`,
# `write`). No `std` feature: this crate is `#![no_std]`, and `libc` is the C library's own names.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

# The Windows host's (`src/windows/`): the performance counter, the system's random number
# generator, the precise system time and Winsock, each feature one namespace the module calls into
# (`System_IO` because `WSASend` and `WSAIoctl` name its overlapped structure, `System_Threading`
# for the process id a duplicated socket is made for). Already in this workspace's graph at this
# version (the pico C ABI's Windows host layer takes it), so this adds no new third-party crate.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

# A test build of this crate links the runtime with neither `host-lock` nor a program's image
# glue (`posix_image_no_heap!`), so the runtime's critical sections need an implementation in the
# test binary: critical-section's std one, as the runtime's own tests take. A Linux linker drops
# the unreached sections and links without it; the Windows linker refuses an unresolved name in
# any object it takes, reached or not.
[dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[features]
# `wz-runtime-coop`'s session tier needs a form of its task pool, and the two forms are mutually
# exclusive selectors. The default is the heap form, as `wz-runtime-zephyr`'s is, so that a
# workspace-wide build (which unifies features across every crate) finds this crate buildable and
# does not hand the other crates a static executor. This crate has no heap code of its own; the
# default only lets it compile beside the crates that do.
default = ["alloc"]
alloc = ["wz-runtime-coop/alloc", "wz-session-core/alloc"]
# The per-session slot profile of the cooperative runtime, with no allocator: what a PROGRAM turns
# on, with the defaults off (`--no-default-features --features session-slot`). Names
# `wz-runtime-coop`'s selector, which is the instance the session code the program links uses; it
# also builds the stack the slot profile's session host is given: `slot::PosixStack` on a POSIX
# host, `windows::slot::WindowsStack` on Windows.
session-slot = ["wz-runtime-coop/session-slot"]
# The host's own multicast sockets as a node on a host opens them: the interface table
# (`interfaces`: `getifaddrs`, the Windows adapter table), the group's two sockets made by the
# policy its locator states (`multicast`: `#iface=`, `#join=`, `#ttl=`, `#bind=`, `#dscp=`, the
# loopback and the refusal of an unpinned link) as the transport the shared group drive loop runs
# on, and a scouting window's sockets, one for each interface that can carry multicast
# (`scouting`). The heap profile's: the table and the members are lists the host sizes.
host-multicast = ["alloc", "dep:log"]

[lints]
workspace = true
