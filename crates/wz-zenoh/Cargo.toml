# SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael
#
# This package reproduces the public API and the documentation of the crate of the same name of
# eclipse-zenoh/zenoh, which is EPL-2.0 OR Apache-2.0, so the whole package is under that expression.
# The notices of the upstream files it derives from are kept in its sources (see LICENSES/ and
# THIRD_PARTY.md at the root of this repository).
#
# zenoh -- the public Rust API of the pinned `zenoh` crate, over watching-zenoh (inventory atom
# `api-compat-rust`, open-debt item 910, docs/build-configuration.md C13 and C13a, and
# docs/zenoh-api-on-the-engine.md for the seam).
#
# Named `zenoh` and versioned as the pinned zenoh, like every crate of the family (see
# `../wz-zenoh-result/Cargo.toml` for why the name is the mechanism): a Rust user replaces zenoh by
# one `[patch.crates-io]` entry and every crate of the graph, an ecosystem crate included, meets
# the same types. The directory keeps the `wz-` prefix of the family's directories.
#
# It is built in slices, each landing whole with the ratchet of `scripts/lib/rust_api_surface.py`
# lowered in its own round. The first slice is the `bytes` module (`ZBytes`, its reader, writer
# and slice iterator, and `Encoding`), which holds no session and names no engine. Until a slice
# lands its items are missing lines of the surface gate, not stubs here.

[package]
name = "zenoh"
version = "1.10.1"
edition.workspace = true
rust-version.workspace = true
license = "EPL-2.0 OR Apache-2.0"
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "The public Rust API of the zenoh crate (1.10.1), as a drop-in over watching-zenoh."

[lib]
name = "zenoh"
path = "src/lib.rs"
# The examples of upstream's documentation open a session, and that function is not here yet. The
# lines that do not need one (the `bytes` module's) are held by the differential tests; the
# documentation tests join with the slice that gives `open` a body (docs/zenoh-api-on-the-engine.md,
# slice Z1).
doctest = false

# Upstream's features by their names, each forwarding to the family crates that carry the same
# feature; they join the manifest with the slice that gives them meaning, and the three that the
# surface gate's arms and the `zenoh_macros` attributes read are here from the first.
[features]
# The engine the session runs on (decision D5 of docs/zenoh-api-on-the-engine.md): one per build,
# chosen by a feature. The tokio engine is the only one that opens a session from a configuration
# today, so it is the default and the only choice; a build that selects none is refused at compile
# time, and the cooperative engine joins this list with the slice that gives it an open of its own.
#
# Upstream's default features are the transports and the authentications; of them the two
# transports below have meaning today, and the rest join the manifest with the slice that maps the
# engine's capabilities onto them (the catalogue of docs/build-configuration.md, C1).
default = ["engine-tokio", "transport_tcp", "transport_udp"]
engine-tokio = ["dep:wz-capi-core", "dep:wz-capi-port", "dep:wz-runtime-tokio"]
# `transport_tcp` is what gives the configuration its default listening endpoints (`tcp/[::]:7447`
# for a router, `tcp/[::]:0` for a peer), as it does upstream; the engine carries the link always.
transport_tcp = ["zenoh-config/transport_tcp"]
# `transport_udp` asks the engine for its udp link, which its own default features also carry: this
# build cannot yet take the link away.
transport_udp = ["wz-capi-core?/link-udp"]
internal =["zenoh-config/internal", "zenoh-keyexpr/internal", "zenoh-protocol/internal"]
# Upstream's marker for the plugin interface: with it the configuration's notifier can be
# subscribed to (`Notifier::subscribe`).
plugins = []
shared-memory = [
    "dep:zenoh-shm",
    "zenoh-buffers/shared-memory",
    "zenoh-codec/shared-memory",
    "zenoh-protocol/shared-memory",
]
unstable = ["zenoh-config/unstable", "zenoh-keyexpr/unstable", "zenoh-protocol/unstable"]

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.0"
flume = "0.11.1"
futures = "0.3.31"
json5 = "0.4.1"
phf = { version = "0.13.1", features = ["macros"] }
serde = { version = "1.0.225", features = ["default"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.41"
uhlc = { version = "0.8.0", default-features = false }
# The tokio engine: what opens a session from the plan of a configuration (`open_plan`) and runs it.
#
# The unicast capabilities a session OFFERS are chosen by the crate that takes the engine, and an
# offer for one the build lacks is refused at the handshake, which closes the link: a session that
# offers QoS (upstream's default) without `transport-qos` opens, listens, and then drops every
# connection. The C ABI names them for the same reason (see its manifest), and this crate, which
# replaces upstream's, names the same set: QoS and lowlatency, the endpoint's QoS band, and
# fragmentation of what is larger than a batch. Compression and the user and password method are
# capabilities of the engine that its default features carry.
wz-capi-core = { path = "../wz-capi-core", optional = true, features = ["transport-qos"] }
# The vocabulary of the port the engine is run through: the query a queryable keeps and answers
# later, which the engine's crate does not re-export.
wz-capi-port = { path = "../wz-capi-port", optional = true }
wz-runtime-tokio = { path = "../wz-runtime-tokio", optional = true, default-features = false, features = [
    "routing-accept",
    "transport-fragmentation",
    "zenoh-config",
    "session-extqos",
    "transport-lowlatency",
] }
zenoh-buffers = { path = "../wz-zenoh-buffers", features = ["std"] }
zenoh-codec = { path = "../wz-zenoh-codec" }
zenoh-collections = { path = "../wz-zenoh-collections", features = ["std"] }
zenoh-config = { path = "../wz-zenoh-config" }
zenoh-core = { path = "../wz-zenoh-core" }
# Upstream's `zenoh` takes this crate with its `internal` feature always on.
zenoh-keyexpr = { path = "../wz-zenoh-keyexpr", default-features = false, features = ["internal"] }
zenoh-macros = { path = "../wz-zenoh-macros" }
zenoh-protocol = { path = "../wz-zenoh-protocol", features = ["std"] }
zenoh-result = { path = "../wz-zenoh-result", default-features = false }
zenoh-runtime = { path = "../wz-zenoh-runtime" }
zenoh-shm = { path = "../wz-zenoh-shm", optional = true }
zenoh-util = { path = "../wz-zenoh-util" }

# The tests of the cancellation token run on a runtime of several threads.
[dev-dependencies]
tokio ={ version = "1.47.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
