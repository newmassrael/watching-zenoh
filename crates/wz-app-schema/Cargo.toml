#
# wz-app-schema — the READERS of the documents an application describes its payloads by, run once
# when a node opens what it was handed: the `.proto` tokenizer, parser and schema linker, whose
# type tables the application frame's typed reader and writer read for every sample.
#
# Its own crate so the code that interprets a document once can be built for size while the code
# that reads and writes every sample keeps the speed it is built for: the release profiles build
# this crate at `opt-level = "s"` (`crates/Cargo.toml`). `wz-app-frame` depends on it and
# re-exports its modules at the paths they had there (`wz_app_frame::proto_schema` and the rest),
# so no consumer names this crate.
#
# No dependency, `no_std` and `alloc`.
[package]
name = "wz-app-schema"
version.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Readers of an application's payload schema: the .proto tokenizer, parser and linker."

[lib]
name = "wz_app_schema"
path = "src/lib.rs"

[features]
# `docs`: the comments `protoc` attaches to a message and a field, kept as the tokenizer reads them
# (`proto_lex::Gap`) and carried to the syntax tree and the linked types (`proto_parse::Docs`). Only a
# reader that shows a schema to a person reads them (`wz-capture`'s schema description turns it
# on); off, a node that reads payloads by their schema keeps no comment and links none of the code
# that sorts them, and the tokens, their places and every refusal are the same.
docs = []

[lints]
workspace = true
