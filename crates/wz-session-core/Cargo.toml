#
# wz-session-core — R311di proper entry (skeleton at R311di-1).
#
# Runtime-agnostic Session + SessionLinkActions + helper surface; the
# no_std + alloc home of the SCXML-driven session FSM tier currently
# spread across `wz-runtime-tokio::{session, session_glue, observer,
# declare, pubsub, query, reply, sample, locality, keyexpr_canon}`.
# This crate hosts the generic `impl<R: Runtime, T: TimeSource>` bodies
# so MCU profiles (`R = LwipRuntime<C>`, `T = LwipTime<C>`) compose
# the same session machinery without dragging in std / tokio / Lua.
#
# Phase W placement: §5.P runtime-services-tier consumer (wz-runtime-core
# trait surface) + §5.C link-tier consumer (BoxedLinkDriver). The Lua
# binding family (`install_session_actions` + `register_*` + `bind_unit`)
# stays in wz-runtime-tokio because the SCXML script engine is std/tokio-
# dependent and AP-only by spec. The `SessionLinkActions::new` concrete
# TokioRuntime-bound constructor also stays in wz-runtime-tokio for the
# same reason (AP-only entry point).
#
# R311di-1 lands the empty skeleton; subsequent sub-rounds (R311di-2 +
# beyond) move files in incrementally with import path rewrites and
# regression coverage at each step. The crate compiles unconditionally
# `no_std` with an opt-in `alloc` feature so MCU bare-metal profiles
# without a heap can still link the trait surface and the no-alloc
# subset of the session machinery.

[package]
name = "wz-session-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "R311di proper — runtime-agnostic Session / SessionLinkActions / helper surface (Phase W §5.P + §5.C consumer)."

[features]
default = ["alloc"]
# `alloc` brings `Box`/`Vec`/`String` into scope so the session machinery
# (HashMap-backed mapping tables, Vec-backed ext chains, owned codec
# byte buffers) can compose. R311di-2+ will gate the alloc-bound surface
# on this feature; the trait-only sub-surface stays available with
# default-off `alloc` for MCU profiles that prefer stack/static-only.
# R311hl (Track 2) — `alloc` now PROPAGATES to `wz-codecs/alloc`. The
# prior `alloc = []` + a hardcoded `wz-codecs/alloc` dep (below) meant a
# `--no-default-features` session-core still dragged in the allocator
# transitively, so a no-`alloc` *binary* link failed ("no global memory
# allocator") even though the rlib compiled. rlib-only lanes (Layer G
# cross-compile, C1h subset matrix) never surfaced it; the mcu-noheap-probe
# binary did. Propagating the feature makes the no-alloc profile genuinely
# allocator-free and keeps the alloc profile unchanged.
alloc = ["wz-codecs/alloc"]

# Transport reassembly subsystem (Tier B). Gates the SCE-generated
# reassembly slot statechart module (build.rs codegens
# sources/network/reassembly_slot.scxml only under this feature) and the
# `reassembly` dispatcher that drives N slot Engine instances. Pulls
# sce-rust-runtime (the generated `Engine`/`StatePolicy` host) but does
# NOT force `sce-rust-runtime/no_std`: the std-ness of the runtime is a
# build-PROFILE decision (the `no_std` feature below forwards it for the
# MCU profile), not a per-capability one. Forcing `no_std` here makes an
# AP build that also pulls wz-runtime-tokio (std sce-rust-runtime,
# `http-send`) hit the runtime's no_std/http-send `compile_error!`
# mutual-exclusion. R311im dropped the force — it was a documented debt
# (see the `no_std` comment) harmless only while reassembly stayed
# session-core/MCU-only; the AP RX-seam integration is what made it bite.
# The single `--no-std` codegen emit now compiles on the std runtime too
# (SCE pin 1474091c2 routes the `bytes` payload field through the
# profile-resolving `SceBytes<N>` alias instead of a raw `heapless::Vec`).
reassembly = ["dep:sce-rust-runtime"]

# MCU bare-metal profile selector: forwards to sce-rust-runtime's no_std
# build (heapless, no http-send / scripting — those are std-coupled and
# mutually exclusive with no_std, enforced by a compile_error! in
# sce-rust-runtime). Weak (`?`) so it only takes effect when an
# sce-rust-runtime-pulling capability feature (`reassembly` /
# `scouting-active` / `session-unicast`) is also enabled — `no_std` alone
# never pulls the optional dep. The MCU reassembly lane builds
# `--features reassembly,no_std`; the AP profile omits `no_std` and
# unifies on the std runtime that wz-runtime-tokio brings. Mirrors
# wz-statechart-bridge's `no_std` (there sce-rust-runtime is non-optional,
# so it uses the non-weak `sce-rust-runtime/no_std`). The crate body is
# always `#![no_std]`; this only picks the engine dependency's build.
#
# Also pulls `portable-atomic` (with `critical-section`): the no_std
# sce-rust-runtime Engine host uses `AtomicU64`, which `portable-atomic`
# cannot provide on a CAS-less target (Cortex-M0+ `thumbv6m`) from
# `fallback` alone — it needs the `critical-section` software-atomic path.
# Per the portable-atomic contract a LIBRARY (sce-rust-runtime) must NOT
# force `critical-section` (it would pin a global atomic backend on every
# consumer); the CONSUMER/deploy enables it and links the impl. This is
# the same consumer responsibility wz-runtime-lwip discharges for its own
# atomics; wz-session-core is the first to cross-compile the no_std Engine
# host on bare metal, so it enables the backend here. The rlib compiles
# with the feature alone; the `critical_section` impl is a link-time
# concern the MCU deploy supplies (cf. Layer G.8).
no_std = ["sce-rust-runtime?/no_std", "dep:portable-atomic"]

# R311di-11 — body-codec feature forwarders for the NetworkMessage
# dispatch cluster. Each forwards to wz-codecs/codec-* so the 3-stage
# chain (wz-runtime-tokio codec-X -> wz-session-core codec-X ->
# wz-codecs codec-X) keeps a single ground-truth gate per body codec.
# Implication shape mirrors wz-runtime-tokio: codec-push / codec-request
# / codec-response / codec-declare imply codec-frame (Frame envelope is
# the wire carrier for every Push/Request/Response/Declare record per
# parse_frame_payload's match arms). codec-response-final does NOT
# imply codec-frame: the parse_frame_payload N_MID_RESPONSE_FINAL arm
# is cfg(all(codec-frame, codec-response-final)), matching the R311e/g
# decision to keep the body codec independently selectable.
codec-frame = ["wz-codecs/codec-frame"]
codec-push = ["codec-frame", "wz-codecs/codec-push"]
codec-request = ["codec-frame", "wz-codecs/codec-request", "wz-codecs-test-support/codec-request"]
codec-response = ["codec-frame", "wz-codecs/codec-response", "wz-codecs-test-support/codec-response"]
codec-response-final = ["wz-codecs/codec-response-final"]
codec-declare = ["codec-frame", "wz-codecs/codec-declare"]

# attachment domain primitive: gates the `attachment` SSOT module (the
# one attachment-ext encode/decode pair). Selected by the
# `pubsub-attachment` / `query-attachment` consumer features below — a
# kconfig primitive, not forced on by any codec, so a subset that wires
# neither attachment consumer elides the module entirely. Standalone (the
# module builds wz-codecs ExtZbuf records; no wz-codecs forward needed).
attachment-bytes = []

# R311du — pub/sub data-plane gates for the migrated SubscriberRegistry
# dispatch arms (Put / Del payload handling + attachment / timestamp ext
# extraction). Standalone (no wz-codecs forward — the gating is at the
# wz-session-core dispatch level, not the codec level); the
# wz-runtime-tokio side forwards its same-named features here so the
# gated production arms compile consistently across the workspace.
# pubsub-attachment selects attachment-bytes (the attachment ext codec it
# consumes on both the Push encode and decode side).
pubsub-put = []
pubsub-delete = []
pubsub-attachment = ["attachment-bytes"]
pubsub-timestamp = []
pubsub-encoding = []
pubsub-source-info = []
pubsub-priority = []
pubsub-congestion-control = []
pubsub-express = []

# R311if — static scouting mode (docs/scouting-fsm.md §2.4.3). Gates the
# `scout_static` module: the `ScoutingMode` discriminator + the
# `synth_static_locators` host-side locator synthesis from
# `deploy.connect[]`. Static mode is scouting expressed as *absent* (no
# FSM, no scout codec, no scout link), so this is a pure alloc value
# transform with no wz-codecs forward. Off by default: a deploy that does
# not use `scouting.mode: static` elides the module entirely (§2.4.3
# reason #2 codegen-elision). Independent of `scouting-active` (the
# multicast FSM, below) — the two modes are alternatives.
scouting-static = []

# R311ik — active scouting mode (docs/scouting-fsm.md §2.4.1). Gates the
# SCE-generated `scouting` slot statechart module (build.rs codegens
# sources/session/scouting.scxml with `--no-std` only under this
# feature). The FSM is engine-free — every effect is a `<sce:action>`
# native host-trait call (the generated `ScoutingActions` trait, impl'd
# by wz-runtime-tokio's scouting_glue) and there is no `<send delay>`
# self-timer (the host drive loop owns the scout deadline), so the
# emitted `ScoutingPolicy<A>` carries no `IScriptEngine` and no
# scheduler.
#
# This pulls `dep:sce-rust-runtime` but — like `reassembly` and
# `session-unicast` — does NOT force `sce-rust-runtime/no_std`. Rationale:
# `no_std` is mutually exclusive with `http-send` (sce-rust-runtime lib.rs
# `compile_error!`), and `scouting-active` is hosted by wz-runtime-tokio,
# whose own sce-rust-runtime dep pulls default features (`http-send`).
# Forcing `no_std` here would make the AP build fail that compile_error.
# The `--no-std` *codegen* flag already gives the allocator-free / NoOpHal
# code shape; the runtime's profile-resolving aliases (SceString /
# SceBytes / StateChain) resolve to std types under a std sce-rust-runtime,
# so the same emit compiles on the AP profile. The std-ness of the runtime
# is a build-PROFILE decision (the crate's `no_std` feature forwards
# `sce-rust-runtime?/no_std` for the MCU profile), not a
# per-capability-feature one.
scouting-active = ["dep:sce-rust-runtime"]

# R311il — unicast session FSM (docs/session-fsm.md §2.1/§2.2/§2.4/§2.5/
# §2.7). Gates the SCE-generated `session_fsm_unicast` statechart module
# (build.rs codegens sources/session/session_fsm_unicast.scxml with
# `--no-std` only under this feature). Like `scouting-active` the FSM is
# engine-free — every effect is a no-arg `<sce:action>` native host-trait
# call (the generated `SessionFsmUnicastActions` trait, impl'd by
# wz-runtime-tokio's session_glue) and there is no `<send delay>`
# self-timer (the host drive loop owns every session deadline), so the
# emitted `SessionFsmUnicastPolicy<A>` carries no `IScriptEngine` and no
# scheduler. The two state-referencing accept guards (cookie_valid /
# half_open_cap_available + accept_rate_token) are NOT native typed
# guards either — the host dispatcher pre-classifies them into distinct
# events (mirroring reassembly's SN-consecutive precedent).
#
# Pulls `dep:sce-rust-runtime` but — like `scouting-active` and
# `reassembly` — does NOT force `sce-rust-runtime/no_std` (the same
# http-send mutual-exclusion rationale documented on `scouting-active`
# above). With this feature landed, sce-rust-lua is out of the whole
# session path: the entire AP build is Lua-free, so a no_std/MCU profile
# can select `sce-rust-runtime?/no_std` and the reassembly AP integration
# unblocks (the IScriptEngine trait the no_std runtime elides is what Lua
# needed). The wz-runtime-tokio `transport-unicast` foundational feature
# forwards here.
session-unicast = ["dep:sce-rust-runtime"]

# R311gi gc-2c — statechart switchboard (the AP dynamic
# keyexpr -> SCXML-domain-event inbound adapter). Gates the
# `switchboard::SwitchboardRegistry` (the table + its
# `dispatch_iteration_event`) and the `ApplicationLayerObserver`
# `switchboard` field + `dispatch_switchboard` fan-out arm. Implies
# `codec-push`: the switchboard reacts to inbound Push samples, so the
# Push wire codec must be present. The `switchboard::EventInjector` port
# itself stays UNCONDITIONAL (the MCU generated static match names it
# without this feature; the AP dynamic registry is what this gates).
switchboard = ["codec-push"]

# R311dx — query-side dispatch gates for the migrated QueryableRegistry
# (`wz-session-core::query`). `query-queryable` forwards to the
# codec-request (Request/Query dispatch) + codec-response (reply-build)
# halves, mirroring wz-runtime-tokio's same-named feature. The other
# three are standalone dispatch-arm gates with no wz-codecs forward
# (attachment ext extraction / selector-parameters projection / Err-form
# reply emit); the wz-runtime-tokio side forwards its same-named features
# here so the gated production arms compile consistently workspace-wide.
query-queryable = ["codec-request", "codec-response"]
# query-attachment selects attachment-bytes (the attachment ext codec it
# consumes on both the Query encode and decode side).
query-attachment = ["attachment-bytes"]
query-selector-parameters = []
query-reply-err = []
# query-source-info gates the queryable-side projection of the inbound
# Query body source-info ext (id 0x01 ENC_ZBUF, shared with the Push
# decoder). Receive-side only at this round; send-side stamping is a
# follow-up.
query-source-info = []
# R311fm — the z_get consumer's reply-body decode plane. Gates the
# inbound `Response(Reply)` Put / Del body arms in `reply.rs`
# `dispatch_response` (the projection to `InboundReplyBody::Put` /
# `::Del`). Before R311fm those arms were gated ONLY on the pubsub
# publisher's `pubsub-put` / `pubsub-delete` markers — a reply consumer
# that pinned the named `zget-reply-only` subset (codec-response,
# codec-response-final, query-get, query-reply) type-checked but
# DECODED NO reply body, because the Put arm collapsed to `_ => return`
# without `pubsub-put`. Decoding a query reply must not require the
# unrelated pub/sub data plane (which also pulls `codec-push`); this
# feature is the query-side enabler so the getter plane is independently
# composable. Implies `codec-response` (the reply decoder it gates lives
# behind that codec). The Put / Del arms now gate on
# `any(pubsub-{put,delete}, query-reply)` so existing pub-bearing presets
# are unchanged and a pure getter composes standalone.
query-reply = ["codec-response"]

# R311dz — observer-domain gate-only features for the migrated
# `ApplicationLayerObserver` (`wz-session-core::observer`). Each gates
# one of the observer's per-domain registry fields (and the matching
# `dispatch_iteration_event` fan-out arm) so an arbitrary feature subset
# composes the observer with only the registries it actually wires. They
# are standalone (no wz-codecs forward — the underlying registries gate
# on `codec-declare` at the module level; these are the application-layer
# consumer gates one level up). The wz-runtime-tokio side forwards its
# same-named features here, mirroring the `query-queryable` forward, so
# the gated observer fields compile consistently across the workspace.
# R311ek — each implies `codec-declare`. With the observer no longer
# `codec-declare`-gated as a whole (so a pub/sub-only subset can compose
# it), each consumer field's registry type still lives under the
# `codec-declare`-gated `declare` module; making the consumer feature
# imply the codec mechanically guarantees the field type exists whenever
# the field (and its session-side access) is gated in. Semantically
# sound: an application cannot observe peer declarations without the
# declare codec.
declare-subscriber = ["codec-declare"]
declare-queryable = ["codec-declare"]
liveliness-token = ["codec-declare"]
liveliness-subscriber = ["codec-declare"]
# liveliness-get — requester-side snapshot get. The CURRENT Interest +
# the inbound DeclToken / DeclFinal reply decode are the declaration
# plane, so the dependency is `codec-declare` (NOT the query / Request
# plane). The reply-delivery surface reuses the un-gated
# `reply_sink::ReplySink` seam, so no query-get / codec-response edge.
liveliness-get = ["codec-declare"]

# R311eg — transport-batching gate for the migrated PeerInitCaps decoder
# (`wz-session-core::peer_init_caps`). Standalone gate-only (no wz-codecs
# forward): off forces `from_init_syn` to clamp the peer-advertised
# batch_size to the full MTU (65535) instead of honoring it. The
# wz-runtime-tokio side forwards its same-named feature here so the INIT
# handshake batch-size negotiation semantics stay consistent workspace-wide.
transport-batching = []

[build-dependencies]
# R311in — shared sce-codegen invocation + emit post-processing (one
# source across the three codegen build scripts).
wz-codegen-build = { path = "../wz-codegen-build" }

[dependencies]
wz-runtime-core = { path = "../wz-runtime-core" }
# Tier B reassembly — host runtime for the SCE-generated reassembly slot
# statechart (`Engine<ReassemblySlotPolicy<A>>`). Optional, pulled only by
# the `reassembly` feature. No feature is forced here: the std default
# serves the AP profile (shared with wz-runtime-tokio) while the MCU
# profile selects no_std via the crate's `no_std` feature
# (`sce-rust-runtime?/no_std`); forcing either on this line would break
# Cargo feature unification on the other profile.
sce-rust-runtime = { path = "../../vendor/sce/sce-rust-runtime", optional = true, default-features = false }
# R311im — software-atomic backend for the no_std sce-rust-runtime Engine
# host on CAS-less MCU targets (Cortex-M0+ `thumbv6m`). Optional + pulled
# only by the `no_std` feature; the `critical-section` feature routes the
# emulated `AtomicU64` through `critical_section::with` so the rlib
# cross-compiles (the impl is linked by the MCU deploy). `fallback` keeps
# native 64-bit atomics on targets that have them (thumbv7em LDREXD etc.).
# Mirrors wz-runtime-lwip's portable-atomic declaration.
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"], optional = true }
# R311di-4 — wz-codecs needed by sample.rs for `wz_codecs::ext_entry`
# projection helpers (extract_qos / extract_attachment / extract_source_info).
# R311hl (Track 2) — `default-features = false` with NO hardcoded `alloc`;
# session-core's own `alloc` feature forwards to `wz-codecs/alloc` (see the
# `[features] alloc` entry above). This lets a no-`alloc` session-core link
# wz-codecs allocator-free; the codec-* feature forwarders below pull the
# wz-codecs codec features (which are themselves alloc-independent), and the
# owned codec types they expose are only ever named by session-core under
# `all(codec-*, alloc)`, where the `alloc` forward re-enables wz-codecs/alloc.
wz-codecs = { path = "../wz-codecs", default-features = false }
# R311di-6 — sce-forge-runtime supplies `CodecError` needed by
# InboundParseError variants. default-features = false stays MCU-aware;
# `alloc` is implied via wz-codecs's transitive enable but the dep is
# declared direct so the import path `sce_forge_runtime::codec::CodecError`
# resolves without going through wz-codecs's namespace.
sce-forge-runtime = { path = "../../vendor/sce/sce-forge-runtime/rust", default-features = false }
# R311di-13 — hashbrown for the resolve_wireexpr peer-keyexpr-table
# lookup (HashMap<u64, String>). default-features = false stays
# no_std-clean; the wz-runtime-tokio side already depends on hashbrown
# for the same reason (R311di-pre-a). R311dm — the `default-hasher`
# feature is enabled explicitly so a wz-session-core-only consumer
# (e.g. `cargo test -p wz-session-core --lib` MCU-style regression)
# resolves `HashMap<u64, String>::get` without leaning on the
# wz-runtime-tokio side enabling it transitively.
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
# R311du — log facade for the SubscriberRegistry keyexpr-resolution warn
# path (register_with_locality emits log::warn! when a registered keyexpr
# fails canonicalization). no_std-compatible facade; mirrors the
# wz-runtime-tokio log dep so the migrated production code resolves
# `log::warn!` without a new transitive assumption.
log = "0.4"
# R311ei — HMAC-SHA256 anti-amplification cookie primitive (the
# signing_key module). default-features = false keeps the RustCrypto
# stack no_std so the Accepting-side cookie path cross-compiles to the
# Layer G MCU targets (the OS-entropy constructor stays AP-only as a
# free fn in wz-runtime-tokio; getrandom is NOT pulled here). zeroize's
# `alloc` feature supplies the `Zeroizing<Vec<u8>>` key wrapper.
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# no-alloc backing store for the application-layer registries. When the
# `alloc` feature is off (MCU no-heap profile, §2.3) `BoundedVec<T, N>`
# (src/bounded.rs) wraps `heapless::Vec<T, N>`; when on it wraps
# `alloc::Vec<T>`. heapless 0.8 mirrors the wz-link-lwip pin so the two
# heapless consumers stay version-aligned across the no_std tier.
heapless = { version = "0.8", default-features = false }

[dev-dependencies]
# R311ds — the four declare/* registries' wider behavioural tests
# (callback fan-out value capture, mixed-message dispatch) migrated
# here from the wz-runtime-tokio shells, joining the existing R311dm
# thin self-tests. They build the inbound Declare/Interest records via
# the shared fixture builders in the R71-pattern sibling crate; the
# path-dep boundary keeps zero test-only code in the production
# artifact regardless of workspace-level Cargo feature unification.
wz-session-core-test-support = { path = "../wz-session-core-test-support" }
# R311fu — owned->wire `TestWire` projection SSOT for the request/
# response builder byte-compare tests (request_build / response_build /
# query). This crate's `codec-request` / `codec-response` features
# forward to the matching `wz-codecs-test-support` features (above) so
# an isolated subset excluding a codec gets neither the wz-codecs codec
# nor the TestWire impl; the dev-dep edge is inert in non-test builds.
wz-codecs-test-support = { path = "../wz-codecs-test-support" }

[lints]
workspace = true
