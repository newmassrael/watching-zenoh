#
# wz-session-core — R311di proper entry (skeleton at R311di-1).
#
# Runtime-agnostic Session + SessionLinkActions + helper surface; the
# no_std + alloc home of the SCXML-driven session FSM tier currently
# spread across `wz-runtime-tokio::{session, session_glue, observer,
# declare, pubsub, query, reply, sample, locality, keyexpr_canon}`.
# This crate hosts the generic `impl<R: Runtime, T: TimeSource>` bodies
# so MCU profiles (`R = CoopRuntime<C>`, `T = CoopTime<C>`) compose
# the same session machinery without dragging in std / tokio / Lua.
#
# Phase W placement: §5.P runtime-services-tier consumer (wz-runtime-core
# trait surface) + §5.C link-tier consumer (BoxedLinkDriver). The Lua
# binding family (`install_session_actions` + `register_*` + `bind_unit`)
# stays in wz-runtime-tokio because the SCXML script engine is std/tokio-
# dependent and AP-only by spec. The `SessionLinkActions::new` concrete
# TokioRuntime-bound constructor also stays in wz-runtime-tokio for the
# same reason (AP-only entry point).
#
# R311di-1 lands the empty skeleton; subsequent sub-rounds (R311di-2 +
# beyond) move files in incrementally with import path rewrites and
# regression coverage at each step. The crate compiles unconditionally
# `no_std` with an opt-in `alloc` feature so MCU bare-metal profiles
# without a heap can still link the trait surface and the no-alloc
# subset of the session machinery.

[package]
name = "wz-session-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "R311di proper — runtime-agnostic Session / SessionLinkActions / helper surface (Phase W §5.P + §5.C consumer)."

[features]
# Batteries-included default (standard Rust opt-out idiom, same shape as
# `alloc`): the full keyexpr matcher ships by default so any
# `cargo test -p wz-session-core --features <subset>` exercises the real
# matcher. A minimal profile opts OUT via `--no-default-features` (the
# MCU crates set `default-features = false` and then select only the
# wildcard kinds they use — e.g. mcu-noheap-probe picks
# keyexpr-wildcard-single/-double; preset-mcu-minimal omits them and the
# matcher degrades to literal-only). R311jf.
default = [
    "alloc",
    "keyexpr-wildcard-single",
    "keyexpr-wildcard-double",
    "keyexpr-dollar-star",
    "keyexpr-includes",
]
# `alloc` brings `Box`/`Vec`/`String` into scope so the session machinery
# (HashMap-backed mapping tables, Vec-backed ext chains, owned codec
# byte buffers) can compose. R311di-2+ will gate the alloc-bound surface
# on this feature; the trait-only sub-surface stays available with
# default-off `alloc` for MCU profiles that prefer stack/static-only.
# R311hl (Track 2) — `alloc` now PROPAGATES to `wz-codecs/alloc`. The
# prior `alloc = []` + a hardcoded `wz-codecs/alloc` dep (below) meant a
# `--no-default-features` session-core still dragged in the allocator
# transitively, so a no-`alloc` *binary* link failed ("no global memory
# allocator") even though the rlib compiled. rlib-only lanes (Layer G
# cross-compile, C1h subset matrix) never surfaced it; the mcu-noheap-probe
# binary did. Propagating the feature makes the no-alloc profile genuinely
# allocator-free and keeps the alloc profile unchanged.
alloc = ["wz-codecs/alloc"]

# adminspace-core (§5.23) — the built-in `@/<zid>/<whatami>/**` admin queryable
# keyexpr helpers + the `local_data` JSON body (the wz mirror of zenoh
# `net/runtime/adminspace.rs` `local_data` + `AdminSpace::start`). Pure
# data-view: the `AdminLocalData` struct + its manual (no `serde_json`) JSON
# emitter, so it needs only `alloc` (no_std-feasible per the R311xu P4 scoping).
# The queryable WIRING (registering the built-in queryable, snapshotting peer
# state) lives in wz-runtime-tokio's `adminspace-core` feature, which composes
# this with `query-queryable`.
adminspace-core = ["alloc", "keyexpr-wildcard-double", "pubsub-encoding"]

# adminspace-metrics (§5.23) — the @/<zid>/<whatami>/metrics OpenMetrics body
# (the build-info `zenoh_build` gauge; the transport-stats OpenMetrics
# composition is a documented follow-up). Pure data-view (the metrics_text
# builder + the metrics keyexpr helper); composes adminspace-core. The wiring
# (the metrics dispatch branch) lives in wz-runtime-tokio's adminspace-metrics.
adminspace-metrics = ["adminspace-core"]

# ext-pubsub-serde-codec (§5.25) — the Zenoh Serialization Format codec
# (z_serialize / z_deserialize), the leaf prerequisite for the advanced
# pub/sub miss-detection heartbeat (z_serialize::<u32>(last_sn)). Pure
# data codec: it serializes into a `Vec<u8>` and reads from a `&[u8]`,
# reusing the `vle` VLE SSOT for its VarInt length prefix, so it needs
# only `alloc` (no_std-feasible). The gate lives in this crate's
# `serde_codec` module; wz-runtime-tokio + the wz facade forward it.
ext-pubsub-serde-codec = ["alloc"]

# Transport reassembly subsystem (Tier B). Gates the SCE-generated
# reassembly slot statechart module (build.rs codegens
# sources/network/reassembly_slot.scxml only under this feature) and the
# `reassembly` dispatcher that drives N slot Engine instances. Pulls
# sce-rust-runtime (the generated `Engine`/`StatePolicy` host) but does
# NOT force `sce-rust-runtime/no_std`: the std-ness of the runtime is a
# build-PROFILE decision (the `no_std` feature below forwards it for the
# MCU profile), not a per-capability one. Forcing `no_std` here makes an
# AP build that also pulls wz-runtime-tokio (std sce-rust-runtime,
# `http-send`) hit the runtime's no_std/http-send `compile_error!`
# mutual-exclusion. R311im dropped the force — it was a documented debt
# (see the `no_std` comment) harmless only while reassembly stayed
# session-core/MCU-only; the AP RX-seam integration is what made it bite.
# The single `--no-std` codegen emit now compiles on the std runtime too
# (SCE pin 1474091c2 routes the `bytes` payload field through the
# profile-resolving `SceBytes<N>` alias instead of a raw `heapless::Vec`).
# Implies `codec-frame`: a `T_MID_FRAGMENT` body is a Frame-shaped body
# (VLE sn + Z-gated ext chain + tail payload), so the hoisted `inbound`
# decoder's Fragment arm reuses the `codec-frame`-gated cursor/flags/has_ext
# bindings. wz-runtime-tokio's `reassembly` already implied `codec-frame`;
# this restores the same invariant at the session-core SSOT now that
# `parse_inbound` lives here. `codec-frame` is alloc-independent so the
# no-alloc MCU reassembly lane (Layer G.8) is unaffected (the alloc-gated
# `inbound` module is simply not compiled there).
reassembly = ["dep:sce-rust-runtime", "codec-frame"]

# transport-fragmentation (R311jm) — TX-side fragmentation: the action
# layer splits an oversize FRAME into a `T_MID_FRAGMENT` chain
# (`frame_encode::fragment_body`, gated here). Pulls `codec-fragment` so
# each fragment body is the byte-verified `wz_codecs::fragment` codec
# (the SSOT `layer3_fragment.rs` checks against zenoh-pico
# `_z_fragment_encode`), and `reassembly` so enabling fragmentation also
# enables the symmetric RX path (full-duplex, mirroring zenoh-pico's
# single `Z_FEATURE_FRAGMENTATION`); `alloc` for the `Vec<Vec<u8>>`
# fragment buffers — the TX path is the AP/alloc profile, MCU TX
# fragmentation is a follow-up.
transport-fragmentation = ["reassembly", "codec-fragment", "alloc"]

# transport-lowlatency — runtime-negotiated lean transport, the wz mirror of
# zenoh's lowlatency unicast transport (`init.rs:162` zextunit!(0x5,false)).
# Gates the `extlowlatency` ext codec, the per-session `is_lowlatency` slot,
# the offer/`&=` negotiation, and the lean tx / rx data path that drops the
# Frame(sn) wrapper + fragmentation (zenoh `TransportUnicastLowlatency`). Needs
# `codec-frame` for `parse_frame_payload` (the lean rx re-uses the in-batch
# NetworkMessage decoder), `session-unicast` for the establishment FSM, and
# `alloc` for the ext chain + the lean wire Vec. NO new external dependency
# (zenoh's lowlatency needs none either). The Init offer / `&=` merge is
# ADDITIVELY gated on `codec-init-body` at its use sites (drive.rs / the
# send_init_* stagers), so this feature does NOT force the handshake codecs:
# a bare `transport-lowlatency` build is the rx-capable lowlatency primitive
# (ext codec + lean rx + the per-session state), and the negotiation + lean tx
# light up once a real unicast session (`transport-unicast`) composes it in.
# The functional alternative to `transport-fragmentation`.
transport-lowlatency = ["alloc", "codec-frame", "session-unicast"]

# transport-compression — the lz4 per-batch wrap (the wz mirror of zenoh's
# batch.rs compress/decompress), the functional data path. Gates the
# `compression` module (compress_batch/decompress_batch), the per-session
# is_compression slot + getter, and the lz4 tx/rx wrap at the send_wire /
# dispatch_link_event seams. Pulls `alloc` (the wrap Vec) + the lz4_flex codec.
# The wrap engages only when is_compression() && is_established(); without the
# negotiation (session-extcompression) is_compression stays false, so a bare
# transport-compression build is the inert-but-present wrap primitive (cf. the
# bare transport-lowlatency rx primitive). NO handshake codecs forced.
transport-compression = ["alloc", "dep:lz4_flex"]

# R311y9 — per-session transport byte/message counters. Additive instrumentation
# (4 AtomicUsize + 2 single-site increments at the send_wire/dispatch_link_event
# seams + a public snapshot accessor); zero extra deps. Off by default; the
# adminspace-metrics consumer stays P4. AP-only (never on an MCU lane).
transport-stats = []

# session-extcompression — the Z_EXT_COMPRESSION (0x6) establishment handshake
# (the wz mirror of zenoh's compression ext). Gates the `extcompression` ext
# codec + the offer/`&=` negotiation that SETS is_compression, and FORWARDS
# transport-compression (the negotiation enables the wrap). Pulls `codec-frame`
# (the rx wrap re-uses parse_frame_payload's batch) + `session-unicast` (the
# establishment FSM it rides). The Init offer/merge is additively gated on
# codec-init-body at its use sites (so a bare build carries no dead send_wire
# seam, exactly the transport-lowlatency discipline).
session-extcompression = ["transport-compression", "codec-frame", "session-unicast"]

# transport-shm — the no_std SHM machinery (the `extshm` descriptor + the 0x2
# Put-body marker codec + the per-session is_shm slot + the ShmResolver trait
# seam). The wz mirror of zenoh's zero-copy SHM payload: a descriptor on the wire
# in place of the bytes, the real POSIX segment resolved by the AP runtime behind
# the trait (the std mmap lives in wz-runtime-tokio::shm_provider). Pulls `alloc`
# (the descriptor Vec); NO new external dep at the core (mmap is std, AP-only).
# R3a is the inert machinery (is_shm always false); the live swap + the Z_EXT_SHM
# challenge handshake + the zero-copy e2e are R3b (session-extshm).
transport-shm = ["alloc"]

# session-extshm — the scoped Z_EXT_SHM (0x2) establishment handshake (the wz
# mirror of zenoh's SHM negotiation). Gates the establishment ext codec
# (extshm::encode_shm_establishment_ext / peer_offered_shm) + the offer/`&=`
# negotiation that SETS is_shm, and FORWARDS transport-shm (the negotiation
# enables the data-path swap). Pulls session-unicast (the establishment FSM it
# rides). The Init offer/merge is additively gated on codec-init-body at its use
# sites (so a bare build carries no dead handshake seam). SCOPED: a UNIT
# capability AND-merge, NOT zenoh's ZBuf/z64 challenge-response (deferred).
session-extshm = ["transport-shm", "session-unicast"]

# MCU bare-metal profile selector: forwards to sce-rust-runtime's no_std
# build (heapless, no http-send / scripting — those are std-coupled and
# mutually exclusive with no_std, enforced by a compile_error! in
# sce-rust-runtime). Weak (`?`) so it only takes effect when an
# sce-rust-runtime-pulling capability feature (`reassembly` /
# `scouting-active` / `session-unicast`) is also enabled — `no_std` alone
# never pulls the optional dep. The MCU reassembly lane builds
# `--features reassembly,no_std`; the AP profile omits `no_std` and
# unifies on the std runtime that wz-runtime-tokio brings. Mirrors
# wz-statechart-bridge's `no_std` (there sce-rust-runtime is non-optional,
# so it uses the non-weak `sce-rust-runtime/no_std`). The crate body is
# always `#![no_std]`; this only picks the engine dependency's build.
#
# Also pulls `portable-atomic` (with `critical-section`): the no_std
# sce-rust-runtime Engine host uses `AtomicU64`, which `portable-atomic`
# cannot provide on a CAS-less target (Cortex-M0+ `thumbv6m`) from
# `fallback` alone — it needs the `critical-section` software-atomic path.
# Per the portable-atomic contract a LIBRARY (sce-rust-runtime) must NOT
# force `critical-section` (it would pin a global atomic backend on every
# consumer); the CONSUMER/deploy enables it and links the impl. This is
# the same consumer responsibility wz-runtime-coop discharges for its own
# atomics; wz-session-core is the first to cross-compile the no_std Engine
# host on bare metal, so it enables the backend here. The rlib compiles
# with the feature alone; the `critical_section` impl is a link-time
# concern the MCU deploy supplies (cf. Layer G.8).
no_std = ["sce-rust-runtime?/no_std", "dep:portable-atomic"]

# R311di-11 — body-codec feature forwarders for the NetworkMessage
# dispatch cluster. Each forwards to wz-codecs/codec-* so the 3-stage
# chain (wz-runtime-tokio codec-X -> wz-session-core codec-X ->
# wz-codecs codec-X) keeps a single ground-truth gate per body codec.
# Implication shape mirrors wz-runtime-tokio: codec-push / codec-request
# / codec-response / codec-declare imply codec-frame (Frame envelope is
# the wire carrier for every Push/Request/Response/Declare record per
# parse_frame_payload's match arms). codec-response-final does NOT
# imply codec-frame: the parse_frame_payload N_MID_RESPONSE_FINAL arm
# is cfg(all(codec-frame, codec-response-final)), matching the R311e/g
# decision to keep the body codec independently selectable.
codec-frame = ["wz-codecs/codec-frame"]
# codec-fragment forwards the wz-codecs `fragment` body codec (VLE sn +
# tail payload). The TX fragmentation path (`transport-fragmentation`)
# emits each fragment body through it so production shares the SSOT
# `layer3_fragment.rs` byte-verifies against zenoh-pico.
codec-fragment = ["wz-codecs/codec-fragment"]
codec-push = ["codec-frame", "wz-codecs/codec-push", "wz-codecs-test-support/codec-push"]
codec-request = ["codec-frame", "wz-codecs/codec-request", "wz-codecs-test-support/codec-request"]
codec-response = ["codec-frame", "wz-codecs/codec-response", "wz-codecs-test-support/codec-response"]
codec-response-final = ["wz-codecs/codec-response-final", "wz-codecs-test-support/codec-response-final"]
codec-declare = ["codec-frame", "wz-codecs/codec-declare", "wz-codecs-test-support/codec-declare"]
# codec-linkstate forwards the wz-codecs linkstate-peer topology codecs
# (LinkState / LinkStateList). Consumed by `linkstate_oam` (the OAM
# carrier, P4 routing step c1). The OAM envelope codec is unconditional
# in wz-codecs, so no codec-frame edge is needed at the carrier layer;
# the transport-Frame wrapping (step c3) pulls codec-frame separately.
codec-linkstate = ["wz-codecs/codec-linkstate"]
# Handshake / liveness transport-body codecs. Consumed by the hoisted
# `inbound` decode SSOT (`parse_inbound` Init/Open/Close/KeepAlive arms).
# Independent of `codec-frame` (each is its own transport MID body), so a
# subset selecting only the handshake codecs composes without the Frame
# data-plane. The wz-runtime-tokio side forwards its same-named features
# here so the 3-stage chain (tokio codec-X -> session-core codec-X ->
# wz-codecs codec-X) keeps a single ground-truth gate per body codec.
codec-init-body = ["wz-codecs/codec-init-body"]
codec-open-body = ["wz-codecs/codec-open-body"]
codec-keep-alive = ["wz-codecs/codec-keep-alive"]
codec-close = ["wz-codecs/codec-close"]
# R311kt — codec-join forwards the wz-codecs JOIN body codec. Gates the
# `multicast_join` module (encode / decode / validate — the JOIN wire
# SSOT hoisted from wz-runtime-tokio::multicast_glue) together with
# `session-multicast` (JoinBaseline) + `alloc` (owned Vec encode,
# MulticastParams Vec zid).
codec-join = ["wz-codecs/codec-join"]

# R311nt — SERIAL link upper protocol (the `Z_FEATURE_LINK_SERIAL`
# framing + handshake + locator logic, `serial_link` module). Forwards
# `wz-codecs/codec-serial` (the serial_envelope / cobs / crc32 framing
# codecs landed R311ns) and pulls `alloc` for the frame `Vec<u8>` buffers
# and the device-path `String` — the AP/alloc profile, matching the
# transport-fragmentation / session-reconnect staging (a bounded
# no-alloc MCU serial profile is a follow-up). This is the
# transport-agnostic logic only; the host tty backend (tokio-serial) and
# the `LinkDriver` impl that drives it live in wz-runtime-tokio.
transport-link-serial = ["wz-codecs/codec-serial", "alloc"]

# attachment domain primitive: gates the `attachment` SSOT module (the
# one attachment-ext encode/decode pair). Selected by the
# `pubsub-attachment` / `query-attachment` consumer features below — a
# kconfig primitive, not forced on by any codec, so a subset that wires
# neither attachment consumer elides the module entirely. Standalone (the
# module builds wz-codecs ExtZbuf records; no wz-codecs forward needed).
attachment-bytes = []

# R311du — pub/sub data-plane gates for the migrated SubscriberRegistry
# dispatch arms (Put / Del payload handling + attachment / timestamp ext
# extraction). Standalone (no wz-codecs forward — the gating is at the
# wz-session-core dispatch level, not the codec level); the
# wz-runtime-tokio side forwards its same-named features here so the
# gated production arms compile consistently across the workspace.
# pubsub-attachment selects attachment-bytes (the attachment ext codec it
# consumes on both the Push encode and decode side).
pubsub-put = []
pubsub-delete = []
pubsub-attachment = ["attachment-bytes"]
pubsub-timestamp = []
pubsub-encoding = []
pubsub-source-info = []
pubsub-priority = []
pubsub-congestion-control = []
pubsub-express = []

# R311if — static scouting mode (docs/scouting-fsm.md §2.4.3). Gates the
# `scout_static` module: the `ScoutingMode` discriminator + the
# `synth_static_locators` host-side locator synthesis from
# `deploy.connect[]`. Static mode is scouting expressed as *absent* (no
# FSM, no scout codec, no scout link), so this is a pure alloc value
# transform with no wz-codecs forward. Off by default: a deploy that does
# not use `scouting.mode: static` elides the module entirely (§2.4.3
# reason #2 codegen-elision). Independent of `scouting-active` (the
# multicast FSM, below) — the two modes are alternatives.
scouting-static = []

# R311ik — active scouting mode (docs/scouting-fsm.md §2.4.1). Gates the
# SCE-generated `scouting` slot statechart module (build.rs codegens
# sources/session/scouting.scxml with `--no-std` only under this
# feature). The FSM is engine-free — every effect is a `<sce:action>`
# native host-trait call (the generated `ScoutingActions` trait, impl'd
# by wz-runtime-tokio's scouting_glue) and there is no `<send delay>`
# self-timer (the host drive loop owns the scout deadline), so the
# emitted `ScoutingPolicy<A>` carries no `IScriptEngine` and no
# scheduler.
#
# This pulls `dep:sce-rust-runtime` but — like `reassembly` and
# `session-unicast` — does NOT force `sce-rust-runtime/no_std`. Rationale:
# `no_std` is mutually exclusive with `http-send` (sce-rust-runtime lib.rs
# `compile_error!`), and `scouting-active` is hosted by wz-runtime-tokio,
# whose own sce-rust-runtime dep pulls default features (`http-send`).
# Forcing `no_std` here would make the AP build fail that compile_error.
# The `--no-std` *codegen* flag already gives the allocator-free / NoOpHal
# code shape; the runtime's profile-resolving aliases (SceString /
# SceBytes / StateChain) resolve to std types under a std sce-rust-runtime,
# so the same emit compiles on the AP profile. The std-ness of the runtime
# is a build-PROFILE decision (the crate's `no_std` feature forwards
# `sce-rust-runtime?/no_std` for the MCU profile), not a
# per-capability-feature one.
scouting-active = ["dep:sce-rust-runtime"]

# R311il — unicast session FSM (docs/session-fsm.md §2.1/§2.2/§2.4/§2.5/
# §2.7). Gates the SCE-generated `session_fsm_unicast` statechart module
# (build.rs codegens sources/session/session_fsm_unicast.scxml with
# `--no-std` only under this feature). Like `scouting-active` the FSM is
# engine-free — every effect is a no-arg `<sce:action>` native host-trait
# call (the generated `SessionFsmUnicastActions` trait, impl'd by
# wz-runtime-tokio's session_glue) and there is no `<send delay>`
# self-timer (the host drive loop owns every session deadline), so the
# emitted `SessionFsmUnicastPolicy<A>` carries no `IScriptEngine` and no
# scheduler. The two state-referencing accept guards (cookie_valid /
# half_open_cap_available + accept_rate_token) are NOT native typed
# guards either — the host dispatcher pre-classifies them into distinct
# events (mirroring reassembly's SN-consecutive precedent).
#
# Pulls `dep:sce-rust-runtime` but — like `scouting-active` and
# `reassembly` — does NOT force `sce-rust-runtime/no_std` (the same
# http-send mutual-exclusion rationale documented on `scouting-active`
# above). With this feature landed, sce-rust-lua is out of the whole
# session path: the entire AP build is Lua-free, so a no_std/MCU profile
# can select `sce-rust-runtime?/no_std` and the reassembly AP integration
# unblocks (the IScriptEngine trait the no_std runtime elides is what Lua
# needed). The wz-runtime-tokio `transport-unicast` foundational feature
# forwards here.
session-unicast = ["dep:sce-rust-runtime"]

# chunk-5 (SessionLinkActions struct move) — the handshake-role gates the
# migrated `SessionFsmUnicastActionsTrait` impl carries on its wire-emit
# actions: `session-unicast-open` gates the Initiator-side dial
# (`send_init_syn` / `send_open_syn`), `session-unicast-accept` the
# Acceptor-side listen (`send_init_ack_with_cookie` / `send_open_ack`).
# Standalone gate-only (cfg-off = no-emit no-op). The wz-runtime-tokio
# side forwards here so the role-gated action arms compile consistently.
session-unicast-open = []
session-unicast-accept = []

# session-extauth — the Z_EXT_AUTH establishment extension (catalog
# §5.4 session, zenoh init.rs:156 / open.rs:121 `zextzbuf!(0x3, false)`).
# Gates the `extauth` codec module (the wire-ext envelope on Init / Open).
# AP-only (zenoh-pico has no auth), so it implies `alloc` (auth payloads —
# an RSA signature for the pubkey method — exceed the no_std heapless bound)
# and is forwarded only through the AP runtime (wz-runtime-tokio), never the
# MCU profile. R1 lands the codec; the method-agnostic dispatch (OpenFsm /
# AcceptFsm mirror) + the usrpwd / pubkey methods are follow-on atoms.
session-extauth = ["alloc"]
# access-extauth-usrpwd — the §5.16 usrpwd auth method (R311wx). Gates the
# `extauth_usrpwd` module (the UsrPwdMethod + HMAC-SHA3-256 + OpenSyn codec);
# implies session-extauth (the dispatch kernel it plugs into) and pulls `sha3`.
access-extauth-usrpwd = ["session-extauth", "dep:sha3"]

# Round A — multicast session FSM (docs/session-fsm.md §3.1 session-level
# lifecycle + §3.2 per-peer membership). Gates the two SCE-generated
# engine-free statechart modules (build.rs codegens
# sources/session/session_fsm_multicast.scxml + multicast_peer.scxml with
# `--no-std` only under this feature) and the `multicast_dispatch` Router
# that drives them. Like `session-unicast` the FSMs are engine-free —
# every effect is a no-arg `<sce:action>` native host-trait call and there
# is no `<send delay>` self-timer (the Router owns the Join cadence + lease
# sweep clock), so the emitted `*Policy<A>` carries no `IScriptEngine`.
# Multicast is handshake-free (§3.3), so this is a DIFFERENT shape from
# `session-unicast` (no Init/Open exchange), not a superset.
#
# Pulls `dep:sce-rust-runtime` but — like `session-unicast` /
# `scouting-active` / `reassembly` — does NOT force
# `sce-rust-runtime/no_std` (the same http-send mutual-exclusion rationale
# documented on `scouting-active`). The transport-multicast link socket +
# the host drive loop land in later rounds; this round is the runtime-
# agnostic FSM + Router core, host-testable with no I/O. The
# wz-runtime-tokio side forwards a `transport-multicast` foundational
# feature here when the glue lands.
session-multicast = ["dep:sce-rust-runtime"]

# R311gi gc-2c — statechart switchboard (the AP dynamic
# keyexpr -> SCXML-domain-event inbound adapter). Gates the
# `switchboard::SwitchboardRegistry` (the table + its
# `dispatch_iteration_event`) and the `ApplicationLayerObserver`
# `switchboard` field + `dispatch_switchboard` fan-out arm. Implies
# `codec-push`: the switchboard reacts to inbound Push samples, so the
# Push wire codec must be present. The `switchboard::EventInjector` port
# itself stays UNCONDITIONAL (the MCU generated static match names it
# without this feature; the AP dynamic registry is what this gates).
switchboard = ["codec-push"]

# R311qc — the data-plane forwarding kernel (`routing::RouteTable`): a router
# forwards a Put received on one peer face to every other face that declared a
# matching subscriber. Sibling capability to the `routing-router`
# accept-and-hold foundation. Implies `codec-push` (the router forwards inbound
# Push samples) and `declare-subscriber` (it reads inbound DeclareSubscriber to
# build routes). Gated together with `alloc` at the module (AP router; an MCU
# router is a far-future profile). The kernel reuses the `wireexpr_resolve` /
# `keyexpr_match` SSOTs already shipped for the subscriber data plane.
routing-routes = ["codec-push", "declare-subscriber", "session-unicast"]

# R311dx — query-side dispatch gates for the migrated QueryableRegistry
# (`wz-session-core::query`). `query-queryable` forwards to the
# codec-request (Request/Query dispatch) + codec-response (reply-build)
# halves, mirroring wz-runtime-tokio's same-named feature. The other
# three are standalone dispatch-arm gates with no wz-codecs forward
# (attachment ext extraction / selector-parameters projection / Err-form
# reply emit); the wz-runtime-tokio side forwards its same-named features
# here so the gated production arms compile consistently workspace-wide.
query-queryable = ["codec-request", "codec-response"]
# query-attachment selects attachment-bytes (the attachment ext codec it
# consumes on both the Query encode and decode side).
query-attachment = ["attachment-bytes"]
query-selector-parameters = []
query-reply-err = []
# query-source-info gates the queryable-side projection of the inbound
# Query body source-info ext (id 0x01 ENC_ZBUF, shared with the Push
# decoder). Receive-side only at this round; send-side stamping is a
# follow-up.
query-source-info = []
# R311y74 — reply-source-info gates the queryable REPLY-side emission of
# the inner Put-body source-info ext (id 0x01 ENC_ZBUF), the Reply-body
# twin of pubsub-source-info (Push) / query-source-info (Query). A Reply
# body IS a Put push-body (zenoh-pico `_z_reply_encode` ->
# `_z_push_body_encode`, message.c:517 -> :291-293 emits ext 0x01 exactly
# like a normal Put), so the advanced-recovery cache can stamp its
# recovery replies with the original sample's (zid, eid, sn) and the
# subscriber can re-key/reorder them. OFF (default) = pico-faithful no-emit.
# Composed in by ext-pubsub-advanced-recovery. The gate is DEDICATED (not a
# reuse of pubsub-source-info) for consistency with the per-message-kind
# source-info gate family (query-source-info already has its own); storage /
# query replies stay byte-unchanged regardless of the gate choice, since no
# such queryable calls `.source_info()` -- exactly as reply-attachment safely
# reuses pubsub-attachment.
reply-source-info = []
# R311fm — the z_get consumer's reply-body decode plane. Gates the
# inbound `Response(Reply)` Put / Del body arms in `reply.rs`
# `dispatch_response` (the projection to `InboundReplyBody::Put` /
# `::Del`). Before R311fm those arms were gated ONLY on the pubsub
# publisher's `pubsub-put` / `pubsub-delete` markers — a reply consumer
# that pinned the named `zget-reply-only` subset (codec-response,
# codec-response-final, query-get, query-reply) type-checked but
# DECODED NO reply body, because the Put arm collapsed to `_ => return`
# without `pubsub-put`. Decoding a query reply must not require the
# unrelated pub/sub data plane (which also pulls `codec-push`); this
# feature is the query-side enabler so the getter plane is independently
# composable. Implies `codec-response` (the reply decoder it gates lives
# behind that codec). The Put / Del arms now gate on
# `any(pubsub-{put,delete}, query-reply)` so existing pub-bearing presets
# are unchanged and a pure getter composes standalone.
query-reply = ["codec-response"]

# R311dz — observer-domain gate-only features for the migrated
# `ApplicationLayerObserver` (`wz-session-core::observer`). Each gates
# one of the observer's per-domain registry fields (and the matching
# `dispatch_iteration_event` fan-out arm) so an arbitrary feature subset
# composes the observer with only the registries it actually wires. They
# are standalone (no wz-codecs forward — the underlying registries gate
# on `codec-declare` at the module level; these are the application-layer
# consumer gates one level up). The wz-runtime-tokio side forwards its
# same-named features here, mirroring the `query-queryable` forward, so
# the gated observer fields compile consistently across the workspace.
# R311ek — each implies `codec-declare`. With the observer no longer
# `codec-declare`-gated as a whole (so a pub/sub-only subset can compose
# it), each consumer field's registry type still lives under the
# `codec-declare`-gated `declare` module; making the consumer feature
# imply the codec mechanically guarantees the field type exists whenever
# the field (and its session-side access) is gated in. Semantically
# sound: an application cannot observe peer declarations without the
# declare codec.
declare-subscriber = ["codec-declare"]
declare-queryable = ["codec-declare"]
# R311jf — keyexpr matching composition toggles (§5.6). Gate-only (no
# dep): each strips a branch in `keyexpr_match.rs` (an always-compiled
# module). Off-semantics = the pattern token degrades to a literal
# chunk compare. In `default` (above) so the matcher is batteries-
# included for AP + every `cargo test -p wz-session-core` subset; a
# minimal profile opts out via `--no-default-features` (MCU) and the
# `--no-default-features` build matrix (C1h) + the C1o behaviour lane
# exercise the stripped path. The foundational keyexpr capabilities
# (literal / canon / mapping / intersect) ship always-on with no feature
# here (intersect is called unconditionally by the always-compiled
# subscriber/queryable has_matching).
keyexpr-wildcard-single = []
keyexpr-wildcard-double = []
keyexpr-dollar-star = []
keyexpr-includes = []
# chunk-5 (SessionLinkActions struct move) — the finer declare-action
# gates the migrated `send_declare_*` / `send_undeclare_*` /
# `send_declare_final` / interest action methods carry. Each mirrors the
# wz-runtime-tokio same-named feature (`= ["codec-declare"]`); the
# wz-runtime-tokio side forwards here so the gated action arms compile
# consistently workspace-wide.
declare-keyexpr = ["codec-declare"]
declare-token = ["codec-declare"]
declare-final = ["codec-declare"]
declare-interest = ["codec-declare"]
declare-undeclare = ["codec-declare"]
liveliness-token = ["codec-declare"]
liveliness-subscriber = ["codec-declare"]
# liveliness-get — requester-side snapshot get. The CURRENT Interest +
# the inbound DeclToken / DeclFinal reply decode are the declaration
# plane, so the dependency is `codec-declare` (NOT the query / Request
# plane). The reply-delivery surface reuses the un-gated
# `reply_sink::ReplySink` seam, so no query-get / codec-response edge.
liveliness-get = ["codec-declare"]

# R311kl — transport-batching gates ONLY the TX coalescing machinery
# (`BatchTx` accumulation arm + the batch_start/flush/stop window),
# zenoh-pico Z_FEATURE_BATCHING parity (transport.c:35-38 + common/tx.c).
# The INIT batch_size negotiation (PeerInitCaps honoring + the
# min(local, peer) InitAck reduction) is CORE transport — pico runs it
# outside every Z_FEATURE_BATCHING gate (unicast/transport.c:47 + 102 +
# 135-140). The former R311eg/R311cb shape gated the honoring here too,
# which made batching-off builds answer an InitSyn with an ENLARGED
# InitAck and foreign pico initiators rejected the session (R311fg).
# Standalone gate-only (no wz-codecs forward); wz-runtime-tokio forwards
# its same-named feature here.
transport-batching = []

# chunk-5 (SessionLinkActions struct move) — transport-keepalive gates
# the migrated `start_keepalive_worker` / `stop_keepalive_worker` action
# bodies (the Established-side keepalive cadence). Standalone gate-only
# (no wz-codecs forward; the wire-level KeepAlive parse is the separate
# codec-keep-alive axis). The wz-runtime-tokio side forwards here.
transport-keepalive = []

# A4 — session-reconnect gates the declaration-cache STORAGE on the
# actions bundle (`declaration_cache` field + the append/prune hooks in
# the send_declare_* / send_undeclare_* / send_interest_* emit paths) and
# the `reset_for_reopen` / `replay_declarations` bodies. zenoh-pico
# `Z_FEATURE_AUTO_RECONNECT` parity (`_z_session_t._declaration_cache`,
# `_z_cache_declaration` / `_z_prune_declaration`,
# `_z_client_reopen_task_fn`). Pulls `alloc` for the `Vec<CachedDeclaration>`
# cache backing (the AP profile; a bounded no-alloc MCU cache is a
# follow-up, same staging as MCU TX fragmentation). The reconnect
# SUPERVISOR (re-dial + re-handshake loop) is runtime-side
# (wz-runtime-tokio), which forwards its same-named feature here.
session-reconnect = ["alloc"]

# R311kh — session-matching gates the matching-listener watch machinery
# (zenoh-pico `Z_FEATURE_MATCHING` parity, default-on in pico's CMake
# cache): the `declare::matching` MatchingSink/MatchingWatchList seam +
# the watch-list field and declare/undeclare-listener methods on the
# remote subscriber / queryable registries, re-evaluated on every
# membership mutation (the listener form of the polling
# `get_matching_status`). Pulls `alloc` for the watch keyexpr Strings —
# the membership table it consults is the registries' alloc-gated half.
session-matching = ["alloc"]

# R311lh — consumer-enable arm for the `deferred_fire` module gate. The
# Session tier (wz-runtime-tokio, host-only, always alloc + Arc) turns
# this on through its DEPENDENCY feature list so the deferred-fire
# machinery exists in every runtime-tokio build — required once the
# always-compiled subscriber plane defers (R311lf invariant, round (b)).
# Deliberately NOT implied by any plane feature: the R311le ratify
# rejected the plane->deferred-fire implication because it would drag
# `alloc` into the no-alloc decl lane (wz-session-core
# --no-default-features codec-declare,declare-* build).
# R311me — this is now the SOLE gate of the deferred_fire module (lib.rs).
# The pre-R311lh plane arms (session-matching / declare-* / liveliness-* /
# query-reply) were dropped from that gate: no core code instantiates a
# deferred type under them, so they only compiled the module unused — and
# `liveliness-token` pulled `Arc` onto the Arc-free MCU multicast profile,
# breaking the thumbv6m M0 liveliness cross-build. Non-AP consumers (MCU
# lanes, subset test lanes) never enable `deferred-fire` and drive
# registries inline.
deferred-fire = ["alloc"]

# R311uw — storage-backend (§5.11 storage domain, atom 1/4). Gates the
# `storage_backend` kernel module: the pluggable `StorageBackend` seam +
# an in-memory backend, a faithful mirror of zenoh's `zenoh-backend-traits`
# `Storage` trait + the bundled `memory_backend`. Pulls `alloc` for the
# BTreeMap / String / Vec backing and the `crate::sample` TimestampHint /
# EncodingHint the `StoredData` embeds. Runtime-agnostic backend layer; the
# newer-wins service decision and the wz-runtime-tokio StorageService driver
# (Subscriber + complete Queryable + select loop) are follow-up atoms.
# wz-runtime-tokio / the wz facade forward this same-named feature once the
# driver lands.
storage-backend = ["alloc"]

# R311uz — storage-history (§5.11 storage domain, atom 2/4). Gates the
# `storage_history` module: an in-memory `History::All` backend
# (`HistoryStorage`) that keeps every version per key, the multi-version
# counterpart of `MemoryStorage`. Implies `storage-backend` (the backend
# seam + the `History` capability + the `StorageState` history-aware gate
# it builds on). The wz-runtime-tokio / wz facade forward this same-named
# feature so a History::All storage is declarable end-to-end.
storage-history = ["storage-backend"]

# Round 311vh — storage-replication (§5.11 storage domain, replication 1/N).
# Gates the `storage_replication` module: the digest primitives (Fingerprint,
# interval/sub-interval classification, configuration + per-event xxh3
# fingerprints) a replica's Digest is assembled from, a faithful mirror of
# zenoh's `zenoh-plugin-storage-manager` `replication::{digest,classification,
# configuration,log}`. Implies `storage-backend` (the Digest is built from a
# storage's stored set, and replication runs on a History::Latest backend —
# NOT `storage-history`: zenoh's digest assumes Latest). Pulls `xxhash-rust`
# (xxh3) so the fingerprints are byte-exact with a real zenoh replica. The
# wz-runtime-tokio / wz facade forward this same-named feature once the
# publish/subscribe driver lands.
storage-replication = ["storage-backend", "dep:xxhash-rust"]

# Round 311vr — storage-aligner (§5.11 storage domain, aligner 1/N). Gates the
# `storage_aligner` module: the alignment event metadata (`Action` +
# `EventMetadata`) a replica exchanges to pull the entries a `DigestDiff`
# localised, a faithful mirror of zenoh's `zenoh-plugin-storage-manager`
# `replication::{log,core::aligner_query,core::aligner_reply}`. Implies
# `storage-replication` (the aligner consumes a `DigestDiff` and reuses the
# `event_fingerprint` / `Fingerprint` the Digest is built from, so an event's
# identity agrees between the digest and the aligner). The wz-runtime-tokio /
# wz facade forward this same-named feature once the aligner queryable +
# query driver lands.
storage-aligner = ["storage-replication"]
# R311y57 — storage-mgr-multi-storage-host (§5.24): the StorageManager that hosts
# N named storages over a volume registry, creating each backend from its
# StorageConfig via the volume (the `storage_manager` module). The first
# cfg-ACTIVE storage-manager atom; composes storage-backend (it consumes the
# Volume factory + StorageConfig + StorageBackend, all gated there). The async
# per-storage service driver is the SEPARATE wz-runtime-tokio §5.11 storage track.
storage-mgr-multi-storage-host = ["storage-backend"]
# R311y58 — storage-mgr-strip-prefix (§5.24): the strip_prefix / restore_prefix
# key transforms (the `storage_strip_prefix` module), the wz mirror of zenoh's
# strip_prefix/prefix. cfg-ACTIVE (a slim storage build omits strip support). The
# logic is pure key-string work, so it composes only `alloc` (not storage-backend);
# the future manager/service that APPLIES it composes the manager feature.
storage-mgr-strip-prefix = ["alloc"]

# R311y22b — no [build-dependencies]: the statechart codegen moved to the
# committed out/wz-session-core/*_sm.rs via the `xtask` codegen SSOT, so this
# crate has no build script and pulls no sce-codegen toolchain.

[dependencies]
wz-runtime-core = { path = "../wz-runtime-core" }
# Tier B reassembly — host runtime for the SCE-generated reassembly slot
# statechart (`Engine<ReassemblySlotPolicy<A>>`). Optional, pulled only by
# the `reassembly` feature. No feature is forced here: the std default
# serves the AP profile (shared with wz-runtime-tokio) while the MCU
# profile selects no_std via the crate's `no_std` feature
# (`sce-rust-runtime?/no_std`); forcing either on this line would break
# Cargo feature unification on the other profile.
sce-rust-runtime = { path = "../../vendor/sce/sce-rust-runtime", optional = true, default-features = false }
# R311im — software-atomic backend for the no_std sce-rust-runtime Engine
# host on CAS-less MCU targets (Cortex-M0+ `thumbv6m`). Optional + pulled
# only by the `no_std` feature; the `critical-section` feature routes the
# emulated `AtomicU64` through `critical_section::with` so the rlib
# cross-compiles (the impl is linked by the MCU deploy). `fallback` keeps
# native 64-bit atomics on targets that have them (thumbv7em LDREXD etc.).
# Mirrors wz-runtime-coop's portable-atomic declaration.
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"], optional = true }
# R311di-4 — wz-codecs needed by sample.rs for `wz_codecs::ext_entry`
# projection helpers (extract_qos / extract_attachment / extract_source_info).
# R311hl (Track 2) — `default-features = false` with NO hardcoded `alloc`;
# session-core's own `alloc` feature forwards to `wz-codecs/alloc` (see the
# `[features] alloc` entry above). This lets a no-`alloc` session-core link
# wz-codecs allocator-free; the codec-* feature forwarders below pull the
# wz-codecs codec features (which are themselves alloc-independent), and the
# owned codec types they expose are only ever named by session-core under
# `all(codec-*, alloc)`, where the `alloc` forward re-enables wz-codecs/alloc.
wz-codecs = { path = "../wz-codecs", default-features = false }
# R311di-6 — sce-forge-runtime supplies `CodecError` needed by
# InboundParseError variants. default-features = false stays MCU-aware;
# `alloc` is implied via wz-codecs's transitive enable but the dep is
# declared direct so the import path `sce_forge_runtime::codec::CodecError`
# resolves without going through wz-codecs's namespace.
sce-forge-runtime = { path = "../../vendor/sce/sce-forge-runtime/rust", default-features = false }
# R311di-13 — hashbrown for the resolve_wireexpr peer-keyexpr-table
# lookup (HashMap<u64, String>). default-features = false stays
# no_std-clean; the wz-runtime-tokio side already depends on hashbrown
# for the same reason (R311di-pre-a). R311dm — the `default-hasher`
# feature is enabled explicitly so a wz-session-core-only consumer
# (e.g. `cargo test -p wz-session-core --lib` MCU-style regression)
# resolves `HashMap<u64, String>::get` without leaning on the
# wz-runtime-tokio side enabling it transitively.
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
# Round 311vh — xxh3 hasher for the storage-replication digest primitives
# (storage_replication.rs). Optional, pulled only by `storage-replication`.
# default-features = false keeps it no_std (xxh3 is a pure computation, no
# std/alloc needed); the `xxh3` feature is the exact algorithm zenoh's
# replication uses (`xxhash_rust::xxh3`, digest.rs:24), so wz fingerprints
# are byte-identical to a real zenoh replica's.
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"], optional = true }
# R311du — log facade for the SubscriberRegistry keyexpr-resolution warn
# path (register_with_locality emits log::warn! when a registered keyexpr
# fails canonicalization). no_std-compatible facade; mirrors the
# wz-runtime-tokio log dep so the migrated production code resolves
# `log::warn!` without a new transitive assumption.
log = "0.4"
# R311ei — HMAC-SHA256 anti-amplification cookie primitive (the
# signing_key module). default-features = false keeps the RustCrypto
# stack no_std so the Accepting-side cookie path cross-compiles to the
# Layer G MCU targets (the OS-entropy constructor stays AP-only as a
# free fn in wz-runtime-tokio; getrandom is NOT pulled here). zeroize's
# `alloc` feature supplies the `Zeroizing<Vec<u8>>` key wrapper.
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
# R3 (R311wx) — SHA3-256 for the §5.16 usrpwd auth method ONLY. zenoh's
# `zenoh_crypto::hmac::sign` is `Hmac::<Sha3_256>` (commons/zenoh-crypto/src/
# hmac.rs:19), so usrpwd interop with zenohd requires SHA3 (the cookie path's
# sha2 is a different hash). Optional + AP-only (pulled by access-extauth-usrpwd,
# itself implying session-extauth); default-features = false keeps it no_std.
sha3 = { version = "0.10", default-features = false, optional = true }
# transport-compression — the per-batch lz4 codec, the SAME crate zenoh uses
# (io/zenoh-transport lz4_flex 0.11), so a compression-negotiated wz<->zenohd
# session is byte-compatible. no_std + alloc via the safe-* pure-Rust block impls
# (no std, no nightly, no unsafe); the `frame` format is std-coupled + unused
# (we use the block API), so default-features are off.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"], optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# no-alloc backing store for the application-layer registries. When the
# `alloc` feature is off (MCU no-heap profile, §2.3) `BoundedVec<T, N>`
# (src/bounded.rs) wraps `heapless::Vec<T, N>`; when on it wraps
# `alloc::Vec<T>`. heapless 0.8 mirrors the wz-link-lwip pin so the two
# heapless consumers stay version-aligned across the no_std tier.
heapless = { version = "0.8", default-features = false }

[dev-dependencies]
# R311ds — the four declare/* registries' wider behavioural tests
# (callback fan-out value capture, mixed-message dispatch) migrated
# here from the wz-runtime-tokio shells, joining the existing R311dm
# thin self-tests. They build the inbound Declare/Interest records via
# the shared fixture builders in the R71-pattern sibling crate; the
# path-dep boundary keeps zero test-only code in the production
# artifact regardless of workspace-level Cargo feature unification.
wz-session-core-test-support = { path = "../wz-session-core-test-support" }
# R311fu — owned->wire `TestWire` projection SSOT for the request/
# response builder byte-compare tests (request_build / response_build /
# query). This crate's `codec-request` / `codec-response` features
# forward to the matching `wz-codecs-test-support` features (above) so
# an isolated subset excluding a codec gets neither the wz-codecs codec
# nor the TestWire impl; the dev-dep edge is inert in non-test builds.
wz-codecs-test-support = { path = "../wz-codecs-test-support" }
# Round 311vk — byte-compat ground truth for the storage-replication wire
# codec (storage_replication::wire). The production codec is hand-rolled +
# no_std (bincode 1.x is std-only; 2.x's default format differs from 1.x's),
# so it cannot depend on bincode. These TEST-ONLY deps let a test serialize a
# serde mirror of the Digest with the EXACT bincode 1.3 default config zenoh
# uses (zenoh workspace `bincode = "1.3.3"`; serialize_into/deserialize,
# core.rs:229/356) and assert the hand-rolled bytes match it — proving wire
# compatibility without running zenoh. Inert in the production / MCU artifact.
bincode = "1.3"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
