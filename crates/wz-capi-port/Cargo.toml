#
# wz-capi-port — the port between a wz C ABI and the engine that runs its sessions.
#
# A C ABI (`wz-capi-pico`, `wz-capi-c`) describes what a C program asks of a session: open it,
# publish, declare a subscriber, declare a key expression, watch for matching peers. An engine
# runs the session: today `wz-capi-core`, one OS thread and a tokio runtime per session; next the
# cooperative engine, which the application steps as zenoh-pico's single-threaded arm does
# (docs/capi-pico-on-coop-engine.md). The port is what both sides name, and nothing else: the
# vocabulary a request and its answer are spelled in, and (as it lands) the operations an engine
# implements. So it depends on no engine, no async runtime and no thread.
#
# It is not `wz-capi-core` under another name. That crate IS the tokio engine (its features
# forward into `wz-runtime-tokio`, its session model is a thread and a runtime), and a C ABI over
# another engine cannot depend on it. What both engines must agree on moves here, and
# `wz-capi-core` re-exports it, so the zenoh-c ABI keeps its paths.
#
# `rlib` only, like `wz-capi-core`: a Rust-internal seam, not an artifact anyone links from C.

[package]
name = "wz-capi-port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The port between a wz C ABI and the engine that runs its sessions: the vocabulary both name, independent of any engine."
publish = false

[lib]
name = "wz_capi_port"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
# The host: the port's lock is the process's, and the cancellation token (whose cancel blocks on a
# condition variable) is built. Without it the port is `no_std` with `alloc`, its lock is the
# critical section an MCU image links (src/sync.rs), and the token waits for the MCU host layer.
default = ["std"]
std = []
# A publish that takes a buffer of shared memory some owner of a segment holds
# (`Engine::publish_shm_on_wire_all`): the buffer's type is the session core's, behind its own
# feature. An engine that has no shared memory answers the method with the bytes.
transport-shm = ["wz-session-core/transport-shm"]

[dependencies]
# The lock of a build without `std` (src/sync.rs): the image links the implementation, as it does
# for the cooperative runtime's cells. A host build takes `std`'s lock and this crate's code is
# unused there, so it is a plain dependency rather than a feature a host build would have to name.
critical-section = "1"
# The sample view a subscriber callback reads, and the session-core types the vocabulary and the
# engine's operations are spelled in. `alloc` for the owned suffix of a key's wire form and the
# publish options; `session-matching` and `declare-interest` for `InterestForm`, which a write
# filter's declaration takes: matching and write filtering are what a zenoh-pico client does on
# every publisher, so the port has them in every build (R311y614 asks that a feature named here
# be one the port structurally needs, since it becomes every dependent's).
wz-session-core = { path = "../wz-session-core", default-features = false, features = [
    "alloc",
    "session-matching",
    "declare-interest",
] }

[lints]
workspace = true
