#
# wz-capi-pico — §5.27 api-compat-pico, Round 1.
#
# A zenoh-pico-compatible C ABI (`z_*` / `zp_*` `#[no_mangle] extern "C"`
# symbols) wrapping the wz AP `wz::runtime_tokio` `Session`. This is the
# REVERSE of the `*-sys` crates (zenoh-pico-sys / freertos-sys bind TO a C
# library); here wz EXPORTS a C ABI so a zenoh-pico C program can link the
# wz cdylib as a binary drop-in.
#
# Round 1 scope: a complete core session + pub/sub slice (config, session
# open/close, keyexpr-view, bytes/slice/string, publisher, session-put,
# subscriber + closure). Follow-up rounds add get/queryable, liveliness,
# scouting, attachments, and the full binary size-match audit for the
# publisher/subscriber owned structs (their exact layout is
# Z_FEATURE-flag dependent; R1 ships this crate's own header, so a program
# compiled against THIS header is self-consistent).
#
# crate-type = ["cdylib", "rlib"]:
#   - cdylib: the C ABI artifact a pico program links.
#   - rlib:   required so the `wz` facade can `pub use wz_capi_pico as
#             capi_pico` (a pure cdylib is not a linkable Rust dependency),
#             and so the Round-1 gate `#[test]` (tests/pubsub_roundtrip.rs)
#             can drive the exported symbols in-process.
#
# AP/std-only: no no_std obligation (the pico C ABI targets the AP profile;
# the embedded MCU FFI surface is a separate later atom).

[package]
name = "wz-capi-pico"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "zenoh-pico-compatible C ABI (cdylib) wrapping the wz AP tokio Session — a binary drop-in for zenoh-pico C programs (§5.27 api-compat-pico R1)."

[lib]
name = "wz_capi_pico"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# R311y391 (CALLER fail-fast, pico half) — off-default `unixpipe/` (Unix
# named-pipe) ACCEPT transport, forwarding wz-runtime-tokio's
# `transport-link-unixpipe`. This is a SUPERSET feature, NOT a zenoh-pico-native
# link: real zenoh-pico has no unixpipe (TCP/UDP/serial/WS/TLS/BLE/raweth), but
# the north star is a composable SUPERSET of zenoh-full + zenoh-pico (superset,
# not mirror), and wz-capi-pico is the AP-profile C ABI over the full wz runtime
# (which HAS unixpipe) -- so a pico C program can opt into a same-host unixpipe
# transport a fixed zenoh-pico binary cannot. It makes the mesh listener's CALLER
# fail-fast REACHABLE: with it, `z_open(listen="unixpipe/..")` binds a
# single-connection unixpipe listener, which `drive_listen` then rejects at bind
# (a mesh listener holds N faces; a unixpipe acceptor is 1:1 today). WITHOUT it
# the `unixpipe/` scheme still parses but `bind_locator` returns a feature-gated
# `Unsupported` at bind, so `bind_endpoint` errors before the guard. NOT enabled
# by any default; only the run-ci C1bl-style pico lane builds with it.
transport-link-unixpipe = ["wz-runtime-tokio/transport-link-unixpipe", "wz-capi-core/transport-link-unixpipe"]
# R311y406 — off-default `quic/` ACCEPT transport, forwarding wz-runtime-tokio's
# `transport-link-quic`. Unlike unixpipe, quic IS a zenoh-pico-native link (though
# stock zenoh-pico's quic is client-dial only); wz-capi-pico adds the LISTEN side
# with a server cert threaded from the native `Z_CONFIG_TLS_LISTEN_{CERTIFICATE,
# PRIVATE_KEY}_KEY` config values (zenoh feeds ONE tls block to both tls + quic).
# With it, `z_open(listen="quic/..")` + those cert keys binds a mesh quic listener
# (the --peer/--router/--router-hat demo twin, R311y405/y406); without it the
# `quic/` scheme still parses but `bind_locator` returns `Unsupported` at bind.
transport-link-quic = ["wz-runtime-tokio/transport-link-quic", "wz-capi-core/transport-link-quic"]

[lints]
workspace = true

[dependencies]
# R311y498 — the ABI-neutral session model (face registry + declaration SSOT +
# drive thread) this crate used to OWN. It moved out when the zenoh-c ABI
# arrived: two ABIs, one session model. See wz-capi-core's manifest for why
# duplicating it was the worse option.
wz-capi-core = { path = "../wz-capi-core" }
# Depend on wz-runtime-tokio DIRECTLY, not the `wz` facade: the facade
# re-exports this crate (`wz::capi_pico`), so a facade dependency here would
# form a package cycle Cargo rejects. wz-runtime-tokio's default feature
# bundle already carries the full working unicast session — the handshake
# codecs (init-body / open-body / frame / keep-alive / close), the session
# open/accept/reconnect machinery, keyexpr matching (wildcard-double /
# includes) that routes `demo/a` to a `demo/**` subscriber, declare-subscriber
# and pubsub-put. An incomplete feature set fails the handshake with a
# pre-Established Terminal, so this rides the proven default bundle; trimming
# to the exact pub/sub subset is a follow-up refinement.
#
# `routing-accept` is added explicitly because it is NOT in the default bundle
# (it is a selectable role atom, `wz-runtime-tokio/Cargo.toml`). It gates
# `wz_runtime_tokio::accept_loop`, which Round 2 needs for the pico-faithful
# LISTENER: pico's `z_open(listen)` returns immediately and then accepts up to
# `Z_LISTEN_MAX_CONNECTION_NB` = 10 CONCURRENT inbound peers into the one
# session, and the accept loop is wz's bind-once/hold-N-peers foundation. Only
# the loop itself is used here — no forwarding between faces (that is the
# sibling `routing-routes` atom); this crate passes its own `FaceForwarder`
# that lands each face in the C session's registry instead.
#
# Cargo feature unification: `routing-accept` was previously absent from the
# workspace-unified build (no default enabler), so enabling it here compiles
# `wz-runtime-tokio::accept_loop` into the shared graph for the whole workspace
# in run-ci Layer C1/C2. It is ADDITIVE (`routing-accept` only gates
# `pub mod accept_loop` and additive items, altering no other crate's existing
# code paths), matching the precedent wz-integration-tests documents for its
# storage/auth feature pins.
# `query-timeout` is selected EXPLICITLY, not inherited. The dependency edge
# runs the wrong way for us — `query-timeout = ["query-get"]`, never the
# reverse — so `query-get` alone leaves `QueryOptions::with_timeout_ms` a
# SIGNATURE-STABLE NO-OP (`session/querier.rs`). The get plane's completion
# rests entirely on that timeout: without it `timeout_ms` stays 0 ->
# `deadline_ms = None` -> the pending entry survives every sweep -> the reply
# closure's `Arc` never releases -> the C `drop(context)` (pico's completion
# signal) NEVER fires for a get to a silent peer. That failure is SILENT: the
# crate would still compile clean, and even the `get_timeout_ms` unit test
# would still pass, because it tests the mapping one layer above the loss.
# Contrast `sweep_expired_queries` / `next_reply_deadline_ms`, which are
# `#[cfg(feature = "query-get")]` and so fail LOUDLY. Today the feature arrives
# via wz-runtime-tokio's default bundle, but this crate's own note above plans
# to trim that bundle — so the plane names what it structurally requires
# instead of relying on a bundle it does not control.
# `transport-fragmentation` is selected EXPLICITLY for the same reason as
# `query-timeout` above: it is NOT in wz-runtime-tokio's default bundle, and its
# absence is SILENT at the C ABI. R311y484 measured, through a recording TCP
# relay, that without it a `z_put` above the negotiated 65535-byte batch
# produces ZERO wire bytes while `z_put` still returns `Z_OK` — the message has
# no fragmentation path, so it is dropped, and a C caller cannot tell a
# delivered put from a discarded one. `codec-fragment` IS in the default bundle,
# so the Fragment wire body was always encodable; what was missing is the TX
# gate that splits an oversize message into a chain (`wz-session-core/
# transport-fragmentation`) and the RX wiring that rejoins it (`reassembly`,
# which this feature pulls). Both halves are needed here because wz-capi-pico is
# BOTH peers in the pico topology — a C program dials with it and another
# accepts with it — so a TX-only build would fragment into a peer that cannot
# reassemble. zenoh-pico itself fragments (`Z_FRAG_MAX_SIZE`), so this is
# pico-faithful, not a superset. Gated by tests/fragmentation_roundtrip.rs,
# which publishes 200 / 65000 / 131072 / 262144 bytes through the exported
# symbols and asserts each arrives byte-identical at the subscriber closure.
# `scouting-active` is selected EXPLICITLY (R311y530): it gates
# `wz_runtime_tokio::scouting_glue`, the Scout-emit / Hello-decode drive loop the
# pico `z_scout` C ABI adapts. Without it that module does not exist and
# `z_scout` has nothing to drive -- and, unlike the silent cases above, its
# absence is a COMPILE error here rather than a runtime no-op, because this
# crate names the module directly.
# `liveliness-get` is selected EXPLICITLY, for the same class of reason as
# `query-timeout` above and with the opposite failure shape to `scouting-active`.
# It is NOT in wz-runtime-tokio's default bundle, and `Session::liveliness_get`
# is SIGNATURE-STABLE across it: without the feature the method still compiles
# and returns `LivelinessGetError::FeatureDisabled` at runtime. So a build that
# forgot it would export `z_liveliness_get`, link `z_get_liveliness.c`, run it,
# and report an empty snapshot — indistinguishable from "no tokens are alive".
# Gated by the upstream `z_get_liveliness.c` leg, which asserts a token DECLARED
# by a real zenoh-pico peer comes back.
# The `ext-pubsub-advanced-*` trio is selected for the `ze_advanced_*` C ABI
# (`src/advanced.rs`). Like `scouting-active` and unlike the silent-no-op cases
# above, their absence is a COMPILE error here — that module names
# `AdvancedPublisherOptions` / `AdvancedSubscriberOptions` and the `@adv` config
# types directly. They are pico-NATIVE, not a superset:
# `Z_FEATURE_ADVANCED_PUBLICATION` / `_SUBSCRIPTION` are both 1 in the pinned
# pico CMake config, so upstream's `z_advanced_pub.c` / `z_advanced_sub.c`
# compile their advanced half unconditionally and a drop-in must export it.
wz-runtime-tokio = { path = "../wz-runtime-tokio", features = [
    "routing-accept",
    "query-timeout",
    "transport-fragmentation",
    "scouting-active",
    "liveliness-get",
    "ext-pubsub-advanced-publisher",
    "ext-pubsub-advanced-history",
    "ext-pubsub-sample-miss-detection",
] }

# Per-session zid entropy. zenoh identifies a PEER by its zid, so two sessions
# sharing one are the SAME peer on the wire — a listener would dedup/aggregate
# them instead of holding two faces. pico generates a random `Z_ZID_LENGTH` = 16
# byte zid per session when the config carries no explicit one
# (`~/zenoh-pico/src/api/api.c:846-855`). `getrandom` is the same OS-entropy
# source wz-runtime-tokio already uses AP-side for signing-key entropy.
getrandom = "0.2"

# R311y478 — the pico PLATFORM surface (z_malloc / z_free / z_clock_* ) forwards
# to libc rather than reimplementing it. `z_malloc` and `z_free` MUST be the C
# allocator so a program may mix them with plain malloc/free on one pointer
# (pico defines them as exactly that), and `CLOCK_MONOTONIC` differs per
# platform (1 on Linux, 6 on macOS), so hand-writing the constant would be a
# portability bug. Already in this workspace's graph — wz-runtime-tokio deps it
# optionally — so this adds no new third-party crate.
libc = "0.2"

[dependencies.tokio]
version = "1"
default-features = false
features = ["rt-multi-thread", "sync", "macros"]

# R311y406 — the sibling fixture crate (DEV-only), for the quic-listen cert
# discriminator's self-signed `localhost` cert. Never enters a `cargo build` (only
# `cargo test` unifies it); no cycle (test-support -> wz-runtime-tokio, not -> pico).
[dev-dependencies]
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support", features = [
    "tls-fixtures",
] }
