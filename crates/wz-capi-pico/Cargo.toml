# SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael
#
# wz-capi-pico — §5.27 api-compat-pico, Round 1.
#
# A zenoh-pico-compatible C ABI (`z_*` / `zp_*` `#[no_mangle] extern "C"`
# symbols) wrapping the wz AP `wz::runtime_tokio` `Session`. This is the
# REVERSE of the `*-sys` crates (zenoh-pico-sys / freertos-sys bind TO a C
# library); here wz EXPORTS a C ABI so a zenoh-pico C program can link the
# wz cdylib as a binary drop-in.
#
# Round 1 scope: a complete core session + pub/sub slice (config, session
# open/close, keyexpr-view, bytes/slice/string, publisher, session-put,
# subscriber + closure). Follow-up rounds add get/queryable, liveliness,
# scouting, attachments, and the full binary size-match audit for the
# publisher/subscriber owned structs (their exact layout is
# Z_FEATURE-flag dependent; R1 ships this crate's own header, so a program
# compiled against THIS header is self-consistent).
#
# crate-type = ["cdylib", "rlib"]:
#   - cdylib: the C ABI artifact a pico program links.
#   - rlib:   required so the `wz` facade can `pub use wz_capi_pico as
#             capi_pico` (a pure cdylib is not a linkable Rust dependency),
#             and so the Round-1 gate `#[test]` (tests/pubsub_roundtrip.rs)
#             can drive the exported symbols in-process.
#
# AP/std-only: no no_std obligation (the pico C ABI targets the AP profile;
# the embedded MCU FFI surface is a separate later atom).

[package]
name = "wz-capi-pico"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "zenoh-pico-compatible C ABI (cdylib) wrapping the wz AP tokio Session — a binary drop-in for zenoh-pico C programs (§5.27 api-compat-pico R1)."

[lib]
name = "wz_capi_pico"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# R2103 (open-debt item 521) — build.rs gives the cdylib its SONAME. Without
# one, a pico program that links this artifact by path records that absolute
# build-time path in DT_NEEDED and cannot redistribute what it built.
[build-dependencies]
wz-cdylib-build = { path = "../wz-cdylib-build" }

[features]
# The serial drive runs the session runtime on its own thread alone (round trip
# 15 -> 12 us on the loopback ping/pong, no worker-thread hop). Default on;
# build with `--no-default-features` for the multi-thread runtime, or set
# WZ_CAPI_WORKER_THREADS at run time (see wz-capi-core's feature of this name).
default = [
    "engine-tokio",
    "serial-drive-own-thread",
    "rx-busy-poll",
    "link-udp",
    "peer",
    "multicast-transport",
    "scout",
    "query",
    "queryable",
    "liveliness",
    "liveliness-get",
    "advanced",
    "gossip",
    "multi-thread",
    "unstable-api",
    "connectivity",
]
# The ENGINE that runs a session (`docs/capi-pico-on-coop-engine.md`, decisions D1 and D4).
#
# `engine-tokio`: `wz-capi-core`, a session on its own OS thread and tokio runtime. It carries
# every capability below, so each capability that only it has selects it.
#
# `engine-coop`: `wz-capi-coop`, one session the program steps with `zp_read` and
# `zp_spin_once`, as zenoh-pico's single-threaded arm does, and a read task that is a thread
# stepping it. It has the client's pub/sub surface (`z_open` dialling `tcp/` or `udp/`, the
# publisher, the subscriber, key expressions, write filters, batching) over the host's sockets.
#
# A build runs its sessions on the tokio engine whenever that engine is in it, and on the
# cooperative one otherwise: a build that names `engine-coop` and no capability the cooperative
# engine lacks is the cooperative client. The selection reads features, not a config key, because
# what an engine does not have is not linked.
engine-tokio = ["dep:wz-capi-core", "dep:tokio"]
engine-coop = ["dep:wz-capi-coop", "dep:wz-runtime-posix"]
# The capabilities pico's own CMake switches name (`Z_FEATURE_QUERY`, `Z_FEATURE_QUERYABLE`,
# `Z_FEATURE_LIVELINESS`, `Z_FEATURE_ADVANCED_PUBLICATION` / `_SUBSCRIPTION`), each one feature
# of this crate: on in a default build, so the drop-in exports what the reference build does,
# and off for a deployer who wants the textbook minimum. A capability that is off is not
# linked: the session model and the runtime plane behind it are not compiled in either
# (`wz-capi-core` is taken without its default features, so each capability reaches it only
# through the feature below).
#
# `peer`: the roles beyond the client's: `z_open` with a `listen` endpoint, or in `mode=peer`,
# which accept the sessions of others. A build without it opens a client session to the
# endpoints it is given and refuses a config that asks for more. This is a stronger cut than
# pico's `Z_FEATURE_UNICAST_PEER`, which leaves a lone listener in and takes out only the
# combined listen and connect and a second connect locator.
peer = ["engine-tokio", "scout", "wz-capi-core/peer"]
# `multicast-transport` (`Z_FEATURE_MULTICAST_TRANSPORT` with `Z_FEATURE_LINK_UDP_MULTICAST`,
# open-debt item 913): `z_open` with a `listen` endpoint `udp/<group>:<port>#iface=<if>` joins
# that group as the session's one transport, as pico's listen of a UDP endpoint with an
# interface does (`vendor/zenoh-pico/src/link/multicast/udp.c` @
# `z_result_t _z_endpoint_udp_multicast_valid(`). A build without it refuses that config.
multicast-transport = ["engine-tokio", "link-udp", "peer", "wz-capi-core/multicast-transport"]
# Open-debt item 913 — pico's `Z_FEATURE_MULTICAST_DECLARATIONS` (vendor default 0), off here
# as there.
multicast-declarations = [
    "engine-tokio",
    "multicast-transport",
    "wz-capi-core/multicast-declarations",
]
# Open-debt item 911 — pico's `Z_FEATURE_RAWETH_TRANSPORT` (vendor default 0): `z_open` with a
# `listen` endpoint `reth/<mac>#...` joins a group over raw Ethernet as the session's one
# transport, as pico opens its raweth transport. Off here as there.
raweth-transport = ["engine-tokio", "multicast-transport", "wz-capi-core/raweth-transport"]
# `link-udp` (`Z_FEATURE_LINK_UDP_UNICAST`): a `udp/` endpoint to dial. `scout` implies it, the
# scouting group being a UDP one. The cooperative engine dials UDP in every build, so this
# selects no engine.
link-udp = ["wz-capi-core?/link-udp"]
# `scout` (`Z_FEATURE_SCOUTING`): `z_scout`, the one-shot survey of the group and the
# `z_hello` family that reads its answers.
scout = ["engine-tokio", "link-udp", "wz-capi-core/scout"]
# `query`: `z_get` and the querier, the requesting end of a query.
query = ["engine-tokio", "wz-capi-core/query"]
# `queryable`: `z_declare_queryable` and the replies, the answering end of a query.
queryable = ["engine-tokio", "wz-capi-core/queryable"]
# `liveliness`: the token and the subscriber.
liveliness = ["engine-tokio", "wz-capi-core/liveliness"]
# `liveliness-get`: the snapshot get of the liveliness plane. It is a query, so it needs the
# requesting end of one; the get half is `wz-capi-core`'s `liveliness-get` (its drive loop
# sweeps the get deadlines) and the runtime's feature behind it.
liveliness-get = ["engine-tokio", "liveliness", "query", "wz-capi-core/liveliness-get"]
# `advanced`: the advanced publisher and subscriber and the plane they replay through.
# It implies `liveliness`, because an advanced subscriber's publisher detection is a liveliness
# subscription declared through the liveliness plane, and `queryable`, because the publisher's
# cache is a queryable. And `unstable-api`, because pico declares the whole advanced API inside
# `#ifdef Z_FEATURE_UNSTABLE_API` and its CMake forces the switch off without it.
advanced = ["engine-tokio", "liveliness", "queryable", "unstable-api", "wz-capi-core/advanced"]
# `admin-space` (`Z_FEATURE_ADMIN_SPACE`, off as upstream's is): `zp_start_admin_space` /
# `zp_stop_admin_space`, the queryable that answers pico's `@/<zid>/pico/**` documents, and the
# `auto_start_admin_space` flag of the open options. Upstream refuses the switch without
# `Z_FEATURE_QUERYABLE` (`vendor/zenoh-pico/CMakeLists.txt` @
# `if(Z_FEATURE_ADMIN_SPACE AND NOT Z_FEATURE_QUERYABLE)`), so it implies `queryable`, and
# forces it off without the unstable API, so it implies `unstable-api`.
admin-space = ["engine-tokio", "queryable", "unstable-api", "wz-capi-core/admin-space"]
# `local-subscriber` / `local-queryable` (`Z_FEATURE_LOCAL_SUBSCRIBER`, `Z_FEATURE_LOCAL_QUERYABLE`,
# off as upstream's are): a session's own put reaches its own subscribers, and its own get its own
# queryables, inside the call and on the calling thread, as pico delivers them
# (`vendor/zenoh-pico/src/session/loopback.c` @ `_z_session_deliver_push_locally`). The option
# structs gain the `allowed_origin` / `allowed_destination` fields those switches add, so a
# program compiled with them links a build that has them; a publisher's and a querier's write
# filter and matching status count the session's own entities.
local-subscriber = ["engine-tokio", "wz-capi-core/local-subscriber"]
local-queryable = ["engine-tokio", "wz-capi-core/local-queryable"]
# `unstable-api` (`Z_FEATURE_UNSTABLE_API`, on in the reference build and off in upstream's
# default): the entity ids (`z_session_id`, `z_publisher_id`, ...), the sample's reliability and
# source info, `z_reliability_default`, `z_bytes_get_contiguous_view`, `z_reply_replier_id`, the
# cancellation token, and the option fields that carry them (`reliability`, `source_info`,
# `cancellation_token`). Off, those fields are not in the option structs a program allocates,
# which are then the smaller structs pico's default header declares.
unstable-api = ["engine-tokio", "wz-capi-core/unstable-api"]
# `connectivity` (`Z_FEATURE_CONNECTIVITY`): the transport and link snapshots and the event
# listeners of pico's connectivity plane. Upstream declares it only with the unstable API.
connectivity = ["engine-tokio", "unstable-api", "wz-capi-core/connectivity"]
# `gossip`: a session that is told of a node by one it holds a link to dials it (see the
# runtime's feature of the same name). Pico itself has no such plane.
gossip = ["engine-tokio", "peer", "wz-capi-core/gossip"]
# `multi-thread` (`Z_FEATURE_MULTI_THREAD`, on as upstream's is): which of pico's two header arms
# this library is the drop-in for. On: the read and lease task doors (`zp_start_read_task`, ...),
# the host mutex, condvar and task (`z_mutex_*`, `z_condvar_*`, `z_task_*`), the three-field
# `z_open_options_t`, and channel collections that block. Off: the single-threaded entry points
# (`zp_read`, `zp_send_keep_alive`, `zp_send_join`, `zp_spin_once`), a one-byte
# `z_open_options_t`, and channel collections that never block, sized as that arm's header sizes
# them. The two arms disagree on struct sizes the C program allocates, so a program must link the
# build of the arm it compiled against. The tokio engine drives a session on its own runtime in
# both; the cooperative engine is stepped by the program in the single-threaded arm and by its
# read task in the multi-threaded one, so this selects no engine.
multi-thread = ["wz-capi-core?/multi-thread"]
serial-drive-own-thread = ["engine-tokio", "wz-capi-core/serial-drive-own-thread"]
# Receive busy-poll: on in a default build through wz-capi-core's own default, and named here so a
# build that lists its features can say so; see wz-capi-core's feature of this name.
rx-busy-poll = ["engine-tokio", "wz-capi-core/rx-busy-poll"]
# R311y391 (CALLER fail-fast, pico half) — off-default `unixpipe/` (Unix
# named-pipe) ACCEPT transport, forwarding wz-runtime-tokio's
# `transport-link-unixpipe`. This is a SUPERSET feature, NOT a zenoh-pico-native
# link: real zenoh-pico has no unixpipe (TCP/UDP/serial/WS/TLS/BLE/raweth), but
# the north star is a composable SUPERSET of zenoh-full + zenoh-pico (superset,
# not mirror), and wz-capi-pico is the AP-profile C ABI over the full wz runtime
# (which HAS unixpipe) -- so a pico C program can opt into a same-host unixpipe
# transport a fixed zenoh-pico binary cannot. It makes the mesh listener's CALLER
# fail-fast REACHABLE: with it, `z_open(listen="unixpipe/..")` binds a
# single-connection unixpipe listener, which `drive_listen` then rejects at bind
# (a mesh listener holds N faces; a unixpipe acceptor is 1:1 today). WITHOUT it
# the `unixpipe/` scheme still parses but `bind_locator` returns a feature-gated
# `Unsupported` at bind, so `bind_endpoint` errors before the guard. NOT enabled
# by any default; only the run-ci C1bl-style pico lane builds with it.
transport-link-unixpipe = ["engine-tokio", "wz-capi-core/transport-link-unixpipe"]
# R311y406 — off-default `quic/` ACCEPT transport, forwarding wz-runtime-tokio's
# `transport-link-quic`. Unlike unixpipe, quic IS a zenoh-pico-native link (though
# stock zenoh-pico's quic is client-dial only); wz-capi-pico adds the LISTEN side
# with a server cert threaded from the native `Z_CONFIG_TLS_LISTEN_{CERTIFICATE,
# PRIVATE_KEY}_KEY` config values (zenoh feeds ONE tls block to both tls + quic).
# With it, `z_open(listen="quic/..")` + those cert keys binds a mesh quic listener
# (the --peer/--router/--router-hat demo twin, R311y405/y406); without it the
# `quic/` scheme still parses but `bind_locator` returns `Unsupported` at bind.
transport-link-quic = ["engine-tokio", "wz-capi-core/transport-link-quic"]
# R311y534 — the `tls/` link, dial AND accept. Unlike unixpipe this is
# zenoh-pico-native on BOTH sides (its `z_pub_tls.c` / `z_sub_tls.c` each take
# `-e tls/...` and `-l tls/...`), and it is what the §5.27 api-compat-pico
# drop-in legs for those two programs run on: with it, `z_open` resolves pico's
# twelve `Z_CONFIG_TLS_*` keys into real dial/accept material; without it the
# `tls/` scheme still parses but bind and dial return a feature-gated
# `Unsupported`, so the keys are inert rather than misleading.
transport-link-tls = ["engine-tokio", "wz-capi-core/transport-link-tls"]
# The `ws/` link, dial and accept: zenoh-pico's `Z_FEATURE_LINK_WS` (default 0; upstream builds
# it only for emscripten, while this ABI runs on a host runtime). With it a `ws/` endpoint under
# `Z_CONFIG_CONNECT_KEY` or `Z_CONFIG_LISTEN_KEY` dials or binds; without it the scheme still
# parses and the dial or bind fails the open with the runtime's typed `Unsupported`.
transport-link-ws = ["engine-tokio", "wz-capi-core/transport-link-ws"]
# The `serial/<device>#baudrate=<n>` link, dial and accept: zenoh-pico's
# `Z_FEATURE_LINK_SERIAL` (default 0). The listener serves one peer at a time, as one line
# carries one; the dial runs the serial-link handshake before the session's. Without it the
# open fails the way a `ws/` one does without its feature.
transport-link-serial = ["engine-tokio", "wz-capi-core/transport-link-serial"]

# The tests of a capability exist only where the capability does: a build that leaves the
# plane out has no symbol for them to call, so they are not compiled there (and not run).
#
# Every test below meets its session through a listener of this same library (a router is not
# a thing a unit test can start), so each needs `peer` beside what it exercises. A build
# without `peer` is covered by `client_only_refuses_a_listener`, which runs only there.
[[test]]
name = "advanced_subscriber_faces"
required-features = ["peer", "advanced"]

# It drives the advanced publisher, the liveliness subscriber and a get together.
[[test]]
name = "pubsub_roundtrip"
required-features = ["peer", "advanced", "query"]

[[test]]
name = "liveliness_face_death"
required-features = ["peer", "liveliness"]

[[test]]
name = "get_roundtrip"
required-features = ["peer", "query"]

# These ask with a get or a querier and answer with a queryable, so they need both ends.
[[test]]
name = "querier_declared_encoding_roundtrip"
required-features = ["peer", "query", "queryable"]

[[test]]
name = "reply_err_options_roundtrip"
required-features = ["peer", "query", "queryable"]

[[test]]
name = "reply_options_roundtrip"
required-features = ["peer", "query", "queryable", "unstable-api"]

[[test]]
name = "remote_only_queryable"
required-features = ["peer", "query", "queryable"]

[[test]]
name = "matching_multiface"
required-features = ["peer", "query", "queryable"]

[[test]]
name = "queryable_roundtrip"
required-features = ["peer", "query", "queryable"]

# A peer's get asks the admin space of the session it dialled.
[[test]]
name = "admin_space_roundtrip"
required-features = ["peer", "query", "admin-space"]

[[test]]
name = "blocking_callback_keeps_session"
required-features = ["peer"]

# A closed session's publisher and querier, over a listening session.
[[test]]
name = "session_check"
required-features = ["peer", "query"]

# A session's own put and get reach its own subscriber and queryable, inside the call.
[[test]]
name = "local_delivery"
required-features = ["peer", "query", "queryable", "local-subscriber", "local-queryable"]

[[test]]
name = "connectivity_events"
required-features = ["peer", "connectivity"]

[[test]]
name = "fragmentation_roundtrip"
required-features = ["peer"]

[[test]]
name = "listen_and_connect"
required-features = ["peer"]

[[test]]
name = "listener_multipeer"
required-features = ["peer"]

[[test]]
name = "payload_release"
required-features = ["peer"]

[[test]]
name = "publisher_declared_options_roundtrip"
required-features = ["peer", "unstable-api"]

[[test]]
name = "put_source_info_roundtrip"
required-features = ["peer", "unstable-api"]

[[test]]
name = "quic_listen_cert"
required-features = ["peer"]

[[test]]
name = "remote_only_local_delivery"
required-features = ["peer"]

[[test]]
name = "teardown_drain"
required-features = ["peer"]

[[test]]
name = "unixpipe_listen_multiclient"
required-features = ["peer"]

# One sample across each forwarded link; each file is also `cfg`'d on its link feature.
[[test]]
name = "ws_link_roundtrip"
required-features = ["peer"]

[[test]]
name = "serial_link_roundtrip"
required-features = ["peer"]

# The node that `client_only_dials_a_listener` dials: a build that cannot listen needs one of
# the full build to talk to.
[[example]]
name = "hold_a_listener"
required-features = ["peer"]

[lints]
workspace = true

[dependencies]
# The ABI stamp this artifact carries as an ELF note (`src/revision.rs`).
wz-abi-stamp = { path = "../wz-abi-stamp" }
# R311y498 — the ABI-neutral session model (face registry + declaration SSOT +
# drive thread) this crate used to OWN. It moved out when the zenoh-c ABI
# arrived: two ABIs, one session model. See wz-capi-core's manifest for why
# duplicating it was the worse option.
wz-capi-core = { path = "../wz-capi-core", default-features = false, optional = true }
# The cooperative engine (`engine-coop`), over the host's sockets and clock
# (`wz-runtime-posix`). Its runtime's critical sections are a lock of the process (the
# engine selects the runtime's `host-lock`), so this library links no `critical-section`
# implementation and exports nothing beside its C ABI.
wz-capi-coop = { path = "../wz-capi-coop", optional = true }
wz-runtime-posix = { path = "../wz-runtime-posix", optional = true }
# The session core's own types (key expression canon and matching, QoS, locality, samples, the
# sinks), named where they live and not through the tokio engine's re-exports of them: the ABI
# layer knows no engine, and the engine this crate drives is a selection
# (`docs/capi-pico-on-coop-engine.md`, decision D1). `alloc` is what those modules need; the
# engine's own dependency on this crate unifies the rest.
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["alloc"] }
# The wire vocabulary the ABI layer exports over: the encoding id table and the VLE codec of the
# serialization format, named where they live for the reason above. Nothing named: both modules
# are ungated, and a feature named here would become every dependent's (R311y614).
wz-codecs = { path = "../wz-codecs", default-features = false }
# The port between this ABI and the engine that runs its sessions: the vocabulary both name
# (ids, callback factories, a key's wire form, the write filter's plane and answer), so the ABI
# layer is spelled in no engine's types (docs/capi-pico-on-coop-engine.md, D1).
wz-capi-port = { path = "../wz-capi-port" }
# The tokio RUNTIME is not a dependency of this crate: it is the tokio engine's
# (`wz-capi-core`), and the modules of the capabilities only that engine has reach
# it through the engine, as `wz_capi_core::runtime`. An ABI depends on its engines,
# never on a runtime of its own (docs/capi-pico-on-coop-engine.md, D1), and the
# runtime's crate then has one puller in the catalog, the `runtime-tokio` atom whose
# code it is. What every session needs of it (the codecs, the open, reconnect,
# fragmentation) is the engine's base feature list; what a capability needs is that
# capability's feature here, forwarding to the engine's. The notes below record why
# each runtime feature a pico build needs is named where it is; the features named
# `wz-runtime-tokio/...` in them now sit in wz-capi-core.
#
# `routing-accept` is added explicitly because it is NOT in the default bundle
# (it is a selectable role atom, `wz-runtime-tokio/Cargo.toml`). It gates
# `wz_runtime_tokio::accept_loop`, which Round 2 needs for the pico-faithful
# LISTENER: pico's `z_open(listen)` returns immediately and then accepts up to
# `Z_LISTEN_MAX_CONNECTION_NB` = 10 CONCURRENT inbound peers into the one
# session, and the accept loop is wz's bind-once/hold-N-peers foundation. Only
# the loop itself is used here — no forwarding between faces (that is the
# sibling `routing-routes` atom); this crate passes its own `FaceForwarder`
# that lands each face in the C session's registry instead.
#
# Cargo feature unification: `routing-accept` was previously absent from the
# workspace-unified build (no default enabler), so enabling it here compiles
# `wz-runtime-tokio::accept_loop` into the shared graph for the whole workspace
# in run-ci Layer C1/C2. It is ADDITIVE (`routing-accept` only gates
# `pub mod accept_loop` and additive items, altering no other crate's existing
# code paths), matching the precedent wz-integration-tests documents for its
# storage/auth feature pins.
# `query-timeout` is selected EXPLICITLY, not inherited. The dependency edge
# runs the wrong way for us — `query-timeout = ["query-get"]`, never the
# reverse — so `query-get` alone leaves `QueryOptions::with_timeout_ms` a
# SIGNATURE-STABLE NO-OP (`session/querier.rs`). The get plane's completion
# rests entirely on that timeout: without it `timeout_ms` stays 0 ->
# `deadline_ms = None` -> the pending entry survives every sweep -> the reply
# closure's `Arc` never releases -> the C `drop(context)` (pico's completion
# signal) NEVER fires for a get to a silent peer. That failure is SILENT: the
# crate would still compile clean, and even the `get_timeout_ms` unit test
# would still pass, because it tests the mapping one layer above the loss.
# Contrast `sweep_expired_queries` / `next_reply_deadline_ms`, which are
# `#[cfg(feature = "query-get")]` and so fail LOUDLY. Today the feature arrives
# via wz-runtime-tokio's default bundle, but this crate's own note above plans
# to trim that bundle — so the plane names what it structurally requires
# instead of relying on a bundle it does not control.
# `transport-fragmentation` is selected EXPLICITLY for the same reason as
# `query-timeout` above: it is NOT in wz-runtime-tokio's default bundle, and its
# absence is SILENT at the C ABI. R311y484 measured, through a recording TCP
# relay, that without it a `z_put` above the negotiated 65535-byte batch
# produces ZERO wire bytes while `z_put` still returns `Z_OK` — the message has
# no fragmentation path, so it is dropped, and a C caller cannot tell a
# delivered put from a discarded one. `codec-fragment` IS in the default bundle,
# so the Fragment wire body was always encodable; what was missing is the TX
# gate that splits an oversize message into a chain (`wz-session-core/
# transport-fragmentation`) and the RX wiring that rejoins it (`reassembly`,
# which this feature pulls). Both halves are needed here because wz-capi-pico is
# BOTH peers in the pico topology — a C program dials with it and another
# accepts with it — so a TX-only build would fragment into a peer that cannot
# reassemble. zenoh-pico itself fragments (`Z_FRAG_MAX_SIZE`), so this is
# pico-faithful, not a superset. Gated by tests/fragmentation_roundtrip.rs,
# which publishes 200 / 65000 / 131072 / 262144 bytes through the exported
# symbols and asserts each arrives byte-identical at the subscriber closure.
# `scouting-active` is selected EXPLICITLY (R311y530): it gates
# `wz_runtime_tokio::scouting_glue`, the Scout-emit / Hello-decode drive loop the
# pico `z_scout` C ABI adapts. Without it that module does not exist and
# `z_scout` has nothing to drive -- and, unlike the silent cases above, its
# absence is a COMPILE error here rather than a runtime no-op, because this
# crate names the module directly.
# `liveliness-get` is selected EXPLICITLY, for the same class of reason as
# `query-timeout` above and with the opposite failure shape to `scouting-active`.
# It is NOT in wz-runtime-tokio's default bundle, and `Session::liveliness_get`
# is SIGNATURE-STABLE across it: without the feature the method still compiles
# and returns `LivelinessGetError::FeatureDisabled` at runtime. So a build that
# forgot it would export `z_liveliness_get`, link `z_get_liveliness.c`, run it,
# and report an empty snapshot — indistinguishable from "no tokens are alive".
# Gated by the upstream `z_get_liveliness.c` leg, which asserts a token DECLARED
# by a real zenoh-pico peer comes back.
# The `ext-pubsub-advanced-*` trio is selected for the `ze_advanced_*` C ABI
# (`src/advanced.rs`). Like `scouting-active` and unlike the silent-no-op cases
# above, their absence is a COMPILE error here — that module names
# `AdvancedPublisherOptions` / `AdvancedSubscriberOptions` and the `@adv` config
# types directly. They are pico-NATIVE, not a superset:
# `Z_FEATURE_ADVANCED_PUBLICATION` / `_SUBSCRIPTION` are both 1 in the pinned
# pico CMake config, so upstream's `z_advanced_pub.c` / `z_advanced_sub.c`
# compile their advanced half unconditionally and a drop-in must export it.
#
# The dependency takes NO default features: the runtime's default bundle names every plane
# (query, liveliness, ...) and would make each of them this ABI's whatever its features say.
# What every session is made of comes through `wz-capi-core`, and each capability through the
# feature of this crate that forwards to the core's. Three of the features the notes above
# justify are therefore no longer named here, because the capability that needs them names
# them: `query-timeout` is part of `wz-capi-core/query` (a get without it keeps no deadline,
# the silent shape described above), and `reply-source-info` is part of
# `wz-capi-core/queryable` (R311y562: `z_query_reply_options_t` declares a `source_info`, and
# without the emit gate it is read, staged and silently dropped at the codec, measured by
# `tests/reply_options_roundtrip.rs`). `liveliness-get` is `wz-capi-core/liveliness-get`, and
# `transport-fragmentation` is in the engine's base list, which both drop-ins share.

# Per-session zid entropy. zenoh identifies a PEER by its zid, so two sessions
# sharing one are the SAME peer on the wire — a listener would dedup/aggregate
# them instead of holding two faces. pico generates a random `Z_ZID_LENGTH` = 16
# byte zid per session when the config carries no explicit one
# (`~/zenoh-pico/src/api/api.c:846-855`). `getrandom` is the same OS-entropy
# source wz-runtime-tokio already uses AP-side for signing-key entropy.
getrandom = "0.2"

# R311y478 — the pico PLATFORM surface (z_malloc / z_free / z_clock_* ) forwards
# to libc rather than reimplementing it. `z_malloc` and `z_free` MUST be the C
# allocator so a program may mix them with plain malloc/free on one pointer
# (pico defines them as exactly that), and `CLOCK_MONOTONIC` differs per
# platform (1 on Linux, 6 on macOS), so hand-writing the constant would be a
# portability bug. Already in this workspace's graph — wz-runtime-tokio deps it
# optionally — so this adds no new third-party crate.
libc = "0.2"

# The Windows host layer (`src/os/windows.rs`). pico's own Windows backend types its
# mutex as SRWLOCK, its condvar as CONDITION_VARIABLE, its clock as a performance
# counter and its task as a thread HANDLE, so wz's exports over those bytes call the
# same Win32 functions: libc carries none of them. Already in this workspace's graph
# (the async runtime reaches it), so this adds no new third-party crate; each feature
# below is one namespace the file calls into, and nothing else is enabled.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
]

[dependencies.tokio]
version = "1"
default-features = false
features = ["rt-multi-thread", "sync", "macros"]
optional = true

# R311y406 — the sibling fixture crate (DEV-only), for the quic-listen cert
# discriminator's self-signed `localhost` cert. Never enters a `cargo build` (only
# `cargo test` unifies it); no cycle (test-support -> wz-runtime-tokio, not -> pico).
[dev-dependencies]
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support", features = [
    "tls-fixtures",
] }
# The tests drive the runtime's own sessions beside the C ABI's (a wz peer, a router); the
# library itself reaches the runtime only through its engine, `wz_capi_core::runtime`.
wz-runtime-tokio = { path = "../wz-runtime-tokio", default-features = false }
