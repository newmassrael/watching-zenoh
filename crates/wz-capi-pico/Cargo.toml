#
# wz-capi-pico — §5.27 api-compat-pico, Round 1.
#
# A zenoh-pico-compatible C ABI (`z_*` / `zp_*` `#[no_mangle] extern "C"`
# symbols) over the wz session engines (`os-host` by default). This is the
# REVERSE of the `*-sys` crates (zenoh-pico-sys / freertos-sys bind TO a C
# library); here wz EXPORTS a C ABI so a zenoh-pico C program can link the
# wz library as a binary drop-in.
#
# Round 1 scope: a complete core session + pub/sub slice (config, session
# open/close, keyexpr-view, bytes/slice/string, publisher, session-put,
# subscriber + closure). Follow-up rounds add get/queryable, liveliness,
# scouting, attachments, and the full binary size-match audit for the
# publisher/subscriber owned structs (their exact layout is
# Z_FEATURE-flag dependent; R1 ships this crate's own header, so a program
# compiled against THIS header is self-consistent).
#
# crate-type = ["rlib"]: the `wz` facade (`pub use wz_capi_pico as capi_pico`) and the
# tests drive the exported symbols in-process, and they link `std`. The library a C program
# links is `wz-capi-pico-lib`, the artifact of this rlib (`libwz_capi_pico.so`, `.a`), which
# defines what a program without `std` needs (the global allocator, the panic handler) and so
# cannot be the rlib a `std` program links.
#
# The crate is `no_std` with `alloc` outside its tests in every build but the tokio engine's,
# on a host (`os-host`) and on an MCU (`os-zephyr`, docs/upstream-parity.md section 5a).

[package]
name = "wz-capi-pico"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "zenoh-pico-compatible C ABI (cdylib) over the wz cooperative session engine — a binary drop-in for zenoh-pico C programs (§5.27 api-compat-pico R1)."

# The configurations the crate can hold at once, which Layers C1bf and C1bz build in place of
# `--all-features` (`scripts/lib/doc_feature_sets.py`). A library has one engine and is for one
# system (`src/lib.rs`), so the tokio engine's set gives up both cooperative systems, the host's
# set gives up the tokio engine and the Zephyr image, and the image's set gives up the tokio engine,
# the host and every capability `src/lib.rs` refuses beside `os-zephyr` alone: the host's
# multicast scouting (and so `peer` and `multicast-transport`, which bring it), the planes that
# need a host's lock, clock or threads, and the links over the host's own sockets, ttys and FIFOs.
[package.metadata.wz-docs]
feature-sets = [
    { name = "tokio", except = ["os-host", "os-zephyr"] },
    { name = "host", except = ["engine-tokio", "os-zephyr"] },
    { name = "zephyr", except = [
        "engine-tokio",
        "os-host",
        "scout",
        "advanced",
        "admin-space",
        "clock-source",
        "e2e-receiver",
        "e2e-sender",
        "e2e-supervision",
        "event-ring",
        "instance-key",
        "message-catalog",
        "raweth-transport",
        "replay-cache",
        "resource-snapshot",
        "segment-sender",
        "supervision",
        "time-base",
        "transport-link-serial",
        "transport-link-unixpipe",
        "transport-link-ws",
    ] },
]

[lib]
name = "wz_capi_pico"
path = "src/lib.rs"
crate-type = ["rlib"]

# The conformance digest of the build (`build.rs`). The SONAME is the artifact's
# (`wz-capi-pico-lib/build.rs`).
[build-dependencies]
wz-conformance-build = { path = "../wz-conformance-build" }

[features]
# The default build is the zenoh-pico preset on the cooperative engine (docs/c-abi-engine-and-memory.md,
# E1 and P1): every capability of pico's default build, and the wz-own planes the preset turns on,
# over `os-host`. The tokio engine is built by naming it without the default features
# (`--no-default-features --features engine-tokio,serial-drive-own-thread,rx-busy-poll,...`,
# `wz_config.py --bench-cargo-args tokio` prints the list), until phase P5 takes it out of the C
# library. `gossip` is off in the preset (decision Q7): it runs only on the tokio engine today.
default = [
    "os-host",
    "link-udp",
    "peer",
    "multicast-transport",
    "scout",
    "query",
    "queryable",
    "liveliness",
    "liveliness-get",
    "advanced",
    "multi-thread",
    "unstable-api",
    "connectivity",
    "config-policy",
    "conformance-digest",
    "device-requires",
]
# The ENGINE that runs a session (`docs/capi-pico-on-coop-engine.md`, decisions D1 and D4).
#
# `engine-tokio`: `wz-capi-core`, a session on its own OS thread and tokio runtime. It carries
# every capability below, so each capability that only it has selects it. It is the one build of
# this crate that links `std` outside its tests (the tokio form, given no budget, leaves the C
# library in phase P5 of `docs/c-abi-engine-and-memory.md`), so it names the host halves of the
# port, the locks and the clocks that `std` answers.
#
# The cooperative engine (`wz-capi-coop`, one session the program steps with `zp_read` and
# `zp_spin_once` and a read task that is a thread stepping it) is named by the system it runs on:
# `os-host` on a POSIX host or Windows, `os-zephyr` in a Zephyr image. A library has one engine
# (`docs/c-abi-engine-and-memory.md`, E1 and E3): a build that names `engine-tokio`, or a
# capability only the tokio engine runs, beside either is refused by name (`src/lib.rs`), and so
# is a build that names none. The cooperative forms read and send only what the session lends
# (`wz-session-core/rx-lent-only`, `wz-capi-coop/tx-lend-only`), so the C library has no
# heap-backed form beside the no-heap one, and `wz-runtime-tokio` refuses to be built beside those
# selectors. The session core is told its engine lends the bytes of the parameters bound at the
# open from the session's arena (`wz-session-core/limits-lent-at-open`) and keeps a session's
# declared key expressions on the session for every link (`session-keeps-keyexprs`).
engine-tokio = [
    "dep:wz-capi-core",
    "dep:tokio",
    "dep:wz-host-sync",
    "wz-host-sync/std",
    "wz-capi-port/std",
    "wz-ext-pubsub?/std",
    "wz-node-time?/std",
]
# `os-zephyr`: the library in a Zephyr image, without `std`: the cooperative engine over Zephyr's
# own sockets, kernel tick and random source (`wz-runtime-zephyr`, `src/coop_host.rs`), the host
# layer of `src/os/zephyr.rs` under the platform exports (the kernel heap, Zephyr's POSIX clocks
# and objects, as zenoh-pico's own Zephyr backend uses them), and the port's `os` answered by the
# kernel. The image links the C seams both name (`deploy/zephyr-common/wz_os_zephyr.c`,
# `wz_pico_os_zephyr.c`), the board's hooks and a `critical-section` implementation, and builds
# this crate for the bare core; a build that also names a host engine keeps its host's layer and
# links. The session core is asked for its `no_std` atomics, which a core without 64-bit atomics
# (a Cortex-M7) needs. A capability that selects `std` is refused beside it (`src/lib.rs`).
os-zephyr = [
    "dep:wz-capi-coop",
    "dep:wz-runtime-zephyr",
    "wz-session-core/rx-lent-only",
    "wz-capi-coop/tx-lend-only",
    "wz-session-core/no_std",
    "wz-session-core/limits-lent-at-open",
    "wz-session-core/session-fixed-storage",
    "wz-session-core/session-keeps-keyexprs",
]
# `os-host`: the library on a host, without `std` (`docs/win-budget/std-heap.md`, S1: a C
# library has no `std` form). The cooperative engine over the host's sockets, clock and random
# source (`wz-runtime-posix`: Linux, Android, QNX Neutrino and macOS through POSIX, Windows through
# Winsock, the performance counter and the system's generator), the host layer of `src/os/unix.rs`
# or `src/os/windows.rs` under the platform exports, and the port's `os` and the runtime's
# critical sections made of the host's own calls (`wz-capi-coop`'s `host-sys` over
# `wz-host-sync`: pthreads, or Win32's slim lock, condition variable and threads). Which host is
# read from the target, so one feature names both; a target that is neither a POSIX host nor an
# MSVC Windows target is refused by name (`src/lib.rs`). This crate is the rlib: what a program
# without `std` links in its place (the host's heap as the global allocator, a panic that aborts)
# is the C library's artifact, `wz-capi-pico-lib`, built with the `capi-nostd` profile and its
# configuration (`.cargo/capi-nostd.toml`), so a Rust program or test linking this crate keeps
# `std`'s own. The cooperative engine on a host announces a session's initial sequence number by
# the session core's compact function of the two zids (`initial-sn-compact`) in place of zenoh's
# SHAKE128 of them: zenoh-pico draws that origin from its random source, so the derivation is no
# part of this ABI's contract, and the Keccak permutation is not linked.
os-host = [
    "dep:wz-capi-coop",
    "dep:wz-host-sync",
    "dep:wz-runtime-posix",
    "wz-capi-coop/host-sys",
    "wz-session-core/rx-lent-only",
    "wz-capi-coop/tx-lend-only",
    "wz-capi-port/os-sys",
    "wz-session-core/initial-sn-compact",
    "wz-session-core/limits-lent-at-open",
    "wz-session-core/session-fixed-storage",
    "wz-session-core/session-keeps-keyexprs",
    # The advanced plane's lock and the node clock's wall clock, where `advanced` builds them.
    "wz-ext-pubsub?/host-sync",
    "wz-node-time?/host-sync",
]
# The capabilities pico's own CMake switches name (`Z_FEATURE_QUERY`, `Z_FEATURE_QUERYABLE`,
# `Z_FEATURE_LIVELINESS`, `Z_FEATURE_ADVANCED_PUBLICATION` / `_SUBSCRIPTION`), each one feature
# of this crate: on in a default build, so the drop-in exports what the reference build does,
# and off for a deployer who wants the textbook minimum. A capability that is off is not
# linked: the session model and the runtime plane behind it are not compiled in either
# (`wz-capi-core` is taken without its default features, so each capability reaches it only
# through the feature below).
#
# `peer`: the roles beyond the client's: `z_open` with a `listen` endpoint, or in `mode=peer`,
# which accept the sessions of others. A build without it opens a client session to the
# endpoints it is given and refuses a config that asks for more. This is a stronger cut than
# pico's `Z_FEATURE_UNICAST_PEER`, which leaves a lone listener in and takes out only the
# combined listen and connect and a second connect locator.
#
# Both engines take the roles, so it selects neither: the tokio engine accepts every link the
# runtime has, and the cooperative engine the `tcp/` and `udp/` ones its stack listens on
# (`wz-capi-coop`'s `listen`, `docs/capi-pico-on-coop-engine.md` step L4). What only the tokio
# engine has (a group, the secure and the other links, gossip) selects it by its own feature.
# A session that may listen is laid out from its config at the open (`wz-capi-coop`'s
# `runtime-plan`); a client build's arena is the region the build lays out when it is compiled.
peer = ["scout", "wz-capi-core?/peer", "wz-capi-coop?/listen", "wz-capi-coop?/runtime-plan"]
# `multicast-transport` (`Z_FEATURE_MULTICAST_TRANSPORT` with `Z_FEATURE_LINK_UDP_MULTICAST`,
# open-debt item 913): `z_open` with a `listen` endpoint `udp/<group>:<port>#iface=<if>` joins
# that group as the session's one transport, as pico's listen of a UDP endpoint with an
# interface does (`vendor/zenoh-pico/src/link/multicast/udp.c` @
# `z_result_t _z_endpoint_udp_multicast_valid(`). A build without it refuses that config.
#
# Both engines join one, so it selects neither: the tokio engine's group face, and the
# cooperative engine's (`wz-capi-coop`'s `group-host`), on the host's sockets or, when the config
# carries the program's transport, over it. Either sends a JOIN on `zp_send_join` and lists the
# members on `z_info_peers_zid` through the port.
multicast-transport = [
    "link-udp",
    "peer",
    "wz-capi-core?/multicast-transport",
    "wz-capi-coop?/group-host",
]
# Open-debt item 913 — pico's `Z_FEATURE_MULTICAST_DECLARATIONS` (vendor default 0), off here
# as there. Both engines tell a group the session's keyexprs, ask it for its members' on it and
# read each member's keys by that member's own declarations, so it selects neither: the
# cooperative engine's group reads the declarations the open hands it, and keeps the members'
# keyexprs apart by its own `multicast-declarations`.
multicast-declarations = [
    "multicast-transport",
    "wz-capi-core?/multicast-declarations",
    "wz-capi-coop?/multicast-declarations",
]
# Open-debt item 911 — pico's `Z_FEATURE_RAWETH_TRANSPORT` (vendor default 0): `z_open` with a
# `listen` endpoint `reth/<mac>#...` joins a group over raw Ethernet as the session's one
# transport, as pico opens its raweth transport. Off here as there. Either engine joins it: the
# tokio engine's group link, or the cooperative engine's `reth/` groups over the host's raw packet
# sockets (`wz-capi-coop`'s `raweth`), both on Linux, where pico has the transport.
raweth-transport = [
    "multicast-transport",
    "wz-session-core/transport-link-raweth",
    "wz-capi-core?/raweth-transport",
    "wz-capi-coop?/raweth",
]
# `link-udp` (`Z_FEATURE_LINK_UDP_UNICAST`): a `udp/` endpoint to dial. `scout` implies it, the
# scouting group being a UDP one. The cooperative engine dials UDP in every build, so this
# selects no engine.
link-udp = ["wz-capi-core?/link-udp"]
# `scout` (`Z_FEATURE_SCOUTING`): `z_scout`, the one-shot survey of the group and the
# `z_hello` family that reads its answers, and the lookup `z_open` runs when its config names no
# locator. Both engines scout (a scout needs no session), so it selects neither: it turns the
# window on in the one the build has, which is how a cooperative client finds a router. The
# session's own scouting vocabulary is named because the plane reads the locator grammar and the
# defaults from it. The window's sockets are the host's, one for each interface that can carry
# multicast (`wz-capi-coop`'s `scout` over `wz-runtime-posix`), which need no `std`, so a host
# library without it scouts as one with it does; a Zephyr image names `scout-mcu` instead.
scout = [
    "link-udp",
    "wz-session-core/scouting-active",
    "wz-session-core/codec-scout",
    "wz-session-core/codec-hello",
    "wz-capi-core?/scout",
    "wz-capi-coop?/scout",
]
# `scout-mcu`: the same capability where the build has no host network (`Z_FEATURE_SCOUTING` in an
# image): the window is one datagram socket of the stack the engine runs on, the Scout written to
# the group from it and the Hellos read back on it, which is how zenoh-pico scouts on a platform
# with no interface iterator, Zephyr's sockets among them (`wz-capi-coop`'s `scout-datagram`). It
# selects no `std`, so an `os-zephyr` image names it; `scout` beside it keeps the host's window.
scout-mcu = [
    "link-udp",
    "wz-session-core/scouting-active",
    "wz-session-core/codec-scout",
    "wz-session-core/codec-hello",
    "wz-capi-coop?/scout-datagram",
]
# `query`: `z_get` and the querier, the requesting end of a query. Both engines ask a get and
# watch whether a queryable matches, so it selects neither. Every get and querier holds a
# cancellation token, whose cancel waits on the port's condition variable (`wz-capi-port`'s
# `cancellation` over its `os`), which every build has, so it selects no `std`.
query = ["wz-capi-core?/query", "wz-capi-coop?/query"]
# `queryable`: `z_declare_queryable` and the replies, the answering end of a query. Both engines
# answer queries, so it selects neither: it turns the queryable on in the one the build has.
queryable = ["wz-capi-core?/queryable", "wz-capi-coop?/queryable"]
# `liveliness`: the token and the subscriber. Both engines hold tokens and hear them, so it
# selects neither.
liveliness = ["wz-capi-core?/liveliness", "wz-capi-coop?/liveliness"]
# `liveliness-get`: the snapshot get of the liveliness plane. It is a query, so it needs the
# requesting end of one; both engines ask it (the tokio engine's drive loop sweeps the get
# deadlines, the cooperative engine's every step does), so it selects neither. It holds the
# get's cancellation token, which needs no `std`, as `query`'s does not.
liveliness-get = [
    "liveliness",
    "query",
    "wz-capi-core?/liveliness-get",
    "wz-capi-coop?/liveliness-get",
]
# `advanced`: the advanced publisher and subscriber and the plane they replay through.
# It implies `liveliness`, because an advanced subscriber's publisher detection is a liveliness
# subscription declared through the liveliness plane, and `queryable`, because the publisher's
# cache is a queryable. And `unstable-api`, because pico declares the whole advanced API inside
# `#ifdef Z_FEATURE_UNSTABLE_API` and its CMake forces the switch off without it.
#
# It names no engine: the publisher's and the subscriber's rules are the neutral
# `wz-ext-pubsub`'s, hosted over the engine port (`docs/advanced-pubsub-on-a-neutral-core.md`),
# so either engine runs it. The engine's own switch forwards where that engine is built in: the tokio engine's `advanced` turns
# on the runtime's advanced features, the cooperative engine's `ticker` is the periodic job the
# heartbeat and the sweeps are, and a build without either carries none.
#
# It selects no `std`: beside `os-host` the cache's and the subscriber's locks
# and the node clock's wall clock are the host's own calls (`wz-host-sync`). An image has neither, and a build
# with neither is refused by name (`src/lib.rs`).
advanced = [
    "liveliness",
    "queryable",
    "unstable-api",
    # The subscriber's gets are the engine's requesting end, which the engine is built with and
    # which exports nothing: `query` itself is the C `z_get` and the querier, and `advanced`
    # does not select them.
    "wz-capi-core?/query",
    "wz-capi-coop?/query",
    "dep:wz-ext-pubsub",
    "dep:wz-node-time",
    "wz-ext-pubsub/advanced-publisher",
    "wz-ext-pubsub/engine-host",
    "wz-ext-pubsub/ext-pubsub-sample-miss-detection",
    "wz-ext-pubsub/pubsub-qos",
    "wz-ext-pubsub/pubsub-encoding",
    "wz-ext-pubsub/pubsub-attachment",
    "wz-node-time/time-hlc",
    "wz-capi-core?/advanced",
    "wz-capi-coop?/ticker",
    # The advanced publishers and subscribers lie in places of the session's arena on the
    # cooperative engine, and their caches keep their samples in the session's ring.
    "wz-capi-coop?/advanced",
]
# `clock-source`: the clock a program registers (`zext_clock_source_register`), which
# `z_timestamp_new` reads in place of the system clock, and the report of its standing
# (`zext_clock_report`). wz's own door, which zenoh-pico has not, so it is off as the reference
# build is, and part of the unstable surface as the other `zext_*` doors are: it implies
# `unstable-api`. The registry and the clock are `wz-node-time`'s.
clock-source = [
    "unstable-api",
    "dep:wz-node-time",
    "wz-node-time/clock-source",
    "wz-capi-port/clock-source",
    "wz-capi-core?/clock-source",
]
# `event-ring`: the node's event log and the doors that write and read it (`zext_event_emit`,
# `zext_event_read`, `zext_event_dropped`). wz's own, which zenoh-pico has not, so off as the
# reference build is, and part of the unstable surface: it implies `unstable-api`. The ring is
# `wz-node-time`'s.
event-ring = [
    "unstable-api",
    "dep:wz-node-time",
    "wz-node-time/event-ring",
    "wz-capi-port/event-ring",
    "wz-capi-core?/event-ring",
    "wz-capi-coop?/event-ring",
]
# `supervision`: the node's supervisor and the doors that drive it (`zext_supervision_*`).
# wz's own, which zenoh-pico has not, so off as the reference build is, and part of the unstable
# surface: it implies `unstable-api`. The machine and the supervisor are `wz-session-core`'s.
supervision = [
    "unstable-api",
    "wz-session-core/supervision",
    "wz-capi-port/supervision",
    "wz-capi-core?/supervision",
]
# `resource-snapshot`: the node's resource snapshot and the doors that read it
# (`zext_snapshot_*`). wz's own, which zenoh-pico has not, so off as the reference build is, and
# part of the unstable surface: it implies `unstable-api`. The record, the sampler and the message
# meter are `wz-session-core`'s.
resource-snapshot = [
    "unstable-api",
    "wz-session-core/resource-snapshot",
    "wz-capi-port/resource-snapshot",
    "wz-capi-core?/resource-snapshot",
    "wz-capi-coop?/resource-snapshot",
]
# `session-memory`: the most memory a session holds, part by part, computed from the limits it
# opened under (`zext_session_memory`, `zext_session_memory_row`). wz's own, which zenoh-pico
# has not, so off as the reference build is, and part of the unstable surface. The tables' rows are
# `wz-session-core`'s; the rows of the handle and of each link are this ABI's and read what either
# engine is opened with, so it selects neither, and nothing of it is linked into a build without it.
session-memory = ["unstable-api", "wz-capi-core?/session-memory"]
# `segment-sender`: the sending side of a declared segment profile and the doors that drive it
# (`zext_segment_sender_*`): one message of the application's own cut into the pieces the
# profile's header describes, put on a publisher or handed to a callback. wz's own, which zenoh-pico
# has not, so off as the reference build is, and part of the unstable surface: it implies
# `unstable-api`. The piece writer is `wz-app-frame`'s, the one the zenoh-c ABI's doors of the same
# capability write with. Each sender is held under the host's lock (`os-host`, or `std`'s
# beside `engine-tokio`; src/lib.rs refuses a build with none). A put is the publisher's, which both
# engines have, so it selects neither and forwards weakly.
segment-sender = [
    "unstable-api",
    "dep:wz-app-frame",
    "wz-capi-core?/segment-sender",
]
# `shared-key-ids`: the key ids every node of a deployment shares and the doors that hand a config
# its dictionary and the key-wire form of an endpoint (`zext_config_key_ids`,
# `zext_config_key_wire_form_for`). wz's own, which zenoh-pico has not, so off as the reference
# build is, and part of the unstable surface: it implies `unstable-api`. Both engines hold the
# dictionary: each reads an id only the dictionary names and names a key on each link as that
# link's form says. The model is session-core's.
shared-key-ids = [
    "unstable-api",
    "wz-session-core/shared-key-ids",
    "wz-capi-port/shared-key-ids",
    "wz-capi-core?/shared-key-ids",
    "wz-capi-coop?/shared-key-ids",
]
# `e2e-supervision`: reception supervision per stream and the doors that drive it
# (`zext_stream_supervisor_*`): a deadline per periodic stream over the program's storage, a loss
# told once, saturating error counts, a start delay, a condition the program supplies and senders
# it marks absent. wz's own, which zenoh-pico has not, so off as the reference build is, and part
# of the unstable surface: it implies `unstable-api`. The supervisor and its activation machine are
# `wz-session-core`'s. Each supervisor is held under the host's lock, and a poll task is a thread of
# the host: `std`'s, or `wz-host-sync`'s in a host library without `std`, so it selects no `std`.
# Both engines can host it (it touches no session), so it selects neither and forwards weakly.
e2e-supervision = [
    "unstable-api",
    "wz-session-core/e2e-supervision",
    "wz-capi-core?/e2e-supervision",
]
# `e2e-sender`: the sending side of an end-to-end protected message (`zext_e2e_sender_*`): a
# payload protected by a profile and the program's values, the counter kept per stream. On in the
# zenoh-c ABI's default and off in this one's (`default_off_abis` in the declaration): wz's own,
# which zenoh-pico has not, and part of the unstable surface. The frame writer is `wz-app-frame`'s.
# Each sender is held under the host's lock, `std`'s or, in a host library without `std`,
# `wz-host-sync`'s (`os-host`), so it selects no `std`; it touches no session, so
# it selects neither engine and forwards weakly.
e2e-sender = [
    "unstable-api",
    "dep:wz-app-frame",
    "wz-capi-core?/e2e-sender",
]
# `e2e-receiver`: the receiving judge of end-to-end protected frames (`zext_e2e_receiver_*`):
# per-stream state in storage the program sizes, the judging rules the profile states, and a
# status beside every sample. wz's own, off as the reference build is, part of the unstable
# surface. The judge is `wz-app-frame`'s; like the sender it selects no `std` and neither engine.
e2e-receiver = [
    "unstable-api",
    "dep:wz-app-frame",
    "wz-capi-core?/e2e-receiver",
]
# `replay-cache`: the replay cache of a message (`zext_replay_publisher_*`,
# `zext_replay_subscriber_*`): a publisher's ring of the frames it sent, answered on the message's
# key plus a suffix the program states, and a subscriber that asks each publisher as its queryable
# appears and orders the replies against its live samples. wz's own, off as the reference build is,
# part of the unstable surface. The ring and the round are `wz-session-core`'s and the admission of
# a reply to the judge is `wz-app-frame`'s. A publisher answers with a queryable and a subscriber
# asks with a get, hears its publishers through the declaration watch and judges with the receiving
# judge, so it selects all four; it touches neither engine itself and forwards weakly. Its state is
# under the doors' lock and its deadlines on the library's clock, so it selects no `std`.
replay-cache = [
    "unstable-api",
    "query",
    "queryable",
    "remote-declaration-watch",
    "e2e-receiver",
    "wz-app-frame/replay",
    "wz-session-core/replay-cache",
    "wz-capi-core?/replay-cache",
]
# `e2e-sender-demux`: the receiving judge keeps one stream per sender, chosen by the sender
# identity the frame's header carries, in at most `E2E_SENDER_SLOTS` slots.
e2e-sender-demux = ["e2e-receiver", "wz-capi-core?/e2e-sender-demux"]
# `message-catalog`: a deployment's messages read from one JSON5 declaration
# (`zext_message_catalog_*`): each message's entry, and the sender, the receiver and the
# supervision rows made from it in a build that has those doors too. wz's own, off as the reference
# build is, part of the unstable surface. The reader is `wz-app-frame`'s; a catalog is immutable
# once read, so it needs no lock, and its text and refusals are `alloc`'s strings: it selects no
# `std`, and neither engine.
message-catalog = [
    "unstable-api",
    "dep:wz-app-frame",
    "wz-capi-core?/message-catalog",
]
# `message-payload`: the payload of a catalog message set and read field by field, by path, under
# `.proto` files the program hands over when it runs (`zext_payload_schema_*`,
# `zext_message_payload_*`): values set and read, the protobuf bytes encoded and decoded. wz's
# own, off as the reference build is, part of the unstable surface, and made for a message of the
# catalog, so it implies `message-catalog`. The payload is `wz-app-frame`'s; a payload is held
# under the doors' lock and its schema is shared by `alloc`'s reference count, so it selects no
# `std`, and neither engine.
message-payload = [
    "unstable-api",
    "message-catalog",
    "dep:wz-app-frame",
    "wz-app-frame/message-payload",
    "wz-capi-core?/message-payload",
]
# `instance-key`: the instance a sample of a message is, read from fields of its payload through
# the message's schema (`zext_instance_keyer_*`), its last value per instance in the program's
# storage, and with `e2e-receiver` or `e2e-sender` the doors that judge or protect a frame in its
# instance's stream. wz's own, off as the reference build is, part of the unstable surface. The
# keyer is `wz-app-frame`'s; like the e2e doors it selects no `std` and neither engine. A sample of
# no instance is counted, and with `event-ring` also reported in the node's event log.
instance-key = [
    "unstable-api",
    "dep:wz-app-frame",
    "wz-app-frame/instance-key",
    "wz-capi-core?/instance-key",
]
# `proto-text`: the doors that read a schema from the `.proto` text the program hands over when it
# runs (`zext_payload_schema_new`, `zext_instance_keyer_new`, `zext_proto_file_t`), over the
# text reader of `wz-app-frame` (its tokenizer, parser and linker). Without it a schema is read
# only from the `FileDescriptorSet` `protoc` compiled the files into when the program was built
# (`zext_payload_schema_from_descriptor_set`, `zext_instance_keyer_from_descriptor_set`) and
# no text reader is linked, so it is off as the reference build is and in the release package; a
# build that reads the text a person hands over turns it on. wz's own, part of the unstable
# surface. It adds doors only beside `message-payload` or `instance-key` and turns neither on;
# like them it selects no `std` and neither engine.
proto-text = ["unstable-api", "wz-app-frame?/proto-text", "wz-capi-core?/proto-text"]
# `app-transport`: a transport the program supplies (`zext_transport_*`, `zext_config_transport`),
# which carries every link of a session opened from the config that names it, over the program's
# own network stack and over no socket of the system's. wz's own, which zenoh-pico has not, so off
# as the reference build is, and part of the unstable surface as the other wz doors are. The
# transport object is the session core's and its table is held under the port's lock, so it serves
# either engine and selects neither: the tokio engine's links over the program's stack, or the
# cooperative engine's, whichever the build has. A link's wait parks the thread, which a host
# without `std` does through `wz-host-sync` (`wz-runtime-coop`'s `host-lock-sys`), so it selects no
# `std`.
app-transport = [
    "unstable-api",
    "wz-session-core/app-link",
    "wz-capi-core?/app-transport",
    "wz-capi-coop?/app-transport",
]
# `time-base`: a time base the program supplies (`zext_time_base_*`, `zext_config_time_base`),
# which the timers of a session opened from the config that names it run on in place of the
# system's clock, for a program that runs its sessions on a time of its own (a simulation, paused,
# or faster or slower than the wall clock). wz's own, which zenoh-pico has not, so off as the
# reference build is, and part of the unstable surface as the other wz doors are. The time base is
# `wz-node-time`'s and serves either engine: the cooperative engine's clock, or the clock the tokio
# engine's session is made with (`wz-capi-core`'s).
time-base = [
    "unstable-api",
    "dep:wz-node-time",
    "wz-node-time/time-base",
    "wz-capi-port/time-base",
    "wz-capi-core?/time-base",
    "wz-capi-coop?/time-base",
]
# `object-pool`: the doors through which a program reserves, with counts of its own, the fixed pools
# the objects it holds outside a session are taken from (a session, a publisher, a subscriber, a
# queryable, a liveliness token, an owned sample, reply or query, a payload, a config, a kept hello),
# and reads what they hold (`zext_object_pool_*`), each count held to the bound of the session
# limit that bounds the object. wz's own, off as the reference build is, and part of the unstable
# surface. The pools are not the doors': a library without the tokio engine has them in every build,
# reserved by its first object from the build's limits (`HELD_*` and the session limits), with no
# fallback to the heap (`src/process_pool.rs`, set by `build.rs`), so a build without the unstable
# surface makes no allocation for them either. On the tokio engine, which otherwise keeps those
# objects on the heap, the doors bring the pools with them. They serve either engine, so it selects
# neither.
object-pool = ["unstable-api", "wz-capi-core?/object-pool"]
# `object-pool-region`: the same pools over memory the program hands over
# (`zext_object_pool_place`), for a program that states where its memory lies.
object-pool-region = ["object-pool", "wz-capi-core?/object-pool-region"]
# `remote-declaration-watch` and `declarations-synced-event`: the declaration watch, the doors that
# tell a program what a peer declares and retracts (`zext_decl_watch_declare`,
# `zext_decl_watch_drop`). wz's own, which zenoh-pico has not, so off as the reference build is.
# The doors are in a build that has either; the first names the peer of each event, the second
# tells a watch once per establishment that the peer has sent everything it held. Both engines
# watch, so they select neither: the tokio engine watches its faces, and the cooperative one the
# dispatch of what each of its links receives. The doors are `core` and `alloc`, so they select
# no `std`.
remote-declaration-watch = [
    "wz-capi-core?/remote-declaration-watch",
    "wz-capi-coop?/remote-declaration-watch",
]
declarations-synced-event = [
    "wz-capi-core?/declarations-synced-event",
    "wz-capi-coop?/declarations-synced-event",
]
# `admin-space` (`Z_FEATURE_ADMIN_SPACE`, off as upstream's is): `zp_start_admin_space` /
# `zp_stop_admin_space`, the queryable that answers pico's `@/<zid>/pico/**` documents, and the
# `auto_start_admin_space` flag of the open options. Upstream refuses the switch without
# `Z_FEATURE_QUERYABLE` (`vendor/zenoh-pico/CMakeLists.txt` @
# `if(Z_FEATURE_ADMIN_SPACE AND NOT Z_FEATURE_QUERYABLE)`), so it implies `queryable`, and
# forces it off without the unstable API, so it implies `unstable-api`.
admin-space = [
    "queryable",
    "unstable-api",
    "wz-capi-core?/admin-space",
    "wz-capi-coop?/connectivity",
]
# `local-subscriber` / `local-queryable` (`Z_FEATURE_LOCAL_SUBSCRIBER`, `Z_FEATURE_LOCAL_QUERYABLE`,
# off as upstream's are): a session's own put reaches its own subscribers, and its own get its own
# queryables, inside the call and on the calling thread, as pico delivers them
# (`vendor/zenoh-pico/src/session/loopback.c` @ `_z_session_deliver_push_locally`). The option
# structs gain the `allowed_origin` / `allowed_destination` fields those switches add, so a
# program compiled with them links a build that has them; a publisher's and a querier's write
# filter and matching status count the session's own entities.
local-subscriber = ["wz-capi-core?/local-subscriber", "wz-capi-coop?/local-subscriber"]
local-queryable = ["wz-capi-core?/local-queryable", "wz-capi-coop?/local-queryable"]
# `unstable-api` (`Z_FEATURE_UNSTABLE_API`, on in the reference build and off in upstream's
# default): the entity ids (`z_session_id`, `z_publisher_id`, ...), the sample's reliability and
# source info, `z_reliability_default`, `z_bytes_get_contiguous_view`, `z_reply_replier_id`, the
# cancellation token, and the option fields that carry them (`reliability`, `source_info`,
# `cancellation_token`). Off, those fields are not in the option structs a program allocates,
# which are then the smaller structs pico's default header declares. None of it is an engine's:
# it selects neither (`wz-capi-core`'s is a marker its own code reads). Its modules are `core` and
# `alloc`, so it selects no `std`: the cancellation token is in a build with `query` too, which
# brings the token's wait. A put's and a delete's source info are written and a sample's decoded
# only here (`wz-session-core/pubsub-source-info`): without it the option field is absent and
# `z_sample_source_info` is not exported, so no program could set or read one.
unstable-api = ["wz-capi-core?/unstable-api", "wz-session-core/pubsub-source-info"]
# `config-policy`: `zext_config_policy` and `zext_config_profile`, the doors that state the
# policies and the profile of the sessions a config opens, and the open's resolution of what they
# state over the build's defaults (`src/config_policy.rs`). wz's own, which zenoh-pico has not: on
# in a build that names nothing, and off in the zenoh-pico preset (`configs/zenoh-pico_defconfig`),
# whose sessions run under the build's policies and limits and whose open links no resolver of a
# statement. Both engines take the policies the open hands them, so it selects neither. The doors
# select policies after the build, so their domains keep every value the build does not leave out
# (`wz-session-core/policy-selection`); without them each such policy is its build default alone.
# A stated limit sizes the session's arena, so the cooperative engine lays it out from the config
# at the open (`wz-capi-coop`'s `runtime-plan`) and not from the region the build lays out.
config-policy = [
    "wz-capi-core?/config-policy",
    "wz-capi-coop?/runtime-plan",
    "wz-session-core/policy-selection",
]
# `conformance-digest`: `zext_conformance_digest`, the digest of the configuration the library
# was built with (`src/conformance.rs`). wz's own: on in a build that names nothing and in a
# package that ships a build statement (the host-peer-ext preset), off in the zenoh-pico preset.
conformance-digest = ["wz-capi-core?/conformance-digest"]
# `device-requires`: `zext_config_device_requires`, the door that answers what an open of a
# config would ask of the operating system (`src/device_requires.rs`). wz's own, which zenoh-pico
# has not: on in a build that names nothing and in the host-peer-ext preset, off in the zenoh-pico
# preset. Part of the unstable surface, so it implies `unstable-api`, which alone is pico's
# unstable API and carries no door of wz's. Either engine's open is read by it, so it selects
# neither.
device-requires = ["unstable-api", "wz-capi-core?/device-requires"]
# `config-document`: `zext_config_document`, the door that hands a config the zenoh JSON5 document
# the zenoh-c ABI reads, so one document states both ABIs' policies. Off by default: zenoh-pico's
# config is a set of numbered keys and reads no document, and the door links a JSON5 reader a
# build that states its policies through `zext_config_policy` and `zext_config_profile` does
# not need. The open resolves the document's statements as it resolves the doors', so it implies
# `config-policy`.
config-document = ["config-policy", "wz-capi-core?/config-document"]
# `connectivity` (`Z_FEATURE_CONNECTIVITY`): the transport and link snapshots and the event
# listeners of pico's connectivity plane. Upstream declares it only with the unstable API. Both
# engines report their faces through the port, so it selects neither. Its doors are `core` and
# `alloc` over the port's lock, so it selects no `std`.
connectivity = ["unstable-api", "wz-capi-core?/connectivity", "wz-capi-coop?/connectivity"]
# `gossip`: a session that is told of a node by one it holds a link to dials it (see the
# runtime's feature of the same name). Pico itself has no such plane, and the preset leaves it
# off (decision Q7 of docs/c-abi-engine-and-memory.md).
gossip = ["engine-tokio", "peer", "wz-capi-core/gossip"]
# `multi-thread` (`Z_FEATURE_MULTI_THREAD`, on as upstream's is): which of pico's two header arms
# this library is the drop-in for. On: the read and lease task doors (`zp_start_read_task`, ...),
# the host mutex, condvar and task (`z_mutex_*`, `z_condvar_*`, `z_task_*`), the three-field
# `z_open_options_t`, and channel collections that block. Off: the single-threaded entry points
# (`zp_read`, `zp_send_keep_alive`, `zp_send_join`, `zp_spin_once`), a one-byte
# `z_open_options_t`, and channel collections that never block, sized as that arm's header sizes
# them. The two arms disagree on struct sizes the C program allocates, so a program must link the
# build of the arm it compiled against. The tokio engine drives a session on its own runtime in
# both; the cooperative engine is stepped by the program in the single-threaded arm and by its
# read task in the multi-threaded one, so this selects no engine; it gives the cooperative one its
# read task (`wz-capi-coop`'s `threads`).
multi-thread = ["wz-capi-core?/multi-thread", "wz-capi-coop?/threads"]
# The two switches of the tokio engine's drive, which a build of that engine names beside it (the
# `tokio` option of the engine axis in deploy/wz-config.toml); see wz-capi-core's features of these
# names. They mean nothing on the cooperative engine and leave with the tokio engine (phase P5).
serial-drive-own-thread = ["engine-tokio", "wz-capi-core/serial-drive-own-thread"]
rx-busy-poll = ["engine-tokio", "wz-capi-core/rx-busy-poll"]
# The `unixpipe/<path>[#file_mask=<mode>]` link, dial and accept: a pair of named FIFOs for each
# peer, made as zenoh's unixpipe link makes them. zenoh-pico has no such link, so this is a link of
# wz's past the pico preset, off by default. It selects no engine: the tokio engine's unixpipe
# link, or on the cooperative one the host's named FIFOs (`wz-runtime-posix`'s `unixpipe`, Linux
# and Android) beside its sockets (`src/coop_host.rs`). Another Unix host is refused by name
# (`src/lib.rs`); on a host with no named FIFO (Windows) the feature is inert, as upstream's
# unixpipe link is. Without it a `unixpipe/` endpoint is a locator no link opens, and the open
# fails.
transport-link-unixpipe = ["wz-capi-core?/transport-link-unixpipe", "wz-runtime-posix?/unixpipe"]

# R311y406 — off-default `quic/` ACCEPT transport, forwarding wz-runtime-tokio's
# `transport-link-quic`. Unlike unixpipe, quic IS a zenoh-pico-native link (though
# stock zenoh-pico's quic is client-dial only); wz-capi-pico adds the LISTEN side
# with a server cert threaded from the native `Z_CONFIG_TLS_LISTEN_{CERTIFICATE,
# PRIVATE_KEY}_KEY` config values (zenoh feeds ONE tls block to both tls + quic).
# With it, `z_open(listen="quic/..")` + those cert keys binds a mesh quic listener
# (the --peer/--router/--router-hat demo twin, R311y405/y406); without it the
# `quic/` scheme still parses but `bind_locator` returns `Unsupported` at bind.
transport-link-quic = ["engine-tokio", "dep:wz-tls-pem", "wz-capi-core/transport-link-quic"]
# R311y534 — the `tls/` link, dial AND accept. Unlike unixpipe this is
# zenoh-pico-native on BOTH sides (its `z_pub_tls.c` / `z_sub_tls.c` each take
# `-e tls/...` and `-l tls/...`), and it is what the §5.27 api-compat-pico
# drop-in legs for those two programs run on: with it, `z_open` resolves pico's
# twelve `Z_CONFIG_TLS_*` keys into real dial/accept material; without it the
# `tls/` scheme still parses but bind and dial return a feature-gated
# `Unsupported`, so the keys are inert rather than misleading.
transport-link-tls = ["engine-tokio", "dep:wz-tls-pem", "wz-capi-core/transport-link-tls"]
# The `tls/` link on the COOPERATIVE engine (step T4 of L6, docs/capi-pico-on-coop-engine.md): the
# same twelve `Z_CONFIG_TLS_*` keys as `transport-link-tls`, resolved once to PEM bytes, run over
# the Mbed TLS channel the cooperative engine's stack is given (`wz-capi-coop`'s `tls::HostTls`),
# for the dial and the listen. It selects the cooperative engine, as `transport-link-tls` selects
# the tokio one (rustls): a build names the secure channel it wants, and with it the one engine
# the library has. The default features name the cooperative engine, so a default build takes it
# with `--features tls-mbedtls`; beside the tokio engine it is refused.
tls-mbedtls =["os-host", "dep:wz-tls-pem", "wz-capi-coop/tls-mbedtls"]
# The `ws/` link, dial and accept: zenoh-pico's `Z_FEATURE_LINK_WS` (default 0; upstream builds
# it only for emscripten, while this ABI runs on a host runtime). With it a `ws/` endpoint under
# `Z_CONFIG_CONNECT_KEY` or `Z_CONFIG_LISTEN_KEY` dials or binds. It selects no engine: the tokio
# engine's WebSocket link, or on the cooperative one WebSocket links over the host's TCP
# (`wz-runtime-posix`'s `ws`, POSIX and Windows hosts) beside its sockets (`src/coop_host.rs`). Without it a
# `ws/` endpoint is a scheme no link of the build opens, and the open fails.
transport-link-ws = ["wz-capi-core?/transport-link-ws", "wz-runtime-posix?/ws"]
# The `serial/<device>#baudrate=<n>` link, dial and accept: zenoh-pico's
# `Z_FEATURE_LINK_SERIAL` (default 0). The listener serves one peer at a time, as one line
# carries one; the dial runs the serial-link handshake before the session's. It selects no
# engine: the tokio engine's serial link, or on the cooperative one the host's ttys
# (`wz-runtime-posix`'s `serial`, Linux and Android) beside its sockets (`src/coop_host.rs`).
# Without it a `serial/` endpoint is a locator no link opens, and the open fails.
transport-link-serial = ["wz-capi-core?/transport-link-serial", "wz-runtime-posix?/serial"]

[[test]]
name = "supervision_doors"
required-features = ["supervision"]

[[test]]
name = "snapshot_doors"
required-features = ["resource-snapshot", "peer"]

[[test]]
name = "observation_links"
required-features = ["clock-source", "event-ring", "supervision", "resource-snapshot", "peer"]

[[test]]
name = "snapshot_admin_space"
required-features = ["resource-snapshot", "admin-space", "peer", "query"]

[[test]]
name = "clock_source_stamps"
required-features = ["engine-tokio", "peer", "clock-source"]

# The integration tests as one executable (`scripts/lib/merge_tests.py`). libtest runs its tests,
# each a program of its own, at once in one process, whose pools are sized for one program, so the
# harness states the share of the programs it runs through the pools' door before its first test
# (`tests/it/programs.rs`): the target requires the door, and a lane that builds it names it.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["object-pool"]

# The object pools driven through their doors: a process of its own, as the pools are the
# process's.
[[test]]
name = "object_pool_doors"
required-features = ["object-pool", "peer"]

# The stress run of Layer S: threads calling while sessions close and open again, over a transport
# the program supplies that injects faults. An executable of its own because it counts the
# process's allocations with a `#[global_allocator]`; every test in it is `#[ignore]`d.
[[test]]
name = "stability"
required-features = ["app-transport", "peer", "query", "queryable", "liveliness", "link-udp"]

# The memory legs of Layer S: a failed allocation at every point of a call, each run a process of
# its own, and the allocations of traffic between open sessions. An executable of its own because
# its `#[global_allocator]` counts and fails allocations; every test in it is `#[ignore]`d. The
# sessions are stepped by their own threads, so a cooperative build needs `multi-thread`.
[[test]]
name = "allocation_faults"
required-features = ["app-transport", "peer", "query", "queryable", "multi-thread"]

# The no-heap measurement of Layer C1nh: the allocations each operation family makes after a
# session opens, on the cooperative engine, held by `deploy/no_heap_ratchet.json`. An executable
# of its own because its `#[global_allocator]` counts them; its test is `#[ignore]`d. A build
# with the tokio engine compiles none of it (the file is `cfg(not(feature = "engine-tokio"))`).
[[test]]
name = "no_heap_after_open"
required-features = ["os-host", "app-transport", "peer", "query", "queryable", "multi-thread"]

# What a session's open allocates, phase by phase, on the cooperative engine: the reservations a
# measurement of the library's memory against zenoh-pico's is read from. An executable of its own
# because its `#[global_allocator]` records them; its test is `#[ignore]`d.
[[test]]
name = "open_heap"
required-features = ["os-host", "peer", "multi-thread"]

# The node that `client_only_dials_a_listener` dials: a build that cannot listen needs one of
# the full build to talk to. It asks queries and answers them, so the build has both ends of one.
[[example]]
name = "hold_a_listener"
required-features = ["peer", "query", "queryable", "liveliness"]

# The program that dials a node that listens, for a foreign node (upstream's CLI in `peer`
# mode with a `listen` endpoint) to be the node. The reverse of the example above, and built for
# each engine the same way; it needs no listener of its own, so `peer` is not required.
[[example]]
name = "dial_a_listener"
required-features = ["query"]

[lints]
workspace = true

[dependencies]
# The ABI stamp this artifact carries as an ELF note (`src/revision.rs`).
wz-abi-stamp = { path = "../wz-abi-stamp" }
# R311y498 — the ABI-neutral session model (face registry + declaration SSOT +
# drive thread) this crate used to OWN. It moved out when the zenoh-c ABI
# arrived: two ABIs, one session model. See wz-capi-core's manifest for why
# duplicating it was the worse option.
wz-capi-core = { path = "../wz-capi-core", default-features = false, optional = true }
# The cooperative engine (`os-host`, `os-zephyr`), over the host's sockets and clock
# (`wz-runtime-posix`). Its runtime's critical sections are a lock of the process (the
# engine selects the runtime's `host-lock-sys`), so this library links no `critical-section`
# implementation and exports nothing beside its C ABI. Without its default features: its host half
# comes with `os-host`.
wz-capi-coop = { path = "../wz-capi-coop", default-features = false, optional = true }
# The PEM bytes a `Z_CONFIG_TLS_*` key names, read from a file path or a base64 token. This ABI is
# the edge that holds the key spellings, so it resolves "path or base64" once, here, and hands PEM
# bytes to whichever engine the build selects; that reading is not an engine's, and `wz-tls-pem` is
# the one both engines take it from.
wz-tls-pem = { path = "../wz-tls-pem", optional = true }
wz-runtime-posix = { path = "../wz-runtime-posix", optional = true }
# The host's lock and condition variable, with `std` and without, which the doors of the additional
# features hold and wait on, and its threads and monotonic clock without `std` (`os-host`).
wz-host-sync = { path = "../wz-host-sync", optional = true }
# The cooperative engine's host in a Zephyr image (`os-zephyr`): Zephyr's datagram and stream
# sockets as the session's links on the heap profile, the kernel's tick as its clock, and the
# board's random source and wall clock. The heap profile (`alloc`), as the engine allocates.
wz-runtime-zephyr = { path = "../wz-runtime-zephyr", optional = true, default-features = false, features = [
    "alloc",
] }
# The session core's own types (key expression canon and matching, QoS, locality, samples, the
# sinks), named where they live and not through the tokio engine's re-exports of them: the ABI
# layer knows no engine, and the engine this crate drives is a selection
# (`docs/capi-pico-on-coop-engine.md`, decision D1). `alloc` is what those modules need; the
# engine's own dependency on this crate unifies the rest.
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["alloc"] }
# The wire vocabulary the ABI layer exports over: the encoding id table and the VLE codec of the
# serialization format, named where they live for the reason above. Nothing named: both modules
# are ungated, and a feature named here would become every dependent's (R311y614).
wz-codecs = { path = "../wz-codecs", default-features = false }
# The advanced plane's rules (the `@adv` grammar, the cache, the publisher's composite, the
# subscriber's machine and its host over the port) and the node's time its publisher stamps from,
# which no engine owns: named where they live, so the plane runs on either engine
# (`docs/advanced-pubsub-on-a-neutral-core.md`). Optional, and each feature the plane needs is
# named by `advanced`.
wz-ext-pubsub = { path = "../wz-ext-pubsub", optional = true, default-features = false }
wz-node-time = { path = "../wz-node-time", optional = true, default-features = false }
# The piece writer behind `segment-sender` (`src/segment_sender.rs`), and the frame writer and
# receiving judge behind `e2e-sender` and `e2e-receiver` (`src/e2e.rs`), at its defaults (`alloc`),
# which they are behind, and the keyer behind `instance-key`, which names its own feature of the
# crate. Optional: a build without any of the four links none of it.
wz-app-frame = { path = "../wz-app-frame", optional = true }
# The port between this ABI and the engine that runs its sessions: the vocabulary both name
# (ids, callback factories, a key's wire form, the write filter's plane and answer), so the ABI
# layer is spelled in no engine's types (docs/capi-pico-on-coop-engine.md, D1). Without its
# default features: its host half comes with `os-host` (or `std`'s with `engine-tokio`).
wz-capi-port = { path = "../wz-capi-port", default-features = false }
# The tokio RUNTIME is not a dependency of this crate: it is the tokio engine's
# (`wz-capi-core`), and the modules of the capabilities only that engine has reach
# it through the engine, as `wz_capi_core::runtime`. An ABI depends on its engines,
# never on a runtime of its own (docs/capi-pico-on-coop-engine.md, D1), and the
# runtime's crate then has one puller in the catalog, the `runtime-tokio` atom whose
# code it is. What every session needs of it (the codecs, the open, reconnect,
# fragmentation) is the engine's base feature list; what a capability needs is that
# capability's feature here, forwarding to the engine's. The notes below record why
# each runtime feature a pico build needs is named where it is; the features named
# `wz-runtime-tokio/...` in them now sit in wz-capi-core.
#
# `routing-accept` is added explicitly because it is NOT in the default bundle
# (it is a selectable role atom, `wz-runtime-tokio/Cargo.toml`). It gates
# `wz_runtime_tokio::accept_loop`, which Round 2 needs for the pico-faithful
# LISTENER: pico's `z_open(listen)` returns immediately and then accepts up to
# `Z_LISTEN_MAX_CONNECTION_NB` = 10 CONCURRENT inbound peers into the one
# session, and the accept loop is wz's bind-once/hold-N-peers foundation. Only
# the loop itself is used here — no forwarding between faces (that is the
# sibling `routing-routes` atom); this crate passes its own `FaceForwarder`
# that lands each face in the C session's registry instead.
#
# Cargo feature unification: `routing-accept` was previously absent from the
# workspace-unified build (no default enabler), so enabling it here compiles
# `wz-runtime-tokio::accept_loop` into the shared graph for the whole workspace
# in run-ci Layer C1/C2. It is ADDITIVE (`routing-accept` only gates
# `pub mod accept_loop` and additive items, altering no other crate's existing
# code paths), matching the precedent wz-integration-tests documents for its
# storage/auth feature pins.
# `query-timeout` is selected EXPLICITLY, not inherited. The dependency edge
# runs the wrong way for us — `query-timeout = ["query-get"]`, never the
# reverse — so `query-get` alone leaves `QueryOptions::with_timeout_ms` a
# SIGNATURE-STABLE NO-OP (`session/querier.rs`). The get plane's completion
# rests entirely on that timeout: without it `timeout_ms` stays 0 ->
# `deadline_ms = None` -> the pending entry survives every sweep -> the reply
# closure's `Arc` never releases -> the C `drop(context)` (pico's completion
# signal) NEVER fires for a get to a silent peer. That failure is SILENT: the
# crate would still compile clean, and even the `get_timeout_ms` unit test
# would still pass, because it tests the mapping one layer above the loss.
# Contrast `sweep_expired_queries` / `next_reply_deadline_ms`, which are
# `#[cfg(feature = "query-get")]` and so fail LOUDLY. Today the feature arrives
# via wz-runtime-tokio's default bundle, but this crate's own note above plans
# to trim that bundle — so the plane names what it structurally requires
# instead of relying on a bundle it does not control.
# `transport-fragmentation` is selected EXPLICITLY for the same reason as
# `query-timeout` above: it is NOT in wz-runtime-tokio's default bundle, and its
# absence is SILENT at the C ABI. R311y484 measured, through a recording TCP
# relay, that without it a `z_put` above the negotiated 65535-byte batch
# produces ZERO wire bytes while `z_put` still returns `Z_OK` — the message has
# no fragmentation path, so it is dropped, and a C caller cannot tell a
# delivered put from a discarded one. `codec-fragment` IS in the default bundle,
# so the Fragment wire body was always encodable; what was missing is the TX
# gate that splits an oversize message into a chain (`wz-session-core/
# transport-fragmentation`) and the RX wiring that rejoins it (`reassembly`,
# which this feature pulls). Both halves are needed here because wz-capi-pico is
# BOTH peers in the pico topology — a C program dials with it and another
# accepts with it — so a TX-only build would fragment into a peer that cannot
# reassemble. zenoh-pico itself fragments (`Z_FRAG_MAX_SIZE`), so this is
# pico-faithful, not a superset. Gated by tests/fragmentation_roundtrip.rs,
# which publishes 200 / 65000 / 131072 / 262144 bytes through the exported
# symbols and asserts each arrives byte-identical at the subscriber closure.
# `scouting-active` is selected EXPLICITLY (R311y530): it gates
# `wz_runtime_tokio::scouting_glue`, the Scout-emit / Hello-decode drive loop the
# pico `z_scout` C ABI adapts. Without it that module does not exist and
# `z_scout` has nothing to drive -- and, unlike the silent cases above, its
# absence is a COMPILE error here rather than a runtime no-op, because this
# crate names the module directly.
# `liveliness-get` is selected EXPLICITLY, for the same class of reason as
# `query-timeout` above and with the opposite failure shape to `scouting-active`.
# It is NOT in wz-runtime-tokio's default bundle, and `Session::liveliness_get`
# is SIGNATURE-STABLE across it: without the feature the method still compiles
# and returns `LivelinessGetError::FeatureDisabled` at runtime. So a build that
# forgot it would export `z_liveliness_get`, link `z_get_liveliness.c`, run it,
# and report an empty snapshot — indistinguishable from "no tokens are alive".
# Gated by the upstream `z_get_liveliness.c` leg, which asserts a token DECLARED
# by a real zenoh-pico peer comes back.
# The `ext-pubsub-advanced-*` trio is selected for the `ze_advanced_*` C ABI
# (`src/advanced.rs`). Like `scouting-active` and unlike the silent-no-op cases
# above, their absence is a COMPILE error here — that module names
# `AdvancedPublisherOptions` / `AdvancedSubscriberOptions` and the `@adv` config
# types directly. They are pico-NATIVE, not a superset:
# `Z_FEATURE_ADVANCED_PUBLICATION` / `_SUBSCRIPTION` are both 1 in the pinned
# pico CMake config, so upstream's `z_advanced_pub.c` / `z_advanced_sub.c`
# compile their advanced half unconditionally and a drop-in must export it.
#
# The dependency takes NO default features: the runtime's default bundle names every plane
# (query, liveliness, ...) and would make each of them this ABI's whatever its features say.
# What every session is made of comes through `wz-capi-core`, and each capability through the
# feature of this crate that forwards to the core's. Three of the features the notes above
# justify are therefore no longer named here, because the capability that needs them names
# them: `query-timeout` is part of `wz-capi-core/query` (a get without it keeps no deadline,
# the silent shape described above), and `reply-source-info` is part of
# `wz-capi-core/queryable` (R311y562: `z_query_reply_options_t` declares a `source_info`, and
# without the emit gate it is read, staged and silently dropped at the codec, measured by
# `tests/reply_options_roundtrip.rs`). `liveliness-get` is `wz-capi-core/liveliness-get`, and
# `transport-fragmentation` is in the engine's base list, which both drop-ins share.

# The host layer's own crates, a host's alone: an MCU image has no `getrandom` source of its
# kind and its C library is the image's, which `src/os/<host>.rs` names for itself.
[target.'cfg(any(unix, windows))'.dependencies]
# Per-session zid entropy. zenoh identifies a PEER by its zid, so two sessions
# sharing one are the SAME peer on the wire — a listener would dedup/aggregate
# them instead of holding two faces. pico generates a random `Z_ZID_LENGTH` = 16
# byte zid per session when the config carries no explicit one
# (`~/zenoh-pico/src/api/api.c:846-855`). `getrandom` is the same OS-entropy
# source wz-runtime-tokio already uses AP-side for signing-key entropy.
getrandom = "0.2"

# R311y478 — the pico PLATFORM surface (z_malloc / z_free / z_clock_* ) forwards
# to libc rather than reimplementing it. `z_malloc` and `z_free` MUST be the C
# allocator so a program may mix them with plain malloc/free on one pointer
# (pico defines them as exactly that), and `CLOCK_MONOTONIC` differs per
# platform (1 on Linux, 6 on macOS), so hand-writing the constant would be a
# portability bug. Already in this workspace's graph — wz-runtime-tokio deps it
# optionally — so this adds no new third-party crate.
# A POSIX host's alone: on Windows the crate names the C runtime as a Visual Studio
# library (`msvcrt`, `legacy_stdio_definitions`), where the library without `std` links
# none, and the Windows layer imports the runtime's heap by DLL name instead
# (`src/os/windows.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows host layer (`src/os/windows.rs`). pico's own Windows backend types its
# mutex as SRWLOCK, its condvar as CONDITION_VARIABLE, its clock as a performance
# counter and its task as a thread HANDLE, so wz's exports over those bytes call the
# same Win32 functions: libc carries none of them. Already in this workspace's graph
# (the async runtime reaches it), so this adds no new third-party crate; each feature
# below is one namespace the file calls into, and nothing else is enabled.
# `System_Memory` is the process heap the library's own memory comes from in a build
# without `std` (`os-host` on Windows, `src/os/no_std_host.rs`).
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
]

[dependencies.tokio]
version = "1"
default-features = false
features = ["rt-multi-thread", "sync", "macros"]
optional = true

[dev-dependencies]
# The tests select every value of a policy, with or without the config doors, which
# `policy-selection` keeps in its domain for the test build alone.
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["policy-selection"] }
# The `tls/` link on the cooperative engine (`tests/tls_coop_roundtrip.rs`) states its certificate
# keys inline, as the stock examples do: the test encodes the PEM of the fixture's certificate.
base64 = "0.22"
# The port pickers (`free_port`) and the self-signed `localhost` certificate of the TLS and QUIC
# tests, without the default `sessions`: those fixtures build on the tokio engine, and a test build
# of the cooperative engine must not link it (`wz-runtime-tokio` refuses to be built beside the
# lent-only selectors `os-host` names). The tests that drive the runtime's own sessions beside
# the C ABI's (a wz peer, a router) reach it as the library does, through the engine they are
# gated on (`wz_capi_core::runtime`, behind `engine-tokio`), so the runtime has no edge here.
wz-runtime-tokio-test-support = { path = "../wz-runtime-tokio-test-support", default-features = false, features = [
    "tls-fixtures",
] }
# The synthetic segment profile and its hand-laid piece builder (`segment_profile::synthetic`,
# behind `fixtures`): the oracle the segment sender's door tests hold every piece to, which lays
# each field by hand and computes the CRC from the model's parameters, not from a parsed profile.
wz-app-frame = { path = "../wz-app-frame", features = ["fixtures"] }
