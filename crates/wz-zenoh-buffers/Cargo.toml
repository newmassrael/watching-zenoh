#
# This package reproduces the public API and the documentation of the crate of the same name of
# eclipse-zenoh/zenoh, which is EPL-2.0 OR Apache-2.0, so the whole package is under that expression.
# The notices of the upstream files it derives from are kept in its sources (see LICENSES/ and
# THIRD_PARTY.md at the root of this repository).
#
# zenoh-buffers -- the byte buffers of the zenoh family: the traits that a message is written to and
# read from (`Writer`, `Reader` and their backtracking, advancing and siphoning forms), a fixed
# buffer (`BBuf`), a shared slice (`ZSlice`) and a buffer of shared slices (`ZBuf`), over
# watching-zenoh (inventory atom `api-compat-rust`, open-debt item 910, docs/build-configuration.md C13).
#
# Named `zenoh-buffers` and versioned as the pinned zenoh, like every crate of the family (see
# `../wz-zenoh-result/Cargo.toml` for why the name is the mechanism). Its traits are what the codecs of
# `zenoh-protocol` are written against and `ZBuf` and `ZSlice` are the payload types of `zenoh`, so an
# ecosystem crate that names them must meet the one of this graph.

[package]
name = "zenoh-buffers"
version = "1.10.2"
edition.workspace = true
rust-version.workspace = true
license = "EPL-2.0 OR Apache-2.0"
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Byte buffers of the zenoh family (1.10.2), as a drop-in over watching-zenoh."

[lib]
name = "zenoh_buffers"
path = "src/lib.rs"

# Upstream's features by their names. `shared-memory` adds the kind a slice carries (`ZSliceKind`);
# `test` adds the doc-hidden random constructors and is what a crate that tests with them depends on.
[features]
default = ["std"]
shared-memory = []
std = []
test = ["rand"]

# `zenoh-collections` is what a `ZBuf` keeps its slices in, with its own `std` off as upstream's is
# (`SingleOrVec` needs no std), and `rand` is what the random constructors draw from.
[dependencies]
rand = { version = "0.8.5", optional = true, default-features = false }
zenoh-collections = { path = "../wz-zenoh-collections", default-features = false }

[dev-dependencies]
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng"] }

[lints]
workspace = true
