#
# wz-session-lwip — Stage 4b, the tier-clean MCU session shell.
#
# This is the integration tier that sits ABOVE both the §5.P runtime
# tier (wz-runtime-lwip) and the §5.C link tier (wz-link-lwip), binding
# them to the runtime-agnostic session SSOT (wz-session-core). It is the
# MCU analog of what `wz-runtime-tokio::session_glue` is on the AP side:
# the `drive_session_until_terminal` loop + the `BoxedLinkDriver` adapter
# over the concrete socket. The AP side co-locates these in
# wz-runtime-tokio only because tokio happens to provide both the runtime
# AND the async socket I/O; the MCU profile deliberately split runtime
# (wz-runtime-lwip) from link (wz-link-lwip), so the session-drive layer
# that depends on both is its own crate here (the tier-clean structure
# the AP side will eventually mirror as a `wz-session-tokio`).
#
# SSOT: every drive-loop PRIMITIVE — `dispatch_link_event`,
# `report_outcome_reassembling`, `check_lease_deadline`,
# `new_session_engine`, `HandshakeDeadlineTracker` — already lives in
# wz-session-core and is shared with the AP loop. `run_session` here is
# loop STRUCTURE only (the synchronous, `tokio::select!`-free polling
# shape); the `LwipUdpDriver` adapter is genuinely MCU-specific (the AP
# `TokioLinkDriverAdapter` is async, nothing to share).
#
# Like wz-link-lwip, the whole crate is `#![cfg(lwip_real_build)]`: it
# names `LwipUdpSocket`, which only exists in a real lwIP build (host, or
# cross with WZ_LWIP_PORT). The `lwip-sys` direct dependency exists SOLELY
# to receive the `DEP_LWIP_LWIP_REAL_BUILD` metadata that build.rs relays
# into the `lwip_real_build` cfg (the same pattern wz-link-lwip uses);
# wz-session-lwip calls no lwip-sys FFI directly. Cross builds without
# WZ_LWIP_PORT collapse to an empty crate (no socket type to bind).

[package]
name = "wz-session-lwip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Phase W MCU session shell — run_session sync drive loop + BoxedLinkDriver over LwipUdpSocket (tier-clean integration of wz-runtime-lwip + wz-link-lwip + wz-session-core)."

[lib]
name = "wz_session_lwip"
path = "src/lib.rs"

[features]
default = []
# Transport reassembly (Tier B) on the MCU session loop. Forwards to the
# wz-runtime-lwip reassembly seam (the LwipReassembly dispatcher +
# mcu_reassembly() over the SCE buffer-pool SSOT) AND the wz-session-core
# reassembly capability (the shared report_outcome_reassembling ingest).
# Off by default; with it on, `run_session` reassembles inbound
# T_MID_FRAGMENT chains before dispatch, exactly as the AP loop does.
reassembly = [
    "wz-runtime-lwip/reassembly",
    "wz-session-core/reassembly",
]

# R311mf — transport fragmentation (Tier B TX) on the MCU multicast loop.
# Forwards the wz-session-core transport-fragmentation umbrella (which pulls
# `reassembly` + `codec-fragment` + `alloc`) and re-uses this crate's own
# `reassembly` forward so the MCU reassembly Router (wz-runtime-lwip) is built
# too. No drive-loop code change: `run_multicast_session` already frames its TX
# seam through the shared `multicast_tx_emit` SSOT, which splits an oversize
# payload via `multicast_frame_or_fragments` once this feature is on — exactly
# as the AP loop does. Off by default; pair with codec-push (or another TX body
# codec) to publish fragmentable data.
transport-fragmentation = [
    "reassembly",
    "wz-session-core/transport-fragmentation",
]

# Slim session-rx buffer-pool profile (nrf51-class / Cortex-M0, 16 KB SRAM).
# Forwards to the wz-link-lwip selector; SharedSessionSocket =
# Rc<RefCell<SessionRxSocket>> + SessionDatagram = Datagram<SESSION_RX_SLOT_
# SIZE> follow the slimmed alias automatically (no driver change). See the
# link-tier feature + session_rx_pool_mcu_minimal.scxml for the derivation.
buffer-pool-session-rx-slim = ["wz-link-lwip/buffer-pool-session-rx-slim"]

# R311kx — keepalive TX emitter on the MCU session loop. Forwards to the
# wz-session-core transport-keepalive capability (the shared
# check_keepalive_deadline / keepalive_wake_deadline pair + the
# send_keep_alive wire primitive); with it on, `run_session` emits a
# KeepAlive whenever the line has been idle for
# adopted_lease / LEASE_EXPIRE_FACTOR, exactly as the AP loop does.
transport-keepalive = ["wz-session-core/transport-keepalive"]

# R311lt — MCU multicast transport drive loop (`run_multicast_session`): the
# no_std mirror of the AP `wz-runtime-tokio::multicast_glue` loop. Forwards to
# the wz-session-core `session-multicast` capability (the MulticastDispatcher
# Router + the engine-free §3.1 multicast session FSM + the JOIN wire SSOT)
# and its `codec-join` / `codec-frame` deps; the multicast RX/TX socket
# (`bind_session_multicast_rx`) is always available from wz-link-lwip. Off by
# default. With it on, `run_multicast_session` emits the periodic JOIN beacon,
# classifies inbound (Join / Frame / KeepAlive / Close) by source address, and
# sweeps leases — the same shape the AP loop's RX foundation drives.
transport-multicast = [
    "wz-session-core/session-multicast",
    "wz-session-core/codec-join",
    "wz-session-core/codec-frame",
    "wz-session-core/codec-close",
]
# R311ly — the multicast pub/sub TX body codec: forwards wz-session-core's
# codec-push so the multicast drive loop's TX seam frames an app z_put as a
# T_MID_FRAME via the shared multicast_tx_emit SSOT. Orthogonal to
# transport-multicast (which is RX / JOIN / lease only); a publishing multicast
# node enables both.
codec-push = ["wz-session-core/codec-push"]
# R311lz — the remaining multicast TX body codecs, forwarding the matching
# wz-session-core features so the drive loop's `next_tx` seam reaches every arm
# of the shared multicast_tx_emit SSOT, not just Push (the loop's TX gate is the
# union of these). `codec-response` + `codec-response-final` are the queryable
# reply chain (a reply payload + its terminating ResponseFinal — forwarded
# together because a reply needs both); `liveliness-token` is the declarer-side
# interest-response (DeclToken / DeclFinal) and transitively pulls codec-declare,
# so a multicast node can frame a held-token reply over the group. Each is
# orthogonal to transport-multicast; a node enables the variant(s) it publishes.
# The application produces these reply items today; R311ma/R311mb added the
# observer-staging auto-producer (MulticastReplyQueue) that builds them from
# inbound Interest / Query frames. R311md folded the ResponseSink /
# DeclareReplySink construction into the shared wz-session-core
# multicast_reply_sink SSOT, so this crate names no wz_codecs type and forwards
# wz-session-core only (the wz-codecs direct dep R311mb needed is gone).
codec-response = ["wz-session-core/codec-response"]
codec-response-final = ["wz-session-core/codec-response-final"]
liveliness-token = ["wz-session-core/liveliness-token"]
# R311mb — the queryable observer-staging registry: forwards the wz-session-core
# query-queryable capability (the QueryableRegistry on the ApplicationLayerObserver
# + codec-request for inbound Query decode + codec-response). With it on, an MCU
# multicast node registers a queryable whose handler's reply the observer stages
# and MulticastReplyQueue (ResponseSink) drains onto the next_tx seam. Pair with
# codec-response + codec-response-final to emit the full Response + ResponseFinal
# chain.
query-queryable = ["wz-session-core/query-queryable"]

[dependencies]
# §5.P runtime tier: LwipRuntime<C> + LwipTime<C> + the Runtime /
# TimeSource trait surface (with_mutex_mut, now_monotonic_ms). alloc +
# session-unicast pull the SessionRuntime binding (Stage 4a) so
# SessionLinkActions<LwipRuntime<C>, LwipTime<C>> composes.
wz-runtime-lwip = { path = "../wz-runtime-lwip", features = ["alloc", "session-unicast"] }
# §5.C link tier: LwipUdpSocket / SessionRxSocket / bind_session_rx /
# LwipLink. Empty without lwip_real_build (host/WZ_LWIP_PORT only).
wz-link-lwip = { path = "../wz-link-lwip" }
# Runtime-agnostic session SSOT: the action bundle, the engine-free FSM,
# the shared drive-loop primitives. no_std selects the heapless engine;
# alloc the Vec/String/Arc-backed bundle.
wz-session-core = { path = "../wz-session-core", default-features = false, features = ["alloc", "session-unicast", "no_std"] }
# The Runtime / TimeSource traits named directly by run_session
# (with_mutex_mut for the lease-baseline read; now_monotonic_ms).
wz-runtime-core = { path = "../wz-runtime-core", default-features = false, features = ["alloc"] }
# lwip-sys direct dep SOLELY for DEP_LWIP_LWIP_REAL_BUILD -> lwip_real_build
# cfg propagation in build.rs (mirrors wz-link-lwip); no FFI used here.
lwip-sys = { path = "../lwip-sys" }

[dev-dependencies]
# critical-section's std impl backs LwipRuntime's critical_section::Mutex
# + the portable-atomic polyfill on the host test path (the MCU deploy
# supplies the cortex-m / riscv impl at final-binary link instead).
critical-section = { version = "1", features = ["std"] }
# R311lu — the test-support feature exposes wz-link-lwip's `lwip_test_link`
# init-once harness so this crate's lwIP-touching tests (session_drive +
# multicast_drive) share ONE process-global lwip_init + multicast-netif
# setup. Dev-only: the production lib build (which already deps wz-link-lwip
# above without this feature) never pulls the harness.
wz-link-lwip = { path = "../wz-link-lwip", features = ["test-support"] }

[lints]
workspace = true
