#
# zephyr-sys — hand-written FFI to the Zephyr kernel symbols the wz Zephyr
# cooperative single-task profile calls (clock + heap). UNLIKE freertos-sys
# (which vendors + cross-compiles the FreeRTOS kernel via build.rs because the
# FreeRTOS deploy is cargo-driven), Zephyr's own build system compiles the
# kernel; this crate is PURE extern declarations whose symbols resolve at the
# final Zephyr image link (the Z2 deploy's west/cmake build links the wz cargo
# staticlib). So: no build.rs, no vendored source, NO bindgen (the __UINTxx_C
# bindgen friction does not exist on this path). Pure-cargo cross-buildable.

[package]
name = "zephyr-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Hand-written FFI to the Zephyr kernel symbols the wz Zephyr profile calls (clock + heap). No bindgen, no vendored kernel; symbols resolve at the Zephyr image link."

[lib]
name = "zephyr_sys"
path = "src/lib.rs"

[lints]
workspace = true
