#
# This package reproduces the public API and the documentation of the crate of the same name of
# eclipse-zenoh/zenoh, which is EPL-2.0 OR Apache-2.0, so the whole package is under that expression.
# The notices of the upstream files it derives from are kept in its sources (see LICENSES/ and
# THIRD_PARTY.md at the root of this repository).
#
# zenoh-collections -- the small containers of the zenoh family: a value that is one element or a
# vector (`SingleOrVec`), the same for a hash set, a map keyed by small integers that is a vector
# while the keys are dense, and two bounded buffers, over watching-zenoh (inventory atom
# `api-compat-rust`, open-debt item 910, docs/build-configuration.md C13).
#
# Named `zenoh-collections` and versioned as the pinned zenoh, like every crate of the family (see
# `../wz-zenoh-result/Cargo.toml` for why the name is the mechanism). Its types are fields of the
# public API of `zenoh-buffers` and `zenoh-protocol`, so an ecosystem crate that names them must meet
# the one of this graph.

[package]
name = "zenoh-collections"
version = "1.10.1"
edition.workspace = true
rust-version.workspace = true
license = "EPL-2.0 OR Apache-2.0"
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Small containers of the zenoh family (1.10.1), as a drop-in over watching-zenoh."

[lib]
name = "zenoh_collections"
path = "src/lib.rs"

# Upstream's features by their names: `std` carries every container that needs a hash map or a deque,
# and `test` is declared because a crate that depends on this one with it must find it.
[features]
default = ["std"]
std = ["ahash/default"]
test = []

# `ahash` is the hasher of the public types `IntHashMap` and `SingleOrBoxHashSet` (their variants hold
# an `ahash::HashMap` and an `ahash::HashSet`), so it is upstream's, at upstream's semver line.
[dependencies]
ahash = { version = "0.8.12", default-features = false }

[lints]
workspace = true
