#
# Coverage-guided fuzz targets for the C ABI doors a consumer hands outside
# bytes to: the capture, live, transport, text, schema and E2E doors of
# `wz-capi-dissect`, the mutation and plan doors of `wz-capi-replay`, and the
# config-verdict and end-to-end sender doors of `wz-capi-c`.
#
# ## Why the doors and not the Rust beneath them
#
# A consumer reaches the parsers only through these `extern "C"` functions, and
# a defect it can crash on may sit in the door itself: the null and length
# checks, the string handed out and freed, the caller's buffer sized and
# filled. A target calls each door exactly as a C caller does (the crates are
# linked as rlibs, so no second binding layer stands between), and holds every
# answer to the door's documented contract (`src/lib.rs`).
#
# One target holds a door to a PROPERTY as well: `selector_term` holds the
# sentence a node of the field document offers to the soundness oracle
# `wz-capture` defines (`selector_term::soundness`), which is why `wz-capture`
# is a dependency here and not only through the doors. The oracle's record
# level reads the record trees, which exist only inside the library.
#
# ## Why a workspace of its own
#
# libFuzzer's instrumentation needs a nightly compiler (`rust-toolchain.toml`
# here pins one) and the sanitizer flags `cargo fuzz` passes, neither of which
# the product workspace (`crates/Cargo.toml`, pinned stable) may take. The
# `[workspace]` table below makes this directory its own root, so no lane of
# the product workspace builds it and its lock file pins only what it adds.
#
# `scripts/fuzz.sh` builds, seeds, replays and runs it; Layer Fz of
# `scripts/run-ci.sh` replays the seeds and the committed reproducers on every
# push, and `.github/workflows/fuzz.yml` fuzzes each target every night.
[package]
name = "wz-fuzz"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-watching-zenoh-NonCommercial-1.0 OR LicenseRef-watching-zenoh-Commercial"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.10"
serde_json = "1"
wz-capi-c = { path = "../wz-capi-c", default-features = false, features = ["e2e-sender"] }
wz-capi-dissect = { path = "../wz-capi-dissect" }
wz-capi-replay = { path = "../wz-capi-replay" }
wz-capture = { path = "../wz-capture", features = ["dissect"] }

[[bin]]
name = "pcap"
path = "fuzz_targets/pcap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "live"
path = "fuzz_targets/live.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport"
path = "fuzz_targets/transport.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto"
path = "fuzz_targets/proto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "e2e"
path = "fuzz_targets/e2e.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay"
path = "fuzz_targets/replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sender"
path = "fuzz_targets/sender.rs"
test = false
doc = false
bench = false

[[bin]]
name = "selector_term"
path = "fuzz_targets/selector_term.rs"
test = false
doc = false
bench = false
