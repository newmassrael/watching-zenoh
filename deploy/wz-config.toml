# A node built from a declaration (deploy/nodes/<id>.toml, docs/target-build-contract.md 5b): the
# package is not in the crates workspace, so its own manifest and binary are named, and the entry
# takes the declaration as an input (`--node`). The posix port under it exists for Linux, for Android
# and for QNX Neutrino (both stacks, io-pkt and io-sock), so a platform of another operating system
# is refused by name before anything is built.
