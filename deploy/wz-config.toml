# A clock the application registers (docs/observation-plane.md M1): a hardware clock or a time
# master the device has, which the node reads in place of the system clock. wz's own door, with no
# counterpart in an upstream library, so it is off in every original and part of the unstable
# surface, as `wz_ext_config_device_requires` is.
[[capability]]
id = "clock-source"
# The bit this capability has in the `features` word of a resource snapshot
# (`docs/observation-plane.md` M4). Assigned once and never moved or reused: a reader of an older or
# newer image reads the bits it knows, so a bit is a name the snapshot's layout has promised.
observation_bit = 0
kconfig = "WZ_CAP_CLOCK_SOURCE"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
default = "off"
abis = ["core", "pico", "c"]
implies = ["timestamping", "unstable-api"]
help = "Register a clock source the node reads instead of the system clock, and report whether it is synchronised."

# The node's event log (docs/observation-plane.md M2): a ring of fixed-size records that the node
# and the program write events into and that a program reads back, with no text stored. wz's own
# doors, with no counterpart in an upstream library, so off in every original and part of the
# unstable surface. The ring's size is `EVENT_RING_SLOTS` and `EVENT_RECORD_ARGS`, and what a full
# ring gives up is the `event-ring-full` policy.
[[capability]]
id = "event-ring"
observation_bit = 1
kconfig = "WZ_CAP_EVENT_RING"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
default = "off"
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "Write events into the node's event ring and read them back, with no text stored."

# The node's supervisor (docs/observation-plane.md M3): checkpoints an application feeds, each with
# a deadline, an expiry hook that runs once, and a verdict on whether every one is healthy that a
# node can feed a hardware watchdog from. wz's own doors, with no counterpart in an upstream
# library, so off in every original and part of the unstable surface. How many checkpoints is the
# `SUPERVISION_CHECKPOINTS` limit, and what an expired one does on the next feed is the
# `supervision-after-expiry` policy.
[[capability]]
id = "supervision"
observation_bit = 2
kconfig = "WZ_CAP_SUPERVISION"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
default = "off"
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "Supervise checkpoints an application feeds, and run a hook once when one misses its deadline."

# The node's resource snapshot (docs/observation-plane.md M4): a fixed-layout, versioned record of
# CPU use, memory, tasks and the spacing of the messages the session receives, taken on a period
# and read as bytes. wz's own doors, with no counterpart in an upstream library, so off in every
