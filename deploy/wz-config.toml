#
# The build configuration of wz, declared ONCE (docs/build-configuration.md, decision C1).
#
# Every switch a build can turn is declared here, and everything else is derived from this file by
# `scripts/lib/wz_config.py`, which `--check`s each derived file against it:
#
#   * `deploy/Kconfig.capabilities`   the capabilities a Zephyr or Linux deployer selects from
#                                     (generated; `--check` fails when it is stale);
#   * `deploy/Kconfig.limits`         the limits an image states for itself (generated);
#   * `crates/wz-session-core/src/caps_generated.rs`
#                                     the value of each limit as the code reads it (generated);
#   * `<image dir>/Kconfig.axes` and `<image dir>/wz_axes.cmake`
#                                     each image's axes as Kconfig choices, and what they build
#                                     its crate with (generated);
#   * the Cargo features               `--features <abi> <.config>` turns a Kconfig result into
#                                     the `cargo build` arguments of an ABI crate;
#   * the three manifests              wz-capi-core, wz-capi-pico and wz-capi-c each spell the
#                                     same capability graph by hand in `[features]`, because Cargo
#                                     cannot include a fragment; `--check` fails when a manifest
#                                     drifts from it.
#
# The file is read by a reader of one small TOML shape (the hosted Python floor has no `tomllib`):
# `key = value` on one line, the value a string, an integer or an array of strings, or a `'''`
# literal string across lines; `[table]` and `[[array of tables]]` headers; `#` comments on lines
# of their own.
#
# ## Capabilities
#
# A capability is a plane a build either has or does not: the doors it exports and the runtime
# behind them. `implies` is a capability that must be on when this one is. `abis` is where the
# capability is exported (core is the model under both ABIs and always has it). `default` is
# whether a build that names nothing has it: on unless declared `default = "off"`, so the drop-in
# exports what the reference build does, and `off` is for a switch the reference library itself
# leaves off. zenoh-pico's own switches for a capability are the `maps` rows to it under the
# upstream switches below, so a deployer who already writes a pico `config.h` can state the same
# intent: the capability is on when one of them is on, or when all are where it says
# `pico_combine = "all"`. `pico_flags_all` is for a capability no row reaches but which pico has
# whenever several switches are all on (the liveliness get, which pico declares inside both the
# liveliness and the query switch).
#
# `upstream_on` and `upstream_off` say what each upstream original's own default build has
# (docs/build-configuration.md, C2 and step 2): the originals are `zenoh`, `zenoh-c` and
# `zenoh-pico`. A capability names `zenoh-pico` when the pico ABI exports it, and `zenoh-c` and
# `zenoh` when the zenoh-c ABI does, in exactly one of the two keys. These are not `default`:
# `default` is the drop-in's own default, which keeps what the reference builds turn on, while
# an original's defaults reach a build only through that original's defconfig. zenoh-pico's
# values are held to its CMakeLists at the pin and zenoh-c's to its default cargo features by
# `upstream_switch_map.py`. A wz-own door (no upstream counterpart) is off in every original.
#
# `base` is what an ABI build needs that is not a capability.
#
# ## Limits
#
# A limit is the capacity of a table every session of an image holds. `default` is the value of a
# build that states nothing; an image states its own through `CONFIG_<kconfig>`, which the Zephyr
# build hands to cargo as the environment variable of the same name without `CONFIG_`
# (deploy/zephyr-common/wz_zephyr_board.cmake). The code reads each limit from the generated
# module, and `crates/wz-session-core/src/caps.rs` binds the name the code uses to it.
#
# ## Images and their axes
#
# An `image` is a Zephyr application whose node is chosen along axes. An `axis` is a Kconfig
# `choice` of that image, with a `default` option; each `axis_option` is one member of it, and its
# `requires` (a Kconfig expression) becomes the member's `depends on`, so a combination the node
# cannot be built as cannot be selected. A `cargo_rule` says what the image's crate is built with
# when every option named in its `when` is selected: the `features` it adds, and `defaults = "off"`
# where the crate's default features (its heap profile) must be off. Generated for each image:
# `<dir>/Kconfig.axes`, which the image's Kconfig sources, and `<dir>/wz_axes.cmake`, which its
# CMake includes and which sets `wz_axes_features` and `wz_axes_no_default_features`. What is
# particular to a board or a driver stays in the image's own Kconfig and CMake.

schema_version = 1
catalog_version = 2

[base]
# `open-plan`: what a zenoh configuration document means for an open, one value for every client
# of the tokio engine (`wz_capi_core::open_plan`, docs/zenoh-api-on-the-engine.md section 5.2). It
# is not a capability: no build chooses it, the zenoh-c ABI and the Rust API always have it, and
# the pico ABI, which reads no zenoh configuration, names the features it wants and so never does.
core = ["rx-busy-poll", "open-plan"]
# `engine-tokio`: the engine a pico build runs its sessions on (docs/capi-pico-on-coop-engine.md).
# Every build this declaration configures is on the tokio engine; the cooperative engine is not
# an axis here yet (that note's decision D5).
pico = ["engine-tokio", "serial-drive-own-thread", "rx-busy-poll"]
c = []

# The operating-system facilities every HOST build asks for whatever its capabilities
# (docs/target-build-contract.md T9): the runtime keeps threads, dials TCP, and draws entropy for
# the node's id. A capability states what it asks for beyond these in its `os_needs`.
#
# `interface-list` is in it because the TCP link carries `link-interfaces` in every host build: the
# runtime lists the machine's network interfaces (POSIX `getifaddrs`, `GetAdaptersAddresses` on
# Windows) to honour a locator's `#iface=` and the interface rules of access control. A platform
# whose C library lacks it cannot run a host build at all, which is why it is not a capability.
#
# `name-resolution` is in it for the same reason: the TCP and UDP links resolve a locator's host
# through `tokio::net::lookup_host` (`link_pipeline.rs`, `udp_pipeline.rs`, `link_socket.rs`), which
# calls the C library's `getaddrinfo` when the locator names a host rather than an address. Every
# host artifact binds `getaddrinfo` by a relocation (measured from its bytes, `elf_facts.py
# imported_symbols`), and the entry refuses a bound its file's imports refute.
#
# `always` is the part of the base that every run of a host build asks for and cannot go on
# without, whatever its configuration: the manifest's `requires` (T9). `threads` because the
# runtime pool is a multi-threaded tokio runtime and fails to build without them
# (`runtime_pool.rs`), `entropy` because every session's handshake draws from `getrandom`
# (`session_glue.rs` `OsEntropy`). The rest of the base is asked for only by some configurations:
# a node with no TCP endpoint opens no TCP socket, and a failed interface listing leaves a link's
# interface set indeterminate and the link open (`interface_names_for`).
[os]
base = ["threads", "sockets-tcp", "entropy", "interface-list", "name-resolution"]
always = ["threads", "entropy"]

# ─── Platforms (docs/target-build-contract.md T3) ─────────────────────────────────────────────
#
# A platform is one concrete operating system, libc and target triple a build is packaged for; the
# `target` axis of docs/build-configuration.md is the class above it (a host Linux, an MCU image).
# Each row is DECLARED here and CHECKED against the compiler (`wz_config.py --check`): the triple
# must be a target of the pinned rustc, `os` its `target_os`, and `libc` what its `target_os` and
# `target_env` give, so a row cannot say what the compiler does not.
#
# A key a row leaves out is NOT ASSESSED, never guessed: `os_provides` (what the operating system
# gives, from the facility vocabulary of `wz_config.py`) and `system_assumed` (the libraries the
# row assumes a device has, which a measured build of the platform gives). The entry of the
# contract refuses a platform it has no such statement for, and `--check` lists them. `lane` is the
# strongest lane that is green for the platform, `none` until a lane exists and has passed; it is
# changed in the commit that lands the lane. `support` says in words why a lane is `none`:
# `untried` (no build attempted), `built` (a build succeeded and no lane has passed), `blocked`
# (a build was attempted and fails, the row's help says why) or `verified` (a lane is green,
# which is exactly when `lane` is not `none`).
#
# `std = "build-std"` is a platform whose standard library has no prebuilt copy (a tier-3 target).
# The variables a build reads for the triple are derived from it (`toolchain_env`); a platform
# adds the ones its SDK needs on top in `toolchain_env_extra`.
[[platform]]
id = "linux-aarch64-glibc"
triple = "aarch64-unknown-linux-gnu"
os = "linux"
libc = "glibc"
std = "prebuilt"
lane = "build"
support = "verified"
sdk_kind = "yocto"
# What a Linux kernel and a glibc 2.35 give a process: pthreads, TCP and UDP sockets, multicast
# membership, AF_UNIX, files, getrandom, getifaddrs, the wall clock. `raw-ethernet` is the kernel's
# packet socket and needs CAP_NET_RAW, so a build that asks for it needs a service that holds it.
# Read from the standard C library's interface, NOT run on a board.
os_provides = ["threads", "sockets-tcp", "sockets-udp", "multicast", "raw-ethernet", "unix-sockets", "filesystem", "entropy", "wall-clock", "interface-list", "name-resolution"]
system_assumed = ["libgcc_s.so.1", "libm.so.6", "libc.so.6", "ld-linux-aarch64.so.1"]
# The C++ runtime is in a Yocto image only when one of its packages needs it, so it is bundled from
# the SDK's sysroot, never assumed. `--sdk-bundle-check` read it from the glibc 2.35 SDK: it needs
# libm.so.6, libc.so.6 and libgcc_s.so.1, all assumed.
bundle_from_sdk = ["libstdc++.so.6"]
help = "An aarch64 Linux board on glibc 2.35 (a Yocto kirkstone image). Lane `build` is Layer C1sp read on a build machine with the glibc 2.35 SDK (Yocto 4.0.35): all three artifacts package twice with the same manifest bytes and verify, and each measures a glibc floor of GLIBC_2.34. The lane also packages each registered declared node (seven) and verifies it, the first twice, each at the same floor. The declared nodes were run on a Raspberry Pi 4 board on loopback against a stock zenohd and stock examples cross-built for it, and across the board's network against a stock router and examples; the library artifacts were not. The matching SDK is the glibc 2.35 one; the shared glibc 2.39 SDK builds what the board cannot run, which the measured floor would show."

[[platform]]
id = "android-arm64"
triple = "aarch64-linux-android"
os = "android"
libc = "bionic"
std = "prebuilt"
lane = "build"
support = "verified"
sdk_kind = "android-ndk"
# What an API 36 device's C library declares, read from the NDK 30 sysroot headers, and NOT run on a
# device: pthread_create, TCP and UDP sockets, AF_UNIX, IP_ADD_MEMBERSHIP, getifaddrs (introduced in
# API 24), getrandom, files. `raw-ethernet` is left out because an app cannot open a packet socket,
# and `multicast` is the socket option only: a device on Wi-Fi may also need the platform's multicast
# lock, which no wz build takes.
os_provides = ["threads", "sockets-tcp", "sockets-udp", "multicast", "unix-sockets", "filesystem", "entropy", "wall-clock", "interface-list", "name-resolution"]
system_assumed = ["libdl.so", "libm.so", "libc.so"]
# The NDK's C++ runtime: an app that links it carries the file (the NDK's own rule), so it is
# bundled and never assumed. `--sdk-bundle-check` read it from NDK 30: SONAME libc++_shared.so,
# needing libc.so, libm.so and libdl.so.
bundle_from_sdk = ["libc++_shared.so"]
help = "An Android arm64 device (API 36). Lane `build` is Layer C1sp: capi-pico, capi-c and wz-ap-demo are packaged twice through the entry with the NDK 30 toolchain, the manifests are the same bytes and verify. It was read on the owner's workstation only: hosted CI has no NDK, so it reports the platform as not provisioned there. The declared nodes were run on a device (an Android 16 tablet) on loopback against wz's own peer and across its network against a stock router and stock examples; the library artifacts were not."

[[platform]]
id = "qnx710-iosock-aarch64"
triple = "aarch64-unknown-nto-qnx710_iosock"
os = "nto"
libc = "nto"
network_stack = "io-sock"
std = "build-std"
toolchain_env_extra = ["QNX_HOST", "QNX_TARGET"]
lane = "build"
support = "verified"
sdk_kind = "qnx-sdp"
# What the QNX 7.1 SDP headers declare for the io-sock stack, read from them and NOT run on a board:
# pthread_create, TCP and UDP sockets, AF_UNIX, IP_ADD_MEMBERSHIP, getifaddrs, the wall clock, files.
# `entropy` is the board's random device, which no header declares (there is no getrandom or
# getentropy), so it rests on that service running. `raw-ethernet` is left out: SOCK_RAW is an IP raw
# socket, and the link level on QNX is BPF. `multicast` is the IPv4 group join: the IPv6 one answers
# Unsupported (see the help).
os_provides = ["threads", "sockets-tcp", "sockets-udp", "multicast", "unix-sockets", "filesystem", "entropy", "wall-clock", "interface-list", "name-resolution"]
system_assumed = ["libsocket.so.4", "libgcc_s.so.1", "libc.so.5", "libm.so.3"]
# The SDP's C++ runtime and the message catalog it needs: a board of this stack was measured without
# each, so they are bundled, never assumed. `--sdk-bundle-check` read them from the QNX 7.1 SDP:
# libc++.so.1 (aarch64le/usr/lib) needs libcatalog.so.1, libc.so.5, libm.so.3 and libgcc_s.so.1.
bundle_from_sdk = ["libc++.so.1", "libcatalog.so.1"]
help = "QNX 7.1 on aarch64le with the io-sock network stack. Lane `build` is Layer C1sp, read on a build machine with the QNX 7.1 SDP (GCC 8.3, the nightly toolchain with build-std): capi-pico, capi-c and ap-demo are packaged twice through the entry in the release profile, the manifests are the same bytes and verify, and each needs libsocket.so.4, libgcc_s.so.1, libc.so.5 and libm.so.3. Four crates.io packages are carried as copies under third-party/ to build here (socket2, tokio, ring, quinn-udp; each has a WZ-PATCH.md). The IPv6 group join, the keep-alive idle time and the peer credential answer Unsupported until libc declares them for io-sock (the headers have ipv6_mreq, TCP_KEEPIDLE and LOCAL_PEERCRED with struct xucred). ring uses the compile-time CPU features on QNX, not run-time detection. capi-pico stops the process if /dev/urandom cannot be read. Hosted CI has no SDP, so it reports the platform as not provisioned. The lane also packages each registered declared node (seven) and verifies it, the first twice; the node's runtime is the posix port, which reads /dev/urandom for entropy here. The declared nodes were run on a lab board of this stack (a Raspberry Pi 4 for io-sock, an NVIDIA Orin board for io-pkt) on loopback against wz's own peer and across the board's network against a stock router and stock examples; the library artifacts were not."

[[platform]]
id = "qnx710-iopkt-aarch64"
triple = "aarch64-unknown-nto-qnx710"
os = "nto"
libc = "nto"
network_stack = "io-pkt"
std = "build-std"
toolchain_env_extra = ["QNX_HOST", "QNX_TARGET"]
lane = "build"
support = "verified"
sdk_kind = "qnx-sdp"
# What the QNX 7.1 SDP headers declare for the io-pkt stack, read from them and NOT run on a board;
# the same set as the io-sock row (IP_ADD_MEMBERSHIP and getifaddrs are declared in usr/include).
os_provides = ["threads", "sockets-tcp", "sockets-udp", "multicast", "unix-sockets", "filesystem", "entropy", "wall-clock", "interface-list", "name-resolution"]
system_assumed = ["libsocket.so.3", "libgcc_s.so.1", "libc.so.5", "libm.so.3"]
# The SDP's C++ runtime and the message catalog it needs, as for the io-sock row: an image carries
# them only when its integrator chose to. Read from the same SDP by `--sdk-bundle-check`.
bundle_from_sdk = ["libc++.so.1", "libcatalog.so.1"]
help = "QNX 7.1 on aarch64le with the io-pkt stack. Lane `build` is Layer C1sp, read on a build machine with the QNX 7.1 SDP exactly as for the io-sock row; the measured NEEDED set differs from that row in the network library only (libsocket.so.3). The IPv6 group join answers Unsupported. The io-pkt headers declare no IP_RECVTOS, so the QUIC transport does not request the IPv4 type of service on this stack (third-party/quinn-udp). Hosted CI has no SDP, so it reports the platform as not provisioned. The lane also packages each registered declared node (seven) and verifies it, the first twice; the node's runtime is the posix port, which reads /dev/urandom for entropy here. The declared nodes were run on a lab board of this stack (a Raspberry Pi 4 for io-sock, an NVIDIA Orin board for io-pkt) on loopback against wz's own peer and across the board's network against a stock router and stock examples; the library artifacts were not."

# The one platform the entry has run on: the x86_64 Linux host the workspace is built and tested
# on. `os_provides` is what the lanes exercise there (every facility, `raw-ethernet` with the
# CAP_NET_RAW the capture lane holds); `system_assumed` is what a build of the three artifacts
# below measured NEEDED on this host (`scripts/lib/wz_package.py --verify` holds it to the files).
[[platform]]
id = "linux-x86_64-glibc"
triple = "x86_64-unknown-linux-gnu"
os = "linux"
libc = "glibc"
std = "prebuilt"
lane = "none"
support = "built"
os_provides = ["threads", "sockets-tcp", "sockets-udp", "multicast", "raw-ethernet", "unix-sockets", "filesystem", "entropy", "wall-clock", "interface-list", "name-resolution"]
system_assumed = ["libgcc_s.so.1", "libm.so.6", "libc.so.6", "ld-linux-x86-64.so.2"]
help = "The x86_64 Linux host the workspace is built and tested on; the one platform the entry has run on."

# ─── Assessed packages and their features (docs/target-build-contract.md T9) ──────────────────
#
# The packages of an executable whose code asks the operating system for something, each with what
# its own code may ask for. `by_feature = true` assesses each enabled feature of the package in a
# `[[package_feature]]` row of its own, and `os_needs` is then what the package asks whatever its
# features; `by_feature = false` assesses the package whole, for a package whose features forward to
# other packages' features, and `os_needs` then covers its code under any of them.
[[assessed_package]]
package = "wz-runtime-tokio"
by_feature = true
os_needs = []
help = "The runtime: every socket, thread and file read of a session. What every host build asks of it is the [os] base; the rest is by feature."

# The facility oracle (scripts/lib/facility_trace.py) observed the default wz-ap-demo read the
# calendar time, which no runtime row covered: env_logger stamps each log line with it
# (`env_logger::fmt::Formatter::timestamp_seconds`), and the demo logs at `info` unless RUST_LOG
# says otherwise. The demo reads a file only when `--config`, `--sessions` or `--check-topology`
# names one (`main.rs`). Its threads (the worker in `main.rs`, the stop watcher in `stop_event.rs`)
# are the base's. `wz-ap-demo-app`, which `switchboard` pulls, takes none of its own.
# The pico library's ABI surface reads the calendar whatever its capabilities: `z_time_now` is
# `gettimeofday`, and `z_time_now_as_str` a local time (`localtime`, the zone database). The entry's
# import check found it (a profile build without the timestamping capability imports
# `gettimeofday`); a library's own package adds its row to its capabilities' bound. Its features
# select capabilities, whose rows assess them, so the package is assessed whole.
[[assessed_package]]
package = "wz-capi-pico"
by_feature = false
os_needs = ["wall-clock"]
help = "The pico C ABI's own surface: z_time_now and z_time_now_as_str read the calendar and the local zone."

[[assessed_package]]
package = "wz-ap-demo"
by_feature = false
os_needs = ["filesystem", "wall-clock"]
help = "The demo executable: log timestamps (env_logger) and the files its arguments name."

# What a session-node executable asks of a device is decided by the features of the wz runtime it
# links, which cargo resolves and the executable's own feature list does not name. Each feature of
# `wz-runtime-tokio` that a host build has enabled is assessed here for the facilities it MAY ask
# for beyond the `[os]` base (an upper bound, as for a capability), and `wz_config.py --check` holds
# every row to a feature the package still declares. A feature that is enabled and has no row makes
# the executable's `device_requires` UNKNOWN and is listed in its manifest entry, so the part of
# the answer that is missing is visible. Assessed from the feature's declaration in
# `crates/wz-runtime-tokio/Cargo.toml` and the code it gates. The default `preset-ap-client` build of
# wz-ap-demo enables 54 of them (cargo's own resolution, read from the entry's manifest; an earlier
# read of `cargo tree` that found 13 had been cut short by its repeated-subtree marks). The OS is
# touched by few: sockets are opened in `udp_pipeline.rs`, `stream_link.rs`, `link_socket.rs` and
# `session_open.rs`, the interface list by `link_interfaces.rs`, files by the `*_store.rs`,
# `tls_config.rs` and `filesystem_storage.rs` modules, and the wall clock by `timestamp_source.rs`
# (behind `timestamp-wall-clock`) and `stream_link.rs`' certificate-expiry sleep. The core
# (`wz-session-core`), the codecs and the switchboard schema use none of them: what their sources
# say about `std::net` or `SystemTime` is documentation. The rows of a feature that only selects
# protocol code say `[]`.
[[package_feature]]
package = "wz-runtime-tokio"
feature = "codec-close"
os_needs = []
help = "The Close message codec: bytes in, bytes out."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "codec-frame"
os_needs = []
help = "The Frame codec."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "codec-init-body"
os_needs = []
help = "The InitSyn and InitAck body codec."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "codec-join"
os_needs = []
help = "The Join message codec."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "codec-keep-alive"
os_needs = []
help = "The KeepAlive codec."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "codec-open-body"
os_needs = []
help = "The OpenSyn and OpenAck body codec."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "keyexpr-canon"
os_needs = []
help = "Key expression canonicalisation: pure computation."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "link-interfaces"
os_needs = ["interface-list"]
help = "The network interface listing: getifaddrs on unix, GetAdaptersAddresses on Windows."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "session-unicast-accept"
os_needs = []
help = "The accepting side of the session state machine: a state machine over an established link."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "session-unicast-open"
os_needs = []
help = "The opening side of the session state machine."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "transport-link-tcp"
os_needs = ["interface-list"]
help = "The tcp/ link; it carries link-interfaces to honour a locator's #iface=."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "transport-multicast"
os_needs = ["sockets-udp", "multicast", "interface-list"]
help = "The UDP multicast transport: a joined group over a UDP socket on a named interface."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "transport-unicast"
os_needs = []
help = "The unicast transport state machine."

# The protocol planes the session-node executable enables beyond those above: codecs, declarations,
# key-expression matching, liveliness, publication, queries and their options. Each selects code
# over bytes and tables the runtime already holds; none opens a socket, reads a file or the clock.
[[package_feature]]
package = "wz-runtime-tokio"
feature = "codec-declare"
os_needs = []
help = "The Declare codec."

[[package_feature]]
package = "wz-runtime-tokio"
feature = "codec-fragment"
