# A clock the application registers (the observation plane's time, a clock with a quality): a
# hardware clock or a time
# master the device has, which the node reads in place of the system clock. wz's own door, with no
# counterpart in an upstream library, so it is off in every original and part of the unstable
# surface, as `wz_ext_config_device_requires` is.
[[capability]]
id = "clock-source"
# The bit this capability has in the `features` word of a resource snapshot
# (the observation plane's sampled record of the node's resources). Assigned once and never moved
# or reused: a reader of an older or
# newer image reads the bits it knows, so a bit is a name the snapshot's layout has promised.
observation_bit = 0
kconfig = "WZ_CAP_CLOCK_SOURCE"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
default = "off"
abis = ["core", "pico", "c"]
implies = ["timestamping", "unstable-api"]
help = "Register a clock source the node reads instead of the system clock, and report whether it is synchronised."

# The node's event log (the observation plane's events): a ring of fixed-size records that the node
# and the program write events into and that a program reads back, with no text stored. wz's own
# doors, with no counterpart in an upstream library, so off in every original and part of the
# unstable surface. The ring's size is `EVENT_RING_SLOTS` and `EVENT_RECORD_ARGS`, and what a full
# ring gives up is the `event-ring-full` policy.
[[capability]]
id = "event-ring"
observation_bit = 1
kconfig = "WZ_CAP_EVENT_RING"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
default = "off"
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "Write events into the node's event ring and read them back, with no text stored."

# The node's supervisor (the observation plane's supervision): checkpoints an application feeds,
# each with a deadline, an expiry hook that runs once, and a verdict on whether every one is
# healthy that a node can feed a hardware watchdog from. wz's own doors, with no counterpart in an
# upstream library, so off in every original and part of the unstable surface. How many
# checkpoints is the
# `SUPERVISION_CHECKPOINTS` limit, and what an expired one does on the next feed is the
# `supervision-after-expiry` policy.
[[capability]]
id = "supervision"
observation_bit = 2
kconfig = "WZ_CAP_SUPERVISION"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
default = "off"
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "Supervise checkpoints an application feeds, and run a hook once when one misses its deadline."

# The node's resource snapshot (the observation plane's resources): a fixed-layout, versioned
# record of CPU use, memory, tasks and the spacing of the messages the session receives, taken on
# a period and read as bytes. wz's own doors, with no counterpart in an upstream library, so off in
# every original and part of the unstable surface. How often is the `SNAPSHOT_PERIOD_MS` limit,
# and how fine the message-interval histogram is the `SNAPSHOT_HISTOGRAM_BUCKETS` limit.
[[capability]]
id = "resource-snapshot"
observation_bit = 3
kconfig = "WZ_CAP_RESOURCE_SNAPSHOT"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
default = "off"
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "Take a snapshot of the node's resources and the spacing of the messages it receives."

# The pools of the node (the pool monitor): each fixed table states how many entries it holds,
# how many it held at most, and how many it refused for want of room, and the node enumerates them
# under one name each. wz's own, with no counterpart in an upstream library, so off in every original.
# What it costs is the high-water mark each pool keeps, which a build without it does not store.
[[capability]]
id = "pool-monitor"
kconfig = "WZ_CAP_POOL_MONITOR"
os_needs = []
upstream_off = []
default = "off"
abis = ["core"]
implies = []
help = "Record how full each of the node's fixed pools has been and list every pool's occupancy and refusals."

# The peer's initial declarations are final (the declarations-synced event): a declaration
# listener is told, once, that the declarations it has been given are everything the peer held
# when the session was established and the ones after are live. wz's own, with no counterpart in
# an upstream library, so off in every original. The pico ABI tells it to the declaration watch
# of `wz_ext.h` (`wz_ext_decl_watch_declare`).
[[capability]]
id = "declarations-synced-event"
kconfig = "WZ_CAP_DECLARATIONS_SYNCED_EVENT"
os_needs = []
upstream_off = ["zenoh-pico"]
default = "off"
abis = ["core", "pico"]
implies = []
help = "Tell a declaration listener when the peer has sent everything it held, so what follows is live."

# A declaration event names the peer it came from. A session
# is one link, and a session that reconnects can meet another peer, so a listener that outlives
# the link needs the identity beside each event rather than a separate read it could not order
# against them. wz's own, so off in every original. The pico ABI's declaration watch
# (`wz_ext_decl_watch_declare`, `wz_ext.h`) is in a build that has either of the two
# capabilities, and names the peer of each event only with this one.
[[capability]]
id = "remote-declaration-watch"
kconfig = "WZ_CAP_REMOTE_DECLARATION_WATCH"
os_needs = []
upstream_off = ["zenoh-pico"]
default = "off"
abis = ["core", "pico"]
implies = []
help = "Name the peer a declaration event came from, as the zenoh id the session learned at the handshake."

[[capability]]
id = "group"
kconfig = "WZ_CAP_GROUP"
os_needs = []
upstream_off = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "zenoh-ext group membership."

[[capability]]
id = "gossip"
kconfig = "WZ_CAP_GOSSIP"
os_needs = []
upstream_on = ["zenoh", "zenoh-c"]
upstream_off = ["zenoh-pico"]
abis = ["core", "pico", "c"]
implies = ["peer"]
help = "A session told of a node by one it holds a link to dials it."

# The router data plane behind a session of the C ABI (`router-node`): a `mode: "router"` that
# forwards between the clients that dial it, and a peer or client that keeps `gateway/south` apart.
# zenoh and zenoh-c open a router as that in their default builds, and so does the C ABI's: the
# capability is ON by default, which is what makes the default build the zenoh-c preset and not a
# build that opens a router as the registry of faces (which joins none of the faces it holds, so a
# router opened there forwards nothing). A build that leaves it out (a client, a small peer) says
# so, and then opens that registry for every role. It implies what the node and the doors of the
# ABI read: the peer role, the multicast group the node joins, the query and liveliness planes.
[[capability]]
id = "router-node"
kconfig = "WZ_CAP_ROUTER_NODE"
os_needs = []
upstream_on = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = ["peer", "multicast-transport", "query", "queryable", "liveliness", "liveliness-get"]
help = "A router that forwards between its clients, and the node a gateway/south partition needs."

# pico's unstable API (`Z_FEATURE_UNSTABLE_API`, a bare `#define`): the entity ids, the sample's
# reliability and source info, the cancellation token, and the option fields that carry them
# (`reliability`, `source_info`, `cancellation_token`). Off, those fields are not in the option
# structs a program allocates, so the structs are smaller; pico's CMake forces the connectivity
# plane, the advanced publisher and the admin space off with it, which `implies` states from
# their side.
[[capability]]
id = "unstable-api"
kconfig = "WZ_CAP_UNSTABLE_API"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = []
help = "pico's unstable API: entity ids, reliability, source info, the cancellation token, and their option fields."

# pico's connectivity plane (`Z_FEATURE_CONNECTIVITY`): the transport and link snapshots and
# event listeners. Upstream declares it only with the unstable API.
[[capability]]
id = "connectivity"
kconfig = "WZ_CAP_CONNECTIVITY"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["unstable-api"]
help = "pico's connectivity plane: transport and link snapshots, and their event listeners."

# pico's admin space (`Z_FEATURE_ADMIN_SPACE`, off in upstream's default and in the reference
# build): `zp_start_admin_space` / `zp_stop_admin_space`, a queryable answering pico's
# `@/<zid>/pico/**` documents, and the open options' `auto_start_admin_space`. pico's CMake
# turns it off without the queryable and without the unstable API.
[[capability]]
id = "admin-space"
kconfig = "WZ_CAP_ADMIN_SPACE"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
default = "off"
implies = ["queryable", "unstable-api"]
help = "pico's admin space: zp_start_admin_space, zp_stop_admin_space and the @/<zid>/pico/** documents."

# pico's session-local delivery (`Z_FEATURE_LOCAL_SUBSCRIBER`, `Z_FEATURE_LOCAL_QUERYABLE`, both
# off upstream). On, a session's own put reaches its own subscribers, and its own get its own
# queryables, inside the call and on the caller's thread as pico delivers them; the option
# structs gain `allowed_origin` and `allowed_destination`, so the layouts differ from the
# default arm's; and a publisher's or querier's write filter and matching status count the
# session's own entities.
[[capability]]
id = "local-subscriber"
kconfig = "WZ_CAP_LOCAL_SUBSCRIBER"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
default = "off"
implies = []
help = "pico's session-local subscriptions: a session's own put reaches its own subscribers."

[[capability]]
id = "local-queryable"
kconfig = "WZ_CAP_LOCAL_QUERYABLE"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
default = "off"
implies = []
help = "pico's session-local queryables: a session's own get reaches its own queryables."

# pico's header arm for its tasks. On, the C ABI is the one pico's multi-threaded headers declare:
# the read and lease task doors, the host mutex, condvar and task, and the channel collections
# that block. Off, it is the single-threaded one: zp_read, zp_send_keep_alive, zp_send_join and
# zp_spin_once instead, a one-byte z_open_options_t, and channel collections that never block.
# The struct sizes differ between the arms, so a program compiled against one header arm must be
# linked to a build of the same arm. The model has no thread choice of its own (a wz session drives
# itself either way); the core feature exists because every capability is one of the core's.
[[capability]]
id = "multi-thread"
kconfig = "WZ_CAP_MULTI_THREAD"
os_needs = []
upstream_on = ["zenoh-pico"]
abis = ["core", "pico"]
implies = []
help = "pico's multi-threaded C ABI (task doors, host sync, blocking channels); off, the single-threaded one."

# The link kinds and the handshake methods zenoh-c turns on by default. They carry zenoh-c's own
# feature names, so a build of the zenoh-c drop-in is asked for with the switches a zenoh-c build
# is; the pico ABI forwards its links under names of its own and has none of these. The switches
# zenoh-c leaves off (serial, unixpipe, vsock, stats) are features of the two manifests and not
# capabilities here, because a capability is on in every default build.
#
# Both encrypted links read the wall clock: rustls checks a peer certificate's validity against
# the current time (`tls_config.rs`, the `now: UnixTime` of every verifier), and `stream_link.rs`
# sleeps until the certificate expires.

[[capability]]
id = "transport_tls"
kconfig = "WZ_CAP_TRANSPORT_TLS"
os_needs = ["filesystem", "wall-clock"]
upstream_on = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "The tls/ link, dial and accept, with the certificate material of transport/link/tls."

[[capability]]
id = "transport_quic"
kconfig = "WZ_CAP_TRANSPORT_QUIC"
os_needs = ["sockets-udp", "filesystem", "wall-clock"]
upstream_on = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "The quic/ link, dial and accept, with the certificate material of transport/link/tls."

[[capability]]
id = "transport_quic_datagram"
kconfig = "WZ_CAP_TRANSPORT_QUIC_DATAGRAM"
os_needs = []
upstream_on = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = ["transport_quic"]
help = "The quic-datagram/ link, over the quic link's connection and certificate material."

[[capability]]
id = "transport_ws"
kconfig = "WZ_CAP_TRANSPORT_WS"
os_needs = []
upstream_on = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "The ws/ link, dial and accept."

[[capability]]
id = "transport_unixsock-stream"
kconfig = "WZ_CAP_TRANSPORT_UNIXSOCK_STREAM"
os_needs = ["unix-sockets"]
upstream_on = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "The unixsock-stream/ link, dial and accept, on a Unix target."

[[capability]]
id = "transport_multilink"
kconfig = "WZ_CAP_TRANSPORT_MULTILINK"
os_needs = []
upstream_on = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "The multilink establishment extension."

[[capability]]
id = "auth_pubkey"
kconfig = "WZ_CAP_AUTH_PUBKEY"
os_needs = ["filesystem"]
upstream_on = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "The public-key handshake, from the RSA identity of transport/auth/pubkey."

[[capability]]
id = "e2e-sender"
kconfig = "WZ_CAP_E2E_SENDER"
# On in the zenoh-c ABI's default build, which has exported these doors since they were added and
# which a participant that sends protected messages links as it is. Off in the pico ABI's: its
# default is zenoh-pico's own surface, and its doors are wz_ext_* of the unstable surface, as its
# other wz-own doors are; the zenoh-c ABI has no unstable capability, so that edge reaches pico
# alone.
default_off_abis = ["pico"]
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "The sending side of an end-to-end protected message: a frame built under a profile with the counter kept per stream (wz_capi_c_e2e_sender_*, wz_ext_e2e_sender_*, wz-own doors) and the frame writer behind it."

[[capability]]
id = "e2e-receiver"
kconfig = "WZ_CAP_E2E_RECEIVER"
# Off by default: neither zenoh-pico nor zenoh-c has such doors. The receiving judge of end-to-end
# protected frames, kept per stream in storage the program sizes, with the judging rules the
# profile states, and a status beside every sample, whose payload is always handed on.
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["unstable-api"]
help = "The receiving judge of end-to-end protected frames: per-stream state, the judging rules a profile states, and a status per sample (wz_ext_e2e_receiver_*, wz-own doors)."

[[capability]]
id = "e2e-sender-demux"
kconfig = "WZ_CAP_E2E_SENDER_DEMUX"
# Off by default: a receiver whose message has one sender, or keeps its streams by instance, does
# not need it. On, a receiver keeps one judge per sender, chosen by the sender identity of the
# frame's header, in at most E2E_SENDER_SLOTS slots bound by a list or taken in arrival order.
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["e2e-receiver"]
help = "Judging state per sender for the receiving judge, keyed by a header field, in slots bound by a list or taken in arrival order (E2E_SENDER_SLOTS)."

[[capability]]
id = "instance-key"
kconfig = "WZ_CAP_INSTANCE_KEY"
# Off by default: neither zenoh-pico nor zenoh-c tells the instances of one message apart. On, a
# message names up to INSTANCE_KEY_FIELDS fields of its payload, read through its schema, and the
# values each may take; the position of a sample's values in the product of those lists is its
# instance, at most INSTANCES_PER_MESSAGE of them. The instance is the stream the end-to-end doors
# judge and count in, and a last value is kept per instance; a sample of no instance is dropped and
# counted. Instance keys and sender slots are exclusive on one message, and the doors refuse a
# receiver keyed by sender.
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["unstable-api"]
help = "The instance of a message a sample is, read from fields of its payload: a stream of the end-to-end doors and a last value per instance, samples of no instance dropped and counted (wz_ext_instance_keyer_*, wz-own doors; INSTANCE_KEY_FIELDS, INSTANCES_PER_MESSAGE)."

[[capability]]
id = "config-verdict"
kconfig = "WZ_CAP_CONFIG_VERDICT"
# On by default: a program that writes or checks configurations for other nodes links the default
# library. A build that names its features, a client above all, leaves it out: the emitter of a
# stock node's config, the per-node and topology validators and the device requirement of an open
# are reached through these doors and nothing else (about 78 KB of symbols in a default release
# build, read with nm), and an open reads its own config without any of them.
os_needs = []
upstream_off = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "A configuration judged, emitted and costed without opening it: the defects of one node and of a topology, the config a stock node would start with, the link schemes of the build, and what an open of it asks of the operating system (wz_capi_c_config_validate*, wz_capi_c_config_to_json5, wz_capi_c_config_*link_scheme*, wz_capi_c_config_verdict_*, wz_capi_c_config_device_requires, wz-own doors)."

[[capability]]
id = "identity-make"
kconfig = "WZ_CAP_IDENTITY_MAKE"
# Off by default: the certificate writer it links cost capic-default 147,929 B (hosted C1cs,
# run 42403286547) for a door a client calls once, at its first start. A consumer that makes
# its identity on its own computer turns it on.
default = "off"
os_needs = ["filesystem"]
upstream_off = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = ["transport_tls"]
help = "The identity a client presents over TLS, made on the computer it runs on by the contract of a declared node's --make-identity (wz_capi_c_identity_make, a wz-own door), answering the zid its key names."

[[capability]]
id = "lifecycle-doors"
kconfig = "WZ_CAP_LIFECYCLE_DOORS"
# Off by default: zenoh-c has no lifecycle verbs, and the two doors cost every C ABI build about
# 19 KB of code (hosted C1cs, measured by nm against the round before them). A client that asks a
# node's lifecycle verbs turns it on.
default = "off"
os_needs = []
upstream_off = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "A node's lifecycle verbs from a client: the key a verb is asked by and the answer read back (wz_capi_c_lifecycle_key, wz_capi_c_lifecycle_read, wz-own doors over lifecycle_wire)."

[[capability]]
id = "segment-sender"
kconfig = "WZ_CAP_SEGMENT_SENDER"
# Off by default: neither zenoh-c nor zenoh-pico has such doors, and they link the piece writer of
# wz-app-frame into a library that only a participant sending to a deployment which splits its
# large messages needs. The pico ABI's doors are wz_ext_* and part of its unstable surface, as its
# other wz-own doors are; the zenoh-c ABI has no unstable capability, so the edge reaches pico alone.
default = "off"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "The sending side of a declared segment profile: one message cut into the pieces the profile's header describes, put on a publisher or handed to a callback (wz_capi_c_segment_sender_*, wz_ext_segment_sender_*, wz-own doors)."

# Reception supervision per stream: a receiver gives each periodic stream a deadline of its period
# times a factor, and is told once when a stream stops arriving, with saturating error counts per
# stream and per node. Judged only after a start delay and while a condition the application
# supplies holds; a sender the application marks absent is not judged. Off by default: neither
# zenoh-c nor zenoh-pico has such doors. The pico ABI's doors are wz_ext_* and part of its unstable
# surface; the model is wz-session-core's `stream_supervisor`. How many streams one supervisor holds
# is the `E2E_SUPERVISED_STREAMS` limit, and whether a loss carries the stream's last payload is the
# `e2e-supervision-notify` policy.
[[capability]]
id = "e2e-supervision"
kconfig = "WZ_CAP_E2E_SUPERVISION"
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["unstable-api"]
help = "Supervise the reception of periodic streams: a deadline per stream, a loss told once, saturating error counts, a start delay, an application condition and absent senders (wz_ext_stream_supervisor_*, wz-own doors)."

# The replay cache: a publisher keeps the frames it last sent of each instance of a message, as it
# sent them, and answers them on the message's key plus a suffix the application states; a
# subscriber asks each publisher as its suffixed queryable appears and judges the answers in the
# receive path of its live samples. Off by default: neither zenoh-c nor zenoh-pico has such doors.
# The pico ABI's doors are wz_ext_* and part of its unstable surface; the ring, the serving gate and
# the subscriber's round are wz-session-core's. How deep a ring is is the REPLAY_DEPTH_MAX limit;
# the answer's shape, whether serving holds the message's sends and whether live samples wait for
# the replay are the three replay-* policies. The subscriber hears a publisher's queryable through
# the declaration watch, asks it with a get and judges the answers with the receiving judge, so
# the capability implies both ends of a query, the watch and the judge.
[[capability]]
id = "replay-cache"
kconfig = "WZ_CAP_REPLAY_CACHE"
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["unstable-api", "query", "queryable", "remote-declaration-watch", "e2e-receiver"]
help = "Replay what each publisher last sent to a subscriber that arrives later: a ring of sent frames per instance, answered on a suffixed key, asked of each publisher as it appears and merged with live data in one stated order (wz_ext_replay_*, wz-own doors)."

# The message catalog: one JSON5 declaration of a deployment's messages (key expression, id, the
# nodes that publish and subscribe, period, protection profile and values, senders, instance keys,
# replay depth, supervision, segment profile), read and judged at run time by one reader, which
# hands the other doors what they are made from: a sender, a receiver, supervision rows. A
# fixed-memory image runs the generator over the same file (scripts/lib/message_catalog.py) and
# links static tables instead. How many messages one catalog holds is `MESSAGE_CATALOG_ENTRIES`.
# Off by default: neither zenoh-pico nor zenoh-c has such doors. The pico ABI's doors are wz_ext_*
# and part of its unstable surface; the reader is wz-app-frame's.
[[capability]]
id = "message-catalog"
kconfig = "WZ_CAP_MESSAGE_CATALOG"
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["unstable-api"]
help = "A deployment's messages declared once, as data, and read at run time: the entry of each message, and the e2e sender, receiver and supervision rows made from it (wz_ext_message_catalog_*, wz-own doors)."

# The payload of a catalog message, set and read field by field at paths under `.proto` files the
# program hands over when it runs, and its protobuf bytes encoded and decoded: what a host program
# that knows its messages by name and its fields by path needs when no code is generated for them.
# Made for a message of the catalog, so it implies the catalog. Off by default: neither zenoh-pico
# nor zenoh-c has such doors. The pico ABI's doors are wz_ext_* and part of its unstable surface;
# the payload is wz-app-frame's and the schema is read by its one `.proto` reader.
[[capability]]
id = "message-payload"
kconfig = "WZ_CAP_MESSAGE_PAYLOAD"
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["unstable-api", "message-catalog"]
help = "The payload of a catalog message set and read field by field, by path, under .proto files read at run time, and its protobuf bytes encoded and decoded (wz_ext_payload_schema_*, wz_ext_message_payload_*, wz-own doors)."

[[capability]]
id = "app-transport"
kconfig = "WZ_CAP_APP_TRANSPORT"
# Off by default: zenoh-pico opens its links on the system's sockets, and so does a build made as it
# is. A program whose network stack is its own turns it on and hands each config the transport its
# session opens every link on. It asks nothing of the operating system: the program's stack carries
# the links. The pico ABI's doors are wz_ext_* and part of its unstable surface; the model threads
# the transport to each dial and listen of a session.
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["unstable-api"]
help = "A transport the program supplies in place of the system's sockets: the session calls the program's open, send and close, and the program hands in what its stack received and what happened to each link (wz_ext_transport_*, wz_ext_config_transport, wz-own doors)."

[[capability]]
id = "time-base"
kconfig = "WZ_CAP_TIME_BASE"
# Off by default: zenoh-pico, zenoh-c and zenoh time their sessions by the system's monotonic clock,
# and so does a build made as any of them is. A program that runs its sessions on a time of its own
# (a simulation, paused, or faster or slower than the wall clock) turns it on and hands each config
# the time base its session's timers run on. It asks nothing of the operating system. The pico ABI's
# doors are wz_ext_* and part of its unstable surface, the zenoh-c ABI's are wz_capi_c_*; the model
# makes the session's clock over the time base, for either engine. A node that forwards between its
# faces is not timed by one, and its open refuses a config that names one.
default = "off"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "A time base the program supplies in place of the system's clock: the timers of a session opened from a config that names it (lease, keep-alive, handshake and the other deadlines) run on the program's time, which the program reads to the library and says when it has moved on (wz_ext_time_base_* and wz_ext_config_time_base, wz_capi_c_time_base_* and wz_capi_c_config_time_base, wz-own doors)."

[[capability]]
id = "object-pool"
kconfig = "WZ_CAP_OBJECT_POOL"
# Off by default: zenoh-pico allocates the objects behind its owned handles from the heap as it
# makes them, and so does a build made as it is. A program that must make no allocation while it
# runs turns it on and reserves the pools once, before it makes the objects; each count it states
# is held to the bound of the session limit that bounds the object. The pico ABI's doors are
# wz_ext_* and part of its unstable surface.
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["unstable-api"]
help = "Fixed pools, one per kind of object, that the objects behind the owned handles (sessions, publishers, subscribers, queryables, liveliness tokens and subscribers, owned samples, replies, queries and payloads) are taken from in place of the heap once the program reserves them; a full pool refuses the object with _Z_ERR_SYSTEM_OUT_OF_MEMORY (wz_ext_object_pool_*, wz-own doors)."

[[capability]]
id = "object-pool-region"
kconfig = "WZ_CAP_OBJECT_POOL_REGION"
# Off by default, as the pools it places are: a program that states where its memory lies hands
# the library a region to lay the pools over instead of reserving them from the heap.
default = "off"
os_needs = []
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
implies = ["object-pool"]
help = "The object pools laid over memory the program hands over in place of one heap allocation (wz_ext_object_pool_place, a wz-own door)."

[[capability]]
id = "shared-key-ids"
kconfig = "WZ_CAP_SHARED_KEY_IDS"
# Off by default: a node that names a key by an id it never declared cannot be read by a stock
# peer, which has no such dictionary, so a build has the dictionary and the forms of the
# key-wire-form policy that use it only when a deployment asks for them. The pico ABI's doors are
# wz_ext_* and part of its unstable surface, as its other wz-own doors are; both engines hold the
# dictionary and name each link's keys in that link's form. A configuration document states the
# same in its wz/key-ids member, which the zenoh-c ABI reads from its config and the pico ABI from
# wz_ext_config_document; the doors go over the document. The zenoh-c ABI adds no door and no type.
default = "off"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "Key ids every node of a deployment shares: a dictionary of key expressions and their ids given at open, and the key-wire form of one endpoint stated apart (the wz/key-ids member of a configuration document, and wz_ext_config_key_ids and wz_ext_config_key_wire_form_for, wz-own doors over it), so a put, a query, a reply or a declaration names its key by the id with no declaration first, as the key-wire-form policy says."

[[capability]]
id = "rx-callback-offload"
kconfig = "WZ_CAP_RX_CALLBACK_OFFLOAD"
# Off by default: zenoh-c runs a subscriber's callback where the sample arrives, and so does a build
# made as it is. The lane is bounded by the limits DELIVERY_LANE_EVENTS and DELIVERY_LANE_BYTES,
# and what a full lane does is the subscriber-overload policy or the declaration's own answer
# (the receive delivery lane). The door takes reject and keep-latest and refuses block, which needs
# a drain no loop of this ABI's sessions owns.
default = "off"
os_needs = []
upstream_off = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "A subscriber whose callback runs off the receive path: every face copies its samples into one bounded lane and the callback runs on the application runtime, in order (wz_capi_c_declare_subscriber_offloaded, wz_capi_c_subscriber_offload_stats, wz-own doors)."

[[capability]]
id = "switch-doors"
kconfig = "WZ_CAP_SWITCH_DOORS"
# Off by default: zenoh-c has no such statements, and the doors are for a client that states the
# links an entity may use, a publish's retry or all-or-none form, or a query's target node. The
# policies they read (entity-link-restriction, publisher-admission-retry, multi-route-atomic-tx,
# targeted-query) are off in a build made as upstream is, and a stated value is refused while its
# policy is off.
default = "off"
os_needs = []
upstream_off = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = ["query", "queryable", "liveliness"]
