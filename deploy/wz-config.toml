# ## The upstream switches (docs/build-configuration.md, C7)
#
# Every build switch of zenoh-pico (each `Z_FEATURE_*` its CMakeLists defines) and of zenoh-c
# (each cargo feature it declares, less `default` and the implicit ones of optional dependencies),
# judged against the drop-in of that original: `maps` (a wz feature of the drop-in crate toggles
# the same thing; `anchor` is `<crate>/<feature>`), `always` (wz has it in that build with no
# switch; `anchor` is the tracked file that shows it), `never` (wz does not have it; the note
# cites the open-debt item that owns the gap) or `n/a` (no meaning for wz; the note says why).
# `upstream_switch_map.py` holds the rows to the pinned sources both ways.
#
# A zenoh-pico `maps` row to a capability is that capability's pico switch: a pico `config.h`
# turns the capability on when one of its switches is on, or when all are where the capability
# says `pico_combine = "all"`. A capability no row reaches but which pico has whenever several
# switches are all on names them in `pico_flags_all`.

[[upstream_switch]]
original = "zenoh-pico"
switch = "Z_FEATURE_UNSTABLE_API"
class = "maps"
anchor = "wz-capi-pico/unstable-api"
note = "the entity ids, reliability, source info and the cancellation token, and the option fields that carry them; off, every option struct has upstream's default layout"

[[upstream_switch]]
original = "zenoh-pico"
switch = "Z_FEATURE_CONNECTIVITY"
class = "maps"
anchor = "wz-capi-pico/connectivity"
note = "the connectivity status and event doors; implies unstable-api, as upstream's CMake forces it off without the unstable API"

[[upstream_switch]]
