[[limit]]
id = "MAX_KEYEXPR_BYTES"
kconfig = "WZ_LIMIT_MAX_KEYEXPR_BYTES"
default = 256
help = '''
The longest key expression, in bytes, a session stores: a subscription's
pattern, or a key a peer declared. A longer one is refused, never cut short.
Every table that stores keys sizes its rows by this.
'''

[[limit]]
id = "MAX_SUBSCRIPTIONS"
kconfig = "WZ_LIMIT_MAX_SUBSCRIPTIONS"
default = 16
help = '''
The subscribers a session holds at once. Declaring one more is refused
while the table is full.
'''

[[limit]]
id = "MATCH_MEMO_SLOTS"
kconfig = "WZ_LIMIT_MATCH_MEMO_SLOTS"
default = 8
help = '''
How many distinct keys the receive match cache remembers at once: the keys
whose matching subscriptions it can answer without matching again. It is a
direct-mapped table, so a key that maps to a used slot replaces what was
there. More slots keep more keys at the cost of memory. 0 leaves the cache
out: every message is matched against the subscriptions, which reaches the
same subscribers in the same order, as zenoh-pico does where its
Z_FEATURE_RX_CACHE is off (its default). A build whose tables are fixed in
size reads MATCH_MEMO_FIXED_SLOTS instead: its cache is paid for in RAM
whether used or not, a heap's only as it fills.
'''

[[limit]]
id = "MATCH_MEMO_FIXED_SLOTS"
kconfig = "WZ_LIMIT_MATCH_MEMO_FIXED_SLOTS"
default = 0
help = '''
MATCH_MEMO_SLOTS for a build whose tables are fixed in size (no allocator,
or the fixed storage policy): how many distinct keys the receive match cache
remembers, each held in RAM for good, a key's text of up to
MATCH_MEMO_KEY_BYTES bytes plus the subscriptions it matched. 0 (the
default) leaves the cache out, so a build that does not ask for it pays
nothing; every message is then matched against the subscriptions, which
reaches the same subscribers in the same order. A closed key set needs no
cache for the keys of its table.
'''

[[limit]]
id = "MATCH_MEMO_KEY_BYTES"
kconfig = "WZ_LIMIT_MATCH_MEMO_KEY_BYTES"
default = 64
help = '''
The longest key, in bytes, the receive match cache of a fixed-size build
remembers. A longer key is matched every time it arrives, never cut short.
Read only where MATCH_MEMO_FIXED_SLOTS is above 0.
'''

[[limit]]
id = "DELIVERY_LANE_EVENTS"
kconfig = "WZ_LIMIT_DELIVERY_LANE_EVENTS"
default = 64
help = '''
How many samples the delivery lane of an offloaded subscriber holds at once:
the samples the receive path has copied in and its callback has not yet run
on. A sample past this is refused and counted. It must be at least 1.
'''

[[limit]]
id = "DELIVERY_LANE_BYTES"
kconfig = "WZ_LIMIT_DELIVERY_LANE_BYTES"
default = 65536
help = '''
How many bytes of copied samples a delivery lane holds at once: the key, the
payload, the attachment and the encoding schema of each waiting sample, and
the end of the byte area a sample skipped to stay in one piece. A sample that
does not fit is refused and counted. It must be at least 1.
'''

[[limit]]
id = "DELIVERY_LANE_CALLBACKS"
kconfig = "WZ_LIMIT_DELIVERY_LANE_CALLBACKS"
default = 256
help = '''
How many callback invocations a delivery lane owes at once. A host that admits
a sample once for each subscription it reaches owes one callback per sample, so
this binds only past the event limit and is left larger than it; a host that
admits a sample once for all its subscriptions owes several. It must be at
least 1.
'''

[[limit]]
id = "MAX_QUERYABLES"
kconfig = "WZ_LIMIT_MAX_QUERYABLES"
default = 16
help = '''
The queryables a session holds at once. Declaring one more is refused
while the table is full.
'''

[[limit]]
id = "MAX_PENDING_QUERIES"
kconfig = "WZ_LIMIT_MAX_PENDING_QUERIES"
default = 16
help = '''
The queries (gets) a session has waiting for their replies at once.
Issuing one more is refused while the table is full.
'''

[[limit]]
id = "MAX_DECL_OBSERVERS"
kconfig = "WZ_LIMIT_MAX_DECL_OBSERVERS"
default = 8
help = '''
The observers an application installs on the declarations of its peers
(subscribers, queryables and liveliness tokens appearing or leaving), per
kind and per direction. They are installed once at start, so few are
needed; one more is refused.
'''

[[limit]]
id = "MAX_LIVELINESS_SUBSCRIPTIONS"
kconfig = "WZ_LIMIT_MAX_LIVELINESS_SUBSCRIPTIONS"
default = 8
help = '''
The liveliness subscribers a session holds at once. Declaring one more
is refused while the table is full.
'''

[[limit]]
id = "MAX_LOCAL_TOKENS"
kconfig = "WZ_LIMIT_MAX_LOCAL_TOKENS"
default = 8
help = '''
The liveliness tokens a session itself declares and holds at once.
Declaring one more is refused while the table is full.
'''

[[limit]]
id = "MAX_PENDING_LIVELINESS_GETS"
kconfig = "WZ_LIMIT_MAX_PENDING_LIVELINESS_GETS"
default = 8
help = '''
The liveliness gets (snapshots of the tokens alive) a session has waiting
for their answer at once. A get ends as soon as its answer is complete, so
few are waiting together; one more is refused while the table is full.
'''

[[limit]]
id = "MAX_PENDING_DECLARES"
kconfig = "WZ_LIMIT_MAX_PENDING_DECLARES"
default = 32
help = '''
The declarations a session can have ready to send in answer to its peers'
interests between two sends: each answer is the session's matching
declarations and a final. An answer that does not fit whole is refused and
counted, never sent in part.
'''

[[limit]]
id = "MAX_INBOUND_SUB_INTERESTS"
kconfig = "WZ_LIMIT_MAX_INBOUND_SUB_INTERESTS"
default = 16
help = '''
The peers' interests in this session's subscribers that the session
remembers, so that a subscriber declared later is announced to them: one
per publisher a peer holds with a write filter. Past it a peer still gets
the subscribers of the moment, not the later ones.
'''

[[limit]]
id = "MAX_PEER_KEYEXPR_ALIASES"
kconfig = "WZ_LIMIT_MAX_PEER_KEYEXPR_ALIASES"
default = 16
help = '''
The key expressions one peer may have declared to this session at a time,
to name them by a short id. One more is refused and counted, and a message
that names it is dropped, as one naming an undeclared id is.
'''

[[limit]]
id = "MAX_REMOTE_DECLS"
kconfig = "WZ_LIMIT_MAX_REMOTE_DECLS"
default = 16
help = '''
The declarations of one kind (subscribers, queryables, liveliness tokens)
one peer may hold open to this session at a time. One more is refused and
counted, and the application is not told of it.
'''

[[limit]]
id = "MAX_PENDING_REPLIES"
kconfig = "WZ_LIMIT_MAX_PENDING_REPLIES"
default = 8
help = '''
The replies a session's queryables may have ready to send between two
sends. One more is refused and counted, and the handler that made it is
told.
'''

[[limit]]
id = "MAX_PENDING_FINALS"
kconfig = "WZ_LIMIT_MAX_PENDING_FINALS"
default = 8
help = '''
The queries a session may owe the end of an answer between two sends. A
query that would need one more is refused, and counted, before its
queryables run: an answer that could not be ended would leave the asker
waiting until its own timeout.
'''

[[limit]]
id = "MAX_REPLY_PAYLOAD_BYTES"
kconfig = "WZ_LIMIT_MAX_REPLY_PAYLOAD_BYTES"
default = 1024
help = '''
The largest payload of one reply, in bytes, and the largest attachment
beside it. A larger reply is refused, never cut short.
'''

[[limit]]
id = "MAX_ADMIN_REPLY_BYTES"
kconfig = "WZ_LIMIT_MAX_ADMIN_REPLY_BYTES"
default = 1024
help = '''
The largest admin space reply, in bytes. A larger one is refused, counted,
and answered to the asker as an error, never cut short. It cannot exceed
the largest reply payload (WZ_LIMIT_MAX_REPLY_PAYLOAD_BYTES).
'''

[[limit]]
id = "MAX_ADMIN_LOCATORS"
kconfig = "WZ_LIMIT_MAX_ADMIN_LOCATORS"
default = 4
help = '''
The listening locators a node without an allocator reports in its admin
space. One more is refused when the node starts, never dropped.
'''

[[limit]]
id = "MAX_ADMIN_SESSION_LINKS"
kconfig = "WZ_LIMIT_MAX_ADMIN_SESSION_LINKS"
default = 2
help = '''
The links one session's row lists in the admin space. A unicast session
has one; a row with more is refused and counted, not listed in part.
'''

[[limit]]
id = "MAX_MULTICAST_REPLIES"
kconfig = "WZ_LIMIT_MAX_MULTICAST_REPLIES"
default = 8
help = '''
The replies a node without an allocator holds for a multicast group before
it sends them. One more is dropped and counted: a group is best effort, and
an asker whose reply was dropped asks again.
'''

[[limit]]
id = "MAX_TASKS"
kconfig = "WZ_LIMIT_MAX_TASKS"
default = 8
help = '''
The most tasks the runtime of a fixed-memory image may hold: a ceiling on
the task table the image declares, which the image is checked against when
it compiles.
'''

[[limit]]
id = "MAX_TIMERS"
kconfig = "WZ_LIMIT_MAX_TIMERS"
default = 16
help = '''
The most timers the runtime of a fixed-memory image may hold: a ceiling on
the timer table the image declares, checked as the task ceiling is.
'''

[[limit]]
id = "MAX_LOCATOR_LEN"
kconfig = "WZ_LIMIT_MAX_LOCATOR_LEN"
default = 64
help = '''
The longest locator, in bytes, a node stores: one it is told to connect
to, or one it listens on (for example udp/192.168.1.10:7447). A longer one
is skipped, never cut short. The default fits an IPv6 locator with its
scheme and port.
'''

[[limit]]
id = "MAX_STATIC_CONNECT"
kconfig = "WZ_LIMIT_MAX_STATIC_CONNECT"
default = 8
help = '''
The locators a node is told to connect to. A list longer than this stops
at the limit; a fixed deployment names a few peers.
'''

[[limit]]
id = "MAX_PEER_NODES"
kconfig = "WZ_LIMIT_MAX_PEER_NODES"
default = 0
help = '''
The nodes a fixed-memory image may be asked to open a session with by their
zid, beside the locators it is told to connect to: one a session lifecycle
open names, whose locators the node learned from a Hello or was built with.
Each holds a connection machine of some 930 bytes and its share of the
peer tables, so the default is 0: a node that is never asked to open a peer
by its zid declares none of that, and refuses the open. One more than this
is refused.
'''

[[limit]]
id = "QUERIER_MAX_PENDING_QUERIES"
kconfig = "WZ_LIMIT_QUERIER_MAX_PENDING_QUERIES"
default = 0
help = '''
The queries one declared querier may have in flight at once; one more is
refused until a pending one ends. A query ends when its final arrives, its
deadline passes, or its handle is unregistered. The bound is per querier,
not per session, so one busy querier cannot starve another. 0 is no bound,
which is upstream's behaviour. Unlike the other limits this one sizes no
table: it only refuses the one more. It binds the Rust session API; the C
ABIs and the cooperative engine do not hold to it yet.
'''

[[limit]]
id = "TX_NO_PROGRESS_WINDOW_US"
kconfig = "WZ_LIMIT_TX_NO_PROGRESS_WINDOW_US"
default = 1000000
help = '''
How long, in microseconds, a blocking message may wait with no progress
when the tx-no-progress-deadline policy is on: no fragment of it going out.
It is read only when that policy is on, and must be at least 1 and no more
than the total wait before the session is closed, which is set as before.
'''

[[limit]]
id = "TX_EXPIRY_CLOSE_AFTER"
kconfig = "WZ_LIMIT_TX_EXPIRY_CLOSE_AFTER"
default = 0
help = '''
How many blocking messages in a row may find no room within their deadline
before the session is closed as unresponsive, when the tx-expiry-keeps-session
policy is on. A blocking message that does find room ends the run. 0 never
closes the session, which is the policy as it was before this limit. At most
65535: a larger value counts as 65535. It is read only when that policy is on.
'''

[[limit]]
id = "SNAPSHOT_PERIOD_MS"
kconfig = "WZ_LIMIT_SNAPSHOT_PERIOD_MS"
default = 1000
help = '''
How often, in milliseconds, the node takes a snapshot of itself: what it spends
and how its messages are spaced. The node holds no timer for it: the program
asks for a sample on its own cadence, and one is taken when this much time has
passed since the last. At least 1 and at most 2147483 (about 35 minutes).
'''

[[limit]]
id = "SNAPSHOT_HISTOGRAM_BUCKETS"
kconfig = "WZ_LIMIT_SNAPSHOT_HISTOGRAM_BUCKETS"
default = 24
help = '''
How many buckets the snapshot's message-interval histogram has, each 8 bytes.
Bucket 0 holds intervals of 0 and 1 microsecond, bucket b the intervals from
2^b to 2^(b+1) - 1 microseconds, and the last bucket everything above it, so 24
buckets tell intervals up to about 8 seconds apart and 32 cover the whole range.
More buckets spread the tail of the distribution further out and make the
snapshot longer. At least 1 and at most 32.
'''

[[limit]]
id = "SUPERVISION_CHECKPOINTS"
kconfig = "WZ_LIMIT_SUPERVISION_CHECKPOINTS"
default = 4
help = '''
How many checkpoints the node's supervisor watches. Each is a deadline an
application feeds, and the node is healthy only while every checkpoint that is
supervised has been fed in time. At least 1 and at most 64.
'''

[[limit]]
id = "EVENT_RING_SLOTS"
kconfig = "WZ_LIMIT_EVENT_RING_SLOTS"
default = 64
help = '''
How many event records the node's event ring holds. When the ring is full,
the event-ring-full policy decides which record is lost: the oldest or the
newest. Each record is a few words, a fixed size, so the ring's memory is this
number times that size. At least 1.
'''

[[limit]]
id = "EVENT_RECORD_ARGS"
kconfig = "WZ_LIMIT_EVENT_RECORD_ARGS"
default = 4
help = '''
How many integer arguments one event record carries, each 8 bytes. A record
has no text: the format an event is read with is a constant the reader holds,
and the arguments fill it. An event with more arguments than this keeps the
first of them. At most 255.
'''

[[limit]]
id = "CLOCK_SOURCES"
kconfig = "WZ_LIMIT_CLOCK_SOURCES"
default = 1
help = '''
How many clock sources an application can register with the node at once, when
the clock-source capability is on. A node reads its time from the registered
sources in the order they were registered, and the first that can say what time
it is answers; with none registered it reads the system clock. 0 registers
none, which leaves the system clock as the only source.
'''

[[limit]]
id = "CLOCK_MAX_FORWARD_STEP_MS"
kconfig = "WZ_LIMIT_CLOCK_MAX_FORWARD_STEP_MS"
default = 500
help = '''
How far ahead of the node's clock, in milliseconds, a timestamp from another
node may be before the node's hybrid logical clock refuses it, as zenoh's
UHLC_MAX_DELTA_MS. A refused timestamp is not taken into the clock, and the
data carrying it is stamped afresh or dropped as the timestamping settings say.
A host that sets the environment variable UHLC_MAX_DELTA_MS to a whole number of
milliseconds overrides this at start, as it does zenoh's own bound. 0 refuses
any timestamp ahead of the clock.
'''

[[limit]]
id = "DECLARATION_SYNC_BURST_MESSAGES"
kconfig = "WZ_LIMIT_DECLARATION_SYNC_BURST_MESSAGES"
default = 8
help = '''
How many declarations one turn of a paced declaration replay sends, when the
declaration-sync-pacing policy is on. It is read only when that policy is on.
It must be at least 1: a turn that sends nothing would never finish.
'''

[[limit]]
id = "DECLARATION_SYNC_FINAL_TIMEOUT_MS"
kconfig = "WZ_LIMIT_DECLARATION_SYNC_FINAL_TIMEOUT_MS"
default = 1000
help = '''
How long, in milliseconds, a node waits for the peer's answer to an interest it
sent before it counts the interest as unanswered and goes on. It bounds the
wait of declarations_synced and wait_declarations_stable: a peer that never
answers an interest does not hold a node unsynced for ever. It is read whether
or not the declaration-sync-pacing policy is on, and must be at least 1.
'''

[[limit]]
id = "DECLARATION_SYNC_INTERVAL_MS"
kconfig = "WZ_LIMIT_DECLARATION_SYNC_INTERVAL_MS"
default = 10
help = '''
How long, in milliseconds, a paced declaration replay waits between two of its
turns, when the declaration-sync-pacing policy is on. The session keeps being
served during the wait. It is read only when that policy is on, and must be at
least 1.
'''

# The numbers of zenoh-pico's value switches (the `maps` rows above that anchor to a limit), as the
# pico ABI states them. Each defaults to pico's own default, so the drop-in's default build states
# what pico's does; a pico built with other numbers is matched by stating them here.

[[limit]]
id = "PICO_UNICAST_BATCH_BYTES"
kconfig = "WZ_LIMIT_PICO_UNICAST_BATCH_BYTES"
default = 2048
help = '''
The batch size, in bytes, a session of the zenoh-pico interface advertises when
it opens a unicast session, as zenoh-pico's BATCH_UNICAST_SIZE. The two sides
send frames no larger than the smaller of the two sizes. At most 65535.
'''

[[limit]]
id = "PICO_MULTICAST_BATCH_BYTES"
kconfig = "WZ_LIMIT_PICO_MULTICAST_BATCH_BYTES"
default = 2048
help = '''
The batch size, in bytes, a session of the zenoh-pico interface advertises in
the Join of a multicast group, as zenoh-pico's BATCH_MULTICAST_SIZE. zenoh-pico
refuses a member whose Join states another size, so every member of a group
states the same. At most 65535.
'''

[[limit]]
id = "PICO_LEASE_MS"
kconfig = "WZ_LIMIT_PICO_LEASE_MS"
default = 10000
help = '''
The lease, in milliseconds, a session of the zenoh-pico interface advertises,
unicast and in a multicast group's Join, as zenoh-pico's Z_TRANSPORT_LEASE. A
peer that hears nothing from the session for this long closes it.
'''

[[limit]]
id = "PICO_SOCKET_TIMEOUT_MS"
kconfig = "WZ_LIMIT_PICO_SOCKET_TIMEOUT_MS"
default = 100
help = '''
How long, in milliseconds, one read step of the cooperative zenoh-pico session
waits on its link before it returns with nothing, as zenoh-pico's
Z_CONFIG_SOCKET_TIMEOUT.
'''

[[limit]]
id = "PICO_CONNECT_TIMEOUT_MS"
kconfig = "WZ_LIMIT_PICO_CONNECT_TIMEOUT_MS"
default = 10000
help = '''
How long, in milliseconds, opening a cooperative zenoh-pico session waits for
the session to be established before the open fails, as zenoh-pico's
Z_TRANSPORT_CONNECT_TIMEOUT.
'''

[[limit]]
id = "PICO_FRAG_MAX_BYTES"
kconfig = "WZ_LIMIT_PICO_FRAG_MAX_BYTES"
default = 4096
help = '''
The largest message, in bytes, a session of the zenoh-pico interface rejoins
from fragments, unicast and in a multicast group, as zenoh-pico's
FRAG_MAX_SIZE. A fragment that would take its message past it ends the chain
and the message is dropped; a message that arrives in one frame is never
measured against it.
'''

[[limit]]
id = "PICO_ACCEPT_TIMEOUT_MS"
kconfig = "WZ_LIMIT_PICO_ACCEPT_TIMEOUT_MS"
default = 1000
help = '''
How long, in milliseconds, a listening session of the zenoh-pico interface gives
an inbound link to complete its whole handshake, link handshake included,
before it drops the link without a word, as zenoh-pico's
Z_TRANSPORT_ACCEPT_TIMEOUT. zenoh's own bound is ten seconds; the zenoh-c
interface reads it from transport/unicast/accept_timeout.
'''

[[limit]]
id = "PICO_KEEPALIVES_PER_LEASE"
kconfig = "WZ_LIMIT_PICO_KEEPALIVES_PER_LEASE"
default = 3
help = '''
How many keepalives a session of the zenoh-pico interface sends in one lease,
as zenoh-pico's Z_TRANSPORT_LEASE_EXPIRE_FACTOR: whenever the line has been
idle for the adopted lease divided by this, the session sends one. At least 1.
The lease is the smaller of the two the peers advertised.
'''

# A policy is behaviour upstream does not have; it is declared with what upstream does and
# defaults to that, so a build that states nothing is the original's (docs/build-configuration.md,
# C2). `kind` is `bool` (default `off`) or `choice` (`choices`, one of them the default). Each is a
# field of `SessionPolicy` (crates/wz-session-core/src/policy_generated.rs, generated) and a Kconfig
# symbol; a build states it as `WZ_POLICY_<NAME>`. A policy enters in its own change, with a pair
# of tests that name each of its values.
[[policy]]
id = "multicast-loopback"
kind = "choice"
kconfig = "WZ_POLICY_MULTICAST_LOOPBACK"
choices = ["os-default", "on", "off"]
default = "os-default"
upstream = "Never sets IP_MULTICAST_LOOP on a multicast socket, so each sending socket keeps the operating system's setting."
since = 2
help = '''
Whether a datagram a node sends to a multicast group is also delivered to
members of that group on the same host. `os-default` leaves the operating
system's setting alone. `on` and `off` set it on every multicast socket the
node opens: `on` is for nodes that share a host and must hear one another,
`off` for a node that must not hear its own host's traffic.
'''

[[policy]]
id = "tx-no-progress-deadline"
kind = "bool"
kconfig = "WZ_POLICY_TX_NO_PROGRESS_DEADLINE"
default = "off"
upstream = "Gives a blocking message one wait_before_close for the whole of it, however many fragments go out: its deadline has no cap to extend by, so a fragment out leaves the deadline where it is."
since = 2
help = '''
Whether a blocking message gets a second bound beside its total wait: the
wait with no progress. Off, only the total wait bounds it. On, it is also
given up when TX_NO_PROGRESS_WINDOW_US passes with no fragment out, and the
total wait still ends it, whichever comes first. A fragment out is progress
and starts the window again, and the total wait is never made longer.
'''

[[policy]]
id = "tx-expiry-keeps-session"
kind = "bool"
kconfig = "WZ_POLICY_TX_EXPIRY_KEEPS_SESSION"
default = "off"
upstream = "Closes the session as unresponsive when a blocking message found no room in its deadline, and tells the sender nothing."
since = 2
help = '''
What happens when a blocking message finds no room within its deadline. Off,
the session is closed as unresponsive and the send reports success. On, the
message is dropped, the send reports that the transport was not available,
and the session stays open: a slow link costs the message and not the
session. A link that stays blocked is closed after TX_EXPIRY_CLOSE_AFTER such
messages in a row, when that limit is not 0. A multicast group never closes
either way.
'''

[[policy]]
id = "declaration-sync-pacing"
kind = "bool"
kconfig = "WZ_POLICY_DECLARATION_SYNC_PACING"
default = "off"
upstream = "Replays every declaration it holds to a new peer in one call, as soon as the session is open again."
since = 2
help = '''
How a node tells a peer its declarations again after a reconnect. Off, all of
them are sent at once. On, they are sent in turns of
DECLARATION_SYNC_BURST_MESSAGES with DECLARATION_SYNC_INTERVAL_MS between
turns, and the session is served during the waits, so a node with many
declarations does not hand its peer a burst or stop answering while it sends
them. A declaration made while the replay runs is sent in its turn, after
everything it depends on; the retraction of one the peer was never told of
sends nothing.
'''

[[policy]]
id = "entity-timestamp-opt-in"
kind = "bool"
kconfig = "WZ_POLICY_ENTITY_TIMESTAMP_OPT_IN"
default = "off"
upstream = "Hands every received sample's timestamp to the subscriber and every reply's to the querier, and lets any publisher attach the timestamp it is given."
since = 2
help = '''
What an entity does with a timestamp when its declaration says nothing. Off,
a subscriber and a querier see the timestamp of what they receive, and any
publisher attaches the timestamp it is given. On, an entity takes part only
if it was declared to: a subscriber or a querier sees no timestamp unless it
asks to, and a publisher refuses a timestamped put unless it was declared to
stamp. Each declaration can still state its own choice either way; this sets
the default for the ones that do not. A publisher given a time supplies its
own node identity, so a caller cannot sign a sample as another node.
'''

[[policy]]
id = "subscriber-overload"
kind = "choice"
kconfig = "WZ_POLICY_SUBSCRIBER_OVERLOAD"
choices = ["block", "reject", "keep-latest"]
default = "block"
upstream = "Hands a sample to a channel handler that blocks its sender when the handler is full, so a slow consumer applies backpressure into the session and no sample is lost."
since = 2
help = '''
What a subscriber whose callback runs off the receive path does when its
delivery lane is full and its declaration says nothing. `block` makes the
session wait for room, outside the lock the receive path holds, so the
transport's own backpressure is the flow control and no sample is lost.
`reject` refuses the sample at once: the receive path is never held, the sample
is lost, and it is counted by reason and by whether it was sent reliably.
`keep-latest` admits the new sample and takes out the newest ones already
queued behind the one being delivered until it fits: the receive path is never
held, the newest sample is never the one lost, and each one taken out is
counted by how it was sent. It is for a stream whose last value is the one
that matters. A sample longer than the whole lane can never wait for room, so
it is refused under every choice. Each declaration can still state its own
choice; this sets the default for the ones that do not.
'''

[[policy]]
id = "key-set"
kind = "choice"
kconfig = "WZ_POLICY_KEY_SET"
choices = ["open", "closed"]
default = "open"
upstream = "Takes a message on any key a peer sends, and finds the subscribers it reaches by matching that key against each subscription's pattern as text."
since = 2
help = '''
Which keys the receive path takes a message on (docs/closed-key-set.md). `open` takes
any key a peer sends. `closed` takes only the keys the image declares as its key set,
which the build generates into a read-only table: a message on any other key is dropped
before a subscriber is looked up, and counted by reason. A closed build that is given
no table takes no key at all. The selectors a peer asks with, a query or an interest,
are patterns and not data keys, and are answered as in an open build. `closed` needs the
cargo feature `key-set-closed` of wz-session-core, which compiles the mode in; a build that
states it without the feature does not compile, and an open build has neither the code
nor its bytes.
'''

[[policy]]
id = "sn-resolution"
kind = "choice"
kconfig = "WZ_POLICY_SN_RESOLUTION"
choices = ["bits-32", "bits-8", "bits-16", "bits-64"]
default = "bits-32"
upstream = "Advertises the 32-bit sequence-number resolution in its InitSyn and in the Join of a group, and has no setting for another: zenoh's `Resolution` default and zenoh-pico's `Z_SN_RESOLUTION 0x02`."
since = 2
help = '''
The width of the sequence numbers the sessions of the C interfaces advertise: in
the InitSyn of a unicast session, where the two sides take the smaller of the
two advertised widths, and in the Join of a multicast group, where a member
refuses a Join that states another width than its own, so every member of a
group states the same. `bits-32` is what zenoh and zenoh-pico advertise.
`bits-8`, `bits-16` and `bits-64` state that width instead, for a peer built
with a sequence-number width of its own. A session that negotiates a width
below its peer's runs the narrower ring of the two; a ring of 8 bits wraps
after 128 frames in flight, so a narrow width asks a deployment to know its
traffic. The request-id resolution is not part of this policy.
'''

[[policy]]
id = "supervision-after-expiry"
kind = "choice"
kconfig = "WZ_POLICY_SUPERVISION_AFTER_EXPIRY"
choices = ["latch", "rearm"]
default = "latch"
upstream = "Supervises nothing: an application that stops making progress is not noticed by the library, so there is no expiry and nothing for a later feed to do."
since = 2
help = '''
What a checkpoint does when it is fed after its deadline was missed. `latch`
leaves it expired: the missed deadline stays visible, the node stays unhealthy,
and the checkpoint is supervised again only when it is stopped and started,
which is what a watchdog does. `rearm` supervises it again on that feed, so a
checkpoint that recovers makes the node healthy again. The expiry hook runs once
per expiry either way.
'''

[[policy]]
id = "event-ring-full"
kind = "choice"
kconfig = "WZ_POLICY_EVENT_RING_FULL"
choices = ["overwrite-oldest", "drop-newest"]
default = "overwrite-oldest"
upstream = "Keeps no record of the events a node has: a log call with no logger installed is dropped, so neither the oldest nor the newest of them survives."
since = 2
help = '''
Which event a full event ring gives up. `overwrite-oldest` writes the new event
over the oldest, so the ring always holds the latest: it is what a post-mortem
wants, and needs no reader at all. `drop-newest` refuses the new event and
counts the refusals, so the ring holds the beginning until a reader frees it:
it is what a boot trace wants, and the events are lost whenever no reader is
reading.
'''

[[policy]]
id = "clock-quality-stamping"
kind = "choice"
kconfig = "WZ_POLICY_CLOCK_QUALITY_STAMPING"
choices = ["always", "trusted-only"]
default = "always"
upstream = "Stamps with whatever time the system clock reads, and has no notion of whether that clock is set or follows a reference."
since = 2
help = '''
Whether a node stamps data with a time it does not trust. `always` stamps with
the clock's reading whatever its standing. `trusted-only` stamps only while the
clock is synchronised to a reference, or held over from one within the bound
the host keeps: before the host first reports a reference, and once that bound
has passed, the node stamps no data it forwards, takes no timestamp into its
clock and counts the data it passed on as it came. A storage that needs a time
to order what it keeps still takes one from the system clock. The host reports
the clock's standing, because only the host knows it: a time daemon, a
satellite receiver, a fieldbus master.
'''

[[policy]]
id = "routing-face-drive"
kind = "choice"
kconfig = "WZ_POLICY_ROUTING_FACE_DRIVE"
choices = ["task-per-face", "one-task"]
default = "task-per-face"
upstream = "Reads each link of a node on a task of its own, spawned on the node's receive runtime (two worker threads unless the runtime is configured otherwise), and routes what that link brings on the same task under a read lock of the routing tables, so the links of a node are served by several threads at once."
since = 2
help = '''
How a node that routes for others serves its links. `task-per-face` gives each
link a task of its own on the node's worker threads: a node with many peers
uses more than one core, and a link that is slow to serve holds up only itself.
`one-task` serves every link from the node's one task, one message at a time,
on one core: the order in which the node handles what its links bring is then
the order the task polled them, which a run replayed for a test needs, and a
host with one core loses nothing by it. Neither changes what a peer is sent or
in what order one link's messages are routed.
'''

# The role of a node in a zenoh network: upstream's `mode`. A global axis (it names no image),
# so that every tree that sources the capabilities can state it, and each option selects the
# capabilities it needs: the role pulls what it requires, and nothing else. What an image also
# hosts is a capability of its own beside the role (the admin node is the `peer` role that hosts
# the admin space, `admin-space`), and an image says which roles it can be.
[[axis]]
id = "role"
kconfig = "WZ_ROLE"
prompt = "What the node is in a zenoh network"
default = "peer"
help = '''
Upstream's `mode`. The default is the peer, which the zenoh and zenoh-c originals are built
as; the original of zenoh-pico is a client, and what each original's own default is comes
with the originals' defconfigs.
'''

[[axis_option]]
id = "client"
axis = "role"
kconfig = "WZ_ROLE_CLIENT"
prompt = "Client: dials a router, accepts no session"
# zenoh-pico's `Z_CONFIG_MODE_DEFAULT` is `Z_CONFIG_MODE_CLIENT` (include/zenoh-pico/config.h.in).
upstream_on = ["zenoh-pico"]
help = '''
A node that dials a router and is dialled by none: no listener, no accepted session. It
needs nothing the peer role pulls in.
'''

[[axis_option]]
id = "peer"
axis = "role"
kconfig = "WZ_ROLE_PEER"
prompt = "Peer: accepts sessions as well as dialling"
implies = ["peer"]
# zenoh-config's `defaults::mode` is `WhatAmI::Peer`, which zenoh-c's default config is too.
upstream_on = ["zenoh", "zenoh-c"]
help = '''
Upstream's `mode = peer`. The capability `peer` is what a listener, a router and a peer have
that a client does not, so the role pulls it in.
'''

[[axis_option]]
id = "router"
axis = "role"
kconfig = "WZ_ROLE_ROUTER"
prompt = "Router: routes between the sessions it holds"
implies = ["peer", "timestamping"]
help = '''
Upstream's `mode = router`. It is a peer that also stamps the messages it relays: the
capability `timestamping` is the node clock that role holds, which upstream's router has on
by default.
'''

[[image]]
id = "zephyr-admin-node"
dir = "deploy/zephyr-admin-node"

[[axis]]
id = "net-backend"
image = "zephyr-admin-node"
kconfig = "WZ_NET_BACKEND"
prompt = "Network stack the admin node runs over"
default = "zephyr-sockets"
help = '''
The node is the same on every board; what differs is the stack under it,
which the board's Ethernet driver decides.
'''

[[axis_option]]
id = "zephyr-sockets"
axis = "net-backend"
kconfig = "WZ_NET_BACKEND_ZEPHYR_SOCKETS"
prompt = "Zephyr's own network stack and BSD sockets"
help = '''
For a board whose Ethernet, Wi-Fi or modem Zephyr drives. The interface, its
address (DHCP or Kconfig) and its link-layer identity are Zephyr's.
'''

[[axis_option]]
id = "lwip-mac"
axis = "net-backend"
kconfig = "WZ_NET_BACKEND_LWIP_MAC"
prompt = "lwIP over an Ethernet MAC the wz crates drive"
requires = "!WZ_ROLE_CLIENT"
help = '''
For a board whose Ethernet controller Zephyr has no driver for. Zephyr is the
kernel only (threads, clock, heap, console): the network is lwIP, polled from
the node's loop, over a wz `EthernetMac` crate for the chip. The interface
address and the MAC address are the board's Kconfig, since no Zephyr
interface exists to ask.
'''

[[axis]]
id = "storage"
image = "zephyr-admin-node"
kconfig = "WZ_NODE_STORAGE"
prompt = "Where the node's tables live"
default = "heap"
help = '''
The memory profile is the node's and not a network backend's: whether the Rust image has an
allocator is a setting made beside the role and the stack, and what it is available to is
what has the slot profile's pieces (the stack's driver and how it opens a socket).
'''

[[axis_option]]
id = "heap"
axis = "storage"
kconfig = "WZ_STORAGE_HEAP"
prompt = "The heap profile: the growable node, over an allocator in the Rust image"

[[axis_option]]
id = "fixed"
axis = "storage"
kconfig = "WZ_FIXED_MEMORY"
prompt = "Build the node on the fixed-memory profile (no allocator in the Rust image)"
requires = "(WZ_NET_BACKEND_LWIP_MAC && WZ_MAC_CYT4BF) || (WZ_NET_BACKEND_ZEPHYR_SOCKETS && WZ_ROLE_CLIENT)"
help = '''
Every table the node holds (sessions, sockets, the observer, the interfaces) is a
static the image declares, the session tier is the slot profile's, and the Rust
staticlib is built with its default features off, so it links no allocator. The
session host and the dialler are the ones every stack shares
(wz_session_mcu::slot_host); a stack supplies its driver and how it opens a socket.

Two nodes have the profile. The admin node over lwIP is fixed_node.rs: its listener
reads only the datagrams of the peer each session was accepted from and drops and
counts the rest, where the growable node's one accepting session takes the source of
every datagram it reads as its peer. The client node over Zephyr's sockets is
fixed_client.rs. Not the admin node over Zephyr's sockets: that node accepts, and the
socket stack has no listener of the slot profile yet.

This kernel's own heap is a separate matter: what the Rust image does not allocate,
Zephyr's network stack and POSIX layer still may, and CONFIG_HEAP_MEM_POOL_SIZE is what
the kernel is given for it.
'''

# Decision D7 of docs/session-lifecycle-intent.md: how a session lifecycle verb reaches the node.
# The contract (open a peer by its zid, answered with an outcome) is one, and what differs is what
# feeds it. A third value, `out-of-band` (an agent's control channel), is added with its control
# port (step 7d), and not before: an option that cannot be built is not declared.
[[axis]]
id = "lifecycle-transport"
image = "zephyr-admin-node"
kconfig = "WZ_LIFECYCLE_TRANSPORT"
prompt = "How a session lifecycle verb reaches the node"
default = "in-band"
help = '''
The node holds the peers it was told to hold by their zid beside the locators it is told to
connect to, and which peers it is asked to hold at run time is a transport of its own: a Push or
a query on the admin space, an agent that drives the node over a channel of its own, or none.
'''

[[axis_option]]
id = "in-band"
axis = "lifecycle-transport"
kconfig = "WZ_LIFECYCLE_IN_BAND"
prompt = "A query on the admin space opens a peer (session/open/<zid>)"
help = '''
The node answers `GET @/<zid>/<whatami>/session/open/<peer-zid>` by holding the peer and lists
the verb in `session/verbs`. Only the fixed-memory admin node binds the verb this way; the other
nodes of the image have their own lifecycle or none, and this value changes nothing of them.
'''

[[axis_option]]
id = "declared"
axis = "lifecycle-transport"
kconfig = "WZ_LIFECYCLE_DECLARED"
prompt = "No verb: the peers are the ones the build declares"
requires = "WZ_FIXED_MEMORY && WZ_NET_BACKEND_LWIP_MAC"
help = '''
The node binds no lifecycle verb: its admin answer lists none and serves no `session/open` key, and
the code that serves it is not in the image. The peers it holds are the ones declared when it was
built, and its connection machines only reconnect them.
'''

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_LIFECYCLE_DECLARED"]
features = ["lifecycle-declared"]

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_ZEPHYR_SOCKETS"]
features = ["net-zephyr-sockets"]

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_LWIP_MAC"]
features = ["net-lwip-mac"]

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_ROLE_CLIENT", "WZ_STORAGE_HEAP"]
features = ["heap-storage"]
defaults = "off"

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_ROLE_CLIENT", "WZ_FIXED_MEMORY"]
features = ["fixed-client"]
defaults = "off"

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_LWIP_MAC", "WZ_FIXED_MEMORY"]
features = ["fixed-memory"]
defaults = "off"
