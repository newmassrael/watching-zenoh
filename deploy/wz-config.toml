# zenoh-pico's VALUE switches: the CMake variables its config template substitutes as `@NAME@`
# (`include/zenoh-pico/config.h.in`), each a number or a path rather than on or off. A `maps` row
# anchors to the limit that states the same number for the pico ABI (`limit:<ID>`), whose default
# is pico's own; `wz_config.py --env pico <config.h>` turns a header's numbers into those limits.
# A value is never `always`: a number wz holds fixed reproduces pico's default build only.

