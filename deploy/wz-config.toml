reason = "No key of upstream's configuration states it: it bounds one read step of the cooperative engine, which zenoh-pico has and zenoh does not."

[[limit]]
id = "PICO_CONNECT_TIMEOUT_MS"
kconfig = "WZ_LIMIT_PICO_CONNECT_TIMEOUT_MS"
kind = "parameter"
range = [1, 4294967295]
default = 10000
storage = "quota"
scope = "session"
binding_heap = "open"
binding_fixed = "none"
read = "build"
wire = "timing"
help = '''
How long, in milliseconds, each open of an endpoint by a zenoh-pico session
waits for the dial and the handshake before it fails, on either engine, as
zenoh-pico's Z_TRANSPORT_CONNECT_TIMEOUT.
'''

[limit.upstream]
zenoh = "transport/unicast/open_timeout"
cite = ["`commons/zenoh-config/src/lib.rs` @ `/// Timeout in milliseconds when opening a link (default: 10000).`", "`io/zenoh-transport/src/unicast/manager.rs` @ `tokio::time::timeout(self.config.unicast.open_timeout, async {`"]

[[limit]]
id = "PICO_FRAG_MAX_BYTES"
kconfig = "WZ_LIMIT_PICO_FRAG_MAX_BYTES"
kind = "bound"
driven = "remote"
default = 4096
storage = "quota"
scope = "link"
binding_heap = "open"
binding_fixed = "none"
read = "build"
wire = "none"
help = '''
The largest message, in bytes, a session of the zenoh-pico interface rejoins
from fragments, unicast and in a multicast group, as zenoh-pico's
FRAG_MAX_SIZE. A fragment that would take its message past it ends the chain
and the message is dropped; a message that arrives in one frame is never
measured against it.
'''

[limit.upstream]
zenoh = "transport/link/rx/max_message_size"
cite = ["`commons/zenoh-config/src/lib.rs` @ `/// Maximum size of the defragmentation buffer at receiver end (default: 1GiB).`", "`commons/zenoh-config/src/lib.rs` @ `/// Fragmented messages that are larger than the configured size will be dropped.`", "`io/zenoh-transport/src/manager.rs` @ `self = self.defrag_buff_size(*link.rx().max_message_size());`"]

[[limit]]
id = "PICO_ACCEPT_TIMEOUT_MS"
kconfig = "WZ_LIMIT_PICO_ACCEPT_TIMEOUT_MS"
kind = "parameter"
range = [1, 4294967295]
default = 1000
storage = "quota"
scope = "link"
binding_heap = "open"
binding_fixed = "none"
read = "build"
wire = "timing"
help = '''
How long, in milliseconds, a listening session of the zenoh-pico interface gives
an inbound link to complete its whole handshake, link handshake included,
before it drops the link without a word, as zenoh-pico's
Z_TRANSPORT_ACCEPT_TIMEOUT. zenoh's own bound is ten seconds; the zenoh-c
interface reads it from transport/unicast/accept_timeout.
'''

[limit.upstream]
zenoh = "transport/unicast/accept_timeout"
cite = ["`commons/zenoh-config/src/lib.rs` @ `/// Timeout in milliseconds when accepting a link (default: 10000).`", "`io/zenoh-transport/src/unicast/manager.rs` @ `c_manager.config.unicast.accept_timeout,`"]

[[limit]]
id = "PICO_KEEPALIVES_PER_LEASE"
kconfig = "WZ_LIMIT_PICO_KEEPALIVES_PER_LEASE"
kind = "parameter"
range = [1, 4294967295]
default = 3
storage = "quota"
scope = "session"
binding_heap = "open"
binding_fixed = "none"
read = "build"
wire = "timing"
help = '''
How many keepalives a session of the zenoh-pico interface sends in one lease,
as zenoh-pico's Z_TRANSPORT_LEASE_EXPIRE_FACTOR: whenever the line has been
idle for the adopted lease divided by this, the session sends one. At least 1.
The lease is the smaller of the two the peers advertised.
'''

[limit.upstream]
zenoh = "transport/link/tx/keep_alive"
cite = ["`commons/zenoh-config/src/lib.rs` @ `/// Number of keep-alive messages in a link lease duration (default: 4)`", "`io/zenoh-transport/src/unicast/manager.rs` @ `self = self.keep_alive(*config.transport().link().tx().keep_alive());`"]

# A policy is behaviour upstream does not have; it is declared with what upstream does and
# defaults to that, so a build that states nothing is the original's (a policy is never on in an
# upstream defconfig). `kind` is `bool` (default `off`) or `choice` (`choices`, one of them the
# default). Each is a field of `SessionPolicy` (crates/wz-session-core/src/policy_generated.rs,
# generated) and a Kconfig symbol; a build states it as `WZ_POLICY_<NAME>`. A policy enters in its
# own change, with a pair of tests that name each of its values.
#
# A policy states `scope`, `binding`, `mutability` and `wire`, and `boundary` when it is
# `quiescent`, as the header defines them ("Where a value is bound").
#
# The build narrows each policy to its domain, the values a later stage may select: one
# `WZ_POLICY_<NAME>_ALLOWS_<VALUE>` per value (Kconfig: one `default y` bool per value), `off`
# leaving the value out and `on` keeping it. An unset name allows its value on a target with an
# operating system; on a target with none it allows only the policy's default, so an image pays
# for a second value only where it states one. `WZ_POLICY_DOMAINS` = `full` or `defaults` forces
# either rule; it is not a cargo feature, which would unify across a graph and narrow host builds.
# The build's value of the policy is always inside its domain; a domain of one value makes the
# policy a constant of the build, held in no byte.
[[policy]]
id = "multicast-loopback"
kind = "choice"
kconfig = "WZ_POLICY_MULTICAST_LOOPBACK"
choices = ["os-default", "on", "off"]
default = "os-default"
upstream = "Never sets IP_MULTICAST_LOOP on a multicast socket, so each sending socket keeps the operating system's setting."
scope = "link"
binding = "open"
mutability = "fixed"
# `wire` is none: it decides whether a member on the same host receives, not the bytes sent.
wire = "none"
since = 2
help = '''
Whether a datagram a node sends to a multicast group is also delivered to
members of that group on the same host. `os-default` leaves the operating
system's setting alone. `on` and `off` set it on every multicast socket the
node opens: `on` is for nodes that share a host and must hear one another,
`off` for a node that must not hear its own host's traffic.
'''

[[policy]]
id = "tx-no-progress-deadline"
kind = "bool"
kconfig = "WZ_POLICY_TX_NO_PROGRESS_DEADLINE"
default = "off"
upstream = "Gives a blocking message one wait_before_close for the whole of it, however many fragments go out: its deadline has no cap to extend by, so a fragment out leaves the deadline where it is."
scope = "session"
binding = "live"
mutability = "hot"
wire = "timing"
since = 2
help = '''
Whether a blocking message gets a second bound beside its total wait: the
wait with no progress. Off, only the total wait bounds it. On, it is also
given up when TX_NO_PROGRESS_WINDOW_US passes with no fragment out, and the
total wait still ends it, whichever comes first. A fragment out is progress
and starts the window again, and the total wait is never made longer.
'''

[[policy]]
id = "tx-expiry-keeps-session"
kind = "bool"
kconfig = "WZ_POLICY_TX_EXPIRY_KEEPS_SESSION"
default = "off"
upstream = "Closes the session as unresponsive when a blocking message found no room in its deadline, and tells the sender nothing."
scope = "session"
binding = "live"
mutability = "hot"
wire = "visible"
since = 2
help = '''
What happens when a blocking message finds no room within its deadline. Off,
the session is closed as unresponsive and the send reports success. On, the
message is dropped, the send reports that the transport was not available,
and the session stays open: a slow link costs the message and not the
session. A link that stays blocked is closed after TX_EXPIRY_CLOSE_AFTER such
messages in a row, when that limit is not 0. A multicast group never closes
either way.
'''

[[policy]]
id = "declaration-sync-pacing"
kind = "bool"
kconfig = "WZ_POLICY_DECLARATION_SYNC_PACING"
default = "off"
upstream = "Replays every declaration it holds to a new peer in one call, as soon as the session is open again."
scope = "link"
binding = "live"
mutability = "quiescent"
boundary = "the start of the next replay of declarations"
wire = "timing"
since = 2
help = '''
How a node tells a peer its declarations again after a reconnect. Off, all of
them are sent at once. On, they are sent in turns of
DECLARATION_SYNC_BURST_MESSAGES with DECLARATION_SYNC_INTERVAL_MS between
turns, and the session is served during the waits, so a node with many
declarations does not hand its peer a burst or stop answering while it sends
them. A declaration made while the replay runs is sent in its turn, after
everything it depends on; the retraction of one the peer was never told of
sends nothing.
'''

[[policy]]
id = "datagram-fragment-pacing"
kind = "bool"
kconfig = "WZ_POLICY_DATAGRAM_FRAGMENT_PACING"
default = "off"
upstream = "Writes the fragments of a large message to a datagram socket back to back, as fast as the socket takes them, however small the receiver's buffer."
scope = "link"
binding = "open"
mutability = "fixed"
wire = "timing"
since = 2
help = '''
How fast the fragments of one large message leave a UDP link, unicast or
multicast. Off, they are written back to back. On, at most
DATAGRAM_FRAGMENT_BURST fragments are written in a row, and the next waits
until DATAGRAM_FRAGMENT_GAP_US has passed since the last was written, so a
receiver with a small buffer is not handed the whole message in one burst. A
datagram that is not a fragment ends the run and is never delayed. The wait is
in the link's writer and not in the sender: a sender is held only as long as
the link's queue is full, as it is without the policy. QUIC datagrams and
WebSocket are not paced, since their transport paces itself or is a stream.
The tokio engine's timer has a resolution of one millisecond, so a gap is
rounded up to it. Only the tokio engine reads this policy.
'''

[[policy]]
id = "multicast-link-requires-iface"
kind = "bool"
kconfig = "WZ_POLICY_MULTICAST_LINK_REQUIRES_IFACE"
default = "off"
upstream = "Opens a multicast link whose locator names no interface on the first interface that can carry multicast, or on the kernel's choice when the host has none, so the link may sit on an interface nobody chose."
scope = "link"
binding = "open"
mutability = "fixed"
wire = "none"
since = 2
help = '''
Whether a multicast link may be opened without an interface the locator
chose. Off, a link whose locator has no iface key is opened on the first
interface that can carry multicast. On, it is refused before any socket
exists, and so is a link whose iface key this build cannot honour, so a node
never joins a group or sends to it on an interface nobody named. The refusal
is an invalid-input error from the link's open. Scouting is not a link and is
not refused. Only the tokio engine reads this policy.
'''

[[policy]]
id = "reliable-gap-reconnect"
kind = "choice"
kconfig = "WZ_POLICY_RELIABLE_GAP_RECONNECT"
choices = ["off", "until-declarations-synced", "always", "until-declarations-synced-when-begun"]
default = "off"
upstream = "Accepts a forward jump of the reliable channel's sequence number without a word: the frames in between are lost, the session stays open and nothing is repaired, so a peer's declaration lost that way is never noticed."
scope = "session"
binding = "live"
mutability = "hot"
wire = "visible"
since = 2
help = '''
What a node does when a frame on the reliable channel arrives with a sequence
number that jumped forward, which means frames were lost on the way. `off`
accepts the jump, which is upstream's behaviour. `until-declarations-synced`
treats the jump as a lost link only while the peer has not yet sent the end of
its initial declarations, so a session whose declaration sync was cut short is
reopened and the sync is redone, and a jump after that is accepted. `always`
treats every forward jump on the reliable channel as a lost link. The frame
that showed the jump is dropped, and the supervisor of a reconnecting session
opens the session again and redoes the declaration sync. A frame that does not
advance the number is dropped as before, and the best-effort channels are not
affected. Only the tokio engine reconnects, so another engine ends the link and
leaves it to the application, and only the tokio engine reports the end of the
peer's declarations, so for another engine `until-declarations-synced` is
`always`. `until-declarations-synced-when-begun` is `until-declarations-synced`
on a link this node dialled; on a link it accepted, a peer that lets
DECLARATION_SYNC_RX_NO_PROGRESS_MS pass without sending any declaration of its
initial interest is taken to have none to send, which settles the sync, while a
peer that began them is held to their end as under `until-declarations-synced`.
With that limit at 0 nothing settles an accepted link early.
'''

[[policy]]
id = "entity-link-restriction"
kind = "bool"
kconfig = "WZ_POLICY_ENTITY_LINK_RESTRICTION"
default = "off"
upstream = "Lets every entity use every link of the session: a put reaches every link that wants it, a declaration is made to every link, a query goes to every link."
scope = "entity"
binding = "open"
mutability = "fixed"
wire = "visible"
since = 2
help = '''
Whether an entity may be declared with a set of links it is limited to. Off, the
call that states a set is refused and every entity uses every link, which is
upstream's behaviour. On, a publisher sends only on the links of its set, a
subscriber and a queryable are declared to the nodes behind those links only
(so they hear and answer nothing that arrives over the others), and a query
goes out on those links only. A link is named by a slot the engine derives:
the dialling role is one and each listener is one, and the faces a listener
accepts share its slot. A set is never empty. A restricted entity does not use
a link that has no slot, and a link that comes up later is used if its slot
is named. Only the tokio engine reads this policy.
'''

[[policy]]
id = "targeted-query"
kind = "bool"
kconfig = "WZ_POLICY_TARGETED_QUERY"
default = "off"
upstream = "Sends a query to every link whose peers declared a queryable it matches, and a caller cannot name the peer a query is for."
scope = "message"
binding = "live"
mutability = "hot"
wire = "visible"
since = 2
help = '''
Whether a query may be addressed to one peer by its node identity. Off, the call
that names a peer is refused and a query goes out as upstream's does, to every
link that has a matching queryable. On, a query that names a peer goes out on
the one link that reaches that node and on no other, and its session-local leg
and any multicast group are left out; a peer that has no link is not asked and
the query is never widened to the others, so it ends with no replies from
anyone. The identity names a node, not a link or a queryable. Only the tokio
engine reads this policy.
'''

[[policy]]
id = "publisher-admission-retry"
kind = "bool"
kconfig = "WZ_POLICY_PUBLISHER_ADMISSION_RETRY"
default = "off"
upstream = "Sends a put to every link at once and waits on each link for room in its queue; a put that finds none on a link is dropped there (or closes the session) and still reports success, and a caller cannot ask for it to be tried again."
scope = "message"
binding = "live"
mutability = "hot"
wire = "visible"
since = 2
help = '''
Whether a publish may state a bounded retry for the case where no link took
it. Off, the call that states a retry is refused and a put goes out as
upstream's does. On, a publish that states a retry (a number of further passes
and a delay between them) first offers the frame to every link it may use
without waiting for room. If at least one link queued it nothing is retried,
and a link that had no room is skipped as a congestion drop skips it. If no
link queued it and at least one had no room, the call waits the delay and
offers the frame again to those links only, up to the stated number of passes.
A publish that still found no room ends having delivered to no link: it does
not close the session, and it waits no longer than the passes and delays it
stated. A payload too long to be offered without waiting is sent as a
publish that states no retry sends it, and a publish from shared memory, which
is never offered without waiting, is refused when it states a retry. The number
of passes and the delay are never zero. Only the tokio engine reads this
policy; the others refuse a publish that states a retry.
'''

[[policy]]
id = "multi-route-atomic-tx"
kind = "bool"
kconfig = "WZ_POLICY_MULTI_ROUTE_ATOMIC_TX"
default = "off"
upstream = "Sends a put to each link on its own terms: a link whose queue is full drops the frame or waits for room while the other links take it, so one put can reach some links and not others."
scope = "message"
binding = "live"
mutability = "hot"
wire = "visible"
since = 2
help = '''
Whether a publish may ask to be delivered to all of the links it reaches or to
none. Off, the call that asks is refused and a put goes out as upstream's does,
to each link on its own terms. On, a publish that asks first reserves room in
the outbound queue of every link it may use, without waiting. If every link
promised room, each is sent the frame under its reservation, so none of them
can find the room taken, and the session's own subscribers are then delivered
to. If any link had no room, nothing is sent to any link or to any subscriber of
the session, no sequence number is spent, every reservation is given back and the
publish ends having delivered to nobody; it does not close the session and it
counts no drop. A link that is down or was never told the key takes no part and
does not stop the others. A payload too long to be sent whole reserves the room
of every frame of its chain on every link before any frame is sent, links that
share a queue counted together, and no frame of the chain asks for room again,
so the chain reaches every link whole or no link at all. A multicast group
takes no reservation: it is sent the frame only once every link promised room,
and nothing when the publish delivered to nobody. A link whose frames are
written in slots of a pool may still wait for a slot. A publish from shared
memory reserves nothing and is refused when it asks. Only the tokio engine
reads this policy; the others refuse a publish that asks.
'''

[[policy]]
id = "entity-timestamp-opt-in"
kind = "bool"
kconfig = "WZ_POLICY_ENTITY_TIMESTAMP_OPT_IN"
default = "off"
upstream = "Hands every received sample's timestamp to the subscriber and every reply's to the querier, and lets any publisher attach the timestamp it is given."
scope = "entity"
binding = "open"
mutability = "fixed"
wire = "visible"
since = 2
help = '''
What an entity does with a timestamp when its declaration says nothing. Off,
a subscriber and a querier see the timestamp of what they receive, and any
publisher attaches the timestamp it is given. On, an entity takes part only
if it was declared to: a subscriber or a querier sees no timestamp unless it
asks to, and a publisher refuses a timestamped put unless it was declared to
stamp. Each declaration can still state its own choice either way; this sets
the default for the ones that do not. A publisher given a time supplies its
own node identity, so a caller cannot sign a sample as another node.
'''

[[policy]]
id = "reply-auto-timestamp"
kind = "bool"
kconfig = "WZ_POLICY_REPLY_AUTO_TIMESTAMP"
default = "off"
upstream = "Sends a reply with the timestamp its handler gave it and with none when the handler gave none."
scope = "entity"
binding = "open"
mutability = "fixed"
wire = "visible"
since = 2
help = '''
What a queryable's reply carries when its handler gave it no timestamp. Off, it
carries none. On, the node stamps it with the next time of its own clock and its
own identity as the reply is staged, so a querier that orders replies by time
can order those of a handler that never read a clock. A reply the handler
stamped keeps its stamp, an error reply carries none, and a queryable declared
not to stamp (see entity-timestamp-opt-in) sends none. A node with no clock, or
whose clock does not know the date or is not trusted to stamp, stamps nothing
and its replies go out as they would with this off.
'''

[[policy]]
id = "subscriber-overload"
kind = "choice"
kconfig = "WZ_POLICY_SUBSCRIBER_OVERLOAD"
choices = ["block", "reject", "keep-latest"]
default = "block"
upstream = "Hands a sample to a channel handler that blocks its sender when the handler is full, so a slow consumer applies backpressure into the session and no sample is lost."
scope = "entity"
binding = "open"
mutability = "fixed"
wire = "timing"
since = 2
help = '''
What a subscriber whose callback runs off the receive path does when its
delivery lane is full and its declaration says nothing. `block` makes the
session wait for room, outside the lock the receive path holds, so the
transport's own backpressure is the flow control and no sample is lost.
`reject` refuses the sample at once: the receive path is never held, the sample
is lost, and it is counted by reason and by whether it was sent reliably.
`keep-latest` admits the new sample and takes out the newest ones already
queued behind the one being delivered until it fits: the receive path is never
held, the newest sample is never the one lost, and each one taken out is
counted by how it was sent. It is for a stream whose last value is the one
that matters. A sample longer than the whole lane can never wait for room, so
it is refused under every choice. Each declaration can still state its own
choice; this sets the default for the ones that do not.
'''

[[policy]]
id = "key-set"
kind = "choice"
kconfig = "WZ_POLICY_KEY_SET"
choices = ["open", "closed"]
default = "open"
upstream = "Takes a message on any key a peer sends, and finds the subscribers it reaches by matching that key against each subscription's pattern as text."
scope = "session"
binding = "open"
mutability = "fixed"
wire = "none"
since = 2
help = '''
Which keys the receive path takes a message on (the closed key set). `open` takes
any key a peer sends. `closed` takes only the keys the image declares as its key set,
which the build generates into a read-only table: a message on any other key is dropped
before a subscriber is looked up, and counted by reason. A closed build that is given
no table takes no key at all. The selectors a peer asks with, a query or an interest,
are patterns and not data keys, and are answered as in an open build. `closed` needs the
cargo feature `key-set-closed` of wz-session-core, which compiles the mode in; a build that
states it without the feature does not compile, and an open build has neither the code
nor its bytes.
'''

[[policy]]
id = "sn-resolution"
kind = "choice"
kconfig = "WZ_POLICY_SN_RESOLUTION"
choices = ["bits-32", "bits-8", "bits-16", "bits-64"]
default = "bits-32"
upstream = "Advertises the 32-bit sequence-number resolution in its InitSyn and in the Join of a group unless its configuration states another: zenoh reads `transport/link/tx/sequence_number_resolution`, whose default is 32 bits, and zenoh-pico builds in `Z_SN_RESOLUTION 0x02` with no setting for another."
scope = "session"
binding = "open"
mutability = "fixed"
wire = "negotiated"
since = 2
help = '''
The width of the sequence numbers the sessions of the C interfaces advertise
when their configuration states none: in the InitSyn of a unicast session,
where the two sides take the smaller of the two advertised widths, and in the
Join of a multicast group, where a member refuses a Join that states another
width than its own, so every member of a group states the same. `bits-32` is
what zenoh advertises by default and what zenoh-pico always advertises.
`bits-8`, `bits-16` and `bits-64` state that width instead, for a peer built
with a sequence-number width of its own. A configuration that states
`transport/link/tx/sequence_number_resolution` with a width other than 32 bits
is followed instead of this policy, as zenoh follows the key. A session that
negotiates a width below its peer's runs the narrower ring of the two; a ring
of 8 bits wraps after 128 frames in flight, so a narrow width asks a deployment
to know its traffic. The request-id resolution is not part of this policy.
'''

[[policy]]
id = "supervision-after-expiry"
kind = "choice"
kconfig = "WZ_POLICY_SUPERVISION_AFTER_EXPIRY"
choices = ["latch", "rearm"]
default = "latch"
upstream = "Supervises nothing: an application that stops making progress is not noticed by the library, so there is no expiry and nothing for a later feed to do."
scope = "runtime"
binding = "live"
mutability = "hot"
wire = "none"
since = 2
help = '''
What a checkpoint does when it is fed after its deadline was missed. `latch`
leaves it expired: the missed deadline stays visible, the node stays unhealthy,
and the checkpoint is supervised again only when it is stopped and started,
which is what a watchdog does. `rearm` supervises it again on that feed, so a
checkpoint that recovers makes the node healthy again. The expiry hook runs once
per expiry either way.
'''

[[policy]]
id = "e2e-supervision-notify"
kind = "choice"
kconfig = "WZ_POLICY_E2E_SUPERVISION_NOTIFY"
choices = ["status-only", "last-value"]
default = "status-only"
upstream = "Supervises no stream's reception: a periodic message that stops arriving is not noticed by the library, so there is no loss to tell and no value to tell it with."
scope = "runtime"
binding = "open"
mutability = "fixed"
wire = "none"
since = 2
help = '''
What a reception supervisor tells the application when a stream stops
arriving. `status-only` tells the stream, its sender and the error counts, and
keeps no payload. `last-value` also hands back the payload the stream last
carried, which the supervisor keeps in a cell of the application's storage per
stream, for an application that delivers a value with every loss as it does
with every sample. Decided when the supervisor is made, and fixed for its life.
'''

[[policy]]
id = "replay-reply-shape"
kind = "choice"
kconfig = "WZ_POLICY_REPLAY_REPLY_SHAPE"
choices = ["frame-per-sample", "segmented"]
default = "frame-per-sample"
upstream = "Keeps no ring of sent frames, so there is no replay to answer and no shape to give it; a queryable the application declares answers whatever it replies."
scope = "message"
binding = "open"
mutability = "fixed"
wire = "visible"
since = 2
help = '''
How a publisher's replay cache answers a query. `frame-per-sample` answers one
reply per sample of the ring, each the frame exactly as it was sent, then the
final. `segmented` answers each sample as the pieces of the message's declared
segment profile, every sample under the next transfer number, for a message
whose frames are larger than a deployment puts in one sample; the cache's live
sends go out as pieces too, and a subscriber joins the pieces, live and
replied, before it judges a frame, giving up only a frame a piece of which
never came. Decided when the cache or the subscriber is made, and fixed for its
life.
'''

[[policy]]
id = "replay-serve-holds-sends"
kind = "bool"
kconfig = "WZ_POLICY_REPLAY_SERVE_HOLDS_SENDS"
default = "off"
upstream = "Keeps no ring of sent frames and answers no replay, so a send is never held back for one."
scope = "message"
binding = "open"
mutability = "fixed"
wire = "timing"
since = 2
help = '''
Whether a publisher's sends of a message wait while its replay cache answers a
query. Off, a send goes out at once, and a subscriber may see a newer frame
before the replay that precedes it. On, a periodic send is held and only the
latest of each instance goes out once the answer is over, and an event send is
deferred to a queue of max(1, depth/2) frames that gives up the oldest when it
is full; the held frames go out in the order they were sent, before any later
send. Decided when the cache is made, and fixed for its life.
'''

[[policy]]
id = "replay-live-before-answer"
kind = "choice"
kconfig = "WZ_POLICY_REPLAY_LIVE_BEFORE_ANSWER"
choices = ["deliver", "hold-back"]
default = "deliver"
upstream = "Asks no publisher for what it sent before, so a live sample is delivered as it arrives and there is no replay to order it against."
scope = "message"
binding = "open"
mutability = "fixed"
wire = "none"
since = 2
help = '''
How a subscriber that asks for a replay orders its live samples against it.
`deliver` hands each live sample on as it arrives, so live samples and replies
interleave and the receiving judge drops a reply that is behind what it has
seen. `hold-back` holds the live samples, in a store the application sizes,
until the first round of replies is over or abandoned by its deadline (or the
store is full), then hands them on after every reply of that round, so the
application never sees a newer sample before the replay that precedes it.
Decided when the subscriber is made, and fixed for its life.
'''

[[policy]]
id = "event-ring-full"
kind = "choice"
kconfig = "WZ_POLICY_EVENT_RING_FULL"
choices = ["overwrite-oldest", "drop-newest"]
default = "overwrite-oldest"
upstream = "Keeps no record of the events a node has: a log call with no logger installed is dropped, so neither the oldest nor the newest of them survives."
scope = "runtime"
binding = "live"
mutability = "quiescent"
boundary = "after the consumer has read every record"
wire = "none"
since = 2
help = '''
Which event a full event ring gives up. `overwrite-oldest` writes the new event
over the oldest, so the ring always holds the latest: it is what a post-mortem
wants, and needs no reader at all. `drop-newest` refuses the new event and
counts the refusals, so the ring holds the beginning until a reader frees it:
it is what a boot trace wants, and the events are lost whenever no reader is
reading.
'''

[[policy]]
id = "clock-quality-stamping"
kind = "choice"
kconfig = "WZ_POLICY_CLOCK_QUALITY_STAMPING"
choices = ["always", "trusted-only"]
default = "always"
upstream = "Stamps with whatever time the system clock reads, and has no notion of whether that clock is set or follows a reference."
scope = "runtime"
binding = "live"
mutability = "hot"
wire = "visible"
since = 2
help = '''
Whether a node stamps data with a time it does not trust. `always` stamps with
the clock's reading whatever its standing. `trusted-only` stamps only while the
clock is synchronised to a reference, or held over from one within the bound
the host keeps: before the host first reports a reference, and once that bound
has passed, the node stamps no data it forwards, takes no timestamp into its
clock and counts the data it passed on as it came. A storage that needs a time
to order what it keeps still takes one from the system clock. The host reports
the clock's standing, because only the host knows it: a time daemon, a
satellite receiver, a fieldbus master.
'''

[[policy]]
id = "routing-face-drive"
kind = "choice"
kconfig = "WZ_POLICY_ROUTING_FACE_DRIVE"
choices = ["task-per-face", "one-task"]
default = "task-per-face"
upstream = "Reads each link of a node on a task of its own, spawned on the node's receive runtime (two worker threads unless the runtime is configured otherwise), and routes what that link brings on the same task under a read lock of the routing tables, so the links of a node are served by several threads at once."
scope = "runtime"
binding = "open"
mutability = "fixed"
wire = "timing"
since = 2
help = '''
How a node that routes for others serves its links. `task-per-face` gives each
link a task of its own on the node's worker threads: a node with many peers
uses more than one core, and a link that is slow to serve holds up only itself.
`one-task` serves every link from the node's one task, one message at a time,
on one core: the order in which the node handles what its links bring is then
the order the task polled them, which a run replayed for a test needs, and a
host with one core loses nothing by it. Neither changes what a peer is sent or
in what order one link's messages are routed.
'''

[[policy]]
id = "routing-table-sharing"
kind = "choice"
kconfig = "WZ_POLICY_ROUTING_TABLE_SHARING"
choices = ["rwlock", "snapshot"]
default = "rwlock"
upstream = "Keeps a router's routing tables behind one reader-writer lock (`RwLock<Tables>` in its `TablesLock`), so a declaration, a face coming up or one leaving waits for the messages being routed, and they wait for it."
scope = "runtime"
# Decided at the open of the runtime, before it serves its first face.
binding = "open"
mutability = "fixed"
wire = "timing"
since = 2
help = '''
How a node that routes for others shares its routing tables between the links
that route by them and the changes made to them. `rwlock` is upstream's: one
reader-writer lock, so a declaration, a link coming up or one leaving waits for
the messages being routed, and they wait for it. `snapshot` publishes each
change of the tables as a new version that the links route by without waiting:
a change copies only the part of the tables it touches, and a link that leaves
is sent nothing after its leaving has returned. What `snapshot` does not keep
of `rwlock`: a message being routed by the version before a change may reach a
link after a declaration that change sends to the same link, an order no rule
of the protocol sets. `snapshot` is the value to choose for a router whose
sessions come and go while it routes: a change waits for no message being
routed, and a message costs what it costs under `rwlock`.
'''

[[policy]]
id = "reassembly-pool-overflow"
kind = "choice"
kconfig = "WZ_POLICY_REASSEMBLY_POOL_OVERFLOW"
choices = ["reject", "diagnostic-event", "oldest-wins"]
default = "reject"
upstream = "Keeps one defragmentation buffer for each peer and channel, so a new fragmented message never waits on another peer's and there is no shared pool to fill. None of the three values is upstream's, since upstream has no such moment; `reject` is what wz did before the policy existed."
scope = "session"
binding = "live"
mutability = "hot"
wire = "none"
since = 2
help = '''
What a node does with the first fragment of a new fragmented message when every
slot of its reassembly pool holds a message still arriving. The pool is shared
by all the node's peers and bounded, where upstream gives each peer and channel
a buffer of its own; sizing the pool at twice the peer table keeps the moment
from arising. `reject` drops the new message's fragments and keeps the messages
already arriving, which is what wz did before this policy. `diagnostic-event`
does the same and logs a warning, reassembly/slot-pool-full, at each such drop.
`oldest-wins` ends the message whose first fragment came earliest, of whichever
peer, and gives its slot to the new one: the ended message is reported as
evicted and its later fragments are not joined to it, so the newest traffic is kept
and a peer that stalls mid-message loses that message before its deadline.
A peer already holding its quota of messages is refused before the pool is
looked at, whatever the value.
'''

[[policy]]
id = "link-tie-order"
kind = "choice"
kconfig = "WZ_POLICY_LINK_TIE_ORDER"
choices = ["zid-number", "zid-bytes"]
default = "zid-number"
upstream = "Two nodes that dial each other at once keep one transport; zenoh orders the two zids as the 128-bit numbers they are, the wire carrying a zid's little-endian bytes. zenoh-pico keeps no such rule, and compares two ids byte by byte from the first wire byte (`_z_id_cmp`)."
scope = "link"
binding = "open"
mutability = "fixed"
# `wire` is visible: both ends of a link must state the same value.
wire = "visible"
since = 2
help = '''
How a node orders two zids when it and a peer dialled each other at the same
moment and both ends must keep the same one of the two links: the link the node
with the lower zid dialled is kept, and this says which zid is lower. `zid-number`
reads each zid as the 128-bit number zenoh reads, its first wire byte the least
significant. `zid-bytes` compares the two ids byte by byte from the first wire
byte, as zenoh-pico compares ids. The two orders disagree on most pairs of zids,
so both ends of a link must state the same value: a peer that keeps one link by
the other order closes the link this node kept, and neither link survives.
'''

[[policy]]
id = "query-unanswerable-final"
kind = "choice"
kconfig = "WZ_POLICY_QUERY_UNANSWERABLE_FINAL"
choices = ["none", "empty-final"]
default = "none"
upstream = "Drops a query from a peer whose key it cannot resolve (an id the peer never declared to it) before the query reaches any queryable, and sends nothing back, so the asker waits out its own timeout."
scope = "session"
binding = "open"
mutability = "fixed"
# `wire` is visible: `empty-final` sends a RESPONSE_FINAL the peer reads.
wire = "visible"
since = 2
help = '''
How a node answers a query from a peer that it cannot run at all because the
query's key names an id the peer never declared to this node. `none` sends
nothing, as upstream does, and the asker's query ends only at its own timeout.
`empty-final` answers it at once with a RESPONSE_FINAL and no reply, the answer
a query that matched no queryable gets, so the asker learns now that nothing
will come. A query whose parameters or attachment are longer than the build
allows is answered with that final under either value, and a query that
arrives while the node has no room left to hold another final is refused and
counted under either value, since the final it would owe has nowhere to wait.
'''

[[policy]]
id = "zid-derivation"
kind = "choice"
kconfig = "WZ_POLICY_ZID_DERIVATION"
choices = ["random", "address-ports"]
default = "random"
upstream = "Draws every byte of a zid the configuration does not state from its random source."
scope = "runtime"
binding = "open"
mutability = "fixed"
# `wire` is visible: the zid is what every INIT and every routing message names the node by.
wire = "visible"
since = 2
help = '''
How a node makes its zid when the configuration states none. `random` draws all
sixteen bytes, as upstream does. `address-ports` derives the first eight from
where the node is reachable and draws the other eight: bytes 0 to 3 are the
IPv4 address of the first listen endpoint that binds an address of the node,
bytes 4 and 5 the lowest port of its tcp listeners and bytes 6 and 7 the lowest
port of its udp listeners, each little-endian and 0 for a node with no listener
of that protocol. A wildcard, multicast or broadcast address names no node, and
a node whose listeners name no address of its own is refused at open rather
than given a random zid. A zid the configuration states is used under either
value. Only the C ABIs' open reads this policy.
'''

[[policy]]
id = "handshake-stray-message"
kind = "choice"
kconfig = "WZ_POLICY_HANDSHAKE_STRAY_MESSAGE"
choices = ["fail", "ignore", "ignore-and-replay"]
default = "fail"
upstream = "Ends a unicast establishment, closing the link with INVALID, on any message but the one its current step reads next, and drops an Init or Open that reaches an established session while counting it as traffic for the lease."
scope = "session"
binding = "open"
mutability = "fixed"
# `wire` is visible: `fail` sends a Close(INVALID) where `ignore` sends nothing.
wire = "visible"
since = 2
help = '''
What a unicast establishment does with an Init or an Open that is not the
message its current step awaits: an InitAck repeated after the OpenSyn went out,
an InitSyn repeated after the InitAck went out, or any other out of its step.
`fail` ends the attempt and closes the link with INVALID, as upstream does.
`ignore` drops the message before anything is taken from it and the step goes
on waiting, under the deadline it already had: nothing a peer sends extends an
establishment. Under `ignore` an Init or Open that reaches an established
session is dropped as well, and is not counted as a sign of the peer's life for
the lease, nor does it change anything the session negotiated.
`ignore-and-replay` is `ignore`, and in addition a peer that repeats the step
this node last answered (an InitSyn after the InitAck went out, an InitAck
after the OpenSyn went out) is sent that answer again, the very bytes first
sent, so its cookie is the one already issued. A build whose domain allows this
value holds one answer per establishment in flight, released when the
establishment ends; an answer longer than the hold is not sent again.
'''

[[policy]]
id = "handshake-cookie"
kind = "choice"
kconfig = "WZ_POLICY_HANDSHAKE_COOKIE"
choices = ["stateless", "fixed"]
default = "stateless"
upstream = "Puts what an acceptor negotiated into its InitAck cookie, sealed and bound to the handshake, keeps nothing of the accept until the OpenSyn, and admits an OpenSyn only when it echoes that cookie."
scope = "link"
binding = "open"
mutability = "fixed"
# `wire` is visible: the InitAck carries another cookie and the OpenSyn that is admitted differs.
wire = "visible"
since = 2
help = '''
What cookie a node puts in the InitAck of a link it accepts, and what it takes
back. `stateless` is upstream's: the cookie carries what the acceptor
negotiated, sealed, the acceptor holds nothing of the accept until the OpenSyn,
and only an OpenSyn that echoes that cookie is admitted. `fixed` sends the
session's configured cookie (the session parameters' cookie, empty unless the
configuration states one), admits an OpenSyn only when its cookie is exactly
that value (an empty cookie for an empty value), and holds what it negotiated
on its own side until the OpenSyn, so a peer that echoes no cookie can open. A
held accept is one handshake in flight, so it is bounded by the bound on
accepts in their handshake and is let go when the OpenAck goes out or the
accept times out. Under `fixed` the cookie binds nothing to the handshake: a
peer that knows the value can open, as one that echoes the cookie can under
`stateless`.
'''

[[policy]]
id = "key-wire-form"
kind = "choice"
kconfig = "WZ_POLICY_KEY_WIRE_FORM"
choices = ["declared", "shared", "literal"]
default = "declared"
upstream = "Names a key on the wire by the id of a key expression it declared to that peer first, or by the whole key; a peer reads an id only when it was declared to it, and refuses one it never was."
scope = "link"
binding = "open"
mutability = "fixed"
# `wire` is visible: `shared` sends ids a peer without the same dictionary cannot read.
wire = "visible"
since = 2
help = '''
How a node names a key on the wire to the peer of a link. `declared` is
upstream's: the id of a key expression the node declared to that peer, or the
whole key. `literal` sends the whole key every time and declares nothing for
it. `shared` uses the key-id dictionary every node of the deployment holds
(the shared-key-ids capability): the key's own id when the dictionary holds
it, the id of the longest entry that ends at one of its slashes followed by
the rest of the key, or the whole key, whichever takes the fewest bytes, with
no declaration first; a key with a wildcard goes by an id only when the
dictionary holds that exact pattern, a peer that announced itself a router is
sent the declared form, and a reply on the key of a query that came by an id
of the dictionary names it by that id and rest, its mapping bit turned. A peer
that does not hold the same dictionary cannot read what `shared` sends, so both
ends of the link must hold it. Every node that holds the dictionary reads an id
only the dictionary names, whatever its own value. The value is the session's,
and an endpoint the configuration dials or listens on may be stated a value of
its own (wz/key-ids/links, wz_ext_config_key_wire_form_for), which every link
to or from that endpoint takes. A session opened with `shared`, for itself or an
endpoint, and no dictionary is refused, and so is one whose value is not
`declared` in a build without the capability, and a router node, whose faces
read no id of a dictionary, with any value but `declared`. Interests and
liveliness interests name their keys as under `declared`.
'''

# A profile is a named set of policy values a run-time document starts from: the document names it
# by `wz/profile`, and its own `wz/policies` override the profile's values. A profile states its
# values in a `[profile.policies]` table, policy id = value; each value is one of its policy's, and
# no policy that only the build decides is in a profile. Whether the build's domain allows a value
# is decided when a document is applied: a profile whose value a build leaves out is refused by
# that build. Each is generated into `PROFILES` (crates/wz-session-core/src/policy_generated.rs)
# and into the enum of `wz/profile` in the schema.
#
# `upstream` states every policy a document may state at its `default`, upstream's behaviour, so a
# document that names it behaves as the original even where the build states other defaults
# (`WZ_POLICY_<NAME>`); `wz_config.py --check` holds it to every policy's default.
[[profile]]
id = "upstream"
help = '''
Every policy at upstream's behaviour, stated explicitly, so a document that names
it behaves as the original whatever the build states as its defaults. Where
upstream has no such behaviour, the value is the one wz had before the policy
existed.
'''

[profile.policies]
multicast-loopback = "os-default"
tx-no-progress-deadline = "off"
tx-expiry-keeps-session = "off"
declaration-sync-pacing = "off"
datagram-fragment-pacing = "off"
multicast-link-requires-iface = "off"
reliable-gap-reconnect = "off"
entity-link-restriction = "off"
targeted-query = "off"
publisher-admission-retry = "off"
multi-route-atomic-tx = "off"
entity-timestamp-opt-in = "off"
reply-auto-timestamp = "off"
subscriber-overload = "block"
key-set = "open"
sn-resolution = "bits-32"
supervision-after-expiry = "latch"
e2e-supervision-notify = "status-only"
replay-reply-shape = "frame-per-sample"
replay-serve-holds-sends = "off"
replay-live-before-answer = "deliver"
event-ring-full = "overwrite-oldest"
clock-quality-stamping = "always"
routing-face-drive = "task-per-face"
routing-table-sharing = "rwlock"
reassembly-pool-overflow = "reject"
link-tie-order = "zid-number"
query-unanswerable-final = "none"
zid-derivation = "random"
handshake-stray-message = "fail"
handshake-cookie = "stateless"
key-wire-form = "declared"

# ─── Protocol facts (part of the conformance statement a build gives of itself) ───────────────
#
# A protocol fact is something a session of an ABI states on the wire that no switch of this
# declaration moves: it is the same for every build of the ABI at this catalogue version. The
# conformance statement lists the facts of its ABI beside its values, so a test system reads the
# PICS items they answer from the build (conformance/suite/answers/wz.toml). They are not in the
# statement's digest: the ABI and the catalogue version already are, and they fix every fact, so
# a fact whose value changes moves `catalog_version` with it. crates/wz-conformance-suite holds
# that: `facts_pin.toml` there pins the facts' canonical digest at a catalogue version, and its
# test fails when the facts move and the version does not.
#
# Each fact names, per ABI, its value (`pico`, `c`; an ABI it does not name has no such fact),
# and where this tree holds it: each entry of `holds` is `<file of this tree> @ <text>`, a text
# that must occur in that file, and each of `lacks` one that must not. crates/wz-conformance-suite
# checks every entry, so a change of the code the fact rests on is a red test, not a statement
# that has quietly become false.
[[protocol_fact]]
id = "patch"
pico = "1"
c = "1"
holds = ["crates/wz-session-core/src/extpatch.rs @ pub const CURRENT_PATCH: u8 = 1;"]
help = '''
The protocol patch level a session states in its Init and its Join: 1, so the
first and drop markers of a Fragment are used when the peer states 1 too.
'''

[[protocol_fact]]
id = "batch-compression"
pico = "no"
lacks = ["crates/wz-capi-pico/Cargo.toml @ compression"]
help = '''
Whether a session offers and accepts batch compression. The pico ABI never
compiles the compression handshake: its crate takes the session model without
its default features and forwards no compression feature to it. The zenoh-c ABI
states it with the transport_compression capability instead.
'''

[[protocol_fact]]
id = "request-id-resolution"
pico = "32"
c = "32"
holds = ["crates/wz-capi-core/src/drive.rs @ req_id_res: 2,", "crates/wz-capi-coop/src/engine.rs @ req_id_res: 2,", "crates/wz-session-core/src/handshake_encode.rs @ sn_res: pack_sn_res(caps.seq_num_res, caps.req_id_res),"]
help = '''
The request id resolution, in bits, a session states in its Init: 32 (the code
0b10). Both engines give every session the code 2 (the tokio engine's
`init_params`, the cooperative engine's session parameters), and the Init
always carries its size parameters, so the resolution is on the wire whatever
the frame resolution policy says. An InitAck states the smaller of its own and
the peer's.
'''

[[protocol_fact]]
id = "router-role"
pico = "no"
holds = ["crates/wz-capi-pico/src/session.rs @ Some(_) => return Err(crate::result::Z_ERR_CONFIG_INVALID_MODE),", "crates/wz-capi-pico/src/result.rs @ pub const Z_ERR_CONFIG_INVALID_MODE: ZResult = -90;"]
lacks = ["crates/wz-capi-pico/src/session.rs @ WhatAmI::Router", "crates/wz-capi-coop/src/engine.rs @ WhatAmI::Router"]
help = '''
Whether a session of the ABI can take the router role. The pico ABI opens a
client, or a peer when the configuration's mode is peer or it listens, and
refuses any other mode, router among them, with zenoh-pico's invalid-mode code
(-90), as zenoh-pico does; no path of the ABI makes a router. The zenoh-c ABI
states it with the router-node capability instead.
'''

[[protocol_fact]]
id = "tcp-link"
pico = "yes"
c = "yes"
holds = ["crates/wz-capi-core/Cargo.toml @ transport-link-tcp", "crates/wz-runtime-posix/src/links.rs @ pub type PosixLinks = wz_runtime_coop::ip_stack::IpLinks<PosixUdpSocket, PosixTcpDial>;", "crates/wz-runtime-zephyr/src/links.rs @ pub type ZephyrIpLinks = wz_runtime_coop::ip_stack::IpLinks<ZephyrUdpSocket, ZephyrTcpDial>;"]
help = '''
Whether a session runs over the tcp link, a link that does not keep message
boundaries. Every engine and platform the ABIs build for has it: the tokio
engine takes the tcp link in every build, and the cooperative engine's links on
a host and on Zephyr dial and accept tcp beside udp.
'''

# The role of a node in a zenoh network: upstream's `mode`. A global axis (it names no image),
# so that every tree that sources the capabilities can state it, and each option selects the
# capabilities it needs: the role pulls what it requires, and nothing else. What an image also
# hosts is a capability of its own beside the role (the admin node is the `peer` role that hosts
# the admin space, `admin-space`), and an image says which roles it can be.
[[axis]]
id = "role"
kconfig = "WZ_ROLE"
prompt = "What the node is in a zenoh network"
default = "peer"
help = '''
Upstream's `mode`. The default is the peer, which the zenoh and zenoh-c originals are built
as; the original of zenoh-pico is a client, and what each original's own default is comes
with the originals' defconfigs.
'''

[[axis_option]]
id = "client"
axis = "role"
kconfig = "WZ_ROLE_CLIENT"
prompt = "Client: dials a router, accepts no session"
# zenoh-pico's `Z_CONFIG_MODE_DEFAULT` is `Z_CONFIG_MODE_CLIENT` (include/zenoh-pico/config.h.in).
upstream_on = ["zenoh-pico"]
help = '''
A node that dials a router and is dialled by none: no listener, no accepted session. It
needs nothing the peer role pulls in.
'''

[[axis_option]]
id = "peer"
axis = "role"
kconfig = "WZ_ROLE_PEER"
prompt = "Peer: accepts sessions as well as dialling"
implies = ["peer"]
# zenoh-config's `defaults::mode` is `WhatAmI::Peer`, which zenoh-c's default config is too.
upstream_on = ["zenoh", "zenoh-c"]
help = '''
Upstream's `mode = peer`. The capability `peer` is what a listener, a router and a peer have
that a client does not, so the role pulls it in.
'''

[[axis_option]]
id = "router"
axis = "role"
kconfig = "WZ_ROLE_ROUTER"
prompt = "Router: routes between the sessions it holds"
implies = ["peer", "timestamping"]
help = '''
Upstream's `mode = router`. It is a peer that also stamps the messages it relays: the
capability `timestamping` is the node clock that role holds, which upstream's router has on
by default.
'''

[[image]]
id = "zephyr-admin-node"
dir = "deploy/zephyr-admin-node"

[[axis]]
id = "net-backend"
image = "zephyr-admin-node"
kconfig = "WZ_NET_BACKEND"
prompt = "Network stack the admin node runs over"
default = "zephyr-sockets"
help = '''
The node is the same on every board; what differs is the stack under it,
which the board's Ethernet driver decides.
'''

[[axis_option]]
id = "zephyr-sockets"
axis = "net-backend"
kconfig = "WZ_NET_BACKEND_ZEPHYR_SOCKETS"
prompt = "Zephyr's own network stack and BSD sockets"
help = '''
For a board whose Ethernet, Wi-Fi or modem Zephyr drives. The interface, its
address (DHCP or Kconfig) and its link-layer identity are Zephyr's.
'''

[[axis_option]]
id = "lwip-mac"
axis = "net-backend"
kconfig = "WZ_NET_BACKEND_LWIP_MAC"
prompt = "lwIP over an Ethernet MAC the wz crates drive"
requires = "!WZ_ROLE_CLIENT"
help = '''
For a board whose Ethernet controller Zephyr has no driver for. Zephyr is the
kernel only (threads, clock, heap, console): the network is lwIP, polled from
the node's loop, over a wz `EthernetMac` crate for the chip. The interface
address and the MAC address are the board's Kconfig, since no Zephyr
interface exists to ask.
'''

[[axis]]
id = "storage"
image = "zephyr-admin-node"
kconfig = "WZ_NODE_STORAGE"
prompt = "Where the node's tables live"
default = "heap"
help = '''
The memory profile is the node's and not a network backend's: whether the Rust image has an
allocator is a setting made beside the role and the stack, and what it is available to is
what has the slot profile's pieces (the stack's driver and how it opens a socket).
'''

[[axis_option]]
id = "heap"
axis = "storage"
kconfig = "WZ_STORAGE_HEAP"
prompt = "The heap profile: the growable node, over an allocator in the Rust image"

[[axis_option]]
id = "fixed"
axis = "storage"
kconfig = "WZ_FIXED_MEMORY"
prompt = "Build the node on the fixed-memory profile (no allocator in the Rust image)"
requires = "(WZ_NET_BACKEND_LWIP_MAC && WZ_MAC_CYT4BF) || (WZ_NET_BACKEND_ZEPHYR_SOCKETS && (WZ_ROLE_CLIENT || WZ_ROLE_PEER))"
help = '''
Every table the node holds (sessions, sockets, the observer, the interfaces) is a
static the image declares, the session tier is the slot profile's, and the Rust
staticlib is built with its default features off, so it links no allocator. The
session host and the dialler are the ones every stack shares
(wz_session_mcu::slot_host); a stack supplies its driver and how it opens a socket.

Three nodes have the profile. The admin node over lwIP is fixed_node.rs: its listener
reads only the datagrams of the peer each session was accepted from and drops and
counts the rest, where the growable node's one accepting session takes the source of
every datagram it reads as its peer. The client node over Zephyr's sockets is
fixed_client.rs. The admin node over Zephyr's sockets (a peer role) is fixed_admin.rs:
it takes a session only through the secure channel (CONFIG_WZ_TLS), because the
socket stack's listener of the slot profile is a stream listener and a zid is proven
only by a secure channel, and it binds the lifecycle verbs for the zids the build
lists (CONFIG_WZ_COMMANDERS_*).

This kernel's own heap is a separate matter: what the Rust image does not allocate,
Zephyr's network stack and POSIX layer still may, and CONFIG_HEAP_MEM_POOL_SIZE is what
the kernel is given for it.
'''

# Decision D7 of docs/session-lifecycle-intent.md: how a session lifecycle verb reaches the node.
# The contract (open a peer by its zid, answered with an outcome) is one, and what differs is what
# feeds it. A third value, `out-of-band` (an agent's control channel), is added with its control
# port (step 7d), and not before: an option that cannot be built is not declared.
[[axis]]
id = "lifecycle-transport"
image = "zephyr-admin-node"
kconfig = "WZ_LIFECYCLE_TRANSPORT"
prompt = "How a session lifecycle verb reaches the node"
default = "in-band"
help = '''
The node holds the peers it was told to hold by their zid beside the locators it is told to
connect to, and which peers it is asked to hold at run time is a transport of its own: a Push or
a query on the admin space, an agent that drives the node over a channel of its own, or none.
'''

[[axis_option]]
id = "in-band"
axis = "lifecycle-transport"
kconfig = "WZ_LIFECYCLE_IN_BAND"
prompt = "A query on the admin space opens a peer (session/open/<zid>)"
help = '''
The node answers `GET @/<zid>/<whatami>/session/open/<peer-zid>` by holding the peer and lists
the verb in `session/verbs`. Only the fixed-memory admin node binds the verb this way; the other
nodes of the image have their own lifecycle or none, and this value changes nothing of them.
'''

[[axis_option]]
id = "declared"
axis = "lifecycle-transport"
kconfig = "WZ_LIFECYCLE_DECLARED"
prompt = "No verb: the peers are the ones the build declares"
requires = "WZ_FIXED_MEMORY && WZ_NET_BACKEND_LWIP_MAC"
help = '''
The node binds no lifecycle verb: its admin answer lists none and serves no `session/open` key, and
the code that serves it is not in the image. The peers it holds are the ones declared when it was
built, and its connection machines only reconnect them.
'''

# The protocol the links of the lwIP node run on. The node's session tier is the same on both, the
# slot profile's: what differs is the stack's link (a datagram socket, or a stream over lwIP's TCP
# with the engine's stream link) and the locators the node reports and takes (`udp/` or `tcp/`).
[[axis]]
id = "link-protocol"
image = "zephyr-admin-node"
kconfig = "WZ_LINK_PROTOCOL"
prompt = "The protocol the lwIP node's links run on"
default = "udp"
help = '''
The node over lwIP on the fixed-memory profile opens and accepts its sessions over one protocol
and reports its locators in it. `udp` is the node that has been on the T2G kit. `tcp` is the same
node over lwIP's TCP (lwIP is built with its TCP sources, and the node's polls pump the MACs
while a connect or a write waits); it has been built and not run on a board.
'''

[[axis_option]]
id = "udp"
axis = "link-protocol"
kconfig = "WZ_LINK_UDP"
prompt = "udp/: a datagram for each batch"
help = '''
The node's links are UDP sockets of lwIP, one datagram for each batch, as zenoh's udp/ link.
'''

[[axis_option]]
id = "tcp"
axis = "link-protocol"
kconfig = "WZ_LINK_TCP"
prompt = "tcp/: a byte stream with each batch behind its length"
requires = "WZ_NET_BACKEND_LWIP_MAC && WZ_FIXED_MEMORY"
help = '''
The node's links are TCP connections of lwIP, a batch written behind a two-byte length as zenoh's
tcp/ link. The connection pool, the receive rings and the byte tables the links take their buffers
from are the image's statics (`fixed_tcp.rs`), and lwIP's TCP options are the port's
(`lwip-port/lwipopts.h`). Only the fixed-memory node over lwIP has it.
'''

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_LWIP_MAC", "WZ_FIXED_MEMORY", "WZ_LINK_TCP"]
features = ["fixed-tcp"]
defaults = "off"

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_LIFECYCLE_DECLARED"]
features = ["lifecycle-declared"]

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_ZEPHYR_SOCKETS"]
features = ["net-zephyr-sockets"]

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_LWIP_MAC"]
features = ["net-lwip-mac"]

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_ROLE_CLIENT", "WZ_STORAGE_HEAP"]
features = ["heap-storage"]
defaults = "off"

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_ROLE_CLIENT", "WZ_FIXED_MEMORY"]
features = ["fixed-client"]
defaults = "off"

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_LWIP_MAC", "WZ_FIXED_MEMORY"]
features = ["fixed-memory"]
defaults = "off"

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_ZEPHYR_SOCKETS", "WZ_ROLE_PEER", "WZ_FIXED_MEMORY"]
features = ["fixed-admin"]
defaults = "off"

# The policies the Zephyr node reads. A policy is a field of the build's session policy, and a build
# gives it a value only where the code that reads it is in the image and is run by it, so the image
# names the policies it reads and a policy it does not name has no symbol in its Kconfig tree: a
# deployer who asks for one gets Zephyr's refusal of an undefined symbol, not a setting that changes
# nothing. What each row rests on is the call path from the image's own sources, not the crates it
# links: the session factory of every profile builds its transmit queue from the build's policy
# (`TxQueueConf::default()`), which is where the two transmit policies are read, and the declaration
# replay is paced only by the client node of the slot profile (`SlotClientNode::new`). The other ten
# policies are read by code this image does not run: the tokio runtime, the C ABIs (the node states
# its own sequence-number resolution), the node clock and event log (not linked), the supervisor and
# the router, or are an assertion of the build and no run-time read.
[[policy_image]]
policy = "tx-no-progress-deadline"
image = "zephyr-admin-node"

[[policy_image]]
policy = "tx-expiry-keeps-session"
image = "zephyr-admin-node"

[[policy_image]]
policy = "declaration-sync-pacing"
image = "zephyr-admin-node"
requires = "WZ_ROLE_CLIENT && WZ_FIXED_MEMORY"
