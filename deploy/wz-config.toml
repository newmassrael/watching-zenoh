# fine the message-interval histogram is the `SNAPSHOT_HISTOGRAM_BUCKETS` limit.
[[capability]]
id = "resource-snapshot"
observation_bit = 3
kconfig = "WZ_CAP_RESOURCE_SNAPSHOT"
os_needs = []
upstream_off = ["zenoh", "zenoh-c", "zenoh-pico"]
default = "off"
abis = ["core", "pico", "c"]
implies = ["unstable-api"]
help = "Take a snapshot of the node's resources and the spacing of the messages it receives."

