# ─── Artifacts and roles (docs/target-build-contract.md T8) ───────────────────────────────────
#
# The three files the entry packages. A library names the ABI whose capability graph resolves what
# its build asks of a device; the `family` is the one its stamp carries. A role is what the file
# provides and how it is reached: the session node needs the stock-config feature, and the traffic
# driver's role words come from the facts note the executable was built with.
[[artifact]]
id = "capi-pico"
package = "wz-capi-pico"
kind = "shared-library"
file = "wz_capi_pico"
family = "capi-pico"
abi = "pico"
