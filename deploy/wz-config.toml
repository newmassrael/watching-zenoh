#
# The build configuration of wz, declared ONCE (docs/build-configuration.md, decision C1).
#
# Every switch a build can turn is declared here, and everything else is derived from this file by
# `scripts/lib/wz_config.py`, which `--check`s each derived file against it:
#
#   * `deploy/Kconfig.capabilities`   the capabilities a Zephyr or Linux deployer selects from
#                                     (generated; `--check` fails when it is stale);
#   * `deploy/Kconfig.limits`         the limits an image states for itself (generated);
#   * `crates/wz-session-core/src/caps_generated.rs`
#                                     the value of each limit as the code reads it (generated);
#   * `<image dir>/Kconfig.axes` and `<image dir>/wz_axes.cmake`
#                                     each image's axes as Kconfig choices, and what they build
#                                     its crate with (generated);
#   * the Cargo features               `--features <abi> <.config>` turns a Kconfig result into
#                                     the `cargo build` arguments of an ABI crate;
#   * the three manifests              wz-capi-core, wz-capi-pico and wz-capi-c each spell the
#                                     same capability graph by hand in `[features]`, because Cargo
#                                     cannot include a fragment; `--check` fails when a manifest
#                                     drifts from it.
#
# The file is read by a reader of one small TOML shape (the hosted Python floor has no `tomllib`):
# `key = value` on one line, the value a string, an integer or an array of strings, or a `'''`
# literal string across lines; `[table]` and `[[array of tables]]` headers; `#` comments on lines
# of their own.
#
# ## Capabilities
#
# A capability is a plane a build either has or does not: the doors it exports and the runtime
# behind them. `implies` is a capability that must be on when this one is. `abis` is where the
# capability is exported (core is the model under both ABIs and always has it). `default` is
# whether a build that names nothing has it: on unless declared `default = "off"`, so the drop-in
# exports what the reference build does, and `off` is for a switch the reference library itself
# leaves off. `pico_flag` is zenoh-pico's own switch for it, where it has one, so a deployer who
# already writes a pico `config.h` can state the same intent. `pico_flags_all` is for a capability
# pico has no switch of its own for but has whenever several switches are all on (the liveliness
# get, which pico declares inside both the liveliness and the query switch).
#
# `base` is what an ABI build needs that is not a capability.
#
# ## Limits
#
# A limit is the capacity of a table every session of an image holds. `default` is the value of a
# build that states nothing; an image states its own through `CONFIG_<kconfig>`, which the Zephyr
# build hands to cargo as the environment variable of the same name without `CONFIG_`
# (deploy/zephyr-common/wz_zephyr_board.cmake). The code reads each limit from the generated
# module, and `crates/wz-session-core/src/caps.rs` binds the name the code uses to it.
#
# ## Images and their axes
#
# An `image` is a Zephyr application whose node is chosen along axes. An `axis` is a Kconfig
# `choice` of that image, with a `default` option; each `axis_option` is one member of it, and its
# `requires` (a Kconfig expression) becomes the member's `depends on`, so a combination the node
# cannot be built as cannot be selected. A `cargo_rule` says what the image's crate is built with
# when every option named in its `when` is selected: the `features` it adds, and `defaults = "off"`
# where the crate's default features (its heap profile) must be off. Generated for each image:
# `<dir>/Kconfig.axes`, which the image's Kconfig sources, and `<dir>/wz_axes.cmake`, which its
# CMake includes and which sets `wz_axes_features` and `wz_axes_no_default_features`. What is
# particular to a board or a driver stays in the image's own Kconfig and CMake.

schema_version = 1
catalog_version = 1

[base]
core = ["rx-busy-poll"]
pico = ["serial-drive-own-thread", "rx-busy-poll"]
c = []

[[capability]]
id = "link-udp"
kconfig = "WZ_CAP_LINK_UDP"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_LINK_UDP_UNICAST"
implies = []
help = "A udp/ endpoint to dial, and the transport the scouting group rides."

[[capability]]
id = "timestamping"
kconfig = "WZ_CAP_TIMESTAMPING"
abis = ["core", "c"]
implies = []
help = "The node clock a role that stamps its messages holds (zenoh's router does by default)."

[[capability]]
id = "scout"
kconfig = "WZ_CAP_SCOUT"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_SCOUTING"
implies = ["link-udp"]
help = "z_scout, the hello family, and a client finding its router by scouting."

[[capability]]
id = "peer"
kconfig = "WZ_CAP_PEER"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_UNICAST_PEER"
implies = ["scout"]
help = "A listener, a router or a peer: the roles beyond the client. Off, z_open refuses them."

# Open-debt item 913 — a UDP multicast group a peer joins. pico has it where both its transport
# switch and its UDP multicast link switch are on, so the capability names the two. zenoh-c has
# no switch for it: its default build joins a group listed in `listen/endpoints`.
[[capability]]
id = "multicast-transport"
kconfig = "WZ_CAP_MULTICAST_TRANSPORT"
abis = ["core", "pico", "c"]
pico_flags_all = ["Z_FEATURE_MULTICAST_TRANSPORT", "Z_FEATURE_LINK_UDP_MULTICAST"]
implies = ["link-udp", "peer"]
help = "A UDP multicast group a peer joins: one transport to every member of the group."

# Open-debt item 913 — zenoh-pico's multicast declarations switch (vendor default 0). On a
# group it sends interests (the open-time pull of the members' keyexprs, a write filter's),
# declares keyexprs, and lets a publisher's or querier's write filter hold a write back.
[[capability]]
id = "multicast-declarations"
kconfig = "WZ_CAP_MULTICAST_DECLARATIONS"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_MULTICAST_DECLARATIONS"
default = "off"
implies = ["multicast-transport"]
help = "pico's multicast declarations: interests, keyexpr declarations and the write filter on a group."

# Open-debt item 911 — zenoh-pico's raw Ethernet transport (vendor default 0): a multicast session
# over L2 frames, one message per frame, its destination MAC from the endpoint's mapping.
[[capability]]
id = "raweth-transport"
kconfig = "WZ_CAP_RAWETH_TRANSPORT"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_RAWETH_TRANSPORT"
default = "off"
implies = ["multicast-transport"]
help = "pico's raw Ethernet transport: a group over L2 frames on one interface (Linux, CAP_NET_RAW)."

[[capability]]
id = "query"
kconfig = "WZ_CAP_QUERY"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_QUERY"
implies = []
help = "z_get and the querier: the requesting end of a query."

[[capability]]
id = "queryable"
kconfig = "WZ_CAP_QUERYABLE"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_QUERYABLE"
implies = []
help = "z_declare_queryable and the replies: the answering end of a query."

[[capability]]
id = "liveliness"
kconfig = "WZ_CAP_LIVELINESS"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_LIVELINESS"
implies = []
help = "The liveliness token and subscriber."

[[capability]]
id = "liveliness-get"
kconfig = "WZ_CAP_LIVELINESS_GET"
abis = ["core", "pico", "c"]
pico_flags_all = ["Z_FEATURE_LIVELINESS", "Z_FEATURE_QUERY"]
implies = ["liveliness", "query"]
help = "The snapshot get of the liveliness plane; it is a query."

[[capability]]
id = "advanced"
kconfig = "WZ_CAP_ADVANCED"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_ADVANCED_PUBLICATION"
implies = ["liveliness", "queryable", "timestamping", "unstable-api"]
help = "The advanced publisher and subscriber (cache, history, miss detection)."

[[capability]]
id = "group"
kconfig = "WZ_CAP_GROUP"
abis = ["core", "c"]
implies = []
help = "zenoh-ext group membership."

[[capability]]
id = "gossip"
kconfig = "WZ_CAP_GOSSIP"
abis = ["core", "pico", "c"]
implies = ["peer"]
help = "A session told of a node by one it holds a link to dials it."

# pico's unstable API (`Z_FEATURE_UNSTABLE_API`, a bare `#define`): the entity ids, the sample's
# reliability and source info, the cancellation token, and the option fields that carry them
# (`reliability`, `source_info`, `cancellation_token`). Off, those fields are not in the option
# structs a program allocates, so the structs are smaller; pico's CMake forces the connectivity
# plane, the advanced publisher and the admin space off with it, which `implies` states from
# their side.
[[capability]]
id = "unstable-api"
kconfig = "WZ_CAP_UNSTABLE_API"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_UNSTABLE_API"
implies = []
help = "pico's unstable API: entity ids, reliability, source info, the cancellation token, and their option fields."

# pico's connectivity plane (`Z_FEATURE_CONNECTIVITY`): the transport and link snapshots and
# event listeners. Upstream declares it only with the unstable API.
[[capability]]
id = "connectivity"
kconfig = "WZ_CAP_CONNECTIVITY"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_CONNECTIVITY"
implies = ["unstable-api"]
help = "pico's connectivity plane: transport and link snapshots, and their event listeners."

# pico's admin space (`Z_FEATURE_ADMIN_SPACE`, off in upstream's default and in the reference
# build): `zp_start_admin_space` / `zp_stop_admin_space`, a queryable answering pico's
# `@/<zid>/pico/**` documents, and the open options' `auto_start_admin_space`. pico's CMake
# turns it off without the queryable and without the unstable API.
[[capability]]
id = "admin-space"
kconfig = "WZ_CAP_ADMIN_SPACE"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_ADMIN_SPACE"
default = "off"
implies = ["queryable", "unstable-api"]
help = "pico's admin space: zp_start_admin_space, zp_stop_admin_space and the @/<zid>/pico/** documents."

# pico's session-local delivery (`Z_FEATURE_LOCAL_SUBSCRIBER`, `Z_FEATURE_LOCAL_QUERYABLE`, both
# off upstream). On, a session's own put reaches its own subscribers, and its own get its own
# queryables, inside the call and on the caller's thread as pico delivers them; the option
# structs gain `allowed_origin` and `allowed_destination`, so the layouts differ from the
# default arm's; and a publisher's or querier's write filter and matching status count the
# session's own entities.
[[capability]]
id = "local-subscriber"
kconfig = "WZ_CAP_LOCAL_SUBSCRIBER"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_LOCAL_SUBSCRIBER"
default = "off"
implies = []
help = "pico's session-local subscriptions: a session's own put reaches its own subscribers."

[[capability]]
id = "local-queryable"
kconfig = "WZ_CAP_LOCAL_QUERYABLE"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_LOCAL_QUERYABLE"
default = "off"
implies = []
help = "pico's session-local queryables: a session's own get reaches its own queryables."

# pico's header arm for its tasks. On, the C ABI is the one pico's multi-threaded headers declare:
# the read and lease task doors, the host mutex, condvar and task, and the channel collections
# that block. Off, it is the single-threaded one: zp_read, zp_send_keep_alive, zp_send_join and
# zp_spin_once instead, a one-byte z_open_options_t, and channel collections that never block.
# The struct sizes differ between the arms, so a program compiled against one header arm must be
# linked to a build of the same arm. The model has no thread choice of its own (a wz session drives
# itself either way); the core feature exists because every capability is one of the core's.
[[capability]]
id = "multi-thread"
kconfig = "WZ_CAP_MULTI_THREAD"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_MULTI_THREAD"
implies = []
help = "pico's multi-threaded C ABI (task doors, host sync, blocking channels); off, the single-threaded one."

# The link kinds and the handshake methods zenoh-c turns on by default. They carry zenoh-c's own
# feature names, so a build of the zenoh-c drop-in is asked for with the switches a zenoh-c build
# is; the pico ABI forwards its links under names of its own and has none of these. The switches
# zenoh-c leaves off (serial, unixpipe, vsock, stats) are features of the two manifests and not
# capabilities here, because a capability is on in every default build.

[[capability]]
id = "transport_tls"
kconfig = "WZ_CAP_TRANSPORT_TLS"
abis = ["core", "c"]
implies = []
help = "The tls/ link, dial and accept, with the certificate material of transport/link/tls."

[[capability]]
id = "transport_quic"
kconfig = "WZ_CAP_TRANSPORT_QUIC"
abis = ["core", "c"]
implies = []
help = "The quic/ link, dial and accept, with the certificate material of transport/link/tls."

[[capability]]
id = "transport_quic_datagram"
kconfig = "WZ_CAP_TRANSPORT_QUIC_DATAGRAM"
abis = ["core", "c"]
implies = ["transport_quic"]
help = "The quic-datagram/ link, over the quic link's connection and certificate material."

[[capability]]
id = "transport_ws"
kconfig = "WZ_CAP_TRANSPORT_WS"
abis = ["core", "c"]
implies = []
help = "The ws/ link, dial and accept."

[[capability]]
id = "transport_unixsock-stream"
kconfig = "WZ_CAP_TRANSPORT_UNIXSOCK_STREAM"
abis = ["core", "c"]
implies = []
help = "The unixsock-stream/ link, dial and accept, on a Unix target."

[[capability]]
id = "transport_multilink"
kconfig = "WZ_CAP_TRANSPORT_MULTILINK"
abis = ["core", "c"]
implies = []
help = "The multilink establishment extension."

[[capability]]
id = "auth_pubkey"
kconfig = "WZ_CAP_AUTH_PUBKEY"
abis = ["core", "c"]
implies = []
help = "The public-key handshake, from the RSA identity of transport/auth/pubkey."

[[capability]]
id = "e2e-sender"
kconfig = "WZ_CAP_E2E_SENDER"
abis = ["core", "c"]
implies = []
help = "The sending side of an end-to-end protected message (wz_capi_c_e2e_sender_*, wz-own doors) and the frame writer behind it."

[[capability]]
id = "transport_compression"
kconfig = "WZ_CAP_TRANSPORT_COMPRESSION"
abis = ["core", "c"]
implies = []
help = "The batch compression extension: a session offers it and accepts a compressed batch."

[[capability]]
id = "auth_usrpwd"
kconfig = "WZ_CAP_AUTH_USRPWD"
abis = ["core", "c"]
implies = []
help = "The user/password handshake method, and the credential check of a listener that names a dictionary file."

[[capability]]
id = "interceptors"
kconfig = "WZ_CAP_INTERCEPTORS"
abis = ["core", "c"]
implies = []
help = "The traffic policy a node's config states: access_control, low_pass_filter and downsampling, enforced on every face."

[[limit]]
id = "MAX_KEYEXPR_BYTES"
kconfig = "WZ_LIMIT_MAX_KEYEXPR_BYTES"
default = 256
help = '''
The longest key expression, in bytes, a session stores: a subscription's
pattern, or a key a peer declared. A longer one is refused, never cut short.
Every table that stores keys sizes its rows by this.
'''

[[limit]]
id = "MAX_SUBSCRIPTIONS"
kconfig = "WZ_LIMIT_MAX_SUBSCRIPTIONS"
default = 16
help = '''
The subscribers a session holds at once. Declaring one more is refused
while the table is full.
'''

[[limit]]
id = "MAX_QUERYABLES"
kconfig = "WZ_LIMIT_MAX_QUERYABLES"
default = 16
help = '''
The queryables a session holds at once. Declaring one more is refused
while the table is full.
'''

[[limit]]
id = "MAX_PENDING_QUERIES"
kconfig = "WZ_LIMIT_MAX_PENDING_QUERIES"
default = 16
help = '''
The queries (gets) a session has waiting for their replies at once.
Issuing one more is refused while the table is full.
'''

[[limit]]
id = "MAX_DECL_OBSERVERS"
kconfig = "WZ_LIMIT_MAX_DECL_OBSERVERS"
default = 8
help = '''
The observers an application installs on the declarations of its peers
(subscribers, queryables and liveliness tokens appearing or leaving), per
kind and per direction. They are installed once at start, so few are
needed; one more is refused.
'''

[[limit]]
id = "MAX_LIVELINESS_SUBSCRIPTIONS"
kconfig = "WZ_LIMIT_MAX_LIVELINESS_SUBSCRIPTIONS"
default = 8
help = '''
The liveliness subscribers a session holds at once. Declaring one more
is refused while the table is full.
'''

[[limit]]
id = "MAX_LOCAL_TOKENS"
kconfig = "WZ_LIMIT_MAX_LOCAL_TOKENS"
default = 8
help = '''
The liveliness tokens a session itself declares and holds at once.
Declaring one more is refused while the table is full.
'''

[[limit]]
id = "MAX_PENDING_LIVELINESS_GETS"
kconfig = "WZ_LIMIT_MAX_PENDING_LIVELINESS_GETS"
default = 8
help = '''
The liveliness gets (snapshots of the tokens alive) a session has waiting
for their answer at once. A get ends as soon as its answer is complete, so
few are waiting together; one more is refused while the table is full.
'''

[[limit]]
id = "MAX_PENDING_DECLARES"
kconfig = "WZ_LIMIT_MAX_PENDING_DECLARES"
default = 32
help = '''
The declarations a session can have ready to send in answer to its peers'
interests between two sends: each answer is the session's matching
declarations and a final. An answer that does not fit whole is refused and
counted, never sent in part.
'''

[[limit]]
id = "MAX_INBOUND_SUB_INTERESTS"
kconfig = "WZ_LIMIT_MAX_INBOUND_SUB_INTERESTS"
default = 16
help = '''
The peers' interests in this session's subscribers that the session
remembers, so that a subscriber declared later is announced to them: one
per publisher a peer holds with a write filter. Past it a peer still gets
the subscribers of the moment, not the later ones.
'''

[[limit]]
id = "MAX_PEER_KEYEXPR_ALIASES"
kconfig = "WZ_LIMIT_MAX_PEER_KEYEXPR_ALIASES"
default = 16
help = '''
The key expressions one peer may have declared to this session at a time,
to name them by a short id. One more is refused and counted, and a message
that names it is dropped, as one naming an undeclared id is.
'''

[[limit]]
id = "MAX_REMOTE_DECLS"
kconfig = "WZ_LIMIT_MAX_REMOTE_DECLS"
default = 16
help = '''
The declarations of one kind (subscribers, queryables, liveliness tokens)
one peer may hold open to this session at a time. One more is refused and
counted, and the application is not told of it.
'''

[[limit]]
id = "MAX_PENDING_REPLIES"
kconfig = "WZ_LIMIT_MAX_PENDING_REPLIES"
default = 8
help = '''
The replies a session's queryables may have ready to send between two
sends. One more is refused and counted, and the handler that made it is
told.
'''

[[limit]]
id = "MAX_PENDING_FINALS"
kconfig = "WZ_LIMIT_MAX_PENDING_FINALS"
default = 8
help = '''
The queries a session may owe the end of an answer between two sends. A
query that would need one more is refused, and counted, before its
queryables run: an answer that could not be ended would leave the asker
waiting until its own timeout.
'''

[[limit]]
id = "MAX_REPLY_PAYLOAD_BYTES"
kconfig = "WZ_LIMIT_MAX_REPLY_PAYLOAD_BYTES"
default = 1024
help = '''
The largest payload of one reply, in bytes, and the largest attachment
beside it. A larger reply is refused, never cut short.
'''

[[limit]]
id = "MAX_ADMIN_REPLY_BYTES"
kconfig = "WZ_LIMIT_MAX_ADMIN_REPLY_BYTES"
default = 1024
help = '''
The largest admin space reply, in bytes. A larger one is refused, counted,
and answered to the asker as an error, never cut short. It cannot exceed
the largest reply payload (WZ_LIMIT_MAX_REPLY_PAYLOAD_BYTES).
'''

[[limit]]
id = "MAX_ADMIN_LOCATORS"
kconfig = "WZ_LIMIT_MAX_ADMIN_LOCATORS"
default = 4
help = '''
The listening locators a node without an allocator reports in its admin
space. One more is refused when the node starts, never dropped.
'''

[[limit]]
id = "MAX_ADMIN_SESSION_LINKS"
kconfig = "WZ_LIMIT_MAX_ADMIN_SESSION_LINKS"
default = 2
help = '''
The links one session's row lists in the admin space. A unicast session
has one; a row with more is refused and counted, not listed in part.
'''

[[limit]]
id = "MAX_MULTICAST_REPLIES"
kconfig = "WZ_LIMIT_MAX_MULTICAST_REPLIES"
default = 8
help = '''
The replies a node without an allocator holds for a multicast group before
it sends them. One more is dropped and counted: a group is best effort, and
an asker whose reply was dropped asks again.
'''

[[limit]]
id = "MAX_TASKS"
kconfig = "WZ_LIMIT_MAX_TASKS"
default = 8
help = '''
The most tasks the runtime of a fixed-memory image may hold: a ceiling on
the task table the image declares, which the image is checked against when
it compiles.
'''

[[limit]]
id = "MAX_TIMERS"
kconfig = "WZ_LIMIT_MAX_TIMERS"
default = 16
help = '''
The most timers the runtime of a fixed-memory image may hold: a ceiling on
the timer table the image declares, checked as the task ceiling is.
'''

[[limit]]
id = "MAX_LOCATOR_LEN"
kconfig = "WZ_LIMIT_MAX_LOCATOR_LEN"
default = 64
help = '''
The longest locator, in bytes, a node stores: one it is told to connect
to, or one it listens on (for example udp/192.168.1.10:7447). A longer one
is skipped, never cut short. The default fits an IPv6 locator with its
scheme and port.
'''

[[limit]]
id = "MAX_STATIC_CONNECT"
kconfig = "WZ_LIMIT_MAX_STATIC_CONNECT"
default = 8
help = '''
The locators a node is told to connect to. A list longer than this stops
at the limit; a fixed deployment names a few peers.
'''

[[image]]
id = "zephyr-admin-node"
dir = "deploy/zephyr-admin-node"

[[axis]]
id = "net-backend"
image = "zephyr-admin-node"
kconfig = "WZ_NET_BACKEND"
prompt = "Network stack the admin node runs over"
default = "zephyr-sockets"
help = '''
The node is the same on every board; what differs is the stack under it,
which the board's Ethernet driver decides.
'''

[[axis_option]]
id = "zephyr-sockets"
axis = "net-backend"
kconfig = "WZ_NET_BACKEND_ZEPHYR_SOCKETS"
prompt = "Zephyr's own network stack and BSD sockets"
help = '''
For a board whose Ethernet, Wi-Fi or modem Zephyr drives. The interface, its
address (DHCP or Kconfig) and its link-layer identity are Zephyr's.
'''

[[axis_option]]
id = "lwip-mac"
axis = "net-backend"
kconfig = "WZ_NET_BACKEND_LWIP_MAC"
prompt = "lwIP over an Ethernet MAC the wz crates drive"
help = '''
For a board whose Ethernet controller Zephyr has no driver for. Zephyr is the
kernel only (threads, clock, heap, console): the network is lwIP, polled from
the node's loop, over a wz `EthernetMac` crate for the chip. The interface
address and the MAC address are the board's Kconfig, since no Zephyr
interface exists to ask.
'''

[[axis]]
id = "role"
image = "zephyr-admin-node"
kconfig = "WZ_NODE_ROLE"
prompt = "What the node is"
default = "admin"
help = '''
The admin node is the node a zenoh host reconfigures at runtime. The client node is a
client of a router that answers queries and nothing else: it is what zenoh-pico is as a
client with a queryable, and what a comparison with it is made against.
'''

[[axis_option]]
id = "admin"
axis = "role"
kconfig = "WZ_NODE_ADMIN"
prompt = "Admin node: listens, hosts upstream's admin space, dials what it is told to"

[[axis_option]]
id = "client"
axis = "role"
kconfig = "WZ_NODE_CLIENT"
prompt = "Client node: dials a router and answers queries"
requires = "WZ_NET_BACKEND_ZEPHYR_SOCKETS"
help = '''
No listener, no admin space, no config write, no accepted session. The router it dials
is WZ_CLIENT_ENDPOINT; the queries it answers are two documents under a fixed key, the
same two zenoh-pico's comparison image (deploy/zephyr-pico-compare) answers.
'''

[[axis]]
id = "storage"
image = "zephyr-admin-node"
kconfig = "WZ_NODE_STORAGE"
prompt = "Where the node's tables live"
default = "heap"
help = '''
The memory profile is the node's and not a network backend's: whether the Rust image has an
allocator is a setting made beside the role and the stack, and what it is available to is
what has the slot profile's pieces (the stack's driver and how it opens a socket).
'''

[[axis_option]]
id = "heap"
axis = "storage"
kconfig = "WZ_STORAGE_HEAP"
prompt = "The heap profile: the growable node, over an allocator in the Rust image"

[[axis_option]]
id = "fixed"
axis = "storage"
kconfig = "WZ_FIXED_MEMORY"
prompt = "Build the node on the fixed-memory profile (no allocator in the Rust image)"
requires = "(WZ_NET_BACKEND_LWIP_MAC && WZ_MAC_CYT4BF) || (WZ_NET_BACKEND_ZEPHYR_SOCKETS && WZ_NODE_CLIENT)"
help = '''
Every table the node holds (sessions, sockets, the observer, the interfaces) is a
static the image declares, the session tier is the slot profile's, and the Rust
staticlib is built with its default features off, so it links no allocator. The
session host and the dialler are the ones every stack shares
(wz_session_mcu::slot_host); a stack supplies its driver and how it opens a socket.

Two nodes have the profile. The admin node over lwIP is fixed_node.rs: its listener
reads only the datagrams of the peer each session was accepted from and drops and
counts the rest, where the growable node's one accepting session takes the source of
every datagram it reads as its peer. The client node over Zephyr's sockets is
fixed_client.rs. Not the admin node over Zephyr's sockets: that node accepts, and the
socket stack has no listener of the slot profile yet.

This kernel's own heap is a separate matter: what the Rust image does not allocate,
Zephyr's network stack and POSIX layer still may, and CONFIG_HEAP_MEM_POOL_SIZE is what
the kernel is given for it.
'''

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_ZEPHYR_SOCKETS"]
features = ["net-zephyr-sockets"]

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_LWIP_MAC"]
features = ["net-lwip-mac"]

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NODE_CLIENT", "WZ_STORAGE_HEAP"]
features = ["client-node"]
defaults = "off"

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NODE_CLIENT", "WZ_FIXED_MEMORY"]
features = ["fixed-client"]
defaults = "off"

[[cargo_rule]]
image = "zephyr-admin-node"
when = ["WZ_NET_BACKEND_LWIP_MAC", "WZ_FIXED_MEMORY"]
features = ["fixed-memory"]
defaults = "off"
