#
# The build configuration of wz, declared ONCE (docs/build-configuration.md, decision C1).
#
# Every switch a build can turn is declared here, and everything else is derived from this file by
# `scripts/lib/wz_config.py`, which `--check`s each derived file against it:
#
#   * `deploy/Kconfig.capabilities`   the capabilities a Zephyr or Linux deployer selects from
#                                     (generated; `--check` fails when it is stale);
#   * `deploy/Kconfig.limits`         the limits an image states for itself (generated);
#   * `crates/wz-session-core/src/caps_generated.rs`
#                                     the value of each limit as the code reads it (generated);
#   * `<image dir>/Kconfig.axes` and `<image dir>/wz_axes.cmake`
#                                     each image's axes as Kconfig choices, and what they build
#                                     its crate with (generated);
#   * the Cargo features               `--features <abi> <.config>` turns a Kconfig result into
#                                     the `cargo build` arguments of an ABI crate;
#   * the three manifests              wz-capi-core, wz-capi-pico and wz-capi-c each spell the
#                                     same capability graph by hand in `[features]`, because Cargo
#                                     cannot include a fragment; `--check` fails when a manifest
#                                     drifts from it.
#
# The file is read by a reader of one small TOML shape (the hosted Python floor has no `tomllib`):
# `key = value` on one line, the value a string, an integer or an array of strings, or a `'''`
# literal string across lines; `[table]` and `[[array of tables]]` headers; `#` comments on lines
# of their own.
#
# ## Capabilities
#
# A capability is a plane a build either has or does not: the doors it exports and the runtime
# behind them. `implies` is a capability that must be on when this one is. `abis` is where the
# capability is exported (core is the model under both ABIs and always has it). `default` is
# whether a build that names nothing has it: on unless declared `default = "off"`, so the drop-in
# exports what the reference build does, and `off` is for a switch the reference library itself
# leaves off. zenoh-pico's own switches for a capability are the `maps` rows to it under the
# upstream switches below, so a deployer who already writes a pico `config.h` can state the same
# intent: the capability is on when one of them is on, or when all are where it says
# `pico_combine = "all"`. `pico_flags_all` is for a capability no row reaches but which pico has
# whenever several switches are all on (the liveliness get, which pico declares inside both the
# liveliness and the query switch).
#
# `upstream_on` and `upstream_off` say what each upstream original's own default build has
# (docs/build-configuration.md, C2 and step 2): the originals are `zenoh`, `zenoh-c` and
# `zenoh-pico`. A capability names `zenoh-pico` when the pico ABI exports it, and `zenoh-c` and
# `zenoh` when the zenoh-c ABI does, in exactly one of the two keys. These are not `default`:
# `default` is the drop-in's own default, which keeps what the reference builds turn on, while
# an original's defaults reach a build only through that original's defconfig. zenoh-pico's
# values are held to its CMakeLists at the pin and zenoh-c's to its default cargo features by
# `upstream_switch_map.py`. A wz-own door (no upstream counterpart) is off in every original.
#
# `base` is what an ABI build needs that is not a capability.
#
# ## Limits
#
# A limit is the capacity of a table every session of an image holds. `default` is the value of a
# build that states nothing; an image states its own through `CONFIG_<kconfig>`, which the Zephyr
# build hands to cargo as the environment variable of the same name without `CONFIG_`
# (deploy/zephyr-common/wz_zephyr_board.cmake). The code reads each limit from the generated
# module, and `crates/wz-session-core/src/caps.rs` binds the name the code uses to it.
#
# ## Images and their axes
#
# An `image` is a Zephyr application whose node is chosen along axes. An `axis` is a Kconfig
# `choice` of that image, with a `default` option; each `axis_option` is one member of it, and its
# `requires` (a Kconfig expression) becomes the member's `depends on`, so a combination the node
# cannot be built as cannot be selected. A `cargo_rule` says what the image's crate is built with
# when every option named in its `when` is selected: the `features` it adds, and `defaults = "off"`
# where the crate's default features (its heap profile) must be off. Generated for each image:
# `<dir>/Kconfig.axes`, which the image's Kconfig sources, and `<dir>/wz_axes.cmake`, which its
# CMake includes and which sets `wz_axes_features` and `wz_axes_no_default_features`. What is
# particular to a board or a driver stays in the image's own Kconfig and CMake.

schema_version = 1
catalog_version = 2

[base]
core = ["rx-busy-poll"]
pico = ["serial-drive-own-thread", "rx-busy-poll"]
c = []

[[capability]]
id = "link-udp"
kconfig = "WZ_CAP_LINK_UDP"
upstream_on = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = []
help = "A udp/ endpoint to dial, and the transport the scouting group rides."

[[capability]]
id = "timestamping"
kconfig = "WZ_CAP_TIMESTAMPING"
upstream_on = ["zenoh", "zenoh-c"]
abis = ["core", "c"]
implies = []
help = "The node clock a role that stamps its messages holds (zenoh's router does by default)."

[[capability]]
id = "scout"
kconfig = "WZ_CAP_SCOUT"
upstream_on = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = ["link-udp"]
help = "z_scout, the hello family, and a client finding its router by scouting."

[[capability]]
id = "peer"
kconfig = "WZ_CAP_PEER"
upstream_on = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = ["scout"]
help = "A listener, a router or a peer: the roles beyond the client. Off, z_open refuses them."

# Open-debt item 913 — a UDP multicast group a peer joins. pico has it where both its transport
# switch and its UDP multicast link switch are on, so the capability names the two. zenoh-c has
# no switch for it: its default build joins a group listed in `listen/endpoints`.
[[capability]]
id = "multicast-transport"
kconfig = "WZ_CAP_MULTICAST_TRANSPORT"
upstream_on = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
pico_combine = "all"
implies = ["link-udp", "peer"]
help = "A UDP multicast group a peer joins: one transport to every member of the group."

# Open-debt item 913 — zenoh-pico's multicast declarations switch (vendor default 0). On a
# group it sends interests (the open-time pull of the members' keyexprs, a write filter's),
# declares keyexprs, and lets a publisher's or querier's write filter hold a write back.
[[capability]]
id = "multicast-declarations"
kconfig = "WZ_CAP_MULTICAST_DECLARATIONS"
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
default = "off"
implies = ["multicast-transport"]
help = "pico's multicast declarations: interests, keyexpr declarations and the write filter on a group."

# Open-debt item 911 — zenoh-pico's raw Ethernet transport (vendor default 0): a multicast session
# over L2 frames, one message per frame, its destination MAC from the endpoint's mapping.
[[capability]]
id = "raweth-transport"
kconfig = "WZ_CAP_RAWETH_TRANSPORT"
upstream_off = ["zenoh-pico"]
abis = ["core", "pico"]
default = "off"
implies = ["multicast-transport"]
help = "pico's raw Ethernet transport: a group over L2 frames on one interface (Linux, CAP_NET_RAW)."

[[capability]]
id = "query"
kconfig = "WZ_CAP_QUERY"
upstream_on = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = []
help = "z_get and the querier: the requesting end of a query."

[[capability]]
id = "queryable"
kconfig = "WZ_CAP_QUERYABLE"
upstream_on = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = []
help = "z_declare_queryable and the replies: the answering end of a query."

[[capability]]
id = "liveliness"
kconfig = "WZ_CAP_LIVELINESS"
upstream_on = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
implies = []
help = "The liveliness token and subscriber."

[[capability]]
id = "liveliness-get"
kconfig = "WZ_CAP_LIVELINESS_GET"
upstream_on = ["zenoh", "zenoh-c", "zenoh-pico"]
abis = ["core", "pico", "c"]
pico_flags_all = ["Z_FEATURE_LIVELINESS", "Z_FEATURE_QUERY"]
