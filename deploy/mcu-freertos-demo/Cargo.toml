#
# mcu-freertos-demo — QEMU mps2-an385 (Cortex-M3) e2e proving the LAYER-2
# FreeRTOS cooperative single-task profile end-to-end: the FreeRTOS scheduler
# boots, ONE task hosts the wz-runtime-coop cooperative executor
# (wz_runtime_freertos::FreertosRuntime = CoopRuntime<FreertosClock>), and that
# task runs the acceptor session e2e over lwIP loopback (R2913; it ran a UDP
# echo before) on the profile's clock, allocator, entropy and epoch seams
# (R2914 added the last). Standalone workspace (not a crates/
# member); build with WZ_FREERTOS_CONFIG=<this dir> + WZ_LWIP_PORT=<cross-test>.
# A second bin, mcu-freertos-two-session (feature `two-session`, Layer Q.frt2),
# runs a client and a group session in the one task on the same board
# (src/board.rs); it builds against the cross-test-mcast port.

# R311y33 — empty [workspace] table marks this as its OWN standalone workspace
# (so cargo does not search upward into crates/) AND makes it discoverable by
# the run-ci Layer 0 fmt-gate auto-discovery, which keys on a `[workspace]`
# table (scripts/run-ci.sh). Without this, the comment above claimed standalone
# but the fmt gate silently skipped this crate (a R311y27 omission).
[workspace]

[package]
name = "mcu-freertos-demo"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
publish = false

[[bin]]
name = "mcu-freertos-demo"
path = "src/main.rs"

# Open-debt item 900 — a client session and a multicast group session on one
# local set in the one FreeRTOS task, with the four fault-isolation scenarios
# (Layer Q.frt2). Behind its own feature so the acceptor image above keeps its
# feature set: features unify across a package's bins only when asked for.
# Built against crates/lwip-sys/port/cross-test-mcast (loopback multicast).
[[bin]]
name = "mcu-freertos-two-session"
path = "src/two_session/main.rs"
required-features = ["two-session"]

[features]
two-session = [
    "wz/session-lwip",
    "wz/transport-multicast",
    "wz/loopif-multicast",
    "wz/codec-push",
    "wz/codec-close",
    "wz/session-unicast-open",
    "wz/session-unicast-accept",
    "wz-session-core/alloc",
    "wz-session-core/no_std",
    "wz-session-core/session-multicast",
    "wz-session-core/session-unicast-open",
    "wz-session-core/session-unicast-accept",
    "wz-session-core/codec-join",
    "wz-session-core/codec-frame",
    "wz-session-core/codec-close",
    "wz-session-core/codec-push",
    "dep:wz-codecs",
]

[dependencies]
# Cortex-M runtime + entry. critical-section-single-core provides the
# critical-section impl wz-runtime-coop::sync + portable-atomic need.
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"] }

# FreeRTOS kernel FFI for the boot path (xTaskCreate / vTaskStartScheduler /
# vTaskDelay). freertos-sys's real C build is enabled by WZ_FREERTOS_CONFIG
# pointing at this crate's FreeRTOSConfig.h.
freertos-sys = { path = "../../crates/freertos-sys" }

# wz facade — runtime-coop pulls CoopRuntime + wz-link-lwip (lwIP UDP);
# platform-freertos (R311y28) pulls the FreeRTOS cooperative single-task
# profile seams (FreertosClock + FreertosAllocator + FreertosRuntime) under
# `wz::runtime_freertos`. The two are orthogonal axes composed here: the
# coop executor + the FreeRTOS clock/allocator. This makes the demo the real
# consumer of the platform-freertos cfg gate (the Q.frt CI lane exercises it).
wz = { path = "../../crates/wz", default-features = false, features = ["runtime-coop", "platform-freertos"] }
# R2913 — the acceptor session e2e this image runs on the FreeRTOS seams (the
# same one the bare-metal Stage 5 deploy runs), which is what compiles the
# session, codec and lwIP transport into a FreeRTOS image at all.
wz-mcu-session-acceptor = { path = "../../crates/wz-mcu-session-acceptor" }
# R2914 — for the `EpochSource` trait `FreertosEpoch` is read through (the
# port's module is unconditional, so no feature is asked of the core).
wz-session-core = { path = "../../crates/wz-session-core", default-features = false }
# The stack-margin rule the bare-metal images are judged by; the two-session
# image applies it to its FreeRTOS task's stack (src/board.rs).
wz-mcu-stack = { path = "../../crates/wz-mcu-stack" }
# The two-session image reads a Put's body variant (`PushOwnedVariant`).
wz-codecs = { path = "../../crates/wz-codecs", default-features = false, optional = true }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
