#
# An overlay for the fixed-memory ADMIN node over Zephyr's sockets and the secure channel
# (fixed_admin.rs) on the T2G kit: decision D14 of docs/session-lifecycle-intent.md, the witness that a
# router's session reaches the verbs of the product image on silicon. It is built after
# overlays/qemu_admin_fixed_tls.conf, which states the channel, the pools and the node's limits and is
# not the QEMU board's alone, and after overlays/t2g_zeth.conf, which gives the node the kit's MAC under
# Zephyr's sockets and the address 192.168.100.10:
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_zeth.conf;overlays/qemu_admin_fixed_tls.conf;overlays/t2g_admin_fixed_tls.conf" \
#                     -DEXTRA_DTC_OVERLAY_FILE="overlays/t2g_zeth.overlay"
#
# The commanders of the verbs (CONFIG_WZ_COMMANDERS_*) are the lane's to state: scripts/kit-lane.sh makes
# the router's key before it builds, and lists the zid that key names for the verbs the run reads.

# A fixed-memory image has no kernel heap: every table, session and text is a static the image declares.
CONFIG_HEAP_MEM_POOL_SIZE=0

# The stack of the node's one thread. The kit's own reading sets it (the stack gate has no row for this
# image yet); until then the build's default is kept.
CONFIG_MAIN_STACK_SIZE=32768
