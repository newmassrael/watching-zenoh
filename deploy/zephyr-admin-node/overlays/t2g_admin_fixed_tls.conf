#
# An overlay for the fixed-memory ADMIN node over Zephyr's sockets and the secure channel
# (fixed_admin.rs) on the T2G kit: decision D14 of docs/session-lifecycle-intent.md, the witness that a
# router's session reaches the verbs of the product image on silicon. It is built after
# overlays/qemu_admin_fixed_tls.conf, which states the channel, the pools and the node's limits and is
# not the QEMU board's alone, and after overlays/t2g_zeth.conf, which gives the node the kit's MAC under
# Zephyr's sockets and the address 192.168.100.10:
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_zeth.conf;overlays/qemu_admin_fixed_tls.conf;overlays/t2g_admin_fixed_tls.conf" \
#                     -DEXTRA_DTC_OVERLAY_FILE="overlays/t2g_zeth.overlay"
#
# The commanders of the verbs (CONFIG_WZ_COMMANDERS_*) are the lane's to state: scripts/kit-lane.sh makes
# the router's key before it builds, and lists the zid that key names for the verbs the run reads.

# A fixed-memory image has no kernel heap: every table, session and text is a static the image declares.
CONFIG_HEAP_MEM_POOL_SIZE=0

# The stack of the node's one thread. Its worst chain of direct calls is 9,588 bytes (the stack gate,
# scripts/lib/stack_frame_gate.py), 3,968 of it the node's start, and it is a path the node takes when
# it accepts or dials. The same chain with the calls through a register followed (the stack bound gate,
# scripts/lib/stack_bound_gate.py, run on this image without a committed bound) reads 10,340 bytes at
# least, through the handshake of the secure channel, and that figure is a floor: the calls of Mbed TLS
# through a function pointer that no rule of deploy/stack_call_contracts.json claims yet are not in it. A
# quarter of the stack free over 10,340 is a stack of 13,787, and 13,824 is that in units of 64 (the
# chain of direct calls is 9,628 at the SCE pin 9619440966, and was 9,588; the floor was 10,316). The chain
# was 35,272 bytes, with a frame of 19,104 for the spawn of a session's pump, until the limits this node
# does not use (the registries of pending queries and snapshots, the remote declarations, the
# subscription interests and the rest the pump's event sink and the session's tables hold inline) were
# stated in overlays/qemu_admin_fixed_tls.conf.
#
# 14,784 bytes now that the stack bound gate holds this image with every call through a register
# claimed (66 of Mbed TLS, Zephyr's TCP and the node's text writers were not, and the 10,416 above was
# the floor of the calls it did follow): the bound reads 11,068 bytes over 61 frames, through the same
# handshake, from the node's start (3,968) to the ECDSA verification of the peer's certificate, the
# random generator it draws from and the hash of the entropy it reseeds with. A quarter of the stack
# free over 11,068 is a stack of 14,757, and 14,784 is that in units of 64. The kit's reading is 7,744
# bytes, which leaves 44 percent of the old 13,888 free and 48 percent of this stack: the
# reading is a path the handshake takes on the kit's certificates, and the bound is every path the
# code allows.
CONFIG_MAIN_STACK_SIZE=14784
