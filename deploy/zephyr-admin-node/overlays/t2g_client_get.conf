#
# An overlay for the T2G kit's fixed-memory CLIENT image (overlays/t2g_client_fixed.conf, which it is
# built after): the client also ASKS. It asks a query of the router's other client, the way
# `deploy/host-slot-node --get` does, and says the round trips on the console. The getter is
# `wz_session_mcu::slot_getter`, the one module the host node runs.
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_zeth.conf;overlays/t2g_client.conf;overlays/t2g_client_fixed.conf;overlays/t2g_client_get.conf" \
#                     -DEXTRA_DTC_OVERLAY_FILE="overlays/t2g_zeth.overlay"

# The stack of the node's one thread. The getter's query path is under the observer's drain: the
# firmware's own reading over 2,050 answered queries is 8,328 bytes with one query in flight
# (2026-10-27; 8,144 on 2026-10-23), which is MORE than the stack gate's worst chain of direct
# calls (7,784): the reply sink is called through a register, which the reader does not follow.
# With four in flight the reading was 8,816 on 2026-10-23 (224 more for each, the same in every
# run) and was not re-measured since; the 184 bytes the one-query reading has gained would put it
# near 9,000, which leaves 27 percent of 12 KB, still over the quarter HW.7 asks free at the peak
# and with less room than the 28 percent it left. A third is free with one query.
#
# The stack is now what the image's bound needs (scripts/lib/stack_bound_gate.py, which follows the
# calls through a register): this image asks one query at a time, its bound is 5,036 bytes, and
# 6,720 is a quarter free in units of 64. A build that asks several at once has a bound of its own
# and the gate asks its overlay for the stack that bound needs.
CONFIG_MAIN_STACK_SIZE=6720

CONFIG_WZ_GET=y
CONFIG_WZ_GET_KEY="demo/bench"
CONFIG_WZ_GET_COUNT=2050
CONFIG_WZ_GET_WARMUP=50
CONFIG_WZ_GET_INFLIGHT=1

# The pending table was 0 rows in the answering client (overlays/t2g_client.conf): a table of no
# rows refuses every query. The in-flight number and one more, the row a late final of the last
# still holds.
CONFIG_WZ_LIMIT_MAX_PENDING_QUERIES=2
