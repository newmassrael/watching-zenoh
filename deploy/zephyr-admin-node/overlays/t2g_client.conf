#
# An overlay for the T2G kit's Zephyr-sockets image (overlays/t2g_zeth.conf, which it is
# built after): the node is the CLIENT node and not the admin node. It dials the router of the
# bench host and answers two queries, as deploy/zephyr-pico-compare's zenoh-pico image does, so
# that the two are the same function in the same configuration: UDP, one session, a client, two
# queryables, no listener, no admin space, no authentication.
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_zeth.conf;overlays/t2g_client.conf" \
#                     -DEXTRA_DTC_OVERLAY_FILE="overlays/t2g_zeth.overlay"
#
# It lives beside `boards/` and not in it for the reason t2g_zeth.conf gives.

CONFIG_WZ_NODE_ADMIN=n
CONFIG_WZ_NODE_CLIENT=y

# The router the bench host runs, on the segment the image's address is pinned to.
CONFIG_WZ_CLIENT_ENDPOINT="udp/192.168.100.1:7447"

# zenoh-pico's image keeps a heap of 128 KB (deploy/zephyr-pico-compare/prj.conf). The node's
# default is 256 KB, sized for the admin node's pools. This starts at pico's figure so that the
# first comparison is of two images configured alike; the least heap the client runs in is a
# measurement of its own, made by lowering this until the session fails, and is not assumed here.
CONFIG_HEAP_MEM_POOL_SIZE=131072
