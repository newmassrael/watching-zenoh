#
# An overlay for the T2G kit's image (boards/kit_t2g_b_h_lite_cyt4bf8cds_m7_0.conf):
# the fixed-memory profile. The node of fixed_node.rs, every table of which is a static
# the image declares, built with the Rust crate's default features off, so the Rust
# image links no allocator; and a listener that reads only the datagrams of the peer
# each session was accepted from, and drops and counts the rest.
#
# It is an overlay and not part of the board's conf because nothing has run on silicon
# with it: the board's own row is HARDWARE for the growable node, and this one stays
# BUILT until a lab records the steps of HARDWARE_VERDICT.md on it. It states no value
# of the lab's, so a lab builds with it as it is, on its own or beside the pools'
# overlays:
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_fixed.conf"
#
# It lives beside `boards/` and not in it: every file in `boards/` is one board's
# conf, and the board table's gate holds each of them to a row.

CONFIG_WZ_FIXED_MEMORY=y

# The stack of the node's one thread. prj.conf's 32 KB was sized for the growable node,
# whose first session left 6.7 KB of it used. The fixed node holds its tables in statics and
# its sessions' work on the stack beneath the loop: the accept path (`run`, the admit, the
# pump's task build) is about 35 KB of frames in the image's own binary, and on the kit the
# node's own stack reading was 37.4 KB after the first accepted session and 42.4 KB after it
# dialled (the onboard run), against which the 32 KB stack's MPU guard fired. HW.7 requires a
# quarter of the stack free at the peak, which needs at least 56.5 KB; 64 KB leaves 35 percent
# free for the paths a run did not take. The frames that make it up are the next thing to
# shrink (the pump's task build is 19 KB, `run` 10 KB).
CONFIG_MAIN_STACK_SIZE=65536
