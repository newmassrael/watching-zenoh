#
# An overlay for the T2G kit's image (boards/kit_t2g_b_h_lite_cyt4bf8cds_m7_0.conf): the
# same MAC crate under ZEPHYR'S network stack and BSD sockets instead of lwIP, through the
# Ethernet driver of deploy/zephyr-eth-wzmac. The node is the same; what differs is the
# stack under it, which is the point: it is the stack zenoh-pico's Zephyr port runs on, so
# a node and a pico application can be measured on one MAC, one driver and one stack.
#
# It is an overlay and not part of the board's conf because nothing has run on silicon
# with it: the board's own row is HARDWARE for the lwIP image, and this one is BUILT until
# a lab records a run. It needs its devicetree overlay beside it:
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_zeth.conf" \
#                     -DEXTRA_DTC_OVERLAY_FILE="overlays/t2g_zeth.overlay"
#
# It lives beside `boards/` and not in it: every file in `boards/` is one board's conf, and
# the board table's gate holds each of them to a row.

# The board's conf chose lwIP over the MAC crate; this is the other backend. The MAC's
# Kconfig symbols are the lwIP backend's, and the driver states its own in the devicetree.
CONFIG_WZ_NET_BACKEND_LWIP_MAC=n
CONFIG_WZ_NET_BACKEND_ZEPHYR_SOCKETS=y
CONFIG_WZ_MAC_CYT4BF=n

# The segment the lwIP image answers on, pinned and not leased, so a bench's expectation of
# the node's address does not depend on a DHCP exchange.
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.100.10"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# This chip has no entropy driver in Zephyr: the devicetree names the TRNG's (wz-trng).
# Never CONFIG_TEST_RANDOM_GENERATOR here.

# Built for speed, as the zenoh-pico image beside it is (deploy/zephyr-pico-compare/prj.conf), so
# that the two are compared in one configuration. Measured on the kit, a GET answered by this node
# takes 0.805 ms with the default size optimization and 0.717 with this; the C library's own
# memcpy ahead of the Rust staticlib takes it to 0.689 (CONFIG_WZ_LIBC_MEMCPY_FIRST says why that
# one is not the default). Rust opt-level 3 on top changed nothing (0.688 vs 0.689) and grew the
# image by a quarter, so the staticlib stays at its own opt-level.
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_WZ_LIBC_MEMCPY_FIRST=y

# The session reads each datagram where the link holds it: a query reaches the queryable as a
# borrowed query, with no owned copy of the frame or the request on the heap.
CONFIG_WZ_RX_IN_PLACE=y

# The driver's receive thread polls the MAC without sleeping: the lowest latency, and a core that
# never idles. A node with something else to do with its CPU leaves the default (1 ms), which a
# frame waits up to in the worst case.
CONFIG_WZ_ZETH_RX_POLL_INTERVAL_US=0
