#
# An overlay for the T2G kit's image (boards/kit_t2g_b_h_lite_cyt4bf8cds_m7_0.conf):
# the SPI probe. At boot the node opens SCB3 as an SPI master on the kit's MikroBUS
# socket, reads the two TC6 identity registers and logs them, then starts the
# network as it always does.
#
# It is an overlay and not part of the board's conf because a kit as shipped has
# nothing in that socket: with nothing plugged in the probe logs that it read
# nothing, which is a true line and an unwanted one on a bench that has no
# expansion board. A lab that has one builds with it:
#   west build ... -- -DEXTRA_CONF_FILE=overlays/t2g_spi_probe.conf
# This is a BUILT row (Layer Qzb builds it); nothing here has run on silicon.
#
# It lives beside `boards/` and not in it: every file in `boards/` is one board's
# conf, and the board table's gate holds each of them to a row.

CONFIG_WZ_T2G_SPI_PROBE=y
