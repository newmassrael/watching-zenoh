#
# WZ-BUILD-VALUES-ONLY
# The board table's gate reads the line above: a row that is HARDWARE, or cites a
# hardware record, may not list this file, and the image built with it says at boot
# that its values are made up (CONFIG_WZ_T1S_BUILD_VALUES_ONLY, set below).
#
# Values that let overlays/t2g_t1s.conf BUILD, for Layer Qzb, which has no lab to state
# them. They are not a board's: nothing here was read off a bench, a schematic or a
# document, and a lab that flashes an image built with them has configured a segment
# with PLCA id 0 and an address of 192.168.101.10 whether it meant to or not. A lab
# gives its own (see the list in overlays/t2g_t1s.conf) and leaves this file out.
#
# Both control lines are stated wired so that the build compiles the code that
# drives and reads them; whether any expansion board wires them is the lab's to say.

CONFIG_WZ_T1S_BUILD_VALUES_ONLY=y
CONFIG_WZ_T1S_IPV4="192.168.101.10"
CONFIG_WZ_T1S_PLCA_NODE_ID=0
CONFIG_WZ_T1S_PLCA_NODE_COUNT=2
CONFIG_WZ_T1S_RESET_LINE=y
CONFIG_WZ_T1S_IRQ_LINE=y
