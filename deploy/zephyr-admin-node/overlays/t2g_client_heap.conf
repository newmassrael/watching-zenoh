# The client with its storage on the kernel heap (CONFIG_WZ_STORAGE_HEAP): the fixed client's session
# code, the slot profile's, with the node's storage block taken once from the kernel heap at start
# and not declared as a static (deploy/zephyr-admin-node/rust, feature `heap-storage`). Chained after
# overlays/t2g_zeth.conf and overlays/t2g_client.conf, which state the board, the limits and the
# planes the two storages share.
#
# The code is the fixed client's, so what the fixed client's overlay states of it is stated here too:
# the stack of the node's one thread is what the same bound needs (the bound of the fixed client,
# 3,356 bytes, a quarter of the stack free is a stack of 4,475, and 4,480 is that in units of 64),
# and the runtime's tables hold the same tasks and timers.
CONFIG_WZ_STORAGE_HEAP=y
CONFIG_MAIN_STACK_SIZE=4480

# The kernel heap pool: the node's storage block (8,384 bytes) and what else the image takes from it
# make the heap peak the compare run reads, 8,412 bytes. The pool keeps a quarter free, the floor
# HW.7 asks of the main stack (`peak * 4 <= pool * 3`, deploy/zephyr-admin-node/HARDWARE_VERDICT.md):
# 8,412 * 4 / 3 = 11,216, and 11,264 is that in units of 1,024. The image ran with a pool of 9,216
# bytes (the least tried: 804 bytes free), so this is a margin and not the least it runs in. Pico's
# image is configured by the same rule (deploy/zephyr-pico-compare/prj.conf).
CONFIG_HEAP_MEM_POOL_SIZE=11264
CONFIG_WZ_LIMIT_MAX_TASKS=2
CONFIG_WZ_LIMIT_MAX_TIMERS=4
