#
# An overlay for the T2G kit's image (boards/kit_t2g_b_h_lite_cyt4bf8cds_m7_0.conf):
# the 10BASE-T1S interface. The node then runs ONE lwIP stack over TWO interfaces, the
# onboard RMII port and a Microchip LAN8650/1 on a 10BASE-T1S expansion board in the
# MikroBUS socket, listens on both and advertises a locator for each.
#
# It is an overlay and not part of the board's conf because a kit as shipped has
# nothing in that socket: an image that needs the chip stops with a FAIL line when
# the socket does not answer as one, which would take the onboard port's node down
# with it on a bench that has no expansion board.
#
# This file states no value of the lab's. What a lab adds (Kconfig symbols, each with
# no default on purpose, so that a build which forgets one fails by name):
#
#   CONFIG_WZ_T1S_IPV4          this interface's address; not on the onboard port's network
#   CONFIG_WZ_T1S_PLCA_NODE_ID  this node's PLCA id (0 coordinator), unique on the segment
#   CONFIG_WZ_T1S_PLCA_NODE_COUNT  the highest id on the segment plus one
#     (or CONFIG_WZ_T1S_PLCA=n for plain CSMA/CD)
#   CONFIG_WZ_T1S_MAC_ADDRESS   only with CONFIG_WZ_MAC_SOURCE_EXPLICIT
#
# and, stating what the expansion board wires to the socket (both off unless stated):
#
#   CONFIG_WZ_T1S_RESET_LINE=y  chip RESET_N to the socket's RST pin
#   CONFIG_WZ_T1S_IRQ_LINE=y    chip IRQ_N to the socket's INT pin
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_t1s.conf;mine.conf"
#
# This is a BUILT row (Layer Qzb builds it, with overlays/t2g_t1s_build_values.conf in
# the lab's place); nothing here has run on silicon.
#
# It lives beside `boards/` and not in it: every file in `boards/` is one board's
# conf, and the board table's gate holds each of them to a row.

CONFIG_WZ_T1S=y
