#
# An overlay for the fixed-memory ADMIN node over Zephyr's sockets (fixed_admin.rs), the QEMU
# mps2/an385 board's: the node takes a session only through the secure channel of decision D9
# (docs/session-lifecycle-intent.md), TLS 1.3 with mutual authentication, through wz-tls-mbedtls over
# Zephyr's TCP, and decides the four lifecycle verbs by the zid the link's key proved (decision D12).
#
#   west build -b mps2/an385 deploy/zephyr-admin-node -- -DEXTRA_CONF_FILE=overlays/qemu_admin_fixed_tls.conf
#
# The role is the peer (the default of the axis) over Zephyr's sockets (the default of the
# network axis); the memory profile and the channel are chosen here. The commanders of each verb
# are CONFIG_WZ_COMMANDERS_OPEN, _CLOSE, _RESET and _STATUS, empty (nobody) until a build states them.

CONFIG_WZ_FIXED_MEMORY=y
CONFIG_WZ_TLS=y

# The stream under the channel.
CONFIG_NET_TCP=y

# The node holds two sessions at most (one a peer opened, one it dialled for an open by zid), a pump
# task for each and one more, and room for two peers held by their zid.
CONFIG_WZ_LIMIT_MAX_TASKS=3
CONFIG_WZ_LIMIT_MAX_TIMERS=4
CONFIG_WZ_LIMIT_MAX_PEER_NODES=2

# A TLS server's first flight is five records (the hello, the change-cipher-spec and the handshake
# messages), and Zephyr's TCP holds every segment it sent as a packet until the peer acknowledges
# it. At the default of 4 TX packets the fifth `send` failed (measured on deploy/zephyr-tls-loopback:
# the server was dropped before its Finished and its peer read an end of stream), so the pools below
# hold a flight and the peer's reply with room to spare. Each connection of a run is a context, and a
# closed one lingers in TIME_WAIT.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Mbed TLS on its PSA Crypto line, as the fit image states it (deploy/zephyr-tls-fit/prj.conf): TLS
# 1.3 only, the ephemeral key exchange, ECDSA over P-256, AES-128-GCM with SHA-256, the certificate
# the device writes over its own key and the peer's it reads.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=n
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_ENABLED=n
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_EPHEMERAL_ENABLED=n
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=n
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
# Defines the X.509 creation core the certificate writer needs and Zephyr's configuration omits
# (crates/wz-tls-mbedtls/config/zephyr, which the image's CMake puts on Mbed TLS's include path).
CONFIG_MBEDTLS_USER_CONFIG_FILE="wz_tls_zephyr_user_config.h"
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y

# The record buffers decided in Round 3495: receive the protocol's maximum, send 1,500 bytes.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=1500

# Every allocation Mbed TLS makes comes from one static arena: one inbound session at its peak (about
# 22 KB on the kit, Round 3495), one dialled for an open by zid, and the identity.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_MEMORY_DEBUG=y
