#
# An overlay for the T2G kit's image (boards/kit_t2g_b_h_lite_cyt4bf8cds_m7_0.conf), beside
# overlays/t2g_fixed.conf: the fixed-memory node with its links on tcp/ over lwIP's streams
# (fixed_tcp.rs) in place of the datagram node (fixed_node.rs). lwIP is built with its TCP sources
# and the lwIP port turns TCP on; the node listens on tcp/<address>:7447 and dials the tcp/
# endpoints it is told to hold.
#
# It is an overlay and not part of the board's conf because nothing has run on silicon with it:
# the row is BUILT until a lab records a session over it. It states no value of the lab's:
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_fixed.conf;overlays/t2g_tcp.conf"
#
# It lives beside `boards/` and not in it: every file in `boards/` is one board's conf, and the
# board table's gate holds each of them to a row.

CONFIG_WZ_LINK_TCP=y
