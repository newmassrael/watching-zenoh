#
# An overlay for the T2G kit's Zephyr-sockets CLIENT image (overlays/t2g_zeth.conf and
# overlays/t2g_client.conf, which it is built after): the same client with every session, table
# and text in statics the image declares, and no heap anywhere. The Rust side has no allocator
# (the no-allocator link gate holds the `zephyr-client-fixed` row to it), and this overlay gives
# the kernel's heap pool none either:
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_zeth.conf;overlays/t2g_client.conf;overlays/t2g_client_fixed.conf" \
#                     -DEXTRA_DTC_OVERLAY_FILE="overlays/t2g_zeth.overlay"
#
# It lives beside `boards/` and not in it for the reason t2g_zeth.conf gives.

CONFIG_WZ_FIXED_MEMORY=y

# No kernel heap. The client's own storage is the Rust image's statics, and Zephyr's network stack
# and sockets take their buffers from pools sized at build time, not from this heap: on the kit,
# 4000 GETs of the two documents were answered with the pool at 0 and a resource report that read
# "heap allocated 0, peak 0" with the 128 KB the heap client's overlay gives. A feature that does
# call `k_malloc` (a shell, a POSIX facility beyond the sockets) needs a pool, and says so in its
# own overlay rather than here.
CONFIG_HEAP_MEM_POOL_SIZE=0

# The stack of the node's one thread. prj.conf's 32 KB was sized for the growable node. The fixed
# client's own reading on the kit, over a dial, a handshake and 4000 answered queries, is 5.8 KB
# (the frames beneath its loop are measured by scripts/lib/stack_frame_gate.py's reader of the
# image's disassembly); HW.7 asks a quarter of the stack free at the peak, which needs 7.7 KB, and
# 9 KB leaves a third free for the paths a run did not take.
#
# The stack is now what the image's bound needs (scripts/lib/stack_bound_gate.py, which follows the
# calls through a register): the bound is 5,972 bytes, a quarter of the stack free is a stack of
# 7,963, and 8,000 is that in units of 64. The gate holds this value to the bound, no more than 512
# above it, so a bound that falls gives the RAM back. The bound was 6,216 bytes while the dial held
# the session's parameters in its own frame (328 bytes, copied into each call they passed through),
# and 6,084 while the connect manager's peer entry was started in a local and moved into the table
# (a second kilobyte on the path the kit's reading is on); the worst path is now the receive's.
CONFIG_MAIN_STACK_SIZE=8000

# The ceilings of the runtime's tables, which only this profile declares (`fixed_client.rs` asserts
# its task and timer tables against them). The limits of what the client DOES are the role's, in
# overlays/t2g_client.conf, and are the same on the heap.
CONFIG_WZ_LIMIT_MAX_TASKS=2
CONFIG_WZ_LIMIT_MAX_TIMERS=4

# The Open body's initial sequence number without zenoh's SHAKE128: a client of one link is what
# zenoh-pico is, and pico draws the number from entropy and derives nothing from the zids, so this
# image has no use for the multilink re-attempt that zenoh's derivation is for. The Keccak
# permutation, 2.2 KB of text, is not linked (docs/text-ownership.md).
CONFIG_WZ_INITIAL_SN_COMPACT=y

# No subscriptions: the client answers queries and declares no subscriber, as the zenoh-pico it is
# compared with has Z_FEATURE_SUBSCRIPTION off (deploy/zephyr-pico-compare/prj.conf). The
# declaration and the registry that keeps the latest sample are not in the image: 2.4 KB of text and
# 1 KB of RAM (docs/text-ownership.md).
CONFIG_WZ_SUBSCRIBE=n
