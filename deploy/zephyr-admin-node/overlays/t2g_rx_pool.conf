#
# An overlay for the T2G kit's image (boards/kit_t2g_b_h_lite_cyt4bf8cds_m7_0.conf):
# the receive pool (ARCHITECTURE section 9.2). The MAC's receive descriptors are
# armed with slots of a pool in the non-cacheable section; a received frame is lent
# to lwIP in the slot the controller wrote it into and the descriptor is armed again
# with another slot; and the session socket keeps a lent datagram as it arrived, so
# the session dispatches it where the controller wrote it. A datagram lwIP
# reassembles from fragments, and a frame past the eight lwIP may hold lent, is
# copied as without it.
#
# It is an overlay and not part of the board's conf because nothing has run on
# silicon with it: the board's own row is HARDWARE for the image without the pool,
# and this one stays BUILT until a lab records HW.31 to HW.35 of
# HARDWARE_VERDICT.md on it. It states no value of the lab's, so a lab builds with
# it as it is, on its own or beside the transmit pool's overlay:
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_rx_pool.conf"
#
# It lives beside `boards/` and not in it: every file in `boards/` is one board's
# conf, and the board table's gate holds each of them to a row.

CONFIG_WZ_CYT4BF_RX_POOL=y
