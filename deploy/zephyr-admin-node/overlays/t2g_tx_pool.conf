#
# An overlay for the T2G kit's image (boards/kit_t2g_b_h_lite_cyt4bf8cds_m7_0.conf):
# the transmit pool (ARCHITECTURE section 9.1). The node encodes each outbound
# datagram into a slot of a pool in the non-cacheable section, lwIP writes the
# headers in front of it in the same slot, and the MAC's transmit descriptor points
# at the slot, so the controller reads the frame where the session wrote it. Frames
# lwIP sends from its own heap (ARP, the copying sends) are copied into the MAC's
# ring as without it.
#
# It is an overlay and not part of the board's conf because nothing has run on
# silicon with it: the board's own row is HARDWARE for the image without the pool,
# and this one stays BUILT until a lab records HW.26 to HW.30 of
# HARDWARE_VERDICT.md on it. It states no value of the lab's, so a lab builds with
# it as it is:
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_tx_pool.conf"
#
# It lives beside `boards/` and not in it: every file in `boards/` is one board's
# conf, and the board table's gate holds each of them to a row.

CONFIG_WZ_CYT4BF_TX_POOL=y
