#
# An overlay for the T2G kit's fixed-memory CLIENT image (overlays/t2g_client_fixed.conf, which it is
# built after): the session sends the messages of one send window as one datagram, so a reply and
# the final that ends its query leave together and the router reads one datagram where it read two.
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_zeth.conf;overlays/t2g_client.conf;overlays/t2g_client_fixed.conf;overlays/t2g_client_batching.conf" \
#                     -DEXTRA_DTC_OVERLAY_FILE="overlays/t2g_zeth.overlay"
#
# What it costs, measured on the image of 2026-10-23: about 8.2 KB of flash (the batch writer and its
# flush path are code the image did not carry), and 300 bytes more in the worst chain of direct calls
# on the main stack (7,140 bytes against 6,840), which is what the stack below is raised for.

CONFIG_WZ_TX_BATCHING=y

# The stack of the node's one thread. The fixed client's 9 KB leaves a third free over a chain of
# 6.8 KB; the batching path makes the chain 7.1 KB, which would leave 22 percent, short of the quarter
# HW.7 asks free at the peak. 10 KB leaves 30 percent. (The RAM is the kit's, which has it.)
#
# The stack is now what the image's bound needs (scripts/lib/stack_bound_gate.py, which follows the
# calls through a register): the bound is 3,352 bytes, the same as the fixed client's (it was 136
# over while the batch writer was under a path that reads a Push, which this client does not), and
# 4,480 is a quarter free in units of 64.
#
# 5,056 bytes with the SCE engine's Appendix D linked once for the program (see the fixed client's
# overlay): the bound is 3,764 bytes, the same as the fixed client's.
#
# 4,864 bytes at SCE pin f167223931 (see the fixed client's overlay): the bound is 3,604 bytes, the
# same as the fixed client's.
#
# 4,800 bytes at SCE pin 6ba84c3f37 (see the fixed client's overlay): the bound is 3,588 bytes, the
# same as the fixed client's.
#
# 4,672 bytes once the contract stopped counting the edge from the entry walk to the hooks (see the
# fixed client's overlay): the bound is 3,476 bytes, the same as the fixed client's.
CONFIG_MAIN_STACK_SIZE=4672
