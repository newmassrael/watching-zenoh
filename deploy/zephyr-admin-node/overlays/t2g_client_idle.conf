#
# An overlay for the T2G kit's fixed-memory CLIENT image (overlays/t2g_client_fixed.conf, which it is
# built after): the node's link sleeps in the kernel until a datagram arrives or the session has
# something due, instead of waking every millisecond to look at its timers.
#
#   west build ... -- -DEXTRA_CONF_FILE="overlays/t2g_zeth.conf;overlays/t2g_client.conf;overlays/t2g_client_fixed.conf;overlays/t2g_client_idle.conf" \
#                     -DEXTRA_DTC_OVERLAY_FILE="overlays/t2g_zeth.overlay"
#
# Measured on the kit, 2026-10-23: the node's loop goes round 909 times a second with its session
# idle and about 4 with this overlay, with the session held 60 s at a 10 s lease and none lost. It
# costs 28 bytes of flash. The figure is the loop's own count, not a measure of the board's current.
#
# It is for an image that waits on ONE socket and nothing else: the node holds one session, and a
# link that blocks until the session's next deadline leaves another session's socket unread. A
# value of 0 (the default, without this overlay) keeps the tick.

# The most the link sleeps when its session has nothing due sooner, in milliseconds. The socket's
# receive timeout is armed at the largest power of two not above the time to the next deadline
# (the handshake, the lease, the keep-alive, the runtime's next timer, and what the application
# layer states), and no more than this.
CONFIG_WZ_IDLE_WAIT_MS=1000
