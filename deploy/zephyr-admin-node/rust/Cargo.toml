#
# zephyr-admin-node/rust — the wz Rust STATICLIB of the Zephyr admin-node
# firmware, linked into the Zephyr image by the parent CMakeLists.txt (Path B:
# Zephyr is the kernel; ONE Zephyr thread hosts the wz cooperative executor).
# Cargo only emits `libwz_zephyr_admin_node.a` with the kernel symbols
# undefined; west/cmake compiles the kernel and does the final image link.
#
# What it is: a wz node a zenoh host reconfigures at runtime. It listens for a
# session, answers upstream's admin GET under its own zid, and applies a write
# on `connect/endpoints` by dialling what it names. The same node the QEMU
# lwIP firmware (deploy/mcu-admin-node) is, over a network stack the BOARD
# chooses; the node (`wz-session-mcu`) is the same crate in both.
#
# Standalone workspace (the empty `[workspace]` table) so cargo does not pull it
# into crates/Cargo.toml's member build, where a thumb target is not the host.

[workspace]

[package]
name = "wz-zephyr-admin-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-watching-zenoh-NonCommercial-1.0 OR LicenseRef-watching-zenoh-Commercial"
authors = ["newmassrael"]
publish = false
description = "wz Rust staticlib for the Zephyr admin-node firmware: a node a zenoh host reconfigures through its admin space, over the board's network stack."

[lib]
name = "wz_zephyr_admin_node"
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
default = ["heap"]
# S9e -- the HEAP PROFILE of this image, which is what the CMake build has always made: the
# growable node (`wz-session-mcu`'s `AdminNode` over `Rc` handles and `Vec`s), the heap
# runtime and session forms, the Zephyr sockets' stack, and the kernel-heap allocator the
# image declares (`zephyr_image!`). Every feature that links the `alloc` crate of a
# dependency is named here and nowhere else, so a build of the fixed-memory profile, which
# turns the defaults off, names none of them.
heap = [
    "heap-base",
    "admin-node",
]
# What the growable profile is, whichever node runs on it: the heap runtime and session forms,
# the Zephyr profile's seams, and the kernel-heap allocator the image declares.
heap-base = [
    "wz/runtime-coop",
    "wz/platform-zephyr",
    "wz-session-core/alloc",
    "wz-session-mcu/alloc",
    # The lwIP session crate's heap forms, when the lwIP backend is on (`net-lwip-mac`
    # names the crate; a weak forward leaves it out of a build of the sockets backend).
    "wz-session-lwip?/alloc",
]
# The ADMIN NODE: a node a zenoh host reconfigures at runtime. It listens, hosts upstream's
# admin space, applies a config write that names an endpoint to dial, and holds `AdminNode`'s
# whole accept path. `heap` has always been this; it is a feature of its own so that the other
# node can leave it out.
admin-node = [
    "wz/adminspace-core",
    "wz/adminspace-write",
    "wz-session-mcu/adminspace-core",
    "wz-session-mcu/adminspace-write",
]
# The CLIENT NODE: a client of a router that answers queries, with no listener, no admin space and
# no config write (`wz-session-mcu`'s `ClientNode`). The router it dials is `CONFIG_WZ_CLIENT_
# ENDPOINT`. It is what zenoh-pico is when `z_open` is given mode `client` and a queryable is
# declared, so it is the wz side of a comparison of the two on one board. Built with the defaults
# off (`CONFIG_WZ_ROLE_CLIENT`).
# Its tables are the fixed backing (`bounded-heapless`, a selector for a final binary): every limit
# of `caps` a refusal, and the replies staged as rows of an arena and written from their parts, so a
# reply builds no owned record. Its sessions encode each frame into the buffer their link lends
# (`transport-tx-lend`; the link allocates it once). What remains of the heap is the node's own: the
# sessions, the sockets and the sinks it registers.
client-node = [
    "heap-base",
    "wz-session-mcu/client-node",
    "wz-session-core/bounded-heapless",
    "wz-session-core/transport-tx-lend",
]
# The network stack the board's Kconfig chose (`CONFIG_WZ_NET_BACKEND_*`);
# deploy/zephyr-admin-node/CMakeLists.txt turns exactly one on.
net-zephyr-sockets = []
# The session reads each datagram where the link holds it and dispatches its records one at a
# time (`wz-runtime-coop`'s `rx-in-place`): a Request is lent to the queryable registry as a
# borrowed query and nothing of it is built on the heap. The Zephyr sockets link already lends
# its receive buffer (`ZephyrUdpDriver::recv_with`) and the observer already takes the lent
# record, so the only thing missing was this selection (`CONFIG_WZ_RX_IN_PLACE`). The crate is
# named directly only to turn the selector on; the facade's `runtime-coop` links the same one.
rx-in-place = ["dep:wz-runtime-coop", "wz-runtime-coop/rx-in-place"]
# lwIP polled from the node's loop, over a wz Ethernet MAC crate. The facade's
# `session-lwip-fixed` brings lwIP's links and the real lwIP build, which needs
# WZ_LWIP_PORT in the build's environment (the CMake sets it); the heap profile adds
# the session crate's heap forms (`heap`, through the weak forward above).
#
# It also lends: the lwIP UDP driver hands the session the datagram payload and
# the MAC sends the pbuf chain in place (ARCHITECTURE section 9.1), so the
# session is built to try a lend (`wz/transport-tx-lend`).
net-lwip-mac = ["wz/session-lwip-fixed", "wz/transport-tx-lend", "dep:wz-session-lwip"]
# The MAC (`CONFIG_WZ_MAC_*`): the Infineon CYT4BF family's ETH0.
mac-cyt4bf = ["dep:wz-eth-mac-cyt4bf"]
# The same MAC under Zephyr's own network stack: the C ABI of the Zephyr Ethernet driver
# (`deploy/zephyr-eth-wzmac`) over the MAC, in place of lwIP (`CONFIG_WZ_ZETH`, which
# deploy/zephyr-admin-node/CMakeLists.txt turns on beside `net-zephyr-sockets`).
zeth-driver = ["mac-cyt4bf"]
# The node's datagrams are encoded into slots of a transmit pool placed in the
# non-cacheable section, and the MAC reads each frame out of its slot in place
# (`CONFIG_WZ_CYT4BF_TX_POOL`, ARCHITECTURE section 9.1). The lwIP link crate is
# named directly only to turn its `tx-pool` feature on; the facade's
# `session-lwip` already links it.
tx-pool = ["mac-cyt4bf", "dep:wz-link-lwip", "wz-link-lwip/tx-pool"]
# The MAC's receive descriptors are armed with slots of a receive pool placed in
# the non-cacheable section, a received frame is lent to lwIP in its slot, and the
# session loop dispatches a lent datagram where the controller wrote it
# (`CONFIG_WZ_CYT4BF_RX_POOL`, ARCHITECTURE section 9.2): the pool is the lwIP link
# crate's `mac-rx-pool`, and the in-place receive is the lwIP session crate's
# `rx-in-place`, which also has its socket hold lent frames. Both crates are named
# directly only to turn those features on; the facade's `session-lwip` links them.
rx-pool = [
    "mac-cyt4bf",
    "dep:wz-link-lwip",
    "wz-link-lwip/mac-rx-pool",
    "dep:wz-session-lwip",
    "wz-session-lwip/rx-in-place",
]
# Read the TC6 identity registers over the SCB master on the kit's MikroBUS socket
# at boot and log them (`CONFIG_WZ_T2G_SPI_PROBE`): what a lab runs to learn which
# chip an expansion board carries, and the first evidence an SPI master would give.
spi-probe = ["dep:wz-oa-tc6", "dep:wz-spi-scb"]
# A 10BASE-T1S LAN8650/1 on that socket as the lwIP stack's second interface
# (`CONFIG_WZ_T1S`): the chip's bring-up over the same SCB master. Not together with
# the probe, which opens the same block.
t1s-lan865x = ["dep:wz-eth-lan865x", "dep:wz-spi-scb"]
# S9c -- the FIXED-MEMORY node: the lwIP backend's node over the slot profile's pieces
# (`fixed_node.rs`), its stack in the static storage of `net_lwip`'s fixed form and its
# console lines formatted into a fixed buffer, in place of `Rc`, `Vec`, `Box<dyn Port>`
# and `String`. It replaces the growable node (`wz-session-mcu`'s `AdminNode`, which the
# `session-slot` profile does not have): a build has one of them. The lwIP backend's
# only (the slot profile's session host owns the tables of one stack, and Zephyr's
# sockets have none), so it needs `net-lwip-mac` and its MAC.
#
# S9e -- built with `--no-default-features --features net-lwip-mac,mac-cyt4bf,fixed-memory`
# it has NO allocator: the image declares none (`zephyr_image_no_heap!`), `wz-runtime-zephyr`
# is built without its `alloc`, the MAC drivers' bring-up lines are printed into the fixed
# console buffer (`glue::log_args`), and the session tier is the slot profile's, so no crate
# of the graph names `alloc` (the no-allocator link gate, S8). With `heap` as well it is the
# census-only build, which has an allocator and so links. The crates named here are named
# only to turn their selectors on (the facade forwards none of them), and are the same
# instances it pulls.
fixed-memory = [
    "net-lwip-mac",
    "dep:wz-link-lwip",
    "dep:wz-session-lwip",
    "dep:wz-runtime-coop",
    "dep:wz-runtime-zephyr",
    "wz/platform-zephyr-fixed",
    "wz/adminspace-write",
    "wz-session-mcu/adminspace-write",
    "wz/adminspace-fixed",
    "wz-runtime-zephyr/session-slot",
    "wz-link-lwip/static-link-storage",
    "wz-session-lwip/session-slot",
    "wz-session-lwip/static-link-storage",
    "wz-session-lwip/session-unicast-accept",
    "wz-runtime-coop/session-slot",
    "wz-session-mcu/session-slot",
    "wz-session-mcu/adminspace-fixed",
    "wz-session-core/session-slot",
]
# The FIXED-MEMORY CLIENT: the client node (`CONFIG_WZ_ROLE_CLIENT`) over Zephyr's sockets on the slot
# profile (`fixed_client.rs`), the memory profile `CONFIG_WZ_FIXED_MEMORY` selects for it. The same
# client as `client-node` with its sessions, tables and texts in statics the image declares: the
# session host and the dialler every stack shares (`wz-session-mcu`'s `slot_host`, `slot_dial`,
# `slot_client`) over `wz_runtime_zephyr::net::ZephyrStack`, a driver whose receive buffer is an
# array in the session's slot. Built with the defaults off it has NO allocator: the image
# declares none (`zephyr_image_no_heap!`), `wz-runtime-zephyr` is built without its `alloc`, and
# no crate of the graph names `alloc` (the no-allocator link gate). The crates named here are
# named only to turn their selectors on, and are the same instances the facade pulls.
fixed-client = [
    "net-zephyr-sockets",
    "dep:wz-runtime-coop",
    "dep:wz-runtime-zephyr",
    "wz/platform-zephyr-fixed",
    "wz/runtime-coop-core",
    "wz-runtime-zephyr/session-slot",
    "wz-runtime-coop/session-slot",
    "wz-session-mcu/client-slot",
    "wz-session-core/session-slot",
]
# The fixed client ASKS (`CONFIG_WZ_GET`): the getter of `wz_session_mcu::slot_getter`, which
# `deploy/host-slot-node` runs too, asks the query the build states (`CONFIG_WZ_GET_KEY`,
# `_COUNT`, ...) over the session and says the round trips on the console. Off, the client only
# answers, as before. The queries are asked in the session's event, with no mailbox.
get = ["fixed-client", "wz-session-mcu/query-get"]
# The messages of one send window leave as one datagram (`CONFIG_WZ_TX_BATCHING`): a reply and the
# final that ends its query are one frame. Off, every message is a datagram of its own.
batching = [
    "wz-runtime-coop?/transport-batching",
    "wz-session-core/transport-batching",
]
# The measurement of one typed session slot (`scripts/lib/session_slot_bytes.py`): with
# it the fixed-memory image declares `WZ_SESSION_SLOT_BYTES`, a symbol whose SIZE is the
# slot's size. Off by default, because the array is that size again in RAM.
slot-bytes-probe = []

[dependencies]
# critical-section IMPL provider: the staticlib root defines it over Zephyr's
# irq_lock (`wz_runtime_zephyr::zephyr_image!`), so the key is the kernel's
# `unsigned int`.
critical-section = { version = "1", features = ["restore-state-u32"] }
# AtomicU64 is not native on thumbv7m: the coop timer queue and the clock route
# it through the fallback + critical-section, matching wz-runtime-coop.
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"] }

# The composable-framework route every deploy takes: the facade's features unify
# onto the one wz-session-core the session shell is built against. The runtime
# (`runtime-coop`, the executor) and the platform (`platform-zephyr`, the Zephyr profile
# seams: clock, allocator, sockets, links, glue) are the profile's to name: `heap` names
# them with the heap, `fixed-memory` without it. keepalive and close keep the zenoh
# host's lease and teardown honest.
wz = { path = "../../../crates/wz", default-features = false, features = [
    "codec-frame",
    "codec-keep-alive",
    "codec-close",
    "transport-keepalive",
] }
# The session shell: application layer, admin node, connection manager, dialer,
# generic over the stack's `SessionLinks`. Names no link crate.
wz-session-mcu = { path = "../../../crates/wz-session-mcu", default-features = false, features = [
    "transport-keepalive",
] }
# The chip's MAC driver, a crate of its own that depends on the trait tier alone:
# only the `mac-*` feature the board selects pulls one in.
wz-eth-mac-cyt4bf = { path = "../../../crates/wz-eth-mac-cyt4bf", optional = true }
# The transmit pool (`tx-pool`): the same crate the facade's `session-lwip` links,
# with the pool turned on.
wz-link-lwip = { path = "../../../crates/wz-link-lwip", optional = true }
# The in-place receive (`rx-pool`): the same crate the facade's `session-lwip`
# links, with `rx-in-place` turned on, and no default features, as the facade has.
wz-session-lwip = { path = "../../../crates/wz-session-lwip", optional = true, default-features = false }
wz-runtime-coop = { path = "../../../crates/wz-runtime-coop", optional = true, default-features = false }
wz-runtime-zephyr = { path = "../../../crates/wz-runtime-zephyr", optional = true, default-features = false }
# The SPI probe's two halves: the TC6 protocol, and the rules of the SCB master it
# runs over. Only `CONFIG_WZ_T2G_SPI_PROBE` pulls the first in; either it or
# `CONFIG_WZ_T1S` pulls in the second.
wz-oa-tc6 = { path = "../../../crates/wz-oa-tc6", optional = true }
wz-spi-scb = { path = "../../../crates/wz-spi-scb", optional = true }
# The 10BASE-T1S chip's bring-up (the TC6 protocol it sits on comes with it). Only
# `CONFIG_WZ_T1S` pulls it in.
wz-eth-lan865x = { path = "../../../crates/wz-eth-lan865x", optional = true }
# The types the facade does not re-export (SessionInitParams, SigningKey,
# SessionTimeouts, the entropy trait); features arrive through the facade.
wz-session-core = { path = "../../../crates/wz-session-core", default-features = false, features = [
    "session-unicast",
    "no_std",
] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
