# SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael
#
# zephyr-admin-node/rust — the wz Rust STATICLIB of the Zephyr admin-node
# firmware, linked into the Zephyr image by the parent CMakeLists.txt (Path B:
# Zephyr is the kernel; ONE Zephyr thread hosts the wz cooperative executor).
# Cargo only emits `libwz_zephyr_admin_node.a` with the kernel symbols
# undefined; west/cmake compiles the kernel and does the final image link.
#
# What it is: a wz node a zenoh host reconfigures at runtime. It listens for a
# session, answers upstream's admin GET under its own zid, and applies a write
# on `connect/endpoints` by dialling what it names. The same node the QEMU
# lwIP firmware (deploy/mcu-admin-node) is, over a network stack the BOARD
# chooses; the node (`wz-session-mcu`) is the same crate in both.
#
# Standalone workspace (the empty `[workspace]` table) so cargo does not pull it
# into crates/Cargo.toml's member build, where a thumb target is not the host.

[workspace]

[package]
name = "wz-zephyr-admin-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
authors = ["newmassrael"]
publish = false
description = "wz Rust staticlib for the Zephyr admin-node firmware: a node a zenoh host reconfigures through its admin space, over the board's network stack."

[lib]
name = "wz_zephyr_admin_node"
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
# The network stack the board's Kconfig chose (`CONFIG_WZ_NET_BACKEND_*`);
# deploy/zephyr-admin-node/CMakeLists.txt turns exactly one on.
net-zephyr-sockets = []
# lwIP polled from the node's loop, over a wz Ethernet MAC crate. The facade's
# `session-lwip` brings lwIP's links and the real lwIP build, which needs
# WZ_LWIP_PORT in the build's environment (the CMake sets it).
#
# It also lends: the lwIP UDP driver hands the session the datagram payload and
# the MAC sends the pbuf chain in place (ARCHITECTURE section 9.1), so the
# session is built to try a lend (`wz/transport-tx-lend`).
net-lwip-mac = ["wz/session-lwip", "wz/transport-tx-lend"]
# The MAC (`CONFIG_WZ_MAC_*`): the Infineon CYT4BF family's ETH0.
mac-cyt4bf = ["dep:wz-eth-mac-cyt4bf"]
# The node's datagrams are encoded into slots of a transmit pool placed in the
# non-cacheable section, and the MAC reads each frame out of its slot in place
# (`CONFIG_WZ_CYT4BF_TX_POOL`, ARCHITECTURE section 9.1). The lwIP link crate is
# named directly only to turn its `tx-pool` feature on; the facade's
# `session-lwip` already links it.
tx-pool = ["mac-cyt4bf", "dep:wz-link-lwip", "wz-link-lwip/tx-pool"]
# The MAC's receive descriptors are armed with slots of a receive pool placed in
# the non-cacheable section, a received frame is lent to lwIP in its slot, and the
# session loop dispatches a lent datagram where the controller wrote it
# (`CONFIG_WZ_CYT4BF_RX_POOL`, ARCHITECTURE section 9.2): the pool is the lwIP link
# crate's `mac-rx-pool`, and the in-place receive is the lwIP session crate's
# `rx-in-place`, which also has its socket hold lent frames. Both crates are named
# directly only to turn those features on; the facade's `session-lwip` links them.
rx-pool = [
    "mac-cyt4bf",
    "dep:wz-link-lwip",
    "wz-link-lwip/mac-rx-pool",
    "dep:wz-session-lwip",
    "wz-session-lwip/rx-in-place",
]
# Read the TC6 identity registers over the SCB master on the kit's MikroBUS socket
# at boot and log them (`CONFIG_WZ_T2G_SPI_PROBE`): what a lab runs to learn which
# chip an expansion board carries, and the first evidence an SPI master would give.
spi-probe = ["dep:wz-oa-tc6", "dep:wz-spi-scb"]
# A 10BASE-T1S LAN8650/1 on that socket as the lwIP stack's second interface
# (`CONFIG_WZ_T1S`): the chip's bring-up over the same SCB master. Not together with
# the probe, which opens the same block.
t1s-lan865x = ["dep:wz-eth-lan865x", "dep:wz-spi-scb"]

[dependencies]
# critical-section IMPL provider: the staticlib root defines it over Zephyr's
# irq_lock (`wz_runtime_zephyr::zephyr_image!`), so the key is the kernel's
# `unsigned int`.
critical-section = { version = "1", features = ["restore-state-u32"] }
# AtomicU64 is not native on thumbv7m: the coop timer queue and the clock route
# it through the fallback + critical-section, matching wz-runtime-coop.
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"] }

# The composable-framework route every deploy takes: the facade's features unify
# onto the one wz-session-core the session shell is built against. `runtime-coop`
# is the executor; `platform-zephyr` the Zephyr profile seams (clock, allocator,
# sockets, links, glue). keepalive and close keep the zenoh host's lease and
# teardown honest.
wz = { path = "../../../crates/wz", default-features = false, features = [
    "runtime-coop",
    "platform-zephyr",
    "adminspace-core",
    "adminspace-write",
    "codec-frame",
    "codec-keep-alive",
    "codec-close",
    "transport-keepalive",
] }
# The session shell: application layer, admin node, connection manager, dialer,
# generic over the stack's `SessionLinks`. Names no link crate.
wz-session-mcu = { path = "../../../crates/wz-session-mcu", features = [
    "adminspace-core",
    "adminspace-write",
    "transport-keepalive",
] }
# The chip's MAC driver, a crate of its own that depends on the trait tier alone:
# only the `mac-*` feature the board selects pulls one in.
wz-eth-mac-cyt4bf = { path = "../../../crates/wz-eth-mac-cyt4bf", optional = true }
# The transmit pool (`tx-pool`): the same crate the facade's `session-lwip` links,
# with the pool turned on.
wz-link-lwip = { path = "../../../crates/wz-link-lwip", optional = true }
# The in-place receive (`rx-pool`): the same crate the facade's `session-lwip`
# links, with `rx-in-place` turned on, and no default features, as the facade has.
wz-session-lwip = { path = "../../../crates/wz-session-lwip", optional = true, default-features = false }
# The SPI probe's two halves: the TC6 protocol, and the rules of the SCB master it
# runs over. Only `CONFIG_WZ_T2G_SPI_PROBE` pulls the first in; either it or
# `CONFIG_WZ_T1S` pulls in the second.
wz-oa-tc6 = { path = "../../../crates/wz-oa-tc6", optional = true }
wz-spi-scb = { path = "../../../crates/wz-spi-scb", optional = true }
# The 10BASE-T1S chip's bring-up (the TC6 protocol it sits on comes with it). Only
# `CONFIG_WZ_T1S` pulls it in.
wz-eth-lan865x = { path = "../../../crates/wz-eth-lan865x", optional = true }
# The types the facade does not re-export (SessionInitParams, SigningKey,
# SessionTimeouts, the entropy trait); features arrive through the facade.
wz-session-core = { path = "../../../crates/wz-session-core", default-features = false, features = [
    "alloc",
    "session-unicast",
    "no_std",
] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
