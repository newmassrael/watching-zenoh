#
# zephyr-admin-node Kconfig — what every board needs of Zephyr, whichever network
# stack its Ethernet runs under. What the stack needs is in this directory's
# Kconfig (as defaults of the symbols the Zephyr-sockets backend turns on), and what
# only one board needs (its address, its tick rate, its test entropy generator, its
# MAC) is in boards/<board>.conf. Nothing here is a QEMU constant.

# printk for the boot log and the READY / FAIL lines.
CONFIG_PRINTK=y

# The Zephyr kernel heap that ZephyrAllocator (k_malloc/k_free) bridges Rust's
# #[global_allocator] onto. MUST be > 0 or k_malloc is not compiled in. Backs the
# executor task pool, the sessions' action bundles and the links' receive
# buffers (one batch each).
CONFIG_HEAP_MEM_POOL_SIZE=262144

# The main thread runs the whole node: the wz executor, every session's future
# polled inline, and the codec buffers they nest. Its stack is the node's budget for
# all of that, and it was a guess (the FreeRTOS sibling's 16 KB) until the node on
# QEMU needed 20,012 bytes of it: the stack ran into the idle thread's below it, and
# the machine died later with a register file that named neither. The size is now
# one the node's own measurement (`stack: peak N of M bytes`, below) leaves a
# quarter of free, and Layer Qza refuses it when it does not.
CONFIG_MAIN_STACK_SIZE=32768

# What makes that measurement possible, and what makes an overflow loud. The kernel
# paints a stack when its thread is created and the node reads how much of the paint
# is left (`k_thread_stack_space_get`), which needs the stack's bounds kept too. The
# sentinel is checked at every context switch and turns a stack that has run out
# into a fatal error that says so, where the machine here has no MPU to fault at the
# stack's end.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y

# R2918 — clock_gettime / clock_settime(CLOCK_REALTIME), the board's wall clock
# for the profile's epoch seam (deploy/zephyr-common/wz_board_hooks.c). They are
# POSIX timers, which sit under the POSIX system interfaces.
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_TIMERS=y
