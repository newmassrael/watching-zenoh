#
# KIT_T2G-B-H_LITE (CYT4BF8CDS), Cortex-M7 core 0: the admin node over the chip's
# own Ethernet. Zephyr has no Ethernet driver for this controller (the board has
# no Ethernet node), so Zephyr is the kernel and the network is lwIP over the wz MAC
# crate. This is a BUILT row: nothing here has run on silicon.

# lwIP over wz-eth-mac-cyt4bf, the RMII pins of this kit, the PHY driving REF_CLK.
CONFIG_WZ_NET_BACKEND_LWIP_MAC=y
CONFIG_WZ_MAC_CYT4BF=y
CONFIG_WZ_CYT4BF_PINS_T2G_LITE=y

# The MAC's DMA rings live in the non-cacheable section (the M7 has a data cache the
# controller does not see).
CONFIG_NOCACHE_MEMORY=y

# This chip has no entropy driver in Zephyr: the session's secrets come from the
# CRYPTO block's TRNG through the board hook (selected by CONFIG_WZ_MAC_CYT4BF).
# Never CONFIG_TEST_RANDOM_GENERATOR here: the table gate refuses it on a BUILT row.
