#
# What only the QEMU mps2/an385 board needs. A real board gets none of it.

# 100 Hz: the reference deploy's tick rate. The Rust side reads whatever the board
# has (`wz_runtime_zephyr::tick_hz_from_build!`); this line only keeps the QEMU
# lane's timing where it has been measured.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100

# QEMU's user-mode networking (`-nic user,model=lan9118`) hands the guest
# 10.0.2.15 with the host's side at 10.0.2.2, which is what the lane forwards a
# host UDP port to and where it points the node's dials. Pinned, not leased: the
# lane's expectation of the node's address must not depend on a DHCP exchange.
# (The SMSC911x driver is on by default for this board's devicetree node.)
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"

# QEMU mps2/an385 has NO entropy hardware. ⚠ The test generator is a FIXTURE: its
# numbers are predictable, it exercises the call and does not satisfy the entropy
# contract. Zephyr allows it only for a board whose sole purpose is testing, and
# deploy/zephyr-common/wz_board_hooks.c admits it on a QEMU board alone: a real
# board selects its TRNG driver instead, or does not build.
CONFIG_TEST_RANDOM_GENERATOR=y
