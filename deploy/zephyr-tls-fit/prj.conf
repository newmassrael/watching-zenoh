#
# The secure channel of decision D9 (docs/session-lifecycle-intent.md) at the smallest set that
# speaks it: TLS 1.3 only, an ephemeral (EC)DHE key exchange, ECDSA over P-256 for the
# certificates, AES-128-GCM with SHA-256 for the records. Everything else Mbed TLS can carry is
# off, so the size the build reports is the channel's.

CONFIG_PRINTK=y
# The handshake's deepest frames (the ECDSA and the certificate parse) run on the main thread;
# the image reports how much of it the run used, so this is a ceiling, not the measurement.
CONFIG_MAIN_STACK_SIZE=24576
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# On the PSA line Zephyr's Mbed TLS depends on its PSA Crypto API, provided by Mbed TLS itself.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# TLS 1.3, both roles, the ephemeral key exchange only.
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=n
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_ENABLED=n
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_EPHEMERAL_ENABLED=n
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=n

# The certificate a device writes over its own key, and the peer's it reads.
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
# Defines the X.509 creation core the certificate writer needs and Zephyr's configuration omits.
CONFIG_MBEDTLS_USER_CONFIG_FILE="wz_tls_fit_mbedtls_user_config.h"

# P-256 keys generated in the PSA key store, ECDSA and ECDH over them, the TLS 1.3 key schedule
# (HKDF over HMAC-SHA-256) and the AES-128-GCM record protection.
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_GCM=y

# The random source: Mbed TLS's entropy module over the board's TRNG (the entropy device the
# overlay states), with a DRBG on top. Never a test generator: there is a driver.
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y

# Every allocation Mbed TLS makes comes from one static arena, and the image reports the arena's
# peak. The arena is sized generously here; the peak is the measurement the fixed-memory
# profile's budget will be set from.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_MEMORY_DEBUG=y
