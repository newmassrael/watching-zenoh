#
# host-slot-node -- the kit's fixed-memory client, as a Linux process.
#
# The node of `deploy/zephyr-admin-node/rust/src/fixed_client.rs` (a client of a router that
# answers queries, on the per-session slot profile) with the host's seams under it
# (`wz-runtime-posix`) where the kit has Zephyr's. The session code is the same code; what differs
# is the clock, the entropy, the date, the socket and the entry point.
#
# It is `#![no_std]` and `#![no_main]` and declares NO `#[global_allocator]`, so a reference to the
# `alloc` crate anywhere in its graph is a link error ("no global memory allocator found"). A clean
# link is the whole-program proof that the node allocates nothing, the same proof the kit's image
# and `mcu-noheap-probe` rest on, at a process on the build host.
#
# Standalone `[workspace]` (the rationale of `mcu-noheap-probe`): the slot profile is a SELECTOR
# for a final binary, and cargo would otherwise unify it into the host `crates/` build.

[workspace]

[package]
name = "host-slot-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "LicenseRef-watching-zenoh-NonCommercial-1.0 OR LicenseRef-watching-zenoh-Commercial"
authors = ["newmassrael"]
description = "The fixed-memory client node run as a Linux process: shared MCU session code over the host's sockets, no allocator."

# What both front ends share (src/lib.rs): the link's tuning numbers, the host's console as the
# node's port, the identity a node starts with and the secure channel.
[lib]
name = "host_slot_node_glue"
path = "src/lib.rs"

# The front end that reads its router and documents from the command line.
[[bin]]
name = "host-slot-node"
path = "src/main.rs"

# The front end that has them from a declaration (`deploy/nodes/*.toml`): its constants are the
# file `scripts/lib/wz_node.py --emit` prints, which the build names in `WZ_DECLARED_RS`. Without
# that file there is nothing to build, so the target is only built where the feature is asked for.
[[bin]]
name = "declared-node"
path = "src/bin/declared_node.rs"
required-features = ["declared"]

[features]
default = []
# Build `declared-node`, which includes the generated constants named by `WZ_DECLARED_RS`.
declared = []
# The session coalesces the messages of one send window into one datagram (zenoh-pico's
# `Z_FEATURE_BATCHING`): off, every message is a datagram of its own.
batching = ["wz-runtime-coop/transport-batching", "wz-session-core/transport-batching"]
# The node can ASK: `--get KEY --count N` issues N queries one after another and reports the round
# trips (`src/getter.rs`). Off, the node only answers, as the kit's client does.
get = ["wz-session-mcu/query-get"]
# The node can dial `tls/`: the fixed-memory profile's secure channel (decision D9 of
# docs/session-lifecycle-intent.md), TLS 1.3 with mutual authentication over the pinned Mbed TLS,
# its memory one static arena. The node generates its identity at start, prints its certificate
# (PEM) for the router's operator to pin, and takes the zid its key names. Off, the stack refuses
# `tls/` as unsupported.
tls = ["dep:wz-tls-mbedtls"]

[dependencies]
# The implementation of the `critical_section` the image glue names (`posix_image_no_heap!`). It
# takes no lock: one thread runs the program.
critical-section = "1"

# The composable-framework route every deploy takes: the facade's features unify onto the one
# wz-session-core the session shell is built against. `runtime-coop-core` is the runtime tier
# alone, with no link crate (the host has no lwIP to bundle).
wz = { path = "../../crates/wz", default-features = false, features = [
    "codec-frame",
    "codec-keep-alive",
    "codec-close",
    "transport-keepalive",
    "runtime-coop-core",
] }
# The session shell: application layer, connection manager, dialler, generic over the stack. The
# client on the slot profile (`slot_client`), with no allocator.
wz-session-mcu = { path = "../../crates/wz-session-mcu", default-features = false, features = [
    "transport-keepalive",
    "client-slot",
] }
# The slot profile of the cooperative runtime, named to turn its selector on (the facade links the
# same instance).
wz-runtime-coop = { path = "../../crates/wz-runtime-coop", default-features = false, features = ["session-slot"] }
# The host's seams: clock, entropy, date, UDP socket, image glue. Defaults off, so no heap form of
# the cooperative runtime is named.
wz-runtime-posix = { path = "../../crates/wz-runtime-posix", default-features = false, features = ["session-slot"] }
# The secure channel, on the slot profile, built from the pinned source (`tls`).
wz-tls-mbedtls = { path = "../../crates/wz-tls-mbedtls", default-features = false, features = [
    "session-slot",
    "vendored",
], optional = true }
# The types the facade does not re-export (SessionInitParams, SigningKey, SessionTimeouts, the
# entropy trait).
wz-session-core = { path = "../../crates/wz-session-core", default-features = false, features = [
    "session-unicast",
    "no_std",
    "session-slot",
] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
