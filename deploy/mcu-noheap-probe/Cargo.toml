#
# mcu-noheap-probe — R311hl Track 2 no-alloc gating: runtime proof.
#
# The Track 2 fan-out (R311hb..hk) made every wz-session-core
# application-layer registry's control plane + no-heap fire path
# (`dispatch_borrowed` / `dispatch_declared_borrowed` /
# `dispatch_sample_borrowed`) compile with `--no-default-features`
# (heapless backing), and Layer G proves that *cross-compiles* to the
# M-class catalog. What was missing was a RUNTIME proof on a real
# (QEMU-emulated) MCU that those paths actually execute, and a
# mechanical guarantee that they touch NO heap.
#
# This crate is that proof. It is a Cortex-M binary that:
#
#   - declares NO `#[global_allocator]` (unlike the sibling
#     `mcu-qemu-demo`, which links `embedded-alloc`). On a `#![no_std]`
#     binary without a global allocator, ANY reference to the `alloc`
#     crate from any reachable code path is a hard LINK error
#     ("no global memory allocator found"). So a clean link is a
#     mechanical, whole-program proof that the exercised registry paths
#     are allocation-free — strictly stronger than the per-crate
#     `--no-default-features` lib compile (which only proves the lib
#     does not *name* `alloc`, not that the composed binary links
#     without an allocator).
#   - depends on `wz-session-core` with `default-features = false`
#     (no `alloc` feature => `bounded::BoundedVec` / `BoundedString`
#     use the `heapless` backing), zero codec features (the control
#     plane + no-heap fire need none).
#   - in `main`, instantiates all seven registries with consumer-
#     supplied concrete (non-`Box`) sinks, fires each registry's
#     no-heap entry, and asserts each sink observed its delivery, then
#     exits via semihosting `SYS_EXIT` (PASS=0 / FAIL=1) so the Layer Q
#     lane gates on it exactly like `mcu-qemu-demo`.
#
# Standalone `[workspace]` (same rationale as `mcu-qemu-demo`): keeps
# cargo from pulling a thumbv7m crate into the host `crates/` build.

[workspace]

[package]
name = "mcu-noheap-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "LGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
authors = ["newmassrael"]
description = "R311hl no-heap runtime proof: wz-session-core registries run on QEMU MCU with zero global allocator."

[[bin]]
name = "mcu-noheap-probe"
path = "src/main.rs"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }

# portable-atomic: the concrete counting sinks tally deliveries into
# static `AtomicU32`s; ARMv6-M (Cortex-M0/M0+) has no native CAS, so
# the `fallback` + `critical-section` combo selects the
# critical-section-single-core impl there (mirrors the mcu-qemu-demo
# pattern) and native LDREX/STREX on ARMv7-M+.
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"] }

# The unit under test. `default-features = false` => no `alloc` =>
# heapless bounded backing. `liveliness-token` (R311ho) adds the
# declarer-side `LocalTokenRegistry` no-heap surface; it implies
# `codec-declare` but NOT `alloc`, so the heapless backing holds.
# keyexpr wildcard toggles (R311jf): the probe asserts both wildcard
# kinds, so now that the matchers are real composition toggles it must
# SELECT the capabilities it consumes (off degrades the token to a
# literal chunk and the matching stages fire zero):
#   - `keyexpr-wildcard-double` — registries (`svc/**`, `live/**`,
#     `group1/**`) in the query / liveliness / local-token stages;
#   - `keyexpr-wildcard-single` — the generated switchboard dispatch
#     matches `home/*/temp` (stage 7, mps2-class cores only).
# Cross-workspace path dep; cargo resolves its workspace inheritance
# against `crates/Cargo.toml`.
wz-session-core = { path = "../../crates/wz-session-core", default-features = false, features = ["liveliness-token", "keyexpr-wildcard-single", "keyexpr-wildcard-double"] }

# R311ho — the declarer-side liveliness-token no-heap EMIT proof. The
# registry stages borrowed `DeclResponseItem`s; this probe (acting as the
# MCU `ResponseSink`) encodes each into a stack buffer via SCE's
# `SliceSink`, proving the wire emit links + runs with zero global
# allocator. Needs the borrowed codec types (`DeclToken` / `DeclFinal` /
# `Wireexpr`) from wz-codecs and `SliceSink` from sce-forge-runtime, both
# `default-features = false` (codec-declare's `encode<S: SceSink>` path is
# allocation-free).
wz-codecs = { path = "../../crates/wz-codecs", default-features = false, features = ["codec-declare"] }
sce-forge-runtime = { path = "../../vendor/sce/sce-forge-runtime/rust", default-features = false }

# ⓓ — the generated thermostat machine's `Engine<ThermostatPolicy>` + the
# `ThermostatInject::raise_temp_reading` typed-inject seam. `no_std` selects the
# heapless-backed runtime variant (zero alloc dependency); `default-features =
# false` drops the std-coupled `http-send` default so the no_std variant links.
# The switchboard dispatch the build.rs emits drives this engine with a wire-
# decoded payload, all with no global allocator.
sce-rust-runtime = { path = "../../vendor/sce/sce-rust-runtime", default-features = false, features = ["no_std"] }

# ⓓ build-time codegen: the wz-switchboard.yaml model + the pure generator that
# emits the closed `dispatch_switchboard` over the forge-asts. YAML backend
# (serde_yaml_ng) chosen at this consumer's I/O boundary, mirroring the example.
[build-dependencies]
wz-switchboard-schema = { path = "../../crates/wz-switchboard-schema" }
wz-switchboard-codegen = { path = "../../crates/wz-switchboard-codegen" }
serde_yaml_ng = "0.9"

# The generated codec (`temp_reading_codec.rs`) gates its heap-backed
# `VecSink` / `encode_to_vec` facade on `#[cfg(feature = "alloc")]`. This probe
# deliberately defines NO `alloc` feature (it must never link an allocator), so
# that gate is always false and the facade compiles out — but check-cfg would
# otherwise warn the value is unknown. Declare it as an expected external cfg
# (NOT a real cargo feature, which would be an enableable footgun on a no-alloc
# target) so the no-alloc build stays warning-clean.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("alloc"))'] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
