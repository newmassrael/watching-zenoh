# A node declaration (docs/target-build-contract.md section 5b), checked by scripts/lib/wz_node.py.
#
# A fixed-memory node that commands another (decision D12 of docs/session-lifecycle-intent.md): it
# holds the node `slot-commander` by its zid over the secure channel, which it opens to that node's
# `tls` listener, and asks it for the status of a peer and to close one, keeping each answer. Its
# identity is provisioned (`[identity]`), so its zid is known before it runs and the other node's
# grant names it. On the per-session slot profile (no allocator).
#
# The endpoint is this machine's loopback, because this is the node the interop test builds and
# runs against `slot-commander`
# (crates/wz-integration-tests/tests/wz_declared_commander_zenohd_interop.rs). A zid is named by a
# key and no key is committed, so the test provisions both nodes with keys it makes when it runs,
# writes each identity's files where `[identity]` says, and builds this declaration with `c3`, the
# commanding node's zid, replaced by the zid `wz_node.py --zid-of` prints for that node's
# certificate.

schema = 1

[node]
id = "slot-subject"
help = "A fixed-memory client with a provisioned identity that holds a commanding node by its zid and asks it for a status and a close."
target = "slot"

[[endpoint]]
role = "peer"
zid = "c3"
locator = "tls/127.0.0.1:17477"

# The status of a peer (`d4`, which neither node holds): granted to this node's zid.
[[entity]]
kind = "querier"
key = "@/c3/client/session/status/d4"
period_ms = 500
timeout_ms = 2000
reply_bytes = 256

# A close of the same peer: not granted, so it is refused by name.
[[entity]]
kind = "querier"
key = "@/c3/client/session/close/d4"
period_ms = 500
timeout_ms = 2000
reply_bytes = 256

[identity]
certificate = "/etc/wz/slot-subject.crt"
private_key = "/etc/wz/slot-subject.key"
