#
# zephyr-app Kconfig — the cooperative single-task profile, for every board.
# What only one board needs is in boards/<board>.conf (the QEMU board's tick rate
# and its test entropy generator); nothing here is a QEMU constant.

# printk for the boot log + the ZEPHYR-WZ PASS/FAIL sentinel the CI greps.
CONFIG_PRINTK=y

# The Zephyr kernel heap that ZephyrAllocator (k_malloc/k_free) bridges Rust's
# #[global_allocator] onto. MUST be > 0 or k_malloc is not compiled in (the
# Rust references would dangle at link). Backs the executor task pool and the
# socket link's receive buffer (one UDP datagram's worth, 64 KiB). Small heap =
# 4-byte base alignment, which ZephyrAllocator's HEAP_ALIGN already accounts for.
CONFIG_HEAP_MEM_POOL_SIZE=262144

# The main thread runs the wz executor + its futures, so give it headroom (the
# FreeRTOS sibling's wz task uses a 16 KB stack).
CONFIG_MAIN_STACK_SIZE=16384

# R2916 — the profile's network seam: IPv4 UDP over Zephyr's own stack, reached
# through the POSIX socket layer (the route zenoh-pico's Zephyr port takes), on
# the loopback interface. POSIX_NETWORKING gives socket / bind / sendto /
# recvfrom / getsockname; POSIX_DEVICE_IO gives poll / close; both depend on
# POSIX_SYSTEM_INTERFACES. The board's SLIP-over-tap interface to the host is
# off: this image's traffic is loopback only.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_LOOPBACK=y
CONFIG_NET_SLIP_TAP=n
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_NETWORKING=y

# R2918 — clock_gettime / clock_settime(CLOCK_REALTIME), the board's wall clock
# for the profile's epoch seam (deploy/zephyr-common/wz_board_hooks.c).
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_DEVICE_IO=y
