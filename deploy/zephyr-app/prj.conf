#
# zephyr-app Kconfig — the cooperative single-task profile on qemu_cortex_m3
# (ti_lm3s6965, 64 KB SRAM, so the sizes are deliberately modest).

# printk for the boot log + the ZEPHYR-WZ PASS/FAIL sentinel the CI greps.
CONFIG_PRINTK=y

# The Zephyr kernel heap that ZephyrAllocator (k_malloc/k_free) bridges Rust's
# #[global_allocator] onto. MUST be > 0 or k_malloc is not compiled in (the
# Rust references would dangle at link). Backs the executor task pool + the
# LwipUdpSocket Inner. Small heap = 4-byte base alignment, which
# ZephyrAllocator's HEAP_ALIGN already accounts for.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# The main thread runs the wz executor + the lwIP poll path + its futures, so
# give it headroom (the FreeRTOS sibling's wz task uses a 16 KB stack).
CONFIG_MAIN_STACK_SIZE=16384

# Pin the tick rate so ZephyrClock<TICK_HZ=100> matches the kernel timebase.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100
