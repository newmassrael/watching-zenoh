#
# What only the QEMU mps2/an385 board needs. A real board gets none of it.

# 100 Hz: the reference deploy's tick rate, 10 ms resolution. The Rust side reads
# whatever the board has (`wz_runtime_zephyr::tick_hz_from_build!`); this line
# only keeps the QEMU lane's timing where it has always been measured.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100

# Zephyr's net stack draws from `sys_rand_get` (ephemeral ports, IDs), and QEMU
# mps2/an385 has NO entropy hardware. ⚠ The test generator is a FIXTURE: its
# numbers are predictable, it exercises the call and does not satisfy the
# entropy contract. Zephyr allows it only for a board whose sole purpose is
# testing, and deploy/zephyr-common/wz_board_hooks.c admits it on a QEMU board
# alone: a real board selects its TRNG driver instead, or does not build.
CONFIG_TEST_RANDOM_GENERATOR=y
