#
# The capabilities of the C ABI builds, declared ONCE.
#
# A capability is a plane a build either has or does not: the doors it exports and the runtime
# behind them. This file is the single declaration. Three things derive from it, and
# `scripts/lib/capability_config.py` holds each to it:
#
#   * `deploy/Kconfig.capabilities`   the Kconfig a Zephyr or Linux deployer selects from
#                                     (generated; `--check` fails when it is stale);
#   * the Cargo features               `--features <abi> <.config>` turns a Kconfig result into
#                                     the `cargo build` arguments of an ABI crate;
#   * the three manifests              wz-capi-core, wz-capi-pico and wz-capi-c each spell the
#                                     same capability graph by hand in `[features]`; `--check`
#                                     fails when a manifest drifts from it.
#
# `implies` is a capability that must be on when this one is. `abis` is where the capability is
# exported (core is the model under both ABIs and always has it). `default` is whether a build
# that names nothing has it (every capability is on by default: the drop-in exports what the
# reference build does). `pico_flag` is zenoh-pico's own switch for it, where it has one, so a
# deployer who already writes a pico `config.h` can state the same intent. `pico_flags_all` is
# for a capability pico has no switch of its own for but has whenever several switches are all
# on (the liveliness get, which pico declares inside both the liveliness and the query switch).
#
# `base` is what an ABI build needs that is not a capability.

[base]
core = ["rx-busy-poll"]
pico = ["serial-drive-own-thread", "rx-busy-poll"]
c = []

[[capability]]
id = "link-udp"
kconfig = "WZ_CAP_LINK_UDP"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_LINK_UDP_UNICAST"
implies = []
help = "A udp/ endpoint to dial, and the transport the scouting group rides."

[[capability]]
id = "timestamping"
kconfig = "WZ_CAP_TIMESTAMPING"
abis = ["core", "c"]
implies = []
help = "The node clock a role that stamps its messages holds (zenoh's router does by default)."

[[capability]]
id = "scout"
kconfig = "WZ_CAP_SCOUT"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_SCOUTING"
implies = ["link-udp"]
help = "z_scout, the hello family, and a client finding its router by scouting."

[[capability]]
id = "peer"
kconfig = "WZ_CAP_PEER"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_UNICAST_PEER"
implies = ["scout"]
help = "A listener, a router or a peer: the roles beyond the client. Off, z_open refuses them."

[[capability]]
id = "query"
kconfig = "WZ_CAP_QUERY"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_QUERY"
implies = []
help = "z_get and the querier: the requesting end of a query."

[[capability]]
id = "queryable"
kconfig = "WZ_CAP_QUERYABLE"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_QUERYABLE"
implies = []
help = "z_declare_queryable and the replies: the answering end of a query."

[[capability]]
id = "liveliness"
kconfig = "WZ_CAP_LIVELINESS"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_LIVELINESS"
implies = []
help = "The liveliness token and subscriber."

[[capability]]
id = "liveliness-get"
kconfig = "WZ_CAP_LIVELINESS_GET"
abis = ["core", "pico", "c"]
pico_flags_all = ["Z_FEATURE_LIVELINESS", "Z_FEATURE_QUERY"]
implies = ["liveliness", "query"]
help = "The snapshot get of the liveliness plane; it is a query."

[[capability]]
id = "advanced"
kconfig = "WZ_CAP_ADVANCED"
abis = ["core", "pico", "c"]
pico_flag = "Z_FEATURE_ADVANCED_PUBLICATION"
implies = ["liveliness", "queryable", "timestamping", "unstable-api"]
help = "The advanced publisher and subscriber (cache, history, miss detection)."

[[capability]]
id = "group"
kconfig = "WZ_CAP_GROUP"
abis = ["core", "c"]
implies = []
help = "zenoh-ext group membership."

[[capability]]
id = "gossip"
kconfig = "WZ_CAP_GOSSIP"
abis = ["core", "pico", "c"]
implies = ["peer"]
help = "A session told of a node by one it holds a link to dials it."

# pico's unstable API (`Z_FEATURE_UNSTABLE_API`, a bare `#define`): the entity ids, the sample's
# reliability and source info, the cancellation token, and the option fields that carry them
# (`reliability`, `source_info`, `cancellation_token`). Off, those fields are not in the option
# structs a program allocates, so the structs are smaller; pico's CMake forces the connectivity
# plane, the advanced publisher and the admin space off with it, which `implies` states from
# their side.
[[capability]]
id = "unstable-api"
kconfig = "WZ_CAP_UNSTABLE_API"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_UNSTABLE_API"
implies = []
help = "pico's unstable API: entity ids, reliability, source info, the cancellation token, and their option fields."

# pico's connectivity plane (`Z_FEATURE_CONNECTIVITY`): the transport and link snapshots and
# event listeners. Upstream declares it only with the unstable API.
[[capability]]
id = "connectivity"
kconfig = "WZ_CAP_CONNECTIVITY"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_CONNECTIVITY"
implies = ["unstable-api"]
help = "pico's connectivity plane: transport and link snapshots, and their event listeners."

# pico's header arm for its tasks. On, the C ABI is the one pico's multi-threaded headers declare:
# the read and lease task doors, the host mutex, condvar and task, and the channel collections
# that block. Off, it is the single-threaded one: zp_read, zp_send_keep_alive, zp_send_join and
# zp_spin_once instead, a one-byte z_open_options_t, and channel collections that never block.
# The struct sizes differ between the arms, so a program compiled against one header arm must be
# linked to a build of the same arm. The model has no thread choice of its own (a wz session drives
# itself either way); the core feature exists because every capability is one of the core's.
[[capability]]
id = "multi-thread"
kconfig = "WZ_CAP_MULTI_THREAD"
abis = ["core", "pico"]
pico_flag = "Z_FEATURE_MULTI_THREAD"
implies = []
help = "pico's multi-threaded C ABI (task doors, host sync, blocking channels); off, the single-threaded one."

# The link kinds and the handshake methods zenoh-c turns on by default. They carry zenoh-c's own
# feature names, so a build of the zenoh-c drop-in is asked for with the switches a zenoh-c build
# is; the pico ABI forwards its links under names of its own and has none of these. The switches
# zenoh-c leaves off (serial, unixpipe, vsock, stats) are features of the two manifests and not
# capabilities here, because a capability is on in every default build.

[[capability]]
id = "transport_tls"
kconfig = "WZ_CAP_TRANSPORT_TLS"
abis = ["core", "c"]
implies = []
help = "The tls/ link, dial and accept, with the certificate material of transport/link/tls."

[[capability]]
id = "transport_quic"
kconfig = "WZ_CAP_TRANSPORT_QUIC"
abis = ["core", "c"]
implies = []
help = "The quic/ link, dial and accept, with the certificate material of transport/link/tls."

[[capability]]
id = "transport_quic_datagram"
kconfig = "WZ_CAP_TRANSPORT_QUIC_DATAGRAM"
abis = ["core", "c"]
implies = ["transport_quic"]
help = "The quic-datagram/ link, over the quic link's connection and certificate material."

[[capability]]
id = "transport_ws"
kconfig = "WZ_CAP_TRANSPORT_WS"
abis = ["core", "c"]
implies = []
help = "The ws/ link, dial and accept."

[[capability]]
id = "transport_unixsock-stream"
kconfig = "WZ_CAP_TRANSPORT_UNIXSOCK_STREAM"
abis = ["core", "c"]
implies = []
help = "The unixsock-stream/ link, dial and accept, on a Unix target."

[[capability]]
id = "transport_multilink"
kconfig = "WZ_CAP_TRANSPORT_MULTILINK"
abis = ["core", "c"]
implies = []
help = "The multilink establishment extension."

[[capability]]
id = "auth_pubkey"
kconfig = "WZ_CAP_AUTH_PUBKEY"
abis = ["core", "c"]
implies = []
help = "The public-key handshake, from the RSA identity of transport/auth/pubkey."
