#
# zenoh-pico's multi-threaded arm: the session runs its read task and its lease task as POSIX
# threads of their own, started when it opens, and `main` only declares and waits. Without this
# fragment the image is pico's single-threaded arm and `main` steps the session itself
# (src/main.c). The kernel configuration is the same in both arms (prj.conf), so what differs
# between them is pico's own choice.
CONFIG_ZENOH_PICO_MULTI_THREAD=y
