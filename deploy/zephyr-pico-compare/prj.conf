#
# zenoh-pico on the T2G kit over Zephyr's own stack. The network settings are Zephyr's defaults
# wherever the wz admin node's Zephyr-sockets image (deploy/zephyr-admin-node, overlays/
# t2g_zeth.conf) takes Zephyr's defaults too, so that the two stacks sit on the same buffers.

CONFIG_PRINTK=y

# zenoh-pico's tasks are POSIX threads, each on a stack the size of the main thread's.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_POSIX_API=y
# zenoh-pico makes recursive mutexes (pthread_mutexattr_settype) and a mutex or condition variable for
# every part of a session; Zephyr's pools of them hold five each by default, which a session overruns
# with ENOMEM before it is open.
CONFIG_POSIX_THREADS_EXT=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=48
CONFIG_MAX_PTHREAD_COND_COUNT=24
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_TIMERS=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=8
# zenoh-pico bounds every read with SO_RCVTIMEO (its UDP link sets it at open). Without this option
# Zephyr refuses it, the read has no bound, and a handshake whose first datagram is lost waits for
# ever.
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

# The segment the admin node answers on, pinned and not leased.
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.100.10"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# The MAC's DMA rings are in the non-cacheable section (the M7 has a data cache the controller does
# not see), and the image turns the core's caches on at boot as the admin node's does.
CONFIG_NOCACHE_MEMORY=y
CONFIG_WZ_ENABLE_CORE_CACHES=y
CONFIG_WZ_CYT4BF_PINS_T2G_LITE=y

# The driver polls the MAC without sleeping, as the admin node's Zephyr-sockets image is built to
# in the measurements this image is for.
CONFIG_WZ_ZETH_RX_POLL_INTERVAL_US=0

# The same ITCM placement of the polling path as the admin node's overlay has, so that the two are
# compared in one configuration (CONFIG_WZ_POLL_PATH_IN_ITCM).
CONFIG_WZ_POLL_PATH_IN_ITCM=y

# Built for speed, and with the C library's memcpy ahead of the Rust staticlib (the staticlib here
# is only the MAC), exactly as the admin node's overlay (deploy/zephyr-admin-node/overlays/
# t2g_zeth.conf) is, so that the two are compared in one configuration. Measured on the kit: a GET
# answered by this image takes 0.406 ms with speed alone and 0.380 with the memcpy as well; size
# optimization gives 0.37 to 0.41, within what the bench varies between sessions.
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_WZ_LIBC_MEMCPY_FIRST=y

# zenoh-pico with the planes the wz client it is compared with has, and no others
# (docs/upstream-parity.md step M2): that client answers queries over UDP unicast and neither
# publishes, subscribes nor asks, so pico's queryable half is on and its publication, subscription
# and query halves are off; TCP, multicast and scouting are off, as the wz image has no TCP and
# does not scout. Until 2026-10-26 this image also had publication, subscription and query on,
# which made its text larger than the comparison's, in wz's favour. The switches pico's Zephyr
# module does not list (liveliness, interest, matching, batching, ...) keep pico's own defaults
# (CMakeLists.txt). Whether pico runs its read and lease tasks is the image's choice of arm:
# overlays/multi_thread.conf turns them on, and without it the program steps the session
# (`zp_spin_once`); a compare run measures both, and the stronger arm is the reference.
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_QUERYABLE=y
CONFIG_ZENOH_PICO_LINK_UDP_UNICAST=y
