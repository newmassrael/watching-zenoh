#
# The board's own defconfig turns on CONFIG_CLOCK_CONTROL, which is what brings the
# clock tree up from the board's devicetree before main() runs; nothing here
# overrides it. The CM0+ target has 16 KiB of RAM, so this is the whole
# configuration: no heap, no shell.
#
# This image is SILENT on the console. The M7_0 image it starts owns the kit's
# console (SCB0, the board devicetree's uart0), and two cores must not share one
# UART: on the first run both did, the M7 started while this core was still
# printing its banner, and the banner came out cut and garbled. The board's
# defconfig turns on the console, printk and the serial driver; the serial driver is
# the one that would configure SCB0 and its pins at boot whether or not anything
# prints, so all of them go, and what this image has to say it says through
# `wz_launcher_status` (src/main.c), which a debugger reads.
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_BOOT_BANNER=n
