#
# Arm W: the pico C ABI of wz without std. The engine's mutex, condition variable, threads and sleep
# are the kernel's (wz_os_zephyr.c), and the platform exports' host layer is Zephyr's POSIX layer and
# the kernel heap (wz_pico_os_zephyr.c), as in the pico C ABI image (deploy/zephyr-capi-pico).
CONFIG_WZ_OS=y
CONFIG_WZ_OS_THREAD_STACK_SIZE=16384
CONFIG_WZ_PICO_OS=y

# The limits of this program's session (deploy/Kconfig.limits), each the number of rows or bytes of
# a table the session reserves when it opens and holds until it closes (docs/c-abi-no-heap-pools.md,
# section 5): one session, a client of one router, at most one subscriber and two publishers (the
# rtt cell's pong subscriber and its ping and stop publishers), keys of at most nine bytes, samples
# of at most 1,024 bytes, and no queryable, liveliness token or get. Left at the build's defaults,
# which size a host's session (sixteen of each entity, keys of 256 bytes, a lane of 64 KiB), the
# reservation alone is many times zenoh-pico's whole heap in these cells. These are the numbers of
# this one program: a node with more to do states more. A table the program does not use keeps one
# row, and a peer that writes past a table is refused and counted, as each limit's own
# documentation says.
#
# zenoh-pico's own constants where it has one: the batch its module builds with
# (`vendor/zenoh-pico/zephyr/Kconfig.zenoh` @ `config ZENOH_PICO_BATCH_UNICAST_SIZE`, 2048) and the
# largest message it rejoins (`vendor/zenoh-pico/zephyr/Kconfig.zenoh` @
# `config ZENOH_PICO_FRAG_MAX_SIZE`, 4096). Stated, so that a change of the build's defaults does not
# change what is compared.
CONFIG_WZ_LIMIT_PICO_UNICAST_BATCH_BYTES=2048
CONFIG_WZ_LIMIT_PICO_FRAG_MAX_BYTES=4096
# The keys the program names, and the router's declarations that match them, are short.
CONFIG_WZ_LIMIT_MAX_KEYEXPR_BYTES=64
# The program's own entities. Each publisher declares its key and the subscriber its key's prefix.
CONFIG_WZ_LIMIT_MAX_SUBSCRIPTIONS=1
CONFIG_WZ_LIMIT_MAX_PUBLISHERS=2
CONFIG_WZ_LIMIT_MAX_DECLARED_KEYEXPRS=4
CONFIG_WZ_LIMIT_MAX_QUERIERS=1
CONFIG_WZ_LIMIT_MAX_MATCHING_LISTENERS=1
CONFIG_WZ_LIMIT_MAX_QUERYABLES=1
CONFIG_WZ_LIMIT_MAX_LOCAL_TOKENS=1
CONFIG_WZ_LIMIT_MAX_LIVELINESS_SUBSCRIPTIONS=1
CONFIG_WZ_LIMIT_MAX_PENDING_QUERIES=1
CONFIG_WZ_LIMIT_MAX_PENDING_LIVELINESS_GETS=1
# What the router writes to this client and is owed by it: its subscriber on the key a publisher
# waits to match, the key ids it names it by, and the answers to its interests.
CONFIG_WZ_LIMIT_MAX_REMOTE_DECLS=4
CONFIG_WZ_LIMIT_MAX_PEER_KEYEXPR_ALIASES=4
CONFIG_WZ_LIMIT_MAX_INBOUND_SUB_INTERESTS=2
CONFIG_WZ_LIMIT_MAX_PENDING_DECLARES=4
# No queryable answers anything.
CONFIG_WZ_LIMIT_MAX_PENDING_REPLIES=1
CONFIG_WZ_LIMIT_MAX_PENDING_FINALS=1
CONFIG_WZ_LIMIT_MAX_REPLY_PAYLOAD_BYTES=64
# An admin reply is staged as a reply, so the build holds its bound under the one above.
CONFIG_WZ_LIMIT_MAX_ADMIN_REPLY_BYTES=64
# The delivery lane the samples wait in between the read and the callback. The build holds it to one
# record of the largest message at least: 4,096 bytes rejoined, a key of 64, a clock id of 16 and one
# subscriber's id of 4, 4,180 bytes (crates/wz-capi-coop/src/lane.rs, `holds_a_read`). A link is read
# only while the lane has that room, so the 428 bytes past it are the small samples one read hands on
# before its callbacks run: zenoh-pico hands each sample to its callback from its receive buffer and
# keeps no lane at all.
CONFIG_WZ_LIMIT_DELIVERY_LANE_BYTES=4608
