#
# Arm W: the pico C ABI of wz without std. The engine's mutex, condition variable, threads and sleep
# are the kernel's (wz_os_zephyr.c), and the platform exports' host layer is Zephyr's POSIX layer and
# the kernel heap (wz_pico_os_zephyr.c), as in the pico C ABI image (deploy/zephyr-capi-pico).
CONFIG_WZ_OS=y
CONFIG_WZ_OS_THREAD_STACK_SIZE=16384
# The single-threaded cells start no thread of the engine's, so they hold no stack for one; the
# multi-threaded arm states its read task (arm_w_mt.conf).
CONFIG_WZ_OS_THREADS=0
CONFIG_WZ_PICO_OS=y

# The image is a node of the pico preset: a limit zenoh-pico bounds by no constant of its own and
# this file leaves unstated takes the value zenoh-pico's own examples and API tests hold
# (deploy/Kconfig.limits, `[limit.pico_preset]` of deploy/wz-config.toml), not the one that sizes
# a host's session.
CONFIG_WZ_LIMITS_ZENOH_PICO=y

# The limits of this program's session (deploy/Kconfig.limits), each the number of rows or bytes of
# a table the session reserves when it opens and holds until it closes (docs/c-abi-no-heap-pools.md,
# section 5): one session, a client of one router, at most one subscriber and two publishers (the
# rtt cell's pong subscriber and its ping and stop publishers), keys of at most nine bytes, samples
# of at most 1,024 bytes, and no queryable, liveliness token or get. Left at the pico preset above,
# the entity tables hold what pico's API tests hold, while keys of 256 bytes and the tables of what
# the peer writes are still a host's (docs/c-abi-no-heap-pools.md, section 9). These are the numbers
# of this one program: a node with more to do states more. A table the program does not use keeps one
# row, and a peer that writes past a table is refused and counted, as each limit's own
# documentation says.
#
# zenoh-pico's own constants where it has one: the batch its module builds with
# (`vendor/zenoh-pico/zephyr/Kconfig.zenoh` @ `config ZENOH_PICO_BATCH_UNICAST_SIZE`, 2048) and the
# largest message it rejoins (`vendor/zenoh-pico/zephyr/Kconfig.zenoh` @
# `config ZENOH_PICO_FRAG_MAX_SIZE`, 4096). Stated, so that a change of the build's defaults does not
# change what is compared.
CONFIG_WZ_LIMIT_PICO_UNICAST_BATCH_BYTES=2048
CONFIG_WZ_LIMIT_PICO_FRAG_MAX_BYTES=4096
# The keys the program names, and the router's declarations that match them, are short.
CONFIG_WZ_LIMIT_MAX_KEYEXPR_BYTES=64
# The program's config holds two keys, its mode and the router's locator: "client" and a locator of
# at most MAX_LOCATOR_LEN (64), each with its terminator, 72 bytes of text.
CONFIG_WZ_LIMIT_CONFIG_ENTRIES=2
CONFIG_WZ_LIMIT_CONFIG_TEXT_BYTES=72
# The key arena every keyed row of the session keeps its key in. The 16 rows of its own
# declarations (one subscriber, two publishers and a querier with their filters and Interests, four
# declared keys, one each of the rest), the 4 of the application's tables and one pending get, with
# a key of the program's nine bytes, take a block of 20 each, 420 bytes; the rest holds 30 keys of
# that length the router declares (its subscriber on the key a publisher waits to match, the key ids
# it names it by, its interests). A key the router sends past that is dropped and counted.
CONFIG_WZ_LIMIT_KEY_ARENA_BYTES=1024
# The program's own entities. Each publisher declares its key and the subscriber its key's prefix.
CONFIG_WZ_LIMIT_MAX_SUBSCRIPTIONS=1
CONFIG_WZ_LIMIT_MAX_PUBLISHERS=2
CONFIG_WZ_LIMIT_MAX_DECLARED_KEYEXPRS=4
CONFIG_WZ_LIMIT_MAX_QUERIERS=1
CONFIG_WZ_LIMIT_MAX_MATCHING_LISTENERS=1
CONFIG_WZ_LIMIT_MAX_QUERYABLES=1
CONFIG_WZ_LIMIT_MAX_LOCAL_TOKENS=1
CONFIG_WZ_LIMIT_MAX_LIVELINESS_SUBSCRIPTIONS=1
CONFIG_WZ_LIMIT_MAX_PENDING_QUERIES=1
CONFIG_WZ_LIMIT_MAX_PENDING_LIVELINESS_GETS=1
# What the router writes to this client and is owed by it: its subscriber on the key a publisher
# waits to match, the key ids it names it by, and the answers to its interests.
CONFIG_WZ_LIMIT_MAX_REMOTE_DECLS=4
CONFIG_WZ_LIMIT_MAX_PEER_KEYEXPR_ALIASES=4
CONFIG_WZ_LIMIT_MAX_INBOUND_SUB_INTERESTS=2
CONFIG_WZ_LIMIT_MAX_PENDING_DECLARES=4
# No queryable answers anything.
CONFIG_WZ_LIMIT_MAX_PENDING_REPLIES=1
CONFIG_WZ_LIMIT_MAX_PENDING_FINALS=1
CONFIG_WZ_LIMIT_MAX_REPLY_PAYLOAD_BYTES=64
# An admin reply is staged as a reply, so the build holds its bound under the one above.
CONFIG_WZ_LIMIT_MAX_ADMIN_REPLY_BYTES=64
# The delivery lane the samples wait in between the read and the callback, held to one record of
# the largest message, the least the build accepts: 4,096 bytes rejoined, a key of 64, a clock id
# of 16 and one subscriber's id of 4, 4,180 bytes (crates/wz-capi-coop/src/lane.rs, `holds_a_read`).
# Each call that reads hands what it read to the callbacks before it returns, in either threading
# arm (`CoopEngine::read`: a step, then the delivery after the session's lock), and a link is read
# only while the lane has a record's room, so a pass takes one datagram, whose samples are one
# record of entries where they lie, as zenoh-pico's read takes one batch. zenoh-pico keeps no lane:
# it hands each sample to its callback from its receive buffer, with no lock to leave first.
CONFIG_WZ_LIMIT_DELIVERY_LANE_BYTES=4180
# The event slots of that lane (DELIVERY_LANE_EVENTS), one for each record that waits for its
# callbacks. The build sizes their storage, outside the arena on the heap: for each slot an entry
# of the lane's bookkeeping and of its rehearsal's copy, a place in the list handed on and the
# record of what a sample is besides its bytes, about 150 bytes, so the build's 64 are about 9,600
# bytes this program never fills. The samples of one datagram are one record however many it holds
# (crates/wz-capi-coop/src/tests/lane.rs,
# `a_lent_batch_takes_one_event_slot_however_many_samples_it_holds`), the link is read only while
# the lane has a free slot as well as a record's room, and the program's callbacks run before its
# next read, so a pass hands on a few records and a read that finds no slot waits in its link.
CONFIG_WZ_LIMIT_DELIVERY_LANE_EVENTS=8
