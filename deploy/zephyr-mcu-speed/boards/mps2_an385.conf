#
# What only the QEMU mps2/an385 board needs.
#
# QEMU's user-mode networking (`-nic user,model=lan9118`) hands the guest 10.0.2.15 and answers for
# the host at 10.0.2.2, where the lane's router listens. Pinned, not leased.
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"

# QEMU mps2/an385 has no entropy hardware. The test generator is a fixture: its numbers are
# predictable, which a speed measurement does not mind and a deployment would.
CONFIG_TEST_RANDOM_GENERATOR=y
