#
# The kernel, network and measurement settings both arms share (CMakeLists.txt chooses the library).
# Nothing here is a board's: the address and the random source are in boards/<board>.conf.

CONFIG_PRINTK=y
# The result lines carry 64-bit counts of cycles.
CONFIG_CBPRINTF_FULL_INTEGRAL=y

# The program reads its workload from the emulator's command line (SYS_GET_CMDLINE), so one image
# runs every cell of its arm.
CONFIG_SEMIHOST=y

# What the result lines are read from: the kernel's count of the cycles every thread but the idle
# thread ran, the high-water mark of every thread's stack, and the kernel heap's peak.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Both libraries allocate from the kernel heap (zenoh-pico's z_malloc and the wz staticlib's
# allocator are k_malloc), and the stacks are reservations the report reads the use of.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=262144

CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS_EXT=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=48
CONFIG_MAX_PTHREAD_COND_COUNT=24
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_TIMERS=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_DHCPV4=n
# A throughput cell of 1,024-byte samples holds more datagrams in flight than the stack's default
# pools; the same pools in both arms, so a pool that runs dry costs both alike.
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128

# Built for speed, and in arm W with the C library's memcpy family ahead of the staticlib's weak
# generic one, as the kit's comparison images are built (deploy/zephyr-capi-pico/prj.conf): without it
# the kernel and the network stack of arm W alone would run the staticlib's copies. Arm P links no
# staticlib, so its image has the C library's either way.
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_WZ_LIBC_MEMCPY_FIRST=y
