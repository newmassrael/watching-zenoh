#
# Arm W, multi-threaded (WZ_MCU_SPEED_THREADS=mt), after arm_w.conf: the session's read task.
#
# The engine starts the read task through wz_os_thread_spawn (deploy/zephyr-common/wz_os_zephyr.c),
# whose thread record and stack of CONFIG_WZ_OS_THREAD_STACK_SIZE bytes are a static array of
# CONFIG_WZ_OS_THREADS, none of it kernel heap, as zenoh-pico's mt arm places its tasks' stacks
# (`vendor/zenoh-pico/src/system/zephyr/system.c` @
# `K_THREAD_STACK_ARRAY_DEFINE(thread_stack_area, Z_THREADS_NUM, Z_PTHREAD_STACK_SIZE_DEFAULT);`).
# The one thread this library starts.
CONFIG_WZ_OS_THREADS=1
