#
# Arm W, multi-threaded (WZ_MCU_SPEED_THREADS=mt), after arm_w.conf: the stack of the session's read
# task in a static pool of the kernel's dynamic threads rather than the kernel heap.
#
# The engine starts the read task through wz_os_thread_spawn (deploy/zephyr-common/wz_os_zephyr.c),
# which asks k_thread_stack_alloc for CONFIG_WZ_OS_THREAD_STACK_SIZE bytes. With no pool the kernel
# takes them from the heap the program also reports, so the mt cells read the read task's whole
# stack as heap: the 16,384 bytes the st cells do not have. zenoh-pico's mt arm places its tasks'
# stacks in a static array (`vendor/zenoh-pico/src/system/zephyr/system.c` @
# `K_THREAD_STACK_ARRAY_DEFINE(thread_stack_area, Z_THREADS_NUM, Z_PTHREAD_STACK_SIZE_DEFAULT);`),
# none of it heap; a pool of one stack is the same placement for the one thread this library
# starts. A second thread would still be served from the heap (CONFIG_DYNAMIC_THREAD_ALLOC, which
# CONFIG_WZ_OS selects), so the pool bounds nothing the program could run into.
CONFIG_DYNAMIC_THREAD_POOL_SIZE=1
# At least the stack the engine asks for: a smaller pool stack is passed over for the heap.
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
