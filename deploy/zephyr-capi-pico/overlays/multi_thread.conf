#
# zenoh-pico's multi-threaded arm over wz: the header and the library are built for it, and the
# open starts the session's read task. Without this fragment the image is pico's single-threaded
# arm and `main` steps the session itself. As in the comparison image's fragment of the same name,
# the kernel configuration is the same in both arms (prj.conf).
CONFIG_WZ_PICO_ABI_MULTI_THREAD=y
