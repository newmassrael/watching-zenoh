#
# zenoh-pico's multi-threaded arm over wz: the header and the library are built for it, and the
# open starts the session's read task. Without this fragment the image is pico's single-threaded
# arm and `main` steps the session itself. As in the comparison image's fragment of the same name,
# the kernel configuration is the same in both arms (prj.conf) but for the thread the arm starts.
CONFIG_WZ_PICO_ABI_MULTI_THREAD=y
# The read task, the one thread of the engine's this library starts: its record and its stack of
# CONFIG_WZ_OS_THREAD_STACK_SIZE bytes are a static array of CONFIG_WZ_OS_THREADS
# (deploy/zephyr-common/wz_os_zephyr.c), which the single-threaded arm states as none.
CONFIG_WZ_OS_THREADS=1
