#
# The pico C ABI on the T2G kit over Zephyr's own stack. Every network, board and build setting is
# the comparison image's (deploy/zephyr-pico-compare/prj.conf), so that what differs between the two
# is the library under the same program; the settings that are this image's own say why.

CONFIG_PRINTK=y

# The stacks and the heap are starting figures, larger than the comparison image's, and are set from
# what the first compare runs read of them (CONFIG_WZ_MEMORY_REPORT, which a compare build turns on):
# the main thread opens the session and, in the single-threaded arm, steps it; the engine's read
# task steps it in the multi-threaded one. The heap holds the session and the one link's receive
# buffer, which the C ABI sizes to the batch it advertises (pico's BATCH_UNICAST_SIZE, 2,048 bytes).
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=196608

# The pico C ABI without std: the engine's mutex, condition variable, threads and sleep are the
# kernel's (wz_os_zephyr.c), and the platform exports' host layer is Zephyr's POSIX layer and the
# kernel heap, as zenoh-pico's own Zephyr backend (wz_pico_os_zephyr.c).
CONFIG_WZ_OS=y
CONFIG_WZ_OS_THREAD_STACK_SIZE=16384
CONFIG_WZ_PICO_OS=y

CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS_EXT=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=48
CONFIG_MAX_PTHREAD_COND_COUNT=24
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_TIMERS=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=8
# The engine's datagram link bounds a read with SO_RCVTIMEO (wz_net_set_rcvtimeo_ms), as pico's UDP
# link does.
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.100.10"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

CONFIG_NOCACHE_MEMORY=y
CONFIG_WZ_ENABLE_CORE_CACHES=y
CONFIG_WZ_CYT4BF_PINS_T2G_LITE=y

CONFIG_WZ_ZETH_RX_POLL_INTERVAL_US=0

CONFIG_WZ_POLL_PATH_IN_ITCM=y

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_WZ_LIBC_MEMCPY_FIRST=y
