#
# mcu-admin-node — R2838 (§5.23), the QEMU `mps2-an385` firmware a stock
# zenoh host reconfigures at runtime.
#
# Boots a wz MCU node on real Ethernet frames: the LAN9118 the mps2 machines
# carry (`wz_eth_mac_lan9118`) under an lwIP Ethernet netif
# (`wz_link_lwip::ethernet`), at QEMU user networking's guest address
# 10.0.2.15. It runs `wz_session_lwip::admin_node::AdminNode`: it listens on
# udp/10.0.2.15:7447, answers upstream's admin GET under its own zid, and
# applies `connect/endpoints` writes by dialling what they name.
#
# The firmware has no verdict of its own: what it is FOR is decided by the
# host that talks to it (the lane), so it runs until QEMU is stopped and
# reports only what it sees over semihosting.
#
# This is a STANDALONE crate workspace (the `[workspace]` table below), like
# the other deploys, so it is not pulled into `crates/`'s build.

[workspace]

[package]
name = "mcu-admin-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later OR LicenseRef-watching-zenoh-Commercial"
authors = ["newmassrael"]
description = "R2838 QEMU mps2 firmware: a wz MCU node on LAN9118 Ethernet that a zenoh host reconfigures through its admin space."

[[bin]]
name = "mcu-admin-node"
path = "src/main.rs"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }
embedded-alloc = { version = "0.6", optional = true }
wz-mcu-clock = { path = "../../crates/wz-mcu-clock" }
# The chip's driver, a crate of its own since the `EthernetMac` seam moved to the
# dependency-free trait tier: it depends on that tier and on nothing else, so
# naming it here adds the one chip this firmware drives and no other.
wz-eth-mac-lan9118 = { path = "../../crates/wz-eth-mac-lan9118" }
# The composable-framework route every deploy takes: the facade's features
# unify onto the one wz-session-core the session shell is built against.
# keepalive and close keep the zenoh host's lease and teardown honest.
wz = { path = "../../crates/wz", default-features = false, features = [
    # Its link is the lwIP UDP driver, which lends the datagram payload.
    "transport-tx-lend",
    "adminspace-write",
    "codec-frame",
    "codec-keep-alive",
    "codec-close",
    "transport-keepalive",
] }
# The types the facade does not re-export (SessionInitParams, SigningKey,
# SessionTimeouts, the entropy trait); features arrive through the facade.
wz-session-core = { path = "../../crates/wz-session-core", default-features = false, features = [
    "session-unicast",
    "no_std",
] }
# S9c -- named only to turn the selectors on through the `fixed-memory` feature below:
# the facade deliberately forwards neither `session-slot` nor `static-link-storage`
# (a forward would let workspace feature unification take the heap constructors away
# from the AP host tests), and both are the final binary's to choose. They are the SAME
# instances the facade pulls, so no second copy of either crate is built.
wz-session-lwip = { path = "../../crates/wz-session-lwip", optional = true, default-features = false }
wz-link-lwip = { path = "../../crates/wz-link-lwip", optional = true, default-features = false }
wz-runtime-coop = { path = "../../crates/wz-runtime-coop", optional = true, default-features = false }

[features]
default = ["heap"]
# The image with an allocator: the growable node on `embedded-alloc`'s heap, the shape
# this image has always had.
heap = ["dep:embedded-alloc", "wz/session-lwip", "wz/adminspace-core", "wz-session-core/alloc"]
# S9c -- the FIXED-MEMORY PROFILE of this image: the node of `src/fixed.rs`, over the
# slot profile's pieces (session slots, a pump table, a static runtime, a socket pool,
# a listener, the fixed status and admin rows, the Ethernet pool), with no allocator
# and no `extern crate alloc` in the bin. Built with `--no-default-features --features
# fixed-memory`. The heap forms (`wz/session-lwip`, `wz-session-core/alloc`) are the
# `heap` feature's, so a build of the profile names no heap feature of any crate; with
# `heap` as well it is the census-only build, which has an allocator and so links.
fixed-memory = [
    "wz/session-lwip-fixed",
    "wz/adminspace-fixed",
    "dep:wz-session-lwip",
    "dep:wz-link-lwip",
    "dep:wz-runtime-coop",
    "wz-session-lwip/session-slot",
    "wz-session-lwip/static-link-storage",
    "wz-session-lwip/session-unicast-accept",
    "wz-runtime-coop/session-slot",
    "wz-session-core/session-slot",
]
# The measurement of one typed session slot (`scripts/lib/session_slot_bytes.py`): with
# it the fixed-memory image declares `WZ_SESSION_SLOT_BYTES`, a symbol whose SIZE is the
# slot's size. Off by default, because the array is that size again in RAM.
slot-bytes-probe = []

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
