#
# What only the QEMU mps2/an385 board needs. A real board gets none of it.

# 100 Hz, the tick rate the Zephyr lanes have always been measured at.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100

# Zephyr's net stack and Mbed TLS draw from `sys_rand_get`, and QEMU mps2/an385 has NO entropy
# hardware. The test generator is a FIXTURE: its numbers are predictable, it exercises the call
# and does not satisfy the entropy contract. Zephyr allows it only for a board whose sole purpose
# is testing, and deploy/zephyr-common/wz_board_hooks.c admits it on a QEMU board alone.
CONFIG_TEST_RANDOM_GENERATOR=y
