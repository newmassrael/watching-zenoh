#
# zephyr-tls-loopback Kconfig: the secure-listener witness, on Zephyr's own TCP over the loopback
# interface. What only the QEMU board needs is in boards/<board>.conf.

CONFIG_PRINTK=y

# The kernel heap the Rust side's allocator (k_malloc/k_free) bridges onto: the witness boxes its
# listener and builds its log lines. Mbed TLS has an arena of its own, below.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# One thread plays both ends of the handshake. The fit image (deploy/zephyr-tls-fit) measured the
# deepest handshake frames of one role at 2.3 KB over a thread's own; two roles take their turns
# on the same stack, never nested, so the fit image's stack is the generous bound.
CONFIG_MAIN_STACK_SIZE=24576
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Zephyr's own stack over the loopback interface, reached through the POSIX socket layer (the
# route zenoh-pico's Zephyr port takes). TCP is the stream under the channel.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_SLIP_TAP=n
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_NETWORKING=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_DEVICE_IO=y

# A TLS server's first flight is five records (the hello, the change-cipher-spec and the
# handshake messages), and Zephyr's TCP holds every segment it sent as a packet until the peer
# acknowledges it. At the default of 4 TX packets the fifth `send` failed (-1, measured on this
# image: the server was dropped before its Finished and its peer read the end of the stream), so
# the pools below hold a flight and the peer's reply with room to spare.
# Each connection of a run is a context, and a closed one lingers in TIME_WAIT: the listener, a
# dropped plain connection and the real pair (both ends) are five at once.
CONFIG_NET_MAX_CONTEXTS=16
# The TCP half of a context is a connection of its own, from a pool of CONFIG_NET_MAX_CONN (4 on an
# IPv4-only build), and a closed one keeps its slot in TIME_WAIT: the listener of a restart check
# found its `listen` refused (-1, `net_tcp_listen` with no connection object) after the three
# connections the steps before it leave behind.
CONFIG_NET_MAX_CONN=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Mbed TLS on its PSA Crypto line, as the fit image and the admin node state it: TLS 1.3 only, the
# ephemeral key exchange, ECDSA over P-256, AES-128-GCM with SHA-256, the certificate each end
# writes over its own key and the peer's it reads.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=n
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_ENABLED=n
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_EPHEMERAL_ENABLED=n
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=n
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="wz_tls_zephyr_user_config.h"
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y

# The record buffers decided in Round 3495: receive the protocol's maximum, send 1,500 bytes.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=1500

# Every allocation Mbed TLS makes comes from one static arena. Both ends live at once in this
# image (two sessions at about 22 KB each, Round 3495, and two identities), so the arena is the fit
# image's 96 KB, which holds one session of each role with room to spare.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_MEMORY_DEBUG=y
